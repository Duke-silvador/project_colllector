name: Non-Stop Auto Collector

on:
  schedule:
    # Inajiendesha yenyewe kila baada ya masaa 3 non-stop
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  run-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python Collector
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector.py

      - name: Commit and push changes to repo
        run: |
          git config --global user.name "Project Collector Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add collected_projects/
          git commit -m "Auto-update: Vuta miradi mipya ya GitHub na Hugging Face [skip ci]" || echo "Hakuna mabadiliko mapya ya kusukuma"
          git push
