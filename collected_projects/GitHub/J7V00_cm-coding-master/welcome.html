<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="theme-color" content="#05070D">
  <script>
  (() => {
    try {
      document.documentElement.dataset.theme = localStorage.getItem("CMTheme") || "dark";
      const lang = localStorage.getItem("CMLang") || "ar";
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    } catch (_) {}
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Master — Welcome</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="welcome">
    <header class="navbar">
      <a href="index.html" class="brand">
        <img src="/assets/logo.png" alt="Code Master">
        <span>Code Master</span>
      </a>
      <div class="nav-right">
        <button id="aiBtn" class="help-btn" type="button" data-open-ai title="AI Assistant ⌥⇧A">AI</button>
        <button id="helpBtn" class="help-btn" type="button" aria-label="Open Editor">?</button>
      </div>
    </header>

    <section class="welcome-area">
      <div class="welcome-content">
        <div class="welcome-label" data-ar="مرحبًا" data-en="WELCOME">مرحبًا</div>
        <h1 data-ar="مرحبًا بك في<br><strong>Code Master.</strong>" data-en="Welcome to<br><strong>Code Master.</strong>" data-i18n-html="1">مرحبًا بك في<br><strong>Code Master.</strong></h1>
        <p data-ar="أنشئ ملفًا، افتح مشروعًا، واكتب كودك." data-en="Start a file, open a project, and write your code.">أنشئ ملفًا، افتح مشروعًا، واكتب كودك.</p>

        <div class="action-box">
          <div class="action-box-top">
            <span data-ar="ابدأ" data-en="GET STARTED">ابدأ</span>
            <b>01</b>
          </div>
          <div class="actions">
            <button id="newFileBtn" class="action-card" type="button">
              <span class="action-icon">＋</span>
              <span class="action-copy">
                <strong data-ar="ملف جديد" data-en="New File">ملف جديد</strong>
                <small data-ar="إنشاء ملف كود جديد" data-en="Create a new code file">إنشاء ملف كود جديد</small>
              </span>
              <kbd>⌘N</kbd>
            </button>
            <button id="openFileBtn" class="action-card" type="button">
              <span class="action-icon">↗</span>
              <span class="action-copy">
                <strong data-ar="فتح ملف" data-en="Open File">فتح ملف</strong>
                <small data-ar="اختر ملفًا من جهازك" data-en="Choose a file from your Mac">اختر ملفًا من جهازك</small>
              </span>
              <kbd>⌘O</kbd>
            </button>
            <button id="openFolderBtn" class="action-card" type="button">
              <span class="action-icon">□</span>
              <span class="action-copy">
                <strong data-ar="فتح مجلد" data-en="Open Folder">فتح مجلد</strong>
                <small data-ar="افتح مشروعًا كاملًا" data-en="Open a complete project folder">افتح مشروعًا كاملًا</small>
              </span>
              <kbd>⌘⇧O</kbd>
            </button>
          </div>
        </div>

        <section class="recent-box" id="recentBox" hidden>
          <div class="action-box-top">
            <span data-ar="المشاريع الأخيرة" data-en="RECENT">المشاريع الأخيرة</span>
          </div>
          <div id="recentList" class="recent-list"></div>
        </section>
      </div>

      <div class="welcome-side">
        <div class="side-line"></div>
        <div class="side-code"><span class="line">01</span><span class="code-text">&lt;start&gt;</span></div>
        <div class="side-code"><span class="line">02</span><span class="code-text">your idea</span></div>
        <div class="side-code"><span class="line">03</span><span class="code-text">&lt;/start&gt;</span></div>
        <div class="side-note"><span>01</span><p data-ar="افتح مجلدًا مرة واحدة.<br>ثم اكتب داخله." data-en="Open a folder once.<br>Code inside it.">افتح مجلدًا مرة واحدة.<br>ثم اكتب داخله.</p></div>
      </div>
    </section>

    <input id="filePicker" type="file" multiple hidden accept=".html,.htm,.css,.js,.json,.md,.txt,.xml,.svg,.ts,.tsx,.jsx">
    <input id="folderPicker" type="file" webkitdirectory directory multiple hidden>

    <footer>
      <span>Learn • Write • Experiment • Build</span>
      <div class="footer-actions">
        <button type="button" class="ai-foot-btn" data-open-ai>⌥⇧A AI</button>
        <a href="index.html">Code Master Website</a>
      </div>
    </footer>
  </main>

  <script type="module" src="/src/app/welcome-main.ts"></script>
</body>
</html>
