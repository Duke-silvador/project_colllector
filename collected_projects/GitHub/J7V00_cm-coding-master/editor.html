<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Coding Master</title>
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="workbench">
    <header class="titlebar">
      <div class="brand"><img src="/assets/logo.png" alt=""><span>Coding Master</span></div>
      <button class="command" id="commandBtn" type="button">⌘K <span>Search files and commands...</span></button>
      <div class="top-actions">
        <button id="aiBtn" type="button" title="AI Assistant ⌥⇧A" data-open-ai>AI</button>
        <button id="themeBtn" type="button" title="Theme" data-theme-toggle="1"><span data-theme-icon>☀</span></button>
        <button id="welcomeBtn" type="button" title="Welcome">?</button>
        <button id="previewToggle" type="button" title="Preview">◫</button>
      </div>
    </header>

    <div class="work-area">
      <aside class="activity-bar">
        <button class="activity active" data-view="explorer" type="button" title="Explorer">▤</button>
        <button class="activity" data-view="search" type="button" title="Search">⌕</button>
        <button class="activity" data-view="source" type="button" title="Source Control">⑂</button>
        <button class="activity" data-view="run" type="button" title="Run">▷</button>
        <button class="activity" data-view="extensions" type="button" title="Extensions">▣</button>
        <button class="activity" data-view="github" type="button" title="GitHub">GH</button>
        <div class="activity-spacer"></div>
        <button class="activity" id="settingsBtn" data-view="settings" type="button" title="Settings">⚙</button>
      </aside>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span id="sideTitle">EXPLORER</span>
          <div class="sidebar-actions">
            <button id="newFileBtn" type="button" title="New File">＋</button>
            <button id="newFolderBtn" type="button" title="New Folder">▣</button>
            <button id="openFileBtn" type="button" title="Open File">↗</button>
            <button id="openFolderBtn" type="button" title="Open Folder">□</button>
          </div>
        </div>

        <input id="filePicker" type="file" multiple hidden accept=".html,.htm,.css,.js,.json,.md,.txt,.xml,.svg,.ts,.tsx,.jsx">
        <input id="folderPicker" type="file" webkitdirectory directory multiple hidden>

        <div id="sideContent"></div>

        <div class="sidebar-note">
          <b>Project</b>
          <span>Drop files or folders here to add them to the workspace.</span>
        </div>
      </aside>

      <main class="main-editor">
        <div class="tabs" id="tabs"></div>

        <div class="center">
          <section class="code-area">
            <div class="editor-toolbar">
              <span id="breadcrumb"></span>
              <div class="toolbar-actions">
                <button id="saveBtn" type="button">Save</button>
                <button id="runBtn" class="run" type="button">▶ Run</button>
                <button id="chromeBtn" type="button">↗ Preview</button>
                <button id="githubPushBtn" class="github-push-btn" type="button">Push to GitHub</button>
              </div>
            </div>

            <div class="editor-grid">
              <div id="editorHost" class="editor-host" aria-label="Code editor"></div>
            </div>
          </section>

          <section class="preview" id="previewPane">
            <div class="preview-head">
              <div><b>Preview</b><small>LIVE</small></div>
              <button id="refreshBtn" type="button" title="Refresh Preview">↻</button>
            </div>
            <iframe id="preview" title="Coding Master Preview"></iframe>
          </section>
        </div>

        <section class="panel">
          <div class="panel-head">
            <div class="panel-tabs">
              <button class="panel-tab active" data-panel="terminal" type="button">TERMINAL</button>
              <button class="panel-tab" data-panel="problems" type="button">PROBLEMS <span id="problemCount">0</span></button>
              <button class="panel-tab" data-panel="output" type="button">OUTPUT</button>
            </div>
          </div>
          <div class="panel-body" id="panelBody">
            <div>$ <span>coding-master</span></div>
            <p>Ready.</p>
          </div>
        </section>
      </main>
    </div>

    <footer class="statusbar">
      <span id="projectName">coding-master</span>
      <span id="status">Ln 1, Col 1 • HTML • UTF-8</span>
    </footer>
  </div>

  <script type="module" src="/src/app/editor-main.ts"></script>
</body>
</html>
