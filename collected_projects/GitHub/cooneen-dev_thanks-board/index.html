<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Values in Action</title>



<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

<style>
  /* ------------------------------------------------------------------ theme */

  :root {
    --orange:      #e87722;
    --orange-deep: #cc6413;
    --orange-soft: #fdf0e3;

    --ink:       #231f1d;
    --ink-2:     #4b453f;
    --ink-soft:  #7c756d;
    --ink-faint: #aaa39b;

    --page:      #e9e2d8;
    --bar:       #231f1d;
    --bar-ink:   #ffffff;
    --panel:     #fdfbf7;
    --card:      #ffffff;
    --line:      #e7e0d6;
    --line-soft: #f2ece3;
    --track:     #ece5db;

    --shadow:    0 1px 3px rgba(35,31,29,.07);
    --shadow-lg: 0 10px 28px rgba(35,31,29,.10);
    --radius:    0.85rem;

    /* The month's value sets both of these. --accent is the value's own colour,
       the one it wears on the rail; --band is the same colour taken down far
       enough to hold white text on a panel. Orange until an issue says
       otherwise, which is the case on a month with no value named. */
    --accent: #e87722;
    --band:   #b85a10;

    /* Plain rgba versions of the tints, replaced from applyAccent whenever the
       colours above change. No color-mix(): the Yodeck player cannot read it. */
    --accent-tint:  rgba(232,119,34,.09);
    --accent-track: rgba(232,119,34,.22);
    --accent-ink:   #cb6617;

    /* One family on the whole board. What separates a quote from a caption
       here is weight and size, not a second typeface. */
    --quote: 'Nunito', system-ui, sans-serif;
  }

  html[data-theme="dark"] {
    --orange:      #ff9142;
    --orange-deep: #e87722;
    --orange-soft: #2a1e13;

    --ink:       #f4f0ea;
    --ink-2:     #cdc6bd;
    --ink-soft:  #9c948b;
    --ink-faint: #6d665f;

    --page:      #100e0c;
    --bar:       #000000;
    --bar-ink:   #f4f0ea;
    --panel:     #1c1916;
    --card:      #221e1a;
    --line:      #332c25;
    --line-soft: #2a241e;
    --track:     #2c261f;

    --shadow:    0 1px 3px rgba(0,0,0,.45);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.55);
  }

  /* One knob scales the whole board. A 1366 laptop lands near 18px, a 1080p
     screen near 23px, a 4K panel hits the ceiling. */
  html { font-size: clamp(15px, 1.05vw + 5px, 32px); }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--page);
    color: var(--ink);
    font-family: 'Nunito', system-ui, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
    cursor: none;              /* nothing here is clickable on a wall screen */
  }

  h1, h2, h3, p { margin: 0; }

  .screen {
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    padding: 0.7rem 0.8rem 0.55rem;
  }

  /* ------------------------------------------------------------------- bar */

  .top {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem 1.1rem;
    border-radius: var(--radius);
    background: var(--bar);
    color: var(--bar-ink);
  }

  .brand { flex: 0 0 auto; display: flex; align-items: center; gap: 0.6rem; }

  .brand svg { height: 1.15rem; width: auto; display: block; color: var(--orange); }
  .brand .wm { line-height: 1; }
  .brand .wm b {
    display: block;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.02em;
  }
  .brand .wm span {
    display: block;
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 0.42em;
    color: var(--orange);
  }

  .topright { min-width: 0; text-align: right; line-height: 1.15; }
  .topright .ttl {
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .topright .tsub {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ----------------------------------------------------------- recognition */

  .recog {
    flex: 1 1 57%;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    padding: 0.85rem 1rem 1rem;
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .sechead {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
  }
  .sechead h2 {
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sechead h2 em { font-style: normal; color: var(--orange); }
  .sechead .lead {
    flex: 1;
    min-width: 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sechead .now {
    flex: 0 0 auto;
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-left: 0.7rem;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .live i { width: 0.42rem; height: 0.42rem; border-radius: 50%; background: currentColor; }
  .live.stale { color: #b8730b; background: rgba(242,169,0,.14); }
  .live.down  { color: #c2255c; background: rgba(194,37,92,.12); }
  .live[hidden] { display: none; }

  .recogbody {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    gap: 0.7rem;
  }

  /* minmax(0, 1fr) rather than 1fr: a plain fr will not shrink a track below
     the width of what is in it, which is how one card ended up sitting over
     the other instead of being made narrower. */
  .cards {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 0.7rem;
  }

  .slot { min-width: 0; min-height: 0; overflow: hidden; display: flex; }
  .slot--empty { visibility: hidden; }

  /* ----------------------------------------------------------------- cards */

  .card {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 3px solid var(--c);
    border-radius: 0.7rem;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .chead {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 0.9rem;
    background: var(--ct, rgba(0,0,0,.04));
    border-bottom: 1px solid var(--line-soft);
  }
  .cav {
    flex: 0 0 auto;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--c);
  }
  .cav svg { width: 1.4rem; height: 1.4rem; fill: #fff; }
  /* The artwork is already a filled disc in the value's colour, so it needs no
     circle behind it and no tint over it. */
  .cav--img { background: none; border-radius: 0; object-fit: contain; }
  .cnames { min-width: 0; }
  .cbadge {
    font-size: 0.72rem;
    font-weight: 900;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--c);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .crecip {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cmsg {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    padding: 0.9rem 1rem;
    font-size: 1.3rem;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink-2);
    overflow: hidden;
  }
  .cmsg span { display: block; }

  .cfoot {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem;
    padding: 0.55rem 0.9rem 0.7rem;
    border-top: 1px solid var(--line-soft);
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .cfoot > span:first-child {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cfoot b { color: var(--ink); font-weight: 800; }
  .cfoot .cdate { flex: 0 0 auto; font-weight: 700; color: var(--ink-faint); }

  /* Two cards changing in step would read as the page reloading, so each gets
     its own timer and its own way in. */
  @keyframes riseIn { from { opacity: 0; transform: translateY(0.7rem); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(0.9rem); } to { opacity: 1; transform: none; } }

  #slot0 .card.in { animation: riseIn 0.55s cubic-bezier(.22,.8,.3,1) both; }
  #slot1 .card.in { animation: slideIn 0.55s cubic-bezier(.22,.8,.3,1) both; }

  /* ------------------------------------------------------------ stats rail */

  /* Everything inside the rail is sized in em against this one font-size, so a
     rail that will not fit can be taken down as a whole rather than losing
     three of the six values off the bottom. The width stays in rem: a narrower
     column would only make the names wrap. */
  /* Carried as a panel rather than as a column with a line beside it. A rule
     on its own reads as a page break, which is what left it looking like it
     had come off the board; the same border and radius as the thanks cards
     makes it the third panel in a row of three. */
  .stats {
    flex: 0 0 15.5rem;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-size: 1rem;
    gap: 0.46em;
    padding: 0.85rem 0.95rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .stats > * { flex: 0 0 auto; }
  .stats [hidden] { display: none; }

  .skicker {
    display: flex;
    align-items: baseline;
    gap: 0.5em;
    font-size: 0.65em;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  /* Only drawn when the top of the rail is shared, and then it is the reason
     the name underneath keeps changing. */
  .skicker .tie {
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--accent);
  }

  .sbig { display: flex; align-items: baseline; gap: 0.4em; }
  .sbig b {
    font-size: 2.5em;
    font-weight: 900;
    line-height: 0.9;
    color: var(--orange);
    font-variant-numeric: tabular-nums;
  }
  .sbig span { font-size: 0.95em; font-weight: 800; }
  .ssub {
    font-size: 0.76em;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 0 0 auto, not 0 1 auto. Allowed to shrink, the block quietly clipped its
     own last rows and reported that the rail fitted, which is how six values
     went up as three and a half. It takes the height its rows need; whether
     that height is available is the rail's problem to solve, above. */
  .sbars {
    flex: 0 0 auto;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.22em;
  }
  /* Icon, name, bar and count on one line. Two lines per value pushed the last
     of the six, and the names under them, off the bottom of the rail. */
  /* The row sets its own size, so everything measured across it is in em
     against that and not against the rail, or a name column meant to hold
     "Positivity" comes out a third narrower than it was. */
  .sbar {
    display: grid;
    grid-template-columns: 1.32em 6.4em minmax(2.08em, 1fr) 1.53em;
    align-items: center;
    gap: 0.49em;
    font-size: 0.72em;
    font-weight: 700;
  }
  .sbar svg { width: 1.32em; height: 1.32em; fill: var(--c); }
  .sbar .sbi { width: 1.32em; height: 1.32em; object-fit: contain; display: block; }
  /* An unused value keeps its badge but stops competing for attention. */
  .sbar--zero .sbi { filter: grayscale(1); opacity: 0.75; }
  .sbar .sn {
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sbar .sc {
    text-align: right;
    font-weight: 900;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .sbar--zero { opacity: 0.4; }
  .strk {
    height: 0.39em;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .strk i { display: block; height: 100%; border-radius: 999px; background: var(--c); }

  .spair { flex: 0 0 auto; display: flex; flex-direction: column; gap: 0.42em; }
  .sname {
    font-size: 1em;
    font-weight: 700;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sname small { font-weight: 700; color: var(--ink-faint); }
  .sname.flick { animation: nameIn 0.45s cubic-bezier(.22,.8,.3,1) both; }
  @keyframes nameIn { from { opacity: 0; transform: translateY(0.25em); } to { opacity: 1; transform: none; } }

  /* ------------------------------------------------------------ value band */

  /* Carried as a panel, the same as the recognition section above it. The
     month's colour is kept to the things that name the value - the badge,
     the label, the count, and a tint behind the passages at the strength the
     thanks cards use for their heading strip - rather than poured over half
     the band, which made the bottom of the board heavier than the top. */
  .band {
    flex: 1 1 43%;
    min-height: 0;
    display: flex;
    background: var(--panel);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);

    /* Type in the month's colour on a light panel. The badge colour is too
       pale to be read as text in a Positivity or Trust month, and the band
       colour is darker than the badge people know; three parts band to two
       parts badge clears 3:1 for all six, on the panel and on the tint. On a
       dark panel the badge colour is the readable one as it is. The mix is
       worked out in applyAccent, not with color-mix(): the Yodeck player's
       Chromium is too old for it and drops the whole declaration. */
  }
  html[data-theme="dark"] .band { --accent-ink: var(--accent); }
  .band[hidden] { display: none; }

  /* With nothing to cycle there is no second half, and a value stretched
     across the whole width at the size it takes in half of one reads as a
     mistake. Centre it, give it a measure, and take back the height the
     cards can use. */
  .band--solo { flex: 0 1 32%; }
  .band--solo .vmain {
    align-items: center;
    text-align: center;
    padding: 1.4rem 2rem;
  }
  .band--solo .vmain-text { max-width: 34ch; }
  .band--solo .vmain-inner { justify-content: center; }
  .band--solo .vcount { align-self: stretch; }
  .band--solo .vcount .sbig { justify-content: center; }

  /* A value that is only a name leaves most of its half empty, so where there
     are passages beside it they are given the room instead. */
  .band--title .vmain { flex-basis: 40%; }
  .band--title .vflip { flex-basis: 60%; }

  /* The month's value, as the badge people are actually given, beside the
     wording rather than above it: the panel keeps one line of thought and the
     text keeps the height it had. Sized off one custom property so the whole
     thing moves from ?vbadge= without touching the layout. */
  /* Stretched, not centred. Centred, the text column sized itself to its own
     content instead of to the row, so a long value ran off the panel top and
     bottom while measuring as though it fitted. The badge centres itself. */
  .vmain-inner {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: stretch;
    gap: 1.4rem;
  }

  .vbadge {
    align-self: center;
    flex: 0 0 auto;
    width: var(--vbadge, 5.5rem);
    height: var(--vbadge, 5.5rem);
    object-fit: contain;
    display: block;
  }
  .vbadge[hidden] { display: none; }

  .vmain-body {
    flex: 1;
    min-width: 0;
    min-height: 0;
    max-width: 44ch;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
  }

  .vmain {
    flex: 1 1 52%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
    padding: 1.2rem 1.6rem;
  }

  /* Static labels. Held to one line and scaled by fitLine to whatever width
     the panel gives them, so they neither wrap nor sit oversized. */
  .kicker {
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    color: var(--accent-ink, var(--accent));
  }

  /* Sized to the space it has rather than to how many characters it holds:
     the panel is a fixed box and the text has to live inside it, whatever the
     screen is and whatever the author wrote. */
  /* Static for the month, so it is set to be read at a glance and then
     ignored, not to hold the eye against a panel that turns over every few
     seconds. Smaller, lighter, and held to a measure rather than run to the
     full width of the panel - a short line length is most of what makes a
     block of standing text look composed rather than dumped. */
  .vmain-text {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.35em;
    font-size: 1.05rem;
    font-weight: 400;
    line-height: 1.5;
    color: var(--ink-2);
  }
  .vmain-text span { display: block; white-space: pre-line; }
  .vmain-text .vln { display: block; white-space: normal; }
  .vmain-text .vln + .vln { margin-top: 0.5em; }

  /* Where the value opens with a line of its own, it is given one. The block
     was a slab of one size at one weight, which is what made it heavy. */
  .vmain-lead {
    display: block;
    font-size: 1.5em;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .vmain-lead[hidden] { display: none; }

  /* Most months the value arrives as a name, or a phrase no longer than a
     heading, with nothing under it. That is set the way the thanks cards set
     a colleague's name - heavy enough to be read first, in the names' ink -
     rather than at paragraph weight in a box built for paragraphs. */
  .vmain-text--title { font-weight: 700; line-height: 1.15; color: var(--ink); }

  /* The month's value, counted: how many of the fortnight's thanks were given
     for it. Set in the rail's own style for its total, so it reads as the
     same kind of number as the one above it, in the month's colour. */
  .vcount {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--line-soft);
  }
  .vcount[hidden] { display: none; }
  .vcount .sbig { font-size: 1rem; white-space: nowrap; }
  .vcount .sbig b { color: var(--accent-ink, var(--accent)); }
  .vcount-ask {
    font-size: 0.85rem;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .vflip {
    flex: 1 1 48%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding: 1.2rem 1.75rem;
    background: var(--accent-tint);
    color: var(--ink);
  }
  .vflip[hidden] { display: none; }
  .vflip .kicker { color: var(--ink-soft); }

  /* No overflow rule here: the panel itself is the backstop. */
  .vstage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
  }
  .vstage.in { animation: riseIn 0.5s cubic-bezier(.22,.8,.3,1) both; }

  /* The label and the number share a line, so the passage underneath gets the
     row the number used to have to itself. */
  .vhead {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem;
  }
  .vnum {
    flex: 0 0 auto;
    font-size: 0.85rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* The passage is set in the same family as the rest of the board and told
     apart by weight, not by a second typeface. */
  .vquote {
    flex: 1;
    min-height: 0;
    overflow: visible;
    display: flex;
    align-items: center;
    position: relative;
    font-family: var(--quote);
    font-size: 1.5rem;
    font-weight: 400;
    line-height: 1.4;
    color: var(--ink-2);
  }
  .vquote span { display: block; position: relative; white-space: pre-line; }
  .vquote .vln { display: block; white-space: normal; }
  .vquote .vln + .vln { margin-top: 0.5em; }

  .vby {
    flex: 0 0 auto;
    font-size: 1rem;
    padding-top: 0.55em;
    border-top: 1px solid var(--line);
  }
  .vby[hidden] { display: none; }
  /* The only heavy text left on the board. It is bold because nothing else
     is, which is the whole of what makes it read as the attribution. */
  .vby-name {
    font-size: 1.2em;
    font-weight: 900;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vby-role {
    font-size: 0.68em;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* One segment per passage. The one on screen fills over the time it is
     held, so someone reading from across the room can see it is about to turn
     over; the ones before it stay full. Only transform is animated, which the
     player can do without repainting the band. */
  .dots { flex: 0 0 auto; display: flex; gap: 0.35rem; }
  .dots[hidden] { display: none; }
  .dots i {
    position: relative;
    width: 1.6rem;
    height: 0.26rem;
    border-radius: 999px;
    overflow: hidden;
    background: var(--accent-track);
  }
  .dots i::after {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    border-radius: inherit;
    background: var(--band);
    transform: scaleX(0);
    transform-origin: left center;
  }
  html[data-theme="dark"] .dots i::after { background: var(--accent); }
  .dots i.done::after { transform: none; }
  .dots i.on::after { animation: vfill var(--vspeed, 40s) linear both; }
  @keyframes vfill { to { transform: none; } }

  /* ---------------------------------------------------------------- footer */

  .foot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0.35rem;
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .foot .ask { color: var(--orange); }

  /* -------------------------------------------------------------- overlays */

  .overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    text-align: center;
    background: var(--page);
    z-index: 10;
    padding: 2rem;
  }
  .overlay[hidden], .gate[hidden] { display: none; }
  .overlay .mark, .gate .mark { font-size: 3rem; line-height: 1; }
  .overlay .big, .gate .big { font-size: 1.5rem; font-weight: 900; }
  .overlay .small, .gate .small { font-size: 0.9rem; color: var(--ink-soft); max-width: 28rem; }

  /* The key screen. Only ever seen on a published copy, where the data files
     beside this page are sealed and nothing can be drawn until one is opened.
     It sits above the offline overlay: a board waiting for a key is not a
     board with a network problem, and only one of the two is worth reading. */
  .gate {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    text-align: center;
    background: var(--page);
    z-index: 20;
    padding: 2rem;
    cursor: auto;
  }
  .gate form { display: flex; gap: 0.5rem; margin-top: 0.2rem; }
  .gate input {
    width: 20rem;
    max-width: 60vw;
    padding: 0.6rem 0.8rem;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.6rem;
    outline: none;
  }
  .gate input:focus { border-color: var(--orange); }
  .gate button {
    padding: 0.6rem 1.2rem;
    font: inherit;
    font-size: 1rem;
    font-weight: 900;
    color: #fff;
    background: var(--orange);
    border: 0;
    border-radius: 0.6rem;
    cursor: pointer;
  }
  .gate .err {
    font-size: 0.9rem;
    font-weight: 800;
    color: #c2255c;
    min-height: 1.2rem;
    max-width: 26rem;
  }

  /* A screen narrow enough that two cards side by side would each be a column
     of single words. One card, and the rail underneath it. */
  @media (max-aspect-ratio: 1/1) {
    .recogbody { flex-direction: column; }
    .cards { grid-template-columns: 1fr; }
    #slot1 { display: none; }
    .stats {
      flex: 0 0 auto;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 0.7rem 0 0;
      border-left: 0;
      border-top: 1px solid var(--line);
    }
    .band { flex-direction: column; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ config

  var q = new URLSearchParams(location.search);

  // ==================================================================
  //  CONFIG  -  the only part of this file you need to edit
  // ==================================================================
  //
  //  Paste the key between the quotes on the "key" line, save, and the
  //  board runs on its own with no query string at all. That is what lets
  //  it work as a Yodeck HTML App, where there is no URL to hang
  //  parameters off.
  //
  //  Anything passed on the URL still wins over what is set here, so the
  //  same file can also be dropped on a web host and tuned per screen
  //  with ?scale=1.2, ?theme=dark and the rest, exactly as before.
  //
  var CONFIG = {

    // The two sealed feeds. Published by someone else; this board only
    // reads them, and reads nothing else.
    api:  "https://cooneen-dev.github.io/thanks-board/thanks.json",
    news: "https://cooneen-dev.github.io/thanks-board/newsletter.json",

    // >>> PASTE THE KEY HERE, between the quotes <<<
    key:  "",

    // Keep the last good board on the player, so a reload or a dropped
    // connection shows the last fortnight rather than an error.
    cache: "on",

    // Optional. Leave blank unless a particular screen needs it.
    theme:   "",   // "dark" for a dim room
    scale:   "",   // "1.2" moves the whole board up, for a set further away
    refresh: "",   // seconds between polls        (blank = 60)
    speed:   "",   // seconds between card changes  (blank = 14)
    vspeed:  "",   // seconds a cycling value is held (blank = 40)
    vbadge:  "",   // size of the value badge in rem (blank = 5.5, 0 hides it)
    zeros:   ""    // "show" to keep unused values on the rail
  };

  // One reader for both. A query parameter, where one is actually given,
  // beats the config above; an empty config entry falls through to the
  // built-in default further down, so nothing here has to be filled in.
  function cfg(name) {
    var v = q.get(name);
    if (v !== null && v !== "") return v;
    v = CONFIG[name];
    return (v === undefined || v === null || v === "") ? null : String(v);
  }

  var API      = cfg("api")  || "thanks.json";
  var NEWS_API = cfg("news") || "newsletter.json";
  var REFRESH  = Math.max(0, parseInt(cfg("refresh") || "60", 10) || 0);

  // Seconds a thanks card is held. Each of the two runs on this, half a cycle
  // apart, so something changes every SPEED seconds but never both at once.
  // Seconds between changes, and now literally that: both cards turn over
  // together on one timer, so this is no longer the half-cycle it was when
  // they alternated and 14 does not have to be written as 7.
  var SPEED  = Math.max(3, parseFloat(cfg("speed")  || "14") || 14);
  var VSPEED = Math.max(4, parseFloat(cfg("vspeed") || "40") || 20);

  // Whether a good board is kept on the player so it survives a reload. Off
  // unless asked for: the data is sealed in the repo on purpose, and writing
  // it back out in the clear on a player that sits on the guest wifi undoes
  // some of that. ?cache=on turns it on. See recall() for what it will and
  // will not put back.
  var CACHE = (cfg("cache") || "off").toLowerCase() === "on";

  // Nothing older than this is worth putting on a wall. Past it the board is
  // no longer reporting a fortnight, it is reporting a fortnight that ended.
  // Floored low rather than at an hour, so the cap can actually be tried on a
  // desk without waiting a day for it to matter.
  var CACHE_MAX_HOURS = Math.max(0.01, parseFloat(cfg("cachehours") || "24") || 24);
  var CACHE_STORE = "thanks-wall-last";

  // A value nobody happened to use this fortnight gets no row. Greyed out at
  // zero it reads as a statement about the company rather than about the two
  // weeks - an empty Wellbeing bar on a wall says there is no wellbeing here,
  // which is not what an empty bar means. ?zeros=show puts them back.
  var ZEROS = (cfg("zeros") || "hide").toLowerCase() === "show";

  // Seconds a name is held where two or more people share the top of the rail.
  // Slower than the cards beside it: a name that changes as often as a card
  // reads as part of the same shuffle rather than as a standing between two.
  var FSPEED = Math.max(3, parseFloat(cfg("fspeed") || "7") || 7);

  // Everything is sized in rem against a viewport-scaled root, so one
  // multiplier moves the whole board at once. Tune it from the screen's own
  // URL rather than editing the file: ?scale=1.2 for a set further away. The
  // base is recomputed rather than read back, so a resize does not compound
  // what was already applied.
  var SCALE = Math.min(3, Math.max(0.5, parseFloat(cfg("scale") || "1") || 1));

  // How big the month's badge sits on the value panel. In rem like everything
  // else, so it holds its proportion on a 1080p set and a 4K one alike. 0
  // takes it off without touching anything else.
  var VBADGE = Math.max(0, Math.min(20, parseFloat(cfg("vbadge") || "5.5")));
  if (isNaN(VBADGE)) VBADGE = 5.5;
  document.documentElement.style.setProperty("--vbadge", VBADGE + "rem");

  // The segments under the passages fill over the time a passage is held, so
  // the stylesheet is told what that time is rather than guessing at it.
  document.documentElement.style.setProperty("--vspeed", VSPEED + "s");

  function applyScale() {
    if (SCALE === 1) return;
    var base = Math.min(32, Math.max(15, 0.0105 * window.innerWidth + 5));
    document.documentElement.style.fontSize = (base * SCALE).toFixed(2) + "px";
  }
  applyScale();

  if (cfg("theme") === "dark") document.documentElement.dataset.theme = "dark";

  var $ = function (id) { return document.getElementById(id); };

  // ------------------------------------------------------------- sealed data
  //
  // A published copy of this page sits beside two json files it cannot read.
  // The publisher seals them with AES-GCM before committing, so the repository
  // can be public while the board is not. The key opens them here, in the
  // browser, and is never sent anywhere.
  //
  //     ?key=...     what an unattended screen is pointed at
  //     typed once   kept in this browser afterwards, so a reload is silent
  //
  // Whether a file is sealed is decided by what came back, never by
  // configuration. A plain json answer is passed through untouched, which is
  // the case on the wall inside: that screen talks to the portal directly,
  // sees none of this, and is never asked for anything.

  var KEY_STORE = "thanks-wall-key";

  function storedKey() {
    try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; }
  }

  function rememberKey(key) {
    // A screen in kiosk mode with storage disabled still works for as long as
    // it stays open, and one driven by ?key= never needs this at all.
    try { localStorage.setItem(KEY_STORE, key); } catch (e) {}
  }

  var KEY = cfg("key") || storedKey();

  // A key in the URL is what this screen was deliberately sent with, so it
  // beats anything the browser happened to be holding, and replaces it.
  if (cfg("key")) rememberKey(KEY);

  function isSealed(d) {
    return !!(d && d.alg === "AES-GCM" && d.ct && d.salt && d.nonce);
  }

  function b64bytes(text) {
    var bin = atob(text), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // Deriving the key is slow on purpose, that being the entire point of it, so
  // it happens once and is kept rather than on every poll. The wrapper carries
  // the salt and the iteration count, so if the publisher ever changes either
  // this follows along without an edit here.
  var derived = null;

  function deriveKey(wrapper) {
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) {
      // Only available over https or on localhost. Worth saying plainly,
      // because from the screen it otherwise looks like a rejected key.
      var e = new Error("This page must be opened over https to unseal the board.");
      e.fatal = true;
      return Promise.reject(e);
    }

    var tag = wrapper.salt + "|" + wrapper.iter + "|" + KEY;
    if (derived && derived.tag === tag) return derived.promise;

    var promise = subtle
      .importKey("raw", new TextEncoder().encode(KEY), "PBKDF2", false, ["deriveKey"])
      .then(function (material) {
        return subtle.deriveKey({
          name:       "PBKDF2",
          salt:       b64bytes(wrapper.salt),
          iterations: wrapper.iter || 310000,
          hash:       "SHA-256"
        }, material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      });

    derived = { tag: tag, promise: promise };
    return promise;
  }

  function unseal(wrapper) {
    return deriveKey(wrapper).then(function (key) {
      return window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64bytes(wrapper.nonce) }, key, b64bytes(wrapper.ct));
    }).then(function (plain) {
      return JSON.parse(new TextDecoder().decode(plain));
    });
  }

  // Every read of a data file goes through here, so one file being sealed and
  // the other not is a case nothing has to be told about.
  function fetchJSON(url) {
    return fetch(url, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        if (!isSealed(d)) return d;
        if (!KEY) { gate(true, ""); throw new Error("no key"); }

        return unseal(d).then(function (opened) {
          gate(false);
          return opened;
        }, function (e) {
          // A refused key is not a network fault and polling will not mend it.
          // Ask for one and let the polls keep failing quietly behind the gate.
          gate(true, e && e.fatal ? e.message : "That key does not open this board.");
          throw e;
        });
      });
  }

  function gate(show, message) {
    var el = $("gate");
    if (!show) { el.hidden = true; return; }

    $("gate-err").textContent = message || "";
    if (el.hidden) {
      el.hidden = false;
      $("gate-key").value = "";
      $("gate-key").focus();
    }
  }

  $("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var typed = $("gate-key").value.trim();
    if (!typed) return;

    KEY = typed;
    derived = null;
    rememberKey(KEY);
    $("gate-err").textContent = "Opening...";

    // The polls are what actually test a key. A good one takes the gate down
    // from inside fetchJSON, a bad one puts the message back.
    load();
    loadNews();
  });

  // ------------------------------------------------------------------ badges

  // Read off the badge artwork itself, so a value is the same colour on the
  // rail, on a card and on the panel as it is on the badge people are given.
  var BADGE_COLORS = {
    Teamwork:   "#1a8692",
    Results:    "#ee7730",
    Ownership:  "#38a344",
    Positivity: "#e3a309",
    Wellbeing:  "#c25a9c",
    Trust:      "#40b9c3"
  };

  var BADGE_FALLBACK = "#6b7280";

  // The same six taken down until white type on them clears 4.5:1. A badge
  // colour is pitched to be read small on a light rail; a whole panel of it
  // with white type over the top is a different job.
  var BAND_COLORS = {
    Teamwork:   "#18808c",
    Results:    "#b95c25",
    Ownership:  "#2d8537",
    Positivity: "#9a6e06",
    Wellbeing:  "#b2528f",
    Trust:      "#2c8188"
  };

  var BADGE_ICONS = {
    Teamwork:   "M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z",
    Results:    "M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4-6.2-4.6-6.2 4.6 2.4-7.4L2 9.4h7.6z",
    Ownership:  "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1.2 15.2L7 12.4l1.4-1.4 2.4 2.4 5.2-5.2L17.4 9l-6.6 7.2z",
    Positivity: "M12 2a10 10 0 100 20 10 10 0 000-20zM8.5 9a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zm4 0a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zM12 18c-2.6 0-4.8-1.7-5.6-4h11.2c-.8 2.3-3 4-5.6 4z",
    Wellbeing:  "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z",

  function badgeImg(name, cls) {

  }

  // Tints worked out here rather than with CSS color-mix(), which the Yodeck
  // player's older Chromium does not understand: it throws the rule away and
  // the shading behind the cards and the value simply disappears.
  function rgbOf(hex) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || "").trim());
    if (!m) return null;
    var h = m[1].length === 3 ? m[1].replace(/./g, "$&$&") : m[1];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];

    var c = rgbOf(hex);

      .replace(/"/g, "&quot;");
  }

  // ------------------------------------------------------------ plain words
  //
  // Nobody types into a recognition wall the way they would type onto a wall
  // screen, and three kinds of thing arrive that a projector cannot show:
  //
  //     the emoji itself   drawn by the browser at whatever size the font
  //                        feels like, in colours the board never chose
  //     the shortcode      :thumbsup:, where the sender's client wrote one
  //                        and the feed never turned it back into a glyph
  //     the word           (fist bump), where something in between replaced
  //                        a glyph it could not carry with its own name
  //
  // All three go, here, once, before anything is escaped or measured. Text is
  // the only thing this board puts up.

    // that hold the compound ones together.

  // wider than a list would start eating real parentheses out of real
  // sentences, which is a worse fault than leaving one word behind.
  var EMOJI_WORDS = [
    "fist ?bump", "fist ?bump ?emoji", "thumbs ?-?up", "thumbs ?down",
    "clap(?:ping)?(?: hands)?", "high ?five", "raised hands", "raising hands",
    "folded hands", "pray(?:ing)?", "handshake", "shaking hands",
    "smil(?:e|ing)(?: face)?", "smiley", "grin(?:ning)?(?: face)?", "wink(?:ing)?",
    "laugh(?:ing)?", "joy", "blush(?:ing)?", "heart(?:s| eyes)?", "red heart",
    "star ?-?struck", "star", "glowing star", "sparkles?", "fire", "rocket",
    "trophy", "medal", "party popper", "partying face", "tada", "confetti",
    "flexed biceps", "muscle", "ok hand", "victory hand", "raised fist",
    "hundred points", "sunglasses", "thinking face", "eyes", "crown", "bulb",
    "light ?bulb", "check ?mark", "white check mark", "heavy check mark"
  ].join("|");

    "[\\(\\[]\\s*(?:" + EMOJI_WORDS + ")\\s*[\\)\\]]", "gi");

    if (s == null) return "";
    return String(s)
      .replace(EMOJI_WORD_RE, " ")
      .replace(SHORTCODE_RE, " ")
      .replace(EMOJI_RE, " ")
      // Taking a glyph out of the middle of a sentence leaves the gap it sat
      // in, and taking one off the end leaves the space before it.
      .replace(/[ \t]{2,}/g, " ")
      .replace(/[ \t]+([,.!?;:)\]}])/g, "$1")
      .replace(/([([{])[ \t]+/g, "$1")
      .replace(/^[\s\u00b7\u2022|]+/, "")
      .replace(/[\s\u00b7\u2022|]+$/, "")

  // date by the current offset.

  // the rest with zeros, so what arrives is a full-looking stamp that means
  // nothing after the day: 2026-09-07T00:00:00. Read as a time it is midnight,
  // and a thanks posted this morning came up as "14 hours ago" once the clock
  // got past two. Matched here in every shape it turns up in - bare date, with
  // or without a T, with or without seconds, milliseconds or a zone.
  var DATE_ONLY =
    /^\s*(\d{4})-(\d{2})-(\d{2})(?:[T ]0{2}:0{2}(?::0{2}(?:\.0+)?)?)?\s*(?:Z|[+-]0{2}:?0{2})?\s*$/;

  // would drag a timezone into a value that never had a time in it, which is

  function daysSince(y, mo, dy) {
    var then = Date.UTC(y, mo - 1, dy);
    var n = new Date();
    var now = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((now - then) / 86400000);

  function ago(iso) {
    var m = DATE_ONLY.exec(String(iso == null ? "" : iso));
    if (m) {
      // Capitalised where the label opens with a word and lower where it opens
      // with a numeral, so nothing reads as a sentence starting mid-thought.
      var dd = daysSince(+m[1], +m[2], +m[3]);
      if (dd <= 0)  return "Today";
      if (dd === 1) return "Yesterday";
      // Past five days "n days ago" stops being easier to picture than the
      // date itself, so it hands over to the date.
      if (dd <= 5)  return dd + " days ago";
      return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]))
             .toLocaleDateString(undefined,
               { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
    }

    var d = toDate(iso);
    if (!d) return "";
    var mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1)  return "just now";
    if (mins < 60) return mins + " min ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24)  return hrs === 1 ? "an hour ago" : hrs + " hours ago";
    var days = Math.round(hrs / 24);
    if (days === 1) return "yesterday";
    if (days < 7)   return days + " days ago";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });

  // Restarts a CSS animation that is already on the element.
  function replay(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  // newlines, so the escaped copy has to have those put back or the tags are
  // read out on the wall as words.
  var BR_TAG = /&lt;br\s*\/?&gt;/gi;

  function message(text) {
    return esc(clean(text))
      .replace(BR_TAG, "<br>")
      .replace(/\r?\n/g, "<br>")
      .replace(/(?:<br>\s*){2,}/g, "<br>");
  }

  // Steps the size down until the text fits the box it has to live in. The
  // character count says nothing about how wide a panel is or how tall the
  // screen is, so the box itself is what gets asked.
  // The height of everything the box is actually holding, gaps included.
  // Reading the first child alone was fine while every fitted box had exactly
  // one; a box with a heading above its body would have been measured on the
  // heading and let the body run off the bottom.
  function contentHeight(box) {
    var kids = box.children, total = 0, shown = 0;
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].hidden) continue;
      // The border box, not the scroll height. The quote marks are absolutely
      // positioned inside the text span, and scrollHeight counts them: the
      // fitter was shrinking the words to make room for the decoration hung
      // off them, which at high zoom left the passage clipped anyway.
      total += kids[i].getBoundingClientRect().height;
      shown++;

  function fitBox(box, max, min) {
    if (!box || !box.firstElementChild) return;
