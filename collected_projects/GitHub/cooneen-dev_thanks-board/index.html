    // the text is allowed to run into the edges before it starts shrinking.
    var pad = getComputedStyle(box);
    var room = box.clientHeight
             - parseFloat(pad.paddingTop) - parseFloat(pad.paddingBottom);
    if (!(room > 0)) return;

    var size = max;
    box.style.fontSize = size + "rem";

    // Enough to walk the full range in 0.05 steps, with the new ceiling.
    var guard = 80;
    while (guard-- && size > min && contentHeight(box) > room + 1) {
      size -= 0.05;
      box.style.fontSize = size.toFixed(2) + "rem";
    }
  }

  // Steps the size down until the text fits the width it has. A colleague's
  // name is the one thing on this board that should not be abbreviated, so
  // where it will not fit the row it is set smaller; the ellipsis behind this
  // is only there for a name no size would save.
  function fitLine(el, max, min) {
    if (!el) return;
    var size = max, guard = 30;
    el.style.fontSize = size + "rem";
    while (guard-- && size > min && el.scrollWidth > el.clientWidth + 1) {
      size -= 0.05;
      el.style.fontSize = size.toFixed(2) + "rem";
    }
  }

  // ------------------------------------------------------------- stats rail

  function bar(name, count, max) {
    return '<div class="sbar' + (count ? "" : " sbar--zero") +
           '" data-count="' + count + '" style="--c:' + color(name) + '">' +
             (badgeImg(name, "sbi") ||
              '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + icon(name) + '"/></svg>') +
             '<span class="sn">' + esc(name) + "</span>" +
             '<span class="strk"><i style="width:' + Math.round((count / max) * 100) + '%"></i></span>' +
             '<span class="sc">' + count + "</span>" +
           "</div>";
  }

  // The endpoint only reports badges that were actually given, so on a quiet
  // fortnight a value would silently disappear off a board whose whole job is
  // to show the values. Merge the known six against what came back, keep the
  // zeros, and append anything new so a seventh value appears here on its own.
  // Where the count at the top of a list is shared, everybody holding it is at
  // the top of it. Taking the first row and calling it the answer is a coin
  // toss dressed up as a result, and the two people it is between both work
  // in the building the screen is in.
  function leaders(list) {
    if (!list || !list.length) return [];
    var top = list[0].count;
    return list.filter(function (p) { return p.count === top; });
  }

  var flickT = null, flickS = "", flickI = 0;

  // One timer, both standings. Run on two timers they drifted apart and read
  // as two unrelated things twitching; the pair is one statement about the
  // fortnight, so it turns over as one.
  function runFlicks(groups) {
    if (flickT) { clearInterval(flickT); flickT = null; }

    var live = groups.filter(function (g) { return $(g.id) && g.list.length; });
    if (!live.length) return;

    // Position is held against the standings themselves, so a poll that comes
    // back unchanged does not send every name back to the start of its tie.
    var sig = live.map(function (g) {
      return g.id + ":" + g.list.map(function (p) { return p.name + p.count; }).join(",");
    }).join("|");
    if (flickS !== sig) { flickS = sig; flickI = 0; }

    function paint() {
      live.forEach(function (g) {
        var p = g.list[flickI % g.list.length];
        var el = $(g.id);
        el.innerHTML = esc(clean(p.name)) +
                       ' <small>&times;' + esc(p.count) + "</small>";
        replay(el, "flick");
      });
    }

    paint();

    // Only worth running if at least one of them has somewhere to go.
    var longest = Math.max.apply(null, live.map(function (g) { return g.list.length; }));
    if (longest < 2) return;

    flickT = setInterval(function () { flickI++; paint(); }, FSPEED * 1000);
  }

  function pairBlock(drop, label, id, group) {
    if (!group.length) return "";
    return '<div data-drop="' + drop + '">' +
             '<div class="skicker">' + label +
               (group.length > 1
                 ? '<span class="tie">' + group.length + " tied</span>" : "") +
             "</div>" +
             '<div class="sname" id="' + id + '"></div>' +
           "</div>";
  }

  function renderStats(d) {
    var counts = {}, names = VALUES.slice();
    (d.badges || []).forEach(function (b) {
      counts[b.badge] = b.count;
      if (names.indexOf(b.badge) === -1) names.push(b.badge);
    });

    var max = 1;
    names.forEach(function (n) { max = Math.max(max, counts[n] || 0); });

    // Ranked, not in the order the values are always listed in. A row of bars
    // is read as a ranking whether or not it is one, so it may as well be one,
    // and it puts the unused values at the bottom where they cost least - which
    // is also the end the rail gives up first when it runs out of room.
    names.sort(function (a, b) {
      return (counts[b] || 0) - (counts[a] || 0) || a.localeCompare(b);
    });

    var topG   = leaders(d.recipients);
    var giverG = leaders(d.givers);
    lastStats = d;

    // data-drop is the order things are given up in if the rail still will not
    // fit after being taken down as far as it goes. The timestamp is not on
    // the list at all: it is one small line, so dropping it frees almost no
    // room, and it is the only thing on the board that says whether any of
    // the rest is current. A wall quietly showing a fortnight-old count with
    // nothing to say so is worse than a wall missing a headcount.
    $("stats").innerHTML =
      '<div class="sbig"><b>' + esc(d.count) + "</b><span>thank yous</span></div>" +
      '<div class="ssub" data-drop="1">' + esc(d.people_thanked) +
        " colleagues thanked by " + esc(d.people_giving) + "</div>" +
      '<div class="sbars">' + names.filter(function (n) {
        return ZEROS || (counts[n] || 0) > 0;
      }).map(function (n) {
        return bar(n, counts[n] || 0, max);
      }).join("") + "</div>" +
      pairBlock(3, "Most thanked",      "s-top",   topG) +
      pairBlock(2, "Most thanks given", "s-giver", giverG);

    runFlicks([{ id: "s-top", list: topG }, { id: "s-giver", list: giverG }]);

    trimRail();

    // The band counts the month's value off this same payload, so the two
    // numbers on the board can never disagree. Showing or hiding the count
    // changes the room the value has, so the value is fitted again after it.
    renderCount();
    if (!$("band").hidden) fitBox($("vmain-text"), vmainMax, 0.45);
  }

  // Nothing on the rail may spill past it. The six values are the whole point
  // of a board called Values in Action, so before anything is given up the
  // rail is taken down a size at a time as one piece. Only a rail that will
  // not fit even at the floor starts dropping rows, and the values go last.
  var RAIL_FLOOR = 0.72;

  function railFits() {
    var rail = $("stats");
    if (rail.scrollHeight > rail.clientHeight + 1) return false;

    // Asking only the rail was not enough: a block inside it that clips its
    // own rows leaves the rail measuring as though everything fitted. Whatever
    // is set to hide its overflow gets asked separately.
    var bars = rail.querySelector(".sbars");
    return !bars || bars.scrollHeight <= bars.clientHeight + 1;
  }

  function fitRail() {
    var rail = $("stats"), size = 1, guard = 24;
    rail.style.fontSize = "";

    while (guard-- && !railFits() && size > RAIL_FLOOR) {
      size -= 0.025;
      rail.style.fontSize = size.toFixed(3) + "rem";
    }
    return railFits();
  }

  function trimRail() {
    if (fitRail()) return;

    var rail = $("stats");
    var blocks = Array.prototype.slice.call(rail.querySelectorAll("[data-drop]"))
      .sort(function (a, b) { return +a.dataset.drop - +b.dataset.drop; });

    for (var i = 0; i < blocks.length && !fitRail(); i++) blocks[i].hidden = true;

    var bars = rail.querySelector(".sbars"), guard = 30;
    while (guard-- && !fitRail() && bars && bars.children.length > 1) {
      // The running order on screen stays as it is; what goes is whichever
      // value was handed out least, wherever it happens to sit in that order.
      var rows = bars.children, worst = 0;
      for (var k = 1; k < rows.length; k++) {
        if (+rows[k].dataset.count <= +rows[worst].dataset.count) worst = k;
      }
      bars.removeChild(rows[worst]);
    }
  }

  // ------------------------------------------------------------------- cards

  // Two cards side by side should be two different pieces of news. The same
  // wording sent to two people is one piece; so is the same person thanked
  // twice by different colleagues, which is what put one name up in both
  // panels at once. Either is enough to keep an item out of the other slot.
  function sameThanks(a, b) {
    if (!a || !b) return false;
    if (a.message === b.message && a.giver === b.giver) return true;
    return !!a.recipient && norm(a.recipient) === norm(b.recipient);
  }

  function cardHTML(t) {
    var c    = color(t.badge);
    var when = t.date_iso ? ago(t.date_iso) : (t.date || "");
    var msg  = t.message || "";

    return '<div class="card" style="--c:' + c + ';--ct:' + tint(c, 0.09) + '">' +
             '<div class="chead">' +
               (badgeImg(t.badge, "cav cav--img") ||
                '<div class="cav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' +
                icon(t.badge) + '"/></svg></div>') +
               '<div class="cnames">' +
                 '<div class="cbadge">' + esc(clean(t.badge) || "Thanks") + "</div>" +
                 '<div class="crecip">' + esc(clean(t.recipient)) + "</div>" +
               "</div>" +
             "</div>" +
             '<div class="cmsg"><span>' + message(msg) + "</span></div>" +
             '<div class="cfoot">' +
               "<span>" + (t.giver ? "from <b>" + esc(clean(t.giver)) + "</b>" : "") + "</span>" +
               '<span class="cdate">' + esc(when) + "</span>" +
             "</div>" +
           "</div>";
  }

  // Two slots drawing from one list, so the same thanks is never up twice, and
  // two timers half a cycle apart, so they never turn over together.
  // The last payload the rail was drawn from, so a resize can draw it again at
  // the new size instead of living with what was trimmed off at the old one.
  var lastStats = null;

  var items = [], timers = [], itemSig = "";
  // What each slot is holding, so the other one can step over a thank you that
  // went to two people at once rather than showing it twice side by side.
  var shown = [null, null];

  // The deck is what is left to be dealt. It is cut fresh from the whole list
  // each time it runs out, so every thanks in the window is up once before any
  // of them is up twice, and no two rounds come in the same order.
  var deck = [];

  // Normalised messages of the last few cards dealt. A note copy-pasted to ten
  // people is ten entries in the feed with one piece of text between them, and
  // in list order that is ten cards in a row saying the same thing. The text
  // is what is blocked rather than the entry, so all ten still get their turn,
  // just never one after another.
  var recent = [], recentCap = 1;
  var RECENT_MAX = 8;

  function stopRotation() {
    timers.forEach(clearTimeout);
    timers.forEach(clearInterval);
    timers = [];
  }

  function norm(s) {
    return clean(s).toLowerCase().replace(/\s+/g, " ").trim();
  }

  // Fisher-Yates on a copy. The list itself is left as the portal sent it.
  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function blocked(item, other) {
    if (sameThanks(item, other)) return true;
    var m = norm(item.message);
    if (!m) return false;
    if (other && norm(other.message) === m) return true;
    return recent.indexOf(m) !== -1;
  }

  // Takes the first card in the deck that passes, rather than the first card
  // full stop, so a blocked one keeps its place instead of being burnt.
  function deal(test) {
    for (var i = 0; i < deck.length; i++) {
      if (test(deck[i])) return deck.splice(i, 1)[0];
    }
    return null;
  }

  function nextItem(idx) {
    if (!items.length) return null;
    var other = shown[1 - idx];

    var item = deal(function (t) { return !blocked(t, other); });

    if (!item) {
      deck = shuffle(items);
      item = deal(function (t) { return !blocked(t, other); })
          // A fortnight where every thanks says the same thing still has to
          // put something up. The content block is given up before the board
          // is, and only the card beside it is honoured.
          || deal(function (t) { return !sameThanks(t, other); })
          || deck.shift()
          || items[0];
    }

    var m = norm(item.message);
    if (m) {
      recent.push(m);
      while (recent.length > recentCap) recent.shift();
    }
    return item;
  }

  // Both slots, in order, on one beat. Filling the left one first is what lets
  // the right one see it: nextItem reads the other slot before it draws, so by
  // the time the second card is picked the first is already standing there to
  // be avoided.
  function fillPair() {
    fillSlot(0);
    fillSlot(1);
  }

  function fillSlot(idx) {
    var el = $("slot" + idx);
    if (!items.length) {
      el.innerHTML = "";
      el.classList.add("slot--empty");
      shown[idx] = null;
      return;
    }

    var item = nextItem(idx);
    shown[idx] = item;
    el.classList.remove("slot--empty");
    el.innerHTML = cardHTML(item);

    var card = el.firstElementChild;
    replay(card, "in");
    fitLine(card.querySelector(".crecip"), 1.5, 0.95);
    fitBox(card.querySelector(".cmsg"), 1.35, 0.72);
  }

  function renderWall(list) {
    var sig = list.map(function (t) {
      return [t.recipient, t.giver, t.badge, t.message, t.date_iso || t.date].join("|");
    }).join("~");

    // A poll that brings back the same thanks must not send both slots back to
    // the top of the list every minute.
    if (sig === itemSig) return;
    itemSig = sig;
    items   = list;
    shown   = [null, null];
    deck    = shuffle(items);
    recent  = [];

    // The block can only ever hold back less than there is distinct text to
    // draw from, or a fortnight of near-identical thanks blocks everything and
    // the wall has nothing left it is allowed to show.
    var seen = {}, distinct = 0;
    items.forEach(function (t) {
      var m = norm(t.message);
      if (m && !seen[m]) { seen[m] = 1; distinct++; }
    });
    recentCap = Math.max(1, Math.min(RECENT_MAX, distinct - 1));

    stopRotation();
    fillPair();
    if (items.length <= 2) return;

    timers.push(setInterval(fillPair, SPEED * 1000));
  }

  // ------------------------------------------------------------------ values
  //
  // The main value is held for as long as the issue stands. The rest take
  // turns beside it, one at a time.

  var rest = [], vIdx = 0, vTimer = null, valueSig = "";

  // The value this month's issue names, if it names one: what the band's
  // count is counted against.
  var valueName = null;

  // Held so a refit uses the ceiling this issue was sized with, rather than
  // one fixed in the resize handler that knows nothing about the text.
  var vmainMax = 1.6;
  var VQUOTE_MAX = 1.6;

  // The whole board wears the month's value. A Teamwork month is orange on the
  // panel and orange on the rail beside it, so the colour on screen is telling
  // somebody something rather than being whatever the issue was styled in.
  // What the newsletter editor picked is the fallback, for a month that names
  // no value at all.
  function applyAccent(n, mainText) {
    var hay = [n && n.value, n && n.title, n && n.edition, mainText]
      .map(function (s) { return clean(s || "").toLowerCase(); }).join(" ");

    var name = null;
    for (var i = 0; i < VALUES.length; i++) {
      if (hay.indexOf(VALUES[i].toLowerCase()) !== -1) { name = VALUES[i]; break; }
    }

    var root = document.documentElement.style;
    if (name) {
      root.setProperty("--accent", BADGE_COLORS[name]);
      root.setProperty("--band",   BAND_COLORS[name] || BADGE_COLORS[name]);
    } else if (n && n.accent) {
      root.setProperty("--accent", n.accent);
      root.setProperty("--band",   n.accent);
    } else {
      root.removeProperty("--accent");
      root.removeProperty("--band");
    }

    var cs = getComputedStyle(document.documentElement);
    var accent = cs.getPropertyValue("--accent").trim();
    var band   = cs.getPropertyValue("--band").trim();
    root.setProperty("--accent-tint",  tint(accent, 0.09));
    root.setProperty("--accent-track", tint(accent, 0.22));
    root.setProperty("--accent-ink",   mixHex(band, accent, 0.6));

    // The caller wants this too: the panel's badge is the same decision as
    // the panel's colour, and working it out twice invites the two to differ.
    return name;
  }

  // A highlighted passage usually opens with who said it, on its own line:
  //
  //     A. Name, Site - Job Title
  //     The passage they wrote, which runs on from there...
  //
  // Set as one block those are the same sentence to anybody reading it from
  // across a room, so the first line is lifted out and given its own place
  // under the quote. A feed that sends the speaker as a field is believed
  // ahead of anything read off the text.
  var ATTR_MAX = 90;

  var VTAG = /(?:&lt;|<)\s*\/?\s*(?:br|p)(?:\s[^>]*)?\s*\/?\s*(?:&gt;|>)/gi;

  function deTag(s) {
    return String(s == null ? "" : s)
      .replace(VTAG, "\n")
      .replace(/[ \t]+/g, " ")
      .replace(/[ \t]*\n[ \t]*/g, "\n")
      .replace(/\n{2,}/g, "\n")
      .replace(/^\n+|\n+$/g, "");
  }

  function flowBody(s) {
    return deTag(s)
      .replace(/([^\n.!?:;\u2026)"'\u201d\u2019])\n(?=[a-z0-9\u00df-\u00ff])/g, "$1 ")
      .replace(/\n{2,}/g, "\n")
      .replace(/^\n+|\n+$/g, "");
  }

  function paras(text) {
    return String(text == null ? "" : text)
      .split(/\n/)
      .map(function (p) { return p.trim(); })
      .filter(Boolean)
      .map(function (p) { return '<span class="vln">' + esc(p) + "</span>"; })
      .join("");
  }

  function splitQuote(v) {
    var name = clean((v && (v.author || v.name || v.by)) || "");
    var role = clean((v && (v.role || v.job || v.team)) || "");
    var text = deTag(clean((v && v.text) || ""));

    if (name) return { name: name, role: role, text: flowBody(text) };

    var lines = text.split(/\r?\n/);
    var head  = (lines[0] || "").trim();
    var body  = lines.slice(1).join("\n").trim();

    // Every one of these has to hold, or it is a sentence and not a byline:
    // two capitalised words to open it, nothing after it that ends a sentence,
    // a separator inside it, short, and a real passage left underneath.
    var looksLikeName =
      /^[A-Z][\w'\u2019.-]*\s+[A-Z][\w'\u2019.-]*/.test(head) &&
      !/[.!?]$/.test(head) &&
      /[,\u2013\u2014]|\s-\s/.test(head) &&
      head.length <= ATTR_MAX &&
      head.split(/\s+/).length <= 12 &&
      body.length >= 40;

    if (!looksLikeName) return { name: "", role: "", text: flowBody(text) };

    var parts = head.split(/\s*(?:,|\u2013|\u2014|\s-\s)\s*/).filter(Boolean);
    return {
      name: parts.shift(),
      role: parts.join("  \u00b7  "),
      text: flowBody(body)
    };
  }

  // The speaker is a caption, not the passage. On a screen that has been
  // zoomed in it was taking half the panel and squeezing the quote it belongs
  // to into three clipped lines, so it is held to a share of the panel rather
  // than to a size.
  var BY_SHARE = 0.3;

  // The two panel labels are fixed text in a box whose width moves with the
  // screen, so they are scaled to it rather than left to wrap or to sit
  // oversized. Capped at their design size so they never grow past it.
  function fitKickers() {
    var k = document.querySelectorAll(".kicker");
    for (var i = 0; i < k.length; i++) fitLine(k[i], 0.68, 0.42);
  }

  function fitBy() {
    var by = $("vby"), stage = $("vstage");
    by.style.fontSize = "";
    if (by.hidden) return;

    // Floored low. At 0.55 the caption could not shrink past a point where it
    // was taking half the panel on a heavily zoomed screen, and the share it
    // is supposed to be held to stopped meaning anything.
    var room = stage.clientHeight * BY_SHARE;
    var size = 1, guard = 30;
    while (guard-- && size > 0.34 && by.offsetHeight > room) {
      size -= 0.05;
      by.style.fontSize = size.toFixed(2) + "rem";
    }
  }

  // The month's value tends to arrive as a line and then a paragraph, the
  // same shape a quote arrives in. Set as one block at one weight it reads as
  // a slab; split, the first line does the work of a heading and the rest can
  // sit quiet underneath it. A single line with nothing after it is left
  // alone - there is nothing to head.
  var LEAD_MAX = 60;

  function splitLead(text) {
    var src   = deTag(text);
    var lines = src.split(/\r?\n/);
    var head  = (lines[0] || "").trim();
    var body  = lines.slice(1).join("\n").trim();

    var looksLikeHeading =
      body.length >= 40 &&
      head.length <= LEAD_MAX &&
      !/[.!?,;:]$/.test(head) &&
      head.split(/\s+/).length <= 9;

    return looksLikeHeading ? { head: head, body: flowBody(body) }
                            : { head: "", body: flowBody(src) };
  }

  // The same tests splitLead puts a heading through, applied to the whole of
  // the text: short, one line, not ending like a sentence. A value that passes
  // is a name to be read at a glance, not a passage to be read through.
  var TITLE_MAX = 2.6;

  function looksLikeTitle(s) {
    s = String(s || "").trim();
    return !!s &&
      s.length <= LEAD_MAX &&
      s.indexOf("\n") === -1 &&
      !/[.!?,;:]$/.test(s) &&
      s.split(/\s+/).length <= 9;
  }

  // Counted from the rail's payload and drawn from both sides: the thanks
  // arrive every minute and the issue every ten, and either can land first.
  function renderCount() {
    var box = $("vcount");
    if (!valueName || !lastStats || $("band").hidden) { box.hidden = true; return; }

    var count = 0;
    (lastStats.badges || []).forEach(function (b) {
      if (b.badge === valueName) count = parseInt(b.count, 10) || 0;
    });

    // Nobody has used it yet this fortnight. The rail leaves a value like that
    // off rather than draw an empty bar, because on a wall a nought reads as a
    // verdict on the company; here it is put as an invitation instead.
    $("vcount-n").textContent = count;
    $("vcount-n").hidden = !count;
    $("vcount-label").textContent = count
      ? (count === 1 ? "thank you" : "thank yous") + " for " + valueName
      : "Seen " + valueName + " in action?";
    $("vcount-ask").textContent = count
      ? "Seen " + valueName + " in action? Say thanks in PeopleHR."
      : "Be the first to say thanks for it in PeopleHR.";

    box.hidden = false;
    fitLine($("vcount-big"), 1, 0.5);
    fitLine($("vcount-ask"), 0.85, 0.45);
  }

  function showValue(i) {
    var v = rest[i];
    if (!v) return;

    var q = splitQuote(v);

    var by = $("vby");
    if (q.name) {
      $("vby-name").textContent = q.name;
      $("vby-role").textContent = q.role;
      $("vby-role").hidden = !q.role;
      by.hidden = false;
    } else {
      by.hidden = true;
    }

    // In this order, and not the other way round: the quote is measured
    // against the room the speaker leaves it, so the speaker has to be sized
    // and in place first.
    fitBy();

    var box = $("vtext");
    box.firstElementChild.innerHTML = paras(q.text);
    // A long passage on a screen that has been zoomed in has to be allowed
    // all the way down: clipped words are worse than small ones, and the
    // floor is the only thing standing between the two.
    // Ceiling raised well above what a long passage will ever reach, so the
    // size is decided by the room the quote has rather than by a number: a
    // short one now fills the panel instead of stopping at 1.6 with a quarter
    // of the box empty under it. A long one still shrinks exactly as before.
    fitBox(box, VQUOTE_MAX, 0.34);

    // Full behind, filling on the one now showing, empty ahead.
    var dots = $("dots").children;
    for (var k = 0; k < dots.length; k++) {
      dots[k].classList.toggle("done", k < i);
      dots[k].classList.remove("on");
    }
    if (dots[i]) replay(dots[i], "on");

    replay($("vstage"), "in");
  }

  function renderValues(n) {
    var all  = (n && n.values) || [];
    var main = null;
    var others = [];

    all.forEach(function (v) {
      if (v.main && !main) main = v;
      else others.push(v);
    });

    // An issue published before values existed, or one whose author marked
    // none, still has something worth putting up.
    if (!main && n) main = { text: n.summary || n.title || "" };
    if (!main || !main.text) {
      $("band").hidden = true;
      valueSig = "";
      valueName = null;
      if (vTimer) { clearInterval(vTimer); vTimer = null; }
      return;
    }

    // The title is in the signature because the colour is read out of it, so
    // an issue retitled between polls repaints rather than keeping the old one.
    var sig = (n.id || "") + "|" + (n.title || "") + "|" +
              all.map(function (v) { return v.n + ":" + v.text; }).join("~");
    if (sig === valueSig) return;
    valueSig = sig;

    $("band").hidden = false;
    var vname = applyAccent(n, main.text);
    valueName = vname;

    // Only ever the artwork for a value actually named this month. Where the
    // issue names none, the panel goes back to being wording alone rather
    // than showing a badge that stands for nothing.
    var vb  = $("vmain-badge");
    var src = (VBADGE > 0 && vname) ? BADGE_IMG[vname] : null;
    if (src) { vb.src = src; vb.hidden = false; }
    else { vb.hidden = true; vb.removeAttribute("src"); }

    $("vmain-kicker").textContent = n.edition ? "Our value of the month" : "Our values";
    var lead = splitLead(clean(main.text));
    var title = !lead.head && looksLikeTitle(lead.body);
    // Keyed on whether a heading was found, not on whether there is body text:
    // there is always body text, so the old test picked the small size every
    // time and a one-word value came out set like a paragraph.
    vmainMax = lead.head ? 1.05 : (title ? TITLE_MAX : 1.6);
    var mt = $("vmain-text");
    mt.classList.toggle("vmain-text--title", title);
    $("vmain-lead").textContent = lead.head;
    $("vmain-lead").hidden = !lead.head;
    mt.querySelector("span").innerHTML = paras(lead.body);

    rest = others;
    if (vTimer) { clearInterval(vTimer); vTimer = null; }

    // Everything that changes the band's proportions is settled first - solo
    // or not, a name or a paragraph, a count under it or not - and only then
    // is anything fitted to them. The other way round, the value was measured
    // against a panel that was about to change size.
    $("band").classList.toggle("band--solo", !rest.length);
    $("band").classList.toggle("band--title", title && rest.length > 0);
    $("vflip").hidden = !rest.length;
    renderCount();

    // A month whose value is a phrase gets the room a phrase can use; a month
    // whose value is three paragraphs does not get to set them at the same
    // size. Floored low either way - an issue running off the panel is worse
    // than one set small.
    fitBox(mt, vmainMax, 0.45);
    fitKickers();

    if (!rest.length) return;

    $("dots").innerHTML = rest.map(function () { return "<i></i>"; }).join("");
    // A single passage is not cycling, so there is nothing to count down.
    $("dots").hidden = rest.length < 2;

    vIdx = 0;
    showValue(0);
    if (rest.length > 1) {
      vTimer = setInterval(function () {
        vIdx = (vIdx + 1) % rest.length;
        showValue(vIdx);
      }, VSPEED * 1000);
    }
  }

  // ------------------------------------------------------------------ states

  function overlay(mark, big, small) {
    if (!big) { $("overlay").hidden = true; return; }
    $("ov-mark").innerHTML  = mark;
    $("ov-big").textContent = big;
    $("ov-small").textContent = small || "";
    $("overlay").hidden = false;
  }

  // Healthy is silent. The pill only appears for a problem.
  function live(cls, text) {
    var pill = $("live");
    if (!cls) { pill.hidden = true; return; }
    pill.className = "live " + cls;
    $("livetext").textContent = text;
    pill.hidden = false;
  }

  var REASONS = {
    "no-file":    "The thanks file has not been written yet.",
    "unreadable": "The thanks file could not be read.",
    "empty":      "There are no thanks in the current window.",
    "error":      "The list of thanks could not be built."
  };

  // -------------------------------------------------------------------- poll

  // A screen that has never loaded is being set up, not watched, and "waiting
  // for an answer" is no help to whoever is stood in front of it. The three
  // failures here need three different people to fix them, so the screen says
  // which one it is and which host it asked. The path is left off: the host
  // is the part that tells you whether it reached the right place at all.
  function remember(d) {
    if (!CACHE) return;
    try {
      localStorage.setItem(CACHE_STORE, JSON.stringify({ at: Date.now(), d: d }));
    } catch (e) {}
  }

  // Only ever called when the screen would otherwise be showing an error, and
  // it never pretends to be live: the pill stays up and says how old this is,
  // and the rail's own "Updated" line still reads from the payload, so a
  // restored board announces its age in two places without being asked.
  function recall() {
    if (!CACHE) return null;
    try {
      var raw = localStorage.getItem(CACHE_STORE);
      if (!raw) return null;
      var box = JSON.parse(raw);
      var hours = (Date.now() - box.at) / 3600000;
      if (!box.d || hours > CACHE_MAX_HOURS) return null;
      return { d: box.d, when: ago(new Date(box.at).toISOString()) };
    } catch (e) { return null; }
  }

  function why(err, url) {
    var host = url;
    try { host = new URL(url, location.href).host; } catch (e) {}

    var msg = (err && err.message) || "";

    if (location.protocol === "file:") {
      return "Opened as a file. It has to be served over http or https.";
    }
    if (/^HTTP 40[134]/.test(msg)) {
      return msg + " from " + host + ". The address is wrong, or the file is " +
             "not readable without signing in.";
    }
    if (/^HTTP /.test(msg)) {
      return msg + " from " + host + ".";
    }
    return "No answer from " + host + ". Either nothing there is reachable " +
           "from this screen, or it is not sending the header that allows " +
           "another site to read it.";
  }

  function load() {
    // The endpoint sends a 60 second public Cache-Control, which is right for
    // the network but would otherwise hand a refresh the same bytes back.
    var url = API + (API.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now();

    fetchJSON(url)
      .then(function (d) {
        if (!d || d.available === false) {
          overlay("&#9749;", "No thanks to show yet",
                  REASONS[(d && d.reason) || ""] || "Nothing is available right now.");
          live("stale", "Waiting for data");
          return;
        }

        overlay(null);
        live("");
        renderStats(d);
        renderWall(d.thanks || []);
        remember(d);
      })
      .catch(function (e) {
        // A dropped poll is not worth blanking a wall screen over. Keep the
        // last good board up and mark it, and only take over the screen if
        // there was never anything there to begin with.
        if (!$("stats").children.length) {
          // Nothing has ever been on this screen, so there is nothing to keep
          // up. Put back the last good board if one was kept and is still
          // recent enough to mean anything; otherwise say what went wrong.
          var back = recall();
          if (back) {
            overlay(null);
            renderStats(back.d);
            renderWall(back.d.thanks || []);
            live("stale", "Last board, " + back.when);
            return;
          }
          live("down", "Reconnecting");
          overlay("&#128246;", "Board is offline", why(e, API));
          return;
        }
        live("down", "Reconnecting");
      });
  }

  function loadNews() {
    var url = NEWS_API + (NEWS_API.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now();

    fetchJSON(url)
      .then(function (d) {
        var n = (d && d.available && d.current) ? d.current : null;
        // An issue titled for the month it is in tends to arrive dressed for
        // an email, stars and all. None of that survives a projector, and the
        // parts are cleaned before they are joined so a title that was nothing
        // but decoration does not leave its separator behind.
        $("edition").textContent = n
          ? [clean(n.title), clean(n.edition)].filter(Boolean).join("  \u00b7  ")
          : "";
        renderValues(n);
      })
      .catch(function () {
        // A dropped poll leaves whatever is already up there.
      });
  }

  // ------------------------------------------------------------------- clock

  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString(undefined, {
      hour: "2-digit", minute: "2-digit"
    });
  }
  tick();
  setInterval(tick, 15000);

  // -------------------------------------------------------------------- boot

  load();
  loadNews();
  if (REFRESH) {
    setInterval(load, REFRESH * 1000);
    // An issue is published every few weeks, so there is nothing to gain from
    // asking as often as the thanks. Every tenth poll, and never under 5 min.
    setInterval(loadNews, Math.max(300, REFRESH * 10) * 1000);
  }

  // A resize changes the rem scale. Nothing here is measured in JS, so the
  // layout follows on its own once the root has moved.
  // A resize changes the rem scale and every box with it, so everything that
  // was fitted to a box has to be fitted again.
  function refit() {
    if (lastStats) renderStats(lastStats);
    fitKickers();
    if (rest.length) { fitBy(); fitBox($("vtext"), VQUOTE_MAX, 0.34); }
    if (!$("band").hidden) fitBox($("vmain-text"), vmainMax, 0.45);
    var msgs = document.querySelectorAll(".cmsg");
    for (var i = 0; i < msgs.length; i++) fitBox(msgs[i], 1.35, 0.72);
    var whos = document.querySelectorAll(".crecip");
    for (var j = 0; j < whos.length; j++) fitLine(whos[j], 1.5, 0.95);
  }

  var resizing;
  window.addEventListener("resize", function () {
    clearTimeout(resizing);
    resizing = setTimeout(function () { applyScale(); refit(); }, 300);
  });

  // The web font lands after first paint and changes every measurement under
  // it, so what was fitted against the fallback is fitted again against the
  // real thing.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  setTimeout(refit, 1500);

  // Nothing on a wall screen should sleep, but a browser tab that has been
  // backgrounded comes back stale. Catch up on the way in.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { load(); loadNews(); }
  });
})();
</script>

</body>
</html>
