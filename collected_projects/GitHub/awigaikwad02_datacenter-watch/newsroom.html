<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="loader" aria-hidden="true"><div class="ld">
    <svg class="ld-mark" viewBox="0 0 48 48"><rect class="ld-outline" x="8" y="3.75" width="32" height="40.5" rx="7" fill="none" stroke="currentColor" stroke-width="3.5" pathLength="150"/><rect class="ld-bar b1" x="14" y="11" width="20" height="4.5" rx="2.25" fill="#B9F542"/><rect class="ld-bar b2" x="14" y="18.5" width="20" height="4.5" rx="2.25" fill="currentColor"/><rect class="ld-bar b3" x="14" y="26" width="20" height="4.5" rx="2.25" fill="currentColor"/><rect class="ld-bar b4" x="14" y="33.5" width="20" height="4.5" rx="2.25" fill="currentColor"/></svg>
    <p class="ld-text">Initializing The Rack Report…</p>
  </div></div>
  <aside class="sidebar" id="sidebar" aria-label="Site"></aside>
  <div class="shell-main">
    <header class="topbar" id="topbar"></header>
    <main id="main" tabindex="-1">
      <div class="page">
        <section class="page-hero">
          <span class="eyebrow">Newsroom</span>
          <h1>Every U.S. data center headline, filtered your way.</h1>
          <p class="lede">Announcements, expansions, land deals, power and permitting fights from hundreds of U.S. outlets. Filter by company, state, topic or source; everything updates instantly.</p>
        </section>

        <div id="featured" style="margin-top:28px"><div class="skel" style="height:210px"></div></div>

        <section class="filters" id="filters" aria-label="Filter headlines">
          <div class="filter-row">
            <label class="search grow"><span class="sr-only">Search headlines</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" class="input" type="search" placeholder="Search headlines, places, companies…" autocomplete="off"></label>
            <label class="field"><span class="sr-only">Company</span><select id="company" class="select"><option value="">All companies</option></select></label>
            <label class="field"><span class="sr-only">State</span><select id="state" class="select"><option value="">All states</option></select></label>
            <label class="field"><span class="sr-only">Utility or grid operator</span><select id="utility" class="select"><option value="">All utilities</option></select></label>
            <label class="field"><span class="sr-only">Investor</span><select id="investor" class="select"><option value="">All investors</option></select></label>
            <label class="field"><span class="sr-only">Builder: contractor, engineer or architect</span><select id="builder" class="select"><option value="">All builders</option></select></label>
            <label class="field"><span class="sr-only">Supplier: equipment or chips</span><select id="supplier" class="select"><option value="">All suppliers</option></select></label>
            <label class="field"><span class="sr-only">Source</span><select id="source" class="select"><option value="">All sources</option></select></label>
            <label class="field"><span class="sr-only">Show</span><select id="saved" class="select"><option value="">All headlines</option><option value="1">Saved only</option></select></label>
          </div>
          <div class="filter-row2">
            <div class="seg" id="range" role="group" aria-label="Time range">
              <button data-range="1" aria-pressed="false">Today</button><button data-range="7" aria-pressed="true">This week</button><button data-range="31" aria-pressed="false">This month</button><button data-range="90" aria-pressed="false">90 days</button>
            </div>
            <div class="chips scroll" id="topics" role="group" aria-label="Topic"></div>
            <button class="switch" id="archiveBtn" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span>Include archive</button>
          </div>
          <p class="archive-note" id="archiveNote" aria-live="polite" hidden></p>
        </section>

        <div class="filter-meta">
          <div class="active-chips" id="active" aria-live="polite"></div>
          <div style="display:flex;gap:12px;align-items:center;margin-left:auto">
            <span class="result-count" id="count" aria-live="polite"></span>
            <div class="seg" id="view" role="group" aria-label="Layout"></div>
          </div>
        </div>

        <div id="feed"><div class="news-list" style="margin-top:20px"><div class="skel news"></div><div class="skel news"></div><div class="skel news"></div><div class="skel news"></div></div></div>
        <div style="display:flex;justify-content:center;margin-top:24px"><button class="btn" id="more" hidden>Show more headlines</button></div>
      </div>
    </main>
    <footer class="site-footer" id="footer"></footer>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
