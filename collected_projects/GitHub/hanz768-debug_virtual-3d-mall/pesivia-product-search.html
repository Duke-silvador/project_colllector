</style><style id="pesivia-single-back-fix">html body>header #pesivia-page-back{display:none!important}</style><style id="pesivia-home-link-style">html body>header .pesivia-home-link{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;min-height:42px!important;padding:9px 12px!important;margin:0!important;border:1px solid rgba(255,255,255,.78)!important;border-radius:13px!important;background:rgba(8,23,44,.42)!important;color:#fff!important;text-decoration:none!important;font:700 14px system-ui,sans-serif!important;text-shadow:0 1px 3px #000!important;white-space:nowrap!important;box-sizing:border-box!important}html body>header{flex-wrap:wrap!important;gap:8px!important}html body>header .pesivia-home-link:focus-visible{outline:2px solid white!important}</style><link rel="stylesheet" href="pesivia-inner-readable.css?v=792827b7"><link rel="stylesheet" href="pesivia-simple-interior.css?v=11c9952d"></head><body><header><a class="pesivia-home-link" href="pesivia-services-hub.html" aria-label="Home">⌂ Home</a><button id="back" type="button">← Back</button><select id="language" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option><option value="es">Español</option></select></header><main><h1 id="title">🔎 Find Products</h1><p id="intro">Search published products from PESIVIA sellers. Only actual listed products are shown.</p><form id="form" class="search"><input id="q" type="search" maxlength="100" placeholder="Product name, e.g. ring" required><button id="go" type="submit">Search Products</button></form><div id="status" class="status" role="status">Enter a product name to search.</div><div id="grid" class="grid"></div></main><footer id="footer">Product listings are informational. Checkout is not enabled on this page.</footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const labels={en:{back:'← Back',title:'🔎 Find Products',intro:'Search published products from PESIVIA sellers. Only actual listed products are shown.',placeholder:'Product name, e.g. ring',go:'Search Products',initial:'Enter a product name to search.',loading:'Searching published products…',empty:'No matching published products found.',error:'Unable to search products. Please try again.',connection:'Product search connection is unavailable.',view:'View Product Store',footer:'Product listings are informational. Checkout is not enabled on this page.',results:' matching products'},fa:{back:'← بازگشت',title:'🔎 پیدا کردن محصول',intro:'در محصولات منتشرشده فروشندگان PESIVIA جستجو کنید. فقط محصولات واقعی نمایش داده می‌شوند.',placeholder:'نام محصول، مانند انگشتر',go:'جستجوی محصول',initial:'برای جستجو نام محصول را وارد کنید.',loading:'در حال جستجوی محصولات…',empty:'محصول منتشرشده‌ای پیدا نشد.',error:'جستجوی محصولات انجام نشد. دوباره تلاش کنید.',connection:'اتصال جستجوی محصول در دسترس نیست.',view:'مشاهده فروشگاه محصول',footer:'پرداخت در این صفحه فعال نیست.',results:' محصول پیدا شد'},es:{back:'← Volver',title:'🔎 Buscar productos',intro:'Busca productos publicados por vendedores de PESIVIA. Solo se muestran anuncios reales.',placeholder:'Nombre del producto, p. ej. anillo',go:'Buscar productos',initial:'Introduce el nombre de un producto.',loading:'Buscando productos…',empty:'No se encontraron productos publicados.',error:'No se pudo buscar. Inténtalo de nuevo.',connection:'La búsqueda no está disponible.',view:'Ver tienda del producto',footer:'Los pagos no están disponibles aquí.',results:' productos encontrados'}};
const params=new URLSearchParams(location.search),language=document.getElementById('language'),query=document.getElementById('q'),grid=document.getElementById('grid'),status=document.getElementById('status');let lang='en';try{lang=labels[params.get('lang')]?params.get('lang'):(labels[localStorage.getItem('pesivia-market-language')]?localStorage.getItem('pesivia-market-language'):'en')}catch(e){}const t=k=>labels[lang][k]||labels.en[k];
function setLang(l){lang=labels[l]?l:'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';language.value=lang;for(const id of ['back','title','intro','go','footer'])document.getElementById(id).textContent=t(id);query.placeholder=t('placeholder');try{localStorage.setItem('pesivia-market-language',lang)}catch(e){}}language.onchange=e=>setLang(e.target.value);setLang(lang);
document.getElementById('back').onclick=()=>{location.href='pesivia-services-hub.html?lang='+encodeURIComponent(lang)};
function safeTerm(s){return s.replace(/[,%()]/g,' ').trim().slice(0,100)}
let seq=0;
async function search(){const term=query.value.trim();if(!term){status.textContent=t('initial');return}const request=++seq;grid.replaceChildren();status.textContent=t('loading');if(!window.supabase||!window.MALL_SUPABASE_PUBLISHABLE_KEY){status.textContent=t('connection');return}
try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const q=safeTerm(term);if(!q){status.textContent=t('initial');return}const {data,error}=await api.from('mall_products').select('id,unit_id,title,description,price_cents,currency').eq('status','published').or('title.ilike.%'+q+'%,description.ilike.%'+q+'%').limit(50);if(request!==seq)return;if(error)throw error;const products=data||[];if(!products.length){status.textContent=t('empty');return}const ids=[...new Set(products.map(p=>p.unit_id).filter(Boolean))];const units=new Map();if(ids.length){const result=await api.from('mall_units').select('id,market_id,unit_number').in('id',ids);if(!result.error)for(const u of result.data||[])units.set(u.id,u)}if(request!==seq)return;status.textContent=products.length+t('results');for(const p of products){const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=p.title||'Product';const desc=document.createElement('p');desc.className='muted';desc.textContent=p.description||'';const price=document.createElement('div');price.className='price';price.textContent=(Number(p.price_cents||0)/100).toFixed(2)+' '+(p.currency||'USD');card.append(h,desc,price);const u=units.get(p.unit_id);if(u){const a=document.createElement('a');a.href='pesivia-storefront.html?market='+encodeURIComponent(u.market_id)+'&unit='+encodeURIComponent(u.unit_number)+'&lang='+encodeURIComponent(lang);a.textContent=t('view');card.append(a)}grid.append(card)}}catch(e){if(request===seq)status.textContent=t('error')}}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const p=new URLSearchParams(location.search);p.set('q',query.value.trim());p.set('lang',lang);history.replaceState(null,'','?'+p);search()};query.value=params.get('q')||'';if(query.value)search();
</script></body></html>
