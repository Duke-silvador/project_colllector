function display(x,z,rotation=0){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotation;scene.add(g);box(3.4,.22,1.35,0,.82,0,black,g);box(3.55,.08,1.48,0,.97,0,gold,g);box(3.45,.12,1.42,0,1.77,0,gold,g);for(const sx of [-1,1])for(const sz of [-1,1])box(.045,.78,.045,sx*1.65,1.38,sz*.63,gold,g);for(const sx of [-1,1])box(.02,.76,1.24,sx*1.68,1.38,0,glass,g);for(const sz of [-1,1])box(3.3,.76,.02,0,1.38,sz*.64,glass,g);box(3.3,.02,1.2,0,1.76,0,glass,g);box(3.2,.055,1.17,0,1.03,0,velvet,g);for(let i=-1;i<=1;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(.18,.045,10,32),gold);ring.rotation.x=Math.PI/2;ring.position.set(i*.91,1.17,0);g.add(ring);const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.14,0),new THREE.MeshPhysicalMaterial({color:i===0?0xdceaff:0x86bbbd,metalness:.08,roughness:.04,transmission:.2,clearcoat:1}));gem.position.set(i*.91,1.32,0);g.add(gem)}return g}

for(const side of [-1,1])for(let z=-8;z<=8;z+=5.3){const niche=box(.1,4,3.9,side*12.05,3.6,z,black);box(.12,.08,3.9,side*11.93,1.58,z,gold);box(.12,.08,3.9,side*11.93,5.62,z,gold);const frame=box(.09,3.6,.09,side*11.93,3.6,z-1.95,gold);box(.09,3.6,.09,side*11.93,3.6,z+1.95,gold)}

const joy=document.getElementById('joy'),nub=document.getElementById('nub');function stick(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(dx,dy)),f=Math.min(1,38/l);joyX=dx*f/38;joyY=dy*f/38;nub.style.transform='translate('+joyX*38+'px,'+joyY*38+'px)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);stick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))stick(e)});function stop(){joyX=joyY=0;nub.style.transform=''}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
