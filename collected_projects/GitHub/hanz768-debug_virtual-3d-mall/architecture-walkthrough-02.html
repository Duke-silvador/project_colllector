<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PESIVIA — Architecture Walkthrough 02</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:0;left:0;right:0;padding:20px;background:linear-gradient(#08121bd9,transparent);display:flex;justify-content:space-between;align-items:flex-start}h1{font-size:18px;letter-spacing:.15em;margin:0}#info{font-size:11px;color:#dfd4c1;text-align:left;line-height:1.7}#bar{position:absolute;bottom:0;left:0;right:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#08121bd9);display:flex;gap:9px;align-items:end;justify-content:space-between}button{pointer-events:auto;border:1px solid #c8ab7a88;background:#1b2935d9;color:#fff;padding:11px 13px;border-radius:9px;font:12px system-ui;cursor:pointer}#joy{position:absolute;bottom:120px;left:22px;width:108px;height:108px;border:1px solid #ffffff55;border-radius:50%;background:#fff1;pointer-events:auto;touch-action:none}#knob{width:36px;height:36px;position:absolute;top:36px;left:36px;border-radius:50%;background:#d6ba89aa}#loading{position:fixed;inset:0;z-index:10;background:#0e171f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}#loading strong{font-size:25px;letter-spacing:.25em}#progress{color:#d8c5a4;font-size:13px;line-height:1.8}#loading button{display:none}@media(min-width:800px){#joy{display:none}}@media(max-width:600px){h1{font-size:14px}#bar{font-size:10px}button{padding:9px;font-size:11px}#info{font-size:10px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body><div id="loading"><strong>PESIVIA</strong><div id="progress">در حال دریافت مدل معماری حرفه‌ای با متریال‌های واقعی PBR…<br>بارگذاری اولیه ممکن است کمی طول بکشد.</div><button id="retry">تلاش مجدد</button></div><div id="ui"><div id="top"><div><h1>PESIVIA WORLD</h1><div style="color:#e4cda6;font-size:11px">ARCHITECTURE WALKTHROUGH · PBR</div></div><div id="info"><span id="fps">— FPS</span><br><span id="mode">HIGH FIDELITY · GLTF</span></div></div><div id="joy"><div id="knob"></div></div><div id="bar"><span>برای نگاه‌کردن صفحه را بکشید؛ با جوی‌استیک یا WASD حرکت کنید.</span><div style="display:flex;gap:5px"><button id="reset">شروع مجدد</button><button id="quality">کیفیت: خودکار</button></div></div></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101923);scene.fog=new THREE.Fog(0x101923,65,145);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,150);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;pmrem.dispose();
const mobile=matchMedia('(pointer:coarse)').matches;let quality='auto';function resize(){const ratio=quality==='low'?.8:quality==='high'?Math.min(devicePixelRatio,1.8):Math.min(devicePixelRatio,mobile?1.1:1.5);renderer.setPixelRatio(ratio);renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);
document.getElementById('quality').onclick=()=>{quality=quality==='auto'?'high':quality==='high'?'low':'auto';document.getElementById('quality').textContent='کیفیت: '+({auto:'خودکار',high:'بالا',low:'سبک'}[quality]);resize()};
scene.add(new THREE.HemisphereLight(0xd9e7ff,0x897358,1.5));const sun=new THREE.DirectionalLight(0xffe5c3,2.1);sun.position.set(-13,26,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-32;sun.shadow.camera.right=32;sun.shadow.camera.top=32;sun.shadow.camera.bottom=-32;scene.add(sun);
const fill=new THREE.DirectionalLight(0xb4d4ff,.75);fill.position.set(8,12,-14);scene.add(fill);
let center=new THREE.Vector3(),height=14,px=0,pz=0,yaw=0,pitch=0,sceneModel=null,worldBounds=null,walkBounds=null,drag=false,lx=0,ly=0,joyX=0,joyY=0,ready=false,keys=new Set(),last=0,frames=0,elapsed=0;
function reset(){px=0;pz=0;yaw=0;pitch=0}document.getElementById('reset').onclick=reset;
const loader=new GLTFLoader();const url='https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Sponza/glTF/Sponza.gltf';
function load(){loader.load(url,gltf=>{const model=gltf.scene;model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),mid=bounds.getCenter(new THREE.Vector3());if(!Number.isFinite(size.y)||size.y<=0)throw Error('Invalid architecture');const scale=14/size.y;model.scale.setScalar(scale);model.position.set(-mid.x*scale,-bounds.min.y*scale,-mid.z*scale);model.traverse(o=>{if(o.isMesh){o.receiveShadow=true;o.castShadow=false;if(Array.isArray(o.material)){for(const m of o.material){if(m)m.side=THREE.FrontSide}}else if(o.material)o.material.side=THREE.FrontSide}});scene.add(model);model.updateMatrixWorld(true);sceneModel=model;worldBounds=new THREE.Box3().setFromObject(model);height=Math.max(size.x,size.z)*scale;walkBounds={minX:worldBounds.min.x+1.3,maxX:worldBounds.max.x-1.3,minZ:worldBounds.min.z+1.3,maxZ:worldBounds.max.z-1.3};reset();ready=true;document.getElementById('loading').remove();},xhr=>{if(xhr.total)document.getElementById('progress').textContent='در حال دریافت مدل و بافت‌ها: '+Math.round(xhr.loaded/xhr.total*100)+'٪';else document.getElementById('progress').textContent='در حال دریافت مدل و بافت‌های معماری…'},err=>{document.getElementById('progress').textContent='بارگذاری مدل انجام نشد. اتصال اینترنت یا دسترسی به فایل‌های مدل را بررسی کنید.';document.getElementById('retry').style.display='block';console.error(err)})}document.getElementById('retry').onclick=()=>{document.getElementById('retry').style.display='none';load()};load();
addEventListener('keydown',e=>{keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.004;pitch=THREE.MathUtils.clamp(pitch-(e.clientY-ly)*.003,-.9,.9);lx=e.clientX;ly=e.clientY});
const joy=document.getElementById('joy'),knob=document.getElementById('knob');function stick(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.max(1,Math.hypot(dx,dy)),f=Math.min(1,38/d);joyX=dx*f/38;joyY=dy*f/38;knob.style.transform='translate('+joyX*38+'px,'+joyY*38+'px)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);stick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))stick(e)});function release(){joyX=joyY=0;knob.style.transform=''}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(ready){const x=THREE.MathUtils.clamp(joyX+(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),-1,1),z=THREE.MathUtils.clamp(-joyY+(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0),-1,1);const nx=THREE.MathUtils.clamp(px+(Math.cos(yaw)*x+Math.sin(yaw)*z)*dt*3.2,walkBounds.minX,walkBounds.maxX),nz=THREE.MathUtils.clamp(pz+(Math.sin(yaw)*x-Math.cos(yaw)*z)*dt*3.2,walkBounds.minZ,walkBounds.maxZ);if(sceneModel){const ray=new THREE.Raycaster(),direction=new THREE.Vector3(nx-px,0,nz-pz),distance=direction.length();if(distance>.00001){direction.normalize();ray.set(new THREE.Vector3(px,1.55,pz),direction);ray.far=distance+.5;const hits=ray.intersectObject(sceneModel,true);if(!hits.length||hits[0].distance>distance+.35){px=nx;pz=nz}}}camera.position.set(px,1.75,pz);camera.lookAt(px+Math.sin(yaw)*10,1.75+Math.sin(pitch)*10,pz-Math.cos(yaw)*10)}renderer.render(scene,camera);frames++;elapsed+=dt;if(elapsed>1.3){document.getElementById('fps').textContent=Math.round(frames/elapsed)+' FPS';frames=0;elapsed=0}}requestAnimationFrame(frame);
</script></body></html>
