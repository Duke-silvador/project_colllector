<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشاهده مغازه | World Virtual Mall</title><style>body{margin:0;background:#f5f6f9;color:#192b40;font:16px Tahoma,Arial}header{background:#122940;color:#fff;padding:20px}header a{color:#e6bd75}main{max-width:750px;margin:30px auto;padding:16px}section{background:white;padding:28px;border-radius:18px;margin-bottom:18px}p{line-height:2}a.btn{display:inline-block;background:#e6bd75;padding:12px 16px;border-radius:9px;color:#182a3d;text-decoration:none}</style></head><body><header>🏬 World Virtual Mall　<a href="stores.html">فهرست مغازه‌ها</a></header><main><section><h1 id="title">مغازه</h1><p id="status" data-store-dynamic="true">در حال بررسی...</p><p>در این نسخه آزمایشی فقط اطلاعات تأییدشده و عمومی نمایش داده می‌شود. فیلم‌های در انتظار بررسی و محصولات پیش‌نویس عمومی نیستند.</p><a id="back" class="btn" href="stores.html">بازگشت به بازار</a></section><section><h2>محصولات منتشرشده</h2><div id="products" data-store-dynamic="true">در حال بررسی...</div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const params=new URLSearchParams(location.search),market=params.get('market'),num=Number(params.get('unit')),statusEl=document.getElementById('status'),productsEl=document.getElementById('products');
const language=()=>localStorage.getItem('wvm-language')==='fa'?'fa':'en';
const messages={en:{invalid:'Invalid store address.',connection:'Connection unavailable.',missing:'Store not found.',occupied:'This store is assigned.',reserved:'This store is reserved.',available:'This store is available for lease.',error:'Unable to load products.',empty:'No products have been published yet.',loading:'Loading...'},fa:{invalid:'نشانی مغازه نامعتبر است.',connection:'اتصال موجود نیست.',missing:'مغازه یافت نشد.',occupied:'مغازه واگذار شده است.',reserved:'مغازه رزرو شده است.',available:'مغازه آماده واگذاری است.',error:'خطا در دریافت محصولات.',empty:'هنوز محصول منتشرشده‌ای وجود ندارد.',loading:'در حال بررسی...'}};
let unitState=null,itemsState=null,loadError=null;
function renderStore(){const en=language()==='en',t=messages[language()];document.documentElement.lang=language();document.documentElement.dir=en?'ltr':'rtl';document.getElementById('title').textContent=(en?'Store ':'مغازه ')+String(num).padStart(3,'0');statusEl.textContent=loadError?t[loadError]:unitState?t[unitState]:t.loading;productsEl.replaceChildren();if(loadError){productsEl.textContent=loadError==='invalid'||loadError==='missing'?'':t[loadError];return}if(itemsState===null){productsEl.textContent=t.loading;return}if(!itemsState.length){productsEl.textContent=t.empty;return}for(const item of itemsState){const article=document.createElement('article'),heading=document.createElement('h3'),desc=document.createElement('p'),price=document.createElement('strong');heading.textContent=item.title;desc.textContent=item.description||'';price.textContent=(item.price_cents/100).toFixed(2)+' '+item.currency;article.append(heading,desc,price);productsEl.append(article)}}
document.getElementById('back').href='stores.html?market='+encodeURIComponent(market||'jewelry');
document.addEventListener('change',e=>{if(e.target?.id==='wvm-lang')setTimeout(renderStore,30)},true);
renderStore();
(async()=>{if(!market||!Number.isSafeInteger(num)||num<1){loadError='invalid';renderStore();return}if(!window.supabase||!window.MALL_SUPABASE_PUBLISHABLE_KEY){loadError='connection';renderStore();return}try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:u,error}=await api.from('mall_units').select('id,status').eq('market_id',market).eq('unit_number',num).maybeSingle();if(error||!u){loadError='missing';renderStore();return}unitState=u.status==='occupied'?'occupied':u.status==='reserved'?'reserved':'available';renderStore();const {data:items,error:e}=await api.from('mall_products').select('title,description,price_cents,currency').eq('unit_id',u.id).eq('status','published').limit(50);if(e){loadError='error';renderStore();return}itemsState=items||[];renderStore()}catch(e){loadError='connection';renderStore()}})();
</script><script src="language.js?v=storefix20261106"></script><script>document.addEventListener("DOMContentLoaded",()=>setTimeout(renderStore,100));window.addEventListener("pageshow",()=>setTimeout(renderStore,100));</script></body></html>
