<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PESIVIA | Activity</title><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;color:#fff;font:15px system-ui,sans-serif}header{display:flex;gap:9px;align-items:center;justify-content:space-between;padding:12px;flex-wrap:wrap}a,button,select{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 12px;background:#000d;border:1px solid #fffc;border-radius:11px;color:white;text-decoration:none;font:700 14px system-ui}main{max-width:760px;margin:12px auto;padding:12px}h1,h2,p{background:#000c;padding:9px 11px;border-radius:9px;line-height:1.5}h1{font-size:25px}h2{font-size:19px}.panel{border:1px solid #ffffffa0;border-radius:16px;padding:14px;margin:14px 0;background:#07182b22}.entry{border:1px solid #ffffff99;border-radius:11px;background:#000d;padding:12px;margin:9px 0;overflow-wrap:anywhere}.entry p{margin:5px 0}.entry a{margin-top:6px}small{color:#e1e1e1}button{cursor:pointer}</style><link rel="stylesheet" href="pesivia-simple-interior.css?v=11c9952d"></head><body><header><a href="pesivia-services-hub.html" id="home">⌂ Home</a><a href="pesivia-services-hub.html" id="back">← Back</a><select id="language" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option><option value="es">Español</option></select></header><main><h1 id="title">🔔 Activity & Notifications</h1><p id="intro">Your recent orders, messages and support updates. Refresh to check for new activity; push alerts are not enabled.</p><button id="refresh">↻ Refresh</button><p id="status" role="status">Checking your account…</p><section class="panel"><h2 id="orders-heading">📦 Product requests</h2><div id="orders"></div></section><section class="panel"><h2 id="messages-heading">💬 Recent messages</h2><div id="messages"></div></section><section class="panel"><h2 id="support-heading">🎧 Support tickets</h2><div id="support"></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let lang='en';try{const x=new URLSearchParams(location.search).get('lang')||localStorage.getItem('pesivia-market-language');if(['en','fa','es'].includes(x))lang=x}catch(e){}const translations={en:['🔔 Activity & Notifications','Your recent product requests, messages and support updates. Refresh to check for new activity; push alerts are not enabled.','↻ Refresh','📦 Product requests','💬 Recent messages','🎧 Support tickets','Nothing to show yet.','Log in to see your activity.','Updated.','Unable to load: '],fa:['🔔 فعالیت‌ها و اعلان‌ها','درخواست‌های محصول، پیام‌ها و پشتیبانی اخیر شما. برای بررسی موارد جدید تازه‌سازی کنید؛ اعلان فوری هنوز فعال نیست.','↻ تازه‌سازی','📦 درخواست‌های محصول','💬 پیام‌های اخیر','🎧 پشتیبانی','موردی وجود ندارد.','برای مشاهده فعالیت‌ها وارد حساب شوید.','به‌روز شد.','خطا در بارگذاری: '],es:['🔔 Actividad y notificaciones','Tus solicitudes, mensajes y soporte recientes. Actualiza para comprobar novedades; las notificaciones push no están activas.','↻ Actualizar','📦 Solicitudes','💬 Mensajes recientes','🎧 Soporte','Todavía no hay actividad.','Inicia sesión para ver tu actividad.','Actualizado.','Error al cargar: ']};function translate(){const t=translations[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';$('language').value=lang;['title','intro','refresh','orders-heading','messages-heading','support-heading'].forEach((id,i)=>$(id).textContent=t[i]);try{localStorage.setItem('pesivia-market-language',lang)}catch(e){}}$('language').onchange=e=>{lang=e.target.value;translate();load()};translate();
const api=window.supabase&&window.MALL_SUPABASE_URL&&window.MALL_SUPABASE_PUBLISHABLE_KEY?window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY):null;
function empty(id){const p=document.createElement('p');p.textContent=translations[lang][6];$(id).replaceChildren(p)}
function item(root,heading,detail,href,label){const box=document.createElement('article');box.className='entry';const h=document.createElement('strong');h.textContent=heading;const p=document.createElement('p');p.textContent=detail;box.append(h,p);if(href){const a=document.createElement('a');a.href=href;a.textContent=label;box.append(a)}root.append(box)}
async function load(){const button=$('refresh');button.disabled=true;['orders','messages','support'].forEach(id=>$(id).replaceChildren());try{if(!api)throw Error('Service configuration missing');const {data:{user},error:authError}=await api.auth.getUser();if(authError)throw authError;if(!user){$('status').replaceChildren();const a=document.createElement('a');a.href='auth.html';a.textContent=translations[lang][7];$('status').append(a);['orders','messages','support'].forEach(empty);return}
const {data:seller,error:sellerError}=await api.from('mall_sellers').select('id').eq('user_id',user.id).maybeSingle();if(sellerError)throw sellerError;
const [buyer,sales,tickets]=await Promise.all([
api.from('mall_order_requests').select('id,status,quantity,created_at').eq('buyer_id',user.id).order('created_at',{ascending:false}).limit(30),
seller?api.from('mall_order_requests').select('id,status,quantity,created_at').eq('seller_id',seller.id).order('created_at',{ascending:false}).limit(30):Promise.resolve({data:[],error:null}),
api.from('mall_support_tickets').select('id,subject,status,admin_note,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(30)]);
for(const result of [buyer,sales,tickets])if(result.error)throw result.error;
const orders=[...new Map([...(buyer.data||[]),...(sales.data||[])].map(x=>[x.id,x])).values()].sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at));
if(!orders.length)empty('orders');for(const o of orders)item($('orders'),'Request '+o.id.slice(0,8),'Status: '+o.status+' · Quantity: '+o.quantity+' · '+new Date(o.created_at).toLocaleString(),'pesivia-orders.html','View requests');
const requestIds=orders.map(o=>o.id);if(!requestIds.length)empty('messages');else{const {data:messages,error:messageError}=await api.from('mall_request_messages').select('request_id,sender_id,body,created_at').in('request_id',requestIds).order('created_at',{ascending:false}).limit(30);if(messageError)throw messageError;const others=(messages||[]).filter(m=>m.sender_id!==user.id);if(!others.length)empty('messages');for(const m of others)item($('messages'),'Message · request '+m.request_id.slice(0,8),m.body.slice(0,160)+' · '+new Date(m.created_at).toLocaleString(),'pesivia-messages.html','Open messages')}
if(!tickets.data?.length)empty('support');for(const t of tickets.data||[])item($('support'),t.subject,'Status: '+t.status+(t.admin_note?' · Reply: '+t.admin_note.slice(0,140):'')+' · '+new Date(t.created_at).toLocaleString(),'pesivia-support.html','View support');
$('status').textContent=translations[lang][8];
}catch(e){$('status').textContent=translations[lang][9]+(e.message||'Unknown error')}finally{button.disabled=false}}
$('refresh').onclick=load;load();
})();
</script></body></html>
