<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PESIVIA | Login & My Account</title>
<link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b">
<style>
*{box-sizing:border-box}html{min-width:0;overflow-x:hidden}body{margin:0;min-height:100svh;color:#fff;font:16px system-ui,-apple-system,sans-serif;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:rgba(5,17,34,.2);border-bottom:1px solid #ffffff70}
.top button,.top select{color:#fff;background:rgba(5,17,34,.48);border:1px solid #ffffffb5;border-radius:14px;padding:11px 13px;font:700 15px system-ui;min-height:44px}
.top select{max-width:125px}option{background:#13213a;color:#fff}
main{max-width:540px;margin:24px auto;padding:0 15px 60px}
.brand{text-align:center;font-weight:800;font-size:22px;text-shadow:0 2px 5px #000;margin:10px 0 22px}
.panel{border:1px solid #ffffffa0;border-radius:20px;background:rgba(8,22,44,.19);padding:22px 19px;box-shadow:0 3px 12px #0002}
h1{font-size:27px;margin:0 0 14px;text-shadow:0 2px 5px #000}
p{line-height:1.6;text-shadow:0 2px 4px #000;overflow-wrap:anywhere}
label{display:block;font-weight:650;margin:16px 0 7px}
input{width:100%;min-height:48px;background:rgba(7,20,39,.72);color:white;border:1px solid #ffffffa6;border-radius:12px;padding:12px;font:inherit}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button.action,.action-link{display:inline-flex;align-items:center;justify-content:center;min-height:45px;border:1px solid #ffffffa8;border-radius:12px;padding:10px 15px;color:#fff;background:rgba(8,26,52,.55);font:700 15px system-ui;text-decoration:none;cursor:pointer}
button.primary,.action-link.primary{background:rgba(14,58,97,.72)}
button:disabled{opacity:.5;cursor:wait}
#account{display:none}#message:empty{display:none}#message{padding:12px;border-radius:11px;background:rgba(8,22,44,.7);margin-top:14px;overflow-wrap:anywhere}
.note{font-size:13px;color:#fff;text-shadow:0 1px 4px #000;margin-top:20px}
@media(max-width:390px){.panel{padding:17px 14px}.brand{font-size:19px}h1{font-size:24px}}
</style><style id="pesivia-login-visual-v3">
/* Readable, compact mobile login; shared mall photograph stays visible */
html body .top button,html body .top select,html body .panel button.action,html body .panel a.action-link{
color:#fff!important;-webkit-text-fill-color:#fff!important;
text-shadow:0 1px 3px #000!important;font-weight:750!important;
background:rgba(7,23,46,.45)!important;border:1px solid rgba(255,255,255,.78)!important;
box-shadow:inset 0 1px rgba(255,255,255,.2)!important;
-webkit-backdrop-filter:blur(1px)!important;backdrop-filter:blur(1px)!important;
}
html body .top select option{color:#fff!important;background:#12223d!important}
html body main{margin:10px auto!important;padding:0 15px 38px!important}
html body .brand{font-size:20px!important;margin:10px 0 13px!important}
html body .panel{padding:18px 16px!important;border:1px solid rgba(255,255,255,.62)!important;background:rgba(5,16,34,.09)!important;box-shadow:none!important}
html body .panel h1{font-size:25px!important;margin:0 0 8px!important;color:#fff!important}
html body .panel p{font-size:14px!important;line-height:1.5!important;margin:8px 0 12px!important;color:#fff!important}
html body .panel label{font-size:14px!important;margin:12px 0 5px!important;color:#fff!important}
html body .panel input{min-height:44px!important;padding:10px 12px!important;background:rgba(5,19,38,.43)!important;border:1px solid #ffffff9c!important;color:#fff!important}
html body .panel .actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:9px!important;margin:14px 0 8px!important}
html body .panel .actions button,html body .panel .actions a{min-width:0!important;min-height:46px!important;padding:9px 8px!important;font-size:13px!important;white-space:normal!important;text-align:center!important}
html body #reset{grid-column:1/-1!important;justify-self:center!important;width:min(100%,240px)!important}
html body #note{font-size:12px!important;opacity:.92!important;margin-top:15px!important}
@media(max-width:380px){html body .panel{padding:14px 12px!important}html body .panel .actions button{font-size:12px!important}}
</style><style id="pesivia-signup-form-fix">html body #signup-extra[hidden],html body #cancel-signup[hidden],html body #login[hidden],html body #reset[hidden]{display:none!important}html body #signup-extra label{display:block!important}html body #signup-extra input{width:100%!important;min-height:44px!important}</style><style id="pesivia-home-link-style">html body>header .pesivia-home-link{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;min-height:42px!important;padding:9px 12px!important;margin:0!important;border:1px solid rgba(255,255,255,.78)!important;border-radius:13px!important;background:rgba(8,23,44,.42)!important;color:#fff!important;text-decoration:none!important;font:700 14px system-ui,sans-serif!important;text-shadow:0 1px 3px #000!important;white-space:nowrap!important;box-sizing:border-box!important}html body>header{flex-wrap:wrap!important;gap:8px!important}html body>header .pesivia-home-link:focus-visible{outline:2px solid white!important}</style><link rel="stylesheet" href="pesivia-inner-readable.css?v=792827b7"><link rel="stylesheet" href="pesivia-simple-interior.css?v=11c9952d"></head><body>
<header class="top"><a class="pesivia-home-link" href="pesivia-services-hub.html" aria-label="Home">⌂ Home</a><button type="button" id="back">← Back</button><select id="language" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option><option value="es">Español</option></select></header>
<main><div class="brand">🌐 PESIVIA Virtual Mall</div><section class="panel">
<h1 id="title">Login</h1><p id="intro">Sign in to your PESIVIA marketplace account.</p>
<div id="forms"><label for="email" id="email-label">Email</label><input id="email" type="email" autocomplete="email" inputmode="email">
<label for="password" id="password-label">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8">
<div class="actions"><button class="action primary" id="login">Log In</button><a class="action" id="signup" href="./pesivia-signup.html" role="button">Create Account</a><button class="action" id="reset">Forgot Password?</button></div></div>
<div id="account" hidden></div>
<div id="message" role="status" aria-live="polite"></div><p class="note" id="note">Store access depends on seller approval. Payments and rentals are not yet active.</p>
</section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const translations={
en:{back:'← Back',titleLogin:'Login',titleAccount:'My Account',intro:'Sign in to your PESIVIA marketplace account.',email:'Email',password:'Password',login:'Log In',signup:'Create Account',reset:'Forgot Password?',dashboard:'Open My Store',logout:'Log Out',signed:'Signed in as:',note:'Store access depends on seller approval. Payments and rentals are not yet active.',missing:'Enter your email address.',short:'Password must contain at least 8 characters.',success:'Signed in successfully.',sent:'Check your email for the next step.',resetSent:'If this email is registered, recovery instructions will be sent.',connection:'Login service is not available. Please try again later.',error:'Connection error: '},
fa:{back:'← بازگشت',titleLogin:'ورود',titleAccount:'حساب من',intro:'برای ورود به حساب بازار PESIVIA اطلاعات خود را وارد کنید.',email:'ایمیل',password:'رمز عبور',login:'ورود',signup:'ایجاد حساب',reset:'بازیابی رمز',dashboard:'ورود به فروشگاه من',logout:'خروج از حساب',signed:'وارد شده با:',note:'دسترسی به فروشگاه به تأیید فروشنده بستگی دارد. پرداخت و اجاره هنوز فعال نیست.',missing:'ایمیل خود را وارد کنید.',short:'رمز عبور باید حداقل ۸ کاراکتر باشد.',success:'ورود موفق بود.',sent:'برای مرحله بعد ایمیل خود را بررسی کنید.',resetSent:'اگر ایمیل ثبت شده باشد، راهنمای بازیابی ارسال می‌شود.',connection:'خدمات ورود در دسترس نیست. دوباره تلاش کنید.',error:'خطای ارتباط: '},
es:{back:'← Volver',titleLogin:'Iniciar sesión',titleAccount:'Mi cuenta',intro:'Accede a tu cuenta del mercado PESIVIA.',email:'Correo electrónico',password:'Contraseña',login:'Entrar',signup:'Crear cuenta',reset:'¿Olvidaste tu contraseña?',dashboard:'Abrir mi tienda',logout:'Cerrar sesión',signed:'Sesión iniciada como:',note:'El acceso a la tienda requiere aprobación. Los pagos y alquileres aún no están activos.',missing:'Introduce tu correo.',short:'La contraseña debe tener al menos 8 caracteres.',success:'Sesión iniciada.',sent:'Revisa tu correo electrónico.',resetSent:'Si existe esta cuenta, recibirás instrucciones.',connection:'El inicio de sesión no está disponible.',error:'Error de conexión: '}};
let lang='en',currentUser=null,client=null;
try{const stored=localStorage.getItem('pesivia-market-language')||localStorage.getItem('wvm-language');if(translations[stored])lang=stored}catch(e){}
const t=k=>translations[lang][k]||translations.en[k];
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
 $('language').value=lang;$('back').textContent=t('back');
 $('title').textContent=t(currentUser?'titleAccount':'titleLogin');
 $('intro').hidden=!!currentUser;$('intro').textContent=t('intro');
 $('email-label').textContent=t('email');$('password-label').textContent=t('password');
 for(const id of ['login','signup','reset'])$(id).textContent=t(id);
 $('note').textContent=t('note');
 $('forms').style.display=currentUser?'none':'block';
}
function message(key,raw){$('message').textContent=raw||t(key)}
$('language').addEventListener('change',()=>{lang=$('language').value;try{localStorage.setItem('pesivia-market-language',lang);localStorage.setItem('wvm-language',lang)}catch(e){}render()});
$('back').onclick=()=>{let ref;try{ref=new URL(document.referrer)}catch(e){}if(ref&&ref.origin===location.origin&&ref.pathname!==location.pathname)location.href=ref.href;else location.href='pesivia-services-hub.html'};
render();
const key=window.MALL_SUPABASE_PUBLISHABLE_KEY,url=window.MALL_SUPABASE_URL;
if(!(window.supabase&&url&&key&&!key.startsWith('REPLACE_'))){message('connection');['login','signup','reset'].forEach(id=>$(id).disabled=true);return}
client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let navigating=false;function goToStore(){if(navigating)return;navigating=true;window.location.replace(new URL('my-store.html',location.href).href)}
client.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;if(currentUser&&_event==='SIGNED_IN')goToStore();else render()});
client.auth.getUser().then(({data,error})=>{currentUser=data?.user||null;if(currentUser)goToStore();else render();if(error&&error.name!=='AuthSessionMissingError')message('connection')}).catch(()=>message('connection'));
async function act(type){
 const email=$('email').value.trim(),password=$('password').value;
 if(!email){message('missing');$('email').focus();return}if(!$('email').checkValidity()){message('',lang==='fa'?'ایمیل معتبر وارد کنید.':'Enter a valid email address.');$('email').focus();return}if(type!=='reset'&&password.length<8){message('short');$('password').focus();return}
 ['login','signup','reset'].forEach(id=>$(id).disabled=true);
 try{let r;if(type==='login')r=await client.auth.signInWithPassword({email,password});else r=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(r.error)message('',r.error.message);else if(type==='login'){currentUser=r.data?.user||null;if(currentUser)goToStore();else message('connection');}else message('resetSent')}
 catch(e){message('',t('error')+e.message)}finally{['login','signup','reset'].forEach(id=>$(id).disabled=false)}
}
$('login').onclick=()=>act('login');$('reset').onclick=()=>act('reset');

})();
</script></body></html>
