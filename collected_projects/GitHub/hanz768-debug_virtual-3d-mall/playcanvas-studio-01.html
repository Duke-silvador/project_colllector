<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PESIVIA | PlayCanvas Studio</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101720;color:#f8f1e4;font:13px system-ui}canvas{display:block;touch-action:none}#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px;background:linear-gradient(#09121bcf,transparent);pointer-events:none}h1{font-size:17px;letter-spacing:.14em;margin:0}#info{text-align:left;line-height:1.7}small{color:#dfc69a}#bottom{position:fixed;bottom:0;left:0;right:0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#09121bcf);display:flex;justify-content:space-between;gap:10px;align-items:end;pointer-events:none}button{pointer-events:auto;background:#1e303ac9;border:1px solid #c3a474a8;color:#fff;border-radius:9px;padding:11px 14px;font:inherit}#joystick{position:fixed;left:24px;bottom:112px;width:108px;height:108px;border-radius:100%;border:1px solid #ffffff80;background:#ffffff1b;touch-action:none}#nub{position:absolute;left:36px;top:36px;width:36px;height:36px;border-radius:50%;background:#c7a676bb}#loading{position:fixed;inset:0;z-index:10;background:#101720;display:grid;place-content:center;text-align:center;gap:12px;padding:25px}#loading strong{font-size:26px;letter-spacing:.2em}#loading p{color:#d8c49f}#error{color:#ffb5a4;max-width:350px}@media(min-width:800px){#joystick{display:none}}@media(max-width:600px){h1{font-size:14px}#bottom{font-size:10px}button{font-size:11px;padding:9px}#info{font-size:10px}}</style><script src="https://cdn.jsdelivr.net/npm/playcanvas@2.9.2/build/playcanvas.min.js"></script></head><body><div id="loading"><strong>PESIVIA</strong><p>PlayCanvas · Architectural Rendering Prototype</p><div id="error"></div></div><div id="top"><div><h1>PESIVIA WORLD</h1><small>PLAYCANVAS · FIRST SCENE</small></div><div id="info"><span id="fps">— FPS</span><br><small>WEBGL · MOBILE + DESKTOP</small></div></div><div id="joystick"><div id="nub"></div></div><div id="bottom"><span>حرکت: WASD یا جوی‌استیک<br>نگاه: کشیدن روی صفحه</span><div><button id="reset">شروع مجدد</button> <button id="quality">کیفیت: خودکار</button></div></div><script>
(async function(){try{
if(!window.pc)throw Error('PlayCanvas library could not load');
const canvas=document.createElement('canvas');document.body.insertBefore(canvas,document.getElementById('top'));
const app=new pc.Application(canvas,{graphicsDeviceOptions:{alpha:false,antialias:true,preserveDrawingBuffer:false},mouse:new pc.Mouse(canvas),touch:new pc.TouchDevice(canvas)});
app.start();app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);
app.scene.ambientLight=new pc.Color(.32,.35,.4);app.scene.exposure=1.1;app.scene.gammaCorrection=pc.GAMMA_SRGB;app.scene.toneMapping=pc.TONEMAP_ACES;
const mat=(r,g,b,metal=0,rough=.5,emissive=0)=>{const m=new pc.StandardMaterial();m.diffuse=new pc.Color(r,g,b);m.metalness=metal;m.useMetalness=true;m.gloss=1-rough;if(emissive){m.emissive=new pc.Color(r*emissive,g*emissive,b*emissive)}m.update();return m};
const stone=mat(.72,.69,.64,.03,.28),floorMat=mat(.83,.81,.76,.12,.14),gold=mat(.67,.48,.23,.83,.2),dark=mat(.09,.12,.15,.25,.38),black=mat(.04,.06,.07,.35,.3),light=mat(1,.81,.52,.1,.3,1.6),glass=mat(.35,.64,.72,.2,.12),green=mat(.09,.3,.2,0,.8),brown=mat(.31,.2,.12,0,.8);
function cube(name,pos,size,material){const e=new pc.Entity(name);e.addComponent('render',{type:'box'});e.setPosition(...pos);e.setLocalScale(...size);e.render.material=material;app.root.addChild(e);return e}
function ball(name,pos,size,material){const e=new pc.Entity(name);e.addComponent('render',{type:'sphere'});e.setPosition(...pos);e.setLocalScale(...size);e.render.material=material;app.root.addChild(e);return e}
function cylinder(name,pos,size,material){const e=new pc.Entity(name);e.addComponent('render',{type:'cylinder'});e.setPosition(...pos);e.setLocalScale(...size);e.render.material=material;app.root.addChild(e);return e}
cube('Marble floor',[0,-.12,0],[24,.25,24],floorMat);cube('Rear wall',[0,4,-12],[24,8,.45],stone);for(const x of [-12,12])cube('Side wall',[x,4,0],[.45,8,24],stone);
cube('Ceiling',[0,8.4,0],[24,.3,24],dark);
for(const x of [-10,10]){for(const z of [-9,-3,3,9]){cube('Stone column',[x,3.8,z],[.62,7.6,.65],stone);cube('Gold capital',[x,7.65,z],[.95,.16,.95],gold);cube('Gold base',[x,.17,z],[.9,.25,.9],gold)}cube('Cove lighting',[x,7.9,0],[.07,.1,22],light)}
for(const z of [-8,-2,4,10]){cube('Ceiling beam',[0,8.12,z],[21,.12,.18],gold);cube('Warm LED strip',[0,8.02,z],[20,.05,.07],light)}
for(const x of [-6,0,6])for(const z of [-6,2,8]){const lamp=new pc.Entity('Ceiling spotlight');lamp.addComponent('light',{type:'omni',color:new pc.Color(1,.83,.63),intensity:1.3,range:9,castShadows:false});lamp.setPosition(x,7.5,z);app.root.addChild(lamp)}
const hemi=new pc.Entity('Key light');hemi.addComponent('light',{type:'directional',color:new pc.Color(1,.94,.84),intensity:2.2,castShadows:true,shadowResolution:1024,shadowDistance:40});hemi.setEulerAngles(55,25,0);app.root.addChild(hemi);
for(const x of [-6,6])for(const z of [-5,5]){cube('Showcase base',[x,.65,z],[3,1.3,1.3],black);cube('Showcase trim',[x,1.34,z],[3.1,.1,1.4],gold);cube('Glass showcase',[x,1.8,z],[3,.8,1.3],glass);cube('Showcase top',[x,2.24,z],[3.1,.08,1.4],gold);for(let i=-1;i<=1;i++){ball('Gold jewelry',[x+i*.75,1.7,z],[.25,.25,.25],gold);ball('Gemstone',[x+i*.75,1.86,z],[.13,.13,.13],glass)}}
cylinder('Sculpture pedestal',[0,.4,0],[2.8,.8,2.8],black);cylinder('Gold sculpture stand',[0,.84,0],[2.6,.12,2.6],gold);
const centerpiece=ball('Crystal sculpture',[0,2.1,0],[1.6,2.3,1.6],glass);for(let i=0;i<10;i++){const a=i*Math.PI*2/10;ball('Gold orbit',[Math.cos(a)*1.35,1.7+Math.sin(a*2)*.45,Math.sin(a)*1.35],[.19,.19,.19],gold)}
for(const x of [-9,9])for(const z of [-8,8]){cylinder('Planter',[x,.4,z],[1.2,.8,1.2],black);cylinder('Trunk',[x,1.4,z],[.2,1.8,.2],brown);for(let i=0;i<9;i++){const a=i*Math.PI*2/9;ball('Leaves',[x+Math.cos(a)*.6,2.4+(i%3)*.16,z+Math.sin(a)*.6],[.8,.45,1.05],green)}}
const camera=new pc.Entity('Camera');camera.addComponent('camera',{clearColor:new pc.Color(.06,.09,.12),fov:65,nearClip:.06,farClip:90});app.root.addChild(camera);
let px=0,pz=8,yaw=0,pitch=0,keys=new Set(),joyX=0,joyY=0,drag=false,lastX=0,lastY=0;
const reset=()=>{px=0;pz=8;yaw=0;pitch=0};document.getElementById('reset').onclick=reset;
addEventListener('keydown',e=>{keys.add(e.code);if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
canvas.style.touchAction='none';canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.25;pitch=Math.max(-45,Math.min(45,pitch-(e.clientY-lastY)*.2));lastX=e.clientX;lastY=e.clientY});
const joy=document.getElementById('joystick'),nub=document.getElementById('nub');function stick(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.max(1,Math.hypot(dx,dy)),f=Math.min(1,37/d);joyX=dx*f/37;joyY=dy*f/37;nub.style.transform='translate('+joyX*37+'px,'+joyY*37+'px)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);stick(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))stick(e)});function release(){joyX=joyY=0;nub.style.transform=''}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
let quality='auto';document.getElementById('quality').onclick=()=>{quality=quality==='auto'?'high':quality==='high'?'low':'auto';document.getElementById('quality').textContent='کیفیت: '+({auto:'خودکار',high:'بالا',low:'سبک'}[quality]);app.graphicsDevice.maxPixelRatio=quality==='low'?1:quality==='high'?Math.min(devicePixelRatio,2):Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.25:1.6);app.resizeCanvas()};
app.graphicsDevice.maxPixelRatio=Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.25:1.6);
let time=0,frames=0;app.on('update',dt=>{const sx=Math.max(-1,Math.min(1,joyX+(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0))),sz=Math.max(-1,Math.min(1,-joyY+(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0))),rad=yaw*Math.PI/180;px=Math.max(-9.4,Math.min(9.4,px+(Math.cos(rad)*sx+Math.sin(rad)*sz)*dt*3.3));pz=Math.max(-10,Math.min(10,pz+(Math.sin(rad)*sx-Math.cos(rad)*sz)*dt*3.3));camera.setPosition(px,1.75,pz);camera.setEulerAngles(pitch,yaw,0);centerpiece.rotateLocal(0,dt*8,0);time+=dt;frames++;if(time>1.2){document.getElementById('fps').textContent=Math.round(frames/time)+' FPS';time=0;frames=0}});
document.getElementById('loading').remove();
}catch(err){console.error(err);document.getElementById('error').textContent='خطای اجرای PlayCanvas: '+(err.message||String(err))}})();
</script></body></html>
