<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA | 📅 Event Review — Admin</title><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;color:#fff;font:16px system-ui}header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px}a,button,input,textarea,select{font:inherit;color:white;background:#000d;border:1px solid #fff9;border-radius:11px;padding:10px}a{text-decoration:none}main{max-width:790px;margin:18px auto;padding:13px}h1,h2,p,label{background:#000c;border-radius:9px;padding:9px;line-height:1.5}h1{font-size:25px}h2{font-size:20px}section{border:1px solid #fffa;border-radius:15px;padding:16px;margin:13px 0;background:#091a2c33}article{background:#000b;border:1px solid #fff8;border-radius:12px;padding:13px;margin:11px 0;overflow-wrap:anywhere}label{display:block}input,textarea{width:100%;display:block;margin:8px 0 14px}button{cursor:pointer;margin:5px}button:disabled{opacity:.5}</style><link rel="stylesheet" href="pesivia-simple-interior.css?v=11c9952d"></head><body><header><a href="pesivia-services-hub.html">⌂ Home</a><a href="pesivia-services-hub.html">← Back</a><strong>PESIVIA</strong></header><main><h1>📅 Event Review — Admin</h1><p>Review draft events submitted by approved sellers. Publishing makes an event visible to everyone.</p><p id="status">Checking admin access…</p><div id="events"></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>(async()=>{const $=id=>document.getElementById(id);try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:{user}}=await api.auth.getUser();if(!user){$('status').textContent='Administrator login required.';return}const {data:allowed,error:authError}=await api.rpc('mall_is_admin');if(authError||allowed!==true){$('status').textContent='Administrator access required.';return}const {data,error}=await api.from('mall_events').select('id,title,details,starts_at,ends_at,status').eq('status','draft').order('starts_at',{ascending:true}).limit(100);if(error)throw error;$('status').textContent=data.length?'Draft events awaiting review':'No events awaiting review.';for(const e of data){const box=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),t=document.createElement('p');h.textContent=e.title;p.textContent=e.details;t.textContent=new Date(e.starts_at).toLocaleString()+' – '+new Date(e.ends_at).toLocaleString();box.append(h,t,p);for(const publish of [true,false]){const b=document.createElement('button');b.textContent=publish?'Approve & publish':'Reject';b.onclick=async()=>{if(!confirm((publish?'Publish':'Reject')+' event '+e.title+'?'))return;b.disabled=true;const {error}=await api.rpc('mall_admin_review_event',{p_event_id:e.id,p_publish:publish});if(error){alert(error.message);b.disabled=false}else location.reload()};box.append(b)}$('events').append(box)}}catch(e){$('status').textContent='Unable to load event reviews: '+e.message}})();</script></body></html>
