<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فهرست مغازه‌ها | World Virtual Mall</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f9;color:#17283d;font:16px Tahoma,Arial}header{background:#122940;color:white;padding:20px}a{color:#17446c}header a{color:#f2c879}main{max-width:1080px;margin:auto;padding:24px 16px}h1{margin:12px 0}.muted{color:#657487;line-height:1.9}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}select,input{padding:13px;border:1px solid #cad3dc;border-radius:10px;font:inherit;flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:white;padding:20px;border-radius:16px;border:1px solid #e3e8ed}.num{font-size:30px;font-weight:bold;margin:6px 0}.status{color:#586b7c;margin:10px 0}.btn{display:inline-block;background:#e6b96b;border-radius:9px;padding:10px 14px;text-decoration:none;color:#17283d;font-weight:bold}.empty{padding:20px;background:white;border-radius:12px}footer{padding:30px;text-align:center;color:#657487}</style></head><body><header><strong>🏬 World Virtual Mall</strong>　<a href="index.html">همه بازارها</a>　<a href="seller.html">برای فروشندگان</a></header><main><h1>مغازه‌های بازار</h1><p class="muted">فهرست مغازه‌ها بر اساس اطلاعات ثبت‌شده در پایگاه داده نمایش داده می‌شود. واگذاری مغازه به معنی فعال بودن فروش آنلاین یا انتشار محصولات نیست.</p><div class="toolbar"><select id="market"><option value="jewelry">💎 جواهرات</option><option value="shoes">👟 کفش</option><option value="beauty">💄 زیبایی</option><option value="electronics">📱 الکترونیک</option><option value="sports">🏀 ورزش</option></select><input id="filter" placeholder="جستجوی شماره مغازه، مثلاً 003" inputmode="numeric"></div><p id="status" role="status">در حال دریافت اطلاعات...</p><div id="grid" class="grid"></div></main><footer>نسخه آزمایشی — بدون خرید و پرداخت واقعی</footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const market=document.getElementById('market'),filter=document.getElementById('filter'),grid=document.getElementById('grid'),status=document.getElementById('status');
const params=new URLSearchParams(location.search),selected=params.get('market');if(['jewelry','shoes','beauty','electronics','sports'].includes(selected))market.value=selected;
const api=window.supabase&&window.MALL_SUPABASE_PUBLISHABLE_KEY&&!window.MALL_SUPABASE_PUBLISHABLE_KEY.startsWith('REPLACE_')?window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY):null;let units=[];
function render(){grid.replaceChildren();const q=filter.value.trim();const shown=units.filter(u=>String(u.unit_number).padStart(3,'0').includes(q));for(const u of shown){const a=document.createElement('article');a.className='card';const h=document.createElement('div');h.className='num';h.textContent='مغازه '+String(u.unit_number).padStart(3,'0');const st=document.createElement('p');st.className='status';st.textContent=u.status==='occupied'?'واگذارشده':u.status==='reserved'?'رزرو شده':'آماده واگذاری';const link=document.createElement('a');link.className='btn';link.href='store.html?market='+encodeURIComponent(u.market_id)+'&unit='+encodeURIComponent(u.unit_number);link.textContent='مشاهده مغازه';a.append(h,st,link);grid.append(a)}status.textContent=shown.length+' مغازه نمایش داده می‌شود';if(!shown.length){const e=document.createElement('p');e.className='empty';e.textContent='مغازه‌ای با این مشخصات پیدا نشد.';grid.append(e)}}
async function load(){grid.replaceChildren();status.textContent='در حال دریافت اطلاعات...';if(!api){status.textContent='تنظیمات اتصال بازار موجود نیست.';return}const {data,error}=await api.from('mall_units').select('market_id,unit_number,status').eq('market_id',market.value).order('unit_number').limit(500);if(error){status.textContent='خطای دریافت مغازه‌ها: '+error.message;return}units=data||[];render()}market.onchange=()=>{const p=new URLSearchParams(location.search);p.set('market',market.value);history.replaceState(null,'','?'+p.toString());load()};filter.oninput=render;load();
</script><script src="language.js"></script></body></html>
