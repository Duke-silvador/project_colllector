<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA | 💬 Buyer–Seller Messages</title><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"><style>*{box-sizing:border-box}body{margin:0;color:#fff;font:16px system-ui,sans-serif;min-height:100svh}header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px}a,button,input,textarea,select{font:inherit;color:#fff;background:#000d;border:1px solid #fffc;border-radius:10px;padding:10px}a{text-decoration:none}main{max-width:720px;margin:20px auto;padding:12px}section{padding:18px;border:1px solid #fffa;border-radius:16px;background:#07182b22;margin-bottom:15px}h1,h2,p,label{background:#000c;border-radius:8px;padding:7px 10px;line-height:1.5}h1{font-size:25px}label{display:block}input,textarea,select{display:block;width:100%;margin:9px 0 14px}button{cursor:pointer}button:disabled{opacity:.55}.entry{border:1px solid #fff8;padding:12px;margin:10px 0;border-radius:12px;background:#000b;overflow-wrap:anywhere}small{display:block;color:#ddd}</style><link rel="stylesheet" href="pesivia-simple-interior.css?v=11c9952d"></head><body><header><a href="pesivia-services-hub.html">⌂ Home</a><a href="pesivia-services-hub.html">← Back</a><strong>PESIVIA</strong></header><main><section><h1>💬 Buyer–Seller Messages</h1><p>Private messages are available for an existing product request. Both buyer and assigned seller can read the conversation.</p><label>Product request<select id="request"></select></label><div id="thread"></div><label>Message<textarea id="body" rows="3" maxlength="2000"></textarea></label><button id="send">Send message</button><p id="status" role="status"></p></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>(async()=>{const $=id=>document.getElementById(id),status=$('status');try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:{user}}=await api.auth.getUser();if(!user){status.textContent='Log in to use messages.';$('send').disabled=true;return}const {data:seller}=await api.from('mall_sellers').select('id').eq('user_id',user.id).maybeSingle();const [a,b]=await Promise.all([api.from('mall_order_requests').select('id,product_id,status,created_at').eq('buyer_id',user.id).limit(100),seller?api.from('mall_order_requests').select('id,product_id,status,created_at').eq('seller_id',seller.id).limit(100):Promise.resolve({data:[],error:null})]);if(a.error||b.error)throw a.error||b.error;const all=[...new Map([...(a.data||[]),...(b.data||[])].map(x=>[x.id,x])).values()];if(!all.length){status.textContent='No product requests available for messaging.';$('send').disabled=true;return}for(const r of all){const o=document.createElement('option');o.value=r.id;o.textContent='Request '+r.id.slice(0,8)+' · '+r.status;$('request').append(o)}async function load(){const id=$('request').value;if(!id)return;const {data,error}=await api.from('mall_request_messages').select('sender_id,body,created_at').eq('request_id',id).order('created_at',{ascending:true}).limit(100);if(error)throw error;$('thread').replaceChildren();if(!data.length)$('thread').textContent='No messages yet.';for(const m of data){const d=document.createElement('div');d.className='entry';const who=document.createElement('small');who.textContent=(m.sender_id===user.id?'You':'Other participant')+' · '+new Date(m.created_at).toLocaleString();const p=document.createElement('div');p.textContent=m.body;d.append(who,p);$('thread').append(d)}}$('request').onchange=()=>load().catch(e=>status.textContent=e.message);await load();$('send').onclick=async()=>{const body=$('body').value.trim();if(!body){status.textContent='Enter a message.';return}$('send').disabled=true;const {error}=await api.from('mall_request_messages').insert({request_id:$('request').value,sender_id:user.id,body});status.textContent=error?'Message not sent: '+error.message:'Message sent.';if(!error){$('body').value='';await load()}$('send').disabled=false}}catch(e){status.textContent='Messages unavailable: '+e.message}})();</script></body></html>
