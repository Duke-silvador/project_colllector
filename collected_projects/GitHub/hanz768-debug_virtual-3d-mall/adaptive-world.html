 const cloth=M([0x233449,0xa8897e,0x405b58,0x61465e][index%4],.78),skin=M([0xc68c66,0xf0c3a0,0x865b46][index%3],.87),hair=M(index%2?0x473025:0x1b2027,.8);
 const local=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);g.add(o);return o};
 local(new THREE.CapsuleGeometry(.24,.55,5,10),cloth,0,1.12,0);
 local(new THREE.SphereGeometry(.16,14,10),skin,0,1.76,0);
 const cap=local(new THREE.SphereGeometry(.17,14,10),hair,0,1.85,-.015);cap.scale.y=.58;
 for(const side of [-1,1]){local(new THREE.SphereGeometry(.12,10,8),cloth,side*.25,1.38,0);const arm=local(new THREE.CapsuleGeometry(.075,.5,4,8),cloth,side*.34,1.04,0);arm.rotation.z=side*.15;local(new THREE.CapsuleGeometry(.09,.58,4,8),cloth,side*.12,.46,0);local(new THREE.BoxGeometry(.18,.1,.32),black,side*.12,.08,-.07)}

premiumPerson(-2.7,-10,0);premiumPerson(2.8,-17,1);premiumPerson(-3.4,-24,2);

function shopper(i){const g=new THREE.Group();const outfit=M([0x243d60,0xa68a73,0x4e6f66,0x764f66,0x3a536e][i%5],.8),skin=M([0xd49a73,0x91654a,0xf1c6a3][i%3],.85),hair=M([0x3a2a25,0x684834,0x222126][i%3]);function part(geo,m,x,y,z){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);g.add(o);return o}part(new THREE.CylinderGeometry(.23,.3,.78,10),outfit,0,1.12,0);part(new THREE.SphereGeometry(.17,10,8),skin,0,1.73,0);const h=part(new THREE.SphereGeometry(.175,10,8),hair,0,1.81,-.02);h.scale.y=.55;const legs=[];for(const side of [-1,1]){const leg=part(new THREE.CylinderGeometry(.075,.085,.67,8),outfit,side*.12,.43,0);legs.push(leg);part(new THREE.BoxGeometry(.16,.12,.27),black,side*.12,.07,-.05);const arm=part(new THREE.CylinderGeometry(.07,.07,.67,8),outfit,side*.31,1.13,0);if(side===1&&i%2===0)part(new THREE.BoxGeometry(.28,.33,.16),gold,.39,.65,.05)}scene.add(g);return {g,legs,base:-8-i*8.1,x:(i%2?-1:1)*(2.4+i%3),phase:i*1.9}}
const people=Array.from({length:13},(_,i)=>shopper(i));

// Local player avatar — this prototype does not represent a network-connected player.
const player=new THREE.Group();scene.add(player);
const avatarSkin=M(0xc99878,.83),avatarJacket=M(0x253c58,.8),avatarPants=M(0x3b3f4c,.82),avatarHair=M(0x30241f,.85);

avatarPiece(new THREE.CapsuleGeometry(.24,.57,6,12),avatarJacket,0,1.14,0);
avatarPiece(new THREE.SphereGeometry(.17,12,10),avatarSkin,0,1.78,0);
const hair=avatarPiece(new THREE.SphereGeometry(.18,12,10),avatarHair,0,1.87,-.03);hair.scale.y=.56;
const avatarLegs=[],avatarArms=[];
for(const side of [-1,1]){
 const leg=avatarPiece(new THREE.CapsuleGeometry(.09,.55,5,9),avatarPants,side*.13,.46,0);avatarLegs.push(leg);
 avatarPiece(new THREE.BoxGeometry(.2,.12,.32),black,side*.13,.07,-.075);
 const arm=avatarPiece(new THREE.CapsuleGeometry(.075,.49,5,9),avatarJacket,side*.32,1.1,0);avatarArms.push(arm);
}
let thirdPerson=true,playerX=0,playerZ=8;
const cameraButton=document.getElementById('cameraMode');
cameraButton.onclick=()=>{thirdPerson=!thirdPerson;cameraButton.textContent=thirdPerson?'👤 3rd person':'👁 1st person';player.visible=thirdPerson};
let yaw=0,yawTarget=0,walk=0,walkTarget=0,drag=false,lastX=0,lastY=0;
let moveX=0,moveY=0,lastFrame=0;
const joystick=document.getElementById('joystick'),stick=document.getElementById('stick');
function updateStick(e){const rect=joystick.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;const dx=e.clientX-cx,dy=e.clientY-cy,max=37,len=Math.hypot(dx,dy),ratio=len>max?max/len:1;moveX=dx*ratio/max;moveY=dy*ratio/max;stick.style.transform='translate('+(moveX*max)+'px,'+(moveY*max)+'px)'}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();joystick.setPointerCapture(e.pointerId);updateStick(e)});
joystick.addEventListener('pointermove',e=>{if(joystick.hasPointerCapture(e.pointerId)){e.preventDefault();updateStick(e)}});
function releaseStick(){moveX=moveY=0;stick.style.transform='translate(0,0)'}
joystick.addEventListener('pointerup',releaseStick);joystick.addEventListener('pointercancel',releaseStick);const el=renderer.domElement;el.style.touchAction='none';el.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',()=>drag=false);el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=lastY-e.clientY;lastX=e.clientX;lastY=e.clientY;yawTarget-=dx*.007;walkTarget=THREE.MathUtils.clamp(walkTarget+dy*.1,0,117)});
document.getElementById('left').onclick=()=>yawTarget-=Math.PI/6;document.getElementById('right').onclick=()=>yawTarget+=Math.PI/6;document.getElementById('forward').onclick=()=>walkTarget=Math.min(117,walkTarget+4);document.getElementById('back').onclick=()=>walkTarget=Math.max(0,walkTarget-4);
function animate(t){requestAnimationFrame(animate);
if(lastQualitySample){const delta=Math.min(100,t-lastQualitySample);frameTotal+=delta;frameCount++;
 if(frameCount>=100){const fps=Math.round(1000/(frameTotal/frameCount));fpsLabel.textContent=fps+' FPS';
  if(qualityMode==='auto'){if(fps<25&&autoQuality!=='low')autoQuality=autoQuality==='high'?'medium':'low';else if(fps>55&&autoQuality==='low')autoQuality='medium';else if(fps>58&&autoQuality==='medium'&&!mobileDevice)autoQuality='high';applyGraphics()}
  frameTotal=0;frameCount=0;
 }}lastQualitySample=t;
const dt=Math.min(.05,Math.max(0,(t-lastFrame)/1000||0));lastFrame=t;
walk+=(walkTarget-walk)*.08;yaw+=(yawTarget-yaw)*.13;
if(Math.abs(moveX)+Math.abs(moveY)>.05){
 const speed=3.4*dt;
 playerX=THREE.MathUtils.clamp(playerX+Math.cos(yaw)*moveX*speed,-5.8,5.8);
 walk=THREE.MathUtils.clamp(walk-moveY*speed,0,117);walkTarget=walk;
}
playerZ=8-walk;player.position.set(playerX,0,playerZ);player.rotation.y=yaw;
const behind=thirdPerson?3.6:0;
camera.position.set(playerX-Math.sin(yaw)*behind,thirdPerson?2.6:1.72,playerZ+Math.cos(yaw)*behind);
camera.lookAt(playerX+Math.sin(yaw)*10,1.64,playerZ-Math.cos(yaw)*10);
const gait=Math.sin(t*.009)*Math.min(1,Math.abs(moveX)+Math.abs(moveY)+Math.abs(walkTarget-walk)*.35);
avatarLegs[0].rotation.x=gait*.5;avatarLegs[1].rotation.x=-gait*.5;
avatarArms[0].rotation.x=-gait*.35;avatarArms[1].rotation.x=gait*.35;for(const p of people){const a=t*.00045+p.phase;p.g.position.set(p.x,p.g.position.y,p.base+Math.sin(a)*2.2);p.g.rotation.y=Math.cos(a)>0?0:Math.PI;p.legs[0].rotation.x=Math.sin(t*.005+p.phase)*.36;p.legs[1].rotation.x=-p.legs[0].rotation.x}for(const v of animated){if(v.kind==='mainstrip'){v.o.position.y=4.2+Math.sin(t*.002+v.phase)*.065;v.o.material.opacity=.12+.14*(.5+.5*Math.sin(t*.004+v.phase))}else if(v.kind==='stripe'){v.o.position.y=2.2+Math.sin(t*.003+v.phase)*.05;v.o.material.opacity=.14+.15*(.5+.5*Math.sin(t*.005+v.phase))}else if(v.kind==='drop'){v.o.position.y=.28+((t*.0005+v.phase)%1)*.5}else if(v.kind==='jet'){v.o.scale.y=.85+.15*Math.sin(t*.004+v.phase)}else if(v.kind==='ripple'){const scale=.93+.12*Math.sin(t*.003+v.phase);v.o.scale.set(scale,scale,1)}}renderer.render(scene,camera)}animate(0);
function resizeGame(){const w=document.documentElement.clientWidth||innerWidth,h=window.visualViewport?.height||innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);renderer.domElement.style.width=w+'px';renderer.domElement.style.height=h+'px'}window.addEventListener('resize',resizeGame);window.visualViewport?.addEventListener('resize',resizeGame);resizeGame();applyGraphics();document.getElementById('loading').remove();
</script></body></html>
