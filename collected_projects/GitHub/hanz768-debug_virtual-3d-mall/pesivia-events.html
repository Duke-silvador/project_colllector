<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA | 📅 Store Events</title><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;color:#fff;font:16px system-ui}header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px}a,button,input,textarea,select{font:inherit;color:white;background:#000d;border:1px solid #fff9;border-radius:11px;padding:10px}a{text-decoration:none}main{max-width:790px;margin:18px auto;padding:13px}h1,h2,p,label{background:#000c;border-radius:9px;padding:9px;line-height:1.5}h1{font-size:25px}h2{font-size:20px}section{border:1px solid #fffa;border-radius:15px;padding:16px;margin:13px 0;background:#091a2c33}article{background:#000b;border:1px solid #fff8;border-radius:12px;padding:13px;margin:11px 0;overflow-wrap:anywhere}label{display:block}input,textarea{width:100%;display:block;margin:8px 0 14px}button{cursor:pointer;margin:5px}button:disabled{opacity:.5}</style><link rel="stylesheet" href="pesivia-simple-interior.css?v=11c9952d"></head><body><header><a href="pesivia-services-hub.html">⌂ Home</a><a href="pesivia-services-hub.html">← Back</a><strong>PESIVIA</strong></header><main><h1>📅 Store Events</h1><p>Verified upcoming store events. Events must be approved by the marketplace administrator before appearing here.</p><p id="status">Loading events…</p><div id="events"></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>(async()=>{const $=id=>document.getElementById(id);try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data,error}=await api.from('mall_events').select('title,details,starts_at,ends_at,unit_id').eq('status','published').gte('ends_at',new Date().toISOString()).order('starts_at',{ascending:true}).limit(50);if(error)throw error;$('status').textContent=data.length?'Upcoming events':'No verified upcoming events.';for(const e of data){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),t=document.createElement('p');h.textContent=e.title;p.textContent=e.details;t.textContent=new Date(e.starts_at).toLocaleString()+' – '+new Date(e.ends_at).toLocaleString();a.append(h,t,p);$('events').append(a)}}catch(e){$('status').textContent='Unable to load events: '+e.message}})();</script></body></html>
