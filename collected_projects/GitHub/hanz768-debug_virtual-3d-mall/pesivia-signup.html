urn}if(password.length<8){$('status').textContent=t[9];return}if(password!==$('confirm').value){$('status').textContent=t[10];return}if(!window.supabase||!window.MALL_SUPABASE_URL||!window.MALL_SUPABASE_PUBLISHABLE_KEY){$('status').textContent=t[12];return}const btn=$('submit');btn.disabled=true;try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data,error}=await api.auth.signUp({email,password,options:{emailRedirectTo:new URL('auth.html',location.href).href}});if(error)throw error;if(validRef)localStorage.setItem('pesivia-pending-referral',JSON.stringify({code:ref,email:email.toLowerCase(),created:Date.now()}));if(data?.session)location.replace('my-store.html');else $('status').textContent=t[11]}catch(err){$('status').textContent=err.message||t[12]}finally{btn.disabled=false}}})();
