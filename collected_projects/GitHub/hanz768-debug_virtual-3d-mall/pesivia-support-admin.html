<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA | Support Administration</title><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"><style>*{box-sizing:border-box}body{margin:0;color:#fff;font:16px system-ui}header{display:flex;justify-content:space-between;padding:15px}a,button,select,textarea{background:#000d;color:white;border:1px solid #fffa;border-radius:10px;padding:10px;font:inherit}main{max-width:800px;margin:auto;padding:14px}section{background:#0008;border:1px solid #fffa;border-radius:15px;padding:16px;margin:12px 0}h1,p{background:#000c;border-radius:8px;padding:9px;overflow-wrap:anywhere}textarea,select{display:block;width:100%;margin:10px 0}button{cursor:pointer}</style><link rel="stylesheet" href="pesivia-simple-interior.css?v=11c9952d"></head><body><header><a href="pesivia-services-hub.html">⌂ Home</a><a href="pesivia-admin.html">🛡️ Admin Dashboard</a></header><main><h1>🎧 Support tickets — Admin</h1><p id="status">Checking administrator access…</p><div id="tickets"></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
(async()=>{const status=document.getElementById('status'),root=document.getElementById('tickets');try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:{user}}=await api.auth.getUser();if(!user){status.textContent='Administrator sign-in required.';return}const {data:allowed,error:accessError}=await api.rpc('mall_is_admin');if(accessError||allowed!==true){status.textContent='Access denied: administrator account required.';return}const {data,error}=await api.from('mall_support_tickets').select('id,subject,message,status,admin_note,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;status.textContent='Administrator support queue. Latest 100 tickets.';if(!data?.length){root.textContent='No support tickets.';return}for(const t of data){const section=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p'),meta=document.createElement('p'),select=document.createElement('select'),note=document.createElement('textarea'),save=document.createElement('button'),feedback=document.createElement('p');h.textContent=t.subject;p.textContent=t.message;meta.textContent=new Date(t.created_at).toLocaleString();for(const v of ['open','in_progress','resolved']){const o=document.createElement('option');o.value=v;o.textContent=v;select.append(o)}select.value=t.status;note.value=t.admin_note||'';note.maxLength=3000;note.rows=3;note.placeholder='Private support reply (visible to ticket owner)';save.textContent='Save response';save.onclick=async()=>{save.disabled=true;const {error}=await api.from('mall_support_tickets').update({status:select.value,admin_note:note.value.trim()||null}).eq('id',t.id);feedback.textContent=error?'Could not save: '+error.message:'Response saved.';save.disabled=false};section.append(h,meta,p,select,note,save,feedback);root.append(section)}}catch(e){status.textContent='Admin queue unavailable: '+(e.message||'Unknown error')}})();
</script></body></html>
