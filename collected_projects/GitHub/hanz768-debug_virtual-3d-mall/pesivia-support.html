<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA | 🎧 Support</title><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"><style>*{box-sizing:border-box}body{margin:0;color:#fff;font:16px system-ui,sans-serif;min-height:100svh}header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px}a,button,input,textarea,select{font:inherit;color:#fff;background:#000d;border:1px solid #fffc;border-radius:10px;padding:10px}a{text-decoration:none}main{max-width:720px;margin:20px auto;padding:12px}section{padding:18px;border:1px solid #fffa;border-radius:16px;background:#07182b22;margin-bottom:15px}h1,h2,p,label{background:#000c;border-radius:8px;padding:7px 10px;line-height:1.5}h1{font-size:25px}label{display:block}input,textarea,select{display:block;width:100%;margin:9px 0 14px}button{cursor:pointer}button:disabled{opacity:.55}.entry{border:1px solid #fff8;padding:12px;margin:10px 0;border-radius:12px;background:#000b;overflow-wrap:anywhere}small{display:block;color:#ddd}</style><link rel="stylesheet" href="pesivia-simple-interior.css?v=11c9952d"></head><body><header><a href="pesivia-services-hub.html">⌂ Home</a><a href="pesivia-services-hub.html">← Back</a><strong>PESIVIA</strong></header><main><section><h1>🎧 Support</h1><p>Send a private support ticket. Do not include passwords or payment card details.</p><label>Subject<input id="subject" maxlength="140" placeholder="What do you need help with?"></label><label>Details<textarea id="body" maxlength="3000" rows="5"></textarea></label><button id="send">Submit support ticket</button><p id="status" role="status"></p><h2>My tickets</h2><div id="tickets"></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>(async()=>{const $=id=>document.getElementById(id),status=$('status');try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:{user}}=await api.auth.getUser();if(!user){status.textContent='Please log in to contact support.';const a=document.createElement('a');a.href='auth.html';a.textContent='Log in';status.append(a);$('send').disabled=true;return}async function load(){const {data,error}=await api.from('mall_support_tickets').select('id,subject,message,status,admin_note,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50);if(error)throw error;$('tickets').replaceChildren();if(!data.length)$('tickets').textContent='No tickets yet.';for(const t of data){const d=document.createElement('div');d.className='entry';const h=document.createElement('strong');h.textContent=t.subject;const p=document.createElement('p');p.textContent=t.message;const meta=document.createElement('small');meta.textContent=t.status+' · '+new Date(t.created_at).toLocaleString();d.append(h,meta,p);if(t.admin_note){const n=document.createElement('p');n.textContent='Support reply: '+t.admin_note;d.append(n)}$('tickets').append(d)}}await load();$('send').onclick=async()=>{const subject=$('subject').value.trim(),message=$('body').value.trim();if(subject.length<3||message.length<5){status.textContent='Please enter a subject and details.';return}$('send').disabled=true;const {error}=await api.from('mall_support_tickets').insert({user_id:user.id,subject,message});status.textContent=error?'Could not submit: '+error.message:'Ticket submitted.';if(!error){$('subject').value='';$('body').value='';await load()}$('send').disabled=false}}catch(e){status.textContent='Support unavailable: '+e.message}})();</script></body></html>
