<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The charset line lets the browser show the chess symbols (♚ ♛ ...) correctly. -->
  <meta charset="UTF-8">
  <!-- This line makes the page fit phone screens instead of showing a tiny desktop page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play chess against a minimax engine with alpha-beta pruning, built from scratch in vanilla JavaScript.">
  <meta name="theme-color" content="#1a1614">
  <title>Chess vs Computer</title>

  <!-- Fonts: Fraunces for headings, Inter for everything else. If they fail
       to load, the page falls back to system fonts (see style.css). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">♞&#xFE0E;</span>
        <div>
          <h1>Chess</h1>
          <p class="tagline">Play against a minimax engine</p>
        </div>
      </div>
      <a class="tests-link" href="tests.html">Engine tests</a>
    </header>

    <main class="layout">
      <!-- Left (or top, on phones): the board with a player bar above and below. -->
      <section class="board-column" aria-label="Game">
        <div id="opponent-bar" class="player-bar"></div>

        <div class="board-wrap">
          <!-- The board starts empty. JavaScript (ui.js) fills it with 64 squares. -->
          <div id="board" class="board" aria-label="Chessboard"></div>

          <!-- Shown over the board when the game ends. -->
          <div id="result" class="result" hidden>
            <div class="result-card">
              <p id="result-title" class="result-title"></p>
              <p id="result-text" class="result-text"></p>
              <div class="result-actions">
                <button id="result-new-game" type="button" class="primary">New game</button>
                <button id="result-close" type="button" class="secondary">View board</button>
              </div>
            </div>
          </div>
        </div>

        <div id="player-bar" class="player-bar"></div>
      </section>

      <!-- Right (or below, on phones): status, settings and the move list. -->
      <aside class="panel">
        <section class="card status-card">
          <p id="status" class="status">Your move</p>
          <div class="eval" title="Evaluation: positive means White is better">
            <span class="eval-label">Eval</span>
            <div class="eval-bar"><div id="eval-fill" class="eval-fill"></div></div>
            <span id="eval-text" class="eval-text">0.00</span>
          </div>
          <!-- What the computer did last (depth, positions searched, time). -->
          <p id="ai-info" class="ai-info"></p>
        </section>

        <section class="card">
          <h2>Game setup</h2>

          <!-- Your side applies when you press New game. -->
          <div class="field">
            <span class="field-label">Play as</span>
            <div class="segmented" role="radiogroup" aria-label="Play as">
              <input type="radio" name="side" id="side-w" value="w" checked>
              <label for="side-w">White</label>
              <input type="radio" name="side" id="side-b" value="b">
              <label for="side-b">Black</label>
            </div>
          </div>

          <!-- Difficulty = how many half-moves ahead the computer searches.
               It applies to the computer's next move. -->
          <div class="field">
            <span class="field-label">Difficulty</span>
            <div class="segmented" role="radiogroup" aria-label="Difficulty">
              <input type="radio" name="difficulty" id="difficulty-1" value="1">
              <label for="difficulty-1">Easy</label>
              <input type="radio" name="difficulty" id="difficulty-2" value="2" checked>
              <label for="difficulty-2">Medium</label>
              <input type="radio" name="difficulty" id="difficulty-4" value="4">
              <label for="difficulty-4">Hard</label>
            </div>
            <p id="difficulty-hint" class="hint"></p>
          </div>

          <button id="new-game" type="button" class="primary">New game</button>
        </section>

        <section class="card moves-card">
          <h2>Moves</h2>
          <ol id="move-history" class="move-list"></ol>
        </section>
      </aside>
    </main>

    <footer class="footer">
      Built from scratch in vanilla JavaScript: legal move generation, minimax with
      alpha-beta pruning, and a Web Worker. <a href="tests.html">Run the engine tests</a>
    </footer>
  </div>

  <!--
    The order of these scripts matters: each file can use what the files
    before it defined. board.js (the data) comes first, rules.js (how
    pieces move) next, evaluate.js (scoring positions), ai.js (the search),
    notation.js (writing moves as text), then ui.js (drawing), and main.js
    (which starts everything) last.
    (The AI normally runs in js/ai-worker.js, which loads its own copies;
    ai.js is loaded here too as a backup — see main.js.)
  -->
  <script src="js/board.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/evaluate.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/notation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
