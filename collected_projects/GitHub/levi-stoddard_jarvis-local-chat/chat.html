<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // Local GPU Core</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #111827;
            padding: 15px 20px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #38bdf8;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .status {
            font-size: 0.8rem;
            color: #10b981;
            font-family: monospace;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .assistant {
            background: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        #input-area {
            background: #111827;
            padding: 20px;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: center;
        }
        .input-wrapper {
            max-width: 900px;
            width: 100%;
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            color: white;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 24px;
            font-size: 1rem;
            outline: none;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        button {
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>
    <header>
        <h1>JARVIS // RTX 4060 Ti CORE</h1>
        <div class="status">● STREAMING ACTIVE</div>
    </header>

    <div id="chat-container">
        <div class="message assistant">JARVIS online. Connected to PC GPU server. Ready for live token streaming.</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="Type a message and press Enter..." rows="1"></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const OLLAMA_URL = "http://192.168.1.181:11434/api/generate";
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        function appendMessage(role, text) {
            const div = document.createElement("div");
            div.className = "message " + role;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        async function handleSendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            userInput.value = "";
            userInput.style.height = "24px";
            appendMessage("user", prompt);

            const assistantDiv = appendMessage("assistant", "");

            try {
                const response = await fetch(OLLAMA_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "qwen3:8b",
                        prompt: prompt,
                        stream: true
                    })
                });

                if (!response.ok) throw new Error("Server returned error status");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (line.trim() === "") continue;
                        const json = JSON.parse(line);
                        if (json.response) {
                            fullText += json.response;
                            assistantDiv.textContent = fullText;
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }
                    }
                }
            } catch (error) {
                assistantDiv.textContent = "Connection Error: " + error.message;
                assistantDiv.style.color = "#ef4444";
            }
        }

        userInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                handleSendMessage();
            }
        });

        sendBtn.addEventListener("click", handleSendMessage);
    </script>
</body>
</html>
