<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吉他改编与小工具</title>
  <meta name="description" content="个人指弹吉他改编曲谱与小工具：参考视频、PDF 与 MuseScore 文件下载、演示视频、留言。">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* 在样式生效前恢复侧边栏的收起状态，避免闪一下。?sidebar=collapsed 可以强制。 */
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("sidebar");
        var s = q || localStorage.getItem("sidebar");
        if (s === "collapsed") document.documentElement.setAttribute("data-sidebar", "collapsed");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- 手机宽度才显示的顶栏：汉堡按钮 + 站名 -->
  <header class="topbar">
    <button class="iconbtn" id="sb-open" type="button" aria-controls="sidebar" aria-expanded="false"></button>
    <a class="topbar__brand" id="brand-m" href="#top"></a>
  </header>

  <!-- 左侧导航：桌面固定、可收起成窄栏；手机上是抽屉 -->
  <aside class="sidebar" id="sidebar">
    <div class="sb__head">
      <a class="sb__brand" id="brand" href="#top"></a>
      <button class="iconbtn sb__toggle" id="sb-toggle" type="button"></button>
      <button class="iconbtn sb__close" id="sb-close" type="button"></button>
    </div>
    <nav class="sb__nav" id="sb-nav"></nav>
    <div class="sb__foot" id="sb-foot" hidden></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- 语言切换：固定在右上角（手机上落在顶栏右侧） -->
  <div class="lang" id="lang" role="group"></div>

  <div class="page">
    <main id="top">
      <section class="hero">
        <p class="hero__eyebrow" id="site-eyebrow"></p>
        <h1 id="site-title"></h1>
        <p class="hero__intro" id="site-intro"></p>
        <div class="hero__actions" id="hero-actions"></div>
      </section>

      <section class="section" id="songs">
        <header class="section__head">
          <p class="section__eyebrow" data-t="songs_eyebrow"></p>
          <h2 class="section__title" data-t="songs_title"></h2>
          <p class="section__desc" data-t="songs_desc"></p>
        </header>
        <div class="song-list" id="song-list"></div>
      </section>

      <section class="section" id="covers" hidden>
        <header class="section__head">
          <p class="section__eyebrow" data-t="covers_eyebrow"></p>
          <h2 class="section__title" data-t="covers_title"></h2>
          <p class="section__desc" data-t="covers_desc"></p>
        </header>
        <div class="covers" id="cover-list"></div>
      </section>

      <section class="section" id="tools" hidden>
        <header class="section__head">
          <p class="section__eyebrow" data-t="tools_eyebrow"></p>
          <h2 class="section__title" data-t="tools_title"></h2>
          <p class="section__desc" data-t="tools_desc"></p>
        </header>
        <div class="tools" id="tool-list"></div>
      </section>

      <section class="section" id="contact">
        <div class="contact">
          <header class="section__head section__head--tight">
            <p class="section__eyebrow" data-t="contact_eyebrow"></p>
            <h2 class="section__title" data-t="contact_title"></h2>
            <p class="section__desc" data-t="contact_desc"></p>
          </header>
          <div id="contact-form-wrap"></div>
        </div>
      </section>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>

  <noscript>
    <p style="padding:24px;text-align:center">这个页面需要启用 JavaScript 才能显示内容。<br>This page needs JavaScript to show its content.</p>
  </noscript>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
