<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Links to One PDF</title>
<link rel="icon" href="icons/icon32.png">
<style>
  :root { --red:#c82828; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3e6; --bg:#f6f6f7; --ok:#1a7f37; --bad:#c82828; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:880px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:20px; margin:0 0 4px; display:flex; gap:10px; align-items:center; }
  h1 img { width:28px; height:28px; }
  .start { color:var(--muted); word-break:break-all; margin-bottom:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .status { font-weight:600; margin-bottom:10px; }
  .bar { height:10px; background:#ececef; border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--red); transition:width .3s; }
  .stats { display:flex; gap:18px; flex-wrap:wrap; margin-top:10px; color:var(--muted); font-size:13px; }
  .stats b { color:var(--ink); }
  .actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  button, a.btn { padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; font:inherit; font-weight:600; cursor:pointer; color:var(--ink); text-decoration:none; }
  button.primary, a.btn.primary { background:var(--red); border-color:var(--red); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .note { font-size:12.5px; color:var(--muted); margin-top:10px; }
  ol { margin:0; padding:0; list-style:none; }
  li { display:grid; grid-template-columns:22px 1fr auto; gap:8px; padding:6px 0; border-top:1px solid var(--line); font-size:13px; align-items:start; }
  li:first-child { border-top:0; }
  li .icon { text-align:center; }
  li .title { font-weight:600; }
  li .url { color:var(--muted); word-break:break-all; font-size:12px; }
  li .meta { color:var(--muted); font-size:12px; white-space:nowrap; }
  li.failed .meta { color:var(--bad); }
  .lvl1 { padding-left:0; } .lvl2 .title, .lvl2 .url { padding-left:14px; } .lvl3 .title, .lvl3 .url { padding-left:28px; }
  h2 { font-size:14px; margin:0 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="icons/icon48.png" alt="">Links to One PDF</h1>
  <div class="start" id="start"></div>

  <div class="card">
    <div class="status" id="status">Starting…</div>
    <div class="bar"><div id="bar"></div></div>
    <div class="stats">
      <span>Saved <b id="nDone">0</b></span>
      <span>Found <b id="nTotal">0</b></span>
      <span>Failed <b id="nFailed">0</b></span>
      <span>Level <b id="nLevel">0</b></span>
      <span>Time <b id="elapsed">0:00</b></span>
    </div>
    <div class="actions">
      <button id="stop">Stop &amp; save what I have</button>
      <button id="cancel">Cancel</button>
      <a class="btn primary" id="download" hidden>Download PDF again</a>
    </div>
    <div class="note">Keep this tab open until it finishes. Chrome shows a "started debugging this browser" bar while pages are being printed — that's expected and it goes away when the job ends.</div>
  </div>

  <div class="card">
    <h2>Pages</h2>
    <ol id="list"></ol>
  </div>
</div>
<script src="lib/pdf-lib.min.js"></script>
<script src="common.js"></script>
<script src="runner.js"></script>
</body>
</html>
