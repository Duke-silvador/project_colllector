<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174e43"><title>英铁1组批量查重网站</title><meta name="description" content="英铁1组批量查重网站。记住组员姓名，批量检测英文视频的画面、字幕、花字和BGM相似度，任一项不超过70%即通过，不审核口播。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2282%22%20font-size%3D%2282%22%20text-anchor%3D%22middle%22%3E%F0%9F%94%8D%3C%2Ftext%3E%3C%2Fsvg%3E"><link rel="stylesheet" href="./style.css"></head>
<body><aside class="sidebar"><a href="#workbench" class="brand"><span class="brand-mark">铁</span><span>英铁1组<small>批量查重网站</small></span></a><div class="workspace-label"><span class="workspace-avatar">1</span><div>英铁1组<small>全组共享工作区</small></div><span class="live-dot"></span></div><div class="nav-label">工作空间</div><nav><a href="#workbench" data-route="workbench"><span>▦</span> 检测工作台</a><a href="#templates" data-route="templates"><span>▤</span> 视频模板库 <b id="nav-count">0</b></a><a href="#records" data-route="records"><span>◷</span> 全组视频</a><a href="#guide" data-route="guide"><span>⊙</span> 检测规则</a></nav><div class="sidebar-note"><span class="lock-icon">◈</span><strong>全组公开共享</strong><p>全组视频与结果共享<br>每位同事都能查看</p><a href="#guide">了解检测方式 ↗</a></div><div class="sidebar-bottom"><span class="avatar" id="member-avatar">你</span><div class="member-profile"><strong id="member-name">尚未填写姓名</strong><small>后续上传自动使用此姓名</small><button class="member-switch" data-action="switch-member">切换组员</button></div></div></aside>

<input id="files" type="file" accept="video/*,.mp4,.mov,.webm" multiple hidden><input id="bgm-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.aac" hidden><input id="import-file" type="file" accept="application/json,.json" hidden><div id="toast" role="status"></div><dialog id="detail"><div id="detail-content"></div><button class="btn secondary" id="close-detail">关闭</button></dialog>
<dialog id="member-dialog" aria-labelledby="member-dialog-title" aria-describedby="member-dialog-description"><form id="member-form"><span class="welcome-mark">铁</span><div class="eyebrow">英铁1组批量查重网站</div><h2 id="member-dialog-title">先认识一下，怎么称呼你？</h2><p id="member-dialog-description">只需填写一次，之后上传视频和导出报告会自动使用你的姓名。</p><label for="member-input">你的姓名</label><input id="member-input" name="member" type="text" maxlength="30" autocomplete="name" placeholder="请输入你的姓名" required autofocus><p id="member-error" class="member-error" role="alert"></p><div class="member-dialog-actions"><button id="cancel-member" type="button" class="btn secondary" hidden>取消</button><button class="btn" type="submit">记住姓名，进入查重</button></div><p class="member-storage-note">姓名记在当前浏览器中。共用电脑时，可通过“切换组员”更换姓名。</p></form></dialog>
