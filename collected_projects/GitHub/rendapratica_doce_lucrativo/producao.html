<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produção — Doce Lucrativo</title>
<meta name="theme-color" content="#2b1810">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="producao" data-title="Produção" data-sub="Registre o que você fabricou e o estoque se atualiza sozinho">
<main id="content" class="content">
  <section class="card" id="form-card">
    <div class="card-head"><h2 id="form-title">Registrar produção</h2><span class="pill" id="edit-pill" hidden>Editando</span></div>
    <div id="no-products" hidden></div>
    <form id="form" novalidate>
      <div class="form-grid">
        <div class="field c6"><label for="f-product">Produto</label><select id="f-product" name="productId"></select><small class="err" data-err="productId"></small><small class="hint" id="stock-now"></small></div>
        <div class="field c3 keep"><label for="f-qty">Quantidade produzida</label><input type="text" inputmode="numeric" id="f-qty" name="qty" placeholder="Ex.: 50" autocomplete="off"><small class="err" data-err="qty"></small></div>
        <div class="field c3 keep"><label for="f-date">Data de fabricação</label><input type="date" id="f-date" name="date"><small class="err" data-err="date"></small></div>
        <div class="field c4"><label for="f-cost">Custo total da produção</label><input type="text" inputmode="decimal" id="f-cost" name="totalCost" placeholder="0,00" autocomplete="off"><small class="err" data-err="totalCost"></small></div>
        <div class="field c8"><label class="check" style="margin-top:28px"><input type="checkbox" id="f-update" name="updateCost" checked><span>Atualizar o <b>custo unitário</b> do produto com este valor<br><span class="hint">Mantém o lucro das próximas vendas sempre correto.</span></span></label></div>
        <div class="liveline" id="live"></div>
      </div>
      <div class="form-actions" style="margin-top:16px"><button class="btn primary" type="submit" id="btn-save"></button><button class="btn ghost" type="button" id="btn-cancel" hidden>Cancelar edição</button></div>
    </form>
  </section>

  <section class="section">
    <div class="card-head"><h2>Histórico de produção</h2><div class="field" style="min-width:200px"><label class="sr-only" for="flt">Filtrar</label><select id="flt"></select></div></div>
    <div id="summary" class="grid g3" style="margin-bottom:16px"></div>
    <div id="list"></div>
  </section>
</main>
<script src="js/calc.js"></script>
<script src="js/database.js"></script>
<script src="js/art.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/producao.js"></script>
</body>
</html>
