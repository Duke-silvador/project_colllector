<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatórios — Doce Lucrativo</title>
<meta name="theme-color" content="#2b1810">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="relatorios" data-title="Relatórios" data-sub="Veja os números do período e exporte para o Excel">
<main id="content" class="content">
  <section class="card">
    <div class="row" style="align-items:flex-end" id="period-row"></div>
    <div id="period-msg" style="margin-top:12px"></div>
  </section>

  <div id="report" hidden>
    <section class="section"><div class="grid g4" id="cards"></div></section>

    <section class="section grid split-a" id="mid-row">
      <div class="card"><div class="card-head"><h2>Evolução do faturamento</h2>
        <div class="segmented" role="group" aria-label="Agrupar por" id="gran"><button type="button" data-g="day" class="on">Dia</button><button type="button" data-g="week">Semana</button><button type="button" data-g="month">Mês</button></div></div>
        <div class="chart-box"><canvas id="ch-rev" role="img" aria-label="Evolução do faturamento"></canvas></div></div>
      <div class="card"><div class="card-head"><h2>Produtos mais vendidos</h2></div><div id="top"></div></div>
    </section>

    <section class="section card">
      <div class="card-head"><h2>Exportar para CSV</h2></div>
      <p class="muted small" style="margin-top:-6px">Os arquivos abrem direto no Excel e no Google Planilhas e respeitam o período escolhido.</p>
      <div class="row">
        <button class="btn gold" type="button" data-exp="resumo"></button><button class="btn" type="button" data-exp="vendas"></button>
        <button class="btn" type="button" data-exp="producao"></button><button class="btn" type="button" data-exp="despesas"></button>
      </div>
    </section>

    <section class="section card"><div class="card-head"><h2>Vendas do período</h2></div><div id="sales-list"></div></section>
  </div>
</main>
<script src="js/vendor/chart.umd.js"></script>
<script src="js/calc.js"></script>
<script src="js/database.js"></script>
<script src="js/art.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/charts.js"></script>
<script src="js/relatorios.js"></script>
</body>
</html>
