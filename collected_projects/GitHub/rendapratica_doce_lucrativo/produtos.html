<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produtos — Doce Lucrativo</title>
<meta name="theme-color" content="#2b1810">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="produtos" data-title="Produtos" data-sub="Seu cardápio de doces, com preço, custo e estoque">
<main id="content" class="content">
  <div class="toolbar">
    <div class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr-only" for="q">Buscar produto</label><input type="text" id="q" placeholder="Buscar produto…" autocomplete="off"></div>
    <div class="field" style="min-width:190px"><label class="sr-only" for="cat">Categoria</label><select id="cat"></select></div>
    <button class="btn primary" id="btn-new" type="button"></button>
  </div>
  <div id="summary" class="grid g3" style="margin-bottom:18px"></div>
  <div id="list"><div class="loading"><div><div class="spinner"></div>Carregando…</div></div></div>

  <dialog id="dlg" data-modal aria-labelledby="dlg-title">
    <div class="dlg-head"><h2 id="dlg-title">Novo produto</h2><button class="btn ghost icon-only" type="button" data-close aria-label="Fechar"></button></div>
    <form id="form" class="dlg-body" novalidate>
      <div class="form-grid">
        <div class="field c8"><label for="f-name">Nome do produto</label><input type="text" id="f-name" name="name" maxlength="80" placeholder="Ex.: Brigadeiro gourmet" autocomplete="off"><small class="err" data-err="name"></small></div>
        <div class="field c4"><label for="f-category">Categoria</label><select id="f-category" name="category"></select><small class="err" data-err="category"></small></div>
        <div class="field"><label for="f-description">Descrição <span class="opt">(opcional)</span></label><textarea id="f-description" name="description" maxlength="300" placeholder="Sabor, recheio, tamanho…"></textarea><small class="err" data-err="description"></small></div>
        <div class="field c4 keep"><label for="f-price">Preço de venda (un.)</label><input type="text" inputmode="decimal" id="f-price" name="price" placeholder="0,00" autocomplete="off"><small class="err" data-err="price"></small></div>
        <div class="field c4 keep"><label for="f-cost">Custo de produção (un.)</label><input type="text" inputmode="decimal" id="f-cost" name="cost" placeholder="0,00" autocomplete="off"><small class="err" data-err="cost"></small></div>
        <div class="field c4"><label for="f-stock">Quantidade disponível</label><input type="text" inputmode="numeric" id="f-stock" name="stock" placeholder="0" autocomplete="off"><small class="err" data-err="stock"></small><small class="hint" id="stock-hint"></small></div>
        <div class="field"><span class="label">Foto <span class="opt">(opcional)</span></span>
          <div class="photo-pick"><div class="preview" id="preview">Sem foto</div>
            <div class="row"><label class="btn sm" for="f-photo" style="cursor:pointer" id="photo-label"></label><input class="sr-only" type="file" id="f-photo" accept="image/*"><button class="btn sm ghost" type="button" id="photo-clear" hidden>Remover foto</button></div></div>
          <small class="err" data-err="photo"></small></div>
        <div class="liveline" id="live"></div>
      </div>
      <div class="form-actions" style="margin-top:18px"><button class="btn primary" type="submit" id="btn-save">Salvar produto</button><button class="btn ghost" type="button" data-close>Cancelar</button></div>
    </form>
  </dialog>
</main>
<script src="js/calc.js"></script>
<script src="js/database.js"></script>
<script src="js/art.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/recipes-data.js"></script>
<script src="js/produtos.js"></script>
</body>
</html>
