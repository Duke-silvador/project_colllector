<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel — Doce Lucrativo</title>
<meta name="theme-color" content="#2b1810">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard" data-title="Painel" data-sub="Como está o seu negócio hoje">
<main id="content" class="content">
  <div id="alerts"></div>
  <section><div class="grid g3" id="top-cards"></div></section>

  <section class="section card">
    <div class="card-head"><h2>Resultado do período</h2></div>
    <div class="row" style="align-items:flex-end;margin-bottom:18px" id="period-row"></div>
    <div id="period-msg"></div>
    <div class="grid g4" id="period-cards"></div>
  </section>

  <section class="section grid split-a" id="charts-row">
    <div class="card">
      <div class="card-head"><h2>Faturamento</h2>
        <div class="segmented" role="group" aria-label="Agrupar por" id="gran"><button type="button" data-g="day" class="on">Por dia</button><button type="button" data-g="week">Por semana</button><button type="button" data-g="month">Por mês</button></div></div>
      <div class="chart-box"><canvas id="ch-rev" aria-label="Gráfico de faturamento e despesas" role="img"></canvas></div>
    </div>
    <div class="card"><div class="card-head"><h2>Mais vendidos</h2></div><div class="chart-box"><canvas id="ch-top" aria-label="Gráfico dos produtos mais vendidos" role="img"></canvas></div><p class="muted center small" id="top-empty" hidden>Sem vendas neste período.</p></div>
  </section>

  <section class="section card"><div class="card-head"><h2>Estoque disponível</h2><a class="btn sm" href="producao.html">Registrar produção</a></div><div id="stock"></div></section>
</main>
<script src="js/vendor/chart.umd.js"></script>
<script src="js/calc.js"></script>
<script src="js/database.js"></script>
<script src="js/art.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/charts.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
