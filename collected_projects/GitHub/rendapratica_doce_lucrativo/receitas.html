<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receitas — Doce Lucrativo</title>
<meta name="theme-color" content="#2b1810">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="receitas" data-title="Receitas" data-sub="Biblioteca de receitas com rendimento e sugestão de preço">
<main id="content" class="content">
  <div class="toolbar">
    <div class="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr-only" for="q">Buscar receita</label><input type="text" id="q" placeholder="Buscar receita ou ingrediente…" autocomplete="off"></div>
    <button class="btn primary" id="btn-new" type="button"></button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Categorias" style="margin-bottom:18px"></div>
  <div class="card" id="slots-card" style="margin-bottom:22px;padding:16px 20px"></div>
  <div id="list"><div class="loading"><div><div class="spinner"></div>Carregando…</div></div></div>

  <!-- Ver receita -->
  <dialog id="dlg-view" data-modal class="wide" aria-labelledby="v-title">
    <div class="dlg-head"><h2 id="v-title"></h2><button class="btn ghost icon-only" type="button" data-close aria-label="Fechar"></button></div>
    <div class="dlg-body" id="v-body"></div>
  </dialog>

  <!-- Nova / editar receita -->
  <dialog id="dlg-form" data-modal class="wide" aria-labelledby="f-title">
    <div class="dlg-head"><h2 id="f-title">Nova receita</h2><button class="btn ghost icon-only" type="button" data-close aria-label="Fechar"></button></div>
    <form id="form" class="dlg-body" novalidate>
      <div class="form-grid">
        <div class="field c8"><label for="r-name">Nome da receita</label><input type="text" id="r-name" name="name" maxlength="80" autocomplete="off"><small class="err" data-err="name"></small></div>
        <div class="field c4"><label for="r-category">Categoria</label><select id="r-category" name="category"></select><small class="err" data-err="category"></small></div>
        <div class="field c4 keep"><label for="r-yield">Rendimento</label><input type="text" id="r-yield" name="yield" maxlength="60" placeholder="Ex.: 30 unidades" autocomplete="off"><small class="err" data-err="yield"></small></div>
        <div class="field c4 keep"><label for="r-time">Tempo de preparo</label><input type="text" id="r-time" name="time" maxlength="60" placeholder="Ex.: 40 min" autocomplete="off"><small class="err" data-err="time"></small></div>
        <div class="field c4"><label for="r-price">Sugestão de preço (un.)</label><input type="text" inputmode="decimal" id="r-price" name="suggestedPrice" placeholder="0,00" autocomplete="off"><small class="err" data-err="suggestedPrice"></small></div>
        <div class="field c6"><label for="r-ing">Ingredientes e quantidades</label><textarea id="r-ing" name="ingredients" placeholder="Um por linha. Ex.:&#10;1 lata de leite condensado&#10;3 colheres (sopa) de chocolate em pó" style="min-height:150px"></textarea><small class="err" data-err="ingredients"></small></div>
        <div class="field c6"><label for="r-steps">Modo de preparo</label><textarea id="r-steps" name="steps" placeholder="Um passo por linha." style="min-height:150px"></textarea><small class="err" data-err="steps"></small></div>
        <div class="field"><label for="r-storage">Dicas de conservação <span class="opt">(opcional)</span></label><textarea id="r-storage" name="storage" maxlength="400" style="min-height:70px"></textarea></div>
        <div class="field"><span class="label">Foto <span class="opt">(opcional)</span></span>
          <div class="photo-pick"><div class="preview" id="preview">Sem foto</div><div class="row"><label class="btn sm" for="r-photo" style="cursor:pointer" id="photo-label"></label><input class="sr-only" type="file" id="r-photo" accept="image/*"><button class="btn sm ghost" type="button" id="photo-clear" hidden>Remover foto</button></div></div>
          <small class="err" data-err="photo"></small></div>
      </div>
      <div class="form-actions" style="margin-top:18px"><button class="btn primary" type="submit" id="btn-save">Salvar receita</button><button class="btn ghost" type="button" data-close>Cancelar</button></div>
    </form>
  </dialog>
</main>
<script src="js/calc.js"></script>
<script src="js/database.js"></script>
<script src="js/art.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/recipes-data.js"></script>
<script src="js/receitas.js"></script>
</body>
</html>
