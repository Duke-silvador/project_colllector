<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050305"><title>Xyfer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050305;color:#f6eef0;font-family:Arial,Helvetica,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit}.backdrop{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none}.backdrop.library{opacity:.45}header{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:3;display:flex;padding:5px;gap:4px;border:1px solid #ffffff20;border-radius:40px;background:#10090bb8;backdrop-filter:blur(20px)}header a{padding:11px 24px;border-radius:30px;text-decoration:none;font-size:13px;color:#c8b8bd}header a[aria-current=page]{background:#ffffff12;color:white}a:focus-visible,button:focus-visible{outline:2px solid #ff4769;outline-offset:4px}main{position:fixed;inset:110px 0 0;overflow:auto;padding:42px max(24px,8vw)}[hidden]{display:none!important}h1{font-size:clamp(38px,6vw,68px);letter-spacing:-3px;margin:0 0 36px;font-weight:500}.library-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:24px;max-width:820px}.game{display:block;width:100%;text-align:left;color:inherit;background:#150c10b8;border:1px solid #ffffff20;border-radius:22px;padding:0;overflow:hidden;transition:transform .2s,border-color .2s}.game:hover{transform:translateY(-5px);border-color:#e83a60}.art{height:190px;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 20%,#a82748,transparent 70%),linear-gradient(140deg,#220b13,#090608)}.art img{width:116px;height:116px;object-fit:cover;border-radius:25px;box-shadow:0 16px 45px #0008}.cube{width:70px;height:70px;border:4px solid #ffc2ce;transform:rotate(-12deg);box-shadow:10px 10px 0 #e3375a55;display:flex;align-items:center;justify-content:center;gap:14px}.cube:before,.cube:after{content:'';width:10px;height:15px;background:#ffc2ce}.details{display:flex;justify-content:space-between;align-items:center;padding:24px;font-size:20px;letter-spacing:-.5px}.details span:last-child{color:#ff7490}.credits{font-size:12px;color:#ae939c;line-height:1.7;margin-top:22px}.player{position:fixed;inset:0;z-index:5;background:#050305;display:flex;flex-direction:column}.toolbar{height:64px;flex-shrink:0;display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid #ffffff20}.toolbar strong{font-weight:500;font-size:14px;flex:1}.toolbar button,.toolbar a{background:#ffffff0b;border:1px solid #ffffff20;border-radius:8px;padding:9px 14px;color:white;text-decoration:none;font-size:12px}iframe{width:100%;flex:1;border:0;min-height:0}.status{color:#b99fa7;font-size:12px}@media(max-width:600px){main{padding-top:25px}.toolbar{gap:8px;padding:10px}.toolbar strong{font-size:12px}.status{display:none}}@media(prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<object class="backdrop" type="image/svg+xml" data="background.svg" aria-label="Xyfer animated background"></object>
<header aria-label="Main navigation"><a href="#home" id="home-link">Home</a><a href="#games" id="games-link">Games</a></header>
<main id="games" hidden><h1>Games</h1></main>
<section class="player" id="player" aria-label="Game player" hidden><div class="toolbar"><button id="back">← Games</button><strong id="game-title">Game</strong><span class="status" id="status" role="status">Loading player…</span><a id="separate" href="games/geometry-dash/" target="_blank" rel="noopener">Open separately ↗</a><button id="fullscreen">Fullscreen</button></div><iframe id="frame" title="Geometry Dash" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></section>
<template id="library-content"><div class="library-grid">
<button class="game" data-game="geometry-dash" aria-label="Play Geometry Dash"><div class="art"><img src="assets/icons/geometry-dash.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Geometry Dash</span><span aria-hidden="true">↗</span></div></button>
<button class="game" data-game="crazy-cattle-3d" aria-label="Play Crazy Cattle 3D"><div class="art"><img src="assets/icons/crazy-cattle-3d.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Crazy Cattle 3D</span><span aria-hidden="true">↗</span></div></button>
<button class="game" data-game="idle-breakout" aria-label="Play Idle Breakout"><div class="art"><img src="assets/icons/idle-breakout.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Idle Breakout</span><span aria-hidden="true">↗</span></div></button>
<button class="game" data-game="slope" aria-label="Play Slope"><div class="art"><img src="assets/icons/slope.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Slope</span><span aria-hidden="true">↗</span></div></button>
</div><p class="credits">Geometry Dash web port: <a href="https://github.com/AlexBoops/geometry-dash-webport" target="_blank" rel="noopener">AlexBoops</a> · bog / truffled · About 367 MB<br>Crazy Cattle 3D: <a href="https://4nn4t4t.itch.io/crazycattle3d" target="_blank" rel="noopener">Anna Mayberry</a> · <a href="https://gn-math.dev/?id=164" target="_blank" rel="noopener">GN Math web build</a> · About 72 MB<br>Idle Breakout: <a href="https://kodiqi.itch.io/idle-breakout" target="_blank" rel="noopener">Kodiqi</a> · Progress saves in this browser. Use the same browser and keep its site data.<br>Slope: Unity WebGL build · About 14 MB<br>Game files download on launch.</p></template>
<script>
try{sessionStorage.removeItem('xyfer-start:'+location.pathname)}catch{}
const catalog={'geometry-dash':{title:'Geometry Dash',path:'games/geometry-dash/'},'crazy-cattle-3d':{title:'Crazy Cattle 3D',path:'games/crazy-cattle-3d/'},'idle-breakout':{title:'Idle Breakout',path:'games/idle-breakout/'},slope:{title:'Slope',path:'games/slope/'}};let selected='geometry-dash';
const games=document.querySelector('#games'),player=document.querySelector('#player'),frame=document.querySelector('#frame'),background=document.querySelector('.backdrop');
function route(){const active=location.hash==='#games';if(active&&!games.dataset.loaded){games.dataset.loaded='true';games.insertAdjacentHTML('beforeend',document.querySelector('#library-content').innerHTML);games.querySelectorAll('[data-game]').forEach(button=>button.onclick=openPlayer);}games.hidden=!active;background.classList.toggle('library',active);for(const name of ['home','games']){const link=document.querySelector('#'+name+'-link');if((name==='games')===active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')}if(!player.hidden)closePlayer()}
function closePlayer(){player.hidden=true;frame.removeAttribute('src');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});games.querySelector('[data-game="'+selected+'"]')?.focus()}
function openPlayer(event){selected=event.currentTarget.dataset.game;const game=catalog[selected];player.hidden=false;document.querySelector('#game-title').textContent=game.title;document.querySelector('#separate').href=game.path;frame.title=game.title;document.querySelector('#status').textContent='Loading player…';frame.src=game.path;frame.focus()}window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;const states={'xyfer-player-ready':selected==='geometry-dash'?'Click Load game to start':'Loading game…','xyfer-game-loading':'Loading game…','xyfer-game-ready':'Ready','xyfer-game-error':'Unable to load. Please retry.'};if(states[event.data?.type])document.querySelector('#status').textContent=states[event.data.type]});frame.onerror=()=>{document.querySelector('#status').textContent='Unable to load. Please retry.'};document.querySelector('#back').onclick=closePlayer;document.querySelector('#fullscreen').onclick=()=>player.requestFullscreen().catch(()=>{document.querySelector('#status').textContent='Use Open separately for a larger view'});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!player.hidden&&!document.fullscreenElement)closePlayer()});addEventListener('hashchange',route);route();if(location.search)history.replaceState(null,'',location.pathname+location.hash);
</script>
</body></html>
