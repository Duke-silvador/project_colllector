<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>دانلود راهنمای نویسندگان</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="keywords" content="مطالعات زبان روسی, زبان روسی, آموزش زبان روسی, مقالات روسی, پژوهش زبان روسی, زبان‌شناسی روسی, ادبیات روسیه, فرهنگ روسیه, ترجمه روسی, نشریه علمی زبان روسی, دوفصلنامه مطالعات زبان روسی, نشریه دانشگاهی, پژوهش‌های علمی, داوری علمی">
<meta name="description" content="دوفصلنامه مطالعات زبان روسی؛ مقالات علمی و پژوهش‌های تخصصی در زبان روسی، آموزش زبان، زبان‌شناسی، ادبیات، فرهنگ و ترجمه.">
</head>
<body style="padding:40px;text-align:center;font-family:Tahoma,sans-serif;background:#faf7ec">
<p id="msg">در حال آماده‌سازی فایل PDF…</p>
<script src="assets/ag-pdf-part-0.js"></script>
<script src="assets/ag-pdf-part-1.js"></script>
<script src="assets/ag-pdf-part-2.js"></script>
<script src="assets/ag-pdf-part-3.js"></script>
<script src="assets/ag-pdf-part-4.js"></script>
<script src="assets/ag-pdf-join.js"></script>
<script>
(function(){
  try{
    const b64=window.RLS_AG_PDF_B64;
    if(!b64){ throw new Error('داده فایل بارگذاری نشد'); }
    const bin=atob(b64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const blob=new Blob([arr],{type:"application/pdf"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="راهنمای-نویسندگان-RLS.pdf";
    document.body.appendChild(a);a.click();
    document.getElementById("msg").innerHTML='اگر دانلود آغاز نشد، <a href="'+url+'" target="_blank">اینجا کلیک کنید</a> تا فایل باز شود.';
    setTimeout(function(){ location.href=url; }, 400);
  }catch(e){
    document.getElementById("msg").textContent="خطا: "+e.message;
  }
})();
</script>
</body></html>
