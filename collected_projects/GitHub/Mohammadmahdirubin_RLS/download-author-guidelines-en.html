<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Download Author Guidelines</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/style.css?v=20261029navfix">
<meta name="keywords" content="مطالعات زبان روسی, زبان روسی, آموزش زبان روسی, مقالات روسی, پژوهش زبان روسی, زبان‌شناسی روسی, ادبیات روسیه, فرهنگ روسیه, ترجمه روسی, نشریه علمی زبان روسی, دوفصلنامه مطالعات زبان روسی, نشریه دانشگاهی, پژوهش‌های علمی, داوری علمی">
<meta name="description" content="دوفصلنامه مطالعات زبان روسی؛ مقالات علمی و پژوهش‌های تخصصی در زبان روسی، آموزش زبان، زبان‌شناسی، ادبیات، فرهنگ و ترجمه.">
</head>
<body style="padding:40px;text-align:center;font-family:system-ui,sans-serif;background:#faf7ec">
<p id="msg">Preparing PDF…</p>
<script src="assets/author-guidelines-pdf-data-en.js"></script>
<script>
(function(){
  try{
    const b64=window.RLS_AG_PDF_B64_EN;
    const bin=atob(b64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const blob=new Blob([arr],{type:"application/pdf"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="RLS-Author-Guidelines.pdf";
    document.body.appendChild(a);a.click();
    document.getElementById("msg").innerHTML='If download did not start, <a href="'+url+'" target="_blank">click here</a> to open the PDF.';
    setTimeout(function(){ location.href=url; }, 400);
  }catch(e){
    document.getElementById("msg").textContent="Error: "+e.message;
  }
})();
</script>
</body></html>
