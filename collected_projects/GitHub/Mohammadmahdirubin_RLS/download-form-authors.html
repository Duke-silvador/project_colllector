<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دانلود فرم مشخصات نویسندگان</title>
<style>body{font-family:Tahoma,sans-serif;text-align:center;padding:48px 20px;background:#faf7ec}a{color:#1a5fb4;font-weight:700}</style>
<meta name="keywords" content="مطالعات زبان روسی, زبان روسی, آموزش زبان روسی, مقالات روسی, پژوهش زبان روسی, زبان‌شناسی روسی, ادبیات روسیه, فرهنگ روسیه, ترجمه روسی, نشریه علمی زبان روسی, دوفصلنامه مطالعات زبان روسی, نشریه دانشگاهی, پژوهش‌های علمی, داوری علمی">
<meta name="description" content="دوفصلنامه مطالعات زبان روسی؛ مقالات علمی و پژوهش‌های تخصصی در زبان روسی، آموزش زبان، زبان‌شناسی، ادبیات، فرهنگ و ترجمه.">
</head>
<body>
<p id="m">در حال آماده‌سازی فایل Word…</p>
<script src="assets/rls_form-part-0.js"></script>
<script src="assets/rls_form-part-1.js"></script>
<script src="assets/rls_form-part-2.js"></script>
<script src="assets/rls_form-part-3.js"></script>
<script src="assets/rls_form-part-4.js"></script>
<script src="assets/rls_form-join.js"></script>
<script>
(function(){
  try{
    var b64=window.RLS_FORM_B64;
    if(!b64) throw new Error('داده بارگذاری نشد');
    var bin=atob(b64);
    var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var blob=new Blob([arr],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="RLS-form-author-details.docx";
    document.body.appendChild(a);a.click();
    document.getElementById("m").innerHTML='اگر دانلود شروع نشد، <a href="'+url+'" download="RLS-form-author-details.docx">اینجا کلیک کنید</a>.';
  }catch(e){ document.getElementById("m").textContent="خطا: "+e.message; }
})();
</script>
</body></html>
