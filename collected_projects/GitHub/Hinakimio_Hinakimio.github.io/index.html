<style>
:root{
  color-scheme:light;
  --paper:#faf9f6; --ink:#262324; --muted:#77716f;
  --line:rgba(38,35,36,.13); --accent:#b77465;
  --serif:"Bodoni MT","Times New Roman","Noto Serif SC","Songti SC",SimSun,serif;
  --sans:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;line-height:1.75}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ---------- 顶栏 ---------- */
.site-header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;
  justify-content:space-between;padding:20px clamp(18px,4vw,52px);
  background:rgba(250,249,246,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.wordmark strong{font-family:var(--serif);font-size:17px;letter-spacing:.16em;font-weight:600}
.wordmark small{display:block;font-size:9.5px;letter-spacing:.28em;color:var(--muted);margin-top:2px}
.site-nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.site-nav button{border:1px solid transparent;background:none;color:var(--muted);
  padding:6px 13px;border-radius:999px;font-size:13px;letter-spacing:.04em;transition:.18s}
.site-nav button:hover{color:var(--ink)}
.site-nav button.on{color:var(--ink);border-color:var(--line);background:#fff}

/* ---------- 门 ---------- */
.access-gate{position:relative;overflow:hidden;min-height:100vh;display:grid;place-items:center;text-align:center;padding:0 24px}
.gate-bg{position:absolute;inset:0;background-size:cover;background-position:center 32%;
  transform:scale(1.04);filter:blur(1.2px) saturate(1.06);opacity:0;transition:opacity 1.1s ease}
.gate-bg.ready{opacity:1}
.gate-bg::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(62% 46% at 50% 40%,rgba(250,249,246,.96) 0%,rgba(250,249,246,.8) 48%,rgba(250,249,246,0) 100%),
    linear-gradient(180deg,rgba(250,249,246,.34) 0%,rgba(250,249,246,.58) 62%,rgba(250,249,246,.92) 100%)}
.access-form{position:relative;z-index:2}
.eyebrow{font-size:10.5px;letter-spacing:.34em;color:var(--muted);margin:0 0 22px;text-transform:uppercase}
.access-form h1{font-family:var(--serif);font-size:clamp(38px,8.5vw,76px);
  margin:0 0 20px;font-weight:400;letter-spacing:.02em;line-height:1.16}
.accent-dot{color:var(--accent)}
.gate-note{color:var(--muted);font-size:14.5px;margin:0 0 38px;letter-spacing:.03em}
.enter-button{display:inline-flex;align-items:center;gap:9px;background:none;
  border:1px solid var(--line);border-radius:999px;padding:12px 26px;font-size:13.5px;
  letter-spacing:.08em;color:var(--ink);transition:.22s}
.enter-button:hover{border-color:var(--accent);color:var(--accent)}
.enter-button:hover svg{transform:translateX(4px)}
.enter-button svg{transition:transform .22s}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:92vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:120px 24px 80px;text-align:center}
.hero-art{border:0;background:none;padding:0;max-width:min(560px,74vw);cursor:zoom-in;
  display:flex;align-items:center;justify-content:center}
.hero-art img{width:100%;display:block;border-radius:3px;
  box-shadow:0 22px 60px -22px rgba(38,35,36,.34)}
.hero-caption{margin-top:34px}
.hero-caption h1{font-family:var(--serif);font-size:clamp(30px,5.4vw,48px);
  margin:0 0 10px;font-weight:400}
.hero-caption p:not(.eyebrow){color:var(--muted);margin:0;font-size:13.5px;letter-spacing:.06em}
.hero-intro{color:var(--muted);margin:20px 0 0;font-size:13.5px;line-height:2.05;letter-spacing:.02em;max-width:390px}
.hero-counts{margin:20px 0 0;font-size:11.5px;letter-spacing:.16em;color:var(--muted)}
.hero-cta{display:inline-block;margin-top:22px;font-size:12px;letter-spacing:.14em;
  color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:3px;transition:.2s}
.hero-cta:hover{color:var(--accent);border-color:var(--accent)}
@media (min-width:900px){
  .hero{flex-direction:row;align-items:center;justify-content:center;
    gap:clamp(40px,4.5vw,96px);text-align:left;
    padding:104px clamp(32px,5vw,80px) 64px;
    max-width:1560px;margin:0 auto}
  .hero-art{flex:0 1 auto;max-width:min(1060px,52vw);max-height:74vh}
  .hero-art img{width:100%;height:auto;max-height:74vh;object-fit:contain}
  .hero-caption{flex:1 1 340px;margin-top:0;max-width:460px;text-align:left}
  .hero-caption h1{font-size:clamp(34px,3.4vw,54px);line-height:1.1}
  .hero-caption p:not(.eyebrow){font-size:14px;line-height:1.9}
}
.hero-scroll{position:absolute;bottom:34px;font-size:19px;color:var(--muted);
  animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(7px);opacity:1}}

/* ---------- 作品区 ---------- */
.gallery-section{padding:26px clamp(18px,4vw,52px) 110px;max-width:1560px;margin:0 auto}
.gallery-heading{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.gallery-heading h2{font-family:var(--serif);font-size:clamp(24px,3.6vw,34px);
  margin:0;font-weight:400;letter-spacing:.01em}
.gallery-heading p{margin:0;color:var(--muted);font-size:12.5px;letter-spacing:.06em}
.gallery-toolbar{display:flex;justify-content:space-between;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.categories{display:flex;gap:6px;flex-wrap:wrap}
.categories button{border:1px solid transparent;background:none;color:var(--muted);
  padding:6px 15px;border-radius:999px;font-size:12.5px;letter-spacing:.05em;transition:.18s}
.categories button:hover{color:var(--ink)}
.categories button.on{color:var(--ink);border-color:var(--line);background:#fff}
.gallery-search{border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);
  padding:7px 2px;font-size:13px;font-family:inherit;width:180px;transition:.2s}
.gallery-search:focus{outline:none;border-bottom-color:var(--accent);width:230px}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:clamp(14px,1.8vw,26px);align-items:start}
.card{border:0;background:none;padding:0;text-align:left;position:relative;
  border-radius:3px;overflow:hidden;transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.card:hover{transform:translateY(-5px)}
.card-img{aspect-ratio:9/16;overflow:hidden;background:#efece6;border-radius:3px}
/* 卡片框跟随图片自身比例（由 JS 写入 aspect-ratio），横图不再上下留白 */
.card-img img{width:100%;height:100%;object-fit:contain;display:block;
  opacity:0;transition:opacity .45s ease,transform .5s}
.card-img img.ready{opacity:1}
.card:hover .card-img img{transform:scale(1.045)}
.card:hover{box-shadow:0 16px 34px -22px rgba(38,35,36,.5)}
.card-meta{padding:11px 2px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.card-meta h3{margin:0;font-size:13.5px;font-weight:500;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-meta .res{display:block;font-size:10.5px;color:var(--muted);flex:0 0 auto;
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.gallery-empty{text-align:center;color:var(--muted);padding:70px 0;font-size:13.5px}
.cat-hint{margin:-12px 0 22px;color:var(--muted);font-size:10.5px;letter-spacing:.03em;
  line-height:1.8;opacity:.72}
#collection,#top{scroll-margin-top:104px}

/* ---------- 灯箱 ---------- */
.viewer{position:fixed;inset:0;z-index:80;background:rgba(250,249,246,.97);
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;flex-direction:column;
  padding:54px 64px 34px;opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s}
.viewer.on{opacity:1;visibility:visible}
.viewer-stage{flex:1 1 auto;min-height:0;max-width:100%;display:flex;align-items:center;justify-content:center}
.viewer-stage img{max-width:100%;max-height:100%;object-fit:contain;
  box-shadow:0 26px 70px -26px rgba(38,35,36,.4);border-radius:3px;
  transform:scale(.985);transition:transform .3s cubic-bezier(.2,.7,.3,1),opacity .2s ease}
.viewer.on .viewer-stage img{transform:scale(1)}
.viewer-info{flex:0 0 auto;margin-top:16px;text-align:center}
.viewer-info h3{margin:0 0 5px;font-family:var(--serif);font-size:19px;font-weight:400}
.viewer-info p{margin:0;color:var(--muted);font-size:11.5px;letter-spacing:.1em}
.viewer-close{position:absolute;top:18px;right:24px;font-size:30px;line-height:1;
  background:none;border:0;color:var(--muted);transition:.2s}
.viewer-close:hover{color:var(--ink)}
.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;
  font-size:38px;color:var(--muted);padding:0 22px;line-height:1;transition:.2s}
.viewer-nav:hover{color:var(--accent)}
#v-prev{left:6px}#v-next{right:6px}
.viewer-dl{display:inline-block;margin-top:14px;font-size:11.5px;letter-spacing:.12em;
  color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:2px;transition:.2s}
.viewer-dl:hover{color:var(--accent);border-color:var(--accent)}
.viewer-strip{flex:0 0 auto;display:flex;gap:8px;margin-top:14px;justify-content:center;
  max-width:min(600px,82vw);overflow-x:auto;padding:2px;scrollbar-width:none}
.viewer-strip::-webkit-scrollbar{display:none}
.viewer-strip button{flex:0 0 auto;width:54px;height:54px;padding:0;border:1px solid var(--line);

.viewer-strip button:hover{opacity:1}
.viewer-strip button.on{opacity:1;border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
.viewer-strip img{width:100%;height:100%;object-fit:cover;display:block}
[hidden]{display:none!important}
.card:focus-visible,.categories button:focus-visible,.site-nav button:focus-visible,

  outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
@media (max-width:560px){

  .cat-hint{font-size:10px;line-height:1.7}
  #collection,#top{scroll-margin-top:84px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .card,.card-img img,.viewer,.viewer-stage img,.enter-button svg{transition:none!important;animation:none!important}
  .viewer-stage img{transform:none}
}
</style>

let view = [], cur = 0, cat = 'all', q = '';

const $ = id => document.getElementById(id);

/* 灯箱优先加载 WebP（体积约原图 1/8）；缺失或浏览器不支持时自动回退原 PNG。
   下载按钮始终给原图，不走这里。 */
const webpOf = f => f.replace(/^works\//, 'viewer/').replace(/\.png$/i, '.webp');
const grid = $('grid'), filters = $('filters'), nav = $('nav');

/* 分类按钮：顶栏 + 工具条各一份（固定三项，不随数据变化） */
const cats = ['all', '壁纸', '衣柜', '设定'];
const catName = c => c === 'all' ? '全部' : c;
cats.forEach(c => {
  const b1 = document.createElement('button');
  b1.textContent = catName(c); b1.dataset.cat = c;
  b1.setAttribute('aria-pressed', String(c === 'all'));
  if (c === 'all') b1.classList.add('on');
  b1.onclick = () => setCat(c);
  nav.appendChild(b1);

  const b2 = document.createElement('button');
  b2.textContent = catName(c); b2.dataset.cat = c;
  b2.setAttribute('aria-pressed', String(c === 'all'));
  if (c === 'all') b2.classList.add('on');
  b2.onclick = () => setCat(c);
  filters.appendChild(b2);
});
function setCat(c) {
  cat = c;
  document.querySelectorAll('[data-cat]').forEach(b => {
    b.classList.toggle('on', b.dataset.cat === c);
    b.setAttribute('aria-pressed', String(b.dataset.cat === c));
  });
  render();
}

function render() {
  view = DATA.filter(d =>
    (cat === 'all' || d.cat === cat) &&
    (!q || d.title.toLowerCase().includes(q) || (d.sub || '').toLowerCase().includes(q))
  );
  $('count').textContent = view.length;
  $('empty').hidden = view.length > 0;
  const frag = document.createDocumentFragment();
  view.forEach((d, i) => {
    const c = document.createElement('button');
    c.className = 'card';
    const ar = (d.w && d.h) ? (d.w + '/' + d.h) : '9/16';
    const res = (d.w && d.h) ? (d.w + ' × ' + d.h) : '';
    c.innerHTML = '<div class="card-img" style="aspect-ratio:' + ar + '"><img loading="lazy" src="' + d.thumb + '" alt="' + d.title + '"></div>' +
                  '<div class="card-meta"><h3>' + d.title + '</h3><span class="res">' + res + '</span></div>';
    c.setAttribute('aria-label', d.title + '，' + d.cat + (res ? '，' + res : ''));
    c.onclick = () => open(i);
    frag.appendChild(c);
  });
  grid.replaceChildren(frag);
  grid.querySelectorAll('.card-img img').forEach(im => {
    if (im.complete && im.naturalWidth) im.classList.add('ready');
    else im.addEventListener('load', () => im.classList.add('ready'), { once: true });
  });
}

let lastFocus = null;
function open(i) {
  lastFocus = document.activeElement;
  cur = i; paint(); $('viewer').classList.add('on');
  document.body.style.overflow = 'hidden';
  /* 点击卡的默认聚焦会在 handler 之后发生，延迟一帧再抢焦点，否则焦点仍留在背景卡片上 */
  setTimeout(() => { if ($('viewer').classList.contains('on')) $('v-close').focus(); }, 0);
}
function close() {
  $('viewer').classList.remove('on');
  document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function step(n) { if (!view.length) return; cur = (cur + n + view.length) % view.length; paint(); }
function paint() {
  const d = view[cur]; if (!d) return;
  const im = $('v-img');
  im.style.opacity = '0';
  im.onload = () => { im.style.opacity = '1'; };
  im.onerror = () => { im.onerror = null; im.src = d.file; };   /* WebP 缺失/不支持 → 回退原 PNG */
  im.src = webpOf(d.file);
  if (im.complete) im.style.opacity = '1';
  im.alt = d.title;
  $('v-title').textContent = d.title;
  $('v-sub').textContent = (d.sub ? d.sub + ' · ' : '') + d.cat + ' · ' + (d.date || '') + '　' + (cur + 1) + '/' + view.length;
  $('v-dl').href = d.file;
  $('v-dl').setAttribute('download', d.title + (d.file.match(/\.[a-z]+$/i) || [''])[0]);
  preload((cur + 1) % view.length); preload((cur - 1 + view.length) % view.length);
  strip();
}
function preload(i) { const d = view[i]; if (d) { const p = new Image(); p.src = webpOf(d.file); } }

/* 灯箱底部：同分类其它作品 */
function strip() {
  const box = $('v-strip');
  const here = view[cur];
  if (!here) { box.replaceChildren(); box.hidden = true; return; }
  const same = view.map((d, i) => i).filter(i => view[i].cat === here.cat);
  if (same.length < 2) { box.replaceChildren(); box.hidden = true; return; }
  const pos = same.indexOf(cur);
  const picks = [pos - 2, pos - 1, pos, pos + 1, pos + 2]
    .filter(k => k >= 0 && k < same.length).map(k => same[k]);
  const frag = document.createDocumentFragment();
  picks.forEach(i => {
    const d = view[i];
    const b = document.createElement('button');
    b.className = 'viewer-strip-item' + (i === cur ? ' on' : '');
    b.setAttribute('aria-label', d.title);
    b.innerHTML = '<img src="' + d.thumb + '" alt="" loading="lazy">';
    b.onclick = () => jump(i);
    frag.appendChild(b);
  });
  box.replaceChildren(frag);
  box.hidden = false;
  const active = box.querySelector('.on');
  if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function jump(i) { cur = i; paint(); }

$('enter').onclick = () => { $('gate').hidden = true; $('stage').hidden = false; window.scrollTo(0, 0); };
$('v-close').onclick = close;
$('v-prev').onclick = () => step(-1);
$('v-next').onclick = () => step(1);
$('viewer').onclick = e => { if (e.target.id === 'viewer' || e.target.classList.contains('viewer-stage')) close(); };
$('search').oninput = e => { q = e.target.value.trim().toLowerCase(); render(); };
$('hero-art').onclick = () => {
  let i = view.findIndex(d => d.id === heroId);
  if (i < 0) { q = ''; $('search').value = ''; setCat('all'); i = view.findIndex(d => d.id === heroId); }
  if (i >= 0) open(i);
};
document.addEventListener('keydown', e => {
  if (!$('viewer').classList.contains('on')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

/* 灯箱焦点陷阱：收到 document 上，焦点被抢到背景时按 Tab 也能拉回灯箱内 */
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const v = $('viewer');
  if (!v.classList.contains('on')) return;
  const f = [...v.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (i === -1) { e.preventDefault(); (e.shiftKey ? f[f.length - 1] : f[0]).focus(); return; }
  if (e.shiftKey && i === 0) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
});

/* 手机左右滑动切换 */
let tx = 0, ty = 0;
$('viewer').addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
$('viewer').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
}, { passive: true });

/* Hero 选一张竖构图的作品（竖图在两栏布局里更撑得住） */
let heroId = null;
(function heroPick() {
  const prefer = ['书房写信_暮色窗景', '温室侍花_白玫瑰晨光', '湖畔写生_黄昏暖光'];
  let pick = null;
  for (const t of prefer) { pick = DATA.find(d => d.title === t); if (pick) break; }
  if (!pick) pick = DATA.find(d => d.w > d.h) || DATA[0];
  if (!pick) return;
  heroId = pick.id;
  $('hero-img').src = (pick.title === '书房写信_暮色窗景') ? 'hero/hero.jpg' : pick.thumb;
  $('hero-img').alt = pick.title;
  $('hero-count').textContent = DATA.length;
  const n = c => DATA.filter(d => d.cat === c).length;
  $('hero-counts').textContent = '壁纸 ' + n('壁纸') + '　衣柜 ' + n('衣柜') + '　设定 ' + n('设定');
})();

/* 入场门背景：优先选场景感强的壁纸，找不到就用最新一张 */
(function gateBg() {
  const walls = DATA.filter(d => d.cat === '壁纸');
  const prefer = ['花园茶会_睡莲池侍茶', '雨天图书室_炉边阅读', '书房写信_暮色窗景',
                  '温室侍花_白玫瑰晨光', '琴房午后_窗外玫瑰园'];
  let pick = null;
  for (const t of prefer) { pick = walls.find(d => d.title === t); if (pick) break; }
  if (!pick) pick = (walls.length ? walls : DATA).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
  if (!pick) return;
  const el = $('gate-bg');
  const img = new Image();
  img.onload = () => { el.style.backgroundImage = 'url("' + pick.thumb + '")'; el.classList.add('ready'); };
  img.src = pick.thumb;
})();
render();
</script>
