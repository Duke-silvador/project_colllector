<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>沐晴转换器 · 正在连接</title>
<meta name="theme-color" content="#f5f5f7">
<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --sub:#6e6e73; --faint:#aeaeb2;
    --accent:#0a84ff; --ok:#34c759; --bad:#ff3b30;
    --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;font-size:15px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:30px 26px;max-width:400px;width:100%;text-align:center}
  .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;
    background:linear-gradient(145deg,#0a84ff,#0060df);display:flex;align-items:center;
    justify-content:center;box-shadow:0 6px 18px rgba(10,132,255,.32)}
  .logo svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:18px;margin:0 0 6px;font-weight:700;letter-spacing:.2px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:22px;line-height:1.6}
  .status{display:flex;align-items:center;justify-content:center;gap:9px;
    background:#f5f5f7;border-radius:11px;padding:12px 14px;font-size:13.5px;
    font-weight:600;margin-bottom:18px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .dot.ok{background:var(--ok);animation:pulse 2.2s ease-in-out infinite}
  .dot.bad{background:var(--bad)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.45)}
                   50%{box-shadow:0 0 0 6px rgba(52,199,89,0)}}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:background .15s}
  .btn:hover{background:#0070e0}
  .btn:disabled{background:#c7c7cc;cursor:default}
  .btn.ghost{background:#eef1f5;color:var(--ink);margin-top:9px;font-size:14px}
  .btn.ghost:hover{background:#e2e5ea}
  .meta{margin-top:18px;padding-top:16px;border-top:1px solid #f0f0f2;
    font-size:11.5px;color:var(--faint);line-height:1.7;text-align:left}
  .meta b{color:var(--sub);font-weight:600}
  .hidden{display:none}
  .err{background:#ffebea;color:var(--bad);border-radius:11px;padding:12px 14px;
    font-size:13px;text-align:left;line-height:1.6;margin-bottom:14px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg>
  </div>
  <h1>沐晴科技转换器</h1>
  <div class="sub">固定入口 · 自动找到当前地址</div>

  <div id="errBox" class="err hidden"></div>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="txt">正在查找服务器…</span>
  </div>

  <button class="btn" id="go" onclick="jump()" disabled>正在连接…</button>
  <button class="btn ghost" onclick="lookup(true)">重新查找</button>

  <div class="meta">
    <div><b>这个地址永远不会变</b>，可以存成书签/加到主屏幕。</div>
    <div style="margin-top:5px">服务器重启后地址会自动更新到这里，你不用管。</div>
    <div style="margin-top:5px">上次更新：<span id="upd">—</span></div>
  </div>
</div>

<script>
/* 沐晴转换器 · 固定跳转入口
 * 数据源：同仓库的 addr.json（由主应用自动更新）
 * 本页不含任何密钥：监控口令 k 由 addr.json 携带，仅在本机浏览器内用于拼 URL。 */

var API = 'https://api.github.com/repos/56gfy/mq-jump/contents/addr.json';
var addr = null;

function el(id){ return document.getElementById(id); }
function setDot(kind){ el('dot').className = 'dot' + (kind ? ' ' + kind : ''); }

function b64decode(s){
  // 处理 UTF-8 + 换行
  s = String(s).replace(/\s/g, '');
  try { return decodeURIComponent(escape(atob(s))); }
  catch(e){ try { return atob(s); } catch(e2){ return ''; } }
}

function lookup(manual){
  if (manual){ el('txt').textContent = '正在重新查找…'; setDot(''); }
  var url = API + '?t=' + Date.now();          // 绕开 CDN 缓存
  fetch(url, {cache:'no-store'}).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(j){
    var txt = b64decode(j.content || '');
    var d = JSON.parse(txt);
    if (!d || !d.url) throw new Error('addr.json 里没有 url 字段');
    addr = d;
    el('upd').textContent = d.updated ? d.updated : '未知';
    var age = d.ts ? Math.round((Date.now() - d.ts) / 1000) : -1;
    /* v2.13.7：ts 现在由主应用每 2 分钟心跳刷新（不只是地址变更时写），
       所以 age 表达的是「最后一次确认服务器在线的时间」。
       三档判据：
         < 10 分钟  → 在线，直接跳
         < 1 小时   → 地址可能仍有效，但电脑可能已关机/休眠，让用户自己点
         >= 1 小时  → 基本是电脑关了，明确说清楚，别让用户以为 app 坏了 */
    if (age >= 0 && age < 600) {
      el('txt').textContent = '服务器在线 · ' + (age < 120 ? '刚刚更新' : Math.round(age/60) + ' 分钟前更新');
      setDot('ok');
      el('go').disabled = false;
      el('go').textContent = '进入手机监控';
    } else if (age >= 0 && age < 3600) {
      el('txt').textContent = '地址可能仍有效（' + Math.round(age/60) + ' 分钟未更新）';
      setDot('');
      el('go').disabled = false;
      el('go').textContent = '试着进入';
    } else {
      var mins = Math.round(age/60);
      var when = mins < 120 ? mins + ' 分钟' : Math.round(mins/60) + ' 小时';
      el('txt').textContent = '电脑可能没开机（地址已 ' + when + ' 未更新）';
      setDot('bad');
      el('go').disabled = false;          // 仍允许点：万一只是内网抖动
      el('go').textContent = '仍然尝试进入';
      el('errBox').className = 'err';
      el('errBox').innerHTML = '这台电脑已经 ' + when + ' 没上报状态了，多半是关机或休眠。' +
        '<br>开机后本页会自动恢复，不用改任何设置。';
    }
    if (!manual) setTimeout(jump, 700);        // 自动跳转
  }).catch(function(e){
    setDot('bad');
    el('txt').textContent = '暂时找不到服务器';
    el('go').disabled = true;
    el('go').textContent = '连接不可用';
    el('errBox').className = 'err';
    el('errBox').innerHTML = '读取地址失败：' + e.message +
      '<br><br>可能原因：① 电脑没开机 ② 地址还没同步 ③ 网络抖动。' +
      '<br>稍后点「重新查找」再试。';
  });
}

function jump(){
  if (!addr || !addr.url) return;
  var base = String(addr.url).replace(/\/+$/, '');      // 去掉尾部斜杠
  // ⚠ 必须补 /m 路径 —— addr.json 里存的是裸主机
  //   （如 https://xxx.trycloudflare.com），手机监控页在 /m。
  //   漏了 /m 会跳到隧道根路径 → 404 或空白页。
  if (!/\/m(\/|$|#|\?)/.test(base)) base += '/m';
  var u = base + (addr.token ? ('#k=' + encodeURIComponent(addr.token)) : '');
  location.href = u;
}

lookup(false);
// 页面回到前台时自动刷新（手机切回浏览器）
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && !addr) lookup(true);
});
</script>
</body>
</html>
