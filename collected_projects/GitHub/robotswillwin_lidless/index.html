<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#000000">
  <title>Lidless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Kalam:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,500&display=swap">
</head>
<body>
  <main class="stage">
    <canvas id="game" width="960" height="540" aria-label="Lidless: a rainy street at night outside a radio repair shop."></canvas>
    <p id="stats" class="stats" hidden></p>
    <div id="fade" class="fade" aria-hidden="true"></div>
    <p id="error" class="error" hidden></p>
    <div id="turn" class="turn" role="dialog" aria-label="Turn your phone sideways">
      <svg class="turn-phone" viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="10" width="20" height="36" rx="3"/><path d="M14 50 a 22 22 0 0 0 36 0"/><path d="M46 46 l 4 4 l -6 1"/></svg>
      <p>Turn your phone sideways</p>
      <button type="button" class="turn-anyway">Play upright anyway</button>
    </div>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
