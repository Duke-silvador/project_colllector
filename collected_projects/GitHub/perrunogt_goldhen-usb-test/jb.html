<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GOLDHEN USB · PERRUNOGT</title>

  <style>
    :root {
      --bg:     #04080f;
      --panel:  #070d18;
      --cyan:   #00e5ff;
      --cyan2:  #80f0ff;
      --yellow: #ffe033;
      --yellow2:#fff0a0;
      --dim:    #1a3040;
      --muted:  #3a5a6a;
      --text:   #cce8f0;
      --white:  #ffffff;
      --red:    #ff4466;
      --mono:   'Courier New', Courier, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
    }

    /* fondo con líneas de scan muy sutiles */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,229,255,0.012) 3px,
        rgba(0,229,255,0.012) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    #hdr {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--dim);
      background: rgba(4,8,15,0.92);
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    #hdr-left { font-size: 10px; letter-spacing: .18em; color: var(--muted); }
    #hdr-left span { color: var(--cyan); }
    #hdr-right {
      font-size: 9px; letter-spacing: .22em;
      color: var(--muted);
    }
    #hdr-right span { color: var(--cyan2); }

    /* ── CENTRO ── */
    #center {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      z-index: 1;
    }

    /* logo / marca */
    #logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 42px;
    }

    #logo-icon {
      position: relative;
      width: 64px; height: 64px;
    }
    /* cuadrado girado */
    #logo-icon::before {
      content: '';
      position: absolute;
      inset: 10px;
      background: transparent;
      border: 2px solid var(--cyan);
      transform: rotate(45deg);
      box-shadow: 0 0 12px rgba(0,229,255,.4), inset 0 0 8px rgba(0,229,255,.08);
    }
    /* punto central */
    #logo-icon::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 8px; height: 8px;
      background: var(--cyan);
      border-radius: 2px;
      transform: translate(-50%,-50%) rotate(45deg);
      box-shadow: 0 0 8px var(--cyan);
    }

    #brand-name {
      font-size: clamp(22px, 6vw, 30px);
      letter-spacing: .12em;
      color: var(--white);
      text-shadow: 0 0 20px rgba(0,229,255,.35);
    }
    #brand-sub {
      font-size: 9px;
      letter-spacing: .32em;
      color: var(--muted);
      margin-top: -6px;
    }

    /* ── BARRA DE ESTADO ── */
    #status-block {
      width: min(88vw, 380px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #status-line {
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--muted);
      min-height: 16px;
      transition: color .3s;
    }
    #status-line.active { color: var(--cyan); }
    #status-line.ok     { color: var(--cyan2); }
    #status-line.bad    { color: var(--red); }

    /* barra de progreso */
    #bar-track {
      width: 100%;
      height: 2px;
      background: var(--dim);
      position: relative;
      overflow: hidden;
    }
    #bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--cyan2));
      box-shadow: 0 0 6px rgba(0,229,255,.3);
    }

    /* fw / info row */
    #info-row {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      letter-spacing: .1em;
      color: var(--muted);
    }
    #info-row span { color: var(--dim); }
    #info-row span.lit { color: var(--cyan2); }

    /* mensaje final */
    #msg {
      font-size: 10px;
      letter-spacing: .18em;
      color: var(--red);
      text-align: center;
      min-height: 14px;
    }
    body.done #msg { color: var(--cyan); }

    /* estados globales — DONE: todo amarillo */
    body.done { background: #0a0900; }
    body.done #bar-fill { width: 100% !important; background: linear-gradient(90deg, var(--yellow), var(--yellow2)); box-shadow: 0 0 6px rgba(255,224,51,.3); }
    body.done #bar-track::after { display: none; }
    body.done #logo-icon::before { border-color: var(--yellow); box-shadow: 0 0 20px rgba(255,224,51,.5); }
    body.done #logo-icon::after  { background: var(--yellow); box-shadow: 0 0 14px var(--yellow); }
    body.done #brand-name { color: var(--yellow); text-shadow: 0 0 24px rgba(255,224,51,.6); }
    body.done #brand-sub  { color: var(--yellow2); opacity: .7; }
    body.done #hdr  { border-color: rgba(255,224,51,.2); }
    body.done #ftr  { border-color: rgba(255,224,51,.2); }
    body.done #hdr-left span { color: var(--yellow); }
    body.done #fw-badge   { color: var(--yellow2); }
    body.done body::after { background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,224,51,.012) 3px, rgba(255,224,51,.012) 4px); }
    body.done #status-line { color: var(--yellow); }
    body.done #msg { color: var(--yellow2); }
    body.done #pct-label { color: var(--yellow); }

    body.fail #bar-fill  { background: var(--red); box-shadow: 0 0 8px var(--red); }
    body.fail #logo-icon::before { border-color: var(--red); box-shadow: 0 0 12px rgba(255,68,102,.4); }
    body.fail #logo-icon::after  { background: var(--red); box-shadow: 0 0 8px var(--red); }
    body.fail #brand-name { color: var(--red); text-shadow: none; }

    /* cartelito toast de éxito */
    #toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(10, 8, 0, 0.95);
      border: 1px solid var(--yellow);
      border-radius: 10px;
      padding: 14px 28px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .14em;
      color: var(--yellow);
      text-align: center;
      box-shadow: 0 0 24px rgba(255,224,51,.25), 0 4px 20px rgba(0,0,0,.6);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast::before {
      content: '✓ ';
      color: var(--yellow);
    }

    /* ── FOOTER ── */
    #ftr {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-top: 1px solid var(--dim);
      background: rgba(4,8,15,0.92);
      backdrop-filter: blur(6px);
      z-index: 10;
      font-size: 9px;
      letter-spacing: .18em;
      color: var(--muted);
    }
    #ftr-credits { color: var(--dim); font-size: 8px; letter-spacing: .12em; text-align: right; }
    #ftr-credits span { color: var(--muted); }

    /* ── LOG MODE ── */
    body.log {
      display: block;
      overflow: auto;
      padding: 20px;
    }
    body.log::after,
    body.log #hdr,
    body.log #center,
    body.log #ftr { display: none; }

    body.log #wrap { display: block; max-width: 900px; margin: 0 auto; }
    body.log #state {
      display: block;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    body.log #out {
      display: block;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      padding: 16px;
      white-space: pre-wrap;
      font: 11px/1.7 var(--mono);
      color: var(--text);
      background: rgba(255,255,255,.02);
      border: 1px solid var(--dim);
      border-radius: 8px;
    }
    .ok, .safe { color: var(--cyan); }
    .bad, .danger { color: var(--red); }
    .warn { color: #e3b341; }

    #wrap { padding: 0; }
    #state, #out { display: none; }

    @media (max-width: 480px) {
      #hdr { padding: 10px 16px; }
      #ftr { padding: 10px 16px; flex-direction: column; gap: 4px; text-align: center; }
      #ftr-credits { text-align: center; }
    }
  </style>
</head>
<body>

  <!-- header -->
  <header id="hdr">
    <div id="hdr-left">SYS / <span>GOLDHEN USB</span></div>
    <div id="hdr-right">FW <span id="fw-badge">--</span></div>
  </header>

  <!-- contenido central -->
  <main id="center">

    <div id="logo-wrap">
      <div id="logo-icon"></div>
      <div id="brand-name">PERRUNOGT</div>
      <div id="brand-sub">CARGA POR USB · PS4 11.00 – 13.52</div>
    </div>

    <div id="status-block">
      <div id="status-line">Exploit carga GoldHEN por USB...</div>
      <div id="bar-track"><div id="bar-fill"></div></div>
      <div id="info-row">
        <div>RAW GAME <span class="lit">&amp;</span> SISTRO</div>
        <div><span id="pct-label">0%</span></div>
      </div>
      <div id="msg"></div>
    </div>

  </main>

  <!-- toast de éxito -->
  <div id="toast">GoldHEN cargado correctamente</div>

  <!-- footer -->
  <footer id="ftr">
    <div>PERRUNOGT // GH-HOST</div>
    <div id="ftr-credits">Raw game y <span>Sistro</span> — distribución del exploit</div>
  </footer>

  <!-- log mode (oculto en modo normal) -->
  <div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
  </div>

  <script>
    // Conecta el UI con los eventos del jb.js
    // jb.js llama a finishUI(ok) y usa document.getElementById("state") / "out"
    // Aquí interceptamos body.className para actualizar la barra y el texto

    const statusEl  = document.getElementById('status-line');
    const barFill   = document.getElementById('bar-fill');
    const msgEl     = document.getElementById('msg');
    const pctLabel  = document.getElementById('pct-label');
    const fwBadge   = document.getElementById('fw-badge');
    const toastEl   = document.getElementById('toast');

    // Progreso simulado mientras el exploit corre
    let pct = 0;
    let simTimer = null;

    function setPct(v) {
      pct = Math.min(v, 98);
      barFill.style.width = pct + '%';
      pctLabel.textContent = Math.round(pct) + '%';
    }

    function startSim() {
      simTimer = setInterval(() => {
        if (pct < 60) setPct(pct + 1.2);
        else if (pct < 85) setPct(pct + 0.4);
        else if (pct < 95) setPct(pct + 0.1);
      }, 300);
    }

    function stopSim() { clearInterval(simTimer); }

    // Observar cambios en body.className para reaccionar a done/fail
    const bodyObs = new MutationObserver(() => {
      const cls = document.body.className;
      if (cls === 'done') {
        stopSim();
        setPct(100);
        statusEl.className = 'ok';
        statusEl.textContent = 'GoldHEN cargado correctamente';
        msgEl.textContent = 'DONE';
        toastEl.classList.add('show');
      } else if (cls === 'fail') {
        stopSim();
        statusEl.className = 'bad';
        statusEl.textContent = 'Error en el exploit';
        msgEl.textContent = document.body.className === 'fail'
          ? 'Reinicia la consola e intenta de nuevo'
          : '';
      }
    });
    bodyObs.observe(document.body, { attributes: true, attributeFilter: ['class'] });

    // Leer firmware del UA para el badge
    const ua = navigator.userAgent;
    const fwM = ua.match(/PlayStation 4\/(\d+\.\d+)/);
    if (fwM) fwBadge.textContent = fwM[1];

    // Actualizar texto de estado según el log del exploit
    const outEl = document.getElementById('out');
    const outObs = new MutationObserver(() => {
      const txt = outEl.innerText || '';
      const lines = txt.trim().split('\n');
      const last = lines[lines.length - 1] || '';
      if (last) {
        statusEl.className = 'active';
        // extraer solo la parte útil (antes del doble espacio)
        const clean = last.split('  ')[0].replace(/^[A-Z\-]+\s*/, '').trim();
        if (clean) statusEl.textContent = clean || last;
      }
    });
    outObs.observe(outEl, { childList: true, subtree: true, characterData: true });

    // Arrancar simulación de progreso
    startSim();
    statusEl.className = 'active';
  </script>

  <script type="module">
    import "./jb.js?v=10";
  </script>

</body>
</html>
