<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7C8DA" />
    <meta name="description" content="Cuide do seu sorriso! Ajude o Dentinho a pegar alimentos saudáveis e desviar de doces neste jogo de reflexos." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Dentinho Feliz · Cuide do seu sorriso</title>
  </head>
  <body>
    <main id="app" aria-label="Jogo Dentinho Feliz">
      <div id="game-container" aria-label="Área do jogo. Arraste para os lados para pegar alimentos saudáveis e evitar doces. As setas ou as teclas A e D também movem. P ou Esc pausa o jogo."></div>
      <div id="loading" role="status"><span class="loading-sparkle" aria-hidden="true">✦</span><strong>Dentinho Feliz</strong><span>Preparando seu sorriso…</span></div>
      <aside id="rotate-message" role="status"><span class="phone-icon" aria-hidden="true"></span><strong>Vire o celular</strong><span>Use a posição vertical para jogar.</span></aside>
      <p id="game-announcement" class="sr-only" aria-live="polite"></p>
    </main>
    <noscript>O Dentinho Feliz precisa de JavaScript para funcionar. Ative essa opção no navegador para jogar.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
