let pendingBackup=null;
// Bound the size and shape of imported records before placing them in browser storage.
const MAX_BACKUP_BYTES=5*1024*1024;
const MAX_COLLECTION_ENTRIES=1500;
const MAX_NESTING_DEPTH=18;
const MAX_NODES=50000;
function validateBackupTree(value){
 let nodes=0;
 function walk(item,depth){
  if(++nodes>MAX_NODES||depth>MAX_NESTING_DEPTH)throw Error('Backup contains too much nested data.');
  if(typeof item==='string'&&item.length>250000)throw Error('A saved value is too long.');
  if(typeof item==='number'&&!Number.isFinite(item))throw Error('Invalid numeric value.');
  if(item&&typeof item==='object'){
   if(Array.isArray(item)){if(item.length>MAX_COLLECTION_ENTRIES)throw Error('Too many saved items.');for(const child of item)walk(child,depth+1);}
   else {const keys=Object.keys(item);if(keys.length>MAX_COLLECTION_ENTRIES)throw Error('Too many saved items.');for(const key of keys){if(['__proto__','prototype','constructor'].includes(key))throw Error('Unsupported saved field name.');if(key.length>300)throw Error('A saved field name is too long.');walk(item[key],depth+1);}}
  }
 }
 walk(value,0);
}
async function prepareBackupRestore(input){

  const records=parsed.records;
  validateBackupTree(records);
  if(Object.keys(records).some(k=>!BACKUP_KEYS.includes(k)))throw Error('Unexpected backup fields.');
  for(const [k,v] of Object.entries(records)){
   if(typeof v!=='string')throw Error('Invalid saved data.');
   if(k==='dbt-companion-theme'){if(!['light','dark'].includes(v))throw Error('Invalid theme.');}
   else {const obj=JSON.parse(v);validateBackupTree(obj);if(k==='dbt-companion-followthrough-v1'){if(!Array.isArray(obj)||obj.length!==5||obj.some(a=>typeof a!=='string'||a.length>250000))throw Error('Invalid follow-through reflection.');continue;}if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('Invalid saved collection.');if(k==='dbt-companion-journal-entries-v1'&&Object.values(obj).some(e=>!e||typeof e!=='object'||typeof e.text!=='string'||e.text.length>250000))throw Error('Invalid journal entries.');if(k==='dbt-companion-personal-jar-v1'&&Object.values(obj).some(e=>!e||typeof e!=='object'||typeof e.text!=='string'||e.text.length>20000||typeof e.favorite!=='boolean'))throw Error('Invalid personal jar notes.');if(k==='dbt-companion-reflections-v1'&&Object.values(obj).some(e=>!e||typeof e!=='object'||typeof e.meaning!=='string'||typeof e.focus!=='string'||e.meaning.length>250000||e.focus.length>250000||!Number.isInteger(e.cardIndex)||e.cardIndex<0||e.cardIndex>=reflectionCards.length))throw Error('Invalid saved reflections.');}
  }
  pendingBackup=records;
  const count=k=>{try{return Object.keys(JSON.parse(records[k]||'{}')).length}catch(e){return 0}};
  preview.innerHTML=`<p><b>Backup ready to review:</b> ${count('dbt-companion-diary-v14')} diary week(s), ${count('dbt-companion-chains-v11')} chain analysis draft(s), ${count('dbt-companion-practice-v09')} practice draft(s), ${count('dbt-companion-journal-entries-v1')} saved journal entry/entries, ${count('dbt-companion-reflections-v1')} saved reflection(s), ${count('dbt-companion-personal-jar-v1')} personal jar note(s), and ${records['dbt-companion-followthrough-v1']?'1':'0'} follow-through reflection.</p><p><b>Warning:</b> restoring replaces diary, chain, follow-through, practice, and theme data; absent data in those categories is cleared. Journal and Reflection Jar entries are kept if missing from the backup, and replaced if present. Back up current work first.</p><button type="button" class="primary" onclick="confirmBackupRestore()">Confirm restore</button> <button type="button" onclick="cancelBackupRestore()">Cancel</button>`;
 }catch(e){preview.textContent='Could not read this backup: '+e.message+' No changes made.';input.value='';}
}

function confirmBackupRestore(){
 if(!pendingBackup)return;
 if(!confirm('Restore the selected backup? Diary, chain, follow-through and practice data will be replaced. Journal and Reflection Jar entries will be replaced only if present in the backup. Download a backup of current work first.'))return;
 const before={};
 try{
  for(const key of BACKUP_KEYS)before[key]=localStorage.getItem(key);

  for(const key of BACKUP_KEYS){const expected=Object.prototype.hasOwnProperty.call(pendingBackup,key)?pendingBackup[key]:(['dbt-companion-journal-entries-v1','dbt-companion-reflections-v1','dbt-companion-personal-jar-v1'].includes(key)?before[key]:null);if(localStorage.getItem(key)!==expected)throw Error('Storage verification failed');}
  chainDrafts=JSON.parse(localStorage.getItem('dbt-companion-chains-v11')||'{}');practiceDrafts=JSON.parse(localStorage.getItem('dbt-companion-practice-v09')||'{}');diaryStore=JSON.parse(localStorage.getItem('dbt-companion-diary-v14')||'{}');activeChainId=null;try{const f=JSON.parse(localStorage.getItem(followThroughKey)||'null');followThroughAnswers=Array.isArray(f)&&f.length===5?f.map(v=>String(v||'')):Array(5).fill('')}catch(e){followThroughAnswers=Array(5).fill('')}diaryLoad();setTheme(localStorage.getItem('dbt-companion-theme')||'light');pendingBackup=null;activeReflectionEntryId=null;activeJournalEntryId=null;journalDraftFallback='';reflectionDraftFallback=null;currentCard=null;cardFlipped=false;try{localStorage.removeItem(JOURNAL_DRAFT_KEY);localStorage.removeItem(REFLECTION_DRAFT_KEY)}catch(e){}render();showSaveToast('✓ Backup restored. Check My Saved Work and Diary Card.');
 }catch(e){
  try{for(const key of BACKUP_KEYS){if(before[key]===null)localStorage.removeItem(key);else if(before[key]!==undefined)localStorage.setItem(key,before[key]);}}catch(rollbackError){}
  showSaveToast('Restore failed. Previous browser data was restored where possible; please verify your entries.',true);
 }
}

 const fold=(title,body)=>`<details class="card privacy-fold"><summary>${title}</summary><div class="saved-fold-content">${body}</div></details>`;

 fold('🫙 Saved Reflections ('+Object.keys(readReflectionEntries()).length+')',reflectionSavedCards())+
 fold('📓 Saved Journal Entries ('+Object.keys(readJournalEntries()).length+')',journalSavedCards())+
 fold('📅 Saved Diary Cards ('+Object.keys(diaryStore).length+')',diaries)+
 fold('🔗 Saved Chain Analyses ('+Object.keys(chainDrafts).length+')',chains||'<p>No chain analyses saved yet.</p>')+

 fold('💾 Backup & Restore',backupPanel());

<script>
/* Grow writing boxes as text is entered; limit extreme heights for comfortable scrolling. */
(function(){
  function sizeWritingArea(area){
    if(!area.isConnected)return;
    area.style.height='auto';
    var minHeight=Math.max(85,parseFloat(getComputedStyle(area).minHeight)||0);
    var height=Math.min(420,Math.max(minHeight,area.scrollHeight+2));
    area.style.height=height+'px';
    area.style.overflowY=area.scrollHeight>height?'auto':'hidden';
  }
  function prepareWritingAreas(){
    document.querySelectorAll('textarea').forEach(function(area){
      if(area.dataset.autoGrowReady==='yes')return;
      area.dataset.autoGrowReady='yes';
      area.style.resize='vertical';
      area.addEventListener('input',function(){sizeWritingArea(area)});
      sizeWritingArea(area);
    });
  }
  prepareWritingAreas();
  new MutationObserver(prepareWritingAreas).observe(document.body,{childList:true,subtree:true});
})();
</script>
<script>

function updateTextSizeButton(){
  var b=document.getElementById('text-size-toggle');if(!b)return;
  var larger=document.documentElement.dataset.textSize==='larger';
  b.setAttribute('aria-pressed',String(larger));
  b.textContent=larger?'Aa Normal text':'Aa Larger text';
}
function toggleTextSize(){
  var larger=document.documentElement.dataset.textSize!=='larger';
  document.documentElement.dataset.textSize=larger?'larger':'normal';
  try{localStorage.setItem('dbt-companion-text-size',larger?'larger':'normal')}catch(e){}
  updateTextSizeButton();
}
