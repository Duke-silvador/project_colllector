/* Compact fanned card decks for reflective listening */
.listen-deck-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:18px;margin:24px 0}
.listen-deck{border:1px solid #a2a2b666;border-radius:18px;overflow:hidden;background:var(--card,#fff);box-shadow:0 5px 18px #00000012}
.listen-deck>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:25px 14px 15px;position:relative;min-height:185px}
.listen-deck>summary::-webkit-details-marker{display:none}
.deck-fan{height:86px;width:125px;display:block;position:relative;margin:0 auto 5px}
.deck-fan span{position:absolute;left:31px;top:3px;width:66px;height:84px;border:2px solid #fff;border-radius:10px;box-shadow:0 3px 8px #0003;background:linear-gradient(140deg,#bc9eff,#7656c7)}
.deck-fan span:nth-child(1){transform:rotate(-19deg) translateX(-16px);background:linear-gradient(140deg,#83e1d0,#348b9d)}
.deck-fan span:nth-child(2){transform:rotate(17deg) translateX(16px);background:linear-gradient(140deg,#ffcf86,#e9789e)}
.deck-fan span:nth-child(3){transform:rotate(0deg);background:linear-gradient(145deg,#b59eff,#7656c7)}
.deck-fan span:nth-child(3):after{content:'✦';color:white;font-size:29px;position:absolute;top:21px;left:20px}
.deck-title{font-weight:800;font-size:1.18rem}.deck-count{font-size:.87rem;opacity:.8}.deck-chevron{font-size:1.25rem;line-height:1;transition:transform .2s}
.listen-deck[open] .deck-chevron{transform:rotate(180deg)}
.deck-options{padding:8px 12px 15px;border-top:1px solid #9994;display:grid;gap:8px}

function setTheme(mode){if(mode!=="dark")mode="light";document.documentElement.dataset.theme=mode;try{localStorage.setItem("dbt-companion-theme",mode)}catch(e){};document.getElementById("light-theme").setAttribute("aria-pressed",String(mode==="light"));document.getElementById("dark-theme").setAttribute("aria-pressed",String(mode==="dark"));const wheel=document.querySelector(".wheel-frame");if(wheel){wheel.outerHTML=wheelMarkup().match(/<div class="wheel-frame">[\s\S]*?<\/div>/)[0];}}

function supportMapsUrl(query,area){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query+(area?' near '+area:' near me'));}
function supportMarkup(){return `<h2>Find Support</h2><p>Find mental health care and other support near you. Choose a service and a ZIP code, or search near your current location.</p><div class="card support-search"><h3>🗺️ Search for nearby help</h3><div class="support-crisis-shortcut"><strong>Need immediate emotional support?</strong><div class="support-actions"><a href="tel:988">📞 Call 988</a><a href="sms:988">💬 Text 988</a></div><small>U.S. 988 Lifeline, available 24/7. In immediate danger, call 911.</small></div><label for="supportZip">U.S. ZIP code (optional)</label><input id="supportZip" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" aria-describedby="supportStatus" aria-invalid="false" placeholder="e.g., 63901" value="${escapeHTML(supportArea)}"><label for="supportType">What kind of support?</label><select id="supportType" onchange="supportToggleDBT()">${supportKinds.map((k,i)=>`<option value="${i}" ${i===supportKind?'selected':''}>${escapeHTML(k[0])}</option>`).join('')}</select><div class="support-actions"><button class="primary" onclick="supportSearchZip()">🔎 Open map for ZIP code</button><button onclick="supportSearchNearMe()">📍 Open map near me</button></div><p id="supportStatus" class="support-status" role="status">Tap either search button to open Google Maps.</p><div id="supportDBTExtra" class="support-dbt-extra" style="${supportKind===1?'':'display:none;'}"><p><strong>Looking for DBT?</strong> A DBT-specific search may miss clinics that offer it. Try a broader search and ask whether they provide individual DBT, DBT skills groups, or both.</p><div class="support-actions"><button type="button" onclick="supportSearchBroadDBT('zip')">🏥 Clinics by ZIP code</button><button type="button" onclick="supportSearchBroadDBT('near')">📍 Clinics near me</button></div><p class="muted"><small>Not every mental health clinic offers DBT. Confirm directly with the provider.</small></p></div><p class="muted"><small>Results open in Google Maps, where you can view an interactive map, provider details, phone numbers, directions and reviews. Availability, credentials, insurance and costs should be confirmed with the provider. No ZIP code or precise location is saved by this app.</small></p></div><details class="card support-fold support-verified"><summary>📍 Direct provider listings — Poplar Bluff, Missouri</summary><div class="support-fold-body"><p>These locations are listed by the providers or Missouri behavioral health organizations, even if a general Google Maps search misses them. They are examples for this area, not a complete nationwide directory.</p><div class="support-resource card"><h4>FCC Behavioral Health — Urgent Behavioral Health Crisis Center</h4><p>Walk-in behavioral health crisis support for ages 10+. Daily 10 a.m.–8 p.m.; last walk-in at 7 p.m.</p><p><b>686 Lester Street, Poplar Bluff, MO 63901</b></p><p><a href="tel:15738182642">📞 (573) 818-2642</a> · <a href="https://www.google.com/maps/search/?api=1&amp;query=686%20Lester%20Street%20Poplar%20Bluff%20MO%2063901" target="_blank" rel="noopener noreferrer">🗺️ Map &amp; directions ↗</a> · <a href="https://fccinc.org/crisis-services/" target="_blank" rel="noopener noreferrer">Official website ↗</a></p></div><div class="support-resource card"><h4>FCC Behavioral Health — Butler County Behavioral Health Clinic</h4><p>Behavioral health clinic. Call to confirm services, appointments and eligibility.</p><p><b>3001 Warrior Lane, Poplar Bluff, MO 63901</b></p><p><a href="tel:15736861200">📞 (573) 686-1200</a> · <a href="https://www.google.com/maps/search/?api=1&amp;query=3001%20Warrior%20Lane%20Poplar%20Bluff%20MO%2063901" target="_blank" rel="noopener noreferrer">🗺️ Map &amp; directions ↗</a> · <a href="https://fccinc.org/behavioral-health/clinics/" target="_blank" rel="noopener noreferrer">Official website ↗</a></p></div><p class="muted"><small>Locations and hours may change. Confirm before traveling. Listings are informational, not endorsements.</small></p></div></details><details class="card support-fold"><summary>🔎 Official treatment directories — nationwide</summary><div class="support-fold-body"><p>If a clinic is missing from Google Maps, try these directories too:</p><p><a href="https://findtreatment.gov/locator" target="_blank" rel="noopener noreferrer">SAMHSA FindTreatment.gov — search mental health and substance-use providers ↗</a></p><p><a href="https://dmh.mo.gov/behavioral-health/treatment-services/locate" target="_blank" rel="noopener noreferrer">Missouri Department of Mental Health — find treatment services ↗</a></p><p><a href="https://www.mobhc.org/bhcc-locations" target="_blank" rel="noopener noreferrer">Missouri Behavioral Health Council — crisis center locations ↗</a></p><p class="muted"><small>These directories open their own websites and maps. DBT Companion does not collect or save your searches.</small></p></div></details><details class="card support-fold"><summary>☎️ Nationwide resources (U.S.)</summary><div class="support-fold-body"><div class="support-resource card"><h4>988 Suicide &amp; Crisis Lifeline</h4><p>Free, confidential emotional crisis support, 24/7. You do not need to be suicidal to contact 988.</p><p><a href="tel:988">📞 Call 988</a> · <a href="sms:988">💬 Text 988</a> · <a href="https://988lifeline.org/" target="_blank" rel="noopener noreferrer">Website ↗</a></p></div><div class="support-resource card"><h4>SAMHSA National Helpline</h4><p>Free, confidential treatment referrals and information for mental health and substance-use concerns, 24/7.</p><p><a href="tel:18006624357">📞 1-800-662-HELP (4357)</a> · <a href="https://findtreatment.gov/" target="_blank" rel="noopener noreferrer">FindTreatment.gov ↗</a></p></div><div class="support-resource card"><h4>211 Community Services</h4><p>Ask about local community resources, housing, food, and other support. Availability varies by region.</p><p><a href="tel:211">📞 Call 211</a> · <a href="https://www.211.org/" target="_blank" rel="noopener noreferrer">211.org ↗</a></p></div><p class="muted"><small>In immediate danger, call 911 (U.S.). This directory is a starting point, not an endorsement of any provider or a replacement for professional care.</small></p></div></details>`;}
function supportToggleDBT(){const el=document.getElementById('supportDBTExtra');if(el)el.style.display=document.getElementById('supportType').value==='1'?'':'none';}
function supportSearchBroadDBT(where){const status=document.getElementById('supportStatus');let area='';if(where==='zip'){const zip=document.getElementById('supportZip').value.trim();if(!/^\d{5}$/.test(zip)){status.textContent='Please enter a five-digit U.S. ZIP code first.';return;}area=zip;supportArea=zip;}else{supportArea='';}status.textContent='Opening a broader mental health clinic search…';window.location.href=supportMapsUrl('mental health clinic counseling center',area);}
function supportSelection(){supportKind=Number(document.getElementById('supportType').value);return supportKinds[supportKind][1];}
function supportOpenMap(area){const url=supportMapsUrl(supportSelection(),area);window.location.href=url;}
function supportSearchZip(){const zip=document.getElementById('supportZip').value.trim(),status=document.getElementById('supportStatus');if(!/^\d{5}$/.test(zip)){document.getElementById('supportZip').setAttribute('aria-invalid','true');status.textContent='Please enter a five-digit U.S. ZIP code first.';document.getElementById('supportZip').focus();return;}document.getElementById('supportZip').setAttribute('aria-invalid','false');supportArea=zip;status.textContent='Opening Google Maps for ZIP '+zip+'…';supportOpenMap(zip);}
function supportSearchNearMe(){supportArea='';document.getElementById('supportStatus').textContent='Opening Google Maps near your location…';supportOpenMap('');}


let menuLastFocus=null;function toggleSideMenu(){const open=document.getElementById('nav').classList.contains('menu-open');if(open)closeSideMenu(true);else openSideMenu()}function openSideMenu(){const panel=document.getElementById('nav');menuLastFocus=document.activeElement;panel.classList.add('menu-open');panel.removeAttribute('inert');panel.setAttribute('aria-hidden','false');document.getElementById('menu-backdrop').hidden=false;document.getElementById('menu-toggle').setAttribute('aria-expanded','true');panel.querySelector('button').focus()}function closeSideMenu(returnFocus=false){const panel=document.getElementById('nav');if(!panel.classList.contains('menu-open'))return;panel.classList.remove('menu-open');panel.setAttribute('inert','');panel.setAttribute('aria-hidden','true');document.getElementById('menu-backdrop').hidden=true;document.getElementById('menu-toggle').setAttribute('aria-expanded','false');if(returnFocus)(menuLastFocus||document.getElementById('menu-toggle')).focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSideMenu(true);if(e.key==='Tab'&&document.getElementById('nav').classList.contains('menu-open')){const btns=[...document.querySelectorAll('#nav button:not([disabled])')];if(e.shiftKey&&document.activeElement===btns[0]){e.preventDefault();btns.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===btns.at(-1)){e.preventDefault();btns[0].focus()}}});
const tabs=['Home','Start Here','Privacy & Data','Help Me Now','Find Support','Skills','Reflective Listening','Chain Analysis','Diary Card','My Saved Work','Journal','Reflection Jar','About DBT'];let tab='Home';const emotionGroups={'Anger':['Annoyed','Irritated','Frustrated','Resentful','Bitter','Furious','Enraged','Indignant','Jealous','Hostile'],'Sadness':['Sad','Disappointed','Hurt','Lonely','Grieving','Hopeless','Discouraged','Rejected','Empty','Heartbroken'],'Fear':['Anxious','Worried','Nervous','Scared','Panicked','Insecure','Overwhelmed','Dread','Vulnerable','Uneasy'],'Shame & guilt':['Ashamed','Guilty','Embarrassed','Humiliated','Regretful','Self-conscious','Remorseful'],'Joy & connection':['Happy','Excited','Grateful','Proud','Loved','Hopeful','Peaceful','Content','Relieved','Playful','Confident'],'Other feelings':['Confused','Surprised','Numb','Bored','Disgusted','Curious','Exhausted','Restless','Apathetic','Tender','Amazed']};let selectedEmotions=[],emotionIntensities={},customEmotion='',emotionView='wheel',emotionCategory='Anger',emotionSearch='';
const darkEmotionColors={'Anger':'#c96c48','Sadness':'#438db7','Fear':'#9270c0','Shame & guilt':'#ba6895','Joy & connection':'#c69f35','Other feelings':'#389f89'};
const emotionColors={'Anger':'#f77d48','Sadness':'#56b5ef','Fear':'#b990e9','Shame & guilt':'#ed87b1','Joy & connection':'#f6ca37','Other feelings':'#50d5b0'};
function wheelPath(cx,cy,r1,r2,a1,a2){const xy=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];let p1=xy(r2,a1),p2=xy(r2,a2),p3=xy(r1,a2),p4=xy(r1,a1);return `M${p1} A${r2} ${r2} 0 ${a2-a1>Math.PI?1:0} 1 ${p2} L${p3} A${r1} ${r1} 0 ${a2-a1>Math.PI?1:0} 0 ${p4} Z`}
function wheelMarkup(){let cats=Object.keys(emotionGroups),cx=190,cy=190;return `<div class="wheel-frame"><svg viewBox="0 0 380 380" role="group" aria-label="Interactive feelings wheel. Use Tab to reach a category and Enter or Space to select it.">${cats.map((cat,i)=>{let a1=-Math.PI/2+i*2*Math.PI/cats.length,a2=a1+2*Math.PI/cats.length,mid=(a1+a2)/2,tx=cx+123*Math.cos(mid),ty=cy+123*Math.sin(mid);return `<g><path tabindex="0" role="button" aria-label="Explore ${cat}" aria-controls="emotionCategoryResults" class="wheel-slice" fill="${document.documentElement.dataset.theme==='dark'?darkEmotionColors[cat]:emotionColors[cat]}" d="${wheelPath(cx,cy,57,177,a1,a2)}" onclick="pickCategory('${cat}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pickCategory('${cat}')}"><title>${cat}</title></path><text class="wheel-label" x="${tx}" y="${ty}" text-anchor="middle">${cat==='Joy & connection'?'Joy':cat==='Shame & guilt'?'Shame':cat==='Other feelings'?'Other':cat}</text></g>`}).join('')}<circle cx="190" cy="190" r="55" fill="#fffaf0" stroke="#fff" stroke-width="4"/><text x="190" y="185" text-anchor="middle" class="wheel-center">What am I</text><text x="190" y="202" text-anchor="middle" class="wheel-center">feeling?</text></svg></div><p class="emotion-help">Tap a colored section, or use Tab and Enter or Space with a keyboard, then choose the feelings that fit. You can choose several categories.</p>`}
function emotionMarkup(){return `<div class="emotion-group"><h3>Explore your feelings</h3><p class="emotion-help">There are no wrong feelings. Select more than one and rate each one from 0 to 10.</p><div class="emotion-toolbar"><button type="button" class="${emotionView==='wheel'?'primary':''}" onclick="switchEmotionView('wheel')">◉ Feelings wheel</button><button type="button" class="${emotionView==='list'?'primary':''}" onclick="switchEmotionView('list')">☷ Searchable list</button></div><div id="emotionBrowser">${emotionBrowserMarkup()}</div><div id="emotionSelections">${selectedEmotionMarkup()}</div><label for="customEmotion">Don't see your feeling? Add your own</label><div class="custom-emotion-row"><input id="customEmotion" aria-label="Name of your own feeling" placeholder="Another feeling..." value="${escapeHTML(customEmotion)}" oninput="customEmotion=this.value"><button type="button" onclick="addCustomEmotion()">Add</button></div></div>`}
function emotionBrowserMarkup(){if(emotionView==='wheel')return wheelMarkup()+categoryMarkup();return `<label for="emotionSearch">Search all feelings</label><input id="emotionSearch" placeholder="Try: resentful, hopeful, overwhelmed..." value="${escapeHTML(emotionSearch)}" oninput="emotionSearch=this.value;updateEmotionList()"><div id="emotionList">${emotionListMarkup()}</div>`}
function categoryMarkup(){return `<section id="emotionCategoryResults" aria-label="Feelings in selected category"><h3 id="emotionCategoryHeading" tabindex="-1">${escapeHTML(emotionCategory)}</h3><div>${emotionGroups[emotionCategory].map(word=>emotionChoiceMarkup(word)).join('')}</div></section>`}
function emotionListMarkup(){let q=emotionSearch.trim().toLowerCase();let words=Object.entries(emotionGroups).flatMap(([cat,ws])=>ws.filter(w=>!q||w.toLowerCase().includes(q)||cat.toLowerCase().includes(q)));return words.length?words.map(emotionChoiceMarkup).join(''):'<p>No matches. You can add your own feeling below.</p>'}
function emotionChoiceMarkup(word){let active=selectedEmotions.includes(word);const arg=safeHandlerArg(word);const intensity=Math.max(0,Math.min(10,Number(emotionIntensities[word])||0));const inputId='int-'+Array.from(word).map(c=>c.codePointAt(0).toString(16)).join('-');return `<div class="emotion-choice ${active?'selected':''}"><button type="button" aria-pressed="${active}" onclick="toggleEmotion(${arg})">${active?'✓ ':'+ '}${escapeHTML(word)}</button>${active?`<label style="margin:0;font-size:13px" for="${inputId}">Intensity <input aria-label="${escapeHTML(word)} intensity from 0 to 10" id="${inputId}" type="number" min="0" max="10" value="${intensity}" onchange="setEmotionIntensity(${arg},this.value)"></label>`:''}</div>`}
function selectedEmotionMarkup(){return `<h3>My selected feelings (${selectedEmotions.length})</h3>${selectedEmotions.length?selectedEmotions.map(word=>`<span class="emotion-pill">${escapeHTML(word)} · ${Math.max(0,Math.min(10,Number(emotionIntensities[word])||0))}/10 <button type="button" aria-label="Remove ${escapeHTML(word)}" onclick="toggleEmotion(${safeHandlerArg(word)})">×</button></span>`).join(''):'<p class="emotion-help">No feelings selected yet.</p>'}`}
function updateEmotionBrowser(){let b=document.getElementById('emotionBrowser');if(b)b.innerHTML=emotionBrowserMarkup();let t=document.getElementById('emotionSelections');if(t)t.innerHTML=selectedEmotionMarkup()}
function switchEmotionView(view){emotionView=view;let host=document.querySelector('.emotion-group');if(host)host.outerHTML=emotionMarkup()}
function pickCategory(cat){emotionCategory=cat;updateEmotionBrowser();const heading=document.getElementById("emotionCategoryHeading");if(heading)heading.focus({preventScroll:true})}
function updateEmotionList(){let e=document.getElementById('emotionList');if(e)e.innerHTML=emotionListMarkup()}
function toggleEmotion(word){if(selectedEmotions.includes(word))selectedEmotions=selectedEmotions.filter(w=>w!==word);else{selectedEmotions.push(word);emotionIntensities[word]=5}updateEmotionBrowser()}
function setEmotionIntensity(word,value){emotionIntensities[word]=Math.max(0,Math.min(10,Number(value)||0));let t=document.getElementById('emotionSelections');if(t)t.innerHTML=selectedEmotionMarkup()}
function addCustomEmotion(){let word=customEmotion.trim().slice(0,50);if(!word)return;if(!selectedEmotions.includes(word)){selectedEmotions.push(word);emotionIntensities[word]=5}customEmotion='';let el=document.getElementById('customEmotion');if(el)el.value='';updateEmotionBrowser()}
function updateEmotions(){updateEmotionBrowser()}

function sentenceSupportContext(q){

 const wantsWheel=/\b(?:dont know what (?:im|i am) feeling|what (?:am i|do i) feeling|cant name my feelings|identify my feelings)\b/.test(q);

 const matches=appSearchItems.map((item,index)=>{const hay=normalizeSearch(item.title+' '+item.description+' '+item.words);return {item,index,score:terms.reduce((n,t)=>n+(hay.includes(t)?1:0)+(normalizeSearch(item.title).includes(t)?2:0),0)}}).filter(x=>terms.every(t=>normalizeSearch(x.item.title+' '+x.item.description+' '+x.item.words).includes(t)));
 function add(section){const index=appSearchItems.findIndex(x=>x.section===section);if(index>=0&&!matches.some(x=>x.index===index))matches.push({item:appSearchItems[index],index,score:10})}

const content=document.getElementById('content'),nav=document.getElementById('nav');const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeHandlerArg=value=>escapeHTML(JSON.stringify(String(value)));function go(t){closeSideMenu();if(tab==='Chain Analysis'){saveChainField();collectFollowThrough()}tab=t;render();window.scrollTo(0,0);content.focus({preventScroll:true})}

function render(){nav.innerHTML='<div class="side-menu-heading">Explore DBT Companion <button type="button" aria-label="Close menu" onclick="closeSideMenu(true)">✕</button></div>'+tabs.map(t=>`<button type="button" class="${t===tab?'active':''}" aria-current="${t===tab?'page':'false'}" onclick="go(${safeHandlerArg(t)})">${escapeHTML(t)}</button>`).join('');document.getElementById('current-section-name').textContent=tab;let html='';if(tab==='Reflective Listening')html=listeningMarkup();if(tab==='Start Here')html=welcomeGuideMarkup();if(tab==='Privacy & Data')html=privacyGuideMarkup();if(tab==='Home')html=`<h2>Welcome</h2>${appSearchMarkup()}<div class="card home-choices"><h2>What would you like to do today?</h2><p>Choose one, or open the Menu to explore freely.</p><button class="home-choice urgent" onclick="go('Help Me Now')"><strong>💜 I need help right now</strong><span>Go straight to immediate support and coping tools</span></button><button class="home-choice" onclick="go('Skills')"><strong>🌱 I want to practice</strong><span>Explore skills at your own pace</span></button><button class="home-choice" onclick="go('Start Here')"><strong>🧭 I'm just looking around</strong><span>See how the app works, without committing to anything</span></button><p class="muted"><small>No selection is required. These are shortcuts, not an assessment.</small></p></div>`;if(tab==='Find Support')html=supportMarkup();if(tab==='Help Me Now')html=`<h2>Help Me Now</h2><div class="card crisis-card"><h3>Need to talk to someone right now?</h3><p>In the U.S., the 988 Suicide &amp; Crisis Lifeline offers free, confidential support 24/7. You don't have to be suicidal to reach out.</p><div class="crisis-actions"><a class="crisis-action" href="tel:988" aria-label="Call the 988 Lifeline">📞 Call 988</a><a class="crisis-action" href="sms:988" aria-label="Text the 988 Lifeline">💬 Text 988</a></div><p class="crisis-note">Tapping opens your phone's calling or messaging app; you choose whether to place the call or send the text. If there is immediate danger, call 911.</p></div><details class="card privacy-fold"><summary>🛑 Practice STOP</summary><p>Tap the STOP sign to practice, one step at a time.</p>${stopMarkup()}</details><details class="card privacy-fold"><summary>🌿 Grounding: 5–4–3–2–1</summary><p>Name 5 things you see, 4 you feel, 3 you hear, 2 you smell, and 1 you taste. Adapt or skip senses that aren't comfortable.</p></details><details class="card privacy-fold"><summary>🌬️ Temperature and paced breathing</summary><p>Try cool water on your hands or face and a gentle, slower exhale. Avoid extreme temperatures or breath-holding if medically unsafe for you.</p></details><details class="card privacy-fold"><summary>🧩 More ways to get through this moment</summary><p>Pick just one. You can try it for about a minute, or longer if it helps.</p><details class="quick-coping"><summary>🌿 Self-Soothe — find a little comfort</summary><p>Choose one sense that feels safe and pleasant right now.</p><ol><li>Look at a favorite photo or something beautiful.</li><li>Listen to a comforting song, or notice a soothing sound.</li><li>Hold a soft blanket or enjoy a familiar scent.</li></ol><p><b>Try now:</b> Spend one minute noticing just one comforting sensation.</p></details><details class="quick-coping"><summary>🧩 ACCEPTS — give your mind a short break</summary><p>Distracting yourself briefly can help you get through an intense moment. You can return to the problem later.</p><ol><li>Choose a simple activity: sort photos, fold a few towels, or play a quick word game.</li><li>Or count backward from 100 by threes.</li><li>Notice whether the urge feels any different after a minute.</li></ol><p><b>Try now:</b> Choose one distraction and give it sixty seconds.</p></details><details class="quick-coping"><summary>✨ IMPROVE the Moment — make this minute easier</summary><p>You don't have to fix everything right now.</p><ol><li>Imagine a place where you feel peaceful.</li><li>Relax your shoulders if comfortable, and take a gentle breath.</li><li>Tell yourself: “I only need to handle this moment.”</li></ol><p><b>Try now:</b> Picture that peaceful place for one minute.</p></details><details class="quick-coping"><summary>⚖️ Pros and Cons — pause before acting on an urge</summary><p>When you want to react immediately, compare what might happen next.</p><ol><li>What might I gain right away if I act on this urge?</li><li>What might it cost me later?</li><li>What might I gain by waiting or choosing a skill instead?</li></ol><p><b>Try now:</b> Name one short-term benefit and one longer-term cost before deciding.</p></details><p class="muted"><small>These are brief starting points, not the full skills. Open the Skills Library whenever you want more detail. If a suggestion doesn't fit your situation, skip it.</small></p></details><details class="card privacy-fold"><summary>🎧 Guided meditation and calming videos</summary><p>Optional videos that open in YouTube. Choose one if listening feels helpful right now; nothing plays automatically.</p><p><a href="https://www.youtube.com/watch?v=q4oqk5spCXY" target="_blank" rel="noopener noreferrer">5-minute grounding meditation ↗</a></p><p><a href="https://www.youtube.com/watch?v=TXNECaIJPDI" target="_blank" rel="noopener noreferrer">5-minute guided breathing exercise ↗</a></p><small>Videos require an internet connection and may include ads. Skip any exercise that feels uncomfortable.</small></details>`;if(tab==='Skills')html=`<h2>DBT Skills Library</h2><p>Start small, or choose the situation that brought you here. You don't have to learn everything at once.</p><section class="card starter-skills" aria-labelledby="starter-title"><h3 id="starter-title">🌱 New to DBT? Start with four skills</h3><p>Pick just one. There's no required order or progress score.</p><div class="starter-grid"><button type="button" onclick="openSkillModule('Mindfulness')"><strong>1. Notice what's happening</strong><span>Mindfulness: observe without rushing to react</span></button><button type="button" onclick="go('Help Me Now')"><strong>2. Pause before acting</strong><span>STOP: make space for a choice</span></button><button type="button" onclick="openSkillModule('Emotion Regulation')"><strong>3. Check what you know</strong><span>Check the Facts: separate facts from guesses</span></button><button type="button" onclick="openSkillModule('Interpersonal Effectiveness')"><strong>4. Ask for what you need</strong><span>Communication skills for everyday life</span></button></div></section><section class="card situation-skills" aria-labelledby="situation-title"><h3 id="situation-title">🧭 Browse by situation</h3><p>You can choose what fits, or skip these suggestions.</p><div class="starter-grid"><button onclick="go('Help Me Now')">I'm about to lose it <span>Immediate coping and STOP</span></button><button onclick="openSkillModule('Distress Tolerance')">I need to get through a hard moment <span>Distress tolerance</span></button><button onclick="openSkillModule('Emotion Regulation')">My feelings are all over the place <span>Understand and respond to emotions</span></button><button onclick="openSkillModule('Interpersonal Effectiveness')">I need to have a hard conversation <span>Communicate and set boundaries</span></button><button onclick="openSkillModule('Mindfulness')">My thoughts won't slow down <span>Notice and return to the present</span></button><button onclick="go('Journal')">I don't know what I'm feeling <span>Journal and Feelings Wheel</span></button></div></section><h3>All skill modules</h3><p>Open any module below for more details and examples.</p>${skillModules.map(m=>`<details class="skill-module" data-skill-module="${escapeHTML(m.name)}"><summary>${m.icon} ${m.name}</summary><div class="skill-body"><p><b>What it is:</b> ${m.what}</p><p><b>Goal:</b> ${m.goal}</p>${m.skills.filter((sk,i,all)=>all.findIndex(other=>other[0]===sk[0])===i).map(sk=>sk[0]==='PLEASE'?pleaseMarkup():skillAcronyms[sk[0]]?acronymMarkup(sk[0]):`<h4>${sk[0]}</h4><p>${sk[1]}</p>${skillEverydayExamples[sk[0]]?`<p class="skill-everyday"><strong>In everyday life:</strong> ${skillEverydayExamples[sk[0]]}</p>`:''}`).join('')}${m.name==='Distress Tolerance'?'<button class="primary" onclick="go(\'Help Me Now\')">Practice STOP with the stop sign →</button>':''}</div></details>`).join('')}`;if(tab==='Chain Analysis')html=`<h2>Behavior Chain Analysis</h2><p>Explore a difficult moment without blame. This is our own guided reflection, informed by general behavior-analysis ideas—not a reproduction of a published worksheet. Choose the format that works for you.</p><details class="chain-sample"><summary>See a complete example first (optional)</summary><p class="muted">This is one imaginary situation, not a model you have to copy.</p>${chainQuestions.map((q,i)=>`<div class="chain-sample-step"><b>${i+1}. ${escapeHTML(q.title)}</b><p>${escapeHTML(q.full)}</p></div>`).join('')}</details>${missingLinksMarkup()}<div class="card"><h3>Choose your path</h3><button class="${chainMode==='guided'?'primary':''}" onclick="setChainMode('guided')">Guided Deep Dive</button> <button class="${chainMode==='quick'?'primary':''}" onclick="setChainMode('quick')">Quick Worksheet</button></div>${chainMode==='guided'?guidedMarkup():quickMarkup()}`;if(tab==='My Saved Work')html=savedWorkMarkup();if(tab==='Diary Card')html=diaryMarkup();if(tab==='Reflection Jar')html=`<h2>Reflection Jar</h2><p>Draw a card, share what it means to you, and choose something to practice this week.</p><div class="jar-stage"><svg class="mason-jar" viewBox="0 0 300 355" role="img" aria-label="Glass Mason jar with a metal screw-top rim, filled with colorful folded reflection notes"><defs><linearGradient id="jarGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d7fbff" stop-opacity=".72"/><stop offset=".24" stop-color="#fff" stop-opacity=".18"/><stop offset=".72" stop-color="#c7f5f9" stop-opacity=".2"/><stop offset="1" stop-color="#9adce8" stop-opacity=".62"/></linearGradient><linearGradient id="jarMetal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7f5fa"/><stop offset=".5" stop-color="#a7aab9"/><stop offset="1" stop-color="#e9e9f2"/></linearGradient><clipPath id="jarInside"><path d="M70 76 Q47 89 47 119 L47 283 Q47 322 87 322 L213 322 Q253 322 253 283 L253 119 Q253 89 230 76 Z"/></clipPath></defs><ellipse cx="150" cy="338" rx="100" ry="10" fill="#543b7840"/><path d="M74 73 L226 73 Q252 86 256 119 L256 282 Q256 327 212 327 L88 327 Q44 327 44 282 L44 119 Q48 86 74 73 Z" fill="url(#jarGlass)" stroke="#478ba1" stroke-width="6"/><g clip-path="url(#jarInside)"><g transform="rotate(-18 93 240)"><rect x="50" y="205" width="92" height="69" rx="6" fill="#ffb84e" stroke="#c8782d" stroke-width="3"/><path d="M50 224 L142 224 L126 240 L65 240 Z" fill="#ffe3a1" stroke="#c8782d" stroke-width="2"/></g><g transform="rotate(15 197 241)"><rect x="149" y="204" width="95" height="72" rx="6" fill="#ee79b3" stroke="#b83b7b" stroke-width="3"/><path d="M149 224 L244 224 L226 240 L164 240 Z" fill="#ffc2de" stroke="#b83b7b" stroke-width="2"/></g><g transform="rotate(-4 141 267)"><rect x="102" y="228" width="93" height="75" rx="6" fill="#ad8cf4" stroke="#7950c2" stroke-width="3"/><path d="M102 249 L195 249 L179 266 L118 266 Z" fill="#ddcaff" stroke="#7950c2" stroke-width="2"/></g><g transform="rotate(12 106 175)"><rect x="61" y="144" width="93" height="67" rx="6" fill="#6bd6c5" stroke="#258f83" stroke-width="3"/><path d="M61 163 L154 163 L137 181 L77 181 Z" fill="#b9f6e8" stroke="#258f83" stroke-width="2"/></g><g transform="rotate(-13 197 177)"><rect x="152" y="141" width="93" height="69" rx="6" fill="#f7d667" stroke="#c69c24" stroke-width="3"/><path d="M152 161 L245 161 L229 179 L168 179 Z" fill="#fff0ae" stroke="#c69c24" stroke-width="2"/></g><g transform="rotate(5 147 127)"><rect x="100" y="96" width="94" height="68" rx="6" fill="#ff987e" stroke="#c9584d" stroke-width="3"/><path d="M100 116 L194 116 L176 133 L116 133 Z" fill="#ffd0bc" stroke="#c9584d" stroke-width="2"/></g></g><path d="M75 86 Q61 104 61 141 L61 281 Q61 305 79 313" fill="none" stroke="#fff" stroke-width="12" opacity=".63" stroke-linecap="round"/><path d="M232 107 Q241 128 241 158 L241 280" fill="none" stroke="#fff" stroke-width="6" opacity=".35" stroke-linecap="round"/><rect x="76" y="40" width="148" height="39" rx="9" fill="url(#jarMetal)" stroke="#66758b" stroke-width="4"/><path d="M79 49 H221 M79 59 H221 M79 69 H221" stroke="#697d90" stroke-width="2" opacity=".8"/><rect x="84" y="32" width="132" height="14" rx="6" fill="#dce5ee" stroke="#66758b" stroke-width="3"/><rect x="97" y="272" width="106" height="37" rx="12" fill="#ffffffd9" stroke="#6195a5" stroke-width="2"/><text x="150" y="296" text-anchor="middle" font-size="18" font-weight="800" fill="#46547d">REFLECT</text></svg><button class="jar-draw" onclick="drawCard()">✦ Draw a card</button></div><div class="jar-card" style="text-align:center" aria-live="polite"><span class="tag" id="cardcategory">Reflection</span><h2 id="cardtext">Your next reflection is waiting.</h2><p id="cardhint">Draw a card to begin.</p></div><div class="jar-controls"><button onclick="flipCard()">↻ Flip card</button></div><label for="shareMeaning">What does this card mean to you right now?</label><textarea id="shareMeaning" placeholder="What would you share with your group?" oninput="saveReflectionDraft()"></textarea><label for="focus">What would you like to work on this week?</label><textarea id="focus" placeholder="One small step I can practice..." oninput="saveReflectionDraft()"></textarea><p><button class="primary" onclick="saveReflectionEntry()">Save reflection</button> <button onclick="downloadReflection()">Download my reflection</button> <button onclick="clearReflectionDraft()">Clear draft</button></p><small>Original prompts inspired by group reflection activities. Drafts are kept while switching app sections when browser storage works. Saved reflections are included in complete JSON backups. Browser storage is not guaranteed between downloaded HTML sessions.</small>${personalJarMarkup()}`;if(tab==='About DBT')html=`<h2>About DBT</h2><div class="card"><span class="tag">The origins</span><h3>Meet Dr. Marsha M. Linehan</h3><p>Psychologist Dr. Marsha M. Linehan developed Dialectical Behavior Therapy (DBT). DBT combines acceptance and change: you can acknowledge your experience as it is while learning ways to respond differently.</p><p>DBT was originally developed for people experiencing chronic suicidality and intense emotional distress. Its skills are now taught in a range of settings.</p></div><div class="card"><h3>What does “dialectical” mean?</h3><p>Two things that seem opposite can both be true. For example: “My feelings make sense, and I can choose how I respond.”</p></div><div class="card"><h3>Learn DBT in everyday language</h3><p>Our beginner questions explain DBT terms as you go. If you already know DBT, you can choose familiar DBT terminology instead. Switch between the two at any time.</p><p><small>This is an independent educational app, not affiliated with or endorsed by Dr. Linehan or her organizations. Our explanations and reflection cards are original, not reproductions of published DBT worksheets.</small></p></div>`;if(tab==='Journal')html=`<h2>My Journal</h2><p>Write freely. Your draft is kept while you move between app sections. Tap <b>Save entry</b> to add it to My Saved Work, then download a complete JSON backup to carry it to another app copy.</p><details class="card journal-prompts" id="journal-prompt-panel"><summary><strong>✦ Help me get started</strong> — optional prompts</summary><p>Choose a question, skip it, or simply write in your own words. Nothing here interprets your experience for you.</p><div class="journal-prompt-buttons" role="group" aria-label="Optional journal starters"><button type="button" onclick="journalInsertPrompt('What happened?')">What happened?</button><button type="button" onclick="journalInsertPrompt('What am I feeling right now?')">What am I feeling right now?</button><button type="button" onclick="journalInsertPrompt('What do I need right now?')">What do I need right now?</button><button type="button" onclick="journalInsertPrompt('Is there anything else I want to say?')">Anything else?</button></div><details class="journal-wheel" id="journal-wheel-panel"><summary>🎨 Open Feelings Wheel</summary><button type="button" class="wheel-close" onclick="closeJournalWheel()">Close Feelings Wheel ↑</button><p>Explore words that might fit. Only you decide what you're feeling. Selecting a category does not add anything to your journal.</p>${wheelMarkup().replaceAll('pickCategory(', 'journalWheelPick(')}<div id="journal-wheel-result" role="status" aria-live="polite">Choose a section of the wheel to explore feeling words.</div></details><p><small>Use your phone keyboard's microphone for speech-to-text. No audio is recorded by this app.</small></p></details><label for="journal">Today's reflection</label><textarea id="journal" style="min-height:210px" placeholder="What's on your mind?" oninput="saveJournalDraft(this.value)"></textarea><p><small id="journal-save-status" role="status">Draft storage depends on your browser. Save an entry and download a backup to keep it.</small></p><p><button class="primary" onclick="saveJournalEntry()">Save entry</button> <button onclick="downloadJournal()">Download entry</button> <button onclick="clearJournalDraft()">Clear draft</button></p><p><small>Saved entries are not encrypted. A downloaded JSON backup includes saved entries, not unsaved draft text.</small></p>`;content.innerHTML=html;if(tab==='Journal')restoreJournalDraft();if(tab==='Reflection Jar')restoreReflectionDraft();if(tab==='Diary Card'){}}
/* Reflective Listening: selectable scenarios, no scoring. */
const listeningScenarios=[
 {title:'A Friend Feels Ignored',level:1,rounds:[
 {says:'“I feel like nobody really listens to me lately. I start talking, and everyone seems to have something more important to do.”',ask:'What feeling might be underneath those words?',choices:[['Hurt and overlooked','That could fit. The friend seems to want to feel heard and important.'],['Angry at everyone','Anger may be part of it, and there may be hurt underneath.'],['Bored with the conversation','That is possible, though the words point more toward feeling dismissed.']]},
 {says:'“I tried telling my sister about my day, and she started checking her phone before I finished.”',ask:'How could you reflect what you heard?',choices:[['“It sounds like you felt brushed aside when she looked at her phone.”','This reflects the experience without trying to fix it.'],['“You should tell her to put her phone away.”','That might be an option later. First, try showing you understand the feeling.'],['“I know exactly how you feel. My sister does that too.”','Relating can build connection, and it may shift the focus away from your friend.']]},
 {says:'“Actually, sometimes you interrupt me too. I don’t think you mean to, and it still hurts.”',ask:'How might you respond without getting defensive?',choices:[['“Thank you for telling me. I can see how that would hurt. I want to do better at listening.”','This acknowledges the impact and leaves room to improve.'],['“I only interrupt because I get excited.”','That explains your intention, and it may leave your friend feeling unheard.'],['“Well, you interrupt me sometimes too.”','That shifts the conversation toward blame rather than listening.']]}]},
 {title:'Someone Gives Unwanted Advice',level:1,rounds:[
 {says:'“You sounded upset earlier, so I started telling you what I thought you should do. I was just trying to help.”',ask:'What might this person be trying to communicate?',choices:[['They wanted to help, even if the advice was not what I needed','You can recognize a helpful intention without pretending the advice felt good.'],['They were deliberately trying to upset me','That is one possibility, though their words suggest they believe they were helping.'],['I have to take their advice to be polite','Listening to someone does not mean you have to follow their advice.']]},
 {says:'“I guess I did jump straight into solutions. I thought that was what you wanted.”',ask:'How could you respond while making your needs clear?',choices:[['“I know you were trying to help. Sometimes I just need you to listen before we talk about solutions.”','This acknowledges their intention and clearly explains what would help.'],['“You never listen. You always have to fix everything.”','That communicates frustration, and the broad accusation may make it harder for them to hear your request.'],['“Never mind. It does not matter.”','That may end the discomfort quickly, though it leaves your needs unclear.']]},
 {says:'“Okay, I can try that. What should I do if I am not sure whether you want advice?”',ask:'What could you suggest that works for both of you?',choices:[['“You could ask, ‘Do you want me to listen or help brainstorm?’ That would mean a lot.”','This gives them a practical way to support you while keeping communication open.'],['“Just never give me advice again.”','A firm boundary may be needed sometimes, though this misses the chance to agree on a flexible approach.'],['“You should already know what I need.”','It can feel frustrating to explain, and a clear request usually gives the other person a better chance to respond well.']]}]},
 {title:'A Friend Cancels Plans',level:1,rounds:[
 {says:'“I know I canceled again. I have so much going on, and I feel like I keep disappointing everybody.”',ask:'What might your friend be feeling?',choices:[['Overwhelmed and guilty','That fits what your friend is describing.'],['Careless about plans','The words suggest they care and are struggling.'],['Angry at you','There is no clear sign of anger toward you here.']]},
 {says:'“I wanted to come. By the time I got home, I had nothing left in me.”',ask:'Which response shows you heard them?',choices:[['“You really wanted to be there, and you were completely drained.”','You reflected both their intention and their exhaustion.'],['“You need to organize your time better.”','That offers advice before acknowledging their experience.'],['“It is fine, forget it.”','That may reassure them, though it does not show much understanding.']]},
 {says:'“I was worried you would think I just did not want to see you.”',ask:'What could you say next?',choices:[['“You were afraid I would take it personally. Thanks for telling me.”','You acknowledge the worry without making assumptions.'],['“You worry too much.”','That may unintentionally dismiss their concern.'],['“Well, it did hurt my feelings.”','Your feelings can matter too; reflecting theirs first may help the conversation.']]}]}
 ,{title:'Someone Gets Defensive',level:1,rounds:[
 {says:'“So now I’m the bad guy? I was only joking. You make it sound like I’m always doing something wrong.”',ask:'What might be happening for this person?',choices:[['They may feel criticized or misunderstood','That may explain the defensive response. You can notice it without ignoring your own feelings.'],['They clearly do not care about my feelings','That is one possibility, and their reaction alone does not tell us everything they feel.'],['I must take back what I said','You can acknowledge their feelings while still being honest about your experience.']]},
 {says:'“I just hate feeling like I can never say anything right around you.”',ask:'How could you reflect their feelings without abandoning yours?',choices:[['“It sounds like you feel judged, and that’s not what I want. I’d still like to explain what hurt me.”','You reflect their concern and keep room for both experiences.'],['“You’re being ridiculous. That isn’t what I said.”','That may make the other person feel even less heard.'],['“Okay, forget I brought it up.”','That may lower tension for now, and it also leaves your concern unspoken.']]},
 {says:'“All right. I didn’t realize that joke bothered you. I’m listening. What was it like for you?”',ask:'What could you say to keep the conversation open?',choices:[['“Thanks for hearing me. I felt embarrassed when everyone laughed. I know you may not have meant it that way.”','This names the impact, acknowledges their willingness to listen, and avoids assigning intent.'],['“You should have known better than to say it.”','That expresses hurt, and it may restart the argument instead of explaining the impact.'],['“It doesn’t matter anymore.”','You can choose to stop, though this misses an opportunity to be understood.']]}]}

 ,{title:'They Say They’re Fine',level:1,rounds:[
 {says:'“I’m fine.” Your friend looks away, folds their arms, and gets unusually quiet.',ask:'What can you notice without deciding you know what they feel?',choices:[['Their words say one thing, and their body language seems different','You are noticing a difference without assuming what it means.'],['They are definitely angry with me','That might be true, and you do not have enough information to know.'],['If they say fine, I should tell them to cheer up','That could skip over what they may be experiencing.']]},
 {says:'“I said I’m fine. I just don’t feel like talking about it right now.”',ask:'How could you show you heard their boundary?',choices:[['“Okay. I won’t push. I’m here if you want to talk later.”','You respect their choice and leave the door open.'],['“Come on, I can tell something is wrong. Just tell me.”','That may feel like pressure when they have asked for space.'],['“Well, I guess you don’t trust me.”','That shifts attention to your feelings and could make them feel responsible for reassuring you.']]},
 {says:'“Thanks. It’s been a rough day, and I need a little time before I can explain it.”',ask:'What response makes room for their needs and keeps the connection?',choices:[['“That sounds like a lot. Take the time you need. I’m glad you told me.”','You acknowledge their experience and respect their pace.'],['“See? I knew you weren’t fine!”','You may be right about the words, and proving it is less important than hearing them.'],['“Okay, but you need to tell me what happened tonight.”','That puts a deadline on a conversation they have not agreed to have.']]}]}

 ,{title:'You’re Being Too Sensitive',level:2,rounds:[
 {says:'Your partner makes a snarky comment about something you did. You say it hurt. Your partner replies, “Oh, come on. You’re being way too sensitive. I was only joking.”',ask:'How could you respond without accepting that label or escalating the argument?',choices:[
 ['“I hear that you meant it as a joke. It still hurt my feelings, and I’d like you to understand that.”','You acknowledge what your partner said they intended and make room for the impact on you. Both can be true.'],
 ['“You’re just a jerk, and you always do this.”','That communicates anger, though the label and “always” may shift the focus into another argument.'],
 ['“You’re right. I guess I shouldn’t have said anything.”','That may end the disagreement quickly, though it leaves your hurt unaddressed.']]},
 {says:'Your partner sighs and says, “I feel like I can’t say anything around you without you getting upset.”',ask:'What could you reflect while still standing up for yourself?',choices:[
 ['“It sounds like you feel you have to watch what you say. I’m not asking you to be silent; I’m asking you to take me seriously when something hurts.”','You reflect their concern without giving up your own. Listening is not the same as agreeing.'],
 ['“Then maybe you should stop talking altogether.”','That response may feel satisfying in the moment, and it does not help your partner hear what you need.'],
 ['“Never mind. I’ll just keep my feelings to myself.”','Withdrawing may feel safer, though it leaves the problem unresolved.']]},
 {says:'Your partner says, “So what am I supposed to do? Just never say anything again? I guess I can’t even speak without you getting upset.”',ask:'How could you make a clear, realistic request?',choices:[
 ['“I’m not asking you to stop speaking. I’m asking you to hear me when something hurts instead of calling me too sensitive.”','You clarify what you are asking for without accepting the idea that your partner must stay silent.'],
 ['“You should know exactly what I need without me explaining it.”','Wanting to be understood makes sense, though a specific request gives your partner something concrete to respond to.'],
 ['“Forget it. It’s not worth talking about.”','You can choose to pause the conversation, and you also deserve the option to revisit it later.']]}]}

 ,{title:'A Family Member Dismisses Your Concern',level:2,speaker:'Your family member',rounds:[
 {says:'“You keep bringing up the same problem. I don’t see why it matters so much.”',ask:'How could you respond without dismissing their frustration or giving up your concern?',choices:[
 ['“I hear that you’re tired of talking about it. It matters to me because it keeps happening, and I’d like us to find a way forward.”','You reflect their frustration and explain why the concern still needs attention.'],
 ['“You never care about anything that bothers me.”','That shows how hurt you feel, and the word “never” can pull the conversation into a fight about past events.'],
 ['“You’re right. I’ll stop mentioning it.”','You may decide to pause, though you do not have to abandon an ongoing concern just because someone is frustrated.']]},
 {says:'“I have enough on my plate already. Now you’re saying I’m doing everything wrong?”',ask:'What could you say to show you heard them without agreeing with that interpretation?',choices:[
 ['“It sounds like you’re overwhelmed and hearing this as criticism. I’m talking about one specific thing, not everything you do.”','This recognizes their experience and gently brings the discussion back to the issue.'],
 ['“If you’d just listen for once, you’d know that’s not what I said.”','That may be tempting, though it can make it harder for them to hear your actual point.'],
 ['“Fine, I guess I shouldn’t ask you for anything.”','That may end the conversation, and it does not communicate what you need.']]},
 {says:'“Well, what do you actually want me to do about it?”',ask:'How could you make one clear request while keeping the conversation respectful?',choices:[
 ['“I’d like us to agree on one small change we can both follow. Can we talk about what would work?”','A specific, collaborative request makes the next step easier to understand.'],
 ['“You should already know what needs to change.”','It is understandable to want that, and saying the request aloud makes it clearer.'],
 ['“Forget it. I’ll do everything myself.”','Taking over might feel simpler now, though it may leave the original problem in place.']]}]}


 ,{title:'Everyone Assumes You’ll Handle It',level:2,speaker:'Your roommate',rounds:[
 {says:'“I’ve been busy all day, too. It’s not like I’ve just been sitting around doing nothing.”',ask:'You’re recovering from an illness and asked your roommate to handle some household chores. How could you acknowledge their day while keeping your request clear?',choices:[
 ['“I know you’ve been busy. I’m still recovering and can’t manage everything right now. Could you take care of the kitchen tonight?”','You recognize their workload and ask for one specific, manageable thing.'],
 ['“You clearly don’t care whether I get better.”','That expresses hurt, though it assumes their intentions and may turn the conversation into a fight.'],
 ['“Never mind. I’ll just do it myself.”','That may avoid an argument for now, though it could push you beyond what you can physically manage.']]},
 {says:'“So now I’m the bad guy because I didn’t do everything you wanted?”',ask:'Your roommate is hearing your request as an accusation. How could you reflect that without accepting their interpretation?',choices:[
 ['“It sounds like you feel blamed. I’m not saying you’re a bad person. I’m saying I need help with a few things while I recover.”','You acknowledge what they heard and return to your actual need.'],
 ['“If you feel like the bad guy, that’s your problem.”','That may be tempting to say, though it is likely to increase defensiveness.'],
 ['“You’re right. I shouldn’t have asked.”','You can recognize their feelings without treating your reasonable request as wrongdoing.']]},
 {says:'“Fine! I’ll do it myself. Apparently, that’s the only way to shut you up.”',ask:'Your roommate has agreed to do the task, but has insulted you. How could you respond without getting pulled into the insult or abandoning your boundary?',choices:[
 ['“I appreciate you taking care of it. I’m asking for help, not trying to nag you. And I’m not okay with being told to shut up.”','You stay clear about the task and set a boundary around how you are spoken to.'],
 ['“Well, maybe if you did your share, I wouldn’t have to say anything.”','That may express your frustration, though it risks turning the exchange into another argument.'],
 ['“Sorry. Forget I said anything. I’ll take care of it.”','That may quiet the conflict temporarily, though it leaves both your recovery needs and the insult unaddressed.']]}]}

 ,{title:'I Need Some Space',level:3,speaker:'Your adult child',rounds:[
 {says:'“I don’t want us texting every day anymore, and I don’t want phone calls right now. If you need to contact me, please send a letter instead.”',ask:'You are the parent. This is painful to hear. How could you show that you heard the boundary without negotiating it?',choices:[
 ['“I hear you. No texts or calls right now. If I need to reach you, I’ll write a letter.”','You repeat the boundary accurately and show you intend to respect it, even though it hurts.'],
 ['“But I’m your parent. Surely one quick phone call can’t hurt.”','That pushes back against a limit your adult child just made clear.'],
 ['“Fine. I guess you don’t care about me anymore.”','That expresses pain by assigning your child a feeling they did not say they had.']]},
 {says:'“Every time I try to tell you something, you get really worked up. It’s exhausting, and I can’t do this anymore. We need to have less contact for a while.”',ask:'You are the parent. How could you hear this criticism without arguing about whose version is right?',choices:[
 ['“It sounds like our conversations have been overwhelming for you. I’m sorry they’ve felt that way. I’ll give you the space you’re asking for.”','You reflect the impact they describe without having to agree with every detail of their account.'],
 ['“After everything I’ve done for you, this is how you treat me?”','That shifts the focus from their stated need to what they owe you, and can make honest communication harder.'],
 ['“That’s not true. You’re exaggerating how I react.”','Disputing their experience right now is likely to repeat the pattern they are describing.']]},
 {says:'“I’m not saying I never want a relationship with you. I’m saying I need some space, and I need you to respect that. I don’t know when I’ll be ready for more contact.”',ask:'You are the parent. How could you respond without asking for a promise about when things will change?',choices:[
 ['“I love you, and this is hard for me. I understand that you need space. I’ll respect the contact limits you’ve set, and I won’t pressure you for a timeline.”','You can name your feelings while leaving the decision about future contact with your adult child.'],
 ['“Okay, but can you at least promise we’ll talk again next month?”','A deadline may ease your uncertainty, though it pressures them to make a promise they are not ready to make.'],
 ['“Then I won’t bother trying to have a relationship with you at all.”','That turns their request for space into an all-or-nothing choice they did not make.']]}]}
 ,{title:'An Apology With an Excuse',level:2,speaker:'Your friend',rounds:[
 {says:'“I’m sorry I told everyone about what you shared with me. I just thought they should know, and you never said it was a secret.”',ask:'Your friend apologized, then explained away what happened. How could you acknowledge the apology and explain the impact?',choices:[
 ['“I hear that you thought it was okay to share. I appreciate the apology, and I felt exposed when other people knew something I told you privately.”','You reflect their explanation without treating it as a reason your feelings should disappear.'],
 ['“That’s the worst apology I’ve ever heard. You clearly don’t care about me.”','It expresses how hurt you are, though it may turn the conversation into an argument about their character.'],

function welcomeGuideMarkup(){return `<h2>Welcome to DBT Companion</h2><p>A friendly place to learn and practice DBT skills at your own pace. You do not need to know DBT to begin.</p><details class="card privacy-fold guide-green"><summary>What is DBT?</summary><p>Dialectical Behavior Therapy teaches practical ways to notice what is happening, cope with distress, understand emotions, and communicate more effectively. It balances acceptance with change: your experience matters, and you can practice a different response.</p><p>This app is a self-help learning tool, not therapy or emergency monitoring.</p></details><details class="card privacy-fold guide-berry"><summary>Four skill families</summary><p><b>Mindfulness:</b> Notice the present moment without immediately judging it.</p><p><b>Distress tolerance:</b> Get through difficult moments without making them worse.</p><p><b>Emotion regulation:</b> Understand feelings and make choices about how to respond.</p><p><b>Interpersonal effectiveness:</b> Ask for what you need and maintain relationships and self-respect.</p><button onclick="go('Skills')">Explore the skills →</button></details><details class="card privacy-fold guide-teal"><summary>Words you'll see in the Diary Card</summary><p><b>Emotion:</b> What you feel, such as anger, fear, shame, or joy.</p><p><b>Thought:</b> Words or ideas going through your mind, such as “They don't understand me.”</p><p><b>Urge:</b> Something you feel pulled to do, whether or not you act on it.</p><p><b>Behavior:</b> Something you actually did or said, such as walking away or raising your voice.</p><p><b>Skill:</b> A strategy you practiced, even if it didn't work perfectly.</p><p>These can overlap. The point is curiosity and learning, not getting every label perfect.</p></details><details class="card privacy-fold guide-red"><summary>Your first five minutes</summary><ol><li>Open <b>Skills</b> and explore one skill that sounds useful.</li><li>Try <b>Help Me Now</b> for a guided STOP practice when you want to pause.</li><li>Open <b>Diary Card</b>, select a day, and record what you want to track.</li><li>Mark skills on the checklist, then see the <b>Weekly Review</b>.</li><li>Save your work and download a private copy if you want to keep it.</li></ol><p>You can skip any question. You don't need to complete the whole diary every day.</p><button class="primary" onclick="go('Diary Card')">Try the Diary Card →</button></details><details class="card privacy-fold"><summary>Before you write personal details</summary><p>Your saved work stays in this browser on this device, where other people with access to the device or browser files may be able to see it. It is not encrypted or automatically backed up.</p><button onclick="go('Privacy & Data')">Read privacy and backup information →</button></details>`}
function privacyGuideMarkup(){return `<h2>Privacy &amp; Your Data</h2><p>Understand how this prototype handles your entries before recording personal information.</p><details class="card privacy-fold guide-green"><summary>What stays on your device?</summary><p>Saved diary weeks, practice drafts, and some app preferences use this browser's local storage. This prototype has no account system and does not automatically send those entries to the app creator, your therapist, or group members. When installed from a supported website, its service worker may cache static app files for offline use; it does not cache your diary entries or JSON backups.</p><p><b>Important:</b> Browser storage is not encryption. Anyone with access to your unlocked device or its files may be able to read your entries.</p></details><details class="card privacy-fold guide-berry"><summary>Saving and downloading are different</summary><p><b>Save:</b> Keeps an entry in the current browser's local storage. Clearing browser data, changing browsers, or opening a different copy of this local HTML file can make saved work unavailable.</p><p><b>Download:</b> Creates a separate file you can keep. Downloads may contain sensitive details in readable text; store them privately and avoid sharing them accidentally.</p><p>This version does not automatically back up your entries to a cloud service. Your browser or Downloads folder may still be synced by your device settings. To restore a complete DBT Companion backup, open My Saved Work, select your saved .json file under Backup &amp; Restore, review the preview, and confirm. Restoring replaces diary, chain, follow-through and practice data. Journal and Reflection Jar entries are replaced if included in the backup; otherwise existing entries are kept. Download a fresh backup first. Individual downloaded text files do not automatically reappear inside the app.</p><button onclick="go('My Saved Work')">Open My Saved Work →</button></details><details class="card privacy-fold guide-teal"><summary>Before sharing the app</summary><p>Share only a <b>clean app file or official app link</b>, never your completed diary downloads, backups, or screenshots containing personal information. The app file itself does not include your saved browser entries.</p><p>Each person's browser stores their own work separately. This app does not automatically send diary entries to a therapist, group, or anyone else.</p><p>If you are using a shared phone or computer, consider whether it's safe to enter sensitive information.</p></details><details class="card privacy-fold guide-red"><summary>Safety and support</summary><p>DBT Companion is an independent educational prototype, not professional care, crisis monitoring, or an emergency service. No one is watching entries or responding to them.</p><p>If you are in immediate danger, contact local emergency services. In the United States, you can call or text <b>988</b> for suicide and crisis support.</p><p>You can leave sensitive fields blank and discuss concerns directly with a qualified professional.</p></details><details class="card privacy-fold"><summary>Our promise for the project</summary><p>The goal is to keep DBT Companion free to use. This prototype does not require an account or subscription. Future hosting or distribution would need a fresh privacy review before release.</p></details>`}

function saveChainField(){let el=document.getElementById('chainAnswer');if(el)chainAnswers[chainStep]=el.value;let fields=document.querySelectorAll('[data-chain-index]');fields.forEach(el=>chainAnswers[Number(el.dataset.chainIndex)]=el.value)}
function guidedMarkup(){const q=chainQuestions[chainStep];return `<div class="card"><div class="stepheader"><span class="tag">Step ${chainStep+1} of ${chainQuestions.length}</span><span class="muted">One step at a time</span></div><div class="progress"><div style="width:${(chainStep+1)/chainQuestions.length*100}%"></div></div><h3>${escapeHTML(q.title)}</h3><p class="term">DBT term: <b>${escapeHTML(q.term)}</b></p><p>${escapeHTML(q.help)}</p><label for="chainAnswer">Your response</label><textarea id="chainAnswer" placeholder="Take your time. You can leave this blank.">${escapeHTML(chainAnswers[chainStep])}</textarea><details class="chain-example"><summary>Show an example</summary><p>${escapeHTML(q.example)}</p></details><div class="stepbuttons"><button onclick="chainMove(-1)" ${chainStep===0?'disabled':''}>← Back</button>${chainStep<chainQuestions.length-1?'<button class="primary" onclick="chainMove(1)">Next →</button>':'<button class="primary" onclick="saveChainField();downloadChain()">Download my analysis</button>'}</div>${chainActionsMarkup()}</div>`}
function quickMarkup(){const i=quickStep,q=chainQuestions[i];return `<div class="card" id="quick-step-card"><div class="stepheader"><span class="tag">Question ${i+1} of ${chainQuestions.length}</span><span class="muted">Quick Worksheet</span></div><div class="progress"><div style="width:${(i+1)/chainQuestions.length*100}%"></div></div><h3>${escapeHTML(q.title)}</h3><p class="muted chain-term">DBT term: ${escapeHTML(q.term)}</p><p class="chain-help">${escapeHTML(q.help)}</p><label for="quickChainAnswer">Your response</label><textarea id="quickChainAnswer" data-chain-index="${i}" placeholder="Write in your own words. You can leave this blank.">${escapeHTML(chainAnswers[i])}</textarea><details class="chain-example"><summary>Show an example</summary><p>${escapeHTML(q.example)}</p></details><div class="stepbuttons"><button onclick="quickMove(-1)" ${i===0?'disabled':''}>← Previous</button><button class="primary" onclick="quickMove(1)" ${i===chainQuestions.length-1?'disabled':''}>Next →</button></div><p class="muted"><small>Your answers stay here as you move between questions. Save or download a copy to keep them.</small></p></div>${chainActionsMarkup()}`}
function quickMove(direction){saveChainField();quickStep=Math.max(0,Math.min(chainQuestions.length-1,quickStep+direction));render();document.getElementById('quick-step-card')?.scrollIntoView({behavior:'smooth',block:'start'})}
function chainActionsMarkup(){return `<div class="card"><h3>Keep your chain analysis</h3><p>Save a browser draft, download a text file, or review your complete chain and receive gentle self-check prompts.</p><button class="primary" onclick="saveChainDraft()">Save analysis in browser</button> <button onclick="downloadChain()">Download analysis</button> <button onclick="reviewChain()">Review my chain</button><p class="muted"><small>Browser drafts are not backed up or encrypted. Download important work.</small></p></div>`}
function saveChainDraft(){saveChainField();try{if(!activeChainId)activeChainId='chain-'+Date.now();chainDrafts[activeChainId]={answers:[...chainAnswers],updated:new Date().toISOString(),mode:chainMode,language:chainLanguage};localStorage.setItem('dbt-companion-chains-v11',JSON.stringify(chainDrafts));if(!JSON.parse(localStorage.getItem('dbt-companion-chains-v11')||'{}')[activeChainId])throw Error('Verification failed');showSaveToast('✓ Chain analysis saved! Find it under My Saved Work.')}catch(e){showSaveToast('Could not save this analysis. Please download a copy.',true)}}
function openSavedChain(id){const item=chainDrafts[id];if(!item)return;activeChainId=id;chainAnswers=chainQuestions.map((_,i)=>String(item.answers?.[i]||''));chainMode=item.mode||'guided';chainLanguage=item.language||'beginner';chainStep=0;quickStep=0;go('Chain Analysis')}
function deleteSavedChain(id){if(!confirm('Delete this chain analysis draft? Download a copy first if needed.'))return;try{delete chainDrafts[id];localStorage.setItem('dbt-companion-chains-v11',JSON.stringify(chainDrafts));render();showSaveToast('Chain analysis draft deleted.')}catch(e){showSaveToast('Could not delete this draft.',true)}}
function downloadSavedChain(id){let item=chainDrafts[id];if(!item)return;downloadText('dbt-chain-'+id+'.txt',chainExport(item.answers,item.updated));showSaveToast('Download requested. If your browser asks, confirm Download, then check your Downloads folder.')}
function chainExport(answers,date){return 'DBT Companion | Behavior Chain Analysis\nDate: '+new Date(date||Date.now()).toLocaleString()+'\n\n'+chainQuestions.map((q,i)=>(i+1)+'. '+q.term+'\n'+q.title+'\n'+(answers[i]||'[Not answered]')).join('\n\n')+'\n\nSelf-reflection tool; not a clinical assessment.'}
function reviewChain(){saveChainField();const answered=chainAnswers.filter(x=>x.trim()).length;const missing=chainQuestions.map((q,i)=>!chainAnswers[i].trim()?q.title:null).filter(Boolean);const feedback=missing.length?'<p><b>Questions you may want to explore:</b></p><ul>'+missing.map(x=>'<li>'+escapeHTML(x)+'</li>').join('')+'</ul>':'<p>You wrote something for every step. You can still revisit any part of the chain.</p>';const panel=`<div class="card" id="chain-review"><h3>Review your chain</h3><p>${answered} of ${chainQuestions.length} steps have responses. This is a completeness check, not an evaluation of your experience.</p>${feedback}${chainQuestions.map((q,i)=>`<h4>${i+1}. ${escapeHTML(q.title)}</h4><p style="white-space:pre-wrap">${escapeHTML(chainAnswers[i]||'Not answered yet')}</p>`).join('')}<button class="primary" onclick="saveChainDraft()">Save this analysis</button> <button onclick="downloadChain()">Download</button> <button onclick="render()">Back to questions</button></div>`;document.getElementById('content').innerHTML=`<h2>Behavior Chain Analysis</h2>${panel}`;document.getElementById('chain-review').scrollIntoView({block:'start'})}

let practiceDrafts={};try{practiceDrafts=JSON.parse(localStorage.getItem('dbt-companion-practice-v09')||'{}')||{}}catch(e){}
function practiceKey(name){return 'practice-'+name.replace(/ /g,'-')}

function showSaveToast(message,error=false){const toast=document.getElementById('save-toast');toast.textContent=message;toast.setAttribute('role',error?'alert':'status');toast.setAttribute('aria-live',error?'assertive':'polite');toast.style.background=error?'#a32339':'#165b50';toast.hidden=false;clearTimeout(window.saveToastTimer);window.saveToastTimer=setTimeout(()=>{toast.hidden=true},5000)}
function storePractice(name){capturePractice(name);try{localStorage.setItem('dbt-companion-practice-v09',JSON.stringify(practiceDrafts));const stored=JSON.parse(localStorage.getItem('dbt-companion-practice-v09')||'{}');if(stored[name]!==practiceDrafts[name])throw Error('Storage verification failed');let meta={};try{meta=JSON.parse(localStorage.getItem('dbt-companion-practice-dates')||'{}')||{}}catch(e){}meta[name]=new Date().toISOString();localStorage.setItem('dbt-companion-practice-dates',JSON.stringify(meta));practiceStatus(name,'✓ Saved in this browser. This did NOT create a file. Use Download response for a copy in Downloads.');showSaveToast('✓ Saved! Find this draft under My Saved Work. Complete backup includes saved practice drafts.')}catch(e){practiceStatus(name,'Could not save in this browser. Use Download response instead.');showSaveToast('Could not save here. Tap Download response instead.',true)}}
function chainSavedCards(){return Object.entries(chainDrafts).sort((a,b)=>String(b[1]?.updated||'').localeCompare(String(a[1]?.updated||''))).map(([id,item])=>{const answers=Array.isArray(item?.answers)?item.answers:[];const summary=answers.find(x=>typeof x==='string'&&x.trim())||'No responses yet';return `<div class="card"><h3>Behavior Chain Analysis</h3><p class="muted">${escapeHTML(new Date(item?.updated||0).toLocaleString())}</p><p>${escapeHTML(summary.slice(0,180))}</p><button class="primary" onclick="openSavedChain(${safeHandlerArg(id)})">Open & edit</button> <button onclick="downloadSavedChain(${safeHandlerArg(id)})">Download</button> <button onclick="deleteSavedChain(${safeHandlerArg(id)})">Delete</button></div>`}).join('')}
function savedWorkMarkup(){let meta={};try{meta=JSON.parse(localStorage.getItem('dbt-companion-practice-dates')||'{}')||{}}catch(e){}const names=Object.keys(practiceDrafts).filter(n=>typeof practiceDrafts[n]==='string'&&practiceDrafts[n].trim()).sort((a,b)=>(meta[b]||'').localeCompare(meta[a]||''));return `<h2>My Saved Work</h2><div class="card"><p>These are practice drafts stored inside this browser, not files in your Downloads folder. Open a draft to keep editing, or download a copy to your phone.</p><p><strong>Important:</strong> Browser drafts are not encrypted. They are included when you download a complete JSON backup, but they do not transfer automatically between browsers or app copies. Download a complete backup before clearing browser data or switching devices.</p></div>${chainSavedCards()}${diarySavedCards()}${names.length?names.map(n=>`<div class="card"><h3>${escapeHTML(n)} practice</h3><p class="muted">${meta[n]?escapeHTML(new Date(meta[n]).toLocaleString()):'Saved previously'}</p><p>${escapeHTML(practiceDrafts[n].slice(0,160))}${practiceDrafts[n].length>160?'…':''}</p><button class="primary" onclick="openSavedPractice(${safeHandlerArg(n)})">Open & edit</button> <button onclick="downloadSavedPractice(${safeHandlerArg(n)})">Download</button> <button onclick="deleteSavedPractice(${safeHandlerArg(n)})">Delete</button></div>`).join(''):'<div class="card"><h3>No saved drafts yet</h3><p>Go to Skills, open DEAR MAN, GIVE, FAST, or TIPP, write a response, and tap Save draft in browser. It will appear here if browser storage is available.</p><button class="primary" onclick="go(&quot;Skills&quot;)">Go to Skills</button></div>'}`}
function openSavedPractice(name){go('Skills');let module=name==='TIPP'?'Distress Tolerance':'Interpersonal Effectiveness';const m=Array.from(document.querySelectorAll('.skill-module')).find(e=>e.querySelector('summary')?.textContent.includes(module));if(m){m.open=true;const a=Array.from(m.querySelectorAll('.please-skill')).find(e=>e.querySelector('summary')?.textContent.includes(name));if(a){a.open=true;const practice=Array.from(a.querySelectorAll('.please-part')).find(e=>e.querySelector('summary')?.textContent.includes('Try it yourself'));if(practice)practice.open=true;setTimeout(()=>document.getElementById(practiceKey(name))?.scrollIntoView({block:'center',behavior:'smooth'}),30)}}}
function downloadSavedPractice(name){const response=practiceDrafts[name]||'';downloadText('dbt-'+name.toLowerCase().replace(/ /g,'-')+'-saved.txt','DBT Companion | '+name+' saved practice\n\nPrompt: '+skillAcronyms[name].practice+'\n\nMy response:\n'+response+'\n\nThis is a saved browser draft exported to a text file.');showSaveToast('Download requested. If your browser asks, confirm Download, then check your Downloads folder.')}
function deleteSavedPractice(name){if(!confirm('Delete your '+name+' draft from this browser? Download a copy first if you want to keep it.'))return;delete practiceDrafts[name];try{localStorage.setItem('dbt-companion-practice-v09',JSON.stringify(practiceDrafts));let meta=JSON.parse(localStorage.getItem('dbt-companion-practice-dates')||'{}');delete meta[name];localStorage.setItem('dbt-companion-practice-dates',JSON.stringify(meta));showSaveToast('Draft deleted from this browser.');render()}catch(e){showSaveToast('Could not delete draft in this browser.',true)}}

function reviewPractice(name){capturePractice(name);const id=name.replace(/ /g,'-'),answer=(practiceDrafts[name]||'').trim(),checks=practiceChecks[name],chosen=checks.filter((_,i)=>document.getElementById('review-'+id+'-'+i)?.checked),missing=checks.filter((_,i)=>!document.getElementById('review-'+id+'-'+i)?.checked);const el=document.getElementById('feedback-'+id);if(!answer){el.innerHTML='<p>Please write a response first so you have something to reflect on.</p>';return}el.innerHTML='<h4>Your guided self-review</h4><p><b>Areas you identified:</b> '+(chosen.map(x=>escapeHTML(x[0])).join(', ')||'None selected yet')+'.</p><p><b>Consider next:</b> '+(missing.length?missing.map(x=>escapeHTML(x[1])).join(' '):'You checked every element. Reread your response and see whether each element is actually present.')+'</p><p><small>These are prompts based on your own checklist choices. The app cannot verify that your writing demonstrates a skill or assess your situation.</small></p>';}
function pleaseMarkup(){const parts=[['PL','Treat Physical Illness','Attend to health needs, medications as prescribed, and symptoms. Ask for medical support when needed.'],['E','Balance Eating','Eat regularly and in ways that work for your health, resources, and individual needs.'],['A','Avoid Mood-Altering Substances','Notice how alcohol, drugs, and other substances may affect mood and choices. Seek support if changing use is difficult.'],['S','Balance Sleep','Aim for a sustainable sleep routine and enough rest for your circumstances.'],['E','Get Exercise','Choose safe, accessible movement that fits your body and abilities; small amounts count.']];return `<details class="please-skill"><summary>💛 PLEASE — care for your body and emotions</summary><div class="please-inner"><p>PLEASE is an Emotion Regulation skill for reducing vulnerability to intense emotions. Tap each letter to see what it means.</p>${parts.map(([letter,title,description])=>`<details class="please-part"><summary><span class="please-letter">${letter}</span> ${title}</summary><p>${description}</p></details>`).join('')}<p class="muted"><small>The acronym is traditionally written PL–E–A–S–E. Adapt these suggestions to your health and circumstances.</small></p></div></details>`}

const stopSteps = [

const reflectionCards=[['Self-respect','I can honor my needs while respecting others.','What boundary would make this week easier?'],['Mindfulness','I can notice a feeling without acting on it.','What feeling can I make room for today?'],['Relationships','I can care about someone and still disagree.','Where could I practice both kindness and honesty?'],['Strengths','Small steps are still meaningful steps.','What have I handled better lately?'],['Joy','I can make room for something pleasant today.','What simple activity brings me a little joy?'],['Choice','I do not have to answer every irritation.','When could a pause protect my peace?'],['Acceptance','I can acknowledge reality without approving of it.','What fact am I ready to recognize today?'],['Self-compassion','Learning a skill takes practice, not perfection.','How would I encourage a friend in my situation?']];let currentCard=null,cardFlipped=false;function drawCard(){const jar=document.querySelector(".mason-jar");if(jar){jar.classList.remove("jar-drawing");void jar.getBoundingClientRect();jar.classList.add("jar-drawing");}let next=Math.floor(Math.random()*reflectionCards.length);if(currentCard&&reflectionCards.length>1&&reflectionCards[next]===currentCard)next=(next+1)%reflectionCards.length;currentCard=reflectionCards[next];cardFlipped=false;showCard()}function flipCard(){if(!currentCard){drawCard();return}cardFlipped=!cardFlipped;showCard()}function showCard(){document.getElementById('cardcategory').textContent=currentCard[0];document.getElementById('cardtext').textContent=cardFlipped?currentCard[2]:currentCard[1];document.getElementById('cardhint').textContent=cardFlipped?'Reflection question':'Tap Flip card for your question';saveReflectionDraft()}function downloadReflection(){downloadText('dbt-reflection-'+new Date().toISOString().slice(0,10)+'.txt','Card: '+(currentCard?currentCard[1]:'None drawn')+'\nQuestion: '+(currentCard?currentCard[2]:'')+'\nWhat it means to me: '+v('shareMeaning')+'\nMy focus: '+v('focus'))}function downloadText(filename,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function v(id){return document.getElementById(id).value}function downloadChain(){saveChainField();downloadText('dbt-chain-analysis-'+new Date().toISOString().slice(0,10)+'.txt',chainExport(chainAnswers));showSaveToast('Download requested. If your browser asks, confirm Download, then check your Downloads folder.')}function downloadDiary(){downloadText('dbt-diary-'+new Date().toISOString().slice(0,10)+'.txt',`Emotions: ${selectedEmotions.map(w=>w+' ('+(emotionIntensities[w]??5)+'/10)').join(', ')||'Not specified'}\nOverall intensity: ${v('mood')}/10\nSkill: ${v('used')}\nReflection: ${v('note')}`)}function downloadJournal(){downloadText('dbt-journal-'+new Date().toISOString().slice(0,10)+'.txt',v('journal'))}
