<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Movimento Soberana 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════ NAVBAR ═══════════════ -->
<nav class="nav">
  <div class="nav-left">
    <img class="logo" id="logo" alt="Logo Movimento Soberana">
    <div class="logo-ph" id="logoPh">LOGO</div>
    <span class="nav-title">Movimento Soberana 2026</span>
  </div>
  <div class="tabs">
    <div class="tab on" onclick="switchTab(0)">Classificação</div>
    <div class="tab" onclick="switchTab(1)">Pontuação</div>
    <div class="tab" onclick="switchTab(2)">Workshop</div>
  </div>
  <div class="nav-right">
    <button class="tv-btn" id="tvBtn" onclick="toggleTV()">📺 Modo TV</button>
    <div class="timer-wrap">
      <div class="timer-row">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="timer-val" id="timer">--:--</span>
      </div>
      <span class="timer-label">Próxima atualização</span>
    </div>
  </div>
</nav>

<!-- ═══════════════ PANES ═══════════════ -->
<div id="pane0" class="pane on"></div>
<div id="pane1" class="pane"></div>
<div id="pane2" class="pane"></div>

<script src="script.js"></script>
</body>
</html>
