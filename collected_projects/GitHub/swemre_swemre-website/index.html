<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWEMRE</title>
    <meta
      name="description"
      content="SWEMRE: portfolio, articles and projects of Emre, software engineer."
    />
    <!-- Link previews in chats and social networks -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SWEMRE" />
    <meta property="og:title" content="SWEMRE" />
    <meta
      property="og:description"
      content="Portfolio, articles and projects of Emre, software engineer."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/images/avatar-384.png" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="swemre articles"
      href="/rss.xml"
    />
    <script>
      try {
        var t = localStorage.getItem('swemre:theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
