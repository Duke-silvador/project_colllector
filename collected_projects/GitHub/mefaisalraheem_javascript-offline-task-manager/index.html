<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>📋 Task Manager</h1>
      <span id="connection-status" class="status status-online">Online</span>
    </div>
    <div class="header-right">
      <button id="add-task-btn" class="btn btn-primary" title="Add Task (N)">+ New Task</button>
      <button id="export-btn" class="btn" title="Export JSON">Export</button>
      <label class="btn btn-file" title="Import JSON">
        Import
        <input type="file" id="import-input" accept="application/json" hidden>
      </label>
    </div>
  </header>

  <section class="toolbar">
    <input type="search" id="search-input" placeholder="Search tasks... (press /)" aria-label="Search tasks">
    <select id="filter-priority" aria-label="Filter by priority">
      <option value="all">All Priorities</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <select id="filter-tag" aria-label="Filter by tag">
      <option value="all">All Tags</option>
    </select>
    <button id="clear-filters" class="btn btn-ghost">Clear Filters</button>
  </section>

  <main class="board" id="board">
    <section class="column" data-status="todo">
      <header class="column-header">
        <h2>To Do <span class="count" data-count>0</span></h2>
      </header>
      <div class="task-list" data-status="todo" aria-dropeffect="move"></div>
    </section>
    <section class="column" data-status="inprogress">
      <header class="column-header">
        <h2>In Progress <span class="count" data-count>0</span></h2>
      </header>
      <div class="task-list" data-status="inprogress" aria-dropeffect="move"></div>
    </section>
    <section class="column" data-status="done">
      <header class="column-header">
        <h2>Done <span class="count" data-count>0</span></h2>
      </header>
      <div class="task-list" data-status="done" aria-dropeffect="move"></div>
    </section>
  </main>

  <div class="shortcuts-hint">
    <kbd>N</kbd> New &nbsp; <kbd>/</kbd> Search &nbsp; <kbd>Esc</kbd> Close &nbsp;
    <kbd>Ctrl</kbd>+<kbd>Z</kbd> Undo delete
  </div>

  <!-- Task Modal -->
  <div class="modal" id="task-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="modal-title">New Task</h2>
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      </header>
      <form id="task-form" class="modal-body">
        <input type="hidden" id="task-id">
        <label>
          Title *
          <input type="text" id="task-title" required maxlength="120" autocomplete="off">
        </label>
        <label>
          Description
          <textarea id="task-description" rows="3" maxlength="1000"></textarea>
        </label>
        <div class="form-row">
          <label>
            Priority
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label>
            Status
            <select id="task-status">
              <option value="todo">To Do</option>
              <option value="inprogress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </label>
        </div>
        <label>
          Tags (comma-separated)
          <input type="text" id="task-tags" placeholder="e.g. work, urgent" autocomplete="off">
        </label>
        <label>
          Due Date
          <input type="date" id="task-due">
        </label>
        <footer class="modal-footer">
          <button type="button" class="btn btn-ghost" id="delete-task-btn" hidden>Delete</button>
          <div class="spacer"></div>
          <button type="button" class="btn" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </footer>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="task-template">
    <article class="task-card" draggable="true" tabindex="0">
      <header class="task-card-header">
        <h3 class="task-title"></h3>
        <span class="priority-badge"></span>
      </header>
      <p class="task-desc"></p>
      <div class="task-tags"></div>
      <footer class="task-card-footer">
        <span class="task-due"></span>
      </footer>
    </article>
  </template>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
