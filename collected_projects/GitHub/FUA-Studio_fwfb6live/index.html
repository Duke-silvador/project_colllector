<!DOCTYPE html><html><head><meta charset="utf-8">
<title>FWF DUAL ARENA</title>
<style>
 :root{--bg:#0a0e12;--panel:#0d1319;--line:#1c2a33;--tx:#c9d6df;--dim:#5a6b76;
       --grn:#3ddc84;--cyn:#4fd6ff;--amb:#ffb454;--red:#ff5c5c;}
 *{box-sizing:border-box}
 body{background:var(--bg);color:var(--tx);font:12px/1.55 'Cascadia Mono',Consolas,monospace;
      margin:0;padding:14px 18px;}
 .hdr{display:flex;gap:18px;align-items:baseline;border-bottom:1px solid var(--line);
      padding-bottom:8px;margin-bottom:10px;flex-wrap:wrap;}
 .hdr .t{font-size:14px;letter-spacing:1px;color:#e8f4fb;}
 .hdr .t b{color:var(--grn)}
 .hdr .s{color:var(--dim);}
 .hdr .r{margin-left:auto;color:var(--dim);}
 table.sum{width:100%;border-collapse:collapse;margin-bottom:14px;}
 table.sum th,table.sum td{border:1px solid var(--line);padding:4px 10px;text-align:left;}
 table.sum th{color:var(--dim);font-weight:normal;background:var(--panel);}
 .num{text-align:right;font-variant-numeric:tabular-nums;}
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
 .g{border:1px solid var(--line);background:var(--panel);}
 .g h3{margin:0;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;
       letter-spacing:1px;display:flex;justify-content:space-between;}
 .bar{height:6px;background:#0a141c;overflow:hidden;margin:2px 0 6px;}
 .bar>i{display:block;height:100%;background:var(--grn);transition:width .8s;}
 .sec{padding:4px 10px;color:var(--dim);border-bottom:1px solid var(--line);background:#0b1117;}
 .sh{padding:3px 10px;border-bottom:1px solid #131e26;color:var(--cyn);}
 .sh .dn{color:var(--grn)}
 .ev{padding:3px 10px;border-bottom:1px solid #111b22;}
 .ev .tag{display:inline-block;min-width:110px;color:var(--amb);}
 .ev .tag.worker{color:var(--cyn)} .ev .tag.final{color:var(--grn)}
 .ev .body{white-space:pre-wrap;word-break:break-all;}
 .ev .meta{color:var(--dim);margin-left:8px;}
 .ev .w{color:var(--amb)} .ev .e{color:var(--red)}
 .rc{padding:4px 10px;color:var(--dim);}
 .rc .ok{color:var(--grn)} .rc .no{color:#48606c}
 .foot{margin-top:10px;color:var(--dim);}
</style></head><body>
<div class="hdr">
 <div class="t">FWF DUAL ARENA <b>//</b> TB86</div>
 <div class="s" id="sys"></div>
 <div class="r" id="clock"></div>
</div>
<table class="sum" id="sum"></table>
<div class="cols" id="cols"></div>
<div class="foot">refresh 4s · AGNES=apihub.agnes-ai.cn(全员) · NEMOTRON 组 planner/workerB=openrouter/nvidia/nemotron-3-super-120b-a12b:free · 同卷86题</div>
<script>
const esc=s=>(s||'').replace(/</g,'&lt;');
const fmtx=f=>Object.entries(f).map(([k,v])=>k+'×'+v).join(' ')||'—';
async function tick(){
 const j=await (await fetch('./status.json?v='+Date.now(),{cache:'no-store'})).json();
 document.getElementById('sys').textContent=
  `tb ${j.tb} · 容器 ${j.containers} · 网络 ${j.networks}${j.networks>25?' ⚠':''} · 运行 ${Math.floor(j.elapsed_min/60)}h${String(Math.round(j.elapsed_min%60)).padStart(2,'0')}m`;
 document.getElementById('clock').textContent=j.ts;
 let s='<tr><th>GROUP</th><th class="num">DONE/86</th><th class="num">RESOLVED</th><th class="num">FAIL</th><th class="num">TOKENS</th><th>失败分布</th><th class="num">PACE</th><th class="num">ETA</th></tr>';
 for(const g of j.groups){
  const pace=g.eta_min!=null?((g.done/Math.max(j.elapsed_min,.1)*60).toFixed(1)+'/h'):'—';
  const eta=g.eta_min!=null?Math.floor(g.eta_min/60)+'h'+g.eta_min%60+'m':'—';
  s+=`<tr><td style="color:${g.color}">${g.name}</td><td class="num">${g.done}</td>`+
     `<td class="num" style="color:${g.resolved?'var(--grn)':'var(--tx)'}">${g.resolved}</td>`+
     `<td class="num">${g.failed}</td><td class="num">${(g.tok_all/1000).toFixed(1)}k</td>`+
     `<td>${fmtx(g.fms)}</td><td class="num">${pace}</td><td class="num">${eta}</td></tr>`;
 }
 document.getElementById('sum').innerHTML=s;
 let h='';
 for(const g of j.groups){
  const pct=(g.done/86*100).toFixed(0);
  h+=`<div class="g"><h3 style="color:${g.color}"><span>${g.name} — ${g.done}/86 (${pct}%)</span>
      <span style="color:var(--grn)">resolved ${g.resolved}</span></h3>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
  for(const sh of g.shards){
   h+=`<div class="sh">shard ${sh.shard} ${sh.doneflag?'<span class="dn">[DONE]</span>':'▶'} ${esc(sh.cur.join(' / '))||'初始化中'}</div>`;
  }
  h+=`<div class="sec">成员实时流（最近事件 · 完整内容）</div>`;
  let any=false;
  for(const sh of g.shards){for(const m of sh.members){any=true;
   h+=`<div class="ev"><span class="t" style="color:var(--tx)">${esc(m.task)}</span>`+
      `${m.warn?`<span class="w"> ⚠${m.warn}</span>`:''}${m.err?`<span class="e"> ✖${esc(m.err)}</span>`:''}`+
      `<span class="meta">${m.age_min}m前</span></div>`;
   for(const e of m.events){
    h+=`<div class="ev"><span class="tag ${e.tag.startsWith('worker')?'worker':(e.tag=='final'?'final':'')}">[${esc(e.tag)}]</span>`+
       `<span class="body">${esc(e.body)}</span></div>`;
   }
  }}
  if(!any)h+='<div class="ev" style="color:var(--dim)">首波容器构建中，agent 未启动</div>';
  h+=`<div class="sec">最近完成</div><div class="rc">`;
  h+=g.recent.map(r=>`<span class="${r.ok?'ok':'no'}">${r.ok?'✔':'✘'}${esc(r.task)}</span>`).join(' ')||'<span>暂无</span>';
  h+='</div></div>';
 }
 document.getElementById('cols').innerHTML=h;
}
tick();setInterval(tick,4000);
</script></body></html>
