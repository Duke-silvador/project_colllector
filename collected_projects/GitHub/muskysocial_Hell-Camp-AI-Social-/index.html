function chatPage(){if(state.page==='Messages'){return heading('Messages','')+'<div class="segment"><button class="tab active">Messages</button><button class="tab" data-action="requests">Requests <span class="badge">2</span></button></div><div class="searchbox" style="width:100%;margin-bottom:10px">⌕ <input id="chatSearch" placeholder="Search chats..."></div><div class="card chat-list">'+[['Lily Rose','Hey, how are you doing? 😊','9:12 AM','2','L'],['Official MuskySocials','Welcome to Hell Camp! 💜','8:45 AM','1','H'],['David King','Sent a photo','Yesterday','✓','D'],['Chinara Beauty','Are you still selling the sneakers?','Yesterday','1','C'],['Jay Money','Let’s catch up soon 💯','Yesterday','','J'],['Sarah Official','Thanks for the follow! 🙏','Monday','','S'],['Treasure','Okay no problem','Sunday','','T']].map(function(x,i){return '<div class="chat-row" data-chat="'+i+'"><span class="avatar ring">'+x[4]+'</span><div class="chat-info"><b>'+x[0]+'</b><p>'+x[1]+'</p></div><div class="muted tiny">'+x[2]+' '+(x[3]&&x[3]!=='✓'?'<span class="badge">'+x[3]+'</span>':x[3]==='✓'?'✓✓':'')+'</div></div>'}).join('')+'</div><button class="floating" data-action="newMessage">▧ &nbsp;New Message</button>'}return heading(state.page,'')+'<div class="card"><div class="chatlog" id="chatlog">'+state.messages.map(function(m){return '<div class="bubble '+(m.who==='You'?'me':'')+'"><b>'+esc(m.who)+'</b><br>'+esc(m.text)+'</div>'}).join('')+'</div><form id="chatform" class="chatform"><input class="field" id="chatinput" placeholder="Write a message..." required><button class="btn primary">Send</button></form></div>'}
function authScreen(){return '<div class="auth-wrap"><section class="auth-card"><div class="auth-logo">Hell<span>Camp</span></div><h1>'+(authMode==='login'?'Welcome back':authMode==='reset'?'Reset your password':'Create your account')+'</h1><p>'+(authMode==='login'?'Sign in to continue to Hell Camp.':authMode==='reset'?'Enter your email to request a password reset.':'Join Hell Camp to connect, create and discover.')+'</p>'+(authNotice?'<div class="auth-'+authNoticeType+'">'+esc(authNotice)+'</div>':'')+'<form id="authForm">'+(authMode==='signup'?'<label class="auth-label">Your name</label><input class="auth-field" id="authName" autocomplete="name" placeholder="Full name" required>':'')+'<label class="auth-label">Email address</label><input class="auth-field" id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required>'+(authMode==='reset'?'':'<label class="auth-label">Password</label><input class="auth-field" id="authPassword" type="password" autocomplete="'+(authMode==='login'?'current-password':'new-password')+'" minlength="6" placeholder="At least 6 characters" required>')+'<button class="auth-submit">'+(authMode==='login'?'Sign in':authMode==='reset'?'Send reset link':'Create account')+'</button></form>'+(authMode==='login'?'<button class="auth-switch" data-auth-mode="reset">Forgot password?</button>':'')+'<button class="auth-switch" data-auth-mode="'+(authMode==='login'?'signup':'login')+'">'+(authMode==='login'?'New here? Create an account':'Back to sign in')+'</button><div class="auth-note">Secure sign-in powered by Supabase.</div></section></div>'}
async function loadAuthProfile(){if(!supabaseClient||!authUser)return;var appRole=authUser.app_metadata&&authUser.app_metadata.role==='admin'?'admin':'client';var fallback={id:authUser.id,role:appRole,display_name:authUser.user_metadata&&authUser.user_metadata.display_name||authUser.email.split('@')[0]};var r=await supabaseClient.from('profiles').select('id,display_name,email,role,credits,daily_credits,paid_coins,is_verified,avatar_path,bio').eq('id',authUser.id).maybeSingle();if(r.error){console.warn('Profile lookup:',r.error.message);authProfile=fallback;return;}authProfile=Object.assign({},fallback,r.data||{} ,{role:appRole});if(!r.data){var ins=await supabaseClient.from('profiles').insert({id:authUser.id,email:authUser.email,display_name:authProfile.display_name}).select('id,display_name,email,role,credits,daily_credits,paid_coins,is_verified,avatar_path,bio').maybeSingle();if(!ins.error&&ins.data)authProfile=Object.assign({},fallback,ins.data,{role:appRole});else if(ins.error)console.warn('Profile row creation needs a signup trigger/policy:',ins.error.message);}}
function render(){var dp=document.querySelector('.drawer-profile');if(dp){var av=dp.querySelector('.avatar'),bs=dp.querySelector('b'),sm=dp.querySelector('.muted');if(av)av.textContent=authUser?(authProfile&&authProfile.display_name?authProfile.display_name:authUser.email||'U').trim().charAt(0).toUpperCase():'H';if(bs)bs.textContent=authUser?(authProfile&&authProfile.display_name||authUser.user_metadata&&authUser.user_metadata.display_name||authUser.email||'Hell Camp member'):'Guest';if(sm)sm.textContent=authUser?'@'+((authUser.email||'member').split('@')[0]):'Sign in to your account';}var so=document.getElementById('drawerSignOut');if(so)so.style.display=authUser?'flex':'none';if(!authUser){view.innerHTML=authScreen();return;}document.querySelectorAll('[data-page]').forEach(function(b){b.classList.toggle('active',b.dataset.page===state.page)});document.querySelectorAll('[data-page="ADMINhub"]').forEach(function(b){b.style.display=authProfile&&authProfile.role==='admin'?'':'none'});if(state.page==='ADMINhub'&&(!authProfile||authProfile.role!=='admin')){view.innerHTML=heading('Admin access restricted','Only authorised administrators can open ADMINhub.')+'<div class="card"><p>Your account does not have administrator permission.</p><button class="btn primary" data-page="Home">Back to Home</button></div>';return;}var funcs={Home:home,Discover:discover,Messages:chatPage,Marketplace:market,'Create Post':createPost,'AI Studio':ai,Profile:profile,Premium:premium,Settings:settings,ADMINhub:admin};view.innerHTML=(funcs[state.page]||function(){return generic(state.page)})();document.title=state.page+' — Hell Camp';}
document.addEventListener('click',async function(e){var authAction=e.target.closest('[data-auth-action]');if(authAction&&authAction.dataset.authAction==='signout'){authAction.disabled=true;try{if(!supabaseClient)throw new Error('Authentication service is unavailable.');var out=await supabaseClient.auth.signOut();if(out.error)throw out.error;authUser=null;authProfile=null;authMode='login';authNotice='You have signed out.';authNoticeType='success';state.page='Home';document.getElementById('menuOverlay').classList.remove('open');render();}catch(err){alert('Could not sign out: '+(err.message||'Please try again.'));}finally{authAction.disabled=false;}return;}var mode=e.target.closest('[data-auth-mode]');if(mode){authMode=mode.dataset.authMode;authNotice='';render();return;}if(e.target.closest('#openMenu')){document.getElementById('menuOverlay').classList.add('open');return}if(e.target.closest('#closeMenu')||e.target.id==='menuOverlay'){document.getElementById('menuOverlay').classList.remove('open');return}var p=e.target.closest('[data-page]');if(p){document.getElementById('menuOverlay').classList.remove('open');state.page=p.dataset.page;render();window.scrollTo(0,0);return}var m=e.target.closest('[data-market]');if(m){state.market=m.dataset.market;render();return}var b=e.target.closest('[data-action]');if(!b)return;var i=b.dataset.i;switch(b.dataset.action){case'theme':document.body.classList.toggle('light');break;case'publish':var tx=document.getElementById('createText');if(tx&&tx.value.trim()){state.posts.unshift({name:state.name,text:tx.value.trim(),tag:'#HellCamp',emoji:'✨',likes:0});state.page='Home';render()}else alert('Write something before posting.');break;case'heart':b.textContent=b.textContent==='♡'?'♥':'♡';b.style.color=b.textContent==='♥'?'#ff5bbd':'white';break;case'newMessage':state.page='New Message';render();break;case'upload':alert('Photo/video upload requires storage integration.');break;case'poll':alert('Poll creation preview.');break;case'feeling':alert('Feeling selector preview.');break;case'requests':alert('Message requests are a preview until messaging is connected.');break;case'like':state.liked[i]=!state.liked[i];render();break;case'save':state.saved[i]=!state.saved[i];render();break;case'comment':alert('Comments will be enabled after backend integration.');break;case'share':alert('Share features will be connected in a later stage.');break;case'more':alert('Post options preview.');break;case'follow':state.following=!state.following;render();break;case'savename':var n=document.getElementById('nameinput');if(n&&n.value.trim())state.name=n.value.trim();render();break;case'post':var input=document.getElementById('postText');if(input&&input.value.trim()){state.posts.unshift({name:state.name,text:input.value.trim(),tag:'#HellCamp',emoji:'✨',likes:0});render()}else alert('Write something before posting.');break}});
document.addEventListener('submit',async function(e){if(e.target.id==='authForm'){e.preventDefault();if(!supabaseClient){authNotice='Authentication service failed to load. Refresh and try again.';authNoticeType='error';render();return;}var email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword')?.value||'';try{var result;if(authMode==='signup'){var name=document.getElementById('authName').value.trim();result=await supabaseClient.auth.signUp({email,password,options:{data:{display_name:name,full_name:name}}});if(result.error)throw result.error;if(result.data.session){authUser=result.data.user;await loadAuthProfile();state.name=name||email.split('@')[0];}else{authNotice='Account created. Check your email for a confirmation link, then sign in.';authNoticeType='success';authMode='login';}}else if(authMode==='reset'){result=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(result.error)throw result.error;authNotice='If an account exists, a password reset email has been requested.';authNoticeType='success';authMode='login';}else{result=await supabaseClient.auth.signInWithPassword({email,password});if(result.error)throw result.error;authUser=result.data.user;await loadAuthProfile();state.name=(authProfile&&authProfile.display_name)||email.split('@')[0];authNotice='Signed in successfully.';authNoticeType='success';}render();}catch(err){authNotice=err.message||'Authentication failed.';authNoticeType='error';render();}return;}if(e.target.id!=='chatform')return;e.preventDefault();var input=document.getElementById('chatinput');var t=input.value.trim();if(!t)return;state.messages.push({who:'You',text:t});state.messages.push({who:state.page==='Messages'?'Mira (demo)':'AI Guide',text:state.page==='Messages'?'This is a demo conversation. Connect messaging services to send real messages.':'I can help you plan content, explore Hell Camp features, and brainstorm creative ideas. Live AI responses will be available after an AI service is connected.'});render();var log=document.getElementById('chatlog');if(log)log.scrollTop=log.scrollHeight});
document.getElementById('search').addEventListener('keydown',function(e){if(e.key==='Enter'&&this.value.trim()){state.page='Discover';render();var sub=view.querySelector('.sub');if(sub)sub.textContent='Search preview: '+this.value.trim()+' — connect search to find real accounts and posts.'}});
if(supabaseClient){supabaseClient.auth.onAuthStateChange(function(event,session){authUser=session&&session.user||null;if(!authUser){authProfile=null;render();return;}loadAuthProfile().then(function(){state.name=(authProfile&&authProfile.display_name)||authUser.email.split('@')[0];render();}).catch(function(err){console.warn('Could not load account profile:',err);render();});});supabaseClient.auth.getSession().then(function(result){if(result.error)throw result.error;authUser=result.data.session&&result.data.session.user||null;if(authUser){return loadAuthProfile().then(function(){state.name=(authProfile&&authProfile.display_name)||authUser.email.split('@')[0];});}}).catch(function(err){console.warn('Could not restore saved login:',err);authNotice='Could not restore your session. Please sign in again.';authNoticeType='error';}).finally(render);}else{render();}
})();
</script><script>if("serviceWorker" in navigator && location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("PWA service worker registration failed",err)));}</script></body></html>
