<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع يعمل بنجاح</title>
    
    <!-- كود التنسيقات (CSS) مدمج -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        p {
            color: #606770;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        button {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #006bce;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>تم حل مشكلة الشاشة البيضاء!</h1>
        <p>الكود الآن مدمج ويعمل داخل ملف واحد بدون مشاكل في مسارات الملفات الخارجية.</p>
        <button id="btn">اضغط للتجربة</button>
    </div>

    <!-- كود السكربت (JavaScript) مدمج -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log("تم تحميل الصفحة والسكربت بنجاح!");

            const button = document.getElementById('btn');
            button.addEventListener('click', () => {
                alert('السكربت يعمل بشكل ممتاز!');
            });
        });
    </script>
</body>
</html>
