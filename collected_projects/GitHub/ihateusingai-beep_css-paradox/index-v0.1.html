<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>CSS Paradox — 霓虹蟲洞逃亡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&family=Press+Start+2P&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0a12;
      font-family: 'Rajdhani', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

    /* ===== HUD ===== */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 18px 26px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-block { color: #00f5ff; font-family: 'Orbitron', monospace; }
    .hud-label { font-size: 11px; letter-spacing: 0.2em; opacity: 0.7; }
    .hud-value { font-size: 30px; font-weight: 900; text-shadow: 0 0 14px currentColor; line-height: 1; margin-top: 4px; }
    .shield-wrap { width: 220px; margin-top: 6px; }
    .shield-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.08); border: 1px solid #2ecc71; }
    .shield-fill { height: 100%; background: linear-gradient(90deg, #2ecc71, #00f5ff); box-shadow: 0 0 12px #2ecc71; transition: width 0.15s linear; }
    .combo { color: #f39c12; font-size: 16px; font-weight: 700; margin-top: 4px; text-shadow: 0 0 8px #f39c12; min-height: 18px; }

    /* ===== Overlays ===== */
    .overlay {
      position: fixed; inset: 0; z-index: 100;
      background: radial-gradient(circle, rgba(10,10,18,0.85) 0%, rgba(10,10,18,0.95) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #00f5ff; font-family: 'Orbitron', monospace;
      text-align: center; padding: 20px;
    }
    .overlay.hidden { display: none; }
    .title {
      font-size: clamp(36px, 7vw, 72px); font-weight: 900;
      letter-spacing: 0.15em;
      text-shadow: 0 0 20px #00f5ff, 0 0 40px #00f5ff, 0 0 80px #00f5ff;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: clamp(14px, 2.5vw, 22px); color: #ff6b35;
      letter-spacing: 0.4em; margin-bottom: 40px;
      text-shadow: 0 0 12px #ff6b35;
    }
    .instructions {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(14px, 2.2vw, 19px);
      color: #e0e0e0; line-height: 1.9;
      max-width: 540px; margin-bottom: 32px;
    }
    .instructions strong { color: #00f5ff; font-weight: 700; }
    .instructions .warn { color: #ff6b35; }
    .instructions .key {
      display: inline-block;
      background: rgba(0, 245, 255, 0.15);
      border: 1px solid #00f5ff;
      padding: 2px 10px;
      border-radius: 4px;
      font-family: 'Orbitron', monospace;
      font-size: 0.85em;
      color: #00f5ff;
      margin: 0 2px;
    }
    .prompt {
      margin-top: 24px;
      font-size: clamp(14px, 1.8vw, 18px);
      color: #f39c12;
      animation: pulse 1.5s ease-in-out infinite;
      letter-spacing: 0.15em;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    .gameover-title {
      color: #ff4757;
      font-size: clamp(40px, 8vw, 84px);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-shadow: 0 0 20px #ff4757, 0 0 50px #ff4757;
      margin-bottom: 16px;
    }
    .gameover-sub {
      color: #ff6b35;
      font-size: clamp(14px, 2vw, 20px);
      letter-spacing: 0.3em;
      margin-bottom: 32px;
    }
    .final-score {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(20px, 3vw, 28px);
      color: #b0b0b0;
      letter-spacing: 0.2em;
    }
    .final-score span {
      display: block;
      font-family: 'Orbitron', monospace;
      font-size: clamp(48px, 9vw, 96px);
      font-weight: 900;
      color: #f39c12;
      text-shadow: 0 0 20px #f39c12;
      margin-top: 4px;
    }
    .footer-tip {
      position: absolute; bottom: 18px;
      font-size: 11px; color: rgba(255,255,255,0.3);
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-block">
      <div class="hud-label">SCORE</div>
      <div class="hud-value" id="score">0</div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="hud-block" style="text-align: right;">
      <div class="hud-label">SHIELD</div>
      <div class="shield-wrap">
        <div class="shield-bar"><div class="shield-fill" id="shield" style="width: 100%;"></div></div>
      </div>
    </div>
  </div>

  <!-- Title screen -->
  <div id="title-screen" class="overlay">
    <div class="title">CSS PARADOX</div>
    <div class="subtitle">霓 虹 蟲 洞 逃 亡</div>
    <div class="instructions">
      <strong>🛸 拖動手指</strong>控制「悖論號」飛船<br>
      <strong>⚡ 第二指拖動</strong>生成蟲洞 — 入口吸附，出口噴射<br>
      <strong>🔫 自動射擊</strong>，善用蟲洞改變子彈軌跡<br>
      <span class="warn">⚠ 子彈穿過蟲洞會保留 80% 速度</span><br>
      <span style="opacity: 0.6; font-size: 0.9em;">鍵盤：方向鍵 / WASD 移動，<span class="key">R</span> 重啟</span>
    </div>
    <div class="prompt">▶ 點擊 / 觸控屏幕開始 ◀</div>
    <div class="footer-tip">v0.1.0 PROTOTYPE · SMART BOARD / iPAD READY</div>
  </div>

  <!-- Game over screen -->
  <div id="game-over" class="overlay hidden">
    <div class="gameover-title">SYSTEM DOWN</div>
    <div class="gameover-sub">// ship destroyed //</div>
    <div class="final-score">FINAL SCORE<span id="final-score">0</span></div>
    <div class="prompt">▶ 點擊 / 按 R 鍵重啟 ◀</div>
    <div class="footer-tip">v0.1.0 PROTOTYPE</div>
  </div>

<script>
/* ========================================================================
   CSS PARADOX — 霓虹蟲洞逃亡
   Minimal Playable Prototype (v0.1.0)
   ----------------------------------------------------------------------
   - Single-file HTML5 game
   - Pure Canvas 2D rendering
   - PointerEvent unified input (mouse / touch / pen)
   - 60fps game loop with fixed-step physics
   - No external dependencies
   ======================================================================== */
(function() {
  'use strict';

  // ==================== CONFIG ====================
  var CFG = {
    player: {
      lerpSpeed: 14,
      maxY: 0.80,            // 飛船 Y 軸上限
      minY: 0.40,            // 飛船 Y 軸下限（防出頂）
      shield: 100,
      fireRate: 160,         // ms
      bulletSpeed: 920,
      shieldRegen: 8,        // 擊殺敵人恢復
    },
    wormhole: {
      lifetime: 8000,        // ms
      entryRadius: 36,
      exitRadius: 36,
      dragThreshold: 38,     // px
      transitMs: 220,        // 子彈穿越時間
      speedRetention: 0.82,
    },
    enemy: {
      hp: 3,
      maxCount: 5,
      spawnInterval: 2400,
      fireInterval: 1500,
      bulletSpeed: 380,
      moveSpeed: 90,
      score: 100,
    },
    bullet: {
      maxPlayer: 60,
      maxEnemy: 50,
    },
    damage: {
      enemyBullet: 10,
      ramming: 30,
    },
  };

  // ==================== STATE ====================
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  var state = {
    phase: 'TITLE',     // TITLE | PLAY | GAMEOVER
    t: 0,               // elapsed ms
    score: 0,
    bestScore: 0,
    combo: 0,
    comboTimer: 0,
    shake: 0,

    player: { x: 0, y: 0, tx: 0, ty: 0, shield: CFG.player.shield, lastFire: 0, alive: true, hitFlash: 0, lastHit: 0 },
    enemies: [],
    playerBullets: [],
    enemyBullets: [],
    particles: [],
    explosions: [],
    texts: [],           // floating score texts

    wormhole: null,     // { entry, exit, created, expires }

    pointers: new Map(),
    lastEnemySpawn: 0,
    keys: {},

    paused: false,
  };

  // ==================== RESIZE ====================
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (state.phase === 'TITLE') {
      state.player.x = W / 2;
      state.player.y = H * 0.85;
      state.player.tx = state.player.x;
      state.player.ty = state.player.y;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // ==================== INPUT ====================
  function reassignRoles() {
    var list = Array.from(state.pointers.values());
    list.sort(function(a, b) { return a.startTime - b.startTime; });
    list.forEach(function(p) { p.role = null; });
    if (list[0]) list[0].role = 'ship';
    if (list[1]) list[1].role = 'wormhole';
  }

  canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

    if (state.phase === 'TITLE') {
      startGame();
      return;
    }
    if (state.phase === 'GAMEOVER') {
      // delay slightly to allow explosion animation
      if (state.t - state.player.lastHit > 1500) restart();
      return;
    }

    var p = {
      id: e.pointerId,
      x: e.clientX, y: e.clientY,
      startX: e.clientX, startY: e.clientY,
      startTime: performance.now(),
      role: null,
    };
    state.pointers.set(e.pointerId, p);
    reassignRoles();
  });

  canvas.addEventListener('pointermove', function(e) {
    var p = state.pointers.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX;
    p.y = e.clientY;

    if (p.role === 'ship' && state.phase === 'PLAY') {
      state.player.tx = p.x;
      state.player.ty = clamp(p.y, H * CFG.player.minY, H * CFG.player.maxY);
    } else if (p.role === 'wormhole' && state.phase === 'PLAY') {
      var dist = Math.hypot(p.x - p.startX, p.y - p.startY);
      if (!state.wormhole && dist > CFG.wormhole.dragThreshold) {
        state.wormhole = {
          entry: { x: p.startX, y: p.startY },
          exit: { x: p.x, y: p.y },
          created: state.t,
          expires: state.t + CFG.wormhole.lifetime,
        };
      } else if (state.wormhole) {
        state.wormhole.exit = { x: p.x, y: p.y };
      }
    }
  });

  function endPointer(e) {
    state.pointers.delete(e.pointerId);
    reassignRoles();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);

  // Keyboard
  window.addEventListener('keydown', function(e) {
    state.keys[e.key.toLowerCase()] = true;
    if (e.key === ' ') {
      e.preventDefault();
      if (state.phase === 'TITLE') startGame();
      else if (state.phase === 'GAMEOVER') restart();
    }
    if (e.key.toLowerCase() === 'r' && state.phase === 'GAMEOVER') restart();
    if (e.key === 'p' || e.key === 'Escape') {
      if (state.phase === 'PLAY') state.paused = !state.paused;
    }
  });
  window.addEventListener('keyup', function(e) { state.keys[e.key.toLowerCase()] = false; });

  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  // Prevent page scroll on touch
  document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

  // ==================== UTILS ====================
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // ==================== ENTITIES ====================
  function spawnBullet(x, y, vx, vy, isPlayer) {
    var list = isPlayer ? state.playerBullets : state.enemyBullets;
    var cap = isPlayer ? CFG.bullet.maxPlayer : CFG.bullet.maxEnemy;
    if (list.length >= cap) list.shift();
    list.push({ x: x, y: y, vx: vx, vy: vy, age: 0, dead: false, isPlayer: !!isPlayer });
  }

  function spawnEnemy() {
    if (state.enemies.length >= CFG.enemy.maxCount) return;
    state.enemies.push({
      x: 60 + Math.random() * (W - 120),
      y: 70 + Math.random() * 80,
      vx: CFG.enemy.moveSpeed * (Math.random() > 0.5 ? 1 : -1),
      hp: CFG.enemy.hp,
      lastFire: state.t + Math.random() * 500,
      dead: false,
      flash: 0,
      phase: Math.random() * Math.PI * 2,
    });
  }

  function spawnExplosion(x, y, color, count) {
    count = count || 12;
    for (var i = 0; i < count; i++) {
      var a = (Math.PI * 2 / count) * i + Math.random() * 0.6;
      var s = 140 + Math.random() * 180;
      state.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.5 + Math.random() * 0.5, maxLife: 1,
        color: color, size: 2 + Math.random() * 2.5,
        dead: false,
      });
    }
    state.explosions.push({ x: x, y: y, r: 0, maxR: 60 + count, life: 0.45, maxLife: 0.45, color: color });
  }

  function spawnText(x, y, text, color) {
    state.texts.push({ x: x, y: y, text: text, color: color || '#f39c12', life: 1.2, maxLife: 1.2, vy: -50 });
  }

  function spawnTrail(x, y, color, size) {
    state.particles.push({
      x: x + (Math.random() - 0.5) * 3,
      y: y + (Math.random() - 0.5) * 3,
      vx: 0, vy: 0,
      life: 0.25, maxLife: 0.25,
      color: color, size: size || 3,
      dead: false,
    });
  }

  // ==================== UPDATE ====================
  function update(dt) {
    state.t += dt * 1000;
    state.shake = Math.max(0, state.shake - dt * 2.5);

    if (state.phase !== 'PLAY' || state.paused) return;

    // Combo decay
    if (state.combo > 0) {
      state.comboTimer -= dt;
      if (state.comboTimer <= 0) state.combo = 0;
    }

    // Player movement (touch)
    var pointers = Array.from(state.pointers.values());
    var shipPtr = pointers.find(function(p) { return p.role === 'ship'; });
    if (shipPtr) {
      state.player.tx = shipPtr.x;
      state.player.ty = clamp(shipPtr.y, H * CFG.player.minY, H * CFG.player.maxY);
    } else {
      // Keyboard fallback
      var k = state.keys;
      var sp = 480 * dt;
      if (k['arrowleft'] || k['a']) state.player.tx = Math.max(40, state.player.x - sp);
      else if (k['arrowright'] || k['d']) state.player.tx = Math.min(W - 40, state.player.x + sp);
      if (k['arrowup'] || k['w']) state.player.ty = Math.max(H * CFG.player.minY, state.player.y - sp);
      else if (k['arrowdown'] || k['s']) state.player.ty = Math.min(H * CFG.player.maxY, state.player.y + sp);
    }

    // Lerp
    var t = Math.min(1, dt * CFG.player.lerpSpeed);
    state.player.x += (state.player.tx - state.player.x) * t;
    state.player.y += (state.player.ty - state.player.y) * t;

    if (state.player.hitFlash > 0) state.player.hitFlash = Math.max(0, state.player.hitFlash - dt * 3);

    // Auto-fire (dual shot)
    if (state.t - state.player.lastFire >= CFG.player.fireRate) {
      state.player.lastFire = state.t;
      spawnBullet(state.player.x - 11, state.player.y - 18, 0, -CFG.player.bulletSpeed, true);
      spawnBullet(state.player.x + 11, state.player.y - 18, 0, -CFG.player.bulletSpeed, true);
    }

    // Spawn enemies
    if (state.t - state.lastEnemySpawn > CFG.enemy.spawnInterval) {
      spawnEnemy();
      state.lastEnemySpawn = state.t;
    }

    // Update enemies
    state.enemies.forEach(function(e) {
      e.x += e.vx * dt;
      e.phase += dt * 2.5;
      if (e.x < 36 || e.x > W - 36) e.vx *= -1;
      if (e.flash > 0) e.flash = Math.max(0, e.flash - dt * 5);

      if (state.t - e.lastFire > CFG.enemy.fireInterval) {
        e.lastFire = state.t;
        var dx = state.player.x - e.x;
        var dy = state.player.y - e.y;
        var d = Math.hypot(dx, dy) || 1;
        spawnBullet(e.x, e.y + 18, dx / d * CFG.enemy.bulletSpeed, dy / d * CFG.enemy.bulletSpeed, false);
      }
    });

    // Update bullets (with wormhole logic)
    function applyWormhole(b) {
      var w = state.wormhole;
      if (!w || state.t > w.expires) return false;

      var dEntry = Math.hypot(b.x - w.entry.x, b.y - w.entry.y);
      if (dEntry < CFG.wormhole.entryRadius && !b._wh) {
        b._wh = true;
        b._whT = state.t;
        b.x = w.entry.x; b.y = w.entry.y;
        // Capture direction at entry (for re-emit on next wormhole)
        return true;
      }
      if (b._wh) {
        var tt = Math.min(1, (state.t - b._whT) / CFG.wormhole.transitMs);
        b.x = w.entry.x + (w.exit.x - w.entry.x) * tt;
        b.y = w.entry.y + (w.exit.y - w.entry.y) * tt;
        if (tt >= 1) {
          var ex = w.exit.x - w.entry.x;
          var ey = w.exit.y - w.entry.y;
          var ed = Math.hypot(ex, ey) || 1;
          var inSpeed = Math.hypot(b.vx, b.vy) || CFG.player.bulletSpeed;
          // Exit direction = entry-to-exit vector (intuitive: drawing A→B means bullet goes A→B)
          b.vx = (ex / ed) * inSpeed * CFG.wormhole.speedRetention;
          b.vy = (ey / ed) * inSpeed * CFG.wormhole.speedRetention;
          b.x = w.exit.x; b.y = w.exit.y;
          b._wh = false;
          spawnExplosion(b.x, b.y, '#9b59b6', 5);
        }
        return true;
      }
      return false;
    }

    state.playerBullets.forEach(function(b) {
      b.age += dt;
      if (applyWormhole(b)) return;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) b.dead = true;
      if (b.age > 0.04 && Math.random() > 0.5) spawnTrail(b.x, b.y, '#00f5ff');
    });

    state.enemyBullets.forEach(function(b) {
      b.age += dt;
      if (applyWormhole(b)) return;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) b.dead = true;
      if (b.age > 0.04 && Math.random() > 0.5) spawnTrail(b.x, b.y, '#ff4757');
    });

    // Collisions
    state.playerBullets.forEach(function(b) {
      if (b.dead) return;
      for (var i = 0; i < state.enemies.length; i++) {
        var e = state.enemies[i];
        if (e.dead) continue;
        if (Math.abs(b.x - e.x) < 26 && Math.abs(b.y - e.y) < 26) {
          b.dead = true;
          e.hp -= 1;
          e.flash = 0.15;
          state.shake = Math.max(state.shake, 0.08);
          spawnExplosion(b.x, b.y, '#00f5ff', 4);
          if (e.hp <= 0) {
            e.dead = true;
            spawnExplosion(e.x, e.y, '#ff4757', 22);
            spawnExplosion(e.x - 10, e.y - 10, '#f39c12', 8);
            state.shake = 0.35;
            addScore(CFG.enemy.score);
            state.player.shield = Math.min(CFG.player.shield, state.player.shield + CFG.player.shieldRegen);
            spawnText(e.x, e.y - 20, '+' + (CFG.enemy.score * Math.max(1, state.combo)), '#f39c12');
          } else {
            spawnText(b.x, b.y - 12, '-1', '#ffffff');
          }
          break;
        }
      }
    });

    state.enemyBullets.forEach(function(b) {
      if (b.dead) return;
      var dx = b.x - state.player.x;
      var dy = b.y - state.player.y;
      if (Math.hypot(dx, dy) < 22) {
        b.dead = true;
        damagePlayer(CFG.damage.enemyBullet);
      }
    });

    state.enemies.forEach(function(e) {
      if (e.dead) return;
      var dx = e.x - state.player.x;
      var dy = e.y - state.player.y;
      if (Math.hypot(dx, dy) < 38) {
        e.dead = true;
        spawnExplosion(e.x, e.y, '#f39c12', 14);
        damagePlayer(CFG.damage.ramming);
      }
    });

    // Prune
    state.playerBullets = state.playerBullets.filter(function(b) { return !b.dead; });
    state.enemyBullets = state.enemyBullets.filter(function(b) { return !b.dead; });
    state.enemies = state.enemies.filter(function(e) { return !e.dead; });

    // Particles
    state.particles.forEach(function(p) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      p.vx *= 0.94; p.vy *= 0.94;
      if (p.life <= 0) p.dead = true;
    });
    state.particles = state.particles.filter(function(p) { return !p.dead; });

    // Explosions
    state.explosions.forEach(function(x) {
      x.life -= dt;
      x.r = (1 - x.life / x.maxLife) * x.maxR;
      if (x.life <= 0) x.dead = true;
    });
    state.explosions = state.explosions.filter(function(x) { return !x.dead; });

    // Floating texts
    state.texts.forEach(function(t) {
      t.y += t.vy * dt;
      t.life -= dt;
      if (t.life <= 0) t.dead = true;
    });
    state.texts = state.texts.filter(function(t) { return !t.dead; });

    // Wormhole ambient particles
    if (state.wormhole && Math.random() > 0.4) {
      var w = state.wormhole;
      var isEntry = Math.random() > 0.5;
      var c = isEntry ? w.entry : w.exit;
      var col = isEntry ? '#4a9eff' : '#ff6b35';
      var a = Math.random() * Math.PI * 2;
      var r = 28;
      state.particles.push({
        x: c.x + Math.cos(a) * r,
        y: c.y + Math.sin(a) * r,
        vx: -Math.cos(a) * 40,
        vy: -Math.sin(a) * 40,
        life: 0.7, maxLife: 0.7,
        color: col, size: 2, dead: false,
      });
    }

    // Wormhole expire
    if (state.wormhole && state.t > state.wormhole.expires) {
      spawnExplosion(state.wormhole.entry.x, state.wormhole.entry.y, '#4a9eff', 10);
      spawnExplosion(state.wormhole.exit.x, state.wormhole.exit.y, '#ff6b35', 10);
      state.wormhole = null;
    }

    // Update HUD
    document.getElementById('score').textContent = state.score.toLocaleString();
    document.getElementById('shield').style.width = Math.max(0, state.player.shield) + '%';
    var comboEl = document.getElementById('combo');
    comboEl.textContent = state.combo > 1 ? '×' + state.combo + ' COMBO' : '';
  }

  function damagePlayer(amount) {
    state.player.shield -= amount;
    state.player.hitFlash = 0.4;
    state.player.lastHit = state.t;
    state.shake = Math.max(state.shake, 0.25);
    spawnExplosion(state.player.x, state.player.y, '#00f5ff', 8);
    if (state.player.shield <= 0) {
      state.player.shield = 0;
      gameOver();
    }
  }

  function addScore(base) {
    state.combo += 1;
    state.comboTimer = 2.5;
    var gained = base * Math.max(1, state.combo);
    state.score += gained;
  }

  // ==================== RENDER ====================
  function render() {
    ctx.save();

    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * 14 * state.shake, (Math.random() - 0.5) * 14 * state.shake);
    }

    // Clear
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(-50, -50, W + 100, H + 100);

    drawBackground();

    if (state.phase === 'TITLE') {
      drawDemoShip();
    } else {
      drawWormhole();
      drawPlayerBullets();
      drawEnemies();
      drawEnemyBullets();
      drawPlayer();
      drawExplosions();
      drawParticles();
      drawAimGuide();
      drawFloatingTexts();
      drawWormholeHint();
      if (state.paused) drawPausedOverlay();
    }

    ctx.restore();
  }

  function drawBackground() {
    var step = 64;
    var off = (state.t * 0.04) % step;
    ctx.strokeStyle = 'rgba(0, 245, 255, 0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = -step + off; x < W + step; x += step) {
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (var y = -step; y < H + step; y += step) {
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    // Stars
    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < 40; i++) {
      var sx = (i * 137 + state.t * 0.012) % W;
      var sy = (i * 73 + state.t * 0.005) % H;
      var tw = 0.3 + 0.4 * Math.sin(state.t * 0.001 + i);
      ctx.globalAlpha = tw * 0.7;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;

    // Vignette
    var vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.3, W/2, H/2, Math.max(W,H) * 0.7);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawPlayer() {
    var p = state.player;
    if (!p.alive) return;
    ctx.save();
    ctx.translate(p.x, p.y);

    // Engine flame
    var flame = 14 + Math.sin(state.t * 0.05) * 4;
    var grad = ctx.createRadialGradient(0, 22, 0, 0, 22, 28);
    grad.addColorStop(0, 'rgba(255, 107, 53, ' + (0.6 + Math.sin(state.t * 0.08) * 0.2) + ')');
    grad.addColorStop(1, 'rgba(255, 107, 53, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(-22, 18, 44, 32);

    // Ship body (hex)
    var col = p.hitFlash > 0 ? '#ff4757' : '#00f5ff';
    ctx.fillStyle = '#1a1a2e';
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 16;
    ctx.shadowColor = col;
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = (Math.PI / 3) * i - Math.PI / 2;
      var x = Math.cos(a) * 22;
      var y = Math.sin(a) * 22;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Y plasma arms
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(-14, 17);
    ctx.moveTo(0, -8);
    ctx.lineTo(14, 17);
    ctx.stroke();

    // Cockpit
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawDemoShip() {
    var bob = Math.sin(state.t * 0.002) * 12;
    var wobble = Math.sin(state.t * 0.001) * 0.05;
    ctx.save();
    ctx.translate(W / 2, H * 0.42 + bob);
    ctx.rotate(wobble);
    ctx.scale(1.6, 1.6);

    var col = '#00f5ff';
    ctx.fillStyle = '#1a1a2e';
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 24;
    ctx.shadowColor = col;
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = (Math.PI / 3) * i - Math.PI / 2;
      var x = Math.cos(a) * 22;
      var y = Math.sin(a) * 22;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(-14, 17);
    ctx.moveTo(0, -8);
    ctx.lineTo(14, 17);
    ctx.stroke();

    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawPlayerBullets() {
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#00f5ff';
    state.playerBullets.forEach(function(b) {
      ctx.fillStyle = '#00f5ff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function drawEnemyBullets() {
    ctx.shadowBlur = 10;
    state.enemyBullets.forEach(function(b) {
      ctx.fillStyle = '#ff4757';
      ctx.shadowColor = '#ff4757';
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.age * 5);
      ctx.beginPath();
      ctx.moveTo(0, -7);
      ctx.lineTo(7, 0);
      ctx.lineTo(0, 7);
      ctx.lineTo(-7, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });
    ctx.shadowBlur = 0;
  }

  function drawEnemies() {
    state.enemies.forEach(function(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      var bob = Math.sin(e.phase) * 4;
      ctx.translate(0, bob);

      var col = e.flash > 0 ? '#ffffff' : '#ff4757';
      ctx.fillStyle = '#2a1a2e';
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 14;
      ctx.shadowColor = col;
      ctx.beginPath();
      for (var i = 0; i < 6; i++) {
        var a = (Math.PI / 3) * i;
        var x = Math.cos(a) * 24;
        var y = Math.sin(a) * 24;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Eye
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(0, 0, 5 + Math.sin(e.phase * 4) * 2, 0, Math.PI * 2);
      ctx.fill();

      // HP bar
      ctx.shadowBlur = 0;
      var hpW = 40;
      var hpRatio = e.hp / CFG.enemy.hp;
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(-hpW/2, -38, hpW, 3);
      ctx.fillStyle = '#ff4757';
      ctx.fillRect(-hpW/2, -38, hpW * hpRatio, 3);

      ctx.restore();
    });
  }

  function drawWormhole() {
    var w = state.wormhole;
    if (!w) return;

    var remaining = (w.expires - state.t) / CFG.wormhole.lifetime;
    var fadeIn = Math.min(1, (state.t - w.created) / 200);
    var alpha = Math.min(fadeIn, Math.min(1, remaining * 1.5));

    ctx.save();
    ctx.globalAlpha = alpha;

    var dx = w.exit.x - w.entry.x;
    var dy = w.exit.y - w.entry.y;
    var dist = Math.hypot(dx, dy);
    var angle = Math.atan2(dy, dx);

    // Connection tube
    ctx.save();
    ctx.translate(w.entry.x, w.entry.y);
    ctx.rotate(angle);
    var grad = ctx.createLinearGradient(0, 0, dist, 0);
    grad.addColorStop(0, '#4a9eff');
    grad.addColorStop(0.5, '#9b59b6');
    grad.addColorStop(1, '#ff6b35');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#9b59b6';
    ctx.setLineDash([12, 10]);
    ctx.lineDashOffset = -state.t / 40;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(dist, 0);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Portals
    drawPortal(w.entry.x, w.entry.y, '#4a9eff', 1);
    drawPortal(w.exit.x, w.exit.y, '#ff6b35', -1);

    // Expiring warning
    if (remaining < 0.3) {
      ctx.globalAlpha = 0.3 + Math.sin(state.t * 0.02) * 0.3;
      ctx.strokeStyle = '#ff4757';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(w.entry.x, w.entry.y, CFG.wormhole.entryRadius + 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w.exit.x, w.exit.y, CFG.wormhole.exitRadius + 10, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawPortal(x, y, color, dir) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(state.t * 0.001 * dir);

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 18;
    ctx.shadowColor = color;

    for (var i = 0; i < 3; i++) {
      ctx.globalAlpha = (1 - i * 0.25) * 0.95;
      ctx.beginPath();
      var start = (state.t * 0.003 * dir + i * 0.7) % (Math.PI * 2);
      ctx.arc(0, 0, 16 + i * 6, start, start + Math.PI * 1.5);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawExplosions() {
    state.explosions.forEach(function(x) {
      var a = x.life / x.maxLife;
      ctx.globalAlpha = a;
      ctx.strokeStyle = x.color;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 16;
      ctx.shadowColor = x.color;
      ctx.beginPath();
      ctx.arc(x.x, x.y, x.r, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    state.particles.forEach(function(p) {
      var a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawFloatingTexts() {
    state.texts.forEach(function(t) {
      var a = Math.max(0, t.life / t.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = t.color;
      ctx.font = 'bold 16px Orbitron, monospace';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 8;
      ctx.shadowColor = t.color;
      ctx.fillText(t.text, t.x, t.y);
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawAimGuide() {
    var nearest = null, nd = Infinity;
    state.enemies.forEach(function(e) {
      if (e.dead) return;
      var d = Math.hypot(e.x - state.player.x, e.y - state.player.y);
      if (d < nd) { nd = d; nearest = e; }
    });
    if (!nearest) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 245, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.lineDashOffset = -state.t * 0.05;
    ctx.beginPath();
    ctx.moveTo(state.player.x, state.player.y);
    ctx.lineTo(nearest.x, nearest.y);
    ctx.stroke();
    ctx.restore();
  }

  function drawWormholeHint() {
    if (state.wormhole) return;
    var hasWormholePtr = Array.from(state.pointers.values()).some(function(p) { return p.role === 'wormhole'; });
    if (hasWormholePtr) return;
    var elapsed = state.t - (state._hintShown || 0);
    if (elapsed < 6000) return;

    ctx.save();
    var pulse = 0.4 + Math.sin(state.t * 0.003) * 0.2;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ff6b35';
    ctx.font = '14px Rajdhani, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ 用第二指拖動生成蟲洞', W / 2, H * 0.18);
    ctx.restore();
  }

  function drawPausedOverlay() {
    ctx.save();
    ctx.fillStyle = 'rgba(10,10,18,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00f5ff';
    ctx.font = 'bold 48px Orbitron, monospace';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#00f5ff';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = '16px Rajdhani, sans-serif';
    ctx.fillText('按 P / Esc 繼續', W / 2, H / 2 + 40);
    ctx.restore();
  }

  // ==================== STATE TRANSITIONS ====================
  function startGame() {
    state.phase = 'PLAY';
    state.paused = false;
    state.t = 0;
    state.score = 0;
    state.combo = 0;
    state.comboTimer = 0;
    state.enemies = [];
    state.playerBullets = [];
    state.enemyBullets = [];
    state.particles = [];
    state.explosions = [];
    state.texts = [];
    state.wormhole = null;
    state.pointers.clear();
    state.player.shield = CFG.player.shield;
    state.player.alive = true;
    state.player.hitFlash = 0;
    state.player.x = W / 2;
    state.player.y = H * 0.85;
    state.player.tx = state.player.x;
    state.player.ty = state.player.y;
    state.lastEnemySpawn = 0;
    state._hintShown = 0;
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('game-over').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
  }

  function gameOver() {
    state.phase = 'GAMEOVER';
    state.player.alive = false;
    state.bestScore = Math.max(state.bestScore, state.score);
    spawnExplosion(state.player.x, state.player.y, '#00f5ff', 36);
    spawnExplosion(state.player.x - 20, state.player.y + 10, '#ff4757', 18);
    document.getElementById('hud').classList.add('hidden');
    setTimeout(function() {
      document.getElementById('final-score').textContent = state.score.toLocaleString();
      document.getElementById('game-over').classList.remove('hidden');
    }, 1500);
  }

  function restart() {
    document.getElementById('game-over').classList.add('hidden');
    startGame();
  }

  // ==================== MAIN LOOP ====================
  var lastTime = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Visibility pause
  document.addEventListener('visibilitychange', function() {
    if (document.hidden && state.phase === 'PLAY') state.paused = true;
  });

})();
</script>
