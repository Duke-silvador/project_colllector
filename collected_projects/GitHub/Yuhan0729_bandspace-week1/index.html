<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BandSpace</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

  <h1>BandSpace</h1>

  <p>
    One room. One calendar. No double bookings.
  </p>

  <button id="bookButton">
   Book rehearsal
  </button>
  <div class="schedule" id="schedule">

  <h2>Upcoming rehearsals</h2>

  <div class="booking-card">
    <h3>The Echoes</h3>
    <p>October 6 · 14:00 - 16:00</p>
    <p>Booked by Alex</p>
  </div>

  <div class="booking-card">
    <h3>Night Shift</h3>
    <p>October 6 · 17:00 - 19:00</p>
    <p>Booked by Mia</p>
  </div>

</div>
<div id="bookingForm" class="booking-form">

  <h2>Book a rehearsal</h2>

  <input id="nameInput" type="text" placeholder="Your name">

  <input id="bandInput" type="text" placeholder="Band name">

  <input id="dateInput" type="date">

  <input id="startInput" type="time">

  <input id="endInput" type="time">
  <button id="submitBooking">
    Confirm booking
  </button>

</div>

  </div>

  <script src="script.js"></script>
</body>
</html>
