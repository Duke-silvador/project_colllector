    return;
  }
  const list = CLOUD ? CLASS.map(r=>[r.email, r.profile]) : Object.entries(S.profiles);
  v.innerHTML = `<div class="topbar"><button class="iconbtn" id="tback" type="button" aria-label="${tr('Volver')}">${ico('back')}</button><h1 class="outline">${tr('Panel del docente')}</h1></div>
    ${CLOUD ? `<p class="note" style="margin-bottom:14px">${tr('Progreso de todo el alumnado que ha entrado con su cuenta del centro. Se guarda en la hoja de cálculo de tu Drive')}${ME&&ME.sheetUrl?` (<a href="${esc(ME.sheetUrl)}" target="_blank" rel="noopener" style="color:var(--gold)">${tr('abrir la hoja')}</a>)`:''}.</p>
      <div style="margin-bottom:14px"><button class="btn dark small" type="button" id="t-refresh">${tr('Actualizar')}</button></div>`
    : `<p class="note" style="margin-bottom:14px">${tr('Progreso del alumnado que ha jugado en este dispositivo. Los datos se guardan solo en este navegador.')}</p>`}
    ${list.length ? `<div class="table-wrap panel"><table>
      <thead><tr><th>${tr('Alumno/a')}</th><th>${tr('Nivel')}</th><th>XP</th>${withC.map(t=>`<th title="${esc(t.title)}">${tr('Tema')} ${t.n}</th>`).join('')}<th>${tr('Insignias')}</th><th></th></tr></thead>
      <tbody>${list.map(([id,p])=>`<tr><td><span style="display:inline-flex;align-items:center;gap:8px"><span style="width:32px;display:inline-block">${avatarSVG(p.avatar)}</span><span>${esc(p.name)}${CLOUD?`<br><small style="color:var(--ink-soft)">${esc(id)}</small>`:''}</span></span></td><td class="num-c">${levelOf(p.xp).n}</td><td class="num-c">${p.xp}</td>
        ${withC.map(t=>{ const det=stagesOf(t).map((w,k)=>{ const r=p.worlds[w.id]; return `${w.boss?tr('Jefe'):'M'+(k+1)}: ${r?r.stars+'★ ('+r.plays+'×, '+(r.best||0)+'%)':'—'}`; }).join(' · ');
          return `<td class="num-c" title="${esc(det)}">★ ${temaStars(p,t)}/${temaMax(t)}${temaBeaten(p,t)?' ✓':''}</td>`; }).join('')}
        <td class="num-c">${p.badges.length}/${allBadges().length}</td>
        <td><button class="btn dark small" type="button" data-del="${id}">${tr(armedDelete===id?'¿Seguro? Borrar':'Borrar')}</button></td></tr>`).join('')}</tbody>
    </table></div><p class="note" style="margin-top:8px">${tr('Pasa el ratón sobre las estrellas de un tema para ver el detalle por misión (estrellas, veces jugada y mejor % de aciertos a la primera). ✓ = jefe final vencido.')}</p>` : `<p class="note">${tr(CLOUD?'Todavía no hay alumnado registrado.':'Todavía no hay alumnado registrado en este dispositivo.')}</p>`}
    <div class="teacher-tools">
      ${list.length && TEMAS.some(hasContent) ? evalHTML(list) : ''}
      <h2 class="outline-sm" style="color:var(--gold)">${tr('Curso')}: ${esc(nombreCurso(CURSO_ACTIVO))}</h2>
      <div class="tema-toggles panel">
        ${CLOUD ? `<p class="note" style="margin:0">${tr('Esta instalación de Google Classroom es solo para este curso. Para otro curso, instala su propia versión.')}</p>`
        : `<p class="note" style="margin:0">${tr('Enlace de este curso para el alumnado:')}</p>
          <div class="row"><code class="curso-link" id="curso-link">${WEB_URL}?curso=${CURSO_ACTIVO.id}</code><button class="btn dark small" type="button" id="curso-copy">${tr('Copiar enlace')}</button></div>
          ${CURSOS.length>1 ? `<label class="switch" for="curso-sel-t"><span>${tr('Cambiar de curso')}</span><select id="curso-sel-t" style="font:inherit;padding:8px 10px;border-radius:12px;border:3px solid var(--edge);background:var(--night);color:#fff">${CURSOS.map(c=>`<option value="${c.id}" ${c.id===CURSO_ACTIVO.id?'selected':''}>${esc(nombreCurso(c))}</option>`).join('')}</select></label>` : ''}
          <p class="note" style="margin:0">${tr('Cada curso guarda su progreso por separado.')}</p>`}
      </div>
      <h2 class="outline-sm" style="color:var(--gold)">${tr('Fichas para imprimir')}</h2>
      <div class="tema-toggles panel"><p class="note" style="margin:0">${tr('Esquemas en papel para completar a mano (A4, una ficha por página), con recuadro de palabras, espacio para dibujar y autoevaluación.')}</p>
        <div class="row">${TEMAS.filter(hasContent).map(t=>`<a class="btn dark small" href="${fichaURL(t.n)}" target="_blank" rel="noopener">${tr('Tema')} ${t.n}</a>`).join('')}
        <a class="btn gold small" href="${fichaURL('sol')}" target="_blank" rel="noopener">${tr('Solucionario')}</a></div></div>
      <h2 class="outline-sm" style="color:var(--gold)">${tr('Temas del curso')}</h2>
      <div class="tema-toggles panel">${TEMAS.map((t,i)=>`<label class="switch"><span>${tr('Tema')} ${t.n}: ${esc(t.title)} <small style="color:var(--ink-soft);font-weight:400">${hasContent(t)?tr('({n} misiones + jefe)',{n:t.missions.length}):tr('(sin contenidos todavía)')}</small></span>
          <span style="display:inline-flex;gap:8px;align-items:center">${i===0?`<small style="color:var(--ink-soft)">${tr('Siempre abierto')}</small>`:`<input type="checkbox" data-open="${t.id}" ${S.open[t.id]?'checked':''} ${hasContent(t)?'':'disabled'}> ${tr('Abrir ya')}`}</span></label>`).join('')}</div>
      <p class="note">${tr('Normalmente cada tema se abre cuando el alumno vence al jefe del tema anterior. Marca «Abrir ya» para abrir un tema a toda la clase aunque no hayan terminado el anterior.')}</p>
      ${HAS_EN ? `<h2 class="outline-sm" style="color:var(--gold)">${tr('Idioma')}</h2>
      <div class="tema-toggles panel">
        <label class="switch" for="lang-sel"><span>${tr(CLOUD?'Idioma de la clase':'Idioma del juego')}</span>
          <select id="lang-sel" style="font:inherit;padding:8px 10px;border-radius:12px;border:3px solid var(--edge);background:var(--night);color:#fff">
            <option value="es" ${LANG==='es'?'selected':''}>Español</option><option value="en" ${LANG==='en'?'selected':''}>English</option>
          </select></label>
        <p class="note" style="margin:0">${tr(CLOUD?'Se aplica a todo el alumnado. Cada alumno puede cambiarlo en su dispositivo con el botón ES/EN.':'El alumnado también puede cambiarlo con el botón ES/EN. El progreso y la evaluación son los mismos en los dos idiomas.')}</p>
      </div>` : ''}
      <h2 class="outline-sm" style="color:var(--gold)">${tr('Voz de lectura')}</h2>
      <div class="tema-toggles panel">
        <label class="switch" for="voice-sel"><span>${tr('Voz')}</span>
          <select id="voice-sel" style="font:inherit;padding:8px 10px;border-radius:12px;border:3px solid var(--edge);background:var(--night);color:#fff;max-width:100%">
            <option value="">${tr('Automática (la más natural)')}</option>
            ${VOICES.slice().sort((x,y)=>voiceScore(y)-voiceScore(x)).map(v=>`<option value="${esc(v.name)}" ${S[voiceKey()]===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}
          </select></label>
        <label class="switch" for="voice-rate"><span>${tr('Velocidad')}</span>
          <select id="voice-rate" style="font:inherit;padding:8px 10px;border-radius:12px;border:3px solid var(--edge);background:var(--night);color:#fff">
            ${[[0.8,'Despacio'],[0.95,'Normal'],[1.1,'Rápida']].map(([r,l])=>`<option value="${r}" ${(S.voiceRate||0.95)==r?'selected':''}>${tr(l)}</option>`).join('')}
          </select></label>
        <div><button class="btn blue small" type="button" id="voice-test">${ico('sound')} ${tr('Probar voz')}</button></div>
      </div>
      <p class="note">${tr(VOICES.length ? 'Las voces dependen del dispositivo y del navegador. Las más naturales suelen llamarse «Natural», «Online», «Mejorada» o «Google».' : 'Este navegador todavía no ha cargado sus voces. Pulsa «Probar voz» y vuelve a abrir este panel.')}</p>
      <label class="switch"><input type="checkbox" id="free-mode" ${S.free?'checked':''}> ${tr('Modo libre: todos los temas y misiones desbloqueados')}</label>
      ${TEMAS.some(t=>t.minijuego) ? `<label class="switch"><input type="checkbox" id="mini-mode" ${miniOn()?'checked':''}> ${tr('Minijuegos de premio: se desbloquean al vencer al jefe final de un tema')}</label>` : ''}
      <p class="note">${tr('Estrellas: 3 con un 85 % de aciertos a la primera, 2 con un 60 % y 1 al terminar. Los contenidos se editan en el archivo <b>contenidos.js</b>.')} <small>(cursos/${CURSO_ACTIVO.id}/)</small></p>
      <h2 class="outline-sm" style="color:var(--gold)">${tr('Autoría y licencia')}</h2>
      <p class="note">${licenciaHTML()}</p>
    </div>`;
  v.querySelector('#tback').onclick = ()=> P() ? (CT ? goMap() : goCourse()) : renderWelcome();
  if(HAS_EN) v.querySelector('#lang-sel').onchange = e=>{ if(CLOUD){ S.classLang=e.target.value; cloudSettings(); } setLang(e.target.value); };
  v.querySelector('#voice-sel').onchange = e=>{ S[voiceKey()]=e.target.value||null; save(); speak(tr('¡Hola! Así sonará mi voz.')); };
  v.querySelector('#voice-rate').onchange = e=>{ S.voiceRate=+e.target.value; save(); speak(tr('¡Hola! Así sonará mi voz.')); };
  v.querySelector('#voice-test').onclick = ()=>{ speak(tr('¡Hola! Soy Glo. ¿Preparados para explorar la naturaleza?')); };
  const mm=v.querySelector('#mini-mode'); if(mm) mm.onchange = e=>{ S.mini=e.target.checked; save(); cloudSettings(); toast(tr(S.mini?'Minijuegos activados':'Minijuegos desactivados')); };
  v.querySelector('#free-mode').onchange = e=>{ S.free=e.target.checked; save(); cloudSettings(); toast(tr(S.free?'Modo libre activado':'Modo libre desactivado')); };
  v.querySelectorAll('[data-open]').forEach(c=>c.onchange=()=>{ S.open[c.dataset.open]=c.checked; save(); cloudSettings(); toast(tr(c.checked?'Tema abierto para la clase':'Tema cerrado')); });
  bindEval(v, list);
  const cc=v.querySelector('#curso-copy'); if(cc) cc.onclick=()=>{ const t=v.querySelector('#curso-link').textContent; const ok=()=>toast(tr('Enlace copiado')); try{ navigator.clipboard.writeText(t).then(ok, ()=>fallbackCopy(t, ok)); }catch(e){ fallbackCopy(t, ok); } };
  const ct=v.querySelector('#curso-sel-t'); if(ct) ct.onchange=e=>cambiarCurso(e.target.value);
  const rf=v.querySelector('#t-refresh'); if(rf) rf.onclick=()=>{ CLASS=null; renderTeacher(); };
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;
    if(armedDelete!==id){ armedDelete=id; renderTeacher(); return; }
    armedDelete=null;
    if(CLOUD){
      google.script.run.withSuccessHandler(()=>{ CLASS=CLASS.filter(r=>r.email!==id); if(ME && id===ME.email){ delete S.profiles.me; S.current=null; save(); } toast(tr('Alumno borrado')); renderTeacher(); })
        .withFailureHandler(e=>toast(tr('No se ha podido borrar: ')+(e&&e.message||e))).deleteStudent(id);
      return;
    }
    delete S.profiles[id]; if(S.current===id) S.current=null; save(); renderTeacher();
  });
  show('view-teacher');
}

/* ---------- Inicio ---------- */
applyLang();
if(S.music){ const resume=()=>{ setMusic(true); removeEventListener('pointerdown', resume); }; addEventListener('pointerdown', resume); }
function start(){ if(P()) goCourse(); else renderWelcome(); }
if(CLOUD){
  $('#view-welcome').innerHTML = `<div class="logo" style="padding-top:60px"><div class="mascot-wrap">${mascotSVG('idle')}</div><h1 class="outline">${tr('Cargando tu partida…')}</h1></div>`;
  google.script.run
    .withSuccessHandler(st=>{
      ME = st; const set = st.settings || {};
      S.free = !!set.free; S.open = set.open || {}; S.classLang = set.lang || null; S.mini = set.mini !== false;
      if(!S.langChosen && set.lang && set.lang!==LANG) setLang(set.lang, true);
      S.profiles = {}; S.current = null;
      if(st.profile){ S.profiles.me = st.profile; S.current = 'me'; }
      try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){}
      start();
    })
    .withFailureHandler(e=>{
      const msg = String(e && e.message || e);
      $('#view-welcome').innerHTML = `<div class="logo" style="padding-top:60px"><div class="mascot-wrap">${mascotSVG('oops')}</div><h1 class="outline">${tr('No se ha podido entrar')}</h1>
        <p class="tagline">${msg.includes('NO_EMAIL') ? tr('Entra con tu cuenta de Google del colegio y vuelve a abrir el enlace desde Classroom.') : tr('Comprueba la conexión a internet y vuelve a abrir el enlace.')+' ('+esc(msg)+')'}</p></div>`;
    })
    .getState();
  addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && pushTimer) pushNow(); });
} else start();
</script>
</body>
</html>
