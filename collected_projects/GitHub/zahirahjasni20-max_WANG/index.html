<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 22: Wang dalam Kehidupan - Permainan Kosa Kata</title>
    <style>
        :root {
            --primary-color: #00b074;
            --secondary-color: #ffcc00;
            --bg-color: #f4f9f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Header Banner */
        .header-banner {
            background: #ffffff;
            border: 4px solid var(--secondary-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .unit-badge {
            background-color: #e67e22;
            color: white;
            padding: 5px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .header-banner h1 {
            margin: 0;
            font-size: 24px;
            color: #2c3e50;
        }

        .score-box {
            background-color: #e8f8f5;
            border: 2px solid var(--primary-color);
            padding: 8px 16px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
        }

        .score-box span {
            display: block;
            font-size: 12px;
            color: #7f8c8d;
        }

        .score-box strong {
            font-size: 20px;
            color: var(--primary-color);
        }

        /* Nav Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: white;
            border: 2px solid #ddd;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 4px 8px rgba(0, 176, 116, 0.3);
        }

        /* Section Title */
        .section-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            margin: 0;
            color: #2c3e50;
        }

        .section-header p {
            color: #7f8c8d;
            margin: 5px 0 0 0;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .vocab-card {
            background-color: var(--card-bg);
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .vocab-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .vocab-card .emoji {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .vocab-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #34495e;
            letter-spacing: 0.5px;
        }

        .vocab-card .hint {
            font-size: 11px;
            color: #95a5a6;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .vocab-card .meaning {
            display: none;
            font-size: 14px;
            color: #2c3e50;
            font-weight: 500;
            animation: fadeIn 0.3s;
        }

        .vocab-card.flipped {
            background-color: #eafaf1;
            border-color: var(--primary-color);
        }

        .vocab-card.flipped .emoji,
        .vocab-card.flipped h3,
        .vocab-card.flipped .hint {
            display: none;
        }

        .vocab-card.flipped .meaning {
            display: block;
        }

        .footer-note {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #95a5a6;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Banner -->
        <div class="header-banner">
            <div class="title-section">
                <div>
                    <span class="unit-badge">UNIT 22</span>
                    <h1>Wang dalam Kehidupan</h1>
                </div>
            </div>
            <div class="score-box">
                <span>⭐ JUMLAH SKOR</span>
                <strong id="score">0</strong>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active">📖 Kad Imbasan</button>
            <button class="tab-btn" onclick="alert('Mod Padanan Kata akan datang!')">🧩 Padanan Kata</button>
            <button class="tab-btn" onclick="alert('Mod Teka Gambar akan datang!')">🖼️ Teka Gambar</button>
            <button class="tab-btn" onclick="alert('Mod Isih Ejaan akan datang!')">✏️ Isih Ejaan</button>
        </div>

        <!-- Content Section -->
        <div class="section-header">
            <h2>Terokai Kosa Kata & Maksud</h2>
            <p>Klik pada kad untuk melihat maksudnya!</p>
        </div>

        <!-- Cards Grid -->
        <div class="cards-grid" id="vocabGrid"></div>

        <div class="footer-note">
            Unit 22: Wang dalam Kehidupan (Kosa Kata MS 138-142) • Buku Teks Bahasa Melayu
        </div>
    </div>

    <script>
        const vocabData = [
            { emoji: "🐱", word: "TABUNG", meaning: "tempat menyimpan wang" },
            { emoji: "💵", word: "WANG SAKU", meaning: "wang yang dibawa untuk digunakan apabila diperlukan" },
            { emoji: "🧾", word: "BIL", meaning: "penyata bertulis tentang caj bagi barang yang telah diterima" },
            { emoji: "🌟", word: "HEMAH", meaning: "budi pekerti" },
            { emoji: "🤲", word: "MENDERMAKAN", meaning: "memberikan sesuatu dengan ikhlas" },
            { emoji: "📋", word: "URUSAN", meaning: "hal yang perlu diberi perhatian atau diuruskan" },
            { emoji: "🤝", word: "LAYANAN", meaning: "kata-kata atau perbuatan untuk melayan" },
            { emoji: "🪙", word: "MENYIMPAN", meaning: "menabung" }
        ];

        let score = 0;
        const viewedCards = new Set();

        function renderCards() {
            const grid = document.getElementById('vocabGrid');
            grid.innerHTML = '';

            vocabData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="emoji">${item.emoji}</div>
                    <h3>${item.word}</h3>
                    <div class="hint">Klik untuk lihat maksud 🔄</div>
                    <div class="meaning">${item.meaning}</div>
                `;

                card.addEventListener('click', () => {
                    card.classList.toggle('flipped');
                    
                    // Tambah markah jika kad diterbalikkan buat pertama kali
                    if (card.classList.contains('flipped') && !viewedCards.has(index)) {
                        viewedCards.add(index);
                        score += 10;
                        document.getElementById('score').innerText = score;
                    }
                });

                grid.appendChild(card);
            });
        }

        // Muat turun kad semasa mula
        renderCards();
    </script>
</body>
</html>
