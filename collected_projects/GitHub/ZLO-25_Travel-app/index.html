<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e76f51">
  <meta name="description" content="Ryan 專屬通用旅遊 App：多行程、待辦、訂單、花費與打包，可離線使用">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅遊助手">
  <title>Ryan 旅遊助手</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="lockGate" class="lock-gate" hidden>
    <div class="lock-card">
      <img src="assets/icon-192.png" width="56" height="56" alt="">
      <h1>Ryan 旅遊助手</h1>
      <p>公開頁面已上鎖，輸入密碼後可觀看與修改。</p>
      <form id="lockForm" autocomplete="current-password">
        <label class="sr-only" for="lockPassword">密碼</label>
        <input id="lockPassword" type="password" name="password" placeholder="密碼" required autofocus>
        <button type="submit" class="btn btn-primary btn-block">解鎖</button>
        <p id="lockError" class="lock-error" hidden></p>
      </form>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/icon-192.png" width="28" height="28" alt="">
        <span>旅遊助手</span>
      </div>
      <div class="trip-switch">
        <label class="sr-only" for="tripSelect">切換旅程</label>
        <select id="tripSelect" class="trip-select" aria-label="切換旅程"></select>
      </div>
    </header>

    <main class="main">
      <section class="panel" id="view-overview" data-view="overview"></section>
      <section class="panel" id="view-todos" data-view="todos"></section>
      <section class="panel" id="view-bookings" data-view="bookings"></section>
      <section class="panel" id="view-itinerary" data-view="itinerary"></section>
      <section class="panel" id="view-places" data-view="places"></section>
      <section class="panel" id="view-shopping" data-view="shopping"></section>
      <section class="panel" id="view-packing" data-view="packing"></section>
      <section class="panel" id="view-expenses" data-view="expenses"></section>
      <section class="panel" id="view-notes" data-view="notes"></section>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="主要選單"></nav>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h3 id="modalTitle">編輯</h3>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger btn-sm" id="modalDelete" hidden>刪除</button>
        <button type="button" class="btn btn-ghost btn-sm" id="modalCancel">取消</button>
        <button type="button" class="btn btn-primary btn-sm" id="modalSave">儲存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/auth.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
