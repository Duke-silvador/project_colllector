<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aakarsh B · Resume</title>
<meta name="robots" content="noindex">
<meta name="description" content="Resume of Aakarsh B, brand and visual designer in Bengaluru.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<!-- Built from js/data.js, so it stays in sync with the site. To use your own PDF instead, add resume.pdf and point the sidebar link at it. -->
<style>
:root{--ink:#0e1324;--mute:#555d76;--line:#d9dde8;--a1:#3b5bff}
*{box-sizing:border-box}
body{margin:0;background:#eef0f5;color:var(--ink);font:14.5px/1.5 'Instrument Sans',system-ui,sans-serif}
.page{max-width:820px;margin:32px auto;background:#fff;padding:56px 60px;border-radius:6px;box-shadow:0 10px 40px rgba(14,19,36,.12)}
h1{font:800 44px/1 'Bricolage Grotesque';letter-spacing:-.02em;margin:0}
.role{font-size:17px;color:var(--mute);margin:8px 0 14px}
.contact{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}.contact a{color:inherit}
h2{font:600 13px 'Instrument Sans';letter-spacing:.14em;text-transform:uppercase;color:var(--a1);margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sum{margin:0;color:#2a3046}
.job{display:grid;grid-template-columns:150px 1fr;gap:16px;margin-bottom:16px;break-inside:avoid}
.job .d{color:var(--mute);font-size:13.5px;padding-top:2px}
.job h3{margin:0;font:600 17px 'Bricolage Grotesque'}.job h3 span{font:400 13.5px 'Instrument Sans';color:var(--mute)}
.job .r{margin:4px 0 0;font-weight:600}.job .r span{font-weight:400;color:var(--mute);font-size:13.5px}
.job ul{margin:4px 0 0;padding-left:18px;color:#2a3046}.job li{margin:2px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.list{margin:0;padding:0;list-style:none}
.certs{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.chips{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.chips li{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:99px;font-weight:600;font-size:13.5px;break-inside:avoid}
.chips i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.chips img{width:13px;height:13px;display:block}.list li{margin:0 0 8px}.list span{display:block;color:var(--mute);font-size:13.5px}
.bar{position:fixed;right:20px;bottom:20px;display:flex;gap:10px}
.bar button,.bar a{font:600 15px 'Instrument Sans';padding:11px 18px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;text-decoration:none}
.bar a{background:#fff;color:var(--ink)}.bar a.dl{background:var(--ink);color:#fff}
@media(max-width:700px){.page{margin:0;padding:32px 20px;border-radius:0}.job,.certs{grid-template-columns:1fr;gap:4px}}
@media print{@page{size:A4;margin:13mm 14mm}body{background:#fff;font-size:12.5px;line-height:1.42}.page{margin:0;padding:0;box-shadow:none;max-width:none}.bar{display:none}
 /* Print/PDF: no letter-spacing on headings (screening software reads "S U M M A R Y"), tighter rhythm so it fits two pages */
 h1{font-size:34px}.role{font-size:15px;margin:4px 0 8px}.contact{font-size:12.5px}
 h2{letter-spacing:0;font-size:12.5px;margin:16px 0 8px;padding-bottom:4px}
 .job{grid-template-columns:118px 1fr;gap:12px;margin-bottom:9px}.job .d,.job h3 span,.job .r span,.list span{font-size:12px}
 .job h3{font-size:15px}.job li{margin:1px 0}.chips li{font-size:12px;padding:3px 10px 3px 3px}.chips i{width:18px;height:18px}.list li{margin:0 0 4px}}
</style>
</head>
<body>
<main class="page" id="cv"></main>
<div class="bar"><a href="index.html">Back to site</a><a class="dl" href="resume.pdf" download="Aakarsh-B-Resume.pdf">Download PDF</a></div>
<script src="js/data.js"></script>
<script>
document.getElementById('cv').innerHTML=`
<h1>Aakarsh B</h1>
<p class="role">Brand Designer · Bengaluru</p>
<div class="contact"><a href="tel:+919995529772">+91 99955 29772</a><a href="mailto:aakarshbiju@gmail.com">aakarshbiju@gmail.com</a><a href="https://aakarsh.design">aakarsh.design</a><a href="https://www.linkedin.com/in/aakarshb/">linkedin.com/in/aakarshb</a><a href="https://www.behance.net/aakarshb">behance.net/aakarshb</a><a href="https://dribbble.com/aakarshb">dribbble.com/aakarshb</a></div>
<h2>Summary</h2>
<p class="sum">Brand designer with 5+ years of experience across brand, web and performance design for SaaS and marketing teams. At BiteSpeed, raised ad click-through rates by 50%+, cut cost per demo by 50% and lifted landing page PageSpeed from 50 to 80–84. Previously Senior Visual Designer at CloudEagle.ai, leading a team of three and reporting to the CEO. Works across Figma, Adobe, Webflow and Framer.</p>
<h2>Experience</h2>
${EXPERIENCE.map(c=>`<div class="job"><div class="d">${c.roles.length>1?c.roles[c.roles.length-1].d.split(' – ')[0]+' – '+c.roles[0].d.split(' – ')[1]:c.roles[0].d}</div><div><h3>${c.co}${c.where?` <span>· ${c.where}</span>`:''}</h3>${c.roles.map(r=>`<p class="r">${r.t}${c.roles.length>1?` <span>${r.d}</span>`:''}</p>${r.p.length?`<ul>${r.p.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}`).join('')}</div></div>`).join('')}
<h2>Certificates</h2><ul class="list certs">${CERTS.map(c=>`<li><b>${c.t}</b><span>${c.by} · ${c.d}</span></li>`).join('')}</ul>
<h2>Tools</h2><ul class="chips">${TOOLS.map(t=>`<li><i style="background:${t[2]}"><img src="images/tools/${t[1]}.svg" alt=""></i>${t[0]}</li>`).join('')}</ul>
<h2>Education</h2>
<ul class="list"><li><b>B.Tech, Computer Science and Engineering</b><span>Government Engineering College, Idukki · 2017 – 2021</span></li></ul>`;
</script>
</body>
</html>
