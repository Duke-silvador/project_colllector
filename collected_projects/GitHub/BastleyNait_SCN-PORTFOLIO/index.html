    <!-- Variable axes, not a list of static weights. Asking for 15 discrete
         weights made Google Fonts declare 75 @font-face rules and download one
         file per weight; a wght range returns a single variable file per family
         that still covers every weight the markup uses. -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400..700&family=Inter:wght@400..800&family=Outfit:wght@400..900&display=swap" rel="stylesheet">

    <!-- Applies the stored theme before first paint so the page never flashes
         the wrong palette. Kept inline and tiny on purpose. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
          var lang = localStorage.getItem('portfolio-lang');
          if (lang === 'en' || lang === 'es') document.documentElement.lang = lang;
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
