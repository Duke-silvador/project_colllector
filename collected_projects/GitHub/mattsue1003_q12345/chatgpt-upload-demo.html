<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用 ChatGPT 直接上傳到 GitHub 的測試頁</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #183047; background: #f4f8fc; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
    article { width: min(100%, 760px); padding: clamp(28px, 6vw, 64px); border-radius: 24px; background: white; box-shadow: 0 12px 40px rgba(24,48,71,.08); }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.35; margin: 0 0 28px; }
    p { font-size: clamp(1.25rem, 3.5vw, 1.65rem); line-height: 1.8; margin: 0; }
    footer { text-align: center; padding: 24px 16px; font-size: 1.05rem; color: #56677a; }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>用 ChatGPT 直接上傳到 GitHub 的測試頁</h1>
      <p>這個檔案是在 ChatGPT 對話裡透過 GitHub 外掛程式直接建立的，沒有打開 GitHub 網站。</p>
    </article>
  </main>
  <footer>本頁使用 AI 協助製作</footer>
</body>
</html>
