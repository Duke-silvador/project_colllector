<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0"><canvas id="c" width="400" height="500"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
ctx.fillStyle = '#ff0000'; ctx.fillRect(0,0,400,500);
const img = new Image();
img.onload = () => { ctx.drawImage(img, 50, 25, 300, 450); };
img.src = 'assets/sprites/anhlong-idle-00.png';
</script></body></html>
