<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Transparency</title></head>
<body style="margin:0;background:#222">
<canvas id="c" width="600" height="450" style="display:block"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// Nền game
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0, 0, 600, 450);
// Vẽ sprite
const img = new Image();
img.onload = () => {
  ctx.drawImage(img, 150, 50, 300, 450);
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('Nếu thấy caro/trắng quanh nhân vật = lỗi', 10, 20);
  ctx.fillText('Nếu thấy nền tối đều = đúng', 10, 40);
};
img.src = 'assets/sprites/anhlong-idle-00.png';
</script>
</body></html>
