    async function muatDaftarProdukPromoAdmin() {
    const daftar = document.getElementById("daftar-produk-promo");

    if (!daftar) return;

    daftar.textContent = "Memuat daftar produk promo...";

    const { data: produk, error } = await supabaseClient
        .from("produk")
        .select("id, nama_produk, kategori, harga, harga_lama, harga_promo, stok, aktif, gambar_url")
        .eq("aktif", true)
        .gt("harga_promo", 0)
        .order("nama_produk", { ascending: true });

    if (error) {
        console.error(error);
        daftar.textContent = "Gagal memuat produk promo: " + error.message;
        return;
    }

    if (!produk || produk.length === 0) {
        daftar.innerHTML = "<p>Belum ada produk yang sedang promo.</p>";
        return;
    }

    daftar.innerHTML = produk.map(item => `
        <div style="
            display:flex;
            align-items:center;
            gap:15px;
            flex-wrap:wrap;
            padding:15px;
            margin:12px 0;
            background:white;
            border-radius:10px;
            border:1px solid #ddd;
        ">
            <img
                src="${escapeHTML(item.gambar_url || "")}"
                alt="${escapeHTML(item.nama_produk)}"
                style="width:75px;height:75px;object-fit:contain;border-radius:8px;"
            >

            <div style="flex:1;min-width:160px;">
                <strong>${escapeHTML(item.nama_produk)}</strong>
                <p style="margin:5px 0;">
                    Harga normal: ¥${Number(item.harga).toLocaleString("ja-JP")}
                </p>
                <p style="margin:5px 0;color:#16a34a;font-weight:bold;">
                    Harga promo: ¥${Number(item.harga_promo).toLocaleString("ja-JP")}
                </p>
                <small>Stok: ${Number(item.stok || 0)}</small>
            </div>

            <button type="button" class="btn"
                onclick="editProdukAdmin(${Number(item.id)})">
                ✏️ Edit Promo
            </button>

            <button type="button" class="btn"
                onclick="hentikanPromoAdmin(${Number(item.id)})">
                🚫 Hentikan Promo
            </button>
        </div>
    `).join("");
}


async function hentikanPromoAdmin(id) {
    const yakin = confirm(
        "Yakin ingin menghentikan promo produk ini?"
    );

    if (!yakin) return;

    const { error } = await supabaseClient
        .from("produk")
        .update({
            harga_promo: null,
            promo_persen: 0
        })
        .eq("id", id);

    if (error) {

// KOMPRESI FOTO PRODUK OTOMATIS
async function kompresFotoProduk(file) {
    const gambar = await createImageBitmap(file);

    const ukuranMaksimal = 1200;

    const skala = Math.min(
        1,
        ukuranMaksimal / Math.max(gambar.width, gambar.height)
    );

    const canvas = document.createElement("canvas");

    canvas.width = Math.round(gambar.width * skala);
    canvas.height = Math.round(gambar.height * skala);

    const context = canvas.getContext("2d");

    context.drawImage(
        gambar,
        0,
        0,
        canvas.width,
        canvas.height
    );

    gambar.close();

    // Coba WebP terlebih dahulu
    let blob = await new Promise(resolve => {
        canvas.toBlob(resolve, "image/webp", 0.82);
    });

    // Jika WebP tidak didukung, gunakan JPEG
    if (!blob || blob.type !== "image/webp") {
        blob = await new Promise(resolve => {
            canvas.toBlob(resolve, "image/jpeg", 0.82);
        });
    }

    if (!blob) {
        throw new Error("Gagal mengompres foto.");
    }

    // Turunkan kualitas jika ukuran masih lebih dari 300 KB
    const format = blob.type;

    for (const kualitas of [0.72, 0.62, 0.52]) {
        if (blob.size <= 300 * 1024) break;

        blob = await new Promise(resolve => {
            canvas.toBlob(resolve, format, kualitas);
        });

        if (!blob) {
            throw new Error("Gagal mengompres foto.");
        }
    }

    const ekstensi = blob.type === "image/webp"
        ? "webp"
        : "jpg";

    const fotoBaru = new File(
        [blob],
        `produk-${Date.now()}.${ekstensi}`,
        { type: blob.type }
    );

    console.log("Ukuran foto asli:", file.size);
    console.log("Ukuran foto setelah kompresi:", fotoBaru.size);

    return fotoBaru;
}

async function simpanProdukAdmin(event) {
    event.preventDefault();

    const form = document.querySelector("#form-produk-admin");
    const pesan = document.querySelector("#pesan-produk-admin");
    const tombol = form.querySelector('button[type="submit"]');

    const nama = document.querySelector("#nama-produk-admin").value.trim();
    const kategori = document.querySelector("#kategori-produk-admin").value;
    const harga = Number(document.querySelector("#harga-produk-admin").value);
    const hargaLamaInput = document.querySelector("#harga-lama-admin").value;
    const hargaPromoInput = document.querySelector("#harga-promo-admin").value;
    const deskripsi = document.querySelector("#deskripsi-produk-admin").value.trim();
    const fileFoto = document.querySelector("#gambar-produk-admin").files[0];
    const stok = Number(document.querySelector("#stok-produk-admin").value);
    const aktif = document.querySelector("#aktif-produk-admin").checked;

    const hargaLama = hargaLamaInput === "" ? null : Number(hargaLamaInput);
    const hargaPromo = hargaPromoInput === "" ? null : Number(hargaPromoInput);

    if (!nama || !kategori || !fileFoto || harga < 0 || stok < 0) {
        pesan.textContent = "Lengkapi data produk dan pilih foto.";
        return;
    }

    if (!fileFoto.type.startsWith("image/")) {
        pesan.textContent = "File harus berupa gambar.";
        return;
    }

    if (fileFoto.size > 5 * 1024 * 1024) {
        pesan.textContent = "Ukuran foto asli maksimal 5 MB.";
        return;
    }

    if (hargaPromo !== null && hargaPromo >= harga) {
        pesan.textContent = "Harga promo harus lebih rendah dari harga normal.";
        return;
    }

    const hargaAcuan = hargaLama !== null && hargaLama > 0
        ? hargaLama
        : harga;

    const promoPersen = hargaPromo !== null && hargaAcuan > hargaPromo
        ? Math.round((hargaAcuan - hargaPromo) / hargaAcuan * 100)
        : 0;

    try {
        tombol.disabled = true;

        // KOMPRESI FOTO
        pesan.textContent = "Sedang mengompres foto...";

        const fotoKompres = await kompresFotoProduk(fileFoto);

        const ukuranKB = (fotoKompres.size / 1024).toFixed(0);

        pesan.textContent = `Foto berhasil dikompres (${ukuranKB} KB). Sedang mengunggah...`;

        // UPLOAD FOTO KE SUPABASE
        const ekstensi = fotoKompres.type === "image/webp"
            ? "webp"
            : "jpg";

        const namaFile = `${crypto.randomUUID()}.${ekstensi}`;

        const { data: hasilUpload, error: errorUpload } = await supabaseClient
            .storage
            .from("produk")
            .upload(namaFile, fotoKompres, {
                cacheControl: "3600",
                upsert: false,
                contentType: fotoKompres.type
            });

        if (errorUpload) {
            console.error("Gagal upload foto:", errorUpload);
            pesan.textContent = "Upload foto gagal. Periksa izin Storage.";
            return;
        }

        // AMBIL URL FOTO
        const { data: urlFoto } = supabaseClient
            .storage
            .from("produk")
            .getPublicUrl(hasilUpload.path);

        pesan.textContent = "Foto berhasil diunggah. Menyimpan produk...";

        // SIMPAN DATA PRODUK
        const { error } = await supabaseClient
            .from("produk")
            .insert([{
                nama_produk: nama,
                kategori: kategori,
                harga: harga,
                harga_lama: hargaLama,
                harga_promo: hargaPromo,
                promo_persen: promoPersen,
                deskripsi: deskripsi,
                gambar_url: urlFoto.publicUrl,
                stok: stok,
                aktif: aktif
            }]);

        if (error) {
            console.error("Gagal menyimpan produk:", error);
            pesan.textContent = "Foto sudah diunggah, tetapi data produk gagal disimpan. Periksa izin database.";
            return;
        }

        pesan.textContent = `Produk berhasil disimpan! Ukuran foto: ${ukuranKB} KB.`;

        form.reset();

        document.querySelector("#stok-produk-admin").value = "0";
        document.querySelector("#aktif-produk-admin").checked = true;

        muatDaftarProdukAdmin();
        
        window.scrollTo({
    top: 0,
    behavior: "smooth"
});

    } catch (error) {
        console.error("Kesalahan menyimpan produk:", error);
        pesan.textContent = "Terjadi kesalahan saat memproses foto. Silakan coba lagi.";

    } finally {
        tombol.disabled = false;
    }
}

    }

    daftar.innerHTML = `
        <h3>🔎 Cari Produk</h3>

        <p style="font-size:14px;color:#666;">

    const kolomCari = document.querySelector("#cari-produk-admin");
    const hasil = document.querySelector("#hasil-cari-produk-admin");

    function tampilkanHasilProduk(kataKunci = "") {
        const hasilFilter = produk.filter(item =>
            (item.nama_produk || "")
                .toLowerCase()
                .includes(kataKunci.toLowerCase().trim())
        );

        if (hasilFilter.length === 0) {

        }

        hasil.innerHTML = hasilFilter.map(item => `

                    <div>Stok: ${Number(item.stok || 0)}</div>

                    <label style="display:block;margin-top:8px;font-size:14px;">
                        <input
                            type="checkbox"
                            class="pilihan-produk-home-admin"
                            data-id="${Number(item.id)}"
                            ${item.tampilkan_di_pilihan ? "checked" : ""}
                            ${!item.aktif ? "disabled" : ""}
                        >
                        ⭐ Tampilkan di Produk Pilihan
                    </label>

                    ${!item.aktif ? `
                        <small style="color:#999;">
                            Aktifkan produk terlebih dahulu.
                        </small>
                    ` : ""}
                </div>

                <button type="button" class="btn"
                    onclick="editProdukAdmin(${Number(item.id)})">

                </button>

                    onclick="hapusProdukAdmin(${Number(item.id)})">
                    🗑️ Hapus
                </button>
            </div>
        `).join("");
    }

    kolomCari.addEventListener("input", function () {
        tampilkanHasilProduk(this.value);
    });

    hasil.addEventListener("change", async function (event) {
        const checkbox = event.target.closest(".pilihan-produk-home-admin");
        if (!checkbox) return;

        const id = Number(checkbox.dataset.id);
        const dipilih = checkbox.checked;
        const jumlahTerpilih = produk.filter(item =>
            item.tampilkan_di_pilihan === true && item.aktif
        ).length;

        if (dipilih && jumlahTerpilih >= 8) {

            checkbox.disabled = false;
            return;
        }

        const item = produk.find(item => Number(item.id) === id);
        if (item) {
            item.tampilkan_di_pilihan = dipilih;
        }

        tampilkanHasilProduk(kolomCari.value);

        console.log("Pilihan Produk Home berhasil diperbarui.");
    });

    tampilkanHasilProduk();

async function muatRekapPenjualanAdmin() {
    const bulanInput = document.querySelector("#rekap-bulan");
    const tahunInput = document.querySelector("#rekap-tahun");

    if (!bulanInput || !tahunInput) return;

    const bulanSekarang = new Date().getMonth() + 1;
    const tahunSekarang = new Date().getFullYear();

    // Isi pilihan tahun
    if (tahunInput.options.length === 0) {
        for (let tahun = tahunSekarang; tahun >= tahunSekarang - 5; tahun--) {
            tahunInput.add(new Option(tahun, tahun));
        }
    }

    if (!bulanInput.dataset.diatur) {
        bulanInput.value = String(bulanSekarang);
        tahunInput.value = String(tahunSekarang);
        bulanInput.dataset.diatur = "ya";
    }

    const bulan = Number(bulanInput.value);
    const tahun = Number(tahunInput.value);

    const awalBulan = new Date(tahun, bulan - 1, 1);
    const awalBulanBerikutnya = new Date(tahun, bulan, 1);

    const awalISO = awalBulan.toISOString();
    const akhirISO = awalBulanBerikutnya.toISOString();

    const omzetEl = document.querySelector("#rekap-total-omzet");
    const jumlahEl = document.querySelector("#rekap-jumlah-pesanan");
    const daftarEl = document.querySelector("#daftar-transaksi-rekap");
    const grafikEl = document.querySelector("#grafik-rekap-penjualan");

    omzetEl.textContent = "Memuat...";
    jumlahEl.textContent = "Memuat...";
    daftarEl.textContent = "Memuat transaksi...";

    const { data: pesanan, error } = await supabaseClient
        .from("pesanan")
        .select("id, nomor_pesanan, total, status, created_at, pelanggan_id")
        .eq("status", "Selesai")
        .gte("created_at", awalISO)
        .lt("created_at", akhirISO)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Gagal memuat rekap:", error);
        omzetEl.textContent = "-";
        jumlahEl.textContent = "-";
        daftarEl.textContent = "Gagal memuat data: " + error.message;
        return;
    }

    const dataPesanan = pesanan || [];

    const totalOmzet = dataPesanan.reduce(
        (jumlah, item) => jumlah + Number(item.total || 0),
        0
    );

    omzetEl.textContent =
        "¥" + totalOmzet.toLocaleString("ja-JP");

    jumlahEl.textContent = dataPesanan.length;

    // Ambil nama pelanggan
    const idPelanggan = [
        ...new Set(dataPesanan.map(item => item.pelanggan_id).filter(Boolean))
    ];

    let pelanggan = [];

    if (idPelanggan.length > 0) {
        const { data, error: errorPelanggan } = await supabaseClient
            .from("pelanggan")
            .select("id, nama")
            .in("id", idPelanggan);

        if (errorPelanggan) {
            console.error("Gagal memuat pelanggan:", errorPelanggan);
        } else {
            pelanggan = data || [];
        }
    }

    if (dataPesanan.length === 0) {
        daftarEl.innerHTML = "<p>Tidak ada transaksi selesai pada bulan ini.</p>";
    } else {
        daftarEl.innerHTML = `
            <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;min-width:550px;">
                    <thead>
                        <tr>
                            <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Nomor Pesanan</th>
                            <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Tanggal</th>
                            <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Pelanggan</th>
                            <th style="padding:10px;text-align:right;border-bottom:1px solid #ddd;">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${dataPesanan.map(item => {
                            const orang = pelanggan.find(
                                p => p.id === item.pelanggan_id
                            );

                            return `
                                <tr>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${escapeHTML(item.nomor_pesanan || "-")}
                                    </td>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${escapeHTML(new Date(item.created_at).toLocaleDateString("id-ID"))}
                                    </td>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${escapeHTML(orang?.nama || "-")}
                                    </td>
                                    <td style="padding:10px;text-align:right;border-bottom:1px solid #eee;">
                                        ¥${Number(item.total || 0).toLocaleString("ja-JP")}
                                    </td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            </div>
        `;
    }

    // Ambil omzet setiap bulan pada tahun terpilih
    const awalTahun = new Date(tahun, 0, 1).toISOString();
    const akhirTahun = new Date(tahun + 1, 0, 1).toISOString();

    const { data: semuaPesanan, error: errorGrafik } = await supabaseClient
        .from("pesanan")
        .select("total, created_at")
        .eq("status", "Selesai")
        .gte("created_at", awalTahun)
        .lt("created_at", akhirTahun);

    if (errorGrafik) {
        console.error("Gagal memuat grafik:", errorGrafik);
        grafikEl.textContent = "Gagal memuat grafik penjualan.";
        return;
    }

    const omzetBulanan = Array(12).fill(0);

    (semuaPesanan || []).forEach(item => {
        const bulanPesanan = new Date(item.created_at).getMonth();
        omzetBulanan[bulanPesanan] += Number(item.total || 0);
    });

        "Jul", "Agu", "Sep", "Okt", "Nov", "Des"
    ];

    grafikEl.innerHTML = `

            style="width:100%;max-height:350px;"></canvas>

        grafikRekapPenjualan.destroy();
    }

    const canvas = document.querySelector("#canvas-rekap-penjualan");
    const nilaiMaksimum = Math.max(...omzetBulanan);

const intervalGrafik = Math.max(
    1000,
    Math.ceil(nilaiMaksimum / 5 / 1000) * 1000
);

    grafikRekapPenjualan = new Chart(canvas, {
        type: "bar",
        data: {
            labels: namaBulan,
            datasets: [{
                label: "Omzet Penjualan (¥)",
                data: omzetBulanan,
                backgroundColor: "#16a34a",
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: true
                },
                tooltip: {
                    callbacks: {
                        label: context =>
                            "¥" + Number(context.raw).toLocaleString("ja-JP")
                    }
                }
            },
            scales: {
                y: {
    beginAtZero: true,
    suggestedMax: intervalGrafik * 5,
    ticks: {
        stepSize: intervalGrafik,
        callback: value =>
            "¥" + Number(value).toLocaleString("ja-JP")
    }
}
            }
        }
    });

    canvas.parentElement.style.height = "350px";
}

// Menyimpan perubahan produk
async function simpanPerubahanProdukAdmin(event) {
    event.preventDefault();

    const produkLama = dataEditProdukAktif;

    if (!produkLama) {
        alert("Data produk tidak ditemukan. Silakan buka form edit kembali.");
        return;
    }

    const pesan = document.getElementById("edit-pesan-produk");
    const tombol = document.getElementById("tombol-simpan-edit");

    const nama = document.getElementById("edit-nama-produk").value.trim();
    const kategori = document.getElementById("edit-kategori-produk").value.trim();

    const hargaInput = document.getElementById("edit-harga-produk").value;
    const hargaLamaInput = document.getElementById("edit-harga-lama").value.trim();
    const hargaPromoInput = document.getElementById("edit-harga-promo").value.trim();
    const deskripsi = document.getElementById("edit-deskripsi-produk").value.trim();
    const stokInput = document.getElementById("edit-stok-produk").value;
    const aktif = document.getElementById("edit-aktif-produk").checked;

    const harga = Number(hargaInput);
    const hargaLama = hargaLamaInput === "" ? null : Number(hargaLamaInput);
    const hargaPromo = hargaPromoInput === "" ? null : Number(hargaPromoInput);
    const stok = Number(stokInput);

    if (
        !nama ||
        !kategori ||
        hargaInput.trim() === "" ||
        !Number.isFinite(harga) ||
        harga < 0 ||
        (hargaLama !== null &&
            (!Number.isFinite(hargaLama) || hargaLama < 0)) ||
        (hargaPromo !== null &&
            (!Number.isFinite(hargaPromo) ||
                hargaPromo < 0 ||
                hargaPromo >= harga)) ||
        stokInput.trim() === "" ||
        !Number.isInteger(stok) ||
        stok < 0
    ) {
        alert("Periksa kembali nama, kategori, harga, harga promo, dan stok.");
        return;
    }

    if (fotoEditProdukBaru) {
        if (!fotoEditProdukBaru.type.startsWith("image/")) {
            alert("File yang dipilih harus berupa gambar.");
            return;
        }

        if (fotoEditProdukBaru.size > 5 * 1024 * 1024) {
            alert("Ukuran foto maksimal 5 MB.");
            return;
        }
    }

    tombol.disabled = true;
    pesan.textContent = "Sedang menyimpan perubahan...";

    let pathFotoBaru = null;
    let urlFoto = produkLama.gambar_url || null;
    let pathFotoLama = null;

    try {
        // Upload foto baru jika pengguna memilihnya.
        if (fotoEditProdukBaru) {
            const ekstensi = fotoEditProdukBaru.name.includes(".")
                ? fotoEditProdukBaru.name.split(".").pop().toLowerCase()
                : "jpg";

            const namaFile = `${crypto.randomUUID()}.${ekstensi}`;

            const { data: hasilUpload, error: errorUpload } =
                await supabaseClient
                    .storage
                    .from("produk")
                    .upload(namaFile, fotoEditProdukBaru, {
                        cacheControl: "3600",
                        upsert: false
                    });

            if (errorUpload) {
                throw new Error("Upload foto gagal: " + errorUpload.message);
            }

            pathFotoBaru = hasilUpload.path;

            const { data: hasilURL } = supabaseClient
                .storage
                .from("produk")
                .getPublicUrl(pathFotoBaru);

            urlFoto = hasilURL.publicUrl;
        }

        const hargaAcuan = hargaLama !== null && hargaLama > 0
            ? hargaLama
            : harga;

        const promoPersen = hargaPromo !== null && hargaAcuan > hargaPromo
            ? Math.round(((hargaAcuan - hargaPromo) / hargaAcuan) * 100)
            : 0;

        const { error: errorUpdate } = await supabaseClient
            .from("produk")
            .update({
                nama_produk: nama,
                kategori: kategori,
                harga: harga,
                harga_lama: hargaLama,
                harga_promo: hargaPromo,
                promo_persen: promoPersen,
                deskripsi: deskripsi,
                stok: stok,
                aktif: aktif,
                gambar_url: urlFoto
            })
            .eq("id", produkLama.id);

        if (errorUpdate) {
            throw new Error("Gagal menyimpan ke database: " + errorUpdate.message);
        }

        // Hapus foto lama hanya setelah database berhasil diperbarui.
        if (pathFotoBaru && produkLama.gambar_url) {
            try {
                const urlLama = new URL(produkLama.gambar_url);
                const bagianPath = "/storage/v1/object/public/produk/";

                if (urlLama.pathname.includes(bagianPath)) {
                    pathFotoLama = decodeURIComponent(
                        urlLama.pathname.split(bagianPath)[1]
                    );
                }
            } catch (e) {
                console.warn("URL foto lama tidak dapat diperiksa.");
            }

            if (pathFotoLama && pathFotoLama !== pathFotoBaru) {
                const { error: errorHapus } = await supabaseClient
                    .storage
                    .from("produk")
                    .remove([pathFotoLama]);

                if (errorHapus) {
                    console.warn("Foto lama belum terhapus:", errorHapus);
                }
            }
        }

        alert("Produk berhasil diperbarui!");

                const formEditSelesai = document.getElementById("form-edit-produk-admin");

        if (formEditSelesai) {
            formEditSelesai.style.display = "none";
            formEditSelesai.innerHTML = "";
        }
        fotoEditProdukBaru = null;
        dataEditProdukAktif = null;

                if (document.getElementById("daftar-produk-promo")) {
    await muatDaftarProdukPromoAdmin();
} else if (document.getElementById("daftar-produk-admin")) {
    await muatDaftarProdukAdmin();
}

        if (document.getElementById("daftar-produk-promo")) {
            await muatDaftarProdukPromoAdmin();
            await muatDashboardAdmin();

            window.scrollTo({
    top: 0,
    behavior: "smooth"
});
        }
    } catch (error) {
        console.error(error);

        // Jika update database gagal, bersihkan foto baru yang belum digunakan.
        if (pathFotoBaru) {
            const { error: errorHapusBaru } = await supabaseClient
                .storage
                .from("produk")
                .remove([pathFotoBaru]);

            if (errorHapusBaru) {
                console.warn("Foto baru belum terhapus:", errorHapusBaru);
            }
        }

        pesan.textContent = error.message || "Terjadi kesalahan.";
        alert(error.message || "Gagal memperbarui produk.");

    } finally {
        const tombolAkhir = document.getElementById("tombol-simpan-edit");

        if (tombolAkhir) {
            tombolAkhir.disabled = false;
        }
    }
}
    
async function hapusProdukAdmin(id) {
    const yakin = confirm(
        "Yakin ingin menghapus produk ini? Tindakan ini tidak bisa dibatalkan."
    );

    if (!yakin) return;

    const { error } = await supabaseClient
        .from("produk")
        .delete()
        .eq("id", id);

    if (error) {
        console.error("Gagal menghapus produk:", error);

        return;
    }

    alert("Produk berhasil dihapus!");

    await muatDaftarProdukAdmin();
}

    async function muatDashboardAdmin() {
    const pesan = document.querySelector("#pesan-dashboard");

    try {
        // 1. Ambil data pesanan
        const { data: pesanan, error: errorPesanan } =
            await supabaseClient
                .from("pesanan")
                .select("nomor_pesanan, total, status, created_at")
                .order("created_at", { ascending: false });

        if (errorPesanan) throw errorPesanan;

        const daftarPesanan = pesanan || [];

        // 2. Hitung statistik berdasarkan status
        const statusNormal = status =>
            String(status || "").trim().toLowerCase();

        const jumlahBaru = daftarPesanan.filter(p =>
    ["baru", "pesanan baru", "menunggu", "pending"]
        .includes(statusNormal(p.status))
).length;

        const jumlahProses = daftarPesanan.filter(p =>
            statusNormal(p.status) === "diproses"
        ).length;

        const jumlahSelesai = daftarPesanan.filter(p =>
            statusNormal(p.status) === "selesai"
        ).length;

        // Total penjualan dihitung dari pesanan selesai
        const totalPenjualan = daftarPesanan
            .filter(p => statusNormal(p.status) === "selesai")
            .reduce((total, p) => total + Number(p.total || 0), 0);

        document.querySelector("#stat-pesanan-baru").textContent = jumlahBaru;
        document.querySelector("#stat-pesanan-proses").textContent = jumlahProses;
        document.querySelector("#stat-pesanan-selesai").textContent = jumlahSelesai;
        document.querySelector("#stat-total-penjualan").textContent =
            "¥" + totalPenjualan.toLocaleString("ja-JP");

        // 3. Ambil data produk
        const { data: produk, error: errorProduk } =
            await supabaseClient
                .from("produk")
                .select("stok, aktif, harga_promo");

        if (errorProduk) throw errorProduk;

        const daftarProduk = produk || [];

        const produkAktif = daftarProduk.filter(p => p.aktif === true).length;

        const stokHabis = daftarProduk.filter(
            p => p.aktif === true && Number(p.stok || 0) <= 0
        ).length;

        const produkPromo = daftarProduk.filter(p =>
            p.aktif === true &&
            Number(p.harga_promo || 0) > 0
        ).length;

        document.querySelector("#stat-produk-aktif").textContent = produkAktif;
        document.querySelector("#stat-stok-habis").textContent = stokHabis;
        document.querySelector("#stat-produk-promo").textContent = produkPromo;

        // 4. Tampilkan lima pesanan terbaru
        const areaTerbaru = document.querySelector(
            "#pesanan-terbaru-dashboard"
        );

        if (daftarPesanan.length === 0) {
            areaTerbaru.innerHTML = "<p>Belum ada pesanan.</p>";
        } else {
            const limaTerbaru = daftarPesanan.slice(0, 5);

            areaTerbaru.innerHTML = `
                <div style="overflow-x:auto;">
                    <table style="width:100%;border-collapse:collapse;background:white;">
                        <thead>
                            <tr>
                                <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Nomor Pesanan</th>
                                <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Tanggal</th>
                                <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Waktu</th>
                                <th style="padding:10px;text-align:right;border-bottom:1px solid #ddd;">Total</th>
                                <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${limaTerbaru.map(p => `
                                <tr>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${escapeHTML(p.nomor_pesanan || "-")}
                                    </td>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${p.created_at
                                            ? new Date(p.created_at).toLocaleDateString("id-ID")
                                            : "-"}
                                    </td>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${p.created_at
                                            ? new Date(p.created_at).toLocaleTimeString("ja-JP", {
                                            hour: "2-digit",
                                            minute: "2-digit",
                                            hour12: false,
                                            timeZone: "Asia/Tokyo"
                                                })
                                            : "-"}
                                    </td>
                                    <td style="padding:10px;text-align:right;border-bottom:1px solid #eee;">
                                        ¥${Number(p.total || 0).toLocaleString("ja-JP")}
                                    </td>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${escapeHTML(p.status || "-")}
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            `;
        }

        if (pesan) pesan.textContent = "";

    } catch (error) {
        console.error("Gagal memuat dashboard:", error);

        if (pesan) {
            pesan.textContent =
                "Sebagian data dashboard gagal dimuat. Periksa koneksi atau izin Supabase.";
            pesan.style.color = "red";
        }

async function simpanStatusPesananAdmin(tombol, nomorPesanan) {
    const baris = tombol.closest("tr");
    const pilihan = baris?.querySelector(".pilihan-status-admin");

    if (!pilihan || !nomorPesanan) {
        alert("Pilihan status atau nomor pesanan tidak ditemukan.");
        return;
    }

    const statusBaru = pilihan.value;
    const statusLama = pilihan.dataset.statusLama || pilihan.value;

    if (!confirm(
        `Ubah status pesanan ${nomorPesanan} menjadi "${statusBaru}"?`
    )) {
        pilihan.value = statusLama;
        return;
    }

    tombol.disabled = true;
    tombol.textContent = "Menyimpan...";

    const { data, error } = await supabaseClient
        .from("pesanan")
        .update({ status: statusBaru })
        .eq("nomor_pesanan", nomorPesanan)
        .select("nomor_pesanan, status");

    tombol.disabled = false;
    tombol.textContent = "Simpan";

    if (error) {
        alert("Gagal menyimpan status: " + error.message);
        return;
    }

    if (!data || data.length === 0) {
        alert(
            "Status belum berubah. Pesanan tidak ditemukan atau akses database ditolak."
        );
        return;
    }

    alert(`Status pesanan ${nomorPesanan} berhasil diubah menjadi ${statusBaru}.`);

    muatPesananAdmin();
}

function escapeHTML(nilai) {
    return String(nilai).replace(/[&<>"']/g, karakter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[karakter]);
}

function tampilkanProdukKasir() {
    const daftar = document.querySelector("#daftar-produk-kasir");
    const pencarian = document.querySelector("#pencarian-produk-kasir");

    if (!daftar || !pencarian) return;

    const kataKunci = pencarian.value.toLowerCase().trim();

    const hasil = daftarProdukKasir.filter(produk =>
        produk.nama_produk.toLowerCase().includes(kataKunci)
    );

    if (hasil.length === 0) {
        daftar.innerHTML = "<p>Produk tidak ditemukan.</p>";
        return;
    }

    daftar.innerHTML = hasil.map(produk => {
        const hargaPromo = Number(produk.harga_promo || 0);
        const hargaNormal = Number(produk.harga || 0);

        const harga =
            hargaPromo > 0 && hargaPromo < hargaNormal
                ? hargaPromo
                : hargaNormal;

        const stok = Number(produk.stok || 0);

        return `
            <div style="
                display:flex;
                align-items:center;
                gap:12px;
                padding:12px 0;
                border-bottom:1px solid #ddd;
            ">
                ${
                    produk.gambar_url
                    ? `<img src="${produk.gambar_url}"
                        alt="${produk.nama_produk}"
                        style="width:60px;height:60px;object-fit:cover;border-radius:8px;">`
                    : ""
                }

                <div style="flex:1;min-width:0;">
                    <strong>${escapeHTML(produk.nama_produk)}</strong>

                    <p style="margin:5px 0;font-weight:bold;">
                        ¥${harga.toLocaleString("ja-JP")}
                    </p>

                    <small>Stok: ${stok}</small>
                </div>

                <button
                    type="button"
                    class="btn"
                    onclick="tambahProdukKasir(${produk.id})"
                    ${stok <= 0 ? "disabled" : ""}
                >
                    ${stok <= 0 ? "Habis" : "Tambah"}
                </button>
            </div>
        `;
    }).join("");
}

    let keranjangKasir = [];

function tambahProdukKasir(id) {
    const produk = daftarProdukKasir.find(
        item => String(item.id) === String(id)
    );

    if (!produk) return;

    const stok = Number(produk.stok || 0);

    if (stok <= 0) {
        alert("Stok produk habis.");
        return;
    }

    const itemAda = keranjangKasir.find(
        item => String(item.id) === String(id)
    );

    if (itemAda) {
        if (itemAda.jumlah >= stok) {
            alert("Jumlah melebihi stok tersedia.");
            return;
        }

        itemAda.jumlah++;
    } else {
        const harga = Number(
            produk.harga_promo > 0
                ? produk.harga_promo
                : produk.harga
        );

        keranjangKasir.push({
            id: produk.id,
            nama_produk: produk.nama_produk,
            harga: harga,
            gambar_url: produk.gambar_url,
            stok: stok,
            jumlah: 1
        });
    }

    tampilkanKeranjangKasir();
}

function tampilkanKeranjangKasir() {
    const keranjang = document.querySelector("#keranjang-kasir");
    const totalElement = document.querySelector("#total-kasir");

    if (!keranjang || !totalElement) return;

    if (keranjangKasir.length === 0) {
        keranjang.textContent = "Belum ada produk dipilih.";
        totalElement.textContent = "¥0";

        hitungKembalianKasir();
        perbaruiTombolSelesaikanKasir();
        return;
    }

    let total = 0;

    keranjang.innerHTML = keranjangKasir.map(item => {
        const subtotal = item.harga * item.jumlah;
        total += subtotal;

        return `
            <div style="
                display:flex;
                align-items:center;
                gap:10px;
                padding:12px 0;
                border-bottom:1px solid #eee;
            ">
                <img src="${escapeHTML(item.gambar_url || "")}"
                    alt=""
                    style="
                        width:55px;
                        height:55px;
                        object-fit:cover;
                        border-radius:8px;
                    "
                    onerror="this.style.display='none'">

                <div style="flex:1;min-width:0;">
                    <strong>${escapeHTML(item.nama_produk)}</strong>
                    <div>¥${item.harga.toLocaleString("ja-JP")}</div>
                    <div>
                        Subtotal: ¥${subtotal.toLocaleString("ja-JP")}
                    </div>
                </div>

                <div style="display:flex;align-items:center;gap:5px;">
                    <button type="button"
                        onclick="ubahJumlahKasir('${item.id}', -1)">−</button>

                    <strong>${item.jumlah}</strong>

                    <button type="button"
                        onclick="ubahJumlahKasir('${item.id}', 1)">+</button>

                    <button type="button"
                        onclick="hapusProdukKasir('${item.id}')"
                        style="color:red;">✕</button>
                </div>
            </div>
        `;
    }).join("");

    totalElement.textContent =
        "¥" + total.toLocaleString("ja-JP");

    hitungKembalianKasir();
    perbaruiTombolSelesaikanKasir();
}

function ubahJumlahKasir(id, perubahan) {
    const item = keranjangKasir.find(
        produk => String(produk.id) === String(id)
    );

    if (!item) return;

    const jumlahBaru = item.jumlah + perubahan;

    if (jumlahBaru <= 0) {
        hapusProdukKasir(id);
        return;
    }

    if (jumlahBaru > item.stok) {
        alert("Jumlah melebihi stok tersedia.");
        return;
    }

    item.jumlah = jumlahBaru;
    tampilkanKeranjangKasir();
}

function hapusProdukKasir(id) {
    keranjangKasir = keranjangKasir.filter(
        item => String(item.id) !== String(id)
    );

    tampilkanKeranjangKasir();
}

function hitungKembalianKasir() {
    const inputBayar = document.querySelector("#uang-bayar-kasir");
    const hasilKembalian = document.querySelector("#kembalian-kasir");

    if (!inputBayar || !hasilKembalian) return;

    const total = keranjangKasir.reduce(
        (jumlah, item) => jumlah + item.harga * item.jumlah,
        0
    );

    const uangBayar = Number(inputBayar.value || 0);
    const kembalian = Math.max(0, uangBayar - total);

    hasilKembalian.textContent =
        "¥" + kembalian.toLocaleString("ja-JP");
}

function perbaruiTombolSelesaikanKasir() {
    const tombol = document.querySelector("#tombol-selesaikan-kasir");
    const inputBayar = document.querySelector("#uang-bayar-kasir");

    if (!tombol || !inputBayar) return;

    const total = keranjangKasir.reduce(
        (jumlah, item) => jumlah + item.harga * item.jumlah,
        0
    );

    const uangBayar = Number(inputBayar.value || 0);

    tombol.disabled =
        keranjangKasir.length === 0 ||
        uangBayar < total ||
        total <= 0;
}

async function selesaikanTransaksiKasir() {
    if (keranjangKasir.length === 0) {
        alert("Keranjang masih kosong.");
        return;
    }

    const total = keranjangKasir.reduce(
        (jumlah, item) => jumlah + item.harga * item.jumlah,
        0
    );

    const inputBayar = document.querySelector("#uang-bayar-kasir");
    const tombol = document.querySelector("#tombol-selesaikan-kasir");
    const pesan = document.querySelector("#pesan-kasir");

    const uangBayar = Number(inputBayar.value || 0);

    if (uangBayar < total) {
        alert("Uang pembayaran masih kurang.");
        return;
    }

    if (!confirm("Selesaikan transaksi ini?")) return;

    tombol.disabled = true;
    tombol.textContent = "Memproses...";

    try {
        const items = keranjangKasir.map(item => ({
            produk_id: item.id,
            jumlah: item.jumlah
        }));

        const { data, error } = await supabaseClient.rpc(
            "buat_transaksi_kasir",
            { p_items: items }
        );

        if (error) throw error;

        const kembalian = uangBayar - total;
         notaKasirTerakhir = {
    nomor_pesanan: data,
    tanggal: new Date(),
    items: keranjangKasir.map(item => ({
        nama_produk: item.nama_produk,
        harga: item.harga,
        jumlah: item.jumlah,
        subtotal: item.harga * item.jumlah
    })),
    total: total,
    uang_bayar: uangBayar,
    kembalian: kembalian
};

        keranjangKasir = [];
        inputBayar.value = "";

        tampilkanKeranjangKasir();

        pesan.style.color = "green";
        pesan.textContent =
            "Transaksi berhasil! Kembalian: ¥" +
            kembalian.toLocaleString("ja-JP");
        pesan.innerHTML += `
    <br><br>
    <button type="button"
        class="btn"
        onclick="cetakNotaKasir()">
        🧾 Cetak Nota
    </button>
`;

        await muatProdukKasirAdmin();

    } catch (error) {
        console.error("Gagal transaksi kasir:", error);

        pesan.style.color = "red";
        pesan.textContent =
            "Transaksi gagal: " + error.message;

    } finally {
        tombol.textContent = "Selesaikan Transaksi";
        perbaruiTombolSelesaikanKasir();
    }
}
