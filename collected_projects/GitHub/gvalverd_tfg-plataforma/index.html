<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuestionario de TFG y TFM</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="styles.css?v=10">
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
</head>
<body>
<header class="band">
  <div class="wrap" style="max-width:860px">
    <div>
      <div class="eyebrow" id="eyebrow">Cuestionario inicial</div>
      <h1 id="intro-title">Cargando…</h1>
      <p id="intro-text"></p>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="single" id="app">
    <div class="notice" id="privacy" hidden></div>
    <div id="top-msg"></div>
    <form id="qform" autocomplete="on" novalidate></form>
  </div>
</main>

<div class="submitbar" id="submitbar" hidden>
  <div class="inner">
    <div class="progress"><span class="ptxt" id="ptxt"></span><span class="pbar"><i id="pbar"></i></span></div>
    <button class="btn" id="btn-send" type="button">Enviar respuestas <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></button>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</div>

<script src="config.js?v=10"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="plantillas.js?v=10"></script>
<script src="shared.js?v=10"></script>
<script>
"use strict";
const client = makeClient();
const params = new URL(location.href).searchParams;
const SLUG = (params.get("c") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
let KEY = "";   // sufijo de almacenamiento local, por convocatoria
let answers = blankAnswers();
let token = null, sentAt = null, open = true;

const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const DRAFT = () => "tfg-borrador-" + KEY, TOKEN = () => "tfg-token-" + KEY;
const isUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s || "");
function newToken() { return crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)); }
function personalLink() { const u = new URL(location.href); u.search = ""; u.hash = ""; if (SLUG) u.searchParams.set("c", SLUG); u.searchParams.set("t", token); return u.toString(); }
const tutorWord = () => CONV && CONV.tutores_plural ? "tus tutores" : "tu tutor";

function renderForm() {
  $("#qform").innerHTML = SECTIONS.map(s => `<details class="sec" data-sec="${s.k}" open>
    <summary><span class="letter">${s.k}</span>${esc(s.t)}<span class="count" id="cnt-${s.k}"></span>${'<svg class="tw" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>'}</summary>
    <div class="sec-body"><fieldset>${s.q.map(q => qInput(q, answers[q.id])).join("")}</fieldset></div></details>`).join("");
  refreshProgress();
}
function refreshProgress() {
  applyVisibility($("#qform"), answers);
  for (const s of SECTIONS) {
    const [n, t] = secCount(s, answers);
    const el = $("#cnt-" + s.k); if (el) el.textContent = `${n}/${t}`;
    const d = document.querySelector(`details[data-sec="${s.k}"]`); if (d) d.hidden = t === 0;
  }
  const n = answeredCount(answers), total = visibleQuestions(answers).length;
  $("#ptxt").textContent = `${n} de ${total} respondidas`;
  $("#pbar").style.width = (total ? Math.round(n / total * 100) : 0) + "%";
}
function setStatus(t, err) { const s = $("#status"); s.textContent = t; s.classList.toggle("err", !!err); }
function renderSuccess() {
  if (!sentAt) { $("#top-msg").innerHTML = ""; return; }
  const when = new Date(sentAt).toLocaleString("es-ES", { dateStyle: "long", timeStyle: "short" });
  $("#top-msg").innerHTML = `<div class="success">
    <div class="eyebrow">Respuestas enviadas</div>
    <h2>Ya están enviadas (última versión: ${esc(when)})</h2>
    <p>Puedes cambiarlas cuando quieras y volver a pulsar «Enviar respuestas». Desde este navegador se cargan solas; desde otro dispositivo usa tu enlace personal. No lo compartas: quien lo tenga puede ver y cambiar tus respuestas.</p>
    <div class="linkrow"><input id="plink" type="text" readonly value="${esc(personalLink())}" aria-label="Tu enlace personal"><button class="btn small" type="button" id="btn-copy">Copiar enlace</button></div>
  </div>`;
}
function fatal(title, text) {
  $("#intro-title").textContent = title; $("#intro-text").textContent = "";
  $("#top-msg").innerHTML = `<div class="warnbox">${text}</div>`;
}

document.addEventListener("input", e => {
  const id = applyInput(answers, e.target); if (!id) return;
  ls.set(DRAFT(), JSON.stringify(answers));
  refreshProgress();
  if (sentAt) setStatus("Tienes cambios sin enviar.");
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "btn-copy") return copyText($("#plink").value, b);
  if (b.id === "btn-send") return send();
});

async function send() {
  const btn = $("#btn-send");
  if (!open) { setStatus("El cuestionario está cerrado. Escribe a tu tutor si necesitas cambiar algo.", true); return; }
  const name = (answers.q1 || "").trim(), mail = (answers.q2 || "").trim();
  if (name.length < 2) { setStatus("Escribe tu nombre y apellidos (pregunta 1).", true); $("#q1").focus(); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { setStatus("Escribe tu correo universitario (pregunta 2).", true); $("#q2").focus(); return; }
  if (!token) { token = newToken(); ls.set(TOKEN(), token); }
  btn.disabled = true; setStatus("Enviando…");
  try {
    const { data, error } = await client.rpc("tfg_guardar", { p_slug: SLUG || null, p_token: token, p_nombre: name, p_email: mail, p_answers: answers });
    if (error) throw error;
    sentAt = data || new Date().toISOString();
    ls.set(DRAFT(), JSON.stringify(answers));
    const dom = CONV.dominio_correo;
    const extra = dom && !mail.toLowerCase().endsWith("@" + dom) ? ` Revisa el correo: no es una dirección @${dom}.` : "";
    const missing = visibleQuestions(answers).length - answeredCount(answers);
    setStatus((missing ? `Enviado. Te quedan ${missing} preguntas sin responder; puedes completarlas y volver a enviar.` : "Enviado. ¡Gracias!") + extra);
    renderSuccess();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    const m = String(err && err.message || "");
    setStatus(/correo/i.test(m) ? "Ya hay unas respuestas enviadas con este correo. Abre tu enlace personal para cambiarlas o pide a tu tutor que te lo reenvíe."
      : /cerrado/i.test(m) ? "El cuestionario está cerrado."
      : /otra convocatoria/i.test(m) ? "Tu enlace personal es de otra convocatoria. Abre el enlace que te dio tu tutor."
      : /nombre/i.test(m) ? "Escribe tu nombre y apellidos."
      : "No se ha podido enviar. Comprueba tu conexión y vuelve a intentarlo; tus respuestas siguen guardadas en este navegador.", true);
  } finally { btn.disabled = false; }
}

async function boot() {
  if (!client) { fatal("Página sin configurar", "<strong>Falta la conexión con la base de datos.</strong> Avisa a tu tutor."); return; }
  let conv = null;
  try { const { data, error } = await client.rpc("tfg_conv_publica", { p_slug: SLUG || null }); if (!error) conv = data; } catch (e) {}
  if (!conv) { fatal("Cuestionario no encontrado", "<strong>Este enlace no corresponde a ningún cuestionario.</strong> Comprueba que lo has copiado entero o pide a tu tutor el enlace correcto."); return; }
  setConvocatoria(conv); KEY = conv.slug;
  $("#eyebrow").textContent = [conv.universidad, [conv.tipo, conv.area || conv.titulacion].filter(Boolean).join(" · "), conv.curso].filter(Boolean).join(" · ");
  $("#intro-title").textContent = INTRO.title; $("#intro-text").textContent = INTRO.text;
  $("#privacy").textContent = INTRO.privacy; $("#privacy").hidden = !INTRO.privacy;
  document.title = INTRO.title + (conv.universidad ? " · " + conv.universidad : "");
  const urlToken = params.get("t");
  if (isUuid(urlToken)) { token = urlToken; ls.set(TOKEN(), token); }
  else if (isUuid(ls.get(TOKEN()))) token = ls.get(TOKEN());
  try { const d = JSON.parse(ls.get(DRAFT()) || "null"); if (d) answers = fullAnswers(d); } catch (e) {}
  $("#submitbar").hidden = false;
  renderForm();
  open = conv.abierta !== false;
  if (!open) { $("#top-msg").innerHTML = `<div class="warnbox"><strong>El cuestionario está cerrado.</strong> Puedes consultar tus respuestas, pero ya no se pueden enviar cambios.</div>`; $("#btn-send").disabled = true; }
  if (token) {
    try {
      const { data, error } = await client.rpc("tfg_leer_mia", { p_slug: SLUG || null, p_token: token });
      if (!error && data && data.length) {
        const row = data[0];
        // Si viene del enlace personal o no hay borrador, se usa lo enviado.
        if (urlToken || !ls.get(DRAFT())) { answers = fullAnswers(row.answers); renderForm(); ls.set(DRAFT(), JSON.stringify(answers)); }
        sentAt = row.updated_at; if (open) renderSuccess();
      }
      if (urlToken) { const u = new URL(location.href); u.searchParams.delete("t"); history.replaceState(null, "", u.pathname + u.search); }
    } catch (e) {}
  }
}
boot();
</script>
</body>
</html>
