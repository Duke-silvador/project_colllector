<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#120b16">
<script>try{var t=localStorage.getItem("wt.theme")||"dusk";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dusk");}</script>
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vim">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Vim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="frame">
  <aside id="side">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" style="stroke:var(--red)" stroke-width="2.6"/><circle cx="12" cy="12" r="5.6" fill="none" style="stroke:var(--green)" stroke-width="2.6"/><circle cx="12" cy="12" r="1.9" style="fill:var(--cyan)"/></svg><span>Vim</span></div>
    <nav id="nav" aria-label="Main">
      <button class="tab" data-tab="summary"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg><span>Today</span></button>
      <button class="tab" data-tab="trends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Trends</span></button>
      <button class="tab fab" data-action="log" aria-label="Log weight"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button class="tab" data-tab="insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 00-3.5 10.9V17h7v-3.1A6 6 0 0012 3zM9.5 20.5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Insights</span></button>
      <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2.2"/></svg><span>Settings</span></button>
    </nav>
    <button class="btn primary logbtn" data-action="log">Log weight <kbd>L</kbd></button>
  </aside>
  <main id="content"><div id="view" tabindex="-1"></div></main>
</div>
<div id="toast" role="status"></div>
<script src="lib/xlsx.full.min.js"></script>
<script src="model.js"></script>
<script src="stats.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
