<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黑馬三顆星 - 旗艦賽事記分板</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=Fraunces:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --dark-bg: #071b19; --surface: rgba(19, 40, 37, 0.85); --gold: #e8bc70; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--dark-bg); color: #edf5eb; font-family: 'Work Sans', sans-serif; min-height: 100vh; }
    .glass { background: var(--surface); border: 1px solid rgba(192, 231, 209, 0.15); border-radius: 20px; backdrop-filter: blur(12px); }
    .display-font { font-family: 'Fraunces', serif; }
    .gold-text { color: var(--gold); }
    .active-player { border: 2px solid var(--gold); box-shadow: 0 0 25px rgba(232, 188, 112, 0.3); }
    .led-score { font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 0 10px rgba(255,255,255,0.6); }
    .led-yellow { color: #ffe066 !important; text-shadow: 0 0 10px rgba(255, 224, 102, 0.7); }
    .led-white { color: #ffffff !important; }
    .btn-action { transition: all 0.15s ease; }
    .btn-action:active { transform: scale(0.96); }
    dialog::backdrop { background: rgba(0, 10, 10, 0.85); backdrop-filter: blur(8px); }

    /* 浮動播放器外容器 */
    .floating-player {
      position: fixed;
      bottom: 20px;          /* 距離網頁底部 20px */
      right: 20px;           /* 距離網頁右側 20px */
      width: 300px;          /* 預設播放器寬度 */
      aspect-ratio: 16 / 9;   /* 保持 16:9 比例 */
      z-index: 9999;          /* 確保層級最高，不被其他網頁內容遮擋 */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); /* 加上質感陰影 */
      border-radius: 8px;    /* 圓角效果 */
      overflow: hidden;      /* 確保內容不超出圓角 */
      background-color: #000;
    }

    /* 讓 iframe 完全填滿浮動容器 */
    .floating-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 手機版適應：避免在小螢幕上擋住太多內容 */
    @media (max-width: 480px) {
      .floating-player {
        width: 200px;        /* 手機上縮小至 200px 寬 */
        bottom: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body class="p-3 sm:p-6 pb-28">

  <div class="max-w-7xl mx-auto">
    <!-- Header: 黑馬品牌標題與頻道連結 -->
    <header class="flex flex-wrap justify-between items-center gap-4 mb-6 glass p-4 sm:p-5">
      <div class="flex items-center gap-3">
        <div class="text-3xl">🐴</div>
        <div>
          <div class="flex items-baseline gap-2 flex-wrap">
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-wider text-amber-400 display-font">黑馬三顆星</h1>
            <span class="text-xs sm:text-sm font-semibold text-emerald-300/90 bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-0.5 rounded-md">(免費開侖記分板_1017)</span>
          </div>
          <p class="text-xs sm:text-sm text-emerald-200/70 mt-0.5">DARK HORSE 3-CUSHION MATCH BOARD</p>
        </div>
      </div>
      
      <!-- YouTube 頻道與社群按鈕 -->
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
        <a href="https://www.youtube.com/@taiwan3cushion" target="_blank" rel="noopener noreferrer" class="btn-action flex items-center gap-1.5 px-3.5 py-1.5 text-xs sm:text-sm font-bold rounded-lg bg-red-600 hover:bg-red-500 text-white shadow-lg border border-red-400/40">
          <span>🔴</span>
          <span>訂閱黑馬音樂頻道</span>
        </a>
        <a href="https://www.youtube.com/@taiwan3cushion" target="_blank" rel="noopener noreferrer" class="btn-action flex items-center gap-1.5 px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg bg-amber-400/20 text-amber-300 hover:bg-amber-400/30 border border-amber-400/40">
          <span>🌐</span>
          <span>社群連結</span>
        </a>
        <span id="match-status" class="px-3 py-1.5 text-xs sm:text-sm rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">尚未開始</span>
        <button onclick="toggleFullscreen()" class="px-3 py-1.5 text-xs sm:text-sm rounded-lg bg-white/10 hover:bg-white/20 border border-white/20">⛶ 全螢幕</button>
      </div>
    </header>

    <!-- Main Scoreboard Section -->
    <main class="grid md:grid-cols-[1fr_220px_1fr] gap-4 mb-6">
      
      <!-- Player 1 Panel -->
      <article id="player-card-0" class="glass p-5 flex flex-col justify-between bg-black/60 relative overflow-hidden transition-all duration-300">
        <div class="flex justify-between items-center">
          <span id="name-display-0" class="text-lg font-bold gold-text">選手一 (白球)</span>
          <span id="turn-tag-0" class="text-xs px-2.5 py-1 rounded-full bg-amber-400 text-black font-bold hidden">● 擊球中</span>
        </div>
        
        <div class="my-4 text-center">
          <div id="score-0" class="led-score display-font text-8xl sm:text-9xl font-black led-white">0</div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center text-xs text-emerald-100/70 mb-4 bg-white/5 p-2 rounded-xl">
          <div>Inning<br><strong id="inning-0" class="text-lg text-white font-bold">0</strong></div>
          <div>AVG<br><strong id="avg-0" class="text-lg text-amber-300 font-bold">0.000</strong></div>
          <div>High Run<br><strong id="hr-0" class="text-lg text-red-400 font-bold">0</strong></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button id="undo-0" onclick="addScore(0, -1)" class="btn-action bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl text-lg">- 1分</button>
          <button id="add-0" onclick="addScore(0, 1)" class="btn-action bg-red-600 hover:bg-red-500 text-white font-extrabold py-3 rounded-xl text-2xl">+1 分</button>
        </div>
      </article>

      <!-- Center Control / Timer -->
      <section class="glass p-5 flex flex-col justify-between text-center items-center">
        <!-- 1. 目標分數 -->
        <div>
          <div id="target-display" class="text-xl font-black text-amber-300 tracking-wide">目標 15 分</div>
        </div>

        <!-- 2. 當前進程 -->
        <div class="bg-black/40 border border-white/10 rounded-xl px-3 py-1.5 w-full text-center my-1">
          <span class="text-[10px] text-emerald-200/60 block">當前進程</span>
          <span id="current-inning-display" class="text-base font-bold text-emerald-200">第 1 桿</span>
        </div>

        <!-- 3. 失誤 / 換人 按鈕 -->
        <button id="switch-btn" onclick="switchTurn()" class="btn-action w-full bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold py-3 rounded-xl text-lg my-1">
          ⇦ 失誤 / 換人
        </button>

        <!-- 4. 比賽時間 -->
        <div class="bg-black/40 border border-white/10 rounded-xl px-3 py-1.5 w-full text-center my-1">
          <span class="text-[10px] text-emerald-200/60 block">比賽時間</span>
          <span id="elapsed-time" class="text-lg font-bold text-amber-300 font-mono">00:00</span>
        </div>

        <!-- 5. Shot Clock 擊球倒數 -->
        <div class="w-full my-1">
          <span class="text-[11px] text-emerald-200/60 block mb-0.5">Shot Clock 擊球倒數</span>
          <div id="timer" class="display-font text-5xl font-black led-score text-white my-1">40</div>
          <div class="w-full bg-white/10 h-2 rounded-full overflow-hidden mt-1">
            <div id="timer-bar" class="bg-amber-400 h-full w-full transition-all duration-200"></div>
          </div>
        </div>

        <!-- 6. 底部 Slogan -->
        <p class="text-[10px] text-emerald-100/50 mt-2">黑馬三顆星 ‧ 就是這樣中！</p>
      </section>

      <!-- Player 2 Panel -->
      <article id="player-card-1" class="glass p-5 flex flex-col justify-between bg-black/60 relative overflow-hidden transition-all duration-300">
        <div class="flex justify-between items-center">
          <span id="name-display-1" class="text-lg font-bold gold-text">選手二 (黃球)</span>
          <span id="turn-tag-1" class="text-xs px-2.5 py-1 rounded-full bg-amber-400 text-black font-bold hidden">● 擊球中</span>
        </div>

        <div class="my-4 text-center">
          <div id="score-1" class="led-score display-font text-8xl sm:text-9xl font-black led-yellow">0</div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center text-xs text-emerald-100/70 mb-4 bg-white/5 p-2 rounded-xl">
          <div>Inning<br><strong id="inning-1" class="text-lg text-white font-bold">0</strong></div>
          <div>AVG<br><strong id="avg-1" class="text-lg text-amber-300 font-bold">0.000</strong></div>
          <div>High Run<br><strong id="hr-1" class="text-lg text-red-400 font-bold">0</strong></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button id="undo-1" onclick="addScore(1, -1)" class="btn-action bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl text-lg">- 1分</button>
          <button id="add-1" onclick="addScore(1, 1)" class="btn-action bg-red-600 hover:bg-red-500 text-white font-extrabold py-3 rounded-xl text-2xl">+1 分</button>
        </div>
      </article>

    </main>

    <!-- Controls & Settings Section -->
    <section class="glass p-5 mb-6">
      <h2 class="text-lg font-bold gold-text mb-4">賽事參數設定</h2>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-xs text-emerald-200/70 mb-1">目標分數</label>
          <select id="target-score" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2.5 text-sm" onchange="updateTargetDisplay()">
            <option value="15" selected>15 分</option>
            <option value="25">25 分</option>
            <option value="30">30 分</option>
            <option value="40">40 分</option>
            <option value="50">50 分</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-emerald-200/70 mb-1">Shot Clock 秒數</label>
          <select id="shot-duration" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2.5 text-sm">
            <option value="30">30 秒</option>
            <option value="40" selected>40 秒</option>
            <option value="50">50 秒</option>
            <option value="60">60 秒</option>
          </select>
        </div>
      </div>

      <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs text-emerald-200/70 mb-1">選手一 姓名</label>
          <input id="name-input-0" type="text" value="林師傅" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2.5 text-sm font-bold" onchange="updateNames()">
        </div>
        <div>
          <label class="block text-xs text-emerald-200/70 mb-1">選手一 球色選擇</label>
          <select id="ball-color-0" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2.5 text-sm font-bold" onchange="onBallColorChange()">
            <option value="white" selected>⚪ 白球</option>
            <option value="yellow">🟡 黃球</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-emerald-200/70 mb-1">選手二 姓名</label>
          <input id="name-input-1" type="text" value="黑馬" class="w-full bg-slate-900 border border-white/20 rounded-lg p-2.5 text-sm font-bold" onchange="updateNames()">
        </div>
        <div>
          <label class="block text-xs text-emerald-200/70 mb-1">選手二 球色 (自動對應)</label>
          <select id="ball-color-1" class="w-full bg-slate-900/60 border border-white/10 rounded-lg p-2.5 text-sm font-bold text-gray-400" disabled>
            <option value="yellow" selected>🟡 黃球</option>
            <option value="white">⚪ 白球</option>
          </select>
        </div>
      </div>

      <div class="flex flex-wrap gap-3 mt-5">
        <button id="start-btn" onclick="startMatch()" class="btn-action bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold px-6 py-2.5 rounded-xl">開始比賽</button>
        <button id="pause-btn" onclick="pauseMatch()" class="btn-action bg-white/10 hover:bg-white/20 px-6 py-2.5 rounded-xl" disabled>暫停</button>
        <button onclick="resetMatch()" class="btn-action bg-red-900/60 hover:bg-red-800/80 text-red-200 px-6 py-2.5 rounded-xl">重設比賽</button>
        <button onclick="generateReport()" class="btn-action bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl ml-auto">📸 產生黑馬戰報圖</button>
      </div>
    </section>
  </div>

  <!-- 浮動播放器 HTML 區塊 -->
  <div class="floating-player">
    <iframe src="https://www.youtube.com/embed/videoseries?list=PLQvBYUHGQEcU" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen="">
    </iframe>
  </div>

  <!-- Winner Modal -->
  <dialog id="win-modal" class="p-6 text-center text-white glass border border-amber-400/40 rounded-3xl max-w-md w-full">
    <div class="text-4xl mb-2">🏆</div>
    <h2 class="text-2xl font-black text-amber-300 mb-2">MATCH COMPLETE</h2>
    <p id="win-summary" class="text-lg font-bold text-white mb-4"></p>
    <div class="flex justify-center gap-3">
      <button onclick="generateReport()" class="bg-amber-400 text-slate-950 font-extrabold px-5 py-2.5 rounded-xl">匯出 1:1 戰報圖</button>
      <button onclick="document.getElementById('win-modal').close()" class="bg-white/10 px-5 py-2.5 rounded-xl">關閉</button>
    </div>
  </dialog>

  <!-- Hidden Canvas for Report Generation -->
  <canvas id="report-canvas" width="1080" height="1080" class="hidden"></canvas>

  <script>
    // State management
    let scores = [0, 0], innings = [0, 0], currentRuns = [0, 0], highRuns = [0, 0];
    let names = ["林師傅", "黑馬"];
    let ballColors = ["white", "yellow"]; // 預設 選手一:白, 選手二:黃
    let activePlayer = 0, phase = 'idle', targetScore = 15, duration = 40, remaining = 40;
    let timer = null;

    // 比賽總計時（秒數）
    let totalElapsedSeconds = 0;
    let matchClockTimer = null;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function onBallColorChange() {
      const p1Color = document.getElementById('ball-color-0').value;
      const p2Select = document.getElementById('ball-color-1');

      if (p1Color === 'white') {
        ballColors = ['white', 'yellow'];
        p2Select.value = 'yellow';
      } else {
        ballColors = ['yellow', 'white'];
        p2Select.value = 'white';
      }

      // 更新得分大數字的 LED 顏色樣式
      for (let i = 0; i < 2; i++) {
        const scoreElem = document.getElementById(`score-${i}`);
        scoreElem.classList.toggle('led-white', ballColors[i] === 'white');
        scoreElem.classList.toggle('led-yellow', ballColors[i] === 'yellow');
      }

      updateNames();
    }

    function updateNames() {
      names[0] = document.getElementById('name-input-0').value || "選手一";
      names[1] = document.getElementById('name-input-1').value || "選手二";

      const c1Text = ballColors[0] === 'white' ? '白球' : '黃球';
      const c2Text = ballColors[1] === 'white' ? '白球' : '黃球';

      document.getElementById('name-display-0').textContent = `${names[0]} (${c1Text})`;
      document.getElementById('name-display-1').textContent = `${names[1]} (${c2Text})`;
    }

    function updateTargetDisplay() {
      targetScore = parseInt(document.getElementById('target-score').value);
      document.getElementById('target-display').textContent = `目標 ${targetScore} 分`;
    }

    function render() {
      for (let i = 0; i < 2; i++) {
        document.getElementById(`score-${i}`).textContent = scores[i];
        document.getElementById(`inning-${i}`).textContent = innings[i];
        document.getElementById(`hr-${i}`).textContent = highRuns[i];
        const avg = innings[i] > 0 ? (scores[i] / innings[i]).toFixed(3) : "0.000";
        document.getElementById(`avg-${i}`).textContent = avg;

        const isCurrent = (phase === 'running' && activePlayer === i);
        document.getElementById(`player-card-${i}`).classList.toggle('active-player', isCurrent);
        document.getElementById(`turn-tag-${i}`).classList.toggle('hidden', !isCurrent);
      }
      document.getElementById('timer').textContent = remaining;
      document.getElementById('timer-bar').style.width = `${(remaining / duration) * 100}%`;
      document.getElementById('elapsed-time').textContent = formatTime(totalElapsedSeconds);

      // 計算當前輪到第幾桿 (以最大局數 + 1 表示)
      const currentInning = Math.max(innings[0], innings[1]) + 1;
      document.getElementById('current-inning-display').textContent = `第 ${currentInning} 桿`;

      // 動態更新「失誤 / 換人」按鈕方向
      const switchBtn = document.getElementById('switch-btn');
      if (activePlayer === 0) {
        switchBtn.textContent = '⇦ 失誤 / 換人';
      } else {
        switchBtn.textContent = '失誤 / 換人 ⇨';
      }
    }

    function startMatch() {
      if (phase === 'finished') resetMatch();
      updateNames();
      updateTargetDisplay();
      duration = parseInt(document.getElementById('shot-duration').value);
      remaining = duration;
      phase = 'running';
      
      document.getElementById('start-btn').disabled = true;
      document.getElementById('pause-btn').disabled = false;
      document.getElementById('match-status').textContent = '比賽進行中';
      
      startTimer();
      startMatchClock();
      render();
    }

    function pauseMatch() {
      phase = 'paused';
      clearInterval(timer);
      clearInterval(matchClockTimer);
      document.getElementById('start-btn').disabled = false;
      document.getElementById('pause-btn').disabled = true;
      document.getElementById('match-status').textContent = '暫停中';
    }

    function resetMatch() {
      pauseMatch();
      scores = [0, 0]; innings = [0, 0]; currentRuns = [0, 0]; highRuns = [0, 0];
      activePlayer = 0; phase = 'idle'; remaining = 40;
      totalElapsedSeconds = 0;
      render();
      document.getElementById('match-status').textContent = '尚未開始';
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(() => {
        if (phase !== 'running') return;
        remaining--;
        if (remaining <= 0) {
          switchTurn();
        }
        render();
      }, 1000);
    }

    function startMatchClock() {
      clearInterval(matchClockTimer);
      matchClockTimer = setInterval(() => {
        if (phase !== 'running') return;
        totalElapsedSeconds++;
        document.getElementById('elapsed-time').textContent = formatTime(totalElapsedSeconds);
      }, 1000);
    }

    function addScore(playerIndex, delta) {
      if (phase !== 'running' || activePlayer !== playerIndex) return;
      
      if (delta > 0) {
        scores[playerIndex] += delta;
        currentRuns[playerIndex] += delta;
        if (currentRuns[playerIndex] > highRuns[playerIndex]) {
          highRuns[playerIndex] = currentRuns[playerIndex];
        }
        remaining = duration; // 重置 Shot Clock
      } else if (scores[playerIndex] > 0) {
        scores[playerIndex] += delta;
      }

      render();

      if (scores[playerIndex] >= targetScore) {
        finishMatch(names[playerIndex]);
      }
    }

    function switchTurn() {
      if (phase !== 'running') return;
      innings[activePlayer]++;
      currentRuns[activePlayer] = 0;
      activePlayer = 1 - activePlayer;
      remaining = duration;
      render();
    }

    function finishMatch(winnerName) {
      pauseMatch();
      phase = 'finished';
      document.getElementById('match-status').textContent = '比賽結束';
      document.getElementById('win-summary').textContent = `🏆 勝者：${winnerName}！ (${formatTime(totalElapsedSeconds)})`;
      document.getElementById('win-modal').showModal();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // 📸 黑馬三顆星 1:1 Canvas 自動繪製戰報（含球色與總時間）
    function generateReport() {
      const canvas = document.getElementById('report-canvas');
      const ctx = canvas.getContext('2d');

      // 背景色
      ctx.fillStyle = "#0c1815";
      ctx.fillRect(0, 0, 1080, 1080);

      // 邊框 Accent
      ctx.strokeStyle = "#e8bc70";
      ctx.lineWidth = 12;
      ctx.strokeRect(20, 20, 1040, 1040);

      // Header 標題區
      ctx.fillStyle = "#e8bc70";
      ctx.font = "bold 52px Fraunces, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🐴 黑馬三顆星 MATCH REPORT", 540, 100);

      const today = new Date().toISOString().split('T')[0];
      const timeStr = formatTime(totalElapsedSeconds);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "28px Work Sans, sans-serif";
      ctx.fillText(`${today}  |  ${targetScore} PTS MATCH  |  TIME: ${timeStr}`, 540, 145);

      // 繪製選手 1 與 選手 2 欄位
      const drawPlayerCard = (x, name, ballColor, score, inning, hr, isWinner) => {
        ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
        ctx.roundRect(x, 200, 420, 680, 20);
        ctx.fill();
        ctx.strokeStyle = isWinner ? "#e8bc70" : "rgba(255,255,255,0.1)";
        ctx.lineWidth = isWinner ? 6 : 2;
        ctx.stroke();

        const colorLabel = ballColor === 'white' ? ' (白球)' : ' (黃球)';

        ctx.fillStyle = "#e8bc70";
        ctx.font = "bold 38px Work Sans, sans-serif";
        ctx.fillText(name + colorLabel, x + 210, 270);

        // 得分數字
        ctx.fillStyle = ballColor === 'yellow' ? "#ffe066" : "#ffffff";
        ctx.font = "bold 110px Fraunces, sans-serif";
        ctx.fillText(score, x + 210, 420);

        const avg = inning > 0 ? (score / inning).toFixed(3) : "0.000";

        // 統計數據
        ctx.fillStyle = "#cbd5e1";
        ctx.font = "28px Work Sans, sans-serif";
        ctx.fillText(`Inning: ${inning}`, x + 210, 520);
        ctx.fillText(`AVG: ${avg}`, x + 210, 580);
        ctx.fillText(`High Run: ${hr}`, x + 210, 640);

        if (isWinner) {
          ctx.fillStyle = "#e8bc70";
          ctx.font = "bold 36px Work Sans, sans-serif";
          ctx.fillText("🏆 WINNER", x + 210, 780);
        }
      };

      const winnerIdx = scores[0] >= scores[1] ? 0 : 1;
      drawPlayerCard(70, names[0], ballColors[0], scores[0], innings[0], highRuns[0], winnerIdx === 0);
      drawPlayerCard(590, names[1], ballColors[1], scores[1], innings[1], highRuns[1], winnerIdx === 1);

      // VS
      ctx.fillStyle = "#e8bc70";
      ctx.font = "bold 48px Fraunces, sans-serif";
      ctx.fillText("VS", 540, 460);

      // Footer Slogan
      ctx.fillStyle = "#e8bc70";
      ctx.font = "bold 36px Work Sans, sans-serif";
      ctx.fillText("黑馬三顆星 ‧ 就是這樣中！", 540, 980);

      // 下載圖片
      const link = document.createElement('a');
      link.download = `黑馬三顆星戰報_${names[0]}VS${names[1]}_${today}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Initialize display
    onBallColorChange();
    updateTargetDisplay();
    render();
  </script>
</body>
