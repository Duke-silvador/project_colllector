<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Vakento</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="css/vakento.css?v=cookie1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="wrap site-top">
      <a class="logo" href="index.html"><span class="mark">V</span> Vakento</a>
      <span class="muted">Alleen voor de baas</span>
    </div>
  </header>
  <section class="wrap" style="padding:28px 0 72px">
    <p class="kicker">Admin</p>
    <h1>Alles in één scherm.</h1>
    <p class="muted">Leden, iDEAL via Mollie, cloud en AI. Eerste account of hallo@leukonline.nl is baas.</p>

    <form class="card stack" data-login style="margin-top:24px;max-width:420px">
      <h3>Inloggen</h3>
      <label>E-mail<input name="email" type="email" required value="hallo@leukonline.nl"></label>
      <label>Wachtwoord<input name="password" type="password" required minlength="8"></label>
      <button class="btn" type="submit">Open admin</button>
    </form>
    <form class="card stack" data-reg style="margin-top:16px;max-width:420px">
      <h3>Eerste keer: baas-account maken</h3>
      <label>Naam<input name="name" value="LeukOnline"></label>
      <label>E-mail<input name="email" type="email" required value="hallo@leukonline.nl"></label>
      <label>Wachtwoord<input name="password" type="password" required minlength="8"></label>
      <button class="btn btn-ghost" type="submit">Account maken</button>
      <p class="warn" data-err hidden></p>
    </form>

    <div data-board hidden>
      <div data-stats style="margin:28px 0"></div>
      <h2>Leden</h2>
      <div class="table-wrap" style="overflow:auto;margin:12px 0 28px">
        <table class="table"><thead><tr><th>Zaak</th><th>Lid</th><th>Abonnement</th><th>Cloud</th><th>Rol</th><th>Beheer</th></tr></thead><tbody data-users></tbody></table>
      </div>
      <h2>Betalingen</h2>
      <div class="table-wrap" style="overflow:auto">
        <table class="table"><thead><tr><th>iDEAL</th><th>Sku</th><th>Bedrag</th><th>Status</th></tr></thead><tbody data-pay></tbody></table>
      </div>
    </div>
  </section>
  <script type="module" src="js/admin.js?v=admin2"></script>
  <script src="js/cookies.js?v=cookie1"></script>
</body>
</html>
