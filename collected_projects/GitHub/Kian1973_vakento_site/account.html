<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mijn account | Vakento</title>
  <link rel="stylesheet" href="css/vakento.css?v=cloud1">
  <link rel="stylesheet" href="css/vakento-public.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .account-login-page{min-height:calc(100vh - 90px);display:grid;place-items:start center;padding:56px 16px}
    .account-login-card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}
    .account-login-card h1{margin:8px 0 18px;max-width:none;font-size:clamp(2rem,5vw,3rem)}
  </style>
</head>
<body>
  <header>
    <div class="wrap site-top">
      <a class="logo" href="index.html"><span class="mark">V</span> Vakento</a>
    </div>
  </header>

  <main class="account-login-page">
    <section class="account-login-card">
      <p class="kicker">Mijn account</p>
      <h1>Direct naar je eigen Vakento.</h1>
      <form class="stack" data-login>
        <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
        <label>Wachtwoord<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn" type="submit">Mijn account</button>
        <button class="btn btn-ghost" type="button" data-forgot-open>Wachtwoord vergeten?</button>
        <p class="warn" data-err hidden></p>
      </form>

      <div style="margin-top:18px;padding-top:18px;border-top:1px solid var(--line)">
        <p class="kicker">Vakento app</p>
        <p class="muted">Gebruik je telefooncamera voor bonnen en werkfoto's en sla ze direct op in je Vakento Cloud.</p>
        <a class="btn" href="/app.html" style="width:100%;margin-top:10px">Open Vakento app</a>
        <button class="btn btn-ghost" type="button" data-install-app hidden style="width:100%;margin-top:8px">Installeer app op telefoon</button>
        <p class="muted" data-install-msg hidden style="margin-top:8px"></p>
      </div>

      <form class="stack" data-forgot hidden style="margin-top:18px;padding-top:18px;border-top:1px solid var(--line)">
        <p class="kicker">Wachtwoord herstellen</p>
        <p class="muted">Vul je e-mailadres in. Je ontvangt een link om een nieuw wachtwoord te kiezen.</p>
        <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
        <button class="btn" type="submit">Herstellink versturen</button>
        <button class="btn btn-ghost" type="button" data-forgot-cancel>Terug naar inloggen</button>
        <p class="muted" data-forgot-msg hidden></p>
      </form>
    </section>
  </main>

  <script type="module" src="js/pay.js?v=account4"></script>
  <script src="/js/install-app.js?v=app2"></script>
</body>
</html>
