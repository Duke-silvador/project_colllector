<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta -->
    <meta name="theme-color" content="#b91c1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zamzam Foods" />

    <!-- SEO -->
    <meta name="description" content="Zamzam Foods Business Management System — Kubbus & Romali wholesale distribution, driver dispatch, delivery routes, and credit ledger." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Aggressive Cache Busting Meta -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Zamzam Foods — Distribution Management</title>
    
    <script>
      // PWA Service Worker Registration
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http') && !window.__TAURI_INTERNALS__) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Zamzam PWA active with scope:', reg.scope);
          }).catch(function(err) {
            console.warn('PWA service worker registration failed:', err);
          });
        });
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
