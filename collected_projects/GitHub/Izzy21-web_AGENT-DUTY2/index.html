function drawHUD(){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(12,12,245,84);ctx.fillStyle='#e7e3d8';ctx.font='bold 17px sans-serif';ctx.textAlign='left';ctx.fillText(`AGENT  •  ${difficulty}`,24,35);bar(24,45,190,12,player.hp/100,'#d4483d');ctx.fillStyle='#eee';ctx.font='12px sans-serif';ctx.fillText(`HP ${Math.ceil(player.hp)}   ARMOR ${Math.ceil(player.armor)}`,24,73);bar(24,79,190,7,player.armor/100,'#4c9bdc');let w=player.weap[player.cur];ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(W-255,12,243,72);ctx.textAlign='right';ctx.fillStyle='#f0d17b';ctx.font='bold 17px sans-serif';ctx.fillText(w.name,W-24,36);ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText(`${w.ammo} / ${w.mags} MAG`,W-24,63);ctx.textAlign='left';ctx.fillStyle='#eee';ctx.font='13px sans-serif';ctx.fillText(`LANTAI ${Math.min(player.floor+1,DIFF[difficulty].floors+1)}  •  MUSUH ${enemies.filter(e=>e.hp>0).length}  •  SKOR ${player.kills}`,18,H-18);ctx.textAlign='center';ctx.font='12px sans-serif';ctx.fillStyle='#ddd';ctx.fillText('1 PISTOL   2 RIFLE   3 SHOTGUN',W/2,H-18)}
function bar(x,y,w,h,f,col){ctx.fillStyle='#312c2a';ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x,y,w*clamp(f,0,1),h)}
function drawMenu(){ctx.fillStyle='#0e0b0e';ctx.fillRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#25171c');g.addColorStop(1,'#08090c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#a88342';ctx.font='bold 60px Georgia';ctx.textAlign='center';ctx.fillText('AGENT DUTY',W/2,100);ctx.fillStyle='#c8b8a1';ctx.font='18px sans-serif';ctx.fillText(mode==='main'?'Bersihkan mansion. Hentikan komplotannya.':mode==='diff'?'PILIH TINGKAT KESULITAN':'MISSION CONTROL',W/2,145);let rows=mode==='main'?['START GAME','SETTINGS','QUIT']:mode==='diff'?[...diffNames,'BACK']:['Sensitivitas mouse: '+settings.sens,'Volume: '+settings.vol,'KEMBALI'];let y=205;rows.forEach((r,i)=>{ctx.fillStyle=i===menuSel?'#612d2a':'#20191a';ctx.fillRect(W/2-210,y+i*56,420,44);if(i===menuSel){ctx.strokeStyle='#d6ad5d';ctx.lineWidth=2;ctx.strokeRect(W/2-210,y+i*56,420,44)}ctx.fillStyle=i===menuSel?'#ffdfa0':'#d5c8b8';ctx.font='bold 21px sans-serif';ctx.fillText(r,W/2,y+28+i*56)});if(mode==='diff'){ctx.font='14px sans-serif';ctx.fillStyle='#c8b8a1';ctx.fillText(DIFF[diffNames[menuSel]]?.desc||'',W/2,430)}ctx.font='13px sans-serif';ctx.fillStyle='#9b9187';ctx.fillText('Klik pilihan atau gunakan ↑ ↓ lalu ENTER',W/2,H-30)}
function drawOverlay(){ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=mode==='clear'?'#9fe5a7':mode==='pause'?'#f1d17b':'#ed6c5f';ctx.font='bold 50px Georgia';let title=mode==='pause'?'PAUSE':mode==='dead'?'MISSION FAILED':mode==='over'?'GAME OVER':mode==='clear'?'LANTAI BERSIH':'MISSION COMPLETE';ctx.fillText(title,W/2,H/2-55);ctx.fillStyle='#eee';ctx.font='18px sans-serif';let lines=mode==='pause'?['ESC = lanjutkan   •   M = menu utama']:mode==='dead'?[`ENTER = lanjut dari checkpoint (${player.conts} continue tersisa)`,'ESC = menu utama']:mode==='over'?['Continue habis.','ENTER = menu utama']:mode==='clear'?[`Lantai ${player.floor+1} selesai.`,`ENTER = ${player.floor===DIFF[difficulty].floors?'lihat hasil misi':'lanjut ke lantai berikutnya'}`]:['Don Vargo dan komplotannya telah dikalahkan.','ENTER = menu utama'];lines.forEach((l,i)=>ctx.fillText(l,W/2,H/2+5+i*32));if(mode==='ending'){ctx.font='bold 30px sans-serif';ctx.fillStyle='#f0cf70';ctx.fillText('RANK '+endingRank,W/2,H/2+105)}}
function activateMenu(){if(mode==='main'){if(menuSel===0){mode='diff';menuSel=1}else if(menuSel===1){mode='settings';menuSel=0}else mode='quit'}else if(mode==='diff'){if(menuSel<3)startGame(diffNames[menuSel]);else{mode='main';menuSel=0}}else if(mode==='settings'){if(menuSel===2){mode='main';menuSel=1}}}
function clickMenu(x,y){if(mode==='play'){return}let i=Math.floor((y-205)/56);if(y>=205&&i>=0){let rows=mode==='main'?3:mode==='diff'?4:3;if(i<rows){menuSel=i;activateMenu()}}}
c.addEventListener('click',e=>{if(mode==='play'){if(!mouseLocked)c.requestPointerLock?.();return}let r=c.getBoundingClientRect();clickMenu((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H)});
c.addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('mousedown',e=>{if(mode==='play'&&e.button===2){scope=true}if(mode==='play'&&e.button===0){fireHeld=true;shoot()}});window.addEventListener('mouseup',e=>{if(e.button===0)fireHeld=false;if(e.button===2)scope=false});document.addEventListener('pointerlockchange',()=>{mouseLocked=document.pointerLockElement===c});document.addEventListener('mousemove',e=>{if(mouseLocked)mouseDX+=e.movementX});
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(mode==='play'){if(k==='escape'){if(document.pointerLockElement)document.exitPointerLock();mode='pause'}else if(k==='r')startReload();else if(k==='1')switchWeapon(0);else if(k==='2')switchWeapon(1);else if(k==='3')switchWeapon(2);return}if(['pause','dead','over','clear','ending'].includes(mode)){if(k==='escape'){if(mode==='pause'){mode='play';c.requestPointerLock?.()}else{mode='main';menuSel=0}}else if(k==='m'&&mode==='pause'){mode='main';menuSel=0}else if(k==='enter'){if(mode==='pause'){mode='play';c.requestPointerLock?.()}else if(mode==='dead'){if(player.conts>0){let cp=player.checkpoint;player.x=cp.x;player.y=cp.y;player.a=cp.a;player.hp=Math.max(cp.hp,60);player.armor=cp.armor;player.weap=cp.weap.map(w=>({...w}));player.cur=cp.cur;player.conts--;player.used++;player.inv=3;enemies.forEach(e=>e.awake=true);mode='play'}}else if(mode==='clear'){if(player.floor<DIFF[difficulty].floors){player.floor++;player.hp=Math.min(100,player.hp+30);player.armor=Math.min(100,player.armor+25);player.weap.forEach(w=>w.mags=Math.min(9,w.mags+1));newFloor();mode='play'}else{mode='ending';let pts=100-player.used*12+({EASY:0,MEDIUM:5,HARD:12}[difficulty]);endingRank=pts>=90?'S':pts>=75?'A':pts>=55?'B':'C'}}else if(['over','ending'].includes(mode)){mode='main';menuSel=0}}return}if(k==='escape'){if(mode!=='main'){mode='main';menuSel=0}}else if(k==='arrowdown'){menuSel=(menuSel+1)%(mode==='main'?3:mode==='diff'?4:3)}else if(k==='arrowup'){menuSel=(menuSel-1+(mode==='main'?3:mode==='diff'?4:3))%(mode==='main'?3:mode==='diff'?4:3)}else if(k==='enter'||k===' '){activateMenu()}else if(mode==='settings'&&(k==='arrowleft'||k==='arrowright')){let d=k==='arrowright'?1:-1;if(menuSel===0)settings.sens=clamp(settings.sens+d,1,10);if(menuSel===1)settings.vol=clamp(settings.vol+d,0,10)}});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});document.getElementById('fireTouch').addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;shoot()});['pointerup','pointercancel','pointerleave'].forEach(ev=>document.getElementById('fireTouch').addEventListener(ev,()=>fireHeld=false));
function frame(now){let dt=Math.min((now-last)/1000,.04);last=now;if(mode==='play')update(dt);if(mode==='quit'){mode='main'}if(['play','pause','dead','over','clear','ending'].includes(mode))render();else drawMenu();requestAnimationFrame(frame)}
// Keyboard menus and click overlays need their own event handling for overlay states.
const oldRender=render;render=function(){if(['pause','dead','over','clear','ending'].includes(mode)){ // show last game scene beneath overlay
  let saved=mode;mode='play';oldRender();mode=saved;drawOverlay();return}oldRender()};
requestAnimationFrame(frame);
})();
</script></body></html>
