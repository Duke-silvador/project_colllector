/* ---------------------------------------------------------------
   Tombola Ninety — a 90-ball blower.
   Single committed visual world: a machine in a dark hall.
   No light theme by design; every colour is painted explicitly.
   --------------------------------------------------------------- */
:root{
  --ink:#070A0F;
  --panel:#0D131B;
  --line:#1C2634;
  --text:#E6EDF7;
  --muted:#8593A6;
  --dim:#5D6B7E;
  --brass:#E3B451;
  --brass-lo:#B8862B;

  --d1:#FF4136; --i1:#2E0703;
  --d2:#FF8C1A; --i2:#2B1500;
  --d3:#FFCE21; --i3:#2B2100;
  --d4:#9BE24A; --i4:#14260A;
  --d5:#16C97E; --i5:#032417;
  --d6:#16C2D5; --i6:#03232A;
  --d7:#4D8DFF; --i7:#061B3D;
  --d8:#A67CFF; --i8:#1C0C3D;
  --d9:#EC48B8; --i9:#330729;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{
  height:100%;
  display:flex;
  flex-direction:column;
  padding:0 14px;
  padding-block:8px 12px;
  gap:10px;
}

/* ---------- header ---------- */
.bar{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
}
.mark{
  display:grid;
  grid-template-columns:repeat(3,4px);
  grid-auto-rows:4px;
  gap:2px;
  flex:0 0 auto;
}
.mark i{display:block;width:4px;height:4px;border-radius:50%;background:var(--m)}
.wordmark{
  font-family:'Archivo Black',Impact,sans-serif;
  font-size:13px;
  letter-spacing:.13em;
  line-height:1;
  text-transform:uppercase;
}
.wordmark b{color:var(--brass);font-weight:inherit}
.bar .spacer{flex:1}
.left{
  font-size:11px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--muted);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.left b{
  font-family:'Archivo Black',sans-serif;
  color:var(--text);
  font-size:13px;
  font-weight:inherit;
  margin-right:3px;
}
.reset{
  flex:0 0 auto;
  height:30px;
  padding:0 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.02);
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.07em;
  text-transform:uppercase;
  cursor:pointer;
  transition:color .18s,border-color .18s,background .18s;
}
.reset:hover{color:var(--text);border-color:#2C3A4C}
.burger{
  flex:0 0 auto;
  width:34px;height:32px;
  display:grid;place-items:center;
  padding:0;
  border-radius:10px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.02);
  color:var(--text);
  cursor:pointer;
  transition:border-color .18s,background .18s;
}
.burger:hover{border-color:#2C3A4C;background:rgba(255,255,255,.05)}
.burger span{
  display:block;
  width:15px;height:1.8px;
  border-radius:2px;
  background:currentColor;
  box-shadow:0 -5px 0 currentColor, 0 5px 0 currentColor;
}
.icon{
  flex:0 0 auto;
  width:32px;height:30px;
  display:grid;place-items:center;
  padding:0;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.02);
  color:var(--muted);
  cursor:pointer;
  transition:color .18s,border-color .18s;
}
.icon:hover{color:var(--text);border-color:#2C3A4C}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon svg .cone{fill:currentColor;stroke-width:1.2}
.icon .mute{opacity:0}
.icon[aria-pressed="false"]{color:var(--dim)}
.icon[aria-pressed="false"] .wv{opacity:0}
.icon[aria-pressed="false"] .mute{opacity:1}
.reset.armed{
  color:#FFD9D4;
  border-color:#7A2A22;
  background:rgba(122,42,34,.3);
}

/* ---------- body layout ---------- */
.body{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.stage{
  flex:1 1 auto;
  min-height:200px;
  position:relative;
}
.stage canvas{display:block;width:100%;height:100%}
.panel{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* ---------- decade legend ---------- */
.decades{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:5px;
}
.dec{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  min-width:0;
}
.dec .sw{
  width:100%;
  height:26px;
  border-radius:8px;
  display:grid;
  place-items:center;
  background:var(--c);
  color:var(--i);
  font-family:'Archivo Black',sans-serif;
  font-size:12px;
  line-height:1;
  font-variant-numeric:tabular-nums;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2), inset 0 2px 3px rgba(255,255,255,.35), 0 3px 10px -4px var(--c);
  transition:background .25s,color .25s,box-shadow .25s;
}
.dec .rg{
  font-size:9px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--dim);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.dec.empty .sw{
  background:transparent;
  border:1px dashed var(--line);
  color:var(--dim);
  box-shadow:none;
}

/* ---------- called strip ---------- */
.recent{
  height:50px;
  display:flex;
  align-items:center;
  gap:7px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.recent::-webkit-scrollbar{display:none}
.recent .none{
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--dim);
}
.rb{
  flex:0 0 auto;
  width:34px;height:34px;
  border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(120% 120% at 34% 26%, var(--hi), var(--c) 55%, var(--lo));
  color:var(--i);
  font-family:'Archivo Black',sans-serif;
  font-size:13px;
  font-variant-numeric:tabular-nums;
  box-shadow:0 3px 9px -4px var(--c);
}
.rb.u span{border-bottom:2px solid currentColor;padding-bottom:1px}
.rb.first{
  width:44px;height:44px;font-size:17px;
  box-shadow:0 0 0 2px rgba(255,255,255,.16), 0 5px 16px -5px var(--c);
}

/* ---------- called strip: history button ---------- */
.strip{
  display:flex;
  align-items:center;
  gap:8px;
}
.hist{
  flex:0 0 auto;
  width:44px;height:44px;
  display:grid;place-items:center;
  padding:0;
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.02);
  color:var(--muted);
  cursor:pointer;
  transition:color .18s,border-color .18s;
}
.hist:hover{color:var(--text);border-color:#2C3A4C}
.hist svg{width:20px;height:20px;fill:currentColor}
.strip .recent{flex:1 1 auto;min-width:0}

/* ---------- history sheet ---------- */
.sheet{
  position:fixed;
  inset:0;
  z-index:40;
  display:flex;
  align-items:flex-end;
  background:rgba(4,7,11,.72);
}
.sheet-card{
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  background:var(--panel);
  border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  gap:14px;
  box-shadow:0 -24px 60px -20px rgba(0,0,0,.8);
}
.sheet-bar{
  display:flex;
  align-items:baseline;
  gap:10px;
}
.sheet-title{
  font-family:'Archivo Black',Impact,sans-serif;
  font-size:15px;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.sheet-count{
  font-size:11px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.sheet-bar .spacer{flex:1}
.sheet-x{
  height:30px;
  padding:0 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.02);
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.07em;
  text-transform:uppercase;
  cursor:pointer;
}
.sheet-x:hover{color:var(--text);border-color:#2C3A4C}

/* One row per decade: the board doubles as the colour key. */
.board{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px;
}
.cell{
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  color:var(--dim);
  border:1px solid var(--line);
  transition:background .2s,color .2s;
}
.cell.on{
  background:var(--c);
  color:var(--i);
  border-color:transparent;
  font-family:'Archivo Black',sans-serif;
  font-weight:400;
}
.cell.now{box-shadow:0 0 0 2px rgba(255,255,255,.65)}
.ord-label{
  font-size:10px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--dim);
  margin-bottom:7px;
}
.ord{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
.ord b{
  font-family:'Archivo Black',sans-serif;
  font-weight:400;
  font-size:12px;
  font-variant-numeric:tabular-nums;
  padding:3px 7px;
  border-radius:7px;
  color:var(--i);
  background:var(--c);
}
.ord b.now{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.ord .none,.recent .none{
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--dim);
}

/* ---------- draw ---------- */
.draw{
  width:100%;
  height:60px;
  border:0;
  border-radius:16px;
  font-family:'Archivo Black',Impact,sans-serif;
  font-size:17px;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:#241703;
  background:linear-gradient(180deg,#F5D081,#D8A136 52%,#B98120);
  box-shadow:0 12px 26px -12px rgba(227,180,81,.8), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,0,0,.2);
  cursor:pointer;
  transition:transform .09s,box-shadow .2s,filter .2s;
}
.draw:active{transform:translateY(2px);box-shadow:0 6px 16px -12px rgba(227,180,81,.8), inset 0 1px 0 rgba(255,255,255,.5)}
.draw[disabled]{
  cursor:default;
  color:var(--dim);
  background:linear-gradient(180deg,#141B25,#0F151D);
  box-shadow:inset 0 0 0 1px var(--line);
  transform:none;
}

/* ---------- game size: chooser and menu ---------- */
.pick{
  position:fixed;
  inset:0;
  z-index:60;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
  background:rgba(5,8,12,.86);
}
.pick.menu{align-items:flex-end;padding:0}
.pick-card{
  width:100%;
  max-width:360px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 18px 18px;
  display:flex;
  flex-direction:column;
  gap:14px;
  box-shadow:0 30px 70px -24px rgba(0,0,0,.9);
}
.pick.menu .pick-card{
  max-width:none;
  border-radius:20px 20px 0 0;
  border-left:0;border-right:0;border-bottom:0;
  padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
}
.pick-title{
  font-family:'Archivo Black',Impact,sans-serif;
  font-size:19px;
  letter-spacing:.04em;
  text-wrap:balance;
}
.pick-sub{
  margin-top:-8px;
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
}
.sizes{display:flex;flex-direction:column;gap:9px}
.size{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:13px 14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.02);
  color:var(--text);
  text-align:left;
  cursor:pointer;
  transition:border-color .16s,background .16s;
}
.size:hover{border-color:#31435A;background:rgba(255,255,255,.05)}
.size .n{
  font-family:'Archivo Black',Impact,sans-serif;
  font-size:23px;
  line-height:1;
  min-width:42px;
  font-variant-numeric:tabular-nums;
}
.size .t{font-size:12px;font-weight:600;letter-spacing:.02em}
.size .t small{
  display:block;
  font-weight:500;
  letter-spacing:0;
  color:var(--muted);
  margin-top:2px;
}
.size .dots{margin-left:auto;display:flex;gap:3px}
.size .dots i{width:6px;height:6px;border-radius:50%;background:var(--m)}
.size.on{border-color:var(--brass);background:rgba(227,180,81,.09)}
.size.on .n{color:var(--brass)}
.pick-note{
  font-size:11px;
  line-height:1.5;
  color:var(--dim);
  text-align:center;
}
.pick-x{
  align-self:center;
  height:30px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.07em;
  text-transform:uppercase;
  cursor:pointer;
}
.pick-x:hover{color:var(--text);border-color:#2C3A4C}

/* ---------- reveal ---------- */
.reveal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--ink);
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));
  cursor:pointer;
  overflow:hidden;
}
.reveal::before{
  content:'';
  position:absolute;
  inset:-25%;
  background:radial-gradient(42% 32% at 50% 46%, var(--glow), transparent 72%);
  pointer-events:none;
}
.confetti{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}
.rv-top{
  position:relative;
  z-index:2;
  font-size:11px;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.rv-ball{
  --d:min(92vw, 60vh);
  position:relative;
  z-index:2;
  width:var(--d);
  height:var(--d);
  flex:0 0 auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:radial-gradient(118% 118% at 33% 25%, var(--hi) 0%, var(--c) 44%, var(--lo) 100%);
  box-shadow:0 46px 100px -34px var(--c), inset 0 -22px 46px rgba(0,0,0,.3), inset 0 14px 34px rgba(255,255,255,.22);
}
.rv-ball::after{
  content:'';
  position:absolute;
  left:13%;top:9%;
  width:35%;height:21%;
  border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.72), rgba(255,255,255,0));
  transform:rotate(-18deg);
  pointer-events:none;
}
#rvNum{
  position:relative;
  z-index:2;
  font-family:'Archivo Black',Impact,sans-serif;
  font-size:calc(var(--d) * .50);
  line-height:.8;
  letter-spacing:-.035em;
  color:var(--i);
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 rgba(255,255,255,.16);
}
.rv-ball.one #rvNum{font-size:calc(var(--d) * .62)}
.rv-ball.u #rvNum{
  border-bottom:calc(var(--d) * .035) solid currentColor;
  padding-bottom:calc(var(--d) * .05);
}
.rv-foot{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  text-align:center;
}
.rv-range{
  font-size:11px;
  font-weight:600;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.rv-call{
  font-family:'Fraunces',Georgia,'Times New Roman',serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(20px,6.4vw,30px);
  line-height:1.1;
  color:var(--c);
  text-wrap:balance;
}
.rv-hint{
  margin-top:3px;
  font-size:10px;
  font-weight:600;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--dim);
  animation:breathe 2.4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- landscape / short screens ---------- */
@media (orientation:landscape) and (max-height:560px){
  .body{flex-direction:row;align-items:stretch}
  .stage{min-height:0}
  .panel{width:min(48%,380px);justify-content:flex-end}
  .recent{height:44px}
  .draw{height:52px;font-size:15px}
  .rv-ball{--d:min(60vw, 66vh)}
}

@media (prefers-reduced-motion:reduce){
  .rv-hint{animation:none;opacity:.7}
  .draw{transition:none}
}
</style>

    </div>
  </div>
</div>

<div class="pick" id="pick" hidden>
  <div class="pick-card" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <div class="pick-title" id="pickTitle">Which game?</div>

<div class="sheet" id="sheet" hidden>

    <div class="rv-hint">Tap anywhere to continue</div>
  </div>
</div>

<p class="sr" id="live" role="status" aria-live="assertive"></p>

<script>
(function(){
'use strict';

var TAU = Math.PI * 2;

/* Nine hues, ten balls to each. Every ground is light enough to carry its own
   near-black ink, so the number reads the same way on every ball. */
var HUES = [
  {c:'#FF4136', i:'#2E0703'},
  {c:'#FF8C1A', i:'#2B1500'},
  {c:'#FFCE21', i:'#2B2100'},
  {c:'#9BE24A', i:'#14260A'},
  {c:'#16C97E', i:'#032417'},
  {c:'#16C2D5', i:'#03232A'},
  {c:'#4D8DFF', i:'#061B3D'},
  {c:'#A67CFF', i:'#1C0C3D'},
  {c:'#EC48B8', i:'#330729'}
];

/* The three games. A short game just uses fewer hues; the last band of 45 is
   half a decade, which the range labels show honestly as 41-45. */
var SIZES = [
  {n:30, name:'Speed',   blurb:'Three colours. A few minutes.'},
  {n:45, name:'Short',   blurb:'Five colours. Half a house.'},
  {n:90, name:'Full house', blurb:'All nine colours. The long game.'}
];

var MAX = 90;
var DECADES = [];

function buildDecades(max){
  var out = [];
  for (var i = 0; i * 10 < max; i++){
    out.push({
      from: i * 10 + 1,
      to: Math.min(max, i * 10 + 10),
      c: HUES[i].c,
      i: HUES[i].i
    });
  }
  return out;
}

/* The traditional calls. Index 0 is ball 1. */
var CALLS = [
  "Kelly's eye","One little duck","Cup of tea","Knock at the door","Man alive",
  "Half a dozen","Lucky seven","Garden gate","Doctor's orders","Downing Street",
  "Legs eleven","One dozen","Unlucky for some","Valentine's Day","Young and keen",
  "Sweet sixteen","Dancing queen","Coming of age","Goodbye teens","One score",
  "Key of the door","Two little ducks","Thee and me","Two dozen","Duck and dive",
  "Half a crown","Gateway to heaven","In a state","Rise and shine","Dirty Gertie",
  "Get up and run","Buckle my shoe","All the threes","Ask for more","Jump and jive",
  "Three dozen","More than eleven","Christmas cake","Those famous steps","Life begins",
  "Time for fun","Winnie the Pooh","Down on your knees","Droopy drawers","Halfway there",
  "Up to tricks","Four and seven","Four dozen","Nick nick","Half a century",
  "Tweak of the thumb","Danny La Rue","Stuck in the tree","Clean the floor","Snakes alive",
  "Was she worth it?","Heinz varieties","Make them wait","Brighton line","Five dozen",
  "Baker's bun","Tickety-boo","Tickle me","Almost retired","Retirement age",
  "Clickety click","Stairway to heaven","Saving grace","Either way up","Three score and ten",
  "Bang on the drum","Six dozen","Queen bee","Hit the floor","Strive and strive",
  "Trombones","Two little crutches","Heaven's gate","One more time","Gandhi's breakfast",
  "Stop and run","Straight on through","Time for tea","Seven dozen","Staying alive",
  "Between the sticks","Torquay in Devon","Two fat ladies","Nearly there","Top of the shop"
];

var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var T = REDUCED
  ? {blow:220, eject:200, chute:280, pause:60}
  : {blow:1150, eject:560, chute:950, pause:180};

/* ---------------- colour helpers ---------------- */
function rgb(hex){
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function mix(hex, target, amt){
  var a = rgb(hex);
  return 'rgb(' + a.map(function(v){ return Math.round(v + (target - v) * amt); }).join(',') + ')';
}
function lighten(hex, amt){ return mix(hex, 255, amt); }
function darken(hex, amt){ return mix(hex, 0, amt); }
function rgba(hex, a){ return 'rgba(' + rgb(hex).join(',') + ',' + a + ')'; }

function decOf(n){ return Math.floor((n - 1) / 10); }

/* ---------------- state ---------------- */
var pool = [];
var called = [];

var STORE = 'tombola90.v1';
var STORE_SIZE = 'tombola90.size';

function save(){
  try { localStorage.setItem(STORE, JSON.stringify({n: MAX, called: called})); } catch(e){}
}
function load(){
  try {
    var raw = localStorage.getItem(STORE);
    if (!raw) return null;
    var v = JSON.parse(raw);
    if (Array.isArray(v)) v = {n: 90, called: v};      // pre-variant save format
    if (!v || v.n !== MAX || !Array.isArray(v.called)) return null;
    return v.called.filter(function(n){ return n >= 1 && n <= MAX; });
  } catch(e){ return null; }
}
function loadSize(){
  try {
    var v = parseInt(localStorage.getItem(STORE_SIZE), 10);
    for (var i = 0; i < SIZES.length; i++) if (SIZES[i].n === v) return v;
    return null;
  } catch(e){ return null; }
}
function saveSize(){
  try { localStorage.setItem(STORE_SIZE, String(MAX)); } catch(e){}
}

/* ---------------- dom ---------------- */
var stage     = document.getElementById('stage');
var canvas    = document.getElementById('machine');
var ctx       = canvas.getContext('2d');
var decadesEl = document.getElementById('decades');
var recentEl  = document.getElementById('recent');
var drawBtn   = document.getElementById('drawBtn');
var resetBtn  = document.getElementById('resetBtn');
var remainEl  = document.getElementById('remaining');
var liveEl    = document.getElementById('live');
var reveal    = document.getElementById('reveal');
var rvBall    = document.getElementById('rvBall');
var rvNum     = document.getElementById('rvNum');
var rvRange   = document.getElementById('rvRange');
var rvCall    = document.getElementById('rvCall');
var rvIndex   = document.getElementById('rvIndex');
var menuBtn   = document.getElementById('menuBtn');
var wordNum   = document.getElementById('wordNum');
var pickEl    = document.getElementById('pick');
var pickTitle = document.getElementById('pickTitle');
var pickSub   = document.getElementById('pickSub');
var pickNote  = document.getElementById('pickNote');
var pickX     = document.getElementById('pickX');
var sizesEl   = document.getElementById('sizes');
var soundBtn  = document.getElementById('soundBtn');
var confCv    = document.getElementById('confetti');
var histBtn   = document.getElementById('histBtn');
var sheet     = document.getElementById('sheet');
var sheetX    = document.getElementById('sheetX');
var sheetCount= document.getElementById('sheetCount');
var boardEl   = document.getElementById('board');
var ordEl     = document.getElementById('ord');
var cctx      = confCv.getContext('2d');

/* ---------------- geometry ---------------- */
var W = 0, H = 0, dpr = 1;
var cx = 0, cy = 0, R = 120, br = 9, rimW = 8;
var P0, C1, C2, P3, pathPts = [], pathLen = [], pathTotal = 1;
var sprites = [];

function bez(t){
  var u = 1 - t;
  var a = u*u*u, b = 3*u*u*t, c = 3*u*t*t, d = t*t*t;
  return {
    x: a*P0.x + b*C1.x + c*C2.x + d*P3.x,
    y: a*P0.y + b*C1.y + c*C2.y + d*P3.y
  };
}

function layout(){
  W = stage.clientWidth;
  H = stage.clientHeight;
  if (!W || !H) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  // cy leaves room above the sphere for the rim and the blower cap.
  var chuteZone = Math.max(Math.min(H * 0.32, 180), 76);
  R = Math.min(W * 0.452, (H - chuteZone - 6) / 2.28);
  R = Math.max(R, 50);
  rimW = Math.max(4, R * 0.075);
  cx = W / 2;
  cy = R * 1.19 + 4;
  // Keep the drum looking equally full whatever the game size: fewer balls
  // means bigger ones, capped so the chute does not become a drainpipe.
  br = Math.max(4.2, R * Math.min(0.098, Math.sqrt(0.428 / MAX)));

  P0 = {x: cx, y: cy + R * 0.94};
  var endY = H - br * 2.1 - 4;
  var dy = Math.max(46, endY - P0.y);
  var amp = Math.min(W * 0.30, dy * 0.82);
  C1 = {x: cx - amp, y: P0.y + dy * 0.34};
  C2 = {x: cx + amp, y: P0.y + dy * 0.70};
  P3 = {x: cx, y: P0.y + dy};

  pathPts = [];
  for (var i = 0; i <= 200; i++) pathPts.push(bez(i / 200));
  pathLen = [0];
  for (var j = 1; j < pathPts.length; j++){
    pathLen.push(pathLen[j-1] + Math.hypot(pathPts[j].x - pathPts[j-1].x, pathPts[j].y - pathPts[j-1].y));
  }
  pathTotal = pathLen[pathLen.length - 1] || 1;

  buildSprites();
  clampBalls();
  wake();
}

function pointAt(u){
  var target = Math.max(0, Math.min(1, u)) * pathTotal;
  var lo = 0, hi = pathLen.length - 1;
  while (lo < hi){
    var mid = (lo + hi) >> 1;
    if (pathLen[mid] < target) lo = mid + 1; else hi = mid;
  }
  return pathPts[lo];
}

/* Pre-rendered ball sprites — nine gradients drawn once, not 90 per frame. */
function buildSprites(){
  var s = Math.max(24, Math.ceil(br * 2 * dpr * 2));
  sprites = DECADES.map(function(d){
    var c = document.createElement('canvas');
    c.width = c.height = s;
    var g = c.getContext('2d');
    var r = s / 2;
    var grd = g.createRadialGradient(r * 0.66, r * 0.58, r * 0.06, r, r, r);
    grd.addColorStop(0, lighten(d.c, 0.5));
    grd.addColorStop(0.42, d.c);
    grd.addColorStop(1, darken(d.c, 0.5));
    g.beginPath(); g.arc(r, r, r - 1, 0, TAU);
    g.fillStyle = grd; g.fill();
    g.beginPath();
    g.ellipse(r * 0.64, r * 0.52, r * 0.26, r * 0.17, -0.6, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,0.6)'; g.fill();
    g.beginPath(); g.arc(r, r, r - 1.4, 0, TAU);
    g.lineWidth = Math.max(1, r * 0.1);
    g.strokeStyle = 'rgba(0,0,0,0.22)'; g.stroke();
    return c;
  });
}

/* ---------------- balls ---------------- */
var balls = [];
var phase = 'idle';          // idle | blow | eject | chute
var chosen = null;
var chuteT = 0;
var pendingReveal = false;
var gateAngle = 0;
var sleepFrames = 0;
var rafId = 0;
var lastTs = 0;
var seq = null;              // the running draw, timed off the wall clock
var revealTimer = 0;
var lastMove = 0;            // furthest any ball travelled last frame, in px

function nowMs(){
  return (window.performance && performance.now) ? performance.now() : Date.now();
}

function spawn(){
  balls = pool.map(function(n){
    var a = Math.random() * TAU;
    var rr = Math.sqrt(Math.random()) * Math.max(1, R - br - 3);
    return {
      n: n,
      d: decOf(n),
      x: cx + Math.cos(a) * rr,
      y: cy + Math.sin(a) * rr * 0.9,
      vx: (Math.random() - 0.5) * 1.2,
      vy: (Math.random() - 0.5) * 1.2
    };
  });
}

function clampBalls(){
  var max = Math.max(1, R - br - 2);
  for (var i = 0; i < balls.length; i++){
    var b = balls[i];
    var dx = b.x - cx, dy = b.y - cy;
    var d = Math.hypot(dx, dy);
    if (d > max){ b.x = cx + dx / d * max; b.y = cy + dy / d * max; }
  }
}

/* Position-based dynamics: predict, solve the contacts as pure position
   constraints, then read velocity back off the positions the solver actually
   allowed. A resting contact yields zero velocity by construction, which is
   what lets a heap of 90 balls come to rest instead of shimmering for ever.
   The older impulse solver left balls overlapping by a quarter of their
   diameter and never stopped moving. */
function physics(dt){
  if (dt < 0.1) dt = 0.1;             // never divide velocity by ~0 below
  var G = R * 0.0030;
  var cap = br * 0.9;                 // under one ball-width a frame: no blur, no tunnelling
  var md = br * 2, md2 = md * md;
  var max = R - br - 2;
  var n = balls.length;
  var i, j, b;

  for (i = 0; i < n; i++){
    b = balls[i];
    b.px = b.x; b.py = b.y;
    b.vy += G * dt;
    b.vx *= Math.pow(0.99, dt);
    b.vy *= Math.pow(0.995, dt);
    var sp = Math.hypot(b.vx, b.vy);
    if (sp > cap){ b.vx = b.vx / sp * cap; b.vy = b.vy / sp * cap; }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
  }

  for (var it = 0; it < 8; it++){
    for (i = 0; i < n; i++){
      var a = balls[i];
      for (j = i + 1; j < n; j++){
        var c = balls[j];
        var dx = c.x - a.x, dy = c.y - a.y;
        var d2 = dx * dx + dy * dy;
        if (d2 >= md2 || d2 < 0.000001) continue;
        var d = Math.sqrt(d2);
        var k = (md - d) * 0.5 / d;
        var ox = dx * k, oy = dy * k;
        a.x -= ox; a.y -= oy;
        c.x += ox; c.y += oy;
      }
    }
    for (i = 0; i < n; i++){
      b = balls[i];
      var wx = b.x - cx, wy = b.y - cy;
      var wd = Math.hypot(wx, wy);
      if (wd > max){
        var w = max / wd;
        b.x = cx + wx * w;
        b.y = cy + wy * w;
      }
    }
  }

  var mv = 0;
  for (i = 0; i < n; i++){
    b = balls[i];
    var ax = b.x - b.px, ay = b.y - b.py;
    b.vx = ax / dt;
    b.vy = ay / dt;
    var m = ax * ax + ay * ay;
    if (m > mv) mv = m;
  }
  lastMove = Math.sqrt(mv);   // furthest any ball actually travelled this frame
}

function detach(){
  var k = balls.indexOf(chosen);
  if (k >= 0) balls.splice(k, 1);
}

function beginEject(){
  if (phase === 'eject' || phase === 'chute') return;
  phase = 'eject';
  seq.fx = chosen.x;
  seq.fy = chosen.y;
  detach();               // from here the drawn ball is animated, not simulated
}

function beginChute(){
  if (phase === 'chute') return;
  beginEject();
  phase = 'chute';
  chuteT = 0;
}

function step(dt, now){
  var i, b;

  // Phase boundaries come off the wall clock, so a dropped or throttled
  // frame never leaves the machine half-way through a draw.
  if (seq){
    var e = now - seq.start;
    if (phase === 'blow' && e >= T.blow) beginEject();
    if (phase === 'eject'){
      var t = Math.min(1, (e - T.blow) / T.eject);
      var p = t * t * (3 - 2 * t);
      chosen.x = seq.fx + (P0.x - seq.fx) * p;
      chosen.y = seq.fy + (P0.y - seq.fy) * p;
      if (t >= 1) beginChute();
    }
    if (phase === 'chute'){
      chuteT = Math.min(1, (e - T.blow - T.eject) / T.chute);
    }
  }

  // Air is injected at the floor and dies out with height: the balls
  // fountain instead of piling against the top of the glass.
  if (phase === 'blow' || phase === 'eject'){
    var power = phase === 'blow' ? 1 : 0.4;
    var floorY = cy + R;
    for (i = 0; i < balls.length; i++){
      b = balls[i];
      if (Math.random() > 0.45) continue;
      var jet = (1 - ((floorY - b.y) / (2 * R)) * 1.3) * power;
      if (jet <= 0) continue;
      b.vy -= (R * 0.010 + Math.random() * R * 0.017) * jet * dt;
      b.vx += (Math.random() - 0.5) * R * 0.023 * jet * dt;
    }
  }

  physics(dt);

  var gateTarget = (phase === 'eject' || phase === 'chute') ? -1.15 : 0;
  gateAngle += (gateTarget - gateAngle) * Math.min(1, 0.18 * dt);
}

/* ---------------- drawing ---------------- */
function brassGradient(x0, y0, x1, y1){
  var g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0,    '#6B5220');
  g.addColorStop(0.22, '#EBC578');
  g.addColorStop(0.46, '#9A7228');
  g.addColorStop(0.72, '#F3DCA6');
  g.addColorStop(1,    '#5C4519');
  return g;
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawSprite(x, y, r, d){
  var s = sprites[d];
  if (s) ctx.drawImage(s, x - r, y - r, r * 2, r * 2);
}

function tubePath(){
  ctx.beginPath();
  ctx.moveTo(P0.x, P0.y);
  ctx.bezierCurveTo(C1.x, C1.y, C2.x, C2.y, P3.x, P3.y);
}

function drawTube(){
  var bore = br * 3.1;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  tubePath();
  ctx.lineWidth = bore + 12; ctx.strokeStyle = 'rgba(227,180,81,0.07)'; ctx.stroke();
  tubePath();
  ctx.lineWidth = bore + 4.5; ctx.strokeStyle = 'rgba(190,214,245,0.17)'; ctx.stroke();
  tubePath();
  ctx.lineWidth = bore; ctx.strokeStyle = '#080C12'; ctx.stroke();
  tubePath();
  ctx.lineWidth = bore * 0.8; ctx.strokeStyle = 'rgba(255,255,255,0.028)'; ctx.stroke();

  // spout collar
  ctx.save();
  ctx.translate(P3.x, P3.y);
  ctx.beginPath();
  ctx.arc(0, 0, bore * 0.5 + 2, 0, TAU);
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = brassGradient(-bore, -bore, bore, bore);
  ctx.stroke();
  ctx.restore();
}

function drawDrum(){
  // ambient halo
  var halo = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 1.65);
  halo.addColorStop(0, 'rgba(227,180,81,0.10)');
  halo.addColorStop(1, 'rgba(227,180,81,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(cx - R * 1.7, cy - R * 1.7, R * 3.4, R * 3.4);

  // glass body
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.fillStyle = '#080C12'; ctx.fill();
  var glass = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.4, R * 0.05, cx, cy, R);
  glass.addColorStop(0, 'rgba(255,255,255,0.06)');
  glass.addColorStop(0.7, 'rgba(255,255,255,0.018)');
  glass.addColorStop(1, 'rgba(255,255,255,0.004)');
  ctx.fillStyle = glass; ctx.fill();

  // balls, clipped inside the glass
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R - 1, 0, TAU); ctx.clip();
  for (var i = 0; i < balls.length; i++){
    drawSprite(balls[i].x, balls[i].y, br, balls[i].d);
  }
  var vig = ctx.createRadialGradient(cx, cy, R * 0.52, cx, cy, R);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vig;
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  ctx.restore();

  // the drawn ball leaving through the neck rides above the clip
  if (chosen && phase === 'eject'){
    ctx.save();
    ctx.shadowColor = rgba(DECADES[chosen.d].c, 0.85);
    ctx.shadowBlur = br * 2.4;
    drawSprite(chosen.x, chosen.y, br, chosen.d);
    ctx.restore();
  }

  // rim
  ctx.beginPath(); ctx.arc(cx, cy, R + rimW / 2 - 1, 0, TAU);
  ctx.lineWidth = rimW;
  ctx.strokeStyle = brassGradient(cx - R, cy - R, cx + R, cy + R);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R - 1, 0, TAU);
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.stroke();

  // glass highlights
  ctx.save();
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.87, Math.PI * 1.06, Math.PI * 1.40);
  ctx.lineWidth = R * 0.055;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.stroke();
  ctx.globalAlpha = 0.14;
  ctx.beginPath();
  ctx.ellipse(cx - R * 0.40, cy - R * 0.50, R * 0.19, R * 0.095, -0.7, 0, TAU);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();

  // blower cap on top
  ctx.save();
  ctx.fillStyle = brassGradient(cx - R * 0.2, cy - R - rimW, cx + R * 0.2, cy - R);
  roundRect(cx - R * 0.17, cy - R - rimW * 1.5 - R * 0.07, R * 0.34, R * 0.13, R * 0.045);
  ctx.fill();
  ctx.restore();
}

function drawNeck(){
  var bore = br * 3.1;
  ctx.save();
  ctx.translate(cx, cy + R * 0.9);

  // collar
  ctx.fillStyle = brassGradient(-bore, 0, bore, 0);
  roundRect(-bore * 0.62, -R * 0.03, bore * 1.24, R * 0.13, R * 0.035);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(-bore * 0.45, -R * 0.01, bore * 0.9, R * 0.07, R * 0.02);
  ctx.fill();

  // gate
  ctx.save();
  ctx.translate(-bore * 0.46, R * 0.09);
  ctx.rotate(gateAngle);
  ctx.fillStyle = brassGradient(0, 0, bore, 0);
  roundRect(0, 0, bore * 0.92, Math.max(3, R * 0.035), R * 0.018);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawChuteBall(){
  if (phase !== 'chute' || !chosen) return;
  var t = chuteT;
  var u = t * t * (3 - 2 * t);
  var p = pointAt(u);
  var q = pointAt(Math.min(1, u + 0.01));
  var ang = Math.atan2(q.y - p.y, q.x - p.x);
  var wob = REDUCED ? 0 : Math.sin(t * 11) * br * 0.18 * (1 - t);
  var x = p.x + Math.cos(ang + Math.PI / 2) * wob;
  var y = p.y + Math.sin(ang + Math.PI / 2) * wob;
  var k = br * (1 + 0.55 * t);

  ctx.save();
  ctx.shadowColor = rgba(DECADES[chosen.d].c, 0.9);
  ctx.shadowBlur = k * 2.2;
  drawSprite(x, y, k, chosen.d);
  ctx.restore();

  chosen.sx = x; chosen.sy = y; chosen.sr = k;
}

function render(){
  if (!W || !H) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawTube();
  drawDrum();
  drawNeck();
  drawChuteBall();
}

/* ---------------- loop ---------------- */
function loop(ts){
  rafId = 0;
  var dt = lastTs ? Math.min(2.5, (ts - lastTs) / 16.667) : 1;
  lastTs = ts;
  step(dt, nowMs());
  render();

  if (!seq && phase === 'idle' && lastMove < 0.35){
    sleepFrames++;
    if (sleepFrames > 30){ lastTs = 0; render(); return; }
  } else {
    sleepFrames = 0;
  }
  rafId = requestAnimationFrame(loop);
}

function wake(){
  sleepFrames = 0;
  if (rafId) return;
  lastTs = 0;
  rafId = requestAnimationFrame(loop);
}

function restart(){
  if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
  wake();
}

/* ---------------- ui ---------------- */
function renderDecades(){
  var counts = [], i;
  for (i = 0; i < DECADES.length; i++) counts.push(0);
  for (i = 0; i < pool.length; i++) counts[decOf(pool[i])]++;

  decadesEl.style.gridTemplateColumns = 'repeat(' + DECADES.length + ', 1fr)';
  var html = '';
  for (var d = 0; d < DECADES.length; d++){
    var dec = DECADES[d];
    html += '<div class="dec' + (counts[d] === 0 ? ' empty' : '') + '"' +
            ' style="--c:' + dec.c + ';--i:' + dec.i + '"' +
            ' title="' + dec.from + ' to ' + dec.to + ': ' + counts[d] + ' left">' +
              '<span class="sw">' + counts[d] + '</span>' +
              '<span class="rg">' + dec.from + '–' + dec.to + '</span>' +
            '</div>';
  }
  decadesEl.innerHTML = html;
  remainEl.textContent = pool.length;
}

function renderRecent(){
  if (!called.length){
    recentEl.innerHTML = '<span class="none">No balls called yet</span>';
    return;
  }
  var html = '';
  for (var i = called.length - 1; i >= 0; i--){
    var n = called[i];
    var dec = DECADES[decOf(n)];
    var cls = 'rb' + (i === called.length - 1 ? ' first' : '') + (n === 6 || n === 9 ? ' u' : '');
    html += '<span class="' + cls + '" style="--c:' + dec.c +
            ';--hi:' + lighten(dec.c, 0.45) + ';--lo:' + darken(dec.c, 0.4) +
            ';--i:' + dec.i + '"><span>' + n + '</span></span>';
  }
  recentEl.innerHTML = html;
  recentEl.scrollLeft = 0;
}

function renderBoard(){
  var seen = {}, i, h = '';
  for (i = 0; i < called.length; i++) seen[called[i]] = 1;
  var last = called[called.length - 1];
  for (var d = 0; d < DECADES.length; d++){
    var dec = DECADES[d];
    for (var k = dec.from; k <= dec.to; k++){
      h += '<span class="cell' + (seen[k] ? ' on' : '') + (k === last ? ' now' : '') +
           '" style="--c:' + dec.c + ';--i:' + dec.i + '">' + k + '</span>';
    }
  }
  boardEl.innerHTML = h;
  sheetCount.textContent = called.length + ' of ' + MAX;

  if (!called.length){
    ordEl.innerHTML = '<span class="none">Nothing called yet</span>';
    return;
  }
  var o = '';
  for (i = called.length - 1; i >= 0; i--){
    var n = called[i], dc = DECADES[decOf(n)];
    o += '<b' + (i === called.length - 1 ? ' class="now"' : '') +
         ' title="Ball ' + (i + 1) + '"' +
         ' style="--c:' + dc.c + ';--i:' + dc.i + '">' + n + '</b>';
  }
  ordEl.innerHTML = o;
}

function openSheet(){
  renderBoard();
  sheet.hidden = false;
  sheetX.focus({preventScroll: true});
}

function closeSheet(){
  if (sheet.hidden) return;
  sheet.hidden = true;
  histBtn.focus({preventScroll: true});
}

histBtn.addEventListener('click', openSheet);
sheetX.addEventListener('click', closeSheet);
sheet.addEventListener('click', function(e){ if (e.target === sheet) closeSheet(); });

function renderAll(){
  renderDecades();
  renderRecent();
  renderBoard();
  drawBtn.disabled = pool.length === 0;
  drawBtn.textContent = pool.length === 0 ? 'All ' + MAX + ' called' : 'Draw ball';
}

/* ---------------- sound ---------------- */
/* Everything is synthesised - the CSP blocks external media, and a bingo
   chime is a struck bell anyway: a few decaying sine partials. Each decade
   rings a step further up a major pentatonic, so the colour groups are
   audible as well as visible. */
var NOTES = [440, 493.88, 554.37, 659.25, 739.99, 880, 987.77, 1108.73, 1318.51];

var actx = null, master = null, noiseBuf = null;
var soundOn = true;
try { soundOn = localStorage.getItem('tombola90.sound') !== 'off'; } catch(e){}

function audio(){
  if (!soundOn) return null;
  if (!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.5;
      master.connect(actx.destination);
    } catch(e){ actx = null; return null; }
  }
  if (actx.state === 'suspended' && actx.resume) actx.resume();
  return actx;
}

function noise(ac){
  if (noiseBuf) return noiseBuf;
  var len = Math.floor(ac.sampleRate * 0.4);
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}

function chime(ac, t0, freq, gain){
  var partials = [[1, 1], [2.01, 0.4], [3.03, 0.2], [4.97, 0.09]];
  for (var i = 0; i < partials.length; i++){
    var ratio = partials[i][0], amp = gain * partials[i][1];
    var o = ac.createOscillator();
    var g = ac.createGain();
    var dur = 1.7 / Math.sqrt(ratio);
    o.type = 'sine';
    o.frequency.value = freq * ratio;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(amp, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
}

function pop(ac, t0){
  var src = ac.createBufferSource();
  var bp = ac.createBiquadFilter();
  var g = ac.createGain();
  src.buffer = noise(ac);
  bp.type = 'bandpass';
  bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(2200, t0);
  bp.frequency.exponentialRampToValueAtTime(420, t0 + 0.2);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.42, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + 0.3);
}

function thump(ac, t0){
  var o = ac.createOscillator();
  var g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(190, t0);
  o.frequency.exponentialRampToValueAtTime(46, t0 + 0.17);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.45, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + 0.4);
}

/* The ball drops in, then the cannon goes off and the bell rings. */
function playReveal(d){
  var ac = audio();
  if (!ac) return;
  var t0 = ac.currentTime + 0.03;
  thump(ac, t0);
  var t1 = t0 + (REDUCED ? 0.02 : 0.36);
  pop(ac, t1);
  chime(ac, t1 + 0.015, NOTES[d], 0.3);
  chime(ac, t1 + 0.13, NOTES[d] * 1.5, 0.12);
}

function syncSound(){
  soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  soundBtn.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
}

soundBtn.addEventListener('click', function(e){
  e.stopPropagation();
  soundOn = !soundOn;
  try { localStorage.setItem('tombola90.sound', soundOn ? 'on' : 'off'); } catch(err){}
  syncSound();
  if (soundOn){
    var ac = audio();
    if (ac) chime(ac, ac.currentTime + 0.02, NOTES[5], 0.22);
  }
});
syncSound();

/* ---------------- confetti ---------------- */
var pieces = [];
var confRaf = 0, confLast = 0, burstTimer = 0;

function confettiBurst(d){
  if (REDUCED) return;
  var w = reveal.clientWidth, h = reveal.clientHeight;
  if (!w || !h) return;
  var s = Math.min(window.devicePixelRatio || 1, 2);
  confCv.width = Math.round(w * s);
  confCv.height = Math.round(h * s);
  cctx.setTransform(s, 0, 0, s, 0, 0);

  // offset* ignores the ball's entrance transform, so the ring is centred on
  // where the ball comes to rest rather than where it is mid-flight.
  var ox = rvBall.offsetLeft + rvBall.offsetWidth / 2;
  var oy = rvBall.offsetTop + rvBall.offsetHeight / 2;
  var rad = rvBall.offsetWidth / 2;

  var palette = [];
  for (var k = 0; k < DECADES.length; k++) palette.push(DECADES[k].c);
  palette.push('#FFFFFF', '#E3B451');
  var lead = DECADES[d].c;

  var n = Math.round(Math.max(110, Math.min(200, w * h / 2100)));
  pieces = [];
  for (var i = 0; i < n; i++){
    var a = Math.random() * TAU;
    var speed = h * 0.0062 * (0.45 + Math.random() * 1.4);
    pieces.push({
      x: ox + Math.cos(a) * rad * (0.8 + Math.random() * 0.2),
      y: oy + Math.sin(a) * rad * (0.8 + Math.random() * 0.2),
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed - h * 0.004 * Math.random(),
      w: 5 + Math.random() * 7,
      h: 8 + Math.random() * 10,
      rot: Math.random() * TAU,
      vr: (Math.random() - 0.5) * 0.36,
      ph: Math.random() * TAU,
      vph: 0.15 + Math.random() * 0.2,
      c: Math.random() < 0.3 ? lead : palette[(Math.random() * palette.length) | 0],
      ribbon: Math.random() < 0.28,
      life: 0
    });
  }
  confLast = 0;
  if (!confRaf) confRaf = requestAnimationFrame(confettiFrame);
}

function confettiFrame(ts){
  confRaf = 0;
  var dt = confLast ? Math.min(2.5, (ts - confLast) / 16.667) : 1;
  confLast = ts;
  var w = reveal.clientWidth, h = reveal.clientHeight;
  var G = h * 0.00042;
  var vt = h * 0.0045;              // terminal velocity: paper, not gravel
  var alive = 0;
  cctx.clearRect(0, 0, w, h);
  for (var i = 0; i < pieces.length; i++){
    var p = pieces[i];
    p.life += dt;
    p.vy += G * dt;
    p.vx *= Math.pow(0.99, dt);
    p.vy *= Math.pow(0.978, dt);
    if (p.vy > vt) p.vy = vt;
    p.vx += Math.sin(p.ph) * 0.15 * dt;   // flutter, as a flat piece turns
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    p.ph += p.vph * dt;

    var fade = Math.max(0, Math.min(1, (300 - p.life) / 55));
    if (fade <= 0 || p.y - 24 > h) continue;
    alive++;

    var sx = Math.cos(p.ph);
    if (Math.abs(sx) < 0.03) sx = sx < 0 ? -0.03 : 0.03;
    cctx.save();
    cctx.globalAlpha = fade;
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.scale(sx, 1);
    cctx.fillStyle = p.c;
    if (p.ribbon) cctx.fillRect(-p.w * 0.22, -p.h * 0.8, p.w * 0.44, p.h * 1.6);
    else cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cctx.restore();
  }
  if (alive) confRaf = requestAnimationFrame(confettiFrame);
  else { pieces = []; cctx.clearRect(0, 0, w, h); }
}

function confettiStop(){
  clearTimeout(burstTimer);
  if (confRaf){ cancelAnimationFrame(confRaf); confRaf = 0; }
  pieces = [];
  if (confCv.width) cctx.clearRect(0, 0, reveal.clientWidth, reveal.clientHeight);
}

/* ---------------- draw sequence ---------------- */
var busy = false;

function drawBall(){
  if (busy || !pool.length || !pickEl.hidden) return;
  closeSheet();
  busy = true;
  drawBtn.disabled = true;

  var idx = Math.floor(Math.random() * pool.length);
  var n = pool[idx];
  pool.splice(idx, 1);

  chosen = null;
  for (var i = 0; i < balls.length; i++){
    if (balls[i].n === n){ chosen = balls[i]; break; }
  }
  if (!chosen){
    // Should not happen, but never leave the machine stuck.
    chosen = {n: n, d: decOf(n), x: cx, y: cy + R * 0.5, vx: 0, vy: 0};
  }

  pendingReveal = false;
  phase = 'blow';
  chuteT = 0;
  seq = {start: nowMs(), fx: chosen.x, fy: chosen.y};

  // The reveal is armed on the clock, not on the render loop, so a
  // backgrounded tab or a stalled frame can never strand a draw.
  clearTimeout(revealTimer);
  revealTimer = setTimeout(openReveal, T.blow + T.eject + T.chute + T.pause);

  wake();
}

function openReveal(){
  if (pendingReveal || !chosen) return;
  pendingReveal = true;
  clearTimeout(revealTimer);
  detach();

  var n = chosen.n;
  var d = decOf(n);
  var dec = DECADES[d];

  called.push(n);
  save();
  renderAll();

  reveal.style.setProperty('--c', dec.c);
  reveal.style.setProperty('--hi', lighten(dec.c, 0.48));
  reveal.style.setProperty('--lo', darken(dec.c, 0.45));
  reveal.style.setProperty('--i', dec.i);
  reveal.style.setProperty('--glow', rgba(dec.c, 0.3));

  rvNum.textContent = n;
  rvBall.classList.toggle('one', n < 10);
  rvBall.classList.toggle('u', n === 6 || n === 9);
  rvRange.textContent = dec.from + ' – ' + dec.to;
  rvCall.textContent = CALLS[n - 1];
  rvIndex.textContent = 'Ball ' + called.length + ' of ' + MAX;
  liveEl.textContent = 'Number ' + n + '. ' + CALLS[n - 1] + '. ' + dec.from + ' to ' + dec.to + '.';

  reveal.hidden = false;
  confettiStop();
  playReveal(d);
  if (REDUCED) confettiBurst(d);
  else burstTimer = setTimeout(function(){ confettiBurst(d); }, 360);

  // Grow the giant ball out of the spout so the motion stays continuous.
  if (!REDUCED){
    var sRect = stage.getBoundingClientRect();
    var bRect = rvBall.getBoundingClientRect();
    var fromX = sRect.left + (chosen.sx != null ? chosen.sx : P3.x);
    var fromY = sRect.top + (chosen.sy != null ? chosen.sy : P3.y);
    var toX = bRect.left + bRect.width / 2;
    var toY = bRect.top + bRect.height / 2;
    var scale = Math.max(0.02, ((chosen.sr != null ? chosen.sr : br * 1.55) * 2) / bRect.width);

    reveal.animate(
      [{opacity: 0}, {opacity: 1}],
      {duration: 160, easing: 'ease-out'}
    );
    rvBall.animate([
      {transform: 'translate(' + (fromX - toX) + 'px,' + (fromY - toY) + 'px) scale(' + scale + ')'},
      {transform: 'translate(0,0) scale(1)'}
    ], {duration: 620, easing: 'cubic-bezier(.2,.85,.3,1.02)'});
    rvNum.animate([
      {opacity: 0, transform: 'scale(.55)', offset: 0},
      {opacity: 0, transform: 'scale(.55)', offset: 0.45},
      {opacity: 1, transform: 'scale(1)', offset: 1}
    ], {duration: 760, easing: 'cubic-bezier(.2,.9,.3,1.1)'});
    document.querySelector('.rv-foot').animate([
      {opacity: 0, transform: 'translateY(14px)', offset: 0},
      {opacity: 0, transform: 'translateY(14px)', offset: 0.55},
      {opacity: 1, transform: 'translateY(0)', offset: 1}
    ], {duration: 900, easing: 'ease-out'});
  }

  phase = 'idle';
  seq = null;
  chosen = null;
  wake();
}

function closeReveal(){
  if (reveal.hidden) return;
  confettiStop();
  if (REDUCED){
    reveal.hidden = true;
  } else {
    var a = reveal.animate(
      [{opacity: 1, transform: 'scale(1)'}, {opacity: 0, transform: 'scale(.94)'}],
      {duration: 220, easing: 'ease-in'}
    );
    a.onfinish = function(){ reveal.hidden = true; };
  }
  busy = false;
  drawBtn.disabled = pool.length === 0;
  drawBtn.focus({preventScroll: true});
}

/* ---------------- game size ---------------- */
function renderSizes(){
  var h = '';
  for (var i = 0; i < SIZES.length; i++){
    var sz = SIZES[i];
    var dots = '';
    for (var g = 0; g * 10 < sz.n; g++) dots += '<i style="--m:' + HUES[g].c + '"></i>';
    h += '<button class="size' + (sz.n === MAX ? ' on' : '') + '" type="button"' +
         ' data-n="' + sz.n + '"' + (sz.n === MAX ? ' aria-current="true"' : '') + '>' +
           '<span class="n">' + sz.n + '</span>' +
           '<span class="t">' + sz.name + '<small>' + sz.blurb + '</small></span>' +
           '<span class="dots" aria-hidden="true">' + dots + '</span>' +
         '</button>';
  }
  sizesEl.innerHTML = h;
}

function openPick(asMenu){
  pickEl.classList.toggle('menu', !!asMenu);
  pickTitle.textContent = asMenu ? 'Game size' : 'Which game?';
  pickSub.textContent = asMenu
    ? 'Ten balls to a colour.'
    : 'How many balls go in the drum? Ten to a colour.';
  pickNote.hidden = !asMenu;
  pickX.hidden = !asMenu;
  renderSizes();
  pickEl.hidden = false;
  var first = sizesEl.querySelector('.size');
  if (first) first.focus({preventScroll: true});
}

function closePick(){
  if (pickEl.hidden) return;
  pickEl.hidden = true;
  if (pickEl.classList.contains('menu')) menuBtn.focus({preventScroll: true});
}

function setSize(n){
  MAX = n;
  DECADES = buildDecades(n);
  saveSize();
  wordNum.textContent = n;
  buildSprites();
  layout();          // ball radius depends on the count
  doReset();         // a different drum means a fresh run
}

sizesEl.addEventListener('click', function(e){
  var el = e.target;
  while (el && el !== sizesEl && !(el.className && String(el.className).indexOf('size') === 0)) el = el.parentNode;
  if (!el || el === sizesEl) return;
  var n = parseInt(el.getAttribute('data-n'), 10);
  if (!n) return;
  var wasMenu = pickEl.classList.contains('menu');
  closePick();
  // Re-picking the size you are already on would only throw the run away.
  if (wasMenu && n === MAX) return;
  setSize(n);
});

menuBtn.addEventListener('click', function(){ disarm(); closeSheet(); openPick(true); });
pickX.addEventListener('click', closePick);
pickEl.addEventListener('click', function(e){
  if (e.target === pickEl && pickEl.classList.contains('menu')) closePick();
});

/* ---------------- reset ---------------- */
var armTimer = 0;

function disarm(){
  clearTimeout(armTimer);
  resetBtn.classList.remove('armed');
  resetBtn.textContent = 'Reset';
}

function doReset(){
  disarm();
  clearTimeout(revealTimer);
  confettiStop();
  if (!reveal.hidden) reveal.hidden = true;
  pool = [];
  for (var n = 1; n <= MAX; n++) pool.push(n);
  called = [];
  save();
  spawn();
  phase = 'idle';
  seq = null;
  chosen = null;
  chuteT = 0;
  pendingReveal = false;
  busy = false;
  renderAll();
  liveEl.textContent = 'All ' + MAX + ' balls returned to the drum.';
  wake();
}

resetBtn.addEventListener('click', function(){
  if (resetBtn.classList.contains('armed')){ doReset(); return; }
  resetBtn.classList.add('armed');
  resetBtn.textContent = 'Reset all?';
  armTimer = setTimeout(disarm, 3000);
});

/* ---------------- events ---------------- */
drawBtn.addEventListener('click', function(){ disarm(); audio(); drawBall(); });
reveal.addEventListener('click', closeReveal);

window.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (!reveal.hidden) closeReveal();
    else if (!pickEl.hidden) closePick();   // no-op on the first-run chooser
    else if (!sheet.hidden) closeSheet();
    else disarm();
    return;
  }
  if (e.key === ' ' || e.key === 'Enter'){
    if (!reveal.hidden){ e.preventDefault(); closeReveal(); }
    else if (!sheet.hidden || !pickEl.hidden){ /* their own buttons handle it */ }
    else if (document.activeElement !== resetBtn && !busy){ e.preventDefault(); drawBall(); }
  }
});

if (window.ResizeObserver){
  new ResizeObserver(layout).observe(stage);
} else {
  window.addEventListener('resize', layout);
}
window.addEventListener('orientationchange', function(){ setTimeout(layout, 120); });
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) restart();
});
window.addEventListener('pageshow', restart);
window.addEventListener('focus', restart);

/* ---------------- boot ---------------- */
function boot(data){
  var stored = loadSize();
  var firstRun = (stored === null);
  MAX = stored || 90;
  DECADES = buildDecades(MAX);
  wordNum.textContent = MAX;

  var restored = (data && Array.isArray(data.called)) ? data.called : load();
  called = restored || [];
  var seen = {};
  called = called.filter(function(n){
    if (seen[n]) return false;
    seen[n] = 1; return true;
  });
  pool = [];
  for (var n = 1; n <= MAX; n++) if (!seen[n]) pool.push(n);

  layout();
  spawn();
  renderAll();
  wake();

  if (firstRun) openPick(false);
}

if (window.claude && window.claude.hot && window.claude.hot.snapshot){
