&lt;div class="wrap"&gt;

&lt;div class="answer-box"&gt;
  &lt;p&gt;&lt;strong&gt;How does eXp Realty work, in one paragraph?&lt;/strong&gt; eXp Realty is a cloud-based brokerage — no franchise offices, no desk fees, no royalties. In Canada you keep 80% of every commission until you have paid eXp $16,000 in a year (the "cap"), reached at $80,000 of gross commission income. After the cap you keep 100% of every commission minus a small per-deal fee. eXp then shares up to half of its 20% company cut with the agents who helped grow the brokerage, across 7 revenue-share tiers. On top of that, agents earn AGNT stock awards for production and for hitting ICON status. That is the whole model: split, cap, revenue share, equity.&lt;/p&gt;

&lt;!-- ============================ HOOK 1 ============================ --&gt;
&lt;section id="fed-up"&gt;
  &lt;div class="badge"&gt;Read this first&lt;/div&gt;
  &lt;h2&gt;Fed Up With Your Brokerage&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;Most experienced agents do not leave brokerages because of the logo on the door. They leave because of the math: the split never improves, the fees never stop, and the harder they work, the more the brokerage takes. eXp Realty was built to invert that — a hard cap on what the brokerage can take from you, then revenue share and stock that pay you for the growth you help create.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;You are not a new agent reading this out of curiosity. You are a producing agent, and something at your current brokerage is not sitting right.&lt;/p&gt;
  &lt;div class="pain-grid"&gt;
    &lt;div class="pain-card"&gt;
      &lt;h3&gt;The split never gets better&lt;/h3&gt;
      &lt;p&gt;You close more deals, earn more commission — and the brokerage takes its cut of every single one, forever. Your loyalty buys you nothing. There is no finish line.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class="pain-card"&gt;
      &lt;h3&gt;The fees never stop&lt;/h3&gt;
      &lt;p&gt;Desk fees, franchise fees, royalty fees, tech fees, transaction fees. Some months you pay the brokerage more than you take home, and nobody can explain what the money actually funds.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class="pain-card"&gt;
      &lt;h3&gt;You built the brand, they kept the equity&lt;/h3&gt;
      &lt;p&gt;Every agent you mentored, every agent you brought in, every dollar of market-center profit you helped create — it enriched the brokerage. You got a thank-you. Maybe a plaque.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p&gt;Here is the uncomfortable question behind all three: &lt;strong&gt;what is the maximum your brokerage is allowed to take from you in a year?&lt;/strong&gt; At most traditional brokerages, there is no maximum. The answer is "as much as you earn." That is the entire pitch of this page — there is a brokerage where the answer is a fixed, published number. Keep reading.&lt;/p&gt;
  &lt;p&gt;&lt;a href="#commission-split"&gt;Skip to the Canada numbers &amp;rarr;&lt;/a&gt;&lt;/p&gt;
&lt;/section&gt;

&lt;!-- ============================ HOOK 2 ============================ --&gt;
&lt;section id="thirty-percent"&gt;
  &lt;div class="badge"&gt;Do the math&lt;/div&gt;
  &lt;h2&gt;Sick of Giving Away 30% of Every Cheque&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;A 70/30 split with a 6% royalty and monthly fees can quietly cost a producing agent $25,000–$40,000 a year. eXp Realty Canada caps the brokerage's take at $16,000 a year, then drops you to 100% commission. Run your own numbers below.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Before we talk about eXp, let us talk about what your current brokerage actually costs you. Most agents have never added it up, because the fees are scattered across splits, royalties, desk fees, and per-deal charges. Add them up once and the number is usually shocking.&lt;/p&gt;

  &lt;div id="calculator-keep"&gt;
    &lt;iframe src="https://ottawapropertyshop-design.github.io/ottawa-market-widgets/keep-rate-calculator.html" width="100%" height="1230" frameborder="0" style="border:0;border-radius:12px;overflow:hidden;" title="Keep-Rate Calculator"&gt;&lt;/iframe&gt;
  &lt;/div&gt;

  &lt;div class="static-example"&gt;
    &lt;div class="label"&gt;Static worked example (if the calculator above does not load)&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;Agent earns $180,000 GCI on 24 deals.&lt;/strong&gt; At a traditional 70/30 split with a $3,000 royalty and $250/month desk fees, the brokerage takes &lt;strong&gt;$60,000&lt;/strong&gt; (30% of $180,000 + $3,000 + $3,000). &lt;strong&gt;Agent keeps $120,000.&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;At eXp Realty Canada on the same $180,000: the 20% split stops at the $16,000 cap, the $139/month cloud fee totals $1,668, and post-cap fees on the deals after capping come to roughly $3,135. &lt;strong&gt;Total brokerage cost: about $20,800. Agent keeps about $159,200&lt;/strong&gt; — roughly $39,000 more in the agent's pocket, before revenue share or stock awards.&lt;/p&gt;
    &lt;p class="fine"&gt;Simplified illustration only; results not typical. Individual results vary with production, fees, and taxes.&lt;/p&gt;
  &lt;/div&gt;

  &lt;p&gt;If that gap made your stomach drop, you now understand why thousands of experienced agents have made the switch. The question is no longer "can I afford to switch" — it is "can I afford not to look at the math." Let us walk through the model itself, starting with the words.&lt;/p&gt;
&lt;/section&gt;

&lt;!-- ============================ MODEL: definitions first ============================ --&gt;
&lt;section id="commission-split"&gt;
  &lt;div class="badge"&gt;The model, in plain English&lt;/div&gt;
  &lt;h2&gt;eXp Realty commission split, explained in plain English&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;In Canada, eXp Realty takes 20% of your commissions until it has collected $16,000 from you in your anniversary year. After that, you keep 100% of every commission (minus small per-deal fees). That $16,000 ceiling is called the "cap" — it is the maximum the brokerage can ever take from your splits.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;First, the words — before the numbers&lt;/h3&gt;
  &lt;p&gt;&lt;strong&gt;A "split"&lt;/strong&gt; is the percentage of each commission cheque that goes to the brokerage instead of you. An 80/20 split means you keep 80% and the brokerage keeps 20%.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;A "cap"&lt;/strong&gt; is a ceiling on the split. It is the maximum total dollar amount the brokerage can collect from your 80/20 splits in one year. Once your 20% contributions add up to the cap, the split turns off. You stop paying the 20% entirely.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;"GCI"&lt;/strong&gt; means gross commission income — the total commissions you earn before any split or fee.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;An "anniversary year"&lt;/strong&gt; is your personal 12-month cycle starting the day you join eXp, not the calendar year. Your cap resets every anniversary, not every January.&lt;/p&gt;

  &lt;h3&gt;eXp Realty commission split in Canada: 80/20 to a $16,000 cap&lt;/h3&gt;
  &lt;p&gt;Here is the Canadian model, verified October 2026 against eXp's official income disclosure (exprealty.ca/income):&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Split:&lt;/strong&gt; 80/20. You keep 80% of every commission; eXp keeps 20%.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Cap:&lt;/strong&gt; $16,000 CAD per anniversary year. Because 20% of $80,000 is $16,000, the cap is reached the moment you earn &lt;strong&gt;$80,000 in GCI&lt;/strong&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;After the cap:&lt;/strong&gt; 100% commission to you. eXp charges a $285 transaction fee on each of your next 20 deals (maximum $5,700 total), then the fee drops to $75 per deal for the rest of the year.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Reset:&lt;/strong&gt; the cap resets on your anniversary date, and the cycle starts again.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;The Canada worked example: an Ottawa agent's year&lt;/h3&gt;
  &lt;p&gt;Take an Ottawa agent who closes 20 deals at an average commission of $18,000 — that is $360,000 in GCI for the year. Walk through it:&lt;/p&gt;
  &lt;ol&gt;
    &lt;li&gt;&lt;strong&gt;Deals 1 through ~4:&lt;/strong&gt; the 20% split applies. By the time the agent has earned $80,000 in GCI, eXp has collected exactly $16,000. &lt;strong&gt;Cap reached.&lt;/strong&gt;&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;The next 20 deals:&lt;/strong&gt; the agent keeps 100% of every commission and pays $285 per deal — $5,700 total.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Any deals after that:&lt;/strong&gt; 100% commission, $75 per deal.&lt;/li&gt;
  &lt;/ol&gt;
  &lt;p&gt;Total paid to the brokerage on $360,000 of GCI: $16,000 + $5,700 + the monthly cloud fee (see the fee table below). Roughly &lt;strong&gt;$23,400&lt;/strong&gt; — about 6.5% of GCI. At a traditional 70/30 brokerage with no cap, the same agent would hand over $108,000 in splits alone. That difference is the whole story.&lt;/p&gt;
  &lt;p class="fine"&gt;Illustration only; results not typical. Assumes the agent's production is spread so all post-cap fee tiers apply as shown; individual results vary.&lt;/p&gt;

  &lt;h3&gt;New agents: the mentor program (the cost nobody mentions)&lt;/h3&gt;
  &lt;p&gt;One disclosure most attraction pages skip: in Canada, brand-new agents pay an &lt;strong&gt;additional 20% split on their first three transactions&lt;/strong&gt; to fund the eXp mentor program. It is a real cost, it is in the official disclosure, and you should know about it before you join. Experienced agents switching brokerages are generally not affected — but if you are mentoring new agents, know what they pay.&lt;/p&gt;
  &lt;p&gt;Brand-new to the business? This page is written for experienced agents switching brokerages — see our companion guide for new agents (forthcoming).&lt;/p&gt;
&lt;/section&gt;

  &lt;h2&gt;Where your $16,000 goes: the illustrated cap flow&lt;/h2&gt;

    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;eXp publicly commits about half of its 20% company cut to the revenue-share pool. So of your $16,000 cap, roughly $8,000 flows back out to the agents who grew the brokerage, and roughly $8,000 stays with eXp to run it. That is why the model works without franchise fees.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Follow one dollar of commission through the machine. This is the part no traditional brokerage can show you, because at a traditional brokerage the flow stops at step 2.&lt;/p&gt;
  &lt;div class="capflow"&gt;
    &lt;div class="node"&gt;&lt;div class="big"&gt;$80,000&lt;/div&gt;&lt;div class="lbl"&gt;Your GCI. The 20% split applies until the cap is hit.&lt;/div&gt;&lt;/div&gt;

    &lt;div class="node"&gt;&lt;div class="big"&gt;$16,000&lt;/div&gt;&lt;div class="lbl"&gt;The "company dollar" — eXp's 20% cut. You keep the other $64,000.&lt;/div&gt;&lt;/div&gt;

&lt;!-- ============================ REVENUE SHARE ============================ --&gt;
&lt;section id="revenue-share"&gt;
  &lt;div class="badge"&gt;The wealth engine&lt;/div&gt;
  &lt;h2&gt;eXp Realty revenue share: the 7-tier system, explained&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;When agents you attracted to eXp pay their 20% split, eXp pays YOU a percentage of their adjusted GCI — from eXp's cut, never from the agent's pocket. Tier 1 (agents you personally sponsored) pays 3.5%, up to $2,800 a year per capping agent. Six more tiers below that pay on agents your people attracted, up to $4,000 a year per agent on Tier 7. It costs $0 to participate. This is a long game for agents who attract consistently — not a signup bonus.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Plain English first: what revenue share actually is&lt;/h3&gt;
  &lt;p&gt;&lt;strong&gt;"Revenue share"&lt;/strong&gt; means eXp shares its own revenue — the 20% company cut — with agents who help the brokerage grow. When you attract a productive agent to eXp and they pay their splits, eXp sends you a slice of what it collected. The agent you attracted loses nothing; their split and cap are identical either way. The money comes out of eXp's half of the cap flow you saw above.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;A "tier"&lt;/strong&gt; is a generation in your group. Tier 1 = agents you personally attracted. If one of them attracts an agent, that new agent sits in your Tier 2. Then Tier 3 — down to Tier 7. You earn the tier's percentage on every productive agent in all seven generations.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;"FLQA"&lt;/strong&gt; is eXp's term for a productive sponsored agent (roughly: a personally sponsored agent who earned about $5,000 in GCI in the last six months). FLQAs are the key that unlocks your deeper tiers.&lt;/p&gt;

  &lt;h3&gt;The 7-tier chart: rates, maximums, and real dollars&lt;/h3&gt;
  &lt;p&gt;Each tier has a published rate, a published &lt;strong&gt;maximum per capping agent per year&lt;/strong&gt;, and — because percentages alone do not pay bills — a worked dollar figure. The "your $" column applies the published rate to one sponsored agent who caps at $80,000 GCI. The "max" column is eXp's published maximum per capping agent per year from its own revenue-share schedule.&lt;/p&gt;

  &lt;table class="tier-table"&gt;
    &lt;tr&gt;&lt;th&gt;Tier&lt;/th&gt;&lt;th&gt;Who sits here&lt;/th&gt;&lt;th class="num"&gt;Unlocked rate&lt;/th&gt;&lt;th class="num"&gt;Max $/yr per capping agent&lt;/th&gt;&lt;th class="num"&gt;Your $ on one $80K-GCI agent&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Tier 1&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Agents you personally sponsored&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;3.5%&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;$2,800&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;$2,800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Tier 2&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Agents your Tier 1 attracted&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;4.0%&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;$3,200&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;$3,200&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Tier 3&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Agents your Tier 2 attracted&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;2.5%&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;$2,000&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;$2,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Tier 4&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Agents your Tier 3 attracted&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;1.5%&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;$1,200&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;$1,200&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Tier 5&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Agents your Tier 4 attracted&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;1.0%&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;$800&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;$800&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Tier 6&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Agents your Tier 5 attracted&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;2.5%&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;$2,000&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;$2,000&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Tier 7&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Agents your Tier 6 attracted&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;5.0%&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;$4,000&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;$4,000&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;p class="fine"&gt;One capping agent in every tier = roughly &lt;strong&gt;$16,000 a year&lt;/strong&gt; to you, from eXp's cut — the attracted agents lose nothing. Before a tier is unlocked, eXp still pays a small "eXpansion share" on it; once unlocked you earn the full "eXponential share" above. Maximums are per capping agent per year; totals scale with the number of productive agents in each tier.&lt;/p&gt;

  &lt;h4&gt;The tier chart, visualized&lt;/h4&gt;
  &lt;div id="tier-visual"&gt;
    &lt;div class="tierbar"&gt;&lt;div class="tlabel"&gt;Tier 1 — max $2,800&lt;/div&gt;&lt;div class="track"&gt;&lt;div class="fill" style="width:70%"&gt;3.5%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class="tierbar"&gt;&lt;div class="tlabel"&gt;Tier 2 — max $3,200&lt;/div&gt;&lt;div class="track"&gt;&lt;div class="fill" style="width:80%"&gt;4.0%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class="tierbar"&gt;&lt;div class="tlabel"&gt;Tier 3 — max $2,000&lt;/div&gt;&lt;div class="track"&gt;&lt;div class="fill" style="width:50%"&gt;2.5%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class="tierbar"&gt;&lt;div class="tlabel"&gt;Tier 4 — max $1,200&lt;/div&gt;&lt;div class="track"&gt;&lt;div class="fill" style="width:30%"&gt;1.5%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class="tierbar"&gt;&lt;div class="tlabel"&gt;Tier 5 — max $800&lt;/div&gt;&lt;div class="track"&gt;&lt;div class="fill" style="width:20%"&gt;1.0%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class="tierbar"&gt;&lt;div class="tlabel"&gt;Tier 6 — max $2,000&lt;/div&gt;&lt;div class="track"&gt;&lt;div class="fill" style="width:50%"&gt;2.5%&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class="tierbar"&gt;&lt;div class="tlabel"&gt;Tier 7 — max $4,000&lt;/div&gt;&lt;div class="track"&gt;&lt;div class="fill" style="width:100%"&gt;5.0% — rewards depth&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class="fine"&gt;Bar lengths are proportional to eXp's published maximum per capping agent per year, for visual comparison only.&lt;/p&gt;

  &lt;h3&gt;How tiers unlock (REV Share 2.0)&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Tiers 1–3 unlock immediately&lt;/strong&gt; — zero qualifying agents required — and stay unlocked.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Tiers 4, 5, 6&lt;/strong&gt; unlock when you have 5, 10, and 15 productive sponsored agents respectively.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Tier 7&lt;/strong&gt; unlocks at 30 productive sponsored agents (FLQAs).&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Fast Start bonus:&lt;/strong&gt; on a directly sponsored agent's first year, you can earn an additional bonus of up to $4,000 (North America).&lt;/li&gt;
    &lt;li&gt;Once a sponsored agent caps for their anniversary year, your revenue share from them pauses until their cap resets — the pool only pays on active splits.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div id="calculator-revshare"&gt;
    &lt;iframe src="https://ottawapropertyshop-design.github.io/ottawa-market-widgets/revenue-share-calculator.html" width="100%" height="1080" frameborder="0" style="border:0;border-radius:12px;overflow:hidden;" title="Revenue-Share Calculator"&gt;&lt;/iframe&gt;
  &lt;/div&gt;

  &lt;div class="static-example"&gt;
    &lt;div class="label"&gt;Static worked example (if the calculator above does not load)&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;10 personally sponsored agents, each capping at $80,000 GCI.&lt;/strong&gt; Tier 1 pays 3.5% of $80,000 = $2,800 per capping agent. &lt;strong&gt;10 × $2,800 = $28,000/year&lt;/strong&gt; from Tier 1 alone.&lt;/p&gt;
    &lt;p&gt;Add Tier 2: say 8 of those agents each attracted 2 productive agents (16 agents), all capping. Tier 2 pays 4.0% of $80,000 = $3,200 per agent (max $3,200). &lt;strong&gt;16 × $3,200 = $51,200/year.&lt;/strong&gt; Combined Tiers 1–2: &lt;strong&gt;$79,200/year&lt;/strong&gt; — paid from eXp's cut, costing the attracted agents nothing.&lt;/p&gt;
    &lt;p class="fine"&gt;Simplified illustration only; results not typical. Real payouts depend on pool mechanics, AGCI adjustments, and anniversary timing. Most agents earn far less — read the honest breakdown next.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;The honest part: what the "$0 median" actually measures&lt;/h3&gt;
  &lt;p&gt;You will see "$0 median revenue share" quoted about eXp — including on eXp's own 2025 Income Disclosure (exprealty.com/income). Here is what that number actually measures, because almost nobody reads the footnote:&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;The $0 is the median of the &lt;strong&gt;"Entering" persona&lt;/strong&gt; — agents earning &lt;strong&gt;$0–$100 in total compensation for the year&lt;/strong&gt; (commissions &lt;em&gt;and&lt;/em&gt; revenue share combined, not revenue share alone).&lt;/li&gt;
    &lt;li&gt;It is measured across &lt;strong&gt;all 85,377 registered agents, including inactive and part-time ones&lt;/strong&gt; — 38.73% of the roster sits in Entering.&lt;/li&gt;
    &lt;li&gt;Among &lt;strong&gt;active agents with more than one year at eXp, the Entering group shrinks to 8.55%&lt;/strong&gt;. Median total compensation: &lt;strong&gt;$4,985&lt;/strong&gt; across everyone registered, &lt;strong&gt;$13,463&lt;/strong&gt; for active agents, &lt;strong&gt;$22,175&lt;/strong&gt; for active agents past year one.&lt;/li&gt;
    &lt;li&gt;In 2025, eXp paid &lt;strong&gt;over $160 million in revenue share (U.S.)&lt;/strong&gt; — real money, concentrated among the agents who consistently attract productive agents.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;eXp publishes &lt;strong&gt;no official "% of agents who earn revenue share" figure&lt;/strong&gt; — anyone quoting one invented it. The honest read: revenue share flows only to agents who actively attract. It is a compounding asset for the productive minority, not a participation trophy. Joining Tom's Managed Lead Generation program and weekly mastermind puts you inside the group that actually builds it — instead of hoping to stumble into it.&lt;/p&gt;
  &lt;p&gt;Two more facts worth knowing: revenue share is &lt;strong&gt;willable&lt;/strong&gt; — it can pass to your heirs — and payouts can be requested on demand rather than waiting for a monthly cycle.&lt;/p&gt;
  &lt;p&gt;Want the full deep dive? &lt;a href="https://www.sellingottawa.realestate/blog/eXp+Realty+Revenue+Share+Explained%3A+The+7-Tier+System+%282026%29"&gt;Read the standalone guide: eXp Realty Revenue Share Explained — The 7-Tier System (2026)&lt;/a&gt;. &lt;!-- EXPLAINER-URL: standalone 7-tier explainer page, to be replaced --&gt;&lt;/p&gt;
&lt;/section&gt;

&lt;!-- ============================ STOCK AWARDS ============================ --&gt;
&lt;section id="stock-awards"&gt;
  &lt;div class="badge"&gt;Ownership&lt;/div&gt;
  &lt;h2&gt;eXp Realty stock awards and equity: becoming an owner&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;eXp agents earn stock in the parent company, now called AGNT, Inc. (Nasdaq: AGNT — the EXPI ticker changed in May 2026). Awards are granted for your first deal, for capping, and for every agent you sponsor who closes their first deal — plus up to $16,000 a year in stock through the ICON program. Awards are priced in CAD for Canadian agents and vest over three years.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;At a traditional brokerage, you are a contractor forever. At eXp, the model is designed to turn producers into shareholders. Here is how the stock side works in Canada.&lt;/p&gt;
  &lt;h3&gt;The Sustainable Equity Plan (automatic awards)&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;First transaction&lt;/strong&gt; of each anniversary year: &lt;strong&gt;$200&lt;/strong&gt; in stock.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Reaching the $16,000 cap:&lt;/strong&gt; &lt;strong&gt;$400&lt;/strong&gt; in stock.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Each agent you sponsor who closes their first deal:&lt;/strong&gt; &lt;strong&gt;$400&lt;/strong&gt; in stock per agent, per year.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p&gt;Awards vest over three years and are priced in Canadian dollars for Canadian agents. You must remain licensed with eXp through vesting.&lt;/p&gt;
  &lt;h3&gt;The Agent Equity Program (optional)&lt;/h3&gt;
  &lt;p&gt;You can elect to put 5% of each commission toward buying AGNT stock at a discount. &lt;strong&gt;Note:&lt;/strong&gt; older official materials cite a 10% discount while a 2026 agent source cites 5% — &lt;em&gt;the current discount is unverified&lt;/em&gt; and must be confirmed against the current plan documents before publishing or relying on it.&lt;/p&gt;
  &lt;!-- HTML COMMENT: Agent Equity Program discount conflict — 10% (older official/RISMedia) vs 5% (Sept 2026 agent source). Verify against current official plan documents before publishing a figure. --&gt;
  &lt;h3&gt;The ticker changed: EXPI is now AGNT&lt;/h3&gt;
  &lt;p&gt;In May 2026 the holding company rebranded from eXp World Holdings to &lt;strong&gt;AGNT, Inc.&lt;/strong&gt;, and the Nasdaq ticker changed from EXPI to &lt;strong&gt;AGNT&lt;/strong&gt;. Most of the internet still says EXPI — any article, video, or sponsor page quoting EXPI is working from outdated information. For context on equity value: AGNT closed at &lt;strong&gt;$3.65 on October 2, 2026&lt;/strong&gt; (52-week range $3.40–$7.06), and the company pays a quarterly dividend of $0.05 per share. Stock prices move; treat equity as a long-term asset, not a guaranteed payout.&lt;/p&gt;
  &lt;p class="fine"&gt;Stock awards involve market risk and vesting conditions. This is general information, not investment advice.&lt;/p&gt;
&lt;/section&gt;

&lt;!-- ============================ ICON ============================ --&gt;
&lt;section id="icon"&gt;
  &lt;h2&gt;The ICON Agent Program: up to $16,000 back in stock&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;ICON is eXp's top-producer award. Qualify in your anniversary year and eXp awards you up to $16,000 CAD in AGNT stock: $8,000 for production (3-year vest), $4,000 for cultural contribution (2-year vest), and $2,000 each for attending the Shareholder Summit and EXPCON. It is repeatable every year.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;ICON is the program that makes the cap math poetic: the same $16,000 you paid in splits can come back to you as $16,000 in company stock — if you produce at an elite level and contribute to the culture. Two ways to qualify in an anniversary year:&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Path 1 — production:&lt;/strong&gt; pay the $16,000 cap and then close roughly 20 additional transactions in the same anniversary year (paying the post-cap transaction fees on them).&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Path 2 — GCI:&lt;/strong&gt; earn $500,000+ in gross commission income with a minimum of 10 closed transactions, plus an ICON qualifying fee.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;!-- HTML COMMENT: ICON Path 1 qualifying transaction-fee total — one Canadian agent source states $5,400 total; the official $285 × 20 post-cap schedule implies $5,700. CONFLICT UNRESOLVED. Verify against the current official ICON program chart before publishing a dollar figure, and do not publish the $5,400 figure. --&gt;
  &lt;p&gt;Beyond production, ICON has a cultural bar: mentoring, teaching, serving on the ICON committee, and a vetting interview. ICONs interview future ICONs — the status carries real peer recognition, and it signals to consumers and to agents you attract that you operate at the top of the profession.&lt;/p&gt;
  &lt;p class="fine"&gt;ICON qualification rules and award amounts are set by eXp corporate and can change. "Up to $16,000 in stock" is the official award size per exprealty.ca/income; qualification details should be re-verified against the current official ICON chart before publishing.&lt;/p&gt;
&lt;/section&gt;

&lt;!-- ============================ HOOK 3 / COMPARISONS ============================ --&gt;
&lt;section id="leaving"&gt;
  &lt;div class="badge"&gt;Compare before you decide&lt;/div&gt;
  &lt;h2&gt;Thinking of Leaving Your Brokerage&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;No brokerage is "best" in the abstract — only best for your economics. Below: eXp Realty vs Keller Williams, Real, LPT, Compass, and the traditional RE/MAX / Royal LePage model, on splits, caps, fees, revenue share, and equity. Two industry earthquakes in 2026 (Real acquiring RE/MAX; Compass acquiring Anywhere) changed several of these companies — most comparison pages online predate both deals and are now wrong.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;The honest way to choose a brokerage is a table, not a pitch. Figures below are US unless marked CAD; office-set figures vary by location — confirm with the local office. All figures dated October 2026.&lt;/p&gt;

  &lt;h3&gt;eXp Realty vs Keller Williams&lt;/h3&gt;
  &lt;p&gt;The classic comparison, and the keyword half the industry searches. The structural difference is not the split — it is &lt;strong&gt;revenue share vs profit share&lt;/strong&gt;. eXp pays revenue share from its company dollar: predictable, published, paid whether or not any office is profitable. Keller Williams pays profit share from market-center profit: if your market center has a bad year, the pool can be zero. KW also adds a 6% royalty (capped around $3,000) on top of its 70/30 split, and its caps are set per market center (often $15,000–$36,000+), not one national number. KW's strengths are real — deep training and coaching culture — but on pure economics, a producing agent usually keeps more at eXp.&lt;/p&gt;

  &lt;h3&gt;eXp Realty vs Real Broker&lt;/h3&gt;
  &lt;p&gt;Real is eXp's closest cloud-brokerage rival: 85/15 split, a $12,000 US cap ($15,000 CAD in Canada), no monthly fee, and its own 5-tier revenue share plus stock. On headline fees, Real can look cheaper. The 2026 twist: &lt;strong&gt;Real acquired RE/MAX&lt;/strong&gt; (deal closed August 2026) and now operates as the Real REMAX Group with 180,000+ agents across 120+ countries. That merger changes the company's trajectory — bigger, but also a franchise business grafted onto a cloud brokerage. Worth watching, not worth assuming.&lt;/p&gt;

  &lt;h3&gt;eXp Realty vs LPT Realty&lt;/h3&gt;
  &lt;p&gt;LPT is the fastest-growing single brokerage entity of the last four years (zero to 20,000+ agents since ~2022). Its Brokerage Partner plan mirrors eXp's shape — 80/20, ~$15,000 cap, 7-tier revenue share — with lower headline fees, while its Business Builder plan offers a flat $500-per-transaction model for high-volume agents. Caveats: LPT's stock is private (pre-IPO per agent sources — unverified), and its Canadian fee schedule and presence are not verified against official sources. If you are comparing on verified Canadian numbers, eXp's published CAD schedule is the firmer ground.&lt;/p&gt;

  &lt;h3&gt;eXp Realty vs Compass&lt;/h3&gt;
  &lt;p&gt;Compass competes on luxury branding and its Compass One tech platform, not on agent economics — splits and caps are negotiated privately, not published. Post-January 2026, Compass closed its acquisition of Anywhere Real Estate and now sits atop roughly 340,000 agents worldwide as Compass International Holdings (with a New York antitrust probe ongoing). If brand prestige and in-house tech are your priority, Compass is the pitch. If your priority is keeping your commission and building equity, the models are not in the same conversation.&lt;/p&gt;

  &lt;h3&gt;eXp Realty vs RE/MAX and Royal LePage (the traditional model)&lt;/h3&gt;
  &lt;p&gt;The traditional big-box model: high splits (RE/MAX's recommended 95/5) paired with heavy desk fees ($500–$2,000+/month, office-set), no cap on what the office collects, no revenue share, no equity. Royal LePage in Canada runs 70/30 to 95/5 depending on the office, again with office-set desk fees. These models can work for agents who want maximum split and a physical office — but every dollar of desk fee is paid whether you close or not, and nothing you build there compounds. Note the 2026 reality: RE/MAX is now owned by the Real REMAX Group, so "independent RE/MAX" comparisons are describing a company that no longer exists in that form.&lt;/p&gt;

  &lt;h3&gt;The comparison table&lt;/h3&gt;

    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;eXp Realty (Canada)&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;80/20&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$16,000 CAD&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;$139/mo CAD&lt;/strong&gt; + $29 review/deal&lt;/td&gt;&lt;td&gt;7-tier revenue share (up to 50% of company dollar); willable&lt;/td&gt;&lt;td&gt;AGNT stock awards + ICON up to $16K&lt;/td&gt;&lt;td&gt;Cap + wealth-building (rev share/equity), cloud model&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Real Broker (Canada)&lt;/td&gt;&lt;td&gt;85/15&lt;/td&gt;&lt;td&gt;$15,000 CAD&lt;/td&gt;&lt;td&gt;No monthly; $1,200/yr; $40 review&lt;/td&gt;&lt;td&gt;5-tier revenue share&lt;/td&gt;&lt;td&gt;Stock awards + auto-enroll&lt;/td&gt;&lt;td&gt;Low-fee cloud brokerage fans&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Keller Williams&lt;/td&gt;&lt;td&gt;70/30 + 6% royalty&lt;/td&gt;&lt;td&gt;Office-set (~$15K–$36K+)&lt;/td&gt;&lt;td&gt;~$50–$125/mo, office-set&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Profit&lt;/strong&gt; share, 7 levels (only if profitable)&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;Training/coaching seekers&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;LPT Realty&lt;/td&gt;&lt;td&gt;80/20 (Partner) or $500/deal flat (Builder)&lt;/td&gt;&lt;td&gt;$15,000 / $5,000&lt;/td&gt;&lt;td&gt;$500/yr + optional $89–$149/mo&lt;/td&gt;&lt;td&gt;7-tier revenue share (Partner only)&lt;/td&gt;&lt;td&gt;Private stock (unverified)&lt;/td&gt;&lt;td&gt;eXp-like rev share, lower headline fees&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Compass&lt;/td&gt;&lt;td&gt;Negotiated (not published)&lt;/td&gt;&lt;td&gt;Negotiated&lt;/td&gt;&lt;td&gt;Varies&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;Luxury branding, in-house tech&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;RE/MAX / Royal LePage&lt;/td&gt;&lt;td&gt;95/5 to 70/30 (office-set)&lt;/td&gt;&lt;td&gt;Office-set / none&lt;/td&gt;&lt;td&gt;$500–$2,000+/mo desk fees&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;Max split + physical office presence&lt;/td&gt;&lt;/tr&gt;

&lt;!-- ============================ TRAINING / TECH / BENEFITS ============================ --&gt;
&lt;section id="training-tech"&gt;
  &lt;h2&gt;Training, technology, and benefits: what the monthly fee funds&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;Dozens of hours of live weekly training through eXp University, your choice of three full CRMs included in the $139/month, a virtual campus instead of a physical office, and access to a group benefits plan in Canada. This is the section no competitor attraction page writes — and the one experienced agents ask about on every call.&lt;/p&gt;
  &lt;/div&gt;
  &lt;h3&gt;Training: eXp University&lt;/h3&gt;
  &lt;p&gt;Live training runs dozens of hours a week — production, contracts, marketing, and leadership tracks — plus on-demand libraries, a new-agent bootcamp, and the mentor program. &lt;strong&gt;FastCAP&lt;/strong&gt;, the 6-week productivity accelerator, drew 21,273 registrations; active participants averaged 6.9 appointments and 3.9 signed agreements, and the program won two Brandon Hall Gold awards in September 2026. If your current brokerage's "training" is a monthly sales meeting, the gap is hard to overstate.&lt;/p&gt;
  &lt;h3&gt;Technology: CRM of Choice and the virtual campus&lt;/h3&gt;
  &lt;p&gt;Since July 2025, agents choose their CRM: &lt;strong&gt;BoldTrail&lt;/strong&gt; (the rebuilt kvCORE), &lt;strong&gt;Cloze&lt;/strong&gt;, or &lt;strong&gt;Lofty&lt;/strong&gt; — all included in the monthly fee. Around it: Skyslope for transaction management, eXp Enterprise for your commission/cap/equity dashboard, the My eXp app, and Sisu for production tracking. eXp World remains the virtual campus for classes and collaboration (note: the platform is in transition, with FrameVR.io in the corporate portfolio and a migration from Slack to "The Hub" underway — verify the current state before relying on specifics).&lt;/p&gt;

  &lt;h3&gt;What this tech stack would cost you alone&lt;/h3&gt;
  &lt;p&gt;Here is the part nobody prices out. If you bought these CRMs as an independent agent instead of getting them inside eXp's $139/month:&lt;/p&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;CRM&lt;/th&gt;&lt;th class="num"&gt;Standalone cost (reported)&lt;/th&gt;&lt;th&gt;What you get&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;BoldTrail&lt;/strong&gt; (Inside Real Estate)&lt;/td&gt;&lt;td class="num"&gt;~$449–$1,099/mo &lt;span class="fine"&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Smart CRM + IDX website + lead routing; $1,000–$5,000 onboarding reported. No published list price — quote-based.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Lofty&lt;/strong&gt; (formerly Chime)&lt;/td&gt;&lt;td class="num"&gt;from $449/mo &lt;span class="fine"&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;CRM + IDX website + AI follow-up; $500 setup; Premier from $700/mo. Quote-based.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Cloze&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;$17–$42/user/mo&lt;/td&gt;&lt;td&gt;Relationship CRM; no native IDX website — not apples-to-apples on IDX.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;At eXp Realty&lt;/strong&gt;&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;$0 extra&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Your choice of all three, inside the $139/month cloud fee.&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;p class="fine"&gt;Third-party reported figures, October 2026, labeled estimates — BoldTrail and Lofty do not publish list prices. For illustration only; confirm current pricing with each vendor.&lt;/p&gt;

  &lt;h3&gt;Why Tom joined eXp — in his own words&lt;/h3&gt;
  &lt;p&gt;"I did not join eXp for the hype. I joined for the &lt;strong&gt;BoldTrail CRM with real IDX capability&lt;/strong&gt; — a website and CRM that actually capture and work leads, included in the monthly fee instead of billed at $500-plus a month — and for the &lt;strong&gt;telelisting connection to the Do Not Call List&lt;/strong&gt;, so my prospecting stays compliant. Twenty-plus years in this business taught me that the brokerage decision comes down to two things: what it costs you, and what it gives you to get business. eXp won on both."&lt;/p&gt;
  &lt;p&gt;That is also why every agent who joins with Tom gets a &lt;strong&gt;free telelisting.net account, connected to the National Do Not Call List&lt;/strong&gt; — so you never cold-call a number you should not have called and never learn what a CRTC fine feels like. Compliance is not exciting. Fines are worse.&lt;/p&gt;

  &lt;h3&gt;Benefits in Canada&lt;/h3&gt;
  &lt;p&gt;eXp Realty Canada agents get access to a &lt;strong&gt;group benefits plan&lt;/strong&gt; (extended health, drugs, paramedical, vision, out-of-country coverage across tiered options). Be clear-eyed about what this is: an agent-paid group plan at group rates, not employer-paid coverage. Still, group rates beat anything you can buy as a solo contractor — and almost no attraction page mentions it.&lt;/p&gt;
&lt;/section&gt;

&lt;!-- ============================ SPONSOR ============================ --&gt;
&lt;section id="sponsor"&gt;
  &lt;h2&gt;Why your eXp Realty sponsor choice matters&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;When you join eXp Realty, you name a sponsor on your application — the agent who introduced you. That relationship is difficult to change after the fact, and it determines whose training, masterminds, and lead-generation resources you get on top of everything eXp corporate provides. Tom joins as your &lt;strong&gt;co-sponsor&lt;/strong&gt;, with his lead-generation partner as &lt;strong&gt;sponsor&lt;/strong&gt; — a free add-on for transferring and new agents that exists only because of eXp's structure and revenue-share model. Choose the team whose program you would actually use.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;Here is what "best eXp Realty sponsor" actually means in practice. Your sponsor does not change your split, your cap, your fees, or your revenue-share percentages — those are set by eXp corporate and are identical for everyone. What your sponsor's team controls is the &lt;strong&gt;layer on top&lt;/strong&gt;: the training you get, the community you join, the systems you can plug into, and whether anyone picks up the phone when you have a question at 9 PM before a closing.&lt;/p&gt;

  &lt;h3&gt;The one thing that matters most: lead generation&lt;/h3&gt;
  &lt;p&gt;Strip away everything else and an agent's career comes down to one thing: &lt;strong&gt;lead generation&lt;/strong&gt;. Not the split. Not the logo. Not the office. The agent with a working lead-generation system eats; the agent without one starves, at any brokerage, at any split. Everything on this page — the cap, the tiers, the stock — is arithmetic. Lead generation is oxygen.&lt;/p&gt;
  &lt;p&gt;That is why Tom's offer is built around it. Tom has sold homes in Ottawa for &lt;strong&gt;20+ years&lt;/strong&gt;, runs a &lt;strong&gt;weekly mastermind&lt;/strong&gt; with producing agents and connected agent groups, and gives the agents who join with him access to his &lt;strong&gt;Managed Lead Generation program&lt;/strong&gt; — where the leads you generate are &lt;strong&gt;100% yours&lt;/strong&gt;, with &lt;strong&gt;no splits on lead generation&lt;/strong&gt;. This page will not detail the program's inner workings; the mastermind holds a regular &lt;strong&gt;information session&lt;/strong&gt;, and the way in is simple:&lt;/p&gt;
  &lt;div class="cta-row"&gt;
    &lt;a class="btn" href="#contact"&gt;Reach Out to Tom — Register for the 1-Hour Zoom Info Session&lt;/a&gt;
  &lt;/div&gt;
  &lt;p class="fine"&gt;The info session explains the free program in full: what it is, how agents use it, and how to get in. One hour, no pitch for anything else.&lt;/p&gt;

  &lt;h3&gt;How the sponsor setup works with Tom&lt;/h3&gt;
  &lt;p&gt;When you join with Tom — an Ottawa, Ontario agent selling homes since 2005 — &lt;strong&gt;Tom is your co-sponsor&lt;/strong&gt; and &lt;strong&gt;his partner — the person who sets up your lead-generation program — is your sponsor&lt;/strong&gt;. It works as a &lt;strong&gt;free add-on&lt;/strong&gt; for transferring and new agents, and it is possible &lt;strong&gt;only because of eXp's structure and revenue-share model&lt;/strong&gt;: eXp pays the sponsor team from its own company dollar, so the program costs you nothing — no extra split, no fee.&lt;/p&gt;

  &lt;h3&gt;Sponsor vs co-sponsor: the official eXp program, in plain English&lt;/h3&gt;
  &lt;p&gt;In May 2025 eXp launched an official &lt;strong&gt;Co-Sponsor Program&lt;/strong&gt; (announced at eXpcon Montreal) that formalizes exactly the setup above. Here is what each role means — verified against eXp's program terms:&lt;/p&gt;
  &lt;table class="tier-table"&gt;
    &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Primary sponsor&lt;/th&gt;&lt;th&gt;Co-sponsor&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Who&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;The agent who attracted you to eXp — your Tier 1 upline connection&lt;/td&gt;&lt;td&gt;One additional leader you choose — Tom, in this arrangement&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Revenue share&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Levels 2–7 (when a co-sponsor occupies Level 1); keeps FLQA qualifications and stock awards&lt;/td&gt;&lt;td&gt;Takes the Tier 1 position: Level 1 revenue share (3.5%, up to $2,800/yr per capping agent) + 50% of the Fast Start bonus (up to $2,000 of $4,000)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Limits&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;One primary sponsor&lt;/td&gt;&lt;td&gt;ONE co-sponsor only; must be designated within 5 days of going active; creates no extra tiers and no access to the co-sponsor's upline or systems&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Permanence&lt;/strong&gt;&lt;/td&gt;&lt;td colspan="2"&gt;Both designations are permanent once recorded. Changing sponsors generally requires leaving eXp for 12+ months and rejoining — and rejoiners cannot add a co-sponsor.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Effect on you&lt;/strong&gt;&lt;/td&gt;&lt;td colspan="2"&gt;&lt;strong&gt;Zero.&lt;/strong&gt; Your commission, split, cap, and fees are identical either way — all sponsorship economics come from eXp's company dollar, never from your cheque. You simply get two leaders instead of one.&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;p&gt;Tom's mapping, stated plainly: &lt;strong&gt;Tom is your co-sponsor&lt;/strong&gt; — he provides the &lt;strong&gt;Managed Lead Generation program&lt;/strong&gt; (the leads you generate are 100% yours, no splits on lead generation, free to administer and create, 3 AI videos free). &lt;strong&gt;His partner is your primary sponsor&lt;/strong&gt; — the person who sets up your lead-generation program, earning Levels 2–7, FLQA credit, and stock awards. This free add-on exists only because of eXp's structure and revenue-share model.&lt;/p&gt;
  &lt;p&gt;New to the industry? The sponsor choice matters even more on your first brokerage — read the companion guide: Best Brokerage for New Real Estate Agents (2026): The Honest eXp Realty Guide for New Licensees (forthcoming).&lt;/p&gt;
  &lt;p&gt;Questions worth asking any prospective sponsor team: Are they still actively selling, or has selling taken a back seat? What exactly do their agents get — weekly training, or a Facebook group? Do they offer real lead generation, or just motivation? How long have they been producing in their market, and who do they learn alongside?&lt;/p&gt;
  &lt;p&gt;One caution the hype pages skip: your sponsor and co-sponsor designations are &lt;strong&gt;permanent&lt;/strong&gt; once recorded — changing them generally requires leaving eXp for 12+ months and rejoining, and rejoiners cannot add a co-sponsor. Treat the choice with the seriousness it deserves.&lt;/p&gt;
  &lt;p&gt;For the full mechanics of the 7-tier system your sponsor team participates in: &lt;a href="https://www.sellingottawa.realestate/blog/eXp+Realty+Revenue+Share+Explained%3A+The+7-Tier+System+%282026%29"&gt;eXp Realty Revenue Share Explained — The 7-Tier System (2026)&lt;/a&gt;. &lt;!-- EXPLAINER-URL: standalone 7-tier explainer page, to be replaced --&gt;&lt;/p&gt;
  &lt;p&gt;Still weighing the move itself? &lt;a href="https://www.sellingottawa.realestate/blog/What+Every+Real+Estate+Agent+Needs+to+Know+Before+Choosing+a+Brokerage%3A+Action+Taker+vs+Perfectionist"&gt;Read: What Every Real Estate Agent Needs to Know Before Choosing a Brokerage: Action Taker vs Perfectionist&lt;/a&gt;.&lt;/p&gt;
  &lt;div class="cta-row"&gt;
    &lt;a class="btn" href="#contact"&gt;Talk to Tom Before You Decide&lt;/a&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================ TEAMS ============================ --&gt;
&lt;section id="teams"&gt;
  &lt;div class="badge"&gt;Teams welcome&lt;/div&gt;
  &lt;h2&gt;Bringing your team to eXp Realty: caps, perks, and how it works&lt;/h2&gt;
  &lt;div class="tldr"&gt;
    &lt;div class="label"&gt;TL;DR — Key takeaway&lt;/div&gt;
    &lt;p&gt;eXp has four team structures, and the big three cut your members' caps — down to $8,000 or even $4,000 — while the team leader escapes franchise fees and royalties on team production entirely. A team leader or brokerage owner joining with Tom names &lt;strong&gt;Tom as co-sponsor&lt;/strong&gt; (unlocking the Managed Lead Generation program) with Tom's lead-generation partner as &lt;strong&gt;sponsor&lt;/strong&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p class="fine"&gt;Structures summarized from 2026 third-party sources — verify against current official eXp team policy before relying on specifics.&lt;/p&gt;
  &lt;table class="tier-table"&gt;
    &lt;tr&gt;&lt;th&gt;Structure&lt;/th&gt;&lt;th&gt;Who qualifies&lt;/th&gt;&lt;th&gt;Member caps&lt;/th&gt;&lt;th&gt;Key terms&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Self-Organized Team&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Any eXp agents; no production minimum&lt;/td&gt;&lt;td class="num"&gt;$16,000 each (no reduction)&lt;/td&gt;&lt;td&gt;Any team split; mostly a marketing structure.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Standard / Traditional Team&lt;/strong&gt; (half-cap)&lt;/td&gt;&lt;td&gt;Leader: $6M volume or 30 units in prior 12 months&lt;/td&gt;&lt;td class="num"&gt;Members may elect &lt;strong&gt;$8,000&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;~15% average to leader (Canada: 25% minimum per deal). Half-cap members are NOT ICON-eligible.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Mega ICON Team&lt;/strong&gt; (quarter-cap)&lt;/td&gt;&lt;td&gt;Leader: $40M volume or 140 units in prior 12 months + $56,000 company-dollar guarantee; 11+ members&lt;/td&gt;&lt;td class="num"&gt;Members may elect &lt;strong&gt;$4,000 / $8,000 / $16,000&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;25% average to leader. ICON via team production ($16K leader + $40K members = $56K).&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Domestic Partnership&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Two legally married agents&lt;/td&gt;&lt;td class="num"&gt;&lt;strong&gt;$16,000 combined&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;One shared cap and one monthly fee for the pair.&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;h3&gt;Why team leaders switch: the economics&lt;/h3&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;No franchise fees or royalties on team production&lt;/strong&gt; — at a franchise brokerage the leader pays on every team deal; at eXp each member is an individual agent with their own split and cap.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Reduced caps for members&lt;/strong&gt; make the team an easier sell to agents you want to hire.&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Revenue share on members' production&lt;/strong&gt; flows to the sponsor — the leader's agent-attraction work compounds instead of just costing.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;h3&gt;Teams joining with Tom&lt;/h3&gt;

  &lt;/div&gt;
&lt;/section&gt;

    &lt;div class="value-row"&gt;&lt;span class="item"&gt;&lt;strong&gt;Listing and buyer presentation assets&lt;/strong&gt; — Tom's proven presentation materials, adapted for your market&lt;/span&gt;&lt;span class="retail"&gt;$2,400/yr&lt;/span&gt;&lt;span class="yours"&gt;$0&lt;/span&gt;&lt;/div&gt;

&lt;!-- ============================ FAQ ============================ --&gt;
&lt;section id="faq"&gt;
  &lt;h2&gt;Questions agents ask before they join eXp Realty&lt;/h2&gt;
  &lt;p class="fine"&gt;Straight answers, October 2026. Where a figure comes from eXp's official disclosure, it is cited.&lt;/p&gt;

  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;How does eXp Realty work in Canada?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;You keep 80% of every commission until you have paid eXp $16,000 in your anniversary year (the cap, reached at $80,000 GCI). Then you keep 100% minus small per-deal fees. You pay $199 to join and $139/month plus tax. On top of commissions, you can earn 7-tier revenue share and AGNT stock awards. There are no offices, no desk fees, and no royalties.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What is the difference between a sponsor and a co-sponsor at eXp Realty?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Under eXp's official Co-Sponsor Program (launched May 2025), your primary sponsor is the agent who attracted you — your Tier 1 upline, earning Levels 2–7 revenue share plus FLQA qualifications and stock awards. An optional co-sponsor — one only, designated within 5 days of going active — takes the Tier 1 position: Level 1 revenue share (3.5%, up to $2,800/yr per capping agent) plus half the Fast Start bonus. Both designations are permanent, and neither changes your commission, split, cap, or fees — it all comes from eXp's company dollar. With Tom, he is your co-sponsor (providing the Managed Lead Generation program) and his partner is your primary sponsor.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What is the eXp Realty commission split in Canada?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;80/20 — you keep 80%, eXp keeps 20% — until the $16,000 annual cap. After the cap, the split turns off and you keep 100% of every commission minus per-deal transaction fees ($285 for the first 20 post-cap deals, then $75). Verified October 2026 at exprealty.ca/income.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;How much is the eXp Realty cap in Canada, and when does it reset?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;$16,000 CAD per anniversary year — your personal 12-month cycle starting on your join date, not the calendar year. You hit it at $80,000 in gross commission income (20% × $80,000 = $16,000). It resets every anniversary.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What are the eXp Realty fees in Canada — the full list?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;$199 one-time startup fee; $139/month cloud brokerage fee plus HST/GST/PST; $29 broker review fee per transaction; $285 per deal for your first 20 post-cap transactions (max $5,700), then $75 per deal. No desk fees, no franchise fees, no royalties — those do not exist at eXp.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;Is the $139/month fee plus tax?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Yes — the $139 CAD monthly cloud brokerage fee is subject to applicable provincial taxes (HST/GST/PST), per eXp's official Canadian schedule.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What happens after I cap at eXp Realty?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;You keep 100% of every commission for the rest of your anniversary year. eXp charges a $285 transaction fee on each of your next 20 deals (maximum $5,700 total), and then the fee drops to $75 per deal. Your revenue-share earnings from capped agents pause until their anniversary reset, since the pool only pays on active splits.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;How does eXp Realty revenue share work?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;eXp commits about half of its 20% company cut to a monthly revenue-share pool. When agents you attracted to eXp pay their splits, you earn a percentage of each agent's adjusted GCI across 7 tiers — Tier 1 pays 3.5%, up to $2,800/year per capping agent; Tier 7 pays up to $4,000/year per capping agent. It costs $0 to participate, and the money comes from eXp's cut, never from the attracted agent's pocket. Results not typical — revenue share flows to agents who consistently attract productive agents (see the honest breakdown in the revenue-share section).&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;How much can I earn from each revenue share tier?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;eXp's published maximums per capping agent per year: Tier 1 (3.5%) $2,800; Tier 2 (4.0%) $3,200; Tier 3 (2.5%) $2,000; Tier 4 (1.5%) $1,200; Tier 5 (1.0%) $800; Tier 6 (2.5%) $2,000; Tier 7 (5.0%) $4,000. Worked at the published rates on one $80,000-GCI agent: $2,800 / $3,200 / $2,000 / $1,200 / $800 / $2,000 / $4,000. Maximums per capping agent, for illustration only; results are not typical.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What is an FLQA and how do tiers unlock?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;FLQA is eXp's term for a productive sponsored agent (roughly: a personally sponsored agent who earned about $5,000 in GCI in the last six months). Under REV Share 2.0, Tiers 1–3 unlock immediately with zero qualifiers; Tiers 4, 5, and 6 unlock at 5, 10, and 15 productive sponsored agents; Tier 7 unlocks at 30.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;Do I have to attract agents to earn at eXp Realty?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;No. Most eXp agents never earn a dollar of revenue share — and they do perfectly well on the 80/20 split, the $16,000 cap, and 100% commissions after capping. Revenue share is an optional second income stream for agents who attract consistently, not a requirement and not a signup bonus.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;Is eXp Realty a pyramid scheme?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;No. The defining features of a pyramid scheme — paying to participate, earning from sign-up fees rather than real commerce — are absent: revenue share costs $0 to join, pays only when attracted agents close real transactions and pay real splits, and agents earn full commissions without attracting anyone. eXp is a publicly traded company (Nasdaq: AGNT) with audited financials reporting $1.4B in Q2 2026 revenue from 132,497 real transactions.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What is the eXp Realty ICON agent program?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;ICON is eXp's top-producer award. Qualify in your anniversary year — either by capping plus roughly 20 more transactions, or by $500,000+ GCI with at least 10 deals — and eXp awards you up to $16,000 CAD in AGNT stock: $8,000 for production (3-year vest), $4,000 for cultural contribution like mentoring and teaching (2-year vest), and $2,000 each for attending the Shareholder Summit and EXPCON. It is repeatable every year, subject to program rules.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What stock do eXp agents get — EXPI or AGNT?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;AGNT. The holding company rebranded from eXp World Holdings to AGNT, Inc. in May 2026 and the Nasdaq ticker changed from EXPI to AGNT. Any page, video, or sponsor still saying EXPI is working from outdated information. Canadian agents' awards are priced in CAD.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What eXp Realty stock awards can a regular agent earn?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Under the Sustainable Equity Plan: $200 in stock for your first transaction each anniversary year, $400 when you hit the $16,000 cap, and $400 for each agent you sponsor who closes their first deal (per agent, per year). Awards vest over three years. There is also an optional Agent Equity Program letting you direct 5% of commissions into stock purchases at a discount — confirm the current discount against official plan documents, as published figures conflict.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;Does eXp Realty offer health insurance in Canada?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Agents get access to a group benefits plan (extended health, drug coverage, paramedical, vision, and out-of-country across tiered options) at group rates. It is an agent-paid group plan, not employer-paid coverage — but group rates beat anything you can buy as a solo contractor.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What CRM does eXp Realty use — is it still kvCORE?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;kvCORE was rebuilt and rebranded as &lt;strong&gt;BoldTrail&lt;/strong&gt;. Since the July 2025 "CRM of Choice" launch, agents choose between BoldTrail, Cloze, or Lofty — all included in the $139/month fee. Around it: Skyslope for transactions, eXp Enterprise for your commission/cap/equity dashboard, the My eXp app, and Sisu for production tracking.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What would the CRM cost me if I bought it myself?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Third-party reported figures (October 2026, estimates — BoldTrail and Lofty do not publish list prices): BoldTrail ~$449–$1,099/month plus $1,000–$5,000 onboarding; Lofty from ~$449/month plus $500 setup; Cloze $17–$42/user/month (no native IDX website). At eXp, your choice of all three is included in the $139/month cloud fee.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What is eXp World?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;eXp World is the company's virtual 3D campus — where classes, meetings, and collaboration happen instead of a physical office. Note: the platform is in transition (FrameVR.io is in the corporate portfolio and eXp is migrating internal comms from Slack to "The Hub"), so verify the current state before relying on specifics.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;How much training does eXp Realty provide?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Dozens of hours of live training every week through eXp University, plus on-demand libraries, a new-agent bootcamp, and a mentor program. The FastCAP 6-week accelerator drew 21,273 registrations, with active participants averaging 6.9 appointments and 3.9 signed agreements — and it won two Brandon Hall Gold awards in September 2026.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What does the eXp Realty mentor program cost new agents?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;In Canada, new agents pay an additional 20% split on their first three transactions to fund mentorship. It is in the official income disclosure and most attraction pages omit it — now you know.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;Who is the best eXp Realty sponsor for an experienced agent?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;The one whose program you will actually use: still actively selling after 20+ years, running real weekly training and a live mastermind, offering a working lead-generation program where the leads are 100% yours, and connected to producing agent groups. Your split, cap, fees, and revenue-share percentages are set by eXp corporate and are identical regardless of sponsor team — the sponsor team controls the layer on top. With Tom, you get Tom as co-sponsor and his lead-generation partner as sponsor. And choose carefully: your sponsor designation is difficult to change once processed.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;Can I bring my team to eXp Realty?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Yes — eXp has four team structures. Self-organized (everyone keeps their $16,000 cap); standard half-cap teams (leader: $6M or 30 units; members may elect $8,000; ~15% average to leader, 25% per deal in Canada; half-cap members not ICON-eligible); Mega ICON quarter-cap teams (leader: $40M or 140 units + $56,000 company-dollar guarantee; 11+ members; members may elect $4,000/$8,000/$16,000; ICON via $56,000 team production); and domestic partnerships (married couples share one $16,000 cap). Team leaders joining with Tom name Tom as co-sponsor to unlock the Managed Lead Generation program. Talk to Tom about modeling your specific team's numbers before you move; the math differs from a solo agent's.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What does Tom's Managed Lead Generation program cost?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;$0 to the joining agent. You pay no splits on lead generation — the program is free to administer and create, and the 3 AI videos are free to you. It is a free add-on for transferring and new agents, possible only because of eXp's structure and revenue-share model. The leads you generate are 100% yours.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;Do I get a free telelisting.net account?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Yes — every agent who joins with Tom gets a free telelisting.net account connected to the National Do Not Call List, so your prospecting stays compliant and you never find out what a CRTC fine feels like.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;eXp Realty vs Keller Williams — which costs a producing agent less?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Usually eXp. KW runs 70/30 plus a ~6% royalty with office-set caps ($15K–$36K+) and monthly fees; eXp Canada runs 80/20 with a single $16,000 national cap and $139/month. The deeper difference: eXp pays revenue share from company revenue (predictable), while KW pays profit share from market-center profit (which can be zero in a bad year). KW's edge is its coaching culture — weigh both.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;eXp Realty vs Real Broker — which is better in Canada?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Real's Canadian headline figures are competitive (85/15, $15,000 CAD cap, no monthly fee, 5-tier revenue share). eXp counters with a deeper 7-tier revenue share, the ICON stock program, a larger agent base (87,338 vs ~35,000), and a fully published Canadian fee schedule. Note Real's 2026 acquisition of RE/MAX — the combined company's direction is still unfolding.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;How do I join eXp Realty with Tom?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Call or message Tom at 613-314-1199 before you submit anything. He will walk you through the application: Tom is named as your &lt;strong&gt;co-sponsor&lt;/strong&gt; and his lead-generation partner — the person who sets up your lead-generation program — is named as your &lt;strong&gt;sponsor&lt;/strong&gt;. He will map your first 30 days and get you into the weekly mastermind and the Managed Lead Generation program from day one. Joining takes days, not months — but the sponsor choice deserves one serious conversation first.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="faq-item"&gt;
    &lt;p&gt;&lt;strong&gt;What does Tom's free lead-generation program include?&lt;/strong&gt;&lt;/p&gt;
    &lt;p&gt;Exclusive access through Tom to his Managed Lead Generation program — the same systems he uses in his Ottawa business — plus the weekly mastermind Zoom, 1-on-1 onboarding, his presentation assets, and a free telelisting.net account connected to the Do Not Call List. The leads you generate are 100% yours. It is included at $0 when you join with Tom as your co-sponsor: no extra split, no fee, no splits on lead generation.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

{

  "@type": "FAQPage",
  "mainEntity": [
    {"@type":"Question","name":"What is the difference between a sponsor and a co-sponsor at eXp Realty?","acceptedAnswer":{"@type":"Answer","text":"Under eXp official Co-Sponsor Program launched May 2025, the primary sponsor is the agent who attracted you (your Tier 1 upline, earning Levels 2-7 revenue share plus FLQA qualifications and stock awards). An optional co-sponsor (one only, designated within 5 days of going active) takes the Tier 1 position: Level 1 revenue share (3.5 percent, up to $2,800/yr per capping agent) plus half the Fast Start bonus. Both are permanent and neither changes your commission, split, cap, or fees. With Tom, he is your co-sponsor and his partner is your primary sponsor."}},
    {"@type":"Question","name":"How does eXp Realty work in Canada?","acceptedAnswer":{"@type":"Answer","text":"You keep 80% of every commission until you have paid eXp $16,000 in your anniversary year (the cap, reached at $80,000 GCI). Then you keep 100% minus small per-deal fees. You pay $199 to join and $139/month plus tax. On top of commissions, you can earn 7-tier revenue share and AGNT stock awards. There are no offices, no desk fees, and no royalties."}},
    {"@type":"Question","name":"What is the eXp Realty commission split in Canada?","acceptedAnswer":{"@type":"Answer","text":"80/20 — you keep 80%, eXp keeps 20% — until the $16,000 annual cap. After the cap, the split turns off and you keep 100% of every commission minus per-deal transaction fees ($285 for the first 20 post-cap deals, then $75). Verified October 2026 at exprealty.ca/income."}},
    {"@type":"Question","name":"How much is the eXp Realty cap in Canada, and when does it reset?","acceptedAnswer":{"@type":"Answer","text":"$16,000 CAD per anniversary year — your personal 12-month cycle starting on your join date, not the calendar year. You hit it at $80,000 in gross commission income (20% x $80,000 = $16,000). It resets every anniversary."}},
    {"@type":"Question","name":"What are the eXp Realty fees in Canada — the full list?","acceptedAnswer":{"@type":"Answer","text":"$199 one-time startup fee; $139/month cloud brokerage fee plus HST/GST/PST; $29 broker review fee per transaction; $285 per deal for your first 20 post-cap transactions (max $5,700), then $75 per deal. No desk fees, no franchise fees, no royalties."}},
    {"@type":"Question","name":"Is the $139/month fee plus tax?","acceptedAnswer":{"@type":"Answer","text":"Yes — the $139 CAD monthly cloud brokerage fee is subject to applicable provincial taxes (HST/GST/PST), per eXp's official Canadian schedule."}},
    {"@type":"Question","name":"What happens after I cap at eXp Realty?","acceptedAnswer":{"@type":"Answer","text":"You keep 100% of every commission for the rest of your anniversary year. eXp charges a $285 transaction fee on each of your next 20 deals (maximum $5,700 total), then the fee drops to $75 per deal."}},
    {"@type":"Question","name":"How does eXp Realty revenue share work?","acceptedAnswer":{"@type":"Answer","text":"eXp commits about half of its 20% company cut to a monthly revenue-share pool. When agents you attracted to eXp pay their splits, you earn a percentage of each agent's adjusted GCI across 7 tiers — Tier 1 pays 3.5%, up to $2,800/year per capping agent; Tier 7 pays up to $4,000/year per capping agent. It costs $0 to participate, and the money comes from eXp's cut, never from the attracted agent's pocket. Results not typical; revenue share flows to agents who consistently attract productive agents."}},
    {"@type":"Question","name":"How much can I earn from each revenue share tier?","acceptedAnswer":{"@type":"Answer","text":"Published maximums per capping agent per year: Tier 1 (3.5%) $2,800; Tier 2 (4.0%) $3,200; Tier 3 (2.5%) $2,000; Tier 4 (1.5%) $1,200; Tier 5 (1.0%) $800; Tier 6 (2.5%) $2,000; Tier 7 (5.0%) $4,000. For illustration only; results are not typical."}},
    {"@type":"Question","name":"What is an FLQA and how do tiers unlock?","acceptedAnswer":{"@type":"Answer","text":"FLQA is eXp's term for a productive sponsored agent. Under REV Share 2.0, Tiers 1-3 unlock immediately with zero qualifiers; Tiers 4, 5, and 6 unlock at 5, 10, and 15 productive sponsored agents; Tier 7 unlocks at 30."}},
    {"@type":"Question","name":"Do I have to attract agents to earn at eXp Realty?","acceptedAnswer":{"@type":"Answer","text":"No. Most eXp agents never earn a dollar of revenue share and do well on the 80/20 split, the $16,000 cap, and 100% commissions after capping. Revenue share is an optional second income stream for agents who attract consistently, not a requirement."}},
    {"@type":"Question","name":"Is eXp Realty a pyramid scheme?","acceptedAnswer":{"@type":"Answer","text":"No. Revenue share costs $0 to join, pays only when attracted agents close real transactions and pay real splits, and agents earn full commissions without attracting anyone. eXp is a publicly traded company (Nasdaq: AGNT) with audited financials reporting $1.4B in Q2 2026 revenue from 132,497 transactions."}},
    {"@type":"Question","name":"What is the eXp Realty ICON agent program?","acceptedAnswer":{"@type":"Answer","text":"ICON is eXp's top-producer award. Qualify in your anniversary year — by capping plus roughly 20 more transactions, or by $500,000+ GCI with at least 10 deals — and eXp awards up to $16,000 CAD in AGNT stock: $8,000 for production (3-year vest), $4,000 for cultural contribution (2-year vest), and $2,000 each for attending the Shareholder Summit and EXPCON. Repeatable yearly, subject to program rules."}},
    {"@type":"Question","name":"What stock do eXp agents get — EXPI or AGNT?","acceptedAnswer":{"@type":"Answer","text":"AGNT. The holding company rebranded from eXp World Holdings to AGNT, Inc. in May 2026 and the Nasdaq ticker changed from EXPI to AGNT. Canadian agents' awards are priced in CAD."}},
    {"@type":"Question","name":"What eXp Realty stock awards can a regular agent earn?","acceptedAnswer":{"@type":"Answer","text":"Under the Sustainable Equity Plan: $200 in stock for your first transaction each anniversary year, $400 when you hit the $16,000 cap, and $400 for each agent you sponsor who closes their first deal (per agent, per year). Awards vest over three years. An optional Agent Equity Program lets you direct 5% of commissions into stock purchases at a discount — confirm the current discount against official plan documents."}},
    {"@type":"Question","name":"Does eXp Realty offer health insurance in Canada?","acceptedAnswer":{"@type":"Answer","text":"Agents get access to a group benefits plan (extended health, drug coverage, paramedical, vision, and out-of-country across tiered options) at group rates. It is an agent-paid group plan, not employer-paid coverage."}},
    {"@type":"Question","name":"What CRM does eXp Realty use — is it still kvCORE?","acceptedAnswer":{"@type":"Answer","text":"kvCORE was rebuilt and rebranded as BoldTrail. Since the July 2025 CRM of Choice launch, agents choose between BoldTrail, Cloze, or Lofty — all included in the $139/month fee — alongside Skyslope, eXp Enterprise, the My eXp app, and Sisu."}},
    {"@type":"Question","name":"What would the CRM cost me if I bought it myself?","acceptedAnswer":{"@type":"Answer","text":"Third-party reported October 2026 estimates: BoldTrail ~$449-$1,099/month plus $1,000-$5,000 onboarding; Lofty from ~$449/month plus $500 setup; Cloze $17-$42/user/month (no native IDX website). At eXp, your choice of all three is included in the $139/month cloud fee."}},
    {"@type":"Question","name":"What is eXp World?","acceptedAnswer":{"@type":"Answer","text":"eXp World is the company's virtual 3D campus — where classes, meetings, and collaboration happen instead of a physical office. The platform is in transition, so verify the current state before relying on specifics."}},
    {"@type":"Question","name":"How much training does eXp Realty provide?","acceptedAnswer":{"@type":"Answer","text":"Dozens of hours of live training every week through eXp University, plus on-demand libraries, a new-agent bootcamp, and a mentor program. The FastCAP 6-week accelerator drew 21,273 registrations and won two Brandon Hall Gold awards in September 2026."}},
    {"@type":"Question","name":"What does the eXp Realty mentor program cost new agents?","acceptedAnswer":{"@type":"Answer","text":"In Canada, new agents pay an additional 20% split on their first three transactions to fund mentorship, per the official income disclosure."}},
    {"@type":"Question","name":"Who is the best eXp Realty sponsor for an experienced agent?","acceptedAnswer":{"@type":"Answer","text":"The one whose program you will actually use: still actively selling after 20+ years, running real weekly training and a live mastermind, offering a working lead-generation program where the leads are 100% yours, and connected to producing agent groups. Split, cap, fees, and revenue-share percentages are set by eXp corporate and identical regardless of sponsor team. With Tom, you get Tom as co-sponsor and his lead-generation partner as sponsor. Choose carefully: your sponsor designation is difficult to change once processed."}},
    {"@type":"Question","name":"Can I bring my team to eXp Realty?","acceptedAnswer":{"@type":"Answer","text":"Yes — four structures: self-organized (everyone keeps $16,000 cap); standard half-cap (leader $6M or 30 units; members may elect $8,000; half-cap members not ICON-eligible); Mega ICON quarter-cap (leader $40M or 140 units + $56,000 company-dollar guarantee; 11+ members; members may elect $4,000/$8,000/$16,000; ICON via $56,000 team production); domestic partnership (married couples share one $16,000 cap). Team leaders joining with Tom name Tom as co-sponsor to unlock the Managed Lead Generation program."}},
    {"@type":"Question","name":"What does Tom's Managed Lead Generation program cost?","acceptedAnswer":{"@type":"Answer","text":"$0 to the joining agent. No splits on lead generation; free to administer and create, including 3 AI videos. A free add-on for transferring and new agents, possible only because of eXp's structure and revenue-share model. The leads you generate are 100% yours."}},
    {"@type":"Question","name":"Do I get a free telelisting.net account?","acceptedAnswer":{"@type":"Answer","text":"Yes — every agent who joins with Tom gets a free telelisting.net account connected to the National Do Not Call List, keeping prospecting compliant and CRTC fines at bay."}},
    {"@type":"Question","name":"eXp Realty vs Keller Williams — which costs a producing agent less?","acceptedAnswer":{"@type":"Answer","text":"Usually eXp. KW runs 70/30 plus a ~6% royalty with office-set caps ($15K-$36K+) and monthly fees; eXp Canada runs 80/20 with a single $16,000 national cap and $139/month. eXp pays revenue share from company revenue (predictable); KW pays profit share from market-center profit (which can be zero)."}},
    {"@type":"Question","name":"eXp Realty vs Real Broker — which is better in Canada?","acceptedAnswer":{"@type":"Answer","text":"Real's Canadian headline figures are competitive (85/15, $15,000 CAD cap, no monthly fee, 5-tier revenue share). eXp counters with a deeper 7-tier revenue share, the ICON stock program, a larger agent base (87,338 vs ~35,000), and a fully published Canadian fee schedule."}},
    {"@type":"Question","name":"How do I join eXp Realty with Tom?","acceptedAnswer":{"@type":"Answer","text":"Call or message Tom at 613-314-1199 before submitting anything. Tom is named as your co-sponsor and his lead-generation partner — the person who sets up your lead-generation program — is named as your sponsor. He maps your first 30 days and gets you into the weekly mastermind and the Managed Lead Generation program from day one."}},
    {"@type":"Question","name":"What does Tom's free lead-generation program include?","acceptedAnswer":{"@type":"Answer","text":"Exclusive access through Tom to his Managed Lead Generation program, plus the weekly mastermind Zoom, 1-on-1 onboarding, his presentation assets, and a free telelisting.net account connected to the Do Not Call List. The leads you generate are 100% yours. Included at $0 when you join with Tom as your co-sponsor: no extra split, no fee, no splits on lead generation."}}
