&lt;p class="dateline"&gt;Real Estate Agent Attraction Guide &amp;nbsp;|&amp;nbsp; Updated October 2026&lt;/p&gt;

&lt;h1&gt;Best Brokerage for New Real Estate Agents (2026): The Honest eXp Realty Guide for New Licensees&lt;/h1&gt;

&lt;p&gt;If you are a new licensee searching for the &lt;strong&gt;best brokerage for new real estate agents&lt;/strong&gt;, this is the honest guide to &lt;strong&gt;eXp Realty for new agents&lt;/strong&gt; — the real &lt;strong&gt;eXp Realty fees&lt;/strong&gt;, the real &lt;strong&gt;eXp Realty mentorship&lt;/strong&gt;, and the real first-year math. Before you &lt;strong&gt;join eXp Realty&lt;/strong&gt; or sign with anyone else, read what most attraction pages skip.&lt;/p&gt;

&lt;div class="tldr"&gt;
  &lt;div class="label"&gt;TL;DR — The Honest Summary&lt;/div&gt;
  &lt;p style="margin:0;"&gt;Every brokerage will tell you it is "the best place for new agents." This page does something different: it publishes the new-agent statistics nobody else quotes, walks through honest first-year cost math for eXp Realty, Keller Williams, Real Broker, and traditional brokerages on a realistic six-deal year, and explains eXp's mandatory mentorship program — including what happens after it ends. New agents with two years or less of experience earn a median of about $8,000 a year on roughly two deals, with median business expenses near $9,530. The math does not work at most brokerages. Your first-brokerage choice is the decision that determines whether the math works for you. &lt;em&gt;Results not typical; examples shown for illustration only.&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;p&gt;This guide is the new-agent companion to &lt;!-- HUB-URL: companion hub page, to be replaced --&gt;&lt;a href="https://www.sellingottawa.realestate/blog/Fed+Up+With+Your+Brokerage%3A+How+eXp+Realty+Actually+Works+%282026%29"&gt;"Fed Up With Your Brokerage: How eXp Realty Actually Works (2026)"&lt;/a&gt; — the experienced-agent guide to the eXp Realty model. Read this page first if you are choosing your first brokerage; read the hub if you want the full model breakdown.&lt;/p&gt;

&lt;h2&gt;"They'll hand you a desk, a cold-call list, and wish you luck."&lt;/h2&gt;

&lt;p&gt;That is how the traditional brokerage treats most new licensees. A desk fee on the first of the month. A photocopied cold-call list. A managing broker who is too busy to answer your questions. And a quiet assumption that most of you will not make it to year two.&lt;/p&gt;

&lt;p&gt;Here is the part most attraction pages never publish: early-career washout in real estate is genuinely heavy. You may have heard dramatic figures about how many new agents fail — treat every one of those figures with suspicion. There is no published study that puts a single defensible number on it. What there &lt;em&gt;is&lt;/em&gt; is honest, sourced data about what the early years actually look like. That data is what follows.&lt;/p&gt;

&lt;div class="pullquote"&gt;
  "You didn't get licensed to wing it."
  &lt;span class="attr"&gt;— What every new agent is thinking when the desk-and-a-list "support system" arrives&lt;/span&gt;
&lt;/div&gt;

&lt;h2&gt;The honest new-agent statistics nobody quotes&lt;/h2&gt;

&lt;!-- FACT-CHECK FLAG (resolve before publication): The NAR figures below (≤2-year median income ~$8,000, ~2 deals; median business expenses ~$9,530) come from the research agent's synthesis of the NAR 2026 Member Profile (2025 data) via RISMedia/dmrmedia.org reporting, not from a direct read of the NAR profile itself. Verify each figure against the primary NAR Member Profile before this page goes live. --&gt;

&lt;p&gt;Most agent-attraction pages pick one of two strategies: quote a dramatic "failure rate" that no one can source, or skip the numbers entirely. This page does neither. Here is what the best available industry data actually says about agents in their first two years:&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;&lt;strong&gt;Median gross income for agents with two years or less of experience: about $8,000 per year&lt;/strong&gt; — on roughly two transaction sides. Read that again. Half of the newest agents earn less than that.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Median annual business expenses: about $9,530.&lt;/strong&gt; Vehicle costs alone run about $1,580 a year — typically the largest single expense line.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Only about 15% of association members have two years or less of experience&lt;/strong&gt;, and total membership has fallen from its 2022 peak. The newest cohort is thin — consistent with heavy early-career washout, but nobody can honestly put a single percentage on it.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;Put those three numbers together and the fear every new licensee feels becomes simple arithmetic: &lt;strong&gt;the math does not work at most brokerages.&lt;/strong&gt; If you earn $8,000 and spend $9,530 before you even pay a brokerage, your choice of brokerage is not a branding decision. It is a survival decision.&lt;/p&gt;

&lt;div class="takeaway"&gt;&lt;strong&gt;Key takeaway:&lt;/strong&gt; Ignore every unsourced "failure rate" you see on attraction pages. The sourced numbers — median ~$8,000 income, ~2 deals, ~$9,530 in expenses for agents in their first two years — are alarming enough. They are also the reason the first-brokerage decision matters more than any other choice you will make this year.&lt;/div&gt;

&lt;h2&gt;The five fears every new licensee has — named out loud&lt;/h2&gt;

&lt;p&gt;You do not need hype. You need these five fears answered with specifics. Every section of this page maps to one of them.&lt;/p&gt;

&lt;div class="fear"&gt;
  &lt;h3&gt;Fear 1: "I will have no leads."&lt;/h3&gt;
  &lt;p&gt;Most new agents stall because their brokerage is SOI-only — family and friends, then nothing. New-agent attraction pages promise "lead generation tools" and hope you do not ask which ones, how many, or whether anyone teaches you to convert them. &lt;span class="answer-tag"&gt;Answered in: Earn While You Learn · Where Will My Business Come From&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class="fear"&gt;
  &lt;h3&gt;Fear 2: "I will have little or no income for months."&lt;/h3&gt;
  &lt;p&gt;The first commission check can take months. Meanwhile the bills keep arriving. &lt;span class="answer-tag"&gt;Answered in: The Honest Numbers · First-Year Cost Math&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class="fear"&gt;
  &lt;h3&gt;Fear 3: "I will choose the wrong brokerage."&lt;/h3&gt;
  &lt;p&gt;Every page says "we're the best." Almost none publish the math that would let you verify the claim. At eXp Realty there is a second layer to this fear: your sponsor choice follows you for years. &lt;span class="answer-tag"&gt;Answered in: First-Year Cost Math · Choose Your Sponsor&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class="fear"&gt;
  &lt;h3&gt;Fear 4: "I will be abandoned after licensing."&lt;/h3&gt;
  &lt;p&gt;The #1 thing new agents say they want is a mentorship program with real people to go to besides a busy broker. Traditional firms routinely end support after the first deal — if it was ever there. &lt;span class="answer-tag"&gt;Answered in: eXp Realty Mentorship · The Post-Mentorship Cliff&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;

&lt;div class="fear"&gt;
  &lt;h3&gt;Fear 5: "I will drown in monthly fees."&lt;/h3&gt;
  &lt;p&gt;Desk fees, tech fees, franchise fees, and E&amp;O accrue every month whether you close anything or not. A slow first year plus fixed overhead is the combination that ends careers. &lt;span class="answer-tag"&gt;Answered in: First-Year Cost Math · Never Pay for Coaching&lt;/span&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;"You need more than a desk to survive."&lt;/h2&gt;

&lt;p&gt;A new licensee does not need office space. A new licensee needs five things, and most brokerages deliver one or two of them:&lt;/p&gt;

&lt;ol&gt;
  &lt;li&gt;&lt;strong&gt;Real mentorship&lt;/strong&gt; — a named, experienced human who reviews your first contracts line by line and answers your calls when a deal is about to fall apart.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Training that costs nothing extra&lt;/strong&gt; — fundamentals plus tools, live and on-demand, without a coaching upsell at the end of the free month.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;A lead system&lt;/strong&gt; — not a vague promise of "lead generation tools," but a specific system: where leads come from, who works them, and who teaches you to convert them.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Cost structure that survives a slow start&lt;/strong&gt; — low fixed monthly overhead, so a quiet first quarter does not bury you in fees.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Wealth building from day one&lt;/strong&gt; — stock and revenue share that start accruing while you are still learning, not a loyalty program that unlocks "someday."&lt;/li&gt;
&lt;/ol&gt;

&lt;p&gt;The rest of this page scores eXp Realty against that checklist — with numbers, not adjectives.&lt;/p&gt;

&lt;div class="takeaway"&gt;&lt;strong&gt;Key takeaway:&lt;/strong&gt; Interview every brokerage with the five-question checklist above. If a brokerage rep cannot answer "who mentors me, by name?" and "what are my total fixed costs if I close zero deals?", keep looking.&lt;/div&gt;

&lt;h2&gt;How eXp Realty works: the full model in plain English&lt;/h2&gt;

&lt;p&gt;eXp Realty is a cloud-based brokerage operating in 29 countries. In Canada — Ontario included — the model works the same way everywhere, and everything that follows is the complete eXp Realty model — the same mechanics covered in the experienced-agent hub, written here in everyday language for a brand-new licensee. Definitions come before jargon.&lt;/p&gt;

&lt;h3&gt;eXp Realty commission split&lt;/h3&gt;

&lt;p&gt;&lt;strong&gt;Plain language:&lt;/strong&gt; A "commission split" is how each commission check gets divided between you and the brokerage. &lt;strong&gt;GCI&lt;/strong&gt; (gross commission income) is the full commission your deal earns before anyone takes a cut.&lt;/p&gt;

&lt;p&gt;At eXp Realty in Canada, the split is &lt;strong&gt;80/20&lt;/strong&gt;: you keep 80% of every commission, eXp keeps 20% — until you have paid eXp &lt;strong&gt;$16,000 CAD&lt;/strong&gt; in a single anniversary year. That is the &lt;strong&gt;cap&lt;/strong&gt;: the maximum you will ever pay eXp in split in one year. The cap is reached at &lt;strong&gt;$80,000 GCI&lt;/strong&gt; ($80,000 × 20% = $16,000).&lt;/p&gt;

&lt;p&gt;After the cap, you keep &lt;strong&gt;100% of your commissions&lt;/strong&gt; for the rest of your anniversary year, minus a small per-transaction fee (details below). The cap resets on your anniversary date — the date you joined.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Canada worked example:&lt;/strong&gt; On an Ottawa sale at $750,000 with a 2.5% commission, the deal earns $18,750 GCI. At the standard 80/20 split, you keep $15,000 and eXp keeps $3,750 toward your $16,000 cap. Roughly four to five deals like that and you are capped — every deal after that is 100% yours.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;The new-agent exception:&lt;/strong&gt; new agents enrolled in eXp's mentorship program pay the standard 80/20 split plus an &lt;strong&gt;extra 20% mentorship fee on their first three transactions&lt;/strong&gt; — you net &lt;strong&gt;60% on deals 1–3&lt;/strong&gt; — which funds the mentor working beside you. This is a real cost most attraction pages omit. It is also the price of never doing your first three deals alone.&lt;/p&gt;

&lt;h3&gt;eXp Realty fees&lt;/h3&gt;

&lt;p&gt;&lt;strong&gt;Plain language:&lt;/strong&gt; Brokerage fees are the fixed costs you pay regardless of whether you close anything. This is where slow starts get expensive — or stay cheap.&lt;/p&gt;

  &lt;tr&gt;&lt;td&gt;One-time startup&lt;/td&gt;&lt;td&gt;$199&lt;/td&gt;&lt;td&gt;$149 &lt;span class="est"&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Monthly cloud brokerage fee&lt;/td&gt;&lt;td&gt;$139 + applicable tax&lt;/td&gt;&lt;td&gt;$85 &lt;span class="est"&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Broker review fee (per transaction)&lt;/td&gt;&lt;td&gt;$29&lt;/td&gt;&lt;td&gt;$25 &lt;span class="est"&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Post-cap transaction fee&lt;/td&gt;&lt;td&gt;$285 per deal for the next 20 deals (capped at $5,700), then $75 per deal&lt;/td&gt;&lt;td&gt;$250 per deal (capped at $5,000), then $75 &lt;span class="est"&gt;est.&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
  &lt;tr class="highlight-row"&gt;&lt;td&gt;&lt;strong&gt;No desk fees. No franchise fees. No royalty.&lt;/strong&gt;&lt;/td&gt;&lt;td colspan="2"&gt;&lt;strong&gt;That is the whole list.&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;p&gt;There is no physical office to maintain and no franchise royalty skimmed off every check — that is why the fixed list is so short. For a new agent, the practical meaning is simple: a quiet month costs you $139, not $1,500 in desk fees.&lt;/p&gt;

&lt;h3&gt;eXp Realty revenue share&lt;/h3&gt;

&lt;p&gt;&lt;strong&gt;Plain language:&lt;/strong&gt; "Revenue share" is money eXp pays &lt;em&gt;you&lt;/em&gt; when agents you introduced to the brokerage close deals. It comes out of eXp's 20% company dollar — never out of the other agent's commission. Your 80% is never touched.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Plain language on the flow:&lt;/strong&gt; eXp commits roughly half of its company dollar to the revenue-share pool. So of the $16,000 cap each agent pays, up to about $8,000 flows into the monthly pool and is distributed across &lt;strong&gt;7 tiers&lt;/strong&gt; to the sponsors and uplines of productive agents; eXp keeps roughly the other $8,000 to run the brokerage.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;The 7 tiers, in plain terms:&lt;/strong&gt; Tier 1 is the agents you personally introduced. Tier 2 is the agents &lt;em&gt;they&lt;/em&gt; introduced, and so on down to tier 7. You earn a percentage of each agent's adjusted GCI at every level — the deeper tiers pay smaller percentages, but across many agents the totals compound. The published tier structure (from eXp's official income disclosure):&lt;/p&gt;

&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;Tier&lt;/th&gt;&lt;th&gt;Share of the agent's adjusted GCI&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;1 — agents you personally introduced&lt;/td&gt;&lt;td&gt;3.5% (always unlocked)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;3.8% (+ 0.2% eXpansion share)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;2.4% (+ 0.1%)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;1.4% (+ 0.1%)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;0.9% (+ 0.1%)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;2.0% (+ 0.5%)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;4.5% (+ 0.5%)&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;p&gt;&lt;strong&gt;What changed in 2024 (REV Share 2.0):&lt;/strong&gt; tiers 1–3 now unlock immediately with zero qualifying agents and stay unlocked. Tiers 4–6 unlock at 5, 10, and 15 productive introduced agents; tier 7 unlocks at 30. There is also a Fast Start bonus of up to $4,000 on a directly introduced agent's first year.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;The honest math:&lt;/strong&gt; at tier 1, one agent who caps ($80,000 GCI) earns you up to 3.5% × $80,000 = &lt;strong&gt;$2,800/year&lt;/strong&gt;. But eXp's own income disclosure states the &lt;strong&gt;median revenue share for a typical tier-1 agent is $0&lt;/strong&gt; — because most introduced agents do not cap. Revenue share is real, it is willable (it can pass to your heirs), and it costs $0 to participate — but it is a long game, not a salary. &lt;em&gt;Results not typical; for illustration only.&lt;/em&gt;&lt;/p&gt;

&lt;div class="takeaway"&gt;&lt;strong&gt;Key takeaway:&lt;/strong&gt; No other model available to a brand-new licensee pays you from day one for growing the brokerage — and costs you nothing to join. It is not a get-rich promise; it is a retirement-building one.&lt;/div&gt;

&lt;h3&gt;The ICON program&lt;/h3&gt;

&lt;p&gt;&lt;strong&gt;Plain language:&lt;/strong&gt; ICON is eXp's top-producer recognition. Qualify, and eXp returns your entire cap to you — as company stock.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;How to qualify (in your anniversary year), either path:&lt;/strong&gt;&lt;/p&gt;
&lt;ul&gt;
  &lt;li&gt;&lt;strong&gt;Path 1:&lt;/strong&gt; pay the $16,000 cap &lt;strong&gt;plus&lt;/strong&gt; $5,000 in post-cap transaction fees (about 20 more capped transactions; in Canada the official fee schedule implies $5,700 — one agent source says $5,400, a conflict flagged for verification).&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Path 2:&lt;/strong&gt; earn &lt;strong&gt;$500,000+ GCI&lt;/strong&gt; with at least 10 closed transactions.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Qualifiers receive &lt;strong&gt;up to $16,000 in AGNT stock&lt;/strong&gt;: $8,000 production award (3-year vesting), $4,000 cultural award (2-year vesting, earned by mentoring and teaching), plus $2,000 for attending the Shareholder Summit and $2,000 for EXPCON (no vesting). Effectively, a top producer's $16,000 cap comes back as equity.&lt;/p&gt;

&lt;h3&gt;eXp Realty stock awards&lt;/h3&gt;

&lt;p&gt;&lt;strong&gt;Plain language:&lt;/strong&gt; You do not just work at eXp — you can own part of it. The company trades on Nasdaq under the ticker &lt;strong&gt;AGNT&lt;/strong&gt; (the holding company rebranded from eXp World Holdings to AGNT, Inc. in May 2026; older articles still say EXPI).&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;&lt;strong&gt;First transaction each anniversary year:&lt;/strong&gt; $200 in stock.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Reaching the $16,000 cap:&lt;/strong&gt; $400 in stock.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Introducing an agent who closes their first deal:&lt;/strong&gt; $400 in stock per agent per year.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;ICON qualifiers:&lt;/strong&gt; up to $16,000 in stock (above).&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Agent Equity Program (optional):&lt;/strong&gt; elect a percentage of each commission to buy stock at a discount. (The discount figure conflicts across sources — verify before publishing.)&lt;/li&gt;
  &lt;li&gt;Stock awards carry a 3-year vesting schedule; you must remain with eXp.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;For a brand-new licensee, the meaning is straightforward: your very first closing earns you your first $200 in company stock. The wealth layer starts on day one, not year five.&lt;/p&gt;

&lt;div class="takeaway"&gt;&lt;strong&gt;Key takeaway:&lt;/strong&gt; 80/20 to a $16,000 cap, then 100%; $139/month fixed cost; revenue share and stock from your first deal. That is the entire model — and it is the lowest fixed-cost full-support model available to a new Canadian licensee.&lt;/div&gt;
&lt;h2&gt;"Earn while you learn.": eXp Realty mentorship, explained&lt;/h2&gt;

&lt;!-- FACT-CHECK FLAG: Mentor-program mechanics (choose from a certified local list vs. assigned; extra 20% split breakdown 10%/10%) come from agent sources (Smart Agent Alliance mentor page). eXp University live-session volume conflicts across sources ("50+" vs "60+" vs "80+"); this page avoids a specific number — verify before publishing any. FastCAP averages (6.9 appointments / 3.8–3.9 signed agreements) are company/participant data cited by agent sources, not independent. --&gt;

&lt;p&gt;&lt;strong&gt;Plain language:&lt;/strong&gt; A mentor is an experienced local agent assigned to walk you through your first deals — contract to close. At eXp this is not optional and not a perk for the favored few. It is mandatory.&lt;/p&gt;

&lt;p&gt;Any agent with fewer than three qualifying transactions in the prior twelve months is enrolled in the &lt;strong&gt;eXpand Mentoring Program&lt;/strong&gt;. Here is exactly how it works:&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;&lt;strong&gt;A certified local mentor, in your MLS area, for your first three transactions.&lt;/strong&gt; You choose your mentor from a certified list in the My eXp app — you are not stuck with whoever is assigned.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Your mentor reviews everything:&lt;/strong&gt; pricing, contracts, negotiations, inspections, closing. The safety net for the deals where a mistake would cost you thousands.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;The cost:&lt;/strong&gt; an extra 20% of gross commission on those first three deals, on top of the standard 80/20 split — you net 60% on deals 1–3. The mentor is compensated when you close — which is exactly why they pick up the phone.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;After deal three, you graduate&lt;/strong&gt; to the standard 80/20 split.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;Layered on top of mentorship, the training never stops and never costs extra:&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;&lt;strong&gt;eXp Fast Start&lt;/strong&gt; — a two-week series of 14 one-hour live courses, run every two weeks, covering eXp's internal tools and real-estate fundamentals.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;FastCAP&lt;/strong&gt; — a free six-week live productivity accelerator. Active participants have averaged about 6.9 appointments and nearly 4 signed agreements (company-reported figures). It won two Brandon Hall Gold awards in September 2026.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;eXp University&lt;/strong&gt; — dozens of live training sessions every week, included in your $139/month, plus on-demand libraries.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Your technology&lt;/strong&gt; — choose your CRM (BoldTrail, Cloze, or Lofty), IDX website, transaction management (SkySlope), and Canva Pro — all included in the monthly fee.&lt;/li&gt;
&lt;/ul&gt;

&lt;div class="timeline"&gt;
  &lt;div class="step"&gt;&lt;h3&gt;Day 1 — Licensed and enrolled&lt;/h3&gt;&lt;p&gt;You join, pick your certified mentor from the local list, and start Fast Start. Fixed cost: $139/month.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="step"&gt;&lt;h3&gt;Deals 1–3 — Never alone&lt;/h3&gt;&lt;p&gt;Your mentor walks every deal with you. You net 60% of each commission — the standard 80/20 split plus the extra 20% mentorship fee; you are buying an apprenticeship that other brokerages charge thousands for — or do not offer at all.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="step"&gt;&lt;h3&gt;Deal 4 — Graduation&lt;/h3&gt;&lt;p&gt;You move to 80/20. But mentorship ending is not support ending — see the next section, because nobody else covers it.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="step"&gt;&lt;h3&gt;$80,000 GCI — The cap&lt;/h3&gt;&lt;p&gt;You have paid $16,000 to eXp. Every deal after this is 100% yours, minus the small post-cap transaction fee.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="step"&gt;&lt;h3&gt;Beyond — Owner&lt;/h3&gt;&lt;p&gt;Revenue share from agents you introduce, stock awards from every milestone, and the ICON track if you want it.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="takeaway"&gt;&lt;strong&gt;Key takeaway:&lt;/strong&gt; "Earn while you learn" is not a slogan at eXp — it is the literal structure: paid mentorship on your first three deals, free training forever, and a mentor you chose yourself.&lt;/div&gt;

&lt;h2&gt;The post-mentorship cliff: what happens after deal 3&lt;/h2&gt;

&lt;p&gt;Here is the section no competitor page writes. Every eXp attraction page celebrates the mentorship program. Almost none tells you what happens the day it ends.&lt;/p&gt;

&lt;p&gt;After your third transaction, the formal mentor relationship closes. You are at 80/20. You are, technically, on your own. For agents who leaned on their mentor for every decision, &lt;strong&gt;deals 4 through 10 are where the wobble happens&lt;/strong&gt; — the paperwork is familiar but the judgment calls are new, and there is no longer a required second pair of eyes.&lt;/p&gt;

&lt;p&gt;What actually carries you across the cliff at eXp:&lt;/p&gt;
&lt;ul&gt;
  &lt;li&gt;&lt;strong&gt;Tom's lead-generation program carries over.&lt;/strong&gt; The formal mentorship covers your first three transactions — Tom's Managed Lead Generation program runs alongside it and continues after the mentorship relationship ends, so leads keep flowing into your pipeline on deal 4 and beyond. The leads you generate are 100% yours, with no split on the program.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;The training never ended.&lt;/strong&gt; eXp University, FastCAP, and the weekly sessions keep running — the new agents who struggle are almost always the ones who stopped attending once the mentor left.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Your sponsor is still there.&lt;/strong&gt; The mentor was your safety net for three deals; your sponsor is tied to your success for the life of your career. This is why the sponsor choice matters so much — see the section below.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;The community layer.&lt;/strong&gt; Weekly mastermind calls, local agent networks, and study groups replace the 1-on-1 intensity with peer accountability.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;The honest version: mentorship gets you to deal 4 safely. What gets you to deal 20 is the system around it — and your own discipline in using it. Plan for the cliff &lt;em&gt;before&lt;/em&gt; you reach it: by deal 3, you should be attending training weekly and plugged into a mastermind. And unlike the formal mentorship, Tom's lead-generation program does not end at deal 3 — it is the bridge that carries your pipeline across the cliff. Which brings us to the question every new agent asks next.&lt;/p&gt;

&lt;h2&gt;Where will my business come from: Tom's free lead-generation program&lt;/h2&gt;



&lt;p&gt;"No leads" is the fear that kills the most new-agent careers. Most attraction pages answer it with the word "tools." Here is a specific answer instead.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Tom Witek runs a free lead-generation program for the agents who join eXp Realty with him — the &lt;span style="color:#c9a227;"&gt;Managed Lead Generation program&lt;/span&gt;:&lt;/strong&gt;&lt;/p&gt;

&lt;ul class="check"&gt;
  &lt;li&gt;&lt;strong&gt;A weekly mastermind Zoom&lt;/strong&gt; — live training on the lead-generation systems that are working right now, not a recorded course from three years ago.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Exclusive access through Tom&lt;/strong&gt; — the program is available to agents in his group, with direct access to ask questions and get feedback on your actual deals and campaigns.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;The leads you generate are 100% yours.&lt;/strong&gt; No split on the program, no referral fee back to anyone, no strings. You learn the system; the business you build is your business.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;A free telelisting.net account&lt;/strong&gt; — connected to the National Do Not Call List, so your prospecting stays compliant from day one and CRTC fines never enter the picture.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;Pair that with eXp's own systems — FastCAP's productivity training, the CRM and IDX website included in your monthly fee — and "where will my business come from?" has a concrete answer: a weekly cadence, a specific playbook, and someone who has done it reviewing your work.&lt;/p&gt;

&lt;div class="pullquote"&gt;
  "Earn while you learn."
  &lt;span class="attr"&gt;— The new-agent promise, as a system: mentorship on your first three deals, a weekly mastermind after that, and leads that are 100% yours&lt;/span&gt;
&lt;/div&gt;

&lt;h2&gt;Never pay for coaching&lt;/h2&gt;

&lt;p&gt;One of the quietest taxes on new agents is the coaching upsell. Many brokerages — and many teams — offer "mentorship" that turns into a $500/month coaching program the moment you ask a second question. At eXp Realty:&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;The mentorship program is &lt;strong&gt;included in the model&lt;/strong&gt;, funded by the transparent 20% on your first three deals — not a monthly coaching invoice.&lt;/li&gt;
  &lt;li&gt;eXp University's live training is &lt;strong&gt;included in your $139/month&lt;/strong&gt;. Fast Start is free. FastCAP is free.&lt;/li&gt;
  &lt;li&gt;Tom's weekly mastermind is &lt;strong&gt;free&lt;/strong&gt; for agents who join with him.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;If anyone ever asks you to pay extra for coaching on top of your brokerage fees, ask exactly what the free training does not cover. Then come back and compare.&lt;/p&gt;

&lt;h2&gt;Doing this part-time: the math changes&lt;/h2&gt;

&lt;p&gt;Many new licensees keep a job while they build. Part-time is allowed at eXp Realty — but the math of the model section above changes, so be honest with yourself about it:&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;&lt;strong&gt;The $139/month is fixed&lt;/strong&gt; whether you close zero deals or ten. On a part-time schedule with one or two closings a year, that fixed cost is a larger share of your income.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;The extra 20% mentorship fee still applies&lt;/strong&gt; to your first three deals — and on a part-time timeline, "first three deals" can stretch across a year or more. That is fine; the mentor stays with you until the deals are done.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Training is on-demand as well as live&lt;/strong&gt;, so a 9-to-5 schedule does not lock you out of the education layer.&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;The cap is the cap.&lt;/strong&gt; Most part-timers never reach $80,000 GCI in a year, so you will simply live at 80/20 (after mentorship) — no downside, no pressure.&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;The agents who struggle part-time are not the ones with the wrong brokerage. They are the ones who treat the license as a lottery ticket instead of a second job. If you can give it real hours, the model works the same at any pace.&lt;/p&gt;

&lt;h2&gt;Join a team or go solo with a mentor&lt;/h2&gt;

&lt;p&gt;New agents face a fork: join an established team, or go solo with eXp's mentor program. Both are legitimate. Here is the honest tradeoff:&lt;/p&gt;

&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Join a team&lt;/th&gt;&lt;th&gt;Solo with eXp mentor&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Split&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Often 50/50 or worse on team deals&lt;/td&gt;&lt;td&gt;Net 60% for 3 deals (80/20 + 20% mentor fee), then 80/20&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Leads&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Team may feed you leads&lt;/td&gt;&lt;td&gt;You generate your own (FastCAP + Tom's mastermind)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Mentorship&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Team leader (quality varies)&lt;/td&gt;&lt;td&gt;Certified mentor you chose yourself&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Brand&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Team's brand first&lt;/td&gt;&lt;td&gt;Your name from day one&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Revenue share/stock&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Yours at eXp either way&lt;/td&gt;&lt;td&gt;Yours at eXp either way&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Best for&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Agents who want leads handed to them and accept the split cost&lt;/td&gt;&lt;td&gt;Self-starters who want maximum income per deal&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;p&gt;There is no wrong answer — but notice that at eXp, the wealth layer (revenue share, stock) is yours regardless. The team question is only about leads versus split, not about your long-term economics.&lt;/p&gt;

&lt;h2&gt;Choose your sponsor like you choose your brokerage&lt;/h2&gt;

&lt;p&gt;&lt;strong&gt;Plain language:&lt;/strong&gt; Your "sponsor" is the eXp agent who introduced you to the brokerage. Your "mentor" is the certified local agent who guides your first three deals. They are different people with different jobs — the mentor is your safety net for three deals; the sponsor is tied to your success for the life of your career.&lt;/p&gt;

&lt;p&gt;Here is what most attraction pages bury: &lt;strong&gt;changing your sponsor later is extremely difficult — both the sponsor and co-sponsor designations are permanent once recorded, and changing them generally requires leaving eXp for 12+ months and rejoining (rejoiners cannot add a co-sponsor).&lt;/strong&gt; That makes the sponsor choice nearly as permanent as the brokerage choice.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;How to interview a sponsor (use this checklist on anyone, including Tom):&lt;/strong&gt;&lt;/p&gt;
&lt;ul class="check"&gt;
  &lt;li&gt;What specific training do I get from &lt;em&gt;you&lt;/em&gt; — not from eXp corporate?&lt;/li&gt;
  &lt;li&gt;How often do we talk, and what is the format? (Weekly mastermind? 1-on-1 calls?)&lt;/li&gt;
  &lt;li&gt;What is your lead-generation system, and will you teach it to me hands-on?&lt;/li&gt;
  &lt;li&gt;Are you local to my market, and will you answer when a deal is on fire?&lt;/li&gt;
  &lt;li&gt;What does your support look like &lt;em&gt;after&lt;/em&gt; my first three deals?&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;Tom's answer to every question on that list is this page: weekly mastermind Zoom, a hands-on lead-generation program, local Ottawa market expertise from a full-time agent selling homes since 2005 — and the post-mentorship system above. If another sponsor answers the checklist better, choose them. The checklist matters more than the name.&lt;/p&gt;

&lt;h3&gt;Sponsor vs co-sponsor: what the two roles mean for a new agent&lt;/h3&gt;
&lt;p&gt;In May 2025 eXp launched an official &lt;strong&gt;Co-Sponsor Program&lt;/strong&gt; (announced at eXpcon Montreal). Here is the plain-English version a new licensee needs:&lt;/p&gt;
&lt;table&gt;
  &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Primary sponsor&lt;/th&gt;&lt;th&gt;Co-sponsor&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Who&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;The agent who attracted you to eXp — your Tier 1 upline connection&lt;/td&gt;&lt;td&gt;One additional leader you choose — Tom, in this arrangement&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;What they earn from your production&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Levels 2–7 revenue share (when a co-sponsor occupies Level 1); keeps FLQA qualifications and stock awards&lt;/td&gt;&lt;td&gt;The Tier 1 position: Level 1 revenue share (3.5%, up to $2,800/yr per capping agent) + 50% of the Fast Start bonus&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Limits&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;One primary sponsor&lt;/td&gt;&lt;td&gt;ONE co-sponsor only; must be designated within 5 days of going active; creates no extra tiers&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Permanence&lt;/strong&gt;&lt;/td&gt;&lt;td colspan="2"&gt;Both designations are permanent once recorded — changing them generally requires leaving eXp for 12+ months and rejoining, and rejoiners cannot add a co-sponsor.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Effect on you&lt;/strong&gt;&lt;/td&gt;&lt;td colspan="2"&gt;&lt;strong&gt;Zero.&lt;/strong&gt; Your commission, split, cap, and fees are identical either way. You simply get two leaders instead of one.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;With Tom, the mapping is: &lt;strong&gt;Tom is your co-sponsor&lt;/strong&gt; — he provides the &lt;strong&gt;Managed Lead Generation program&lt;/strong&gt; (leads 100% yours, no splits on lead generation, free to administer and create, 3 AI videos free). &lt;strong&gt;His partner is your primary sponsor&lt;/strong&gt; — the person who sets up your lead-generation program. This free add-on exists only because of eXp's structure and revenue-share model. For the full mechanics, read &lt;!-- EXPLAINER-URL: standalone 7-tier explainer page, to be replaced --&gt;&lt;a href="https://www.sellingottawa.realestate/blog/eXp+Realty+Revenue+Share+Explained%3A+The+7-Tier+System+%282026%29"&gt;eXp Realty Revenue Share Explained: The 7-Tier System (2026)&lt;/a&gt;.&lt;/p&gt;
&lt;h2&gt;New agent questions, answered honestly&lt;/h2&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;How do I pick my first brokerage as a new licensee?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Score every brokerage on the same five questions: who mentors me by name, what training is included at no extra cost, what is the specific lead system, what are my total fixed costs if I close zero deals, and do I build equity from day one. The brokerage with the best answers at realistic first-year production — not the best headline split — is your answer.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;Is eXp Realty good for new agents with no experience?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;It is built for them in one specific way: mentorship is mandatory, not optional. Every agent with fewer than three qualifying transactions in the prior year is enrolled in the eXpand Mentoring Program with a certified local mentor. The honest caveat is that eXp is a cloud brokerage — it rewards self-motivated agents and is a poor fit if you need someone physically looking over your shoulder every day.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;What does the eXp Realty mentorship program actually include?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;A certified local mentor in your MLS area who works with you on your first three transactions: pricing, contracts, negotiation, inspections, and closing. It is hands-on deal guidance, not a video course. You choose your mentor from a certified list in the My eXp app.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;How much does the eXp Realty mentorship program cost?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;There is no separate invoice. New agents in the program pay the standard 80/20 split plus an extra 20% mentorship fee on their first three transactions — a net 60% to the agent on deals 1 through 3 — which funds the mentor. After the third deal you move to the standard 80/20 split.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;Can I choose my own mentor at eXp Realty?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Yes. You select your mentor from a certified local list in the My eXp app rather than being assigned one. If you already know a certified mentor you want to work with, you can choose them.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;What are my real first-year costs at eXp Realty in Canada?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Fixed costs: $199 one-time startup plus $139/month plus applicable tax — about $1,867 for the year before you close anything. Per-deal costs: $29 broker review per transaction, plus the extra 20% mentorship fee on your first three deals (on top of 80/20), then 80/20. On an illustrative six-deal year at $8,000 commission each, total brokerage cost runs roughly $16,400. Results not typical; for illustration only.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;What is the eXp Realty commission split for new agents?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;80/20 plus an extra 20% mentorship fee on your first three transactions (you net 60% on deals 1–3), then 80/20 until you reach the $16,000 CAD annual cap (at $80,000 GCI), then 100% minus a small per-transaction fee for the rest of your anniversary year.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;Can I do real estate part-time as a new agent?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Yes. The model works the same at any pace: the $139/month is fixed, the mentorship covers your first three deals however long they take, and training is available on-demand around a 9-to-5 schedule. Be realistic that part-time income follows part-time hours.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;What happens after my first three transactions at eXp Realty?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;You graduate from the formal mentor program to the standard 80/20 split. This is the transition most attraction pages skip: plan for it before you get there. The training, weekly sessions, your sponsor's ongoing support, and Tom's weekly mastermind are what carry you from deal 4 to deal 20 — but only if you actually use them. And Tom's Managed Lead Generation program carries over: it runs alongside the three-transaction mentorship period and continues after the mentorship relationship ends, so leads keep flowing into your pipeline — 100% owned by you, with no split on the program — on deal 4 and beyond.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;Do I get leads at eXp Realty, or do I have to generate my own?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Both, honestly. eXp provides the systems and training — FastCAP's productivity program, your CRM and IDX website, Tom's free weekly lead-generation mastermind with a hands-on playbook. Nobody hands you a finished pipeline; you learn to build one, with the leads you generate being 100% yours.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;Do I have to attract other agents to eXp Realty to earn?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;No. Your commissions, revenue share eligibility, and stock awards never require you to introduce a single agent. Revenue share is an additional income layer available from day one at zero cost — it is optional upside, not a condition of earning.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;What are the eXp Realty fees in Canada?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;$199 one-time startup, $139/month plus applicable tax, $29 broker review per transaction. After the $16,000 cap: $285 per transaction for the next 20 transactions (capped at $5,700), then $75 per transaction. No desk fees, no franchise fees, no royalty. Figures verified October 2026.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;Are there any hidden fees at eXp Realty?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;The fee schedule above is the complete list — there is no desk fee, franchise fee, or royalty hiding behind it. The one cost new agents are surprised by is the extra 20% mentorship fee on the first three deals (on top of the standard 80/20 split), which is disclosed in eXp's income materials but rarely mentioned on attraction pages. This page states it plainly.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;What is eXp Realty's commission cap?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;$16,000 CAD per anniversary year in Canada ($16,000 USD in the US). Once your 20% split contributions total $16,000, you keep 100% of your commissions — minus the small post-cap transaction fee — until your anniversary resets.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;What happens after I hit the cap at eXp Realty?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;You keep 100% of every commission for the rest of your anniversary year, minus $285 per transaction for the next 20 transactions (capped at $5,700 CAD in Canada), then $75 per transaction. High producers can also qualify for ICON status, which returns the cap as company stock.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;How does eXp Realty revenue share work for a brand-new agent?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;From day one, at zero cost: if agents you introduced to eXp close deals, you earn a percentage of their adjusted gross commission income across 7 tiers — 3.5% at tier 1, up to 4.5% at tier 7 — paid from eXp's company dollar, never from the other agent's commission. Tiers 1–3 are unlocked immediately. One honest note: eXp's income disclosure shows a $0 median for its Entering bracket — but that is total compensation across all 85,377 registered agents including inactive and part-time ones (38.73%); among active agents with 1+ year at eXp it drops to 8.55%. Revenue share flows only to agents who attract productive agents — which is exactly what Tom's Managed Lead Generation program is built to make you. Treat it as long-term wealth building, not income. Results not typical.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;What stock do eXp Realty agents get?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;AGNT stock (Nasdaq; the company rebranded from EXPI to AGNT in May 2026): $200 in stock for your first transaction each anniversary year, $400 when you hit the cap, $400 per introduced agent who closes their first deal, and up to $16,000 for ICON qualifiers. Awards vest over three years. There is also an optional program to buy stock from each commission at a discount.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;Should I join a team or go solo as a new eXp agent?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Teams may feed you leads but often take 50% or more of the split; going solo with eXp's mentor program nets you 60% for three deals (80/20 plus the extra 20% mentorship fee) then 80/20, with revenue share and stock yours either way. Choose the team path if you want leads handed to you and accept the cost; choose solo if you are a self-starter who wants maximum income per deal.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;What is the difference between a sponsor and a co-sponsor at eXp Realty?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Under eXp's official Co-Sponsor Program (launched May 2025), your primary sponsor is the agent who attracted you — your Tier 1 upline, earning Levels 2–7 revenue share plus FLQA qualifications and stock awards. An optional co-sponsor — one only, designated within 5 days of going active — takes the Tier 1 position: Level 1 revenue share (3.5%, up to $2,800/yr per capping agent) plus half the Fast Start bonus. Both designations are permanent, and neither changes your commission, split, cap, or fees — it all comes from eXp's company dollar. With Tom, he is your co-sponsor (providing the Managed Lead Generation program) and his partner is your primary sponsor.&lt;/p&gt;

&lt;p&gt;&lt;strong&gt;Can I change my eXp Realty sponsor later?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Effectively, no — not easily. Sponsor and co-sponsor designations are permanent once recorded; changing them generally requires leaving eXp for 12+ months and rejoining, and rejoiners cannot add a co-sponsor. Your mentor guides three deals; your sponsor is tied to your career. Interview sponsors with the checklist in the section above before you sign.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="faq-item"&gt;
&lt;p&gt;&lt;strong&gt;Who tends to struggle most as a new agent at eXp Realty?&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Two profiles: agents who need in-person, over-the-shoulder accountability every day (the cloud model will not provide it), and agents who treat the free training as optional background noise instead of attending weekly. The model hands you every tool; it cannot hand you discipline.&lt;/p&gt;
&lt;/div&gt;
