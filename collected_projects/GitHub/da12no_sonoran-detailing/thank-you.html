<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed | Sonoran Mobile Car Detailing</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; padding: 40px 16px; text-align: center; }
    .ty-logo { margin-bottom: 32px; }
    .ty-logo img { height: 72px; }
    .ty-icon { width: 72px; height: 72px; border-radius: 50%; background: rgba(224,123,42,0.12); border: 2px solid #E07B2A; color: #E07B2A; font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .ty-tag { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #E07B2A; margin-bottom: 12px; }
    h1 { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 700; margin-bottom: 16px; }
    .ty-sub { color: #BEC9DC; font-size: 16px; line-height: 1.7; max-width: 480px; margin: 0 auto 36px; }
    .ty-card { background: #0C1422; border: 1px solid #1A2D4A; border-radius: 12px; padding: 32px; max-width: 480px; width: 100%; margin: 0 auto 36px; text-align: left; }
    .ty-card-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #E07B2A; text-transform: uppercase; margin-bottom: 20px; }
    .ty-row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #1A2D4A; font-size: 14px; }
    .ty-row:last-child { border-bottom: none; }
    .ty-row-label { color: #7A8FAD; }
    .ty-row-val { color: #fff; font-weight: 600; text-align: right; }
    .ty-total { font-size: 28px; font-weight: 700; color: #E07B2A; font-family: 'Playfair Display', serif; }
    .ty-actions { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto; }
    .ty-note { color: #7A8FAD; font-size: 13px; margin-top: 24px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="ty-logo">
    <img src="logo.png" alt="Sonoran Mobile Car Detailing">
  </div>
  <div class="ty-icon">&#10003;</div>
  <p class="ty-tag">Booking Received</p>
  <h1>You're all set<span style="color:#E07B2A;">.</span></h1>
  <p class="ty-sub">We've received your booking and will text or call you within <strong style="color:#fff;">1 business hour</strong> to confirm your appointment.</p>

  <div class="ty-card" id="bookingSummary" style="display:none;">
    <p class="ty-card-title">Your Booking Summary</p>
    <div id="summaryRows"></div>
  </div>

  <div class="ty-actions">
    <a href="tel:6027554331" class="btn-gold btn-large">Call Us: (602) 755-4331</a>
    <a href="/" class="btn-outline btn-large">Back to Home</a>
  </div>
  <p class="ty-note">Questions? Call or text us at (602) 755-4331 or email hello@sonoranmobilecardetailing.com</p>

  <script>
    const raw = localStorage.getItem('sonoran_booking');
    if (raw) {
      try {
        const b = JSON.parse(raw);
        const rows = [
          ['Name', b.name],
          ['Phone', b.phone],
          ['Service', b.service],
          b.vehicle_size ? ['Vehicle Size', b.vehicle_size] : null,
          ['Vehicle', b.vehicle],
          b.addons ? ['Add-Ons', b.addons] : null,
          ['Date', b.date],
          ['Time', b.time],
          ['Est. Total', { total: b.total }],
        ].filter(Boolean);

        const card = document.getElementById('bookingSummary');
        const container = document.getElementById('summaryRows');
        rows.forEach(([label, val]) => {
          const div = document.createElement('div');
          div.className = 'ty-row';
          if (val && val.total !== undefined) {
            div.innerHTML = `<span class="ty-row-label">${label}</span><span class="ty-total">$${val.total}</span>`;
          } else {
            div.innerHTML = `<span class="ty-row-label">${label}</span><span class="ty-row-val">${val}</span>`;
          }
          container.appendChild(div);
        });
        card.style.display = 'block';
        localStorage.removeItem('sonoran_booking');
      } catch(e) {}
    }
  </script>
</body>
</html>
