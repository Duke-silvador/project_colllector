<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .welcome-container {
            text-align: center;
            padding: 50px;
            max-width: 700px;
        }

        .welcome-container h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .welcome-container p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #f1f1f1;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #222;
            color: white;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .welcome-container h1 {
                font-size: 40px;
            }

            .welcome-container p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="welcome-container">
        <h1>Welcome! 👋</h1>

        <p>
            We're glad you're here. Explore our website,
            discover something amazing, and enjoy your experience.
        </p>

        <a href="#" class="btn">Get Started</a>
    </div>

</body>
</html>
