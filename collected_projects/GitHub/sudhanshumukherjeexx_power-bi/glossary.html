<style>
:root{
  --bg:#EEF1F5;--panel:#FFFFFF;--panel-2:#F6F8FA;--ink:#1B2430;--ink-2:#4A5568;--ink-3:#7A8594;
  --line:#D9DEE6;--line-2:#C4CBD6;--yellow:#F2C811;--yellow-ink:#7A6200;--yellow-soft:#FFF3BF;
  --ok:#1F7A4D;--ok-soft:#DDF3E6;--bad:#B23A2E;--bad-soft:#FAE1DE;
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171E;--panel:#1A212B;--panel-2:#212A36;--ink:#E9EDF3;--ink-2:#B4BDCA;--ink-3:#7F8A99;
  --line:#2C3644;--line-2:#3A4655;--yellow-ink:#F2C811;--yellow-soft:#3A3212;--ok:#5FD08F;--ok-soft:#173224;--bad:#F08B80;--bad-soft:#3A1F1C;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12171E;--panel:#1A212B;--panel-2:#212A36;--ink:#E9EDF3;--ink-2:#B4BDCA;--ink-3:#7F8A99;
  --line:#2C3644;--line-2:#3A4655;--yellow-ink:#F2C811;--yellow-soft:#3A3212;--ok:#5FD08F;--ok-soft:#173224;--bad:#F08B80;--bad-soft:#3A1F1C;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(8px + var(--sat)) calc(16px + var(--sar)) 8px calc(16px + var(--sal))}
.top .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;min-height:44px}
.brand .mark{width:26px;height:26px;background:var(--yellow);border-radius:4px;display:grid;place-items:center;color:#1B2430;font-weight:700;font-size:.8rem}
.sp{flex:1}
.btn{border:1px solid var(--line-2);background:var(--panel);padding:8px 14px;border-radius:4px;font-size:.88rem;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.iconbtn{min-width:40px;padding:0;justify-content:center}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}
.wrap{max-width:880px;margin:0 auto;padding:0 calc(20px + var(--sar)) 0 calc(20px + var(--sal))}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);letter-spacing:-.02em;margin:28px 0 8px;line-height:1.15}
h1 .hl{color:var(--hl-ink)}
.lead{color:var(--ink-2);max-width:64ch}
.filters{position:sticky;top:calc(61px + var(--sat));z-index:20;background:var(--bg);padding:10px 0 8px;margin:10px 0 6px;border-bottom:1px solid var(--line)}
.filters input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);color:var(--ink)}
.chips,.az{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:8px}
.chips::-webkit-scrollbar,.az::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:.82rem;min-height:34px;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.az a{flex:none;min-width:30px;min-height:30px;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;text-decoration:none;border-radius:4px;color:var(--ink-2)}
.az a:hover{background:var(--panel)}
.az a.off{opacity:.3;pointer-events:none}
.letter{font-family:var(--mono);font-size:.85rem;color:var(--ink-3);margin:22px 0 8px;padding-left:2px;scroll-margin-top:170px}
.g{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;scroll-margin-top:170px}
.g h2{font-size:1.08rem;margin:0 0 2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.g h2 .c{font-family:var(--mono);font-size:.7rem;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.g p{margin:4px 0 0;color:var(--ink-2)}
.g .meta{margin-top:8px;font-size:.84rem;color:var(--ink-3);display:grid;gap:3px}
.g .meta a{color:var(--ink)}
.g .anchor{margin-left:auto;font-size:.8rem;color:var(--ink-3);text-decoration:none}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--yellow)}100%{box-shadow:0 0 0 3px transparent}}
.none{padding:30px;text-align:center;color:var(--ink-2)}
.foot{padding:30px 0 calc(40px + var(--sab));color:var(--ink-3);font-size:.82rem}
@media (max-width:640px){.wrap{padding:0 calc(16px + var(--sar)) 0 calc(16px + var(--sal))}.top .clabel{display:none}}
@media print{.top,.filters,.foot,.anchor{display:none!important}body{background:#fff}.g{break-inside:avoid;border-color:#ccc}}
</style>
</head>
<body>

<!--nav:resources-->
<header class="top gnav"><div class="in">
  <a class="brand" href="index.html" aria-label="Power BI Holy Grail: home"><span class="mark" aria-hidden="true">BI</span><span class="bt">Power BI Holy Grail</span></a>
  <nav class="mainnav" aria-label="Main"><a href="learn.html">Learn</a><a href="experience.html">Practice</a><a href="flashcards.html">Interview</a><a href="toolkit.html">Toolkit</a><a href="progress.html">Progress</a><a href="resources.html" aria-current="true">Resources</a></nav>
  <span class="sp"></span>
  <button class="btn iconbtn" type="button" data-open-search aria-label="Search (press /)" title="Search (/)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  <span data-theme-toggle-slot></span>
</div></header>

<main class="wrap" id="main" tabindex="-1">
  <h1>Power BI in <span class="hl">plain English</span></h1>
  <p class="lead" id="lead"></p>
  <div class="filters">
    <input type="search" id="q" placeholder="Filter terms, e.g. folding, RLS, grain" autocomplete="off" aria-label="Filter the glossary">
    <div class="chips" id="cats" role="group" aria-label="Category"></div>
    <nav class="az" id="az" aria-label="Jump to letter"></nav>
  </div>
  <div id="list"></div>
  <footer class="foot">Tap any dotted-underlined word in a <a href="learn.html">lesson</a> or the <a href="flashcards.html">flashcards</a> to see its definition without leaving the page.</footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="assets/js/content.js"></script>
<script src="assets/js/glossary.js"></script>
<script src="assets/js/site.js"></script>
<script>
const esc=PBI.esc,slug=PBI.slug;
const terms=GLOSSARY.slice().sort((a,b)=>a.t.localeCompare(b.t,'en',{sensitivity:'base'}));
const cats=[...new Set(GLOSSARY.map(g=>g.c))];
let cat='all';
document.getElementById('lead').textContent=`${terms.length} terms used across the course, flashcards and interviews, each explained in a sentence or two. Filter by typing, or jump to a letter.`;

/* where each term appears in the course: scan topic text for the term or its other names */
const topics=LEVELS.flatMap(L=>L.topics.map(T=>({T,text:T.name+' '+T.asg.map(a=>a.t+' '+a.steps.join(' ')+' '+a.exp).join(' ')+' '+T.int.map(q=>q.q+' '+q.a).join(' ')})));
const used={};
/* all-caps names (ALL, RLS, SE) match case-sensitively, like the in-text links */
terms.forEach(g=>{const res=[g.t,...(g.k||[])].map(n=>new RegExp('(^|[^A-Za-z0-9])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^A-Za-z0-9])',n===n.toUpperCase()?'':'i'));used[g.t]=topics.filter(x=>res.some(r=>r.test(x.text))).map(x=>x.T)});

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const list=terms.filter(g=>(cat==='all'||g.c===cat)&&(!q||(g.t+' '+(g.k||[]).join(' ')+' '+g.d).toLowerCase().includes(q)));
  document.getElementById('cats').innerHTML=`<button class="chip" data-c="all" aria-pressed="${cat==='all'}">All</button>`+cats.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${cat===c}">${esc(c)}</button>`).join('');
  const letters=[...new Set(list.map(g=>g.t[0].toUpperCase()))];
  document.getElementById('az').innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<a href="#letter-${l}" class="${letters.includes(l)?'':'off'}">${l}</a>`).join('');
  if(!list.length){document.getElementById('list').innerHTML='<div class="none">No terms match. Try a shorter word.</div>';return}
  let html='',cur='';
  list.forEach(g=>{
    const L=g.t[0].toUpperCase();if(L!==cur){cur=L;html+=`<div class="letter" id="letter-${L}">${L}</div>`}
    const ts=used[g.t];
    html+=`<article class="g" id="${slug(g.t)}"><h2>${esc(g.t)} <span class="c">${esc(g.c)}</span><a class="anchor" href="#${slug(g.t)}" aria-label="Link to ${esc(g.t)}">#</a></h2><p>${esc(g.d)}</p><div class="meta">${g.k&&g.k.length?`<div>Also written as: ${g.k.map(esc).join(', ')}</div>`:''}${g.s&&g.s.length?`<div>See also: ${g.s.map(s=>`<a href="#${slug(s)}">${esc(s)}</a>`).join(', ')}</div>`:''}${ts.length?`<div>Used in: ${ts.slice(0,5).map(T=>`<a href="index.html#${T.id}">${esc(T.name.split(':')[0])}</a>`).join(', ')}${ts.length>5?` and ${ts.length-5} more`:''}</div>`:''}</div></article>`;
  });
  document.getElementById('list').innerHTML=html;
}
function flashHash(){const id=decodeURIComponent(location.hash.slice(1));const el=id&&document.getElementById(id);if(el&&el.classList.contains('g')){if(!document.getElementById(id).offsetParent){cat='all';document.getElementById('q').value='';render()}const t=document.getElementById(id);t.scrollIntoView({block:'start'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}}
document.getElementById('q').addEventListener('input',render);
document.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;render()}});
addEventListener('hashchange',flashHash);
PBI.initThemeToggles();
render();
if(location.hash){const id=decodeURIComponent(location.hash.slice(1));if(!document.getElementById(id)){cat='all';render()}setTimeout(flashHash,50)}
</script>
</body>
