<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page not found · Power BI Holy Grail</title>
<style>
:root{--bg:#EEF1F5;--panel:#fff;--ink:#1B2430;--ink-2:#4A5568;--line:#D9DEE6;--yellow:#F2C811}
@media (prefers-color-scheme:dark){:root{--bg:#12171E;--panel:#1A212B;--ink:#E9EDF3;--ink-2:#B4BDCA;--line:#2C3644;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;padding:24px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:440px;text-align:center}
.mark{width:44px;height:44px;margin:0 auto 12px;background:var(--yellow);border-radius:8px;display:grid;place-items:center;color:#1B2430;font-weight:700}
h1{font-size:1.4rem;margin:0 0 6px}p{color:var(--ink-2);margin:0 0 18px}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:inherit;font-weight:600}
a.primary{background:var(--yellow);border-color:var(--yellow);color:#1B2430}
</style>
</head>
<body>
<div class="box">
  <div class="mark">BI</div>
  <h1>That page doesn't exist</h1>
  <p>The link may be old, or the address has a typo.</p>
  <div class="links"><a class="primary" id="home" href="/">Go to the course</a><a id="cards" href="/flashcards.html">Flashcards</a></div>
</div>
<script>
/* GitHub project sites live under /<repo>/, so find that base from the current address */
(function(){
  var seg=location.pathname.split('/').filter(Boolean);
  var base=(/\.github\.io$/.test(location.hostname)&&seg.length)?'/'+seg[0]+'/':'/';
  document.getElementById('home').href=base;
  document.getElementById('cards').href=base+'flashcards.html';
})();
</script>
</body>
</html>
