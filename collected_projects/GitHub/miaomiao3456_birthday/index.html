<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>罗小狗生日快乐</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060818;
  }
  body {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -moz-user-select: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
  }
  #fireworks { z-index: 1; }
  #text { z-index: 2; }
  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 9vh;
    z-index: 3;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    font: 13px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: 3px;
    pointer-events: none;
    animation: hint-fade 1.2s ease 9s forwards;
  }
  @keyframes hint-fade { to { opacity: 0; } }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>
<canvas id="text"></canvas>
<div id="hint">点一下屏幕 · 放烟花</div>

<script>
/* ================= 烟花引擎（自包含，无外网依赖） ================= */
(function () {
  var c = document.getElementById('fireworks');
  var ctx = c.getContext('2d');
  var W = 0, H = 0;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var COLORS = [
    [255, 183, 77], [255, 112, 145], [255, 224, 130], [255, 158, 194],
    [255, 241, 118], [128, 216, 255], [255, 213, 153], [255, 105, 135]
  ];
  var rockets = [], sparks = [], stars = [];
  var last = 0, i;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  for (i = 0; i < 90; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: 0.4 + Math.random() * 1.2,
      ph: Math.random() * 6.283, sp: 0.4 + Math.random() * 1.6
    });
  }

  function pick() { return COLORS[(Math.random() * COLORS.length) | 0]; }

  function launch(tx) {
    var x0 = (tx === undefined) ? W * (0.12 + Math.random() * 0.76) : tx;
    rockets.push({
      x: x0, y: H + 8,
      vx: (Math.random() - 0.5) * 1.4,
      vy: -(H * 0.011 + Math.random() * H * 0.004),
      color: pick()
    });
  }

  function explode(r) {
    var n = 70 + ((Math.random() * 60) | 0);
    var c1 = r.color, c2 = (Math.random() < 0.6) ? pick() : c1;
    for (var k = 0; k < n; k++) {
      var a = Math.random() * 6.2832, v = 1.2 + Math.random() * 4.6;
      sparks.push({
        x: r.x, y: r.y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 1, decay: 0.006 + Math.random() * 0.014,
        color: (Math.random() < 0.75) ? c1 : c2,
        r: (Math.random() < 0.22) ? 2.2 : 1.2
      });
    }
  }

  function tick(now) {
    requestAnimationFrame(tick);
    if (now - last > 420 + Math.random() * 300) { launch(); last = now; }
    var g = H * 0.00009;

    /* 用低透明度深色覆盖制造拖尾 */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(6, 8, 24, 0.24)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    /* 闪烁的星星 */
    for (i = 0; i < stars.length; i++) {
      var st = stars[i];
      var tw = 0.3 + 0.7 * Math.abs(Math.sin(now * 0.001 * st.sp + st.ph));
      ctx.globalAlpha = tw * 0.9;
      ctx.fillStyle = '#c9d4ff';
      ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    /* 上升的烟花弹 */
    for (i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.vy += g;
      r.x += r.vx;
      r.y += r.vy;
      if (r.vy > -1.2) { explode(r); rockets.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(255, 205, 150, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(r.x - r.vx * 12, r.y - r.vy * 12 + 30);
      ctx.lineTo(r.x, r.y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 240, 200, 0.95)';
      ctx.fillRect(r.x - 1.2, r.y - 1.2, 2.4, 2.4);
    }

    /* 绽放的火花 */
    for (i = sparks.length - 1; i >= 0; i--) {
      var s = sparks[i];
      s.life -= s.decay;
      if (s.life <= 0.02) { sparks.splice(i, 1); continue; }
      s.vx *= 0.986;
      s.vy = s.vy * 0.986 + 0.035;
      s.x += s.vx;
      s.y += s.vy;
      ctx.globalAlpha = Math.min(1, s.life * 1.4);
      ctx.fillStyle = 'rgb(' + s.color[0] + ',' + s.color[1] + ',' + s.color[2] + ')';
      ctx.fillRect(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
    }
    ctx.globalAlpha = 1;
  }

  function tap(e) {
    var t = (e.touches && e.touches.length) ? e.touches[0] : e;
    launch(t.clientX);
    launch(t.clientX + (Math.random() - 0.5) * 80);
  }
  document.addEventListener('click', tap);
  document.addEventListener('touchstart', tap, { passive: true });

  launch();
  launch();
  requestAnimationFrame(tick);
})();
</script>

<script>
/* ============ 粒子文字引擎（祝福文案在此修改） ============ */
(function () {
  var canvas = document.getElementById('text');
  var context = canvas.getContext('2d');
  var shapeCanvas = document.createElement('canvas');
  var shapeContext = shapeCanvas.getContext('2d');
  var gap = 13;
  var fontSize = 500;
  var fontFamily = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",Arial,sans-serif';
  var dots = [];

  /* ---------- 祝福文案（写信排版）：抬头顶格、正文缩进、落款日期靠右，整块居中 ---------- */
  var ITEMS = [
    { t: '#countdown 3' },
    { t: '罗小狗：', letter: true, align: 'left', y: 0.22, scale: 1.2, fast: true },
    { t: '#heart' },
    { t: '祝全世界\n最纵容我的\n男朋友\n生日快乐！', letter: true, align: 'left', indent: true },
    { t: '愿你新的一岁，\n眼里有光，\n心里有热爱，\n脚下的路\n都通向\n喜欢的生活！', letter: true, align: 'left', indent: true },
    { t: '往后的\n每一个生日，\n我都想\n陪你一起过，\n三餐四季，\n岁岁年年！', letter: true, align: 'left', indent: true },
    { t: '屁屁', letter: true, align: 'right', y: 0.74, scale: 1.6 },
    { t: '#cake', hold: true }
  ];

  var Point = function (args) {
    this.x = args.x;
    this.y = args.y;
    this.z = args.z || 5;
    this.a = (args.a === undefined) ? 1 : args.a;
    this.h = args.h || 0;
  };

  /* 以白色为主，少量暖色点缀，保证小字清晰 */
  var DOT_COLORS = [
    [255, 255, 255], [255, 255, 255], [255, 255, 255],
    [255, 255, 255], [255, 255, 255], [255, 255, 255],
    [255, 224, 168], [255, 224, 168], [255, 192, 217], [170, 230, 255]
  ];

  var Color = function (r, g, b, a) { this.r = r; this.g = g; this.b = b; this.a = a; };
  Color.prototype.render = function () {
    return 'rgba(' + this.r + ',' + this.g + ',' + this.b + ',' + this.a + ')';
  };

  var Dot = function (x, y) {
    this.p = new Point({ x: x, y: y, z: 5, a: 1, h: 0 });
    this.e = 0.07;
    this.s = true;
    var c = DOT_COLORS[(Math.random() * DOT_COLORS.length) | 0];
    this.c = new Color(c[0], c[1], c[2], this.p.a);
    this.t = new Point({ x: this.p.x, y: this.p.y, z: this.p.z, a: this.p.a, h: 0 });
    this.q = [];
  };

  Dot.prototype.distanceTo = function (n, details) {
    var dx = this.p.x - n.x, dy = this.p.y - n.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    return details ? [dx, dy, d] : d;
  };

  Dot.prototype.move = function (p) { this.q.push(p); };

  Dot.prototype._moveTowards = function (n) {
    var dt = this.distanceTo(n, true);
    var dx = dt[0], dy = dt[1], d = dt[2];
    var e = this.e * d;
    if (this.p.h === -1) { this.p.x = n.x; this.p.y = n.y; return true; }
    if (d > 1) {
      this.p.x -= (dx / d) * e;
      this.p.y -= (dy / d) * e;
    } else {
      if (this.p.h > 0) this.p.h--;
      else return true;
    }
    return false;
  };

  Dot.prototype._update = function () {
    if (this._moveTowards(this.t)) {
      var p = this.q.shift();
      if (p) {
        if (p.x !== undefined) this.t.x = p.x;
        if (p.y !== undefined) this.t.y = p.y;
        if (p.z !== undefined) this.t.z = p.z;
        if (p.a !== undefined) this.t.a = p.a;
        this.p.h = p.h || 0;
      } else {
        if (this.s) {
          this.p.x -= Math.sin(Math.random() * 3.142);
          this.p.y -= Math.sin(Math.random() * 3.142);
        } else {
          this.move({
            x: this.p.x + (Math.random() * 50) - 25,
            y: this.p.y + (Math.random() * 50) - 25
          });
        }
      }
    }
    var d = this.p.a - this.t.a;
    this.p.a = Math.max(0.1, this.p.a - (d * 0.03));
    d = this.p.z - this.t.z;
    this.p.z = Math.max(1, this.p.z - (d * 0.03));
  };

  Dot.prototype._draw = function () {
    var small = this.p.z < 3.2;
    if (small) {
      /* 先画一圈低透明度光晕（约 2.2 倍半径），让粒子文字整体更亮 */
      this.c.a = this.p.a * 0.16;
      context.fillStyle = this.c.render();
      var hr = this.p.z * 2.2;
      context.fillRect(this.p.x - hr, this.p.y - hr, hr * 2, hr * 2);
    }
    this.c.a = this.p.a;
    context.fillStyle = this.c.render();
    /* 小粒子用方块绘制，性能更好且与圆形看不出差别 */
    if (small) {
      var r = this.p.z;
      context.fillRect(this.p.x - r, this.p.y - r, r * 2, r * 2);
    } else {
      context.beginPath();
      context.arc(this.p.x, this.p.y, this.p.z, 0, 6.2832, true);
      context.closePath();
      context.fill();
    }
  };

  Dot.prototype.render = function () {
    this._update();
    this._draw();
  };

  /* 采样间距：信件小字用更密的网格（粒子更多更小更清晰）；
     按屏幕分档，保证粒子数不会超过上限而被抽稀（抽稀会让笔画粗细不均） */
  function gapFor(dense) {
    var min = Math.min(window.innerWidth, window.innerHeight);
    if (!dense) return Math.max(5, Math.min(8, Math.round(min / 48)));
    if (min >= 900) return 4;
    if (min >= 600) return 3;
    return window.innerWidth * window.innerHeight > 300000 ? 3 : 2;
  }

  /* 粒子半径 = 采样间距的 0.4 倍：笔画由细密小点组成 */
  var shapeR = 5;

  function fit() {
    shapeCanvas.width = Math.max(14, Math.floor(window.innerWidth / gap) * gap);
    shapeCanvas.height = Math.max(14, Math.floor(window.innerHeight / gap) * gap);
    shapeR = Math.max(0.8, Math.min(3, gap * 0.3));
    shapeContext.fillStyle = 'rgba(255,255,255,1)';
    shapeContext.textBaseline = 'middle';
    shapeContext.textAlign = 'center';
  }

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gap = gapFor(false);
    fit();
    layoutLetter();
  }
  resize();
  window.addEventListener('resize', resize);
  context.globalCompositeOperation = 'lighter';

  function setFontSize(s) {
    shapeContext.font = 'bold ' + Math.round(s) + 'px ' + fontFamily;
  }

  /* 把离屏画布上的文字采样成粒子点阵 */
  function processCanvas() {
    var pixels = shapeContext.getImageData(0, 0, shapeCanvas.width, shapeCanvas.height).data;
    var out = [], x = 0, y = 0, p;
    for (p = 0; p < pixels.length; p += 4 * gap) {
      if (pixels[p + 3] > 0) {
        out.push(new Point({ x: x, y: y, z: shapeR }));
      }
      x += gap;
      if (x >= shapeCanvas.width) {
        x = 0;
        y += gap;
        p += gap * 4 * shapeCanvas.width;
      }
    }
    /* 粒子过多时抽稀，保证手机流畅 */
    if (out.length > 9000) {
      var step = Math.ceil(out.length / 9000), out2 = [], k;
      for (k = 0; k < out.length; k += step) out2.push(out[k]);
      out = out2;
    }
    /* w/h 用整个离屏画布尺寸：与屏幕 1:1 映射，保证左/右对齐位置不偏移 */
    return { dots: out, w: shapeCanvas.width, h: shapeCanvas.height };
  }

  /* 信件版式：所有信件元素共用同一字号和左右边界，整块在屏幕居中，各段互相对齐 */
  var letterS = 0, letterL = 0, letterR = 0;

  function layoutLetter() {
    /* 正文字宽按 8 个字（含首行缩进）设计；字号尽量放大：
       高度按 6 行正文（9 个行高）加字形上下余量，约 H/11，保证整段装得下 */
    letterS = Math.min(
      fontSize,
      (shapeCanvas.width * 0.9) / 8,
      shapeCanvas.height / 11
    );
    letterS = Math.max(8, letterS);
    var blockW = 8 * letterS;
    letterL = (shapeCanvas.width - blockW) / 2;
    letterR = letterL + blockW;
  }

  /* 文字 -> 粒子点阵（支持 \n 多行）
     o.letter: 信件模式（统一字号、块居中）
     o.align: left / right / center（默认居中）
     o.indent: 首行缩进两个字（信件正文）
     o.scale: 相对信件正文的字号倍数（抬头/落款放大用）
     o.y: 垂直位置比例（0.22 抬头偏上，0.74/0.87 落款日期偏下） */
  function letter(l, o) {
    o = o || {};
    l = String(l);
    var lines = l.split('\n');
    var maxChars = 0, i;
    for (i = 0; i < lines.length; i++) {
      if (lines[i].length > maxChars) maxChars = lines[i].length;
    }
    maxChars = maxChars || 1;
    var isLetter = !!o.letter;
    var g = gapFor(isLetter);
    if (g !== gap) { gap = g; fit(); }
    if (isLetter) layoutLetter();

    var s;
    /* 首行缩进：标准 2 字，行长接近版心（如 7 字）时自动减为 1 字，防止首行超出版心 */
    var indentChars = o.indent ? Math.min(2, Math.max(1, 8 - maxChars)) : 0;
    if (isLetter) {
      s = Math.max(8, letterS * (o.scale || 1));
    } else {
      var usable = shapeCanvas.width * 0.86;
      s = Math.min(
        fontSize,
        usable / (maxChars + indentChars),
        (shapeCanvas.height * 0.78) / (lines.length * 1.5)
      );
      s = Math.max(8, s);
    }
    setFontSize(s);
    shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
    var lineH = s * 1.5;
    var total = lines.length * lineH;
    var yFrac = (o.y === undefined) ? 0.5 : o.y;
    var y0 = shapeCanvas.height * yFrac - total / 2 + s / 2;
    /* 越界保护：按字形实际范围（首行顶/末行底）留 0.2 字边距 */
    var glyphTop = y0 - s * 0.6;
    if (glyphTop < s * 0.2) y0 += s * 0.2 - glyphTop;
    var glyphBottom = y0 + (lines.length - 1) * lineH + s * 0.6;
    if (glyphBottom > shapeCanvas.height - s * 0.2) y0 -= (glyphBottom - (shapeCanvas.height - s * 0.2));

    var align = o.align || 'center';
    var leftEdge = isLetter ? letterL : shapeCanvas.width * 0.07;
    var rightEdge = isLetter ? letterR : shapeCanvas.width * 0.93;
    for (i = 0; i < lines.length; i++) {
      var x = shapeCanvas.width / 2;
      if (align === 'left') {
        shapeContext.textAlign = 'left';
        x = leftEdge + (o.indent && i === 0 ? indentChars * (isLetter ? letterS : s) : 0);
      } else if (align === 'right') {
        shapeContext.textAlign = 'right';
        x = rightEdge;
      }
      shapeContext.fillText(lines[i], x, y0 + i * lineH);
    }
    shapeContext.textAlign = 'center';
    return processCanvas();
  }

  /* 心形粒子（密网格整体填满） */
  function heart(size) {
    var g = gapFor(true);
    if (g !== gap) { gap = g; fit(); }
    var maxArea = 8750 * g * g; /* 填充面积受粒子上限约束，避免抽稀 */
    var w = Math.min(size, shapeCanvas.width * 0.55);
    var h = w / 1.28;
    if (w * h > maxArea) {
      var k = Math.sqrt(maxArea / (w * h));
      w *= k; h *= k;
    }
    shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
    shapeContext.fillStyle = 'rgba(255,255,255,1)';
    shapeContext.beginPath();
    var cx = shapeCanvas.width / 2, cy = shapeCanvas.height / 2;
    for (var t = 0; t <= 6.2832; t += 0.02) {
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      /* hy 范围约 -17..+12.5，归一到 [-1,1] 后映射到 h，保证竖直居中 */
      var px = cx + (hx / 16) * (w / 2);
      var py = cy - ((hy + 2.25) / 14.75) * (h / 2);
      if (t === 0) shapeContext.moveTo(px, py);
      else shapeContext.lineTo(px, py);
    }
    shapeContext.closePath();
    shapeContext.fill();
    return processCanvas();
  }

  /* 生日蛋糕（三层蛋糕 + 蜡烛火苗 + 落款日期，收尾造型） */
  function cake() {
    var g = gapFor(true);
    if (g !== gap) { gap = g; fit(); }
    shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
    shapeContext.fillStyle = 'rgba(255,255,255,1)';
    var W = shapeCanvas.width, H = shapeCanvas.height;
    var maxArea = 8750 * g * g;
    var ch = H * 0.38, cw = ch * 0.9; /* 蛋糕整体高/宽 */
    if (cw * ch > maxArea) {
      var k = Math.sqrt(maxArea / (cw * ch));
      cw *= k; ch *= k;
    }
    var cx = W / 2, baseY = H * 0.66, lh = ch * 0.22, r = ch * 0.05;
    function rr(x, y, w, h, rad) { /* 圆角矩形填充 */
      shapeContext.beginPath();
      shapeContext.moveTo(x + rad, y);
      shapeContext.lineTo(x + w - rad, y);
      shapeContext.arcTo(x + w, y, x + w, y + rad, rad);
      shapeContext.lineTo(x + w, y + h - rad);
      shapeContext.arcTo(x + w, y + h, x + w - rad, y + h, rad);
      shapeContext.lineTo(x + rad, y + h);
      shapeContext.arcTo(x, y + h, x, y + h - rad, rad);
      shapeContext.lineTo(x, y + rad);
      shapeContext.arcTo(x, y, x + rad, y, rad);
      shapeContext.closePath();
      shapeContext.fill();
    }
    /* 三层蛋糕体，从下往上逐层收窄 */
    rr(cx - cw * 0.45, baseY - lh, cw * 0.9, lh, r);
    rr(cx - cw * 0.35, baseY - lh * 2, cw * 0.7, lh, r);
    rr(cx - cw * 0.25, baseY - lh * 3, cw * 0.5, lh, r);
    /* 三层蛋糕体 + 每层顶边波浪奶油边（上一层坐在奶油边上，每层波浪都完整可见） */
    function creamWave(x, yTop, w) {
      var n = Math.max(2, Math.round(w / (lh * 0.7)));
      var step = w / n;
      shapeContext.beginPath();
      shapeContext.moveTo(x, yTop);
      shapeContext.lineTo(x + w, yTop);
      for (var i = n - 1; i >= 0; i--) {
        shapeContext.arc(x + (i + 0.5) * step, yTop, step / 2, 0, Math.PI, true);
      }
      shapeContext.closePath();
      shapeContext.fill();
    }
    var y1 = baseY - lh, y2 = y1 - lh * 1.35, y3 = y2 - lh * 1.35; /* 每层顶边位置 */
    rr(cx - cw * 0.45, y1, cw * 0.9, lh, r); /* 第 1 层（底） */
    creamWave(cx - cw * 0.45, y1, cw * 0.9);
    rr(cx - cw * 0.35, y2, cw * 0.7, lh, r); /* 第 2 层（中） */
    creamWave(cx - cw * 0.35, y2, cw * 0.7);
    rr(cx - cw * 0.25, y3, cw * 0.5, lh, r); /* 第 3 层（顶） */
    creamWave(cx - cw * 0.25, y3, cw * 0.5);
    /* 蜡烛 + 爱心火苗（尖朝上的爱心，坐落在顶层奶油边上） */
    var candW = ch * 0.045, candH = ch * 0.13;
    var topY = y3 - lh * 0.35;
    rr(cx - candW / 2, topY - candH, candW, candH, candW / 2);
    var fh = ch * 0.1, fw = fh * 1.1, fy = topY - candH - fh * 0.5;
    shapeContext.beginPath();
    for (var ft = 0; ft <= 6.2832; ft += 0.1) {
      var fhx = 16 * Math.pow(Math.sin(ft), 3);
      var fhy = 13 * Math.cos(ft) - 5 * Math.cos(2 * ft) - 2 * Math.cos(3 * ft) - Math.cos(4 * ft);
      var fpx = cx + (fhx / 16) * (fw / 2);
      var fpy = fy + ((fhy + 2.25) / 14.75) * (fh / 2);
      if (ft === 0) shapeContext.moveTo(fpx, fpy); else shapeContext.lineTo(fpx, fpy);
    }
    shapeContext.closePath();
    shapeContext.fill();
    /* 落款日期（宽度跟随蛋糕，两行居中） */
    var ds = Math.max(8, Math.min(letterS * 1.2, (cw * 0.9) / 5));
    setFontSize(ds);
    shapeContext.textAlign = 'center';
    var lineH = ds * 1.5;
    shapeContext.fillText('2026', cx, H * 0.8);
    shapeContext.fillText('10.26', cx, H * 0.8 + lineH);
    shapeContext.textAlign = 'center';
    return processCanvas();
  }

  /* 粒子群切换到新形状 */
  function switchShape(n, fast) {
    var a = { w: canvas.width, h: canvas.height };
    var cx = a.w / 2 - n.w / 2;
    var cy = a.h / 2 - n.h / 2;
    var d, i, size;

    if (n.dots.length > dots.length) {
      size = n.dots.length - dots.length;
      for (d = 1; d <= size; d++) dots.push(new Dot(a.w / 2, a.h / 2));
    }
    d = 0;
    while (n.dots.length > 0) {
      i = Math.floor(Math.random() * n.dots.length);
      dots[d].e = fast ? 0.3 : (dots[d].s ? 0.09 : 0.07);
      if (dots[d].s) {
        dots[d].move({ z: Math.random() * 3 + 1.5, a: Math.random(), h: fast ? 10 : 18 });
      } else {
        dots[d].move({ z: Math.random() * 1.5 + 1, h: fast ? 10 : 30 });
      }
      dots[d].s = true;
      dots[d].move({ x: n.dots[i].x + cx, y: n.dots[i].y + cy, a: 1, z: shapeR, h: 0 });
      n.dots = n.dots.slice(0, i).concat(n.dots.slice(i + 1));
      d++;
    }
    /* 多余的粒子散落成火花 */
    for (i = d; i < dots.length; i++) {
      if (dots[i].s) {
        dots[i].move({ z: Math.random() * 3 + 1.5, a: Math.random(), h: fast ? 12 : 20 });
        dots[i].s = false;
        dots[i].e = 0.04;
        dots[i].move({
          x: Math.random() * a.w,
          y: Math.random() * a.h,
          a: 0.3,
          z: Math.random() * 1.5 + 0.8,
          h: 0
        });
      }
    }
  }

  /* ---------- 播放器：按顺序展示祝福 ---------- */
  function play(index) {
    if (index >= ITEMS.length) return;
    var item = ITEMS[index];
    var t = item.t;

    if (t.indexOf('#countdown') === 0) {
      var n = parseInt(t.split(' ')[1], 10) || 3;
      var c = n;
      (function tick() {
        if (c > 0) {
          switchShape(letter(String(c)), true);
          c--;
          setTimeout(tick, 1400);
        } else {
          switchShape(letter(' '));
          setTimeout(function () { play(index + 1); }, 400);
        }
      })();
      return;
    }

    var shape = (t === '#heart')
      ? heart(Math.min(canvas.width, canvas.height) * 0.52)
      : (t === '#cake')
        ? cake()
        : letter(t, item);
    switchShape(shape, !!item.fast);

    if (item.hold) return; /* 最后一句一直停留 */
    var ms = Math.min(9000, 3600 + t.length * 130);
    setTimeout(function () { play(index + 1); }, ms);
  }

  function loop() {
    /* 每帧清屏再重画，避免粒子拖尾 */
    context.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < dots.length; i++) dots[i].render();
    requestAnimationFrame(loop);
  }

  loop();
  setTimeout(function () { play(0); }, 600);
})();
</script>
</body>
