  task:{ arr:p => p.tasks, title:['Nueva tarea', 'Editar tarea'],
    fields:(p, r) => [{k:'title', label:'Tarea', value:r.title || '', req:true}, {k:'area', label:'Área', value:r.area || '', list:['Cocina', 'Baño', 'Sala', 'Cuarto', 'Exterior', 'General'], half:true}, {k:'due', label:'Fecha', type:'date', value:r.due || '', half:true},
      {k:'status', label:'Estado', type:'seg', options:Object.entries(STATUS).map(([v, l]) => ({v, l})), value:r.status || 'pendiente'}, {k:'cost', label:'Costo', type:'number', value:r.cost || '', half:true},
      {k:'by', label:'Responsable', type:'select', options:[{v:'ab', l:'Los dos'}, ...whoOpts()], value:r.by || 'ab', half:true}],
    build:v => ({title:v.title, area:v.area, due:v.due, status:v.status, cost:v.cost, by:v.by}) },
  quote:{ arr:p => p.quotes, title:['Nueva cotización', 'Editar cotización'],
    fields:(p, r) => [{k:'item', label:'¿Para qué trabajo o material?', value:r.item || '', req:true, ph:'Mesón de cocina', list:[...new Set(p.quotes.map(q => q.item))]}, {k:'vendor', label:'Proveedor', value:r.vendor || '', req:true}, {k:'amount', label:'Monto', type:'number', value:r.amount || '', req:true, half:true},
      {k:'status', label:'Estado', type:'select', options:Object.entries(QSTATUS).map(([v, l]) => ({v, l})), value:r.status || 'recibida', half:true}, {k:'note', label:'Qué incluye', value:r.note || ''}],
    build:v => ({item:v.item, vendor:v.vendor, amount:v.amount, status:v.status, note:v.note}) },
  li:{ arr:p => p.list, title:['Agregar a la lista', 'Editar elemento'],
    fields:(p, r) => [{k:'text', label:'Elemento', value:r.text || '', req:true}, {k:'group', label:'Grupo', value:r.group || '', list:[...new Set(p.list.map(x => x.group).filter(Boolean))], ph:'Documentos, ropa…'}],
    build:(v, r) => ({text:v.text, group:v.group, done:r?.done || false}) }
};
function safeUrl(u) { if (!u) return ''; if (!/^https?:\/\//i.test(u)) u = 'https://' + u; try { return new URL(u).href; } catch { return ''; } }
function editRec(kind, pid, id) {
  const p = proj(pid); if (!p) return; const K = KINDS[kind];
  const rec = id ? K.arr(p).find(x => x.id === id) : null;
  openSheet({
    title:K.title[rec ? 1 : 0], fields:K.fields(p, rec || {}),
    onSubmit:v => mutate(pid, pp => { const arr = K.arr(pp), nv = K.build(v, rec, pp); if (rec) { const k = arr.findIndex(x => x.id === id); arr[k] = {...arr[k], ...nv}; } else arr.push({id:uid(), ...nv}); }),
    onDelete:rec ? () => mutate(pid, pp => { const arr = K.arr(pp); arr.splice(arr.findIndex(x => x.id === id), 1); }) : null
  });
}

/* ----- itinerario ----- */
function itemForm(pid, dayId, id) {
  const p = proj(pid); const d0 = p.days.find(d => d.id === dayId); const rec = id ? d0.items.find(x => x.id === id) : null;
  openSheet({
    title:rec ? 'Editar plan' : 'Nuevo plan',
    fields:[{k:'title', label:'¿Qué van a hacer?', value:rec?.title || '', req:true},
      {k:'cat', label:'Tipo', type:'select', options:Object.entries(CATS).map(([v, c]) => ({v, l:c.l})), value:rec?.cat || 'actividad', half:true},
      {k:'time', label:'Hora', type:'time', value:rec?.time || '', half:true},
      {k:'place', label:'Lugar o dirección', value:rec?.place || '', ph:'Se abre en Google Maps'},
      {k:'cost', label:'Costo', type:'number', value:rec?.cost || '', half:true},
      {k:'day', label:'Día', type:'select', options:p.days.map((d, k) => ({v:d.id, l:dayLabel(p, d, k)})), value:dayId, half:true},
      {k:'link', label:'Enlace (opcional)', type:'url', value:rec?.link || '', ph:'https://'}, {k:'note', label:'Nota', type:'textarea', value:rec?.note || ''}],
    onSubmit:v => mutate(pid, pp => {
      const obj = {title:v.title, cat:v.cat, time:v.time, place:v.place, cost:v.cost, link:safeUrl(v.link), note:v.note};
      const from = pp.days.find(d => d.id === dayId), to = pp.days.find(d => d.id === v.day) || from;
      if (rec) {
        const k = from.items.findIndex(x => x.id === id);
        if (to === from) from.items[k] = {...from.items[k], ...obj}; else { const [it] = from.items.splice(k, 1); to.items.push({...it, ...obj}); }
      } else to.items.push({id:uid(), done:false, ...obj});
      to.items.sort((a, b) => (a.time || '99').localeCompare(b.time || '99') || 0);
    }),
    onDelete:rec ? () => mutate(pid, pp => { const d = pp.days.find(x => x.id === dayId); d.items.splice(d.items.findIndex(x => x.id === id), 1); }) : null
  });
}
function dayForm(pid, dayId) {
  const p = proj(pid), d = p.days.find(x => x.id === dayId);
  openSheet({
    title:'Editar día', fields:[{k:'date', label:'Fecha', type:'date', value:d.date || ''}],
    onSubmit:v => mutate(pid, pp => { pp.days.find(x => x.id === dayId).date = v.date; pp.days.sort((a, b) => (a.date || '9').localeCompare(b.date || '9')); }),
    onDelete:() => mutate(pid, pp => { pp.days.splice(pp.days.findIndex(x => x.id === dayId), 1); }), delLabel:d.items.length ? `Eliminar día y sus ${d.items.length} planes` : 'Eliminar día'
  });
}

/* ----- proyecto ----- */
function projectForm(pid, type) {
  const p = pid ? proj(pid) : null;
  const t0 = p?.type || type || 'viaje';
  const fields = [
    ...(p ? [] : [{k:'type', label:'¿Qué van a planear?', type:'seg', options:Object.entries(TYPES).map(([v, x]) => ({v, l:x.l})), value:t0}]),
    {k:'name', label:'Nombre', value:p?.name || '', req:true, ph:'Ej.: Viaje a la costa, Baño nuevo, Comprar carro'},
    {k:'place', label:'Lugar (opcional)', value:p?.place || '', ph:'Ciudad, casa o zona'},
    {k:'start', label:'Desde', type:'date', value:p?.start || '', half:true}, {k:'end', label:'Hasta', type:'date', value:p?.end || '', half:true},
    {k:'hue', label:'Color de la portada', type:'hue', value:p?.hue ?? HUES[S.projects.length % HUES.length]},
    {k:'notes', label:'Notas', type:'textarea', value:p?.notes || ''},
    ...(p ? [] : [{k:'_n', type:'note', label:'Meta de ahorro (opcional). Pueden definirla después.'}, {k:'goal', label:'¿Cuánto necesitan?', type:'number', value:'', half:true}, {k:'deadline', label:'¿Para cuándo?', type:'date', value:'', half:true}])
  ];
  openSheet({
    title:p ? 'Editar proyecto' : 'Nuevo proyecto', submit:p ? 'Guardar' : 'Crear', fields,
    onSubmit:v => {
      if (p) { mutate(pid, pp => Object.assign(pp, {name:v.name, place:v.place, start:v.start, end:v.end, hue:Number(v.hue), notes:v.notes})); return; }
      const np = norm({id:uid(), type:v.type, name:v.name, place:v.place, start:v.start, end:v.end, hue:Number(v.hue), notes:v.notes, created:Date.now(),
        budget:DEF_BUDGET[v.type].map(n => ({id:uid(), name:n, est:0})), list:DEF_LIST[v.type].map(([g, x]) => ({id:uid(), group:g, text:x, done:false})),
        savings:{goal:v.goal || 0, initial:0, startDate:today(), deadline:v.deadline || (v.type === 'viaje' && v.start ? addDays(v.start, -3) : v.end || ''), contribs:[]}});
      S.projects.push(np); persist(np); S.view = 'project'; S.pid = np.id; S.tab = 'resumen'; render(); toast('Proyecto creado');
    },
    onDelete:p ? () => { removeProject(pid); S.view = 'home'; render(); toast('Proyecto eliminado'); } : null, delLabel:'Eliminar proyecto'
  });
}
function savingForm(pid) {
  const p = proj(pid), s = p.savings;
  openSheet({
    title:'Meta de ahorro',
    fields:[{k:'goal', label:'¿Cuánto necesitan en total?', type:'number', value:s.goal || '', req:true}, {k:'initial', label:'Ya tienen ahorrado', type:'number', value:s.initial || '', half:true}, {k:'deadline', label:'Fecha límite', type:'date', value:s.deadline || '', half:true}, {k:'startDate', label:'Empezaron a ahorrar el', type:'date', value:s.startDate || today()}],
    onSubmit:v => mutate(pid, pp => Object.assign(pp.savings, {goal:v.goal, initial:v.initial, deadline:v.deadline, startDate:v.startDate || today()}))
  });
}
function ideaPlan(pid, id) {
  const p = proj(pid), idea = p.ideas.find(x => x.id === id);
  if (p.type === 'remodelacion') {
    mutate(pid, pp => { const x = pp.ideas.find(i => i.id === id); x.planned = true; pp.tasks.push({id:uid(), title:x.title, area:x.cat || '', status:'pendiente', due:'', cost:x.cost || 0, by:'ab'}); });
    toast('Agregada a Etapas'); return;
  }
  if (!p.days.length) { toast('Primero agreguen un día en el Itinerario.'); return; }
  openSheet({
    title:'Agregar al itinerario', submit:'Agregar',
    fields:[{k:'day', label:'Día', type:'select', options:p.days.map((d, k) => ({v:d.id, l:dayLabel(p, d, k)})), value:p.days[0].id, half:true}, {k:'time', label:'Hora', type:'time', value:'', half:true}],
    onSubmit:v => { mutate(pid, pp => { const x = pp.ideas.find(i => i.id === id); x.planned = true; const d = pp.days.find(dd => dd.id === v.day); d.items.push({id:uid(), time:v.time, title:x.title, cat:CATS[x.cat] ? x.cat : 'actividad', place:'', cost:x.cost || 0, note:x.note || '', done:false, link:x.link || ''}); d.items.sort((a, b) => (a.time || '99').localeCompare(b.time || '99')); }); toast('Agregado al itinerario'); }
  });
}
function onboarding() {
  S.onboarded = true;
  openSheet({
    title:'Bienvenidos', submit:'Empezar',
    fields:[{k:'_n', type:'note', label:'Dos datos para personalizar todo. Pueden cambiarlos después en Ajustes.'}, {k:'a', label:'Primera persona', value:S.cfg.a === 'Diego' ? 'Diego' : S.cfg.a, req:true, half:true}, {k:'b', label:'Segunda persona', value:S.cfg.b === 'Ella' ? '' : S.cfg.b, req:true, half:true, ph:'Su nombre'},
      {k:'currency', label:'Moneda', type:'select', options:CURRENCIES.map(c => ({v:c, l:c})), value:S.cfg.currency}],
    onSubmit:v => { Object.assign(S.cfg, {a:v.a, b:v.b, currency:v.currency}); saveCfg(); render(); }
  });
}

/* ============ acciones ============ */
const A = {
  go:d => { S.view = d.view; S.pid = d.pid || null; if (d.view === 'project') S.tab = d.tab || 'resumen'; render(); },
  tab:d => { S.tab = d.tab; render(); },
  filter:d => { S.filter = d.v; render(); },
  'new-project':d => projectForm(null, d.type),
  'edit-project':d => projectForm(d.pid),
  'edit-saving':d => savingForm(d.pid),
  rec:d => editRec(d.kind, d.pid, d.id),
  'add-day':d => mutate(d.pid, p => { const last = p.days[p.days.length - 1]; p.days.push({id:uid(), date:last?.date ? addDays(last.date, 1) : (p.start || ''), items:[]}); }),
  'edit-day':d => dayForm(d.pid, d.day),
  'add-item':d => itemForm(d.pid, d.day),
  'edit-item':d => itemForm(d.pid, d.day, d.id),
  'toggle-item':d => mutate(d.pid, p => { const x = p.days.find(k => k.id === d.day).items.find(k => k.id === d.id); x.done = !x.done; }),
  'move-item':d => mutate(d.pid, p => { const it = p.days.find(k => k.id === d.day).items, i = it.findIndex(k => k.id === d.id), j = i + Number(d.dir); if (j < 0 || j >= it.length) return; [it[i], it[j]] = [it[j], it[i]]; }),
  jump:d => { const e = document.getElementById('day-' + d.id); if (e) e.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth', block:'start'}); },
  vote:d => mutate(d.pid, p => { const x = p.ideas.find(k => k.id === d.id); x.votes = x.votes || {a:false, b:false}; x.votes[d.w] = !x.votes[d.w]; }),
  'idea-plan':d => ideaPlan(d.pid, d.id),
  'task-status':d => mutate(d.pid, p => { p.tasks.find(k => k.id === d.id).status = d.to; }),
  'pick-quote':d => mutate(d.pid, p => { const q = p.quotes.find(k => k.id === d.id); p.quotes.forEach(o => { if (o.item === q.item && o !== q) o.status = 'descartada'; }); q.status = 'elegida'; }),
  'toggle-li':d => mutate(d.pid, p => { const x = p.list.find(k => k.id === d.id); x.done = !x.done; }),
  'clear-done':d => mutate(d.pid, p => { p.list = p.list.filter(x => !x.done); }),
  'load-samples':() => { samples().forEach(p => { S.projects.push(p); persist(p); }); S.view = 'home'; render(); toast('Se agregaron dos proyectos de ejemplo'); },
  'sync-connect':async () => {
    let u = ($('#cfg_sync')?.value || '').trim();
    try {
      const url = new URL(u); if (url.protocol !== 'https:') throw 0;
      let path = url.pathname.replace(/\/+$/, '');
      if (!path) { const b = crypto.getRandomValues(new Uint8Array(16)); path = '/planes-' + Array.from(b, x => x.toString(16).padStart(2, '0')).join(''); }
      if (!path.endsWith('.json')) path += '.json';
      url.pathname = path; url.search = ''; url.hash = ''; u = url.href;
    } catch { toast('Pega la dirección completa, que empieza con https://'); return; }
    S.cfg.updated = S.cfg.updated || Date.now(); setSync(u); toast('Conectando…');
    await syncNow();
    if (!S.live) { setSync(null); toast('No se pudo conectar. Revisen la dirección y las reglas de la base de datos.'); render(); return; }
    startPoll(); render(); toast('Conectado. Ya pueden compartir el enlace.');
  },
  'sync-copy':async () => { try { await navigator.clipboard.writeText(shareLink()); toast('Enlace copiado'); } catch { $('#cfg_link')?.select(); toast('Selecciona el enlace y cópialo.'); } },
  'sync-off':() => { setSync(null); clearInterval(Sync.poll); Sync.poll = null; S.live = false; render(); toast('Este dispositivo dejó de sincronizar. Sus datos siguen guardados aquí.'); },
  export:async () => {
    let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch {}
    const data = JSON.stringify({exportado:new Date().toISOString(), ajustes:S.cfg, proyectos:S.projects}, null, 2);
    if (!dl) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = 'nuestros-planes-respaldo.json'; a.click(); return; }
    try { await dl.save({filename:'nuestros-planes-respaldo.json', data}); toast('Respaldo guardado'); } catch (e) { if (e?.code !== 'declined') toast('No se pudo guardar el respaldo.'); }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
document.addEventListener('change', e => {
  const k = e.target.dataset?.cfg; if (!k) return;
  const v = e.target.value.trim(); if (!v) { e.target.value = S.cfg[k]; return; }
  S.cfg[k] = v; saveCfg(); render(); toast('Ajustes guardados');
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const m = $('#main'); if (m && S.view === 'project' && S.tab === 'ahorro' && Math.abs(m.clientWidth - (S.cw)) > 40) render(); }, 200); });

/* ============ arranque ============ */
function maybeOnboard() { if (S.loaded && S.cfgKnown && !S.cfg.set && !S.onboarded) onboarding(); }
async function boot() {
  loadCache(); readSync(); setCur(); render();
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
  if (!db && Sync.url) { startPoll(); await syncNow(); return; }
  if (!db) { S.loaded = true; S.cfgKnown = true; render(); maybeOnboard(); return; }
  Store.db = db;
  db.doc('ajustes/pareja').onSnapshot(s => {
    if (s.exists) { S.cfg = {...S.cfg, ...s.data(), set:true}; setCur(); } else S.cfg.set = false;
    S.cfgKnown = true; cache(); render(true); maybeOnboard();
  }, () => { S.cfgKnown = true; });
  db.collection('proyectos').onSnapshot(snap => {
    const local = new Map(S.projects.map(p => [p.id, p]));
    S.projects = snap.docs.map(d => Store.dirty.has(d.id) && local.get(d.id) ? local.get(d.id) : norm({...clone(d.data()), id:d.id})).sort((a, b) => (a.created || 0) - (b.created || 0));
    S.loaded = true; S.live = true; cache(); render(true); maybeOnboard();
  }, () => { S.loaded = true; render(); });
}
boot();
})();
</script>
