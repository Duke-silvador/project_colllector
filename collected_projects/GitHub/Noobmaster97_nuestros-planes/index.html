<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestros Planes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concepto: iPadOS. Barra lateral en pantallas grandes, barra inferior en teléfonos, hojas modales, listas agrupadas y una portada de color distinta por proyecto. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Figtree","Segoe UI",system-ui,sans-serif;
  --bg:#f5f5f7;
  --surface:#ffffff;
  --surface-2:#f2f2f5;
  --text:#1d1d1f;
  --text-2:#65656b;
  --text-3:#9a9aa1;
  --line:rgba(60,60,67,.15);
  --fill:rgba(120,120,128,.12);
  --seg-on:#ffffff;
  --accent:#0071e3;
  --accent-ink:#ffffff;
  --accent-soft:rgba(0,113,227,.10);
  --good:#1f8a3e;
  --warn:#b25e00;
  --bad:#d3001b;
  --pa:#5856d6;
  --pb:#e0325f;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --scrim:rgba(0,0,0,.34);
  --glass:rgba(245,245,247,.78);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1c1c1e;--surface-2:#2c2c2e;--text:#f5f5f7;--text-2:#a1a1a6;--text-3:#6e6e73;
    --line:rgba(235,235,245,.14);--fill:rgba(120,120,128,.28);--seg-on:#636366;
    --accent:#2997ff;--accent-ink:#00121f;--accent-soft:rgba(41,151,255,.16);
    --good:#32d74b;--warn:#ff9f0a;--bad:#ff6961;--pa:#7d7aff;--pb:#ff6482;
    --shadow:none;--scrim:rgba(0,0,0,.6);--glass:rgba(0,0,0,.72);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1c1c1e;--surface-2:#2c2c2e;--text:#f5f5f7;--text-2:#a1a1a6;--text-3:#6e6e73;
  --line:rgba(235,235,245,.14);--fill:rgba(120,120,128,.28);--seg-on:#636366;
  --accent:#2997ff;--accent-ink:#00121f;--accent-soft:rgba(41,151,255,.16);
  --good:#32d74b;--warn:#ff9f0a;--bad:#ff6961;--pa:#7d7aff;--pb:#ff6482;
  --shadow:none;--scrim:rgba(0,0,0,.6);--glass:rgba(0,0,0,.72);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:28px;height:28px}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{display:none}
.main{--gut:clamp(16px,4vw,40px);width:100%;max-width:1160px;margin-inline:auto;padding-inline:var(--gut);padding-block:22px 118px;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 0;font-size:11px;font-weight:600;color:var(--text-3)}
.tabbar button[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .app{grid-template-columns:272px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;align-self:start;height:100dvh;overflow-y:auto;padding:24px 14px 18px;background:var(--surface);border-right:1px solid var(--line)}
  .tabbar{display:none}
  .main{padding-block:32px 64px}
}

/* barra lateral */
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.mark{position:relative;width:34px;height:34px;flex:none}
.mark i{position:absolute;top:7px;width:20px;height:20px;border-radius:50%;mix-blend-mode:multiply}
.mark i:first-child{left:0;background:var(--pa)}
.mark i:last-child{right:0;background:var(--pb)}
:root[data-theme="dark"] .mark i{mix-blend-mode:screen}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark i{mix-blend-mode:screen}}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.nav a{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:10px;background:none;text-align:left;font-size:15px;font-weight:500;color:var(--text)}
.nav button:hover,.nav a:hover{background:var(--fill)}
.nav [aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side h4{margin:0;padding:0 12px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:hsl(var(--h) 75% 52%)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.sync{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--text-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.sync.live i{background:var(--good)}

/* ---------- texto y controles ---------- */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.lt{display:flex;flex-direction:column;gap:4px;margin-bottom:22px}
.lt h1{font-size:clamp(30px,5.4vw,42px);line-height:1.08;letter-spacing:-.025em;font-weight:700}
.lt p{color:var(--text-2);max-width:60ch}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:34px 0 14px}
.sec-h h2{font-size:22px;letter-spacing:-.015em;font-weight:700}
.muted{color:var(--text-2)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:600;white-space:nowrap;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:none;color:var(--accent);padding:0 10px}
.btn.gray{background:var(--fill);color:var(--text)}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn.sm{min-height:32px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:var(--fill);color:var(--text-2);flex:none}
.ibtn:hover{color:var(--text)}
.ibtn.xs{width:28px;height:28px}
.ibtn.on{background:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;padding:2px;border-radius:10px;background:var(--fill)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--fill);color:var(--text-2);font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.who{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pa);color:#fff;font-size:11px;font-weight:700;flex:none;border:2px solid var(--surface)}
.who.b{background:var(--pb)}
.whos{display:inline-flex}
.whos .who+.who{margin-left:-8px}

/* ---------- superficies ---------- */
.card{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:650;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.group{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:54px;width:100%;border:0;background:none;text-align:left}
button.row:hover{background:var(--surface-2)}
.row+.row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:550;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--text-2);overflow-wrap:anywhere}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.bar.thin{height:5px}
.chip-ic{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);flex:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:36px 20px;color:var(--text-2)}
.empty h3{color:var(--text);font-size:19px;letter-spacing:-.01em}
.empty p{max-width:44ch}
.empty .i-big{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px 20px}
.stat .l{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}
.stat .v{font-size:22px;font-weight:650;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.stat .v.big{font-size:34px;font-weight:700;letter-spacing:-.025em}

/* portadas */
.cover{--h:212;color:#fff;background:
  radial-gradient(120% 130% at 0% 0%,hsl(var(--h) 92% 64%/.85),transparent 55%),
  radial-gradient(90% 110% at 100% 100%,hsl(calc(var(--h) + 48) 85% 40%),transparent 62%),
  linear-gradient(135deg,hsl(var(--h) 72% 46%),hsl(calc(var(--h) + 26) 68% 34%))}
.cover .wm{position:absolute;right:-14px;bottom:-22px;width:150px;height:150px;opacity:.16;stroke:#fff;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s ease}
.pcard:hover{transform:translateY(-2px)}
.pcard .cover{position:relative;overflow:hidden;min-height:112px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.pcard .cover .pill{align-self:flex-start;background:rgba(255,255,255,.22);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pcard .cover h3{font-size:20px;font-weight:700;letter-spacing:-.02em;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.pcard .body{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.pcard .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text-2)}
.pcard .meta b{color:var(--text);font-weight:600}

.hero-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.hero{position:relative;overflow:hidden;min-height:196px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;text-align:left;border:0;width:100%}
.hero.cover{padding:22px}
.hero .count{display:flex;align-items:baseline;gap:10px}
.hero .count b{font-size:clamp(56px,10vw,76px);line-height:.95;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .count span{font-size:19px;font-weight:600;opacity:.92}
.hero h3{font-size:22px;letter-spacing:-.02em;font-weight:700;color:inherit}
.hero p{opacity:.9}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.savehero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.savehero .txt{flex:1;min-width:190px;display:flex;flex-direction:column;gap:6px}

/* cabecera de proyecto */
.phead{position:relative;overflow:hidden;border-radius:26px;padding:16px 20px 22px;min-height:196px;display:flex;flex-direction:column;justify-content:space-between;gap:26px}
.phead .top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.phead .glass{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:0;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:600;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.phead .glass:hover{background:rgba(255,255,255,.3)}
.phead h1{font-size:clamp(30px,5.6vw,44px);line-height:1.05;letter-spacing:-.03em;font-weight:700;text-shadow:0 1px 10px rgba(0,0,0,.2)}
.phead .sub{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:15px;opacity:.94}
.phead .sub span{display:inline-flex;align-items:center;gap:6px}
.phead .txt{position:relative;z-index:1}
.ptabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px calc(-1*var(--gut)) 20px;padding:10px var(--gut);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;border:0;background:none;padding:8px 15px;border-radius:99px;font-size:15px;font-weight:600;color:var(--text-2)}
.ptabs button:hover{color:var(--text)}
.ptabs button[aria-current="true"]{background:var(--text);color:var(--bg)}

/* anillo */
.ring{position:relative;width:var(--s,96px);height:var(--s,96px);flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--fill)}
.ring .fg{stroke:var(--c,var(--accent));stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s,96px)*.22);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* gráfico */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ct{fill:var(--text-2);font-size:11.5px;font-family:var(--font)}
.chart .ideal{stroke:var(--text-3);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.chart .actual{stroke:var(--accent);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.13}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.chart .today{stroke:var(--text-3);stroke-width:1;stroke-dasharray:2 4}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:16px;height:0;border-top:3px solid var(--accent);border-radius:2px}
.legend i.d{border-top:2px dashed var(--text-3)}

/* itinerario */
.dayjump{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:16px}
.dayjump::-webkit-scrollbar{display:none}
.dayjump button{flex:none;display:flex;flex-direction:column;align-items:center;min-width:58px;padding:8px 12px;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.dayjump button b{font-size:19px;color:var(--text);letter-spacing:-.01em;font-weight:700}
.day{scroll-margin-top:80px}
.day-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin:0 0 10px;padding-inline:4px}
.day-h h3{font-size:19px;letter-spacing:-.015em;font-weight:700}
.day-h .s{font-size:13px;color:var(--text-2)}
.stops{list-style:none;margin:0;padding:0}
.stop{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:14px 12px 14px 16px}
.stop+.stop{border-top:0}
.stop::before{content:"";position:absolute;left:29px;top:0;bottom:0;width:2px;background:var(--line)}
.stop:first-child::before{top:28px}
.stop:last-child::before{bottom:calc(100% - 28px)}
.stop:only-child::before{display:none}
.stop .n{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:50%;background:var(--c);color:#fff;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.stop.done .n{background:var(--good)}
.stop.done .t{color:var(--text-3);text-decoration:line-through}
.stop .t{font-weight:600;overflow-wrap:anywhere}
.stop .m{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-top:3px;font-size:13px;color:var(--text-2)}
.stop .m a{display:inline-flex;align-items:center;gap:4px;color:var(--accent)}
.stop .note{margin-top:6px;font-size:14px;color:var(--text-2);overflow-wrap:anywhere}
.stop .acts{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.stop .acts .r{display:flex;gap:4px}

/* tarjetas de ideas y tareas */
.idea{display:flex;flex-direction:column;gap:10px}
.idea h3{overflow-wrap:anywhere}
.idea .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.idea .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.votes{display:flex;gap:6px}
.vote{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px 0 8px;border:0;border-radius:99px;background:var(--fill);color:var(--text-2);font-size:13px;font-weight:600}
.vote svg{fill:none}
.vote[aria-pressed="true"]{color:#fff;background:var(--vc)}
.vote[aria-pressed="true"] svg{fill:currentColor}
.kan{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));align-items:start}
.col{display:flex;flex-direction:column;gap:10px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}
.task{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.task .t{font-weight:600;overflow-wrap:anywhere}
.task .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.task .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qgroup{padding:6px 0}
.q-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 8px}
.q-h h3{font-size:17px}
.check{display:grid;place-items:center;width:24px;height:24px;border:2px solid var(--text-3);border-radius:50%;background:none;color:transparent;flex:none;padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done-txt{color:var(--text-3);text-decoration:line-through}
.gh{padding:0 6px 8px;font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}
.agenda-m{margin:26px 0 10px;padding-inline:4px;font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}
.dateblk{display:flex;flex-direction:column;align-items:center;width:46px;flex:none;line-height:1.1}
.dateblk small{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--bad)}
.dateblk b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.field-row{display:flex;flex-direction:column;gap:6px;max-width:420px}

/* formularios y hojas */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s ease}
.sheet{position:relative;width:min(100%,540px);max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.25);animation:up .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.sheet header h2{font-size:17px;font-weight:650;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet header .btn{flex:none}
.sheet-body{overflow-y:auto;padding:18px 16px 22px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.half{grid-column:span 1}
.fld label,.fld .lbl{font-size:13px;font-weight:600;color:var(--text-2);padding-left:2px}
.in,.fld select,.fld textarea{width:100%;min-height:46px;padding:0 14px;border:1px solid transparent;border-radius:13px;background:var(--surface);font-size:16px;color:var(--text)}
.fld textarea{padding:12px 14px;resize:vertical;min-height:84px;line-height:1.4}
.in:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.fld.err .in{border-color:var(--bad)}
.fld .hint{font-size:12px;color:var(--bad)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent;background:linear-gradient(135deg,hsl(var(--h) 80% 60%),hsl(calc(var(--h) + 26) 70% 40%))}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}
.sec-note{grid-column:1/-1;font-size:13px;color:var(--text-2);padding:2px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);padding:11px 18px;border-radius:99px;background:var(--text);color:var(--bg);font-size:14px;font-weight:550;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:up .25s ease}
@media (min-width:900px){.toast{bottom:32px}}
@media (min-width:640px){
  .sheet-wrap{align-items:center}
  .sheet{border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);padding-bottom:0}
}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.skel{display:flex;flex-direction:column;gap:16px}
.skel i{display:block;border-radius:22px;background:var(--fill);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
(() => {
'use strict';

/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clone = o => JSON.parse(JSON.stringify(o));
const sum = (a, k) => (a || []).reduce((s, x) => s + (Number(typeof k === 'function' ? k(x) : x[k]) || 0), 0);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const fmtD = (s, o) => s ? parse(s).toLocaleDateString('es', o) : '';
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function rangeText(a, b) {
  if (!a && !b) return 'Sin fechas';
  if (!b || a === b) return fmtD(a || b, {day:'numeric', month:'short', year:'numeric'});
  if (!a) return fmtD(b, {day:'numeric', month:'short', year:'numeric'});
  const A = parse(a), B = parse(b);
  if (A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear())
    return `${A.getDate()}–${B.getDate()} ${fmtD(b, {month:'short'})} ${B.getFullYear()}`;
  return `${fmtD(a, {day:'numeric', month:'short'})} – ${fmtD(b, {day:'numeric', month:'short', year:'numeric'})}`;
}
let nf;
const money = n => nf.format(Math.round(n || 0));
const compact = n => new Intl.NumberFormat('es', {notation:'compact', maximumFractionDigits:1}).format(n);
function num(x) {
  let s = String(x ?? '').replace(/[^\d.,-]/g, '');
  if (!s) return 0;
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

/* ============ iconos ============ */
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  plane:'<path d="M21 3 3 10.5l6.5 2.5L12 20z"/><path d="M9.5 13 21 3"/>',
  tool:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1-1.3-1.7-3-1.7s-3 .8-3 2 1.3 1.7 3 2 3 .9 3 2-1.3 2-3 2-3-.7-3-1.7"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/>',
  gear:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',

  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',

  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>',

  bed:'<path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.5"/>',
  car:'<path d="M5 16l1.5-5.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 16"/><path d="M4 16h16v3H4zM7 19v1.5M17 19v1.5"/><circle cx="8" cy="13.5" r=".6"/><circle cx="16" cy="13.5" r=".6"/>',
  bag:'<path d="M6 8h12l1 12H5zM9 8V6a3 3 0 0 1 6 0v2"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3-5 6.5-5s5.9 1.6 6.5 5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 15.3c1.9.6 3.1 2.2 3.5 4.7"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke-width="3"/>',
  layers:'<path d="M12 3 3 8l9 5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  down2:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/>'
};
const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ''}</svg>`;

/* ============ catálogos ============ */
const CATS = {
  comida:{l:'Comida', i:'food', c:'#f08a00'},
  actividad:{l:'Actividad', i:'ticket', c:'#a552d8'},
  alojamiento:{l:'Alojamiento', i:'bed', c:'#0a7ce0'},
  transporte:{l:'Transporte', i:'car', c:'#1c9bb0'},
  compras:{l:'Compras', i:'bag', c:'#e0325f'},
  otro:{l:'Otro', i:'spark', c:'#7d7d85'}
};
const TYPES = {
  viaje:{l:'Viaje', pl:'Viajes', i:'plane'},
  remodelacion:{l:'Remodelación', pl:'Remodelaciones', i:'tool'},
  meta:{l:'Meta', pl:'Metas', i:'flag'}
};
const HUES = [212, 258, 285, 330, 8, 28, 160, 190];
const CURRENCIES = ['USD','COP','MXN','EUR','ARS','CLP','PEN','BRL','GBP'];
const STATUS = {pendiente:'Pendiente', encurso:'En curso', listo:'Listo'};
const QSTATUS = {pedida:'Pedida', recibida:'Recibida', elegida:'Elegida', descartada:'Descartada'};
const DEF_BUDGET = {
  viaje:['Transporte','Alojamiento','Comida','Actividades','Compras','Imprevistos'],
  remodelacion:['Materiales','Mano de obra','Muebles','Electrodomésticos','Permisos','Imprevistos'],
  meta:['General']
};
const DEF_LIST = {
  viaje:[['Documentos','Documentos de identidad'],['Documentos','Reservas guardadas en el celular'],['Documentos','Seguro de viaje'],['Ropa','Ropa cómoda para caminar'],['Ropa','Traje de baño'],['Ropa','Una chaqueta ligera'],['Tecnología','Cargadores y batería portátil'],['Tecnología','Adaptador de enchufe'],['Salud','Botiquín y medicinas de siempre']],
  remodelacion:[['Antes de empezar','Tomar medidas del espacio'],['Antes de empezar','Pedir al menos tres cotizaciones'],['Antes de empezar','Revisar permisos con la administración'],['Compras','Muestras de pintura y de piso']],
  meta:[]
};

/* ============ estado ============ */
const S = {
  cfg:{a:'Diego', b:'Ella', currency:'USD', set:false},
  projects:[], view:'home', pid:null, tab:'resumen', filter:'todos',
  loaded:false, cfgKnown:false, live:false, readonly:false, cw:0, onboarded:false
};
const KEY = 'nuestros-planes:v1';
const proj = id => S.projects.find(p => p.id === id);
const nm = w => S.cfg[w] || (w === 'a' ? 'Tú' : 'Pareja');
const ini = w => (nm(w).trim()[0] || '?').toUpperCase();
function setCur() {
  try { nf = new Intl.NumberFormat('es-CO', {style:'currency', currency:S.cfg.currency || 'USD', maximumFractionDigits:0}); }
  catch { nf = new Intl.NumberFormat('es-CO', {style:'currency', currency:'USD', maximumFractionDigits:0}); }
}
S.tombs = {};
function cache() { try { localStorage.setItem(KEY, JSON.stringify({cfg:S.cfg, projects:S.projects, tombs:S.tombs})); } catch {} }
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (c) { S.cfg = {...S.cfg, ...c.cfg}; S.projects = (c.projects || []).map(norm); S.tombs = c.tombs || {}; S.loaded = S.projects.length > 0; }
  } catch {}
}

function ensureDays(p) {
  if (p.type !== 'viaje' || !p.start || !p.end) return;
  const n = Math.min(diffDays(p.start, p.end), 44);
  if (n < 0) return;
  for (let i = 0; i <= n; i++) {
    const d = addDays(p.start, i);
    if (!p.days.some(x => x.date === d)) p.days.push({id:'d' + d, date:d, items:[]});
  }
  p.days.sort((x, y) => (x.date || '9').localeCompare(y.date || '9'));
}
function norm(p) {
  p.budget ??= []; p.expenses ??= []; p.ideas ??= []; p.days ??= []; p.tasks ??= []; p.quotes ??= []; p.list ??= [];
  p.savings ??= {goal:0, initial:0, startDate:today(), deadline:'', contribs:[]};
  p.savings.contribs ??= [];
  p.hue ??= 212; p.type ??= 'meta'; p.name ??= 'Sin nombre'; p.created ??= Date.now();
  ensureDays(p);
  return p;
}

/* ============ almacenamiento ============ */
const Store = {db:null, dirty:new Map(), inflight:new Set(), timers:new Map()};
/* Sincronización sin servidor propio: una dirección REST (GET y PUT de un JSON), por ejemplo Firebase Realtime Database en su plan gratuito. */
const Sync = {url:null, timer:null, busy:false, poll:null};
const SKEY = KEY + ':sync';
const stamp = p => p.updated || p.created || 0;
function setSync(u) { Sync.url = u; try { u ? localStorage.setItem(SKEY, u) : localStorage.removeItem(SKEY); } catch {} }
function readSync() {
  try {
    const m = location.hash.match(/[#&]s=([^&]+)/);
    if (m) { const u = decodeURIComponent(m[1]); if (/^https:\/\//.test(u)) setSync(u); history.replaceState(null, '', location.pathname + location.search); }
    else Sync.url = localStorage.getItem(SKEY) || null;
  } catch {}
}
function schedSync() { if (!Sync.url) return; clearTimeout(Sync.timer); Sync.timer = setTimeout(syncNow, 700); }
function startPoll() {
  if (Sync.poll || !Sync.url) return;
  Sync.poll = setInterval(() => { if (!document.hidden) syncNow(); }, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });
}
function mergeRemote(r) {
  r = r && typeof r === 'object' ? r : {};
  let pull = false, push = false;
  const rt = r.tombs || {}, tombs = {...rt};
  for (const [id, t] of Object.entries(S.tombs)) if (!(rt[id] >= t)) { tombs[id] = Math.max(t, rt[id] || 0); push = true; }
  const local = new Map(S.projects.map(p => [p.id, p])), out = [];
  for (const [id, rp] of Object.entries(r.projects || {})) {
    const lp = local.get(id); local.delete(id);
    if ((tombs[id] || 0) >= stamp(rp)) { if (lp) pull = true; continue; }
    if (!lp || stamp(rp) > stamp(lp)) { out.push(norm(clone(rp))); pull = true; }
    else { out.push(lp); if (stamp(rp) < stamp(lp)) push = true; }
  }
  for (const lp of local.values()) { if ((tombs[lp.id] || 0) >= stamp(lp)) { pull = true; continue; } out.push(lp); push = true; }
  S.projects = out.sort((a, b) => (a.created || 0) - (b.created || 0)); S.tombs = tombs;
  const rc = r.cfg;
  if (rc && (rc.updated || 0) > (S.cfg.updated || 0)) { S.cfg = {...S.cfg, ...rc, set:true}; setCur(); pull = true; }
  else if (S.cfg.set && (S.cfg.updated || 0) > ((rc && rc.updated) || 0)) push = true;
  return {pull, push};
}
async function syncNow() {
  if (!Sync.url || Sync.busy) return;
  Sync.busy = true;
  const before = [S.live, S.cfgKnown, S.loaded].join();
  let pulled = false;
  try {
    const g = await fetch(Sync.url, {cache:'no-store'}); if (!g.ok) throw new Error(g.status);
    const m = mergeRemote(await g.json()); pulled = m.pull;
    if (m.push) {
      const body = {cfg:S.cfg, projects:Object.fromEntries(S.projects.map(p => [p.id, p])), tombs:S.tombs};
      const w = await fetch(Sync.url, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); if (!w.ok) throw new Error(w.status);
    }
    S.live = true;
  } catch { S.live = false; }
  finally {
    Sync.busy = false; S.cfgKnown = true; S.loaded = true;
    if (pulled) cache();
    if (pulled || before !== [S.live, S.cfgKnown, S.loaded].join()) { render(true); maybeOnboard(); }
  }
}
function persist(p) {
  cache();
  if (!Store.db) { schedSync(); return; }
  Store.dirty.set(p.id, (Store.dirty.get(p.id) || 0) + 1);
  clearTimeout(Store.timers.get(p.id));
  Store.timers.set(p.id, setTimeout(() => flush(p.id), 350));
}
async function flush(id) {
  if (Store.inflight.has(id)) { Store.timers.set(id, setTimeout(() => flush(id), 300)); return; }
  const p = proj(id); if (!p) { Store.dirty.delete(id); return; }
  const n = Store.dirty.get(id);
  Store.inflight.add(id);
  try {
    await Store.db.doc('proyectos/' + id).set(clone(p));
    if (Store.dirty.get(id) === n) Store.dirty.delete(id); else Store.timers.set(id, setTimeout(() => flush(id), 100));
  } catch (e) {
    Store.dirty.delete(id);
    if (e && e.code === 'invalid_argument') { S.readonly = true; toast('No se pudo guardar. Pide que te den acceso de colaborador.'); }
    else toast('No se pudo guardar. Revisa la conexión.');
  } finally { Store.inflight.delete(id); }
}
function saveCfg() {
  S.cfg.set = true; S.cfg.updated = Date.now(); setCur(); cache(); schedSync();
  if (Store.db) Store.db.doc('ajustes/pareja').set(clone(S.cfg)).catch(() => toast('No se pudieron guardar los ajustes.'));
}
function removeProject(id) {
  S.projects = S.projects.filter(p => p.id !== id); S.tombs[id] = Date.now(); cache(); schedSync();
  if (Store.db) Store.db.doc('proyectos/' + id).delete().catch(() => toast('No se pudo eliminar.'));
}
function mutate(pid, fn) {
  const p = proj(pid); if (!p) return;
  fn(p); ensureDays(p); p.updated = Date.now(); persist(p); render();
}

/* ============ cálculos ============ */
const savedOf = p => (p.savings.initial || 0) + sum(p.savings.contribs, 'amount');
function saveInfo(p) {
  const s = p.savings; if (!s || !s.goal) return null;
  const t = today(), saved = savedOf(p), init = s.initial || 0;
  const remaining = Math.max(s.goal - saved, 0), pct = Math.min(saved / s.goal, 1);
  const start = s.startDate || t, dl = s.deadline;
  let monthly = null, expected = null, late = 0, status = 'nodate', eta = null;
  if (dl) {
    const left = diffDays(t, dl);
    monthly = remaining === 0 ? 0 : remaining / Math.max(1, Math.ceil(Math.max(left, 0) / 30.44));
    const total = Math.max(diffDays(start, dl), 1);
    const frac = Math.min(Math.max(diffDays(start, t) / total, 0), 1);
    expected = init + (s.goal - init) * frac;
    late = expected - saved;
    status = left < 0 ? 'overdue' : late <= 0.5 ? 'ontrack' : 'behind';
  }
  if (remaining === 0) status = 'done';
  const elapsed = diffDays(start, t), gained = saved - init;
  if (remaining > 0 && elapsed >= 14 && gained > 0) eta = addDays(t, Math.ceil(remaining / (gained / elapsed)));
  return {saved, remaining, pct, monthly, expected, status, late, eta, goal:s.goal, dl, start, init};
}
function statusPill(i) {
  if (!i) return '';
  const m = {done:['good','Meta lograda'], ontrack:['good','Al día'], behind:['warn', `Atrasados ${money(i.late)}`], overdue:['bad','Fecha vencida'], nodate:['','Sin fecha límite']}[i.status];
  return `<span class="pill ${m[0]}">${m[1]}</span>`;
}
function allItems(p) { return p.days.flatMap(d => d.items); }
function budgetInfo(p) {
  const est = sum(p.budget, 'est'), spent = sum(p.expenses, 'amount');
  let committed = 0;
  if (p.type === 'viaje') committed = sum(allItems(p), 'cost');
  if (p.type === 'remodelacion') committed = sum(p.tasks, 'cost') + sum(p.quotes.filter(q => q.status === 'elegida'), 'amount');
  return {est, spent, committed};
}
function balance(p) {
  const a = sum(p.expenses.filter(e => e.by === 'a'), 'amount'), b = sum(p.expenses.filter(e => e.by === 'b'), 'amount');
  return {a, b, diff:a - (a + b) / 2};
}

}
function who(w) { return `<span class="who ${w === 'b' ? 'b' : ''}" title="${esc(nm(w))}">${esc(ini(w))}</span>`; }

/* ============ Agenda ============ */
function events() {
  const ev = [], t = today();
  S.projects.forEach(p => {
    const T = TYPES[p.type], i = saveInfo(p);
    if (p.type === 'viaje') { if (p.start) ev.push({date:p.start, title:`Salen: ${p.name}`, sub:p.place, p, ic:'plane'}); }
    else if (p.type === 'remodelacion') {
      if (p.start) ev.push({date:p.start, title:`Empieza: ${p.name}`, sub:p.place, p, ic:'tool'});
      if (p.end) ev.push({date:p.end, title:`Entrega: ${p.name}`, sub:p.place, p, ic:'tool'});
    } else if (p.end) ev.push({date:p.end, title:`Fecha objetivo: ${p.name}`, sub:p.place, p, ic:'flag'});
    if (i && i.dl && i.remaining > 0) ev.push({date:i.dl, title:`Fin del ahorro: ${p.name}`, sub:`Faltarían ${money(i.remaining)}`, p, ic:'coin'});
    p.tasks.filter(x => x.due && x.status !== 'listo').forEach(x => ev.push({date:x.due, title:x.title, sub:`${p.name}${x.area ? ' · ' + x.area : ''}`, p, ic:'check'}));
    p.days.forEach((d, n) => { if (d.date && d.items.length) ev.push({date:d.date, title:`Día ${n + 1}: ${p.name}`, sub:`${d.items.length} ${d.items.length === 1 ? 'plan' : 'planes'}`, p, ic:'pin', tab:'itinerario'}); });
  });
  return ev.filter(e => e.date >= t).sort((a, b) => a.date.localeCompare(b.date));
}
function agendaList(ev, plain) {
  if (!ev.length) return `<div class="card">${empty('cal', 'Sin fechas por delante', 'Cuando agreguen fechas a un viaje, una etapa o una meta de ahorro, aparecerán aquí.')}</div>`;
  let cur = '', out = '';
  ev.forEach((e, k) => {
    const m = cap(fmtD(e.date, {month:'long', year:'numeric'}));
    if (!plain && m !== cur) { if (k) out += '</div>'; cur = m; out += `<h3 class="agenda-m">${m}</h3><div class="group">`; }
    if (plain && k === 0) out += '<div class="group">';
    const d = parse(e.date), n = diffDays(today(), e.date);
    out += `<button class="row" data-act="go" data-view="project" data-pid="${e.p.id}" ${e.tab ? `data-tab="${e.tab}"` : ''}>
      <span class="dateblk"><small>${d.toLocaleDateString('es', {weekday:'short'}).replace('.', '')}</small><b>${d.getDate()}</b></span>
      <span class="grow"><div class="t">${esc(e.title)}</div>${e.sub ? `<div class="s">${esc(e.sub)}</div>` : ''}</span>
      <span class="pill ${n <= 7 ? 'acc' : ''}">${n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : `en ${n} días`}</span></button>`;
  });
  return out + '</div>';
}
function agendaView() {
  return `<header class="lt"><span class="eyebrow">Próximamente</span><h1>Agenda</h1><p>Salidas, entregas, tareas y fechas límite de todos sus proyectos.</p></header>${agendaList(events().slice(0, 80))}`;
}

  <div class="group">${g.map(({p, i}) => `<div class="row" style="align-items:flex-start;flex-wrap:wrap">
    <span class="dot" style="--h:${p.hue};margin-top:7px"></span>
    <button class="grow" data-act="go" data-view="project" data-pid="${p.id}" data-tab="ahorro" style="border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:6px;min-width:200px"><span class="t">${esc(p.name)}</span>${bar([[i.pct]])}<span class="s"><span class="num">${money(i.saved)}</span> de ${money(i.goal)}${i.dl ? ` · hasta el ${fmtD(i.dl, {day:'numeric', month:'short', year:'numeric'})}` : ''}${i.monthly ? ` · ${money(i.monthly)} al mes` : ''}</span></button>
    <div style="display:flex;align-items:center;gap:10px">${statusPill(i)}<button class="btn sm soft" data-act="rec" data-kind="contrib" data-pid="${p.id}">${ic('plus', 'sm')}Aportar</button></div></div>`).join('')}</div>`
    : `<div class="card">${empty('coin', 'Aún no hay metas de ahorro', 'Abran un proyecto, entren a Ahorro y definan cuánto necesitan y para cuándo.')}</div>`}
  ${n.length ? `<div class="sec-h"><h2>Sin meta</h2></div><div class="group">${n.map(({p}) => `<button class="row" data-act="go" data-view="project" data-pid="${p.id}" data-tab="ahorro"><span class="dot" style="--h:${p.hue}"></span><span class="grow t">${esc(p.name)}</span><span class="pill acc">Definir meta</span></button>`).join('')}</div>` : ''}`;
}

/* ============ Ajustes ============ */
const shareLink = () => location.href.split('#')[0] + '#s=' + encodeURIComponent(Sync.url || '');
function ajustesView() {
  return `<header class="lt"><span class="eyebrow">Su espacio</span><h1>Ajustes</h1></header>
  <div class="stack" style="max-width:640px">
  <div class="card"><div class="card-h"><h3>Ustedes dos</h3></div>
    <div class="stack" style="gap:14px"><div class="field-row"><label class="small muted" for="cfg_a">Primera persona</label><input class="in" id="cfg_a" data-cfg="a" value="${esc(S.cfg.a)}" maxlength="24" autocomplete="off" style="background:var(--surface-2)"></div>
    <div class="field-row"><label class="small muted" for="cfg_b">Segunda persona</label><input class="in" id="cfg_b" data-cfg="b" value="${esc(S.cfg.b)}" maxlength="24" autocomplete="off" style="background:var(--surface-2)"></div>
    <div class="field-row"><label class="small muted" for="cfg_c">Moneda</label><select class="in" id="cfg_c" data-cfg="currency" style="background:var(--surface-2)">${CURRENCIES.map(c => `<option ${c === S.cfg.currency ? 'selected' : ''}>${c}</option>`).join('')}</select></div></div></div>
  <div class="card"><div class="card-h"><h3>Sincronización</h3><span class="pill ${S.live ? 'good' : ''}">${S.live ? 'Activa' : Sync.url ? 'Sin conexión' : 'Solo local'}</span></div>
    ${Store.db ? '<p class="muted small">Los cambios de cada uno aparecen en el dispositivo del otro. Para que la otra persona pueda editar, compartan esta página desde el menú Compartir con permiso de colaborador.</p>'
    : Sync.url ? `<p class="muted small">Cualquier cambio de uno aparece en el otro dispositivo en unos segundos. Envíen este enlace a la otra persona y ábranlo una vez en su dispositivo.</p>
      <div class="field-row" style="margin-top:12px;max-width:none"><label class="small muted" for="cfg_link">Enlace para conectar otro dispositivo</label><input class="in" id="cfg_link" readonly value="${esc(shareLink())}" style="background:var(--surface-2)"></div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px"><button class="btn" data-act="sync-copy">Copiar enlace</button><button class="btn danger" data-act="sync-off">Desconectar este dispositivo</button></div>`
    : `<p class="muted small">Ahora los datos se guardan solo en este navegador. Para verlos los dos en cualquier lugar, conecten una base de datos gratuita de Firebase (Realtime Database). Se hace una sola vez:</p>
      <ol class="small muted" style="margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px"><li>En console.firebase.google.com creen un proyecto (plan Spark, sin tarjeta).</li><li>Entren a Compilación → Realtime Database → Crear base de datos.</li><li>En la pestaña Reglas, peguen: <code style="user-select:all">{"rules":{"$id":{".read":true,".write":true}}}</code> y publiquen.</li><li>Copien la dirección que aparece arriba en Datos y péguenla aquí.</li></ol>
      <div class="field-row" style="margin-top:14px;max-width:none"><label class="small muted" for="cfg_sync">Dirección de la base de datos</label><input class="in" id="cfg_sync" placeholder="https://su-proyecto-default-rtdb.firebaseio.com" autocomplete="off" style="background:var(--surface-2)"></div>
      <div style="margin-top:12px"><button class="btn" data-act="sync-connect">Conectar</button></div>`}
    ${S.readonly ? '<p class="small" style="color:var(--bad);margin-top:8px">Este usuario solo puede ver. Necesita permiso de colaborador para guardar.</p>' : ''}</div>
  <div class="card"><div class="card-h"><h3>Datos</h3></div><div style="display:flex;flex-wrap:wrap;gap:10px">
    <button class="btn gray" data-act="export">${ic('down2')}Guardar respaldo</button>
    <button class="btn gray" data-act="load-samples">${ic('spark')}Agregar proyectos de ejemplo</button></div></div></div>`;
}

/* ============ Proyecto ============ */
function tabsFor(p) {
  const t = [['resumen', 'Resumen']];
  if (p.type === 'viaje') t.push(['itinerario', 'Itinerario']);
  if (p.type === 'remodelacion') t.push(['etapas', 'Etapas'], ['cotizaciones', 'Cotizaciones']);
  t.push(['ideas', p.type === 'viaje' ? 'Lugares' : p.type === 'remodelacion' ? 'Inspiración' : 'Ideas'], ['presupuesto', 'Presupuesto'], ['ahorro', 'Ahorro'], ['lista', p.type === 'viaje' ? 'Equipaje' : p.type === 'remodelacion' ? 'Compras' : 'Pendientes']);
  return t;
}
function projectView(p) {
  const T = TYPES[p.type], tabs = tabsFor(p);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'resumen';
  const n = p.start ? diffDays(today(), p.start) : null;
  return `<header class="phead cover" style="--h:${p.hue}"><svg class="wm" style="width:220px;height:220px;right:-24px;bottom:-34px" viewBox="0 0 24 24" aria-hidden="true">${P[T.i]}</svg>
    <div class="top"><button class="glass" data-act="go" data-view="home">${ic('chevl', 'sm')}Inicio</button><button class="glass" data-act="edit-project" data-pid="${p.id}">${ic('edit', 'sm')}Editar</button></div>
    <div class="txt"><span class="eyebrow" style="color:rgba(255,255,255,.85)">${T.l}</span><h1>${esc(p.name)}</h1>
      <div class="sub">${p.place ? `<span>${ic('pin', 'sm')}${esc(p.place)}</span>` : ''}<span>${ic('cal', 'sm')}${rangeText(p.start, p.end)}</span>${n !== null && n > 0 && p.type !== 'meta' ? `<span>${ic('clock', 'sm')}Faltan ${n} ${n === 1 ? 'día' : 'días'}</span>` : ''}</div></div></header>
    <nav class="ptabs" aria-label="Secciones">${tabs.map(([k, l]) => `<button data-act="tab" data-tab="${k}" aria-current="${S.tab === k}">${l}</button>`).join('')}</nav>
    <div id="tab">${TAB[S.tab](p)}</div>`;
}

const TAB = {};

/* ----- Resumen ----- */
TAB.resumen = p => {
  const i = saveInfo(p), b = budgetInfo(p), lst = p.list, done = lst.filter(x => x.done).length;
  const cardSave = i ? `<button class="card" data-act="tab" data-tab="ahorro" style="text-align:left;border:0;width:100%"><div class="card-h"><h3>Ahorro</h3>${statusPill(i)}</div>
      <div class="savehero">${ring(i.pct, {s:92})}<div class="txt"><div class="stat"><div class="v">${money(i.saved)}</div></div><span class="small muted">de ${money(i.goal)}${i.dl ? ` para el ${fmtD(i.dl, {day:'numeric', month:'short'})}` : ''}</span>
      ${i.status !== 'done' && i.monthly ? `<span class="small">${money(i.monthly)} al mes · ${money(i.monthly / 2)} cada uno</span>` : ''}</div></div></button>`
    : `<div class="card"><div class="card-h"><h3>Ahorro</h3></div>${empty('coin', 'Sin meta todavía', 'Definan cuánto necesitan y para cuándo.', '<button class="btn" data-act="edit-saving" data-pid="' + p.id + '">Definir meta</button>')}</div>`;
  const maxb = Math.max(b.est, b.spent + 0, 1);
  const cardBud = `<button class="card" data-act="tab" data-tab="presupuesto" style="text-align:left;border:0;width:100%"><div class="card-h"><h3>Presupuesto</h3>${b.est ? (b.spent > b.est ? '<span class="pill bad">Pasado</span>' : `<span class="pill">${money(Math.max(b.est - b.spent, 0))} disponibles</span>`) : ''}</div>
    ${b.est || b.spent ? `${bar([[b.spent / maxb, b.spent > b.est && b.est ? 'var(--bad)' : 'var(--accent)']])}<div class="stats" style="margin-top:14px"><div class="stat"><div class="l">Gastado</div><div class="v">${money(b.spent)}</div></div><div class="stat"><div class="l">Presupuesto</div><div class="v">${money(b.est)}</div></div>${b.committed ? `<div class="stat"><div class="l">Planeado</div><div class="v">${money(b.committed)}</div></div>` : ''}</div>` : '<p class="muted small">Sin gastos ni categorías todavía. Toquen para armar el presupuesto.</p>'}</button>`;
  let next = '';
  if (p.type === 'viaje') {
    const t = today(), d = p.days.find(x => x.date >= t && x.items.length) || p.days.find(x => x.items.length);
    next = `<button class="card" data-act="tab" data-tab="itinerario" style="text-align:left;border:0;width:100%"><div class="card-h"><h3>Itinerario</h3><span class="pill">${allItems(p).length} planes</span></div>
      ${d ? `<div class="s small muted" style="margin-bottom:8px">${d.date ? cap(fmtD(d.date, {weekday:'long', day:'numeric', month:'long'})) : 'Sin fecha'}</div>${d.items.slice(0, 4).map(x => `<div style="display:flex;gap:10px;padding:5px 0;font-size:15px"><span class="muted num" style="min-width:44px">${esc(x.time || '')}</span><span>${esc(x.title)}</span></div>`).join('')}` : '<p class="muted small">Todavía no hay planes. Agreguen lugares al primer día.</p>'}</button>`;
  } else if (p.type === 'remodelacion') {
    const c = k => p.tasks.filter(x => x.status === k).length, tot = p.tasks.length;
    next = `<button class="card" data-act="tab" data-tab="etapas" style="text-align:left;border:0;width:100%"><div class="card-h"><h3>Etapas</h3><span class="pill">${tot} tareas</span></div>
      ${tot ? `${bar([[c('listo') / tot, 'var(--good)'], [c('encurso') / tot, 'var(--accent)']])}<div class="stats" style="margin-top:14px"><div class="stat"><div class="l">Pendientes</div><div class="v">${c('pendiente')}</div></div><div class="stat"><div class="l">En curso</div><div class="v">${c('encurso')}</div></div><div class="stat"><div class="l">Listas</div><div class="v">${c('listo')}</div></div></div>` : '<p class="muted small">Dividan la obra en tareas para seguir el avance.</p>'}</button>`;
  }
  const cardList = `<button class="card" data-act="tab" data-tab="lista" style="text-align:left;border:0;width:100%"><div class="card-h"><h3>${p.type === 'viaje' ? 'Equipaje' : p.type === 'remodelacion' ? 'Compras' : 'Pendientes'}</h3><span class="pill">${done}/${lst.length}</span></div>${lst.length ? bar([[done / lst.length, 'var(--good)']]) + `<p class="small muted" style="margin-top:10px">${lst.length - done ? `Faltan ${lst.length - done} por marcar.` : 'Todo listo.'}</p>` : '<p class="muted small">La lista está vacía.</p>'}</button>`;
  return `<div class="grid two">${cardSave}${cardBud}${next}${cardList}</div>${p.notes ? `<div class="card" style="margin-top:16px"><div class="card-h"><h3>Notas</h3></div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.notes)}</p></div>` : ''}`;
};

/* ----- Itinerario ----- */
function dayLabel(p, d, idx) {
  return `Día ${idx + 1}${d.date ? ' · ' + cap(fmtD(d.date, {weekday:'long', day:'numeric', month:'long'})) : ''}`;
}
TAB.itinerario = p => {
  if (!p.days.length) return `<div class="card">${empty('cal', 'Armen el itinerario día por día', p.start && p.end ? 'Guardaremos un día por cada fecha del viaje.' : 'Agreguen fechas al viaje para crear los días, o agreguen un día ahora.', `<button class="btn" data-act="add-day" data-pid="${p.id}">${ic('plus')}Agregar día</button>`)}</div>`;
  const jump = p.days.map((d, k) => `<button data-act="jump" data-id="${d.id}"><span>${d.date ? fmtD(d.date, {weekday:'short'}).replace('.', '') : 'Día'}</span><b>${d.date ? parse(d.date).getDate() : k + 1}</b></button>`).join('');
  return `<div class="dayjump" aria-label="Ir a un día">${jump}</div>
  <div class="stack" style="gap:26px">${p.days.map((d, k) => {
    const cost = sum(d.items, 'cost');
    return `<section class="day" id="day-${d.id}"><div class="day-h"><div><h3>${dayLabel(p, d, k)}</h3><div class="s">${d.items.length} ${d.items.length === 1 ? 'plan' : 'planes'}${cost ? ` · ${money(cost)}` : ''}</div></div>
      <div style="display:flex;gap:8px"><button class="ibtn" data-act="edit-day" data-pid="${p.id}" data-day="${d.id}" aria-label="Editar día">${ic('edit', 'sm')}</button><button class="btn sm soft" data-act="add-item" data-pid="${p.id}" data-day="${d.id}">${ic('plus', 'sm')}Agregar plan</button></div></div>
      ${d.items.length ? `<ol class="stops group">${d.items.map((x, n) => {
        const C = CATS[x.cat] || CATS.otro;
        return `<li class="stop ${x.done ? 'done' : ''}" style="--c:${C.c}"><button class="n" data-act="toggle-item" data-pid="${p.id}" data-day="${d.id}" data-id="${x.id}" aria-label="${x.done ? 'Marcar como pendiente' : 'Marcar como hecho'}: ${esc(x.title)}">${x.done ? ic('check', 'sm') : n + 1}</button>
          <div><div class="t">${esc(x.title)}</div><div class="m">${x.time ? `<span class="num">${esc(x.time)}</span>` : ''}<span>${esc(C.l)}</span>${x.cost ? `<span class="num">${money(x.cost)}</span>` : ''}${x.place ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.place)}" target="_blank" rel="noopener">${ic('pin', 'sm')}${esc(x.place)}</a>` : ''}${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${ic('link', 'sm')}Enlace</a>` : ''}</div>${x.note ? `<div class="note">${esc(x.note)}</div>` : ''}</div>
          <div class="acts"><button class="ibtn xs" data-act="edit-item" data-pid="${p.id}" data-day="${d.id}" data-id="${x.id}" aria-label="Editar">${ic('edit', 'sm')}</button><div class="r"><button class="ibtn xs" data-act="move-item" data-dir="-1" data-pid="${p.id}" data-day="${d.id}" data-id="${x.id}" aria-label="Subir" ${n === 0 ? 'disabled style="opacity:.35"' : ''}>${ic('up', 'sm')}</button><button class="ibtn xs" data-act="move-item" data-dir="1" data-pid="${p.id}" data-day="${d.id}" data-id="${x.id}" aria-label="Bajar" ${n === d.items.length - 1 ? 'disabled style="opacity:.35"' : ''}>${ic('down', 'sm')}</button></div></div></li>`;
      }).join('')}</ol>` : `<div class="group"><div class="empty" style="padding:24px">${'<p>Sin planes para este día.</p>'}</div></div>`}</section>`;
  }).join('')}</div>
  <div style="margin-top:20px"><button class="btn gray" data-act="add-day" data-pid="${p.id}">${ic('plus')}Agregar otro día</button></div>`;
};

/* ----- Ideas / Lugares ----- */
TAB.ideas = p => {
  const trip = p.type === 'viaje', rem = p.type === 'remodelacion';
  const list = [...p.ideas].sort((x, y) => ((y.votes?.a && y.votes?.b) - (x.votes?.a && x.votes?.b)) || ((y.votes?.a + y.votes?.b) - (x.votes?.a + x.votes?.b)));
  const add = `<button class="btn sm" data-act="rec" data-kind="idea" data-pid="${p.id}">${ic('plus', 'sm')}${trip ? 'Nuevo lugar' : 'Nueva idea'}</button>`;
  if (!list.length) return `<div class="card">${empty('bulb', trip ? 'Guarden los lugares que quieren visitar' : rem ? 'Reúnan la inspiración' : 'Anoten sus ideas', 'Cada uno vota con un corazón. Lo que les gusta a los dos sube primero.', add)}</div>`;
  return `<div class="sec-h" style="margin-top:0"><p class="muted small" style="max-width:52ch">Voten con el corazón. Lo que gusta a los dos aparece primero.</p>${add}</div>
  <div class="grid">${list.map(x => {
    const both = x.votes?.a && x.votes?.b, C = trip ? (CATS[x.cat] || CATS.otro) : null;
    return `<article class="card idea"><div class="tags">${both ? '<span class="pill good">Les gusta a los dos</span>' : ''}${C ? `<span class="pill" style="color:${C.c}">${esc(C.l)}</span>` : x.cat ? `<span class="pill">${esc(x.cat)}</span>` : ''}${x.cost ? `<span class="pill num">${money(x.cost)}</span>` : ''}${x.planned ? `<span class="pill acc">${trip ? 'En el itinerario' : 'En etapas'}</span>` : ''}</div>
      <h3>${esc(x.title)}</h3>${x.note ? `<p class="muted small" style="overflow-wrap:anywhere">${esc(x.note)}</p>` : ''}${x.link ? `<a class="small" style="color:var(--accent);display:inline-flex;gap:4px;align-items:center" href="${esc(x.link)}" target="_blank" rel="noopener">${ic('link', 'sm')}Ver enlace</a>` : ''}
      <div class="foot"><div class="votes">${['a', 'b'].map(w => `<button class="vote" style="--vc:var(--p${w})" data-act="vote" data-pid="${p.id}" data-id="${x.id}" data-w="${w}" aria-pressed="${!!x.votes?.[w]}" aria-label="Voto de ${esc(nm(w))}">${ic('heart', 'sm')}${esc(nm(w))}</button>`).join('')}</div>
      <div style="display:flex;gap:6px">${(trip || rem) && !x.planned ? `<button class="btn sm soft" data-act="idea-plan" data-pid="${p.id}" data-id="${x.id}">${trip ? 'Al itinerario' : 'A etapas'}</button>` : ''}<button class="ibtn" data-act="rec" data-kind="idea" data-pid="${p.id}" data-id="${x.id}" aria-label="Editar">${ic('edit', 'sm')}</button></div></div></article>`;
  }).join('')}</div>`;
};

/* ----- Etapas ----- */
TAB.etapas = p => {
  const add = `<button class="btn sm" data-act="rec" data-kind="task" data-pid="${p.id}">${ic('plus', 'sm')}Nueva tarea</button>`;
  if (!p.tasks.length) return `<div class="card">${empty('layers', 'Dividan la obra en tareas', 'Asignen cada tarea a un área, una fecha y una persona. Muévanlas de Pendiente a Listo.', add)}</div>`;
  const keys = ['pendiente', 'encurso', 'listo'];
  return `<div class="sec-h" style="margin-top:0"><p class="muted small">Costo de las tareas: <b class="num" style="color:var(--text)">${money(sum(p.tasks, 'cost'))}</b></p>${add}</div>
  <div class="kan">${keys.map((k, ki) => {
    const items = p.tasks.filter(x => x.status === k);
    return `<section class="col"><div class="col-h"><span>${STATUS[k]}</span><span>${items.length}</span></div>
      ${items.map(x => `<article class="task"><div class="t ${k === 'listo' ? 'done-txt' : ''}">${esc(x.title)}</div>
        <div class="tags">${x.area ? `<span class="pill acc">${esc(x.area)}</span>` : ''}${x.due ? `<span class="pill ${x.due < today() && k !== 'listo' ? 'bad' : ''}">${ic('cal', 'sm')}${fmtD(x.due, {day:'numeric', month:'short'})}</span>` : ''}${x.cost ? `<span class="pill num">${money(x.cost)}</span>` : ''}</div>
        <div class="foot">${x.by === 'ab' ? whoBoth() : who(x.by === 'b' ? 'b' : 'a')}<div style="display:flex;gap:6px">
          ${ki > 0 ? `<button class="ibtn xs" data-act="task-status" data-pid="${p.id}" data-id="${x.id}" data-to="${keys[ki - 1]}" aria-label="Mover a ${STATUS[keys[ki - 1]]}">${ic('chevl', 'sm')}</button>` : ''}
          <button class="ibtn xs" data-act="rec" data-kind="task" data-pid="${p.id}" data-id="${x.id}" aria-label="Editar">${ic('edit', 'sm')}</button>
          ${ki < 2 ? `<button class="ibtn xs on" data-act="task-status" data-pid="${p.id}" data-id="${x.id}" data-to="${keys[ki + 1]}" aria-label="Mover a ${STATUS[keys[ki + 1]]}">${ic('chevr', 'sm')}</button>` : ''}</div></div></article>`).join('') || '<div class="task muted small" style="box-shadow:none;background:var(--fill)">Nada aquí.</div>'}</section>`;
  }).join('')}</div>`;
};

/* ----- Cotizaciones ----- */
TAB.cotizaciones = p => {
  const add = `<button class="btn sm" data-act="rec" data-kind="quote" data-pid="${p.id}">${ic('plus', 'sm')}Nueva cotización</button>`;
  if (!p.quotes.length) return `<div class="card">${empty('receipt', 'Comparen cotizaciones', 'Registren lo que les cotiza cada proveedor por el mismo trabajo. Verán cuál es la más baja y elegirán una.', add)}</div>`;
  const groups = [...new Set(p.quotes.map(q => q.item))];
  const chosen = sum(p.quotes.filter(q => q.status === 'elegida'), 'amount');
  return `<div class="sec-h" style="margin-top:0"><p class="muted small">Elegidas: <b class="num" style="color:var(--text)">${money(chosen)}</b></p>${add}</div>
  <div class="stack">${groups.map(g => {
    const qs = p.quotes.filter(q => q.item === g), min = Math.min(...qs.filter(q => q.amount && q.status !== 'descartada').map(q => q.amount));
    return `<section class="group"><div class="q-h"><h3>${esc(g)}</h3><span class="small muted">${qs.length} ${qs.length === 1 ? 'opción' : 'opciones'}</span></div>
      ${qs.map(q => `<div class="row" style="flex-wrap:wrap;${q.status === 'descartada' ? 'opacity:.55' : ''}"><div class="grow" style="min-width:180px"><div class="t">${esc(q.vendor)}</div><div class="s">${esc(q.note || '')}</div></div>

/* ----- Ahorro ----- */
function chart(p, i) {
  const W = Math.max(280, Math.min(880, (S.cw || 340) - 40)), H = 250, L = 48, R = 14, T = 14, B = 30;
  const t = today(), s = p.savings;
  const x0 = parse(i.start).getTime();
  const endIso = i.dl && i.dl > t ? i.dl : (i.dl ? t : addDays(t, 30));
  const x1 = Math.max(parse(endIso).getTime(), x0 + 864e5);
  const X = ms => L + (Math.min(Math.max(ms, x0), x1) - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (1 - Math.min(Math.max(v / i.goal, 0), 1)) * (H - T - B);
  const cs = [...s.contribs].sort((a, b) => a.date.localeCompare(b.date));
  let acc = i.init; const pts = [[X(x0), Y(acc)]];
  cs.forEach(c => { acc += c.amount; pts.push([X(parse(c.date).getTime()), Y(acc)]); });
  const nowX = X(parse(t).getTime()); pts.push([nowX, Y(acc)]);
  const path = pts.map((q, k) => `${k ? 'L' : 'M'}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(' ');
  const area = `${path} L${nowX.toFixed(1)} ${(H - B)} L${pts[0][0].toFixed(1)} ${(H - B)}Z`;
  const span = (x1 - x0) / 864e5, ticks = 4;
  const xt = Array.from({length:ticks}, (_, k) => new Date(x0 + (x1 - x0) * k / (ticks - 1)));
  const lbl = d => span > 150 ? d.toLocaleDateString('es', {month:'short', year:'2-digit'}) : d.toLocaleDateString('es', {day:'numeric', month:'short'});
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Ahorro acumulado frente al ritmo necesario">
    ${[0, .25, .5, .75, 1].map(f => `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(i.goal * f)}" y2="${Y(i.goal * f)}"/><text class="ct" x="${L - 8}" y="${Y(i.goal * f) + 4}" text-anchor="end">${compact(i.goal * f)}</text>`).join('')}
    ${xt.map((d, k) => `<text class="ct" x="${X(d.getTime())}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === ticks - 1 ? 'end' : 'middle'}">${lbl(d)}</text>`).join('')}
    ${i.dl ? `<line class="ideal" x1="${X(x0)}" y1="${Y(i.init)}" x2="${X(parse(i.dl).getTime())}" y2="${Y(i.goal)}"/>` : ''}
    ${t >= i.start && t <= endIso ? `<line class="today" x1="${nowX}" x2="${nowX}" y1="${T}" y2="${H - B}"/>` : ''}
    <path class="area" d="${area}"/><path class="actual" d="${path}"/>
    <circle class="pt" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="6"/></svg>
    <div class="legend"><span><i></i>Lo ahorrado</span>${i.dl ? '<span><i class="d"></i>Ritmo para llegar a tiempo</span>' : ''}</div>`;
}

let lastKey = '';
function render(fromSync) {
  if (fromSync) { const a = document.activeElement; if (a && a.closest && a.closest('#main') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return; }
  const root = $('#app'), m = $('#main');
  if (m) { const cs = getComputedStyle(m); S.cw = m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); }
  else S.cw = Math.min(window.innerWidth - (window.innerWidth >= 900 ? 272 : 0), 1160) - 32;
  if (S.view === 'project' && !proj(S.pid)) S.view = 'home';
  const y = window.scrollY, key = S.view + S.pid + (S.view === 'project' ? S.tab : '');
  const inner = !S.loaded ? skeleton() : ({project:() => projectView(proj(S.pid)), ahorros:ahorrosView, agenda:agendaView, ajustes:ajustesView}[S.view] || homeView)();
  root.innerHTML = `<div class="app">${sidebar()}<main class="main" id="main">${inner}</main>${tabbar()}</div>`;
  window.scrollTo(0, key === lastKey ? y : 0);
  lastKey = key;
}

function field(f) {

function closeSheet() { layer().innerHTML = ''; }
function openSheet({title, fields, submit = 'Guardar', onSubmit, onDelete, delLabel = 'Eliminar'}) {
  closeSheet();
  const el = document.createElement('div'); el.className = 'sheet-wrap';
  el.innerHTML = `<div class="scrim" data-close="1"></div><form class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
    <header><button type="button" class="btn plain" data-close="1">Cancelar</button><h2 id="sheet-title">${esc(title)}</h2><button type="submit" class="btn sm">${esc(submit)}</button></header>
    <div class="sheet-body"><div class="formgrid">${fields.map(field).join('')}</div>${onDelete ? `<button type="button" class="btn danger wide" data-del="1">${esc(delLabel)}</button>` : ''}</div></form>`;
  layer().appendChild(el);
  const form = $('form', el);
  el.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { closeSheet(); return; }
    const b = e.target.closest('[data-seg] button'); if (b) { const box = b.parentElement; box.dataset.val = b.dataset.v; box.querySelectorAll('button').forEach(x => { x.setAttribute('aria-pressed', x === b); x.setAttribute('aria-checked', x === b); }); return; }
    const d = e.target.closest('[data-del]');
    if (d) { if (d.dataset.armed) { closeSheet(); onDelete(); } else { d.dataset.armed = '1'; d.textContent = 'Toca otra vez para confirmar'; } }
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const vals = {}; let bad = null;
    fields.forEach(f => {
      if (f.type === 'note') return;
      const box = form.querySelector(`[data-seg="${f.k}"]`);
      let v = box ? box.dataset.val : $('#f_' + f.k, form).value.trim();
      if (f.type === 'number') v = num(v);

      const wrap = $('#f_' + f.k, form)?.closest('.fld');
      if (wrap) { wrap.classList.remove('err'); wrap.querySelector('.hint')?.remove(); }
      if (f.req && !bad && (v === '' || v === 0)) {
        bad = f; if (wrap) { wrap.classList.add('err'); wrap.insertAdjacentHTML('beforeend', `<span class="hint">${f.type === 'number' ? 'Escribe un monto mayor que cero.' : 'Este campo es obligatorio.'}</span>`); }
      }
    });
    if (bad) { $('#f_' + bad.k, form)?.focus(); return; }
    closeSheet(); onSubmit(vals);
  });
  const first = form.querySelector('input:not([type=date]):not([type=time]),textarea'); if (first) setTimeout(() => first.focus({preventScroll:true}), 60);
}
