<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Run Check</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main id="wrapper">
      <h1>Run Check</h1>
      <p class="lead">Which days this week are good for a run outside?</p>

      <form id="run-form">
        <label>
          City
          <select id="city">
            <option value="seoul">Seoul</option>
            <option value="daejeon">Daejeon</option>
            <option value="gangneung">Gangneung</option>
          </select>
        </label>
        <label>
          Rain chance &le;
          <input id="rain-limit" type="number" value="30"
            min="0" max="100" required /> %
        </label>
        <label>
          Wind &le;
          <input id="wind-limit" type="number" value="10"
            min="0" max="100" required /> km/h
        </label>
        <button type="submit">Check</button>
      </form>

      <p id="status"></p>
      <p id="summary"></p>

      <table>
        <thead>
          <tr><th>Date</th><th>Max</th><th>Wind</th><th>Rain</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <footer>Weather data by Open-Meteo.com</footer>
    </main>
  </body>
</html>
