<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>给宝宝的道歉专用页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <h1 class="title">给 <span class="name">舟舟宝宝</span> 的道歉专用页</h1>

    <div class="scene">
      <div class="bubble" id="bubble" hidden>
        <span id="bubbleText"></span>
      </div>

      <img class="apology-img" id="apologyImg" src="Cartoon/apologize1.png"
           alt="正在道歉的小人" width="415" height="800">

      <button class="apologize-btn" id="apologizeBtn">点我道歉 🙇</button>
    </div>

    <button class="mute-btn" id="muteBtn" aria-label="静音开关" aria-pressed="false">🔊</button>
  </main>

  <script src="main.js"></script>
</body>
</html>
