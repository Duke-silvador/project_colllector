<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>物理演示 · 单元测试</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#000; --muted:#666; --line:rgba(0,0,0,0.12); --bg:#f2f2f2; --panel:#fff; }
    html.hc { --ink:#fff; --muted:#aaa; --line:rgba(255,255,255,0.2); --bg:#000; --panel:#111; }
    body {
      margin: 0;
      font-family: "Sora", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 1.25rem;
      line-height: 1.5;
      font-feature-settings: "tnum" 1;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.03em; }
    .sub { color: var(--muted); margin-bottom: 1rem; font-size: 0.85rem; font-family: "IBM Plex Mono", monospace; }
    .sub a { color: inherit; }
    #summary {
      display: inline-block;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      background: var(--panel);
      margin-bottom: 1rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
    }
    #results { list-style: none; padding: 0; margin: 0; max-width: 820px; }
    #results li {
      background: var(--panel);
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      margin-bottom: 0.45rem;
      font-size: 0.88rem;
    }
    #results li.pass { box-shadow: inset 4px 0 0 #000; }
    #results li.fail { box-shadow: inset 4px 0 0 #000; outline: 1px dashed #000; }
    html.hc #results li.pass,
    html.hc #results li.fail { box-shadow: inset 4px 0 0 #fff; }
    html.hc #results li.fail { outline-color: #fff; }
    .badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 0.45rem;
      letter-spacing: 0.06em;
    }
    .detail { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <h1>简易单元测试</h1>
  <p class="sub"><a href="./index.html">← lab</a> · energy / collision / heat / wave</p>
  <div id="summary">运行中…</div>
  <ul id="results"></ul>
  <script>
    if (localStorage.getItem('physics-lab-hc') === '1') document.documentElement.classList.add('hc');
  </script>
  <script type="module" src="./js/tests/run.js"></script>
</body>
</html>
