<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBridge - Offline-First AI Study Assistant</title>
    <meta name="description" content="An offline-first AI study assistant that uses Firebase AI Logic hybrid inference and shows exactly where and why each answer was produced." />
    <meta property="og:title" content="StudyBridge - Offline-First AI Study Assistant" />
    <meta property="og:description" content="An offline-first AI study assistant that uses Firebase AI Logic hybrid inference." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('studybridge_theme') || 'light';
          var fontSize = localStorage.getItem('studybridge_fontsize') || 'md';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
          var rootSize = fontSize === 'sm' ? '14px' : fontSize === 'lg' ? '18px' : '16px';
          document.documentElement.style.fontSize = rootSize;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
