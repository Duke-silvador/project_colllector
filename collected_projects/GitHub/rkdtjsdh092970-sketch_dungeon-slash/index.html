/* ---- v3:
.mpbar{height:13px;margin-top:3px;background:#000;border:2px solid #5a7aa8;border-radius:4px;position:relative;overflow:hidden}#mp-fill{height:100%;background:linear-gradient(#6ad0ff,#2a6ac0);transition:width .1s}#mp-txt{position:absolute;inset:0;text-align:center;font-size:10px;font-weight:bold;line-height:10px;text-shadow:0 1px 0 #000}.bslot.nomp{filter:grayscale(.7);border-color:#4a5a78}
 현대적 UI / 고유 등급 효과 ---- */
:root{--ut1:#8ec5ff;--ut2:#c58bff;--ut3:#ffcc4a;--ut4:#fff}
#mbox{background:linear-gradient(160deg,#1c1733,#120e22);border:1px solid #6a5aa0;border-radius:14px;box-shadow:0 0 0 1px #0a0814,0 18px 60px #000c}
#mbox h2{letter-spacing:.5px}.btn{border-radius:8px}.col{border-radius:10px;border:1px solid #382f60;background:#0e0a1b}
.tile,.eqs{border-radius:8px;border:2px solid #4a4270;background:#191330;overflow:hidden;isolation:isolate}
.tile>*,.eqs>*{position:relative;z-index:2}
.tile .mk,.eqs .mk{position:absolute;z-index:3;font-size:10px;font-weight:900;line-height:1;text-shadow:0 1px 0 #000}
.mk.lk{left:2px;bottom:1px;color:#ffd24a}.mk.pr{left:2px;top:1px;color:#6ad0ff;background:#0b2a40;border-radius:3px;padding:1px 3px}.mk.up{right:2px;top:0;color:#5dff7a}
.tile.sel,.eqs.sel{outline:2px solid #fff;outline-offset:1px}
.tile.dim2{opacity:.35}
/* 고유 등급: 테두리 + 배경 연출 */
.tile[class*=" ut"]::before,.eqs[class*=" ut"]::before,.tile[class^="ut"]::before{content:"";position:absolute;left:-60%;top:-60%;width:220%;height:220%;z-index:0}
.tile[class*=" ut"]::after,.eqs[class*=" ut"]::after{content:"";position:absolute;inset:2px;border-radius:6px;z-index:1}
.ut1{border-color:transparent!important}.ut1::before{background:conic-gradient(#8ec5ff,#3a6ab8,#cfe8ff,#3a6ab8,#8ec5ff);animation:spin 5s linear infinite}.ut1::after{background:radial-gradient(circle at 50% 30%,#223a60,#101a30)}
.ut2{border-color:transparent!important}.ut2::before{background:conic-gradient(#c58bff,#4a1a90,#ff8aff,#4a1a90,#c58bff);animation:spin 3.2s linear infinite}.ut2::after{background:radial-gradient(circle at 50% 30%,#40206a,#170a2a)}
.ut3{border-color:transparent!important;box-shadow:0 0 10px #ffcc4a88}.ut3::before{background:conic-gradient(#fff3b0,#ffb020,#a86a00,#ffe27a,#ffb020,#fff3b0);animation:spin 2.4s linear infinite}.ut3::after{background:radial-gradient(circle at 50% 25%,#5a4010,#241606)}
.ut4{border-color:transparent!important;box-shadow:0 0 14px #fff9,0 0 26px #ffe27a77;animation:halo 1.8s ease-in-out infinite}.ut4::before{background:conic-gradient(#ff8a8a,#ffe27a,#8aff9a,#8ad8ff,#c58bff,#ff8a8a);animation:spin 1.6s linear infinite}.ut4::after{background:radial-gradient(circle at 50% 25%,#6a5a4a,#2a2230)}
.tile.ut4 .sp1,.eqs.ut4 .sp1{position:absolute;z-index:4;color:#fff;font-size:9px;text-shadow:0 0 4px #fff;animation:twinkle 1.3s infinite}

// ---- 3x5 도트 숫자 폰트 (피해 숫자용) ----
const GLYPHS = {
  "0": "111101101101111", "1": "010110010010111", "2": "111001111100111", "3": "111001111001111", "4": "101101111001001",
  "5": "111100111001111", "6": "111100111101111", "7": "111001001001001", "8": "111101111101111", "9": "111101111001111",
  "K": "101110100110101", "M": "101111111101101", "B": "110101110101110", "-": "000000111000000", "!": "010010010000010", "+": "000010111010000",
  "M2": "", ".": "000000000000010",
};
function drawPx(ctx, str, x, y, color, sc, outline) {
  sc = sc || 2; str = String(str);
  let cx = x;
  const draw = (col, ox, oy) => {
    ctx.fillStyle = col; let px = cx;
    for (const ch of str) {
      const g = GLYPHS[ch]; if (!g) { px += 4 * sc; continue; }
      for (let i = 0; i < 15; i++) if (g[i] === "1") ctx.fillRect(px + (i % 3) * sc + ox, y + Math.floor(i / 3) * sc + oy, sc, sc);
      px += 4 * sc;
    }
  };
  if (outline !== false) { for (const [ox, oy] of [[-sc, 0], [sc, 0], [0, -sc], [0, sc]]) draw("#120c1a", ox, oy); }
  draw(color, 0, 0);
}
function pxWidth(str, sc) { return String(str).length * 4 * (sc || 2) - (sc || 2); }

// ---- 도트 선 그리기 (번개/빔용) ----
function pxLine(ctx, x0, y0, x1, y1, sz) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx - dy;
  for (let n = 0; n < 2000; n++) {
    ctx.fillRect(x0 - (sz >> 1), y0 - (sz >> 1), sz, sz);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err; if (e2 > -dy) { err -= dy; x0 += sx; } if (e2 < dx) { err += dx; y0 += sy; }
  }
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// 지역(액트) 중심 좌표 (월드 1800x1100)
const MAP_W = 1800, MAP_H = 1100;
const REGION = [[210, 960], [470, 990], [740, 930], [690, 720], [440, 690], [250, 520], [420, 360], [700, 330], [980, 240], [1280, 190]];
const RIFT_POS = [1560, 330];
function buildMap() {
  const nodes = [], edges = [];
  const add = (n) => { nodes.push(n); return n; };
  for (let a = 1; a <= 10; a++) {
    const [cx, cy] = REGION[a - 1];
    const rot = (a * 0.9) % 6.28;
    const town = add({ id: `T${a}`, kind: "town", act: a, x: cx, y: cy, name: `${ACTS[a - 1].name} 마을`, level: (a - 1) * 10 + 1 });
    const ring = [];
    for (let s = 1; s <= 10; s++) {
      const ang = rot + 0.55 + (s - 1) * 0.55, r = 74 + ((s % 2) ? 8 : -6) + (s > 5 ? 12 : 0);
      const n = add({ id: `S${a}-${s}`, kind: s === 10 ? "boss" : "stage", act: a, stage: s, x: Math.round(cx + Math.cos(ang) * r * 1.35), y: Math.round(cy + Math.sin(ang) * r), name: s === 10 ? BOSSES[ACTS[a - 1].boss].name : `${ACTS[a - 1].name} ${s}`, level: (a - 1) * 10 + s });
      ring.push(n);
    }
    edges.push([town.id, ring[0].id]);
    for (let i = 0; i < 9; i++) edges.push([ring[i].id, ring[i + 1].id]);
    // 추가 노드: 엘리트 사냥터(스테이지 5 이후), 보물 던전(스테이지 8 이후)
    const e5 = ring[4], v8 = ring[7];
    const out = (n, k) => { const dx = n.x - cx, dy = n.y - cy, L = Math.hypot(dx, dy) || 1; return [Math.round(n.x + (dx / L) * k), Math.round(n.y + (dy / L) * k)]; }; const eo = out(e5, 52), vo = out(v8, 52);
    const el = add({ id: `E${a}`, kind: "elite", act: a, x: eo[0], y: eo[1], name: `${ACTS[a - 1].name} 정예 사냥터`, level: (a - 1) * 10 + 6, need: 5 });
    const tr = add({ id: `V${a}`, kind: "treasure", act: a, x: vo[0], y: vo[1], name: `${ACTS[a - 1].name} 보물 지하실`, level: (a - 1) * 10 + 8, need: 8 });
    edges.push([e5.id, el.id]); edges.push([v8.id, tr.id]);
    if (a > 1) edges.push([`S${a - 1}-10`, town.id]);
  }
  const rift = add({ id: "R", kind: "rift", act: 11, x: RIFT_POS[0], y: RIFT_POS[1], name: "심연의 균열", level: 100 });
  edges.push(["S10-10", rift.id]);
  const endless = add({ id: "RE", kind: "endless", act: 11, x: RIFT_POS[0] - 20, y: RIFT_POS[1] + 120, name: "무한 균열", level: 100 });
  const voidn = add({ id: "RV", kind: "void", act: 11, x: RIFT_POS[0] + 130, y: RIFT_POS[1] + 40, name: "공허의 군주", level: 100 });
  const flame = add({ id: "RH", kind: "hive", act: 11, x: RIFT_POS[0] + 120, y: RIFT_POS[1] - 110, name: "화염 정령왕", level: 100 });
  const vault = add({ id: "RG", kind: "vault", act: 11, x: RIFT_POS[0] - 160, y: RIFT_POS[1] + 50, name: "황금 보물고", level: 100 });
  const trial = add({ id: "TR", kind: "trial", act: 11, x: RIFT_POS[0] - 140, y: RIFT_POS[1] - 100, name: "스킬 시련", level: 100 });
  edges.push([rift.id, endless.id]); edges.push([rift.id, voidn.id]); edges.push([rift.id, trial.id]); edges.push([rift.id, flame.id]); edges.push([rift.id, vault.id]);
  // 겹치는 노드를 서로 밀어낸다 (마을/균열 입구는 고정)
  const fixed = (n) => n.kind === "town" || n.kind === "rift";
  for (let it = 0; it < 80; it++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const A = nodes[i], B = nodes[j], dx = B.x - A.x, dy = B.y - A.y, dd = Math.hypot(dx, dy), MIN = 60;
      if (dd >= MIN) continue; moved = true; const L = dd || 1, push = (MIN - dd) / 2 + 0.5, ux = dx / L || 1, uy = dy / L;
      if (!fixed(A)) { A.x -= ux * push * (fixed(B) ? 2 : 1); A.y -= uy * push * (fixed(B) ? 2 : 1); } if (!fixed(B)) { B.x += ux * push * (fixed(A) ? 2 : 1); B.y += uy * push * (fixed(A) ? 2 : 1); }
    }
    if (!moved) break;
  }
  nodes.forEach((n) => { n.x = Math.round(n.x); n.y = Math.round(n.y); });
  return { nodes, edges, byId: Object.fromEntries(nodes.map((n) => [n.id, n])) };
}

const U_FIXED = new Set(["revive", "lanes", "noDodge", "magCrit", "cdrCap", "dodgeCap", "defMore", "density", "chainJumps"]);
const uRoll = (k, v) => {
  if (Array.isArray(v) || U_FIXED.has(k) || typeof v !== "number" || v === 0) return v;
  if (k.endsWith("More")) return v > 1 ? [1 + (v - 1) * 0.88, 1 + (v - 1) * 1.12] : v;   // "~%가 된다" 같은 패널티성(1 미만)은 고정
  return v > 0 ? [v * 0.88, v * 1.12] : [v * 1.12, v * 0.88];
};
const U = (id, name, slot, tier, pool, act, mods, flavor, text) => ({ id, name, slot, tier, pool, act, mods: mods.map(([k, v]) => [k, uRoll(k, v)]), flavor, text: text || null, w: 1 });

const Modal = {

// ---------- 스킬 범위 표시 (6칸 x 3레인 미니 도식) ----------
function skillCells(sk) {
  const S = new Set(), add = (l, c) => { if (l >= 0 && l < 3 && c >= 1 && c <= 6) S.add(l + "," + c); }, R = sk.range || 3, K = sk.kind;
  const box = (l, c) => { for (let a = -1; a <= 1; a++) for (let d = -1; d <= 1; d++) add(l + a, c + d); };
  if (K === "single") add(1, Math.min(R, 2)); else if (K === "multi") box(1, Math.min(R, 3));
  else if (K === "pierce" || K === "boomer") for (let c = 1; c <= R; c++) add(1, c);
  else if (K === "chain") { const j = [[1, 2], [0, 3], [1, 3], [2, 4], [1, 4], [0, 5], [1, 5]]; j.slice(0, Math.min(7, 2 + (sk.jumps || 2))).forEach(([l, c]) => add(l, c)); }
  else if (K === "nova") for (let l = 0; l < 3; l++) for (let c = 1; c <= R; c++) add(l, c);
  else if (K === "zone") for (let c = 2; c <= 4; c++) add(1, c);
  else if (K === "meteor") { box(0, 3); box(2, 5); add(1, 4); add(1, 2); }
  else if (K === "cone") { add(1, 2); add(1, 3); add(0, 3); add(2, 3); add(0, 2); add(2, 2); }
  else if (K === "spray") { for (const [l, c] of [[0, 2], [1, 2], [2, 3], [0, 4], [1, 4], [2, 5], [0, 5], [1, 6], [2, 4], [0, 3]]) if (c <= R) add(l, c); }
  else if (K === "orbit") { for (let l = 0; l < 3; l++) for (let c = 1; c <= 3; c++) add(l, c); }
  else if (K === "aura") { for (let l = 0; l < 3; l++) for (let c = 1; c <= 2; c++) add(l, c); }
  else if (K === "trap") box(1, 3);
  else if (K === "zone2") { if (sk.shape === "wide") for (let l = 0; l < 3; l++) for (let c = 3; c <= 6; c++) add(l, c); else box(1, 4); }
  else if (K === "rain") { for (const [l, c] of [[0, 3], [1, 5], [2, 2], [1, 3], [0, 6], [2, 5], [0, 4], [2, 4]]) add(l, c); }
  else if (K === "summon") { for (let l = 0; l < 3; l++) add(l, 1); add(1, 2); }
  else if (K === "hole") box(1, 3);
  return S;
}
function skillAreaHtml(sk, w) {
  const S = skillCells(sk), self = sk.kind === "buff" || sk.kind === "heal", R = sk.range || 3, col = ELEM_COLOR[sk.elem] || (sk.dtype === "mag" ? "#c58bff" : sk.dtype === "phys" ? "#ff9a7a" : "#8aff9a"), cs = w || 12;
  let h = `<div class="skarea" title="사거리 ${R}칸" style="display:inline-block;padding:3px;background:#0b0816;border:1px solid #382f60;border-radius:6px"><div style="display:grid;grid-template-columns:${cs}px repeat(6,${cs}px);gap:2px">`;
  for (let l = 0; l < 3; l++) { h += `<div style="width:${cs}px;height:${cs}px;background:${l === 1 ? "#3a8aff" : "transparent"};border-radius:3px;${self && l === 1 ? "box-shadow:0 0 6px #8aff9a" : ""}"></div>`; for (let c = 1; c <= 6; c++) { const on = S.has(l + "," + c); h += `<div style="width:${cs}px;height:${cs}px;border-radius:3px;background:${on ? col : "#1c1632"};opacity:${c > R && !on ? 0.35 : 1};${c === R ? "border-right:2px dashed #ffd24a" : ""}"></div>`; } }
  return h + `</div></div>`;
}
function skillDescFull(sk, st) {
  st = st || computeStats(save); const L = [], T = { phys: "물리", mag: "마법", buff: "버프", heal: "회복" }[sk.dtype] || "물리";

function itemSourceLines(it) {

const TipUI = { el: null, key: "" };
function tipFind(t) {

  if (el.dataset.tipk) { const c = TIP_CUR[el.dataset.tipk]; if (!c) return null; return { key: "k" + el.dataset.tipk, html: `<div class="tt"><b>${c[0]}</b></div><div>${c[1]}</div><div class="tsrc"><b>획득처</b><br>${c[2]}</div>` }; }
  if (el.dataset.tipu) { const u = +el.dataset.tipu, it = save.inv.find((x) => x.uid === u) || EQ_SLOTS.map((k) => save.equipped[k]).find((x) => x && x.uid === u); if (!it) return null; return { key: "u" + u + ":" + (it.enh || 0) + ":" + it.affixes.length, html: itemTipHtml(it) }; }
  if (el.dataset.tips) { const d = SKILLS.find((x) => x.id === el.dataset.tips); if (!d) return null; return { key: "s" + d.id, html: skillTipHtml(d) }; }

function tipInit() {
  const tip = TipUI.el = document.getElementById("ttpop"); if (!tip) return;
  document.addEventListener("mousemove", (ev) => {
    let r = null; try { r = tipFind(ev.target); } catch (e) {}
    if (!r) { tip.classList.add("hidden"); TipUI.key = ""; return; }
    if (TipUI.key !== r.key) { tip.innerHTML = r.html; TipUI.key = r.key; }
    tip.classList.remove("hidden");

  });

}

// 운영자 회수 규칙: 서버가 알려 주면 이 기기의 엔젤릭(고유 4등급) 장비도 함께 제거한다
const ANG_IDS = new Set("halo judgment hellcrown apex eternity abyssalcrown voidheart pyrelordcrown plaguebearer angelstep dimshoes godhand hellverdict everarmor startear soulpact".split(" "));
function stripAngelicLocal() {
  if (!save) return 0; const bad = (it) => !!it && (it.utier === 4 || ANG_IDS.has(it.uniq)); let n = 0;
  const k = save.inv.length; save.inv = save.inv.filter((it) => !bad(it)); n += k - save.inv.length;
  for (const s of Object.keys(save.equipped || {})) if (bad(save.equipped[s])) { delete save.equipped[s]; n++; }
  if (n) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} if (typeof refreshTop === "function") refreshTop(); toast(`운영자에 의해 엔젤릭 장비 ${n}개가 회수되었습니다`, "bad"); }
  return n;
}
function srvQueue() { if (!SRV.on || SRV.timer) return; SRV.timer = setTimeout(async () => { SRV.timer = 0; if (!SRV.on || !save) return; const r = await api("/api/save", { save }); if (r.ok) { SRV.last = Date.now(); if (r.stripped) stripAngelicLocal(); } }, 6000); }

  SRV.on = true; srvMark(); try { localStorage.setItem("ds_srv", JSON.stringify({ name, pass })); } catch (e) {}
  return r;
}
async function srvAutoLogin() { try { const t = localStorage.getItem("ds_srv"); if (!t) return; const c = JSON.parse(t); const r = await srvLogin(c.name, c.pass); return r; } catch (e) {} }

function fxTick(b, dt) {   // 전투가 끝난 뒤에도 이펙트/글자/시체 연출을 계속 진행

  for (const t of b.texts) { t.t -= dt; t.y -= 26 * dt; } b.texts = b.texts.filter((t) => t.t > 0);
  for (const c of b.corpses) c.t += dt; b.corpses = b.corpses.filter((c) => c.t < 1.6);
  b.shake = Math.max(0, b.shake - dt); b.flash = Math.max(0, b.flash - dt); b.pHurt = Math.max(0, (b.pHurt || 0) - dt); b.pAtk = Math.max(0, (b.pAtk || 0) - dt);

}
function endTitle(b) { const k = b.node.kind; return endWin(b) ? (k === "endless" ? ["무한 균열 종료", "ENDLESS RIFT"] : k === "boss" || k === "void" || k === "hive" ? ["보스 처치!", "BOSS DEFEATED"] : k === "tutorial" ? ["훈련 완료", "WELL DONE"] : ["스테이지 클리어", "STAGE CLEAR"]) : ["패배...", "DEFEAT"]; }
function drawEndOverlay(g, b) {
  const t = b.endT || 0, W = CW, H = CH, win = endWin(b), dt = Math.min(0.1, G.dt || 0.016), [title, sub] = endTitle(b); g.save();
  if (win) {
    const fa = Math.max(0, 0.45 - t * 1.1); if (fa > 0) { g.fillStyle = `rgba(255,244,200,${fa})`; g.fillRect(0, 0, W, H); }
    const ra = Math.min(1, t * 2) * 0.2; g.save(); g.translate(W / 2, 170); g.rotate(t * 0.22); for (let i = 0; i < 14; i++) { g.rotate(Math.PI * 2 / 14); g.fillStyle = `rgba(255,222,130,${ra})`; g.beginPath(); g.moveTo(0, 0); g.lineTo(-20, 460); g.lineTo(20, 460); g.closePath(); g.fill(); } g.restore();
    for (const c of b.conf) { c.y += c.vy * dt; c.x += c.vx * dt + Math.sin(c.y / 30) * 0.6; c.r += c.vr * dt; if (c.y > H + 20) continue; g.save(); g.translate(c.x, c.y); g.rotate(c.r); g.fillStyle = c.c; g.globalAlpha = 0.9; g.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); g.restore(); }

function starCount(res, b) { if (!res.win || b.node.kind === "tutorial") return 0; const hp = b.hp / b.maxHp; return 1 + (hp >= 0.4 ? 1 : 0) + (hp >= 0.75 ? 1 : 0); }

    ...(res.runes || []).map((r) => chip(`<i style="color:${RUNES[r].color}">◆</i>`, "룬", RUNES[r].name, null, "rune"))].join("");

function animateResult(res) {
  $$("#mbox [data-cnt]").forEach((el, k) => { const to = +el.dataset.cnt, t0 = performance.now() + 250, dur = 1000; const f = (now) => { if (!el.isConnected) return; const p = Math.max(0, Math.min(1, (now - t0) / dur)), e = 1 - Math.pow(1 - p, 3); el.textContent = fmtN(Math.round(to * e)); if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); });
  const pre = res.pre; if (!pre) return; const fill = $("#rs-fill"), lv = $("#rs-lv"), up = $("#rs-up"), txt = $("#rs-txt"); if (!fill) return;
  const segs = [], lv1 = save.level, startLv = Math.max(pre.level, lv1 - 5);
  for (let l = startLv; l <= lv1; l++) segs.push({ lv: l, from: l === pre.level ? Math.min(1, pre.exp / pre.need) : 0, to: l === lv1 ? (lv1 >= CFG.LEVEL_CAP ? 1 : Math.min(1, save.exp / expNeed(lv1))) : 1 });
  let i = 0, t0 = 0, dur = 0; const begin = () => { const s = segs[i]; lv.textContent = s.lv; fill.style.width = s.from * 100 + "%"; t0 = performance.now(); dur = 350 + (s.to - s.from) * 700; };
  setTimeout(() => { begin(); const step = (now) => { if (!fill.isConnected) return; const s = segs[i], p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 2); fill.style.width = (s.from + (s.to - s.from) * e) * 100 + "%";
    if (p >= 1) { if (i < segs.length - 1) { i++; lv.textContent = segs[i].lv; up.classList.remove("show"); void up.offsetWidth; up.classList.add("show"); snd("levelup"); begin(); } else { if (txt && save.level < CFG.LEVEL_CAP) txt.textContent = `${fmtN(save.exp)} / ${fmtN(expNeed(save.level))}`; return; } } requestAnimationFrame(step); }; requestAnimationFrame(step); }, 450);
}

const NB = { sel: 0 };
function notesUnread() { return !!(save && PATCH_NOTES.length && save.notesSeen !== PATCH_NOTES[0].ver); }
function openNotes() {
  if (save) { save.notesSeen = PATCH_NOTES[0].ver; saveGame(); }
  const n = PATCH_NOTES[Math.min(NB.sel, PATCH_NOTES.length - 1)];
  Modal.open(`<h2>📜 업데이트 게시판</h2><div class="nb"><div class="nb-list">${PATCH_NOTES.map((p, i) => `<div class="nb-it ${i === NB.sel ? "on" : ""}" data-a="nbpick" data-i="${i}"><b>v${p.ver}</b>${i === 0 ? `<em>최신</em>` : ""}<small>${p.date}</small><div>${p.title}</div></div>`).join("")}</div>
    <div class="nb-body"><div class="nb-h"><b>v${n.ver}</b> <span>${n.date}</span></div><div class="nb-t">${n.title}</div><ul>${n.items.map((x) => `<li>${x}</li>`).join("")}</ul></div></div>
    <div class="dim center" style="margin-top:6px">현재 빌드 ${typeof BUILD_ID === "string" ? BUILD_ID : ""}</div>`, { cls: "wide", on: { nbpick: (el) => { NB.sel = +el.dataset.i; snd("click"); openNotes(); } } });
  refreshTop();
}

// 진입점: 입력 / 메인 루프
// =========================================================
let CV, CTX, lastT = 0, gtime = 0, accumSave = 0;
function canvasPos(ev) { const r = CV.getBoundingClientRect(); return [((ev.clientX - r.left) / r.width) * CW, ((ev.clientY - r.top) / r.height) * CH]; }
function fitApp() { const a = $("#app"), s = Math.min(window.innerWidth / CW, window.innerHeight / CH); a.style.transform = `translate(-50%,-50%) scale(${s})`; }

function pickEnemy(b, mx, my) {
  let best = null, bd = 1e9;
  for (const e of b.enemies) { if (e.dead || e.vx == null) continue; const R = e.tier === "boss" ? 70 * e.def.sc / 2 + 30 : 30 + e.def.sc * 6; const cy = e.tier === "boss" ? e.vy - e.def.sc * 20 : e.vy - 26; const d = Math.hypot(e.vx - mx, cy - my); if (d < R && d < bd) { bd = d; best = e; } }
  return best;
}
const ev_ok = (el) => el.click();
function bindInput() {
  CV.addEventListener("mousedown", (ev) => { AU.init(); AU.resume(); const [x, y] = canvasPos(ev); const m = MapView; m.drag = { x, y, cx: m.cam.x, cy: m.cam.y }; m.moved = false; });
  window.addEventListener("mousemove", (ev) => {
    const [x, y] = canvasPos(ev), m = MapView;
    if (G.screen === "map") { if (m.drag && ev.buttons) { const dx = x - m.drag.x, dy = y - m.drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) m.moved = true; if (m.moved) { m.cam.x = clamp(m.drag.cx - dx, 0, MAP_W - CW); m.cam.y = clamp(m.drag.cy - dy, 0, MAP_H - CH); } } else m.hover = m.pick(x, y); CV.style.cursor = m.hover ? "pointer" : "default"; }
    else if (G.screen === "town") { const s = TownView.pick(x, y); if (TownView.hover !== s && s) snd("hover"); TownView.hover = s; CV.style.cursor = s ? "pointer" : "default"; }
    else if (G.screen === "battle" && G.battle) { CV.style.cursor = pickEnemy(G.battle, x, y) ? "crosshair" : "default"; }
  });
  window.addEventListener("mouseup", () => { MapView.drag = null; });
  CV.addEventListener("click", (ev) => {
    AU.init(); AU.resume(); const [x, y] = canvasPos(ev);
    if (G.screen === "map") { if (MapView.moved) return; const n = MapView.pick(x, y); if (n) { MapView.sel = n; if (n.kind === "rift") G.riftTier = Math.max(1, Math.min(G.riftTier, save.rift.best + 1)); if (n.kind === "trial" && !G.trialInit) { G.trialInit = true; G.trialTier = Math.max(1, Math.min(MAX_TRIAL, (save.trialBest || 0) + 1)); } snd("click"); } else MapView.sel = null; mapPanel(); }
    else if (G.screen === "town") townClick(TownView.pick(x, y));
    else if (G.screen === "battle" && G.battle && !G.battle.over && !G.paused) { const e = pickEnemy(G.battle, x, y); if (e) { G.battle.designated = G.battle.designated === e ? null : e; snd("click"); } }
  });
  document.addEventListener("click", (ev) => {
    AU.init(); AU.resume(); const t = ev.target.closest("[data-t]"); if (!t) return; const a = t.dataset.t;
    if (a === "new") { if (loadGame()) askConfirm("기존 저장 데이터가 지워집니다.<br>새로 시작할까요?", "새로 시작", startNew); else startNew(); }
    else if (a === "cont") continueGame(); else if (a === "opt") openSettings(); else if (a === "login") loginDialog(openTitle);
    else if (a === "tipok") { $("#tip").classList.add("hidden"); G.paused = false; G.tipOpen = false; snd("click"); }
  });
  $("#mappanel").addEventListener("click", (ev) => { const p = ev.target.closest("[data-p]"); if (!p) return; const a = p.dataset.p; snd("click");
    if (a === "atlas") openAtlas(); else if (a === "tower") openTower(); else if (a === "go") mapGo(); else if (a === "back") { MapView.sel = null; mapPanel(); } else if (a === "tp") { G.riftTier = Math.min(save.rift.best + 1, G.riftTier + 1); mapPanel(); } else if (a === "tm") { G.riftTier = Math.max(1, G.riftTier - 1); mapPanel(); } else if (a === "ttp") { G.trialTier = Math.min(MAX_TRIAL, (save.trialBest || 0) + 1, G.trialTier + 1); mapPanel(); } else if (a === "vsp") { G.voidStage = Math.min(4, (G.voidStage || 1) + 1); mapPanel(); } else if (a === "vsm") { G.voidStage = Math.max(1, (G.voidStage || 1) - 1); mapPanel(); } else if (a === "hsp") { G.hiveStage = Math.min(4, (G.hiveStage || 1) + 1); mapPanel(); } else if (a === "hsm") { G.hiveStage = Math.max(1, (G.hiveStage || 1) - 1); mapPanel(); } else if (a === "ttm") { G.trialTier = Math.max(1, G.trialTier - 1); mapPanel(); } });
  $("#b-inv").onclick = () => { snd("click"); IB.mode = "inv"; IB.sel = null; renderItems(); };
  $("#b-skill").onclick = () => { snd("click"); SK.slot = 0; openSkills(); };
  $("#b-quest").onclick = () => { snd("click"); openQuests(false); };
  $("#b-opt").onclick = () => { snd("click"); openSettings(); };
  $("#b-map").onclick = () => { snd("click"); if (G.screen === "map") openTown(G.townAct); else openMap(G.townAct); };
  $("#b-stat").onclick = () => { snd("click"); openStats(); };
  $("#b-daily").onclick = () => { snd("click"); openDaily(); };
  $("#b-codex").onclick = () => { snd("click"); CX.sel = null; openCodex(); };
  $("#b-pause").onclick = () => { G.paused = !G.paused; $("#b-pause").textContent = G.paused ? "▶" : "❚❚"; };
  $("#b-speed").onclick = () => { G.speed = G.speed >= 3 ? 1 : G.speed + 1; $("#b-speed").textContent = "×" + G.speed; };
  $("#b-flee").onclick = () => { snd("click"); retreat(); };
  $("#b-pass").onclick = () => { snd("click"); openPassives(); };
  $("#b-auto").onclick = () => { save.auto.on = !save.auto.on; saveGame(); updateAutoBtn(); snd("click"); toast(save.auto.on ? "자동 반복 ON — 이긴 뒤 같은 스테이지를 계속 반복합니다" : "자동 반복 OFF"); };
  initModal(); window.addEventListener("resize", fitApp); fitApp();
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!$("#modal").classList.contains("hidden")) { if (!Modal.persistent) Modal.close(); } else if (G.screen === "battle") retreat(); }
    if ((G.screen === "town" || G.screen === "map") && $("#modal").classList.contains("hidden") && !e.repeat && !e.ctrlKey && !e.metaKey) {
      const k = e.key.toLowerCase();
      if (k === "m") $("#b-map").click(); else if (k === "i") $("#b-inv").click(); else if (k === "k") $("#b-skill").click(); else if (k === "p") $("#b-pass").click(); else if (k === "c") $("#b-stat").click(); else if (k === "q") $("#b-quest").click(); else if (k === "d") $("#b-codex").click(); else if (k === "t") $("#b-daily").click(); else if (k === "r") openRecords();
    }
    if (e.key === "Enter" && G.pending && !$("#modal").classList.contains("hidden")) { const ok = document.querySelector('#mbox [data-a="ok"]'); if (ok) { ev_ok(ok); return; } }
    if (G.screen === "battle" && !e.repeat) { if (e.key === " ") { e.preventDefault(); $("#b-pause").click(); } } });
}

// ---- 백그라운드 전투: 탭이 가려져도 (워커 타이머로) 실제 경과 시간만큼 전투를 진행한다 ----
let bgW = null, bgLast = 0, bgTimer = 0;
function bgTick() {
  if (!document.hidden) return; const now = performance.now(); let dt = Math.min(60, (now - bgLast) / 1000); bgLast = now;
  if (G.screen === "battle" && G.battle) {
    const b = G.battle; b.noFx = true; b.sfxq.length = 0;
    if (!G.paused && !G.tipOpen && $("#modal").classList.contains("hidden")) { let t = dt * G.speed; while (t > 0 && !b.over) { const h = Math.min(0.1, t); stepBattle(b, h); t -= h; } }
    if (b.over && !b.fin) { b.fin = true; b.endT = 99; finishFlow(b); }
    if (b.next) { const nx = b.next; b.next = null; nx(); }
  }
  if (save && G.screen !== "title") { accumSave += dt; if (accumSave > 30) { accumSave = 0; saveGame(); } }
}
function bgStart() {
  if (bgW || bgTimer) return; bgLast = performance.now();
  try { const blob = new Blob(["setInterval(()=>postMessage(0),500)"], { type: "text/javascript" }); bgW = new Worker(URL.createObjectURL(blob)); bgW.onmessage = bgTick; } catch (e) { bgW = null; bgTimer = setInterval(bgTick, 1000); }
}
function bgStop() { if (bgW) { bgW.terminate(); bgW = null; } if (bgTimer) { clearInterval(bgTimer); bgTimer = 0; } if (G.battle) G.battle.noFx = false; lastT = performance.now(); }
document.addEventListener("visibilitychange", () => { if (document.hidden) bgStart(); else bgStop(); });
function frame(ms) {
  requestAnimationFrame(frame); const rawDt = Math.min(0.1, (ms - lastT) / 1000 || 0); lastT = ms; gtime += rawDt; const g = CTX;
  if (G.screen === "title") drawTitle(g, gtime);
  else if (G.screen === "map") MapView.draw(save, gtime, rawDt);
  else if (G.screen === "town") TownView.draw(save, gtime);
  else if (G.screen === "battle" && G.battle) {
    const b = G.battle;
    if (!G.paused && !b.over && $("#modal").classList.contains("hidden")) {
      const steps = G.speed; for (let i = 0; i < steps; i++) stepBattle(b, rawDt);
    }
    for (const n of b.sfxq) AU.sfx(n); b.sfxq.length = 0;
    if (b.over) { if (b.endT == null) initEndFx(b); fxTick(b, rawDt * (b.endT < 0.8 ? 0.4 : 1)); b.endT += rawDt; }
    G.dt = rawDt; drawBattle(g, b, rawDt, gtime); if (b.over) drawEndOverlay(g, b); battleHud(b);
    if (b.next && b.endT >= b.resultAt) { const nx = b.next; b.next = null; nx(); }
    if (b.over && b.fin && !b.next && G.pending && $("#modal").classList.contains("hidden") && $("#unique").classList.contains("hidden")) showResult(G.pending[0], G.pending[1], true);
    if (b.over && !b.fin) { b.fin = true; finishFlow(b); }
    if (b.bossRef && !b.bossRef.dead && b.node.kind !== "boss" && b.node.kind !== "rift" && AU.trackName !== "boss") AU.bgm("boss");
  }
  accumSave += rawDt; if (save && G.screen !== "title" && save.stats) save.stats.sec = (save.stats.sec || 0) + rawDt; if (accumSave > 30 && save) { accumSave = 0; saveGame(); }
}

window.addEventListener("load", () => {
  CV = $("#cv"); CTX = CV.getContext("2d"); MapView.g = CTX; TownView.g = CTX; bindInput();
  setInterval(() => { if (save && (G.screen === "map" || G.screen === "town")) updateWorld(); }, 1000);
  loadAssets(() => { if (typeof tipInit === "function") tipInit(); $("#iorb").src = iconURL("orb", 1); $("#ikey").src = iconURL("skull", 1); $("#ig").src = iconURL("gold", 1); $("#io").src = iconURL("ore", 1); $("#is").src = iconURL("shard", 1); $("#loading").remove(); openTitle(); requestAnimationFrame(frame); srvAutoLogin(); srvMark(); { const v = document.createElement('div'); v.id = 'verlab'; v.textContent = 'v' + BUILD_ID; $('#app').appendChild(v); } checkUpdate(); setInterval(checkUpdate, 60000); });
});
