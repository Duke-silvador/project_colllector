<!DOCTYPE html>

<style>

  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
  #camBtn { position: absolute; right: 16px; bottom: 16px; background: #2f6fe4; padding: 12px 14px; font-size: 12px; border-radius: 6px; }
  #muteBtn { position: absolute; right: 16px; bottom: 76px; background: #555; padding: 10px 12px; font-size: 10px; border-radius: 6px; }
  #pauseBtn { position: absolute; left: 16px; bottom: 16px; background: #555; padding: 12px 14px; font-size: 12px; border-radius: 6px; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(30,60,30,.55); color: #fff; text-shadow: 4px 4px 0 #000; text-align: center; padding: 20px; }
  .screen h1 { font-size: clamp(30px, 7vw, 64px); line-height: 1.2; }
  .screen h2 { font-size: clamp(16px, 3vw, 24px); color: #ffd23f; }

  .hidden { display: none !important; }
  #garage { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .carCard { pointer-events: auto; cursor: pointer; background: rgba(0,0,0,.45); border: 3px solid #000; padding: 10px; width: 150px; font-size: 9px; line-height: 1.8; border-radius: 6px; }
  .carCard.sel { border-color: #ffd23f; background: rgba(255,210,63,.25); }
  .carCard.locked { opacity: .7; }
  .swatch { height: 26px; border: 3px solid #000; margin-bottom: 6px; }
  .bar { height: 6px; background: #222; margin: 2px 0 4px; } .bar i { display: block; height: 100%; background: #4cd34c; }
</style>

<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div class="hud" id="hud">
  <div id="stars"></div><div id="time">0:00</div>
  <div id="coins">● 0</div><div id="score">SCORE 0</div>

</div>

</div>

<script type="module">
import * as THREE from 'three';

// ---------------- CONFIG ----------------
const N = 12, R = 18, P = 70, B = P - R, W = N * P;
const MINC = -R / 2 + 1.5, MAXC = W + R / 2 - 1.5;
const CARS = [
  { name: 'RACER',   color: 0xe23b3b, price: 0,   maxSpeed: 34, accel: 26, turn: 2.6, hp: 100, mass: 1.0, grip: 6 },
  { name: 'TAXI',    color: 0xf6c90e, price: 40,  maxSpeed: 31, accel: 22, turn: 2.8, hp: 130, mass: 1.2, grip: 7 },
  { name: 'PICKUP',  color: 0x3b8de2, price: 120, maxSpeed: 30, accel: 20, turn: 2.4, hp: 190, mass: 1.7, grip: 6 },
  { name: 'MUSCLE',  color: 0x222222, price: 300, maxSpeed: 40, accel: 30, turn: 2.7, hp: 150, mass: 1.4, grip: 5 },
];
const COP_TYPES = {
  cop:  { maxSpeed: 31, accel: 24, turn: 2.5, hp: 50,  mass: 1.0, grip: 6, r: 2.0, score: 50 },
  swat: { maxSpeed: 29, accel: 20, turn: 2.2, hp: 120, mass: 2.0, grip: 7, r: 2.3, score: 120 },
  tank: { maxSpeed: 17, accel: 10, turn: 1.4, hp: 400, mass: 6.0, grip: 9, r: 2.8, score: 400 },
};

// ---------------- SAVE ----------------
const save = Object.assign({ coins: 0, best: 0, owned: [0], sel: 0 }, JSON.parse(localStorage.getItem('smashyFPV') || '{}'));
const persist = () => localStorage.setItem('smashyFPV', JSON.stringify(save));

// ---------------- RENDERER ----------------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd8f5);
scene.fog = new THREE.Fog(0x9fd8f5, 90, 260);
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 600);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6a8a4a, 1.6));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.8); sun.position.set(80, 140, 40); scene.add(sun);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const matCache = {};
const mat = (c, e) => { const k = c + '_' + (e || 0); return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial({ color: c, emissive: e || 0 })); };
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
function box(w, h, d, color, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(boxGeo, typeof color === 'number' ? mat(color) : color);
  m.scale.set(w, h, d); m.position.set(x, y, z); if (parent) parent.add(m); return m;
}

// ---------------- CITY ----------------
const blocks = []; // {x0,z0,x1,z1,type}
const solids = []; // rects {x0,z0,x1,z1}
const props = [];
function rnd(a, b) { return a + Math.random() * (b - a); }
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
  const r = Math.random();
  blocks.push({ x0: i * P + R / 2, z0: j * P + R / 2, x1: (i + 1) * P - R / 2, z1: (j + 1) * P - R / 2, type: r < 0.62 ? 'building' : r < 0.88 ? 'park' : 'plaza' });
}
// ground texture
{
  const S = 4, cv = document.createElement('canvas'); cv.width = cv.height = 2048;
  const k = 2048 / (W + R * 2), g = cv.getContext('2d');
  const X = v => (v + R) * k;
  g.fillStyle = '#3c3f45'; g.fillRect(0, 0, 2048, 2048);
  for (const b of blocks) {
    g.fillStyle = '#c9c9c0'; g.fillRect(X(b.x0), X(b.z0), (b.x1 - b.x0) * k, (b.z1 - b.z0) * k);
    g.fillStyle = b.type === 'park' ? '#7fd34e' : b.type === 'plaza' ? '#d8cfb8' : '#9a9a92';
    g.fillRect(X(b.x0 + 2.5), X(b.z0 + 2.5), (b.x1 - b.x0 - 5) * k, (b.z1 - b.z0 - 5) * k);
  }
  g.fillStyle = '#f2f2f2';
  for (let i = 0; i <= N; i++) for (let t = -R / 2; t < W + R / 2; t += 8) {
    if (((t + R / 2) % P + P) % P < R + 2) continue;
    g.fillRect(X(i * P - 0.3), X(t), 0.6 * k, 4 * k);
    g.fillRect(X(t), X(i * P - 0.3), 4 * k, 0.6 * k);
  }
  g.fillStyle = '#7fd34e'; // outer grass
  g.fillRect(0, 0, 2048, X(-R / 2)); g.fillRect(0, X(W + R / 2), 2048, 2048); g.fillRect(0, 0, X(-R / 2), 2048); g.fillRect(X(W + R / 2), 0, 2048, 2048);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const gr = new THREE.Mesh(new THREE.PlaneGeometry(W + R * 2, W + R * 2), new THREE.MeshLambertMaterial({ map: tex }));
  gr.rotation.x = -Math.PI / 2; gr.position.set(W / 2, 0, W / 2); scene.add(gr);
  const far = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), mat(0x7fd34e)); far.rotation.x = -Math.PI / 2; far.position.set(W / 2, -0.05, W / 2); scene.add(far);
}
// window texture
const winTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#7a8fa8';
  for (let y = 6; y < 64; y += 16) for (let x = 6; x < 64; x += 16) g.fillRect(x, y, 9, 9);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t;
})();
const BCOL = [0xe8d5b5, 0xc96a5a, 0x8fb3d9, 0xf0f0f0, 0xd9a05b, 0x9ac78a, 0xb58fd9, 0xe0e070];
const city = new THREE.Group(); scene.add(city);
for (const b of blocks) {
  const w = b.x1 - b.x0, d = b.z1 - b.z0, cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  if (b.type === 'building') {
    solids.push({ x0: b.x0 + 3, z0: b.z0 + 3, x1: b.x1 - 3, z1: b.z1 - 3 });
    const iw = (w - 6) / 2, id = (d - 6) / 2;
    for (let a = 0; a < 2; a++) for (let c = 0; c < 2; c++) {
      const h = rnd(8, 34), col = BCOL[(Math.random() * BCOL.length) | 0];
      const t = winTex.clone(); t.needsUpdate = true; t.repeat.set(Math.round(iw / 4), Math.round(h / 4));
      const m = new THREE.Mesh(boxGeo, [new THREE.MeshLambertMaterial({ color: col, map: t }), new THREE.MeshLambertMaterial({ color: col, map: t }), mat(col), mat(col), new THREE.MeshLambertMaterial({ color: col, map: t }), new THREE.MeshLambertMaterial({ color: col, map: t })]);
      m.scale.set(iw, h, id); m.position.set(b.x0 + 3 + iw * (a + .5), h / 2, b.z0 + 3 + id * (c + .5)); city.add(m);
      box(iw * 0.95, 0.6, id * 0.95, 0x555555, m.position.x, h + 0.3, m.position.z, city);
    }
  } else if (b.type === 'park') {
    for (let t = 0; t < 7; t++) addProp('tree', rnd(b.x0 + 6, b.x1 - 6), rnd(b.z0 + 6, b.z1 - 6));
  } else {
    box(4, 1, 4, 0x8a8a80, cx, 0.5, cz, city); box(1.2, 3, 1.2, 0xe8e8e8, cx, 2.5, cz, city);
    for (let t = 0; t < 4; t++) addProp('cone', rnd(b.x0 + 5, b.x1 - 5), rnd(b.z0 + 5, b.z1 - 5));
  }
  for (let s = 6; s < w - 4; s += 16) { addProp('lamp', b.x0 + s, b.z0 + 1.2); addProp('lamp', b.x0 + s, b.z1 - 1.2); }
  if (Math.random() < 0.5) addProp('hydrant', b.x0 + 1.2, rnd(b.z0 + 4, b.z1 - 4));
}
function addProp(kind, x, z) {
  const g = new THREE.Group();
  if (kind === 'tree') { box(0.7, 2, 0.7, 0x7a4f2a, 0, 1, 0, g); box(3, 3, 3, 0x3fa34d, 0, 3.5, 0, g); box(2, 1.5, 2, 0x52bf5e, 0, 5.4, 0, g); }
  else if (kind === 'lamp') { box(0.3, 5, 0.3, 0x444444, 0, 2.5, 0, g); box(0.8, 0.4, 0.8, 0xfff3a0, 0, 5.1, 0, g); }
  else if (kind === 'hydrant') { box(0.6, 1, 0.6, 0xd23030, 0, 0.5, 0, g); box(0.9, 0.25, 0.25, 0xd23030, 0, 0.6, 0, g); }
  else { box(0.6, 0.9, 0.6, 0xff7a1a, 0, 0.45, 0, g); }
  g.position.set(x, 0, z); g.rotation.y = rnd(0, 6); scene.add(g);
  props.push({ g, x, z, r: kind === 'tree' ? 1.2 : 0.7, hit: false, vy: 0, vx: 0, vz: 0, spin: 0, t: 0, ox: x, oz: z, kind });
}
// boundary fence
for (const [x, z, w, d] of [[W / 2, -R / 2 - 1, W + R + 4, 2], [W / 2, W + R / 2 + 1, W + R + 4, 2], [-R / 2 - 1, W / 2, 2, W + R + 4], [W + R / 2 + 1, W / 2, 2, W + R + 4]])
  box(w, 1.5, d, 0xe8e8e8, x, 0.75, z, scene);

// ---------------- CAR MODELS ----------------
function carModel(kind, color) {
  const g = new THREE.Group(); const body = new THREE.Group(); g.add(body);
  const wheels = [];
  const wheel = (x, z, s = 1) => { const w = box(0.5 * s, 0.9 * s, 0.9 * s, 0x1a1a1a, x, 0.45 * s, z, body); wheels.push(w); };
  let lights = null;
  if (kind === 'tank') {
    box(3.4, 1.2, 5.2, 0x4f6b3a, 0, 0.9, 0, body); box(0.8, 1, 5.4, 0x2a2a2a, -1.9, 0.5, 0, body); box(0.8, 1, 5.4, 0x2a2a2a, 1.9, 0.5, 0, body);
    const tur = new THREE.Group(); tur.position.y = 1.9; body.add(tur); box(2.2, 1, 2.4, 0x5d7c45, 0, 0, 0, tur); box(0.4, 0.4, 3, 0x333333, 0, 0.1, 2.4, tur); g.userData.turret = tur;
  } else if (kind === 'swat') {
    box(2.4, 2.2, 5, 0x1d2a44, 0, 1.6, 0, body); box(2.2, 0.8, 1.2, 0x9fc4e8, 0, 2.1, 2.0, body);
    [-1, 1].forEach(s => { wheel(s * 1.15, 1.6, 1.1); wheel(s * 1.15, -1.6, 1.1); });
    lights = [box(0.6, 0.3, 0.4, 0xff2020, -0.5, 2.85, 0.5, body), box(0.6, 0.3, 0.4, 0x2050ff, 0.5, 2.85, 0.5, body)];
  } else {
    const isCop = kind === 'cop';
    box(2, 0.8, 4.2, isCop ? 0xf4f4f4 : color, 0, 0.9, 0, body);
    if (isCop) { box(2.02, 0.5, 1.6, 0x1a1a1a, 0, 0.95, 1.4, body); box(2.02, 0.5, 1.4, 0x1a1a1a, 0, 0.95, -1.5, body); }
    box(1.8, 0.75, 2.0, isCop ? 0xf4f4f4 : color, 0, 1.65, -0.3, body).userData.cabin = true;
    box(1.82, 0.5, 2.02, 0x9fc4e8, 0, 1.65, -0.3, body).userData.cabin = true;
    box(0.5, 0.3, 0.1, 0xfff7c0, -0.6, 0.95, 2.11, body); box(0.5, 0.3, 0.1, 0xfff7c0, 0.6, 0.95, 2.11, body);
    box(0.5, 0.3, 0.1, 0xc02020, -0.6, 0.95, -2.11, body); box(0.5, 0.3, 0.1, 0xc02020, 0.6, 0.95, -2.11, body);
    [-1, 1].forEach(s => { wheel(s * 0.95, 1.3); wheel(s * 0.95, -1.3); });
    if (isCop) lights = [box(0.6, 0.25, 0.4, 0xff2020, -0.4, 2.15, -0.3, body), box(0.6, 0.25, 0.4, 0x2050ff, 0.4, 2.15, -0.3, body)];
  }
  if (lights) {
    lights[0].material = new THREE.MeshLambertMaterial({ color: 0xff2020, emissive: 0 });
    lights[1].material = new THREE.MeshLambertMaterial({ color: 0x2050ff, emissive: 0 });
  }
  g.userData.body = body; g.userData.lights = lights; g.userData.wheels = wheels;
  return g;
}

// ---------------- CAR PHYSICS ----------------
class Car {
  constructor(spec, kind, color) {
    Object.assign(this, { x: 0, z: 0, a: 0, vx: 0, vz: 0, steer: 0, throttle: 0, hp: spec.hp, maxHp: spec.hp, spec, kind, r: spec.r || 2.0, dead: false, deadT: 0, stuck: 0, rev: 0, fireT: rnd(2, 4) });
    this.mesh = carModel(kind, color); scene.add(this.mesh);
  }
  get fwd() { return [Math.sin(this.a), Math.cos(this.a)]; }
  get speed() { return Math.hypot(this.vx, this.vz); }
  update(dt) {
    const s = this.spec, [fx, fz] = this.fwd;
    let vf = this.vx * fx + this.vz * fz;
    let lx = this.vx - fx * vf, lz = this.vz - fz * vf;
    if (!this.dead) {
      if (this.throttle > 0) vf += s.accel * this.throttle * dt;
      else if (this.throttle < 0) vf += (vf > 1 ? -s.accel * 2.2 : -s.accel * 0.8) * dt;
      vf = Math.max(-s.maxSpeed * 0.45, Math.min(s.maxSpeed, vf));
      this.a -= this.steer * s.turn * dt * Math.max(-1, Math.min(1, vf / 7));
    }
    vf *= Math.exp(-(this.dead ? 2 : 0.25) * dt);
    const k = Math.exp(-s.grip * dt); lx *= k; lz *= k;
    this.vx = fx * vf + lx; this.vz = fz * vf + lz;
    this.x += this.vx * dt; this.z += this.vz * dt;
    this.vf = vf;
    return this.collideWorld();
  }
  collideWorld() {
    let impact = 0;
    const push = (nx, nz, pen) => {
      this.x += nx * pen; this.z += nz * pen;
      const vn = this.vx * nx + this.vz * nz;
      if (vn < 0) { impact = Math.max(impact, -vn); this.vx -= 1.4 * vn * nx; this.vz -= 1.4 * vn * nz; this.vx *= 0.8; this.vz *= 0.8; }
    };
    if (this.x < MINC) push(1, 0, MINC - this.x); if (this.x > MAXC) push(-1, 0, this.x - MAXC);
    if (this.z < MINC) push(0, 1, MINC - this.z); if (this.z > MAXC) push(0, -1, this.z - MAXC);
    for (const q of solids) {
      if (this.x < q.x0 - 4 || this.x > q.x1 + 4 || this.z < q.z0 - 4 || this.z > q.z1 + 4) continue;
      const cx = Math.max(q.x0, Math.min(q.x1, this.x)), cz = Math.max(q.z0, Math.min(q.z1, this.z));
      let dx = this.x - cx, dz = this.z - cz, d = Math.hypot(dx, dz);
      if (d === 0) { // inside: push to nearest edge
        const opts = [[-1, 0, this.x - q.x0], [1, 0, q.x1 - this.x], [0, -1, this.z - q.z0], [0, 1, q.z1 - this.z]].sort((a, b) => a[2] - b[2])[0];
        push(opts[0], opts[1], opts[2] + this.r);
      } else if (d < this.r) push(dx / d, dz / d, this.r - d);
    }
    return impact;
  }
  sync(t) {
    const m = this.mesh; m.position.set(this.x, 0, this.z); m.rotation.y = this.a;
    const b = m.userData.body; const lean = this.dead ? 0 : -this.steer * Math.min(1, this.speed / 30) * 0.06;
    b.rotation.z = lean;
    const L = m.userData.lights;
    if (L && !this.dead) { const on = Math.floor(t * 8) % 2; L[0].material.emissive.setHex(on ? 0xff0000 : 0); L[1].material.emissive.setHex(on ? 0 : 0x0030ff); }
  }
}

// ---------------- FX ----------------
const parts = [];
const partGeo = new THREE.BoxGeometry(1, 1, 1);
function burst(x, y, z, color, n, spd = 10, size = 0.6, life = 1) {

    const a = clock * 0.08; camera.position.set(W / 2 + Math.sin(a) * 140, 70, W / 2 + Math.cos(a) * 140); camera.lookAt(W / 2, 0, W / 2);
  }
  // HUD
  if (player) {
    document.getElementById('hp').style.width = (player.hp / player.maxHp * 100) + '%';
    document.getElementById('hp').style.background = player.hp / player.maxHp > 0.5 ? '#4cd34c' : player.hp / player.maxHp > 0.25 ? '#f3c21e' : '#e23b3b';
    document.getElementById('time').textContent = fmt(time);
    document.getElementById('coins').textContent = `● ${runCoins}`;
    document.getElementById('score').textContent = `SCORE ${Math.floor(score + time * 10)}`;
    drawRadar();
  }
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) document.getElementById('msg').style.opacity = 0; }
}
function drawRadar() {
  const g = radar, S = 150, sc = 0.45; g.clearRect(0, 0, S, S); g.save(); g.beginPath(); g.arc(75, 75, 72, 0, 7); g.clip();
  g.translate(75, 75); g.rotate(player.a + Math.PI); // forward points up
  const tx = x => (x - player.x) * sc, tz = z => (z - player.z) * sc;
  g.fillStyle = 'rgba(0,0,0,.35)'; for (const q of solids) { const x = tx(q.x0), y = tz(q.z0); if (Math.abs(x) < 140 && Math.abs(y) < 140) g.fillRect(x, y, (q.x1 - q.x0) * sc, (q.z1 - q.z0) * sc); }
  g.fillStyle = '#ffd23f'; for (const c of coins) { const x = tx(c.x), y = tz(c.z); if (x * x + y * y < 5500) g.fillRect(x - 1.5, y - 1.5, 3, 3); }
  for (const c of cops) { if (c.dead) continue; let x = tx(c.x), y = tz(c.z); const d = Math.hypot(x, y); if (d > 66) { x *= 66 / d; y *= 66 / d; } g.fillStyle = c.kind === 'tank' ? '#3c3' : Math.floor(clock * 6) % 2 ? '#f33' : '#36f'; g.fillRect(x - 3.5, y - 3.5, 7, 7); }
  g.restore();
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(75, 66); g.lineTo(81, 82); g.lineTo(69, 82); g.fill();
}
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (state !== 'pause') {
    // substeps for stable collisions at high speed
    const n = dt > 0.025 ? 2 : 1; for (let i = 0; i < n; i++) step(dt / n);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('blur', () => { if (state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

// ---------------- MENUS ----------------
function renderGarage() {
  const el = document.getElementById('garage'); el.innerHTML = '';
  CARS.forEach((c, i) => {
    const owned = save.owned.includes(i), d = document.createElement('div');
    d.className = 'carCard' + (save.sel === i ? ' sel' : '') + (owned ? '' : ' locked');
    const bar = (v, m) => `<div class="bar"><i style="width:${v / m * 100}%"></i></div>`;
    d.innerHTML = `<div class="swatch" style="background:#${c.color.toString(16).padStart(6, '0')}"></div>${c.name}<br>SPEED${bar(c.maxSpeed, 40)}TURN${bar(c.turn, 2.8)}ARMOR${bar(c.hp, 190)}${owned ? (save.sel === i ? 'SELECTED' : 'OWNED') : '● ' + c.price}`;
    d.onclick = () => {
      if (!owned) { if (save.coins < c.price) { d.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], 200); return; } save.coins -= c.price; save.owned.push(i); }
      save.sel = i; persist(); renderGarage();
    };
    el.appendChild(d);
  });
  const bank = document.createElement('div'); bank.style.cssText = 'width:100%;font-size:12px;color:#ffd23f'; bank.textContent = `BANK ● ${save.coins}   BEST ${save.best}`; el.appendChild(bank);
}
renderGarage(); updateStars();
document.getElementById('playBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;
document.getElementById('garageBtn').onclick = () => { show('over', false); renderGarage(); show('menu', true); state = 'menu'; for (const c of cops) scene.remove(c.mesh); cops = []; };
document.getElementById('resumeBtn').onclick = togglePause;
document.getElementById('quitBtn').onclick = () => { show('paused', false); state = 'play'; player.hp = 0; player.dead = true; endGame(); };
document.getElementById('camBtn').onclick = toggleCam;
document.getElementById('muteBtn').onclick = toggleMute;
document.getElementById('pauseBtn').onclick = togglePause;
</script>
