<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Tiny Traffic Town · Mindspace Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#f7f4ee;font:14px/1.4 system-ui,Segoe UI,sans-serif}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:#101010;border-bottom:1px solid #333}
.brand{font-weight:900;letter-spacing:.5px}.brand span{color:#80e0b4}
a{color:inherit;text-decoration:none}.back,.open{border:1px solid #444;border-radius:7px;padding:8px 13px;font-weight:750}.open{background:#80e0b4;color:#07130d;border-color:#80e0b4}
main{height:calc(100% - 58px);position:relative}iframe{display:block;width:100%;height:100%;border:0;background:#111}
.fallback{position:absolute;right:12px;bottom:12px;padding:10px 13px;border:1px solid #444;border-radius:8px;background:#111e;color:#bbb;font-size:12px;animation:tipFade .8s ease 10s forwards;pointer-events:none}\n@keyframes tipFade{to{opacity:0;visibility:hidden}}\n@media(prefers-reduced-motion:reduce){.fallback{animation:none;opacity:0;visibility:hidden}}
@media(max-width:520px){.top{padding:0 9px}.brand{font-size:11px}.back,.open{padding:7px 8px;font-size:11px}}
</style>
<script src="mindspace-lock.js" defer></script>
</head>
<body>
<header class="top"><a class="back" href="./arcade.html">← Arcade</a><div class="brand">MINDSpace <span>✳ TINY TRAFFIC TOWN</span></div><a class="open" href="https://pyrou.github.io/tinytraffictown/" target="_blank" rel="noopener">Open game ↗</a></header>
<main><iframe src="https://pyrou.github.io/tinytraffictown/" title="Tiny Traffic Town" allow="fullscreen; autoplay" loading="eager"></iframe><div class="fallback">If the game doesn't load here, choose “Open game ↗”.</div></main>
</body>
</html>
