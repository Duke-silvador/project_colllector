    <style>.language-menu{position:relative}.language-menu .language-option{display:none}.language-menu.open .language-option,.language-menu:hover .language-option,.language-menu:focus-within .language-option{display:block;position:absolute;right:0;top:calc(100% + 10px);z-index:30;min-width:105px;padding:9px 12px;background:#fff;border:1px solid #dce8e3;border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.12);text-align:left;color:#173735}.language-menu.open .language-option:hover,.language-menu .language-option:hover{color:#09a86f}.language-menu .language-divider{display:none}</style>
