        const getSupabase = async () => {
            if (supabase) return supabase;
            
            try {
                const module = await new Function("return import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm')")();
                supabase = module.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return supabase;
            } catch (e) {
                console.warn("ESM import fallback gagal:", e);
            }

            if (window.supabase) { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); return supabase; }
            
            let retries = 50;
            while (!window.supabase && retries > 0) { await new Promise(resolve => setTimeout(resolve, 100)); retries--; }
            if (window.supabase) { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); return supabase; }
            
            throw new Error("Gagal memuat pustaka database. Jika Anda menggunakan ekstensi AdBlocker, coba matikan sementara.");
        };

        const RichTextEditor = ({ value, onChange, placeholder, minHeight="120px" }) => {
            const editorRef = useRef(null);
            const fileInputRef = useRef(null);
            const { showPrompt } = useContext(DialogContext);

            useEffect(() => {
                if (editorRef.current && value !== editorRef.current.innerHTML) editorRef.current.innerHTML = value || '';
                try {
                    document.execCommand('defaultParagraphSeparator', false, 'p');
                    document.execCommand('styleWithCSS', false, true);
                } catch(e) {}
            }, []); 

            const handleInput = () => { if (editorRef.current) onChange(editorRef.current.innerHTML); };
            
            const execCmd = (cmd, e, val=null) => { 
                if(e) e.preventDefault(); 
                editorRef.current.focus(); document.execCommand(cmd, false, val); handleInput(); 
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const imgHTML = `<img src="${reader.result}" alt="Gambar" style="max-width: 100%; width: auto; max-height: 250px; border-radius: 8px; margin: 8px 0; object-fit: contain; display: block;" /><br/>`;
                        editorRef.current.focus(); document.execCommand('insertHTML', false, imgHTML); handleInput();
                    };
                    reader.readAsDataURL(file);
                }
            };

            const insertMath = (formula) => {
                const mathHTML = ` <span class="math-tex">\\(${formula}\\)</span> `;
                editorRef.current.focus(); document.execCommand('insertHTML', false, mathHTML); handleInput();
            };

            return (
                <div className="border border-slate-300 rounded-lg overflow-hidden bg-white focus-within:border-primary focus-within:ring-1 transition-all shadow-sm">
                    <div className="bg-slate-50 border-b border-slate-200 p-1.5 flex flex-wrap gap-1 items-center">
                        <button onMouseDown={(e)=>execCmd('bold', e)} type="button" className="w-8 h-8 font-bold text-slate-700 hover:bg-slate-200 rounded">B</button>
                        <button onMouseDown={(e)=>execCmd('italic', e)} type="button" className="w-8 h-8 italic text-slate-700 hover:bg-slate-200 rounded">I</button>
                        <button onMouseDown={(e)=>execCmd('underline', e)} type="button" className="w-8 h-8 underline text-slate-700 hover:bg-slate-200 rounded">U</button>
                        <div className="w-px h-5 bg-slate-300 mx-1"></div>
                        <button onMouseDown={(e)=>execCmd('justifyLeft', e)} type="button" className="w-8 h-8 text-slate-700 hover:bg-slate-200 rounded flex items-center justify-center"><i className="fas fa-align-left text-xs"></i></button>
                        <button onMouseDown={(e)=>execCmd('justifyCenter', e)} type="button" className="w-8 h-8 text-slate-700 hover:bg-slate-200 rounded flex items-center justify-center"><i className="fas fa-align-center text-xs"></i></button>
                        <button onMouseDown={(e)=>execCmd('justifyRight', e)} type="button" className="w-8 h-8 text-slate-700 hover:bg-slate-200 rounded flex items-center justify-center"><i className="fas fa-align-right text-xs"></i></button>
                        <div className="w-px h-5 bg-slate-300 mx-1"></div>
                        <button onMouseDown={(e)=>{ if(e) e.preventDefault(); fileInputRef.current.click();}} type="button" className="h-8 px-2.5 text-slate-700 hover:bg-slate-200 rounded flex items-center text-xs font-semibold"><ImageIcon size={14} className="mr-1 text-success"/> Gambar</button>
                        <div className="w-px h-5 bg-slate-300 mx-1"></div>
                        <select onChange={(e) => { if(e.target.value) { insertMath(e.target.value); e.target.value = ''; } }} className="h-8 px-2 bg-white hover:bg-slate-50 border border-slate-300 rounded text-xs font-bold text-primary outline-none cursor-pointer shadow-sm">
                            <option value="">+ Rumus Cepat</option>
                            <option value="x^2">Kuadrat (x²)</option>
                            <option value="\sqrt{x}">Akar (√x)</option>

                        </select>
                        <button onMouseDown={async (e)=>{if(e) e.preventDefault(); const f = await showPrompt("Ketik manual kode LaTeX:"); if(f) insertMath(f);}} type="button" className="h-8 px-2 ml-1 text-slate-700 hover:bg-slate-200 rounded flex items-center text-xs font-semibold"><Calculator size={14} className="mr-1 text-primary"/> Manual</button>

                    <div ref={editorRef} contentEditable onInput={handleInput} onBlur={handleInput} className="p-4 outline-none rich-text-content editor-ignore-math text-slate-700 text-sm" style={{minHeight: minHeight}} placeholder={placeholder} />

        };

        function useStickySession(defaultValue, key) {
          const [value, setValue] = useState(() => {
            const stickyValue = window.localStorage.getItem(key);
            return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
          });
          useEffect(() => { window.localStorage.setItem(key, JSON.stringify(value)); }, [key, value]);
          return [value, setValue];
        }

        const triggerMathRender = () => {
            if (window.renderMathInElement) {
                setTimeout(() => {
                    window.renderMathInElement(document.body, {
                        ignoredClasses: ["editor-ignore-math"],
                        delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}, {left: '\\[', right: '\\]', display: true}],
                        throwOnError : false
                    });
                }, 10); // Ubah ke 10ms agar dirender super cepat tanpa berkedip
            }
        };
        const calculateScore = (answers, questions) => {
            let totalPoints = 0;
            let correctMudah = 0, correctSedang = 0, correctSulit = 0;
            let totalMudah = 0, totalSedang = 0, totalSulit = 0;

            const detailedResults = questions.map(q => {
                const diff = q.difficulty || 'Sedang';
                if (diff === 'Mudah') totalMudah++;
                else if (diff === 'Sedang') totalSedang++;
                else if (diff === 'Sulit') totalSulit++;

                let isCorrect = false;
                const userAnswer = answers[q.id];
                
                if (q.type === 'MCQ') {
                    if (userAnswer === q.correctAnswer) isCorrect = true;
                } else if (q.type === 'SHORT_ANSWER') {
                    if (userAnswer && String(userAnswer).trim().toLowerCase() === String(q.correctAnswer).trim().toLowerCase()) isCorrect = true;
                } else if (q.type === 'ESSAY') {
                    isCorrect = false; 
                }

                const qPoints = (q.points !== undefined && q.points !== null) ? parseFloat(q.points) : (diff === 'Mudah' ? 1.00 : diff === 'Sedang' ? 1.25 : 1.50);
                let pointsEarned = 0;

                if (isCorrect) {
                    if (diff === 'Mudah') correctMudah++;
                    else if (diff === 'Sedang') correctSedang++;
                    else if (diff === 'Sulit') correctSulit++;
                    
                    pointsEarned = qPoints;
                }

                totalPoints += pointsEarned;
                
                return { 
                    qId: q.id, type: q.type, difficulty: diff, isCorrect, 
                    isEmpty: !userAnswer || String(userAnswer).trim() === '',
                    pointsEarned, questionMaxPoints: qPoints, userAnswer 
                };
            });
            
            const masteryMudah = totalMudah > 0 ? (correctMudah / totalMudah) * 100 : 0;
            const masterySedang = totalSedang > 0 ? (correctSedang / totalSedang) * 100 : 0;
            const masterySulit = totalSulit > 0 ? (correctSulit / totalSulit) * 100 : 0;

            const ito = (0.50 * masterySulit) + (0.30 * masterySedang) + (0.20 * masteryMudah);

            return { 
                finalScore: Number(totalPoints.toFixed(2)), ito: Number(ito.toFixed(2)),
                correctMudah, correctSedang, correctSulit, totalMudah, totalSedang, totalSulit,
                masteryMudah, masterySedang, masterySulit, detailedResults 
            };
        };

        const compareResults = (a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            const detA = a.detail?.summary || {}; const detB = b.detail?.summary || {};
            if ((detB.correctSulit || 0) !== (detA.correctSulit || 0)) return (detB.correctSulit || 0) - (detA.correctSulit || 0);
            if ((detB.correctSedang || 0) !== (detA.correctSedang || 0)) return (detB.correctSedang || 0) - (detA.correctSedang || 0);
            if ((detB.correctMudah || 0) !== (detA.correctMudah || 0)) return (detB.correctMudah || 0) - (detA.correctMudah || 0);
            const timeA = (a.endTime || 0) - (a.startTime || 0); const timeB = (b.endTime || 0) - (b.startTime || 0);
            return timeA - timeB; 
        };

        const getITOCategory = (ito) => {
            if (ito >= 90) return 'Kandidat Nasional';
            if (ito >= 80) return 'Kandidat Provinsi';
            if (ito >= 70) return 'Kandidat Kabupaten';
            if (ito >= 60) return 'Potensial Dibina';
            return 'Perlu Pendampingan';
        };

        function App() {
          const [currentRoute, setCurrentRoute] = useState('/'); 
          const [tokens, setTokens] = useState([]);
          const [results, setResults] = useState([]);
          const [questions, setQuestions] = useState([]);
          
          const [activeFolder, setActiveFolder] = useState('Utama'); 
          const [organizerName, setOrganizerName] = useState('Sekolah Dasar');
          const [schoolLogo, setSchoolLogo] = useState('');
          const [examDate, setExamDate] = useState('');
          const [startTimeStr, setStartTimeStr] = useState('07:30');
          const [endTimeStr, setEndTimeStr] = useState('12:00');
          const [isRandomQ, setIsRandomQ] = useState(false);
          const [isRandomOpt, setIsRandomOpt] = useState(false);

          const [isLoadingData, setIsLoadingData] = useState(false);
          const [dbStatus, setDbStatus] = useState('connecting');
          const [dbErrorMsg, setDbErrorMsg] = useState('');
        
          const [activeSession, setActiveSession] = useStickySession(null, 'cbt_active_session');
          const [isAdminLoggedIn, setIsAdminLoggedIn] = useStickySession(false, 'cbt_admin_auth');

          const [dialogState, setDialogState] = useState(null); 

          const showCustomAlert = useCallback((msg) => new Promise((resolve) => {
              setDialogState({ type: 'alert', msg, resolve: () => { setDialogState(null); resolve(true); } });
          }), []);

          const showCustomConfirm = useCallback((msg) => new Promise((resolve) => {
              setDialogState({ type: 'confirm', msg, resolve: (val) => { setDialogState(null); resolve(val); } });
          }), []);

          const showCustomPrompt = useCallback((msg, defaultValue = '') => new Promise((resolve) => {
              setDialogState({ type: 'prompt', msg, defaultValue, resolve: (val) => { setDialogState(null); resolve(val); } });
          }), []);

          const navigate = (path) => { window.scrollTo(0,0); setCurrentRoute(path); };

          const fetchSupabaseData = async () => {
           setIsLoadingData(true);
           setDbErrorMsg('');
           try {
              const db = await getSupabase();
              const [qRes, tRes] = await Promise.all([
                  db.from('questions').select('*'),
                  db.from('tokens').select('*').order('generatedAt', { ascending: false })
              ]);
              
              if (qRes.error) throw new Error("Tabel Soal: " + qRes.error.message);
              if (tRes.error) throw new Error("Tabel Token: " + tRes.error.message);

              if(qRes.data) setQuestions(qRes.data);
              if(tRes.data) {
                  setTokens(tRes.data);
                  const findToken = (code) => tRes.data.find(t => t.code === code)?.status;
                    setActiveFolder(findToken('SYS_SETTING_FOLDER') || 'Utama');
                    setOrganizerName(findToken('SYS_SETTING_ORGANIZER') || 'Kelas Olimpiade');
                    setSchoolLogo(findToken('SYS_SETTING_LOGO') || '');
                    setExamDate(findToken('SYS_SETTING_DATE') || '');
                    setStartTimeStr(findToken('SYS_SETTING_START_TIME') || '07:30');
                    setEndTimeStr(findToken('SYS_SETTING_END_TIME') || '12:00');
                    setIsRandomQ(findToken('SYS_SETTING_RANDOM_Q') === 'TRUE');
                    setIsRandomOpt(findToken('SYS_SETTING_RANDOM_OPT') === 'TRUE');
                }

                if (isAdminLoggedIn) {
                 const rRes = await db.from('results').select('*').order('created_at', { ascending: false });
                 if (rRes.error) throw new Error("Tabel Hasil: " + rRes.error.message);
                 if(rRes.data) {
                    const formattedResults = rRes.data.map(r => ({
                       id: r.id,
                       participant: { name: r.participant_name, school: r.participant_school, nis: r.participant_nis, grade: r.participant_grade },
                         token: r.token, score: r.score, startTime: parseInt(r.start_time), endTime: parseInt(r.end_time),
                         detail: typeof r.detailed_results === 'string' ? JSON.parse(r.detailed_results) : r.detailed_results, created_at: r.created_at
                      }));
                      setResults(formattedResults);
                 }
              }
              setDbStatus('connected');
           } catch (error) { 
               console.error("Supabase Error:", error);
               let errMsg = error.message || "Gagal terhubung ke server database.";
               if (errMsg.toLowerCase().includes('fetch') || errMsg.toLowerCase().includes('network')) {
                   errMsg = "Tidak bisa menghubungi server (Failed to fetch). Kemungkinan server Supabase Anda sedang 'Paused'. Silakan login ke dasbor Supabase Anda dan klik tombol 'Restore Project'.";
               }
               setDbErrorMsg(errMsg);
               setDbStatus('error'); 
           } 
           finally { setIsLoadingData(false); }
        };

        useEffect(() => { fetchSupabaseData(); }, [isAdminLoggedIn]);

          const activeQuestions = isAdminLoggedIn 
            ? questions 
            : questions.filter(q => {
                const targetFolder = (activeSession && activeSession.participant && activeSession.participant.jenis_soal) 
                    ? activeSession.participant.jenis_soal 
                    : (activeFolder || 'Utama');
                return String(q.folder || 'Utama').trim().toLowerCase() === String(targetFolder).trim().toLowerCase();
            });

          useEffect(() => {
            if (currentRoute === '/') {
              if (activeSession && activeSession.status === 'ACTIVE') navigate('/exam');
              else if (activeSession && activeSession.status === 'SUBMITTED') navigate('/dashboard');
              else navigate('/login');
            }
            triggerMathRender();
          }, [currentRoute, activeSession]);

          const ParticipantLogin = () => {
            const [inputToken, setInputToken] = useState('');
            const [error, setError] = useState('');
            const [isChecking, setIsChecking] = useState(false);

            const handleLogin = async (e) => {
              e.preventDefault();
              setIsChecking(true); setError('');
              try {
                const db = await getSupabase();
                const { data: tokenObj, error: fetchErr } = await db.from('tokens').select('*').eq('code', inputToken.trim().toUpperCase()).single();
                
                if (fetchErr || !tokenObj || tokenObj.code.startsWith('SYS_SETTING_') || tokenObj.code.startsWith('SYS_FOLDER_')) { setError('Token tidak valid atau tidak ditemukan.'); setIsChecking(false); return; }
                if (tokenObj.status === 'USED') { setError('Token sudah digunakan.'); setIsChecking(false); return; }
                if (tokenObj.status === 'EXPIRED') { setError('Token kedaluwarsa.'); setIsChecking(false); return; }
                if (tokenObj.status === 'BLOCKED') { setError('Token diblokir. Hubungi administrator.'); setIsChecking(false); return; }

                if (examDate && startTimeStr && endTimeStr) {
                    const now = new Date();
                    const startDateTime = new Date(`${examDate}T${startTimeStr}:00`);
                    const endDateTime = new Date(`${examDate}T${endTimeStr}:00`);
                    if (now < startDateTime) {
                        setError(`Ujian belum dimulai. Jadwal: ${examDate} pukul ${startTimeStr}`);
                        setIsChecking(false); return;
                    }
                    if (now > endDateTime) {
                        setError(`Waktu ujian telah berakhir pada ${examDate} pukul ${endTimeStr}`);
                        setIsChecking(false); return;
                    }
                }

                // Menyimpan jenis_soal (Peminatan Folder) saat Login
                setActiveSession({ 
                    token: tokenObj.code, 
                    participant: { 
                        name: tokenObj.participant_name || 'Peserta', 
                        school: tokenObj.participant_school || organizerName, 
                        nis: '', 
                        grade: '6',
                        jenis_soal: tokenObj.jenis_soal || 'Utama' 
                    }, 
                    answers: {}, flagged: [], status: 'SETUP' 
                });
                navigate('/instruction');
              } catch (err) { setError(err.message || 'Gagal terhubung ke server.'); }
              setIsChecking(false);
            };

            return (
              <div className="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4">
                <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border-t-4 border-blue-600">
                  <div className="text-center mb-8">
                    <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm overflow-hidden">
                        {schoolLogo ? <img src={schoolLogo} alt="Logo" className="w-full h-full object-cover"/> : <Monitor size={32} />}
                    </div>
                    <h1 className="text-2xl font-black text-slate-800 tracking-tight">CBT TKA</h1>
                    <p className="text-slate-500 font-medium mt-1">{organizerName}</p>
                  </div>
                  
                  {initErrorMsg && (
                      <div className="mb-6 p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-200 font-medium flex items-start">
                          <AlertCircle size={18} className="mr-2 mt-0.5 flex-shrink-0"/>
                          <div><p className="font-bold mb-1">Gagal Terhubung ke Database</p><p>{initErrorMsg}</p></div>
                      </div>
                  )}

                  <form onSubmit={handleLogin} className="space-y-5">
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-2">Masukkan Token Ujian</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Key className="h-5 w-5 text-slate-400" /></div>
                        <input type="text" className="block w-full pl-11 pr-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 uppercase tracking-widest font-bold text-slate-800 placeholder-slate-300 bg-slate-50 focus:bg-white" placeholder="Ketik Token..." value={inputToken} onChange={(e) => setInputToken(e.target.value.toUpperCase())} required disabled={isChecking || dbStatus === 'error'}/>
                      </div>
                      {error && <p className="mt-2 text-sm text-rose-500 font-medium flex items-center"><AlertCircle size={14} className="mr-1.5"/> {error}</p>}
                    </div>
                    <button type="submit" disabled={isChecking || dbStatus === 'error'} className="w-full flex justify-center py-3.5 px-4 rounded-xl text-base font-bold text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md disabled:opacity-50">
                      {isChecking ? 'Memeriksa Token...' : 'Masuk Ujian'}
                    </button>
                  </form>
                  <div className="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center">
                     <span className={`text-xs font-bold px-3 py-1.5 rounded-md flex items-center ${dbStatus === 'connected' ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : 'bg-rose-50 text-rose-600 border border-rose-100'}`}>
                         <Cloud size={14} className="mr-1.5"/> {dbStatus === 'connected' ? 'On-line' : 'Offline'}
                     </span>
                     <button onClick={() => navigate('/admin/login')} className="text-xs font-semibold text-slate-400 hover:text-slate-800 transition-colors flex items-center"><Settings size={14} className="mr-1"/> Admin</button>
                  </div>
                </div>
              </div>
            );
          };

          const ParticipantInstruction = () => {
            const [isStarting, setIsStarting] = useState(false);
            const { showAlert } = useContext(DialogContext);

            if (!activeSession || !activeSession.participant) { navigate('/login'); return null; }
            
            const startExam = async () => {
              setIsStarting(true);
              try {
                const db = await getSupabase();
                await db.from('tokens').update({ status: 'USED' }).eq('code', activeSession.token);

                let sessionQuestions = JSON.parse(JSON.stringify(activeQuestions));
                if (isRandomQ) sessionQuestions.sort(() => Math.random() - 0.5);
                
                setActiveSession(prev => ({ 
                    ...prev, status: 'ACTIVE', startTime: new Date().getTime(), 
                    durationLimit: 120 * 60 * 1000, sessionQuestions, examCurrentIndex: 0 
                }));
                navigate('/exam');
              } catch (err) { 
                await showAlert("Gagal memulai ujian: " + err.message); 
                setIsStarting(false); 
              }
            };

            return (
              <div className="min-h-screen bg-background py-10 px-4 flex justify-center items-center relative overflow-hidden">
                 <div className="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 md:p-10 border-t-[6px] border-secondary z-10 animate-fade-in">
                    <h2 className="text-2xl font-black text-slate-800 mb-6 border-b pb-4">Verifikasi Identitas</h2>
                    <div className="bg-primary/5 border border-primary/20 p-5 rounded-2xl mb-8 flex flex-col items-center text-center">
                       <User className="text-primary mb-3" size={40} />
                       <strong className="text-xl text-slate-800 block">{activeSession.participant.name}</strong>
                       <span className="text-slate-500 font-medium mb-2">{activeSession.participant.school}</span>
                       <span className="text-xs font-bold text-white bg-primary px-3 py-1 rounded-md uppercase tracking-widest">{activeSession.participant.jenis_soal || 'Utama'}</span>
                    </div>
                    <ul className="space-y-4 text-slate-700 font-medium mb-8">
                         <li className="flex items-start"><CheckCircle className="text-success mr-3 mt-1 flex-shrink-0" size={18}/> Ujian terdiri dari <b>{activeQuestions.length} soal</b>.</li>
                         <li className="flex items-start"><CheckCircle className="text-success mr-3 mt-1 flex-shrink-0" size={18}/> Jawaban akan tersimpan otomatis.</li>
                         <li className="flex items-start text-primary bg-primary/5 p-4 rounded-xl border border-primary/10"><i className="fas fa-pen-nib mr-3 mt-0.5 flex-shrink-0"></i> Tersedia fitur <b>Kertas Coretan (Canvas)</b> untuk menghitung rumusan.</li>
                         <li className="flex items-start text-red-600 bg-red-50 p-4 rounded-xl border border-red-100"><AlertCircle className="mr-3 mt-0.5 flex-shrink-0" size={18}/> Dilarang membuka tab lain. Sistem mencatat pelanggaran.</li>
                    </ul>
                    <button onClick={startExam} disabled={isStarting || activeQuestions.length === 0} className="w-full py-4 bg-success text-white font-black text-lg rounded-2xl shadow-lg hover:bg-success-600 transition-all disabled:opacity-50">
                       {isStarting ? 'Memproses...' : (activeQuestions.length === 0 ? 'Soal Belum Tersedia' : 'Mulai Ujian Sekarang')}
                    </button>
                 </div>
              </div>
            );
          };

          const ExamEngine = () => {
            const [timeLeft, setTimeLeft] = useState(0);
            const { showAlert } = useContext(DialogContext);
            
            const [canvasMode, setCanvasMode] = useState(false);
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [canvasCtx, setCanvasCtx] = useState(null);
            const [penColor, setPenColor] = useState('#0F4C81');
            const [isEraser, setIsEraser] = useState(false);
            const savedDrawings = useRef({});

            useEffect(() => {
                if (!activeSession || activeSession.status !== 'ACTIVE') return;
                const handleVis = () => { if (document.hidden) setActiveSession(prev => ({ ...prev, cheatWarnings: (prev.cheatWarnings || 0) + 1 })); };
                document.addEventListener('visibilitychange', handleVis);
                return () => document.removeEventListener('visibilitychange', handleVis);
            }, [activeSession?.status]);

            const examCurrentIndex = activeSession?.examCurrentIndex || 0;
            const examQuestions = activeSession?.sessionQuestions || activeQuestions;
            const currentQuestion = examQuestions[examCurrentIndex];
            
            const changeQuestion = (idx) => {
                if (canvasMode && canvasCtx && canvasRef.current) {
                    savedDrawings.current[currentQuestion.id] = canvasCtx.getImageData(0, 0, canvasRef.current.width, canvasRef.current.height);
                }
                setActiveSession(prev => ({ ...prev, examCurrentIndex: idx }));
            };
            
            useEffect(() => { triggerMathRender(); }, [examCurrentIndex]);

            useEffect(() => {
                if (canvasMode && canvasRef.current && currentQuestion) {
                    const canvas = canvasRef.current;
                    const container = canvas.parentElement;
                    canvas.width = container.offsetWidth;
                    canvas.height = container.offsetHeight;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    setCanvasCtx(ctx);

                    const saved = savedDrawings.current[currentQuestion.id];
                    if (saved && saved.width === canvas.width && saved.height === canvas.height) {
                        ctx.putImageData(saved, 0, 0);
                    }
                }
            }, [canvasMode, currentQuestion?.id]);

            const getCanvasCoords = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                }
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const startDraw = (e) => {
                if (!canvasCtx) return;
                const { x, y } = getCanvasCoords(e);
                canvasCtx.beginPath(); canvasCtx.moveTo(x, y); setIsDrawing(true);
            };

            const doDraw = (e) => {
                if (!isDrawing || !canvasCtx) return;
                const { x, y } = getCanvasCoords(e);
                canvasCtx.lineTo(x, y);
                if (isEraser) {
                    canvasCtx.globalCompositeOperation = 'destination-out';
                    canvasCtx.lineWidth = 20;
                } else {
                    canvasCtx.globalCompositeOperation = 'source-over';
                    canvasCtx.strokeStyle = penColor;
                    canvasCtx.lineWidth = 3;
                }
                canvasCtx.stroke();
            };

            const stopDraw = () => {
                if (!canvasCtx) return;
                canvasCtx.closePath(); setIsDrawing(false);
            };

            const clearCanvas = () => {
                if (canvasCtx && canvasRef.current) {
                    canvasCtx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                    delete savedDrawings.current[currentQuestion.id];
                }
            };

            if (!activeSession || examQuestions.length === 0 || !currentQuestion) return <div className="min-h-screen flex items-center justify-center font-medium text-slate-500">Memuat soal...</div>;
            
            const currentAnswer = activeSession.answers[currentQuestion.id];
            const isFlagged = activeSession.flagged?.includes(currentQuestion.id);
            const diffColor = currentQuestion.difficulty === 'Mudah' ? 'text-success bg-success/10 border-success/20' : currentQuestion.difficulty === 'Sedang' ? 'text-secondary bg-secondary/10 border-secondary/20' : 'text-rose-600 bg-rose-100 border-rose-200';

            const handleAnswerChange = (val) => { setActiveSession(prev => ({ ...prev, answers: { ...prev.answers, [currentQuestion.id]: val } })); };

            return (
              <div className="min-h-screen bg-background flex flex-col prevent-select">
                <header className="bg-white shadow-sm border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-20">
                   <div className="flex items-center">
                      <div className="w-10 h-10 bg-primary/10 rounded-xl flex items-center justify-center text-primary mr-3"><Monitor size={20}/></div>
                      <div><h1 className="font-bold text-slate-800 leading-tight">Kelas Olimpiade</h1><p className="text-xs font-semibold text-slate-500">{activeSession.participant?.name} <span className="mx-1">•</span> {activeSession.participant?.jenis_soal || 'Utama'}</p></div>
                   </div>
                </header>
                
                <div className="flex-1 flex flex-col lg:flex-row max-w-7xl w-full mx-auto p-4 md:p-6 gap-6 relative">
                   <div className="flex-1 flex flex-col min-w-0 relative">
                      <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-10 flex-1 flex flex-col relative overflow-hidden">
                         
                         <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                            <h2 className="text-xl font-black text-slate-800">SOAL NO. {examCurrentIndex + 1}</h2>
                            <div className="flex gap-2">
                                <span className={`text-xs font-bold px-3 py-1.5 rounded-lg border uppercase tracking-wider ${diffColor}`}>{currentQuestion.difficulty || 'Sedang'}</span>
                                <span className="text-xs font-bold px-3 py-1.5 rounded-lg bg-slate-100 text-slate-500 border border-slate-200">{currentQuestion.type === 'MCQ' ? 'PG' : currentQuestion.type === 'SHORT_ANSWER' ? 'ISIAN' : 'URAIAN'}</span>
                            </div>
                         </div>
                         
                         <div className="flex-1 overflow-y-auto pb-4 relative" id="exam-scroll-area">
                            <div className="relative min-h-full">
                                <div className="text-lg text-slate-800 leading-relaxed font-medium mb-8 rich-text-content" dangerouslySetInnerHTML={{ __html: currentQuestion.question || '' }} />
                                
                                {currentQuestion.type === 'MCQ' && (
                                    <div className="space-y-3 relative z-10">
                                    {(currentQuestion.options||[]).map(opt => (
                                        <label key={opt.id} className={`flex items-start p-5 border-2 rounded-2xl transition-all ${canvasMode ? 'pointer-events-none' : 'cursor-pointer'} ${currentAnswer === opt.id ? 'border-primary bg-primary/5 shadow-md' : 'border-slate-100 hover:border-primary/30 hover:bg-slate-50'}`}>
                                            <div className="flex items-center h-6 mt-0.5"><input type="radio" checked={currentAnswer === opt.id} onChange={() => handleAnswerChange(opt.id)} className="w-5 h-5 accent-primary" disabled={canvasMode} /></div>
                                            <div className="ml-4 flex-1 flex text-slate-800"><span className="font-bold text-slate-400 w-8 mt-0.5">{opt.id}.</span><div className="flex-1 rich-text-content" dangerouslySetInnerHTML={{__html: opt.text}}></div></div>
                                        </label>
                                    ))}
                                    </div>
                                )}

                                {currentQuestion.type === 'SHORT_ANSWER' && (
                                    <div className="mt-6 relative z-10">
                                        <input type="text" value={currentAnswer || ''} onChange={e => handleAnswerChange(e.target.value)} disabled={canvasMode} className="w-full p-5 border-2 border-slate-200 rounded-2xl focus:border-primary focus:ring-4 focus:ring-primary/10 text-lg font-bold text-slate-800 outline-none transition-all disabled:opacity-50" placeholder="Ketik jawaban Anda di sini..." />
                                    </div>
                                )}

                                {currentQuestion.type === 'ESSAY' && (
                                    <div className="mt-6 relative z-10">
                                        <textarea value={currentAnswer || ''} onChange={e => handleAnswerChange(e.target.value)} disabled={canvasMode} rows="6" className="w-full p-5 border-2 border-slate-200 rounded-2xl focus:border-primary focus:ring-4 focus:ring-primary/10 text-base font-medium text-slate-800 outline-none transition-all resize-none disabled:opacity-50" placeholder="Ketik uraian jawaban secara rinci..."></textarea>
                                    </div>
                                )}

                                {/* LAYER CANVAS CORETAN */}
                                {canvasMode && (
                                    <div className="absolute inset-0 z-30 bg-slate-800/5 cursor-crosshair rounded-xl">
                                        <canvas 
                                            ref={canvasRef}
                                            className="w-full h-full touch-none"
                                            onMouseDown={startDraw} onMouseMove={doDraw} onMouseUp={stopDraw} onMouseLeave={stopDraw}
                                            onTouchStart={startDraw} onTouchMove={doDraw} onTouchEnd={stopDraw}
                                        />
                                    </div>
                                )}
                            </div>
                         </div>

                         {/* FLOATING CANVAS TOOLBAR */}
                         {canvasMode && (
                             <div className="absolute top-20 right-8 z-40 bg-white shadow-xl rounded-2xl p-2 flex flex-col gap-2 border border-slate-200 animate-fade-in">
                                 <button onClick={() => {setIsEraser(false); setPenColor('#0F4C81');}} className={`w-10 h-10 rounded-xl flex items-center justify-center ${!isEraser && penColor==='#0F4C81' ? 'bg-primary/20 text-primary ring-2 ring-primary' : 'hover:bg-slate-100 text-primary'}`} title="Tinta Biru"><i className="fas fa-circle text-[10px]"></i></button>
                                 <button onClick={() => {setIsEraser(false); setPenColor('#E11D48');}} className={`w-10 h-10 rounded-xl flex items-center justify-center ${!isEraser && penColor==='#E11D48' ? 'bg-rose-100 text-rose-600 ring-2 ring-rose-600' : 'hover:bg-slate-100 text-rose-600'}`} title="Tinta Merah"><i className="fas fa-circle text-[10px]"></i></button>
                                 <div className="w-full h-px bg-slate-200 my-1"></div>
                                 <button onClick={() => setIsEraser(true)} className={`w-10 h-10 rounded-xl flex items-center justify-center ${isEraser ? 'bg-slate-200 text-slate-800 ring-2 ring-slate-800' : 'hover:bg-slate-100 text-slate-500'}`} title="Penghapus"><i className="fas fa-eraser"></i></button>
                                 <button onClick={clearCanvas} className="w-10 h-10 rounded-xl flex items-center justify-center hover:bg-rose-50 text-rose-500" title="Hapus Semua"><i className="fas fa-trash-alt"></i></button>
                             </div>
                         )}

                         <div className="pt-6 mt-4 border-t border-slate-100 flex flex-wrap justify-between items-center gap-3 relative z-40">
                            <div className="flex gap-2 w-full sm:w-auto">
                                <button onClick={() => changeQuestion(Math.max(0, examCurrentIndex - 1))} disabled={examCurrentIndex === 0} className="px-5 py-3 bg-slate-100 text-slate-600 rounded-xl disabled:opacity-50 font-bold hover:bg-slate-200 transition-colors"><ChevronLeft size={18} className="inline -mt-1 mr-1" /> Sebelum</button>
                                <button onClick={() => {
                                    if (canvasMode && canvasCtx && canvasRef.current) {
                                        savedDrawings.current[currentQuestion.id] = canvasCtx.getImageData(0, 0, canvasRef.current.width, canvasRef.current.height);
                                    }
                                    setCanvasMode(!canvasMode);
                                }} className={`px-5 py-3 rounded-xl font-bold flex items-center transition-colors border ${canvasMode ? 'bg-primary text-white border-primary shadow-lg' : 'bg-white text-primary border-primary/30 hover:bg-primary/5'}`}>
                                    <i className={`fas ${canvasMode ? 'fa-times' : 'fa-pen-nib'} mr-2`}></i> {canvasMode ? 'Tutup Coretan' : 'Kertas Coretan'}
                                </button>
                            </div>
                            <div className="flex gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                                <label className={`flex-1 sm:flex-none flex items-center justify-center px-5 py-3 rounded-xl font-bold cursor-pointer transition-colors ${isFlagged ? 'bg-secondary/20 text-secondary-700' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'}`}>
                                   <input type="checkbox" checked={isFlagged} onChange={() => setActiveSession(prev => ({ ...prev, flagged: isFlagged ? prev.flagged.filter(id => id !== currentQuestion.id) : [...(prev.flagged || []), currentQuestion.id] }))} className="mr-2 w-5 h-5 accent-secondary rounded" /> Ragu
                                </label>
                                {examCurrentIndex < examQuestions.length - 1 ? (
                                   <button onClick={() => changeQuestion(examCurrentIndex + 1)} className="flex-1 sm:flex-none px-8 py-3 bg-primary text-white font-black rounded-xl hover:bg-primary-700 shadow-lg shadow-primary/30 transition-all">Lanjut</button>
                                ) : (
                                   <button onClick={() => navigate('/review')} className="flex-1 sm:flex-none px-8 py-3 bg-success text-white font-black rounded-xl hover:bg-success-600 shadow-lg shadow-success/30 transition-all">Selesai</button>
                                )}
                            </div>
                         </div>
                      </div>
                   </div>
                   
                   <div className="lg:w-80 w-full flex-shrink-0">
                      <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sticky top-24">
                         <h3 className="text-sm font-black tracking-widest text-slate-400 mb-4 uppercase border-b pb-3">Navigasi Soal</h3>
                         <div className="grid grid-cols-5 gap-2 max-h-[50vh] overflow-y-auto pr-1">
                            {examQuestions.map((q, idx) => {
                               const isAns = activeSession.answers[q.id] && String(activeSession.answers[q.id]).trim() !== '';
                               const isCur = idx === examCurrentIndex;
                               const isFlg = activeSession.flagged?.includes(q.id);
                               let cls = "h-11 w-full rounded-xl font-bold text-sm flex items-center justify-center transition-all cursor-pointer ";
                               if (isCur) cls += "ring-4 ring-primary/30 bg-primary text-white";
                               else if (isFlg) cls += "bg-secondary text-white shadow-sm";
                               else if (isAns) cls += "bg-success/20 text-success-700 font-black";
                               else cls += "bg-slate-100 text-slate-400 hover:bg-slate-200";
                               return <button key={q.id} onClick={() => changeQuestion(idx)} className={cls}>{idx + 1}</button>;
                            })}
                         </div>
                         <button onClick={() => navigate('/review')} className="w-full mt-6 py-3 border-2 border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 transition-colors">Kumpulkan Ujian</button>
                      </div>
                   </div>
                </div>
              </div>
            );
          };

          const ExamReview = () => {
             const [isSubmitting, setIsSubmitting] = useState(false);
             const [showConfirm, setShowConfirm] = useState(false);
             const { showAlert } = useContext(DialogContext);

             if (!activeSession || activeSession.status !== 'ACTIVE') { navigate('/'); return null; }

             const examQuestions = activeSession?.sessionQuestions || activeQuestions;
             const ansQ = examQuestions.filter(q => activeSession.answers[q.id] && String(activeSession.answers[q.id]).trim() !== '').length;

             const handleFinalSubmit = async () => {
               setIsSubmitting(true);
               const result = calculateScore(activeSession.answers, examQuestions);
               const summary = {
                   ito: result.ito,
                   correctMudah: result.correctMudah, correctSedang: result.correctSedang, correctSulit: result.correctSulit,
                   totalMudah: result.totalMudah, totalSedang: result.totalSedang, totalSulit: result.totalSulit,
                   masteryMudah: result.masteryMudah, masterySedang: result.masterySedang, masterySulit: result.masterySulit
               };
               const finalDetailedResults = [...result.detailedResults, { qId: 'SYS_CHEATS', cheatCount: activeSession.cheatWarnings || 0 }];
               const payload = {
                  participant_name: activeSession.participant.name, participant_school: activeSession.participant.school,
                  participant_nis: activeSession.participant.nis, participant_grade: activeSession.participant.grade,
                  token: activeSession.token, score: result.finalScore, start_time: activeSession.startTime,
                  end_time: new Date().getTime(), detailed_results: JSON.stringify({ summary, detailedResults: finalDetailedResults })
               };
               try {
                 const db = await getSupabase();
                 await db.from('results').insert([payload]);
                 setActiveSession({ ...activeSession, status: 'SUBMITTED', score: result.finalScore, submittedResult: { summary, detailedResults: finalDetailedResults } });
                 navigate('/dashboard');
               } catch (err) { 
                 await showAlert("Gagal mengirim ujian: " + err.message); 
                 setIsSubmitting(false); setShowConfirm(false); 
               }
             };

             return (
               <div className="min-h-screen bg-background flex justify-center items-center p-4">
                   <div className="bg-white p-8 md:p-10 rounded-3xl shadow-2xl max-w-lg w-full text-center border-t-[8px] border-primary animate-fade-in">
                      <h2 className="text-2xl font-black mb-8 text-slate-800">Review Ujian</h2>
                      <div className="grid grid-cols-2 gap-4 mb-8">
                         <div className="p-6 bg-slate-50 rounded-2xl"><p className="text-slate-400 font-bold text-xs uppercase tracking-wider mb-2">Total Soal</p><p className="text-5xl font-black text-slate-800">{examQuestions.length}</p></div>
                         <div className="p-6 bg-success/10 rounded-2xl"><p className="text-success-700 font-bold text-xs uppercase tracking-wider mb-2">Terjawab</p><p className="text-5xl font-black text-success">{ansQ}</p></div>
                      </div>
                      {!showConfirm ? (
                         <div className="flex gap-4">
                            <button onClick={()=>navigate('/exam')} className="flex-1 py-4 bg-slate-100 rounded-xl font-bold text-slate-600 hover:bg-slate-200">Kembali</button>
                            <button onClick={()=>setShowConfirm(true)} className="flex-1 py-4 bg-primary text-white rounded-xl font-black shadow-lg hover:bg-primary-700">Kirim Ujian</button>
                         </div>
                      ) : (
                         <div className="p-6 bg-rose-50 rounded-2xl border border-rose-100 animate-fade-in">
                            <p className="font-bold text-rose-600 mb-4">Anda yakin ingin mengumpulkan? Jawaban tidak bisa diubah lagi.</p>
                            <div className="flex gap-3">
                               <button onClick={()=>setShowConfirm(false)} className="flex-1 py-3 bg-white border border-rose-200 rounded-xl font-bold text-slate-600 hover:bg-slate-50">Batal</button>
                               <button onClick={handleFinalSubmit} disabled={isSubmitting} className="flex-1 py-3 bg-rose-600 text-white rounded-xl font-black shadow-md disabled:opacity-50">{isSubmitting ? 'Mengirim...' : 'Ya, Kirim'}</button>
                            </div>
                         </div>
                      )}
                   </div>
               </div>
             );
          };

          const StudentDashboard = () => {
              const [leaderboard, setLeaderboard] = useState([]);
              const [loading, setLoading] = useState(true);

              useEffect(() => {
                  const fetchResults = async () => {
                      try {
                          const db = await getSupabase();
                          const { data } = await db.from('results').select('*');
                          if (data) {
                              const formatted = data.map(r => ({
                                  id: r.id, participant: { name: r.participant_name, school: r.participant_school },
                                  score: r.score, startTime: parseInt(r.start_time), endTime: parseInt(r.end_time),
                                  detail: typeof r.detailed_results === 'string' ? JSON.parse(r.detailed_results) : r.detailed_results
                              }));
                              formatted.sort(compareResults);
                              setLeaderboard(formatted);
                          }
                      } catch(e) { } setLoading(false);
                  };
                  fetchResults();
              }, []);

              const mySession = activeSession;
              if (!mySession || mySession.status !== 'SUBMITTED') { navigate('/'); return null; }
              
              const summary = mySession.submittedResult?.summary || {};
              const myRank = leaderboard.findIndex(r => r.participant.name === mySession.participant.name && r.score === mySession.score) + 1;

              return (
                  <div className="min-h-screen bg-background p-4 sm:p-8">
                      <div className="max-w-5xl mx-auto animate-fade-in">
                          <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                              <div>
                                  <h1 className="text-2xl font-black text-primary">Dashboard Prestasi</h1>
                                  <p className="text-slate-500 font-medium mt-1"><i className="fas fa-user-circle mr-1"></i> {mySession.participant.name} ({mySession.participant.school})</p>
                              </div>
                              <button onClick={() => { setActiveSession(null); navigate('/'); }} className="bg-slate-100 px-5 py-2.5 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition-colors">Keluar Pintu Utama</button>
                          </header>

                          <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                              <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 flex flex-col justify-center items-center text-center">
                                  <span className="text-slate-400 font-black text-xs mb-3 uppercase tracking-widest border-b-2 border-slate-100 pb-2">Skor Total</span>
                                  <span className="text-6xl font-black text-primary">{mySession.score}</span>
                              </div>
                              <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 flex flex-col justify-center items-center text-center relative overflow-hidden">
                                  <div className="absolute top-0 right-0 p-4 opacity-10"><i className="fas fa-trophy text-6xl text-secondary"></i></div>
                                  <span className="text-slate-400 font-black text-xs mb-3 uppercase tracking-widest border-b-2 border-slate-100 pb-2">Peringkat Sementara</span>
                                  <span className="text-6xl font-black text-secondary">{loading ? '...' : `#${myRank > 0 ? myRank : '-'}`}</span>
                              </div>
                              <div className="bg-gradient-to-br from-primary to-primary-700 p-8 rounded-3xl shadow-xl flex flex-col justify-center items-center text-center col-span-1 md:col-span-2 text-white relative overflow-hidden">
                                  <div className="absolute -bottom-6 -right-6 opacity-20"><i className="fas fa-medal text-9xl"></i></div>
                                  <span className="text-primary-100 font-black text-sm mb-2 uppercase tracking-widest z-10">Indeks Talenta Olimpiade (ITO)</span>
                                  <div className="flex items-baseline gap-2 z-10 my-2">
                                      <span className="text-7xl font-black tracking-tighter">{summary.ito || 0}</span>
                                      <span className="text-xl font-bold text-primary-200">/100</span>
                                  </div>
                                  <span className="z-10 mt-2 bg-white/20 backdrop-blur-sm px-5 py-2 rounded-xl text-sm font-bold border border-white/30 shadow-sm">{getITOCategory(summary.ito || 0)}</span>
                              </div>
                          </div>

                          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                              <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                  <h3 className="font-black text-slate-800 mb-6 text-lg">Peta Kekuatan Jawaban</h3>
                                  <div className="space-y-6">
                                      <div className="flex items-center">
                                          <div className="w-24 text-sm font-bold text-slate-500 uppercase tracking-wider">Mudah</div>
                                          <div className="flex-1 bg-slate-100 h-4 rounded-full overflow-hidden mx-4 shadow-inner">
                                              <div className="bg-success h-full rounded-full transition-all duration-1000" style={{width: `${summary.masteryMudah || 0}%`}}></div>
                                          </div>
                                          <div className="w-16 text-right font-black text-slate-700">{summary.correctMudah || 0} <span className="text-xs font-medium text-slate-400">/ {summary.totalMudah || 0}</span></div>
                                      </div>
                                      <div className="flex items-center">
                                          <div className="w-24 text-sm font-bold text-slate-500 uppercase tracking-wider">Sedang</div>
                                          <div className="flex-1 bg-slate-100 h-4 rounded-full overflow-hidden mx-4 shadow-inner">
                                              <div className="bg-secondary h-full rounded-full transition-all duration-1000" style={{width: `${summary.masterySedang || 0}%`}}></div>
                                          </div>
                                          <div className="w-16 text-right font-black text-slate-700">{summary.correctSedang || 0} <span className="text-xs font-medium text-slate-400">/ {summary.totalSedang || 0}</span></div>
                                      </div>
                                      <div className="flex items-center">
                                          <div className="w-24 text-sm font-bold text-slate-500 uppercase tracking-wider">Sulit</div>
                                          <div className="flex-1 bg-slate-100 h-4 rounded-full overflow-hidden mx-4 shadow-inner">
                                              <div className="bg-rose-500 h-full rounded-full transition-all duration-1000" style={{width: `${summary.masterySulit || 0}%`}}></div>
                                          </div>
                                          <div className="w-16 text-right font-black text-slate-700">{summary.correctSulit || 0} <span className="text-xs font-medium text-slate-400">/ {summary.totalSulit || 0}</span></div>
                                      </div>
                                  </div>
                              </div>

                              <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                  <h3 className="font-black text-slate-800 mb-6 text-lg">Grafik Penguasaan Tingkat Soal</h3>
                                  <div className="h-40 flex items-end justify-between gap-6 px-4">
                                      <div className="flex-1 flex flex-col items-center group">
                                          <div className="w-full max-w-[60px] bg-success/20 hover:bg-success/40 transition-all rounded-t-xl relative flex justify-center border-t-4 border-success duration-1000" style={{height: `${summary.masteryMudah || 0}%`, minHeight: '15%'}}>
                                              <span className="absolute -top-7 text-xs font-black text-success bg-success/10 px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity">{Math.round(summary.masteryMudah || 0)}%</span>
                                          </div>
                                          <div className="mt-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Mudah</div>
                                      </div>
                                      <div className="flex-1 flex flex-col items-center group">
                                          <div className="w-full max-w-[60px] bg-secondary/20 hover:bg-secondary/40 transition-all rounded-t-xl relative flex justify-center border-t-4 border-secondary duration-1000" style={{height: `${summary.masterySedang || 0}%`, minHeight: '15%'}}>
                                              <span className="absolute -top-7 text-xs font-black text-secondary bg-secondary/10 px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity">{Math.round(summary.masterySedang || 0)}%</span>
                                          </div>
                                          <div className="mt-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Sedang</div>
                                      </div>
                                      <div className="flex-1 flex flex-col items-center group">
                                          <div className="w-full max-w-[60px] bg-rose-500/20 hover:bg-rose-500/40 transition-all rounded-t-xl relative flex justify-center border-t-4 border-rose-500 duration-1000" style={{height: `${summary.masterySulit || 0}%`, minHeight: '15%'}}>
                                              <span className="absolute -top-7 text-xs font-black text-rose-600 bg-rose-100 px-2 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity">{Math.round(summary.masterySulit || 0)}%</span>
                                          </div>
                                          <div className="mt-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Sulit</div>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
              );
          };

          const AdminLogin = () => {
            const [u, setU] = useState(''); const [p, setP] = useState('');
            const { showAlert } = useContext(DialogContext);

            const handleLogin = async (e) => {
                e.preventDefault(); 
                if(u==='admin' && p==='bismillah') {
                    setIsAdminLoggedIn(true); 
                    navigate('/admin/dashboard');
                } else {
                    await showAlert('Username atau Password Salah');
                }
            };

            return (
              <div className="min-h-screen bg-slate-900 flex justify-center items-center p-4">
                <form onSubmit={handleLogin} className="bg-white p-10 rounded-3xl max-w-sm w-full shadow-2xl border-t-[8px] border-primary animate-fade-in">
                   <div className="text-center mb-8"><div className="w-16 h-16 bg-primary/10 text-primary rounded-2xl flex items-center justify-center mx-auto mb-4"><Settings size={30}/></div><h1 className="text-2xl font-black text-slate-800 tracking-tight">Admin Area</h1></div>
                   <input type="text" placeholder="Username" value={u} onChange={e=>setU(e.target.value)} className="w-full p-4 border-2 border-slate-200 rounded-xl mb-4 font-bold text-slate-800 focus:border-primary outline-none transition-colors" required/>
                   <input type="password" placeholder="Password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-4 border-2 border-slate-200 rounded-xl mb-8 font-bold text-slate-800 focus:border-primary outline-none transition-colors" required/>
                   <button type="submit" className="w-full py-4 bg-primary text-white font-black rounded-xl hover:bg-primary-700 shadow-lg transition-all">Akses Sistem</button>
                   <button type="button" onClick={()=>navigate('/')} className="w-full mt-6 text-sm text-slate-400 font-bold hover:text-slate-600 transition-colors">Kembali ke Depan</button>
                </form>
              </div>
            );
          };

          const AdminLayout = ({ children, title }) => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            if (!isAdminLoggedIn) { navigate('/admin/login'); return null; }
            const menu = [
              { id: 'dashboard', label: 'Dashboard Utama', icon: LayoutDashboard, path: '/admin/dashboard' },
              { id: 'questions', label: 'Manajemen Soal', icon: Database, path: '/admin/questions' },
              { id: 'tokens', label: 'Daftar Peserta', icon: User, path: '/admin/tokens' },
              { id: 'results', label: 'Hasil & Ranking', icon: CheckSquare, path: '/admin/results' },
              { id: 'analysis', label: 'Analisis Soal', icon: BarChart2, path: '/admin/analysis' },
              { id: 'reports', label: 'Cetak Laporan', icon: Printer, path: '/admin/reports' }
            ];
            return (
              <div className="min-h-screen bg-background flex print:block font-sans">
                {isMobileMenuOpen && <div className="fixed inset-0 bg-slate-900/60 z-40 lg:hidden backdrop-blur-sm" onClick={() => setIsMobileMenuOpen(false)} />}
                <div className={`fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-200 flex flex-col transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} lg:relative lg:translate-x-0 transition-transform shadow-xl lg:shadow-none`}>
                  <div className="p-8 flex items-center justify-between"><div className="flex items-center"><div className="w-10 h-10 bg-primary text-white rounded-xl flex items-center justify-center mr-3 shadow-md"><Settings size={20}/></div><span className="text-slate-800 font-black text-xl tracking-tight">Olimpiade</span></div></div>
                  <nav className="flex-1 py-4 space-y-2 px-4">
                      {menu.map(m => {
                          const isActive = currentRoute.startsWith(m.path);
                          return <button key={m.id} onClick={() => { setIsMobileMenuOpen(false); navigate(m.path); }} className={`w-full flex items-center px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${isActive ? 'bg-primary/10 text-primary' : 'text-slate-500 hover:bg-slate-50'}`}><m.icon size={18} className={`mr-3 ${isActive ? 'text-primary' : 'text-slate-400'}`}/> {m.label}</button>
                      })}
                  </nav>
                  <div className="p-6 border-t border-slate-100"><button onClick={() => { setIsAdminLoggedIn(false); navigate('/admin/login'); }} className="w-full flex items-center justify-center px-4 py-3 font-bold text-slate-500 bg-slate-50 hover:bg-rose-50 hover:text-rose-600 rounded-xl transition-colors"><LogOut size={16} className="mr-2"/> Keluar Sistem</button></div>
                </div>
                <div className="flex-1 flex flex-col h-screen overflow-hidden print:h-auto print:block">
                  <header className="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10 print:hidden">
                    <div className="flex items-center gap-4"><button className="lg:hidden text-slate-400 hover:text-slate-800" onClick={() => setIsMobileMenuOpen(true)}><Menu size={24}/></button><h2 className="text-2xl font-black text-slate-800 tracking-tight">{title}</h2></div>
                    <span className="text-xs font-bold px-3 py-1.5 bg-success/10 text-success border border-success/20 rounded-lg flex items-center shadow-sm"><Cloud size={14} className="mr-1.5"/> Online</span>
                  </header>
                  <main className="flex-1 overflow-y-auto p-6 lg:p-8 print:p-0 bg-background">{children}</main>
                </div>
              </div>
            );
          };

          const AdminDashboard = () => {
             const [tempOrganizer, setTempOrganizer] = useState(organizerName);
             const [tempLogo, setTempLogo] = useState(schoolLogo);
             const [tempDate, setTempDate] = useState(examDate);
             const [tempStartTime, setTempStartTime] = useState(startTimeStr);
             const [tempEndTime, setTempEndTime] = useState(endTimeStr);
             const [tempRandomQ, setTempRandomQ] = useState(isRandomQ);
             const [tempRandomOpt, setTempRandomOpt] = useState(isRandomOpt);
             const [tempFolders, setTempFolders] = useState([]);
             const [isSaving, setIsSaving] = useState(false);
             const { showAlert } = useContext(DialogContext);

             useEffect(() => {
                 if (activeFolder) setTempFolders(activeFolder.split(',').map(f => f.trim()));
             }, [activeFolder]);

             const availableFolders = [...new Set([...questions.map(q => q.folder || 'Utama'), ...tokens.filter(t => t.code && t.code.startsWith('SYS_FOLDER_')).map(t => t.status), 'Utama'])];

             const toggleFolder = (f) => {
                 if (tempFolders.includes(f)) setTempFolders(tempFolders.filter(x => x !== f));
                 else setTempFolders([...tempFolders, f]);
             };

             const handleLogoUpload = (e) => {
                 const file = e.target.files[0];
                 if (file) {
                     const reader = new FileReader();
                     reader.onloadend = () => setTempLogo(reader.result);
                     reader.readAsDataURL(file);
                 }
             };

             const saveSettings = async () => {
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const upsertSetting = async (code, val) => {
                        const { data } = await db.from('tokens').select('code').eq('code', code).maybeSingle();
                        if (data) await db.from('tokens').update({ status: val }).eq('code', code);
                        else await db.from('tokens').insert([{ code, status: val, generatedAt: new Date().toISOString() }]);
                    };
                    await Promise.all([ 
                        upsertSetting('SYS_SETTING_ORGANIZER', tempOrganizer), 
                        upsertSetting('SYS_SETTING_LOGO', tempLogo),
                        upsertSetting('SYS_SETTING_DATE', tempDate),
                        upsertSetting('SYS_SETTING_START_TIME', tempStartTime),
                        upsertSetting('SYS_SETTING_END_TIME', tempEndTime),
                        upsertSetting('SYS_SETTING_RANDOM_Q', tempRandomQ ? 'TRUE' : 'FALSE'),
                        upsertSetting('SYS_SETTING_RANDOM_OPT', tempRandomOpt ? 'TRUE' : 'FALSE'),
                        upsertSetting('SYS_SETTING_FOLDER', tempFolders.join(', '))
                    ]);
                    
                    setOrganizerName(tempOrganizer); 
                    setSchoolLogo(tempLogo); 
                    setExamDate(tempDate); 
                    setStartTimeStr(tempStartTime); 
                    setEndTimeStr(tempEndTime);
                    setIsRandomQ(tempRandomQ); 
                    setIsRandomOpt(tempRandomOpt);
                    setActiveFolder(tempFolders.join(', '));
                    
                    await showAlert("Pengaturan berhasil disimpan!");
                } catch(e) { await showAlert("Gagal: " + e.message); }
                setIsSaving(false);
             };

             const top10 = [...results].sort(compareResults).slice(0, 10);
             const osnCandidates = [...results].filter(r => (r.detail?.summary?.ito || 0) >= 70).sort((a,b) => (b.detail?.summary?.ito || 0) - (a.detail?.summary?.ito || 0));

             const renderDistributionChart = () => {
                 const ranges = { '< 50': 0, '50-69': 0, '70-84': 0, '85-100': 0 };
                 results.forEach(r => {
                     if(r.score < 50) ranges['< 50']++; else if(r.score < 70) ranges['50-69']++; else if(r.score < 85) ranges['70-84']++; else ranges['85-100']++;
                 });
                 const max = Math.max(...Object.values(ranges), 1);
                 return Object.entries(ranges).map(([label, count], i) => (
                     <div key={i} className="flex-1 flex flex-col items-center group">
                         <div className="w-full max-w-[40px] bg-primary/20 hover:bg-primary/40 transition-colors rounded-t-lg flex justify-center relative border-t-2 border-primary" style={{ height: `${(count/max)*100}%`, minHeight: '15%' }}>
                             <span className="absolute -top-7 text-[10px] font-black text-primary bg-primary/10 px-2 py-0.5 rounded opacity-0 group-hover:opacity-100">{count}</span>
                         </div>
                         <span className="mt-2 text-[10px] font-bold text-slate-500">{label}</span>
                     </div>
                 ));
             };

             const renderDifficultyAnalysis = () => {
                 if(results.length === 0) return <div className="text-slate-400 font-medium py-4 text-center text-sm">Belum ada data.</div>;
                 let sumE = 0, sumM = 0, sumH = 0;
                 results.forEach(r => { sumE += r.detail?.summary?.masteryMudah || 0; sumM += r.detail?.summary?.masterySedang || 0; sumH += r.detail?.summary?.masterySulit || 0; });
                 const avgE = sumE / results.length; const avgM = sumM / results.length; const avgH = sumH / results.length;
                 return (
                     <div className="space-y-4">
                         <div>
                             <div className="flex justify-between text-xs font-bold text-slate-500 uppercase tracking-wider mb-1"><span>Mudah</span><span className="text-success">{avgE.toFixed(1)}%</span></div>
                             <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden shadow-inner"><div className="bg-success h-full rounded-full" style={{width:`${avgE}%`}}></div></div>
                         </div>
                         <div>
                             <div className="flex justify-between text-xs font-bold text-slate-500 uppercase tracking-wider mb-1"><span>Sedang</span><span className="text-secondary">{avgM.toFixed(1)}%</span></div>
                             <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden shadow-inner"><div className="bg-secondary h-full rounded-full" style={{width:`${avgM}%`}}></div></div>
                         </div>
                         <div>
                             <div className="flex justify-between text-xs font-bold text-slate-500 uppercase tracking-wider mb-1"><span>Sulit</span><span className="text-rose-500">{avgH.toFixed(1)}%</span></div>
                             <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden shadow-inner"><div className="bg-rose-500 h-full rounded-full" style={{width:`${avgH}%`}}></div></div>
                         </div>
                     </div>
                 );
             };

             return (
                <AdminLayout title="Overview Sistem">
                    {/* Tampilan Kompak Pengaturan Penerbitan */}
                    <div className="bg-primary/5 p-5 md:p-6 rounded-2xl border border-primary/20 mb-6 animate-fade-in shadow-sm">
                        <h3 className="font-black text-primary-800 mb-4 flex items-center text-base border-b border-primary/10 pb-3">
                            <i className="fas fa-sliders-h mr-3 text-primary"></i> Pengaturan Penerbitan Ujian
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Penyelenggara</label>
                                <input type="text" value={tempOrganizer} onChange={e=>setTempOrganizer(e.target.value)} className="w-full p-2.5 border-2 border-slate-200 rounded-xl bg-white text-sm font-bold text-slate-800 focus:border-primary outline-none transition-colors" placeholder="Nama Sekolah / Institusi"/>
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Logo Sekolah</label>
                                <div className="flex items-center gap-2">
                                    {tempLogo && <img src={tempLogo} alt="Logo" className="w-10 h-10 object-contain rounded-lg border border-slate-200 bg-white"/>}
                                    <input type="file" accept="image/*" onChange={handleLogoUpload} className="w-full p-2 border-2 border-slate-200 rounded-xl bg-white text-xs font-medium focus:border-primary outline-none file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:font-bold file:bg-primary/10 file:text-primary hover:file:bg-primary/20 cursor-pointer"/>
                                </div>
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Tanggal Ujian</label>
                                <input type="date" value={tempDate} onChange={e=>setTempDate(e.target.value)} className="w-full p-2.5 border-2 border-slate-200 rounded-xl bg-white text-sm font-bold text-slate-800 focus:border-primary outline-none transition-colors cursor-pointer"/>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Jam Mulai</label>
                                    <input type="time" value={tempStartTime} onChange={e=>setTempStartTime(e.target.value)} className="w-full p-2.5 border-2 border-slate-200 rounded-xl bg-white text-sm font-bold text-slate-800 focus:border-primary outline-none transition-colors cursor-pointer"/>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Jam Selesai</label>
                                    <input type="time" value={tempEndTime} onChange={e=>setTempEndTime(e.target.value)} className="w-full p-2.5 border-2 border-slate-200 rounded-xl bg-white text-sm font-bold text-slate-800 focus:border-primary outline-none transition-colors cursor-pointer"/>
                                </div>
                            </div>
                            <div className="md:col-span-2 mt-2">
                                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Folder Soal yang Diterbitkan <span className="text-primary font-medium lowercase">(Centang lebih dari satu untuk menggabungkan soal)</span></label>
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
                                    {availableFolders.map(f => (
                                        <label key={f} className={`flex items-center p-2.5 border-2 rounded-xl cursor-pointer transition-all ${tempFolders.includes(f) ? 'border-primary bg-primary/5 shadow-sm' : 'border-slate-100 hover:border-primary/30 hover:bg-slate-50'}`}>
                                            <input type="checkbox" checked={tempFolders.includes(f)} onChange={() => toggleFolder(f)} className="mr-2.5 w-4 h-4 accent-primary" />
                                            <span className="font-bold text-slate-700 text-xs truncate" title={f}>{f}</span>
                                        </label>
                                    ))}
                                    {availableFolders.length === 0 && <span className="text-slate-400 text-xs font-medium p-2">Belum ada folder soal terdeteksi.</span>}
                                </div>
                            </div>
                            <div className="md:col-span-2 flex flex-col sm:flex-row flex-wrap gap-4 items-center justify-between p-4 bg-white rounded-2xl border border-slate-100 shadow-sm">
                                <div className="flex flex-wrap gap-4">
                                    <label className="flex items-center cursor-pointer">
                                        <input type="checkbox" checked={tempRandomQ} onChange={e=>setTempRandomQ(e.target.checked)} className="w-4 h-4 accent-primary mr-2 rounded"/>
                                        <span className="font-bold text-slate-700 text-sm">Acak Urutan Soal</span>
                                    </label>
                                    <label className="flex items-center cursor-pointer">
