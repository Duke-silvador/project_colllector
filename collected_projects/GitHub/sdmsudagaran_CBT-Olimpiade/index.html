                                            <select value={formData.difficulty || 'Sedang'} onChange={e => handleDifficultyChange(e.target.value)} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white font-bold text-slate-800 focus:border-primary outline-none transition-colors cursor-pointer">
                                                <option value="Mudah">Mudah</option><option value="Sedang">Sedang</option><option value="Sulit">Sulit</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Bobot Poin / Skor</label>
                                            <input type="number" step="0.1" value={formData.points !== undefined ? formData.points : 1} onChange={e => setFormData({...formData, points: parseFloat(e.target.value)})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white font-black text-primary focus:border-primary outline-none transition-colors text-center" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-black text-slate-800 mb-3 border-b-2 border-slate-100 pb-2">Pertanyaan Utama</label>
                                        <RichTextEditor value={formData.question} onChange={val => setFormData({...formData, question: val})} />
                                    </div>

                                    {formData.type === 'MCQ' && (
                                        <div className="space-y-6">
                                            <h3 className="font-black text-slate-800 border-b-2 border-slate-100 pb-2">Opsi Jawaban (A-D)</h3>
                                            {formData.options.map((opt, idx) => (
                                                <div key={opt.id} className="flex gap-4 items-start bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                    <span className="font-black w-8 pt-4 text-2xl text-slate-400 text-center">{opt.id}.</span>
                                                    <div className="flex-1"><RichTextEditor minHeight="60px" value={opt.text} onChange={val => { const o = [...formData.options]; o[idx].text = val; setFormData({...formData, options: o}); }} /></div>
                                                </div>
                                            ))}
                                            <div className="bg-success/10 p-6 rounded-2xl border border-success/20 flex flex-col sm:flex-row items-center justify-between gap-4">
                                                <label className="font-black text-success-800 uppercase tracking-widest text-sm">Kunci Jawaban Benar:</label>
                                                <select value={formData.correctAnswer} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="p-3 border-2 border-success rounded-xl font-black text-success w-32 text-center bg-white outline-none cursor-pointer text-xl"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
                                            </div>
                                        </div>
                                    )}

                                    {formData.type === 'SHORT_ANSWER' && (
                                        <div className="space-y-6">
                                            <h3 className="font-black text-slate-800 border-b-2 border-slate-100 pb-2">Kunci Jawaban Singkat</h3>
                                            <div className="bg-success/10 p-6 rounded-2xl border border-success/20">
                                                <input type="text" value={formData.correctAnswer || ''} onChange={e => setFormData({...formData, correctAnswer: e.target.value})} className="w-full p-4 border-2 border-success rounded-xl font-bold text-success-800 bg-white outline-none" placeholder="Masukkan jawaban persis (angka atau teks pendek)" />
                                            </div>
                                        </div>
                                    )}

                                    {formData.type === 'ESSAY' && (
                                        <div className="space-y-6">
                                            <h3 className="font-black text-slate-800 border-b-2 border-slate-100 pb-2">Rubrik Penilaian / Kunci</h3>
                                            <div className="bg-secondary/10 p-6 rounded-2xl border border-secondary/20">
                                                <RichTextEditor minHeight="120px" value={formData.correctAnswer || ''} onChange={val => setFormData({...formData, correctAnswer: val})} placeholder="Masukkan kriteria penilaian..." />
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* TOMBOL SAVE DISATUKAN KE DALAM FORM AGAR SUBMIT BERJALAN */}
                                    <div className="flex justify-end gap-4 pt-8 mt-8 border-t border-slate-100">
                                        <button type="button" onClick={() => { setView('list'); setIsPreviewMode(false); }} className="px-8 py-4 bg-white border-2 border-slate-200 rounded-xl font-bold text-slate-600 hover:bg-slate-50 transition-colors">Batal</button>
                                        <button type="submit" disabled={isSaving || isPreviewMode} className="px-10 py-4 bg-primary text-white rounded-xl font-black shadow-lg hover:bg-primary-700 disabled:opacity-50 transition-all">{isSaving ? 'Menyimpan...' : 'Simpan Soal'}</button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                 </AdminLayout>
               );
            }

            if (view === 'list') {
              const folderQuestions = questions
                .filter(q => String(q.folder || 'Utama').trim().toLowerCase() === filterFolder.toLowerCase())
                .sort((a, b) => {
                    const timeA = parseInt((a.id.match(/\d+/) || [0])[0]);
                    const timeB = parseInt((b.id.match(/\d+/) || [0])[0]);
                    return timeA - timeB;
                });
                
              return (
                <AdminLayout title={`Folder: ${filterFolder}`}>
                  <div className="mb-6 flex justify-between items-center gap-3 bg-white p-4 rounded-xl border shadow-sm">
                     <button onClick={() => setView('folders')} className="border px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center hover:bg-slate-50"><ChevronLeft size={16} className="mr-1"/> Kembali</button>
                     <button onClick={() => setShowPreview(!showPreview)} className={`border px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors ${showPreview ? 'bg-primary/10 text-primary border-primary/20' : 'hover:bg-slate-50 text-slate-600'}`}><Eye size={16} className="mr-2"/> {showPreview ? 'Tutup Preview Jawaban' : 'Tampilkan Jawaban'}</button>
                  </div>
                  <div className="space-y-4">
                    {folderQuestions.map((q, idx) => {
                       const qPoints = q.points !== undefined ? q.points : (q.difficulty === 'Mudah' ? 1.00 : q.difficulty === 'Sedang' ? 1.25 : 1.50);
                       return (
                       <div key={q.id} className="bg-white p-5 rounded-xl border shadow-sm flex flex-col sm:flex-row justify-between items-start gap-4">
                         <div className="flex-1 min-w-0">
                             <div className="flex items-center gap-2 mb-3">
                                 <span className="text-xs font-bold bg-primary/10 text-primary px-2.5 py-1 rounded-md">No. {idx+1}</span>
                                 <span className="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded uppercase tracking-wider">{q.type}</span>
                                 <span className="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded uppercase tracking-wider">{q.difficulty}</span>
                                 <span className="text-[10px] font-bold bg-secondary/10 text-secondary-700 px-2 py-1 rounded uppercase tracking-wider border border-secondary/20">Bobot: {qPoints} Poin</span>
                             </div>
                             <div className="text-slate-800 font-medium rich-text-content text-sm" dangerouslySetInnerHTML={{__html: q.question}}></div>
                             
                             {showPreview && (
                                 <div className="mt-4 pt-3 border-t border-slate-100">
                                     {q.type === 'MCQ' && (
                                         <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                             {(q.options||[]).map(o => (
                                                 <div key={o.id} className={`p-3 rounded-lg border text-sm flex items-start ${q.correctAnswer === o.id ? 'bg-success/10 border-success/30 text-success-800 font-bold' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                                                     <span className="mr-2">{o.id}.</span> <div dangerouslySetInnerHTML={{__html: o.text}}></div>
                                                 </div>
                                             ))}
                                         </div>
                                     )}
                                     {q.type === 'SHORT_ANSWER' && (
                                         <div className="p-3 rounded-lg bg-success/10 border border-success/30 text-sm">
                                             <strong className="text-success-800 block text-xs mb-1 uppercase tracking-wider">Kunci Jawaban Singkat:</strong>
                                             <div className="font-bold text-success-900">{q.correctAnswer}</div>
                                         </div>
                                     )}
                                     {q.type === 'ESSAY' && (
                                         <div className="p-3 rounded-lg bg-secondary/10 border border-secondary/30 text-sm">
                                             <strong className="text-secondary-800 block text-xs mb-1 uppercase tracking-wider">Rubrik Penilaian Esai:</strong>
                                             <div className="font-medium text-secondary-900 rich-text-content" dangerouslySetInnerHTML={{__html: q.correctAnswer}}></div>
                                         </div>
                                     )}
                                 </div>
                             )}
                         </div>
                         <div className="flex sm:flex-col gap-2 shrink-0 w-full sm:w-auto mt-2 sm:mt-0">
                            <button onClick={() => duplicateQuestion(q)} className="bg-success/10 text-success-700 hover:bg-success/20 p-2.5 rounded-xl font-bold text-xs flex items-center justify-center border border-success/20 flex-1 sm:flex-none transition-colors" title="Duplikasi Soal"><Copy size={16} className="sm:mr-1.5"/> <span className="hidden sm:inline">Duplikat</span></button>
                            <button onClick={() => {setFormData(q); setView('edit');}} className="text-primary bg-primary/10 p-2 hover:bg-primary/20 rounded-lg flex items-center justify-center" title="Edit Soal"><Edit size={16}/></button>
                            <button onClick={() => deleteQuestion(q.id)} className="text-rose-600 bg-rose-50 p-2 hover:bg-rose-100 rounded-lg flex items-center justify-center" title="Hapus Soal"><Trash2 size={16}/></button>
                         </div>
                       </div>
                    )})}
                    {folderQuestions.length === 0 && <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300 text-slate-500 font-bold">Belum ada soal di folder ini.</div>}
                  </div>
                  <button onClick={() => {setFormData({...defaultMCQ, folder: filterFolder}); setView('create');}} className="fixed bottom-8 right-8 bg-primary text-white w-16 h-16 rounded-full flex items-center justify-center shadow-xl hover:scale-105 transition-transform"><Plus size={28}/></button>
                </AdminLayout>
              );
            }

            return (
              <AdminLayout title="Manajemen Bank Soal">
                 <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 animate-fade-in">
                    <div onClick={createFolder} className="bg-primary/5 border-2 border-dashed border-primary/30 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer min-h-[160px] hover:bg-primary/10 transition-colors">
                        <div className="w-12 h-12 bg-primary/20 text-primary rounded-xl flex items-center justify-center mb-3"><Plus size={24}/></div>
                        <span className="font-black text-sm text-primary text-center">Buat Folder Baru</span>
                    </div>
                    {Object.entries(folderStats).map(([fname, count]) => {
                        const isPublished = activeFolder && activeFolder.split(',').map(f=>f.trim().toLowerCase()).includes(fname.toLowerCase());
                        return (
                        <div key={fname} className={`bg-white border-2 rounded-2xl p-5 md:p-6 flex flex-col justify-between shadow-sm min-h-[160px] relative overflow-hidden transition-all ${isPublished ? 'border-primary ring-2 ring-primary/10' : 'border-slate-100 hover:border-slate-300'}`}>
                            {isPublished && <div className="absolute top-0 right-0 bg-primary text-white text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-bl-lg">Aktif</div>}
                            <div>
                                <h4 className="font-black text-lg text-slate-800 mb-1.5 line-clamp-2" title={fname}>{fname}</h4>
                                <p className="text-xs text-slate-500 font-bold bg-slate-100 inline-block px-3 py-1 rounded-lg border border-slate-200">{count} Butir Soal</p>
                            </div>
                            <div className="mt-4 flex flex-col gap-2">
                                <div className="flex gap-1.5">
                                    <button onClick={() => { setFilterFolder(fname); setView('list'); }} className="flex-1 bg-slate-100 py-2 rounded-lg text-xs font-black text-slate-700 hover:bg-slate-200 transition-colors">Buka Soal</button>
                                    <button onClick={() => editFolder(fname)} className="px-3 bg-secondary/10 text-secondary-700 rounded-lg hover:bg-secondary/20 transition-colors" title="Edit Nama Folder"><Edit size={14}/></button>
                                    {fname !== 'Utama' && <button onClick={() => deleteFolder(fname)} className="px-3 bg-rose-50 text-rose-600 rounded-lg hover:bg-rose-100 transition-colors" title="Hapus Folder Permanen"><Trash2 size={14}/></button>}
                                </div>
                            </div>
                        </div>
                    )})}
                 </div>
              </AdminLayout>
            );
          };

            return (
              <AdminLayout title="Manajemen Bank Soal">
                 <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 animate-fade-in">
                    <div onClick={createFolder} className="bg-primary/5 border-2 border-dashed border-primary/30 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer min-h-[160px] hover:bg-primary/10 transition-colors">
                        <div className="w-12 h-12 bg-primary/20 text-primary rounded-xl flex items-center justify-center mb-3"><Plus size={24}/></div>
                        <span className="font-black text-sm text-primary text-center">Buat Folder Baru</span>
                    </div>
                    {Object.entries(folderStats).map(([fname, count]) => {
                        const isPublished = activeFolder.split(',').map(f=>f.trim().toLowerCase()).includes(fname.toLowerCase());
                        return (
                        <div key={fname} className={`bg-white border-2 rounded-2xl p-5 md:p-6 flex flex-col justify-between shadow-sm min-h-[160px] relative overflow-hidden transition-all ${isPublished ? 'border-primary ring-2 ring-primary/10' : 'border-slate-100 hover:border-slate-300'}`}>
                            {isPublished && <div className="absolute top-0 right-0 bg-primary text-white text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-bl-lg">Aktif</div>}
                            <div>
                                <h4 className="font-black text-lg text-slate-800 mb-1.5 line-clamp-2" title={fname}>{fname}</h4>
                                <p className="text-xs text-slate-500 font-bold bg-slate-100 inline-block px-3 py-1 rounded-lg border border-slate-200">{count} Butir Soal</p>
                            </div>
                            <div className="mt-4 flex flex-col gap-2">
                                <div className="flex gap-1.5">
                                    <button onClick={() => { setFilterFolder(fname); setView('list'); }} className="flex-1 bg-slate-100 py-2 rounded-lg text-xs font-black text-slate-700 hover:bg-slate-200 transition-colors">Buka Soal</button>
                                    <button onClick={() => editFolder(fname)} className="px-3 bg-secondary/10 text-secondary-700 rounded-lg hover:bg-secondary/20 transition-colors" title="Edit Nama Folder"><Edit size={14}/></button>
                                    {fname !== 'Utama' && <button onClick={() => deleteFolder(fname)} className="px-3 bg-rose-50 text-rose-600 rounded-lg hover:bg-rose-100 transition-colors" title="Hapus Folder Permanen"><Trash2 size={14}/></button>}
                                </div>
                            </div>
                        </div>
                    )})}
                 </div>
              </AdminLayout>
            );
          };

          const AdminItemAnalysis = () => {
            const analysisData = questions.map(q => {
                let correct = 0, wrong = 0, empty = 0;
                results.forEach(r => {
                    const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                    const d = details.find(x => x.qId === q.id);
                    if (!d || d.isEmpty) empty++; else if (d.isCorrect) correct++; else wrong++;
                });

                const total = results.length;
                const percentageCorrect = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;
                
                let diffLabel = "N/A";
                if (total > 0) {
                    const p = parseFloat(percentageCorrect);
                    if (p > 85) diffLabel = "Sangat Mudah";
                    else if (p >= 70) diffLabel = "Mudah";
                    else if (p >= 50) diffLabel = "Sedang";
                    else if (p >= 30) diffLabel = "Sulit";
                    else diffLabel = "Sangat Sulit";
                }

                const sortedResults = [...results].sort(compareResults);
                const groupSize = Math.max(1, Math.floor(sortedResults.length * 0.27));
                const upperGroup = sortedResults.slice(0, groupSize);
                const lowerGroup = sortedResults.slice(-groupSize);
                
                let upperCorrect = 0, lowerCorrect = 0;
                upperGroup.forEach(r => { const d = (r.detail?.detailedResults||[]).find(x=>x.qId===q.id); if(d?.isCorrect) upperCorrect++; });
                lowerGroup.forEach(r => { const d = (r.detail?.detailedResults||[]).find(x=>x.qId===q.id); if(d?.isCorrect) lowerCorrect++; });
                const discrimination = groupSize > 0 ? ((upperCorrect - lowerCorrect) / groupSize).toFixed(2) : "0.00";

                return { ...q, correct, wrong, empty, total, percentageCorrect, diffLabel, discrimination };
            });

            return (
              <AdminLayout title="Analisis Butir Soal">
                <div className="bg-primary/10 border border-primary/20 rounded-2xl p-6 mb-8 flex flex-wrap gap-4 items-center text-xs font-bold tracking-wider text-primary shadow-sm">
                    <span className="uppercase text-primary-800"><i className="fas fa-chart-line mr-2"></i> Indikator Kesukaran Empiris:</span>
                    <span className="bg-white text-success px-3 py-1.5 rounded-lg shadow-sm">Sangat Mudah (&gt;85%)</span>
                    <span className="bg-success text-white px-3 py-1.5 rounded-lg shadow-sm">Mudah (70-85%)</span>
                    <span className="bg-secondary text-white px-3 py-1.5 rounded-lg shadow-sm">Sedang (50-69%)</span>
                    <span className="bg-rose-500 text-white px-3 py-1.5 rounded-lg shadow-sm">Sulit (30-49%)</span>
                    <span className="bg-slate-800 text-white px-3 py-1.5 rounded-lg shadow-sm">Sangat Sulit (&lt;30%)</span>
                </div>
                
                <div className="bg-white rounded-3xl border border-slate-100 overflow-x-auto shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b border-slate-100">
                            <tr>
                                <th className="p-5 text-center w-16 text-slate-400 text-xs font-bold uppercase tracking-widest">No</th>
                                <th className="p-5 text-slate-400 text-xs font-bold uppercase tracking-widest min-w-[250px]">Pertanyaan (Cuplikan)</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Tipe</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">% Benar</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Daya Pembeda</th>
                                <th className="p-5 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Status Empiris</th>
                            </tr>
                        </thead>
                        <tbody>
                            {analysisData.map((d, idx) => {
                                const tempDiv = document.createElement("div"); tempDiv.innerHTML = d.question || "";
                                const plainText = tempDiv.textContent || tempDiv.innerText || "";
                                return (
                                <tr key={d.id} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                    <td className="p-5 text-center font-black text-slate-400">{idx + 1}</td>
                                    <td className="p-5 max-w-xs truncate text-slate-600 font-medium" title={plainText}>{plainText}</td>
                                    <td className="p-5 text-center"><span className="text-[10px] uppercase font-black text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg">{d.type === 'MCQ' ? 'PG' : d.type === 'SHORT_ANSWER' ? 'ISIAN' : 'ESAI'}</span></td>
                                    <td className="p-5 text-center font-black text-primary text-lg">{d.percentageCorrect}%</td>
                                    <td className="p-5 text-center font-black text-secondary">{d.discrimination}</td>
                                    <td className="p-5 text-center"><span className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider ${d.diffLabel.includes('Mudah') ? 'bg-success/10 text-success' : d.diffLabel === 'Sedang' ? 'bg-secondary/10 text-secondary' : 'bg-rose-100 text-rose-600'}`}>{d.diffLabel}</span></td>
                                </tr>
                            )})}
                            {analysisData.length === 0 && <tr><td colSpan="6" className="text-center p-10 text-slate-400 font-bold">Belum ada data soal.</td></tr>}
                        </tbody>
                    </table>
                </div>
              </AdminLayout>
            );
          };

          const AdminReports = () => {
             let processedResults = [...results].sort(compareResults);
             return (
                <AdminLayout title="Cetak Laporan">
                   <div className="mb-8 bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center print:hidden">
                      <div className="text-slate-500 font-bold text-sm">Pratinjau Laporan Peringkat Kelas Olimpiade</div>
                      <button onClick={() => window.print()} className="bg-primary hover:bg-primary-700 text-white px-6 py-3 rounded-xl font-black text-sm flex items-center shadow-lg transition-all"><i className="fas fa-print mr-2"></i> Cetak (A4)</button>
                   </div>
                   
                   <div className="bg-white border shadow-xl mx-auto w-full max-w-[21cm] min-h-[29.7cm] p-10 sm:p-16 print-container">
                      <div className="text-center border-b-4 border-slate-800 pb-6 mb-8">
                         <h1 className="text-2xl font-black uppercase tracking-widest text-slate-900 mb-2">Laporan Hasil Seleksi Olimpiade</h1>
                         <p className="text-slate-600 font-bold text-lg">{organizerName}</p>
                      </div>
                      
                      <table className="w-full text-left border-collapse text-sm">
                         <thead className="bg-slate-100 uppercase font-black text-xs text-slate-700 tracking-widest"><tr className="border-y-2 border-slate-800">
                            <th className="py-4 px-4 text-center w-16">Rank</th>
                            <th className="py-4 px-4">Nama Peserta</th>
                            <th className="py-4 px-4">Asal Sekolah</th>
                            <th className="py-4 px-4 text-center w-24">ITO</th>
                            <th className="py-4 px-4 text-center w-24">Skor</th>
                         </tr></thead>
                         <tbody>
                            {processedResults.map((r, i) => (
                               <tr key={i} className="border-b border-slate-200 font-bold">
                                  <td className="py-3 px-4 text-center text-slate-500">{i+1}</td>
                                  <td className="py-3 px-4 uppercase text-slate-900">{r.participant?.name}</td>
                                  <td className="py-3 px-4 text-slate-600">{r.participant?.school}</td>
                                  <td className="py-3 px-4 text-center text-primary">{r.detail?.summary?.ito || 0}</td>
                                  <td className="py-3 px-4 text-center text-success text-base">{r.score}</td>
                               </tr>
                            ))}
                         </tbody>
                      </table>
                      <div className="mt-20 flex justify-end text-center text-slate-800 font-bold text-sm"><div><p className="mb-24">Mengetahui,<br/>Koordinator Olimpiade</p><p className="font-black uppercase tracking-widest border-t-2 border-slate-800 pt-2 w-48 mx-auto">Administrator</p></div></div>
                   </div>
                </AdminLayout>
             );
          };

          return (
            <DialogContext.Provider value={{ showPrompt: showCustomPrompt, showAlert: showCustomAlert, showConfirm: showCustomConfirm }}>
                {(() => {
                    switch (currentRoute) {
                        case '/': case '/login': return <ParticipantLogin />;
                        case '/instruction': return <ParticipantInstruction />;
                        case '/exam': return <ExamEngine />;
                        case '/review': return <ExamReview />;
                        case '/dashboard': return <StudentDashboard />;
                        case '/admin': case '/admin/login': return <AdminLogin />;
                        case '/admin/dashboard': return <AdminDashboard />;
                        case '/admin/tokens': return <AdminTokens />;
                        case '/admin/results': return <AdminResults />;
                        case '/admin/questions': return <AdminQuestions />;
                        case '/admin/analysis': return <AdminItemAnalysis />;
                        case '/admin/reports': return <AdminReports />;
                        default: return <ParticipantLogin />;
                    }
                })()}

                {/* MODAL GLOBAL PENGGANTI ALERT/CONFIRM/PROMPT BAWAAN BROWSER */}
                {dialogState && (
                    <div className="fixed inset-0 z-[9999] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-6 md:p-8 max-w-sm w-full animate-fade-in">
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-4 ${dialogState.type === 'alert' ? 'bg-primary/10 text-primary' : dialogState.type === 'confirm' ? 'bg-secondary/10 text-secondary' : 'bg-success/10 text-success'}`}>
                                <i className={`fas ${dialogState.type === 'alert' ? 'fa-info' : dialogState.type === 'confirm' ? 'fa-question' : 'fa-keyboard'} text-xl`}></i>
                            </div>
                            <h3 className="font-black text-xl text-slate-800 mb-2">{dialogState.type === 'alert' ? 'Informasi' : dialogState.type === 'confirm' ? 'Konfirmasi' : 'Input Dibutuhkan'}</h3>
                            <p className="text-slate-600 font-medium mb-6">{dialogState.msg}</p>
                            
                            {dialogState.type === 'prompt' && (
                                <input type="text" id="prompt-global-input" defaultValue={dialogState.defaultValue} className="w-full p-4 border-2 border-slate-200 rounded-xl mb-6 focus:border-success focus:ring-4 focus:ring-success/10 outline-none font-bold text-slate-800 transition-all" autoFocus onKeyDown={(e) => { if(e.key === 'Enter') dialogState.resolve(e.target.value); }} />
                            )}
                            
                            <div className="flex justify-end gap-3">
                                {dialogState.type !== 'alert' && (
                                    <button onClick={() => dialogState.resolve(null)} className="px-5 py-3 font-bold text-slate-500 bg-slate-100 rounded-xl hover:bg-slate-200 transition-colors">Batal</button>
                                )}
                                <button onClick={() => {
                                    if (dialogState.type === 'prompt') {
                                        dialogState.resolve(document.getElementById('prompt-global-input').value);
                                    } else {
                                        dialogState.resolve(true);
                                    }
                                }} className={`px-6 py-3 font-black text-white rounded-xl shadow-lg transition-all ${dialogState.type === 'alert' ? 'bg-primary hover:bg-primary-700' : dialogState.type === 'confirm' ? 'bg-secondary hover:bg-secondary-600' : 'bg-success hover:bg-success-600'}`}>Lanjutkan</button>
                            </div>
                        </div>
                    </div>
                )}
            </DialogContext.Provider>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
