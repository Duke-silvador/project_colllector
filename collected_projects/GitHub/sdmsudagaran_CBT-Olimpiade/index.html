                                        <input type="checkbox" checked={tempRandomOpt} onChange={e=>setTempRandomOpt(e.target.checked)} className="w-4 h-4 accent-primary mr-2 rounded"/>
                                        <span className="font-bold text-slate-700 text-sm">Acak Opsi (PG)</span>
                                    </label>
                                </div>
                                <button onClick={saveSettings} disabled={isSaving} className="w-full sm:w-auto px-6 py-2.5 bg-primary text-white rounded-xl text-sm font-black shadow-lg hover:bg-primary-700 disabled:opacity-50 transition-all flex items-center justify-center">
                                    {isSaving ? <i className="fas fa-spinner fa-spin mr-2"></i> : <i className="fas fa-save mr-2"></i>}
                                    {isSaving ? 'Menyimpan...' : 'Simpan Pengaturan'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center text-center">
                            <div className="w-10 h-10 rounded-xl bg-success/10 text-success flex justify-center items-center mb-2"><CheckCircle size={20}/></div>
                            <div className="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Selesai</div>
                            <div className="text-2xl font-black text-slate-800">{results.length}</div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center text-center">
                            <div className="w-10 h-10 rounded-xl bg-primary/10 text-primary flex justify-center items-center mb-2"><Database size={20}/></div>
                            <div className="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Bank Soal</div>
                            <div className="text-2xl font-black text-slate-800">{questions.length}</div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center text-center">
                            <div className="w-10 h-10 rounded-xl bg-secondary/10 text-secondary flex justify-center items-center mb-2"><FolderIcon size={20}/></div>
                            <div className="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Folder</div>
                            <div className="text-2xl font-black text-slate-800">{availableFolders.length}</div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center text-center">
                            <div className="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex justify-center items-center mb-2"><User size={20}/></div>
                            <div className="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">Peserta</div>
                            <div className="text-2xl font-black text-slate-800">{tokens.filter(t => !t.code.startsWith('SYS_')).length}</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <h3 className="font-black text-slate-800 mb-4 flex items-center text-base"><i className="fas fa-trophy text-secondary mr-2 text-xl"></i> Top 10 Ranking</h3>
                            <table className="w-full text-xs text-left border-collapse">
                                <thead className="bg-slate-50 border-y border-slate-100">
                                    <tr><th className="py-2 px-2 text-slate-400 uppercase tracking-widest">Rank</th><th className="py-2 px-2 text-slate-400 uppercase tracking-widest">Nama Siswa</th><th className="py-2 px-2 text-center text-slate-400 uppercase tracking-widest">ITO</th><th className="py-2 px-2 text-center text-slate-400 uppercase tracking-widest">Skor</th></tr>
                                </thead>
                                <tbody>
                                    {top10.map((r, i) => (
                                        <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                            <td className="py-2 px-2 font-black text-slate-400">{i+1}</td>
                                            <td className="py-2 px-2 font-bold text-slate-800 uppercase">{r.participant?.name}</td>
                                            <td className="py-2 px-2 text-center font-black text-primary">{r.detail?.summary?.ito || 0}</td>
                                            <td className="py-2 px-2 text-center font-black text-success">{r.score}</td>
                                        </tr>
                                    ))}
                                    {top10.length === 0 && <tr><td colSpan="4" className="p-4 text-center text-slate-400 font-bold">Belum ada data ujian.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                        
                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <h3 className="font-black text-slate-800 mb-4 flex items-center text-base"><i className="fas fa-star text-secondary mr-2 text-xl"></i> Kandidat OSN Otomatis</h3>
                            <table className="w-full text-xs text-left border-collapse">
                                <thead className="bg-slate-50 border-y border-slate-100">
                                    <tr><th className="py-2 px-2 text-slate-400 uppercase tracking-widest">Nama Siswa</th><th className="py-2 px-2 text-center text-slate-400 uppercase tracking-widest">ITO</th><th className="py-2 px-2 text-slate-400 uppercase tracking-widest">Kategori</th></tr>
                                </thead>
                                <tbody>
                                    {osnCandidates.slice(0,10).map((r, i) => (
                                        <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                            <td className="py-2 px-2 font-bold text-slate-800 uppercase">{r.participant?.name}</td>
                                            <td className="py-2 px-2 text-center font-black text-primary">{r.detail?.summary?.ito || 0}</td>
                                            <td className="py-2 px-2"><span className="bg-primary/10 text-primary px-2 py-1 rounded text-[9px] font-black uppercase tracking-wider">{getITOCategory(r.detail?.summary?.ito || 0)}</span></td>
                                        </tr>
                                    ))}
                                    {osnCandidates.length === 0 && <tr><td colSpan="3" className="p-4 text-center text-slate-400 font-bold">Belum ada kandidat terdeteksi.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <h3 className="font-black text-slate-800 mb-4 flex items-center text-base"><i className="fas fa-chart-bar text-primary mr-2 text-xl"></i> Distribusi Nilai Kelas</h3>
                            <div className="flex h-40 items-end justify-between px-4 pt-2 gap-4">
                                 {renderDistributionChart()}
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <h3 className="font-black text-slate-800 mb-4 flex items-center text-base"><i className="fas fa-chart-pie text-success mr-2 text-xl"></i> Rata-rata Penguasaan</h3>
                            <div className="mt-4">
                                 {renderDifficultyAnalysis()}
                            </div>
                        </div>
                    </div>
                </AdminLayout>
             );
          };

          const AdminTokens = () => {
             const [isSaving, setIsSaving] = useState(false);
             const [showImport, setShowImport] = useState(false);
             const [fileUploadError, setFileUploadError] = useState('');
             const [isMassEdit, setIsMassEdit] = useState(false);
             const [massEditTokens, setMassEditTokens] = useState([]);
             
             const [selectedTokens, setSelectedTokens] = useState([]);
             const [downloadFilter, setDownloadFilter] = useState('Semua');
             const [editFilter, setEditFilter] = useState('Semua');
             const [sortOrder, setSortOrder] = useState('DEFAULT');

             const actualTokens = tokens.filter(t => !t.code.startsWith('SYS_SETTING_') && !t.code.startsWith('SYS_FOLDER_'));
             const uniqueClasses = [...new Set(actualTokens.map(t => t.participant_school).filter(Boolean))];
             const uniqueEditClasses = [...new Set(massEditTokens.map(t => t.participant_school).filter(Boolean))];

             // Menarik nama-nama Folder yang ada di Bank Soal untuk Dropdown Peminatan
             const availableFolders = [...new Set([...questions.map(q => q.folder || 'Utama'), ...tokens.filter(t => t.code && t.code.startsWith('SYS_FOLDER_')).map(t => t.status), 'Utama'])];

             let displayedTokens = downloadFilter === 'Semua' ? [...actualTokens] : actualTokens.filter(t => t.participant_school === downloadFilter);
             if (sortOrder === 'NAME_ASC') displayedTokens.sort((a,b) => (a.participant_name || '').localeCompare(b.participant_name || ''));
             else if (sortOrder === 'NAME_DESC') displayedTokens.sort((a,b) => (b.participant_name || '').localeCompare(a.participant_name || ''));

             let displayedMassEditTokens = editFilter === 'Semua' ? [...massEditTokens] : massEditTokens.filter(t => t.participant_school === editFilter);
             if (sortOrder === 'NAME_ASC') displayedMassEditTokens.sort((a,b) => (a.participant_name || '').localeCompare(b.participant_name || ''));
             else if (sortOrder === 'NAME_DESC') displayedMassEditTokens.sort((a,b) => (b.participant_name || '').localeCompare(a.participant_name || ''));

             const handleSelectAll = (e) => {
                 if (e.target.checked) setSelectedTokens(displayedTokens.map(t => t.code));
                 else setSelectedTokens([]);
             };

             const handleSelectAllEdit = (e) => {
                 if (e.target.checked) setSelectedTokens(displayedMassEditTokens.map(t => t.code));
                 else setSelectedTokens([]);
             };

             const handleSelectToken = (code) => {
                 if (selectedTokens.includes(code)) setSelectedTokens(selectedTokens.filter(t => t !== code));
                 else setSelectedTokens([...selectedTokens, code]);
             };

             const handleDeleteSelected = async () => {
                 if (selectedTokens.length === 0) return;
                 if (!confirm(`Hapus permanen ${selectedTokens.length} data terpilih?`)) return;
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     const { error } = await db.from('tokens').delete().in('code', selectedTokens);
                     if (error) throw error;
                     await fetchSupabaseData(); 
                     setSelectedTokens([]); 
                     alert("Data terpilih berhasil dihapus.");
                 } catch (err) { alert("Gagal hapus masal: " + err.message); } 
                 finally { setIsSaving(false); }
             };

             const downloadPeserta = () => {
                 if (displayedTokens.length === 0) return alert("Tidak ada data untuk difilter.");
                 const printWindow = window.open('', '_blank');
                 const dateStr = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
                 
                 let tableRowsHTML = '';
                 displayedTokens.forEach((t, i) => {
                     tableRowsHTML += `<tr><td class="text-center">${i + 1}</td><td style="text-transform: uppercase; font-weight: 600;">${t.participant_name || '-'}</td><td>${t.participant_school || '-'}</td><td class="text-center" style="font-weight:bold; color:#2563eb;">${t.jenis_soal || 'Utama'}</td><td class="text-center token-font">${t.code}</td><td class="text-center"><span class="status ${t.status === 'AVAILABLE' ? 'status-available' : 'status-used'}">${t.status}</span></td></tr>`;
                 });

                 const htmlContent = `
                     <!DOCTYPE html><html><head><title>Data_Token_${downloadFilter.replace(/\s+/g, '_')}</title>
                     <style>
                         body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; padding: 20px; }
                         .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #1e293b; padding-bottom: 15px; }
                         .header h2 { margin: 0 0 5px 0; color: #0f172a; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
                         table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
                         th, td { border: 1px solid #cbd5e1; padding: 10px 12px; text-align: left; }
                         th { background-color: #f8fafc; font-weight: bold; text-transform: uppercase; font-size: 11px; color: #475569; }
                         .text-center { text-align: center; } .token-font { font-family: monospace; font-weight: bold; color: #2563eb; font-size: 14px; letter-spacing: 1px; }
                         .status { font-weight: bold; font-size: 10px; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; }
                         .status-available { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; } .status-used { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
                         @media print { @page { margin: 1.5cm; } body { padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
                     </style></head><body>
                         <div class="header"><h2>Daftar Token Ujian Peserta</h2><p>Filter: <strong>${downloadFilter}</strong> &nbsp;|&nbsp; Unduh: ${dateStr}</p></div>
                         <table><thead><tr><th class="text-center" style="width: 5%;">No</th><th style="width: 25%;">Nama Peserta</th><th style="width: 25%;">Asal Sekolah / Kelas</th><th class="text-center" style="width: 15%;">Jenis Soal</th><th class="text-center" style="width: 15%;">Token</th><th class="text-center" style="width: 15%;">Status</th></tr></thead>
                         <tbody>${tableRowsHTML}</tbody></table>
                         <script>window.onload = function() { setTimeout(function() { window.print(); window.close(); }, 500); }<${'/'}script>
                     </body></html>`;
                 printWindow.document.open(); printWindow.document.write(htmlContent); printWindow.document.close();
             };

             const addManual = async () => {
                 const name = prompt("Nama Peserta:"); if (!name) return;
                 const school = prompt("Asal Sekolah:") || organizerName;
                 const folderStr = availableFolders.join(", ");
                 const jenis = prompt(`Ketik Folder Soal/Peminatan (${folderStr}):`, availableFolders[0]) || availableFolders[0];
                 const newCode = `TKA-${Math.random().toString(36).substring(2,6).toUpperCase()}`;
                 setIsSaving(true);
                 try { const db = await getSupabase(); await db.from('tokens').insert([{ code: newCode, status: 'AVAILABLE', participant_name: name, participant_school: school, jenis_soal: jenis, generatedAt: new Date().toISOString() }]); fetchSupabaseData(); } catch(e) { alert(e.message); }
                 setIsSaving(false);
             };

             const startMassEdit = () => {
                 setEditFilter('Semua');
                 if (selectedTokens.length > 0) {
                     const tokensToEdit = displayedTokens.filter(t => selectedTokens.includes(t.code));
                     setMassEditTokens(JSON.parse(JSON.stringify(tokensToEdit)));
                 } else {
                     setMassEditTokens(JSON.parse(JSON.stringify(displayedTokens)));
                 }
                 setSelectedTokens([]); setIsMassEdit(true);
             };

             const handleMassEditChange = (index, field, value) => {
                 const updated = [...massEditTokens]; updated[index][field] = value; setMassEditTokens(updated);
             };

             const handleBulkEditStatus = (status) => {
                 if (selectedTokens.length === 0) return alert("Pilih baris terlebih dahulu dengan mencentang kotak di kiri!");
                 const updated = massEditTokens.map(t => selectedTokens.includes(t.code) ? { ...t, status } : t);
                 setMassEditTokens(updated);
             };

             const saveMassEdit = async () => {
                 setIsSaving(true);
                 try {
                     const db = await getSupabase();
                     await db.from('tokens').upsert(massEditTokens.map(t => ({ code: t.code, status: t.status, participant_name: t.participant_name, participant_school: t.participant_school, jenis_soal: t.jenis_soal })));
                     fetchSupabaseData(); setIsMassEdit(false); setSelectedTokens([]); alert("Data berhasil diperbarui!");
                 } catch(e) { alert(e.message); }
                 setIsSaving(false);
             };

             const deleteToken = async (code) => {
                 if(!confirm(`Hapus token ${code}?`)) return;
                 setIsSaving(true);
                 try { const db = await getSupabase(); await db.from('tokens').delete().eq('code', code); fetchSupabaseData(); } catch(e) { alert(e.message); }
                 setIsSaving(false);
             };

             return (
               <AdminLayout title="Token Ujian">
                 <div className="bg-white p-4 rounded-xl border mb-6 flex flex-wrap gap-3 items-center shadow-sm">
                    {!isMassEdit ? (
                        <>
                            <button onClick={addManual} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors"><Plus size={16} className="mr-2"/> Tambah Manual</button>
                            <button onClick={() => setShowImport(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors"><Upload size={16} className="mr-2"/> Unggah Peserta</button>
                            <button onClick={startMassEdit} disabled={displayedTokens.length===0} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center transition-colors disabled:opacity-50">
                                <Edit size={16} className="mr-2"/> {selectedTokens.length > 0 ? `Edit Terpilih (${selectedTokens.length})` : 'Edit'}
                            </button>
                            
                            <div className="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-1 ml-auto">
                                <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="bg-white border border-slate-300 text-sm font-medium rounded-lg px-2 py-2.5 outline-none focus:border-blue-500 cursor-pointer">
                                    <option value="DEFAULT">Urutan Acak</option><option value="NAME_ASC">Nama A-Z</option><option value="NAME_DESC">Nama Z-A</option>
                                </select>
                                <select value={downloadFilter} onChange={(e) => {setDownloadFilter(e.target.value); setSelectedTokens([]);}} className="bg-white border border-slate-300 text-sm font-medium rounded-lg px-2 py-2.5 outline-none focus:border-blue-500 cursor-pointer">
                                    <option value="Semua">Semua Kelas/Sekolah</option>
                                    {uniqueClasses.map((cls, idx) => <option key={idx} value={cls}>{cls}</option>)}
                                </select>
                                <button onClick={downloadPeserta} className="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-4 py-2.5 rounded-lg font-bold text-sm transition-colors flex items-center border border-emerald-200"><i className="fas fa-file-pdf mr-2"></i> Cetak PDF</button>
                            </div>
                            
                            {selectedTokens.length > 0 && <button onClick={handleDeleteSelected} disabled={isSaving} className="bg-red-50 text-red-700 hover:bg-red-100 px-4 py-2.5 rounded-xl font-bold text-sm border border-red-200 transition-colors flex items-center"><i className="fas fa-trash-alt mr-2"></i> Hapus Terpilih ({selectedTokens.length})</button>}
                        </>
                    ) : (
                        <div className="w-full flex flex-wrap gap-2 items-center justify-between">
                            <div className="flex gap-2">
                                <button onClick={saveMassEdit} disabled={isSaving} className="bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-md"><Save size={16} className="inline mr-2"/> Simpan Perubahan</button>
                                <button onClick={() => { setIsMassEdit(false); setSelectedTokens([]); }} className="bg-slate-200 text-slate-700 hover:bg-slate-300 px-5 py-2.5 rounded-lg text-sm font-semibold transition-colors">Batal</button>
                            </div>
                            <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-1 ml-auto">
                                <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="bg-white border border-slate-300 text-sm font-medium rounded-lg px-2 py-1.5 outline-none focus:border-blue-500 cursor-pointer">
                                    <option value="DEFAULT">Urutan Acak</option><option value="NAME_ASC">Nama A-Z</option><option value="NAME_DESC">Nama Z-A</option>
                                </select>
                                <select value={editFilter} onChange={e => {setEditFilter(e.target.value); setSelectedTokens([]);}} className="bg-white border border-slate-300 text-sm font-medium rounded-lg px-3 py-1.5 outline-none focus:border-blue-500 cursor-pointer">
                                    <option value="Semua">Semua Kelas/Sekolah</option>
                                    {uniqueEditClasses.map((cls, idx) => <option key={idx} value={cls}>{cls}</option>)}
                                </select>
                            </div>
                        </div>
                    )}
                 </div>
                 
                 {showImport && (
                     <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-5">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold">Impor Peserta</h3><button onClick={()=>setShowImport(false)}><X size={18}/></button></div>
                            <button onClick={() => {}} className="mb-4 bg-blue-50 border text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold flex items-center"><FileText size={16} className="mr-2"/> Download Templat</button>
                            <input type="file" accept=".csv" onChange={()=>{}} className="w-full p-4 border-2 border-dashed rounded-xl"/>
                        </div>
                     </div>
                 )}
                 
                 <div className="bg-white rounded-xl border overflow-x-auto shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b">
                            <tr>
                                <th className="p-4 text-center w-12"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" onChange={isMassEdit ? handleSelectAllEdit : handleSelectAll} checked={selectedTokens.length > 0 && selectedTokens.length === (isMassEdit ? displayedMassEditTokens.length : displayedTokens.length)} /></th>
                                <th className="p-4 w-12 text-center">No</th><th className="p-4">Nama</th><th className="p-4">Sekolah/Kelas</th><th className="p-4 text-center">Jenis Soal</th><th className="p-4">Token</th>
                                {isMassEdit ? (
                                    <th className="p-4 min-w-[160px]">Status
                                        <select onChange={(e) => { if(e.target.value) handleBulkEditStatus(e.target.value); e.target.value=''; }} className="mt-1.5 w-full border border-slate-300 rounded text-xs font-bold text-blue-700 bg-blue-50 p-1.5 outline-none cursor-pointer">
                                            <option value="">+ Set Terpilih</option><option value="AVAILABLE">AVAILABLE</option><option value="USED">USED</option><option value="EXPIRED">EXPIRED</option>
                                        </select>
                                    </th>
                                ) : (<th className="p-4 text-center">Status</th>)}
                                {!isMassEdit && <th className="p-4 text-center">Aksi</th>}
                            </tr>
                        </thead>
                        <tbody>
                            {isMassEdit ? (
                                displayedMassEditTokens.map((t, idx) => {
                                    const originalIndex = massEditTokens.findIndex(orig => orig.code === t.code);
                                    return (
                                        <tr key={t.code} className={`border-b ${selectedTokens.includes(t.code) ? 'bg-blue-50/60' : 'bg-white'}`}>
                                            <td className="p-3 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" checked={selectedTokens.includes(t.code)} onChange={() => handleSelectToken(t.code)} /></td>
                                            <td className="p-3 text-center text-slate-500 font-semibold">{idx+1}</td>
                                            <td className="p-2"><input type="text" value={t.participant_name} onChange={e=>handleMassEditChange(originalIndex, 'participant_name', e.target.value)} className="w-full p-2 border border-blue-200 rounded text-sm outline-none focus:ring-1"/></td>
                                            <td className="p-2"><input type="text" value={t.participant_school} onChange={e=>handleMassEditChange(originalIndex, 'participant_school', e.target.value)} className="w-full p-2 border border-blue-200 rounded text-sm outline-none focus:ring-1"/></td>
                                            <td className="p-2">
                                                <select value={t.jenis_soal || 'Utama'} onChange={e=>handleMassEditChange(originalIndex, 'jenis_soal', e.target.value)} className="w-full p-2 border border-blue-200 rounded text-sm outline-none font-bold text-blue-700 cursor-pointer bg-white">
                                                    {availableFolders.map(f => <option key={f} value={f}>{f}</option>)}
                                                </select>
                                            </td>
                                            <td className="p-3 font-mono font-bold text-slate-500">{t.code}</td>
                                            <td className="p-2"><select value={t.status} onChange={e=>handleMassEditChange(originalIndex, 'status', e.target.value)} className="w-full p-2 border border-blue-200 rounded text-xs font-bold outline-none cursor-pointer bg-white"><option value="AVAILABLE">AVAILABLE</option><option value="USED">USED</option><option value="EXPIRED">EXPIRED</option></select></td>
                                        </tr>
                                    );
                                })
                            ) : (
                                displayedTokens.map((t, i) => (
                                    <tr key={t.code} className={`border-b transition-colors ${selectedTokens.includes(t.code) ? 'bg-blue-50/40' : 'hover:bg-slate-50'}`}>
                                        <td className="p-4 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" checked={selectedTokens.includes(t.code)} onChange={() => handleSelectToken(t.code)} /></td>
                                        <td className="p-4 text-center text-slate-500 font-semibold">{i+1}</td>
                                        <td className="p-4 font-semibold text-slate-800 uppercase">{t.participant_name || '-'}</td>
                                        <td className="p-4 text-slate-600 font-medium">{t.participant_school || '-'}</td>
                                        <td className="p-4 text-center font-bold text-blue-600 uppercase text-xs tracking-wider">{t.jenis_soal || 'Utama'}</td>
                                        <td className="p-4 font-mono font-bold text-indigo-600">{t.code}</td>
                                        <td className="p-4 text-center"><span className={`px-2.5 py-1 text-[10px] font-bold rounded uppercase tracking-wider ${t.status === 'AVAILABLE' ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : 'bg-rose-50 text-rose-600 border border-rose-100'}`}>{t.status}</span></td>
                                        <td className="p-4 text-center"><button onClick={()=>deleteToken(t.code)} className="text-rose-500 p-2 hover:bg-rose-100 rounded transition-colors" title="Hapus"><Trash2 size={16}/></button></td>
                                    </tr>
                                ))
                            )}
                            {(isMassEdit ? displayedMassEditTokens : displayedTokens).length === 0 && <tr><td colSpan={isMassEdit ? 7 : 8} className="text-center py-8 text-slate-500 italic bg-slate-50">Data peserta tidak ditemukan.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminResults = () => {
             const [selectedAnalysis, setSelectedAnalysis] = useState(null);
             const [filterSchool, setFilterSchool] = useState('Semua');
             const [filterFolder, setFilterFolder] = useState('Semua');
             const [filterDate, setFilterDate] = useState('Semua');
             const [sortOrder, setSortOrder] = useState('DEFAULT');
             const [selectedResults, setSelectedResults] = useState([]);
             const [isDeleting, setIsDeleting] = useState(false);

             const getResultFolder = (r) => {
                 const firstQId = r.detail?.detailedResults?.find(x => x.qId !== 'SYS_CHEATS')?.qId;
                 if (!firstQId) return 'Utama';
                 const q = questions.find(x => x.id === firstQId);
                 return q ? (q.folder || 'Utama') : 'Utama';
             };

             const availableFolders = [...new Set([...questions.map(q => q.folder || 'Utama'), ...tokens.filter(t => t.code && t.code.startsWith('SYS_FOLDER_')).map(t => t.status), 'Utama'])];
             const schoolList = ['Semua', ...new Set(results.map(r => r.participant?.school).filter(Boolean))];
             const folderList = ['Semua', ...availableFolders];
             const dateList = ['Semua', ...new Set(results.map(r => new Date(r.startTime).toLocaleDateString('id-ID')))];

             let processedResults = results.filter(r => {
                 const matchSchool = filterSchool === 'Semua' || r.participant?.school === filterSchool;
                 const matchFolder = filterFolder === 'Semua' || getResultFolder(r) === filterFolder;
                 const matchDate = filterDate === 'Semua' || new Date(r.startTime).toLocaleDateString('id-ID') === filterDate;
                 return matchSchool && matchFolder && matchDate;
             });

             if (sortOrder === 'NAME_ASC') processedResults.sort((a, b) => (a.participant?.name || '').localeCompare(b.participant?.name || ''));
             else if (sortOrder === 'NAME_DESC') processedResults.sort((a, b) => (b.participant?.name || '').localeCompare(a.participant?.name || ''));
             else if (sortOrder === 'RANK_DESC') processedResults.sort((a, b) => b.score - a.score);
             else if (sortOrder === 'RANK_ASC') processedResults.sort((a, b) => a.score - b.score);

             const handleSelectAll = (e) => {
                 if (e.target.checked) setSelectedResults(processedResults.map(r => r.id));
                 else setSelectedResults([]);
             };

             const handleSelectResult = (id) => {
                 if (selectedResults.includes(id)) setSelectedResults(selectedResults.filter(rid => rid !== id));
                 else setSelectedResults([...selectedResults, id]);
             };

             const deleteResult = async (id) => {
                 if(!confirm("Hapus hasil ujian peserta ini?")) return;
                 try { const db = await getSupabase(); await db.from('results').delete().eq('id', id); fetchSupabaseData(); } catch(e) { alert("Gagal menghapus: " + e.message); }
             };

             const handleDeleteSelected = async () => {
                 if (selectedResults.length === 0) return;
                 if (!confirm(`Hapus permanen ${selectedResults.length} data ujian terpilih?`)) return;
                 setIsDeleting(true);
                 try {
                     const db = await getSupabase();
                     const { error } = await db.from('results').delete().in('id', selectedResults);
                     if (error) throw error;
                     await fetchSupabaseData(); setSelectedResults([]); alert("Data terpilih berhasil dihapus.");
                 } catch (err) { alert("Gagal hapus masal: " + err.message); } finally { setIsDeleting(false); }
             };

             const downloadExcel = () => {
                 if (processedResults.length === 0) return alert("Tidak ada data untuk diunduh.");
                 let csvContent = "\uFEFFNo,Nama Peserta,Sekolah/Kelas,Folder Ujian,Skor Didapat,Total Maks Skor,Nilai Akhir (100),Waktu Mulai\n";
                 
                 processedResults.forEach((r, i) => {
                     const name = r.participant?.name ? r.participant.name.replace(/"/g, '""') : '';
                     const school = r.participant?.school ? r.participant.school.replace(/"/g, '""') : '';
                     const folderName = getResultFolder(r);
                     const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                     const earned = details.reduce((sum, d) => sum + (d.pointsEarned || 0), 0);
                     const maxP = details.reduce((sum, d) => sum + (d.questionMaxPoints || 0), 0);
                     const timeStr = new Date(r.startTime).toLocaleString('id-ID');
                     csvContent += `${i + 1},"${name}","${school}","${folderName}",${earned},${maxP},${r.score},"${timeStr}"\n`;
                 });
                 
                 const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                 const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
                 link.download = `Hasil_Ujian_${filterSchool}_${filterFolder}_${new Date().getTime()}.csv`; link.click();
             };

             const downloadDetailPDF = () => {
                 if (!selectedAnalysis) return;
                 const printWindow = window.open('', '_blank');
                 const studentName = selectedAnalysis.participant?.name || 'Siswa';
                 
                 let rowsHTML = '';
                 
                 const studentDetails = Array.isArray(selectedAnalysis.detail?.detailedResults) ? selectedAnalysis.detail.detailedResults.filter(x => x.qId !== 'SYS_CHEATS') : [];
                 
                 studentDetails.forEach((d, index) => {
                     const q = questions.find(x => x.id === d.qId);
                     if (!q) return;

                     let ansDisplay = '<span style="color: #f59e0b; font-style: italic;">Tidak Menjawab</span>';
                     let keyDisplay = '';
                     
                     if (q.type === 'MCQ') {
                         const correctOpt = q.options?.find(o => o.id === q.correctAnswer);
                         keyDisplay = `<div style="margin-top:8px; padding:6px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:4px; font-size:11px; color:#065f46;"><strong>Kunci Jawaban: ${q.correctAnswer}</strong> - ${correctOpt?.text?.replace(/<[^>]+>/g, '') || q.correctAnswer}</div>`;
                         if (!d.isEmpty && d.userAnswer) {
                             const opt = q.options?.find(o => o.id === d.userAnswer);
                             ansDisplay = `<strong>${d.userAnswer}.</strong> ${opt?.text?.replace(/<[^>]+>/g, '') || d.userAnswer}`;
                         }
                     } else if (q.type === 'MCMA') {
                         const correctTexts = (q.correctAnswers||[]).map(ansId => {
                             const stmt = q.statements?.find(s => String(s.id) === String(ansId));
                             return `<li>${stmt?.text?.replace(/<[^>]+>/g, '') || ansId}</li>`;
                         }).join('');
                         keyDisplay = `<div style="margin-top:8px; padding:6px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:4px; font-size:11px; color:#065f46;"><strong>Kunci (Pilih Semua):</strong><ul style="margin:4px 0 0; padding-left:16px;">${correctTexts}</ul></div>`;
                         if (!d.isEmpty && Array.isArray(d.userAnswer)) {
                             const userTexts = d.userAnswer.map(ansId => {
                                 const stmt = q.statements?.find(s => String(s.id) === String(ansId));
                                 return `<li>${stmt?.text?.replace(/<[^>]+>/g, '') || ansId}</li>`;
                             }).join('');
                             ansDisplay = `<ul style="margin:0; padding-left:16px;">${userTexts}</ul>`;
                         }
                     } else if (q.type === 'CATEGORY') {
                         if (!d.isEmpty && d.userAnswer) {
                             const keys = Object.keys(d.userAnswer);
                             const listItems = keys.map(k => {
                                 const stmt = q.statements?.find(s => String(s.id) === String(k));
                                 const isCorrectLine = d.userAnswer[k] === stmt?.correctCategory;
                                 const badgeColor = isCorrectLine ? '#10b981' : '#f43f5e';
                                 return `<li style="margin-bottom:6px; padding:6px; border:1px solid #e2e8f0; background:#f8fafc; border-radius:4px; font-size:11px;">
                                     <div style="font-size:10px; color:#64748b; margin-bottom:4px;">Pernyataan: <span style="color:#333;">${stmt?.text?.replace(/<[^>]+>/g, '') || k}</span></div>
                                     <span style="background:${badgeColor}; color:white; padding:2px 4px; border-radius:3px; font-weight:bold;">${d.userAnswer[k]}</span>
                                     <span style="color:#94a3b8; font-size:10px; margin-left:4px;">(Kunci: ${stmt?.correctCategory})</span>
                                 </li>`;
                             }).join('');
                             ansDisplay = `<ul style="list-style:none; margin:0; padding:0;">${listItems}</ul>`;
                         }
                     }

                     const earned = d.pointsEarned !== undefined ? d.pointsEarned : (d.isCorrect ? (q.type === 'MCMA' ? 2 : 1) : 0);
                     const maxP = d.questionMaxPoints !== undefined ? d.questionMaxPoints : (q.type === 'MCMA' ? 2 : (q.type === 'CATEGORY' ? (q.statements||[]).length : 1));
                     
                     let badgeHtml = '';
                     if (d.isEmpty) badgeHtml = '<span style="background:#fef3c7; color:#d97706; padding:3px 6px; border-radius:4px; font-size:9px; font-weight:bold; text-transform:uppercase; border:1px solid #fde68a;">KOSONG</span>';
                     else if (earned === maxP) badgeHtml = '<span style="background:#d1fae5; color:#047857; padding:3px 6px; border-radius:4px; font-size:9px; font-weight:bold; text-transform:uppercase; border:1px solid #a7f3d0;">BENAR</span>';
                     else if (earned > 0) badgeHtml = '<span style="background:#fef3c7; color:#b45309; padding:3px 6px; border-radius:4px; font-size:9px; font-weight:bold; text-transform:uppercase; border:1px solid #fde68a;">SEBAGIAN</span>';
                     else badgeHtml = '<span style="background:#ffe4e6; color:#e11d48; padding:3px 6px; border-radius:4px; font-size:9px; font-weight:bold; text-transform:uppercase; border:1px solid #fecdd3;">SALAH</span>';

                     rowsHTML += `
                         <tr>
                             <td style="text-align:center; font-weight:bold; color:#94a3b8;">${index + 1}</td>
                             <td><div style="font-size:13px; color:#1e293b; line-height:1.5;">${q.question}</div>${keyDisplay}</td>
                             <td style="font-size:13px; color:#334155;">${ansDisplay}</td>
                             <td style="text-align:center;">
                                 <div style="font-size:16px; font-weight:900; color:#0f172a;">${earned} <span style="font-size:10px; color:#94a3b8; font-weight:normal;">/ ${maxP}</span></div>
                                 <div style="margin-top:6px;">${badgeHtml}</div>
                             </td>
                         </tr>
                     `;
                 });

                 const htmlContent = `
                     <!DOCTYPE html>
                     <html>
                     <head>
                         <title>Detail_Jawaban_${studentName.replace(/\s+/g, '_')}</title>
                         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
                         <style>
                             body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 20px; color:#333; }
                             .header { text-align: center; border-bottom: 2px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; }
                             .header h2 { margin: 0; color: #0f172a; text-transform: uppercase; font-size: 22px; letter-spacing:1px; }
                             .header p { margin: 8px 0 0; color: #64748b; font-size: 14px; }
                             table { width: 100%; border-collapse: collapse; }
                             th, td { border: 1px solid #cbd5e1; padding: 12px; vertical-align: top; }
                             th { background-color: #f8fafc; color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing:0.5px; }
                             img { max-width: 100%; height: auto; max-height: 200px; border-radius: 4px; display: block; margin: 8px 0; }
                             @media print { 
                                 @page { margin: 1cm; }
                                 body { padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                             }
                         </style>
                     </head>
                     <body>
                         <div class="header">
                             <h2>Laporan Detail Jawaban Siswa</h2>
                             <p>Nama Peserta: <strong style="color:#0f172a;">${studentName}</strong> &nbsp;|&nbsp; Asal Sekolah: <strong style="color:#0f172a;">${selectedAnalysis.participant?.school || '-'}</strong> &nbsp;|&nbsp; Nilai Akhir: <strong style="color:#059669; font-size:16px;">${selectedAnalysis.score}</strong></p>
                         </div>
                         <table>
                             <thead>
                                 <tr>
                                     <th style="width:5%;">No</th>
                                     <th style="width:45%; text-align:left;">Pertanyaan & Kunci Asli</th>
                                     <th style="width:35%; text-align:left;">Pilihan Siswa</th>
                                     <th style="width:15%;">Skor</th>
                                 </tr>
                             </thead>
                             <tbody>${rowsHTML}</tbody>
                         </table>
                         <script>
                             window.onload = function() { setTimeout(function() { window.print(); window.close(); }, 800); }
                         <${'/'}script>
                     </body>
                     </html>
                 `;
                 printWindow.document.open();
                 printWindow.document.write(htmlContent);
                 printWindow.document.close();
             };

             return (
               <AdminLayout title="Manajemen Hasil Ujian">
                 <div className="mb-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-white p-4 rounded-xl border shadow-sm">
                     <div className="flex flex-wrap items-center gap-2 w-full xl:w-auto">
                         <div className="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 p-1.5 rounded-lg w-full sm:w-auto">
                             <select value={filterSchool} onChange={e=>{setFilterSchool(e.target.value); setSelectedResults([]);}} className="border-none py-1 px-2 text-sm bg-transparent font-semibold outline-none cursor-pointer text-slate-700">
                                 {schoolList.map(s => <option key={s} value={s}>{s === 'Semua' ? 'Sekolah: Semua' : s}</option>)}
                             </select>
                             <div className="w-px h-5 bg-slate-300 hidden sm:block"></div>
                             <select value={filterFolder} onChange={e=>{setFilterFolder(e.target.value); setSelectedResults([]);}} className="border-none py-1 px-2 text-sm bg-transparent font-semibold outline-none cursor-pointer text-blue-700">
                                 {folderList.map(f => <option key={f} value={f}>{f === 'Semua' ? 'Kategori: Semua' : f}</option>)}
                             </select>
                             <div className="w-px h-5 bg-slate-300 hidden sm:block"></div>
                             <select value={filterDate} onChange={e=>{setFilterDate(e.target.value); setSelectedResults([]);}} className="border-none py-1 px-2 text-sm bg-transparent font-semibold outline-none cursor-pointer text-emerald-700">
                                 {dateList.map(d => <option key={d} value={d}>{d === 'Semua' ? 'Tanggal: Semua' : d}</option>)}
                             </select>
                         </div>
                         <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="border border-slate-300 rounded-lg p-2 text-sm bg-white font-semibold outline-none cursor-pointer">
                             <option value="DEFAULT">Urutan Terbaru</option><option value="NAME_ASC">Nama A-Z</option><option value="NAME_DESC">Nama Z-A</option><option value="RANK_DESC">Ranking Tertinggi</option><option value="RANK_ASC">Ranking Terendah</option>
                         </select>
                         
                         {selectedResults.length > 0 && (
                             <button onClick={handleDeleteSelected} disabled={isDeleting} className="bg-rose-50 text-rose-700 border border-rose-200 px-4 py-2 rounded-lg text-sm font-bold flex items-center hover:bg-rose-100 transition-colors shadow-sm">
                                 <Trash2 size={16} className="mr-2"/> Hapus ({selectedResults.length})
                             </button>
                         )}
                     </div>
                     <div className="flex gap-2 w-full xl:w-auto">
                         <button onClick={downloadExcel} className="flex-1 sm:flex-none bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center hover:bg-emerald-100 transition-colors shadow-sm"><i className="fas fa-file-excel mr-2"></i> Unduh Excel</button>
                         <button onClick={fetchSupabaseData} className="flex-1 sm:flex-none bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center hover:bg-blue-100 transition-colors shadow-sm" title="Refresh"><i className="fas fa-sync-alt"></i></button>
                     </div>
                 </div>

                 {selectedAnalysis && (
                    <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-xl w-full max-w-5xl max-h-[90vh] flex flex-col">
                            <div className="bg-slate-50 border-b px-5 py-4 flex justify-between items-center">
                                <h3 className="font-bold text-slate-800">Detail Jawaban: {selectedAnalysis.participant?.name}</h3>
                                <div className="flex items-center gap-3">
                                    <button onClick={downloadDetailPDF} className="text-xs bg-emerald-100 text-emerald-700 border border-emerald-300 hover:bg-emerald-200 px-3 py-1.5 rounded-md font-bold flex items-center transition-colors shadow-sm">
                                        <i className="fas fa-file-pdf mr-1.5"></i> Download PDF
                                    </button>
                                    <button onClick={() => setSelectedAnalysis(null)} className="text-slate-400 hover:text-slate-800 transition-colors"><X size={20}/></button>
                                </div>
                            </div>
                            <div className="p-0 overflow-y-auto flex-1">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead className="bg-slate-100 border-b sticky top-0 shadow-sm z-10">
                                        <tr><th className="p-4 w-12 text-center text-slate-600">No</th><th className="p-4 text-slate-600">Pertanyaan & Kunci Asli</th><th className="p-4 w-64 text-slate-600 border-l border-r border-slate-200 bg-blue-50/30">Pilihan Siswa</th><th className="p-4 w-28 text-center text-slate-600">Skor</th></tr>
                                    </thead>
                                    <tbody>
                                        {(Array.isArray(selectedAnalysis.detail?.detailedResults) ? selectedAnalysis.detail.detailedResults.filter(x => x.qId !== 'SYS_CHEATS') : []).map((d, index) => {
                                            const q = questions.find(x => x.id === d.qId);
                                            if (!q) return null;

                                            let ansDisplay = <span className="text-amber-500 italic font-semibold">Tidak Menjawab</span>;
                                            let keyDisplay = null;
                                            
                                            if (q.type === 'MCQ') {
                                                const correctOpt = q.options?.find(o => o.id === q.correctAnswer);
                                                const tmpK = document.createElement("div"); tmpK.innerHTML = correctOpt?.text || q.correctAnswer;
                                                keyDisplay = <div className="mt-3 p-2 bg-emerald-50 rounded border border-emerald-100 text-xs text-slate-700 font-medium"><strong className="text-emerald-700">Kunci Jawaban: {q.correctAnswer}</strong> - {tmpK.textContent}</div>;
                                                if (!d.isEmpty && d.userAnswer) {
                                                    const opt = q.options?.find(o => o.id === d.userAnswer);
                                                    const tmp = document.createElement("div"); tmp.innerHTML = opt?.text || d.userAnswer;
                                                    ansDisplay = <div className="font-medium text-slate-800"><strong className="text-blue-600">{d.userAnswer}.</strong> {tmp.textContent}</div>;
                                                }
                                            } else if (q.type === 'MCMA') {
                                                const correctTexts = (q.correctAnswers||[]).map(ansId => {
                                                    const stmt = q.statements?.find(s => String(s.id) === String(ansId));
                                                    const t = document.createElement("div"); t.innerHTML = stmt?.text || ansId; return t.textContent;
                                                });
                                                keyDisplay = <div className="mt-3 p-2 bg-emerald-50 rounded border border-emerald-100 text-xs text-slate-700 font-medium"><strong className="text-emerald-700 block mb-1">Kunci (Pilih Semua):</strong> <ul className="list-disc pl-4">{correctTexts.map((txt, ii)=><li key={ii}>{txt}</li>)}</ul></div>;
                                                if (!d.isEmpty && Array.isArray(d.userAnswer)) {
                                                    ansDisplay = <ul className="list-disc pl-4 space-y-1">{d.userAnswer.map(ansId => {
                                                        const stmt = q.statements?.find(s => String(s.id) === String(ansId)); const tmp = document.createElement("div"); tmp.innerHTML = stmt?.text || ansId;
                                                        return <li key={ansId} className="text-xs font-medium text-slate-700">{tmp.textContent}</li>;
                                                    })}</ul>;
                                                }
                                            } else if (q.type === 'CATEGORY') {
                                                if (!d.isEmpty && d.userAnswer) {
                                                    const keys = Object.keys(d.userAnswer);
                                                    ansDisplay = <ul className="space-y-2">{keys.map(k => {
                                                        const stmt = q.statements?.find(s => String(s.id) === String(k)); const tmp = document.createElement("div"); tmp.innerHTML = stmt?.text || k;
                                                        const isCorrectLine = d.userAnswer[k] === stmt?.correctCategory;
                                                        return <li key={k} className="text-xs text-slate-600 bg-slate-50 p-2 rounded border leading-snug"><div className="mb-1 text-[10px] font-bold text-slate-400">Pernyataan: <span className="text-slate-700 font-medium">{tmp.textContent}</span></div> <span className={`font-bold px-1.5 py-0.5 rounded text-white ${isCorrectLine ? 'bg-emerald-500' : 'bg-rose-500'}`}>{d.userAnswer[k]}</span> <span className="text-slate-400 ml-1">(Kunci: {stmt?.correctCategory})</span></li>;
                                                    })}</ul>;
                                                }
                                            }

                                            const earned = d.pointsEarned !== undefined ? d.pointsEarned : (d.isCorrect ? (q.type === 'MCMA' ? 2 : 1) : 0);
                                            const maxP = d.questionMaxPoints !== undefined ? d.questionMaxPoints : (q.type === 'MCMA' ? 2 : (q.type === 'CATEGORY' ? (q.statements||[]).length : 1));

                                            return (
                                                <tr key={q.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                    <td className="p-4 text-center font-bold text-slate-400 align-top">{index + 1}</td>
                                                    <td className="p-4 align-top"><div className="line-clamp-4 text-slate-800 text-sm font-medium" dangerouslySetInnerHTML={{__html: q.question}} />{keyDisplay}</td>
                                                    <td className="p-4 align-top border-l border-r border-slate-100 bg-blue-50/10">{ansDisplay}</td>
                                                    <td className="p-4 text-center align-top">
                                                        {d.isEmpty ? <span className="text-amber-500 font-bold text-xs bg-amber-50 px-2 py-1 rounded border border-amber-200">KOSONG</span> : 
                                                            <div className="flex flex-col items-center">
                                                                <span className="font-black text-slate-800 text-lg">{earned} <span className="text-slate-400 font-medium text-xs">/ {maxP}</span></span>
                                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded mt-1 uppercase tracking-wider ${earned === maxP ? 'bg-emerald-100 text-emerald-700' : (earned > 0 ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700')}`}>{earned === maxP ? 'BENAR' : (earned > 0 ? 'SEBAGIAN' : 'SALAH')}</span>
                                                            </div>
                                                        }
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                 )}
                 
                 <div className="bg-white rounded-xl border overflow-x-auto shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b">
                            <tr>
                                <th className="p-4 text-center w-12"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" onChange={handleSelectAll} checked={selectedResults.length > 0 && selectedResults.length === processedResults.length} /></th>
                                <th className="p-4 w-12 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">Ranking</th>
                                <th className="p-4 text-slate-500 text-[10px] font-bold uppercase tracking-widest">Nama Peserta</th>
                                <th className="p-4 text-slate-500 text-[10px] font-bold uppercase tracking-widest">Sekolah/Kelas</th>
                                <th className="p-4 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">Jenis Soal</th>
                                <th className="p-4 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest" title="Skor Poin yang didapat">Skor</th>
                                <th className="p-4 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest" title="Nilai Skala 100">Nilai</th>
                                <th className="p-4 text-center text-slate-500 text-[10px] font-bold uppercase tracking-widest">Analisis</th>
                            </tr>
                        </thead>
                        <tbody>
                            {processedResults.map((r, idx)=> {
                                const details = Array.isArray(r.detail?.detailedResults) ? r.detail.detailedResults : [];
                                const earned = details.reduce((sum, d) => sum + (d.pointsEarned || 0), 0);
                                const maxP = details.reduce((sum, d) => sum + (d.questionMaxPoints || 0), 0);
                                const folderName = getResultFolder(r);
                                return (
                                <tr key={r.id} className={`border-b transition-colors ${selectedResults.includes(r.id) ? 'bg-blue-50/40' : 'hover:bg-slate-50'}`}>
                                    <td className="p-4 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer accent-blue-600 rounded" checked={selectedResults.includes(r.id)} onChange={() => handleSelectResult(r.id)} /></td>
                                    <td className="p-4 text-center font-bold text-slate-600">{idx + 1}</td>
                                    <td className="p-4 font-bold text-slate-800 uppercase">{r.participant?.name}</td>
                                    <td className="p-4 font-medium text-slate-600">{r.participant?.school}</td>
                                    <td className="p-4 text-center font-bold text-blue-600 text-xs tracking-wider uppercase">{folderName}</td>
                                    <td className="p-4 text-center"><div className="font-bold text-slate-700">{earned} <span className="text-xs text-slate-400 font-normal">/ {maxP}</span></div></td>
                                    <td className="p-4 text-center font-black text-emerald-600 text-lg">{r.score}</td>
                                    <td className="p-4 text-center"><button onClick={() => setSelectedAnalysis(r)} className="text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-100 transition-colors shadow-sm">Lihat Detail</button></td>
                                </tr>
                            )})}
                            {processedResults.length === 0 && <tr><td colSpan="8" className="text-center p-8 text-slate-500 font-bold bg-slate-50">Belum ada data hasil ujian yang masuk.</td></tr>}
                        </tbody>
                    </table>
                 </div>
               </AdminLayout>
             );
          };

          const AdminQuestions = () => {
            // 1. SEMUA HOOKS HARUS BERADA DI POSISI TERATAS (TIDAK BOLEH DI DALAM IF)
            const [isSaving, setIsSaving] = useState(false);
            const [view, setViewLocal] = useState(window.savedAdminView || 'folders'); 
            const [filterFolder, setFilterFolderLocal] = useState(window.savedAdminFolder || 'Utama');
            
            // State baru untuk fitur Preview
            const [showPreview, setShowPreview] = useState(true);
            const [isPreviewMode, setIsPreviewMode] = useState(false);
            
            const { showPrompt, showConfirm, showAlert } = useContext(DialogContext);

            // Pemicu render rumus otomatis tiap ganti tampilan
            useEffect(() => { triggerMathRender(); }, [view, showPreview, isPreviewMode, filterFolder, questions]);

            const setView = (v) => { window.savedAdminView = v; setViewLocal(v); };
            const setFilterFolder = (f) => { window.savedAdminFolder = f; setFilterFolderLocal(f); };

            const defaultMCQ = { id: '', type: 'MCQ', folder: filterFolder, difficulty: 'Sedang', points: 1.25, question: '', options: [{id:'A', text:''}, {id:'B', text:''}, {id:'C', text:''}, {id:'D', text:''}], correctAnswer: 'A' };
            const defaultSHORT = { id: '', type: 'SHORT_ANSWER', folder: filterFolder, difficulty: 'Sedang', points: 1.25, question: '', correctAnswer: '' };
            const defaultESSAY = { id: '', type: 'ESSAY', folder: filterFolder, difficulty: 'Sulit', points: 1.5, question: '', correctAnswer: '' };

            const [formData, setFormData] = useState(defaultMCQ);

            const handleDifficultyChange = (newDiff) => {
                let defaultPoints = newDiff === 'Mudah' ? 1.00 : newDiff === 'Sedang' ? 1.25 : 1.50;
                setFormData({...formData, difficulty: newDiff, points: defaultPoints});
            };

            const saveQuestion = async (e) => {
               e.preventDefault(); setIsSaving(true);
               try {
                 const db = await getSupabase();
                 let payload = { 
                     id: formData.id || `q${Date.now()}`, 
                     type: formData.type, 
                     folder: formData.folder || filterFolder, 
                     difficulty: formData.difficulty, 
                     points: formData.points !== undefined ? formData.points : 1,
                     question: formData.question 
                 };

                 if (formData.type === 'MCQ') {
                     payload.options = formData.options; payload.correctAnswer = formData.correctAnswer;
                 } else {
                     payload.correctAnswer = formData.correctAnswer;
                 }

                 if(!formData.id) await db.from('questions').insert([payload]);
                 else await db.from('questions').update(payload).eq('id', payload.id);
                 
                 setView('list'); setIsPreviewMode(false); await fetchSupabaseData(); 
               } catch (err) { await showAlert("Gagal menyimpan soal. Pastikan database stabil."); } 
               finally { setIsSaving(false); }
            };

            const deleteQuestion = async (id) => {
                const isConfirmed = await showConfirm("Yakin ingin menghapus soal ini secara permanen?");
                if(!isConfirmed) return;
                try { const db = await getSupabase(); await db.from('questions').delete().eq('id', id); setView('list'); await fetchSupabaseData(); } catch(e) { }
            };

            const duplicateQuestion = async (q) => {
                const isConfirmed = await showConfirm("Duplikasi soal ini?");
                if(!isConfirmed) return;
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const duplicatedQ = { ...q, id: `q${Date.now()}_copy` };
                    await db.from('questions').insert([duplicatedQ]);
                    setFilterFolder(q.folder || filterFolder);
                    setView('list');
                    await fetchSupabaseData(); 
                } catch(e) { }
                setIsSaving(false);
            };

            const folderStats = questions.reduce((acc, q) => { const f = q.folder || 'Utama'; acc[f] = (acc[f] || 0) + 1; return acc; }, {});
            tokens.forEach(t => { if (t.code && t.code.startsWith('SYS_FOLDER_') && folderStats[t.status] === undefined) { folderStats[t.status] = 0; } });
            if (folderStats['Utama'] === undefined) folderStats['Utama'] = 0;

            const createFolder = async () => {
                const fname = await showPrompt("Masukkan Nama Folder Baru:\n(Contoh: Tryout 1, Ulangan Harian)");
                if (fname && fname.trim() !== '') {
                    const folderName = fname.trim();
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        await db.from('tokens').insert([{ code: `SYS_FOLDER_${Date.now()}`, status: folderName, generatedAt: new Date().toISOString(), participant_name: 'SYSTEM_FOLDER' }]);
                        await fetchSupabaseData();
                        setFilterFolder(folderName); setView('list');
                        await showAlert("Folder berhasil dibuat!");
                    } catch(e) { }
                    setIsSaving(false);
                }
            };

            const editFolder = async (oldName) => {
                const newName = await showPrompt(`Ubah nama folder "${oldName}" menjadi:`, oldName);
                if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
                    setIsSaving(true);
                    try {
                        const db = await getSupabase();
                        const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === oldName);
                        if (folderToken) await db.from('tokens').update({ status: newName.trim() }).eq('code', folderToken.code); 
                        await db.from('questions').update({ folder: newName.trim() }).eq('folder', oldName);
                        
                        if (activeFolder && activeFolder.includes(oldName)) { 
                            const updatedActive = activeFolder.replace(oldName, newName.trim());
                            await db.from('tokens').update({ status: updatedActive }).eq('code', 'SYS_SETTING_FOLDER'); 
                            setActiveFolder(updatedActive); 
                        }
                        await fetchSupabaseData(); setFilterFolder(newName.trim());
                    } catch(e) { }
                    setIsSaving(false);
                }
            };

            const deleteFolder = async (fname) => {
                if (fname === 'Utama') { await showAlert("Folder Utama tidak dapat dihapus."); return; }
                const isConfirmed = await showConfirm(`Hapus folder "${fname}" beserta seluruh soal di dalamnya secara permanen?`);
                if (!isConfirmed) return;
                setIsSaving(true);
                try {
                    const db = await getSupabase();
                    const folderToken = tokens.find(t => t.code && t.code.startsWith('SYS_FOLDER_') && t.status === fname);
                    if (folderToken) await db.from('tokens').delete().eq('code', folderToken.code); 
                    await db.from('questions').delete().eq('folder', fname);
                    
                    if (activeFolder && activeFolder.includes(fname)) { 
                        const updatedActive = activeFolder.split(',').map(x=>x.trim()).filter(x=>x!==fname).join(', ') || 'Utama';
                        await db.from('tokens').update({ status: updatedActive }).eq('code', 'SYS_SETTING_FOLDER'); 
                        setActiveFolder(updatedActive); 
                    }
                    await fetchSupabaseData(); setFilterFolder('Utama'); setView('folders');
                } catch(e) { }
                setIsSaving(false);
            };

            if (view === 'create' || view === 'edit') {
               const availableFolders = [...new Set([...questions.map(q => q.folder || 'Utama'), ...tokens.filter(t => t.code && t.code.startsWith('SYS_FOLDER_')).map(t => t.status), filterFolder, 'Utama'])];

               return (
                 <AdminLayout title="Editor Soal Kelas Olimpiade">
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 max-w-4xl mx-auto mb-10 animate-fade-in flex flex-col overflow-hidden">
                        <div className="bg-slate-50 border-b border-slate-200 p-6 flex justify-between items-center">
                            <h2 className="font-black text-slate-800 text-lg">{formData.id ? 'Edit Soal' : 'Soal Baru'}</h2>
                            <button type="button" onClick={() => setIsPreviewMode(!isPreviewMode)} className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm ${isPreviewMode ? 'bg-secondary text-white shadow-secondary/30' : 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-100'}`}>
                                <i className={`fas ${isPreviewMode ? 'fa-edit' : 'fa-eye'} mr-2`}></i> {isPreviewMode ? 'Kembali Edit' : 'Mode Preview'}
                            </button>
                        </div>

                        <div className="p-8">
                            {isPreviewMode ? (
                                <div className="space-y-6">
                                    <div className="flex gap-2 border-b border-slate-100 pb-4 mb-6">
                                        <span className={`text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg ${formData.difficulty === 'Mudah' ? 'bg-success/10 text-success' : formData.difficulty === 'Sedang' ? 'bg-secondary/10 text-secondary' : 'bg-rose-100 text-rose-600'}`}>{formData.difficulty}</span>
                                        <span className="text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg bg-primary/10 text-primary">Skor: {formData.points} Poin</span>
                                    </div>
                                    <div className="text-lg text-slate-800 font-medium rich-text-content leading-relaxed" dangerouslySetInnerHTML={{ __html: formData.question || '<span class="text-slate-400 italic">Pertanyaan kosong...</span>' }} />
                                    
                                    {formData.type === 'MCQ' && (
                                        <div className="space-y-3 mt-8">
                                            {(formData.options||[]).map(opt => (
                                                <div key={opt.id} className={`flex items-start p-5 border-2 rounded-2xl ${formData.correctAnswer === opt.id ? 'border-success bg-success/5 shadow-md' : 'border-slate-100 bg-slate-50'}`}>
                                                    <div className="flex items-center h-6 mt-0.5"><input type="radio" checked={formData.correctAnswer === opt.id} readOnly className={`w-5 h-5 ${formData.correctAnswer === opt.id ? 'accent-success' : 'accent-slate-300'}`} /></div>
                                                    <div className={`ml-4 flex-1 flex ${formData.correctAnswer === opt.id ? 'text-success-800' : 'text-slate-600'}`}><span className="font-black w-8 mt-0.5">{opt.id}.</span><div className="flex-1 rich-text-content" dangerouslySetInnerHTML={{__html: opt.text || '-'}}></div></div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {formData.type === 'SHORT_ANSWER' && (
                                        <div className="mt-8 p-6 bg-success/10 rounded-2xl border border-success/20">
                                            <h4 className="font-black text-success-800 uppercase tracking-widest text-xs mb-2">Kunci Jawaban Singkat:</h4>
                                            <div className="font-bold text-lg text-success">{formData.correctAnswer || '-'}</div>
                                        </div>
                                    )}

                                    {formData.type === 'ESSAY' && (
                                        <div className="mt-8 p-6 bg-secondary/10 rounded-2xl border border-secondary/20">
                                            <h4 className="font-black text-secondary-800 uppercase tracking-widest text-xs mb-4">Rubrik Penilaian / Kunci:</h4>
                                            <div className="rich-text-content text-slate-800 font-medium" dangerouslySetInnerHTML={{__html: formData.correctAnswer || '-'}}></div>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <form onSubmit={saveQuestion} className="space-y-8 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Tipe Soal</label>
                                            <select value={formData.type} onChange={e => {
                                                const t = e.target.value;
                                                if(t === 'MCQ') setFormData({...defaultMCQ, id: formData.id, folder: formData.folder, question: formData.question});
                                                else if(t === 'SHORT_ANSWER') setFormData({...defaultSHORT, id: formData.id, folder: formData.folder, question: formData.question});
                                                else if(t === 'ESSAY') setFormData({...defaultESSAY, id: formData.id, folder: formData.folder, question: formData.question});
                                            }} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white font-bold text-slate-800 focus:border-primary outline-none transition-colors cursor-pointer">
                                                <option value="MCQ">Pilihan Ganda</option><option value="SHORT_ANSWER">Isian Singkat</option><option value="ESSAY">Uraian / Esai</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Pilih Folder</label>
                                            <select value={formData.folder || filterFolder} onChange={e => setFormData({...formData, folder: e.target.value})} className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-white font-bold text-slate-800 focus:border-primary outline-none transition-colors cursor-pointer">
                                                {availableFolders.map(f => <option key={f} value={f}>{f}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Tingkat Kesulitan</label>
