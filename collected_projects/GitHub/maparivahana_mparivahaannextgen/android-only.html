<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Required</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: #0b4fa3;
      color: white;
    }

    .box {
      padding: 20px;
      max-width: 420px;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .qr {
      background: white;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
    }

    .qr img {
      width: 180px;
      height: 180px;
      display: block;
    }

    .note {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Android Device Required</h2>
  <p>
    To access this service, please open this page on an Android device.
  </p>

  <!-- QR points to this site's download page — update YOUR_SITE_URL below after you deploy -->
  <div class="qr">
    <img id="qrImage" src="" alt="QR code to open on Android">
  </div>

  <div class="note">
    Scan this QR using your Android phone
  </div>
</div>

<script>
  // After hosting, set this to your public page URL (folder that contains index.html)
  // Example: "https://yourdomain.com/parivahan/nextgen/"
  var YOUR_SITE_URL = window.location.href.replace(/android-only\.html.*$/, "download.html");

  document.getElementById("qrImage").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
    encodeURIComponent(YOUR_SITE_URL);
</script>

</body>
</html>
