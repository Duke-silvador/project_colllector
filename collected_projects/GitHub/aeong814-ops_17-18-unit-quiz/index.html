function buildQueue(){
  const ids = [...S.sel].sort((a,b)=>a-b);
  const ts = TYPES.map(t=>t.k).filter(k=>S.types.has(k));
  let list = [];
  if(S.sort==='type'){ ts.forEach(t=>ids.forEach(id=>list.push({pid:id,type:t}))); }
  else { ids.forEach(id=>ts.forEach(t=>list.push({pid:id,type:t}))); }
  if(S.sort==='random') list = shuffle(list);
  return list;
}

/* ---------- 문제 화면 ---------- */
function passageHTML(q, d, st){
  const foot = d.gloss && d.gloss.length ? `<div class="foot">${d.gloss.join(' ').split(/\s(?=\*+)/).map(esc).join('<br>')}</div>` : '';
  if(q.type==='topic') return `<p class="passage">${esc(d.text)}</p>${foot}`;
  if(q.type==='blank'){
    const parts = esc(q.text).split('[[BLANK]]');
    const fill = st.done ? `<span class="blank fill">${esc(q.options[q.answer])}</span>` : `<span class="blank">&nbsp;</span>`;
    return `<p class="passage">${parts[0]}${fill}${parts[1]}</p>${foot}`;
  }
  if(q.type==='grammar'){
    const html = esc(q.text).replace(/\{\{(\d)\|(.*?)\}\}/g,(m,n,tx)=>{
      const i = +n-1; let cls='gm', extra='';
      if(st.done){
        if(i===q.answer){ cls+=' bad'; extra=`<span class="fix">→ ${esc(q.fix)}</span>`; }
        else if(i===st.pick){ cls+=' pick'; }
      }
      return `<span class="${cls}"><span class="gn">${CIRC[i]}</span><u>${tx}</u>${extra}</span>`;
    });
    return `<p class="passage">${html}</p>${foot}`;
  }
  if(q.type==='order'){
    return `<div class="block given"><span class="lab">주어진 글</span>${esc(q.given)}</div>` +
      ['A','B','C'].map(l=>`<div class="block"><span class="lab">(${l})</span>${esc(q.chunks[l])}</div>`).join('');
  }
  return '';
}
function orderedHTML(q){
  const lab = q.exp.replace('원문 순서: 주어진 글 → ','').split(' → ').map(s=>s.replace(/[()]/g,''));
  return `<div class="ordered">${[esc(q.given)].concat(lab.map(l=>esc(q.chunks[l]))).join(' ')}</div>`;
}
function renderQuiz(){
  const it = S.queue[S.i], d = DATA[it.pid-1], q = getQ(it.pid,it.type), st = S.cur;
  const tmeta = TYPES.find(t=>t.k===it.type);
  const isNum = q.type==='grammar';
  const optsHTML = q.options.map((o,i)=>{
    let cls='opt';
    if(st.done){ if(i===q.answer) cls+=' ok'; else if(i===st.pick) cls+=' no'; else cls+=' dim'; }
    const label = isNum ? '' : `<span class="t">${esc(o)}</span>`;
    return `<button class="${cls}" data-pick="${i}" ${st.done?'disabled':''} aria-label="${i+1}번"><span class="n">${isNum?CIRC[i]:i+1}</span>${label}</button>`;
  }).join('');
  const ok = st.done && st.pick===q.answer;
  const last = S.i===S.queue.length-1;
  const fb = st.done ? `<div class="fb ${ok?'ok':'no'}">
      <h3>${ok?'정답이에요':'아쉬워요, 정답은 '+(isNum?CIRC[q.answer]:(q.answer+1)+'번')+' 이에요'}</h3>
      <p>${esc(q.exp)}</p>
      ${q.type==='order'?`<details><summary>정답 순서로 이어 읽기</summary>${orderedHTML(q)}</details>`:''}
    </div>
    <div class="nextrow"><span class="hint">Enter 키로 다음 문제</span><button class="btn primary" data-act="next">${last?'결과 보기':'다음 문제'}</button></div>` : `<div class="nextrow"><span class="hint">${isNum?'':'번호 키(1–5)로도 고를 수 있어요'}</span></div>`;
  $app.innerHTML = `
    <div class="top"><button class="link" data-act="quit">← 그만하기</button>
      <div class="prog"><i style="width:${(S.i+(st.done?1:0))/S.queue.length*100}%"></i></div>
      <span class="count">${S.i+1} / ${S.queue.length}</span></div>
    <div class="card">
      <div class="meta"><span class="tag">${tmeta.name}</span><span>Unit ${d.unit} · ${esc(d.title)}</span><span>${esc(d.exam)}</span></div>
      <h3 class="q">${q.q}</h3>
      ${passageHTML(q,d,st)}
      <div class="opts ${isNum?'num':''}" role="group" aria-label="선택지">${optsHTML}</div>
      ${fb}
    </div>`;
  if(st.done){ const el = $app.querySelector('.fb'); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function pick(i){
  const st = S.cur; if(st.done) return;
  const it = S.queue[S.i], q = getQ(it.pid,it.type);
  if(i<0 || i>=q.options.length) return;
  st.done = true; st.pick = i;
  const r = i===q.answer ? 1 : 0;
  mem.res[rk(it.pid,it.type)] = {r, t:Date.now()}; save();
  S.log.push({pid:it.pid, type:it.type, pick:i, r});
  renderQuiz();
}
function next(){
  if(S.i < S.queue.length-1){ S.i++; S.cur={done:false,pick:null}; window.scrollTo(0,0); render(); }
  else { S.screen='result'; window.scrollTo(0,0); render(); }
}

/* ---------- 결과 ---------- */
function renderResult(){
  const n = S.log.length, c = S.log.filter(l=>l.r).length;
  const pct = n? Math.round(c/n*100):0;
  const bars = TYPES.map(t=>{ const L=S.log.filter(l=>l.type===t.k); if(!L.length) return ''; const cc=L.filter(l=>l.r).length;
    return `<div class="brow"><span>${t.name}</span><div class="track"><i style="width:${cc/L.length*100}%"></i></div><span>${cc} / ${L.length}</span></div>`; }).join('');
  const wr = S.log.filter(l=>!l.r);
  const wrHTML = wr.map(l=>{
    const d = DATA[l.pid-1], q = getQ(l.pid,l.type), isNum=q.type==='grammar';
    const lab = i => isNum? CIRC[i] : (i+1)+'번';
    const txt = i => isNum? '' : ' ' + esc(q.options[i]);
    return `<div class="w"><div class="h">${TYPES.find(t=>t.k===l.type).name} · Unit ${d.unit} · ${esc(d.title)}</div>
      <div class="a">내 답 <s>${lab(l.pick)}${txt(l.pick)}</s></div>
      <div class="a">정답 <b>${lab(q.answer)}${txt(q.answer)}</b></div>
      <div class="e">${esc(q.exp)}</div></div>`;
  }).join('');
  $app.innerHTML = `
    <header><h1>${wr.length? '결과': '전부 맞혔어요'}</h1></header>
    <div class="card" style="margin-top:16px">
      <div class="score">${c}<small> / ${n}문항 · ${pct}%</small></div>
      <div class="bars">${bars}</div>
    </div>
    <div class="actions">
      ${wr.length?`<button class="btn primary" data-act="retry">틀린 ${wr.length}문항 다시 풀기</button>`:''}
      <button class="btn" data-act="home">처음으로</button>
    </div>
    ${wr.length?`<section class="sec"><h2>틀린 문제</h2><div class="wrongs">${wrHTML}</div></section>`:''}`;
}

function render(){ ({home:renderHome, quiz:renderQuiz, result:renderResult})[S.screen](); }

/* ---------- 이벤트 ---------- */
$app.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  const D = b.dataset;
  if(D.range){
    const all = DATA.map(d=>d.id);
    const m = {all, u17:DATA.filter(d=>d.unit===17).map(d=>d.id), u18:DATA.filter(d=>d.unit===18).map(d=>d.id),
               wrong:[...new Set(wrongKeys().map(k=>+k.split('-')[0]))]};
    S.sel = new Set(m[D.range]); renderHome(); return;
  }
  if(D.type){ S.types.has(D.type)? S.types.delete(D.type) : S.types.add(D.type); renderHome(); return; }
  if(D.sort){ S.sort = D.sort; renderHome(); return; }
  if(D.pid){ const id=+D.pid; S.sel.has(id)? S.sel.delete(id) : S.sel.add(id); const y=window.scrollY; renderHome(); window.scrollTo(0,y); return; }
  if(D.pick!==undefined){ pick(+D.pick); return; }
  switch(D.act){
    case 'start': startQueue(buildQueue()); break;
    case 'review': {
      const ks = wrongKeys().map(k=>{const [p,t]=k.split('-'); return {pid:+p,type:t};})
        .sort((a,b)=>a.pid-b.pid || TYPES.findIndex(t=>t.k===a.type)-TYPES.findIndex(t=>t.k===b.type));
      startQueue(ks,'review'); break; }
    case 'next': next(); break;
    case 'quit': S.screen = S.log.length? 'result':'home'; render(); break;
    case 'home': S.screen='home'; render(); break;
    case 'retry': startQueue(S.log.filter(l=>!l.r).map(l=>({pid:l.pid,type:l.type})),'retry'); break;
    case 'reset':
      if(S.resetArm){ mem={res:{}}; save(); S.resetArm=false; }
      else { S.resetArm=true; setTimeout(()=>{ if(S.resetArm && S.screen==='home'){ S.resetArm=false; renderHome(); } },3500); }
      renderHome(); break;
  }
});
document.addEventListener('keydown', e=>{
  if(S.screen!=='quiz') return;
  if(/^[1-5]$/.test(e.key) && !S.cur.done){ pick(+e.key-1); }
  else if((e.key==='Enter'||e.key===' '||e.key==='ArrowRight') && S.cur.done){ e.preventDefault(); next(); }
});
render();
})();
</script>
