ut that humility ultimately pays off.", "options": ["①", "②", "③", "④", "⑤"], "answer": 4, "fix": "adheres to", "wrong": "adhering to", "exp": "정답 ⑤  adhering to → adheres to.  문장의 주어 servant leadership에 대한 본동사가 필요. dating back ~은 수식어구이므로 adheres."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders.", "chunks": {"A": "Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted. In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership.", "B": "We must reexamine this stereotype, however, as it doesn’t always hold true. Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership.", "C": "So-called servant leadership, dating back to ancient philosophical literature, adheres to the belief that a company’s goals are best achieved by helping workers or customers achieve their goals. Such leaders do not seek attention but rather want to shine a light on others’ wins and achievements; servant leadership requires humility, but that humility ultimately pays off."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 0, "exp": "원문 순서: 주어진 글 → (A) → (B) → (C)"}]}, {"id": 11, "unit": 17, "title": "업무 몰입의 원인", "exam": "2023년 9월 인천광역시", "text": "Much research has been carried out on the causes of engagement, an issue that is important from both a theoretical and practical standpoint: identifying the drivers of work engagement may enable us to manipulate or influence it. The causes of engagement fall into two major camps: situational and personal. The most influential situational causes are job resources, feedback and leadership, the latter, of course, being responsible for job resources and feedback. Indeed, leaders influence engagement by giving their employees honest and constructive feedback on their performance, and by providing them with the necessary resources that enable them to perform their job well. It is, however, noteworthy that although engagement drives job performance, job performance also drives engagement. In other words, when employees are able to do their jobs well—to the point that they match or exceed their own expectations and ambitions—they will engage more, be proud of their achievements, and find work more meaningful. This is especially evident when people are employed in jobs that align with their values.", "summary": "", "gloss": ["*align with: ~과 일치하다"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["Differences between theoretical and practical research", "The causes of work engagement: situational and personal factors, with engagement and performance reinforcing each other", "Why leaders should avoid giving feedback", "Strategies for improving employee salaries", "Ways to measure job performance accurately"], "answer": 1, "exp": "몰입의 원인은 상황적/개인적 요인으로 나뉘고, 몰입이 성과를 높일 뿐 아니라 성과도 몰입을 높인다는 글."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Much research has been carried out on the causes of engagement, an issue that is important from both a theoretical and practical standpoint: identifying the drivers of work engagement may enable us to manipulate or influence it. The causes of engagement fall into two major camps: situational and personal. The most influential situational causes are job resources, feedback and leadership, the latter, of course, being responsible for job resources and feedback. Indeed, leaders influence engagement by giving their employees honest and constructive feedback on their performance, and by providing them with the necessary resources that enable them to perform their job well. It is, however, noteworthy that although engagement drives job performance, [[BLANK]]. In other words, when employees are able to do their jobs well—to the point that they match or exceed their own expectations and ambitions—they will engage more, be proud of their achievements, and find work more meaningful. This is especially evident when people are employed in jobs that align with their values.", "options": ["leadership has no influence on engagement", "job performance also drives engagement", "personal values rarely affect performance", "engagement does not depend on job resources", "feedback weakens employees' motivation"], "answer": 1, "exp": "although engagement drives job performance와 대응 → 반대 방향 관계. 뒤의 In other words 이하가 근거.  (정답: job performance also drives engagement)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "Much research has been carried out on the causes of engagement, an issue {{1|that is important}} from both a theoretical and practical standpoint: identifying the drivers of work engagement may {{2|enable us manipulate}} or influence it. The causes of engagement {{3|fall into}} two major camps: situational and personal. The most influential situational causes are job resources, feedback and leadership, the latter, of course, {{4|being responsible for}} job resources and feedback. Indeed, leaders influence engagement by giving their employees honest and constructive feedback on their performance, and by providing them with the necessary resources that enable them to perform their job well. It is, however, noteworthy that although engagement drives job performance, job performance also drives engagement. In other words, when employees {{5|are able to do}} their jobs well—to the point that they match or exceed their own expectations and ambitions—they will engage more, be proud of their achievements, and find work more meaningful. This is especially evident when people are employed in jobs that align with their values.", "options": ["①", "②", "③", "④", "⑤"], "answer": 1, "fix": "enable us to manipulate", "wrong": "enable us manipulate", "exp": "정답 ②  enable us manipulate → enable us to manipulate.  enable + 목적어 + to부정사 구문."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "Much research has been carried out on the causes of engagement, an issue that is important from both a theoretical and practical standpoint: identifying the drivers of work engagement may enable us to manipulate or influence it.", "chunks": {"C": "The causes of engagement fall into two major camps: situational and personal. The most influential situational causes are job resources, feedback and leadership, the latter, of course, being responsible for job resources and feedback.", "A": "Indeed, leaders influence engagement by giving their employees honest and constructive feedback on their performance, and by providing them with the necessary resources that enable them to perform their job well. It is, however, noteworthy that although engagement drives job performance, job performance also drives engagement.", "B": "In other words, when employees are able to do their jobs well—to the point that they match or exceed their own expectations and ambitions—they will engage more, be proud of their achievements, and find work more meaningful. This is especially evident when people are employed in jobs that align with their values."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 3, "exp": "원문 순서: 주어진 글 → (C) → (A) → (B)"}]}, {"id": 12, "unit": 17, "title": "실험의 본질: 조작과 통제", "exam": "2023년 6월 부산광역시", "text": "The fundamental nature of the experimental method is manipulation and control. Scientists manipulate a variable of interest, and see if there’s a difference. At the same time, they attempt to control for the potential effects of all other variables. The importance of controlled experiments in identifying the underlying causes of events cannot be overstated. In the real-uncontrolled-world, variables are often correlated. For example, people who take vitamin supplements may have different eating and exercise habits than people who don’t take vitamins. As a result, if we want to study the health effects of vitamins, we can’t merely observe the real world, since any of these factors (the vitamins, diet, or exercise) may affect health. Rather, we have to create a situation that doesn’t actually occur in the real world. That’s just what scientific experiments do. They try to separate the naturally occurring relationship in the world by manipulating one specific variable at a time, while holding everything else constant.", "summary": "", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["How variables are correlated in everyday life", "Why real-world observation is better than experiments", "Controlled experiments identify causes by manipulating one variable while holding others constant", "The limitations of scientific experiments in medicine", "The health effects of vitamin supplements"], "answer": 2, "exp": "현실에서는 변인들이 서로 얽혀 있어 단순 관찰로는 원인을 알 수 없으므로, 한 번에 하나의 변인만 조작하고 나머지는 통제한다."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "The fundamental nature of the experimental method is manipulation and control. Scientists manipulate a variable of interest, and see if there’s a difference. At the same time, they attempt to control for the potential effects of all other variables. The importance of controlled experiments in identifying the underlying causes of events cannot be overstated. In the real-uncontrolled-world, variables are often correlated. For example, people who take vitamin supplements may have different eating and exercise habits than people who don’t take vitamins. As a result, if we want to study the health effects of vitamins, we can’t merely observe the real world, since any of these factors (the vitamins, diet, or exercise) may affect health. Rather, we have to create a situation that doesn’t actually occur in the real world. That’s just what scientific experiments do. They try to separate the naturally occurring relationship in the world by manipulating one specific variable at a time, while [[BLANK]].", "options": ["holding everything else constant", "allowing other variables to change freely", "ignoring the potential effects of other factors", "comparing real-world eating habits", "observing all variables at once"], "answer": 0, "exp": "처음 문장의 'manipulation and control'. 변인 하나를 조작하는 동안 나머지는 '일정하게 유지'해야 한다.  (정답: holding everything else constant)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "The fundamental nature of the experimental method is manipulation and control. Scientists manipulate a variable of interest, and see if there’s a difference. At the same time, they attempt {{1|to control for}} the potential effects of all other variables. The importance of controlled experiments in identifying the underlying causes of events {{2|cannot overstate}}. In the real-uncontrolled-world, variables {{3|are often correlated}}. For example, people who take vitamin supplements may have different eating and exercise habits than people who don’t take vitamins. As a result, if we want to study the health effects of vitamins, we can’t merely observe the real world, since any of these factors (the vitamins, diet, or exercise) {{4|may affect health}}. Rather, we have to create a situation that doesn’t actually occur in the real world. That’s just what scientific experiments do. They try to separate the naturally occurring relationship in the world {{5|by manipulating}} one specific variable at a time, while holding everything else constant.", "options": ["①", "②", "③", "④", "⑤"], "answer": 1, "fix": "cannot be overstated", "wrong": "cannot overstate", "exp": "정답 ②  cannot overstate → cannot be overstated.  주어 The importance는 '과장되는' 대상이므로 수동 → cannot be overstated."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "The fundamental nature of the experimental method is manipulation and control.", "chunks": {"B": "Scientists manipulate a variable of interest, and see if there’s a difference. At the same time, they attempt to control for the potential effects of all other variables. The importance of controlled experiments in identifying the underlying causes of events cannot be overstated. In the real-uncontrolled-world, variables are often correlated.", "A": "For example, people who take vitamin supplements may have different eating and exercise habits than people who don’t take vitamins. As a result, if we want to study the health effects of vitamins, we can’t merely observe the real world, since any of these factors (the vitamins, diet, or exercise) may affect health.", "C": "Rather, we have to create a situation that doesn’t actually occur in the real world. That’s just what scientific experiments do. They try to separate the naturally occurring relationship in the world by manipulating one specific variable at a time, while holding everything else constant."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)"], "answer": 2, "exp": "원문 순서: 주어진 글 → (B) → (A) → (C)"}]}, {"id": 13, "unit": 17, "title": "색깔 식품과 파이토케미컬", "exam": "2023년 6월 부산광역시", "text": "Why do people in the Mediterranean live longer and have a lower incidence of disease? Some people say it’s because of what they eat. Their diet is full of fresh fruits, fish, vegetables, whole grains, and nuts. Individuals in these cultures drink red wine and use great amounts of olive oil. Why is that food pattern healthy? One reason is that they are eating a palette of colors. More and more research is surfacing that shows us the benefits of the thousands of colorful “phytochemicals” (phyto=plant) that exist in foods. These healthful, non-nutritive compounds in plants provide color and function to the plant and add to the health of the human body. Each color connects to a particular compound that serves a specific function in the body. For example, if you don’t eat purple foods, you are probably missing out on anthocyanins, important brain protection compounds. Similarly, if you avoid green-colored foods, you may be lacking chlorophyll, a plant antioxidant that guards your cells from damage.", "summary": "", "gloss": ["*antioxidant: 산화 방지제"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["The differences between nutritive and non-nutritive compounds", "How olive oil prevents brain disease", "Colorful plant foods contain phytochemicals that support the health of the human body", "Why Mediterranean people drink red wine", "The dangers of avoiding fresh fruits and vegetables"], "answer": 2, "exp": "지중해 식단이 건강한 이유는 다양한 색의 식물에 든 파이토케미컬 때문이라는 글. 색마다 몸에서 맡는 기능이 다르다."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Why do people in the Mediterranean live longer and have a lower incidence of disease? Some people say it’s because of what they eat. Their diet is full of fresh fruits, fish, vegetables, whole grains, and nuts. Individuals in these cultures drink red wine and use great amounts of olive oil. Why is that food pattern healthy? One reason is that they are eating [[BLANK]]. More and more research is surfacing that shows us the benefits of the thousands of colorful “phytochemicals” (phyto=plant) that exist in foods. These healthful, non-nutritive compounds in plants provide color and function to the plant and add to the health of the human body. Each color connects to a particular compound that serves a specific function in the body. For example, if you don’t eat purple foods, you are probably missing out on anthocyanins, important brain protection compounds. Similarly, if you avoid green-colored foods, you may be lacking chlorophyll, a plant antioxidant that guards your cells from damage.", "options": ["a limited number of plants", "only low-calorie foods", "processed and preserved foods", "a palette of colors", "a large amount of red meat"], "answer": 3, "exp": "뒤에 colorful phytochemicals, 'Each color connects to a particular compound'가 이어지므로 '다양한 색'.  (정답: a palette of colors)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "Why do people in the Mediterranean live longer and have a lower incidence of disease? Some people say it’s because of what they eat. Their diet {{1|is full of}} fresh fruits, fish, vegetables, whole grains, and nuts. Individuals in these cultures drink red wine and use great amounts of olive oil. Why is that food pattern healthy? One reason is that they are eating a palette of colors. More and more research is surfacing that shows us the benefits of the thousands of colorful “phytochemicals” (phyto=plant) {{2|that exist in foods}}. These healthful, non-nutritive compounds in plants provide color and function to the plant and add to the health of the human body. Each color connects to a particular compound {{3|that serve}} a specific function in the body. For example, if you don’t eat purple foods, you are probably missing out on anthocyanins, important brain protection compounds. Similarly, if you avoid green-colored foods, you {{4|may be lacking}} chlorophyll, a plant antioxidant {{5|that guards your cells}} from damage.", "options": ["①", "②", "③", "④", "⑤"], "answer": 2, "fix": "that serves", "wrong": "that serve", "exp": "정답 ③  that serve → that serves.  선행사 a particular compound가 단수이므로 serves."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "Why do people in the Mediterranean live longer and have a lower incidence of disease?", "chunks": {"B": "Some people say it’s because of what they eat. Their diet is full of fresh fruits, fish, vegetables, whole grains, and nuts. Individuals in these cultures drink red wine and use great amounts of olive oil. Why is that food pattern healthy? One reason is that they are eating a palette of colors.", "C": "More and more research is surfacing that shows us the benefits of the thousands of colorful “phytochemicals” (phyto=plant) that exist in foods. These healthful, non-nutritive compounds in plants provide color and function to the plant and add to the health of the human body.", "A": "Each color connects to a particular compound that serves a specific function in the body. For example, if you don’t eat purple foods, you are probably missing out on anthocyanins, important brain protection compounds. Similarly, if you avoid green-colored foods, you may be lacking chlorophyll, a plant antioxidant that guards your cells from damage."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 2, "exp": "원문 순서: 주어진 글 → (B) → (C) → (A)"}]}, {"id": 14, "unit": 17, "title": "전기 물고기의 의사소통", "exam": "2023년 3월 서울특별시", "text": "Electric communication is mainly known in fish. The electric signals are produced in special electric organs. When the signal is discharged the electric organ will be negatively loaded compared to the head and an electric field is created around the fish. A weak electric current is created also in ordinary muscle cells when they contract. In the electric organ the muscle cells are connected in larger chunks, which makes the total current intensity larger than in ordinary muscles. The fish varies the signals by changing the form of the electric field or the frequency of discharging. The system is only working over small distances, about one to two meters. This is an advantage since the species using the signal system often live in large groups with several other species. If many fish send out signals at the same time, the short range decreases the risk of interference.", "summary": "", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["How muscle cells produce current in ordinary animals", "How electric fish communicate with electric signals over short distances", "Ways fish detect predators", "Why fish live in large groups of several species", "The dangers of interference in underwater communication"], "answer": 1, "exp": "전기 기관에서 신호를 만들어 전기장의 형태·방전 빈도로 신호를 바꾸며, 짧은 거리에서만 작동해 간섭 위험이 줄어든다는 글."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Electric communication is mainly known in fish. The electric signals are produced in special electric organs. When the signal is discharged the electric organ will be negatively loaded compared to the head and an electric field is created around the fish. A weak electric current is created also in ordinary muscle cells when they contract. In the electric organ the muscle cells are connected in larger chunks, which makes the total current intensity larger than in ordinary muscles. The fish varies the signals by changing the form of the electric field or the frequency of discharging. The system is only working over small distances, about one to two meters. This is an advantage since the species using the signal system often live in large groups with several other species. If many fish send out signals at the same time, [[BLANK]].", "options": ["the electric organs stop working", "the fish lose their ability to vary signals", "the signals become stronger over long distances", "the short range decreases the risk of interference", "the signals travel several kilometers"], "answer": 3, "exp": "앞 문장 'only working over small distances'가 근거. 짧은 도달 범위 = 이점.  (정답: the short range decreases the risk of interference)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "Electric communication is mainly known in fish. The electric signals {{1|are produced}} in special electric organs. When the signal {{2|is discharging}} the electric organ will be negatively loaded compared to the head and an electric field is created around the fish. A weak electric current is created also in ordinary muscle cells when they contract. In the electric organ the muscle cells are connected in larger chunks, {{3|which makes}} the total current intensity {{4|larger than}} in ordinary muscles. The fish varies the signals by changing the form of the electric field or the frequency of discharging. The system is only working over small distances, about one to two meters. This is an advantage since the species {{5|using the signal system}} often live in large groups with several other species. If many fish send out signals at the same time, the short range decreases the risk of interference.", "options": ["①", "②", "③", "④", "⑤"], "answer": 1, "fix": "is discharged", "wrong": "is discharging", "exp": "정답 ②  is discharging → is discharged.  신호가 '방출되는' 것이므로 수동 → is discharged."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "Electric communication is mainly known in fish.", "chunks": {"A": "The electric signals are produced in special electric organs. When the signal is discharged the electric organ will be negatively loaded compared to the head and an electric field is created around the fish. A weak electric current is created also in ordinary muscle cells when they contract.", "C": "In the electric organ the muscle cells are connected in larger chunks, which makes the total current intensity larger than in ordinary muscles. The fish varies the signals by changing the form of the electric field or the frequency of discharging.", "B": "The system is only working over small distances, about one to two meters. This is an advantage since the species using the signal system often live in large groups with several other species. If many fish send out signals at the same time, the short range decreases the risk of interference."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)"], "answer": 1, "exp": "원문 순서: 주어진 글 → (A) → (C) → (B)"}]}, {"id": 15, "unit": 17, "title": "아이들이 채소를 싫어하는 이유", "exam": "2022년 11월 경기도", "text": "In the natural world, if an animal consumes a plant with enough antinutrients to make it feel unwell, it won’t eat that plant again. Intuitively, animals also know to stay away from these plants. Years of evolution and information being passed down created this innate intelligence. This “intuition,” though, is not just seen in animals. Have you ever wondered why most children hate vegetables? Dr. Steven Gundry justifies this as part of our genetic programming, our inner intelligence. Since many vegetables are full of antinutrients, your body tries to keep you away from them while you are still fragile and in development. It does this by making your taste buds perceive these flavors as bad and even disgusting. As you grow and your body becomes stronger enough to tolerate these antinutrients, suddenly they no longer taste as bad as before.", "summary": "", "gloss": ["*taste bud: 미뢰(味蕾)"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["How to make vegetables taste better for children", "Why animals avoid eating most plants", "The role of evolution in making vegetables nutritious", "Children dislike vegetables because their bodies are programmed to avoid antinutrients while still developing", "The differences between children's and adults' bodies"], "answer": 3, "exp": "동물이 직관적으로 해로운 식물을 피하듯, 아이의 몸은 항영양소가 든 채소를 맛으로 거부하게 만든다는 글."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "In the natural world, if an animal consumes a plant with enough antinutrients to make it feel unwell, it won’t eat that plant again. Intuitively, animals also know to stay away from these plants. Years of evolution and information being passed down created this innate intelligence. This “intuition,” though, is not just seen in animals. Have you ever wondered why most children hate vegetables? Dr. Steven Gundry justifies this as part of our genetic programming, our inner intelligence. Since many vegetables are full of antinutrients, your body tries to keep you away from them while you are still fragile and in development. It does this by making your taste buds perceive these flavors as bad and even disgusting. As you grow and your body becomes stronger enough to tolerate these antinutrients, suddenly [[BLANK]].", "options": ["they become less nutritious", "you begin to feel unwell after eating them", "you start to avoid them even more", "your taste buds stop working", "they no longer taste as bad as before"], "answer": 4, "exp": "성장해 항영양소를 견딜 만큼 몸이 강해지면 몸이 더 이상 피하게 만들 필요가 없다 → 맛이 덜 나쁘게 느껴진다.  (정답: they no longer taste as bad as before)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "In the natural world, if an animal consumes a plant with enough antinutrients {{1|to make it feel unwell}}, it won’t eat that plant again. Intuitively, animals also know {{2|to stay away from}} these plants. Years of evolution and information {{3|being passed down}} created this innate intelligence. This “intuition,” though, is not just seen in animals. Have you ever wondered why most children hate vegetables? Dr. Steven Gundry justifies this as part of our genetic programming, our inner intelligence. Since many vegetables are full of antinutrients, your body {{4|tries to keep}} you away from them while you are still fragile and in development. It does this by {{5|making your taste buds to perceive}} these flavors as bad and even disgusting. As you grow and your body becomes stronger enough to tolerate these antinutrients, suddenly they no longer taste as bad as before.", "options": ["①", "②", "③", "④", "⑤"], "answer": 4, "fix": "making your taste buds perceive", "wrong": "making your taste buds to perceive", "exp": "정답 ⑤  making your taste buds to perceive → making your taste buds perceive.  사역동사 make + 목적어 + 원형부정사(perceive)."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "In the natural world, if an animal consumes a plant with enough antinutrients to make it feel unwell, it won’t eat that plant again.", "chunks": {"B": "Intuitively, animals also know to stay away from these plants. Years of evolution and information being passed down created this innate intelligence. This “intuition,” though, is not just seen in animals. Have you ever wondered why most children hate vegetables?", "C": "Dr. Steven Gundry justifies this as part of our genetic programming, our inner intelligence. Since many vegetables are full of antinutrients, your body tries to keep you away from them while you are still fragile and in development.", "A": "It does this by making your taste buds perceive these flavors as bad and even disgusting. As you grow and your body becomes stronger enough to tolerate these antinutrients, suddenly they no longer taste as bad as before."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (B) - (A)"], "answer": 3, "exp": "원문 순서: 주어진 글 → (B) → (C) → (A)"}]}, {"id": 16, "unit": 17, "title": "적응(adaptation)과 순응(acclimation)", "exam": "2022년 9월 인천광역시", "text": "Adaptation involves changes in a population, with characteristics that are passed from one generation to the next. This is different from acclimation—an individual organism’s changes in response to an altered environment. For example, if you spend the summer outside, you may acclimate to the sunlight: your skin will increase its concentration of dark pigments that protect you from the sun. This is a temporary change, and you won’t pass the temporary change on to future generations. However, the capacity to produce skin pigments is inherited. For populations living in intensely sunny environments, individuals with a good ability to produce skin pigments are more likely to thrive, or to survive, than people with a poor ability to produce pigments, and that trait becomes increasingly common in subsequent generations. If you look around, you can find countless examples of adaptation. The distinctive long neck of a giraffe, for example, developed as individuals that happened to have longer necks had an advantage in feeding on the leaves of tall trees.", "summary": "", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["How individuals change in response to their environments", "The effect of sunlight on human evolution", "How skin pigments protect people from the sun", "Why giraffes developed long necks", "Adaptation is an inherited change in populations, unlike an individual's temporary acclimation"], "answer": 4, "exp": "적응은 세대 간에 전해지는 집단의 변화이고, 순응은 개체의 일시적 변화라는 구분을 햇빛·기린의 예로 설명."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Adaptation involves changes in a population, with characteristics that are passed from one generation to the next. This is different from acclimation—an individual organism’s changes in response to an altered environment. For example, if you spend the summer outside, you may acclimate to the sunlight: your skin will increase its concentration of dark pigments that protect you from the sun. This is a temporary change, and you won’t pass the temporary change on to future generations. However, [[BLANK]]. For populations living in intensely sunny environments, individuals with a good ability to produce skin pigments are more likely to thrive, or to survive, than people with a poor ability to produce pigments, and that trait becomes increasingly common in subsequent generations. If you look around, you can find countless examples of adaptation. The distinctive long neck of a giraffe, for example, developed as individuals that happened to have longer necks had an advantage in feeding on the leaves of tall trees.", "options": ["the capacity to produce skin pigments is inherited", "darker skin is passed on to the next generation", "people in sunny areas lose the ability to produce pigments", "acclimation leads to adaptation in a single generation", "tanning permanently changes your genes"], "answer": 0, "exp": "However 앞은 일시적 변화(전달 안 됨). 대조되는 것은 색소 '생산 능력'이 유전된다는 점.  (정답: the capacity to produce skin pigments is inherited)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "Adaptation involves changes in a population, with characteristics {{1|that are passing}} from one generation to the next. This is {{2|different from}} acclimation—an individual organism’s changes in response to an altered environment. For example, if you spend the summer outside, you may acclimate to the sunlight: your skin {{3|will increase}} its concentration of dark pigments that protect you from the sun. This is a temporary change, and you won’t pass the temporary change on to future generations. However, the capacity to produce skin pigments is inherited. For populations living in intensely sunny environments, individuals with a good ability to produce skin pigments {{4|are more likely to thrive}}, or to survive, than people with a poor ability to produce pigments, and that trait becomes increasingly common in subsequent generations. If you look around, you can find countless examples of adaptation. The distinctive long neck of a giraffe, for example, developed as individuals {{5|that happened to have}} longer necks had an advantage in feeding on the leaves of tall trees.", "options": ["①", "②", "③", "④", "⑤"], "answer": 0, "fix": "that are passed", "wrong": "that are passing", "exp": "정답 ①  that are passing → that are passed.  characteristics는 '전해지는' 대상이므로 수동 → are passed."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "Adaptation involves changes in a population, with characteristics that are passed from one generation to the next.", "chunks": {"A": "This is different from acclimation—an individual organism’s changes in response to an altered environment. For example, if you spend the summer outside, you may acclimate to the sunlight: your skin will increase its concentration of dark pigments that protect you from the sun. This is a temporary change, and you won’t pass the temporary change on to future generations.", "C": "However, the capacity to produce skin pigments is inherited. For populations living in intensely sunny environments, individuals with a good ability to produce skin pigments are more likely to thrive, or to survive, than people with a poor ability to produce pigments, and that trait becomes increasingly common in subsequent generations.", "B": "If you look around, you can find countless examples of adaptation. The distinctive long neck of a giraffe, for example, developed as individuals that happened to have longer necks had an advantage in feeding on the leaves of tall trees."}, "options": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 0, "exp": "원문 순서: 주어진 글 → (A) → (C) → (B)"}]}, {"id": 17, "unit": 17, "title": "빛의 색과 온도, 별의 온도", "exam": "2022년 6월 부산광역시", "text": "One way of measuring temperature occurs if an object is hot enough to visibly glow, such as a metal poker that has been left in a fire. The color of a glowing object is related to its temperature: as the temperature rises, the object is first red and then orange, and finally it gets white, the “hottest” color. The relation between temperature and the color of a glowing object is useful to astronomers. The color of stars is related to their temperature, and since people cannot as yet travel the great distances to the stars and measure their temperature in a more precise way, astronomers rely on their color. This temperature is of the surface of the star, the part of the star which is emitting the light that can be seen. The interior of the star is at a much higher temperature, though it is concealed. But the information obtained from the color of the star is still useful.", "summary": "", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["Astronomers estimate the surface temperatures of stars from their color", "How to measure the temperature of metal objects", "The relation between light and heat in fires", "The difficulties of traveling to distant stars", "Why the interior of a star is hotter than its surface"], "answer": 0, "exp": "달궈진 물체의 색은 온도와 관련 있다 → 별까지 갈 수 없는 천문학자는 색으로 표면 온도를 추정한다."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "One way of measuring temperature occurs if an object is hot enough to visibly glow, such as a metal poker that has been left in a fire. The color of a glowing object is related to its temperature: as the temperature rises, the object is first red and then orange, and finally it gets white, the “hottest” color. The relation between temperature and the color of a glowing object is useful to astronomers. The color of stars is related to their temperature, and since people cannot as yet travel the great distances to the stars and measure their temperature in a more precise way, [[BLANK]]. This temperature is of the surface of the star, the part of the star which is emitting the light that can be seen. The interior of the star is at a much higher temperature, though it is concealed. But the information obtained from the color of the star is still useful.", "options": ["astronomers measure their brightness only", "astronomers rely on their color", "astronomers wait for the stars to cool", "astronomers measure their interior directly", "astronomers use glowing metal objects"], "answer": 1, "exp": "since 이하 이유: 별까지 가서 더 정확히 측정할 수 없다 → 그래서 색에 의존.  (정답: astronomers rely on their color)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "One way of measuring temperature occurs if an object is {{1|hot enough to}} visibly glow, such as a metal poker that has been {{2|leaving in a fire}}. The color of a glowing object {{3|is related to}} its temperature: {{4|as the temperature rises}}, the object is first red and then orange, and finally it gets white, the “hottest” color. The relation between temperature and the color of a glowing object is useful to astronomers. The color of stars is related to their temperature, and since people cannot as yet travel the great distances to the stars and measure their temperature in a more precise way, astronomers rely on their color. This temperature is of the surface of the star, the part of the star {{5|which is emitting}} the light that can be seen. The interior of the star is at a much higher temperature, though it is concealed. But the information obtained from the color of the star is still useful.", "options": ["①", "②", "③", "④", "⑤"], "answer": 1, "fix": "left in a fire", "wrong": "leaving in a fire", "exp": "정답 ②  leaving in a fire → left in a fire.  금속 부지깽이는 불 속에 '놓아둔' 대상 → 수동 has been left."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "One way of measuring temperature occurs if an object is hot enough to visibly glow, such as a metal poker that has been left in a fire.", "chunks": {"B": "The color of a glowing object is related to its temperature: as the temperature rises, the object is first red and then orange, and finally it gets white, the “hottest” color. The relation between temperature and the color of a glowing object is useful to astronomers.", "A": "The color of stars is related to their temperature, and since people cannot as yet travel the great distances to the stars and measure their temperature in a more precise way, astronomers rely on their color.", "C": "This temperature is of the surface of the star, the part of the star which is emitting the light that can be seen. The interior of the star is at a much higher temperature, though it is concealed. But the information obtained from the color of the star is still useful."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)"], "answer": 2, "exp": "원문 순서: 주어진 글 → (B) → (A) → (C)"}]}, {"id": 18, "unit": 18, "title": "감정과 의사결정", "exam": "2025년 6월 부산광역시", "text": "The study of emotions and decision making is now of considerable importance. This involves the application of various tools afforded by neuroscience. One important stream of the literature examines people with brain damage and how damage to particular parts of the brain known to be responsible for particular cognitive functions impacts on decision making. One example of this research is the work of Antonio Damasio, who finds that when the emotional part of the brain is damaged, this actually reduces the efficacy of decision making. Good decisions are a product of the emotional part of the brain working in conjunction with the deliberative part. This contradicts the assumptions of conventional economics, where emotions play a negative role in the decision-making process. Here it is assumed that decision making can be modeled as being generated in a stoic, unemotional fashion, and that’s why decisions tend to be optimal. But the evidence suggests that emotions actually play an important and, often, a positive role in decision making.", "summary": "The brain’s emotional part working in relation with its deliberative part enhances the effectiveness of decision making, which counters the ideas about emotions in the decision-making process of traditional economics.", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["How brain damage causes decision errors", "The history of neuroscience in economics", "Emotions can improve decision making, contrary to the assumptions of traditional economics", "Antonio Damasio's life and work", "Why decisions should be made without emotions"], "answer": 2, "exp": "뇌의 감정 부분이 손상되면 오히려 의사결정 효율이 떨어진다 → 감정이 부정적이라는 전통 경제학의 가정에 반한다."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "The study of emotions and decision making is now of considerable importance. This involves the application of various tools afforded by neuroscience. One important stream of the literature examines people with brain damage and how damage to particular parts of the brain known to be responsible for particular cognitive functions impacts on decision making. One example of this research is the work of Antonio Damasio, who finds that when the emotional part of the brain is damaged, this actually [[BLANK]]. Good decisions are a product of the emotional part of the brain working in conjunction with the deliberative part. This contradicts the assumptions of conventional economics, where emotions play a negative role in the decision-making process. Here it is assumed that decision making can be modeled as being generated in a stoic, unemotional fashion, and that’s why decisions tend to be optimal. But the evidence suggests that emotions actually play an important and, often, a positive role in decision making.", "options": ["has no effect on cognitive functions", "improves the speed of decision making", "reduces the efficacy of decision making", "increases deliberative thinking", "makes decisions more rational"], "answer": 2, "exp": "Good decisions are a product of the emotional part working with the deliberative part → 감정 부분 손상은 효율 저하.  (정답: reduces the efficacy of decision making)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "The study of emotions and decision making is now of considerable importance. This involves the application of various tools {{1|afforded by}} neuroscience. One important stream of the literature examines people with brain damage and how damage to particular parts of the brain {{2|knowing to be responsible}} for particular cognitive functions impacts on decision making. One example of this research is the work of Antonio Damasio, {{3|who finds}} that when the emotional part of the brain is damaged, this actually reduces the efficacy of decision making. Good decisions are a product of the emotional part of the brain working {{4|in conjunction with}} the deliberative part. This contradicts the assumptions of conventional economics, {{5|where emotions play}} a negative role in the decision-making process. Here it is assumed that decision making can be modeled as being generated in a stoic, unemotional fashion, and that’s why decisions tend to be optimal. But the evidence suggests that emotions actually play an important and, often, a positive role in decision making.", "options": ["①", "②", "③", "④", "⑤"], "answer": 1, "fix": "known to be responsible", "wrong": "knowing to be responsible", "exp": "정답 ②  knowing to be responsible → known to be responsible.  parts of the brain은 '알려진' 대상이므로 과거분사 known."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "The study of emotions and decision making is now of considerable importance.", "chunks": {"A": "This involves the application of various tools afforded by neuroscience. One important stream of the literature examines people with brain damage and how damage to particular parts of the brain known to be responsible for particular cognitive functions impacts on decision making.", "B": "One example of this research is the work of Antonio Damasio, who finds that when the emotional part of the brain is damaged, this actually reduces the efficacy of decision making. Good decisions are a product of the emotional part of the brain working in conjunction with the deliberative part.", "C": "This contradicts the assumptions of conventional economics, where emotions play a negative role in the decision-making process. Here it is assumed that decision making can be modeled as being generated in a stoic, unemotional fashion, and that’s why decisions tend to be optimal. But the evidence suggests that emotions actually play an important and, often, a positive role in decision making."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 0, "exp": "원문 순서: 주어진 글 → (A) → (B) → (C)"}]}, {"id": 19, "unit": 18, "title": "어미 고양이의 새끼 구조", "exam": "2025년 9월 인천광역시", "text": "Mother cats can tell which kittens belong to them—when litters are mixed up they use their kittens' scent to distinguish them from offspring of other mothers. Despite this, when faced with a selection of kittens who have wandered from the nest, her own and others that aren't hers, a mother cat doesn't appear to favor her own offspring when retrieving them. The reason for this is uncertain, although distress vocalizations from kittens that are lost from their nest are known to be very powerful, so it may just be hard for the mother to resist retrieving them, regardless of whether they are hers. In the wild, a squeaking kitten out in the open is likely to attract predators, which is bad news for any other kittens around it. A rapid rescue of any crying kitten would be a good strategy to prevent them from drawing unwanted attention.", "summary": "Although mother cats can identify their own offspring, they are likely to collect any lost crying kittens, possibly to reduce the chances of being detected by predators.", "gloss": ["*squeak: 끽(찍)하는 소리를 내다"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["How mother cats recognize their own kittens by scent", "Mother cats tend to retrieve any lost crying kitten, possibly to avoid attracting predators", "Why kittens wander away from the nest", "Mother cats' preference for their own kittens", "The dangers that predators pose to wild cats"], "answer": 1, "exp": "자기 새끼를 알아보면서도 길 잃고 우는 새끼를 가리지 않고 데려오는 이유는 포식자의 주의를 끄는 것을 막기 위해서일 수 있다."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Mother cats can tell which kittens belong to them—when litters are mixed up they use their kittens' scent to distinguish them from offspring of other mothers. Despite this, when faced with a selection of kittens who have wandered from the nest, her own and others that aren't hers, a mother cat doesn't appear to favor her own offspring when retrieving them. The reason for this is uncertain, although distress vocalizations from kittens that are lost from their nest are known to be very powerful, so it may just be hard for the mother to resist retrieving them, regardless of whether they are hers. In the wild, a squeaking kitten out in the open is likely to [[BLANK]], which is bad news for any other kittens around it. A rapid rescue of any crying kitten would be a good strategy to prevent them from drawing unwanted attention.", "options": ["be ignored by other kittens", "return to the nest on its own", "attract predators", "scare away predators", "find its mother quickly"], "answer": 2, "exp": "which is bad news for any other kittens around it → 주변 새끼들에게 나쁜 소식 = 포식자를 끌어들임.  (정답: attract predators)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "Mother cats can tell {{1|which kittens belong}} to them—when litters are mixed up they use their kittens' scent to distinguish them from offspring of other mothers. Despite this, when faced with a selection of kittens {{2|who have wandered}} from the nest, her own and others that aren't hers, a mother cat doesn't appear {{3|to favor}} her own offspring when retrieving them. The reason for this is uncertain, although distress vocalizations from kittens that are lost from their nest are known to be very powerful, so it may just be hard for the mother to resist retrieving them, {{4|regardless of that}} they are hers. In the wild, a squeaking kitten out in the open is likely to attract predators, {{5|which is bad news}} for any other kittens around it. A rapid rescue of any crying kitten would be a good strategy to prevent them from drawing unwanted attention.", "options": ["①", "②", "③", "④", "⑤"], "answer": 3, "fix": "regardless of whether", "wrong": "regardless of that", "exp": "정답 ④  regardless of that → regardless of whether.  전치사 of 뒤에는 that절이 올 수 없다 → whether."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "Mother cats can tell which kittens belong to them—when litters are mixed up they use their kittens' scent to distinguish them from offspring of other mothers.", "chunks": {"B": "Despite this, when faced with a selection of kittens who have wandered from the nest, her own and others that aren't hers, a mother cat doesn't appear to favor her own offspring when retrieving them.", "C": "The reason for this is uncertain, although distress vocalizations from kittens that are lost from their nest are known to be very powerful, so it may just be hard for the mother to resist retrieving them, regardless of whether they are hers.", "A": "In the wild, a squeaking kitten out in the open is likely to attract predators, which is bad news for any other kittens around it. A rapid rescue of any crying kitten would be a good strategy to prevent them from drawing unwanted attention."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 2, "exp": "원문 순서: 주어진 글 → (B) → (C) → (A)"}]}, {"id": 20, "unit": 18, "title": "집단 간 언어 차용과 불평등", "exam": "2025년 3월 서울특별시", "text": "Quite often the interaction between groups is socially unequal, and this is reflected in the fact that in many cases borrowing of words or constructions goes mostly or entirely in one direction, from the more powerful or prestigious group to the less favored one. The languages of socially subordinated groups may from quite an early period of contact provide terminology for objects or practices with which speakers of the more powerful group were previously unfamiliar, but the effects of contact in that direction may not progress any further than this. In some cases, as with the Dharug language of Sydney, Australia, the source of some of the earliest loans from Indigenous Australian languages into English, the fate of the language system is extinction after the obliteration of many of its speakers. The remainder shifted to varieties of English, the language of the people who had suppressed them.", "summary": "Language borrowing from dominant to subordinate groups reflects social inequality, where the language systems of the latter often vanish even though they may have provided some terms, as exemplified by Dharug in Australia.", "gloss": ["*prestigious: 권력을 가진 **subordinate: 종속된 ***obliteration: }, {"id": 21, "unit": 18, "title": "색에 대한 인지적 연합과 지각", "exam": "2024년 10월 경기도", "text": "There is research that supports the idea that cognitive factors influence the phenomenology of the perceived world. Delk and Fillenbaum asked participants to match the color of figures with the color of their background. Some of the figures depicted objects associated with a particular color. These included typically red objects such as an apple, lips, and a symbolic heart. Other objects were presented that are not usually associated with red, such as a mushroom or a bell. However, all the figures were made out of the same red-orange cardboard. Participants then had to match the figure to a background varying from dark to light red. They had to make the background color match the color of the figures. The researchers found that red-associated objects required more red in the background to be judged a match than did the objects that are not associated with the color red. This implies that the cognitive association of objects to color influences how we perceive that color.", "summary": "In one study, participants chose greater redness when asked to match the color of objects that are usually red to a background with the same color, which showed that their knowledge about the colors of objects influenced their perceptual judgment.", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["Methods for matching colors in laboratory experiments", "How background color affects the production of cardboard", "Why red objects attract more attention than others", "The relation between color and human emotions", "A study showed that knowing an object's typical color influences how we perceive its color"], "answer": 4, "exp": "빨간색과 연관된 물체는 배경에 더 많은 빨강이 있어야 일치한다고 판단 → 색과 물체의 인지적 연합이 색 지각에 영향."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "There is research that supports the idea that cognitive factors influence the phenomenology of the perceived world. D h}} than did the objects that are not associated with the color red. This implies that the cognitive association of objects to color influences how we perceive that color.", "options": ["①", "②", "③", "④", "⑤"], "answer": 4, "fix": "to be judged a match", "wrong": "to judge a match", "exp": "정답 ⑤  to judge a match → to be judged a match.  주어 red-associated objects가 '판단되는' 대상 → 수동 to be judged."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "There is research that supports the idea that cognitive factors influence the phenomenology of the perceived world.", "chunks": {"A": "Delk and Fillenbaum asked participants to match the color of figures with the color of their background. Some of the figures depicted objects associated with a particular color. These included typically red objects such as an apple, lips, and a symbolic heart.", "C": "Other objects were presented that are not usually associated with red, such as a mushroom or a bell. However, all the figures were made out of the same red-orange cardboard. Participants then had to match the figure to a background varying from dark to light red.", "B": "They had to make the background color match the color of the figures. The researchers found that red-associated objects required more red in the background to be judged a match than did the objects that are not associated with the color red. This implies that the cognitive association of objects to color influences how we perceive that color."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)"], "answer": 1, "exp": "원문 순서: 주어진 글 → (A) → (C) → (B)"}]}, {"id": 22, "unit": 18, "title": "또래 앞에서 돕는 행동 (연령 차이)", "exam": "2024년 9월 인천광역시", "text": "The concern about how we appear to others can be seen in children, though work by the psychologist Ervin Staub suggests that the effect may vary with age. In a study where children heard another child in distress, young children (kindergarten through second grade) were more likely to help the child in distress when with another child than when alone. But for older children—in fourth and sixth grade—the effect reversed: they were less likely to help a child in distress when they were with a peer than when they were alone. Staub suggested that younger children might feel more comfortable acting when they have the company of a peer, whereas older children might feel more concern about being judged by their peers and fear feeling embarrassed by overreacting. Staub noted that “older children seemed to discuss the distress sounds less and to react to them less openly than younger children.” In other words, the older children were deliberately putting on a poker face in front of their peers.", "summary": "The study suggests that, contrary to younger children, older children are less likely to help those in distress in the presence of others because they care more about how they are evaluated.", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["The differences between kindergarten and sixth-grade education", "Older children are less likely to help someone in distress in front of peers because they care about being judged", "How children react to the distress sounds of friends", "Why young children help more than older children in general", "The influence of age on emotional intelligence"], "answer": 1, "exp": "어린 아이는 또래와 있을 때 더 잘 돕지만, 고학년은 평가받는 것을 의식해 또래 앞에서는 덜 돕는다는 연구."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "The concern about how we appear to others can be seen in children, though work by the psychologist Ervin Staub suggests that the effect may vary with age. In a study where children heard another child in distress, young children (kindergarten through second grade) were more likely to help the child in distress when with another child than when alone. But for older children—in fourth and sixth grade—the effect reversed: they were [[BLANK]]. Staub suggested that you react to them less openly than younger children.” In other words, the older children were deliberately putting on a poker face in front of their peers.", "options": ["①", "②", "③", "④", "⑤"], "answer": 0, "fix": "can be seen", "wrong": "can see", "exp": "정답 ①  can see → can be seen.  The concern이 '보여질' 수 있는 대상 → 수동 can be seen."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "The concern about how we appear to others can be seen in children, though work by the psychologist Ervin Staub suggests that the effect may vary with age.", "chunks": {"A": "In a study where children heard another child in distress, young children (kindergarten through second grade) were more likely to help the child in distress when with another child than when alone. But for older children—in fourth and sixth grade—the effect reversed: they were less likely to help a child in distress when they were with a peer than when they were alone.", "B": "Staub suggested that younger children might feel more comfortable acting when they have the company of a peer, whereas older children might feel more concern about being judged by their peers and fear feeling embarrassed by overreacting.", "C": "Staub noted that “older children seemed to discuss the distress sounds less and to react to them less openly than younger children.” In other words, the older children were deliberately putting on a poker face in front of their peers."}, "options": ["(A) - (B) - (C)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 0, "exp": "원문 순서: 주어진 글 → (A) → (B) → (C)"}]}, {"id": 23, "unit": 18, "title": "부러움(envy)과 질투(jealousy)", "exam": "2024년 6월 부산광역시", "text": "Many things spark envy: ownership, status, health, youth, talent, popularity, beauty. It is often confused with jealousy because the physical reactions are identical. The difference: the subject of envy is a thing (status, money, health etc.). The subject of jealousy is the behaviour of a third person. Envy needs two people. Jealousy, on the other hand, requires three: Peter is jealous of Sam because the beautiful girl next door rings him instead. Paradoxically, with envy we direct resentments toward those who are most similar to us in age, career and residence. We don’t envy businesspeople from the century before last. We don’t envy millionaires on the other side of the globe. As a writer, I don’t envy musicians, managers or dentists, but other writers. As a CEO you envy other, bigger CEOs. As a supermodel you envy more successful supermodels. Aristotle knew this: ‘Potters envy potters.’", "summary": "Jealousy involves three parties, focusing on the actions of a third person, whereas envy involves two individuals whose personal circumstances are most alike, with one person resenting the other.", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["The difference between envy, which involves two people, and jealousy, which involves three", "Common causes of jealousy in relationships", "How physical reactions reveal our emotions", "Aristotle's view of human competition", "Why people envy those who are most successful"], "answer": 0, "exp": "신체 반응이 같아 혼동되지만, envy는 두 사람(사물이 대상), jealousy는 세 사람(제3자의 행동이 대상)이 필요하다."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Many things spark envy: ownership, status, health, youth, talent, popularity, beauty. It is often confused with jealousy because the physical reactions are identical. The difference: the subject of envy is a thing (status, money, health etc.). The subject of jealousy is the behaviour of a third person. Envy needs two people. Jealousy, on the other hand, requires three: Peter is jealous of Sam because the beautiful girl next door rings him instead. Paradoxically, with envy we direct resentments toward [[BLANK]]. We don’t envy businesspeople from the century before last. We don’t envy millionaires on the other side of the globe. As a writer, I don’t envy musicians, managers or dentists, but other writers. As a CEO you envy other, bigger CEOs. As a supermodel you envy more successful supermodels. Aristotle knew this: ‘Potters envy potters.’", "options": ["millionaires on the other side of the globe", "strangers with completely different careers", "people from a century before", "those who are more famous than we are", "those who are most similar to us in age, career and residence"], "answer": 4, "exp": "뒤의 예시: 작가는 다른 작가를, CEO는 더 큰 CEO를 부러워한다 + Potters envy potters.  (정답: those who are most similar to us in age, career and residence)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "Many things spark envy: ownership, status, health, youth, talent, popularity, beauty. It {{1|is often confused}} with jealousy because the physical reactions {{2|is identical}}. The difference: the subject of envy is a thing (status, money, health etc.). The subject of jealousy is the behaviour of a third person. Envy needs two people. Jealousy, on the other hand, {{3|requires three}}: Peter is jealous of Sam because the beautiful girl next door rings him instead. Paradoxically, with envy we direct resentments toward those {{4|who are most similar}} to us in age, career and residence. We don’t envy businesspeople from the century before last. We don’t envy millionaires on the other side of the globe. As a writer, I don’t envy musicians, managers or dentists, but other writers. As a CEO you envy other, bigger CEOs. As a supermodel you envy more successful supermodels. Aristotle {{5|knew this}}: ‘Potters envy potters.’", "options": ["①", "②", "③", "④", "⑤"], "answer": 1, "fix": "are identical", "wrong": "is identical", "exp": "정답 ②  is identical → are identical.  주어 the physical reactions가 복수이므로 are."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "Many things spark envy: ownership, status, health, youth, talent, popularity, beauty.", "chunks": {"B": "It is often confused with jealousy because the physical reactions are identical. The difference: the subject of envy is a thing (status, money, health etc.). The subject of jealousy is the behaviour of a third person. Envy needs two people.", "A": "Jealousy, on the other hand, requires three: Peter is jealous of Sam because the beautiful girl next door rings him instead. Paradoxically, with envy we direct resentments toward those who are most similar to us in age, career and residence. We don’t envy businesspeople from the century before last.", "C": "We don’t envy millionaires on the other side of the globe. As a writer, I don’t envy musicians, managers or dentists, but other writers. As a CEO you envy other, bigger CEOs. As a supermodel you envy more successful supermodels. Aristotle knew this: ‘Potters envy potters.’"}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 2, "exp": "원문 순서: 주어진 글 → (B) → (A) → (C)"}]}, {"id": 24, "unit": 18, "title": "데이터 무덤과 지식 추출 도구", "exam": "2024년 3월 서울특별시", "text": "The fast-growing, tremendous amount of data, collected and stored in large and numerous data repositories, has far exceeded our human ability for understanding without powerful tools. As a result, data collected in large data repositories become “data tombs”—data archives that are hardly visited. Important decisions are often made based not on the information-rich data stored in data repositories but rather on a decision maker’s instinct, simply because the decision maker does not have the tools to extract the valuable knowledge hidden in the vast amounts of data. Efforts have been made to develop expert system and knowledge-based technologies, which typically rely on users or domain experts to manually input knowledge into knowledge bases. However, this procedure is likely to cause biases and errors and is extremely costly and time consuming. The widening gap between data and information calls for the systematic development of tools that can turn data tombs into “golden nuggets” of knowledge.", "summary": "As the vast amounts of data stored in repositories overwhelm human understanding, effective tools to obtain valuable knowledge are required for better decision-making.", "gloss": ["*repository: 저장소 **golden nugget: 금괴"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["The advantages of expert systems over data repositories", "The need for effective tools that turn vast stored data into valuable knowledge", "Why decision makers should rely on instinct", "How data archives are being reorganized", "The high cost of storing large amounts of data"], "answer": 1, "exp": "데이터가 인간의 이해 능력을 넘어서 '데이터 무덤'이 되고 있어, 이를 지식으로 바꿀 도구가 필요하다는 글."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "The fast-growing, tremendous amount of data, collected and stored in large and numerous data repositories, has far exceeded our human ability for understanding without powerful tools. As a result, data collected in large data repositories become “data tombs”—data archives that are hardly visited. Important decisions are often made based not on the information-rich data stored in data repositories but rather on a decision maker’s instinct, simply because the decision maker does not have [[BLANK]]. Efforts have been made to develop expert system and knowledge-based technologies, which typically rely on users or domain experts to manually input knowledge into knowledge bases. However, this procedure is likely to cause biases and errors and is extremely costly and time consuming. The widening gap between data and information calls for the systematic development of tools that can turn data tombs into “golden nuggets” of knowledge.", "options": ["the time to visit data archives", "enough data stored in repositories", "the tools to extract the valuable knowledge hidden in the vast amounts of data", "the experience to trust his or her instinct", "access to expert systems"], "answer": 2, "exp": "decision maker의 직관에 의존하는 이유 → 방대한 데이터에서 가치 있는 지식을 추출할 도구가 없기 때문.  (정답: the tools to extract the valuable knowledge hidden in the vast amounts of data)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "The fast-growing, tremendous amount of data, {{1|collected and stored}} in large and numerous data repositories, {{2|has far exceeded}} our human ability for understanding without powerful tools. As a result, data collected in large data repositories become “data tombs”—data archives that are {{3|hard visited}}. Important decisions are often made based not on the information-rich data stored in data repositories but rather on a decision maker’s instinct, simply because the decision maker does not have the tools to extract the valuable knowledge hidden in the vast amounts of data. Efforts have been made to develop expert system and knowledge-based technologies, {{4|which typically rely on}} users or domain experts to manually input knowledge into knowledge bases. However, this procedure is likely to cause biases and errors and is extremely costly and time consuming. The widening gap between data and information {{5|calls for}} the systematic development of tools that can turn data tombs into “golden nuggets” of knowledge.", "options": ["①", "②", "③", "④", "⑤"], "answer": 2, "fix": "hardly visited", "wrong": "hard visited", "exp": "정답 ③  hard visited → hardly visited.  '거의 ~ 않는'의 의미 → hardly. (hard는 '열심히, 단단한')"}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "The fast-growing, tremendous amount of data, collected and stored in large and numerous data repositories, has far exceeded our human ability for understanding without powerful tools.", "chunks": {"A": "As a result, data collected in large data repositories become “data tombs”—data archives that are hardly visited. Important decisions are often made based not on the information-rich data stored in data repositories but rather on a decision maker’s instinct, simply because the decision maker does not have the tools to extract the valuable knowledge hidden in the vast amounts of data.", "B": "Efforts have been made to develop expert system and knowledge-based technologies, which typically rely on users or domain experts to manually input knowledge into knowledge bases.", "C": "However, this procedure is likely to cause biases and errors and is extremely costly and time consuming. The widening gap between data and information calls for the systematic development of tools that can turn data tombs into “golden nuggets” of knowledge."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 0, "exp": "원문 순서: 주어진 글 → (A) → (B) → (C)"}]}, {"id": 25, "unit": 18, "title": "협력하는 사람이 받는 사회적 이익", "exam": "2023년 11월 경기도", "text": "Multiple laboratory studies show that cooperative people tend to receive social advantages from others. One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors. For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could contribute money toward a group fund which helped all group members, and then allowed participants to give money to other participants based on their reputations. People who contributed more to the group fund were given responsibility for more money than people who contributed less. Similar results have been found by other researchers. People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status. Uncooperative people tend to receive verbal criticism or even more severe punishment.", "summary": "Studies suggest that individuals who act with generosity toward their communities are more likely to be viewed as deserving of benefit by members of that community than those who don’t.", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["The differences between leaders and followers", "Why uncooperative people are punished more severely", "How to design cooperative games in laboratories", "The role of money in building reputations", "Cooperative people tend to receive social advantages from others"], "answer": 4, "exp": "집단에 기여한 사람은 더 많은 책임(돈), 파트너·리더 선호, 신뢰 등 사회적 이익을 받는다는 실험 결과들."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Multiple laboratory studies show that cooperative people tend to receive social advantages from others. One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors. For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could contribute money toward a group fund which helped all group members, and then allowed participants to give money to other participants based on their reputations. People who contributed more to the group fund [[BLANK]] than people who contributed less. Similar results have been found by other researchers. People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status. Uncooperative people tend to receive verbal criticism or even more severe punishment.", "options": ["were excluded from the game", "were criticized by the other participants", "received less money from other participants", "were given responsibility for more money", "kept more money for themselves"], "answer": 3, "exp": "Barclay 실험 설명 → 기여를 많이 한 사람이 평판에 따라 더 많은 돈을 맡게 되었다.  (정답: were given responsibility for more money)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "Multiple laboratory studies show that cooperative people {{1|tend to receive}} social advantages from others. One way to re often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status. Uncooperative people tend to receive verbal criticism or even more severe punishment."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (B) - (A)"], "answer": 1, "exp": "원문 순서: 주어진 글 → (A) → (C) → (B)"}]}, {"id": 26, "unit": 18, "title": "도움의 동기와 지속성", "exam": "2023년 9월 인천광역시", "text": "In 2006, researchers conducted a study on the motivations for helping after the September 11th terrorist attacks against the United States. In the study, they found that individuals who gave money, blood, goods, or other forms of assistance because of other-focused motives (giving to reduce another’s discomfort) were almost four times more likely to still be giving support one year later than those whose original motivation was to reduce personal distress. This effect likely stems from differences in emotional arousal. The events of September 11th emotionally affected people throughout the United States. Those who gave to reduce their own distress reduced their emotional arousal with their initial gift, discharging that emotional distress. However, those who gave to reduce others’ distress did not stop empathizing with victims who continued to struggle long after the attacks.", "summary": "A study found that the act of giving was less likely to be sustained when driven by self-centered motives rather than by other-focused motives, possibly because of the decline in emotional arousal.", "gloss": ["*distress: (정신적) 고통 **arousal: 자극"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["Methods researchers use to measure donations", "How emotional arousal differs from country to country", "The effects of terrorist attacks on U.S. citizens", "Giving motivated by concern for others lasts longer than giving motivated by reducing one's own distress", "Why people donated more after the September 11th attacks"], "answer": 3, "exp": "타인 중심 동기로 돕는 사람은 1년 뒤에도 지원을 계속할 가능성이 더 높다 → 자기 중심 동기는 감정적 자극이 줄면 지속되지 않는다."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "In 2006, researchers conducted a study on the motivations for helping after the September 11th terrorist attacks against the United States. In the study, they found that individuals who gave money, blood, goods, or other forms of assistance because of other-focused motives (giving to reduce another’s discomfort) were almost four times more likely to still be giving support one year later than those whose original motivation was to reduce personal distress. This effect likely stems from differences in emotional arousal. The events of September 11th emotionally affected people throughout the United States. Those who gave to reduce their own distress [[BLANK]] with their initial gift, discharging that emotional distress. However, those who gave to reduce others’ distress did not stop empathizing with victims who continued to struggle long after the attacks.", "options": ["avoided helping other people", "reduced their emotional arousal", "intensified their distress", "increased their emotional arousal", "continued to empathize with victims"], "answer": 1, "exp": "자신의 고통을 줄이려 준 사람 → 초기 기부로 감정적 고통을 해소(discharging)했다 = 감정적 자극을 줄였다.  (정답: reduced their emotional arousal)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "In 2006, researchers {{1|conducted a study}} on the motivations for helping after the September 11th terrorist attacks against the United States. In the study, they found that individuals {{2|who gave money}}, blood, goods, or other forms of assistance because of other-focused motives (giving to reduce another’s discomfort) were almost four times more likely to still be giving support one year later than those {{3|who original motivation}} was to reduce personal distress. This effect {{4|likely stems from}} differences in <script>

];

/* ---------- 홈 ---------- */

}
