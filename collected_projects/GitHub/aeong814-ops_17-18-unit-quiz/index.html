<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Unit 17·18 지문 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: 시험지 느낌의 한 칼럼. 홈(범위·유형 선택 + 지문 타일) → 문제 카드(지문 + 선택지 + 해설) → 결과(유형별 정답률 + 오답) */
:root{
  --paper:#f4f6f9; --card:#ffffff; --ink:#161e2b; --muted:#566275; --line:#dce1ea;
  --pen:#2347c5; --pen-soft:#e7ecfb; --pen-ink:#ffffff;
  --ok:#17794f; --ok-soft:#e2f4eb; --bad:#c23636; --bad-soft:#fbe7e7; --warn-soft:#fff1b8;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e131b; --card:#161d28; --ink:#e7ebf3; --muted:#9aa6b9; --line:#283243;
    --pen:#8ea7ff; --pen-soft:#1b2540; --pen-ink:#0e131b;
    --ok:#62d3a1; --ok-soft:#13302a; --bad:#ff8f8f; --bad-soft:#35191d; --warn-soft:#4a4214;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e131b; --card:#161d28; --ink:#e7ebf3; --muted:#9aa6b9; --line:#283243;
  --pen:#8ea7ff; --pen-soft:#1b2540; --pen-ink:#0e131b;
  --ok:#62d3a1; --ok-soft:#13302a; --bad:#ff8f8f; --bad-soft:#35191d; --warn-soft:#4a4214;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 120px;
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--pen); outline-offset:2px}
.wrap{max-width:760px; margin:0 auto; min-width:0}
h1{font-size:1.65rem; line-height:1.25; margin:0; letter-spacing:-.01em; text-wrap:balance}
h2{font-size:.8rem; font-weight:700; letter-spacing:.08em; color:var(--muted); margin:0 0 10px}
.sub{color:var(--muted); margin:6px 0 0; font-size:.95rem}
.sec{margin-top:28px}
.row{display:flex; flex-wrap:wrap; gap:8px}

/* chips & segmented */
.chip{border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 14px; font-size:.9rem; font-weight:500}
.chip[aria-pressed="true"]{background:var(--pen); border-color:var(--pen); color:var(--pen-ink)}
.types{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.type{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 12px; text-align:left; display:flex; gap:10px; align-items:flex-start; min-width:0}
.type .box{flex:none; width:20px; height:20px; border-radius:5px; border:2px solid var(--line); margin-top:2px; display:grid; place-items:center; font-size:.8rem; font-weight:700; color:transparent}
.type[aria-pressed="true"]{border-color:var(--pen); background:var(--pen-soft)}
.type[aria-pressed="true"] .box{background:var(--pen); border-color:var(--pen); color:var(--pen-ink)}
.type b{display:block; font-size:1rem}
.type span{display:block; color:var(--muted); font-size:.82rem; line-height:1.35}

/* passage tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:8px}
.tile{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 12px 10px; text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0}
.tile[aria-pressed="true"]{border-color:var(--pen); box-shadow:0 0 0 1px var(--pen) inset; background:var(--pen-soft)}
.tile .no{font-size:.75rem; font-weight:700; color:var(--pen); letter-spacing:.04em; font-variant-numeric:tabular-nums}
.tile .tt{font-size:.9rem; line-height:1.35; font-weight:500; flex:1; word-break:keep-all}
.dots{display:flex; gap:4px}
.dot{width:22px; height:18px; border-radius:4px; font-size:.68rem; font-weight:700; display:grid; place-items:center; background:var(--line); color:var(--muted)}
.dot.r1{background:var(--ok-soft); color:var(--ok)}
.dot.r0{background:var(--bad-soft); color:var(--bad)}

/* start bar */
.bar{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--card); border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.bar .info{flex:1; min-width:140px; font-size:.9rem; color:var(--muted)}
.bar .info b{color:var(--ink); font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 18px; font-weight:700}
.btn.primary{background:var(--pen); border-color:var(--pen); color:var(--pen-ink)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.link{background:none; border:0; color:var(--muted); text-decoration:underline; padding:4px 0; font-size:.85rem}

/* quiz */
.top{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.prog{flex:1; height:6px; background:var(--line); border-radius:6px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--pen); transition:width .25s}
.count{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 18px 20px}
.meta{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:.8rem; color:var(--muted); margin-bottom:10px}
.tag{background:var(--pen-soft); color:var(--pen); font-weight:700; border-radius:5px; padding:1px 8px}
.q{font-size:1.1rem; font-weight:700; margin:0 0 12px; text-wrap:balance}
.passage{font-family:var(--serif); font-size:1.06rem; line-height:1.9; margin:0; overflow-wrap:anywhere}
.foot{font-size:.82rem; color:var(--muted); margin-top:8px; line-height:1.5}
.blank{display:inline-block; min-width:7em; border-bottom:2px solid var(--ink); text-align:center; font-family:var(--sans); font-size:.92em; line-height:1.3; padding:0 4px; vertical-align:baseline}
.blank.fill{border-color:var(--ok); color:var(--ok); background:var(--ok-soft); font-weight:600}
.gm{white-space:normal}
.gm .gn{font-family:var(--sans); font-size:.8em; margin-right:2px; color:var(--pen); font-weight:700}
.gm u{text-underline-offset:4px; text-decoration-thickness:1.5px}
.gm.bad{background:var(--bad-soft)}
.gm.bad .gn,.gm.bad u{color:var(--bad)}
.gm .fix{font-family:var(--sans); font-size:.8em; font-weight:700; color:var(--ok); background:var(--ok-soft); border-radius:4px; padding:0 6px; margin-left:4px}
.gm.pick{background:var(--warn-soft)}
.block{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px; font-family:var(--serif); line-height:1.8; font-size:1.02rem}
.block .lab{font-family:var(--sans); font-weight:700; font-size:.8rem; color:var(--pen); margin-right:6px}
.block.given{background:var(--pen-soft); border-color:transparent}

.opts{display:grid; gap:8px; margin-top:16px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:11px 14px; min-width:0}
.opt .n{flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--muted); display:grid; place-items:center; font-size:.78rem; font-weight:700; color:var(--muted); margin-top:1px; font-variant-numeric:tabular-nums}
.opt .t{flex:1; min-width:0; overflow-wrap:anywhere; line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-soft); border-color:var(--ok)}
.opt.ok .n{background:var(--ok); border-color:var(--ok); color:var(--pen-ink)}
.opt.no{background:var(--bad-soft); border-color:var(--bad)}
.opt.no .n{background:var(--bad); border-color:var(--bad); color:var(--pen-ink)}
.opt.dim{opacity:.55}
.opts.num{grid-template-columns:repeat(5,1fr)}
.opts.num .opt{justify-content:center; padding:12px 0}
.opts.num .opt .n{width:30px; height:30px; font-size:.95rem}

.fb{margin-top:16px; border-radius:10px; padding:14px 16px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb h3{margin:0 0 4px; font-size:1rem}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--bad)}
.fb p{margin:0; font-size:.95rem; word-break:keep-all}
.fb details{margin-top:10px; font-size:.9rem}
.fb summary{cursor:pointer; color:var(--muted)}
.fb .ordered{font-family:var(--serif); margin-top:6px; line-height:1.75}
.nextrow{display:flex; justify-content:space-between; gap:10px; margin-top:14px; align-items:center}
.hint{font-size:.78rem; color:var(--muted)}

/* result */
.score{font-size:3rem; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
.score small{font-size:1.1rem; color:var(--muted); font-weight:500}
.bars{display:grid; gap:10px; margin-top:16px}
.brow{display:grid; grid-template-columns:3.2em 1fr 4.2em; gap:10px; align-items:center; font-size:.9rem}
.track{height:10px; background:var(--line); border-radius:6px; overflow:hidden}
.track i{display:block; height:100%; background:var(--pen)}
.brow span:last-child{text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
.wrongs{display:grid; gap:10px; margin-top:12px}
.w{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:12px 14px}
.w .h{font-size:.82rem; color:var(--muted); margin-bottom:4px}
.w .a{font-size:.92rem; margin:2px 0; overflow-wrap:anywhere}
.w .a b{color:var(--ok)} .w .a s{color:var(--bad)}
.w .e{font-size:.88rem; color:var(--muted); margin-top:6px; word-break:keep-all}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px}
@media (max-width:440px){
  h1{font-size:1.4rem} .card{padding:14px 14px 16px} .passage{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){ .prog i{transition:none} }
</style>

</head>

{"id": 3, "unit": 17, "title": "금본위제와 화폐 발행 제한", "exam": "2025년 6월 부산광역시", "text": "The big problem with money created by the government is that those who run the government always face the temptation to create more money and spend it. Whether among ancient kings or modern politicians, this has happened again and again over the centuries, leading to inflation and the many economic and social problems that follow from inflation. For this reason, many countries have preferred using gold, silver, or some other material that is inherently limited in supply, as money. It is a way of depriving governments of the power to expand the money supply to inflationary levels. Gold has long been considered ideal for this purpose, since the supply of gold in the world usually cannot be increased rapidly. When paper money is convertible into gold whenever the individual chooses to do so, then the money is said to be “backed up” by gold. This expression is misleading only if we imagine that the value of the gold is somehow transferred to the paper money, when in fact the real point is that the gold simply limits the amount of paper money that can be issued.", "summary": "", "gloss": [], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["The history of gold mining and its economic impact", "How inflation benefits governments and ancient kings", "Why gold has been used as money to limit governments' power to expand the money supply", "The advantages of paper money over metal coins", "Why the value of gold transfers to paper money"], "answer": 2, "exp": "정부가 돈을 과도하게 발행하려는 유혹 때문에, 공급이 제한된 금을 화폐 기준으로 삼아 발행량을 제한해 왔다는 글."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "The big problem with money created by the government is that those who run the government always face the temptation to create more money and spend it. Whether among ancient kings or modern politicians, this has happened again and again over the centuries, leading to inflation and the many economic and social problems that follow from inflation. For this reason, many countries have preferred using gold, silver, or some other material that is inherently limited in supply, as money. It is a way of depriving governments of the power to expand the money supply to inflationary levels. Gold has long been considered ideal for this purpose, since the supply of gold in the world usually cannot be increased rapidly. When paper money is convertible into gold whenever the individual chooses to do so, then the money is said to be “backed up” by gold. This expression is misleading only if we imagine that the value of the gold is somehow transferred to the paper money, when in fact the real point is that the gold simply [[BLANK]].", "options": ["makes paper money easier to produce", "limits the amount of paper money that can be issued", "guarantees that prices never change", "transfers its own value to paper money", "raises the value of paper money over time"], "answer": 1, "exp": "'backed up'이라는 표현이 오해를 부를 수 있다는 문맥. 금의 가치가 지폐로 옮겨가는 게 아니라 발행량을 제한한다는 것이 핵심.  (정답: limits the amount of paper money that can be issued)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "The big problem with money created by the government is that those {{1|who runs the government}} always face the temptation {{2|to create more money}} and spend it. Whether among ancient kings or modern politicians, this has happened again and again over the centuries, {{3|leading to inflation}} and the many economic and social problems that follow from inflation. For this reason, many countries have preferred using gold, silver, or some other material that {{4|is inherently limited}} in supply, as money. It is a way of depriving governments of the power to expand the money supply to inflationary levels. Gold has long been considered ideal for this purpose, since the supply of gold in the world usually cannot be increased rapidly. When paper money is convertible into gold whenever the individual chooses to do so, then the money {{5|is said to be}} “backed up” by gold. This expression is misleading only if we imagine that the value of the gold is somehow transferred to the paper money, when in fact the real point is that the gold simply limits the amount of paper money that can be issued.", "options": ["①", "②", "③", "④", "⑤"], "answer": 0, "fix": "who run the government", "wrong": "who runs the government", "exp": "정답 ①  who runs the government → who run the government.  관계대명사 who의 선행사가 복수 those이므로 동사는 run."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "The big problem with money created by the government is that those who run the government always face the temptation to create more money and spend it.", "chunks": {"A": "Whether among ancient kings or modern politicians, this has happened again and again over the centuries, leading to inflation and the many economic and social problems that follow from inflation. For this reason, many countries have preferred using gold, silver, or some other material that is inherently limited in supply, as money.", "B": "It is a way of depriving governments of the power to expand the money supply to inflationary levels. Gold has long been considered ideal for this purpose, since the supply of gold in the world usually cannot be increased rapidly. When paper money is convertible into gold whenever the individual chooses to do so, then the money is said to be “backed up” by gold.", "C": "This expression is misleading only if we imagine that the value of the gold is somehow transferred to the paper money, when in fact the real point is that the gold simply limits the amount of paper money that can be issued."}, "options": ["(A) - (B) - (C)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 0, "exp": "원문 순서: 주어진 글 → (A) → (B) → (C)"}]}, {"id": 4, "unit": 17, "title": "자극하는 정의 (stimulative definition)", "exam": "2025년 3월 서울특별시", "text": "As a general rule, it’s better if your definition corresponds as closely as possible to the way in which the term is ordinarily used in the kinds of debates to which your claims are pertinent. There will be, however, occasions where it is appropriate, even necessary, to coin special uses through what philosophers call stimulative definition. This would be the case where the current lexicon is not able to make distinctions that you think are philosophically important. For example, we do not have a term in ordinary language that describes a memory that is not necessarily a memory of something the person having it has experienced. Such a thing would occur, for example, if I could somehow share your memories: I would have a memory-type experience, but this would not be of something that I had actually experienced. To call this a memory would be misleading. For this reason, philosophers have coined the special term ‘quasi-memory’ to refer to these hypothetical memory-like experiences.", "summary": "", "gloss": ["*pertinent: 관련 있는"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["Ways to share memories between people", "Why philosophers should avoid inventing new terms", "The need for special terms when ordinary language cannot express philosophically important distinctions", "How memory differs from imagination in everyday language", "The importance of defining terms exactly as people ordinarily use them"], "answer": 2, "exp": "일반적으로는 통용되는 용법을 따르는 게 좋지만, 기존 어휘로 구분이 안 될 때는 '유사 기억'처럼 특별한 용어를 만들어야 한다는 글."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "As a general rule, it’s better if your definition corresponds as closely as possible to the way in which the term is ordinarily used in the kinds of debates to which your claims are pertinent. There will be, however, occasions where it is appropriate, even necessary, to coin special uses through what philosophers call stimulative definition. This would be the case where the current lexicon is [[BLANK]]. For example, we do not have a term in ordinary language that describes a memory that is not necessarily a memory of something the person having it has experienced. Such a thing would occur, for example, if I could somehow share your memories: I would have a memory-type experience, but this would not be of something that I had actually experienced. To call this a memory would be misleading. For this reason, philosophers have coined the special term ‘quasi-memory’ to refer to these hypothetical memory-like experiences.", "options": ["used differently in different kinds of debates", "not able to make distinctions that you think are philosophically important", "too complicated for ordinary people to understand", "closely matched to the way the term is ordinarily used", "able to describe every memory a person has"], "answer": 1, "exp": "stimulative definition이 필요한 경우 = 현재 어휘로 철학적으로 중요한 구분을 할 수 없을 때. 뒤의 quasi-memory 예시가 근거.  (정답: not able to make distinctions that you think are philosophically important)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "As a general rule, it’s better if your definition {{1|corresponds as closely}} as possible to the way in which the term is ordinarily used in the kinds of debates {{2|to which your claims}} are pertinent. There will be, however, occasions {{3|where it is}} appropriate, even necessary, to coin special uses through {{4|that philosophers call}} stimulative definition. This would be the case where the current lexicon is not able to make distinctions that you think are philosophically important. For example, we do not have a term in ordinary language that describes a memory {{5|that is not necessarily}} a memory of something the person having it has experienced. Such a thing would occur, for example, if I could somehow share your memories: I would have a memory-type experience, but this would not be of something that I had actually experienced. To call this a memory would be misleading. For this reason, philosophers have coined the special term ‘quasi-memory’ to refer to these hypothetical memory-like experiences.", "options": ["①", "②", "③", "④", "⑤"], "answer": 3, "fix": "what philosophers call", "wrong": "that philosophers call", "exp": "정답 ④  that philosophers call → what philosophers call.  call의 목적어 역할을 하면서 선행사가 없으므로 선행사를 포함하는 관계대명사 what. (that은 선행사가 필요)"}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "As a general rule, it’s better if your definition corresponds as closely as possible to the way in which the term is ordinarily used in the kinds of debates to which your claims are pertinent.", "chunks": {"C": "There will be, however, occasions where it is appropriate, even necessary, to coin special uses through what philosophers call stimulative definition. This would be the case where the current lexicon is not able to make distinctions that you think are philosophically important.", "B": "For example, we do not have a term in ordinary language that describes a memory that is not necessarily a memory of something the person having it has experienced.", "A": "Such a thing would occur, for example, if I could somehow share your memories: I would have a memory-type experience, but this would not be of something that I had actually experienced. To call this a memory would be misleading. For this reason, philosophers have coined the special term ‘quasi-memory’ to refer to these hypothetical memory-like experiences."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 4, "exp": "원문 순서: 주어진 글 → (C) → (B) → (A)"}]}, {"id": 5, "unit": 17, "title": "홉스의 자연 상태", "exam": "2024년 10월 경기도", "text": "According to Hobbes, man is not a being who can act morally in spite of his instinct to protect his existence in the state of nature. Hence, the only place where morality and moral liberty will begin to find an application begins in a place where a sovereign power, namely the state, emerges. Hobbes thus describes the state of nature as a circumstance in which man’s life is “solitary, poor, nasty, brutish and short”. It means when people live without a general power to control them all, they are indeed in a state of war. In other words, Hobbes, who accepted that human beings are not social and political beings in the state of nature, believes that without the power human beings in the state of nature are “antisocial and rational based on their selfishness”. Moreover, since society is not a natural phenomenon and there is no natural force bringing people together, what will bring them together as a society is not mutual affection according to Hobbes. It is, rather, mutual fear of men’s present and future that assembles them, since the cause of fear is a common drive among people in the state of nature.", "summary": "", "gloss": ["*brutish: 잔인한"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["Hobbes's claim that humans are naturally social and cooperative", "How morality develops naturally from human instinct", "The role of mutual affection in forming modern societies", "Hobbes's view that morality and society arise only under a sovereign power, since people in the state of nature are driven by selfishness and fear", "Why the state of nature is a peaceful and moral condition"], "answer": 3, "exp": "홉스에게 자연 상태는 만인의 투쟁 상태. 사회를 만드는 것은 애정이 아니라 상호 간의 두려움이며, 도덕은 국가 출현 이후에야 적용된다."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "According to Hobbes, man is not a being who can act morally in spite of his instinct to protect his existence in the state of nature. Hence, the only place where morality and moral liberty will begin to find an application begins in a place where a sovereign power, namely the state, emerges. Hobbes thus describes the state of nature as a circumstance in which man’s life is “solitary, poor, nasty, brutish and short”. It means when people live without a general power to control them all, they are indeed in a state of war. In other words, Hobbes, who accepted that human beings are not social and political beings in the state of nature, believes that without the power human beings in the state of nature are “antisocial and rational based on their selfishness”. Moreover, since society is not a natural phenomenon and there is no natural force bringing people together, what will bring them together as a society is not mutual affection according to Hobbes. It is, rather, [[BLANK]] of men’s present and future that assembles them, since the cause of fear is a common drive among people in the state of nature.", "options": ["shared tradition", "mutual fear", "moral obligation", "natural sympathy", "mutual respect"], "answer": 1, "exp": "'not mutual affection'으로 부정한 뒤 It is, rather, ~로 반전. 마지막 문장의 since the cause of fear도 단서.  (정답: mutual fear)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "According to Hobbes, man is not a being {{1|who can act morally}} in spite of his instinct {{2|to protect his existence}} in the state of nature. Hence, the only place where morality and moral liberty will begin to find an application {{3|begins in a place which}} a sovereign power, namely the state, emerges. Hobbes thus describes the state of nature as {{4|a circumstance in which}} man’s life is “solitary, poor, nasty, brutish and short”. It means when people live without a general power to control them all, they are indeed in a state of war. In other words, Hobbes, {{5|who accepted}} that human beings are not social and political beings in the state of nature, believes that without the power human beings in the state of nature are “antisocial and rational based on their selfishness”. Moreover, since society is not a natural phenomenon and there is no natural force bringing people together, what will bring them together as a society is not mutual affection according to Hobbes. It is, rather, mutual fear of men’s present and future that assembles them, since the cause of fear is a common drive among people in the state of nature.", "options": ["①", "②", "③", "④", "⑤"], "answer": 2, "fix": "begins in a place where", "wrong": "begins in a place which", "exp": "정답 ③  begins in a place which → begins in a place where.  뒤에 완전한 절(a sovereign power ~ emerges)이 이어지므로 관계부사 where. which 뒤에는 불완전한 절."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "According to Hobbes, man is not a being who can act morally in spite of his instinct to protect his existence in the state of nature.", "chunks": {"A": "Hence, the only place where morality and moral liberty will begin to find an application begins in a place where a sovereign power, namely the state, emerges. Hobbes thus describes the state of nature as a circumstance in which man’s life is “solitary, poor, nasty, brutish and short”.", "C": "It means when people live without a general power to control them all, they are indeed in a state of war. In other words, Hobbes, who accepted that human beings are not social and political beings in the state of nature, believes that without the power human beings in the state of nature are “antisocial and rational based on their selfishness”.", "B": "Moreover, since society is not a natural phenomenon and there is no natural force bringing people together, what will bring them together as a society is not mutual affection according to Hobbes. It is, rather, mutual fear of men’s present and future that assembles them, since the cause of fear is a common drive among people in the state of nature."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (A) - (C)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 1, "exp": "원문 순서: 주어진 글 → (A) → (C) → (B)"}]}, {"id": 6, "unit": 17, "title": "동면과 수면은 다르다", "exam": "2024년 9월 인천광역시", "text": "Sleep is clearly about more than just resting. One curious fact is that animals that are hibernating also have periods of sleep. It comes as a surprise to most of us, but hibernation and sleep are not the same thing at all, at least not from a neurological and metabolic perspective. Hibernating is more like being anesthetized: the subject is unconscious but not actually asleep. So a hibernating animal needs to get a few hours of conventional sleep each day within the larger unconsciousness. A further surprise to most of us is that bears, the most famous of wintry sleepers, don’t actually hibernate. Real hibernation involves profound unconsciousness and a dramatic fall in body temperature—often to around 32 degrees Fahrenheit. By this definition, bears don’t hibernate, because their body temperature stays near normal and they are easily awakened. Their winter sleeps are more accurately called a state of torpor.", "summary": "", "gloss": ["*hibernation: 동면 **anesthetize: 마취시키다 ***torpor: 휴면"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["Hibernation is different from sleep, and bears do not truly hibernate", "Why animals need more sleep in winter", "How hibernating animals survive without food", "Differences in sleep patterns among bears and other mammals", "The importance of sleep for regulating body temperature"], "answer": 0, "exp": "동면은 마취에 가까운 상태이며 수면과 다르다. 곰은 체온이 정상에 가깝고 쉽게 깨므로 동면이 아니라 휴면 상태."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Sleep is clearly about more than just resting. One curious fact is that animals that are hibernating also have periods of sleep. It comes as a surprise to most of us, but hibernation and sleep are not the same thing at all, at least not from a neurological and metabolic perspective. Hibernating is more like being anesthetized: the subject is unconscious but not actually asleep. So a hibernating animal needs to get a few hours of conventional sleep each day within the larger unconsciousness. A further surprise to most of us is that bears, the most famous of wintry sleepers, don’t actually hibernate. Real hibernation involves profound unconsciousness and a dramatic fall in body temperature—often to around 32 degrees Fahrenheit. By this definition, bears don’t hibernate, because [[BLANK]]. Their winter sleeps are more accurately called a state of torpor.", "options": ["they remain fully conscious throughout the winter", "their body temperature stays near normal and they are easily awakened", "they sleep for only a few hours each day", "their body temperature falls dramatically below freezing", "they cannot fall into a deep sleep"], "answer": 1, "exp": "진짜 동면의 정의 = 깊은 무의식 + 체온 급락. 곰은 이 정의에 맞지 않는 이유가 필요 → 체온이 정상에 가깝고 쉽게 깬다.  (정답: their body temperature stays near normal and they are easily awakened)"}, {"type": "grammar", "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "text": "Sleep is clearly about more than just resting. One curious fact is that animals {{1|that are hibernating}} also have periods of sleep. It {{2|comes as a surprise}} to most of us, but hibernation and sleep {{3|are not the same thing}} at all, at least not from a neurological and metabolic perspective. Hibernating is more like {{4|being anesthetizing}}: the subject is unconscious but not actually asleep. So a hibernating animal {{5|needs to get}} a few hours of conventional sleep each day within the larger unconsciousness. A further surprise to most of us is that bears, the most famous of wintry sleepers, don’t actually hibernate. Real hibernation involves profound unconsciousness and a dramatic fall in body temperature—often to around 32 degrees Fahrenheit. By this definition, bears don’t hibernate, because their body temperature stays near normal and they are easily awakened. Their winter sleeps are more accurately called a state of torpor.", "options": ["①", "②", "③", "④", "⑤"], "answer": 3, "fix": "being anesthetized", "wrong": "being anesthetizing", "exp": "정답 ④  being anesthetizing → being anesthetized.  '마취되는 것'이므로 수동 의미 → being anesthetized."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "Sleep is clearly about more than just resting.", "chunks": {"B": "One curious fact is that animals that are hibernating also have periods of sleep. It comes as a surprise to most of us, but hibernation and sleep are not the same thing at all, at least not from a neurological and metabolic perspective.", "C": "Hibernating is more like being anesthetized: the subject is unconscious but not actually asleep. So a hibernating animal needs to get a few hours of conventional sleep each day within the larger unconsciousness. A further surprise to most of us is that bears, the most famous of wintry sleepers, don’t actually hibernate.", "A": "Real hibernation involves profound unconsciousness and a dramatic fall in body temperature—often to around 32 degrees Fahrenheit. By this definition, bears don’t hibernate, because their body temperature stays near normal and they are easily awakened. Their winter sleeps are more accurately called a state of torpor."}, "options": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 2, "exp": "원문 순서: 주어진 글 → (B) → (C) → (A)"}]}, {"id": 7, "unit": 17, "title": "인터넷의 양방향성", "exam": "2024년 6월 부산광역시", "text": "The Net differs from most of the mass media it replaces in an obvious and very important way: it’s bidirectional. We can send messages through the network as well as receive them, which has made the system all the more useful. The ability to exchange information online, to upload as well as download, has turned the Net into a thoroughfare for business and commerce. With a few clicks, people can search virtual catalogues, place orders, track shipments, and update information in corporate databases. But the Net doesn’t just connect us with businesses; it connects us with one another. It’s a personal broadcasting medium as well as a commercial one. Millions of people use it to distribute their own digital creations, in the form of blogs, videos, photos, songs, and podcasts, as well as to critique, edit, or otherwise modify the creations of others.", "summary": "", "gloss": ["*bi  2, "exp": "원문 순서: 주어진 글 → (B) → (C) → (A)"}]}, {"id": 8, "unit": 17, "title": "자동화와 새로운 일자리", "exam": "2024년 6월 부산광역시", "text": "Imagine that seven out of ten working Americans got fired tomorrow. What would they all do? It’s hard to believe you’d have an economy at all if you gave pink slips to more than half the labor force. But that is what the industrial revolution did to the workforce of the early 19th century. Two hundred years ago, 70 percent of American workers lived on the farm. Today automation has eliminated all but 1 percent of their jobs, replacing them with machines. But the displaced workers did not sit idle. Instead, automation created hundreds of millions of jobs in entirely new fields. Those who once farmed were now manning the factories that manufactured farm equipment, cars, and other industrial products. Since then, wave upon wave of new occupations have arrived—appliance repair person, food chemist, photographer, web designer—each building on previous automation. Today, the vast majority of us are doing jobs that no farmer from the 1800s could have imagined.", "summary": "", "gloss": ["*pink slip: 해고 통지서"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["How machines caused permanent unemployment", "Why the economy would collapse without farmers", "The importance of retraining displaced factory workers", "The decline of American agriculture in the 19th century", "Automation eliminated old jobs but created many new ones in entirely new fields"], "answer": 4, "exp": "농업 일자리가 사라졌어도 자동화가 완전히 새로운 분야에서 수억 개의 일자리를 만들었다는 글."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Imagine that seven out of ten working Americans got fired tomorrow. What would they all do? It’s hard to believe you’d have an economy at all if you gave pink slips to more than half the labor force. But that is what the industrial revolution did to the workforce of the early 19th century. Two hundred years ago, 70 percent of American workers lived on outcome of any given vagrancy event is that the individual will fail to find enough resources, and/or be exposed to inhospitable environmental conditions, and perish. However, there are many lines of evidence to suggest that vagrancy can, on rare occasions, dramatically alter the fate of populations, species or even whole ecosystems. Despite being infrequent, these events can be extremely important when viewed at the timescales over which ecological and evolutionary processes unfold. The most profound consequences of vagrancy relate to the establishment of new breeding sites, new migration routes and wintering locations. Each of these can occur through different mechanisms, and at different frequencies, and they each have their own unique importance.", "summary": "", "gloss": ["*vagrancy: 무리에서 떨어져 헤맴 **doomed: 죽을 운명의 ***inhospitable: 살기 힘든"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["How birds navigate during migration", "Although rare, vagrancy can have major ecological and evolutionary consequences", "Why most vagrant birds fail to return to their normal ranges", "The dangers of unfamiliar environments for birds", "Methods for tracking bird populations"], "answer": 1, "exp": "대부분은 중요하지 않지만 드물게 개체군·종·생태계의 운명을 바꿀 수 있고, 새 번식지·이동 경로 확립 등 큰 결과로 이어진다는 글."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "It is a common assumption that most vagrant birds are ultimately doomed, aside from the rare cases where individuals are able to reorientate and return to their normal ranges. In turn, it is also commonly assumed that vagrancy itself is a relatively unimportant biological phenomenon. This is undoubtedly true for the majority of cases, as the most likely outcome of any given vagrancy event is that the individual will fail to find enough resources, and/or be exposed to inhospitable environmental conditions, and perish. However, there are many lines of evidence to suggest that vagrancy can, on rare occasions, [[BLANK]]. Despite being in hanisms, and at different frequencies, and they each have their own unique importance.", "options": ["①", "②", "③", "④", "⑤"], "answer": 4, "fix": "relate to the establishment", "wrong": "relates to the establishment", "exp": "정답 ⑤  relates to the establishment → relate to the establishment.  주어 The most profound consequences가 복수이므로 동사는 relate."}, {"type": "order", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "given": "It is a common assumption that most vagrant birds are ultimately doomed, aside from the rare cases where individuals are able to reorientate and return to their normal ranges.", "chunks": {"B": "In turn, it is also commonly assumed that vagrancy itself is a relatively unimportant biological phenomenon. This is undoubtedly true for the majority of cases, as the most likely outcome of any given vagrancy event is that the individual will fail to find enough resources, and/or be exposed to inhospitable environmental conditions, and perish.", "C": "However, there are many lines of evidence to suggest that vagrancy can, on rare occasions, dramatically alter the fate of populations, species or even whole ecosystems. Despite being infrequent, these events can be extremely important when viewed at the timescales over which ecological and evolutionary processes unfold.", "A": "The most profound consequences of vagrancy relate to the establishment of new breeding sites, new migration routes and wintering locations. Each of these can occur through different mechanisms, and at different frequencies, and they each have their own unique importance."}, "options": ["(A) - (B) - (C)", "(A) - (C) - (B)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 2, "exp": "원문 순서: 주어진 글 → (B) → (C) → (A)"}]}, {"id": 10, "unit": 17, "title": "내향적 리더와 서번트 리더십", "exam": "2023년 11월 경기도", "text": "Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders. Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted. In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership. We must reexamine this stereotype, however, as it doesn’t always hold true. Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership. So-called servant leadership, dating back to ancient philosophical literature, adheres to the belief that a company’s goals are best achieved by helping workers or customers achieve their goals. Such leaders do not seek attention but rather want to shine a light on others’ wins and achievements; servant leadership requires humility, but that humility ultimately pays off.", "summary": "", "gloss": ["*humility: 겸손"], "qs": [{"type": "topic", "q": "다음 글의 주제로 가장 적절한 것은?", "options": ["The importance of humility in business competition", "Differences between introverts and extroverts in social settings", "How leaders can attract more attention to their achievements", "Introverted leaders can be effective through servant leadership, despite the stereotype favoring extroverts", "Why most executives are extroverts"], "answer": 3, "exp": "외향적 리더가 낫다는 편견을 재검토해야 한다. 내향적인 사람에게 흔한 서번트 리더십(타인을 돕는 겸손)이 결실을 맺는다."}, {"type": "blank", "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "text": "Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders. Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted. In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership. We must reexamine this stereotype, however, as it doesn’t always hold true. Regent University found that a desire to be of service to others and
