<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JJUNIORB3 M5 — Monitor DEMO</title><style>body{font:16px system-ui;background:#0e1420;color:#eef3ff;margin:0;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:1.7rem}p{color:#aab8d2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.card{background:#192538;border:1px solid #33445e;border-radius:14px;padding:18px}.symbol{font-size:1.3rem;font-weight:700}.muted{color:#aab8d2;font-size:.85rem}.state{font-weight:700;margin:12px 0}small{color:#aab8d2}a{color:#9bd5ff}</style></head><body><main><h1>JJUNIORB3 M5 — Bybit DEMO</h1><p id="summary">A carregar estado…</p><div id="assets" class="grid"></div><p>Indicadores Pathfinder + MicroTrend M5, direção H1 e reteste. <strong>Monitorização não significa autorização para enviar ordens.</strong></p><p><a href="./">Voltar ao monitor principal</a></p></main><script>
const el=document.getElementById('assets'),summary=document.getElementById('summary');
const safe=s=>String(s??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function refresh(){try{const r=await fetch('./data/grid-status.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const all=await r.json(),d=all.jjunior_m5;if(!d)throw Error('Sem dados JJUNIOR publicados');const age=(Date.now()-Date.parse(d.updated_at))/60000;summary.textContent='Estado: '+(d.orders_enabled?'DEMO COM ORDENS':'MONITOR / SEM ORDENS')+' · Atualizado: '+(d.updated_at||'indisponível')+(age>15?' · DADOS DESATUALIZADOS':'');el.innerHTML=(d.assets||[]).map(a=>'<section class="card"><div class="symbol">'+safe(a.symbol)+'</div><div class="state">'+safe(a.status==='STALE_DATA'?'DADOS ANTIGOS':a.signal||a.status)+'</div><div>Pathfinder: '+safe(a.pathfinder)+'</div><div>MicroTrend: '+safe(a.microtrend)+'</div><div>Macro H1: '+safe(a.macro_h1)+'</div><div>Reteste: '+safe(a.retest===true?'Sim':a.retest===false?'Não':'—')+'</div><p class="muted">Última vela: '+safe(a.last_closed_candle)+'</p></section>').join('')||'<p>Sem dados de mercados.</p>';}catch(e){summary.textContent='Monitor indisponível: '+e.message;el.textContent='Sem confirmação de funcionamento.'}}refresh();setInterval(refresh,30000);
</script></body></html>
