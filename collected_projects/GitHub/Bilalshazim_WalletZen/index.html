<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6FAF7" />
    <meta name="description" content="WalletZen — personal cashbook for accounts, bills and committees." />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash (see ThemeContext).
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('walletzen:theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0A1A12' : '#F6FAF7';
      })();
    </script>
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon-light.png" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>WalletZen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
