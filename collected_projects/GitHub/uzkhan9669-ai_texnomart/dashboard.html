<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Texnomart HR</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1c1e'/%3E%3Cg stroke='%23ffc800' stroke-width='9' stroke-linecap='round'%3E%3Cpath d='M32 12v40'/%3E%3Cpath d='M14.7 22l34.6 20'/%3E%3Cpath d='M49.3 22L14.7 42'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#ffc800;--ink:#1c1c1e;--soft:#2c2c2e;--bg:#f4f5f7;--card:#fff;--line:#e4e5ea;--txt:#1c1c1e;--mut:#6b6b74;--green:#1b8a4b;--amber:#b77900;--red:#c93030;--greenbg:#e5f5ec;--amberbg:#fff3d1;--redbg:#fde8e8;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Montserrat,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:22px;letter-spacing:-1px;color:#fff;line-height:1}.logo i{font-style:normal;color:var(--y)}.login .logo{color:var(--ink)}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tabs button{background:none;border:0;color:#c9c9cf;font-weight:600;padding:8px 14px;border-radius:8px}
.tabs button.on{background:var(--soft);color:#fff}
.top .out{background:none;border:1px solid #55555c;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600}
main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px;font-weight:800}
.sub{color:var(--mut);margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;margin-top:4px}
.kpi .n{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.3}
.seg{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;background:#eef0f3}.seg i{display:block;min-width:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px}.lg{display:flex;align-items:center;gap:6px}.lg b{margin-left:2px}
.dot{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
h3.mt{margin-top:20px}
.tip{position:fixed;z-index:30;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;pointer-events:none;white-space:nowrap}
.repbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.repbar b{display:block;margin-bottom:2px}
.repctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.repctl select,.repctl input{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.repctl input:disabled{color:var(--mut);background:#fafafb}.repctl .btn{text-decoration:none;color:inherit;white-space:nowrap}
.warnbox{background:var(--amberbg);border:1px solid #f0cf7a;color:#5c4300;border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700}
.bar{display:grid;grid-template-columns:minmax(110px,42%) 1fr 74px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar .t{height:10px;background:#eef0f3;border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:#2a78d6;border-radius:5px}
.bar b{text-align:right}
.risk{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.risk:last-child{border:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select,.field{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:150px}
.filters input{flex:1;min-width:220px}
.btn{background:var(--y);border:0;border-radius:9px;padding:9px 14px;font-weight:700}
.btn.alt{background:#fff;border:1px solid var(--line)}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);background:#fafafb}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fffbe6}
.name{font-weight:700}.minor{font-size:12px;color:var(--mut)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef0f3;white-space:nowrap;color:var(--txt)}
.tag.QABUL,.tag.offer,.tag.staj,.tag.ishda{background:var(--greenbg);color:var(--green)}
.tag.ZAXIRA,.tag.zaxira{background:var(--amberbg);color:var(--amber)}
.tag.RAD,.tag.rad{background:var(--redbg);color:var(--red)}
.pct{font-weight:800;font-size:15px}
.empty{padding:34px;text-align:center;color:var(--mut)}
.login{max-width:380px;margin:9vh auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px}
.login h2{margin:14px 0 4px}
.login label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 5px}
.login input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px}
.login .btn{width:100%;margin-top:18px;padding:12px}
.err{color:var(--red);font-weight:600;font-size:13px;min-height:18px;margin-top:10px}
.cwin{position:fixed;left:0;top:0;width:min(700px,calc(100vw - 16px));max-height:min(820px,calc(100vh - 24px));background:#fff;z-index:9;border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.06);display:flex;flex-direction:column;overflow:hidden}
.cwin.moving{box-shadow:0 28px 80px rgba(0,0,0,.36),0 0 0 2px var(--y);user-select:none}
.who{display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;padding:16px 18px;cursor:grab;touch-action:none;flex:none}
.cwin.moving .who{cursor:grabbing}
.who img,.who .noimg{width:76px;height:76px;border-radius:14px;object-fit:cover;background:#3a3a3e;flex:none;-webkit-user-drag:none}
.who h2{margin:0 0 3px;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.who .inf{flex:1;min-width:0}.who .minor{color:#c9c9cf}.who .minor a{color:#fff;text-decoration:none;border-bottom:1px dotted #8a8a92}
.who .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.who .score{text-align:right;flex:none}.who .score b{display:block;font-size:30px;font-weight:800;color:var(--y);line-height:1}.who .score .tag{margin-top:6px}
.who .x{align-self:flex-start;background:var(--soft);border:0;color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.grip{font-size:11px;color:#8a8a92;margin-top:6px}
.wtabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.wtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px 8px;font-weight:700;color:var(--mut)}
.wtabs button.on{color:var(--txt);border-bottom-color:var(--y)}
.wbody{padding:4px 18px 18px;overflow:auto;flex:1;min-height:120px}
.wfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:#fafafb;flex:none}
.wfoot button,.wfoot a{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;text-decoration:none;color:inherit}
.wfoot .go{background:var(--y);border-color:var(--y)}
.wfoot .ok{color:var(--green);border-color:#9fd3b6}.wfoot .res{color:var(--amber);border-color:#ecd08a}.wfoot .no{color:var(--red);border-color:#f0b4b4}
.wfoot .ok.on{background:var(--green);color:#fff;border-color:var(--green)}.wfoot .res.on{background:var(--amber);color:#fff;border-color:var(--amber)}.wfoot .no.on{background:var(--red);color:#fff;border-color:var(--red)}
.wfoot button:disabled{cursor:default}
.wfoot .sp{flex:1}
.qa{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.qa:last-child{border:0}.qa span{color:var(--mut)}.qa b{font-weight:600;overflow-wrap:anywhere}.qa.one{display:block}
.hist{padding:9px 0 9px 16px;border-left:2px solid var(--line);margin-left:6px;position:relative;font-size:13px}.hist:before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--y);border:2px solid #fff}
.stline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.segs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.segs button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:700;display:flex;gap:8px;align-items:center}
.segs button span{background:#eef0f3;border-radius:999px;padding:1px 9px;font-size:12px}
.segs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.segs button.on span{background:var(--y);color:var(--ink)}
td .btn.alt{padding:6px 10px;font-size:12px;white-space:nowrap}
@media(max-width:640px){.cwin{left:0!important;top:0!important;width:100vw;max-height:none;height:100%;border-radius:0}.who{cursor:default;padding:12px}.who img,.who .noimg{width:56px;height:56px}.who .score b{font-size:22px}.grip{display:none}.wfoot button,.wfoot a{flex:1 1 30%;text-align:center;padding:10px 6px}.wfoot .sp{display:none}}
.flags div{padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.flags div:last-child{border:0}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;margin:18px 0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-weight:600}
.acts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rowf{display:flex;gap:8px}
.rowf input{flex:1}
pre{white-space:pre-wrap;word-break:break-word;background:#fafafb;border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 34px}}
.board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:#eceef2;border-radius:var(--r);padding:10px;min-height:220px}
.col.over,.zone.over{outline:2px dashed #2a78d6;outline-offset:-2px;background:#e3edfb}
.col h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between}.col h4 span{color:var(--mut)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;display:grid;grid-template-columns:44px 1fr;gap:10px}
.kc.drag{opacity:.45}
.kc img,.kc .noimg{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#eef0f3}
.kc .name{font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.kc .row2{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.kc .mv{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;font-weight:700}
.old{color:var(--red);font-weight:700}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.zone{border:2px dashed #c9cbd3;border-radius:var(--r);padding:16px;text-align:center;font-weight:700;color:var(--mut);background:#fff}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:flex;align-items:center;justify-content:center;padding:14px}
.dlg .box{background:#fff;border-radius:14px;padding:20px;width:min(520px,100%);max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 4px;font-size:17px}
.dlg label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.dlg input[type=text],.dlg input[type=date],.dlg input[type=time],.dlg select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
.dlg .chk{display:flex;gap:8px;align-items:center;margin:14px 0 6px;font-weight:600;color:var(--txt);font-size:14px}
.dlg .msg{background:#f3f8ff;border:1px solid #cfe0f7;border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13px;margin-top:6px}
.dlg .btns{display:flex;gap:8px;margin-top:16px}.dlg .btns .btn{flex:1;padding:11px}
@media(max-width:560px){.top{gap:6px;padding:0 10px}.logo{font-size:17px}.tabs{overflow-x:auto;min-width:0}.tabs button{padding:7px 7px;font-size:13px;white-space:nowrap}.top .out{padding:6px 8px;font-size:13px}main{padding:16px 12px 50px}.zones{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
"use strict";
var app = document.getElementById("app");
var META = {statuses: {}, verdicts: {}}, page = "overview", filters = {q: "", verdict: "", status: "", pos: "", sort: ""}, timer = null;

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
function api(path, body) {
  var opt = {credentials: "same-origin", headers: {}};
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("auth"); }
      if (!r.ok) throw new Error(j.error || "Ошибка " + r.status);
      return j;
    });
  });
}
function logo() { var l = el("span", "logo", "texnomart"); l.appendChild(el("i", null, "*")); return l; }
function toast(t) { Array.prototype.forEach.call(document.querySelectorAll(".toast"), function (x) { x.remove(); }); var e = el("div", "toast", t); document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2200); }
function fmtDate(s) { var d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}); }
function tag(code, text) { return el("span", "tag " + code, text); }

// ---------- вход
function showLogin(msg) {
  app.textContent = "";
  var f = el("form", "login");
  add(f, logo(), el("h2", null, "Панель рекрутера"), el("div", "minor", "Войдите, чтобы увидеть кандидатов"));
  var u = el("input"), p = el("input"), err = el("div", "err", msg || ""), b = el("button", "btn", "Войти");
  u.id = "u"; u.autocomplete = "username"; p.id = "p"; p.type = "password"; p.autocomplete = "current-password"; b.type = "submit";
  add(f, el("label", null, "Логин"), u, el("label", null, "Пароль"), p, b, err);
  f.onsubmit = function (e) {
    e.preventDefault(); err.textContent = ""; b.disabled = true;
    api("/api/login", {username: u.value, password: p.value}).then(start).catch(function (x) { err.textContent = x.message; b.disabled = false; });
  };
  app.appendChild(f); u.focus();
}

// ---------- каркас
function shell() {
  app.textContent = "";
  var top = el("div", "top"), tabs = el("div", "tabs"), out = el("button", "out", "Выйти");
  [["overview", "Обзор"], ["board", "Воронка"], ["candidates", "Кандидаты"], ["archive", "Архив"]].forEach(function (t) {
    var b = el("button", page === t[0] ? "on" : "", t[1]); b.id = "tab-" + t[0];
    b.onclick = function () { page = t[0]; shell(); }; tabs.appendChild(b);
  });
  out.onclick = function () { api("/api/logout", {}).then(function () { showLogin(); }, function () { showLogin(); }); };
  add(top, logo(), tabs, out);
  var main = el("main"); main.id = "main";
  add(app, top, main);
  if (page === "overview") overview(main); else if (page === "board") board(main); else if (page === "archive") archive(main); else candidates(main);
}

// ---------- обзор
var SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs) { var e = document.createElementNS(SVG, tag); Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); }); return e; }
function tip(target, text) {   // подсказка при наведении
  target.addEventListener("mousemove", function (ev) {
    var t = document.getElementById("tip") || document.body.appendChild(el("div", "tip")); t.id = "tip"; t.textContent = text;
    t.style.left = Math.min(ev.clientX + 12, window.innerWidth - t.offsetWidth - 8) + "px"; t.style.top = (ev.clientY - 34) + "px";
  });
  target.addEventListener("mouseleave", function () { var t = document.getElementById("tip"); if (t) t.remove(); });
}
function bars(card, pairs, max, fmt) {
  max = Math.max(1, max || Math.max.apply(null, pairs.map(function (p) { return p[1]; })));
  pairs.forEach(function (p) {
    var row = el("div", "bar"), t = el("div", "t"), i = el("i"); i.style.width = Math.round(p[1] / max * 100) + "%";
    t.appendChild(i); add(row, el("span", null, p[0]), t, el("b", null, fmt ? fmt(p[1]) : String(p[1]))); if (p[2]) tip(row, p[2]); card.appendChild(row);
  });
}
function dayChart(card, daily) {   // анкеты по дням: столбцы, одна серия
  var W = 560, H = 190, L = 28, B = 24, T = 14, n = daily.length, max = Math.max(1, Math.max.apply(null, daily.map(function (d) { return d[1]; })));
  var top = max <= 4 ? 4 : Math.ceil(max / 4) * 4, step = (W - L - 6) / n, bw = Math.min(26, step - 4);
  var s = svg("svg", {viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Анкеты по дням за 14 дней"}); s.style.width = "100%"; s.style.display = "block";
  for (var g = 0; g <= 4; g++) {
    var y = T + (H - T - B) * g / 4, v = Math.round(top - top * g / 4);
    s.appendChild(svg("line", {x1: L, x2: W - 4, y1: y, y2: y, stroke: g === 4 ? "#b9bbc4" : "#eceef2", "stroke-width": 1}));
    var tx = svg("text", {x: L - 6, y: y + 4, "text-anchor": "end", "font-size": 10, fill: "#6b6b74"}); tx.textContent = v; s.appendChild(tx);
  }
  daily.forEach(function (d, k) {
    var h = (H - T - B) * d[1] / top, x = L + step * k + (step - bw) / 2, y = H - B - h, dt = new Date(d[0] + "T00:00:00");
    var label = dt.toLocaleDateString("ru-RU", {day: "numeric", month: "short"});
    if (d[1]) s.appendChild(svg("path", {d: "M" + x + " " + (H - B) + "V" + (y + 3) + "q0-3 3-3h" + (bw - 6) + "q3 0 3 3V" + (H - B) + "z", fill: "#2a78d6"}));
    if (k % 2 === (n - 1) % 2) { var t = svg("text", {x: x + bw / 2, y: H - 8, "text-anchor": "middle", "font-size": 10, fill: "#6b6b74"}); t.textContent = dt.getDate() + "." + ("0" + (dt.getMonth() + 1)).slice(-2); s.appendChild(t); }
    var hit = svg("rect", {x: L + step * k, y: T, width: step, height: H - T - B, fill: "transparent"}); tip(hit, label + ": " + d[1]); s.appendChild(hit);
  });
  card.appendChild(s);
}
function verdictBar(card, v, total) {   // доли рекомендаций: одна полоса из трёх частей + подписи
  var parts = [["QABUL", "Принять", "#0ca30c", "✓"], ["ZAXIRA", "Резерв", "#fab219", "●"], ["RAD", "Отказ", "#d03b3b", "✕"]];
  var seg = el("div", "seg"), leg = el("div", "legend");

  add(main, el("h1", null, "Архив"), el("div", "sub", "Кандидаты, по которым решение принято: приняты на работу, оставлены в резерве или получили отказ."));
  var seg = el("div", "segs"), f = el("div", "filters"), q = el("input"), holder = el("div"), count = el("div", "minor");
  var p = select("ap", "Все должности", {"Консультант": "Консультант", "Кассир": "Кассир"}, arch.pos), bs = storeSelect("astore", "Все магазины", arch.branch);
  q.id = "aq"; q.placeholder = "Поиск: имя, телефон, филиал"; q.value = arch.q; count.style.margin = "0 0 8px";
  add(f, q, p, bs); add(main, seg, f, count, holder);
  var KINDS = [["ishda", "Принятые", "Принят"], ["zaxira", "Резерв", "В резерве с"], ["rad", "Отказы", "Отказ"]];
  function load() {
    arch.q = q.value; arch.pos = p.value; arch.branch = bs.value;
    var qs = Object.keys(arch).filter(function (k) { return arch[k]; }).map(function (k) { return k + "=" + encodeURIComponent(arch[k]); }).join("&");
    api("/api/archive?" + qs).then(function (d) {
      seg.textContent = ""; holder.textContent = "";
      KINDS.forEach(function (x) {
        var b = el("button", d.kind === x[0] ? "on" : "", x[1]); b.id = "arch-" + x[0]; b.appendChild(el("span", null, String(d.counts[x[0]])));
        b.onclick = function () { arch.kind = x[0]; load(); }; seg.appendChild(b);
      });
      count.textContent = "Найдено: " + d.count;
      var wrap = el("div", "tablewrap"); holder.appendChild(wrap);
      if (!d.items.length) { wrap.appendChild(el("div", "empty", d.kind === "ishda" ? "Принятых пока нет. Откройте карточку кандидата и нажмите «Принят»." : "Здесь пока пусто")); return; }
      var t = el("table"), th = el("tr"), tb = el("tbody"), kind = KINDS.filter(function (x) { return x[0] === d.kind; })[0];
      ["Кандидат", "Должность", "Балл", "Филиал", kind[2]].concat(d.kind === "rad" ? ["Причина"] : []).concat([""]).forEach(function (h) { th.appendChild(el("th", null, h)); });
      add(t, add(el("thead"), th), tb);
      d.items.forEach(function (c) {
        var tr = el("tr"); tr.setAttribute("data-id", c.id);
        var who = el("td"); add(who, el("div", "name", c.fio || "-"), el("div", "minor", [c.age ? c.age + " лет" : "", c.phone].filter(Boolean).join(" · ")));
        var act = el("td"), back = el("button", "btn alt", "Вернуть в воронку"); back.onclick = function (e) { e.stopPropagation(); pickStage(c, load); }; act.appendChild(back);
        add(tr, who, el("td", null, c.pos), el("td", "pct", c.pct + "%"), el("td", null, c.branch || "-"), el("td", "minor", fmtDate(c.decided)));
        if (d.kind === "rad") tr.appendChild(el("td", "minor", c.reason || "не указана"));
        tr.appendChild(act); tr.onclick = function () { openCandidate(c.id); }; tb.appendChild(tr);
      });
      wrap.appendChild(t);
    }).catch(function (e) { if (e.message !== "auth") { holder.textContent = ""; holder.appendChild(el("div", "err", e.message)); } });
  }
  q.oninput = function () { clearTimeout(timer); timer = setTimeout(load, 250); }; p.onchange = bs.onchange = load;
  load();
}

// ---------- карточка кандидата: окно, которое можно двигать по экрану
var winPos = null, winTab = "main";
function closeWin() { Array.prototype.forEach.call(document.querySelectorAll(".cwin"), function (e) { e.remove(); }); }
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !document.querySelector(".dlg")) closeWin(); });
function dragWin(w, handle) {
  var on = false, sx, sy, ox, oy;
  function place(x, y) {
    x = Math.max(120 - w.offsetWidth, Math.min(window.innerWidth - 120, x)); y = Math.max(0, Math.min(window.innerHeight - 70, y));
    w.style.left = x + "px"; w.style.top = y + "px"; winPos = [x, y];
  }
  handle.addEventListener("pointerdown", function (e) {
    if (e.button || e.target.closest("button,a,select,input") || window.innerWidth <= 640) return;
    var r = w.getBoundingClientRect(); on = true; sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    try { handle.setPointerCapture(e.pointerId); } catch (x) {}
    w.classList.add("moving"); e.preventDefault();
  });
  handle.addEventListener("pointermove", function (e) { if (on) place(ox + e.clientX - sx, oy + e.clientY - sy); });
  ["pointerup", "pointercancel"].forEach(function (n) { handle.addEventListener(n, function () { on = false; w.classList.remove("moving"); }); });
  if (winPos) place(winPos[0], winPos[1]); else place(Math.round((window.innerWidth - w.offsetWidth) / 2), Math.max(12, Math.round((window.innerHeight - w.offsetHeight) / 2)));
}
function openCandidate(id) {
  api("/api/candidates/" + id).then(function (c) {
    closeWin();
    var w = el("div", "cwin"), who = el("div", "who"), info = el("div", "inf"), x = el("button", "x", "×"), body = el("div", "wbody"), tabs = el("div", "wtabs"), foot = el("div", "wfoot");
    w.setAttribute("role", "dialog"); w.setAttribute("aria-label", "Карточка кандидата"); x.setAttribute("aria-label", "Закрыть"); x.onclick = closeWin;
    function again() { shell(); openCandidate(id); }

    // шапка: за неё окно перетаскивают
    if (c.photo) { var im = el("img"); im.alt = "Селфи"; im.draggable = false; im.src = "/api/candidates/" + id + "/photo"; im.onerror = function () { im.replaceWith(el("div", "noimg")); }; who.appendChild(im); }
    else who.appendChild(el("div", "noimg"));
    var meta = el("div", "minor"); meta.appendChild(document.createTextNode([c.pos, c.age ? c.age + " лет" : ""].filter(Boolean).join(" · ")));
    if (c.phone) { var tel = el("a", null, c.phone); tel.href = "tel:" + c.phone.replace(/[^\d+]/g, ""); add(meta, document.createTextNode(" · "), tel); }
    if (c.username) { var tg = el("a", null, "@" + c.username); tg.href = "https://t.me/" + encodeURIComponent(c.username); tg.target = "_blank"; tg.rel = "noopener"; add(meta, document.createTextNode(" · "), tg); }
    var chips = el("div", "chips"); chips.appendChild(tag(c.status, c.status_ru));
    if (c.branch) chips.appendChild(el("span", "tag", "🏬 " + c.branch));
    add(info, el("h2", null, c.fio || "-"), meta, chips, el("div", "grip", "Окно можно перетаскивать за эту шапку"));
    var score = el("div", "score"), vt = tag(c.verdict, "Система: " + c.verdict_ru.toLowerCase()); vt.title = "Рекомендация системы по анкете. Решение принимает рекрутер.";
    add(score, el("b", null, c.pct + "%"), vt);
    add(who, info, score, x);

    // вкладки
    var panes = {
      main: function () {
        if (c.notice === "failed") { var wb = el("div", "warnbox", "Последнее сообщение кандидату не доставлено (возможно, он заблокировал бота). Свяжитесь по телефону."); wb.style.marginTop = "14px"; body.appendChild(wb); }
        body.appendChild(el("div", "sec", "Этап"));
        var st = el("div", "stline"); add(st, tag(c.status, c.status_ru), el("span", "minor", "на этапе " + c.days + " дн."));
        if (c.reason) st.appendChild(el("span", "minor", "· причина отказа: " + c.reason));
        body.appendChild(st);
        if (c.slot) { var sl = el("div", "minor", "Удобное время для собеседования: " + c.slot); sl.style.marginTop = "8px"; body.appendChild(sl); }
        body.appendChild(el("div", "sec", "Филиал"));
        var rf = el("div", "rowf"), bi = storeSelect("branch", "Не назначен", c.branch), bs = el("button", "btn alt", "Сохранить");
        bi.className = "field"; bi.style.flex = "1";
        bs.onclick = function () { api("/api/candidates/" + id, {branch: bi.value}).then(function () { toast("Филиал сохранён"); c.branch = bi.value; }).catch(function (e) { toast(e.message); }); };
        add(rf, bi, bs); body.appendChild(rf);
        body.appendChild(el("div", "sec", "Риски и флаги"));
        var fl = el("div", "flags");
        if (!c.flags.length) fl.appendChild(el("div", null, "По анкете серьёзных рисков не выявлено"));
        c.flags.forEach(function (f) { fl.appendChild(el("div", null, f[0] + " " + f[1])); });
        body.appendChild(fl);
        (c.scores || []).forEach(function (g) {
          if (!g[1].length) return;
          body.appendChild(el("div", "sec", g[0] + ": оценка от 1 до 5"));
          bars(body, g[1].map(function (p) { return [p[0], p[1]]; }), 5, function (v) { return String(v); });
        });
      },
      form: function () {
        (c.sections || []).forEach(function (sec) {
          body.appendChild(el("div", "sec", sec[0]));
          sec[1].forEach(function (r) {
            var row = el("div", r.length > 1 ? "qa" : "qa one");
            if (r.length > 1) add(row, el("span", null, r[0]), el("b", null, r[1])); else row.textContent = r[0];
            body.appendChild(row);
          });
        });
        if (!(c.sections || []).length) body.appendChild(el("pre", null, c.profile));
      },
      hist: function () {
        body.appendChild(el("div", "sec", "История этапов"));
        c.history.forEach(function (h) {
          var row = el("div", "hist");
          add(row, el("b", null, (META.statuses[h.old_status] || h.old_status) + " → " + (META.statuses[h.new_status] || h.new_status)),
            el("div", "minor", fmtDate(h.ts) + " · " + h.changed_by + (h.notified === 1 ? " · сообщение доставлено" : h.notified === 0 ? " · сообщение НЕ доставлено" : " · без сообщения")));
          if (h.note) row.appendChild(el("div", "minor", h.note));
          body.appendChild(row);
        });
        var first = el("div", "hist"); add(first, el("b", null, "Анкета получена"), el("div", "minor", fmtDate(c.ts))); body.appendChild(first);
      }
    };
    function show(name) {
      winTab = name; body.textContent = ""; body.scrollTop = 0; panes[name]();
      Array.prototype.forEach.call(tabs.children, function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === name); });
    }
    [["main", "Главное"], ["form", "Анкета"], ["hist", "История" + (c.history.length ? " · " + c.history.length : "")]].forEach(function (t) {
      var b = el("button", null, t[1]); b.setAttribute("data-tab", t[0]); b.onclick = function () { show(t[0]); }; tabs.appendChild(b);
    });

    // кнопки решения
    function btn(stage, text, cls) {
      var b = el("button", cls + (c.status === stage ? " on" : ""), text); b.setAttribute("data-status", stage); b.disabled = c.status === stage;
      b.onclick = function () { moveDialog(c, stage, again); }; foot.appendChild(b); return b;
    }
    var at = META.stages.indexOf(c.status), next = at >= 0 && at < META.stages.length - 1 ? META.stages[at + 1] : null;
    if (next && next !== "ishda") btn(next, "→ " + META.statuses[next], "go");
    btn("ishda", c.status === "ishda" ? "✓ Принят" : "Принят", "ok");
    btn("zaxira", "Резерв", "res");
    btn("rad", "Отказ", "no");
    var other = el("button", null, at < 0 ? "Вернуть в воронку" : "Другой этап"); other.id = "otherStage"; other.onclick = function () { pickStage(c, again); }; foot.appendChild(other);
    foot.appendChild(el("span", "sp"));
    var pdf = el("a", null, "PDF"); pdf.id = "pdfBtn"; pdf.title = "Скачать анкету в PDF"; pdf.href = "/api/candidates/" + id + "/pdf"; pdf.setAttribute("download", ""); foot.appendChild(pdf);

    add(w, who, tabs, body, foot); document.body.appendChild(w);
    show(panes[winTab] ? winTab : "main");
    dragWin(w, who);
  }).catch(function (e) { if (e.message !== "auth") toast(e.message); });
}

function start() { return api("/api/me").then(function (m) { META = m; shell(); }); }
start().catch(function (e) { if (e.message !== "auth") showLogin(e.message); });
})();
</script>
