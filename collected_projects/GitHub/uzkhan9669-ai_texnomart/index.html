<style>
:root{--brand-yellow:#ffc800;--brand-yellow-hover:#e6b400;--dark-ink:#1c1c1e;--dark-soft:#2c2c2e;--paper:#fff;--surface:#f7f7f9;--surface-border:#e2e2e8;--text-primary:#1c1c1e;--text-secondary:#55555c;--text-muted:#8e8e93;--danger:#e53935;--ok:#2e7d32;--font-body:'Montserrat',system-ui,-apple-system,sans-serif;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--shadow-sm:0 2px 8px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--text-primary);font-family:var(--font-body);font-size:15px;line-height:1.45}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--dark-ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header .logo{font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px;letter-spacing:-1px;color:#fff;line-height:1}
header .logo span{color:var(--brand-yellow)}
header .ttl{font-weight:600;font-size:13px;opacity:.9}
main{flex:1;padding:18px 16px 110px}
.hero{background:var(--brand-yellow);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:22px;font-weight:800}
.hero p{margin:0;font-weight:500}
.stats{display:flex;gap:8px;margin:0 0 16px}
.stat{flex:1;background:var(--surface);border:1px solid var(--surface-border);border-radius:var(--radius-md);padding:10px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:800}.stat span{font-size:11px;color:var(--text-muted)}
.card{background:var(--surface);border:1px solid var(--surface-border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;font-weight:700}
.card ul{margin:0;padding-left:18px;color:var(--text-secondary);font-size:14px}
.card li{margin:4px 0}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-secondary);margin:14px 0}
.consent input{width:22px;height:22px;margin-top:1px;accent-color:var(--dark-ink);flex:none}
.warn{background:#fff4e5;border:1px solid #ffc27a;color:#7a4a00;border-radius:var(--radius-md);padding:10px 14px;margin-bottom:12px;font-size:13px}
.progress{height:6px;background:var(--surface-border);border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress>i{display:block;height:100%;width:0;background:var(--brand-yellow);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:14px}
.block{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.q{font-size:18px;font-weight:700;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:2px solid var(--surface-border);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;font:inherit;font-weight:500;color:var(--text-primary);cursor:pointer}
.opt.sel{border-color:var(--brand-yellow);background:#fffbe6;font-weight:700}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;font:inherit;font-size:16px;padding:14px;border:2px solid var(--surface-border);border-radius:var(--radius-md);background:var(--paper);color:var(--text-primary)}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--brand-yellow)}
.hint{font-size:12px;color:var(--text-muted);margin-top:6px}
.err{color:var(--danger);font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--surface-border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:560px;margin:0 auto}
.btn{flex:1;border:0;border-radius:var(--radius-md);padding:15px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;background:var(--brand-yellow);color:var(--dark-ink)}
.btn:active{background:var(--brand-yellow-hover)}
.btn.sec{flex:0 0 36%;background:var(--surface);border:1px solid var(--surface-border);font-weight:600}
.btn[disabled]{opacity:.5}
.cam{background:var(--dark-ink);border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;position:relative}
.cam video,.cam img{width:100%;height:100%;object-fit:cover}
.cam video{transform:scaleX(-1)}
.cam .ph{color:#aaa;text-align:center;padding:20px;font-size:14px}
.row{display:flex;gap:10px;margin-top:12px}
.row .btn{padding:12px;font-size:14px}
.done{text-align:center;padding-top:40px}.done .tick{font-size:56px}
.langs{display:flex;gap:8px;margin-bottom:14px}.langs button{flex:1;padding:10px 4px;border-radius:var(--radius-md);border:2px solid var(--surface-border);background:var(--paper);font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--text-primary)}.langs button.sel{border-color:var(--brand-yellow);background:#fffbe6}
.flagbtn{display:flex;align-items:center;gap:14px;font-size:17px;font-weight:700;padding:16px}
.flag{width:48px;height:32px;border-radius:5px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.12)}.flag svg{display:block;width:100%;height:100%}
.link{background:none;border:0;color:var(--text-secondary);font:inherit;font-weight:600;padding:10px 0;cursor:pointer;text-decoration:underline}
.hidden{display:none!important}
</style>
</head>

day at a computer and till, arranging installment plans and accepting payments. Does your health allow you to work this way?", ["Yes, no restrictions", "I have some restrictions", "No, this kind of work does not suit me"]]}}}, {"key": "health_note", "type": "text", "when": {"key": "health", "in": [1, 2]}, "t": {"uz": ["Qanday cheklovlar bor? Qaysi vazifalarni bajara olmaysiz? (tashxis yozish shart emas)", null], "ru": ["Какие есть ограничения? Какие задачи вы не сможете выполнять? (диагноз писать не нужно)", null], "en": ["What restrictions do you have? Which tasks can you not do? (no need to name a diagnosis)", null]}}, {"key": "schedule", "type": "choice", "t": {"uz": ["Ish tartibi: haftada 6 kun ish, 1 kun dam. Smenalar suzuvchi: 1-smena 09:00-18:00, 2-smena 13:00-22:00. Dam olish va bayram kunlari ham grafik bo'yicha ishlanadi. Sizga mos keladimi?", ["Ha, mos keladi", "Mos, lekin barcha dam olish kunlari emas", "Boshqa grafik kerak (2/2, 5/2, yarim kun)"]], "ru": ["График: 6 рабочих дней в неделю, 1 выходной. Смены плавающие: 1-я смена 09:00-18:00, 2-я смена 13:00-22:00. В выходные и праздники работа тоже по графику. Вам это подходит?", ["Да, подходит", "Подходит, но не во все выходные", "Нужен другой график (2/2, 5/2, неполный день)"]], "en": ["Schedule: 6 working days a week, 1 day off. Shifts rotate: 1st shift 09:00-18:00, 2nd shift 13:00-22:00. Weekends and public holidays are also worked by schedule. Does this suit you?", ["Yes, it suits me", "It suits me, but not every weekend", "I need a different schedule (2/2, 5/2, part-time)"]]}}, {"key": "evening", "type": "choice", "t": {"uz": ["2-smena soat 22:00 gacha davom etadi. Kechqurun uyga qaytish sizga muammo bo'lmaydimi?", ["Muammo emas", "Qiyin, lekin hal qilsam bo'ladi", "Kechki smenada ishlay olmayman"]], "ru": ["2-я смена длится до 22:00. Не будет ли для вас проблемой возвращаться домой вечером?", ["Не проблема", "Сложно, но решаемо", "В вечернюю смену работать не смогу"]], "en": ["The 2nd shift lasts until 22:00. Would getting home in the evening be a problem for you?", ["No problem", "Difficult, but I can manage", "I cannot work the evening shift"]]}}, {"key": "training", "type": "choice", "t": {"uz": ["Ishni boshlashdan oldin 14 kunlik o'qish bor (kompaniya hisobidan, ustoz bilan). Unda to'liq qatnasha olasizmi?", ["Ha, to'liq qatnashaman", "Ba'zi kunlari kela olmayman", "Yo'q, o'qishga vaqtim yo'q"]], "ru": ["Перед началом работы есть 14-дневное обучение (за счёт компании, с наставником). Сможете ли вы пройти его полностью?", ["Да, пройду полностью", "В некоторые дни прийти не смогу", "Нет, на обучение у меня нет времени"]], "en": ["Before starting there is a 14-day training (paid by the company, with a mentor). Can you attend it fully?", ["Yes, I will attend fully", "I cannot come on some days", "No, I have no time for training"]]}}, {"key": "start", "type": "choice", "t": {"uz": ["Qachon ishga chiqa olasiz?", ["Darhol", "1-2 hafta ichida", "2 haftadan keyin"]], "ru": ["Когда вы сможете выйти на работу?", ["Сразу", "В течение 1-2 недель", "Позже чем через 2 недели"]], "en": ["When can you start work?", ["Immediately", "Within 1-2 weeks", "In more than 2 weeks"]]}}, {"key": "income", "type": "choice", "t": {"uz": ["Oylik daromad bo'yicha kutganingiz qancha?", ["3 mln so'mgacha", "3-5 mln so'm", "5-8 mln so'm", "8 mln so'mdan yuqori"]], "ru": ["Какой ежемесячный доход вы ожидаете?", ["До 3 млн сум", "3-5 млн сум", "5-8 млн сум", "Более 8 млн сум"]], "en": ["What monthly income do you expect?", ["Up to 3 mln UZS", "3-5 mln UZS", "5-8 mln UZS", "More than 8 mln UZS"]]}}, {"key": "kpi", "type": "choice", "pos": 0, "t": {"uz": ["Daromadning bir qismi KPI (reja) bo'yicha bonusga bog'liq. Bu sizga qanday?", ["Yoqadi, yaxshi ishlasam, ko'proq topaman", "Maqbul, lekin qat'iy oylik ham muhim", "Faqat qat'iy oylik istayman"]], "ru": ["Часть дохода зависит от KPI-бонуса (выполнение плана). Как вы к этому относитесь?", ["Нравится: лучше работаю, больше зарабатываю", "Приемлемо, но важен и фиксированный оклад", "Хочу только фиксированный оклад"]], "en": ["Part of the income depends on a KPI bonus (meeting the plan). How do you feel about that?", ["I like it: the better I work, the more I earn", "Acceptable, but a fixed salary matters too", "I want a fixed salary only"]]}}, {"key": "pay_fix", "type": "choice", "pos": 1, "t": {"uz": ["Kassirda oylik qat'iy belgilangan (bonus yo'q): o'qish davrida 2 500 000 so'm, o'qishni muvaffaqiyatli tugatgach yana 2 500 000 so'm qo'shiladi, jami 5 000 000 so'm. Sizga mos keladimi?", ["Ha, mos keladi", "Mos, lekin ko'proq bo'lishini xohlardim", "Yo'q, mos kelmaydi"]], "ru": ["У кассира оклад только фиксированный (без бонусов): во время обучения 2 500 000 сум, после успешного обучения добавляется ещё 2 500 000 сум, всего 5 000 000 сум. Вам это подходит?", ["Да, подходит", "Подходит, но хотелось бы больше", "Нет, не подходит"]], "en": ["A cashier's salary is fixed only (no bonuses): 2,500,000 UZS during training; after successful training another 2,500,000 UZS is added, 5,000,000 UZS in total. Does this suit you?", ["Yes, it suits me", "It suits me, but I would like more", "No, it does not suit me"]]}}, {"key": "workload", "type": "choice", "t": {"uz": ["Ish hajmi katta: mijozlarga xizmat, tovarni joylashtirish, kassa, inventarizatsiya, tozalik. Shunday hajm sizga to'g'ri keladimi?", ["Ha, ko'p ishlashga tayyorman", "Tayyorman, lekin sharoit va yordam muhim", "Menga qiyin bo'ladi"]], "ru": ["Объём работы большой: обслуживание клиентов, выкладка товара, касса, инвентаризация, чистота. Подходит ли вам такой объём?", ["Да, готов(а) много работать", "Готов(а), но важны условия и помощь", "Мне будет тяжело"]], "en": ["The workload is large: serving customers, stocking goods, the cash desk, inventory, keeping things clean. Does this suit you?", ["Yes, I am ready to work a lot", "I am ready, but conditions and support matter", "It will be hard for me"]]}, "tp": {"1": {"uz": ["Ish hajmi katta: muddatli to'lovlarni rasmiylashtirish, to'lovlarni qabul qilish, hujjatlar va kassa bilan ishlash, kun davomida ko'p mijoz. Shunday hajm sizga to'g'ri keladimi?", ["Ha, ko'p ishlashga tayyorman", "Tayyorman, lekin sharoit va yordam muhim", "Menga qiyin bo'ladi"]], "ru": ["Объём работы большой: оформление рассрочек, приём оплат, работа с документами и кассой, много клиентов в течение дня. Подходит ли вам такой объём?", ["Да, готов(а) много работать", "Готов(а), но важны условия и помощь", "Мне будет тяжело"]], "en": ["The workload is large: arranging installment plans, accepting payments, working with documents and the till, many customers during the day. Does this suit you?", ["Yes, I am ready to work a lot", "I am ready, but conditions and support matter", "It will be hard for me"]]}}}, {"key": "change", "type": "choice", "t": {"uz": ["Do'konda o'zgarishlar tez-tez bo'ladi: yangi aksiyalar, tovarlar, jarayonlar, smenalar. Siz bunga qanday qaraysiz?", ["Tez moslashaman, yangilikni yoqtiraman", "Moslashaman, lekin vaqt kerak", "O'zgarishlar menga yoqmaydi"]], "ru": ["В магазине часто бывают изменения: новые акции, товары, процессы, смены. Как вы к этому относитесь?", ["Быстро адаптируюсь, люблю новое", "Адаптируюсь, но нужно время", "Перемены мне не нравятся"]], "en": ["Changes happen often in the store: new promotions, products, processes, shifts. How do you feel about that?", ["I adapt quickly and like new things", "I adapt, but I need time", "I do not like changes"]]}}, {"key": "exp", "type": "choice", "block": "b2", "t": {"uz": ["Savdo yoki kassa sohasidagi tajribangiz?", ["Tajriba yo'q", "1 yilgacha", "1-3 yil", "3 yildan ortiq"]], "ru": ["Ваш опыт в торговле или на кассе?", ["Нет опыта", "До 1 года", "1-3 года", "Более 3 лет"]], "en": ["Your experience in retail or at a cash desk?", ["No experience", "Up to 1 year", "1-3 years", "More than 3 years"]]}}, {"key": "tech_exp", "type": "choice", "t": {"uz": ["Maishiy texnika yoki elektronika do'konida ishlaganmisiz?", ["Ha", "Yo'q"]], "ru": ["Работали ли вы в магазине бытовой техники или электроники?", ["Да", "Нет"]], "en": ["Have you worked in a home appliance or electronics store?", ["Yes", "No"]]}}, {"key": "jobs_year", "type": "choice", "t": {"uz": ["So'nggi 1 yilda nechta ish joyida ishlagansiz?", ["0-1", "2", "3 va undan ko'p"]], "ru": ["На скольких местах работы вы работали за последний год?", ["0-1", "2", "3 и более"]], "en": ["How many jobs have you had in the last year?", ["0-1", "2", "3 or more"]]}}, {"key": "last_job", "type": "text", "t": {"uz": ["So'nggi ish joyingiz haqida yozing: kompaniya, lavozim, qancha ishlagansiz, nima bilan shug'ullangansiz. Ishlamagan bo'lsangiz, «ishlamaganman» deb yozing.", null], "ru": ["Напишите о последнем месте работы: компания, должность, сколько проработали, чем занимались. Если не работали, напишите «не работал(а)».", null], "en": ["Tell us about your last job: company, position, how long you worked, what you did. If you have not worked, write “not worked”.", null]}}, {"key": "reason", "type": "choice", "t": {"uz": ["So'nggi ish joyidan ketishingizning (yoki ketmoqchi bo'lishingizning) asosiy sababi?", ["O'sish, boshqa ish formati", "Ko'chish, o'qish, oila", "Grafik mos kelmadi", "Kam to'lashdi, kechiktirishdi", "Rahbar yoki jamoa bilan nizo", "Jarimalar, bosim", "Qisqartirishdi, do'kon yopildi", "Bu birinchi ish joyim", "Boshqa"]], "ru": ["Главная причина ухода (или желания уйти) с последнего места работы?", ["Рост, другой формат работы", "Переезд, учёба, семья", "Не подошёл график", "Мало платили, задерживали", "Конфликт с руководителем или коллективом", "Штрафы, давление", "Сократили, магазин закрылся", "Это моё первое место работы", "Другое"]], "en": ["What was the main reason you left (or want to leave) your last job?", ["Growth, a different work format", "Relocation, studies, family", "The schedule did not suit me", "Low or delayed pay", "Conflict with a manager or the team", "Fines, pressure", "Laid off, the store closed", "This is my first job", "Other"]]}}, {"key": "reason_text", "type": "text", "t": {"uz": ["Bir-ikki gap bilan yozing: aynan nima bo'lgan va o'sha joyda nimani o'zgartirgan bo'lardingiz?", null], "ru": ["Напишите в одном-двух предложениях: что именно произошло и что бы вы изменили на том месте?", null], "en": ["In one or two sentences: what exactly happened, and what would you have changed there?", null]}}, {"key": "reference", "type": "choice", "t": {"uz": ["Sobiq rahbaringizga tavsiya uchun qo'ng'iroq qilsak bo'ladimi?", ["Ha, kontakt beraman", "Yo'q", "Tegishli emas, tajriba yo'q"]], "ru": ["Можно ли позвонить вашему бывшему руководителю за рекомендацией?", ["Да, дам контакт", "Нет", "Не применимо, опыта нет"]], "en": ["May we call your former manager for a reference?", ["Yes, I will give a contact", "No", "Not applicable, no experience"]]}}, {"key": "other_jobs", "type": "choice", "t": {"uz": ["Hozir boshqa kompaniyalarga ham ish bo'yicha murojaat qilganmisiz?", ["Yo'q, faqat Texnomartga", "Ha, boshqa joylarga ham rezyume yuborganman", "Ha, boshqa kompaniyalarda suhbatlarga boryapman", "Boshqa kompaniyadan taklif (offer) olganman"]], "ru": ["Откликались ли вы сейчас на вакансии в других компаниях?", ["Нет, только в Texnomart", "Да, отправил(а) резюме и в другие компании", "Да, хожу на собеседования в другие компании", "Уже есть предложение (оффер) от другой компании"]], "en": ["Have you applied to other companies as well?", ["No, only to Texnomart", "Yes, I have sent my CV to other companies", "Yes, I am going to interviews at other companies", "I already have an offer from another company"]]}}, {"key": "other_jobs_where", "type": "text", "when": {"key": "other_jobs", "in": [1, 2, 3]}, "t": {"uz": ["Qaysi kompaniyalar va qaysi lavozimlar? Qaysi bosqichdasiz?", null], "ru": ["В какие компании и на какие должности? На каком вы этапе?", null], "en": ["Which companies and positions? What stage are you at?", null]}}, {"key": "calc_change", "type": "number", "block": "b3", "t": {"uz": ["1-masala. Xarid 3 740 000 so'm, mijoz 5 000 000 so'm berdi. Qaytim qancha (so'mda)?", null], "ru": ["Задача 1. Покупка на 3 740 000 сум, клиент дал 5 000 000 сум. Сколько сдачи (в сумах)?", null], "en": ["Task 1. A purchase costs 3,740,000 UZS and the customer paid 5,000,000 UZS. How much change (in UZS)?", null]}}, {"key": "calc_discount", "type": "number", "t": {"uz": ["2-masala. Televizor 4 800 000 so'm turadi, chegirma 10%. Mijoz qancha to'laydi (so'mda)?", null], "ru": ["Задача 2. Телевизор стоит 4 800 000 сум, скидка 10%. Сколько заплатит клиент (в сумах)?", null], "en": ["Task 2. A TV costs 4,800,000 UZS with a 10% discount. How much will the customer pay (in UZS)?", null]}}, {"key": "calc_total", "type": "number", "pos": 1, "t": {"uz": ["3-masala. Mijoz 3 ta tovar oldi: 1 250 000, 899 000 va 349 000 so'm. Jami qancha to'laydi (so'mda)?", null], "ru": ["Задача 3. Клиент купил 3 товара: 1 250 000, 899 000 и 349 000 сум. Сколько всего он заплатит (в сумах)?", null], "en": ["Task 3. A customer bought 3 items: 1,250,000, 899,000 and 349,000 UZS. What is the total (in UZS)?", null]}}, {"key": "cash_shortage", "type": "text", "pos": 1, "t": {"uz": ["Smena oxirida kassada 200 000 so'm kam chiqdi. Qadamma-qadam nima qilasiz?", null], "ru": ["В конце смены в кассе не хватает 200 000 сум. Что вы будете делать, шаг за шагом?", null], "en": ["At the end of your shift the cash desk is 200,000 UZS short. What do you do, step by step?", null]}}, {"key": "needs", "type": "text", "pos": 0, "t": {"uz": ["Mijoz oilasi uchun muzlatgich tanlayapti. Eng to'g'ri modelni topish uchun unga qanday savollar berasiz? Kamida 3 ta savol yozing.", null], "ru": ["Клиент выбирает холодильник для семьи. Какие вопросы вы ему зададите, чтобы подобрать подходящую модель? Напишите не менее 3 вопросов.", null], "en": ["A customer is choosing a refrigerator for their family. What questions will you ask to find the right model? Write at least 3 questions.", null]}}, {"key": "objection", "type": "text", "pos": 0, "t": {"uz": ["Mijoz muzlatgich oldida: «Qimmat ekan, o'ylab ko'raman» dedi. Siz nima deb javob berasiz? Mijozga aytadigan gapingizni yozing.", null], "ru": ["Клиент у холодильника говорит: «Дорого, я подумаю». Что вы ответите? Напишите, что скажете клиенту.", null], "en": ["A customer at the refrigerator says: “It's expensive, I'll think about it.” What do you answer? Write what you would say.", null]}}, {"key": "conflict", "type": "text", "block": "b4", "t": {"uz": ["Mijoz sotib olgan texnikasi bilan qaytib keldi va norozi: «U nosoz, siz meni aldadingiz!» Qadamma-qadam nima qilasiz?", null], "ru": ["Клиент вернулся с купленной техникой и недоволен: «Она неисправна, вы меня обманули!» Что вы будете делать, шаг за шагом?", null], "en": ["A customer comes back with the appliance they bought and is upset: “It's faulty, you cheated me!” What do you do, step by step?", null]}}, {"key": "sjt_cash_honesty", "type": "choice", "pos": 1, "t": {"uz": ["Vaziyat: smena oxirida kassada 150 000 so'm ortiqcha pul chiqdi. Nima qilasiz?", ["Jim turaman: ortiqcha pul zarar emas", "Rahbarga xabar beraman va cheklarni tekshirib sababini aniqlayman", "Ortiqchasini olib qo'yaman, keyin kam chiqsa to'ldirish uchun ishlataman", "Hamkasblarga aytaman, o'rtada bo'lib olamiz"]], "ru": ["Ситуация: в конце смены в кассе оказалось на 150 000 сум больше. Что вы сделаете?", ["Промолчу: лишние деньги не убыток", "Сообщу руководителю и проверю чеки, чтобы найти причину", "Оставлю излишек себе, чтобы потом покрыть возможную недостачу", "Скажу коллегам, поделим между собой"]], "en": ["Situation: at the end of your shift the cash desk has 150,000 UZS too much. What do you do?", ["Say nothing: extra money is not a loss", "Tell the manager and check the receipts to find the reason", "Keep the surplus to cover a possible shortage later", "Tell colleagues and split it among ourselves"]]}}, {"key": "sjt_cash_queue", "type": "choice", "pos": 1, "t": {"uz": ["Vaziyat: kassada navbat uzun, mijoz shoshib baqiryapti: «Tezroq bo'ling!» Nima qilasiz?", ["Men ham baqirib javob qaytaraman", "Xotirjam uzr so'rayman, ishni tezlashtiraman va kerak bo'lsa yordam chaqiraman", "Unga e'tibor bermayman", "Tezroq bo'lish uchun summalarni tekshirmay hisoblayman"]], "ru": ["Ситуация: на кассе длинная очередь, клиент торопится и кричит: «Быстрее!» Что вы сделаете?", ["Отвечу ему тем же тоном", "Спокойно извинюсь, ускорюсь и при необходимости позову на помощь", "Не буду обращать внимания", "Чтобы было быстрее, буду считать суммы не проверяя"]], "en": ["Situation: the queue at the cash desk is long and a customer in a hurry shouts: “Faster!” What do you do?", ["Shout back", "Calmly apologise, speed up and call for help if needed", "Ignore the customer", "To be faster, count amounts without double-checking"]]}}, {"key": "sjt_customer", "type": "choice", "pos": 0, "t": {"uz": ["Vaziyat: mijoz arzon telefon so'rayapti. Sizda bonusi yuqori bo'lgan qimmatroq model ham bor. Nima qilasiz?", ["Eng qimmat modelni tavsiya qilaman: bonusim ko'proq bo'ladi", "Mijoz byudjetiga mos modelni ko'rsataman va ustunliklarini tushuntiraman", "Ikkala variantni ko'rsataman, tanlovni mijozga qoldiraman", "Mijoz nima so'rasa, shuni beraman, ortiqcha gapirmayman"]], "ru": ["Ситуация: клиент просит недорогой телефон. У вас есть более дорогая модель с высоким бонусом. Что вы сделаете?", ["Порекомендую самую дорогую модель: мой бонус будет больше", "Покажу модель по бюджету клиента и объясню её преимущества", "Покажу оба варианта, выбор оставлю клиенту", "Дам то, что просит клиент, лишнего говорить не буду"]], "en": ["Situation: a customer asks for a cheap phone. You also have a pricier model with a higher bonus. What do you do?", ["Recommend the most expensive model: my bonus will be bigger", "Show a model within the customer's budget and explain its advantages", "Show both options and leave the choice to the customer", "Give what the customer asks for and say nothing extra"]]}}, {"key": "sjt_team", "type": "choice", "t": {"uz": ["Vaziyat: kassada navbat uzayib ketdi, hamkasbingiz yolg'iz qoldi, sizda esa hozir mijoz yo'q. Nima qilasiz?", ["Mijozim yo'q, demak bu mening ishim emas", "Darhol yordamga boraman: kassaga o'taman yoki mijozlarni boshqa kassaga yo'naltiraman", "Faqat so'rashsa yordam beraman", "Rahbarga xabar beraman va o'z joyimda qolaman"]], "ru": ["Ситуация: на кассе выросла очередь, коллега остался один, а у вас сейчас нет клиентов. Что вы сделаете?", ["У меня нет клиентов, значит, это не моё дело", "Сразу пойду на помощь: встану на кассу или направлю клиентов на другую кассу", "Помогу, только если попросят", "Сообщу руководителю и останусь на своём месте"]], "en": ["Situation: the queue at the cash desk has grown, your colleague is alone, and you have no customers right now. What do you do?", ["I have no customers, so it is not my job", "Go and help right away: take a till or direct customers to another till", "Help only if asked", "Tell the manager and stay at my place"]]}}, {"key": "sjt_learn", "type": "choice", "t": {"uz": ["Vaziyat: do'konga yangi model yoki yangi kassa dasturi keldi, siz uni bilmaysiz, mijoz esa kutyapti. Nima qilasiz?", ["Taxminan o'zim o'ylab javob beraman", "Ko'rsatma va ustozdan o'rganaman, smenadan oldin ko'rib chiqaman", "Hamkasbdan so'rayman, keyin o'zim ham o'qib chiqaman", "Mijozga «bilmayman» deb, boshqa xodimga yo'naltiraman"]], "ru": ["Ситуация: в магазин пришла новая модель или новая кассовая программа, вы её не знаете, а клиент ждёт. Что вы сделаете?", ["Отвечу приблизительно, как сам(а) думаю", "Изучу инструкцию и спрошу наставника, разберусь до смены", "Спрошу коллегу, потом изучу сам(а)", "Скажу клиенту «не знаю» и направлю к другому сотруднику"]], "en": ["Situation: a new model or a new till program has arrived, you do not know it, and a customer is waiting. What do you do?", ["Answer roughly, from my own guess", "Study the manual and ask the mentor, and learn it before my shift", "Ask a colleague, then study   var back = el("button", "link", "← " + T("back")); back.id = "toLang"; back.onclick = langScreen; main.appendChild(back);
}
function welcome() {
  state.i = -1; nav.classList.add("hidden"); clear();
  var pos = state.a.position_i === 1 ? 1 : 0;
  var hero = el("div", "hero"); hero.appendChild(el("h1", null, qOpts(POSQ)[pos])); hero.appendChild(el("p", null, T("hero_title"))); main.appendChild(hero);
  var st = el("div", "stats");
  [["2008", T("st_year")], ["40+", T("st_store")], ["1000+", T("st_staff")]].forEach(function (x) { var s = el("div", "stat"); s.appendChild(el("b", null, x[0])); s.appendChild(el("span", null, x[1])); st.appendChild(s); });
  main.appendChild(st);
  if (!(tg && tg.initData)) main.appendChild(el("div", "warn", T("warn_tg")));
  else if (API_URL.indexOf("PASTE_") === 0) main.appendChild(el("div", "warn", T("warn_api")));
  var L = state.lang;
  [[T("perks"), JOB_TR.perks[L]], [T("terms"), [JOB_TR.training[L], T("t_schedule") + ": " + JOB_TR.schedule[L]]]].forEach(function (blk, n) {
    var c = el("div", "card"); c.id = n ? "termsCard" : "perksCard"; c.appendChild(el("h3", null, blk[0]));
    var ul = document.createElement("ul"); blk[1].forEach(function (t) { ul.appendChild(el("li", null, t)); });
    c.appendChild(ul); main.appendChild(c);
  });
  main.appendChild(el("div", "hint", T("hint_time")));
  var lab = el("label", "consent"); var cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "consent";
  lab.appendChild(cb); lab.appendChild(el("span", null, T("consent"))); main.appendChild(lab);
  var go = el("button", "btn", T("start")); go.id = "startBtn"; go.style.width = "100%"; main.appendChild(go);
  var err = el("div", "err"); main.appendChild(err);
  go.onclick = function () { if (!cb.checked) { err.textContent = T("consent_err"); return; } state = {i: 0, a: {position_i: pos}, slot: "", photo: "", sid: newSid(), lang: state.lang}; render(); };
  var d = loadDraft();
  if (d) {
    var r = el("button", "btn sec", T("resume")); r.id = "resumeBtn"; r.style.cssText = "width:100%;margin-top:10px;flex:none";
    r.onclick = function () { if (!cb.checked) { err.textContent = T("consent_err"); return; } state = {i: d.i, a: d.a, slot: d.slot || "", photo: "", sid: d.sid || newSid(), lang: state.lang}; state.i = Math.min(state.i, steps().length - 1); render(); };
    main.appendChild(r);
  }
  var back = el("button", "link", "← " + T("back")); back.id = "toPos"; back.onclick = posScreen; main.appendChild(back);
}

// ---------- steps
function render() {
  clear(); nav.classList.remove("hidden");
  var all = steps(); if (state.i > all.length - 1) state.i = all.length - 1;
  var step = all[state.i], total = all.length;
  var pr = el("div", "progress"); var bar = document.createElement("i"); bar.style.width = Math.round((state.i + 1) / total * 100) + "%"; pr.appendChild(bar); main.appendChild(pr);
  var m = el("div", "meta"); m.appendChild(el("span", null, T("step").replace("{n}", state.i + 1).replace("{t}", total))); main.appendChild(m);
  nextBtn.disabled = false; nextBtn.textContent = state.i === total - 1 ? T("submit") : T("next");
  backBtn.textContent = T("back"); backBtn.style.visibility = state.i === 0 ? "hidden" : "visible";
  var err = el("div", "err"); err.id = "err";
  if (step.kind === "q") renderQ(step.q, err, all);
  else if (step.kind === "photo") renderPhoto(err);
  else renderSlot(err);
  main.appendChild(err);
  window.scrollTo(0, 0);
}
function blockLabel(all) { for (var k = state.i; k >= 0; k--) { var s = all[k]; if (s.kind === "q" && s.q.block) return (BLOCKS[s.q.block] || {})[state.lang] || ""; } return ""; }
var SHORT = {fio: 1, phone: 1, district: 1, age: 1, study_place: 1, children_ages: 1, calc_change: 1, calc_discount: 1, calc_total: 1};
function renderQ(q, err, all) {
  var b = blockLabel(all); if (b) main.appendChild(el("div", "block", b));
  var h = el("h2", "q", qText(q)); h.setAttribute("data-key", q.key); main.appendChild(h);
  if (q.type === "choice") {
    var cur = state.a[q.key + "_i"];
    qOpts(q).forEach(function (o, n) {
      var bt = el("button", "opt" + (cur === n ? " sel" : ""), o);
      bt.onclick = function () { state.a[q.key + "_i"] = n; saveDraft(); Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (x) { x.classList.remove("sel"); }); bt.classList.add("sel"); err.textContent = ""; };
      main.appendChild(bt);
    });
  } else {
    var long_ = !SHORT[q.key];
    var inp = long_ ? document.createElement("textarea") : document.createElement("input");
    if (!long_) { inp.type = q.key === "phone" ? "tel" : "text"; if (q.type === "number") inp.inputMode = "numeric"; /* type=number rejects "1 260 000" */ }
    if (q.key === "phone") inp.placeholder = "+998 90 123 45 67";
    inp.value = state.a[q.key] || "";
    inp.oninput = function () { state.a[q.key] = inp.value; saveDraft(); err.textContent = ""; };
    main.appendChild(inp);
    if (long_) main.appendChild(el("div", "hint", T("hint_long")));
  }
}
function renderSlot(err) {
  main.appendChild(el("div", "block", T("slot_block")));
  var h = el("h2", "q", T("slot_title")); h.setAttribute("data-key", "slot"); main.appendChild(h);
  SLOTS.forEach(function (s) {
    var bt = el("button", "opt" + (state.slot === s ? " sel" : ""), s);
    bt.onclick = function () { state.slot = s; saveDraft(); Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (x) { x.classList.remove("sel"); }); bt.classList.add("sel"); err.textContent = ""; };
    main.appendChild(bt);
  });
}

// ---------- selfie
function stopCam() { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } }
function renderPhoto(err) {
  main.appendChild(el("div", "block", T("photo_block")));
  var h = el("h2", "q", T("photo_title")); h.setAttribute("data-key", "photo"); main.appendChild(h);
  main.appendChild(el("div", "hint", T("photo_hint")));
  var box = el("div", "cam"); box.style.marginTop = "12px"; main.appendChild(box);
  var row = el("div", "row"); main.appendChild(row);
  var file = document.createElement("input"); file.type = "file"; file.accept = "image/*"; file.setAttribute("capture", "user"); file.className = "hidden"; main.appendChild(file);
  function showPhoto() {
    stopCam(); box.textContent = ""; var im = document.createElement("img"); im.src = state.photo; im.alt = "Selfie"; box.appendChild(im);
    row.textContent = ""; var again = el("button", "btn sec", T("retake")); again.style.flex = "1"; again.onclick = showCam; row.appendChild(again);
  }
  function showFallback(msg) {
    stopCam(); box.textContent = ""; box.appendChild(el("div", "ph", msg));
    row.textContent = ""; var b = el("button", "btn", T("use_phone_cam")); b.onclick = function () { file.click(); }; row.appendChild(b);
  }
  function showCam() {
    state.photo = ""; box.textContent = ""; row.textContent = "";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showFallback(T("cam_unsupported")); return; }
    navigator.mediaDevices.getUserMedia({video: {facingMode: "user", width: {ideal: 960}, height: {ideal: 1280}}, audio: false}).then(function (s) {
      stream = s; var v = document.createElement("video"); v.setAttribute("playsinline", ""); v.muted = true; v.autoplay = true; v.srcObject = s; box.appendChild(v);
      var snap = el("button", "btn", T("take_photo")); snap.id = "snap"; snap.onclick = function () {
        if (!v.videoWidth) { err.textContent = T("cam_notready"); return; }
        var c = document.createElement("canvas"); var sc = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
        c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
        var ctx = c.getContext("2d"); ctx.translate(c.width, 0); ctx.scale(-1, 1); ctx.drawImage(v, 0, 0, c.width, c.height);
        state.photo = shrink(c); err.textContent = ""; showPhoto();
      };
      row.appendChild(snap);
    }).catch(function () { showFallback(T("cam_denied")); });
  }
  file.onchange = function () {
    var f = file.files && file.files[0]; if (!f) return;
    var im = new Image(), url = URL.createObjectURL(f);
    im.onload = function () {
      var sc = Math.min(1, 640 / Math.max(im.width, im.height)); var c = document.createElement("canvas");
      c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); state.photo = shrink(c); err.textContent = ""; showPhoto();
    };
    im.onerror = function () { err.textContent = T("img_err"); };
    im.src = url;
  };
  if (state.photo) showPhoto(); else showCam();
}
function shrink(canvas) { var q = 0.85, d = canvas.toDataURL("image/jpeg", q); while (d.length > 600000 && q > 0.35) { q -= 0.1; d = canvas.toDataURL("image/jpeg", q); } return d; }

// ---------- validation / navigation
function validate() {
  var step = steps()[state.i];
  if (step.kind === "photo") return state.photo ? "" : T("photo_need");
  if (step.kind === "slot") return state.slot ? "" : T("slot_need");
  var q = step.q, v = state.a[q.key];
  if (q.type === "choice") return typeof state.a[q.key + "_i"] === "number" ? "" : T("choose_opt");
  v = (v || "").trim();
  if (!v) return T("write_answer");
  if (q.key === "phone") { var p = normPhone(v); if (!p) return T("bad_phone"); v = p; }
  if (q.key === "age") { var n = parseInt(v, 10); if (!(n >= 16 && n <= 70)) return T("bad_age"); v = String(n); }
  if (q.key === "fio" && v.length < 3) return T("fio_err");
  state.a[q.key] = v;
  return "";
}
nextBtn.onclick = function () {
  var e = validate(); var err = document.getElementById("err");
  if (e) { err.textContent = e; return; }
  if (state.i >= steps().length - 1) { saveDraft(); submit(); } else { state.i++; saveDraft(); render(); }
};
backBtn.onclick = function () { if (state.i > 0) { state.i--; render(); } };

// ---------- submit (only answers to the questions that apply to this candidate)
function submit() {
  var err = document.getElementById("err"); err.textContent = "";
  if (API_URL.indexOf("PASTE_") === 0) { err.textContent = T("warn_api"); return; }
  nextBtn.disabled = true; nextBtn.textContent = T("sending");
  var answers = {position_i: state.a.position_i === 1 ? 1 : 0};
  steps().forEach(function (s) {
    if (s.kind !== "q") return;
    if (s.q.type === "choice") answers[s.q.key + "_i"] = state.a[s.q.key + "_i"]; else answers[s.q.key] = state.a[s.q.key];
  });
  var body = JSON.stringify({v: 4, sid: state.sid, lang: state.lang, initData: (tg && tg.initData) || "", slot: state.slot, answers: answers, photo: state.photo});
  fetch(API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=UTF-8"}, body: body}).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { return {s: r.status, j: j}; });
  }).then(function (x) {
    if (x.j && x.j.ok) { done(); return; }
    var k = "err_" + ((x.j && x.j.error) || "");
    err.textContent = UI[k] ? T(k) : T("err_generic");
    nextBtn.disabled = false; nextBtn.textContent = T("submit");
  }).catch(function () { err.textContent = T("err_network"); nextBtn.disabled = false; nextBtn.textContent = T("submit"); });
}
function done() {
  clearDraft(); clear(); nav.classList.add("hidden");
  try { if (tg) tg.disableClosingConfirmation(); } catch (e) {}
  var d = el("div", "done"); d.appendChild(el("div", "tick", "✅")); d.appendChild(el("h2", null, T("done_title")));
  d.appendChild(el("p", null, T("done_text")));
  var c = el("button", "btn", T("close")); c.style.width = "100%"; c.onclick = function () { if (tg) tg.close(); }; d.appendChild(c); main.appendChild(d);
}

// start: language from the bot link (?lang=ru), then from a saved draft, otherwise ask
var m = /[?&]lang=([a-z]{2})/.exec(location.search), d0 = loadDraft();
var preferred = (m && LANGS[m[1]] && m[1]) || (d0 && LANGS[d0.lang] && d0.lang) || "";
setLang(preferred || "uz");
langScreen();   // первый экран всегда выбор языка, затем должность, условия и анкета
})();
</script>
