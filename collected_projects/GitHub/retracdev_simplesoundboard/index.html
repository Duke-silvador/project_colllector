<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Soundboard · retrac.space</title>
  <meta name="description" content="Fun sound effects without the bloat. Part of the retrac.space collection.">
  <meta name="theme-color" content="#07060d">
  <meta property="og:title" content="Simple Soundboard">
  <meta property="og:description" content="Fun sound effects without the bloat. Part of the retrac.space collection.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/bagel-fat-one-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Shared icons. Every icon on the page references one of these symbols. -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-note-quarter" viewBox="0 0 24 24"><path d="M13 3v11.55A4 4 0 1 0 15 18V3z"/></symbol>
    <symbol id="icon-note-eighth" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></symbol>
    <symbol id="icon-note-beamed" viewBox="0 0 24 24"><path d="M9 5v9.55A3.5 3.5 0 1 0 11 18V8.6l8-1.8v5.75A3.5 3.5 0 1 0 21 16V3z"/></symbol>
    <symbol id="icon-speaker" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9z"/><path d="M15 8.5a5 5 0 0 1 0 7z"/><path d="M15 4.5v2.1a7.5 7.5 0 0 1 0 10.8v2.1a9.5 9.5 0 0 0 0-15z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.93 12.09l4.74 4.74-1.66 1.66-4.74-4.74A7.5 7.5 0 1 1 10.5 3zm0 2.4a5.1 5.1 0 1 0 0 10.2 5.1 5.1 0 0 0 0-10.2z"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></symbol>
    <!-- Lucide "heart", "loader-circle", "arrow-right", "arrow-up-down", "grip-vertical", "play", "headphones" and "square", ISC License, Copyright (c) Lucide Icons and Contributors -->
    <symbol id="icon-play-all" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></symbol>
    <symbol id="icon-headphones" viewBox="0 0 24 24"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></symbol>
    <symbol id="icon-rearrange" viewBox="0 0 24 24"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></symbol>
    <symbol id="icon-grip" viewBox="0 0 24 24"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
    <symbol id="icon-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></symbol>
    <!-- Lucide "audio-lines", "pencil" and "repeat", ISC License, Copyright (c) Lucide Icons and Contributors -->
    <symbol id="icon-string" viewBox="0 0 24 24"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></symbol>
    <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="icon-loop" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <!-- Lucide "gauge" and "audio-waveform", ISC License, Copyright (c) Lucide Icons and Contributors -->
    <symbol id="icon-speed" viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></symbol>
    <symbol id="icon-pitch" viewBox="0 0 24 24"><path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/></symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></symbol>
  </svg>

  <header class="topbar">
    <a class="topbar__logo" href="https://retrac.space">
      <img src="assets/retrac-space-logo.png" alt="retrac.space" width="168" height="26">
    </a>
  </header>

  <section class="hero">
    <div class="hero__notes" id="heroNotes" aria-hidden="true"></div>
    <h1 class="title">
      <span class="sr-only">Simple Soundboard</span>
      <span class="title__art" id="titleArt" aria-hidden="true"></span>
    </h1>
    <p class="hero__tag">Fun sound effects without the bloat.</p>
    <div class="ribbon" aria-hidden="true">
      <div class="ribbon__track" id="ribbonTrack"></div>
    </div>
  </section>

  <main class="deck">
    <section class="console" aria-label="Find sounds">
      <div class="console__row">
        <label class="search">
          <span class="sr-only">Search sounds</span>
          <svg class="search__icon" aria-hidden="true"><use href="#icon-search"/></svg>
          <input id="search" type="search" placeholder="Search sounds" autocomplete="off" spellcheck="false">
          <kbd class="search__hint" aria-hidden="true">/</kbd>
        </label>
        <div class="mixer">
          <label class="volume">
            <span class="sr-only">Volume</span>
            <svg class="volume__icon" aria-hidden="true"><use href="#icon-speaker"/></svg>
            <input id="volume" type="range" min="0" max="100" value="80">
          </label>
          <button class="stop" id="stopAll" type="button">
            <svg aria-hidden="true"><use href="#icon-stop"/></svg>
            Stop all
          </button>
        </div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
      <div class="sound-request-prompt">
        <span>Missing your favorite sound?</span>
        <button class="signin-button signin-button--quiet" id="requestSound" type="button" aria-haspopup="dialog">Request a Sound Effect</button>
      </div>
    </section>

    <p class="status" id="status" role="status"></p>
    <p class="favorites-note" id="favoritesNote" role="status" hidden></p>

    <div class="banks" id="banks"></div>

    <div class="empty" id="empty" hidden>
      <svg aria-hidden="true"><use id="emptyIcon" href="#icon-note-eighth"/></svg>
      <p class="empty__title" id="emptyTitle">Total silence.</p>
      <p class="empty__text" id="emptyText"></p>
      <button class="empty__reset" id="emptySignIn" type="button" hidden>Log in or sign up</button>
      <button class="empty__reset" id="emptyReset" type="button">Show every sound</button>
    </div>

    <div class="everything">
      <!-- The visible words are what's asked for. The accessible name says "start", like every key. -->
      <button class="everything__button" id="everything" type="button" aria-label="Start every sound">
        <svg aria-hidden="true"><use id="everythingIcon" href="#icon-play-all"/></svg>
        <span id="everythingLabel">Play Everything</span>
      </button>
    </div>

    <noscript>
      <p class="noscript">Simple Soundboard needs JavaScript turned on.</p>
    </noscript>
  </main>

  <footer class="footer">
    <a href="https://retrac.space"><img src="assets/retrac-space-logo.png" alt="retrac.space" width="130" height="20"></a>
    <p>Simple Soundboard is part of the <a href="https://retrac.space">retrac.space</a> collection.</p>
  </footer>

  <div class="burst" id="burst" aria-hidden="true"></div>

  <dialog class="sound-request" id="soundRequestDialog" aria-labelledby="soundRequestTitle" aria-describedby="soundRequestDescription">
    <header class="sound-request__header">
      <div>
        <h2 id="soundRequestTitle">Request a Sound Effect</h2>
        <p id="soundRequestDescription">Got a sound this board needs? Send it our way and help us make some more noise.</p>
      </div>
      <button class="sound-request__close" id="soundRequestClose" type="button" aria-label="Close sound request">&times;</button>
    </header>
    <div class="sound-request__body" id="soundRequestBody"></div>
  </dialog>

  <script src="js/sounds.js"></script>
  <script src="js/tune-core.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/account.js"></script>
  <script src="js/strings-core.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/sign-in.js"></script>
  <script src="js/rearrange.js"></script>
  <script src="js/beta.js"></script>
  <script src="js/strings-access.js"></script>
  <script src="js/string-editor.js"></script>
  <script src="js/tune-editor.js"></script>
  <script src="js/app.js"></script>
  <script src="js/account-welcome.js"></script>
  <script src="js/early-access.js"></script>
  <script src="js/sound-request.js"></script>
</body>
</html>
