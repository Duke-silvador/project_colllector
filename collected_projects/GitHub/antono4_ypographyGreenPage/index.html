<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Typography - About Green</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b140d;
        }
        .font-script {
            font-family: 'Caveat', cursive;
        }
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
        
        /* Background Utama */
        .bg-leaf-blur {
            background-image: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1000');
            background-size: cover;
            background-position: center;
            filter: blur(16px) brightness(0.4);
            transform: scale(1.1);
        }


        /* Pill Background Images */
        .pill-bg {
            background-image: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1000');
            background-size: cover;
            background-position: center;
        }


        .pill-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7), 0 8px 10px -6px rgba(0, 0, 0,  0.7);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 overflow-x-hidden">


    <div class="relative w-full max-w-[420px] h-[860px] overflow-hidden rounded-none sm:rounded-3xl shadow-2xl flex flex-col justify-between p-6 text-white border border-white/10">
        
        <div class="absolute inset-0 bg-leaf-blur -z-10"></div>
        <div class="absolute inset-0 bg-black/20 -z-10"></div>


        <header class="text-center pt-2">
            <h1 class="text-[11px] tracking-[0.45em] font-semibold text-white/90 uppercase">
                C R E A T I V E &nbsp; T Y P O G R A P H Y
            </h1>
        </header>


        <section class="flex flex-col items-center gap-[10px] my-auto py-2 w-full">
            
            <div class="w-[78%] h-[56px] rounded-full border border-white/80 pill-shadow overflow-hidden translate-x-2">
                <div class="w-full h-full pill-bg bg-[position:20%_20%] scale-125"></div>
            </div>


            <div class="w-[84%] h-[56px] rounded-full border border-white/80 pill-shadow overflow-hidden -translate-x-3">
                <div class="w-full h-full pill-bg bg-[position:40%_35%] scale-125"></div>
            </div>


            <div class="w-[80%] h-[56px] rounded-full border border-white/80 pill-shadow overflow-hidden -translate-x-1">
                <div class="w-full h-full pill-bg bg-[position:60%_50%] scale-125"></div>
            </div>


            <div class="w-[82%] h-[56px] rounded-full border border-white/80 pill-shadow overflow-hidden -translate-x-4">
                <div class="w-full h-full pill-bg bg-[position:30%_65%] scale-125"></div>
            </div>


            <div class="w-[83%] h-[56px] rounded-full border border-white/80 pill-shadow overflow-hidden translate-x-2">
                <div class="w-full h-full pill-bg bg-[position:70%_80%] scale-125"></div>
            </div>


            <div class="w-[78%] h-[56px] rounded-full border border-white/80 pill-shadow overflow-hidden translate-x-1">
                <div class="w-full h-full pill-bg bg-[position:50%_90%] scale-125"></div>
            </div>


        </section>


        <div class="w-full px-2">
            <div class="flex items-center justify-between gap-3 mb-6">
                <a href="#" class="text-white hover:text-gray-300 transition-colors pl-2">
                    <i class="fa-regular fa-compass text-2xl"></i>
                </a>


                <div class="flex-1 flex items-center border border-white/90 rounded-full h-9 px-3 bg-black/10 backdrop-blur-sm">
                    <span class="text-xs font-semibold text-white tracking-wide pl-2 flex-1">Hijau Daun</span>
                    <div class="border-l border-white/60 h-full my-auto mx-2"></div>
                    <button class="text-white hover:text-gray-300">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </button>
                </div>


                <a href="#" class="text-white hover:text-gray-300 transition-colors pr-2">
                    <i class="fa-solid fa-paper-plane text-xl"></i>
                </a>
            </div>


            <div class="relative pt-2">
                <div class="flex items-center gap-2">
                    <div class="text-white text-xs space-y-0.5">
                        <i class="fa-solid fa-sparkles text-sm"></i>
                    </div>


                    <div class="relative">
                        <div class="absolute inset-0 bg-white/10 backdrop-blur-md rounded-sm -m-1 px-3 py-1"></div>
                        <span class="relative font-script text-3xl text-white block -mb-2 z-10 pl-1">About</span>
                        <h2 class="relative text-4xl font-extrabold tracking-tight text-[#65bd20] z-10 leading-none">
                            Green
                        </h2>
                    </div>


                    <div class="flex-1 flex items-center ml-1 self-end mb-1">
                        <div class="h-[2px] bg-white/90 w-full"></div>
                        <div class="flex gap-1 ml-1">
                            <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
                            <span class="w-1.5 h-1.5 bg-white rounded-full"></span>
                        </div>
                    </div>
                </div>


                <p class="text-center text-[12px] italic text-white/90 font-light mt-4 tracking-wide">
                    Tidak semua yang hijau itu harus Green Day dan Hulk
                </p>
            </div>
        </div>


        <footer class="pt-6 pb-2 px-2 flex flex-col gap-3">
            <div class="flex justify-between items-end text-xs">
                <div class="flex flex-col">
                    <span class="text-[#cddc39] font-medium text-[11px]">Created by</span>
                    <span class="font-script text-lg text-white font-normal tracking-wide">@onlybastiand___</span>
                </div>


                <div class="flex flex-col text-right">
                    <span class="text-[#cddc39] font-medium text-[11px]">Pict by</span>
                    <span class="font-poppins font-bold text-sm text-white tracking-wider">Gordeeva</span>
                </div>
            </div>


            <div class="flex justify-center pt-1 opacity-80">
                <svg width="32" height="32" viewBox="0 0 100 100" fill="none" stroke="currentColor" class="text-white stroke-[2.5]">
                    <path d="M20 70 Q 40 10, 60 50 T 80 30 M30 80 Q 50 30,  70 70" />
                    <circle cx="75" cy="25" r="3" fill="currentColor"/>
                </svg>
            </div>
        </footer>


    </div>


</body>
</html>
