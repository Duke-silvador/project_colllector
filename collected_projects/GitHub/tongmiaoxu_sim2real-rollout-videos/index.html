<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sim2Real Rollout Video Gallery</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#9707;</span>
      <div class="brand-text">
        <h1>Sim2Real Rollout Video Gallery</h1>
        <p>Full-episode policy rollouts &mdash; 4 sim2real baselines + real-world eval &times; stationary/wrist camera</p>
      </div>
    </div>
    <div class="topbar-controls">
      <div class="segmented" id="view-tabs"></div>
      <div class="segmented" id="task-tabs"></div>
      <button class="ghost-btn" id="restart-btn">&#8635; Restart all</button>
    </div>
  </header>

  <main class="content">
    <p class="task-sub" id="task-sub"></p>
    <div class="grid-wrap">
      <div class="video-grid" id="video-grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <a href="https://tongmiaoxu.github.io/sim2real-baseline-gallery/">Sim2Real Baseline Gallery</a> (per-frame image comparison) &middot;
    Generated with <a href="https://claude.com/claude-code">Claude Code</a>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
