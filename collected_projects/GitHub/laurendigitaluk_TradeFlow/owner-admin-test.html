<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeFlow Owner/Admin Test Lab</title><link rel="stylesheet" href="styles.css"><style>.lab{max-width:760px;margin:40px auto;padding:24px}.card{border:1px solid #ddd;border-radius:10px;padding:18px;margin:16px 0;background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}.ok{color:#176b2c}.bad{color:#a11}.muted{color:#666}input,select,button{padding:10px;border-radius:6px;border:1px solid #bbb}button{cursor:pointer}.results{font-family:system-ui,sans-serif;font-size:14px;line-height:1.5}</style></head><body><main class="lab"><h1>TradeFlow Owner/Admin Test Lab</h1><p class="muted">Temporary security testing for the TradeFlow tenant role hierarchy. Do not use production data.</p><section id="config" class="card"><label>TradeFlow Supabase publishable key<br><input id="key" type="password" style="width:100%" autocomplete="off"></label><div class="row" style="margin-top:12px"><button id="connect" type="button">Connect</button></div><p id="status" class="muted"></p></section><section id="auth" class="card" hidden><h2>Authenticate</h2><input id="email" type="email" placeholder="Test email"><input id="password" type="password" placeholder="Password"><select id="tenant"><option value="test-business-a">Test Business A</option><option value="test-business-b">Test Business B</option></select><div class="row" style="margin-top:12px"><button id="signup" type="button">Create Admin Test Account</button><button id="signin" type="button">Sign In</button></div><p id="authmsg" class="muted"></p></section><section id="ready" class="card" hidden><p id="identity"></p><button id="register" type="button">Register as Admin</button><button id="run" type="button" hidden>Run Owner/Admin Security Test</button><button id="signout" type="button">Sign out</button><p id="msg" class="muted"></p><div id="results" class="results"></div></section></main><script src="owner-admin.js?v=20260915-3" defer></script></body></html>
