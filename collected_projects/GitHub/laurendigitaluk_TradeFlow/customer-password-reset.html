<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — TradeFlow</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7f9;color:#17212b;margin:0;min-height:100vh;display:grid;place-items:center}
.card{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #d8dee5;border-radius:12px;padding:32px;box-sizing:border-box}
h1{margin:0 0 10px;font-size:26px}.message{color:#596774;line-height:1.5}.error{color:#9b2c2c}.success{color:#245f3b}
label{display:block;font-weight:700;margin-top:16px}input{display:block;width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd6dd;border-radius:6px;margin-top:6px}
button{margin-top:18px;padding:11px 16px;border:0;border-radius:7px;background:#17212b;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main class="card">
<h1>Set a new password</h1>
<p id="message" class="message">Enter a new password for your TradeFlow customer account.</p>
<form id="form">
<label>New password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label>
<label>Confirm password<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
<button id="submit" type="submit">Update password</button>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
 const SUPABASE_URL='https://twfbmjwwqzxdxvclxbun.supabase.co';
 const SUPABASE_KEY='sb_publishable_AvcMgtUKV0O5k8H6k94mZQ_qH4pEIS9';
 const params=new URLSearchParams(location.search);
 const tenantId=params.get('tenant_id')||'';
 const hash=new URLSearchParams(location.hash.replace(/^#/,''));
 const accessToken=hash.get('access_token');
 const refreshToken=hash.get('refresh_token');
 const type=hash.get('type');
 const message=document.getElementById('message');
 const form=document.getElementById('form');
 if(type!=='recovery'||!accessToken||!refreshToken){
   message.textContent='This password-reset link is missing or has expired. Request a new password reset email from the Customer Portal.';
   message.className='message error';
   form.hidden=true;
   return;
 }
 const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 const sessionResult=await client.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
 if(sessionResult.error){
   message.textContent=sessionResult.error.message||'This password-reset link is invalid or expired.';
   message.className='message error';
   form.hidden=true;
   return;
 }
 form.addEventListener('submit',async e=>{
   e.preventDefault();
   const password=document.getElementById('password').value;
   const confirm=document.getElementById('confirm').value;
   if(password.length<8){message.textContent='Password must be at least 8 characters.';message.className='message error';return}
   if(password!==confirm){message.textContent='The passwords do not match.';message.className='message error';return}
   const button=document.getElementById('submit');button.disabled=true;button.textContent='Updating…';
   const result=await client.auth.updateUser({password});
   if(result.error){
     message.textContent=result.error.message||'The password could not be updated. Please request a new reset email.';
     message.className='message error';button.disabled=false;button.textContent='Update password';return;
   }
   message.textContent='Your password has been updated. You can now sign in to the Customer Portal.';
   message.className='message success';
   form.hidden=true;
   setTimeout(()=>{
     const next=new URL('customer-dashboard.html',location.href);
     if(tenantId)next.searchParams.set('tenant_id',tenantId);
     location.replace(next.href);
   },1200);
 });
})();
</script>
</body>
</html>
