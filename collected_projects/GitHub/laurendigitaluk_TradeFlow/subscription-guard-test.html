<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeFlow Subscription Guard Test</title><style>body{margin:0;background:#f4f6f9;font:14px Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:50px auto;padding:0 18px}.card{background:#fff;border-radius:10px;padding:24px;box-shadow:0 4px 18px #0001}h1{margin-top:0}.small{color:#657086;font-size:12px}.btn{background:#1769ff;color:#fff;border:0;border-radius:5px;padding:10px 14px;cursor:pointer}.btn:disabled{opacity:.6}.pass{color:#087a32}.fail{color:#b42318}.test-row{padding:7px 0;border-bottom:1px solid #eee}.note{color:#526070;margin-left:6px}.error{background:#fff0f0;color:#b42318;padding:10px;border-radius:5px}</style></head><body><main class="wrap"><div class="card"><div class="small">TRADEFLOW</div><h1>Customer Subscription Guard Test</h1><p class="small">Temporary security test infrastructure. This version resolves the authenticated customer's tenant through the protected test-lab customer resolver RPC.</p><div id="session">Checking authenticated customer session…</div><p><button id="run" class="btn" disabled>Run subscription guard test</button></p><div id="results"></div></div></main><script>
const U='https://twfbmjwwqzxdxvclxbun.supabase.co',K='tradeflow_testlab_publishable_key',S='tradeflow_testlab_session';const T={a:{id:'f50fb889-c615-4e55-84d4-f0fd9f48b0b0',label:'Customer A / Buying'},b:{id:'373598f0-7d35-41be-8ed2-3cc7ee9709c7',label:'Customer B / Selling'}};const READ=[['customer_get_profile','Customer profile','module.customer_portal'],['customer_get_addresses','Customer addresses','module.customer_portal'],['customer_get_buying_requests','Buying requests','module.buying'],['customer_get_buying_items','Buying items','module.buying'],['customer_get_trading_values','Trading Values','module.valuation'],['customer_get_offers','Offers','module.offers'],['customer_get_acquisitions','Acquisitions','module.buying'],['customer_get_trade_ins','Trade-ins','module.trade_in'],['customer_get_order_trade_ins','Order trade-ins','module.trade_in'],['customer_get_orders','Orders','module.orders'],['customer_get_order_items','Order items','module.orders'],['customer_get_fulfilments','Fulfilments','module.fulfilment'],['customer_get_returns','Returns','module.orders']];const ACTIONS=[['customer_submit_buying_request','Submit buying request','module.buying',{p_notes:'subscription guard test',p_items:[]}],['customer_accept_offer','Accept offer','module.offers',{p_offer_id:'00000000-0000-0000-0000-000000000000',p_response_notes:'subscription guard test'}],['customer_refuse_offer','Refuse offer','module.offers',{p_offer_id:'00000000-0000-0000-0000-000000000000',p_response_notes:'subscription guard test'}],['customer_request_return','Request return','module.orders',{p_order_item_id:'00000000-0000-0000-0000-000000000000',p_reason_code:'test',p_reason:'subscription guard test',p_customer_notes:'subscription guard test'}]];let key=localStorage.getItem(K)||'',session=null;const $=id=>document.getElementById(id);async function api(path,opt={}){const h=new Headers(opt.headers||{});h.set('apikey',key);h.set('Content-Type','application/json');if(session?.access_token)h.set('Authorization','Bearer '+session.access_token);const r=await fetch(U+path,{...opt,headers:h}),txt=await r.text();let b=null;try{b=txt?JSON.parse(txt):null}catch(_){b=txt}if(!r.ok){const e=new Error(b?.msg||b?.message||b?.error_description||b?.error||txt||'HTTP '+r.status);e.status=r.status;throw e}return b}function row(label,ok,detail){return '<div class="test-row"><strong class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+label+'</strong><span class="note">'+detail+'</span></div>'}async function identify(){session=JSON.parse(localStorage.getItem(S)||'null');if(!session?.access_token)throw new Error('No authenticated customer session found. Sign in through the Customer Test Lab first.');const user=await api('/auth/v1/user');session.user=user;const c=await api('/rest/v1/rpc/test_lab_current_customer',{method:'POST',body:'{}'});const rows=Array.isArray(c)?c:[];const active=rows.filter(x=>x?.customer_id&&x?.tenant_id);if(active.length!==1)throw new Error('Expected exactly one active test-lab customer record; found '+active.length+'.');const ownKey=active[0].tenant_id===T.a.id?'a':active[0].tenant_id===T.b.id?'b':null;if(!ownKey)throw new Error('Authenticated customer is not attached to a test tenant.');return ownKey}async function run(){const btn=$('run'),out=$('results');btn.disabled=true;out.innerHTML='<p>Running…</p>';let pass=0;const rows=[];try{const ownKey=await identify(),allowed=new Set(ownKey==='a'?['module.customer_portal','module.buying','module.valuation','module.offers']:['module.orders','module.fulfilment']);$('session').textContent='Authenticated test account: '+(session.user.email||session.user.id)+'. Tenant: '+T[ownKey].label+'.';for(const [fn,label,feature] of READ){try{await api('/rest/v1/rpc/'+fn+'?p_tenant_id='+encodeURIComponent(T[ownKey].id),{method:'GET'});const ok=allowed.has(feature);if(ok)pass++;rows.push(row(label+' — '+feature,ok,ok?'RPC allowed as expected.':'RPC executed for a disallowed capability.'))}catch(e){const denied=/subscription capability required/i.test(e.message),ok=allowed.has(feature)?!denied:denied;if(ok)pass++;rows.push(row(label+' — '+feature,ok,ok?(allowed.has(feature)?'RPC allowed as expected.':'Blocked by subscription guard as expected.'):'Unexpected HTTP '+(e.status||'?')+' — '+e.message))}}for(const [fn,label,feature,body] of ACTIONS){try{await api('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify({p_tenant_id:T[ownKey].id,...body})});const ok=allowed.has(feature);if(ok)pass++;rows.push(row(label+' — '+feature,ok,ok?'RPC reached normal business logic.':'RPC executed for a disallowed capability.'))}catch(e){const denied=/subscription capability required/i.test(e.message),ok=allowed.has(feature)?!denied:denied;if(ok)pass++;rows.push(row(label+' — '+feature,ok,ok?(allowed.has(feature)?'Guard allowed normal validation as expected.':'Blocked by subscription guard as expected.'):'Unexpected HTTP '+(e.status||'?')+' — '+e.message))}}const total=rows.length;out.innerHTML='<h3>Authenticated Subscription Capability Test</h3><p><strong class="'+(pass===total?'pass':'fail')+'">'+pass+'/'+total+' checks passed.</strong></p>'+rows.join('')}catch(e){out.innerHTML='<p class="error"><strong>Test could not complete:</strong> '+e.message+'</p>'}finally{btn.disabled=false}}window.addEventListener('DOMContentLoaded',async()=>{try{if(!key)throw new Error('No Test Lab publishable key found. Sign in through the Customer Test Lab first.');const k=await identify();$('session').textContent='Authenticated session ready for '+T[k].label+'. Click Run to execute the subscription guard test.';$('run').disabled=false}catch(e){$('session').textContent=e.message;$('session').className='error'}});$('run').addEventListener('click',run);
</script></body></html>
