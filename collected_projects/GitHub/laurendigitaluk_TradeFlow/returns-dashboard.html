<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeFlow Returns</title><link rel="stylesheet" href="subscriber-dashboard.css?v=3"><style>
.return-list{display:grid;gap:14px;margin-top:18px}.return-tile{border:1px solid #d9e0e5;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(20,30,40,.05);overflow:hidden}.return-tile-head{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 20px;background:#fafbfc;border-bottom:1px solid #e6ebef}.return-reference{font-size:17px;font-weight:800;color:#26343d}.return-type{margin-top:4px;color:#65727c;font-size:13px}.return-status{display:inline-flex;align-items:center;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;text-transform:capitalize;background:#fff4d8;color:#8a6200;border:1px solid #e3c36b;white-space:nowrap}.return-status.authorised{background:#edf7f0;color:#25623b;border-color:#9bc8a8}.return-status.rejected{background:#f8eeee;color:#8d3434;border-color:#d9a0a0}.return-details{display:grid;grid-template-columns:2fr 1fr 1.5fr;gap:18px;padding:18px 20px}.return-detail span{display:block;color:#71808a;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}.return-detail strong{display:block;font-size:14px;color:#26343d}.return-decision{padding:16px 20px;border-top:1px solid #e6ebef;background:#fbfcfd}.return-decision-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#71808a;margin-bottom:10px}.return-decision-buttons{display:flex;gap:9px;flex-wrap:wrap}.return-action-button,.return-confirm{border:1px solid #c8d1d8;border-radius:7px;background:#fff;padding:9px 14px;font-weight:700;cursor:pointer}.return-action-button.approve{background:#edf7f0;border-color:#9bc8a8;color:#25623b}.return-action-button.deny{background:#f8eeee;border-color:#d9a0a0;color:#8d3434}.return-action-button:hover,.return-confirm:hover{filter:brightness(.98)}.return-approval-form{margin-top:14px;padding:16px;border:1px solid #d9e0e5;border-radius:9px;background:#fff;display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.return-approval-form label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#53616a}.return-approval-form select,.return-approval-form input{width:100%;box-sizing:border-box;border:1px solid #cbd4da;border-radius:6px;padding:9px;background:#fff;font:inherit;font-weight:400}.return-confirm{background:#26343d;color:#fff;border-color:#26343d}.return-decision-result{display:flex;gap:12px;align-items:center;padding:13px 20px;border-top:1px solid #e6ebef;background:#fbfcfd;font-size:13px}.return-decision-result span{color:#65727c}@media(max-width:700px){.return-tile-head{align-items:flex-start;flex-direction:column}.return-details{grid-template-columns:1fr}.return-approval-form{grid-template-columns:1fr}.return-decision-result{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="topbar"><div class="brand">TradeFlow / Returns</div><div><span id="business-name">Subscriber Business</span><button id="sign-out" type="button">Sign out</button></div></header><main class="layout"><aside class="sidebar"><nav><a href="subscriber-dashboard.html">Dashboard</a><a href="buying-dashboard.html">Buying</a><a href="acquisition-dashboard.html">Acquisitions</a><a href="inventory-dashboard.html">Inventory</a><a href="selling-dashboard.html">Selling</a><a href="orders-dashboard.html">Orders</a><a href="fulfilment-dashboard.html">Fulfilment</a><a class="active" href="returns-dashboard.html">Returns</a><a href="finance-dashboard.html">Finance</a></nav></aside><section class="content"><div class="eyebrow">Returns</div><h1>Returns</h1><p class="intro">Review customer return requests and decide who pays return postage.</p><div id="message" class="small"></div><section class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 style="margin:0">Return requests</h2><button id="refresh" type="button">Refresh</button></div><div id="returns"><div class="empty">Loading…</div></div></section></section></main><script src="subscriber-auth.js?v=9"></script><script src="subscriber-tenant-context.js?v=5"></script><script src="returns-dashboard.js?v=8" defer></script></body></html>
