<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email confirmed — TradeFlow</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7f9;color:#17212b;margin:0;min-height:100vh;display:grid;place-items:center}
.card{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #d8dee5;border-radius:12px;padding:32px;box-sizing:border-box;text-align:center}
.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#dff1e5;color:#245f3b;font-weight:800;font-size:12px;text-transform:uppercase}
h1{margin:16px 0 10px;font-size:28px}.message{color:#596774;line-height:1.5}
.error{color:#9b2c2c}
a{display:inline-block;margin-top:18px;padding:11px 16px;border-radius:7px;background:#17212b;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main class="card">
<div id="badge" class="badge">Email confirmed</div>
<h1 id="heading">Your email address is confirmed</h1>
<p id="message" class="message">Your TradeFlow customer account email has been confirmed. You can now return to the Customer Portal and sign in.</p>
<a id="continue" href="customer-dashboard.html">Continue to Customer Portal</a>
</main>
<script>
(()=>{
 const params=new URLSearchParams(location.search);
 const tenantId=params.get('tenant_id');
 if(tenantId)document.getElementById('continue').href='customer-dashboard.html?tenant_id='+encodeURIComponent(tenantId);
 const hash=new URLSearchParams(location.hash.replace(/^#/,''));
 const error=hash.get('error_description')||hash.get('error');
 if(error){
   document.getElementById('badge').textContent='Confirmation problem';
   document.getElementById('badge').className='badge error';
   document.getElementById('heading').textContent='We could not confirm your email';
   document.getElementById('message').textContent=error+' Please request a new confirmation email and try again.';
 }
})();
</script>
</body>
</html>
