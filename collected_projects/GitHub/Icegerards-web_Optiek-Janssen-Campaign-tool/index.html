<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optiek Janssen Campaign Maker</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/i18n.js"></script>
<script src="js/i18n-nl.js"></script>
</head>
<body class="v-home">
<div id="loading">Loading fonts…</div>

<header class="topbar">
  <img id="brandLogo" class="brand" alt="Optiek Janssen" title="Home">
  <div class="vline"></div>
  <div class="proj">
    <input id="projName" class="projname" value="New campaign" title="Campaign name (used in export file names)" data-noi18n>
    <span class="savestate"><span id="syncDot" class="syncdot off"></span><span id="saveState">Saved in this browser</span></span>
  </div>
  <nav class="mainnav" aria-label="Main">
    <button data-view="home">Home</button>
    <button data-view="design">Design</button>
    <button data-view="planner">Planner <span id="plannerBadge" class="badge hidden"></span></button>
  </nav>
  <div class="spacer"></div>
  <div class="design-only">
    <button id="btnUndo" class="tb-icon ghost" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button id="btnRedo" class="tb-icon ghost" title="Redo (Ctrl+Y)" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>
  <button id="proSwitch" class="proswitch" role="switch" aria-checked="false" title="Pro mode shows layers and all detailed settings. Turn it off for a simpler screen.">
    <span class="lbl"><b>Pro mode</b><small id="proState">Off</small></span><span class="track" aria-hidden="true"></span>
  </button>
  <button id="btnTheme" class="tb-icon" title="Light / dark" aria-label="Switch light or dark">
    <svg class="i moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i sun hidden" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div class="popwrap">
    <button id="btnSettings" class="tb-icon" title="Settings and files" aria-label="Settings and files"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div id="settingsMenu" class="popover hidden">
      <h4>Files</h4>
      <button class="menu-btn" id="btnNew"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New campaign</button>
      <button class="menu-btn" id="btnOpen"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Open file…</button>
      <button class="menu-btn pro-only" id="btnTemplates"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Manage templates</button>
      <button class="menu-btn" id="btnSave"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Save as file</button>
      <hr>
      <h4>Share between computers</h4>
      <p class="hint">Choose a folder in OneDrive, Google Drive or Dropbox. Every computer that uses the same folder sees the same campaigns and planner.</p>
      <div id="sharedMenu"></div>
      <hr>
      <h4>Updates</h4>
      <div id="updateMenu"></div>
      <hr>
      <h4>Settings</h4>
      <label>Language
        <select id="setLang" data-noi18n><option value="nl">Nederlands</option><option value="en">English</option></select>
      </label>
      <label>Theme
        <select id="setTheme"><option value="light">Light</option><option value="dark">Dark</option></select>
      </label>
    </div>
  </div>
  <div class="popwrap design-only">
    <button id="btnExport" class="primary" style="height:40px;display:flex;align-items:center;gap:8px;padding:0 18px"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Export</button>
    <div id="exportMenu" class="popover hidden">
      <label>File type
        <select id="expType"><option value="png">PNG (best quality)</option><option value="jpeg">JPG (smaller file)</option></select>
      </label>
      <label>Size
        <select id="expScale"><option value="1">Normal (1×)</option><option value="2">Double (2×)</option><option value="0.5">Half (½×)</option></select>
      </label>
      <p id="expNote" class="hint" data-noi18n></p>
      <button id="btnExportOne" class="primary block">Export this page</button>
      <button id="btnExportAll" class="block">Export all pages</button>
      <label class="chk"><input type="checkbox" id="expCaption" checked> Also save the caption as a .txt file</label>
      <hr>
      <button id="btnExportVideo" class="block">Export as 6-second video (beta)</button>
      <button id="btnPreviewVideo" class="block ghost">Preview the animation</button>
    </div>
  </div>
  <svg class="wave" viewBox="0 0 1440 6" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gw" x1="0" x2="1"><stop offset="0" stop-color="#9A6A33"/><stop offset=".5" stop-color="#E0A458"/><stop offset="1" stop-color="#F3D29B"/></linearGradient></defs><path d="M0 4 C 360 0, 720 6, 1080 3 S 1440 1, 1440 2" stroke="url(#gw)" stroke-width="2" fill="none"/></svg>
</header>

<!-- Start screen -->
<div class="view" id="view-home"></div>

<!-- Design view -->
<div class="view hidden" id="view-design">
  <nav class="rail" aria-label="Tools">
    <button data-tool="templates" class="active"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Templates</button>
    <button data-tool="photos"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>Photos</button>
    <button data-tool="text"><svg class="i" viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>Text</button>
    <button data-tool="shapes"><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="9" r="5"/><path d="M3 20c4-4 8 2 18-6"/></svg>Shapes &amp; waves</button>
    <button data-tool="caption"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Caption</button>
    <button id="btnReelVideo" class="reel-only" title="Make the Reel video: clips, transitions, cards and music"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Video</button>
    <button data-tool="format"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="11" height="15" rx="1.5"/><path d="M19 8v13H9"/></svg>Size</button>
    <div class="railsep pro-only"></div>
    <button data-tool="layers" class="pro-only"><svg class="i" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Layers</button>
    <div class="spacer"></div>
    <button data-tool="help"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg>Help</button>
  </nav>
  <aside class="left">
    <div id="guide"></div>
    <div class="panelhead"><h2 id="panelTitle">Templates</h2></div>
    <div class="tabpane" id="tab-templates"></div>
    <div class="tabpane hidden" id="tab-photos"></div>
    <div class="tabpane hidden" id="tab-text"></div>
    <div class="tabpane hidden" id="tab-shapes"></div>
    <div class="tabpane hidden" id="tab-format"></div>
    <div class="tabpane hidden" id="tab-caption"></div>
    <div class="tabpane hidden" id="tab-layers"></div>
    <div class="tabpane hidden" id="tab-help"></div>
  </aside>
  <section class="center">
    <div class="viewbar">
      <button id="fmtChip" class="chipbtn" title="Change the size of this page"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="5" y="3" width="14" height="18" rx="2"/></svg><span id="sizeLbl"></span></button>
      <label class="chk pro-only"><input type="checkbox" id="showSafe"> Story safe zones</label>
      <div class="spacer"></div>
      <div class="zoomgrp">
        <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        <span id="zoomLbl">100%</span>
        <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoomFit" title="Fit to screen" style="font-size:13px;font-weight:600">Fit</button>
      </div>
    </div>
    <div id="stage"><div id="canvasWrap"><canvas id="cv"></canvas></div></div>
    <div id="pagesBar"></div>
  </section>
  <aside class="right" id="props"></aside>
</div>

<!-- Planner view -->
<div class="view hidden" id="view-planner"><div id="planner"></div></div>

<div id="toast"></div>
<input type="file" id="fileImg" accept="image/*,.heic,.heif" multiple hidden>
<input type="file" id="fileProj" accept=".ojcampaign,.json" hidden>

<script src="js/assets.js"></script>
<script src="js/templates.js"></script>
<script src="js/heic.js"></script>
<script src="js/captions.js"></script>
<script src="js/inbox.js"></script>
<script src="js/animate.js"></script>
<script src="js/reelvideo.js"></script>
<script src="js/app.js"></script>
<script src="js/planner.js"></script>
<script src="js/shared.js"></script>
<script src="js/update.js"></script>
</body>
</html>
