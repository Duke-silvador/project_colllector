<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Por Onde Alagoas - plataforma de consulta de dados integrada à API corporativa." />
    <title>Por Onde Alagoas</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="cabecalho">
      <h1>Por Onde Alagoas</h1>
      <p class="subtitulo">Consulta de dados</p>
    </header>

    <main class="conteudo">
      <section class="barra-acoes" aria-label="Ações">
        <button id="btn-atualizar" type="button">Atualizar</button>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </section>

      <section id="lista" class="lista" aria-label="Resultados"></section>

      <p id="mensagem" class="mensagem" hidden></p>
    </main>

    <footer class="rodape">
      <small>Ambiente de produção hospedado na Vercel</small>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
