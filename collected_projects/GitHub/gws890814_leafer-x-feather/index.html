<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="@cgon/leafer-x-feather 交互演示">
    <link rel="icon" href="/branding/logo-mark.svg" type="image/svg+xml">
    <title>Leafer Feather Demo</title>
  </head>
  <body>
    <div class="demo-shell">
      <aside class="controls" aria-label="羽化控制面板">
        <header class="package-header">
          <span class="package-mark"><img src="/branding/logo-mark.svg" alt=""></span>
          <div><strong>Leafer Feather</strong><small>@cgon/leafer-x-feather</small></div>
          <button id="enabled" class="switch on" type="button" role="switch" aria-label="启用羽化" aria-checked="true"><i></i></button>
        </header>

        <section class="control-section">
          <div class="section-title"><h2>羽化层</h2><button id="add-layer" type="button">+ 添加</button></div>
          <div id="layers" class="layers"></div>
        </section>

        <section class="control-section">
          <h2>预设</h2>
          <div class="presets" role="group" aria-label="羽化预设">
            <button type="button" data-radii="12">单层</button>
            <button type="button" data-radii="16,16,16">三层</button>
            <button type="button" data-radii="30,12,4">混合</button>
            <button type="button" data-radii="0">关闭</button>
          </div>
        </section>

        <section class="control-section code-section">
          <div class="section-title"><h2>Filter JSON</h2><span id="layer-count">1 层</span></div>
          <pre id="filter-json"></pre>
        </section>
      </aside>

      <main class="stage" aria-label="羽化效果预览">
        <header class="stage-header"><strong>原生 Leafer 节点</strong><span id="status">准备中</span></header>
        <div id="app"></div>
      </main>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
