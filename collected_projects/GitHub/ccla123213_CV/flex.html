<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .box{
            width: 200px;
            height: 200px;
            background-color: pink;
            border: 2px solid crimson;
            text-align: center;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>        
        <div class="box">6</div>        
        <div class="box">7</div>        
    </div>
</body>
</html>
