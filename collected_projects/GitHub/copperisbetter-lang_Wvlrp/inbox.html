<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Inbox • WVLRP</title><link rel="stylesheet" href="styles.css"><style>
:root{color-scheme:dark}body{margin:0;background:#030906;color:#eef5ef;font-family:Arial,sans-serif}.mail{max-width:1050px;margin:auto;padding:72px 12px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.top h1{font-size:22px;margin:0}.back{color:#e6cf8d;text-decoration:none;font-weight:900}.shell{display:grid;grid-template-columns:340px 1fr;min-height:68vh;border:1px solid #ffffff20;border-radius:18px;overflow:hidden;background:#07130e}.left{border-right:1px solid #ffffff18;background:#06100c}.tools{padding:12px;border-bottom:1px solid #ffffff16}.tools input,.compose input,.composer textarea{box-sizing:border-box;width:100%;border:1px solid #ffffff20;background:#020806;color:#fff;border-radius:10px;padding:11px}.btn{border:1px solid #ffffff20;background:#163725;color:#fff;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.new{width:100%;margin-bottom:8px;background:#5a4922;color:#ffe6a2}.list{max-height:64vh;overflow:auto}.conv{padding:12px;border-bottom:1px solid #ffffff10;cursor:pointer}.conv:hover,.conv.on{background:#10271b}.conv b{font-size:13px}.preview{font-size:11px;color:#a9bbb0;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread{float:right;background:#d7b75d;color:#151006;border-radius:999px;min-width:20px;text-align:center;padding:3px;font-size:10px;font-weight:1000}.right{display:flex;flex-direction:column;min-width:0}.threadhead{padding:13px;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;align-items:center}.thread{flex:1;min-height:420px;max-height:58vh;overflow:auto;padding:14px}.empty{color:#8fa197;text-align:center;margin-top:25%}.msg{max-width:76%;padding:10px 12px;border-radius:14px;margin:7px 0;background:#17241d;line-height:1.35;font-size:13px;white-space:pre-wrap;word-break:break-word}.msg.me{margin-left:auto;background:#254c35}.meta{font-size:9px;color:#8fa197;margin-top:5px}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #ffffff18}.composer textarea{resize:none;min-height:45px;max-height:110px}.composer .btn{width:90px}.compose{display:none;padding:12px;border-bottom:1px solid #ffffff18}.compose.open{display:block}.members{max-height:210px;overflow:auto;margin-top:6px}.member{padding:9px;border:1px solid #ffffff12;border-radius:9px;margin:5px 0;cursor:pointer;background:#0b1c13}.notice{font-size:11px;color:#d6c27f;padding:8px 12px}.block{background:#3b211e;font-size:9px;padding:7px}.hidden{display:none!important}@media(max-width:720px){.mail{padding-top:62px}.shell{grid-template-columns:1fr}.left{border-right:0}.right{display:none}.shell.thread-open .left{display:none}.shell.thread-open .right{display:flex}.thread{min-height:55vh}.msg{max-width:86%}}
</style></head><body><main class="mail"><div class="top"><h1>✉ WVLRP Member Inbox <span id="total"></span></h1><a class="back" href="index.html">← HOME</a></div><div id="loginNote" class="notice">Sign in with your WVLRP account to use your private inbox.</div><section class="shell" id="shell"><aside class="left"><div class="tools"><button class="btn new" id="newBtn">＋ NEW MESSAGE</button><input id="filter" placeholder="Filter conversations"></div><div class="compose" id="compose"><input id="memberSearch" placeholder="Search members"><div class="members" id="members"></div></div><div class="list" id="convs"></div></aside><section class="right"><div class="threadhead"><div><button class="btn hidden" id="mobileBack">←</button> <b id="who">Select a conversation</b></div><button class="btn block hidden" id="blockBtn">BLOCK</button></div><div class="thread" id="thread"><div class="empty">Choose a member or start a new message.</div></div><div class="composer hidden" id="composer"><textarea id="body" maxlength="2000" placeholder="Write a private message…"></textarea><button class="btn" id="send">SEND</button></div></section></section></main><script src="site-auth.js"></script><script>
(()=>{const API='https://wvlrp-chat-production.up.railway.app',key='wvlrpChatToken';let me=null,active=null,blocked=false,conversations=[];const $=s=>document.querySelector(s),esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hdr=()=>({'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem(key)});async function req(p,o={}){const r=await fetch(API+p,o);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.detail||'Request failed');return j}function time(v){return new Date(v).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
async function boot(){if(!localStorage.getItem(key))return;try{me=await req('/api/me',{headers:hdr()});$('#loginNote').textContent='Private messages are visible only to the two members in the conversation.';await loadInbox()}catch(e){$('#loginNote').textContent='Please sign in to use your inbox.'}}
async function loadInbox(){const j=await req('/api/inbox',{headers:hdr()});conversations=j.conversations||[];$('#total').textContent=j.unread?`(${j.unread} unread)`:'';renderConvs()}
function renderConvs(){const q=$('#filter').value.toLowerCase();$('#convs').innerHTML=conversations.filter(x=>x.username.toLowerCase().includes(q)).map(x=>`<div class="conv ${active==x.other_id?'on':''}" data-id="${x.other_id}">${+x.unread?`<span class="unread">${x.unread}</span>`:''}<b>${esc(x.username)}</b><div class="preview">${esc(x.body)}</div><div class="meta">${time(x.created_at)}</div></div>`).join('')||'<div class="notice">No conversations yet.</div>';document.querySelectorAll('.conv').forEach(x=>x.onclick=()=>openThread(+x.dataset.id))}
async function openThread(id){active=id;const j=await req('/api/inbox/thread/'+id,{headers:hdr()});blocked=j.blocked||j.blocked_me;$('#who').textContent=j.member.username;$('#blockBtn').classList.remove('hidden');$('#blockBtn').textContent=j.blocked?'UNBLOCK':'BLOCK';$('#composer').classList.toggle('hidden',blocked);$('#thread').innerHTML=(j.messages||[]).map(m=>`<div class="msg ${m.sender_id==me.id?'me':''}" data-mid="${m.id}">${esc(m.body)}<div class="meta">${time(m.created_at)}${m.sender_id==me.id&&m.read_at?' • Read':''}</div></div>`).join('')||'<div class="empty">No messages yet. Say hello.</div>';$('#thread').scrollTop=$('#thread').scrollHeight;$('#shell').classList.add('thread-open');$('#mobileBack').classList.remove('hidden');$('#compose').classList.remove('open');await loadInbox()}
$('#send').onclick=async()=>{const body=$('#body').value.trim();if(!body||!active)return;$('#send').disabled=true;try{await req('/api/inbox/send',{method:'POST',headers:hdr(),body:JSON.stringify({recipient_id:active,body})});$('#body').value='';await openThread(active)}catch(e){alert(e.message)}finally{$('#send').disabled=false}};
$('#newBtn').onclick=()=>{$('#compose').classList.toggle('open');$('#memberSearch').focus();searchMembers()};let st;$('#memberSearch').oninput=()=>{clearTimeout(st);st=setTimeout(searchMembers,220)};async function searchMembers(){if(!me)return;try{const j=await req('/api/members?q='+encodeURIComponent($('#memberSearch').value),{headers:hdr()});$('#members').innerHTML=j.members.map(m=>`<div class="member" data-id="${m.id}"><b>${esc(m.username)}</b><div class="meta">${esc(m.support_level||'member')}</div></div>`).join('');document.querySelectorAll('.member').forEach(x=>x.onclick=()=>openThread(+x.dataset.id))}catch(e){}}
$('#blockBtn').onclick=async()=>{if(!active)return;const isUnblock=$('#blockBtn').textContent==='UNBLOCK';if(!isUnblock&&!confirm('Block this member from privately messaging you?'))return;await req('/api/inbox/'+(isUnblock?'unblock':'block'),{method:'POST',headers:hdr(),body:JSON.stringify({user_id:active})});await openThread(active)};$('#filter').oninput=renderConvs;$('#mobileBack').onclick=()=>$('#shell').classList.remove('thread-open');$('#body').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click()}};window.addEventListener('wvlrp-auth-change',()=>setTimeout(()=>location.reload(),100));boot();setInterval(()=>{if(me)loadInbox().catch(()=>{})},20000)})();
</script><script src="site-analytics.js?v=20260916-1"></script></body></html>
