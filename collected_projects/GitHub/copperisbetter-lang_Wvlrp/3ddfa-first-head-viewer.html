<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3DDFA First Head Viewer</title>
<style>body{margin:0;background:#101820;color:white;font:16px system-ui}header{padding:14px}model-viewer{display:block;width:100%;height:72vh;background:#263442}a{color:#9ed7ff}small{color:#ccc}</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script></head>
<body><header><h2>First 3DDFA Head — Sample Test</h2><p>This is the public sample face, not Laura. Drag to rotate, pinch to zoom.</p></header>
<model-viewer id="head" src="./world-creator/3ddfa-sample-0.glb" camera-controls auto-rotate shadow-intensity="1" interaction-prompt="auto" alt="3DDFA reconstructed sample head"></model-viewer>
<header><p id="status">Checking model availability…</p><small>The GLB must be published at <code>world-creator/3ddfa-sample-0.glb</code> before this viewer can display it. A successful GitHub Actions artifact alone does not publish it.</small></header>
<script>const m=document.querySelector('#head'),s=document.querySelector('#status');m.addEventListener('load',()=>s.textContent='3D model loaded successfully.');m.addEventListener('error',()=>s.textContent='GLB not published yet — viewer is ready but the model file is missing.');</script>
</body></html>
