<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Notes | WVLRP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07110c;color:#edf5ef;font-family:Arial,sans-serif;min-height:100vh}.wrap{width:min(900px,94vw);margin:auto;padding:28px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.back{color:#b8d8c2;text-decoration:none;font-weight:800}.title{font-size:clamp(25px,6vw,42px);margin:8px 0}.sub{color:#9eb2a5;font-size:13px;line-height:1.5}.card{background:#0c1d14;border:1px solid #ffffff18;border-radius:18px;padding:16px;box-shadow:0 18px 55px #0007}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:180px;background:#051009;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:11px}.btn{border:1px solid #ffffff22;border-radius:10px;background:#183b29;color:#fff;padding:10px 13px;font-weight:900;cursor:pointer}.btn.danger{background:#3b1b1b}.notes{display:grid;gap:10px;margin-top:14px}.note{border:1px solid #ffffff15;background:#07130d;border-radius:14px;padding:12px}.note input{width:100%;border:0;border-bottom:1px solid #ffffff16;background:transparent;color:#fff;font-size:15px;font-weight:900;padding:5px 3px 9px;outline:none}.note textarea{width:100%;min-height:130px;resize:vertical;border:0;background:transparent;color:#dce9df;padding:10px 3px;outline:none;font:14px/1.5 Arial}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#71877a;font-size:10px}.empty{text-align:center;padding:36px;color:#81958a}.status{font-size:11px;color:#8fb49b}.locked{padding:45px 15px;text-align:center}.locked a{color:#d7b968}.hide{display:none}
</style>
</head>
<body><div class="wrap"><div class="top"><a class="back" href="index.html">← WVLRP</a><span class="status" id="status">Private member notebook</span></div><h1 class="title">My Notes</h1><p class="sub">Your personal WVLRP field notebook. Notes stay on this device and are kept separate for each signed-in WVLRP member.</p><div class="card"><div id="locked" class="locked hide">Sign in to your WVLRP account first, then return to your notes.<br><br><a href="index.html">Go to WVLRP</a></div><div id="app" class="hide"><div class="toolbar"><input id="search" placeholder="Search my notes…"><button class="btn" id="add">+ NEW NOTE</button></div><div class="notes" id="notes"></div></div></div></div>
<script src="site-auth.js"></script>
<script>
(()=>{let user=null,items=[],timer;const $=s=>document.querySelector(s),notes=$('#notes'),status=$('#status');
function key(){return 'wvlrpNotes:'+user.id}function load(){try{items=JSON.parse(localStorage.getItem(key())||'[]')}catch{items=[]}render()}
function save(){localStorage.setItem(key(),JSON.stringify(items));status.textContent='Saved on this device';clearTimeout(timer);timer=setTimeout(()=>status.textContent='Private member notebook',1400)}
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('#search').value.trim().toLowerCase(),show=items.filter(n=>!q||(n.title+' '+n.body).toLowerCase().includes(q));if(!show.length){notes.innerHTML='<div class="empty">'+(items.length?'No matching notes.':'No notes yet. Tap NEW NOTE to start your field notebook.')+'</div>';return}notes.innerHTML=show.map(n=>`<div class="note" data-id="${n.id}"><input class="nt" maxlength="100" value="${esc(n.title)}" placeholder="Note title"><textarea class="nb" maxlength="10000" placeholder="Write your note…">${esc(n.body)}</textarea><div class="meta"><span>Updated ${new Date(n.updated).toLocaleString()}</span><button class="btn danger del">DELETE</button></div></div>`).join('');notes.querySelectorAll('.note').forEach(el=>{const n=items.find(x=>x.id===el.dataset.id);el.querySelector('.nt').oninput=e=>{n.title=e.target.value;n.updated=Date.now();save()};el.querySelector('.nb').oninput=e=>{n.body=e.target.value;n.updated=Date.now();save()};el.querySelector('.del').onclick=()=>{if(confirm('Delete this note?')){items=items.filter(x=>x.id!==n.id);save();render()}}})}
function start(u){user=u;$('#locked').classList.add('hide');$('#app').classList.remove('hide');load()}
$('#add').onclick=()=>{const n={id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString()),title:'',body:'',updated:Date.now()};items.unshift(n);save();render();notes.querySelector('.nt')?.focus()};$('#search').oninput=render;
function check(){const a=window.WVLRP_AUTH,u=a?.getUser();if(u)return start(u);setTimeout(()=>{const u2=window.WVLRP_AUTH?.getUser();if(u2)start(u2);else{$('#locked').classList.remove('hide');$('#app').classList.add('hide')}},800)}
window.addEventListener('wvlrp-auth-change',e=>e.detail?start(e.detail):location.reload());check()})();
</script><script src="site-analytics.js?v=20260916-1"></script></body></html>
