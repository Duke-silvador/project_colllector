<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15251b">
<title>West Hills — WVLRP</title>
<link rel="stylesheet" href="ranger-station.css?v=5">
<style>
body{background:#16251b}
#hint{bottom:76px}
.tools{bottom:max(14px,env(safe-area-inset-bottom))}
#trailNotice{max-width:420px}
#trailNotice::backdrop{background:#07120ac9}
#trailNotice p{font-size:17px}
@media(max-width:600px){header small{font-size:10px}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Explore the West Hills forest in 360 degrees. There are four separate paths in the woods, with natural wooden signs for Ranger Station to the left, West Hills straight ahead, and Stacey Lake to the right. Drag to look around or pinch to zoom."></canvas>
<header><div><strong>WVLRP</strong><small>West Virginia Live Research Project</small></div>
<button id="menuButton" aria-expanded="false" aria-controls="menu" type="button">☰ MENU</button>
<nav id="menu" class="menu" hidden aria-label="West Hills menu">
<a href="community.html?v=20261007-community-arrival">Community clearing</a>
<a href="woodland-trail.html">Woodland Trail</a>
<a href="adventures.html">Base Camp</a>
</nav></header>
<div id="sceneMessage">Opening West Hills…</div>
<div id="hint">Drag to look around · Find the Woodland sign to return</div>
<div class="tools" aria-label="West Hills controls">
<button id="back" type="button">Back to Woodland Trail</button>
<button id="faceFork" type="button">Face the crossroads</button>
<button id="zoomOut" type="button" aria-label="Zoom out">−</button>
<button id="zoomIn" type="button" aria-label="Zoom in">+</button>
</div>
<dialog id="trailNotice">
<button type="button" class="close" aria-label="Close notice" onclick="this.closest('dialog').close()">×</button>
<h2 id="noticeTitle">Trail ahead</h2><p id="noticeText"></p>
<button type="button" onclick="this.closest('dialog').close()">Continue exploring</button>
</dialog>
<script src="trail-transitions.js?v=20261006-1"></script>
<script>
// The natural wooden signs are ALREADY PART OF the approved panorama.
// Invisible hit areas follow the photographed signs and preserve trail transitions.
window.RANGER_SCENE={
  image:'assets/west-hills-woodland-return.webp?v=20261007-return-fixed',
  startU:.507,pitch:.1,
  spots:[
    {label:'Ranger Station — follow the left trail',u:.246,v:.434,width:.100,height:.060,url:'community.html?v=20261007-community-arrival'},
    {label:'Woodland — return along the trail',u:.054,v:.449,width:.076,height:.053,url:'woodland-trail.html'},
    {label:'West Hills — follow the center trail',u:.510,v:.387,width:.077,height:.088,id:'west-hills-ahead'},
    {label:'Stacey Lake — follow the right trail',u:.743,v:.427,width:.083,height:.080,url:'stacey-lake.html'}
  ]
};
window.rangerOpen=id=>{
  const dlg=document.getElementById('trailNotice');
  document.getElementById('noticeTitle').textContent=id==='stacey-lake'?'Stacey Lake':'West Hills trail';
  document.getElementById('noticeText').textContent=id==='stacey-lake'
    ?'The right-hand trail toward Stacey Lake has been marked. The next scene is coming later.'
    :'The West Hills path continues into the woods ahead. The next scene is coming later.';
  dlg.showModal?.();
};
const menuButton=document.getElementById('menuButton'),menu=document.getElementById('menu');
menuButton.onclick=()=>{menu.hidden=!menu.hidden;menuButton.setAttribute('aria-expanded',String(!menu.hidden))};
document.getElementById('back').onclick=()=>{if(window.rangerTravel)window.rangerTravel('woodland-trail.html',.46,.5);else location.assign('woodland-trail.html')};
document.getElementById('faceFork').onclick=()=>window.rangerFace?.(.507,.42);
document.getElementById('zoomOut').onclick=()=>window.rangerZoom?.(.13);
document.getElementById('zoomIn').onclick=()=>window.rangerZoom?.(-.13);
setTimeout(()=>{document.getElementById('hint').style.opacity='0'},8500);
</script>
<script src="ranger-scene.js?v=20261007-approved-speed"></script>
<script src="site-auth.js?v=20260916-menu2"></script>
<script src="site-analytics.js?v=20260916-1"></script>
</body></html>
