<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3DDFA Build 11 — Face Inspection</title>
<style>body{margin:0;background:#111923;color:#f5f7fb;font:16px system-ui}header{padding:14px}h2{font-size:19px;margin:0 0 5px}#stage{width:100%;height:72dvh;background:#253140}#status{padding:12px;font-size:14px}button{background:#34465a;color:white;border:1px solid #69809a;border-radius:9px;padding:11px;margin:4px}button:focus{background:#42698d}small{color:#c4ced8}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
</head><body><header><h2>3DDFA Build 11 — Face Inspection</h2><small>Original Build 10 preserved. Drag to rotate • pinch to zoom.</small></header>
<div id="stage"></div><div style="padding:6px 10px"><button id="all">All heads</button><button id="left">Left head</button><button id="middle">Middle head</button><button id="right">Right head</button><button id="reset">Reset view</button></div><div id="status">Loading original reconstruction…</div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color('#253140');const camera=new THREE.PerspectiveCamera(40,1,.001,10000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.localClippingEnabled=true;stage.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,8);scene.add(light);
let model,bounds,cutPlanes=[];const fit=(box)=>{const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());const radius=Math.max(size.length()*.65,.001);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(0,0,radius*2.7));camera.near=Math.max(radius/1000,.00001);camera.far=radius*1000;camera.updateProjectionMatrix();controls.update();};
function select(which){if(!model)return;const min=bounds.min.x,max=bounds.max.x,span=max-min;let lo=min,hi=max;if(which==='left')hi=min+span*.46;if(which==='middle'){lo=min+span*.46;hi=min+span*.73}if(which==='right')lo=min+span*.73;
const planes=which==='all'?[]:[new THREE.Plane(new THREE.Vector3(1,0,0),-lo),new THREE.Plane(new THREE.Vector3(-1,0,0),hi)];
model.traverse(o=>{if(o.isMesh){const materials=Array.isArray(o.material)?o.material:[o.material];for(const m of materials){m.clippingPlanes=planes;m.clipShadows=true;m.needsUpdate=true;}}});
const box=new THREE.Box3(new THREE.Vector3(lo,bounds.min.y,bounds.min.z),new THREE.Vector3(hi,bounds.max.y,bounds.max.z));fit(box);status.textContent=which==='all'?'Showing original three-head sample.':'Inspecting '+which+' region. This is a crop of the sample, not a repaired or Laura-morphed head.';}
const url='world-creator/assets/3ddfa-build10.glb';new GLTFLoader().load(url,g=>{model=g.scene;scene.add(model);bounds=new THREE.Box3().setFromObject(model);fit(bounds);status.textContent='Sample loaded. Choose a head to inspect. Build 10 remains unchanged.';},undefined,e=>status.textContent='Model failed to load: '+e.message);
for(const n of ['all','left','middle','right'])document.getElementById(n).onclick=()=>select(n);document.getElementById('reset').onclick=()=>select('all');
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
