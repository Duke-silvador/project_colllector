<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110d"><title>WVLRP Admin</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#020906;color:#fff}body{background:radial-gradient(circle at 50% -10%,#302414,#0b140d 38%,#020906 75%) fixed}a{color:inherit;text-decoration:none}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#07100dec;border-bottom:1px solid #ffffff20}.top a{font-weight:900}.top strong{font-size:10px;letter-spacing:.18em;color:#efcf82}.gate{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:20px}.card{width:min(94vw,880px);padding:18px;border:1px solid #ffffff22;border-radius:20px;background:#07120eeb;box-shadow:0 24px 70px #0009}.gate .card{max-width:520px;text-align:center}.gate h1{font:900 36px Georgia,serif;margin:5px 0}.gate p{color:#aebdb4;line-height:1.5}.admin{display:none;max-width:1050px;margin:auto;padding:24px 14px 70px}.admin.show{display:block}.hero{text-align:center;margin-bottom:18px}.hero small{font-weight:900;letter-spacing:.2em;color:#e2c775}.hero h1{font:900 clamp(34px,7vw,56px) Georgia,serif;margin:7px 0}.hero p{color:#aebdb4}.settings{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.field label{display:block;font-size:10px;color:#aab9b0;font-weight:900;letter-spacing:.08em;margin:0 0 5px}.field input,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff20;background:#020806;color:#fff}.btn{padding:11px 14px;border-radius:10px;border:1px solid #ffffff1d;background:#644b20;color:#fff;font-weight:900;cursor:pointer}.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 9px}.section-title h2{margin:0;font:900 25px Georgia,serif}.users{display:grid;gap:8px}.user{display:grid;grid-template-columns:1.2fr .8fr .8fr auto;gap:8px;align-items:center;padding:11px;border-radius:14px;background:#ffffff06;border:1px solid #ffffff11}.who b{display:block}.who small{display:block;margin-top:4px;color:#899a90}.amount{display:flex;align-items:center;gap:5px}.amount span{font-weight:900;color:#d8c37c}.amount input{min-width:0}.msg{min-height:18px;margin-top:9px;font-size:11px;color:#c4d1c9}.search{display:flex;gap:7px}.search input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid #ffffff20;background:#020806;color:#fff}.search button{padding:0 13px;border-radius:10px;border:1px solid #ffffff20;background:#193a28;color:#fff;font-weight:900}@media(max-width:720px){.settings{grid-template-columns:1fr}.user{grid-template-columns:1fr}.btn{min-height:42px}.search{margin-top:8px}}
</style></head><body><header class="top"><a href="index.html">← WVLRP Home</a><strong>ADMIN CONTROL</strong></header><section class="gate" id="gate"><div class="card"><div style="color:#e2c775;font-weight:900">WVLRP ADMIN</div><h1 id="gateTitle">Checking access…</h1><p id="gateText">Administrator login required.</p></div></section><main class="admin" id="admin"><header class="hero"><small>WVLRP CONTROL PANEL</small><h1>Accounts & Supporters</h1><p>Manage donor and sponsor access without giving anyone administrative control.</p></header><section class="card"><div class="settings"><div class="field"><label>SPONSOR PTZ MINIMUM (USD)</label><input id="threshold" type="number" min="0" step="1" placeholder="Example: 100"></div><button class="btn" id="saveThreshold">SAVE PTZ THRESHOLD</button></div><div class="msg" id="settingsMsg"></div></section><div class="section-title"><h2>WVLRP Accounts</h2><div class="search"><input id="search" placeholder="Search username"><button id="searchBtn">SEARCH</button></div></div><section class="users" id="users"></section><div class="msg" id="userMsg"></div></main><script src="site-auth.js?v=20260915-2"></script><script>
(()=>{const API='https://wvlrp-chat-production.up.railway.app',KEY='wvlrpChatToken',gate=document.getElementById('gate'),admin=document.getElementById('admin'),gt=document.getElementById('gateTitle'),gx=document.getElementById('gateText'),users=document.getElementById('users'),threshold=document.getElementById('threshold'),settingsMsg=document.getElementById('settingsMsg'),userMsg=document.getElementById('userMsg'),search=document.getElementById('search');const token=()=>localStorage.getItem(KEY)||'',headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token()}),safe=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,opt={}){const r=await fetch(API+path,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.detail||'Request failed');return j}async function gateCheck(){if(!token()){gt.textContent='Sign in required';gx.textContent='Sign in with the WVLRP administrator account.';return}try{const me=await req('/api/me',{headers:headers()});if(me.role!=='admin')throw new Error('Administrator access required');gate.style.display='none';admin.classList.add('show');loadSettings();loadUsers()}catch(e){gt.textContent='Admin access required';gx.textContent=e.message}}async function loadSettings(){try{const j=await req('/api/admin/settings',{headers:headers()});threshold.value=j.ptz_sponsor_min_cents==null?'':Math.round(j.ptz_sponsor_min_cents/100)}catch(e){settingsMsg.textContent=e.message}}document.getElementById('saveThreshold').onclick=async()=>{const val=threshold.value.trim();settingsMsg.textContent='';try{await req('/api/admin/settings/ptz-threshold',{method:'POST',headers:headers(),body:JSON.stringify({ptz_sponsor_min_cents:val===''?null:Math.round(Number(val)*100)})});settingsMsg.textContent=val===''?'PTZ sponsor threshold disabled.':'PTZ access threshold set to $'+Number(val).toFixed(0)+'.';loadUsers()}catch(e){settingsMsg.textContent=e.message}};async function loadUsers(){userMsg.textContent='';try{const q=search.value.trim();const j=await req('/api/admin/users'+(q?'?q='+encodeURIComponent(q):''),{headers:headers()});users.innerHTML='';(j.users||[]).forEach(u=>{const row=document.createElement('div');row.className='user';row.innerHTML=`<div class="who"><b>${safe(u.username)}${u.role==='admin'?' • ADMIN':''}</b><small>Account #${u.id}</small></div><div class="field"><label>SUPPORT STATUS</label><select data-level><option value="none">Member</option><option value="donor">Donor</option><option value="sponsor">Sponsor</option></select></div><div class="field"><label>SUPPORT AMOUNT</label><div class="amount"><span>$</span><input data-amount type="number" min="0" step="0.01"></div></div><button class="btn" data-save>SAVE</button>`;const level=row.querySelector('[data-level]'),amount=row.querySelector('[data-amount]');level.value=u.support_level||'none';amount.value=((u.support_amount_cents||0)/100).toFixed(2);row.querySelector('[data-save]').onclick=async()=>{try{await req('/api/admin/support',{method:'POST',headers:headers(),body:JSON.stringify({user_id:u.id,support_level:level.value,support_amount_cents:Math.max(0,Math.round(Number(amount.value||0)*100))})});userMsg.textContent=u.username+' updated.'}catch(e){userMsg.textContent=e.message}};users.appendChild(row)})}catch(e){userMsg.textContent=e.message}}document.getElementById('searchBtn').onclick=loadUsers;search.addEventListener('keydown',e=>{if(e.key==='Enter')loadUsers()});window.addEventListener('wvlrp-auth-change',()=>location.reload());gateCheck()})();
</script><script src="site-analytics.js?v=20260916-1"></script></body></html>
