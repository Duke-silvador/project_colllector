<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vulva2 Standalone Skin Test</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>body{margin:0;background:#101820;color:#fff;font:16px system-ui}header,#status{padding:12px}model-viewer{width:100%;height:78vh;background:#34404a}</style></head><body><header><b>Vulva2 — standalone skin experiment</b><div>CAR3.5A-style material test. No CAR3 installation. Drag to rotate and pinch to zoom.</div></header><model-viewer id="m" camera-controls exposure="1" shadow-intensity="1" alt="Standalone Vulva2 skin test"></model-viewer><div id="status">Checking preview build…</div><script>const url='https://raw.githubusercontent.com/copperisbetter-lang/Wvlrp/main/world-creator/assets/vulva2-standalone-skin-preview.glb?v='+Date.now();const m=document.querySelector('#m'),s=document.querySelector('#status');fetch(url,{method:'HEAD',cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Preview not published yet ('+r.status+')');m.src=url;s.textContent='Loading preview…'}).catch(e=>s.textContent=e.message);m.addEventListener('load',()=>s.textContent='Standalone preview loaded. Inspect skin tone before approving integration.');m.addEventListener('error',()=>s.textContent='Preview model failed to load');</script></body></html>
