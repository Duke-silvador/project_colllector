<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR 3.5A — Skin Attachment Test</title><style>body{margin:0;background:#101820;color:white;font:16px system-ui}header{padding:12px 16px}model-viewer{width:100%;height:75vh;background:#28313b}#status{padding:12px;color:#ffe7aa}</style><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><header><b>CAR 3.5A — Vulva 1 standalone material test</b><div>Separate preview; original CAR 3 unchanged. Rotate and zoom to inspect.</div></header><model-viewer id="model" camera-controls auto-rotate shadow-intensity="1" exposure="1" interaction-prompt="auto" alt="CAR 3.5A skin material preview"></model-viewer><div id="status">Checking published test asset…</div><script>const p='world-creator/assets/car3-skin-attachment-preview.glb';const u='https://raw.githubusercontent.com/copperisbetter-lang/Wvlrp/main/'+p+'?v='+Date.now();fetch(u,{method:'HEAD',cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Preview build has not published yet ('+r.status+').');document.querySelector('#model').src=u;document.querySelector('#status').textContent='Loading CAR 3.5A test geometry…';}).catch(e=>document.querySelector('#status').textContent=e.message+' Check GitHub Actions: CAR 3.5 isolated skin experiments.');document.querySelector('#model').addEventListener('load',()=>document.querySelector('#status').textContent='CAR 3.5A test geometry loaded.');document.querySelector('#model').addEventListener('error',()=>document.querySelector('#status').textContent='Model failed to load; verify GLB export.');</script></html>
