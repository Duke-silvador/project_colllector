<script>try { const t = localStorage.getItem("snuvt-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* 레이아웃: 위에는 오늘·요일, 아래는 프로그램 블록을 빈칸 없이 쌓는다 (다단 배치) */
:root {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb; --ink: #142039; --muted: #5b667c; --line: #dde2eb;
  --blue: #173f8f; --blue-soft: #e3ebfa; --yellow: #f2c230; --on-yellow: #2a1f00; --yellow-soft: #fbf1cc;
  --good: #1f7a4d; --warn: #9a5500; --warn-soft: #fbecd6; --crit: #b42318; --crit-soft: #fbe2df;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --brand: #173f8f; --seg-track: #e8ecf3; --seg-thumb: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1322; --surface: #151d31; --surface-2: #1b2540; --ink: #e7ecf6; --muted: #9ba6bd; --line: #2a3553;
    --blue: #8fb0ff; --blue-soft: #1d2b52; --yellow: #f2c230; --on-yellow: #2a1f00; --yellow-soft: #3a3115;
    --good: #5fd09a; --warn: #f0b05a; --warn-soft: #3b2a12; --crit: #ff8a7d; --crit-soft: #3d1c1a;
    --brand: #2f5fd0; --seg-track: #1b2540; --seg-thumb: #2c3a5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #2f5fd0; --seg-track: #1b2540; --seg-thumb: #2c3a5e;
  --bg: #0d1322; --surface: #151d31; --surface-2: #1b2540; --ink: #e7ecf6; --muted: #9ba6bd; --line: #2a3553;
  --blue: #8fb0ff; --blue-soft: #1d2b52; --yellow: #f2c230; --on-yellow: #2a1f00; --yellow-soft: #3a3115;
  --good: #5fd09a; --warn: #f0b05a; --warn-soft: #3b2a12; --crit: #ff8a7d; --crit-soft: #3d1c1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* 상단 */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px 10px; min-width: 0; flex-wrap: wrap; }
.logo { height: 38px; width: auto; flex: none; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-light { display: none; } :root:not([data-theme="light"]) .logo-dark { display: block; } }
:root[data-theme="dark"] .logo-light { display: none; } :root[data-theme="dark"] .logo-dark { display: block; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; line-height: 1.1; }
.brand h1 b, .auth-hero h2 b { color: var(--blue); font-weight: 400; }
.brand .today { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dday { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.dday:empty { display: none; }
.when { display: inline-flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.home-link { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; min-width: 0; padding: 3px 8px 3px 4px; margin-left: -4px; border-radius: 12px; -webkit-tap-highlight-color: transparent; transition: background-color .15s, transform .12s; }
.home-link:hover { background: var(--surface-2); }
.home-link:active { background: var(--surface-2); transform: scale(.97); }
.home-link img, .home-link h1 { pointer-events: none; }
.dday strong { font-family: var(--f-data); font-size: 14px; background: var(--yellow); color: var(--on-yellow); padding: 1px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
/* 섹션 안 탭: 흰 칸이 미끄러지는 세그먼트 */
nav.tabs { display: flex; align-items: center; gap: 10px; padding: 2px 0 10px; }
.tab-title { flex: none; font-weight: 800; font-size: 15px; }
.seg { position: relative; display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--seg-track); overflow-x: auto; scrollbar-width: none; max-width: 100%; isolation: isolate; }
.seg::-webkit-scrollbar { display: none; }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 0; z-index: 0; border-radius: 9px; background: var(--seg-thumb); box-shadow: 0 1px 2px rgba(15, 23, 42, .12), 0 2px 6px rgba(15, 23, 42, .06); transition: transform .24s cubic-bezier(.2, .8, .2, 1), width .24s cubic-bezier(.2, .8, .2, 1); }
.seg-tab { position: relative; z-index: 1; flex: none; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); padding: 6px 14px; border-radius: 9px; cursor: pointer; transition: color .18s, transform .12s; }
.seg-tab.on { color: var(--ink); font-weight: 800; }
@media (max-width: 759px) { .seg { flex: 1; } .seg-tab { flex: 1 0 auto; padding: 7px 10px; } }
/* 메뉴 탭 (휴대폰은 아래, 넓은 화면은 위) */
.tabbar { display: flex; gap: 4px; padding: 0 0 8px; }
.bt { font: inherit; border: 0; background: none; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; cursor: pointer; transition: background-color .18s, color .18s, transform .12s; }
.bt .bi { position: relative; display: inline-grid; place-items: center; }
.bt svg { width: 18px; height: 18px; }
.bt.on { background: var(--blue-soft); color: var(--blue); }
.bt .dot { position: absolute; top: -2px; right: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); }
@media (max-width: 759px) {
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
  .bt { flex-direction: column; gap: 2px; padding: 4px 0; font-size: 10.5px; border-radius: 10px; }
  .bt.on { background: none; }
  .bt svg { width: 22px; height: 22px; opacity: .6; }
  .bt.on svg { opacity: 1; }
  .bt.center .bi { width: 52px; height: 52px; margin-top: -24px; border-radius: 50%; background: var(--brand); color: #fff; border: 4px solid var(--bg); box-shadow: 0 4px 12px rgba(23, 63, 143, .28); }
  .bt.center svg { opacity: 1; }
  body.has-bar main { padding-bottom: 96px; }
  body.has-bar .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .right .who { display: none; }
}
/* 화면 넘어갈 때 */
@keyframes fade-in { from { opacity: 0; } }
@keyframes sheet-up { from { transform: translateY(32px); opacity: .5; } }
.sheet-bg:not([hidden]) { animation: fade-in .18s ease-out; }
.sheet-bg:not([hidden]) .sheet { animation: sheet-up .26s cubic-bezier(.2, .8, .2, 1); }
.btn, .tile-btn, .menu-item, .chip.entry { transition: background-color .18s, color .18s, border-color .18s, transform .12s; }
.btn:active, .tile-btn:active, .bt:active, .seg-tab:active, .menu-item:active { transform: scale(.97); }
:root[data-theme-transition] *, :root[data-theme-transition] *::before, :root[data-theme-transition] *::after { transition: background-color .25s, border-color .25s, color .25s !important; }
.menu { display: grid; }
.menu h3 { margin-bottom: 4px; }
.menu-item { font: inherit; color: var(--ink); background: none; border: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 12px 2px; text-align: left; cursor: pointer; font-weight: 600; }
.menu-item .small { text-align: right; }
.menu-item .go { color: var(--muted); font-size: 20px; line-height: 1; }
.ev-list { list-style: none; margin: 0; padding: 0; display: grid; }
.ev-list li { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.ev-list li:first-child { border-top: 0; }
.ev-list li.past { opacity: .55; }
.ev-list .num { font-size: 13px; padding-top: 2px; }
.ev-main { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
.ev-main .small { flex-basis: 100%; }
.btn.add { font-size: 13px; padding: 5px 12px; border-radius: 999px; }
.sec-head h3 { margin: 0; }
/* 공통 */
main { padding-block: 16px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
main > *, .sec > *, details > * { min-width: 0; }
details.members { min-width: 0; display: block; }
.members > p, .members > .tw { margin-top: 6px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; line-height: 1.2; text-wrap: balance; }
/* Do Hyeon 은 한글 2,437자만 있어서 이름처럼 바뀌는 글자는 본문 글꼴(전체 11,172자)로 */
h2.dyn { font-family: var(--f-body); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
h3 { font-size: 15px; margin: 0; font-weight: 700; }
h4 { margin: 0; }
p { margin: 0; }
.lede { color: var(--muted); margin-top: 2px; max-width: 68ch; font-size: 14px; }
.sec { display: grid; gap: 8px; min-width: 0; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.row.center { justify-content: center; }
.row.nowrap { flex-wrap: nowrap; }
.empty-line { color: var(--muted); font-size: 13.5px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--r); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 16px; }
.private { font-size: 11.5px; color: var(--warn); font-weight: 600; margin-left: 4px; }
.narrow { max-width: 760px; margin: 0 auto; width: 100%; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
summary { cursor: pointer; }
summary h3 { display: inline; }
/* 칩 */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.pos { font-family: var(--f-data); background: var(--blue-soft); color: var(--blue); border-color: transparent; vertical-align: middle; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
/* 주차 · 요일 */
.wnav { display: flex; align-items: center; gap: 6px; }
.wnav > .btn:not(.link) { min-width: 40px; padding: 6px 10px; font-size: 18px; line-height: 1; }
.wnav .wcur { flex: 1 1 auto; min-width: 0; display: grid; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.wnav .wcur b { font-family: var(--f-display); font-weight: 400; font-size: 17px; line-height: 1.2; }
.wnav .wcur span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wnav .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); vertical-align: middle; }
.day.opt { border-style: dashed; }
tr.past td { opacity: 0.55; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding-top: 6px; }
.day { position: relative; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; cursor: pointer; display: grid; gap: 0; justify-items: center; min-width: 0; }
.day .dw { font-family: var(--f-display); font-size: 17px; line-height: 1.15; }
.day .dt { font-family: var(--f-data); font-size: 11px; color: var(--muted); }
.day .kd { font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.day.gym .kd { color: var(--blue); }
.day.team .kd { color: var(--good); }
.day.cup { background: var(--yellow-soft); }
.day.cup .kd { color: var(--warn); }
.day.rest { background: var(--surface-2); }
.day[aria-pressed="true"] { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); background: var(--blue-soft); }
.day .tdy { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; background: var(--blue); color: var(--surface); padding: 0 6px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.day .ok { position: absolute; top: 3px; right: 5px; font-size: 11px; font-weight: 700; color: var(--good); }
/* 홈 */
.today-card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.today-card .row.between { flex-wrap: wrap; row-gap: 8px; }
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 4px 0 2px; }
.pick[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.pick:disabled { cursor: default; }
.exlink { color: var(--blue); font-weight: 700; text-decoration: none; }
.exlink:hover, .exlink:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
.eyebrow { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.today-card .sub { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-top: 4px; }
.mini { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.mini li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; min-width: 0; }
.mini li span { min-width: 0; }
.mini li b { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.tile .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { display: grid; gap: 8px; align-content: start; }
.tile .done { color: var(--good); font-weight: 600; font-size: 14px; }
.tile .btn { justify-self: start; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .v { font-family: var(--f-data); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat.hot { background: var(--warn-soft); }
.stat.hot .v { color: var(--warn); }
.stat .v small, td small { font-size: 11px; color: var(--good); font-weight: 600; }
small.neg { color: var(--crit) !important; }
.team-status { display: grid; gap: 10px; }
.team-status .btn.link { justify-self: start; }
.wk-sum { display: grid; gap: 8px; }
.rtp { display: grid; gap: 12px; }
.chip.ok { color: var(--good); border-color: var(--good); }
.rtp .btn { justify-self: start; }
.wk-sum table td, .wk-sum table th { white-space: nowrap; }
.wk-sum .btn.link { font-weight: 700; color: var(--ink); padding: 0; }
.row.wrap { flex-wrap: wrap; gap: 6px; }
.watch { list-style: none; margin: 0; padding: 0; display: grid; }
.watch li { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid var(--line); }
.watch .btn.link { font-weight: 700; color: var(--ink); }
/* 프로그램 블록: 다단 배치로 빈칸 없이 */
.day-title { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.blocks { columns: 2 340px; column-gap: 12px; }
.blk { break-inside: avoid; margin: 0 0 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; padding: 7px 12px; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .nm { font-size: 14.5px; }
.rows .rx { font-weight: 700; font-size: 14px; text-align: right; max-width: 11em; font-variant-numeric: tabular-nums; }
.rows .sub { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.rows .sub b { color: var(--ink); font-weight: 700; }
.rows .cue { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.mod { font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-soft); padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.bnote { font-size: 12.5px; color: var(--muted); padding: 7px 12px; border-top: 1px solid var(--line); background: var(--surface-2); }
.callout { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 12px 8px 28px; border-radius: 0 8px 8px 0; font-size: 14px; }
.notes { margin: 0; display: grid; gap: 2px; }
.stages { margin: 10px 0 6px; padding: 0; list-style: none; display: grid; gap: 6px; }
.stages li { display: grid; gap: 2px; padding: 7px 10px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--line); font-size: 14px; }
.stages li.cur { border-left-color: var(--warn); background: var(--warn-soft); }
/* 기록 화면: 두 열이 각자 쌓임 */
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
details.panel > summary { list-style-position: inside; }
details.panel[open] > summary { margin-bottom: 10px; }
.picker { width: 180px; flex: none; }
.picker select { width: 100%; }
/* 버튼·폼 */
.btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 8px; padding: 7px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--surface); }
.btn.danger { color: var(--crit); }
.btn.danger.armed { background: var(--crit); color: var(--surface); border-color: var(--crit); }
.btn.link { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 8px; color: var(--blue); }
.btn.link:hover { border-color: var(--blue); }
.btn.link.danger:hover { border-color: var(--crit); background: var(--crit-soft); }
.btn.link.small { padding: 3px 9px; font-size: 13px; }
/* 이름처럼 글 안에 들어가는 링크는 박스 없이 */
.watch .btn.link, .wk-sum .btn.link, td .btn.link[data-act="open"]{ border: 0; background: none; padding: 0; }

form.f { display: grid; gap: 12px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 10px; }
.fields .pair { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
label.fl, div.fl { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
label.fl.wide { grid-column: 1 / -1; }
input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; width: 100%; min-width: 0; }
label.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); }
label.check input { width: auto; }

.checks { display: grid; gap: 10px; }
.attend { list-style: none; margin: 0; padding: 0; display: grid; }

.attend > li > .at-list, .attend > li > .at-names { grid-column: 1 / -1; margin: 0; }
.at-when > span { overflow-wrap: anywhere; }
.at-when .pr-link { justify-self: start; }
.at-side { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }

.at-when { display: grid; min-width: 0; }
.at-list { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 2px; font-size: 14px; }
.reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rsn { display: flex; }

/* 홈: 오늘 + 아이콘 */

.tile-btn { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px 14px; display: grid; justify-items: start; gap: 2px; text-align: left; cursor: pointer; }
.tile-btn:hover { border-color: var(--blue); }

.tile-btn .ts { font-size: 12.5px; color: var(--muted); }
.badge { position: absolute; top: -6px; right: -8px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--crit); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
/* 공지 · 엔트리 */

header.top .wrap { position: relative; }

.tag-in { display: inline-block; font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); vertical-align: 2px; margin-left: 4px; }
.menu-btn { border: 0; background: none; color: var(--ink); width: 36px; height: 36px; margin-left: -6px; display: grid; place-items: center; border-radius: 10px; cursor: pointer; transition: background-color .18s, transform .12s; }

/* 전체 메뉴 (왼쪽에서) */

.drawer { position: absolute; top: 0; bottom: 0; left: 0; width: min(300px, 84vw); background: var(--surface); overflow-y: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 4px 0 24px rgba(0, 0, 0, .18); }

.dr-top { display: flex; align-items: center; justify-content: space-between; font-size: 18px; }

/* 설정 · 공지 */

.menu-item.danger span:first-child { color: var(--crit); }
.notices { display: grid; gap: 10px; border-color: var(--blue); }

.notices .notice.pinned { border-color: var(--blue); background: var(--blue-soft); }
.nt-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }

fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-weight: 700; padding: 0 6px; font-size: 14px; }
/* 날짜 칸이 휴대폰에서 옆 칸을 넘지 않게 */

input[type="date"]::-webkit-date-and-time-value { text-align: left; }

/* 프로그램: 팀 세션 왼쪽 · 개인 오른쪽 */

.blk h4 { font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 7px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); letter-spacing: 0.02em; margin: 0; }
.cu-btn { justify-self: start; }
/* 프로그램 박스 편집 */

.removed { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.add-box { border-style: dashed; color: var(--blue); font-weight: 700; cursor: pointer; background: none; box-shadow: none; }

.lib-cats { display: flex; flex-wrap: wrap; gap: 6px; }

.lib-cats .chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
.lib { display: flex; flex-wrap: wrap; gap: 6px; max-height: 42vh; overflow-y: auto; padding: 2px; }
.lib-box { cursor: pointer; }
.lib-box.on { border-color: var(--blue); background: var(--blue-soft); }
/* 훈련 계획 */

.pr-day .dot { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }

.pr-head h3 { margin: 0; }
.pr-top { display: grid; gap: 2px; }
.pr-empty { display: grid; gap: 10px; }
.pr-list { display: grid; gap: 8px; }
.pr-blk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

.pr-groups { display: grid; }
.split-blk .pr-groups { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pr-grp { padding: 4px 0; border-top: 1px solid var(--line); }

.pr-grp.mine { background: var(--blue-soft); }
.pr-gname { font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 4px 12px 0; }
.pr-drills { list-style: none; margin: 0; padding: 0; }

.pr-link { margin-top: 4px; justify-self: start; }
.dr-brand { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--ink); font: inherit; font-family: var(--f-display); font-size: 22px; padding: 2px 4px; border-radius: 10px; cursor: pointer; }

.dr-roles { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 6px 4px; }

/* 설정 창 (오른쪽에서) */
.setpanel-bg { position: fixed; inset: 0; z-index: 40; background: rgba(10, 16, 30, .45); }
.setpanel { position: absolute; top: 0; bottom: 0; right: 0; width: min(480px, 100vw); background: var(--bg); overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: -4px 0 24px rgba(0, 0, 0, .18); }

.push-rows { display: grid; gap: 4px; }

.wexp-desc { display: block; margin-top: 4px; font-weight: 400; }
/* 영상 */
.vid-list { display: grid; gap: 8px; }
.vid { display: grid; gap: 8px; }
.vid-ic { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--crit-soft); color: var(--crit); }

.sub-h { margin-top: 8px; font-size: 13.5px; font-weight: 700; margin: 4px 0 0; }

.inj-row .inj-side { flex: 0 0 92px; } .inj-row .inj-part { flex: 1 1 120px; } .inj-row .inj-type { flex: 2 1 200px; }

.btn.mode { padding: 3px 9px; font-size: 12.5px; border-radius: 999px; white-space: nowrap; }
.btn.mode.on { background: var(--blue); color: var(--surface); border-color: var(--blue); }
/* 운동 설명 시트 */
.rows li.tap { cursor: pointer; }

.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 30, 0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); }

.chips-t { gap: 4px; }

.fields.well { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.cell-warn { color: var(--warn); font-weight: 700; }
/* 관리자 */
.side { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; }

.plist { display: grid; gap: 2px; }
.plist button { text-align: left; font: inherit; border: 1px solid transparent; background: none; color: var(--ink); padding: 6px 10px; border-radius: 7px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.plist button[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); }
.members > summary { padding: 2px 0; }
.members[open] > summary { margin-bottom: 6px; }
.members table { min-width: 600px; }
/* 로그인 */
.auth { max-width: 400px; margin: 32px auto; display: grid; gap: 16px; }
.auth-hero { display: grid; justify-items: center; gap: 8px; text-align: center; }
.auth-hero .logo { height: 120px; }
.auth-hero h2 { font-size: 32px; }
.auth-hero p { color: var(--muted); }
.auth .msg { font-size: 14px; }
.auth .msg.err { color: var(--crit); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
@media (max-width: 520px) { .brand h1 { font-size: 21px; } .logo { height: 32px; } .day .dw { font-size: 15px; } .day .kd { font-size: 10.5px; } .days { gap: 3px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* 화면 폭 고정: 어느 화면이든 가로로 넘치지 않게 (넘치면 휴대폰이 화면을 줄여서 화면마다 크기가 달라 보임) */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scrollbar-gutter: stable; }
#main { overflow-x: clip; }
.panel, .sec, .col, .blk, .tile { min-width: 0; }
@media (max-width: 760px) { input, select, textarea { font-size: 16px; } }
.netbar { font-size: 13px; font-weight: 600; color: var(--on-yellow); background: var(--yellow-soft); border: 1px solid var(--yellow); border-radius: 8px; padding: 6px 10px; }
.foot { text-align: center; margin: 4px 0 0; }
.runbar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 6px 0 8px; }
.runbar span { display: block; height: 100%; background: var(--blue); }
.setdots { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
.setdots span { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; color: var(--muted); }
.setdots span.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.big { font-size: 16px; padding: 10px 22px; }
.runnav { margin-top: 10px; }
.runrow { margin-bottom: 4px; }
.run-how summary { cursor: pointer; color: var(--muted); }
.run .setlog button[type="submit"] { display: none; }
.run .setlog-row { grid-template-columns: 1fr 1fr 0.8fr; }
/* 일정 달력 */
:root { --c-match: #c2410c; --c-fr: #1f7a4d; --c-team: #173f8f; --c-try: #7c3aed; --c-open: #0e7490; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-match: #ff9a5a; --c-fr: #5fd09a; --c-team: #8fb0ff; --c-try: #c4a5ff; --c-open: #5fd3e6; } }
:root[data-theme="dark"] { --c-match: #ff9a5a; --c-fr: #5fd09a; --c-team: #8fb0ff; --c-try: #c4a5ff; --c-open: #5fd3e6; }
.sched-cols { display: grid; gap: 16px; align-items: start; }
@media (min-width: 760px) { .sched-cols { grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); } }
.sched-cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.cal-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.cal-head h3 { margin: 0; flex: 1; text-align: center; font-size: 15px; }
.cal-head .btn.link { min-width: 32px; font-size: 18px; padding: 2px 8px; }
.cal-head .btn.link.small { font-size: 12px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cw { text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
.cw.sun { color: var(--crit); } .cw.sat { color: var(--blue); }
.cd { position: relative; aspect-ratio: 1 / 1; min-height: 34px; font: inherit; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
.cd.blank { cursor: default; }
.cd .n { font-family: var(--f-data); font-size: 13px; font-weight: 600; }
.cd.k-team { background: color-mix(in srgb, var(--c-team) 16%, transparent); }
.cd.k-team .n { color: var(--c-team); }
.cd.k-fr { background: var(--c-fr); } .cd.k-fr .n { color: var(--surface); }
.cd.k-match { background: var(--c-match); } .cd.k-match .n { color: var(--surface); }
.cd.k-try { background: var(--c-try); } .cd.k-try .n { color: var(--surface); }
.cd.k-open { background: color-mix(in srgb, var(--c-open) 18%, transparent); box-shadow: inset 0 0 0 1.5px var(--c-open); } .cd.k-open .n { color: var(--c-open); }
.cd .opn { position: absolute; bottom: 3px; left: 50%; translate: -50% 0; width: 5px; height: 5px; border-radius: 50%; background: var(--c-open); }
.cd.k-off .n { color: var(--muted); text-decoration: line-through; }
.cd.past { opacity: .5; }
.cd.today { border-color: var(--ink); }
.cd.sel { box-shadow: 0 0 0 2px var(--yellow); }
.cd .abs { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 1.5px var(--surface); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
i.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
i.dot.k-team { background: color-mix(in srgb, var(--c-team) 30%, transparent); border: 1px solid var(--c-team); }
i.dot.k-fr { background: var(--c-fr); } i.dot.k-match { background: var(--c-match); } i.dot.k-try { background: var(--c-try); }
i.dot.k-open { background: color-mix(in srgb, var(--c-open) 25%, transparent); border: 1.5px solid var(--c-open); }
i.dot.k-off { background: none; border: 1px dashed var(--muted); }
.abs-l { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); }
.cal-detail { display: grid; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.sm-select { font: inherit; font-size: 14px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: auto; }
/* 명단: 한 줄에 한 명 */
/* 아침 컨디션: 접으면 한 줄 */
.well-card { padding: 10px 14px; }
.well-card h3 { margin: 0; font-size: 15px; }
.well-card details summary { cursor: pointer; margin: 2px 0 0; font-size: 12.5px; }
.well-card form { margin-top: 6px; display: grid; gap: 8px; }
.well-card .fields.well { gap: 6px 8px; }
.well-card .fl { font-size: 12px; gap: 2px; }
.well-card select { padding: 3px 8px; min-height: 32px; }
.well-card .btn.small { justify-self: start; }
/* 메뉴: 화면 보기 한 칸 */
.dr-roles select { width: 100%; font: inherit; font-size: 15px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.tw th, .tw td { white-space: nowrap; }
.inj-end { flex: 1 1 100%; } .inj-end label, .inj-end .btn { white-space: nowrap; }
.mem-list { list-style: none; margin: 8px 0 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.mem-list li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.mem-list li:first-child { border-top: 0; }
.mem-who { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; min-width: 0; }
.mem-who .small { flex-basis: 100%; overflow-wrap: anywhere; }
.mem-act { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.mem-act select { width: auto; font: inherit; font-size: 14px; padding: 5px 8px; }
.ev-list .num, .watch .num { font-size: 13px; white-space: nowrap; }
.dr-view { display: flex; align-items: center; gap: 10px; }
.dr-view .dr-h { margin: 0; white-space: nowrap; }
.dr-view .dr-roles { flex: 1; padding: 0; }
/* 시간 입력이 휴대폰에서 칸 밖으로 넘치지 않게 */
.fields .pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.fields .pair .fl, .fields .fl { min-width: 0; }
input[type="time"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; min-height: 36px; text-align: left; }
input[type="time"]::-webkit-date-and-time-value { text-align: left; }
/* 날짜·시간 고르기 (js/picker.js): 진짜 input 은 숨기고 버튼 + 달력·시간 창 */
.dtp { position: relative; display: block; min-width: 0; }
.dtp-raw { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.dtp-btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-width: 0; min-height: 36px; font: inherit; font-size: 15px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; text-align: left; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.dtp-btn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dtp-btn .ph { color: var(--muted); }
.dtp-btn svg { flex: none; width: 17px; height: 17px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dtp-btn:hover:not(:disabled), .dtp-btn.on { border-color: var(--blue); }
.dtp-btn.on { box-shadow: 0 0 0 3px var(--blue-soft); }
.dtp-btn.on svg { stroke: var(--blue); }
.dtp-btn:disabled { opacity: .55; cursor: default; }
.dtp-bg { position: fixed; inset: 0; z-index: 65; }
.dtp-pop { position: fixed; width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(10, 16, 30, .2), 0 2px 6px rgba(10, 16, 30, .06); padding: 12px 10px 10px; animation: dtp-in .16s ease-out; }
@keyframes dtp-in { from { opacity: 0; transform: translateY(-4px); } }
.dtp-bg.sheetish { background: rgba(10, 16, 30, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade-in .18s ease-out; }
.dtp-bg.sheetish .dtp-pop { position: static; width: 100%; max-width: 560px; border: 0; border-radius: 16px 16px 0 0; padding: 16px 14px calc(14px + env(safe-area-inset-bottom, 0px)); animation: sheet-up .26s cubic-bezier(.2, .8, .2, 1); }
.dtp-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px; margin-bottom: 8px; }
.dtp-top b { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.dtp-nav { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0 0 2px; }
.dtp-nav:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.dtp-nav:disabled { opacity: .35; cursor: default; }
.dtp-dow, .dtp-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dtp-dow span { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 0 6px; }
.dtp-days { row-gap: 2px; }
.dtp-days button { justify-self: center; width: 38px; height: 38px; border: 0; border-radius: 50%; background: none; font: inherit; font-size: 14.5px; font-weight: 500; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; transition: background .12s; }
.dtp-dow .sun, .dtp-days .sun { color: var(--crit); }
.dtp-days .out { opacity: .4; }
.dtp-days button:hover:not(:disabled) { background: var(--surface-2); }
.dtp-days .today { color: var(--blue); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--blue); }
.dtp-days .sel, .dtp-days .sel:hover:not(:disabled) { background: var(--brand); color: #fff; font-weight: 700; box-shadow: none; opacity: 1; }
.dtp-days button:disabled { opacity: .22; cursor: default; }
.dtp-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; padding: 10px 2px 0; border-top: 1px solid var(--line); }
.dtp-wheel { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; height: 200px; margin: 4px 0 2px; }
.dtp-band { position: absolute; left: 0; right: 0; top: 80px; height: 40px; border-radius: 10px; background: var(--blue-soft); pointer-events: none; }
.dtp-col { position: relative; height: 200px; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; padding: 80px 0; -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); outline: none; }
.dtp-col::-webkit-scrollbar { display: none; }
.dtp-col button { display: block; width: 100%; height: 40px; scroll-snap-align: center; border: 0; background: none; font-family: var(--f-data); font-size: 19px; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; transition: color .12s; }
.dtp-col button.sel { color: var(--ink); font-weight: 700; font-size: 21px; }
.dtp-col:focus-visible { box-shadow: inset 0 0 0 2px var(--blue); border-radius: 10px; }
.dtp-colon { position: relative; font-family: var(--f-data); font-size: 21px; font-weight: 700; padding: 0 6px 3px; }
.dtp-pop button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (max-width: 599px) { .dtp-days button { width: 42px; height: 42px; font-size: 15.5px; } }
/* 일정·훈련 관리: 섹션마다 박스 */
.cols > .col > .sec, .sched-cols > .sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.cols > .col > .sec + .sec { margin-top: 14px; }
.cols > .col > .sec .panel { border: 0; padding: 0; background: none; box-shadow: none; }
.cols > .col > .sec .ev-list li:first-child, .cols > .col > .sec .watch li:first-child { border-top: 0; }
.sched-cols > .sec.sched-cal { padding: 12px; }
/* 군 복무 */
.chip.mil { background: #e7efe4; color: #3d6b2f; border-color: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.mil { background: #22331d; color: #9fd08a; } }
:root[data-theme="dark"] .chip.mil { background: #22331d; color: #9fd08a; }
/* 삭제 확인 창 */
.cf-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(10, 16, 30, .45); }
.cf-wrap[hidden] { display: none; }
.cf-card { width: min(360px, 100%); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 18px 16px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.cf-h { margin: 0 0 6px; font-weight: 700; font-size: 16px; }
.cf-b { margin: 0 0 12px; }
.cf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btn.danger-fill { background: var(--crit); border-color: var(--crit); color: #fff; }
.team-tag { font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 6px; padding: 1px 6px; align-self: center; }
.team-tag:empty { display: none; }
.seg-pick { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg-pick label { position: relative; }
.seg-pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg-pick span { display: block; text-align: center; padding: 9px 0; font-weight: 700; color: var(--muted); }
.seg-pick label + label span { border-left: 1px solid var(--line); }
.seg-pick input:checked + span { background: var(--blue); color: #fff; }
.seg-pick input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: -2px; }
/* 명단: 칸 맞춘 표 */
table.roster { width: 100%; }
table.roster th, table.roster td { padding: 9px 10px; vertical-align: middle; }
table.roster td.num, table.roster th.num { text-align: center; width: 44px; padding-left: 4px; padding-right: 4px; color: var(--muted); }
.pf-tfl { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; position: relative; }
.pf-tsel { min-width: 0; width: 100%; }
.pf-tsel summary { list-style: none; box-sizing: border-box; width: 100%; cursor: pointer; font-size: 15px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 28px 6px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
.pf-tsel summary::-webkit-details-marker { display: none; }
.pf-tsel summary::after { content: "▾"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); }
.pf-tpop { position: absolute; z-index: 30; top: 100%; left: 0; margin-top: 4px; min-width: 180px; display: grid; gap: 8px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
@media (max-width: 760px) { .pf-tsel summary { font-size: 16px; } }
.r-tel { color: var(--blue); text-decoration: none; font-family: var(--f-data); font-size: 13.5px; }
/* 오늘 할 것: 권장은 동그란 칸 위에 */
.picks { margin-top: 12px; }
.pick { font: inherit; font-size: 14px; font-weight: 700; color: inherit; display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 36px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; white-space: nowrap; position: relative; }
.pick em { font-style: normal; font-size: 10.5px; font-weight: 800; color: var(--on-yellow); position: absolute; top: -9px; left: 50%; transform: translateX(-50%); line-height: 16px; padding: 0 7px; border-radius: 999px; background: var(--yellow); white-space: nowrap; box-shadow: 0 0 0 2px var(--surface); }
.pick[aria-pressed="true"] em { color: var(--on-yellow); opacity: 1; }
/* 영상 카드: 눌러서 펼침 */
.vid { gap: 0; padding: 0; overflow: hidden; }
.vid-head { display: flex; align-items: center; gap: 10px; width: 100%; font: inherit; color: inherit; text-align: left; background: none; border: 0; padding: 12px 14px; cursor: pointer; }
.vid-chev { flex: none; color: var(--muted); font-size: 22px; line-height: 1; transition: transform .2s ease; }
.vid.open .vid-chev { transform: rotate(90deg); }
.vid-body { display: grid; gap: 8px; padding: 0 14px 12px; animation: fade-in .2s ease; }
/* 불러오는 중: 가운데서 도는 배구공 */
.loader { display: grid; place-items: center; min-height: 42vh; color: var(--blue); }
.loader.sm { min-height: 44px; place-items: start; }
.ball-spin { width: 46px; height: 46px; animation: ball-spin 1.1s cubic-bezier(.45, .05, .55, .95) infinite; }
.loader.sm .ball-spin { width: 22px; height: 22px; }
@keyframes ball-spin { 0% { transform: rotate(0) translateY(0); } 50% { transform: rotate(180deg) translateY(-4px); } 100% { transform: rotate(360deg) translateY(0); } }
/* 눌렀을 때 남는 네모 잔상 없애기 */
html { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
@media (display-mode: standalone) { html, body { overscroll-behavior-y: none; } }
button:focus:not(:focus-visible), a:focus:not(:focus-visible) { outline: none; }
.team-switch { width: 170px; }
.team-switch span { padding: 6px 0; font-size: 14px; }
.t-inline { display: none; margin-left: 6px; font-size: 11px; padding: 0 6px; }
@media (max-width: 520px) {
  table.roster .c-title { display: none; }
  table.roster td > b { display: block; }
  table.roster .t-inline { display: inline-block; margin: 3px 4px 0 0; border-radius: 999px; }
  .r-tel { font-family: inherit; font-size: 13px; letter-spacing: -.2px; }
  table.roster th { white-space: nowrap; }
  table.roster th, table.roster td { padding: 9px 6px; }
  table.roster td.num, table.roster th.num { width: 32px; padding-left: 2px; padding-right: 2px; }
}
.ev-vote { margin-top: 6px; width: 100%; }
.ev-vote > summary { display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer; }
.ev-vote > summary::-webkit-details-marker { display: none; }
.ev-cnt { font-size: 13px; color: var(--muted); white-space: nowrap; }
.ev-cnt::after { content: " ›"; color: var(--blue); }
.ev-vote[open] .ev-cnt::after { content: " ˅"; }
@media (max-width: 759px) {
  .ev-list li { grid-template-columns: minmax(0, 1fr) auto; }
  .ev-list li > .num { grid-column: 1; grid-row: 1; }
  .ev-list li > .ev-main { grid-column: 1 / -1; grid-row: 2; }
  .ev-list li > .btn { grid-column: 2; grid-row: 1; }
