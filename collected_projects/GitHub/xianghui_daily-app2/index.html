  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;text-decoration:none;color:var(--text);transition:all .25s;position:relative;overflow:hidden;display:flex;flex-direction:column;}

  .empty{text-align:center;padding:60px 20px;color:var(--text-dim);grid-column:1/-1;}

  {folder:"20261106-11",name:"Trihedral & Lap",area:"stl",desc:"Snip twelve runners and lower three upright panels into one radial node with distinct height-third bridges. Customize real oblique angles, sheet fits and measured-reference carrier construction; local PNG/JPEG/SVG or verified ASCII/binary STL outer-arm engravings, connected card, three clean STLs and ZIP. No hardware; optional glue, gravity seated. Physical printing and fit untested."},

  {folder:"20261106-9",name:"Finger & Corner",area:"stl",desc:"Snip eight runners and interleave two complementary comb walls at 90 degrees for a right-angle finger-joint kit. Customize band count, sheet engagement, measured-reference carrier construction and calibrated root/vertical gaps; local PNG/JPEG/SVG or verified ASCII/binary STL wall engravings, connected card, two clean STLs and ZIP. Adhesive required for lasting assembly; physical printing and fit untested."},
  {folder:"20261106-8",name:"Dovetail & Lift",area:"stl",desc:"Snip eight runners and lower a flared tail vertically into a true offset socket: two coplanar lift-out dovetail panels. Customize reach, flank angle, measured-reference carrier construction and calibrated fit; local PNG/JPEG/SVG or verified ASCII/binary STL handle engravings, connected card, two clean STLs and ZIP. No hardware/glue or vertical capture; physical printing and fit untested."},

{folder:"20261106-6",name:"Scarf & Slide",area:"stl",desc:"Snip twelve runners, flip two complementary sloping beams and slide an upright sleeve over their scarf splice. Customize real incline, overlap, source-measured carrier construction and calibrated gaps; local PNG/JPEG/SVG or verified ASCII/binary STL tail engravings, connected card, three clean STLs and ZIP. No hardware/glue; no axial lock or load rating. Physical printing and fit untested."},
  {folder:"20261106-5",name:"Lap & Frame",area:"stl",desc:"Snip sixteen runners, flip two side rails and bond four complementary half-lap corners into a photo frame. Customize window, rail silhouettes, sheet and calibrated lap gaps from measured-reference carrier construction; local PNG/JPEG/SVG or verified ASCII/binary STL bottom-rail engravings, connected card, four clean STLs and ZIP. Adhesive and photo tape required; physical printing, fit and strength untested."},
  {folder:"20261106-4",name:"Shear & Equal",area:"stl",desc:"Snip sixteen runners and transfer a triangular wedge plus quadrilateral remainder between parallelogram and rectangle trays without rotation. Customize actual base, height, shear and reference-measured sheet/carrier construction; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected card, four clean STLs and ZIP. No hardware/glue; physical printing and fit untested."},
  {folder:"20261106-3",name:"Viviani & Sum",area:"stl",desc:"Snip twenty runners and move three dotted distance bars between an equilateral-triangle board and a straight comparison rail. Customize actual point weights, altitude and measured-reference sheet/pocket fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, five clean STLs and ZIP. Gravity seated, no hardware/glue; bars stop 4 mm short and the sum includes a 12 mm correction. Physical printing and fit untested."},

  {folder:"20261104-15",name:"Saddle & Weave",area:"stl",desc:"Snip 28 runners and cross-lap six parabolic ribs on a twelve-socket deck to assemble a saddle lattice. Customize actual curvature, span, pitch and measured-reference sheet/socket fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, seven clean-part STLs and ZIP. No hardware or glue; physical printing, fit and stability untested."},

  {folder:"20261104-4",name:"Morley & Thirds",area:"stl",desc:"Snip sixteen runners, bond two socketed feet and lace six angle-trisector threads around a removable equilateral inset. Customize a real scalene triangle, ray-intersection pocket and measured-reference sheet/socket fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engraving, connected-card, four clean STLs and ZIP. Thread, tape and adhesive required; physical printing and fit untested."},

  {folder:"20261104-2",name:"Geneva & Index",area:"stl",desc:"Snip sixteen runners and assemble a four-part open pin-slot indexer on two external rods. Customize real 4/5/6-station tangent-entry geometry, reference-derived sheet/carrier and calibrated pin/shaft fits; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean-part STLs and ZIP. Collars, washers and adhesive required; idle follower unlocked, physical operation untested."},

  {folder:"20261104-1",name:"Plateau & Film",area:"stl",desc:"Snip twelve runners and seat two unequal-height eyelet supports on a socketed base, then tie a non-planar cotton-thread loop for soap-film experiments. Customize real spans, alternating height, measured-reference sheet/socket fits and local PNG/JPEG/SVG or verified ASCII/binary STL base engravings; connected-card, three clean STLs and ZIP. Thread, adhesive and soap tray required; physical printing and films untested."},
  {folder:"20261103-31",name:"Gray & Sense",area:"stl",desc:"Snip twenty runners and turn an 8/16-sector, 3/4-track Gray-coded aperture wheel behind a socketed read gate. Customize actual code windows, webs, measured-reference sheet/socket fits and local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings; connected-card, five clean STLs and ZIP. M3 hardware and foot adhesive required; centre-aligned manual readings, physical printing and optics untested."},
  {folder:"20261103-29",name:"Residue & Scatter",area:"stl",desc:"Snip 52 runners and bond two cheeks, six dividers and five stepped floors into a quadratic-residue diffuser scale-model kit. Customize real well depths/span and measured-reference sheet/socket fits; local PNG/JPEG/SVG or verified ASCII/binary STL cheek engraving, connected-card, thirteen clean STLs and ZIP. Adhesive required; physical printing and acoustics untested."},
  {folder:"20261103-28",name:"Parallel & Pan",area:"stl",desc:"Snip 32 runners and link two identical beams with two pan posts into an eight-part Roberval balance kit. Customize actual equal-link reaches, measured-reference sheet/socket fits and M3 bores; local PNG/JPEG/SVG or verified ASCII/binary STL mast engraving, connected-card, clean-part STLs and ZIP. Six M3 hardware joints and adhesive required; physical printing and weighing accuracy untested."},
  {folder:"20261103-27",name:"Zone & Focus",area:"stl",desc:"Snip eight runners and seat a real acoustic Fresnel zone panel in a two-socket stand. Customize nonuniform wavelength/focus-derived radii, structural spokes and measured-reference sheet/slot fits; local PNG/JPEG/SVG or verified ASCII/binary STL panel engraving, connected-card, clean-part STLs and ZIP. Adhesive required; optional external ultrasound source/receiver not included. Physical printing and acoustics untested."},
  {folder:"20261103-26",name:"Jet & Labium",area:"stl",desc:"Snip twenty runners and bond three source-fit keyed layers into an air-jet experiment with a real windway, chamber, window and beveled labium. Customize air paths, lip, sheet/socket fits and local PNG/JPEG/SVG or verified ASCII/binary STL floor engravings; connected-card, five clean STLs and ZIP. Adhesive and hand blower required; physical printing and sound untested."},
  {folder:"20261103-24",name:"Descartes & Nest",area:"stl",desc:"Snip 28 runners and nest four precisely sized circles into a recessed plaque on two slotted feet. Customize actual Soddy-circle radii, six gaps, silhouettes and measured-reference sheet/socket fits; local PNG/JPEG/SVG or verified ASCII/binary STL lug engraving, connected-card, seven clean-part STLs and ZIP. Adhesive required; physical printing and fit untested."},
  {folder:"20261103-23",name:"Coil & Compass",area:"stl",desc:"Snip 24 runners and glue four rails between two pierced flanges for an open-bore coil-former kit. Customize actual winding span, bore, silhouettes and measured-reference sheet/socket fits; local PNG/JPEG/SVG or verified ASCII/binary STL flange engraving, connected-card, six clean-part STLs and ZIP. External thread/wire and adhesive required; physical winding and magnetic performance untested."},

  {folder:"20261103-21",name:"Cascade & Swing",area:"stl",desc:"Snip twelve runners and join a hand-held grip plus two serial pivot links into a double-pendulum kit. Customize actual reaches, distal bob, reference-derived sheet/carrier and calibrated M3 bores; local PNG/JPEG/SVG or verified ASCII/binary STL grip engravings, connected-card, clean-part STLs and ZIP. Two M3 hardware joints required; physical printing and dynamics untested."},
  {folder:"20261103-20",name:"Flux Dial",area:"stl",desc:"Turn two sealed magnet carriers through 4/6/8 alignment stations. Customize measured-reference recessed closure walls, grip silhouettes/ribs, magnet wells and calibrated M3 fits; local PNG/JPEG/SVG or verified ASCII/binary STL grip engravings, five printable parts, fit coupon and ZIP. Magnets, epoxy and hardware required; physical printing, containment and magnetic feel untested."},
  {folder:"20261103-19",name:"Ratio & Reach",area:"stl",desc:"Snip twelve runners and stack two witness-hole arms plus a printed spacer into a proportional divider. Customize real 2–4× lever radii, grip silhouettes, reference-derived sheet/carrier and calibrated M3 axle fit; local PNG/JPEG/SVG or verified ASCII/binary STL shoulder engravings, connected-card, clean-part STLs and ZIP. External M3 screw/washers/locknut required; physical printing and accuracy untested."},

  {folder:"20261103-18",name:"Tetra & Aperture",area:"stl",desc:"Snip sixteen runners and tape/glue four genuinely mitred faces into a hollow tetrahedron. Customize real edge length, aperture silhouettes, tapered seams and measured-reference sheet/carrier construction; local PNG/JPEG/SVG or verified ASCII/binary STL face engraving, connected-card, clean-panel STLs and ZIP. Tape and adhesive required; physical printing, bonding and optics untested."},
  {folder:"20261103-17",name:"Scytale & Wrap",area:"stl",desc:"Snip sixteen runners, cross-lap two ribs and bond two end collars into a clipped-square-section scytale for a wrapped-paper transposition cipher. Customize real mandrel span, wrapping perimeter, pitch ticks and reference-measured sheet/slot fits; local PNG/JPEG/SVG or verified ASCII/binary STL rib engraving, connected-card, clean-part STLs and ZIP. Paper, removable tape and adhesive required; physical printing and wrapping untested."},
  {folder:"20261103-16",name:"Catenary & Hang",area:"stl",desc:"Snip sixteen runners, bond a two-eye gantry and swap catenary/parabola gauges to compare a hanging chain. Customize real span, sag, curve ribs and reference-measured sheet/socket fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engraving, connected-card, clean-part STLs and ZIP. External fine chain, thread and adhesive required; physical printing and chain behavior untested."},
  {folder:"20261103-15",name:"Fagnano & Bounce",area:"stl",desc:"Snip 16 runners and seat three calibrated sheet fences around an engraved orthic triangle: a physical three-bounce reflection diagram. Customize actual triangle feet, inward planes and measured-reference sockets; local PNG/JPEG/SVG or verified ASCII/binary STL apron engraving, connected-card, clean-part STLs and ZIP. No hardware; adhesive for rigid retention. Physical printing and optical behavior untested."},
  {folder:"20261103-13",name:"Focus & Difference",area:"stl",desc:"Snip twelve runners and assemble a slotted pivot ruler with a fixed cord anchor: a taut broken thread path guides a hyperbola with constant focal-distance difference. Customize real focus spacing, cord reach, measured-reference sheet/socket fits and local PNG/JPEG/SVG or verified ASCII/binary STL engraving; connected-card, clean-part STL and ZIP. M3 hardware, thread, paper and adhesive required; physical drawing untested."},
{folder:"20261103-12",name:"Touch & Tangency",area:"stl",desc:"Snip twelve runners and compare three equal perpendicular gaps with a removable incircle gauge in a scalene triangle pocket. Customize real triangle/incenter geometry, reference-measured sheet/socket fits and local PNG/JPEG/SVG or verified ASCII/binary STL engraving; export a connected card, clean parts and assembly ZIP."},
  {folder:"20261103-11",name:"Reverse & Time",area:"stl",desc:"Snip twelve runners, bond a reference-fit tower and invert an unequal-ended blade between two suspension bores for a three-part reversible compound-pendulum kit. Customize real mass geometry, pivot spacing, bores and sheet fits; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean STLs and ZIP. M3 hardware and adhesive required; physical printing, friction and timing untested."},
  {folder:"20261103-10",name:"Buffon & Drop",area:"stl",desc:"Snip twelve runners and seat a socketed boundary fence over a parallel-line deck for a loose blunt-needle probability kit. Customize actual line pitch/count, needle length and reference-measured sheet/socket fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean-part STL and ZIP. No hardware; physical printing, fit and statistical performance untested."},

  {folder:"20261103-9",name:"Poggendorff & Reveal",area:"stl",desc:"Snip twelve runners and seat an oblique-line board behind a lift-out occluder for a three-part physical Poggendorff illusion kit. Customize real line angle, mask width, deliberate alignment offset and measured-reference sheet/socket fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean STLs and ZIP. No hardware; physical printing, fit and perceptual effect untested."},
  {folder:"20261103-8",name:"Thales & Corner",area:"stl",desc:"Snip twenty runners and fasten two slotted arms at seven semicircle locations to demonstrate a right angle. Five-part kit with measured-reference sheet/socket fits, calibrated M3 bores and local PNG/JPEG/SVG or verified ASCII/binary STL stand engravings; connected-card, clean-part STLs and ZIP. Three M3 bolts/nuts required; physical printing, fit and accuracy untested."},
{folder:"20261103-7",name:"Tusi & Roll",area:"stl",desc:"Snip twelve runners and assemble a socketed circular guide with a half-radius roller: hand-guided internal rolling ideally sends a rim witness along a straight diameter. Customize real radii, reference-derived sheet/socket/tab fits and local PNG/JPEG/SVG or verified ASCII/binary STL engravings; connected-card, clean-part STLs and ZIP. Loose disc, no gears or captive retention; physical rolling untested."},{folder:"20261103-6",name:"Wedge & Rise",area:"stl",desc:"Snip twenty runners and seat two source-fit guides around a loose horizontal crossbar; pinch an exposed inclined-wedge grip to turn sliding travel into vertical rise. Customize real incline, stroke, measured-reference sheet/socket fits and local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings; connected-card, five clean-part STLs and ZIP. Glue fixed feet; hand-guided, not captive or load-bearing. Physical printing and friction untested."},
{folder:"20261103-5",name:"Delboeuf & Compare",area:"stl",desc:"Snip twenty runners and nest two byte-identical discs with interchangeable close/distant surrounds into a calibrated five-part physical size-illusion kit. Customize real apertures, locating gaps and reference-derived sheet/carrier construction; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean-part STLs and ZIP. No glue or hardware; gravity-seated, physical printing and perceptual effect untested."},
{folder:"20261103-4",name:"Sag & Sphere",area:"stl",desc:"Snip twenty runners and assemble three source-fit underside feet plus a loose graduated probe into a five-part curvature demonstrator. Customize actual contact radius, foot drop, calibrated sheet/socket fits and local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings; connected-card, clean-part STL and ZIP. Adhesive required; physical printing and measurement accuracy untested."},
{folder:"20261103-3",name:"Jump & Vacancy",area:"stl",desc:"Snip 132 runners and seat 32 removable shoulder-grip pegs in a 33-socket English-cross board for a physical solitaire kit. Customize real pitch, grip height and measured-reference sheet/socket fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean-part STLs and ZIP. No glue or hardware; physical printing, fit and play untested."},
{folder:"20261103-2",name:"Involute & Unwind",area:"stl",desc:"Snip 12 runners and glue a source-fit upright into a pencil shoe; unwrap cord from a fixed circular former to trace an involute. Customize actual radius, bore, sheet/socket fits and silhouettes; local PNG/JPEG/SVG or verified ASCII/binary STL center engravings, connected-card, clean STLs and ZIP. Cord, pencil, tape and adhesive required; physical printing and drawing untested."},
{folder:"20261103-1",name:"Parallax & Range",area:"stl",desc:"Snip 28 runners and assemble two independently pivoting slit sights on a marked baseline for a seven-part triangulation kit. Customize reference-measured sheet/socket fits, actual baseline, arm reach and rear-pointer scales; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean-part STLs and ZIP. M3 hardware, spacer feet and adhesive required; physical printing and ranging accuracy untested."},
{folder:"20261102-39",name:"Chord Click",area:"stl",desc:"Tap three independent MX-style switches in a triangular fingertip body. Customize measured-reference socket/cross-stem fits, key spacing, grip and silhouettes; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, three roof-down key STLs, palm base, fit coupon and ZIP. Three external switches required; physical printing and fit untested."},
{folder:"20261102-37",name:"Curry & Gap",area:"stl",desc:"Snip twenty runners and reassemble two unequal-slope triangles plus two steps to expose the missing-square paradox on a gridded board. Customize real unit pitch, reference-measured sheet/carrier construction and printer clearances; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, five clean STLs and ZIP. No hardware or glue; physical printing untested."},
{folder:"20261102-36",name:"Vacant & Glide",area:"stl",desc:"Snip 36 runners and place eight numbered tiles in a recessed one-vacancy sliding board. Customize tile pitch, sliding gaps, fence rise and measured-reference sheet/carrier construction; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, nine clean STLs and ZIP. Removable tiles, keep level; no glue or hardware, physical printing and sliding untested."},
{folder:"20261102-35",name:"Cipher & Turn",area:"stl",desc:"Snip twelve runners and bond one source-fit T axle to capture a rotating 26-letter cipher dial. Customize real engraved alphabets, dial size, sheet/socket/bore fits and local PNG/JPEG/SVG or verified ASCII/binary STL corner engravings; connected-card, three clean-part STLs and ZIP. Adhesive required; physical printing and turning untested."},
{folder:"20261102-34",name:"Harmonic & Overhang",area:"stl",desc:"Snip 32 runners, glue two measured-reference socket supports and gravity-stack five identical planks with calculated harmonic overhangs. Customize real plank/sheet dimensions, calibrated fits and local PNG/JPEG/SVG or verified ASCII/binary STL base engravings; connected-card, eight clean STLs and ZIP. Adhesive and uniform-mass printing required; physical printing and stability untested."},
  {folder:"20261102-33",name:"Savart & Sing",area:"stl",desc:"Snip twenty runners, glue two measured-reference socket uprights and mount N/2N toothed wheels on M3 axles for a hand-spun paper-striker pulse experiment. Customize real teeth, wheel/bore/washer gaps and local PNG/JPEG/SVG or verified ASCII/binary STL apron engraving; connected-card, five clean STLs and ZIP. Hardware, paper, tape and adhesive required; physical printing and sound untested."},
{folder:"20261102-32",name:"Stave & Halo",area:"stl",desc:"Snip 32 runners, seat six broad windowed staves in a socketed floor, then lower the open halo over six upper tongues for an eight-part dry-vessel kit. Customize diameter-derived wall geometry, height, windows and measured-reference sheet fits; local PNG/JPEG/SVG or verified ASCII/binary STL floor engraving, connected-card, clean-part STL and ZIP. Adhesive required; physical printing and load stability untested."},

  {folder:"20261102-31",name:"Hanoi & Transfer",area:"stl",desc:"Snip 32 runners, glue three source-fit shouldered pegs into a signature board and transfer four graduated loose rings. Customize real ring diameters, blade height, measured-reference sheet/socket fits and local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings; connected-card, eight clean-part STLs and ZIP. Adhesive required; physical printing and fit untested."},
{folder:"20261102-30",name:"Simplex & Tension",area:"stl",desc:"Snip sixteen runners and lace three separate eye-ended struts into a nine-cord tensegrity prism; a fourth printed shuttle assists threading. Customize actual radius/height, cord eyes and reference-measured sheet/carrier construction; local PNG/JPEG/SVG or verified ASCII/binary STL shuttle engravings, connected-card, clean-part STL and ZIP. External cord required; physical printing, knots and tension stability untested."},
  {folder:"20261102-29",name:"Reuleaux & Roll",area:"stl",desc:"Snip twelve runners and drop an odd Reuleaux rotor plus equal-width circular control into a parallel-guide tray. Customize real arc count, constant width, reference-measured sheet/carrier construction and running gap; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card and clean-part STL/ZIP. No hardware or glue; physical printing and rolling untested."},
  {folder:"20261102-28",name:"Conchoid & Trace",area:"stl",desc:"Snip twelve runners and assemble a slotted pencil arm over a fixed pole and straight-line guide shoe to trace Nicomedes’ outer conchoid. Customize actual pole distance, offset, travel and measured-reference sheet/carrier fits; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean-part STLs and ZIP. M3 hardware, riser feet, pencil and tape required; physical printing and drawing untested."},
  {folder:"20261102-26",name:"Seism & Scribe",area:"stl",desc:"Snip twenty runners, bond two source-fit portals and suspend a pencil carriage on four external cords above a hand-moved paper sled. Five-part relative-motion experiment kit with real sheet/socket fits, hanging drop, local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card and clean-part STL/ZIP. Pencil, cords, paper, tape and adhesive required; physical writing and printing untested."},
  {folder:"20261102-25",name:"Prime & Screen",area:"stl",desc:"Snip 28 runners, bond two asymmetric registration fins and stack four composite masks over an engraved 1–49 board to reveal fifteen primes. Customize real grid webs, sheet fits and measured-reference sockets; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, seven clean-part STLs and ZIP. Adhesive required; physical printing, fit and number legibility untested."},
  {folder:"20261102-24",name:"Square & Roll",area:"stl",desc:"Snip sixteen runners and bond two reference-derived socketed rails for a four-part square-wheel rolling kit. Wheel size co-generates real inverted-catenary tracks; customize fit, base shapes and local PNG/JPEG/SVG or verified ASCII/binary STL engravings. Connected-card, clean-part STLs and ZIP. Hand-guided loose wheel; adhesive required, physical printing and rolling untested."},
  {folder:"20261102-22",name:"Lune & Proof",area:"stl",desc:"Snip sixteen runners and bond three same-scale aperture panels into six reference-derived sheet sockets for a four-part Hippocrates-lunes kit. Customize real lune/triangle regions, rims and calibrated fits; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean-part STLs and ZIP. Adhesive required; physical printing and fit untested."},
  {folder:"20261102-21",name:"Cycloid & Race",area:"stl",desc:"Snip twenty runners and bond paired cycloidal and straight rails into eight reference-derived base sockets for a five-part descent-comparison kit. Customize actual edge curves, ball/rail gaps and calibrated sheet fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean-part STLs and ZIP. Two external balls, catch tray and adhesive required; physical printing, rolling and timing untested."},
  {folder:"20261102-20",name:"Maxwell & Unwind",area:"stl",desc:"Snip 24 runners and bond a socketed gantry plus twin-disc rectangular-axle rotor for a seven-part Maxwell-wheel experiment. Customize measured-reference sheet fits, wheel span and cord winding lands; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean-part STL and ZIP. Two cords and adhesive required; physical descent and rewind untested."},
  {folder:"20261102-19",name:"Cavalieri & Slice",area:"stl",desc:"Snip twenty runners and bond two socketed spines with four paired disc/annulus shelves for a seven-part Cavalieri section-comparison kit. Customize real equal-area section equations, reference-measured sheet/tongue interfaces and calibrated fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean-part STL and ZIP. Adhesive required; physical printing and glue strength untested."},
  {folder:"20261102-18",name:"Corners & Concord",area:"stl",desc:"Snip fourteen runners, bond a matching triangle upright and gather three removable corner sectors into a semicircular tray for a five-part angle-sum kit. Customize two real triangle angles, reference-measured sheet fits and pickup-ear pockets; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean-part STL and ZIP. Adhesive required; physical printing and fit untested."},
  {folder:"20261102-17",name:"Siphon & Crest",area:"stl",desc:"Snip sixteen runners and bond a curved hose saddle and outlet mast into three reference-derived sockets for a four-part siphon-routing kit. Customize real bend radius, tube-fit gauge and calibrated sheet fits; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean-part STL and ZIP. External tube, ties, vessels and adhesive required; physical printing and water flow untested."},
  {folder:"20261102-16",name:"Pascal & Align",area:"stl",desc:"Snip sixteen runners and stand an engraved crossing-hexagon board in two reference-derived socket feet; hold a separate slotted rule over three collinear Pascal intersections. Customize actual conic points, radius and calibrated sheet fits; local PNG/JPEG/SVG or verified ASCII/binary STL engravings, connected-card, four clean STLs and ZIP. Adhesive required; physical printing and use untested."},
  {folder:"20261102-15",name:"Log & Slide",area:"stl",desc:"Snip eight runners and lower a loose logarithmic C-scale ruler into a matching D-scale guide for a two-part slide-rule kit. Customize real engraved scales, calibrated side gaps and measured-reference sheet/carrier structure; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean-part STLs and ZIP. No hardware or glue; physical print, fit and accuracy untested."},

  {folder:"20261102-14",name:"Pento & Pack",area:"stl",desc:"Snip fifty-two runners and fit twelve distinct pentomino tiles in a calibrated tray for a thirteen-part packing kit. Customize actual cell pitch, three rectangle layouts, measured-reference sheet/carrier structure and local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings; connected-card, clean-part STLs and ZIP. No hardware or glue; physical printing and fit untested."},

  {folder:"20261102-13",name:"Duplex & Decode",area:"stl",desc:"Snip twelve runners and stack two complementary perforated shares in an open-bottom registration cradle: a symbol emerges in their combined vertical projection. Customize real cell pitch, scramble seed, silhouettes and reference-derived sheet/carrier fits; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, three clean STLs and ZIP. No hardware or glue; physical printing and optical contrast untested."},
  {folder:"20261102-12",name:"Notch & Code",area:"stl",desc:"Snip 28 runners and layer three independently sliding notched gates with a shared comb bolt for a seven-part mechanical interlock kit. Encode real notch offsets, tooth width and calibrated guide gaps from a measured sheet/carrier reference; local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings, connected-card, clean-part STL and ZIP. Adhesive required; not a security lock, physical printing and friction untested."},
  {folder:"20261102-11",name:"Ames & Turn",area:"stl",desc:"Snip 24 runners and assemble a freely rotating asymmetric window in paired journals with a bonded axle keeper for a six-part Ames illusion kit. Customize real trapezoid proportions, measured-reference sheet sockets and calibrated bearings; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean-part STL and ZIP. Adhesive required; physical printing, friction and illusion untested."},
  {folder:"20261102-10",name:"Square & Sum",area:"stl",desc:"Snip 36 runners and transfer four shared right triangles between two open trays to compare c² with a²+b². Nine-part Pythagorean proof kit with reference-measured sheet/carrier structure, real leg ratios, calibrated tile gaps and local PNG/JPEG/SVG or verified ASCII/binary STL apron engravings; connected-card, clean-part STLs and ZIP. No hardware or glue; physical printing and assembly untested."},
  {folder:"20261102-9",name:"Euler & Route",area:"stl",desc:"Snip 48 runners, bond four land tiles and lower seven removable bridges into reference-derived 4.50 mm seats for a twelve-part Königsberg route kit. Customize real river spans and calibrated seat fits; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean-part STLs and ZIP. Adhesive required; bridges stay loose, physical printing and assembly untested."},
  {folder:"20261102-8",name:"Flag & Signal",area:"stl",desc:"Snip 24 runners and assemble two independently rotating semaphore flags on a source-derived socketed mast with printed headed axle and glued keeper. Customize real arm reach, flag silhouettes and calibrated sheet/bearing fits; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, six clean-part STLs and ZIP. Adhesive required; physical printing, friction and assembly untested."},
  {folder:"20261102-7",name:"Polar & Project",area:"stl",desc:"Snip eight runners and bond a pierced meridian ring into two reference-measured base sockets for a stereographic-projection kit. Customize real radius, ray angles, eyes and sheet fits; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean-part STLs and ZIP. Thread, tape and adhesive required; front-face rays approximate, physical printing and assembly untested."},
  {folder:"20261102-6",name:"Bone & Product",area:"stl",desc:"Snip 28 runners, bond two reference-derived socketed fences into a tray and arrange four loose Napier rods for diagonal multiplication. Customize actual engraved digits/products, row pitch and gaps; local PNG/JPEG/SVG or verified ASCII/binary STL tag engravings, connected-card, seven clean-part STLs and ZIP. Adhesive required; physical printing, legibility and assembly untested."},
  {folder:"20261102-5",name:"Chiral & Mirror",area:"stl",desc:"Snip twelve runners, cross-lap two tetrahedral ray frames and lower four measured-reference tongues into a signature dock for a three-part handedness kit. Customize real radial span, frames, fits and reversible numbered sites; local PNG/JPEG/SVG or verified ASCII/binary STL dock engravings, connected-card, clean-part STLs and ZIP. Adhesive required; physical printing and assembly untested."},
  {folder:"20261102-4",name:"Borromean & Bound",area:"stl",desc:"Snip 24 runners, interleave three open loops in cyclic coordinate planes and bond six measured-reference closure seats for a genuine Borromean link: no pair linked alone, all three bound together. Customize real spans, bands, fits and silhouettes; local PNG/JPEG/SVG or verified ASCII/binary STL closure engravings, connected-card, six clean-part STLs and ZIP. Adhesive required; physical printing and assembly untested."},
  {folder:"20261102-3",name:"Bend & Compare",area:"stl",desc:"Snip 24 runners, bond two three-notch cradles into four reference-derived sheet sockets and lower three loose equal-span beams for a six-part gentle-bending comparison kit. Customize real span, widths and seating; local PNG/JPEG/SVG or verified ASCII/binary STL base engravings, connected-card, clean-part STL and ZIP. Adhesive required; no force calibration, physical print or fatigue test."},

const d=document;
const sections=d.getElementById('sections');
const search=d.getElementById('search');

const areaOrder=['ai-utility','stl','game','saas'];
const areaLabels={'ai-utility':'AI Utilities',stl:'STL Generators',game:'Mini Games',saas:'SaaS Apps'};

d.getElementById('total-apps').textContent=APPS.length;
d.getElementById('total-saas').textContent=APPS.filter(a=>a.area==='saas').length;
d.getElementById('total-game').textContent=APPS.filter(a=>a.area==='game').length;

function makeCard(app) {
  const card=d.createElement('a');
  card.className='card';
  card.href=`${BASE_URL}${app.folder}/index.html`;
  card.target='_blank';
  card.rel='noopener';
  card.innerHTML=`
    <div class="badge">${app.area}</div>
    <div class="date">${app.folder}</div>
    <h2>${app.name}</h2>
    <div class="desc">${app.desc}</div>
    <div class="arrow">Open app →</div>
  `;
  return card;
}

function renderApps() {
  const q=(search.value||'').trim().toLowerCase();
  const filtered=APPS.filter(app => !q || [app.folder, app.name, app.desc, app.area].join(' ').toLowerCase().includes(q));
  sections.innerHTML='';
  if (!filtered.length) {
    sections.innerHTML='<div class="empty">No apps match your search.</div>';
    return;
  }

  const grouped=new Map();
  filtered.forEach(app=>{
    const key=areaOrder.includes(app.area) ? app.area : 'other';
    if(!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(app);
  });

  const orderedKeys=[...areaOrder.filter(k=>grouped.has(k)), ...[...grouped.keys()].filter(k=>!areaOrder.includes(k))];
  orderedKeys.forEach(key=>{
    const list=grouped.get(key);
    const section=d.createElement('section');
    section.className='section';

    const head=d.createElement('div');
    head.className='section-head';
    head.innerHTML=`<div class="section-title">${areaLabels[key] || key.charAt(0).toUpperCase()+key.slice(1)}</div><div class="section-meta">${list.length} item${list.length===1?'':'s'}</div>`;

    const grid=d.createElement('div');
    grid.className='grid';
    list.forEach(app=>grid.appendChild(makeCard(app)));

    section.appendChild(head);
    section.appendChild(grid);
    sections.appendChild(section);
  });
}

search.addEventListener('input', renderApps);
renderApps();
