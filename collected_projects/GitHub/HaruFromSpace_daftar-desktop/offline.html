<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-fcFd/4CnCfqnnRg9sdIZQ7m7pmQExV4OLUjn772vDiw='">
  <title>Daftar</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f1; --text: #1d1c19; --soft: #57534a; --btn: #1d1c19; --btn-text: #f6f5f1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121210; --text: #e9e6df; --soft: #b3aea3; --btn: #e9e6df; --btn-text: #121210; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 'Segoe UI', system-ui, sans-serif; }
    main { max-width: 360px; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--soft); margin: 0 0 20px; }
    button { min-height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-text); font: 600 15px 'Segoe UI', system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Daftar can't reach the internet</h1>
    <p>Check your Wi-Fi. Daftar tries again by itself, or you can try now.</p>
    <button id="retry">Try again</button>
  </main>
  <script>const site = new URLSearchParams(location.search).get('site'); const go = () => { if (site) location.href = site; }; document.getElementById('retry').addEventListener('click', go); setInterval(go, 30000);</script>
</body>
</html>
