<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写笔记 · 学习笔记</title>
<meta name="description" content="用 Markdown 写笔记并直接发布到 GitHub">
<script>const t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
<link rel="stylesheet" href="./assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./index.html">📚 学习笔记</a>
    <div style="display:flex;gap:10px;align-items:center;">
      <span class="uname" id="who"></span>
      <button id="logoutBtn" class="theme-btn" style="width:auto;padding:0 12px;border-radius:8px;font-size:.85rem;">退出</button>
      <button id="themeToggle" class="theme-btn" aria-label="切换主题" title="切换亮/暗色">🌙</button>
    </div>
  </div>
</header>

<main class="container reading">
  <a class="back" href="./index.html">← 返回首页</a>
  <h1>✍️ 写笔记</h1>
  <p class="sub" style="color:var(--text-soft);margin-top:0;">已登录，支持 Markdown 与图片粘贴/拖拽，点“发布”即写入仓库并更新首页。</p>

  <div class="form">
    <div class="row2">
      <div class="field"><label>标题</label><input id="fTitle" placeholder="例如 函数与数列"></div>
      <div class="field"><label>科目</label><select id="fSubject"></select></div>
    </div>

    <div class="field">
      <label>内容（Markdown）
        <button type="button" class="btn btn-sm" id="btnImg" title="从本机选择图片上传并插入正文（手机/平板建议用这个）">🖼 插入图片</button>
        <span class="hint">电脑上可直接 Ctrl+V 粘贴截图，也可把图片拖进输入框</span>
      </label>
      <div class="editor-grid">
        <textarea id="fMd" placeholder="在此用 Markdown 写笔记…&#10;&#10;## 小标题&#10;- 列表项&#10;&#10;**加粗**、*斜体*、&#96;代码&#96;、&gt; 引用、表格等均可。"></textarea>
        <div class="preview-pane" id="preview"><span class="ph">实时预览会显示在这里…</span></div>
      </div>
      <input type="file" id="filePick" accept="image/*" multiple hidden>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnPublish">🚀 发布到 GitHub</button>
      <button class="btn" id="btnCopy">📋 复制 HTML</button>
      <button class="btn" id="btnLocal">💾 存为本地草稿</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</main>

<script src="./assets/config.js"></script>
<script src="./assets/auth.js"></script>
<script src="./assets/theme.js"></script>
<script src="./assets/submit-app.js"></script>
</body>
</html>
