<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 学习笔记</title>
<script>const t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<main class="container login-wrap">
  <div class="login-card">
    <h1>🔐 登录</h1>
    <p class="sub">个人笔记管理入口（仅本人可用）</p>
    <div class="field"><label>用户名</label><input id="u" autocomplete="username" placeholder="用户名"></div>
    <div class="field"><label>密码</label><input id="p" type="password" autocomplete="current-password" placeholder="密码"></div>
    <div class="status" id="st" style="display:none;"></div>
    <button class="btn btn-primary" id="go" style="width:100%;margin-top:6px;">登录</button>
    <a class="back" href="./index.html" style="margin-top:14px;display:inline-block;">← 返回首页</a>
  </div>
</main>
<script src="./assets/config.js"></script>
<script src="./assets/auth.js"></script>
<script src="./assets/theme.js"></script>
<script>
(function(){
  function st(m,t){ var e=document.getElementById('st'); e.className='status '+(t||'err'); e.innerHTML=m; e.style.display='block'; }
  function doLogin(){ var u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
    if(window.Auth && Auth.login(u,p)){ location.href='./submit.html'; }
    else { st('用户名或密码错误。','err'); } }
  document.getElementById('go').addEventListener('click', doLogin);
  document.getElementById('p').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
})();
</script>
</body>
</html>
