<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skyforge Hangar — RC Plane Dogfight</title>
  <meta name="theme-color" content="#070b10">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:#f4f7fb;
      background: radial-gradient(920px 520px at 10% -8%, #94a3b844, transparent 58%), linear-gradient(#070b10,#121821 48%,#1b2430); }
    body { display:flex; justify-content:center; padding:28px 16px 48px; }
    .wrap { width:min(980px,100%); }
    .badge { display:inline-block; letter-spacing:.18em; text-transform:uppercase; font-size:11px; color:#fde68a; border:1px solid #fbbf2466; padding:5px 10px; border-radius:999px; margin-bottom:12px; }
    h1 { margin:0 0 8px; font-size:clamp(32px,7vw,52px); text-transform:uppercase; }
    .lead { margin:0 0 22px; max-width:720px; opacity:.92; line-height:1.5; }
    .cards { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:680px){ .cards{grid-template-columns:1fr;} }
    a.card { display:block; text-decoration:none; color:inherit; background:linear-gradient(180deg,rgba(20,24,32,.88),rgba(8,10,14,.92)); border:1px solid rgba(253,230,138,.28); border-radius:20px; padding:22px 18px; }
    .icon { font-size:40px; margin-bottom:8px; }
    .card b { display:block; font-size:22px; margin-bottom:6px; }
    .card span { display:block; font-size:14px; opacity:.82; }
    .hint { margin-top:16px; font-size:13px; opacity:.75; }
    .hint strong { color:#fde68a; }
    .maps { margin-top:16px; font-size:13px; opacity:.8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">No email confirmation</div>
    <h1>Skyforge Hangar</h1>
    <p class="lead">Create a pilot name on the Account tab and you are signed in right away. No confirmation email.</p>
    <div class="cards">
      <a class="card" href="/desktop"><div class="icon">🖥</div><b>Computer</b><span>Mouse and keyboard.</span></a>
      <a class="card" href="/phone"><div class="icon">📱</div><b>Phone</b><span>On-screen stick and throttle.</span></a>
    </div>
    <p class="maps">Tab 5 · Account: pilot name or email + password. Progress saves on this device.</p>
  </div>
</body>
</html>
