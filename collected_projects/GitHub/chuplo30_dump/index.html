<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WXZ Dump</title>
  <link rel="icon" type="image/jpeg" href="/static/avatar.jpg" />
  <link rel="apple-touch-icon" href="/static/avatar.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050607;
      --ink: #f2f4f7;
      --muted: #8b95a5;
      --dim: #5c6573;
      --line: rgba(255,255,255,0.08);
      --line2: rgba(255,255,255,0.14);
      --card: rgba(12, 14, 18, 0.72);
      --card2: rgba(18, 20, 26, 0.55);
      --accent: #8eb89a;
      --accent-soft: rgba(142, 184, 154, 0.15);
      --radius: 16px;
      --font: "Inter", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    body { overflow-x: hidden; }

    /* ===== background video ===== */
    .bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bg video {
      width: 100%; height: 100%; object-fit: cover;
      filter: grayscale(0.85) brightness(0.28) contrast(1.15) saturate(0.7);
      transform: scale(1.04);
    }
    .bg .veil {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 0%, rgba(20,24,30,0.35), transparent 60%),
        linear-gradient(180deg, rgba(5,6,7,0.55) 0%, rgba(5,6,7,0.82) 45%, rgba(5,6,7,0.96) 100%);
    }

    .shell {
      position: relative; z-index: 1;
      width: min(1180px, 100%);
      margin: 0 auto;
      min-height: 100%;
      padding: 14px 16px 28px;
      display: flex; flex-direction: column;
    }

    /* ===== top bar ===== */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 28px;
    }
    .nav-left, .nav-right { display: flex; align-items: center; gap: 10px; }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 6px 12px 6px 6px;
      border-radius: 999px;
      background: rgba(10,12,16,0.65);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .brand img {
      width: 28px; height: 28px; border-radius: 50%;
      object-fit: cover; display: block;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }
    .brand span {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--ink);
    }
    .pill {
      font-size: 0.72rem; font-weight: 600;
      padding: 7px 12px; border-radius: 999px;
      border: 1px solid var(--line); background: rgba(10,12,16,0.55);
      color: var(--muted); backdrop-filter: blur(12px);
    }
    .pill.ok { color: var(--accent); border-color: rgba(142,184,154,0.35); background: var(--accent-soft); }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 11px;
      border: 1px solid var(--line); background: rgba(10,12,16,0.55);
      color: var(--muted); cursor: pointer; display: grid; place-items: center;
      backdrop-filter: blur(12px); font-size: 0.95rem;
    }
    .icon-btn.on { color: var(--accent); border-color: rgba(142,184,154,0.4); }

    /* ===== hero ===== */
    .hero {
      margin: 8px 0 28px;
      display: flex; flex-direction: column; gap: 10px;
      max-width: 820px;
    }
    .eyebrow {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--dim);
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.1rem);
      font-weight: 700; letter-spacing: -0.035em; line-height: 1.08;
      color: #f7f8fa;
      text-shadow: 0 2px 40px rgba(0,0,0,0.45);
    }
    .hero p {
      font-size: 0.92rem; color: var(--muted); max-width: 520px; line-height: 1.5;
    }

    /* ===== workspace ===== */
    .workspace {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: stretch;
      flex: 1;
      min-height: 420px;
    }
    @media (max-width: 860px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .mid { order: 3; flex-direction: row; padding: 8px 0; }
    }

    .col {
      display: flex; flex-direction: column; gap: 10px; min-width: 0;
    }
    .col-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 36px;
    }
    .col-head h2 {
      font-size: 0.9rem; font-weight: 600; color: #dfe4ec;
    }
    .col-head .meta { font-size: 0.72rem; color: var(--dim); }

    .btn {
      appearance: none; border: 1px solid var(--line2);
      background: rgba(22, 24, 30, 0.85);
      color: var(--ink); font: inherit; font-size: 0.8rem; font-weight: 600;
      padding: 8px 14px; border-radius: 12px; cursor: pointer;
      transition: 0.15s ease; white-space: nowrap;
    }
    .btn:hover { border-color: rgba(255,255,255,0.22); background: rgba(30,33,40,0.9); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(180deg, #e8ecef, #c8ced6);
      color: #0b0d10; border-color: transparent;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      padding: 12px 22px; font-size: 0.88rem; border-radius: 14px;
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
    .btn-ghost {
      background: transparent; border-color: var(--line); color: var(--muted);
      padding: 7px 11px; font-size: 0.75rem;
    }

    .card {
      flex: 1; min-height: 320px; max-height: 48vh;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 50px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; overflow: hidden;
    }
    textarea {
      flex: 1; width: 100%; height: 100%;
      resize: none; border: 0; outline: none;
      background: transparent; color: var(--ink);
      font-family: var(--mono); font-size: 0.78rem; line-height: 1.55;
      padding: 14px 16px;
      white-space: pre; overflow: auto;
    }
    textarea::placeholder { color: var(--dim); }

    .mid {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 0 4px;
    }

    .url-row {
      margin-top: 12px;
      display: grid; grid-template-columns: 1fr; gap: 8px;
    }
    .url-row input {
      width: 100%; font: inherit; color: var(--ink);
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 11px 14px; outline: none;
      backdrop-filter: blur(12px);
    }
    .url-row input:focus { border-color: rgba(142,184,154,0.4); }

    .status {
      margin-top: 14px;
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; color: var(--muted); min-height: 20px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex-shrink: 0;
    }
    .dot.run { background: #c9a227; animation: pulse 1s infinite; }
    .dot.ok { background: var(--accent); }
    .dot.err { background: #c45c5c; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    .log {
      margin-top: 8px; font-family: var(--mono); font-size: 0.68rem;
      color: var(--dim); max-height: 64px; overflow: auto; white-space: pre-wrap;
    }

    .foot-actions {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
    }

    footer {
      margin-top: 22px; text-align: center;
      font-size: 0.72rem; color: var(--dim);
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="/static/bg.mp4" type="video/mp4" />
    </video>
    <div class="veil"></div>
  </div>

  <div class="shell">
    <nav class="nav">
      <div class="nav-left">
        <div class="brand">
          <img src="/static/avatar.jpg" alt="WXZ" width="28" height="28" />
          <span>WXZ Dump</span>
        </div>
      </div>
      <div class="nav-right">
        <button type="button" class="icon-btn" id="soundBtn" title="Sound">🔇</button>
        <div class="pill ok" id="serverBadge">● …</div>
      </div>
    </nav>

    <header class="hero">
      <div class="eyebrow">String dump · beta</div>
      <h1>WXZ Dump</h1>
      <p>VM-aware string dump</p>
    </header>

    <section class="workspace">
      <div class="col">
        <div class="col-head">
          <h2>Input code</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="meta" id="inputMeta">0 B</span>
            <button type="button" class="btn" id="uploadBtn">Upload file</button>
          </div>
        </div>
        <div class="card">
          <textarea id="inputCode" placeholder="Paste Lua code here…" spellcheck="false"></textarea>
        </div>
        <input type="file" id="fileInput" accept=".lua,.luau,.txt,.obf" hidden />
      </div>

      <div class="mid">
        <button type="button" class="btn btn-primary" id="runBtn">Dump</button>
      </div>

      <div class="col">
        <div class="col-head">
          <h2>Output code</h2>
          <span class="meta" id="outputMeta">—</span>
        </div>
        <div class="card">
          <textarea id="outputCode" readonly placeholder="Dumped strings will appear here…" spellcheck="false"></textarea>
        </div>
        <div class="foot-actions">
          <button type="button" class="btn btn-ghost" id="copyOut">Copy</button>
          <button type="button" class="btn btn-ghost" id="downloadOut">Download</button>
          <button type="button" class="btn btn-ghost" id="clearAll">Clear</button>
        </div>
      </div>
    </section>

    <div class="url-row">
      <input type="url" id="urlInput" placeholder="URL" autocomplete="off" />
    </div>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Ready</span>
    </div>
    <div class="log" id="logBox" hidden></div>

    <footer>WXZ Dump · one-time ticket · /health</footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { file: null, running: false };
    const video = $("bgVideo");

    $("soundBtn").addEventListener("click", async () => {
      if (video.muted) {
        video.muted = false;
        try { await video.play(); } catch (_) {}
        $("soundBtn").textContent = "🔊";
        $("soundBtn").classList.add("on");
      } else {
        video.muted = true;
        $("soundBtn").textContent = "🔇";
        $("soundBtn").classList.remove("on");
      }
    });

    const fileInput = $("fileInput");
    $("uploadBtn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    // drag-drop on input card
    const inCard = $("inputCode").parentElement;
    inCard.addEventListener("dragover", (e) => { e.preventDefault(); });
    inCard.addEventListener("drop", (e) => {
      e.preventDefault();
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      state.file = file;
      const reader = new FileReader();
      reader.onload = () => { $("inputCode").value = reader.result; updateInputMeta(); };
      reader.readAsText(file);
    }

    function updateInputMeta() {
      const t = $("inputCode").value || "";
      $("inputMeta").textContent = formatBytes(new Blob([t]).size);
    }
    $("inputCode").addEventListener("input", updateInputMeta);

    $("clearAll").addEventListener("click", () => {
      $("inputCode").value = "";
      $("outputCode").value = "";
      $("urlInput").value = "";
      state.file = null;
      fileInput.value = "";
      updateInputMeta();
      $("outputMeta").textContent = "—";
      setStatus("", "Ready");
    });
    $("copyOut").addEventListener("click", async () => {
      if (!$("outputCode").value) return;
      await navigator.clipboard.writeText($("outputCode").value);
      setStatus("ok", "Copied");
    });
    $("downloadOut").addEventListener("click", () => {
      const t = $("outputCode").value; if (!t) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([t], { type: "text/plain" }));
      a.download = "wxz_dump_out.lua"; a.click();
      URL.revokeObjectURL(a.href);
    });

    function formatBytes(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / (1024 * 1024)).toFixed(2) + " MB";
    }
    function setStatus(kind, text) {
      $("statusDot").className = "dot" + (kind ? " " + kind : "");
      $("statusText").textContent = text;
    }
    function log(msg) {
      const box = $("logBox"); box.hidden = false;
      box.textContent += msg + "\n"; box.scrollTop = box.scrollHeight;
    }

    async function checkServer() {
      try {
        const j = await (await fetch("/health")).json();
        $("serverBadge").textContent = j.ok ? "● ok" : "● down";
        $("serverBadge").classList.toggle("ok", !!j.ok);
      } catch {
        $("serverBadge").textContent = "● offline";
        $("serverBadge").classList.remove("ok");
      }
    }
    checkServer();
    setInterval(checkServer, 30000);

    async function mintTicket() {
      const r = await fetch("/api/ticket", { method: "POST" });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || ("ticket " + r.status));
      if (!j.ticket || !j.sig) throw new Error("bad ticket");
      return j;
    }

    $("runBtn").addEventListener("click", async () => {
      if (state.running) return;
      const code = $("inputCode").value.trim();
      const url = $("urlInput").value.trim();
      if (!code && !url && !state.file) {
        setStatus("err", "Need source");
        return;
      }
      state.running = true; $("runBtn").disabled = true;
      $("logBox").textContent = ""; $("logBox").hidden = false;
      setStatus("run", "Running…");

      try {
        const ticket = await mintTicket();
        const fd = new FormData();
        fd.append("ticket", ticket.ticket);
        fd.append("sig", ticket.sig);
        if (url) fd.append("url", url);
        if (code) fd.append("source", code);
        if (state.file) fd.append("file", state.file);

        const t0 = performance.now();
        const r = await fetch("/api/dump", {
          method: "POST",
          body: fd,
          headers: {
            "X-WXZ-Ticket": ticket.ticket,
            "X-WXZ-Sig": ticket.sig,
          },
        });
        const j = await r.json().catch(() => ({}));
        const ms = ((performance.now() - t0) / 1000).toFixed(2);
        if (j.log) log(j.log);

        if (r.status === 401) {
          setStatus("err", "ticket expired — try again");
          return;
        }
        if (!r.ok || j.error) {
          setStatus("err", j.error || ("HTTP " + r.status));
          if (j.output) $("outputCode").value = j.output;
          return;
        }
        $("outputCode").value = j.output || "";
        $("outputMeta").textContent = formatBytes(new Blob([j.output || ""]).size) + " · " + ms + "s";
        setStatus("ok", "Done · " + (j.lines || 0) + " lines");
      } catch (err) {
        setStatus("err", String(err.message || err));
      } finally {
        state.running = false; $("runBtn").disabled = false;
      }
    });
  </script>
</body>
</html>
