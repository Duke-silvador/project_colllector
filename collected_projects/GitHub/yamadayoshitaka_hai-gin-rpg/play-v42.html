 work:['私は町で暮らしながら旅人を助けているんだ。','今日は市場の荷物運びで大忙しだよ。','ときどき町を巡回して困りごとを探している。','職人さんから屋根の修理を頼まれていてね。']
 };
 if(n.name==='商人ミラ'&&topic==='work')return '私はミラ。露店で珍しい品物を売っているの。次は東の国から絹を仕入れたいわ。';
 if(n.name==='旅人レオン'&&topic==='adventure')return '僕はレオン。北の遺跡を調べている。石碑に「灰銀の共鳴」と刻まれていたよ。';

}

 if(npc){const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-top:12px';for(const [title,topic] of topics){let b=document.createElement('button');b.textContent=title;b.style.cssText='padding:8px;border:1px solid #d1b986;background:#263c58;color:#fff;border-radius:8px;font-size:12px';b.onclick=e=>{e.stopPropagation();body.textContent=reply(npc,topic);speakNpc(body.textContent,npc)};wrap.append(b)}dialog.append(wrap);

 const field=document.createElement('input');field.placeholder='住人に質問する（例：遺跡は？）';field.maxLength=240;field.style.cssText='min-width:0;flex:1;background:#e8edf2;color:#202937;padding:9px;border:0;border-radius:7px;font-size:13px';

 const bye=document.createElement('button');bye.textContent='閉じる ×';bye.style.cssText='display:block;margin-top:10px;padding:6px 14px;background:#566c80;color:white;border:0;border-radius:8px';bye.onclick=e=>{e.stopPropagation();closeDialog()};dialog.append(bye);dialog.style.display='block';
}

function interact(){if(speaking){closeDialog();return}let nearest=null,dist=3.9;for(const n of npcs){const d=n.g.position.distanceTo(player.position);if(d<dist){nearest=n;dist=d}}if(nearest){nearest.wait=5.5;showDialog(nearest,nearest.line)}else if(player.position.distanceTo(new THREE.Vector3(fx,0,fz))<5.7)showDialog(null,'噴水の水がきらめいている。');else showDialog(null,'町の人に近づいて話しかけよう。')}$('#talk').onclick=interact;
$('#quality').onclick=()=>{high=!high;renderer.setPixelRatio(Math.min(devicePixelRatio,high?(mobile?1.6:2):1));sun.shadow.mapSize.set(high?(mobile?1024:2048):512,high?(mobile?1024:2048):512);sun.shadow.map?.dispose();sun.shadow.map=null;$('#quality').textContent='画質：'+(high?'高':'軽量')};
function staticFree(x,z,r=.34){if(indoorIndex>=0){const room=rooms[indoorIndex];return Math.abs(x-room.x)<room.w/2-.65-r&&Math.abs(z-room.z)<room.d/2-.65-r&&![...room.wallBlocks,...room.furnitureBlocks].some(b=>Math.abs(x-room.x-b.x)<b.w/2+r&&Math.abs(z-room.z-b.z)<b.d/2+r);}if(Math.abs(x)>34-r||z>17-r||z< -59+r)return false;for(const c of colliders)if(Math.abs(x-c.x)<c.w/2+r&&Math.abs(z-c.z)<c.d/2+r)return false;return true}
function free(x,z){if(!staticFree(x,z))return false;if(indoorIndex>=0)return !rooms[indoorIndex].people.some(n=>Math.hypot(rooms[indoorIndex].x+n.g.position.x-x,rooms[indoorIndex].z+n.g.position.z-z)<1.2);for(const n of npcs)if(Math.abs(n.g.position.x-x)<.73&&Math.abs(n.g.position.z-z)<.73)return false;return true}
// Townsfolk stay on walkable streets, separate from each other and avoid the player.
let npcTick=0;
function updateCitizens(dt){npcTick++;for(let i=0;i<npcs.length;i++){const n=npcs[i],p=n.g.position;
 if(n.wait>0){n.wait-=dt;setMotion(n.animation,false);continue}
 if(Math.hypot(p.x-player.position.x,p.z-player.position.z)<1.65){n.wait=.3;setMotion(n.animation,false);continue}
 if(Math.hypot(p.x-n.homeX,p.z-n.homeZ)>8)n.heading=Math.atan2(n.homeX-p.x,n.homeZ-p.z);
 if(npcTick%16===i%16&&Math.random()<.12)n.heading+=(Math.random()-.5)*1.2;
 const step=n.pace*dt,dx=Math.sin(n.heading)*step,dz=Math.cos(n.heading)*step;
 const nx=p.x+dx,nz=p.z+dz;
 let open=staticFree(nx,nz,.43)&&Math.hypot(nx-player.position.x,nz-player.position.z)>1.3;
 if(open){for(let j=0;j<npcs.length;j++){if(i===j)continue;const q=npcs[j].g.position;if(Math.abs(nx-q.x)<.8&&Math.abs(nz-q.z)<.8){open=false;break}}}
 if(open){p.x=nx;p.z=nz;n.g.rotation.y+=Math.atan2(Math.sin(n.heading-n.g.rotation.y),Math.cos(n.heading-n.g.rotation.y))*Math.min(1,dt*6);setMotion(n.animation,true)}else{n.heading+=(Math.random()-.5)*2.8;n.wait=.5+Math.random()*1.8;setMotion(n.animation,false)}
 if(Math.random()<dt*.05)n.wait=.7+Math.random()*2.2;
 }}
// Explicitly fade geometry that blocks the camera instead of letting foliage cover the player.
const fadeItems=[];for(const obj of scene.children){if(!(obj instanceof THREE.Group))continue;if(obj===player||npcs.some(n=>n.g===obj))continue;let meshes=[];obj.traverse(child=>{if(child.isMesh){child.material=child.material.clone();child.material.transparent=true;meshes.push(child)}});if(meshes.length)fadeItems.push({obj,meshes})}
let frameCount=0;
function updateVisibility(cam){
 // Fade ALL walls, roofs and foliage intersecting the player-camera view.
 const a=player.position, vx=cam.x-a.x, vz=cam.z-a.z, len2=vx*vx+vz*vz;
 for(const item of fadeItems){
  const o=item.obj, wx=o.position.x-a.x,wz=o.position.z-a.z;
  const t=len2>0?(wx*vx+wz*vz)/len2:0;
  const cx=wx-Math.max(0,Math.min(1,t))*vx,cz=wz-Math.max(0,Math.min(1,t))*vz;
  const radius=Math.max(1.9,Math.min(5.5,Math.max(o.userData?.fadeRadius||0,3.3)));
  const between=t>-.1&&t<1.1&&Math.hypot(cx,cz)<radius;
  const alpha=between?.12:1;
  for(const mesh of item.meshes){
   mesh.material.opacity=alpha;
   mesh.material.depthWrite=!between;
  }
 }
}
const clock=new THREE.Clock();let camPos=new THREE.Vector3(0,9.6,16);function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;updateHouseButton();let inputX=stickX,inputZ=stickY;
const keyboardX=(keyDown.has('right')?1:0)-(keyDown.has('left')?1:0);
const keyboardZ=(keyDown.has('down')?1:0)-(keyDown.has('up')?1:0);
if(keyboardX||keyboardZ){const m=Math.hypot(keyboardX,keyboardZ);inputX=keyboardX/m;inputZ=keyboardZ/m;}
const strength=Math.min(1,Math.hypot(inputX,inputZ));
const walking=!speaking&&strength>.09;
const dashPressed=walking&&(strength>.87||keyDown.has('shift'));
let dx=0,dz=0;
if(walking){
 // Forward on the stick means forward relative to the rotated camera.
 const forward=-inputZ,side=inputX;
 dx=side*Math.cos(cameraYaw)-forward*Math.sin(cameraYaw);
 dz=-side*Math.sin(cameraYaw)-forward*Math.cos(cameraYaw);
 const speed=dashPressed?12:5.5*Math.max(.35,strength/.82);
 const nx=player.position.x+dx*speed*dt,nz=player.position.z+dz*speed*dt;
 if(free(nx,player.position.z))player.position.x=nx;
 if(free(player.position.x,nz))player.position.z=nz;
 const face=Math.atan2(dx,dz);
 player.rotation.y+=Math.atan2(Math.sin(face-player.rotation.y),Math.cos(face-player.rotation.y))*Math.min(1,dt*12);
}
$('#input-status').textContent=(dashPressed?'ダッシュ中':'移動：'+(walking?'歩行':'停止'))+' · カメラ連動360°スティック';
setMotion(playerAnim,walking);if(indoorIndex<0)updateCitizens(dt);for(const entry of mixers){const motion=!!entry.group.userData.chibi?.moving;if(entry.walkAction&&entry.walkAction!==entry.idleAction){entry.walkAction.setEffectiveWeight(motion?1:0);entry.idleAction.setEffectiveWeight(motion?0:1)}entry.mixer.update(dt);}
// Orbit camera: swipe the world to rotate around the player; about 2x farther.
const lookAheadX=dx*1.0,lookAheadZ=dz*1.0;
const distance=indoorIndex>=0?19.0:(walking?33.0:30.0);
const horizontal=distance*Math.cos(indoorIndex>=0?.85:cameraPitch),height=distance*Math.sin(indoorIndex>=0?.85:cameraPitch);
const centerX=player.position.x+lookAheadX*.6,centerZ=player.position.z+lookAheadZ*.6;
let desired;
if(indoorIndex>=0){
 // Player-following indoor orbit camera: touch swipe rotates it like outdoors.
 // Open ceiling and no exterior meshes prevent wall and roof occlusion.
 const indoorPitch=Math.max(.48,Math.min(1.16,cameraPitch));
 const room=rooms[indoorIndex];
 // v4.2: elevated indoor tactical camera, with its position restricted to room bounds.
 // Prevent the camera from moving behind a room wall or pointing through partitions.
 // v4.2: low third-person indoor camera rather than top-down tactical view.
 const safePitch=Math.max(.38,Math.min(.80,indoorPitch));
 const indoorHorizontal=12.0;
 const indoorHeight=1.5+indoorHorizontal*Math.tan(safePitch);
 const targetX=player.position.x,targetZ=player.position.z;
 const roomInset=2.5;
 const minX=room.x-room.w/2+roomInset,maxX=room.x+room.w/2-roomInset;
 const minZ=room.z-room.d/2+roomInset,maxZ=room.z+room.d/2-roomInset;
 desired=new THREE.Vector3(
  THREE.MathUtils.clamp(targetX+Math.sin(cameraYaw)*indoorHorizontal,minX,maxX),
  indoorHeight,
  THREE.MathUtils.clamp(targetZ+Math.cos(cameraYaw)*indoorHorizontal,minZ,maxZ));
 camPos.lerp(desired,Math.min(1,dt*7));
 // v4.2: partition geometry is detached when the room is entered.
 // Collision logic remains unchanged; only partition meshes and decorative frames are hidden.
 for(const partition of room.partitionMeshes)partition.visible=true;
 camera.position.copy(camPos);
 camera.up.set(0,1,0);
 camera.lookAt(targetX,1.5,targetZ);

}else{
 desired=new THREE.Vector3(centerX+Math.sin(cameraYaw)*horizontal,player.position.y+height,centerZ+Math.cos(cameraYaw)*horizontal);
 camPos.lerp(desired,Math.min(1,dt*3.1));camera.position.copy(camPos);
 camera.up.set(0,1,0);
 camera.lookAt(centerX,1.7,centerZ);
}
if(indoorIndex<0)updateVisibility(camera.position);updateModels(dt);renderer.render(indoorIndex>=0?indoorScene:scene,camera);}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop();setTimeout(()=>{Promise.resolve(setupCharacters()).catch(e=>{console.error('3D model load failed',e);finishStartup()});},80);setTimeout(finishStartup,12000);
