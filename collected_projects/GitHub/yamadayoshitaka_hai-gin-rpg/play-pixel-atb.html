<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#131629"><title>灰銀のレゾナンス — 2D ATB</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#111426;color:#f8f0df;font-family:system-ui,"Noto Sans JP",sans-serif;overflow:hidden}#wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;gap:5px}#header{width:min(100%,860px);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#e5c990}canvas{display:block;width:min(100%,860px);height:auto;max-height:65dvh;object-fit:contain;image-rendering:pixelated;background:#101326;border:3px solid #ad9456;border-radius:4px}#panel{width:min(100%,860px);min-height:122px;background:#1a213b;border:3px double #bda76d;border-radius:8px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px}#commands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}button,select{background:#2b385c;border:2px solid #bca778;border-radius:5px;color:white;min-height:42px;font-size:15px;font-weight:700;touch-action:manipulation}button:disabled{opacity:.42}button:active{background:#566d9b}#status{font-size:12px;line-height:1.55}#status b{color:#efcd77}#pad{display:none;grid-template-columns:repeat(3,49px);grid-template-rows:repeat(2,43px);gap:4px;justify-content:center}#pad button{min-height:42px}#dialog{font-size:14px;align-self:center;line-height:1.7}#footer{font-size:11px;color:#aab6cf;text-align:center}#job{max-width:142px;min-height:32px;font-size:12px}@media(max-height:680px){canvas{max-height:55dvh}#panel{min-height:105px}button{min-height:38px}#wrap{gap:2px}} </style></head><body><div id="wrap"><div id="header"><strong>灰銀のレゾナンス <small>PIXEL ATB v1.0</small></strong><select id="job" aria-label="職業"></select></div><canvas id="scene" width="320" height="192" aria-label="2Dドット絵 RPG画面"></canvas><div id="panel"><div id="commands"></div><div id="status"></div></div><div id="footer">街を歩くと敵に遭遇します • スマホ操作対応 • 自動セーブ</div></div>
<script type="module">
import {PLAYER_JOBS} from './src/game-content.js';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
const W=320,H=192,T=16;
const MAP=[
'####################',
'#....g..g..........#',
'#...gg..g....t.....#',
'#..ggg.......t.....#',
'#...........tt.....#',
'#...............g..#',
'#..######..........#',
'#..#....#..........#',
'#..#....#...gg.....#',
'#..###.##....gg....#',
'#..................#',
'####################'];
const jobIds=['swordsman','monk','rogue','mage','priest','archer'];
let saved={};try{saved=JSON.parse(localStorage.getItem('hai-gin-pixel-v1')||'{}')}catch{}
const hero={x:Math.min(18,Math.max(1,saved.x??10)),y:Math.min(10,Math.max(1,saved.y??8)),hp:saved.hp??90,maxHp:90,mp:saved.mp??35,maxMp:35,lv:saved.lv??1,exp:saved.exp??0,gold:saved.gold??50,potions:saved.potions??3,job:jobIds.includes(saved.job)?saved.job:'swordsman',atb:0,guard:false};
const party=[hero];const jobSelector=$('job');for(const id of jobIds){const opt=document.createElement('option');opt.value=id;opt.textContent=PLAYER_JOBS[id].label;jobSelector.appendChild(opt);}jobSelector.value=hero.job;
let mode='field',enemies=[],ready=false,selection=null,message='城下町。草むらには魔物が潜んでいる。',floating=[],phase=0,elapsed=0,encounterSteps=0,last=performance.now(),screenShake=0,menu='main',enemySeed=0;
function save(){try{localStorage.setItem('hai-gin-pixel-v1',JSON.stringify({x:hero.x,y:hero.y,hp:hero.hp,mp:hero.mp,lv:hero.lv,exp:hero.exp,gold:hero.gold,potions:hero.potions,job:hero.job}))}catch{}}
const rng=(n)=>Math.floor(Math.random()*n);
const palettes={swordsman:['#d0baba','#5286b3','#5a4253'],monk:['#dfb9a0','#b95b4d','#5b3c3b'],rogue:['#d0b4a7','#56926e','#343b55'],mage:['#e1c1b5','#9e70c9','#443f70'],priest:['#dfc5a6','#ede2b7','#6388a8'],archer:['#d9b29c','#56885d','#57432c']};
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function sprite(x,y,palette,scale=1,enemy=false,anim=0){const [skin,cloth,shade]=palette;const px=(a,b,w,h,c)=>rect(x+a*scale,y+b*scale,w*scale,h*scale,c);px(3,0,6,2,shade);px(2,2,8,6,skin);px(3,4,2,1,'#2c2836');px(8,4,2,1,'#2c2836');px(1,8,10,8,cloth);px(0,9,2,7,skin);px(10,9,2,7,skin);px(2,15,4,3+((anim|0)%2),shade);px(7,15,4,3+((anim+1|0)%2),shade);if(enemy){px(2,0,2,2,'#e5c76d');px(8,0,2,2,'#e5c76d')}else if(hero.job==='swordsman'){px(11,2,2,13,'#c5d8ed');px(10,11,4,2,'#e4c267')}}
function paintField(){rect(0,0,W,H,'#26472c');for(let y=0;y<12;y++)for(let x=0;x<20;x++){const t=MAP[y][x],px=x*T,py=y*T;rect(px,py,T,T,((x*3+y*7)%7<3)?'#4c7441':'#527a43');if(t==='#'){rect(px,py+1,16,15,'#69645d');rect(px+2,py,12,4,'#aca08c');rect(px,py+11,16,5,'#49464a')}if(t==='t'){rect(px+6,py+8,5,7,'#745539');rect(px+1,py+1,14,11,'#235340');rect(px+4,py,9,9,'#34794a')}if(t==='g'){for(let i=0;i<5;i++)rect(px+((i*5+x)%12),py+((i*7+y)%13),2,4,'#86b653')}}sprite(hero.x*T+2,hero.y*T-3,palettes[hero.job],1,false,phase>>3);rect(7,7,158,16,'#1a2439');ctx.fillStyle='#f6e9c8';ctx.font='9px monospace';ctx.fillText('城下町  /  LV '+hero.lv+'   '+hero.gold+' G',12,18);rect(2,172,316,18,'#1d2440');ctx.fillStyle='#f1d8a5';ctx.fillText(message.slice(0,49),8,184)}
function battleground(){rect(0,0,W,H,'#252b49');for(let i=0;i<14;i++)rect(0,i*9,W,1,i%2?'#303553':'#373a5d');rect(0,126,320,66,'#313e48');rect(0,132,320,3,'#71806b');for(let i=0;i<320;i+=12)rect(i,145+(i%4),7,2,'#525e58');rect(0,0,320,24,'#151a32');ctx.font='10px monospace';ctx.fillStyle='#f3dfad';ctx.fillText('魔物があらわれた！',9,15);enemies.forEach((e,i)=>{if(e.hp<=0)return;const x=31+i*67,y=73+Math.sin(elapsed*2+i)*2;sprite(x,y,e.palette,3,true,phase>>4);rect(x-2,y-12,42,5,'#442d41');rect(x-2,y-12,Math.max(0,42*e.hp/e.maxHp),5,'#d77b67');ctx.fillStyle='#fff4d6';ctx.font='8px monospace';ctx.fillText(e.name,x-4,y-17)});sprite(252,107,palettes[hero.job],2,false,phase>>3);rect(245,94,66,5,'#263349');rect(245,94,66*hero.hp/hero.maxHp,5,'#69cfa0');if(hero.atb>=100){rect(229,146,86,12,'#c6ac68');ctx.fillStyle='#20273a';ctx.font='9px monospace';ctx.fillText('COMMAND READY',232,155)}for(const f of floating){ctx.fillStyle=f.color;ctx.font='bold 12px monospace';ctx.fillText(f.text,f.x,f.y)}rect(3,174,314,16,'#1a2036');ctx.fillStyle='#fff0cf';ctx.font='9px monospace';ctx.fillText(message.slice(0,54),7,185);if(screenShake>0)screenShake=Math.max(0,screenShake-.08)}
function render(){ctx.save();if(screenShake>0)ctx.translate(rng(3)-1,rng(3)-1);if(mode==='field')paintField();else battleground();ctx.restore()}
function updateControls(){const c=$('commands'),status=$('status');c.replaceChildren();function btn(label,fn,disabled=false){const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=fn;c.appendChild(b)}
if(mode==='field'){const dirs=[['↑',0,-1],['←',-1,0],['→',1,0],['↓',0,1]];dirs.forEach(([label,x,y])=>btn(label,()=>move(x,y)));btn('宿屋 10G',()=>{if(hero.gold<10){message='ゴールドが足りない';return}hero.gold-=10;hero.hp=hero.maxHp;hero.mp=hero.maxMp;message='宿屋で体力と魔力が回復した！';save()});btn('戦闘テスト',startBattle)}
else if(mode==='battle'){const can=hero.atb>=100&&ready;if(menu==='main'){btn('たたかう',()=>choose('attack'),!can);btn('まほう',()=>{menu='magic';updateControls()},!can);btn('とくぎ',()=>{menu='skill';updateControls()},!can);btn('アイテム',()=>{menu='item';updateControls()},!can);btn('ぼうぎょ',()=>act('guard'),!can);btn('にげる',()=>act('flee'),!can)}else{const back=()=>{menu='main';updateControls()};if(menu==='magic'){btn('ファイア MP6',()=>act('magic'),!can||hero.mp<6);btn('ケアル MP5',()=>act('heal'),!can||hero.mp<5)}if(menu==='skill')btn(PLAYER_JOBS[hero.job].skill+' MP4',()=>act('skill'),!can||hero.mp<4);if(menu==='item')btn('ポーション ×'+hero.potions,()=>act('potion'),!can||!hero.potions);btn('もどる',back)}}
else btn('街へ戻る',()=>{mode='field';message='冒険は続く。';updateControls();save()});
status.innerHTML='<b>'+PLAYER_JOBS[hero.job].label+' LV'+hero.lv+'</b><br>HP '+hero.hp+'/'+hero.maxHp+'　MP '+hero.mp+'/'+hero.maxMp+'<br>ATB '+Math.round(hero.atb)+'% '+(ready?'【入力可能】':'')+'<br>EXP '+hero.exp+'　'+hero.gold+'G　薬 '+hero.potions+'個'}
function move(dx,dy){if(mode!=='field')return;const x=hero.x+dx,y=hero.y+dy;if(!MAP[y]||MAP[y][x]==='#'||MAP[y][x]==='t'){message='先へ進めない';return}hero.x=x;hero.y=y;encounterSteps++;if((MAP[y][x]==='g'&&encounterSteps>=4&&Math.random()<.35)||encounterSteps>=16){startBattle();return}save();updateControls()}
function startBattle(){mode='battle';encounterSteps=0;hero.atb=0;hero.guard=false;ready=false;menu='main';const count=1+rng(2);enemies=Array.from({length:count},(_,i)=>({name:i?'コウモリ':'スライム',hp:26+hero.lv*7,maxHp:26+hero.lv*7,atb:rng(35),speed:7+rng(5),attack:5+hero.lv*2,palette:i?['#a696b9','#55517f','#31354e']:['#a6e4ba','#458d89','#315d66']}));message='敵が現れた！';updateControls()}
function float(text,x,y,color='#ffe1a1'){floating.push({text,x,y,life:.7,color})}
function choose(kind){selection=kind;act(kind)}
function act(kind){if(mode!=='battle'||hero.atb<100||!ready)return;const live=enemies.filter(e=>e.hp>0);const enemy=live[0];if(!enemy&&kind!=='heal')return;let dmg=0;hero.guard=false;if(kind==='flee'){if(Math.random()<.72){message='うまく逃げ切った！';mode='field';updateControls();return}else message='逃げられなかった！'}
else if(kind==='guard'){hero.guard=true;message='身を守っている'}
else if(kind==='potion'){hero.potions--;const recover=Math.min(40,hero.maxHp-hero.hp);hero.hp+=recover;float('+'+recover,255,96,'#8ef0bb');message='ポーションを使った'}
else if(kind==='heal'){hero.mp-=5;const recover=Math.min(32,hero.maxHp-hero.hp);hero.hp+=recover;float('+'+recover,255,96,'#8ef0bb');message='ケアル！'}
else{if(kind==='magic'){hero.mp-=6;dmg=27+hero.lv*4;message='ファイア！'}else if(kind==='skill'){hero.mp-=4;dmg=Math.round(21+hero.lv*4+PLAYER_JOBS[hero.job].damage*.6);message=PLAYER_JOBS[hero.job].skill+'！'}else{dmg=Math.round(9+hero.lv*3+PLAYER_JOBS[hero.job].damage*.45+rng(6));message='攻撃！'}enemy.hp=Math.max(0,enemy.hp-dmg);float('-'+dmg,40+enemies.indexOf(enemy)*67,62);screenShake=.2}
hero.atb=0;ready=false;menu='main';if(enemies.every(e=>e.hp<=0)){const xp=10+hero.lv*4+enemies.length*6,gold=8+enemies.length*5;hero.exp+=xp;hero.gold+=gold;message='勝利！ '+xp+' EXP / '+gold+' G';if(hero.exp>=hero.lv*24){hero.exp=0;hero.lv++;hero.maxHp+=9;hero.maxMp+=4;hero.hp=hero.maxHp;hero.mp=hero.maxMp;message+=' レベルアップ！'}mode='result';save()}updateControls()}
function tick(dt){elapsed+=dt;phase++;floating=floating.filter(f=>(f.life-=dt)>0);for(const f of floating)f.y-=dt*22;if(mode==='battle'){hero.atb=Math.min(100,hero.atb+dt*(19+hero.lv*.6));if(hero.atb>=100&&!ready){ready=true;message='コマンドを選択してください';updateControls()}for(const e of enemies){if(e.hp<=0)continue;e.atb+=dt*e.speed;if(e.atb>=100){e.atb=0;const dmg=Math.max(1,Math.round(e.attack*(hero.guard?.35:1)+rng(4)));hero.hp=Math.max(0,hero.hp-dmg);float('-'+dmg,254,88,'#f5a5a9');screenShake=.18;message=e.name+'の攻撃！';if(hero.hp<=0){mode='result';hero.hp=1;hero.gold=Math.max(0,hero.gold-15);message='全滅… ゴールドを落として街に戻った';hero.x=10;hero.y=8;save()}updateControls()}}}render();if(phase%8===0)$('status').innerHTML=$('status').innerHTML.replace(/ATB \d+%/,'ATB '+Math.round(hero.atb)+'%')}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);requestAnimationFrame(frame)}
jobSelector.onchange=()=>{if(mode==='battle'){jobSelector.value=hero.job;message='戦闘中は転職できません';return}hero.job=jobSelector.value;message=PLAYER_JOBS[hero.job].label+'に転職した！';save();updateControls()};
document.addEventListener('keydown',e=>{const keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(keys[e.key]){e.preventDefault();move(...keys[e.key])}else if(mode==='battle'&&hero.atb>=100&&e.key==='Enter')act('attack')});
updateControls();requestAnimationFrame(frame);window.__pixelRpgQA=()=>({mode,job:hero.job,hp:hero.hp,atb:hero.atb,enemies:enemies.length,version:'pixel-atb-1.0'});
</script></body></html>
