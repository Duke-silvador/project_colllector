<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>剣士 モーションキャプチャー実験</title><style>html,body{margin:0;height:100%;background:#0c1119;color:#fff;font-family:system-ui}#hud{position:absolute;top:12px;left:12px;right:12px;z-index:2}h2{font-size:18px;margin:0 0 6px}p{font-size:12px;color:#c9d3df;margin:5px 0}#controls{position:absolute;bottom:14px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:7px;z-index:2}button{background:#26374a;color:white;border:1px solid #879bb1;border-radius:9px;padding:12px;font-size:13px}button:disabled{opacity:.4}#cam{position:absolute;right:10px;top:100px;width:116px;max-height:160px;object-fit:cover;transform:scaleX(-1);border:1px solid #879bb1;border-radius:8px;display:none}#err{color:#ffb7a4}</style></head><body><div id="hud"><h2>剣士・片手剣歩行 v4</h2><p>初期状態：歩行 1.5倍／右手に片手剣（姿勢推定も利用可能）</p><p id="status">3Dを初期化中…</p><p id="err"></p></div><video id="cam" autoplay muted playsinline></video><div id="controls"><button id="videoBtn">動画を読み込む</button><button id="saveMotion">動きを保存</button><button id="replayMotion">保存した動きを再生</button><input id="videoFile" type="file" accept="video/*" style="display:none"><video id="sourceVideo" playsinline muted controls style="display:none;position:absolute;top:230px;right:10px;width:130px;max-height:110px;z-index:3"></video><button id="capture">カメラで動きを取得</button><button id="walk">歩行デモ</button><button id="slash">斬撃デモ</button><button id="stop">停止</button><button id="turn">回転</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0c1119);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,80);camera.position.set(0,1.4,5.7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.15,0);orbit.update();scene.add(new THREE.HemisphereLight(0xe9f0ff,0x303744,2));const lamp=new THREE.DirectionalLight(0xffffff,2.5);lamp.position.set(-2,5,4);scene.add(lamp);const floor=new THREE.Mesh(new THREE.CircleGeometry(2,80),new THREE.MeshStandardMaterial({color:0x293646,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const rig=new THREE.Group();scene.add(rig);const skin=new THREE.MeshStandardMaterial({color:0xc89c7f,roughness:.8}),cloth=new THREE.MeshStandardMaterial({color:0x24384e,roughness:.8}),metal=new THREE.MeshStandardMaterial({color:0x8195a8,metalness:.65,roughness:.35}),gold=new THREE.MeshStandardMaterial({color:0xc8a768,metalness:.7,roughness:.3});const joints={};for(const id of ['head','neck','hip','ls','rs','le','re','lw','rw','lh','rh','lk','rk','la','ra']){let mesh=new THREE.Mesh(new THREE.SphereGeometry(id==='head'?.13:.055,16,12),id==='head'?skin:metal);rig.add(mesh);joints[id]=mesh}
const bones={};for(const [name,a,b,r,m] of [['spine','hip','neck',.105,cloth],['neckbone','neck','head',.065,skin],['lupper','ls','le',.07,cloth],['rupper','rs','re',.07,cloth],['lfore','le','lw',.055,metal],['rfore','re','rw',.055,metal],['lthigh','lh','lk',.085,cloth],['rthigh','rh','rk',.085,cloth],['lshin','lk','la',.065,metal],['rshin','rk','ra',.065,metal],['shoulders','ls','rs',.10,metal],['pelvis','lh','rh',.10,cloth]]){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,12),m);rig.add(mesh);bones[name]={mesh,a,b}}
const blade=new THREE.Mesh(new THREE.BoxGeometry(.055,.76,.025),metal),handle=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.24,10),gold),guard=new THREE.Mesh(new THREE.BoxGeometry(.28,.04,.06),gold);rig.add(blade,handle,guard);const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function setPose(p){for(const k in p)if(joints[k])joints[k].position.copy(p[k]);for(const o of Object.values(bones)){const a=joints[o.a].position,b=joints[o.b].position,d=new THREE.Vector3().subVectors(b,a);o.mesh.position.copy(a).addScaledVector(d,.5);o.mesh.scale.set(1,d.length(),1);o.mesh.quaternion.setFromUnitVectors(V(0,1,0),d.normalize())}const wrist=joints.rw.position,elbow=joints.re.position;const dir=new THREE.Vector3().subVectors(wrist,elbow).normalize();if(dir.length()<.5)dir.set(0,1,0);const orient=new THREE.Quaternion().setFromUnitVectors(V(0,1,0),dir);handle.quaternion.copy(orient);guard.quaternion.copy(orient);blade.quaternion.copy(orient);handle.position.copy(wrist).addScaledVector(dir,.04);guard.position.copy(wrist).addScaledVector(dir,.16);blade.position.copy(wrist).addScaledVector(dir,.56)}
function defaultPose(t,mode){let w=mode==='walk'?Math.sin(t*5*WALK_SPEED):0;const p={hip:V(0,1.04,0),neck:V(0,1.63,0),head:V(0,1.87,0),ls:V(-.26,1.55,0),rs:V(.26,1.55,0),lh:V(-.12,1.01,0),rh:V(.12,1.01,0)};p.le=V(-.4,1.31,mode==='walk'?w*.16:0);p.re=V(.4,1.31,mode==='walk'?-w*.16:0);p.lw=V(-.43,1.08,mode==='walk'?w*.27:0);p.rw=V(.43,1.08,mode==='walk'?-w*.27:0);p.lk=V(-.12,.57,mode==='walk'?-w*.17:0);p.rk=V(.12,.57,mode==='walk'?w*.17:0);p.la=V(-.12,.12,mode==='walk'?-w*.27:0);p.ra=V(.12,.12,mode==='walk'?w*.27:0);if(mode==='slash'){let s=Math.sin(t*2.8);p.re=V(.34,1.52,-.2);p.rw=V(.05+s*.46,1.68+s*.2,-.4);p.le=V(-.32,1.32,-.12);p.lw=V(-.25,1.19,-.23)}return p}
let mode='walk',landmarker=null,stream=null,rot=false,last=0;const WALK_SPEED=1.5;let motionFrames=[],replayStart=0,recordStart=0,videoUrl=null;const sourceVideo=document.querySelector('#sourceVideo');const status=document.querySelector('#status'),err=document.querySelector('#err'),video=document.querySelector('#cam');const closeCam=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.style.display='none'};document.querySelector('#walk').onclick=()=>{closeCam();mode='walk';status.textContent='歩行 1.5倍／片手剣装備（手動生成モーション）'};document.querySelector('#slash').onclick=()=>{closeCam();mode='slash';status.textContent='斬撃デモ（手動設定ポーズ・モーションキャプチャーではありません）'};document.querySelector('#stop').onclick=()=>{closeCam();mode='idle';status.textContent='停止'};document.querySelector('#turn').onclick=()=>{rot=!rot};
document.querySelector('#capture').onclick=async()=>{try{err.textContent='';status.textContent='姿勢推定モデルを読み込み中…';const {PoseLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');landmarker=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'CPU'},runningMode:'VIDEO',numPoses:1});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();video.style.display='block';mode='capture';status.textContent='ライブ姿勢推定中：全身をカメラに映してください'}catch(e){err.textContent='カメラ・姿勢推定を開始できません: '+e.message;status.textContent='デモモードは利用できます';closeCam()}};

async function ensurePose(){if(landmarker)return;const {PoseLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');landmarker=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'CPU'},runningMode:'VIDEO',numPoses:1})}
const fileInput=document.querySelector('#videoFile');document.querySelector('#videoBtn').onclick=()=>fileInput.click();
fileInput.onchange=async()=>{const file=fileInput.files?.[0];if(!file)return;try{closeCam();status.textContent='動画解析モデルを読み込み中…';await ensurePose();if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(file);sourceVideo.src=videoUrl;sourceVideo.style.display='block';sourceVideo.currentTime=0;await sourceVideo.play();motionFrames=[];mode='video';status.textContent='動画を解析中（全身が映る動画を推奨）'}catch(e){err.textContent='動画読み込み失敗: '+e.message}};
function getPoseFrom(source,time){if(!landmarker||source.readyState<2)return null;const result=landmarker.detectForVideo(source,time);const l=result.landmarks?.[0];if(!l)return null;const at=i=>V((.5-l[i].x)*2.4,(1-l[i].y)*2.8-.15,-l[i].z*1.5);const mid=(a,b)=>at(a).add(at(b)).multiplyScalar(.5);const p={head:at(0),neck:mid(11,12),hip:mid(23,24),ls:at(11),rs:at(12),le:at(13),re:at(14),lw:at(15),rw:at(16),lh:at(23),rh:at(24),lk:at(25),rk:at(26),la:at(27),ra:at(28)};const dy=1.02-p.hip.y;for(const k in p)p[k].y+=dy;return p}
function serialPose(p){const o={};for(const k in p)o[k]=p[k].toArray();return o}
function restorePose(p){const o={};for(const k in p)o[k]=new THREE.Vector3(...p[k]);return o}
document.querySelector('#saveMotion').onclick=()=>{if(!motionFrames.length){err.textContent='保存する動きがありません。動画を再生してください';return}const data=JSON.stringify({format:'hai-gin-motion-v1',fps:20,frames:motionFrames});const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='swordsman-motion.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent=motionFrames.length+'フレームのモーションデータを保存'};
document.querySelector('#replayMotion').onclick=()=>{if(!motionFrames.length){err.textContent='再生する動きがありません';return}closeCam();sourceVideo.pause();mode='replay';replayStart=performance.now();status.textContent='抽出したモーションを3Dで再生中'};
sourceVideo.onended=()=>{if(mode==='video'){mode='replay';replayStart=performance.now();status.textContent='動画解析完了：'+motionFrames.length+'フレーム。3Dで再生中'}};
function capturePose(now){if(!landmarker||video.readyState<2)return null;const result=landmarker.detectForVideo(video,now);const l=result.landmarks?.[0];if(!l)return null;const at=i=>V((.5-l[i].x)*2.4,(1-l[i].y)*2.8-.15,-l[i].z*1.5);const mid=(a,b)=>at(a).add(at(b)).multiplyScalar(.5);const p={head:at(0),neck:mid(11,12),hip:mid(23,24),ls:at(11),rs:at(12),le:at(13),re:at(14),lw:at(15),rw:at(16),lh:at(23),rh:at(24),lk:at(25),rk:at(26),la:at(27),ra:at(28)};const h=p.hip.y;p.hip.y=1.02;const dy=1.02-h;for(const k in p)if(k!=='hip')p[k].y+=dy;return p}
setPose(defaultPose(0,'walk'));status.textContent='歩行 1.5倍／片手剣装備：再生中（手動生成モーション）';function tick(t){requestAnimationFrame(tick);if(mode==='video'){if(t-last>50){last=t;try{const p=getPoseFrom(sourceVideo,t);if(p){setPose(p);if(motionFrames.length<18000)motionFrames.push({t:sourceVideo.currentTime,p:serialPose(p)})}}catch(e){err.textContent=e.message;mode='idle'}}}else if(mode==='replay'){if(motionFrames.length){const elapsed=(t-replayStart)/1000;const duration=motionFrames[motionFrames.length-1].t||1;const at=elapsed%duration;let lo=0,hi=motionFrames.length-1;while(lo<hi){const m=(lo+hi)>>1;if(motionFrames[m].t<at)lo=m+1;else hi=m}setPose(restorePose(motionFrames[lo].p))}}else if(mode==='capture'){if(t-last>50){last=t;try{const p=capturePose(t);if(p)setPose(p)}catch(e){err.textContent=e.message;mode='idle'}}}else setPose(defaultPose(t/1000,mode));if(rot)rig.rotation.y+=.008;orbit.update();renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
