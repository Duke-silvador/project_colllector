<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰銀のレゾナンス 自動テスト状態</title><style>body{font:16px system-ui,sans-serif;background:#111827;color:#f9fafb;max-width:720px;margin:0 auto;padding:24px}h1{font-size:24px}.panel{background:#1f2937;padding:20px;border-radius:16px;margin:16px 0}.state{font-size:28px;font-weight:750}.note{color:#cbd5e1}a{color:#93c5fd}button{font:inherit;padding:11px;background:#334155;color:white;border:1px solid #64748b;border-radius:8px}ul{padding-left:22px}li{padding:9px 0}time{font-size:13px;color:#cbd5e1}</style></head><body><h1>灰銀のレゾナンス — 戦闘テスト</h1><p class="note">GitHub Actionsの実行状態を60秒ごとに自動更新。テスト画面の画像・録画は各実行のArtifactsから確認できます。</p><section class="panel" aria-live="polite"><div id="state" class="state">取得中…</div><p id="detail"></p><p id="updated"></p><button id="refresh">今すぐ更新</button></section><h2>最近の実行</h2><ul id="runs"></ul><p><a href="https://github.com/yamadayoshitaka/hai-gin-rpg/actions/workflows/battle-visual.yml">GitHub Actionsの実行一覧</a></p><script>
const endpoint='https://api.github.com/repos/yamadayoshitaka/hai-gin-rpg/actions/workflows/battle-visual.yml/runs?per_page=10';const el=id=>document.getElementById(id);
const labels={queued:'🟡 待機中',in_progress:'🟡 実行中',completed:'完了',waiting:'🟡 待機中',requested:'🟡 開始待ち',pending:'🟡 待機中'};const conclusions={success:'✅ 成功',failure:'❌ 失敗',cancelled:'⚪ キャンセル',skipped:'⚪ スキップ',timed_out:'❌ タイムアウト',action_required:'⚠️ 対応が必要',neutral:'⚪ 終了'};
async function update(){el('state').textContent='取得中…';try{const response=await fetch(endpoint,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('HTTP '+response.status);const json=await response.json();const runs=json.workflow_runs||[];if(!runs.length){el('state').textContent='⚪ 実行記録なし';el('detail').textContent='このワークフローの実行記録がありません。自動テスト成功を示す情報もありません。'}else{const recent=runs[0];el('state').textContent=recent.status==='completed'?(conclusions[recent.conclusion]||'完了（'+recent.conclusion+'）'):(labels[recent.status]||recent.status);el('detail').textContent='最終実行：'+new Date(recent.created_at).toLocaleString('ja-JP')+'／ '+recent.event+'／ '+recent.head_branch}el('runs').replaceChildren(...runs.map(r=>{const li=document.createElement('li');const a=document.createElement('a');a.href=r.html_url;a.textContent='#'+r.run_number+' '+(r.status==='completed'?(conclusions[r.conclusion]||r.conclusion):(labels[r.status]||r.status))+' — '+new Date(r.created_at).toLocaleString('ja-JP');li.append(a);return li}));}catch(e){el('state').textContent='⚠️ ステータス取得失敗';el('detail').textContent='GitHub APIへアクセスできません：'+e.message+'。取得失敗はテスト失敗を意味しません。'}el('updated').textContent='画面更新：'+new Date().toLocaleString('ja-JP')}
el('refresh').addEventListener('click',update);setInterval(update,60000);update();
</script></body></html>
