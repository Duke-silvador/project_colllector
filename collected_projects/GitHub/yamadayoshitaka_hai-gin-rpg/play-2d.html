<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>灰銀のレゾナンス 2D v125.0</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:72vh;image-rendering:pixelated;touch-action:none}#ui{height:28vh;background:#172238;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-content:start}button{font-size:17px;padding:12px;border-radius:9px;background:#304765;color:white;border:1px solid #92a8c5;touch-action:manipulation}#status{width:100%;font-size:14px}#pad{position:absolute;bottom:30vh;left:10px;display:grid;grid-template-columns:repeat(3,45px);gap:3px}#pad button{padding:9px}#menu{display:none}</style></head><body><canvas id="game"></canvas><div id="pad"><span></span><button data-d="up">▲</button><span></span><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><div id="ui"><div id="status">灰銀のレゾナンス 2D v125.0 — アリアハン風の町</div><button id="fight">戦う</button><div id="menu"><button data-a="attack">攻撃</button><button data-a="magic">魔法 MP6</button><button data-a="heal">回復 MP5</button><button data-a="defend">防御</button></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),menu=document.getElementById('menu');let W=0,H=0;function resize(){W=canvas.width=Math.floor(innerWidth);H=canvas.height=Math.floor(innerHeight*.72)}addEventListener('resize',resize);resize();const player={x:10,y:11,hp:100,mp:30},enemy={x:16,y:9,hp:85},keys=new Set();let battle=false,gauge=0,egauge=0,action=null,defending=false,msg='町を探索しよう';const tile=38;function actor(x,y,c,phase=0){ctx.save();ctx.translate(x,y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,3,12,5,0,0,7);ctx.fill();ctx.fillStyle=c;ctx.fillRect(-9,-22,18,21);ctx.fillStyle='#f1c59b';ctx.fillRect(-7,-35,14,14);ctx.fillStyle='#312739';ctx.fillRect(-8,-38,16,6);ctx.fillStyle='#26384d';ctx.fillRect(-8,-1,6,9);ctx.fillRect(2,-1,6,9);ctx.fillStyle='#e9e4d4';ctx.fillRect(-13,-19,5,13);ctx.fillRect(8,-19,5,13);ctx.restore()}function draw(){ctx.fillStyle='#4b8152';ctx.fillRect(0,0,W,H);const ox=W/2-player.x*tile,oy=H/2-player.y*tile;for(let y=0;y<22;y++)for(let x=0;x<26;x++){let px=x*tile+ox,py=y*tile+oy;if(px<-tile||py<-tile||px>W||py>H)continue;ctx.fillStyle=(x+y)%2?'#57875a':'#5d8f61';ctx.fillRect(px,py,tile,tile);if(x===10||y===11){ctx.fillStyle='#bba886';ctx.fillRect(px,py,tile,tile)}if((x===4&&y===4)||(x===17&&y===5)||(x===5&&y===16)){ctx.fillStyle='#ae7958';ctx.fillRect(px-20,py-75,160,115);ctx.fillStyle='#344a79';ctx.beginPath();ctx.moveTo(px-28,py-75);ctx.lineTo(px+60,py-120);ctx.lineTo(px+148,py-75);ctx.fill();ctx.fillStyle='#513624';ctx.fillRect(px+54,py-5,35,45)}}if(!battle){actor(W/2,H/2,'#3769ac');actor(enemy.x*tile+ox,enemy.y*tile+oy,'#9d4c65')}else{ctx.fillStyle='#122238dd';ctx.fillRect(0,0,W,H);const base=H*.7;let shift=action?Math.sin(Math.min(1,action.t/.75)*Math.PI)*Math.max(0,W*.28-70):0;actor(W*.24+shift,base,'#3769ac');actor(W*.76-shift*(action?.side==='enemy'?1:0),base,'#9d4c65');ctx.fillStyle='white';ctx.font='17px system-ui';ctx.fillText('主人公 HP '+player.hp+' MP '+player.mp,15,32);ctx.fillText('敵 HP '+enemy.hp,15,57);ctx.fillStyle='#555';ctx.fillRect(15,H-38,W-30,12);ctx.fillStyle='#e9be59';ctx.fillRect(15,H-38,(W-30)*Math.min(1,gauge/100),12);ctx.fillStyle='#fff';ctx.fillText(msg,15,H-58)}}function start(){battle=true;gauge=0;egauge=0;menu.style.display='none';msg='敵と遭遇！';status.textContent='ATB戦闘：ゲージが満ちたらコマンド選択'}document.getElementById('fight').onclick=start;document.querySelectorAll('[data-d]').forEach(b=>{const d=b.dataset.d;b.onpointerdown=e=>{e.preventDefault();keys.add(d)};b.onpointerup=b.onpointercancel=()=>keys.delete(d)});addEventListener('keydown',e=>{keys.add(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'})[e.key]||e.key)});addEventListener('keyup',e=>keys.delete(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'})[e.key]||e.key));document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(gauge<100||action)return;const a=b.dataset.a;if(a==='magic'&&player.mp<6||a==='heal'&&player.mp<5)return;if(a==='heal'){player.mp-=5;player.hp=Math.min(100,player.hp+35);msg='回復した';gauge=0;menu.style.display='none';return}if(a==='defend'){defending=true;gauge=0;menu.style.display='none';msg='防御態勢';return}if(a==='magic')player.mp-=6;action={side:'hero',t:0,damage:a==='magic'?24:15};gauge=0;menu.style.display='none';msg=a==='magic'?'魔法！':'攻撃！'});let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(battle){if(!action){gauge=Math.min(100,gauge+dt*34);egauge=Math.min(100,egauge+dt*23);if(gauge>=100)menu.style.display='flex';if(egauge>=100){action={side:'enemy',t:0,damage:defending?4:12};egauge=0;defending=false;msg='敵の攻撃！'}}else{action.t+=dt;if(action.t>=.75){if(action.side==='hero'){enemy.hp=Math.max(0,enemy.hp-action.damage);if(enemy.hp===0){battle=false;msg='勝利！';status.textContent='勝利！ 町の探索に戻りました'}}else{player.hp=Math.max(0,player.hp-action.damage);if(player.hp===0){battle=false;player.hp=100;status.textContent='敗北。町へ戻りました'}}action=null}}}else{let speed=dt*4;if(keys.has('up'))player.y-=speed;if(keys.has('down'))player.y+=speed;if(keys.has('left'))player.x-=speed;if(keys.has('right'))player.x+=speed;player.x=Math.max(0,Math.min(24,player.x));player.y=Math.max(0,Math.min(20,player.y))}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
