<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>灰銀のレゾナンス 3D ATB</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;color:#fff4d9;font-family:system-ui}#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;top:7px;left:8px;right:8px;display:flex;justify-content:space-between;gap:7px;align-items:center;pointer-events:none;text-shadow:0 2px 3px #000}#hud select,#hud button{pointer-events:auto}#bottom{position:fixed;bottom:8px;left:7px;right:7px;display:grid;grid-template-columns:1fr 1.15fr;gap:7px;max-height:42vh}#message{position:fixed;bottom:calc(min(42vh,228px) + 16px);left:8px;right:8px;background:#151b33df;border:2px solid #c6b18b;border-radius:7px;padding:9px 10px;font-size:13px;min-height:36px;text-shadow:0 1px 2px #000}#stats,#cmd{background:#161e38ea;border:2px solid #bea57a;border-radius:9px;padding:9px;min-height:154px}#stats{font-size:13px;line-height:1.85}#cmd{display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start}button,select{border:1px solid #dfc99b;border-radius:7px;background:#344665;color:white;min-height:39px;padding:5px;font-weight:700;font-size:14px;touch-action:manipulation}button:disabled{opacity:.43}#fieldControls{position:fixed;bottom:12px;left:10px;display:none;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,55px);gap:3px}#fieldControls button{background:#243c61ce}#atb{height:8px;background:#222b41;border:1px solid #9e9faa;border-radius:3px;overflow:hidden}#atbfill{height:100%;background:#6bd5d1;width:0}#statusSmall{font-size:11px;color:#cabf9d}#overlay{position:fixed;inset:0;background:#08111dba;display:none;align-items:center;justify-content:center;padding:20px}#overlay div{background:#1e2a48;border:2px solid #cbb47a;padding:20px;border-radius:12px;text-align:center}@media(min-width:760px){#bottom{max-width:620px;left:auto}#message{max-width:620px;left:auto}#fieldControls{bottom:18px}} </style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><canvas id="world"></canvas><div id="hud"><strong>灰銀のレゾナンス <small>3D ATB v1.1</small></strong><select id="jobs" aria-label="職業"></select><button id="encounter">戦闘</button></div><div id="message">3D ATB版を読み込み中…</div><div id="bottom"><section id="stats"><strong id="name">剣士</strong> LV <span id="lv">1</span><div>HP <span id="hp">100</span> ／ MP <span id="mp">40</span></div>ATB <span id="atbval">0</span>%<div id="atb"><div id="atbfill"></div></div><div id="statusSmall">街を探索 / コマンドで戦闘</div><div id="enemyStatus" aria-live="polite"></div><div id="battleOptions"></div><div id="gold"></div></section><section id="cmd"></section></div><div id="fieldControls"><span></span><button data-move="up">▲</button><span></span><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div><div id="overlay"><div id="overlaytext"></div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {PLAYER_JOBS} from './src/game-content.js';
const $=id=>document.getElementById(id),canvas=$('world'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#657c97');scene.fog=new THREE.Fog('#657c97',30,100);
const camera=new THREE.PerspectiveCamera(46,1,.1,180);const ambient=new THREE.HemisphereLight(0xfaf1e4,0x33435c,2.0);scene.add(ambient);
const sunlight=new THREE.DirectionalLight(0xffe8bd,2.3);sunlight.position.set(-8,14,9);sunlight.castShadow=true;sunlight.shadow.mapSize.set(1024,1024);scene.add(sunlight);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.86});
const grass=mat('#618454'),dirt=mat('#ad986e'),stone=mat('#737b86'),wood=mat('#68513d'),roof=mat('#775b62');
function cube(parent,w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const map=new THREE.Group();scene.add(map);cube(map,70,.3,70,grass,0,-.2,0);cube(map,8,.02,65,dirt,0,-.03,0);cube(map,55,.02,8,dirt,0,-.025,0);
for(let i=0;i<15;i++){const x=(i%2?1:-1)*(7+(i%4)*5),z=-24+(Math.floor(i/2))*7;const g=new THREE.Group();map.add(g);g.position.set(x,0,z);cube(g,4.8,3.1,4.6,stone,0,1.55,0);const r=new THREE.Mesh(new THREE.ConeGeometry(4.1,2.4,4),roof);r.rotation.y=Math.PI/4;r.position.y=4.1;g.add(r);cube(g,.95,1.8,.11,wood,0,.9,2.34)}
for(let i=0;i<28;i++){const x=(i%2?1:-1)*(17+(i%4)*4),z=-31+Math.floor(i/2)*5;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,7),wood);trunk.position.set(x,1,z);map.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.9,1),mat(i%2?'#42664d':'#376347'));crown.position.set(x,3.1,z);map.add(crown)}
const fieldActors=new THREE.Group();scene.add(fieldActors);const battleActors=new THREE.Group();battleActors.visible=false;scene.add(battleActors);
const loader=new GLTFLoader();const assets=new Map();const actorDefs={swordsman:'Knight.glb',monk:'Barbarian.glb',rogue:'Rogue.glb',mage:'Mage.glb',priest:'Mage.glb',archer:'Rogue_Hooded.glb'};
function modelAsset(id){if(!assets.has(id))assets.set(id,loader.loadAsync('./assets/characters/'+id));return assets.get(id)}
function fallback(color){const o=new THREE.Group(),body=cube(o,.72,1.0,.42,mat(color),0,1.18,0);cube(o,.50,.54,.48,mat('#dcbda3'),0,2,0);cube(o,.22,.8,.25,mat(color),-.47,1.13,0);cube(o,.22,.8,.25,mat(color),.47,1.13,0);cube(o,.25,.80,.28,mat('#4e485a'),-.21,.42,0);cube(o,.25,.80,.28,mat('#4e485a'),.21,.42,0);return o}
async function setActor(parent,id,x,z,scale=1){parent.clear();let actor;try{const model=await modelAsset(actorDefs[id]||'Knight.glb');actor=model.scene.clone(true);const bounds=new THREE.Box3().setFromObject(actor),size=bounds.getSize(new THREE.Vector3()),height=Math.max(.001,size.y);actor.scale.setScalar(scale*2.3/height);const bb=new THREE.Box3().setFromObject(actor);actor.position.y=-bb.min.y;actor.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}})}catch(e){actor=fallback('#4970a4');$('message').textContent='一部モデルの読み込みに失敗。代替表示を使用します。'}actor.position.x=x;actor.position.z=z;parent.add(actor);return actor}
const fieldHero=new THREE.Group();fieldActors.add(fieldHero);const battHero=new THREE.Group();battleActors.add(battHero);battHero.position.set(3,0,0);
const foe=new THREE.Group();battleActors.add(foe);foe.position.set(-3,0,0);
function enemyModel(){foe.clear();const root=fallback('#6d538d');root.scale.setScalar(1.18);root.rotation.y=Math.PI/2;foe.add(root)}
enemyModel();const floor=new THREE.Group();battleActors.add(floor);cube(floor,21,.35,10,mat('#514a56'),0,-.22,0);for(let i=0;i<5;i++){const stoneBlock=cube(floor,2,.3,2,mat('#777183'),-8+i*4,-.05,-3);stoneBlock.castShadow=false}
let saved={};try{saved=JSON.parse(localStorage.getItem('hai-gin-3d-atb-v1')||'{}')}catch{}
const hero={job:saved.job&&actorDefs[saved.job]?saved.job:'swordsman',x:saved.x||0,z:saved.z||0,hp:saved.hp||100,maxHp:100,mp:saved.mp??40,maxMp:40,lv:saved.lv||1,exp:saved.exp||0,gold:saved.gold??50,potion:saved.potion??3,atb:0,guard:false};
const jobs=$('jobs');for(const id of Object.keys(actorDefs)){const op=document.createElement('option');op.value=id;op.textContent=PLAYER_JOBS[id].label;jobs.appendChild(op)}jobs.value=hero.job;
let atbWait=true;let mode='field',menu='main',enemy={name:'魔物',hp:70,maxHp:70,atb:0,rate:15,atk:10},ready=false,text='街を探索できます。戦闘ボタンでATB戦闘開始。',last=performance.now(),battleEnd=0,attackAnim=0,enemyAttackAnim=0,steps=0;
function save(){try{localStorage.setItem('hai-gin-3d-atb-v1',JSON.stringify(hero))}catch{}}
function msg(t){text=t;$('message').textContent=t}
function mountHero(){setActor(fieldHero,hero.job,0,0);setActor(battHero,hero.job,0,0);battHero.position.set(3,0,0);fieldHero.position.set(hero.x,0,hero.z)}
jobs.onchange=()=>{if(mode==='battle'){jobs.value=hero.job;msg('戦闘中の転職はできません');return}hero.job=jobs.value;mountHero();save();drawControls()};
function startBattle(){if(mode!=='field')return;mode='battle';menu='main';hero.atb=0;ready=false;hero.guard=false;enemy={name:Math.random()<.5?'ゴブリン':'魔獣',hp:65+hero.lv*12,maxHp:65+hero.lv*12,atb:0,rate:14,atk:10+hero.lv*2};foe.position.set(-3,0,0);battleActors.visible=true;map.visible=false;fieldActors.visible=false;$('fieldControls').style.display='none';msg(enemy.name+' が現れた！');drawControls()}
function resolve(action){if(mode!=='battle'||hero.atb<100||!ready)return;const cost={skill:5,magic:7,heal:6}[action]||0;if(cost>hero.mp){msg('MPが足りません');return}if(action==='potion'&&hero.potion<1){msg('ポーションがありません');return}hero.atb=0;ready=false;const previousGuard=hero.guard;hero.guard=action==='guard'||previousGuard;menu='main';let dmg=0;if(action!=='guard')hero.guard=false;if(action==='attack'){dmg=Math.round(14+hero.lv*3+Math.random()*7);msg('たたかう！');attackAnim=.36}else if(action==='skill'){hero.mp-=5;dmg=Math.round(26+hero.lv*5);msg(PLAYER_JOBS[hero.job].skill+'！');attackAnim=.48}else if(action==='magic'){hero.mp-=7;dmg=38+hero.lv*5;msg('ファイア！');attackAnim=.5}else if(action==='heal'){hero.mp-=6;hero.hp=Math.min(hero.maxHp,hero.hp+34);msg('回復魔法！')}else if(action==='potion'){hero.potion--;hero.hp=Math.min(hero.maxHp,hero.hp+45);msg('ポーションを使用した！')}else if(action==='guard'){hero.guard=true;msg('防御態勢を取った！ 次の被弾を軽減')}else if(action==='flee'){if(Math.random()<.7){endBattle(false,'逃走に成功した！');return}else msg('逃走に失敗！')}enemy.hp=Math.max(0,enemy.hp-dmg);if(dmg)msg(text+' '+dmg+'ダメージ');if(enemy.hp===0){hero.exp+=14+hero.lv*4;hero.gold+=20;let line='勝利！ 経験値と20Gを獲得';if(hero.exp>=hero.lv*28){hero.exp=0;hero.lv++;hero.maxHp+=9;hero.maxMp+=5;hero.hp=hero.maxHp;hero.mp=hero.maxMp;line+=' レベルアップ！'}endBattle(true,line);return}drawControls();save()}
function endBattle(win,line){mode='result';battleEnd=1.8;msg(line);save();drawControls()}
function returnField(){mode='field';hero.atb=0;ready=false;map.visible=true;fieldActors.visible=true;battleActors.visible=false;$('fieldControls').style.display='grid';msg('街を探索中。');drawControls()}
function button(title,fn,disabled=false){const b=document.createElement('button');b.textContent=title;b.disabled=disabled;b.onclick=fn;$('cmd').appendChild(b)}
function drawControls(){const c=$('cmd');c.replaceChildren();$('encounter').disabled=mode!=='field';$('jobs').disabled=mode!=='field';const opts=$('battleOptions');opts.replaceChildren();if(mode==='battle'){const toggle=document.createElement('button');toggle.textContent=atbWait?'ATB: ウェイト':'ATB: アクティブ';toggle.title='ウェイト: コマンド選択中は敵のATBも停止';toggle.onclick=()=>{atbWait=!atbWait;drawControls()};opts.append(toggle)}if(mode==='field'){button('探索する',()=>move(0,-1));button('戦闘開始',startBattle);button('宿屋 10G',()=>{if(hero.gold<10){msg('お金が足りません');return}hero.gold-=10;hero.hp=hero.maxHp;hero.mp=hero.maxMp;msg('宿屋で回復しました');save();drawControls()});button('道具を買う 8G',()=>{if(hero.gold<8)return;hero.gold-=8;hero.potion++;save();drawControls()})}else if(mode==='battle'){if(menu==='main'){button('たたかう',()=>resolve('attack'),!ready);button('まほう',()=>{menu='magic';drawControls()},!ready);button('とくぎ',()=>resolve('skill'),!ready||hero.mp<5);button('アイテム',()=>{menu='item';drawControls()},!ready);button('ぼうぎょ',()=>resolve('guard'),!ready);button('にげる',()=>resolve('flee'),!ready)}else if(menu==='magic'){button('ファイア MP7',()=>resolve('magic'),!ready||hero.mp<7);button('ケアル MP6',()=>resolve('heal'),!ready||hero.mp<6);button('戻る',()=>{menu='main';drawControls()})}else if(menu==='item'){button('ポーション ×'+hero.potion,()=>resolve('potion'),!ready||!hero.potion);button('戻る',()=>{menu='main';drawControls()})}}else button('街へ戻る',returnField);updateHud()}
function updateHud(){$('name').textContent=PLAYER_JOBS[hero.job].label;$('lv').textContent=hero.lv;$('hp').textContent=hero.hp+'/'+hero.maxHp;$('mp').textContent=hero.mp+'/'+hero.maxMp;$('atbval').textContent=Math.floor(hero.atb);$('atbfill').style.width=hero.atb+'%';$('gold').textContent=hero.gold+'G / ポーション '+hero.potion;$('enemyStatus').textContent=mode==='battle'||mode==='result'?`${enemy.name} HP ${enemy.hp}/${enemy.maxHp} | 敵ATB ${Math.floor(enemy.atb)}%`:'';$('statusSmall').textContent=mode==='battle'?(ready?'コマンド入力可能':'ATBゲージ蓄積中'):'3Dフィールド探索'}
function move(dx,dz){if(mode!=='field')return;hero.x=THREE.MathUtils.clamp(hero.x+dx*1.25,-27,27);hero.z=THREE.MathUtils.clamp(hero.z+dz*1.25,-28,28);fieldHero.position.set(hero.x,0,hero.z);steps++;if(steps%13===0)startBattle();save()}
const pressed=new Set();document.addEventListener('keydown',e=>{pressed.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>pressed.delete(e.key.toLowerCase()));
for(const b of document.querySelectorAll('[data-move]')){const dir=b.dataset.move;const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];b.addEventListener('pointerdown',e=>{e.preventDefault();move(...d)});}
$('encounter').onclick=startBattle;
function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',size);size();returnField();mountHero();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(mode==='field'){const x=Number(pressed.has('arrowright')||pressed.has('d'))-Number(pressed.has('arrowleft')||pressed.has('a'));const z=Number(pressed.has('arrowdown')||pressed.has('s'))-Number(pressed.has('arrowup')||pressed.has('w'));if(x||z){hero.x=THREE.MathUtils.clamp(hero.x+x*dt*3.8,-27,27);hero.z=THREE.MathUtils.clamp(hero.z+z*dt*3.8,-28,28);fieldHero.position.set(hero.x,0,hero.z)}const target=new THREE.Vector3(hero.x,1.3,hero.z);const desired=new THREE.Vector3(hero.x+8,7,hero.z+10);camera.position.lerp(desired,Math.min(1,dt*4));camera.lookAt(target)}else{const desired=new THREE.Vector3(0,5.1,13.5);camera.position.lerp(desired,Math.min(1,dt*4));camera.lookAt(0,1.35,0);if(mode==='battle'){hero.atb=Math.min(100,hero.atb+dt*(19+hero.lv));if(hero.atb>=100&&!ready){ready=true;msg('コマンドを選択してください');drawControls()}if(!(atbWait&&ready))enemy.atb+=dt*enemy.rate;if(enemy.atb>=100){enemy.atb=0;enemyAttackAnim=.35;const damage=Math.max(1,Math.round(enemy.atk*(hero.guard?.35:1)));hero.guard=false;hero.hp=Math.max(0,hero.hp-damage);msg(enemy.name+'の攻撃！ '+damage+'ダメージ');if(hero.hp===0){hero.hp=1;hero.gold=Math.max(0,hero.gold-15);endBattle(false,'全滅… 街へ戻ります')}drawControls()}}else if(mode==='result'){battleEnd-=dt;if(battleEnd<=0)returnField()}}attackAnim=Math.max(0,attackAnim-dt);enemyAttackAnim=Math.max(0,enemyAttackAnim-dt);battHero.position.x=3-(attackAnim>0?1.1*Math.sin((1-attackAnim/.5)*Math.PI):0);foe.position.x=-3+(enemyAttackAnim>0?.8*Math.sin((1-enemyAttackAnim/.35)*Math.PI):0);updateHud();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.__haiGinAtbQA=()=>({version:'3d-atb-1.1',atbWait,mode,job:hero.job,hp:hero.hp,atb:hero.atb,enemyHp:enemy.hp,modelAssets:[...assets.keys()]});
</script></body></html>
