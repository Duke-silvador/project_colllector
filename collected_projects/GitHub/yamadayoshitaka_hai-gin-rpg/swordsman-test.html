/* V3: original, procedural anatomical surface and layered tailoring */
const porcelain=mat(0xd8a98c),shadowSkin=mat(0xb37b64),blueCloth=mat(0x263747),trim=mat(0xc1a36e),black=mat(0x171d24),hairShine=mat(0x4d3029);
function loft(name, rings, material, radial=64){
 const verts=[],normals=[],uv=[],idx=[];
 rings.forEach((r,j)=>{for(let i=0;i<=radial;i++){let a=2*Math.PI*i/radial,ca=Math.cos(a),sa=Math.sin(a);verts.push(r.x+r.rx*ca,r.y,r.z+r.rz*sa);uv.push(i/radial,j/(rings.length-1));}});
 for(let j=0;j<rings.length-1;j++)for(let i=0;i<radial;i++){let k=j*(radial+1)+i;idx.push(k,k+radial+1,k+1,k+1,k+radial+1,k+radial+2);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return add(name,new THREE.Mesh(g,material));
}
function lineTube(name,points,r,m){const c=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));return add(name,new THREE.Mesh(new THREE.TubeGeometry(c,Math.max(24,points.length*10),r,7,false),m))}
function cutGem(name,pts,material){const g=new THREE.BufferGeometry();const v=[],id=[];for(const p of pts)v.push(...p);for(let i=1;i<pts.length-1;i++)id.push(0,i,i+1);g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(id);g.computeVertexNormals();return add(name,new THREE.Mesh(g,material))}
const replaceNames=/^(Torso|Pelvis|Neck|Head|Jaw|Nose|Ear|Eye|Iris|Brow|Lips|HairScalp|HairLock|Shoulder|UpperArm|Forearm|Hand|Pauldron|PauldronPlate|Vambrace|Gauntlet|Finger|Thigh|Shin|Cuisse|Knee|Greave|Boot|Fauld|Cuirass|BreastRidge|ChestScale|AbPlate|Belt|Buckle|SwordBlade|SwordTip|Fuller|SwordGuard|SwordGrip|Pommel|Rivet)$/;
for(const p of parts){if(replaceNames.test(p.mesh.name)){p.mesh.visible=false;p.mesh.userData.legacy=true}}
loft('TailoredTorso',[{x:0,y:1.07,z:0,rx:.21,rz:.13},{x:0,y:1.20,z:0,rx:.23,rz:.14},{x:0,y:1.39,z:0,rx:.265,rz:.16},{x:0,y:1.56,z:0,rx:.31,rz:.155},{x:0,y:1.68,z:0,rx:.19,rz:.12}],blueCloth);
loft('LayeredCuirass',[{x:0,y:1.21,z:0,rx:.235,rz:.16},{x:0,y:1.35,z:0,rx:.262,rz:.19},{x:0,y:1.49,z:0,rx:.294,rz:.194},{x:0,y:1.62,z:0,rx:.258,rz:.167},{x:0,y:1.66,z:0,rx:.17,rz:.13}],steel);
loft('HeadAnatomical',[{x:0,y:1.80,z:-.005,rx:.045,rz:.065},{x:0,y:1.84,z:-.005,rx:.095,rz:.092},{x:0,y:1.90,z:0,rx:.128,rz:.112},{x:0,y:1.97,z:.008,rx:.142,rz:.119},{x:0,y:2.045,z:.014,rx:.135,rz:.115},{x:0,y:2.105,z:.02,rx:.096,rz:.09},{x:0,y:2.13,z:.02,rx:.018,rz:.03}],porcelain);
loft('NeckAnatomical',[{x:0,y:1.67,z:0,rx:.09,rz:.082},{x:0,y:1.78,z:0,rx:.073,rz:.073},{x:0,y:1.83,z:0,rx:.078,rz:.07}],porcelain);
for(let sign of [-1,1]){
 const side=sign<0?'L':'R';

}
ell('NoseBridge',[0,1.95,-.125],[.023,.053,.028],porcelain,3);
ell('NoseTip',[0,1.918,-.145],[.035,.019,.027],porcelain,3);
ell('LowerLip',[0,1.86,-.113],[.049,.011,.013],shadowSkin,3);
lineTube('MouthSeam',[[-.042,1.874,-.122],[0,1.871,-.132],[.042,1.874,-.122]],.0027,black);
ell('Chin',[0,1.825,-.067],[.075,.027,.049],porcelain,3);
loft('ScalpFitted',[{x:0,y:2.038,z:.014,rx:.135,rz:.115},{x:0,y:2.09,z:.018,rx:.125,rz:.108},{x:0,y:2.128,z:.02,rx:.089,rz:.082},{x:0,y:2.145,z:.02,rx:.025,rz:.025}],hair);
for(let i=0;i<95;i++){
 let a=i*2.399963,r=.128*Math.sqrt((i+.5)/95),x=r*Math.cos(a),z=.02+r*.82*Math.sin(a);
 let y=2.15-.08*(r/.128)**2;
 lineTube('LayeredHairStrand_'+i,[[x,y,z],[x+.012,y+.017,z-.016],[x+.027,y-.014,z-.035],[x+.03,y-.042,z-.048]],.005+(i%4)*.0015,i%3===0?hairShine:hair);
}
for(let sign of [-1,1]){
 let x=sign*.34;
 loft('UpperSleeve_'+sign,[{x:x,y:1.33,z:0,rx:.085,rz:.08},{x:sign*.34,y:1.45,z:0,rx:.093,rz:.087},{x:sign*.31,y:1.59,z:0,rx:.125,rz:.116}],blueCloth,36);

 for(let j=0;j<3;j++)lineTube('ShoulderEngraving_'+sign,[[sign*(.21+j*.027),1.685,-.072],[sign*(.31+j*.025),1.655,-.12],[sign*(.39+j*.01),1.61,-.087]],.004,trim);
 ell('HandSkin_'+sign,[sign*.405,1.065,-.025],[.062,.089,.042],porcelain,3);
 for(let finger=0;finger<5;finger++)rod('ArticulatedFinger_'+sign+'_'+finger,[sign*(.36+finger*.022),1.03,-.04],[sign*(.36+finger*.022),.973,-.05],.011,porcelain);
 loft('Trouser_'+sign,[{x:sign*.14,y:.58,z:0,rx:.083,rz:.09},{x:sign*.135,y:.78,z:0,rx:.112,rz:.114},{x:sign*.12,y:1.10,z:0,rx:.122,rz:.12}],blueCloth,36);
 loft('GreaveShaped_'+sign,[{x:sign*.145,y:.15,z:0,rx:.08,rz:.105},{x:sign*.145,y:.34,z:0,rx:.092,rz:.10},{x:sign*.145,y:.56,z:0,rx:.112,rz:.11}],steel,36);
 ell('KneePlateShaped_'+sign,[sign*.145,.62,-.08],[.105,.09,.085],silver,3);
 ell('LeatherBoot_'+sign,[sign*.145,.1,-.07],[.105,.10,.19],leather,3);
 lineTube('BootRim_'+sign,[[sign*.05,.19,-.095],[sign*.145,.21,-.15],[sign*.24,.19,-.095]],.01,trim);
 for(let j=0;j<3;j++)cutGem('WaistSkirtPanel_'+sign+'_'+j,[[sign*(.07+j*.055),1.18,-.155],[sign*(.16+j*.065),1.16,-.13],[sign*(.18+j*.06),.88,-.14],[sign*(.07+j*.05),.91,-.16]],blueCloth);
}
for(let i=0;i<7;i++){let y=1.23+i*.055;lineTube('CuirassGroove_'+i,[[-.21,y,-.156],[-.1,y+.014,-.196],[0,y+.022,-.202],[.1,y+.014,-.196],[.21,y,-.156]],.004,i%2?trim:black)}
for(let sign of [-1,1]){lineTube('ChestFiligree_'+sign,[[0,1.56,-.194],[sign*.09,1.54,-.205],[sign*.19,1.46,-.187],[sign*.22,1.36,-.17]],.008,trim);for(let j=0;j<5;j++)ell('BrassRivet_'+sign+'_'+j,[sign*.21,1.31+j*.063,-.16],[.009,.009,.008],trim,2)}
loft('LeatherBelt',[{x:0,y:1.10,z:0,rx:.245,rz:.173},{x:0,y:1.15,z:0,rx:.25,rz:.179}],leather);
block('BeltBuckle',[0,1.125,-.185],[.10,.055,.028],trim);

/* V4 topology study: concentric quad eye loops and facial muscle contours */
const topologySkin=new THREE.MeshStandardMaterial({color:0xc99578,roughness:.73,side:THREE.DoubleSide});
function quadLoopPatch(name,cx,cy,cz,rx,ry,ringCount,segments,material){
 const v=[],uv=[],ids=[];
 for(let j=0;j<=ringCount;j++){
   const t=.34+j/ringCount*.85;
   for(let i=0;i<=segments;i++){
     const a=i/segments*Math.PI*2;
     const x=cx+Math.cos(a)*rx*t,y=cy+Math.sin(a)*ry*t;
     const z=cz+.020*Math.pow(t,2)-.011*Math.cos(a*2)*t;
     v.push(x,y,z);uv.push(i/segments,j/ringCount);
   }
 }
 for(let j=0;j<ringCount;j++)for(let i=0;i<segments;i++){let k=j*(segments+1)+i;ids.push(k,k+1,k+segments+1,k+1,k+segments+2,k+segments+1)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(ids);g.computeVertexNormals();return add(name,new THREE.Mesh(g,material));
}
for(const side of [-1,1]){
 const x=side*.062;
 quadLoopPatch('TopologyOrbicularisOculi_'+side,x,1.982,-.119,.050,.030,9,64,topologySkin);
 for(let ring=0;ring<3;ring++){
  const p=[],r=1.03+ring*.17;
  for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;p.push([x+Math.cos(a)*.052*r,1.982+Math.sin(a)*.030*r,-.111+.012*r])}
  lineTube('OrbitalEdgeFlow_'+side+'_'+ring,p,.0016,ring===0?trim:shadowSkin);
 }
}
quadLoopPatch('TopologyOrbicularisOris',0,1.872,-.121,.075,.033,10,80,topologySkin);
for(let ring=0;ring<3;ring++){
 let pts=[],r=1.0+ring*.21;
 for(let i=0;i<=64;i++){let a=i/64*Math.PI*2;pts.push([Math.cos(a)*.073*r,1.872+Math.sin(a)*.033*r,-.113+.008*r])}
 lineTube('LipMuscleEdgeFlow_'+ring,pts,.0015,shadowSkin);
}

let expanded=false,wire=false,spin=false;document.querySelector('#explode').onclick=()=>{expanded=!expanded;for(const p of parts){p.mesh.position.copy(p.base);if(expanded){let v=p.base.clone().sub(new THREE.Vector3(0,1.1,0));p.mesh.position.addScaledVector(v,.24)}}document.querySelector('#explode').textContent=expanded?'組み立てる':'部品を分離'};
document.querySelector('#wire').onclick=()=>{wire=!wire;const set=new Set(parts.map(p=>p.mesh.material));set.forEach(m=>m.wireframe=wire)};
document.querySelector('#rotate').onclick=()=>{spin=!spin;document.querySelector('#rotate').textContent=spin?'回転停止':'自動回転'};
document.querySelector('#reset').onclick=()=>{camera.position.set(0,1.6,4.5);orbit.target.set(0,1.1,0);orbit.update()};

function tick(){requestAnimationFrame(tick);if(spin)group.rotation.y+=.007;orbit.update();renderer.render(scene,camera)}tick();
