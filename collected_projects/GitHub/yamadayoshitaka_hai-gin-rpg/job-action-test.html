<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰銀のレゾナンス・ネットモーション・検証版</title><style>html,body{margin:0;height:100%;background:#101722;color:white;font-family:system-ui}#ui{position:absolute;top:12px;left:12px;right:12px;z-index:3}h2{font-size:17px;margin:0 0 8px}p{font-size:12px;color:#d1dae5}button{background:#2a4058;border:1px solid #8fa7bf;border-radius:8px;color:white;padding:10px}#controls{display:flex;gap:8px;flex-wrap:wrap;position:absolute;bottom:12px;left:12px;right:12px}#error{color:#ffb9a9}select{background:#243b55;color:#fff;border:1px solid #7390ae;border-radius:7px;padding:9px;max-width:100%}#ui{background:linear-gradient(#101722ed,#10172299);padding:10px;border-radius:10px;right:10px}#ui p{margin:5px 0}#selectors{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}#selectors label{display:flex;flex-direction:column;font-size:12px;gap:3px}#controls{z-index:4}#ui{max-height:44vh;overflow:auto}#quality{font-size:12px;color:#f8d48b}#ui.collapsed #uiDetails{display:none}#uiHeader{display:flex;align-items:center;gap:12px}#toggleInfo{padding:7px}</style></head><body><div id="ui"><div id="uiHeader"><h2>ジョブ・性別・アクション検証 v10</h2><button id="toggleInfo">情報を隠す</button></div><div id="uiDetails"><p id="status">CMUのBVH歩行データをネットから取得中…</p><p id="error"></p><div id="selectors"><label>ジョブ<select id="job"></select></label><label>性別<select id="gender"><option value="male">男性</option><option value="female">女性</option></select></label><label>アクション<select id="action"></select></label></div><p id="quality">実測BVH：歩行のみ。他の動作は仮プレビューです。</p><p id="selection"></p><p>追加素材候補：<a href="./motion-acquisition-catalog.json" style="color:#9edbff">実測モーション取得元・ライセンス一覧</a>（未インポート）</p></div></div><div id="controls"><a href="./deploy-status.html" style="color:white;background:#284866;border:1px solid #8fa7bf;border-radius:8px;padding:10px;text-decoration:none">デプロイ状況 ●</a><button id="play">一時停止</button><button id="turn">回転</button><button id="reset">正面</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {BVHLoader} from 'three/addons/loaders/BVHLoader.js';
const toggleInfo=document.querySelector('#toggleInfo'),ui=document.querySelector('#ui');toggleInfo.onclick=()=>{const hidden=ui.classList.toggle('collapsed');toggleInfo.textContent=hidden?'情報を表示':'情報を隠す'};const scene=new THREE.Scene();scene.background=new THREE.Color(0x101722);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,1.4,5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1,0);orbit.update();scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(2,5,3);scene.add(key);const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.MeshStandardMaterial({color:0x273447}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const group=new THREE.Group();scene.add(group);const bonesGroup=new THREE.Group();group.add(bonesGroup);const steel=new THREE.MeshStandardMaterial({color:0xa7b8c9,metalness:.6,roughness:.3}),skin=new THREE.MeshStandardMaterial({color:0xcba082}),blue=new THREE.MeshStandardMaterial({color:0x2c4968}),gold=new THREE.MeshStandardMaterial({color:0xc9a46a,metalness:.6});const segments=[];let selectedAction='walk',selectedJob='剣士',selectedGender='male',phase=0;const jobs=['剣士','騎士','戦士','侍','忍者','盗賊','格闘家','モンク','狩人','弓使い','槍使い','魔法剣士','黒魔道士','白魔道士','赤魔道士','召喚士','僧侶','吟遊詩人','踊り子','錬金術師','竜騎士','暗黒騎士','聖騎士','機工士','銃士','学者','賢者','占星術師','獣使い','薬師','商人','海賊','踊り剣士','重装兵','斧戦士','拳闘士','時魔道士','風水士','精霊使い','勇者'];const actions=[['walk','歩行（実測BVH）'],['idle','待機（仮）'],['run','走行（実測BVH）'],['attack1','剣術1（実測BVH）'],['attack2','剣術2（実測BVH）'],['combo','剣術3（実測BVH）'],['guard','ガード（仮）'],['hit','パンチ・打撃（実測BVH）'],['dodge','回避（仮）'],['cast','魔法詠唱（仮）'],['skill','特技（仮）'],['victory','勝利（仮）'],['down','戦闘不能（仮）']];const v=(x,y,z)=>new THREE.Vector3(x,y,z);
const defs=[['hips','hip','chest',.14,blue],['head','neck','head',.11,skin],['leftUpperArm','leftShoulder','leftElbow',.075,blue],['leftForearm','leftElbow','leftHand',.06,steel],['rightUpperArm','rightShoulder','rightElbow',.075,blue],['rightForearm','rightElbow','rightHand',.06,steel],['leftThigh','leftHip','leftKnee',.10,blue],['leftShin','leftKnee','leftFoot',.08,steel],['rightThigh','rightHip','rightKnee',.10,blue],['rightShin','rightKnee','rightFoot',.08,steel]];

let root=null,mixer=null,playing=true,turning=false,last=performance.now(),jointMap={};const aliases={hip:['hips','hip','root'],chest:['chest','spine2','upperback','spine1','spine'],neck:['neck'],head:['head'],leftShoulder:['leftarm','leftshoulder','lshoulder'],leftElbow:['leftforearm','leftelbow','lelbow'],leftHand:['lefthand','lwrist'],rightShoulder:['rightarm','rightshoulder','rshoulder'],rightElbow:['rightforearm','rightelbow','relbow'],rightHand:['righthand','rwrist'],leftHip:['leftupleg','lefthip','lhip'],leftKnee:['leftleg','leftknee','lknee'],leftFoot:['leftfoot','lfoot'],rightHip:['rightupleg','righthip','rhip'],rightKnee:['rightleg','rightknee','rknee'],rightFoot:['rightfoot','rfoot']};const status=document.querySelector('#status');function findBone(list){for(const q of list){const b=root.getObjectByProperty('name',q);if(b)return b;const found=[];root.traverse(o=>{if(o.isBone&&o.name.toLowerCase()===q)found.push(o)});if(found.length)return found[0]}return null}
let restScale=.01,forwardAngle=0,poseFiltered={},lastFootY=0;const footMeshes=[];for(const side of ['left','right']){const mesh=new THREE.Mesh(new THREE.BoxGeometry(.17,.12,.34),steel);group.add(mesh);footMeshes.push({side,mesh})}
function apply(){
 if(!root)return;
 root.updateMatrixWorld(true);
 const pos={};
 for(const k in jointMap){const bone=jointMap[k];if(bone)pos[k]=bone.getWorldPosition(new THREE.Vector3())}
 if(!pos.hip)return;

 const d=bb.clone().sub(aa);seg.mesh.position.copy(aa).addScaledVector(d,.5);

 for(const [mesh,offset] of [[handle,.05],[guard,.17],[blade,.55]]){mesh.position.copy(hand).addScaledVector(dir,offset);mesh.quaternion.setFromUnitVectors(v(0,1,0),dir)}

 }else blade.visible=handle.visible=guard.visible=false
}

};for(const [family,clips] of Object.entries(motionFamilies)){clips.dodge='009/09_12.bvh';clips.guard=family==='martial'?'013/13_17.bvh':family==='sword'||family==='heavy'?'002/02_08.bvh':null;clips.hit=clips.hit||'002/02_05.bvh';clips.down='002/02_04.bvh';clips.victory='013/13_10.bvh';if(family==='caster'){clips.cast='012/12_04.bvh';clips.skill='012/12_04.bvh'}}const familyByJob={};for(const j of jobs)familyByJob[j]='sword';for(const j of ['格闘家','モンク','拳闘士','忍者'])familyByJob[j]='martial';for(const j of ['踊り子','吟遊詩人','踊り剣士'])familyByJob[j]='dance';for(const j of ['黒魔道士','白魔道士','赤魔道士','召喚士','僧侶','学者','賢者','占星術師','時魔道士','風水士','精霊使い','錬金術師','薬師'])familyByJob[j]='caster';for(const j of ['狩人','弓使い','銃士','機工士','獣使い'])familyByJob[j]='ranged';for(const j of ['騎士','戦士','重装兵','斧戦士','竜騎士','暗黒騎士','聖騎士'])familyByJob[j]='heavy';;let motionRequest=0,motionCache=new Map(),motionStatus='';const jobSelect=document.querySelector('#job'),actionSelect=document.querySelector('#action'),genderSelect=document.querySelector('#gender');for(const j of jobs){const o=document.createElement('option');o.textContent=j;o.value=j;jobSelect.append(o)}for(const [id,name] of actions){const o=document.createElement('option');o.value=id;o.textContent=name;actionSelect.append(o)}function selection(){selectedJob=jobSelect.value;selectedGender=genderSelect.value;selectedAction=actionSelect.value;phase=0;poseFiltered={};group.scale.setScalar(selectedGender==='female'?.94:1);const hue=(jobs.indexOf(selectedJob)*.13)%1;blue.color.setHSL(hue,.38,.32);document.querySelector('#selection').textContent=selectedJob+' / '+(selectedGender==='female'?'女性':'男性')+' / '+actionSelect.selectedOptions[0].textContent+' / 動作系統 '+familyByJob[selectedJob];document.querySelector('#quality').textContent='モーション取得中：'+selectedAction+'（ジョブ系統別に実測BVH候補を割当中）';loadMotion(selectedAction);}jobSelect.onchange=selection;genderSelect.onchange=selection;actionSelect.onchange=selection;async function loadMotion(action){const id=++motionRequest;const family=familyByJob[selectedJob]||'sword';const path=motionFamilies[family]?.[action]||null;if(!path){mixer=null;status.textContent='実測モーション未割当：'+action;document.querySelector('#quality').textContent='この職業系統には適合する実測モーションが未選定です';document.querySelector('#error').textContent='仮動作は再生しません';for(const x of segments)x.mesh.visible=false;for(const x of jointSpheres)x.mesh.visible=false;for(const x of footMeshes)x.mesh.visible=false;blade.visible=handle.visible=guard.visible=false;return}const url='https://raw.githubusercontent.com/una-dinosauria/cmu-mocap/master/data/'+path;try{let result=motionCache.get(path);if(!result){const response=await fetch(url,{cache:'force-cache'});if(!response.ok)throw Error('HTTP '+response.status);const content=await response.text();if(!content.trimStart().startsWith('HIERARCHY'))throw Error('BVHではありません');result=new BVHLoader().parse(content);motionCache.set(path,result)}if(id!==motionRequest)return;if(mixer)mixer.stopAllAction();root=result.skeleton.bones[0];jointMap={};for(const k in aliases)jointMap[k]=findBone(aliases[k]);mixer=new THREE.AnimationMixer(root);const clip=mixer.clipAction(result.clip);clip.play();mixer.update(0);root.updateMatrixWorld(true);const h=jointMap.head?.getWorldPosition(new THREE.Vector3()),hip=jointMap.hip?.getWorldPosition(new THREE.Vector3());if(h&&hip){const height=h.distanceTo(hip);restScale=height>.001?.85/height:.01}const l=jointMap.leftHip?.getWorldPosition(new THREE.Vector3()),r=jointMap.rightHip?.getWorldPosition(new THREE.Vector3());if(l&&r){const axis=r.sub(l);forwardAngle=Math.atan2(axis.z,axis.x)}poseFiltered={};lastFootY=0;group.rotation.z=0;const found=Object.values(jointMap).filter(Boolean).length;status.textContent='CMU BVH '+path+' / '+result.clip.duration.toFixed(1)+'秒 / 関節 '+found+'/16';document.querySelector('#quality').textContent='実測BVH読み込み成功。方向移動=回避候補、剣術/ボクシング=防御候補、太極拳=魔法候補。転倒欄はジャンプ/バランス動作の代用、勝利欄は手を伸ばす動作の代用です。専用収録ではありません。';document.querySelector('#error').textContent='';apply()}catch(e){if(id!==motionRequest)return;status.textContent='このアクションのBVH取得に失敗';document.querySelector('#quality').textContent='未実装：'+action+'。代替の仮モーションは表示しません。';document.querySelector('#error').textContent=path+'：'+e.message;mixer=null;for(const x of segments)x.mesh.visible=false;for(const x of jointSpheres)x.mesh.visible=false;blade.visible=handle.visible=guard.visible=false;for(const x of footMeshes)x.mesh.visible=false}}
selection();document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'一時停止':'再生'};document.querySelector('#turn').onclick=()=>turning=!turning;document.querySelector('#reset').onclick=()=>{camera.position.set(0,1.4,5);orbit.target.set(0,1,0);orbit.update();group.rotation.y=0};function tick(t){requestAnimationFrame(tick);const dt=Math.min((t-last)/1000,.1);last=t;if(mixer&&playing){mixer.update(dt*(['attack1','attack2','combo'].includes(selectedAction)?2.2:1));apply();phase+=dt;}if(turning)group.rotation.y+=dt*.4;orbit.update();renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
