<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>過去レース | BOAT EDGE</title><style>body{font:16px system-ui;background:#f3f8ff;color:#15335f;margin:0}main{max-width:800px;margin:auto;padding:20px}section{background:white;border:1px solid #d9e7ff;border-radius:12px;padding:16px;margin:12px 0}select{font-size:16px;padding:10px}li{padding:8px 0}small{color:#627ca3}a{color:#174fc9}</style><main><a href="./index.html">← トップ</a>　<a href="./results.html">検証済み結果</a><h1>過去レース一覧</h1><p>保存済みのサイト用データです。未取得の結果・払戻は未取得と表示します。正式Freshの採点ではありません。</p><section><label>日付 <select id="day"></select></label><p id="status" role="status">読み込み中</p></section><div id="venues"></div></main><script>(()=>{'use strict';const day=document.querySelector('#day'),status=document.querySelector('#status'),venues=document.querySelector('#venues'),valid=d=>/^20\d{6}$/.test(d),fmt=d=>d.slice(0,4)+'/'+d.slice(4,6)+'/'+d.slice(6);async function load(d){status.textContent='読み込み中';venues.replaceChildren();try{const r=await fetch('./data/site_archive/'+d+'.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP');const data=await r.json();if(data.ymd!==d||!Array.isArray(data.venues))throw Error('format');let count=0;for(const v of data.venues){const section=document.createElement('section'),h=document.createElement('h2'),ul=document.createElement('ul');h.textContent=(v.venue||v.jcd||'会場')+' / '+(v.event||'');section.append(h);for(const x of v.races||[]){if(!/^20\d{6}-\d{2}-\d{2}$/.test(x.race_key||'')||!x.race_key.startsWith(d+'-'))continue;const li=document.createElement('li'),a=document.createElement('a'),small=document.createElement('small');a.href='./data/races/'+encodeURIComponent(x.race_key)+'.json';a.textContent=x.race_no+'R '+(x.deadline||'時刻未取得')+' レースデータ';small.textContent='　'+(x.result_status==='confirmed'&&x.trifecta?'結果 '+x.trifecta:'結果未取得')+' / '+(Number.isFinite(x.payout)?'払戻 ¥'+x.payout.toLocaleString('ja-JP'):'払戻未取得');li.append(a,small);ul.append(li);count++}section.append(ul);venues.append(section)}status.textContent=fmt(d)+'：'+count+'レース'}catch(e){status.textContent='この日のデータを読み込めませんでした'}}fetch('./data/site_archive/index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('index');return r.json()}).then(a=>{const dates=(a.dates||[]).map(x=>x.ymd).filter(valid).sort().reverse();if(!dates.length)throw Error('empty');for(const d of dates){const o=document.createElement('option');o.value=d;o.textContent=fmt(d);day.append(o)}const q=new URLSearchParams(location.search).get('date');day.value=dates.includes(q)?q:dates[0];day.addEventListener('change',()=>load(day.value));load(day.value)}).catch(()=>status.textContent='過去一覧の取得に失敗しました')})();</script></html>
