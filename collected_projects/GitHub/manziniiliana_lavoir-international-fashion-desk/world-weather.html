<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>L’AVOIR · World Weather</title>
<style>:root{--wine:#5a1020;--ink:#f2e6d5;--navy:#15153c;--muted:#8a625f}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--wine);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:760px;margin:auto;padding:45px 24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid rgba(90,16,32,.25);padding-bottom:20px}.brand{font-size:12px;letter-spacing:5px}.back{color:var(--wine);font-size:11px;letter-spacing:1.5px;text-decoration:none}.title{font:400 48px Georgia,serif;margin:55px 0 10px}.sub{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:35px}.select{width:100%;padding:15px;background:transparent;border:1px solid rgba(90,16,32,.35);color:var(--wine);font-size:15px}.card{margin-top:20px;background:var(--navy);color:var(--ink);padding:32px;min-height:180px}.city{font:400 32px Georgia,serif}.temp{font-size:64px;margin:18px 0 8px}.condition{font-size:13px;color:#d7d5df}.updated{margin-top:28px;font-size:10px;letter-spacing:1.5px;color:#b8b4c2}.error{font-size:13px;line-height:1.5}.loading{opacity:.7}</style></head>
<body><div class="wrap"><div class="top"><span class="brand">L’AVOIR</span><a class="back" href="index.html">← VOLVER</a></div><h1 class="title">World Weather</h1><div class="sub">International Fashion Desk · clima en tiempo real</div>
<select id="city" class="select" aria-label="Elegir ciudad"><option value="Puerto Madryn|42.77|-65.04">Puerto Madryn</option><option value="Buenos Aires|-34.60|-58.38">Buenos Aires</option><option value="New York|40.71|-74.01">New York</option><option value="London|51.51|-0.13">London</option><option value="Paris|48.86|2.35">Paris</option><option value="Milan|45.46|9.19">Milan</option><option value="Madrid|40.42|-3.70">Madrid</option><option value="Tokyo|35.68|139.69">Tokyo</option></select>
<div id="card" class="card"><div class="loading">Consultando el clima actual…</div></div></div>
<script>
const city=document.getElementById('city'),card=document.getElementById('card');
async function loadWeather(){const [name,lat,lon]=city.value.split('|');card.innerHTML='<div class="loading">Consultando el clima actual…</div>';try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&timezone=auto');if(!r.ok)throw new Error();const d=await r.json(),c=d.current.weather_code;const labels={0:'Despejado',1:'Mayormente despejado',2:'Parcialmente nublado',3:'Nublado',45:'Niebla',48:'Niebla',51:'Llovizna',53:'Llovizna',55:'Llovizna intensa',61:'Lluvia',63:'Lluvia',65:'Lluvia intensa',71:'Nieve',73:'Nieve',75:'Nieve intensa',80:'Chaparrones',81:'Chaparrones',82:'Chaparrones intensos',95:'Tormenta',96:'Tormenta con granizo',99:'Tormenta con granizo'};card.innerHTML='<div class="city">'+name+'</div><div class="temp">'+Math.round(d.current.temperature_2m)+'°C</div><div class="condition">'+(labels[c]||'Condiciones variables')+'</div><div class="updated">Actualizado: '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+'</div>'}catch(e){card.innerHTML='<div class="error">No se pudo consultar el clima en este momento. Probá nuevamente en unos segundos.</div>'}}
city.addEventListener('change',loadWeather);loadWeather();
</script></body></html>
