<!DOCTYPE html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#0b1226;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<div style="max-width:640px;margin:0 auto;background:#111c36;border:1px solid rgba(232,185,35,.2);border-radius:10px;overflow:hidden">
<img id="cam" style="width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#000" alt="MDOT traffic camera">
<div style="padding:8px 12px;font-size:12px;font-weight:700;color:#f1f5f9"><span id="label"></span><span style="display:block;font-size:10px;font-weight:400;color:#94a3b8">MDOT live snapshot &middot; refreshes every minute</span></div>
</div>
<script>
var CAMS={
 baystlouis:{label:'US 90 at Main St \u2014 Bay St. Louis',host:'streaminglym3.mdottraffic.com',stream:'052618.stream'},
 gulfport:{label:'US 49 at US 90 \u2014 Gulfport',host:'streaminglym3.mdottraffic.com',stream:'D6-0042.stream'},
 biloxi:{label:'I-110 at US 90 \u2014 Biloxi',host:'streaminglym2.mdottraffic.com',stream:'050303.stream'},
 oceansprings:{label:'I-10 at MS 57 \u2014 Ocean Springs',host:'streaminglym2.mdottraffic.com',stream:'050901.stream'},
 pascagoula:{label:'Market St at US 90 \u2014 Pascagoula',host:'streaminglym1.mdottraffic.com',stream:'052623.stream'},
 gautier:{label:'US 90 at Gautier Vancleave Rd \u2014 Gautier',host:'streaminglym2.mdottraffic.com',stream:'052203.stream'},
 longbeach:{label:'I-10 at Canal Rd \u2014 Long Beach',host:'streaminglym3.mdottraffic.com',stream:'051404.stream'},
 passchristian:{label:'US 90 at Market St \u2014 Pass Christian',host:'streaminglym3.mdottraffic.com',stream:'050203.stream'},
 diberville:{label:'US 90 at Veterans Ave \u2014 D\u2019Iberville',host:'streaminglym3.mdottraffic.com',stream:'050504.stream'},
 beach:{label:'Beach Blvd facing the Gulf \u2014 Bay St. Louis',host:'streaminglym3.mdottraffic.com',stream:'052620.stream'}
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
var key=(new URLSearchParams(location.search).get('c')||'pascagoula').toLowerCase();
var cam=CAMS[key]||CAMS.pascagoula;
function url(){return 'https://'+cam.host+'/thumbnail?application=rtplive&streamname='+cam.stream+'&size=640x480&format=jpg&fitmode=stretch&t='+Date.now();}
document.getElementById('label').textContent=cam.label;
var img=document.getElementById('cam'); img.alt=cam.label; img.src=url();
setInterval(function(){img.src=url();},60000);
</script>
</body>
