<body style="margin:0;padding:16px;background:#0b1226;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<div style="max-width:900px;margin:0 auto">
<style>
.gx-w{box-sizing:border-box;max-width:100%;background:#0b1226;border:1px solid rgba(232,185,35,.25);border-radius:10px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f1f5f9}
.gx-w *{box-sizing:border-box}
.gx-w-head{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#b8911a,#e8b923);color:#0b1226;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px}
.gx-w-head .dot{width:8px;height:8px;border-radius:50%;background:#0b1226;animation:gxwblink 1.2s infinite}
@keyframes gxwblink{0%,100%{opacity:1}50%{opacity:.25}}
.gx-w-sub{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.75}
.gx-fc-row{display:flex;gap:10px;overflow-x:auto;padding:14px}
.gx-fc-card{flex:1 0 104px;min-width:104px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 8px;text-align:center}
.gx-fc-day{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#e8b923}
.gx-fc-icon{font-size:30px;line-height:1.4}
.gx-fc-hi{font-size:17px;font-weight:800}
.gx-fc-lo{font-size:13px;color:#94a3b8}
.gx-fc-rain{font-size:11px;color:#7dd3fc;margin-top:2px}
.gx-al-list{max-height:330px;overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px}
.gx-al-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-left:5px solid #e8b923;border-radius:8px;padding:10px 12px}
.gx-al-card.warn{border-left-color:#dc2626}
.gx-al-card.watch{border-left-color:#e8b923}
.gx-al-card.advisory{border-left-color:#2563eb}
.gx-al-event{font-size:13px;font-weight:800}
.gx-al-meta{font-size:11px;color:#94a3b8;margin-top:2px}
.gx-al-headline{font-size:12px;margin-top:6px;color:#e2e8f0}
.gx-al-clear{text-align:center;padding:26px 14px;color:#94a3b8;font-size:13px}
.gx-al-clear .big{font-size:26px}
.gx-w-foot{padding:8px 14px;font-size:10px;color:#64748b;border-top:1px solid rgba(255,255,255,.07)}
</style>
<div class="gx-w">
<div class="gx-w-head"><span class="dot"></span>7-Day Outlook<span class="gx-w-sub">Gulfport, MS</span></div>
<div class="gx-fc-row" id="fc-row"></div>
<div class="gx-w-foot" id="fc-foot">Updated 10:06 PM CDT</div>
</div>
</div>
<script>
var FC_FALLBACK=[{"day": "Today", "date": "10/14", "icon": "\ud83c\udf2b\ufe0f", "label": "Fog", "hi": 80, "lo": 66, "rain": 0}, {"day": "Thu", "date": "10/15", "icon": "\ud83c\udf24\ufe0f", "label": "Mostly Sunny", "hi": 80, "lo": 64, "rain": 0}, {"day": "Fri", "date": "10/16", "icon": "\ud83c\udf26\ufe0f", "label": "Drizzle", "hi": 82, "lo": 67, "rain": 5}, {"day": "Sat", "date": "10/17", "icon": "\u2601\ufe0f", "label": "Cloudy", "hi": 73, "lo": 56, "rain": 4}, {"day": "Sun", "date": "10/18", "icon": "\u2601\ufe0f", "label": "Cloudy", "hi": 73, "lo": 56, "rain": 0}, {"day": "Mon", "date": "10/19", "icon": "\u2601\ufe0f", "label": "Cloudy", "hi": 80, "lo": 63, "rain": 0}, {"day": "Tue", "date": "10/20", "icon": "\ud83c\udf26\ufe0f", "label": "Drizzle", "hi": 83, "lo": 64, "rain": 1}];
var COND={"0":["Clear","\u2600\ufe0f"],"1":["Mostly Sunny","\ud83c\udf24\ufe0f"],"2":["Partly Cloudy","\u26c5"],"3":["Cloudy","\u2601\ufe0f"],"45":["Fog","\ud83c\udf2b\ufe0f"],"48":["Fog","\ud83c\udf2b\ufe0f"],"51":["Drizzle","\ud83c\udf26\ufe0f"],"53":["Drizzle","\ud83c\udf26\ufe0f"],"55":["Drizzle","\ud83c\udf26\ufe0f"],"61":["Rain","\ud83c\udf27\ufe0f"],"63":["Rain","\ud83c\udf27\ufe0f"],"65":["Rain","\ud83c\udf27\ufe0f"],"80":["Showers","\ud83c\udf27\ufe0f"],"81":["Showers","\ud83c\udf27\ufe0f"],"82":["Showers","\ud83c\udf27\ufe0f"],"71":["Snow","\u2744\ufe0f"],"73":["Snow","\u2744\ufe0f"],"75":["Snow","\u2744\ufe0f"],"95":["Storms","\u26c8\ufe0f"],"96":["Storms","\u26c8\ufe0f"],"99":["Storms","\u26c8\ufe0f"]};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderFc(days,stamp){
  var h='';
  for(var i=0;i<days.length;i++){var d=days[i];
    h+='<div class="gx-fc-card"><div class="gx-fc-day">'+esc(d.day)+'</div>'+
       '<div class="gx-fc-icon">'+d.icon+'</div>'+
       '<div><span class="gx-fc-hi">'+d.hi+'&deg;</span> <span class="gx-fc-lo">'+d.lo+'&deg;</span></div>'+
       '<div class="gx-fc-rain">'+(d.rain>0?d.rain+'% rain':'&nbsp;')+'</div></div>';}
  document.getElementById('fc-row').innerHTML=h;
  if(stamp)document.getElementById('fc-foot').textContent='Updated '+stamp;
}
function refreshFc(){
  fetch('https://api.open-meteo.com/v1/forecast?latitude=30.3674&longitude=-89.0928&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=7')
  .then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(function(j){
    var d=j.daily,days=[];
    for(var i=0;i<7&&i<d.time.length;i++){
      var cd=COND[String(d.weather_code[i])]||['',''];
      var dt=new Date(d.time[i]+'T12:00:00');
      days.push({day:i===0?'Today':['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()],
        icon:cd[1],hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i]),
        rain:d.precipitation_probability_max[i]||0});}
    if(days.length)renderFc(days,'just now');
  }).catch(function(){});
}
renderFc(FC_FALLBACK);
setInterval(refreshFc,30*60000);
refreshFc();
</script>
