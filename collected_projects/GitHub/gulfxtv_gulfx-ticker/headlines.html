function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function timeAgo(ts){
  var s=Math.max(1,Math.floor(Date.now()/1000-ts));
  if(s<60)return s+'s ago';
  var m=Math.floor(s/60); if(m<60)return m+'m ago';
  var h=Math.floor(m/60); if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function render(items,stamp){
  var list=document.getElementById('gx-news-list');
  if(!items.length){
    list.innerHTML='<div class="gx-news-empty">No headlines right now &mdash; check back soon.</div>';
  }else{
    list.innerHTML=items.map(function(it){
      return '<div class="gx-news-item"><span class="gx-news-src">'+esc(it.source)+'</span>'+
        '<div class="gx-news-body"><p class="gx-news-title"><a href="'+esc(it.link)+
        '" target="_blank" rel="noopener">'+esc(it.title)+'</a></p>'+
        '<div class="gx-news-time">'+esc(timeAgo(it.ts))+'</div></div></div>';
    }).join('');
  }
  document.getElementById('gx-news-updated').textContent='Updated '+stamp;
}
function parseRSS(text){
  var out=[];
  try{
    var xml=new DOMParser().parseFromString(text,'text/xml');
    var nodes=xml.getElementsByTagName('item');
    for(var i=0;i<nodes.length;i++){
      var g=function(t){var n=nodes[i].getElementsByTagName(t)[0];return n?n.textContent:'';};
      var title=g('title'),link=g('link'),pub=g('pubDate');
      var srcNodes=nodes[i].getElementsByTagName('source');
      var src=srcNodes.length?srcNodes[0].textContent:'';
      if(!title||!link)continue;
      var p=title.lastIndexOf(' - ');
      if(p>0){var tail=title.slice(p+3);
        if(!src){src=tail;title=title.slice(0,p);}
        else if(tail===src){title=title.slice(0,p);}}
      var ts=Math.floor(Date.parse(pub)/1000)||0;
      if(ts)out.push({title:title,link:link,source:src||'Google News',ts:ts});
    }
  }catch(e){}
  return out;
}
function fetchFeed(url){
  return fetch(url).then(function(r){if(!r.ok)throw 0;return r.text();})
    .catch(function(){
      return fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url))
        .then(function(r){if(!r.ok)throw 0;return r.text();});
    });
}
function refresh(){
  var stamp=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  Promise.all(FEEDS.map(fetchFeed)).then(function(texts){
    var all=[],seen={};
    texts.forEach(function(t){
      parseRSS(t).forEach(function(it){
        var key=it.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,60);
        if(seen[key])return; seen[key]=1; all.push(it);
      });
    });
    all.sort(function(a,b){return b.ts-a.ts;});
    if(all.length)render(all.slice(0,MAX_ITEMS),stamp);
    else render(FALLBACK,'baked snapshot');
  }).catch(function(){render(FALLBACK,'baked snapshot');});
}
var btn=document.getElementById('gx-news-refresh');
if(btn)btn.addEventListener('click',refresh);
render(FALLBACK,'baked snapshot');
refresh();
setInterval(refresh,Math.max(10,REFRESH_MIN)*60000);
})();
