<body style="margin:0;padding:16px;background:#0b1226;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<div style="max-width:900px;margin:0 auto">
<style>
.gx-w{box-sizing:border-box;max-width:100%;background:#0b1226;border:1px solid rgba(232,185,35,.25);border-radius:10px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f1f5f9}
.gx-w *{box-sizing:border-box}
.gx-w-head{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#b8911a,#e8b923);color:#0b1226;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px}
.gx-w-head .dot{width:8px;height:8px;border-radius:50%;background:#0b1226;animation:gxwblink 1.2s infinite}
@keyframes gxwblink{0%,100%{opacity:1}50%{opacity:.25}}
.gx-w-sub{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.75}
.gx-st-grid{display:flex;gap:10px;padding:14px;flex-wrap:wrap}
.gx-st-card{flex:1 1 220px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px 14px;border-top:4px solid #64748b}
.gx-st-name{font-size:16px;font-weight:800}
.gx-st-badge{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;border-radius:5px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.gx-st-stats{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.gx-st-stat .v{font-size:16px;font-weight:800}
.gx-st-stat .k{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em}
.gx-st-links{margin-top:8px;font-size:12px}
.gx-st-links a{color:#7dd3fc;text-decoration:none;margin-right:12px}
.gx-st-meta{font-size:11px;color:#94a3b8;margin-top:6px}
.gx-w-clear{text-align:center;padding:26px 14px;color:#94a3b8;font-size:13px}
.gx-w-clear .big{font-size:26px}
.gx-ol-sec{padding:12px 14px 4px}
.gx-ol-basin{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#e8b923;margin-bottom:8px}
.gx-ol-issued{font-size:11px;color:#94a3b8;margin-bottom:8px}
.gx-ol-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.gx-ol-title{font-size:13px;font-weight:800}
.gx-ol-desc{font-size:12px;color:#cbd5e1;margin-top:6px;line-height:1.5}
.gx-ol-bars{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.gx-ol-bar{flex:1 1 140px}
.gx-ol-bar .bl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.gx-ol-track{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.gx-ol-fill{height:100%;border-radius:4px}
.gx-ol-pct{font-size:11px;font-weight:800;margin-top:2px}
.gx-w-foot{padding:8px 14px;font-size:10px;color:#64748b;border-top:1px solid rgba(255,255,255,.07)}
</style>
<div class="gx-w">
<div class="gx-w-head"><span class="dot"></span>Active Storms<span class="gx-w-sub">NHC</span></div>
<div class="gx-w-clear"><div class="big">✅</div>No active tropical cyclones in the Atlantic or E. Pacific.</div>
<div class="gx-w-foot">Updated 8:53 AM CDT &middot; Source: National Hurricane Center</div>
</div>
</div>
