<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GulfX TV &mdash; Traffic Marquee</title>
</head>
<body style="margin:0;padding:20px;background:#0b1226;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<div style="max-width:900px;margin:0 auto">
<style>
.gx-marquee{box-sizing:border-box;max-width:100%;background:#0b1226;border:1px solid var(--hatch-widget-border);border-radius:10px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:stretch}
.gx-marquee *{box-sizing:border-box}
.gx-mq-label{flex:none;display:flex;align-items:center;gap:8px;background:#dc2626;color:#fff;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;white-space:nowrap}
.gx-mq-label .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:gxmqblink 1.2s infinite}
@keyframes gxmqblink{0%,100%{opacity:1}50%{opacity:.25}}
.gx-mq-view{flex:1;overflow:hidden;position:relative;display:flex;align-items:center}
.gx-mq-track{display:inline-flex;align-items:center;white-space:nowrap;animation:gxmqscroll var(--gx-mq-speed,60s) linear infinite;will-change:transform}
.gx-mq-view:hover .gx-mq-track{animation-play-state:paused}
@keyframes gxmqscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.gx-mq-item{display:inline-flex;align-items:center;gap:8px;padding:10px 0;color:#f1f5f9;font-size:13px;font-weight:500}
.gx-mq-item .sev{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;border-radius:5px;padding:2px 7px;white-space:nowrap}
.gx-mq-sep{color:#e8b923;font-weight:800;padding:0 18px;font-size:14px}
</style>
<div class="gx-marquee" style="--gx-mq-speed:70s">
  <div class="gx-mq-label"><span class="dot"></span><span>Live Info</span></div>
  <div class="gx-mq-view"><div class="gx-mq-track" id="gx-mq-track"></div></div>
</div>
<script>
(function(){
/* ============ CONFIG ============
   speed: seconds per loop — edit the --gx-mq-speed style above.
   WX items refresh THEMSELVES from the National Weather Service every
   15 minutes (no backend needed). If the feed can't be reached, the
   WX_FALLBACK snapshot below is shown.
   LOCAL items are Gulf Coast headlines refreshed by the automated job
   every 15 minutes (same job as traffic) — re-download the file to pick
   up the latest snapshot.
   TRAFFIC items are refreshed by an automated job every 15 minutes —
   re-download the file to pick up the latest traffic snapshot.
   SELF-REFRESH: when this file is hosted next to ticker-data.json
   (e.g. GitHub Pages), the page re-pulls the latest traffic/headline
   snapshot itself every 15 minutes, so an open page never goes stale.
   Chip colors: WX blue, LOCAL gold, ROAD purple (local city road reports),
   Closed red, High orange, Moderate gold, Minimal gray. Hover pauses the scroll. */
var NWS_POINT='https://api.weather.gov/alerts/active?point=30.3674,-89.0928';
var WX_REFRESH_MIN=15;
/*__WX_FALLBACK_START__*/
var WX_FALLBACK=[
];
/*__WX_FALLBACK_END__*/
/*__LOCAL_ITEMS_START__*/
var LOCAL_ITEMS=[
 ['LOCAL','Mississippi Gulf Coast Community College students use AI to solve business problems -- WLOX'],
 ['LOCAL','Photos | \'The Drag Spectacular\': Coastal Mississippians Celebrate LGBTQ+ Community at Equality Fest -- Mississippi Free Press'],
 ['LOCAL','New hotels are sprouting up all across the Mississippi Coast. Here\'s why -- Sun Herald'],
 ['LOCAL','Beloved Mississippi Coast restaurants are taking new steps to survive \'vibe-killer\' fall slump -- NOLA.com'],
 ['LOCAL','New hotels rising across the Mississippi Coast (Video) -- Sun Herald'],
 ['LOCAL','Mississippi\'s Secret Coast: 3 beach towns worth the weekend drive -- San Luis Obispo Tribune']
];
/*__LOCAL_ITEMS_END__*/
/*__TRAFFIC_ITEMS_START__*/
var TRAFFIC_ITEMS=[
 ['ROAD','Road closure issued for East Railroad Street in Gulfport -- WXXV News 25'],
 ['Closed','US 90 between MS 604 and Camp Rd (Hancock Co.) -- Road closed Westbound, Bridge Repair / Inspection'],
 ['High','MS 57 between I-10 and Humphrey Rd (Jackson Co.) -- Expect delays Northbound, Traffic Switch'],
 ['Moderate','I-10 between Long Beach / County Farm Rd EX 28 and MS 43 / MS 603 / Bay St Louis EX 13 (Harrison Co.) -- Expect delays Both Directions, Resurfacing or'],
 ['Moderate','MS 26 between LA State Line and Grady Lewis Rd (Pearl River Co.) -- Expect delays Both Directions, Resurfacing or Paving'],
 ['Moderate','MS 53 at US 49 (Harrison Co.) -- Expect delays Eastbound, Turn Lane Construction'],
 ['Moderate','MS 67 between Sangani Blvd and US 49 N (Harrison Co.) -- Expect delays Both Directions, Safety Improvements'],
 ['Moderate','US 11 between Goodyear Blvd and MS 43 (Pearl River Co.) -- Expect delays Northbound, Bridge Replacement'],
 ['Moderate','US 49 at South Swan Rd (Harrison Co.) -- Expect delays Northbound, Resurfacing or Paving'],
 ['Moderate','US 49 between Oneal Rd and School Rd (Harrison Co.) -- Expect delays Both Directions, Highway Widening'],
 ['Moderate','US 90 at MS 603 N / Nicholson Ave S (Hancock Co.) -- Right lane closed Westbound, Turn Lane Construction']
];
/*__TRAFFIC_ITEMS_END__*/
var WX_EVENTS=['Tornado Warning','Extreme Wind Warning','Storm Surge Warning','Hurricane Warning','Tropical Storm Warning','Severe Thunderstorm Warning','Flash Flood Warning','Storm Surge Watch','Hurricane Watch','Tropical Storm Watch','Flood Warning','Tornado Watch','Severe Thunderstorm Watch','Coastal Flood Warning','Flash Flood Watch','High Wind Warning','Wind Advisory','Coastal Flood Advisory','Small Craft Advisory','Red Flag Warning'];
var COLORS={'Closed':'#dc2626','High':'#ea580c','Moderate':'#b8911a','Minimal':'#64748b','WX':'#2563eb','LOCAL':'#b8911a','ROAD':'#8b5cf6'};
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function buildTrack(wxItems){
  var items=(wxItems||[]).concat(LOCAL_ITEMS,TRAFFIC_ITEMS);
  var html=items.map(function(it){
    return '<span class="gx-mq-item"><span class="sev" style="background:'+(COLORS[it[0]]||'#64748b')+'">'+esc(it[0])+'</span>'+esc(it[1])+'</span><span class="gx-mq-sep">\u2022</span>';
  }).join('');
  document.getElementById('gx-mq-track').innerHTML=html+html;
}
function refreshWx(){
  fetch(NWS_POINT,{headers:{'Accept':'application/geo+json'}})
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(j){
      var feats=j.features||[],wx=[];
      for(var i=0;i<WX_EVENTS.length&&wx.length<4;i++){
        for(var k=0;k<feats.length;k++){
          var pr=feats[k].properties||{};
          if(pr.event===WX_EVENTS[i]){
            var area=String(pr.areaDesc||'the MS Gulf Coast').split(';')[0];
            if(area.length>70)area=area.slice(0,67)+'\u2026';
            wx.push(['WX',pr.event+' in effect — '+area]);
            break;
          }
        }
      }
      lastWx=wx;
      buildTrack(wx);
    })
    .catch(function(){lastWx=null;buildTrack(WX_FALLBACK);});
}
/* Pull the latest baked snapshot (traffic/headlines/wx fallback) when the
   page is hosted next to ticker-data.json. Silent no-op if the file isn't
   there (e.g. pasted embed or downloaded copy) — baked data stays. */
var lastWx=null;
function refreshData(){
  fetch('ticker-data.json',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(d){
      if(!d)return;
      if(d.traffic)TRAFFIC_ITEMS=d.traffic;
      if(d.local)LOCAL_ITEMS=d.local;
      if(d.wx_fallback)WX_FALLBACK=d.wx_fallback;
      buildTrack(lastWx||WX_FALLBACK);
    })
    .catch(function(){});
}
buildTrack(WX_FALLBACK);
refreshWx();
refreshData();
setInterval(refreshWx,Math.max(5,WX_REFRESH_MIN)*60000);
setInterval(refreshData,15*60000);
})();
</script>
</div>
</body>
</html>
