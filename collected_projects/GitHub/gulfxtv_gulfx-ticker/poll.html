<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GulfX TV Poll</title>
<style>
body{margin:0;padding:16px;background:#0b1226;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.gx-w{box-sizing:border-box;max-width:640px;margin:0 auto;background:#0b1226;border:1px solid rgba(232,185,35,.25);border-radius:10px;overflow:hidden;color:#f1f5f9}
.gx-w *{box-sizing:border-box}
.gx-w-head{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#b8911a,#e8b923);color:#0b1226;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px}
.gx-w-head .dot{width:8px;height:8px;border-radius:50%;background:#0b1226;animation:gxwblink 1.2s infinite}
@keyframes gxwblink{0%,100%{opacity:1}50%{opacity:.25}}
.gx-w-sub{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.75}
#poll-frame{display:block;width:100%;height:640px;border:0;background:#fff}
.gx-w-foot{padding:8px 14px;font-size:10px;color:#64748b;border-top:1px solid rgba(255,255,255,.07);text-align:center}
.gx-w-foot a{color:#7dd3fc;text-decoration:none}
</style>
</head>
<body>
<div class="gx-w">
  <div class="gx-w-head"><span class="dot"></span>Coast Poll<span class="gx-w-sub">GulfX TV</span></div>
  <iframe id="poll-frame" title="GulfX TV poll" scrolling="no"></iframe>
  <div class="gx-w-foot">One vote per person &middot; <a id="poll-link" href="#" target="_blank" rel="noopener">open full poll</a></div>
</div>
<script>
// TO RUN A NEW POLL: create it on strawpoll.com, then set POLL_ID below to the new poll's id.
var POLL_ID = 'kjn1DPzwAyQ';
document.getElementById('poll-frame').src = 'https://strawpoll.com/embed/' + POLL_ID;
document.getElementById('poll-link').href = 'https://strawpoll.com/' + POLL_ID;
</script>
</body>
</html>
