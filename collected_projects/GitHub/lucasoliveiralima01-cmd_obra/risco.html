<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Mapa de riscos (NR-5) desenhado sobre o modelo IFC da obra."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2322425c'/%3E%3Ccircle cx='10' cy='11' r='4' fill='%235cb531'/%3E%3Ccircle cx='22' cy='11' r='4' fill='%23e3141b'/%3E%3Ccircle cx='16' cy='21' r='5' fill='%231736e0'/%3E%3C/svg%3E"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Mapa de Risco</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-apple.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Obra"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: faixa da marca  · palco 3D/planta à esquerda · coluna com a área selecionada, as áreas do pavimento e os pavimentos à direita; no celular tudo empilha.
   As cores dos grupos de risco são fixas (convenção da NR-5) e não mudam com o tema. */
:root{
  --navy:#22425c; --petrol:#074669; --brand-ink:#ffffff; --brand-soft:#9fc3d6;
  --bg:#eef2f5; --panel:#ffffff; --ink:#14222e; --muted:#5a6b78; --line:#d3dce3; --line-2:#e4eaef;
  --accent:#074669; --accent-ink:#ffffff; --accent-soft:#dcebf2;
  --plan-bg:#fbfcfc; --slab:#e8ecee; --beam:#cfd6db; --col:#59646e; --edge:#8d979f;
  --area:#d9701c; --area-ink:#b85a0e; --ring:rgba(20,30,40,.38);
  --canvas-bg:#e3e9ee;
  --ok:#23804a; --ok-soft:#dcf0e3; --bad:#c23b2f; --bad-soft:#f8e0dc; --warn:#b86e00; --warn-soft:#fbecd2;
  --f-disp:"Titillium Web","Segoe UI",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1720; --panel:#14212c; --ink:#e3eaf0; --muted:#93a5b3; --line:#27394a; --line-2:#1d2d3a;
  --accent:#62aed3; --accent-ink:#06202e; --accent-soft:#163445;
  --plan-bg:#0f1b24; --slab:#22323e; --beam:#33444f; --col:#b9c5ce; --edge:#6c7d8a; --canvas-bg:#0f1a23;
  --area:#f0954a; --area-ink:#f5a965; --ring:rgba(255,255,255,.45);
  --ok:#53c07f; --ok-soft:#163a26; --bad:#f07a6c; --bad-soft:#41201c; --warn:#f0a93a; --warn-soft:#3d2c10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1720; --panel:#14212c; --ink:#e3eaf0; --muted:#93a5b3; --line:#27394a; --line-2:#1d2d3a;
  --accent:#62aed3; --accent-ink:#06202e; --accent-soft:#163445;
  --plan-bg:#0f1b24; --slab:#22323e; --beam:#33444f; --col:#b9c5ce; --edge:#6c7d8a; --canvas-bg:#0f1a23;
  --area:#f0954a; --area-ink:#f5a965; --ring:rgba(255,255,255,.45);
  --ok:#53c07f; --ok-soft:#163a26; --bad:#f07a6c; --bad-soft:#41201c; --warn:#f0a93a; --warn-soft:#3d2c10; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}

/* ---------- faixa da marca ---------- */
.brand{background:var(--navy);color:var(--brand-ink);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:min(46%,560px);background:var(--petrol);clip-path:polygon(64px 0,100% 0,100% 100%,0 100%);z-index:0}
.brand-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:grid;gap:1px;line-height:1}
.logo svg{height:30px;width:auto;display:block}
.logo span{font:600 .62rem var(--f-disp);letter-spacing:.02em;color:var(--brand-soft)}
.ttl{display:grid;gap:0;border-left:1px solid rgba(255,255,255,.25);padding-left:18px;min-width:0}
.ttl .kick{font:600 .68rem var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-soft)}
.ttl h1{font:700 1.45rem/1.1 var(--f-disp);margin:0;letter-spacing:.01em;text-wrap:balance}
.ttl .obra{font-size:.8rem;color:#d4e4ee;background:none;border:0;padding:0;text-align:left;border-bottom:1px dashed rgba(255,255,255,.35);justify-self:start}
.ttl .obra:hover{color:#fff}
.nrdots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
.nrdots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font:600 .82rem var(--f-body);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.2)}
a.hbtn{text-decoration:none}
.hbtn.solid{background:#fff;color:var(--navy);border-color:#fff}
#bReset{border-color:rgba(255,160,150,.55)}
.modechip{font:500 .7rem var(--f-mono);color:#d4e4ee;border:1px dashed rgba(255,255,255,.35);border-radius:12px;padding:2px 8px;white-space:nowrap}

/* ---------- principal ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:12px;min-height:0;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.stage{display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.seg button{background:none;border:0;padding:6px 12px;font:600 .82rem var(--f-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lbl{font:600 .66rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fgrp{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.sel{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:600 .84rem var(--f-body);max-width:100%}
.gchips{display:inline-flex;gap:4px;flex-wrap:wrap}
.gchip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px 9px 3px 5px;font:600 .76rem var(--f-body);color:var(--ink)}
.gchip i{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1px var(--ring) inset}
.gchip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.views{position:relative;min-height:0;background:var(--canvas-bg)}
.views>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cplan{background:var(--plan-bg)}
.ov{position:absolute;z-index:2}
.card-ov{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 10px rgba(10,30,45,.08)}
.legend{left:10px;bottom:10px;padding:7px 9px;font-size:.76rem;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 20px);align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:4px}
.legend .lg i{display:inline-block;border-radius:50%;box-shadow:0 0 0 1px var(--ring) inset}
.demochip{left:10px;top:10px;border-style:dashed;color:var(--muted)}
.vbtns{right:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:600 .76rem var(--f-body);color:var(--ink);white-space:nowrap}
.ibtn:hover{border-color:var(--accent)}
.ibtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ibtn:disabled{opacity:.45;cursor:default}
.tip{pointer-events:none;background:var(--ink);color:var(--panel);font:500 .74rem var(--f-mono);padding:2px 7px;border-radius:4px;white-space:nowrap;transform:translate(12px,-26px)}
.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));padding:16px;display:grid;gap:10px}
.center h3{margin:0;font:700 1.15rem var(--f-disp)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.drawbar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px 10px;border:2px solid var(--area);max-width:calc(100% - 20px)}
.drawbar .who{font:600 .82rem var(--f-body);width:100%;text-align:center}
.drop{outline:3px dashed var(--accent);outline-offset:-8px}

/* ---------- coluna lateral ---------- */
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-bottom:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h2{font:700 .82rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:7px 12px;font:600 .84rem var(--f-body);white-space:nowrap}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:.86rem}
.alist{display:grid;gap:4px}
.ai{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:7px 9px;border:1px solid var(--line-2);border-radius:6px;background:none;text-align:left;width:100%}
.ai:hover{border-color:var(--area)}
.ai[aria-current="true"]{border-color:var(--area);background:var(--warn-soft)}
.ai .t{font:600 .9rem var(--f-body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai small{grid-column:1/-1;color:var(--muted);font-size:.74rem}
.dots{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.dots i{display:inline-block;border-radius:50%;box-shadow:0 0 0 1px var(--ring) inset;flex:none}
.tower{display:grid;gap:2px;max-height:300px;overflow:auto}
.tr{display:grid;grid-template-columns:minmax(0,1fr) auto 26px;gap:8px;align-items:center;font-size:.82rem;padding:4px 6px;border-radius:4px;background:none;border:0;text-align:left;width:100%}
.tr:hover{background:var(--accent-soft)} .tr[aria-current="true"]{background:var(--accent-soft);outline:1px solid var(--accent)}
.tr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .c{font:500 .72rem var(--f-mono);text-align:right;color:var(--muted)}
/* ficha */
.fhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.fhead h3{margin:0;font:700 1.2rem/1.15 var(--f-disp);text-wrap:balance;color:var(--area-ink)}
.fhead small{display:block;color:var(--muted);font-size:.8rem}
dl.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;margin:0;font-size:.86rem}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:.84em}
.rtab{display:grid;gap:0;margin:8px 0 10px;border-top:1px solid var(--line-2)}
.rrow{display:grid;grid-template-columns:30px 1fr;gap:2px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.rrow .sym{display:grid;place-items:center;height:26px}
.rrow .sym i{display:block;border-radius:50%;box-shadow:0 0 0 1px var(--ring) inset}
.rrow b{font:600 .86rem var(--f-body)} .rrow span{font-size:.84rem;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.props{max-height:160px;overflow:auto;margin-top:8px;border-top:1px solid var(--line-2);padding-top:6px}
.props table{border-collapse:collapse;width:100%;font-size:.76rem}
.props td{padding:2px 4px;border-bottom:1px solid var(--line-2);vertical-align:top;overflow-wrap:anywhere}
.props td:first-child{color:var(--muted);width:45%}
details summary{cursor:pointer;font-size:.8rem;color:var(--muted)}
.empty-s{display:grid;gap:8px;justify-items:start}
.pill{font:600 .68rem var(--f-body);padding:2px 7px;border-radius:10px;white-space:nowrap;border:1px solid transparent;justify-self:end}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.sug{border:1px dashed var(--warn);color:var(--warn);margin-left:6px;vertical-align:1px}
.rv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:7px 9px;border:1px solid var(--line-2);border-radius:6px;background:none;text-align:left;width:100%}
.rv:hover{border-color:var(--accent)} .rv[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rv b{font:700 .9rem var(--f-disp)} .rv .mono{justify-self:end;color:var(--muted)} .rv small{grid-column:1/-1;color:var(--muted);font-size:.74rem}
.rv .pill{grid-column:2}
.revbar{left:50%;top:10px;transform:translateX(-50%);z-index:3;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;padding:7px 10px;border:2px solid var(--warn);background:var(--warn-soft);max-width:calc(100% - 20px);font-size:.84rem;text-align:center}
.sympal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;width:min(660px,calc(100vw - 60px));max-height:42vh;overflow:auto}
.sympal .gh{grid-column:1/-1;font:600 .66rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.symb{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font:600 .78rem var(--f-body);text-align:left;color:var(--ink)}
.symb:hover{border-color:var(--accent)} .symb canvas{flex:none;width:28px;height:28px}
.lenin{width:140px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:500 .84rem var(--f-mono);color:var(--ink)}
.lenin:disabled{opacity:.5}
.drawbar .seg button{padding:4px 9px;font-size:.78rem}
.hpick{display:flex;flex-wrap:wrap;gap:6px}
.hpick button{display:grid;gap:2px;justify-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px;font:600 .7rem var(--f-body);color:var(--muted);min-width:64px}
.hpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;color:var(--ink)}
.hpick canvas{width:54px;height:34px;background:var(--panel);border-radius:3px;border:1px solid var(--line-2)}
#hOpts{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px}
@media (pointer:coarse){.drawbar .kh{display:none}}
@media (max-width:640px){.drawbar .kh,.drawbar .dh{display:none}.drawbar{bottom:8px;padding:6px 8px}.vbtns .ibtn{padding:4px 7px;font-size:.72rem}}
@media (max-width:640px){#hOpts{grid-template-columns:1fr 1fr}.sympal{grid-template-columns:1fr 1fr}}

/* ---------- folhas (formulários) ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,20,30,.5);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);max-height:calc(100dvh - 32px);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet>header h3{margin:0;font:700 1.25rem var(--f-disp)}
.sheet .body{overflow:auto;padding:14px 16px;min-height:0}
.sheet>footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.fg .full{grid-column:1/-1}
.fld{display:grid;gap:3px;min-width:0}
.fld label,.fld .l{font:600 .7rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;min-width:0;width:100%;box-sizing:border-box;font-size:.95rem}
.fld textarea{min-height:56px;resize:vertical}
.fsec{grid-column:1/-1;font:700 .8rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line);padding-top:6px;padding-bottom:3px;display:flex;justify-content:space-between;align-items:end;gap:8px}
.rk{grid-column:1/-1;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px}
.rk .gpick{display:inline-flex;gap:4px}
.rk .gpick button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:0 0 0 1px var(--ring) inset}
.rk .gpick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.rk .ipick{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rk .ipick button{background:var(--bg);border:0;padding:5px 9px;font:600 .8rem var(--f-body);color:var(--muted)}
.rk .ipick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rk input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0;width:100%;box-sizing:border-box}
.rk .rm{display:inline-flex;gap:2px}
.rk .rm button{background:none;border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-size:.8rem;color:var(--muted)}
.rk .gname{grid-column:1/-1;font:600 .72rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase}
.msg{font-size:.82rem;margin-right:auto}.msg.err{color:var(--bad)}
.rng{display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center;font-size:.84rem}
.rng input[type=range]{accent-color:var(--accent);width:100%}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;line-height:1.3}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.prevbox{grid-column:1/-1;background:var(--canvas-bg);border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;align-items:center;justify-items:center}
.prevbox canvas{max-width:100%;max-height:230px;width:auto;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.18);background:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:8px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:1000px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:min(72vh,640px);height:min(72dvh,640px)}
  .side{overflow:visible}
  .brand::after{width:38%}
}
@media (max-width:640px){
  .ttl{border-left:0;padding-left:0;width:100%}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>/* Leitor IFC (STEP) em JavaScript puro — sem WebAssembly.
   Lê entidades sob demanda, monta placements, pavimentos, propriedades e
   triangula a geometria dos tipos mais comuns em exportações de Revit/ArchiCAD/TQS.
   Saída: elementos com triângulos em metros, relativos a um ponto de origem do arquivo. */
(function (root) {
  'use strict';
  const TAU = Math.PI * 2;

  /* ---------- STEP ---------- */
  function decodeStr(s) {
    if (s.indexOf('\\') < 0) return s.replace(/''/g, "'");
    s = s.replace(/''/g, "'");
    s = s.replace(/\\X2\\([0-9A-F]+?)\\X0\\/gi, (m, h) => { let o = ''; for (let i = 0; i + 4 <= h.length; i += 4) o += String.fromCharCode(parseInt(h.substr(i, 4), 16)); return o; });
    s = s.replace(/\\X4\\([0-9A-F]+?)\\X0\\/gi, (m, h) => { let o = ''; for (let i = 0; i + 8 <= h.length; i += 8) o += String.fromCodePoint(parseInt(h.substr(i, 8), 16)); return o; });
    s = s.replace(/\\X\\([0-9A-F]{2})/gi, (m, h) => String.fromCharCode(parseInt(h, 16)));
    s = s.replace(/\\S\\(.)/g, (m, c) => String.fromCharCode(c.charCodeAt(0) + 128));
    s = s.replace(/\\P.\\/g, '').replace(/\\\\/g, '\\');
    return s;
  }
  // value encoding: ref -> {r:id}; enum -> {e:'X'}; typed -> {t:'IFCLABEL', v:[...]}; string -> string; number; null ($); '*' -> undefined
  function parseArgs(text, start, end) {
    let i = start;
    function val() {
      while (i < end && (text.charCodeAt(i) <= 32)) i++;
      const c = text[i];
      if (c === '(') {
        i++; const arr = [];
        while (true) {
          while (i < end && text.charCodeAt(i) <= 32) i++;
          if (text[i] === ')') { i++; break; }
          arr.push(val());
          while (i < end && text.charCodeAt(i) <= 32) i++;
          if (text[i] === ',') i++;
        }
        return arr;
      }
      if (c === "'") {
        let j = i + 1, s = '';
        while (true) {
          const q = text.indexOf("'", j);
          if (q < 0 || q >= end) { s += text.slice(j, end); i = end; break; }
          if (text[q + 1] === "'") { s += text.slice(j, q + 2); j = q + 2; continue; }
          s += text.slice(j, q); i = q + 1; break;
        }
        return decodeStr(s);
      }
      if (c === '#') { let j = i + 1; while (j < end && text.charCodeAt(j) >= 48 && text.charCodeAt(j) <= 57) j++; const r = +text.slice(i + 1, j); i = j; return { r }; }
      if (c === '$') { i++; return null; }
      if (c === '*') { i++; return undefined; }
      if (c === '.') { const j = text.indexOf('.', i + 1); const e = text.slice(i + 1, j); i = j + 1; return e === 'T' ? true : e === 'F' ? false : e === 'U' ? null : { e }; }
      if (c === '"') { const j = text.indexOf('"', i + 1); const s = text.slice(i + 1, j); i = j + 1; return s; }
      if ((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z')) {
        let j = i; while (j < end && /[A-Za-z0-9_]/.test(text[j])) j++;
        const t = text.slice(i, j).toUpperCase(); i = j;
        while (i < end && text.charCodeAt(i) <= 32) i++;
        const v = val();
        return { t, v: Array.isArray(v) ? v : [v] };
      }
      let j = i; while (j < end && ',)'.indexOf(text[j]) < 0 && text.charCodeAt(j) > 32) j++;
      const n = parseFloat(text.slice(i, j)); i = j; return n;
    }
    // text[start] is '('
    return val();
  }

  class StepFile {
    constructor(text) {
      this.text = text; this.ids = new Map(); this.types = []; this.typeIdx = new Map();
      this.cache = new Map(); this.byType = new Map();
    }
    async index(onProgress) {
      const t = this.text; let pos = t.indexOf('DATA;'); if (pos < 0) pos = 0;
      const n = t.length; let count = 0; let lastYield = Date.now();
      const st = [], en = [], ty = [], idl = [];
      while (true) {
        const h = t.indexOf('#', pos); if (h < 0) break;
        let j = h + 1; while (t.charCodeAt(j) >= 48 && t.charCodeAt(j) <= 57) j++;
        const id = +t.slice(h + 1, j);
        while (t.charCodeAt(j) <= 32) j++;
        if (t[j] !== '=') { pos = j; continue; }
        j++; while (t.charCodeAt(j) <= 32) j++;
        const p = t.indexOf('(', j); const type = t.slice(j, p).trim().toUpperCase();
        // end: next ';' outside quotes
        let k = p;
        while (true) {
          const sc = t.indexOf(';', k), q = t.indexOf("'", k);
          if (sc < 0) { k = n; break; }
          if (q >= 0 && q < sc) { const q2 = t.indexOf("'", q + 1); k = q2 < 0 ? n : q2 + 1; continue; }
          k = sc; break;
        }
        let tix = this.typeIdx.get(type); if (tix === undefined) { tix = this.types.length; this.types.push(type); this.typeIdx.set(type, tix); }
        this.ids.set(id, idl.length); idl.push(id); st.push(p); en.push(k); ty.push(tix);
        let arr = this.byType.get(type); if (!arr) this.byType.set(type, arr = []); arr.push(id);
        pos = k + 1; count++;
        if ((count & 16383) === 0 && onProgress && Date.now() - lastYield > 60) { await onProgress(pos / n); lastYield = Date.now(); }
      }
      this.st = st; this.en = en; this.ty = ty; this.count = count;
      return count;
    }
    type(id) { const k = this.ids.get(id); return k === undefined ? null : this.types[this.ty[k]]; }
    get(id) {
      if (id && typeof id === 'object') id = id.r;
      let c = this.cache.get(id); if (c) return c;
      const k = this.ids.get(id); if (k === undefined) return null;
      c = { id, type: this.types[this.ty[k]], a: parseArgs(this.text, this.st[k], this.en[k]) };
      if (this.cache.size > 400000) this.cache.clear();
      this.cache.set(id, c); return c;
    }
    of(type) { return this.byType.get(type) || []; }
  }

  /* ---------- matemática ---------- */
  const I = () => [1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0]; // colunas x,y,z, translação t  (m[0..2]=x, m[3..5]=y, m[6..8]=z, m[9..11]=t)
  function mul(A, B) { // A*B
    const r = new Array(12);
    for (let c = 0; c < 4; c++) {
      const bx = B[c * 3], by = B[c * 3 + 1], bz = B[c * 3 + 2];
      r[c * 3] = A[0] * bx + A[3] * by + A[6] * bz + (c === 3 ? A[9] : 0);
      r[c * 3 + 1] = A[1] * bx + A[4] * by + A[7] * bz + (c === 3 ? A[10] : 0);
      r[c * 3 + 2] = A[2] * bx + A[5] * by + A[8] * bz + (c === 3 ? A[11] : 0);
    }
    return r;
  }
  const ap = (M, x, y, z) => [M[0] * x + M[3] * y + M[6] * z + M[9], M[1] * x + M[4] * y + M[7] * z + M[10], M[2] * x + M[5] * y + M[8] * z + M[11]];
  const av = (M, x, y, z) => [M[0] * x + M[3] * y + M[6] * z, M[1] * x + M[4] * y + M[7] * z, M[2] * x + M[5] * y + M[8] * z];
  const norm3 = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  function frame(o, z, x) {
    z = norm3(z); x = x ? sub3(x, z.map(v => v * dot(x, z))) : null;
    if (!x || Math.hypot(...x) < 1e-9) { const a = Math.abs(z[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0]; x = sub3(a, z.map(v => v * dot(a, z))); }
    x = norm3(x); const y = cross(z, x);
    return [x[0], x[1], x[2], y[0], y[1], y[2], z[0], z[1], z[2], o[0], o[1], o[2]];
  }
  function invRigid(M) { // inverse assuming orthonormal (with possible uniform scale ignored)
    const r = [M[0], M[3], M[6], M[1], M[4], M[7], M[2], M[5], M[8], 0, 0, 0];
    const t = av(r, M[9], M[10], M[11]); r[9] = -t[0]; r[10] = -t[1]; r[11] = -t[2]; return r;
  }

  /* ---------- triangulação 2D (usa THREE.ShapeUtils se disponível) ---------- */
  function area2(p) { let a = 0; for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length]; a += p[i][0] * q[1] - q[0] * p[i][1]; } return a / 2; } // >0 = anti-horário
  function cleanPoly(p) {
    const o = [];
    for (const q of p) { const l = o[o.length - 1]; if (!l || Math.abs(l[0] - q[0]) > 1e-9 || Math.abs(l[1] - q[1]) > 1e-9) o.push(q); }
    while (o.length > 2 && Math.abs(o[0][0] - o[o.length - 1][0]) < 1e-9 && Math.abs(o[0][1] - o[o.length - 1][1]) < 1e-9) o.pop();
    return o;
  }
  function triangulate(outer, holes) {
    const T = root.THREE && root.THREE.ShapeUtils;
    if (T) {
      const V = p => p.map(q => new root.THREE.Vector2(q[0], q[1]));
      try { const tris = T.triangulateShape(V(outer), holes.map(V)); return tris; } catch (e) { }
    }
    const t = []; for (let i = 1; i + 1 < outer.length; i++) t.push([0, i, i + 1]); return t; // leque (fallback)
  }

  /* ---------- leitor de modelo ---------- */
  async function readIFC(text, opts) {
    opts = opts || {}; const prog = opts.onProgress || (async () => { });
    const F = new StepFile(text);
    await F.index(async f => prog('Lendo entidades', f * 0.35));
    const log = {}; const warn = t => { log[t] = (log[t] || 0) + 1; };
    const schema = (text.slice(0, 2000).match(/FILE_SCHEMA\s*\(\s*\(\s*'([^']+)'/i) || [])[1] || '?';

    // unidades
    let scale = 1, angle = null;
    // unidades: vale a lista do IFCUNITASSIGNMENT do projeto (um arquivo pode declarar outras unidades só para grandezas derivadas)
    const assigned = new Set(); for (const id of F.of('IFCUNITASSIGNMENT')) for (const u of (F.get(id).a[0] || [])) if (u && u.r) assigned.add(u.r);
    const useUnit = id => !assigned.size || assigned.has(id);
    for (const id of F.of('IFCSIUNIT')) { if (!useUnit(id)) continue;
      const u = F.get(id).a; const ut = u[1] && u[1].e;
      if (ut === 'LENGTHUNIT') { const pre = u[2] && u[2].e; scale = ({ MILLI: 1e-3, CENTI: 1e-2, DECI: 1e-1, KILO: 1e3 })[pre] || 1; }
      if (ut === 'PLANEANGLEUNIT') angle = 'rad';
    }
    for (const id of F.of('IFCCONVERSIONBASEDUNIT')) { if (!useUnit(id)) continue;
      const u = F.get(id).a; const ut = u[1] && u[1].e; const nm = String(u[2] || '').toUpperCase();
      if (ut === 'LENGTHUNIT') { if (nm.indexOf('FOOT') >= 0) scale = 0.3048; else if (nm.indexOf('INCH') >= 0) scale = 0.0254; }
      if (ut === 'PLANEANGLEUNIT' && nm.indexOf('DEG') >= 0) angle = 'deg';
    }
    const toRad = v => angle === 'deg' ? v * Math.PI / 180 : (angle === 'rad' ? v : (Math.abs(v) > TAU + 0.01 ? v * Math.PI / 180 : v));

    const pt = r => { const e = F.get(r); if (!e) return [0, 0, 0]; const c = e.a[0]; return [c[0] || 0, c[1] || 0, c[2] || 0]; };
    const dirv = r => { const e = F.get(r); if (!e) return null; const c = e.a[0]; return [c[0] || 0, c[1] || 0, c[2] || 0]; };
    // placements (unidades do arquivo; escala aplicada no fim)
    function a2p(r) {
      const e = F.get(r); if (!e) return I();
      if (e.type === 'IFCAXIS2PLACEMENT3D') return frame(pt(e.a[0]), e.a[1] ? dirv(e.a[1]) : [0, 0, 1], e.a[2] ? dirv(e.a[2]) : [1, 0, 0]);
      if (e.type === 'IFCAXIS2PLACEMENT2D') { const o = pt(e.a[0]); const x = e.a[1] ? dirv(e.a[1]) : [1, 0, 0]; return frame([o[0], o[1], 0], [0, 0, 1], [x[0], x[1], 0]); }
      if (e.type === 'IFCAXIS1PLACEMENT') return frame(pt(e.a[0]), e.a[1] ? dirv(e.a[1]) : [0, 0, 1], null);
      warn('placement ' + e.type); return I();
    }
    const lpCache = new Map();
    function lp(r) {
      if (!r) return I(); const id = r.r; if (lpCache.has(id)) return lpCache.get(id);
      const e = F.get(id); let M = I();
      if (e && e.type === 'IFCLOCALPLACEMENT') { M = mul(lp(e.a[0]), a2p(e.a[1])); }
      else if (e) warn('placement ' + e.type);
      lpCache.set(id, M); return M;
    }
    function cto(r) { // cartesian transformation operator
      const e = F.get(r); if (!e) return I(); const a = e.a;
      const o = a[2] ? pt(a[2]) : [0, 0, 0]; const s = a[3] == null ? 1 : a[3];
      let M;
      if (e.type.indexOf('3D') >= 0) {
        const x = a[0] ? dirv(a[0]) : [1, 0, 0]; const z = a[4] ? dirv(a[4]) : [0, 0, 1];
        M = frame(o, z, x);
        const s2 = e.type.indexOf('NONUNIFORM') >= 0 && a[5] != null ? a[5] : s, s3 = e.type.indexOf('NONUNIFORM') >= 0 && a[6] != null ? a[6] : s;
        for (let i = 0; i < 3; i++) { M[i] *= s; M[3 + i] *= s2; M[6 + i] *= s3; }
      } else {
        const x = a[0] ? dirv(a[0]) : [1, 0, 0]; M = frame([o[0], o[1], 0], [0, 0, 1], [x[0], x[1], 0]);
        for (let i = 0; i < 9; i++) M[i] *= s;
      }
      return M;
    }

    /* ---- curvas ---- */
    const ARC = Math.PI / 18; // 10°
    function arcPts(c, r, a0, a1, ccw) {
      let d = a1 - a0; if (ccw) { while (d <= 0) d += TAU; } else { while (d >= 0) d -= TAU; }
      const n = Math.max(2, Math.ceil(Math.abs(d) / ARC)); const o = [];
      for (let i = 0; i <= n; i++) { const t = a0 + d * i / n; o.push([c[0] + r * Math.cos(t), c[1] + r * Math.sin(t)]); }
      return o;
    }
    function arc3(p1, p2, p3) { // arco por 3 pontos (2D)
      const ax = p1[0], ay = p1[1], bx = p2[0], by = p2[1], cx = p3[0], cy = p3[1];
      const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
      if (Math.abs(d) < 1e-12) return [p1, p3];
      const ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (ay - by)) / d;
      const uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (bx - ax)) / d;

        case 'IFCSWEPTDISKSOLID': case 'IFCSWEPTDISKSOLIDPOLYGONAL': { tube(out, M, curve(a[0]), a[1]); return; }
        case 'IFCFACETEDBREP': case 'IFCADVANCEDBREP': case 'IFCFACETEDBREPWITHVOIDS': case 'IFCADVANCEDBREPWITHVOIDS':
          if (e.type.indexOf('ADVANCED') >= 0) warn('brep avançado (aproximado)'); shellFaces(out, M, a[0]); return;
        case 'IFCCLOSEDSHELL': case 'IFCOPENSHELL': shellFaces(out, M, r); return;
        case 'IFCFACEBASEDSURFACEMODEL': for (const s of a[0]) shellFaces(out, M, s); return;
        case 'IFCSHELLBASEDSURFACEMODEL': for (const s of a[0]) shellFaces(out, M, s); return;
        case 'IFCTRIANGULATEDFACESET': case 'IFCTRIANGULATEDIRREGULARNETWORK': {
          const C = F.get(a[0]).a[0]; const idx = a[3]; const pn = e.type === 'IFCTRIANGULATEDFACESET' ? a[4] : a[4];
          const P = k => { const kk = pn && pn.length ? pn[k - 1] : k; const c = C[kk - 1]; return ap(M, c[0], c[1], c[2] || 0); };

        }
        case 'IFCPOLYGONALFACESET': {
          const C = F.get(a[0]).a[0]; const pn = a[3];
          const P = k => { const kk = pn && pn.length ? pn[k - 1] : k; const c = C[kk - 1]; return [c[0], c[1], c[2] || 0]; };
          for (const fr of a[2]) { const f = F.get(fr); const loops = [f.a[0].map(P)]; if (f.type === 'IFCINDEXEDPOLYGONALFACEWITHVOIDS') for (const h of f.a[1]) loops.push(h.map(P)); polyFaces(out, M, loops); }
          return;
        }
        case 'IFCMAPPEDITEM': {
          const src = F.get(a[0]); const T = mul(M, mul(cto(a[1]), a2p(src.a[0])));
          const rep = F.get(src.a[1]); for (const it of rep.a[3]) item(out, T, it, depth + 1); return;
        }
        case 'IFCBOOLEANCLIPPINGRESULT': case 'IFCBOOLEANRESULT': {
          const op = a[0] && a[0].e; const first = []; item(first, M, a[1], depth + 1);
          const sec = F.get(a[2]);
          if (op === 'DIFFERENCE' && sec && sec.type === 'IFCHALFSPACESOLID') {
            const pl = F.get(sec.a[0]); if (pl && pl.type === 'IFCPLANE') { const Mp = mul(M, a2p(pl.a[0])); out.push(...clipPlane(first, Mp, sec.a[1] !== false)); return; }
          }
          if (op === 'DIFFERENCE' && sec && sec.type === 'IFCPOLYGONALBOUNDEDHALFSPACE') { warn('recorte limitado (ignorado)'); }

          if (op === 'UNION') item(out, M, a[2], depth + 1);
          return;
        }
        case 'IFCHALFSPACESOLID': case 'IFCPOLYGONALBOUNDEDHALFSPACE': return;
        case 'IFCCSGSOLID': item(out, M, a[0], depth + 1); return;
        case 'IFCBLOCK': { const P = mul(M, a2p(a[0])); box(out, P, 0, 0, 0, a[1], a[2], a[3]); return; }
        case 'IFCRECTANGULARPYRAMID': { const P = mul(M, a2p(a[0])); box(out, P, 0, 0, 0, a[1], a[2], a[3]); warn('pirâmide (caixa)'); return; }
        case 'IFCRIGHTCIRCULARCYLINDER': { const P = mul(M, a2p(a[0])); extrude(out, P, [{ o: circ(a[2]), h: [] }], [0, 0, 1], a[1]); return; }
        case 'IFCRIGHTCIRCULARCONE': { const P = mul(M, a2p(a[0])); extrude(out, P, [{ o: circ(a[2]), h: [] }], [0, 0, 1], a[1]); warn('cone (cilindro)'); return; }
        case 'IFCSPHERE': { const P = mul(M, a2p(a[0])); const R = a[1]; revolve(out, P, [{ o: arcPts([0, 0], R, -Math.PI / 2, Math.PI / 2, true).concat([[0, 0]]), h: [] }], null, TAU); return; }
        case 'IFCBOUNDINGBOX': { const c = pt(a[0]); box(out, M, c[0], c[1], c[2], c[0] + a[1], c[1] + a[2], c[2] + a[3]); return; }
        case 'IFCGEOMETRICSET': case 'IFCGEOMETRICCURVESET': case 'IFCANNOTATIONFILLAREA': case 'IFCTEXTLITERAL': case 'IFCTEXTLITERALWITHEXTENT': case 'IFCPOLYLINE': case 'IFCCARTESIANPOINT': return;
        default: warn('geometria ' + e.type);
      }
    }

    /* ---- estilos (cor por item de representação) ---- */
    const itemColor = new Map();
    function styleColor(sr, depth) {
      const s = F.get(sr); if (!s || depth > 5) return null;
      if (s.type === 'IFCPRESENTATIONSTYLEASSIGNMENT') { for (const x of s.a[0]) { const c = styleColor(x, depth + 1); if (c) return c; } return null; }
      if (s.type === 'IFCSURFACESTYLE') { for (const x of s.a[2] || []) { const c = styleColor(x, depth + 1); if (c) return c; } return null; }
      if (s.type === 'IFCSURFACESTYLERENDERING' || s.type === 'IFCSURFACESTYLESHADING') {
        const c = F.get(s.a[0]); if (!c) return null; const tr = typeof s.a[1] === 'number' ? s.a[1] : (s.a[1] && s.a[1].v ? s.a[1].v[0] : 0);
        return [c.a[1], c.a[2], c.a[3], 1 - (tr || 0)];

      return null;
    }
    for (const id of F.of('IFCSTYLEDITEM')) {
      const s = F.get(id); if (!s.a[0]) continue;
      for (const st of s.a[1] || []) { const c = styleColor(st, 0); if (c) { itemColor.set(s.a[0].r, c); break; } }
    }
    function repColor(rep) {
      for (const it of rep.a[3] || []) {
        if (itemColor.has(it.r)) return itemColor.get(it.r);
        const e = F.get(it); if (e && e.type === 'IFCMAPPEDITEM') { const src = F.get(e.a[0]); const rr = F.get(src.a[1]); const c = repColor(rr); if (c) return c; }
        if (e && (e.type === 'IFCBOOLEANCLIPPINGRESULT' || e.type === 'IFCBOOLEANRESULT')) { let x = e; let k = 0; while (x && (x.type === 'IFCBOOLEANCLIPPINGRESULT' || x.type === 'IFCBOOLEANRESULT') && k++ < 20) { if (itemColor.has(x.a[1].r)) return itemColor.get(x.a[1].r); x = F.get(x.a[1]); } }
      }

    }

    /* ---- estrutura espacial ---- */
    await prog('Lendo pavimentos', 0.36);
    const parentOf = new Map(); // filho -> pai (agregação/aninhamento)
    for (const t of ['IFCRELAGGREGATES', 'IFCRELNESTS']) for (const id of F.of(t)) { const a = F.get(id).a; if (!a[4]) continue; for (const c of a[5] || []) parentOf.set(c.r, a[4].r); }
    const containedIn = new Map();
    for (const id of F.of('IFCRELCONTAINEDINSPATIALSTRUCTURE')) { const a = F.get(id).a; for (const c of a[4] || []) containedIn.set(c.r, a[5].r); }
    const storeys = F.of('IFCBUILDINGSTOREY').map(id => { const e = F.get(id); const M = lp(e.a[5]); return { id, gid: e.a[0], name: e.a[2] || e.a[7] || ('Pavimento #' + id), longName: e.a[7] || '', elev: M[11] * scale, elevAttr: typeof e.a[9] === 'number' ? e.a[9] * scale : null }; });
    const stSet = new Set(storeys.map(s => s.id));
    function storeyOf(id) { let x = id, k = 0; while (x && k++ < 30) { if (stSet.has(x)) return x; x = containedIn.get(x) || parentOf.get(x); } return null; }

    // tipos, propriedades e materiais (índices para consulta sob demanda)
    const typeOf = new Map(), psetsOf = new Map(), matOf = new Map();
    for (const id of F.of('IFCRELDEFINESBYTYPE')) { const a = F.get(id).a; for (const o of a[4] || []) typeOf.set(o.r, a[5].r); }
    for (const id of F.of('IFCRELDEFINESBYPROPERTIES')) { const a = F.get(id).a; if (!a[5]) continue; for (const o of a[4] || []) { let l = psetsOf.get(o.r); if (!l) psetsOf.set(o.r, l = []); l.push(a[5].r); } }
    for (const id of F.of('IFCRELASSOCIATESMATERIAL')) { const a = F.get(id).a; for (const o of a[4] || []) matOf.set(o.r, a[5].r); }

    /* ---- produtos ---- */
    const SKIP = new Set(['IFCOPENINGELEMENT', 'IFCOPENINGSTANDARDCASE', 'IFCVIRTUALELEMENT', 'IFCANNOTATION', 'IFCGRID', 'IFCPROJECT', 'IFCBUILDING', 'IFCBUILDINGSTOREY', 'IFCSITE', 'IFCSPACE', 'IFCDISTRIBUTIONPORT', 'IFCALIGNMENT', 'IFCZONE']);
    const products = [];
    for (let t = 0; t < F.types.length; t++) {
      const tn = F.types[t]; if (SKIP.has(tn) || !tn.startsWith('IFC')) continue;
      const ids = F.byType.get(tn); if (!ids || !ids.length) continue;
      // amostra: o 1º precisa ter GlobalId e placement
      const k0 = F.ids.get(ids[0]); if (F.text[F.st[k0] + 1] !== "'") continue;
      const s = F.get(ids[0]); if (!s || s.a.length < 7 || typeof s.a[0] !== 'string') continue;
      if (s.a[5] != null && !(s.a[5].r && F.type(s.a[5].r) === 'IFCLOCALPLACEMENT')) continue;
      if (s.a[6] != null && !(s.a[6].r && F.type(s.a[6].r) === 'IFCPRODUCTDEFINITIONSHAPE')) continue;

    const med = v => { v.sort((a, b) => a - b); return v.length ? v[Math.floor(v.length / 2)] : 0; };

    const elements = []; let tri = 0; let last = Date.now();
    for (let n = 0; n < products.length; n++) {

      const el = { eid: id, gid: a[0], type: e.type, name: a[2] || '', desc: a[3] || '', objType: a[4] || '', tag: typeof a[7] === 'string' ? a[7] : '', storey: storeyOf(id), parent: parentOf.get(id) || null };
      if (a[6] && a[6].r) {
        const M = lp(a[5]); const shape = F.get(a[6]); const reps = (shape.a[2] || []).map(r => F.get(r)).filter(Boolean);
        let pick = reps.find(r => r.a[1] === 'Body') || reps.find(r => r.a[1] === 'Facetation') || reps.find(r => !r.a[1] && r.a[2] !== 'Curve2D') || null;
        let boxOnly = false; if (!pick) { pick = reps.find(r => r.a[1] === 'Box'); boxOnly = !!pick; }

            const f = new Float32Array(out.length);
            for (let i = 0; i < out.length; i += 3) { f[i] = out[i] * scale - origin[0]; f[i + 1] = out[i + 1] * scale - origin[1]; f[i + 2] = out[i + 2] * scale - origin[2]; }
            el.pos = f; el.color = repColor(pick); tri += out.length / 9;
            let x0 = Infinity, y0 = Infinity, z0 = Infinity, x1 = -Infinity, y1 = -Infinity, z1 = -Infinity;
            for (let i = 0; i < f.length; i += 3) { const x = f[i], y = f[i + 1], z = f[i + 2]; if (x < x0) x0 = x; if (y < y0) y0 = y; if (z < z0) z0 = z; if (x > x1) x1 = x; if (y > y1) y1 = y; if (z > z1) z1 = z; }

    }

    const byEid = new Map(elements.map(e => [e.eid, e])); let nVoid = 0;

      const a = F.get(id).a; const host = byEid.get(a[4] && a[4].r); if (!host || !host.pos) continue;
      const op = F.get(a[5]); if (!op || !op.a[6] || !op.a[6].r) continue;
      try {
        const M = lp(op.a[5]); const shape = F.get(op.a[6]); const reps = (shape.a[2] || []).map(r => F.get(r)).filter(Boolean);
        const pick = reps.find(r => r.a[1] === 'Body') || reps.find(r => r.a[2] !== 'Curve2D') || null; if (!pick) continue;
        const out = []; for (const it of pick.a[3] || []) item(out, M, it, 0); if (!out.length) continue;
        const f = new Float32Array(out.length); for (let i = 0; i < out.length; i += 3) { f[i] = out[i] * scale - origin[0]; f[i + 1] = out[i + 1] * scale - origin[1]; f[i + 2] = out[i + 2] * scale - origin[2] }

    }

    const stSorted = storeys.slice().sort((a, b) => a.elev - b.elev);
    for (const el of elements) {
      if (!el.storey && el.parent) el.storey = storeyOf(el.parent);
      if (!el.storey && el.bb && stSorted.length) { const z = el.bb[2] + origin[2] + 0.05; let s = stSorted[0]; for (const t of stSorted) if (t.elev <= z) s = t; el.storey = s.id; el.storeyGuess = true; }
    }
    const projE = F.of('IFCPROJECT')[0]; const proj = projE ? F.get(projE).a : [];

    function props(eid) { // propriedades sob demanda
      const out = [];
      const val = v => { if (v == null) return ''; if (typeof v === 'object' && v.t) return val(v.v[0]); if (typeof v === 'object' && v.e) return v.e; if (v === true) return 'Sim'; if (v === false) return 'Não'; return typeof v === 'number' ? +v.toFixed(4) : String(v); };
      const t = typeOf.get(eid); if (t) { const te = F.get(t); out.push({ g: 'Tipo', k: te.type.replace('IFC', ''), v: te.a[2] || '' }); for (const ps of te.a[5] || []) addPset(ps); }
      const m = matOf.get(eid); if (m) out.push({ g: 'Material', k: 'Material', v: matName(m) });
      for (const ps of psetsOf.get(eid) || []) addPset({ r: ps });
      function addPset(r) {
        const p = F.get(r); if (!p) return;
        if (p.type === 'IFCPROPERTYSET') for (const pr of p.a[4] || []) { const q = F.get(pr); if (q && q.type === 'IFCPROPERTYSINGLEVALUE') out.push({ g: p.a[2], k: q.a[0], v: val(q.a[2]) }); }
        if (p.type === 'IFCELEMENTQUANTITY') for (const pr of p.a[5] || []) { const q = F.get(pr); if (q) out.push({ g: p.a[2], k: q.a[0], v: val(q.a[3]) }); }
      }
      function matName(r) { const x = F.get(r); if (!x) return ''; switch (x.type) {
        case 'IFCMATERIAL': return x.a[0];
        case 'IFCMATERIALLIST': return x.a[0].map(matName).join(', ');
        case 'IFCMATERIALLAYERSETUSAGE': return matName(x.a[0]);
        case 'IFCMATERIALLAYERSET': return x.a[0].map(l => { const L = F.get(l); return matName(L.a[0]) + (L.a[1] ? ' ' + (+(L.a[1] * scale * 100).toFixed(1)) + ' cm' : ''); }).join(' | ');
        case 'IFCMATERIALPROFILESETUSAGE': return matName(x.a[0]);
        case 'IFCMATERIALPROFILESET': return (x.a[2] || []).map(p => matName(F.get(p).a[2])).join(', ');
        case 'IFCMATERIALCONSTITUENTSET': return (x.a[2] || []).map(c => matName(F.get(c).a[2])).join(', ');
        default: return x.type.replace('IFC', ''); } }
      return out;
    }
    await prog('Pronto', 1);
    return { schema, scale, origin, project: proj[2] || proj[3] || '', storeys, elements, triangles: tri, voids: nVoid, log, entities: F.count, props, products: products.length };
  }
  root.IFCReader = { readIFC, parseArgs, decodeStr };

function geo2(e){

  const path=new Path2D(); for(let i=0;i<tris.length;i+=6){path.moveTo(tris[i],tris[i+1]); path.lineTo(tris[i+2],tris[i+3]); path.lineTo(tris[i+4],tris[i+5]); path.closePath()}
  const cnt=new Map(); const k=(x,y)=>Math.round(x*500)+','+Math.round(y*500);
  for(let i=0;i<tris.length;i+=6){ const v=[[tris[i],tris[i+1]],[tris[i+2],tris[i+3]],[tris[i+4],tris[i+5]]];
    for(let j=0;j<3;j++){ const a=v[j],b=v[(j+1)%3]; const ka=k(a[0],a[1]),kb=k(b[0],b[1]); if(ka===kb) continue; const key=ka<kb?ka+'|'+kb:kb+'|'+ka; const o=cnt.get(key); if(o) o.n++; else cnt.set(key,{n:1,a,b}) } }

  if(e.voids&&e.voids.length){ vtris=[]; vpath=new Path2D(); vbb=[];
    for(const f of e.voids){ const vt=[]; for(let pass=0;pass<2&&!vt.length;pass++) for(let i=0;i<f.length;i+=9){ const ax=f[i],ay=f[i+1],bx=f[i+3],by=f[i+4],cx=f[i+6],cy=f[i+7]; const nz=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax); if(pass===0?nz>1e-7:Math.abs(nz)>1e-7){ vt.push(ax,ay,bx,by,cx,cy) } }
      if(!vt.length) continue; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(let i=0;i<vt.length;i+=2){x0=Math.min(x0,vt[i]);x1=Math.max(x1,vt[i]);y0=Math.min(y0,vt[i+1]);y1=Math.max(y1,vt[i+1])}
      vtris.push(vt); vbb.push([x0,y0,x1,y1]); for(let i=0;i<vt.length;i+=6){ vpath.moveTo(vt[i],vt[i+1]); vpath.lineTo(vt[i+2],vt[i+3]); vpath.lineTo(vt[i+4],vt[i+5]); vpath.closePath() }
      segs.push(x0,y0,x1,y0, x1,y0,x1,y1, x1,y1,x0,y1, x0,y1,x0,y0); edge.rect(x0,y0,x1-x0,y1-y0) }
    if(!vtris.length){vtris=null; vpath=null} }
  e.g2={tris,path,edge,segs,vtris,vbb,vpath}; return e.g2;
}
function inTris(tris,x,y){ for(let i=0;i<tris.length;i+=6){ const ax=tris[i],ay=tris[i+1],bx=tris[i+2],by=tris[i+3],cx=tris[i+4],cy=tris[i+5];
  const d=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy); if(Math.abs(d)<1e-12) continue; const l1=((by-cy)*(x-cx)+(cx-bx)*(y-cy))/d, l2=((cy-ay)*(x-cx)+(ax-cx)*(y-cy))/d; if(l1>=-1e-6&&l2>=-1e-6&&l1+l2<=1+1e-6) return true } return false }

const inElem=(e,x,y)=>inTris(geo2(e).tris,x,y)&&!inVoid(e,x,y);

function snapPoint(pav,x,y,except){ const tolV=10/P.s, tolE=7/P.s; let best=null; const ar=rawAreasOn(pav,except);
  for(const a of ar) for(const r of [a.pts,...a.holes]) for(let i=0;i<r.length;i++){ const d=Math.hypot(r[i][0]-x,r[i][1]-y); if(d<tolV&&(!best||d<best.d)) best={x:r[i][0],y:r[i][1],d} }

  for(const a of ar) for(const r of [a.pts,...a.holes]) for(let i=0,j=r.length-1;i<r.length;j=i++){ const A=r[j],B=r[i]; const dx=B[0]-A[0],dy=B[1]-A[1]; const l=dx*dx+dy*dy; if(!l) continue; let t=((x-A[0])*dx+(y-A[1])*dy)/l; t=Math.max(0,Math.min(1,t)); const px=A[0]+t*dx,py=A[1]+t*dy; const d=Math.hypot(px-x,py-y); if(d<tolE&&(!best||d<best.d)) best={x:px,y:py,d} }

function snapStructure(st,x,y){ const tolV=10/P.s, tolE=8/P.s; const g=stGrid(st); const seen=new Set(); let bv=null, be=null;
  for(let cx=Math.floor(x-tolV);cx<=Math.floor(x+tolV);cx++) for(let cy=Math.floor(y-tolV);cy<=Math.floor(y+tolV);cy++){ const l=g.get(cx+','+cy); if(!l) continue;
    for(const e of l){ if(seen.has(e)) continue; seen.add(e); if(x<e.bb[0]-tolV||x>e.bb[3]+tolV||y<e.bb[1]-tolV||y>e.bb[4]+tolV) continue; const s=geo2(e).segs;
      for(let i=0;i<s.length;i+=4){ const ax=s[i],ay=s[i+1],bx=s[i+2],by=s[i+3];

const ringC=pts=>{ const r=pts.map(p=>[p[0],p[1]]); const f=r[0], l=r[r.length-1]; if(f[0]!==l[0]||f[1]!==l[1]) r.push([f[0],f[1]]); return r };

  const a=aid?areaById(aid):{id:uid('a-'),pav:geo.pav,titulo:'',riscos:[],trab:'',obs:''}; if(!a) return;
  let rs=clone(a.riscos||[]);
  openSheet(aid?'Editar área':'Nova área · '+(geo?geo.pav:a.pav),`<form id="fA" class="fg" autocomplete="off">
    <div class="fld full"><label for="aTit">Título da área</label><input id="aTit" list="dlTit" value="${esc(a.titulo||'')}" placeholder="Ex.: Baia de armazenamento de materiais"></div>
    <div class="fld full"><label for="aPre">Preencher riscos com um modelo (opcional)</label><select id="aPre"><option value="">Escolha um modelo de área…</option>${PRESETS.map((p,i)=>`<option value="${i}">${esc(p[0])}</option>`).join('')}</select></div>
    <div class="fsec"><span>Riscos · NR-5</span><button type="button" class="btn sm" id="aAdd">+ Risco</button></div>
    <div class="full" id="rkBox" style="display:grid;gap:8px"></div>
    <div class="fsec"><span>Hachura</span></div>
    <div class="full hpick" id="hPick" role="group" aria-label="Padrão da hachura"></div>
    <div id="hOpts"><div class="fld"><label for="hCor">Cor</label><select id="hCor">${HCOL.map(([v,n])=>`<option value="${v}">${esc(n)}</option>`).join('')}</select></div>
      <div class="fld"><label for="hEsp">Espaçamento (m)</label><input id="hEsp" inputmode="decimal"></div>
      <div class="fld"><label for="hAng">Ângulo</label><select id="hAng">${[0,30,45,60,90,135].map(v=>`<option value="${v}">${v}°</option>`).join('')}</select></div>
      <div class="fld"><label for="hOp">Intensidade</label><input type="range" id="hOp" min="10" max="100" step="5"></div></div>
    <div class="fld"><label for="aTrab">Trabalhadores expostos</label><input id="aTrab" inputmode="numeric" value="${esc(a.trab||'')}" placeholder="Ex.: 4"></div>
    <div class="fld full"><label for="aObs">Medidas de proteção e observações</label><textarea id="aObs" placeholder="Ex.: uso de protetor auricular; proteção nas partes móveis">${esc(a.obs||'')}</textarea></div>
    </form>`,
    `<span class="msg" id="aMsg"></span><button class="btn ghost" id="aCan">Cancelar</button><button class="btn" id="aSave">${aid?'Salvar':'Salvar área'}</button>`);
  const box=$('rkBox');
  let h=a.hach&&a.hach.p?clone(a.hach):{p:''};
  const predC=()=>{ let best=null; for(const r of rs) if(GBY[r.g]&&INT[r.i]&&(!best||IORD[r.i]>IORD[best.i])) best=r; return best?GBY[best.g].c:css('--area') };
  const drawH=()=>{ const P0=$('hPick'); if(!P0) return; P0.innerHTML=HATCH.map(x=>`<button type="button" data-h="${x.k}" aria-pressed="${(h.p||'')===x.k}"><canvas width="108" height="68"></canvas>${esc(x.n)}</button>`).join('');
    P0.querySelectorAll('[data-h]').forEach(bt=>{ const p=bt.dataset.h; const hh=p?(p===h.p?h:Object.assign(hatchDef(p),h.p?{c:h.c}:{})):null; hatchPreview(bt.querySelector('canvas'),hh,predC());
      bt.onclick=()=>{ if(!p) h={p:''}; else if(p!==h.p){ const d=hatchDef(p); h=h.p?Object.assign(d,{c:h.c,e:(h.p==='pontos')===(p==='pontos')?h.e:d.e}):d } syncH() } });
    const o=$('hOpts'); o.style.display=h.p?'':'none';
    if(h.p){ $('hCor').value=h.c||'risco'; $('hEsp').value=String(h.e??.5).replace('.',','); $('hAng').value=String(h.ang??0); $('hAng').disabled=h.p==='pontos'||h.p==='solido'; $('hEsp').disabled=h.p==='solido'; $('hOp').value=Math.round((h.op??.85)*100) } };
  const syncH=()=>drawH();
  const readRs=()=>{ box.querySelectorAll('.rk').forEach((row,i)=>{ if(rs[i]) rs[i].ag=row.querySelector('input').value.trim() }) };
  const draw=()=>{ box.innerHTML=rs.length?rs.map((r,i)=>{ const g=GBY[r.g]; return `<div class="rk" data-i="${i}">
      <span class="gname" style="color:${g.t}">${g.n} · ${INT[r.i].n}</span>
      <span class="gpick" role="group" aria-label="Grupo">${GR.map(x=>`<button type="button" data-g="${x.k}" aria-pressed="${x.k===r.g}" title="${x.n}" aria-label="${x.n}" style="background:${x.c}"></button>`).join('')}</span>
      <span class="ipick" role="group" aria-label="Intensidade">${['P','M','G'].map(k=>`<button type="button" data-in="${k}" aria-pressed="${k===r.i}" title="${INT[k].n}">${k}</button>`).join('')}</span>
      <input list="dl_${r.g}" value="${esc(r.ag||'')}" placeholder="Agente: ${esc(g.ex[0])}" aria-label="Agente de risco">
      <span class="rm"><button type="button" data-up title="Subir">↑</button><button type="button" data-dn title="Descer">↓</button><button type="button" data-rm title="Remover">✕</button></span></div>` }).join('')+GR.map(g=>`<datalist id="dl_${g.k}">${g.ex.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`).join('')
      :'<p class="muted" style="margin:0">Nenhum risco ainda. Use “+ Risco” ou escolha um modelo de área.</p>';
    box.querySelectorAll('.rk').forEach(row=>{ const i=+row.dataset.i;
      row.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ readRs(); rs[i].g=b.dataset.g; draw() });
      row.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>{ readRs(); rs[i].i=b.dataset.in; draw() });
      row.querySelector('[data-rm]').onclick=()=>{ readRs(); rs.splice(i,1); draw() };
      row.querySelector('[data-up]').onclick=()=>{ readRs(); if(i>0){ [rs[i-1],rs[i]]=[rs[i],rs[i-1]] } draw() };
      row.querySelector('[data-dn]').onclick=()=>{ readRs(); if(i<rs.length-1){ [rs[i+1],rs[i]]=[rs[i],rs[i+1]] } draw() }; }); drawH() };
  draw();
  $('hCor').onchange=()=>{ h.c=$('hCor').value; drawH() };
  $('hEsp').onchange=()=>{ const v=parseFloat($('hEsp').value.replace(',','.')); if(v>0) h.e=Math.max(.05,Math.min(10,v)); drawH() };
  $('hAng').onchange=()=>{ h.ang=+$('hAng').value; drawH() };
  $('hOp').oninput=()=>{ h.op=+$('hOp').value/100; const P0=$('hPick').querySelector('[aria-pressed="true"] canvas'); if(P0&&h.p) hatchPreview(P0,h,predC()) };
  $('aAdd').onclick=()=>{ readRs(); rs.push({g:'aci',i:'P',ag:''}); draw(); const ins=box.querySelectorAll('.rk input'); if(ins.length) ins[ins.length-1].focus() };
  const applyPre=i=>{ const p=PRESETS[i]; if(!p) return; readRs(); rs=p[1].map(([g,k,ag])=>({g,i:k,ag})); if(!$('aTit').value.trim()) $('aTit').value=p[0]; draw() };
  $('aPre').onchange=()=>{ const i=$('aPre').value; if(i==='') return; if(rs.length&&rs.some(r=>r.ag)){ readRs() } applyPre(+i); $('aPre').value='' };
  $('aTit').addEventListener('change',()=>{ if(rs.length) return; const i=PRESETS.findIndex(p=>norm(p[0])===norm($('aTit').value)); if(i>=0) applyPre(i) });
  $('aCan').onclick=closeSheet;
  $('aSave').onclick=async()=>{ readRs(); const t=$('aTit').value.trim(); if(!t){ $('aMsg').textContent='Dê um título para a área.'; $('aMsg').className='msg err'; $('aTit').focus(); return }
    const na=Object.assign(clone(a),geo||{}); na.titulo=t; na.riscos=rs.map(r=>({g:r.g,i:r.i,ag:r.ag||''})); na.trab=$('aTrab').value.trim(); na.obs=$('aObs').value.trim(); if(!na.criado) na.criado=new Date().toISOString(); if(h.p) na.hach={p:h.p,c:h.c||'risco',e:+h.e||.5,ang:+(h.ang??0),op:+(h.op??.85)}; else delete na.hach;
    closeSheet(); if(await Store.saveArea(na)){ afterDataChange(); select({k:'a',id:na.id}); toast(aid?'Área salva.':'Área criada. Arraste o título na planta se quiser mudar a posição do rótulo.') } };
}
function copyForm(aid){
  if(!canEdit()) return;
  const a=areaById(aid); if(!a) return; const sts=S.storeys.slice().reverse().filter(s=>s.name!==a.pav);
  openSheet('Copiar “'+(a.titulo||'área')+'”',`<p class="muted" style="margin-top:0">Cria uma cópia da área, com os mesmos riscos, no mesmo lugar da planta dos pavimentos escolhidos. Onde já houver área marcada, a cópia é recortada.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px">${sts.map((s,i)=>`<label class="chk"><input type="checkbox" data-s="${i}">${esc(s.name)}</label>`).join('')}</div>`,
    `<span class="msg" id="cpMsg"></span><button class="btn ghost" id="cpC">Cancelar</button><button class="btn" id="cpOk">Copiar</button>`);
  $('cpC').onclick=closeSheet;
  $('cpOk').onclick=async()=>{ const sel=[...$('ovlB').querySelectorAll('[data-s]')].filter(x=>x.checked).map(x=>sts[+x.dataset.s]); if(!sel.length){ $('cpMsg').textContent='Escolha ao menos um pavimento.'; return }
    $('cpOk').disabled=true; let ok=0, skip=0; const ptsM=a.pts.map(abs2m);
    for(const st of sel){ const parts=clipNewArea(st.name,ptsM,null); if(!parts.length){ skip++; continue } const q=parts[0]; const na=clone(a); na.id=uid('a-'); na.pav=st.name; na.pts=q.pts.map(m2abs); if(q.holes.length) na.holes=q.holes.map(h=>h.map(m2abs)); else delete na.holes; na.criado=new Date().toISOString(); if(na.lx!=null&&!inPoly(q.pts,...abs2m([na.lx,na.ly]))){ delete na.lx; delete na.ly } if(await Store.saveArea(na)) ok++; if(Store.kind==='db') await sleep(40) }
    closeSheet(); afterDataChange(); toast(ok+' cópia(s) criada(s)'+(skip?'; '+skip+' pavimento(s) já tinham área ocupando todo o lugar':'')+'.',5000) };
}

  const c=S.cfg; const pct=Math.round((+c.escSimb||1)*100);

    <div class="fld"><span class="l">Título da área</span><div class="seg" role="group"><button type="button" data-tp="abaixo" aria-pressed="${c.tituloPos!=='acima'}">Abaixo dos círculos</button><button type="button" data-tp="acima" aria-pressed="${c.tituloPos==='acima'}">Acima dos círculos</button></div></div>

/* ======================= hachuras ======================= */
const HATCH=[{k:'',n:'Nenhuma'},{k:'diag',n:'Diagonal'},{k:'cruz',n:'Cruzada'},{k:'grade',n:'Grade'},{k:'horiz',n:'Linhas'},{k:'pontos',n:'Pontos'},{k:'solido',n:'Sólida'}];
const HCOL=[['risco','Cor do risco de maior intensidade'],['area','Laranja (contorno das áreas)'],['#5cb531','Verde'],['#1736e0','Azul'],['#e3141b','Vermelho'],['#f3d500','Amarelo'],['#6c4a33','Marrom'],['#59646e','Cinza'],['#1b2733','Preto']];
const hatchDef=p=>({p,c:p==='grade'?'#5cb531':'risco',e:p==='pontos'||p==='grade'?.6:.5,ang:p==='diag'||p==='cruz'?45:0,op:p==='solido'?.3:.85});
function hatchColor(h,it,pal){ return h.c==='risco'?(it.color||pal.area):h.c==='area'?pal.area:(h.c||pal.area) }
function drawHatch(ctx,it,V,pal,lw){ const h=it.a.hach; if(!h||!h.p) return; const col=hatchColor(h,it,pal); const k=V.D*V.s; const e=Math.max(.05,+h.e||.5);
  const [x0,y0,x1,y1]=it.bb; const many=(x1-x0)*(y1-y0)/(e*e)>60000;
  ctx.save(); ctx.setTransform(k,0,0,-k,V.D*V.tx,V.D*V.ty); ctx.clip(it.path,'evenodd'); ctx.globalAlpha=h.op??.85; ctx.strokeStyle=col; ctx.fillStyle=col;
  if(h.p==='solido'||e*k<3||many){ if(h.p!=='solido') ctx.globalAlpha*=.3; ctx.fill(it.path,'evenodd'); ctx.restore(); return }
  ctx.lineWidth=lw/k;
  if(h.p==='pontos'){ const r=Math.max(lw*1.2/k,e*.08); ctx.beginPath(); let i=0; for(let x=Math.floor(x0/e)*e;x<=x1+e;x+=e,i++){ const oy=(i%2)?e/2:0; for(let y=Math.floor(y0/e)*e-e;y<=y1+e;y+=e){ ctx.moveTo(x+r,y+oy); ctx.arc(x,y+oy,r,0,TAU) } } ctx.fill(); ctx.restore(); return }
  const a0=+(h.ang??0); const fam=h.p==='cruz'||h.p==='grade'?[a0,a0+90]:[a0];
  const cx=(x0+x1)/2, cy=(y0+y1)/2, R=Math.hypot(x1-x0,y1-y0)/2+e; ctx.beginPath();
  for(const a of fam){ const r=a*Math.PI/180, ux=Math.cos(r), uy=Math.sin(r), nx=-uy, ny=ux; const c0=Math.round((cx*nx+cy*ny)/e), n=Math.ceil(R/e);
    for(let i=-n;i<=n;i++){ const d=(c0+i)*e, px=nx*d, py=ny*d, t0=(cx-px)*ux+(cy-py)*uy; ctx.moveTo(px+ux*(t0-R),py+uy*(t0-R)); ctx.lineTo(px+ux*(t0+R),py+uy*(t0+R)) } }
  ctx.stroke(); ctx.restore() }
function hatchPreview(cv,h,color){ const W=cv.width,H=cv.height; const ctx=cv.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); if(!h||!h.p) return; const s=W/3.2; const hm=H/s;
  const path=new Path2D(); path.rect(0,0,3.2,hm); drawHatch(ctx,{a:{hach:h},bb:[0,0,3.2,hm],path,color},{s,D:1,tx:0,ty:H},{area:css('--area')},2) }
function hatchTex(h,col){ const N=64; const cv=document.createElement('canvas'); cv.width=cv.height=N; const x=cv.getContext('2d'); x.strokeStyle=col; x.fillStyle=col; x.lineWidth=5;
  if(h.p==='solido') x.fillRect(0,0,N,N); else if(h.p==='pontos'){ x.beginPath(); x.arc(N/2,N/2,8,0,TAU); x.fill() } else { x.beginPath(); x.moveTo(0,N/2); x.lineTo(N,N/2); if(h.p==='grade'||h.p==='cruz'){ x.moveTo(N/2,0); x.lineTo(N/2,N) } x.stroke() }
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; const e=Math.max(.05,+h.e||.5); t.repeat.set(1/e,1/e); t.rotation=(+(h.ang??0))*Math.PI/180; return t }

const normRot=r=>((((+r||0)+180)%360)+360)%360-180;
function drawSymGlyph(ctx,t,u){
  const W='#ffffff', G='#0a8f4a', RD='#d71920', BL='#1360a8', OR='#ef7d00', YE='#f6d000', K='#161b20';
  const sq=f=>{ roundRect(ctx,-u,-u,2*u,2*u,u*.2); ctx.fillStyle=f; ctx.fill() };
  const tri=()=>{ ctx.beginPath(); ctx.moveTo(0,-u*1.02); ctx.lineTo(u*1.08,u*.86); ctx.lineTo(-u*1.08,u*.86); ctx.closePath(); ctx.fillStyle=YE; ctx.fill(); ctx.lineJoin='round'; ctx.lineWidth=u*.14; ctx.strokeStyle=K; ctx.stroke() };
  const bolt=(s,c,dy)=>{ const Pp=[[.18,-1],[-.5,.16],[-.04,.16],[-.22,1],[.5,-.24],[.04,-.24]]; ctx.beginPath(); Pp.forEach((p,i)=>{ const x=p[0]*s, y=p[1]*s+(dy||0); i?ctx.lineTo(x,y):ctx.moveTo(x,y) }); ctx.closePath(); ctx.fillStyle=c; ctx.fill() };
  const head=(x,y,a,s)=>{ ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(s,0); ctx.lineTo(-s*.6,-s*.75); ctx.lineTo(-s*.6,s*.75); ctx.closePath(); ctx.fill(); ctx.restore() };
  ctx.save(); ctx.lineCap='round';
  switch(t){
    case 'ext': sq(RD); ctx.fillStyle=W; roundRect(ctx,-u*.3,-u*.32,u*.6,u*1.02,u*.22); ctx.fill(); ctx.fillRect(-u*.13,-u*.58,u*.26,u*.24); ctx.strokeStyle=W; ctx.lineWidth=u*.13; ctx.beginPath(); ctx.moveTo(u*.1,-u*.48); ctx.quadraticCurveTo(u*.62,-u*.52,u*.55,u*.15); ctx.stroke(); break;
    case 'hid': sq(RD); ctx.fillStyle=W; ctx.font='700 '+(u*1.35)+'px "Titillium Web","Segoe UI",Arial,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('H',0,u*.08); break;
    case 'saida': roundRect(ctx,-u*1.5,-u*.82,u*3,u*1.64,u*.18); ctx.fillStyle=G; ctx.fill(); ctx.strokeStyle=W; ctx.lineWidth=u*.13; ctx.strokeRect(u*.45,-u*.56,u*.66,u*1.12); ctx.beginPath(); ctx.moveTo(-u*1.15,0); ctx.lineTo(u*.02,0); ctx.stroke(); ctx.fillStyle=W; head(u*.12,0,0,u*.34); break;
    case 'rota': ctx.beginPath(); ctx.moveTo(-u,-u*.34); ctx.lineTo(u*.12,-u*.34); ctx.lineTo(u*.12,-u*.82); ctx.lineTo(u*1.05,0); ctx.lineTo(u*.12,u*.82); ctx.lineTo(u*.12,u*.34); ctx.lineTo(-u,u*.34); ctx.closePath(); ctx.fillStyle=G; ctx.fill(); ctx.lineJoin='round'; ctx.strokeStyle=W; ctx.lineWidth=u*.08; ctx.stroke(); break;
    case 'encontro': sq(G); ctx.fillStyle=W; for(let i=0;i<4;i++){ ctx.save(); ctx.rotate(i*Math.PI/2); ctx.beginPath(); ctx.moveTo(0,-u*.2); ctx.lineTo(-u*.26,-u*.64); ctx.lineTo(u*.26,-u*.64); ctx.closePath(); ctx.fill(); ctx.restore() } ctx.beginPath(); ctx.arc(0,0,u*.12,0,TAU); ctx.fill(); break;
    case 'socorro': sq(G); ctx.fillStyle=W; ctx.fillRect(-u*.2,-u*.62,u*.4,u*1.24); ctx.fillRect(-u*.62,-u*.2,u*1.24,u*.4); break;
    case 'aten': tri(); ctx.fillStyle=K; ctx.fillRect(-u*.09,-u*.42,u*.18,u*.7); ctx.beginPath(); ctx.arc(0,u*.55,u*.11,0,TAU); ctx.fill(); break;
    case 'eletr': tri(); bolt(u*.5,K,u*.14); break;
    case 'epi': ctx.beginPath(); ctx.arc(0,0,u,0,TAU); ctx.fillStyle=BL; ctx.fill(); ctx.fillStyle=W; ctx.beginPath(); ctx.arc(0,u*.18,u*.52,Math.PI,0); ctx.closePath(); ctx.fill(); roundRect(ctx,-u*.72,u*.14,u*1.44,u*.2,u*.08); ctx.fill(); ctx.fillRect(-u*.07,-u*.42,u*.14,u*.2); break;
    case 'proib': ctx.beginPath(); ctx.arc(0,0,u*.9,0,TAU); ctx.fillStyle=W; ctx.fill(); ctx.lineWidth=u*.2; ctx.strokeStyle=RD; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-u*.62,-u*.62); ctx.lineTo(u*.62,u*.62); ctx.stroke(); break;

const R3=p=>[Math.round(p[0]*1000)/1000,Math.round(p[1]*1000)/1000];
function trisMP(t){ const out=[]; for(let i=0;i<t.length;i+=6){ const a=R3([t[i],t[i+1]]),b=R3([t[i+2],t[i+3]]),c=R3([t[i+4],t[i+5]]); const ar=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]); if(Math.abs(ar)<1e-6) continue; out.push([[a,b,c,a]]) } return out }
function pcSafe(fn,a,rest){ try{ return fn(a,...rest) }catch(e){ let acc=a; for(const x of rest){ try{ acc=fn(acc,x) }catch(e2){ console.warn('geometria',e2&&e2.message) } } return acc } }
function unionAll(list){ let cur=list.filter(x=>x&&x.length); if(!cur.length) return []; while(cur.length>1){ const nx=[]; for(let i=0;i<cur.length;i+=12) nx.push(pcSafe(polygonClipping.union,cur[i],cur.slice(i+1,i+12))); cur=nx } return cur[0] }
function slabFootprint(st){ const parts=[]; for(const e of st.els){ if(e.cat!=='slab'&&e.cat!=='mid') continue; const tr=trisMP(geo2(e).tris); if(tr.length) parts.push(unionAll(tr)) } if(!parts.length) return null;
  let fp=unionAll(parts);
  // fechamento morfológico: junta lajes separadas por frestas pequenas (até 2×CLOSE) e some com as frestas entre peças
  const CLOSE=.25; const dil=unionAll(fp.map(poly=>unionAll([poly,...poly.flatMap(r=>stripRects(r,CLOSE))])));
  const er=unionAll(dil.flatMap(poly=>poly.flatMap(r=>stripRects(r,CLOSE)))); fp=dil; if(er.length) fp=pcSafe(polygonClipping.difference,dil,[er]);
  const vs=[]; for(const e of st.els){ const g=geo2(e); if(!g.vtris) continue; for(const vt of g.vtris){ const tr=trisMP(vt); if(tr.length) vs.push(unionAll(tr)) } }
  if(vs.length) fp=pcSafe(polygonClipping.difference,fp,[unionAll(vs)]); return fp }
function cleanRing(r){ r=unC(r); let out=r.slice(); for(let pass=0;pass<3;pass++){ const nx=[]; for(let i=0;i<out.length;i++){ const a=out[(i-1+out.length)%out.length], b=out[i], c=out[(i+1)%out.length]; if(Math.hypot(b[0]-a[0],b[1]-a[1])<.005) continue; const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]); if(Math.abs(cr)<1e-4) continue; nx.push(b) } if(nx.length===out.length) break; out=nx; if(out.length<3) break } return out }
function stripRects(ring,w){ const out=[]; const r=unC(ring); for(let i=0;i<r.length;i++){ const A=r[i],B=r[(i+1)%r.length]; const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy); if(L<1e-3) continue; const nx=-dy/L*w, ny=dx/L*w; const q=[R3([A[0]+nx,A[1]+ny]),R3([B[0]+nx,B[1]+ny]),R3([B[0]-nx,B[1]-ny]),R3([A[0]-nx,A[1]-ny])]; out.push([[...q,q[0]]]) } return out }
const SUG={per:{t:'Periferia da laje',r:[['aci','G','Queda de altura'],['aci','M','Queda de materiais']],obs:'Sugerida pelo modelo (borda da laje). Conferir guarda-corpo e rodapé conforme a NR-18.',h:{p:'diag',c:'risco',e:.4,ang:45,op:.8}},
  abe:{t:'Abertura no piso',r:[['aci','G','Queda de altura (abertura no piso)'],['aci','M','Queda de materiais']],obs:'Sugerida pelo modelo (shaft, poço ou vão sem laje). Conferir fechamento ou guarda-corpo conforme a NR-18.',h:{p:'cruz',c:'risco',e:.3,ang:45,op:.8}}};
function sugCompute(st,o){ const fp=slabFootprint(st); if(!fp||!fp.length) return []; const out=[];
  for(const poly of fp){ const outer=poly[0]; if(polyArea(unC(outer))<4) continue;
    if(o.per){ const band=pcSafe(polygonClipping.intersection,unionAll(stripRects(outer,o.w)),[[outer]]); if(band.length) out.push({tipo:'per',geom:band}) }
    if(o.abe) for(const h of poly.slice(1)){ const hr=unC(h); const ar=polyArea(hr); const bb=bboxOf(hr); let per=0; for(let i=0;i<hr.length;i++){ const a=hr[i],b=hr[(i+1)%hr.length]; per+=Math.hypot(b[0]-a[0],b[1]-a[1]) } if(ar<o.min||Math.min(bb[2]-bb[0],bb[3]-bb[1])<.4||2*ar/per<.2) continue; out.push({tipo:'abe',geom:unionAll([[h],...stripRects(h,o.w2)])}) } }

async function sugCreate(sel,o,onProg){ let n=0, nA=0;
  for(let i=0;i<sel.length;i++){ const st=sel[i]; onProg&&onProg(i,st); await sleep(15);

    let res=[]; try{ res=sugCompute(st,o) }catch(e){ console.warn('sugestão',st.name,e); continue }
    for(const r of res){ const others=rawAreasOn(st.name,null).map(a=>[ringC(a.pts),...a.holes.map(ringC)]); let g=r.geom; if(others.length) g=pcSafe(polygonClipping.difference,g,others);

function buildSheet(st,o,ppm){
  const B=sheetBase(o,ppm,o.desenho,o.numero); const {ctx,X,k,F,cY}=B;
  const pd=5*k; const [x0,y0,x1,y1]=planBB(st); const mg=symD()*2; const bw=x1-x0+2*mg, bh=y1-y0+2*mg;
  const A=[F[0]+pd,F[1]+pd,F[2]-pd,cY-B.tabH-pd], Bq=[F[0]+pd,F[1]+pd,B.sX-pd,F[3]-pd];
  const fitIn=R=>Math.min((R[2]-R[0])/bw,(R[3]-R[1])/bh);
  let R=fitIn(A)>=fitIn(Bq)?A:Bq; let smm;
  if(o.esc==='fit') smm=fitIn(R);
  else { smm=1000/+o.esc; const fits=Rr=>bw*smm<=Rr[2]-Rr[0]+.5&&bh*smm<=Rr[3]-Rr[1]+.5; if(fits(A)) R=A; else if(fits(Bq)) R=Bq; else return {err:'Na escala 1:'+o.esc+' a planta não cabe na folha '+o.fmt+'. Escolha uma escala menor (número maior) ou uma folha maior.'} }
  const V={s:smm*ppm,D:1}; V.tx=X((R[0]+R[2])/2)-((x0+x1)/2)*V.s; V.ty=X((R[1]+R[3])/2)+((y0+y1)/2)*V.s;
  ctx.save(); ctx.beginPath(); ctx.rect(X(F[0]),X(F[1]),X(F[2]-F[0]),X(F[3]-F[1])); ctx.clip();
  let hasBg=false; if(o.bg) hasBg=drawBg(ctx,st,V,(S.bgs[bgKey(st)]||{}).op??.5);
  renderStructure(ctx,st,V,Object.assign({},PAPER,{lw:Math.max(1,.13*ppm)}),hasBg?.6:1);
  drawAreas(ctx,st,V,PAPER,{fill:o.fill,fillA:.14,lw:Math.max(1,.35*ppm),hlw:Math.max(1,.16*ppm),filter:false,selId:null});
  drawSyms(ctx,st,V,'#1b2733');
  ctx.restore(); ctx.setTransform(1,0,0,1,0,0);

}
// segunda folha: quadro de riscos de todas as áreas do pavimento
function buildQuadro(st,o,ppm){
  const B=sheetBase(o,ppm,'QUADRO DE RISCOS – '+st.name.toUpperCase(),o.numero+'.2'); const {ctx,X,k,F,cY,text,line}=B;
  const items=areaItems(st.name).slice().sort((a,b)=>b.lp[1]-a.lp[1]||a.lp[0]-b.lp[0]);
  const pd=6*k; const qx=F[0]+pd, qy=F[1]+pd, qw=F[2]-F[0]-2*pd, qh=cY-F[1]-2*pd;
  text('QUADRO DE RISCOS · '+st.name.toUpperCase(),qx,qy+5*k,4.2*k,{w:700,fam:'"Titillium Web","Segoe UI",Arial,sans-serif'});
  text('Grupos e cores conforme o anexo da NR-5: tamanho do círculo = intensidade do risco (pequeno, médio, grande).',qx,qy+10*k,2.2*k,{c:'#4a5966'});
  const top=qy+15*k, avail=qh-15*k;
  const rowsQ=[]; for(const it of items){ rowsQ.push({h:true,a:it.a}); const rs=risksOf(it.a); if(!rs.length) rowsQ.push({none:true}); for(const r of rs) rowsQ.push({r}); if(it.a.obs) rowsQ.push({obs:it.a.obs}) }
  const colGap=7*k; const ncol=Math.max(1,Math.floor((qw+colGap)/(105*k+colGap))); const cwq=(qw-colGap*(ncol-1))/ncol;
  let fs=2.6*k;
  for(let f=2.8*k; f>=1.5*k; f-=.1*k){ const lh=f*1.5, hh=f*2.4; let colH=0, c=1, ok=true; for(const r of rowsQ){ const h=r.h?hh:lh; if(colH+(r.h?hh+lh:h)>avail){ c++; colH=0; if(c>ncol){ok=false;break} } colH+=h } fs=f; if(ok) break }
  const lh=fs*1.5, hh=fs*2.4, gcol=30*fs/2.6; let cx=qx, cy=top, col=1, cut=0;
  for(let i=0;i<rowsQ.length;i++){ const r=rowsQ[i]; const h=r.h?hh:lh; if(cy+(r.h?hh+lh:h)>top+avail){ if(col<ncol){ col++; cx+=cwq+colGap; cy=top } else { cut=rowsQ.length-i; break } }
    if(r.h){ text(r.a.titulo||'Área sem título',cx,cy+fs*1.75,fs*1.1,{w:700,c:PAPER.title,max:cwq-16*k}); if(r.a.trab) text(r.a.trab+' trabalhador'+(r.a.trab==='1'?'':'es'),cx+cwq,cy+fs*1.75,fs*.9,{al:'right',c:'#4a5966'}); line(cx,cy+fs*2.15,cx+cwq,cy+fs*2.15,'#c9d1d7',.15) }
    else if(r.none) text('sem riscos cadastrados',cx+fs*1.7,cy+fs*1.05,fs*.92,{c:'#6b7a86'});
    else if(r.obs) text('Medidas: '+r.obs,cx+fs*1.7,cy+fs*1.05,fs*.88,{c:'#4a5966',max:cwq-fs*1.7});
    else { const g=GBY[r.r.g]; drawCircle(ctx,X(cx+fs*.65),X(cy+fs*.7),X(fs*.21*INT[r.r.i].m),[g.c],'rgba(0,0,0,.3)'); text(g.n+' · '+INT[r.r.i].n,cx+fs*1.7,cy+fs*1.05,fs*.92,{c:'#4a5966'}); text(r.r.ag||'—',cx+fs*1.7+gcol,cy+fs*1.05,fs*.92,{max:cwq-fs*1.7-gcol}) }
    cy+=h }
  if(cut) text('+ '+cut+' linha(s) não couberam nesta folha; use uma folha maior.',qx,top+avail+3*k,2*k,{c:'#c23b2f'});
  B.blocks();
  return {cv:B.cv};
}

function setLoading(on,name,stage,p){ const L=$('loading'); L.hidden=!on; if(!on) return; if(name) $('ldName').textContent=name; if(stage!=null) $('ldStage').textContent=stage; if(p!=null) $('ldBar').style.width=Math.round(p*100)+'%' }
async function parseIFC(name,buf){
  setLoading(true,name,'Lendo arquivo…',0); await sleep(30);
  let text; try{ text=new TextDecoder('utf-8').decode(buf) }catch(e){ text=new TextDecoder('latin1').decode(buf) }
  if(!/ISO-10303-21/.test(text.slice(0,300))){ setLoading(false); toast(name+' não parece ser um arquivo IFC.'); return null }
  try{ return await IFCReader.readIFC(text,{onProgress:async(st,p)=>{ setLoading(true,null,st+'…',p); await sleep(0) }}) }
  catch(err){ console.error(err); setLoading(false); toast('Não foi possível ler '+name+'. '+(err&&err.message||'')); return null }
}
