  $('ifcC').onclick=closeSheet;
  if($('ifcReEx')) $('ifcReEx').onclick=()=>{ const n=S.areas.filter(a=>a.exemplo).length+S.syms.filter(y=>y.exemplo).length;
    confirmSheet('Recarregar o exemplo?','As áreas, símbolos e revisões do exemplo ('+n+' peças, inclusive as que foram editadas) voltam à versão original do exemplo. O que foi desenhado fora do exemplo continua.','Recarregar',async()=>{ if(await replaceExample()!==false){ afterDataChange(); if(S.view==='plan') fitPlan(); toast('Exemplo recarregado.') } }) };
  if($('ifcDemo')) $('ifcDemo').onclick=async()=>{ closeSheet(); await openDemo() };
  $('ifcF').onchange=async ev=>{ const f=ev.target.files[0]; if(!f) return; closeSheet(); await importIfcFile(f) };
};
async function gzipBlob(buf){ try{ return await new Response(new Blob([buf]).stream().pipeThrough(new CompressionStream('gzip'))).blob() }catch(e){ return null } }
async function gunzipBuf(buf){ return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer() }
const MAX_UP=50*1024*1024;
async function importIfcFile(f){ const buf=await f.arrayBuffer(); if(!await openModel(f.name,buf,false)) return; S.cfg.semExemplo=true;
  if(Store.kind==='db'){
    if(S.readOnly){ toast('O modelo abriu só para você. Quem tem acesso de leitura não pode trocar o modelo da equipe.'); return }
    const gz=await gzipBlob(buf); const up=gz||new Blob([buf],{type:'application/octet-stream'});
    if(up.size>MAX_UP){ toast('O modelo abriu, mas mesmo compactado passa de 50 MB e não pode ser salvo no painel.',6000); return }
    toast('Enviando o modelo para a obra…',8000);
    let r=null;
    try{ r=await Nuvem.obras.enviarModelo(S.obra.id,gz?new Blob([gz],{type:'application/gzip'}):up); const old=S.obra.modelo;
      const modelo={asset:r.id,nome:f.name,bytes:f.size,gz:!!gz,em:new Date().toISOString()};
      const gravar=async forcar=>{ S.obra=await Nuvem.obras.alterar(S.obra.id,{modelo},forcar?undefined:S.obra.atualizado_em); if(old&&old.asset&&old.asset!==r.id) Nuvem.obras.apagarArquivo(old.asset).catch(()=>{}); toast('Modelo salvo na obra: vale para toda a equipe e todas as ferramentas.') };
      try{ await gravar(false) }
      catch(e){ if(e&&e.code!=='conflito') throw e;
        // outra pessoa mexeu na obra (nome ou modelo) depois que a página abriu
        const quem=e.por?Nuvem.pessoas.nome(e.por):'outra pessoa'; if(e.atual) S.obra=e.atual;
        const outro=e.atual&&e.atual.modelo&&old&&e.atual.modelo.asset!==old.asset;
        openSheet('Alteração ao mesmo tempo',`<p style="margin-top:0">${outro?'<b>'+esc(quem)+'</b> trocou o modelo IFC desta obra':'A obra foi alterada por <b>'+esc(quem)+'</b>'} enquanto você estava com a página aberta.</p><p class="muted">Você pode gravar o seu modelo (${esc(f.name)}) como o modelo da obra, ou descartar o seu e recarregar a página com a versão atual.</p>`,
          `<button class="btn ghost" id="cfRec">Descartar o meu e recarregar</button><button class="btn" id="cfGr">Gravar o meu</button>`);
        $('cfRec').onclick=()=>{ Nuvem.obras.apagarArquivo(r.id).catch(()=>{}); location.reload() };
        $('cfGr').onclick=async()=>{ closeSheet(); try{ await gravar(true) }catch(e2){ Store.writeErr(e2) } };
      } }
    catch(e){ if(r) Nuvem.obras.apagarArquivo(r.id).catch(()=>{}); toast('O modelo abriu, mas não foi salvo na obra ('+(e&&e.message||e&&e.code||'erro')+'). Ele ficará só nesta sessão.',7000) } }
  else { idbPut('ifc',{name:f.name,buf}).catch(()=>{}); Store.saveCfg(); toast('Modelo carregado e guardado neste navegador.') } }
async function openDemo(){ try{ if(await openModel('Modelo de exemplo.ifc',await loadDemo(),true)){
    // online, o modelo pertence à obra: o exemplo só abre nesta tela, sem trocar o da equipe
    if(Store.kind==='db'){ toast('Modelo de exemplo aberto só nesta tela. O modelo da obra não foi alterado.',6000); return }
    const old=S.cfg.modelo; S.cfg.modelo=null; S.cfg.semExemplo=false; await Store.saveCfg(); idbDel('ifc').catch(()=>{}); if(old&&old.asset&&Store.assets) Store.assets.delete(old.asset).catch(()=>{}) } }catch(e){ console.error(e); setLoading(false); toast('Não foi possível abrir o modelo de exemplo neste navegador.') } }
$('eIfc').onclick=()=>$('fIfc').click(); $('eDemoM').onclick=openDemo;
$('fIfc').onchange=ev=>{ const f=ev.target.files[0]; ev.target.value=''; if(f) importIfcFile(f) };
views.addEventListener('dragover',ev=>{ if([...ev.dataTransfer.items].some(i=>i.kind==='file')){ev.preventDefault(); views.classList.add('drop')} });
views.addEventListener('dragleave',()=>views.classList.remove('drop'));
views.addEventListener('drop',async ev=>{ ev.preventDefault(); views.classList.remove('drop'); const f=[...ev.dataTransfer.files][0]; if(!f) return; if(/\.ifc$/i.test(f.name)){ if(S.readOnly){toast('Acesso somente leitura.');return} importIfcFile(f) } else toast('Arraste um arquivo .ifc.') });

/* ======================= nome da obra, reset ======================= */
function renderObra(){ const b=$('obraNome'); b.textContent=S.cfg.obra||'Definir nome da obra'; b.style.opacity=S.cfg.obra?'':'.75' }
$('obraNome').onclick=()=>{ if(S.readOnly){toast('Acesso somente leitura.');return}
  openSheet('Obra',`<form class="fg" id="fO" autocomplete="off"><div class="fld full"><label for="oNome">Nome da obra</label><input id="oNome" value="${esc(S.cfg.obra||'')}" placeholder="Ex.: Residencial X"></div></form>`,
    `<button class="btn ghost" id="oC">Cancelar</button><button class="btn" id="oOk">Salvar</button>`);
  $('oC').onclick=closeSheet; $('oOk').onclick=async()=>{ const nome=$('oNome').value.trim();
    if(Store.kind==='db'){ if(!nome) return; $('oOk').disabled=true;
      try{ S.obra=await Nuvem.obras.alterar(S.obra.id,{nome},S.obra.atualizado_em); S.cfg.obra=S.obra.nome; closeSheet(); renderObra(); document.title=S.obra.nome+' · Mapa de Risco'; toast('Obra renomeada para todas as ferramentas.') }
      catch(e){ closeSheet(); if(e&&e.code==='conflito'){ if(e.atual){ S.obra=e.atual; S.cfg.obra=S.obra.nome; renderObra() } toast('A obra foi alterada por '+(e.por?Nuvem.pessoas.nome(e.por):'outra pessoa')+' agora há pouco. Confira o nome e tente de novo.',7000) } else Store.writeErr(e) }
      return }
    S.cfg.obra=nome; closeSheet(); renderObra(); await Store.saveCfg() } };
function clearModel(){
  for(const ch of [...world.children]) if(ch!==hiGroup){ world.remove(ch); ch.traverse&&ch.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material&&o.material!==matEl){ if(o.material.map) o.material.map.dispose(); o.material.dispose() } }) }
    hiGroup.clear(); S.res=null; S.modelName=''; S.isDemo=false; S.storeys=[]; S.stById=new Map(); S.stByName=new Map(); S.els=[]; S.byGid=null; S.pav=null; P.fitted=null;
  fillPavSelect(); invalidateData(); baseKey=''; req3D(); reqPlan();
}
$('bReset').onclick=()=>{
  if(S.readOnly){toast('Acesso somente leitura.');return}
  const nA=S.areas.length, nR=S.areas.reduce((s,a)=>s+(a.riscos||[]).length,0), nB=Object.keys(S.bgs).length;
  const db=Store.kind==='db';
  openSheet('Resetar o painel',`<p style="margin-top:0">Isto apaga <b>tudo</b> do Mapa de Risco${db?' desta obra para todas as pessoas que o usam':' neste navegador'}:</p>
    <ul style="margin:.4em 0 1em;padding-left:1.2em;line-height:1.6">${db?'':`<li>o modelo IFC carregado${S.res?' ('+esc(S.modelName)+')':''};</li>`}<li>${nA} área(s) com ${nR} risco(s), ${S.syms.length} símbolo(s) e ${S.revs.length} revisão(ões) emitida(s);</li><li>${nB} imagem(ns) de fundo, o logo${db?'':', o nome da obra'} e os dados do carimbo.</li></ul>
    ${db?'<p class="muted">O cadastro da obra e o modelo IFC continuam, porque são usados pelas outras ferramentas. Para apagar a obra inteira, use “Excluir” na lista de obras.</p>':''}
    <p class="muted">Não dá para desfazer. Se quiser guardar uma cópia, exporte as pranchas em PDF antes.</p>
    <div class="fg"><div class="fld full"><label for="rsTxt">Para confirmar, digite RESETAR</label><input id="rsTxt" autocomplete="off" autocapitalize="characters"></div></div>`,
    `<button class="btn ghost" id="rsC">Cancelar</button><button class="btn danger" id="rsOk" disabled>Resetar tudo</button>`);
  $('rsTxt').oninput=()=>{ $('rsOk').disabled=$('rsTxt').value.trim().toUpperCase()!=='RESETAR' };
  $('rsC').onclick=closeSheet;
  $('rsOk').onclick=async()=>{ $('rsOk').disabled=true; $('rsOk').textContent='Apagando…'; await resetAll(); closeSheet(); toast(db?'Mapa de Risco desta obra resetado.':'Painel resetado. Importe o IFC da obra para começar.',5000) };
};
async function resetAll(){
  if(S.mode) endMode(); S.sel=null; S.rev=null;
  const ids=S.areas.map(a=>a.id), bgKeys=Object.keys(S.bgs);
  if(Store.kind==='db'){
    for(const id of ids){ try{ await Store.db.doc('areas/'+id).delete() }catch(e){} }
    for(const y of S.syms){ try{ await Store.db.doc('simbolos/'+y.id).delete() }catch(e){} }
    for(const r of S.revs){ try{ await Store.db.doc('revisoes/'+r.id).delete() }catch(e){} }
    for(const k of bgKeys){ try{ await Store.db.doc('fundos/'+k).delete() }catch(e){} }
    if(Store.assets){ try{ const l=await Store.assets.list(); for(const a of l.assets){ try{ await Store.assets.delete(a.id) }catch(e){} } }catch(e){} }
  } else {
    try{ localStorage.removeItem(LSK) }catch(e){}
    await idbDel('ifc').catch(()=>{}); await idbDel('logo').catch(()=>{}); for(const k of bgKeys) await idbDel('bg:'+k).catch(()=>{});
  }
  S.areas=[]; S.syms=[]; S.revs=[]; S.rev=null; S.bgs={}; bgImgs.clear(); logoImg=null; S.cfg={obra:'',semExemplo:true,escSimb:1,tituloPos:'abaixo',agrupar:false,carimbo:{},pranchas:{},exp:{}};
  if(Store.kind==='db'){ S.cfg.obra=S.obra.nome; await Store.saveCfg(); renderObra(); afterDataChange(); return }
  await Store.saveCfg();
  clearModel(); renderObra(); afterDataChange(); setView('3d'); $('empty').hidden=false;
}
function themeChanged(){ TK={}; TKV++; renderer.setClearColor(new THREE.Color(css('--canvas-bg'))); paintAll(); renderSide(); renderLegend(); renderChips(); highlight3D() }
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged) }catch(e){}
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ baseKey=''; build3DLabels(); reqPlan() });

/* ======================= exemplo ======================= */
async function loadExample(){ if(S.readOnly){toast('Acesso somente leitura.');return}
  if(!S.res||!S.isDemo){ if(!S.res){ toast('O exemplo usa o modelo de exemplo. Abrindo o modelo…'); await openDemo(); if(!S.res) return } else { toast('O exemplo foi desenhado sobre o modelo de exemplo; abra-o em “Modelo IFC” para usar.'); return } }
  if(await putExample()===false) return; const ex=window.EXAMPLE_AREAS||[];
  S.pav=(ex[0]||{}).pav||S.pav; $('selPav').value=S.pav; applyCut(); afterDataChange(); setView('plan'); fitPlan();
  toast('Exemplo carregado: mapa de risco do térreo feito à mão, redesenhado sobre o modelo de exemplo.',6000) }

// grava o exemplo embutido (as peças que já existirem com o mesmo id ficam como estão)
async function putExample(){ const ex=clone(window.EXAMPLE_AREAS||[]), ey=clone(window.EXAMPLE_SYMS||[]), er=window.EXAMPLE_REV?clone(window.EXAMPLE_REV):null;
  for(const a of ex){ if(S.areas.some(x=>x.id===a.id)) continue; if(await Store.put('areas',a)===false) return false; if(Store.kind==='db') await sleep(40) }
  for(const y of ey){ if(S.syms.some(x=>x.id===y.id)) continue; if(await Store.put('simbolos',y)===false) return false; if(Store.kind==='db') await sleep(40) }
  if(er&&!S.revs.some(x=>x.id===er.id)) await Store.put('revisoes',er); return true }
// apaga o que veio do exemplo (áreas, símbolos e revisões marcados como exemplo) e grava o exemplo atual
async function replaceExample(){ for(const a of S.areas.filter(a=>a.exemplo)) await Store.del('areas',a.id); for(const y of S.syms.filter(s=>s.exemplo)) await Store.del('simbolos',y.id); for(const r of S.revs.filter(r=>r.exemplo)) await Store.del('revisoes',r.id);
  S.sel=null; S.rev=null; return putExample() }
// versões antigas do exemplo embutido, sem nenhuma mudança: trocadas sozinhas pela versão atual
const hashStr=s=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36)+'-'+s.length };
const OLD_EX_SIGS=['1unxzki-8607','1n84udy-10010','1iustdy-8847'];
async function migrateExample(){ if(S.readOnly) return false; const ea=S.areas.filter(a=>a.exemplo), ey=S.syms.filter(s=>s.exemplo); if(!ea.length) return false;
  if(!OLD_EX_SIGS.includes(hashStr(sigOf(ea,ey)))) return false; await replaceExample(); return true }

/* ======================= início ======================= */
(async function boot(){
  renderLegend(); renderChips(); setLoading(true,'Abrindo o painel','Conectando aos dados…',0.02);
  await (window.NUVEM_PRONTA||Promise.resolve(null));
  // obra Start: termina de preparar (modelo, mapa e concretagens) antes de abrir
  if(window.Nuvem&&window.CargaStart&&Nuvem.obraId===CargaStart.id&&await CargaStart.precisa(Nuvem)){
    try{ await CargaStart.rodar(Nuvem,(t,p)=>setLoading(true,'Preparando a obra Start',t,p)) }
    catch(e){ console.error(e); toast('Não foi possível terminar de preparar a obra Start ('+(e&&e.message||'erro')+'). Recarregue a página para continuar.',9000) } }
  if(await Store.init()===false){
    setLoading(false);
    const naoTem=S.obra===null;
    openSheet(naoTem?'Obra não encontrada':'Não foi possível abrir a obra',naoTem
      ?'<p style="margin-top:0">Esta obra não existe ou foi excluída. Volte para a lista e escolha outra.</p>'
      :'<p style="margin-top:0">Não foi possível ler o cadastro de obras. Se esta é a primeira vez depois da atualização, rode o arquivo <b>atualizacao-obras.sql</b> no Supabase (SQL Editor) e recarregue a página.</p>',
      '<button class="btn ghost" onclick="location.reload()">Recarregar</button><a class="btn" href="index.html?ferramenta=risco" style="text-decoration:none">Ver as obras</a>');
    return;
  }
  if(Store.kind==='db'){ document.title=S.obra.nome+' · Mapa de Risco'; $('eDemoM').hidden=true }
  else { $('bObras').href='index.html'; $('bObras').textContent='← Início'; }
  $('modeChip').textContent=Store.kind==='db'?('Online'+(S.readOnly?' · leitura':'')):'Dados neste navegador';
  $('modeChip').title=Store.kind==='db'?(S.readOnly?'Você pode ver o painel, mas não pode alterar.':'Tudo que você registra fica salvo online e aparece para quem entrar nesta obra.'):'Modo local: os registros ficam só neste navegador.';
  renderObra(); loadLogo();
  let migrated=false; try{ migrated=await migrateExample() }catch(e){ console.warn('exemplo',e) }
  let ok=false;
  try{
    const md=Store.modelo();
    if(Store.kind==='db'&&md&&md.asset){ setLoading(true,md.nome,'Baixando modelo…',0.05); const u=await Store.blobUrl(md.asset).catch(e=>{ console.warn(e); return null }); const r=u?await fetch(u):null; if(r&&r.ok){ let b=await r.arrayBuffer(); if(md.gz) b=await gunzipBuf(b); ok=await openModel(md.nome,b,false) } else toast('Não foi possível baixar o modelo salvo na obra.') }
    if(!ok&&Store.kind!=='db'){ const c=await idbGet('ifc').catch(()=>null); if(c&&c.buf) ok=await openModel(c.name,c.buf,false) }
  }catch(e){ console.warn(e) }
  if(!ok&&Store.kind!=='db'&&!S.cfg.semExemplo){ try{ ok=await openModel('Modelo de exemplo.ifc',await loadDemo(),true) }catch(e){ console.error(e); toast('Não foi possível abrir o modelo de exemplo neste navegador.') } }
  setLoading(false); if(!ok){ $('empty').hidden=false; setView('3d') }
  for(const k of Object.keys(S.bgs)) loadBgImage(k);
  renderSide(); renderLegend();
  if(migrated) toast('O exemplo antigo guardado neste navegador foi trocado pela versão corrigida.',6000);
})();
window.addEventListener('error',e=>{ console.error(e.error||e.message) });
})();
</script>
