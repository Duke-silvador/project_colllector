<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pendências de obra: registro com fotos, correção, aprovação, histórico e relatórios.">

<title>Pendências de obra</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-apple.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Obra"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%2322425c'/%3E%3Crect x='9' y='7' width='22' height='27' rx='3' fill='%239fc3d6'/%3E%3Crect x='15' y='5' width='10' height='5' rx='1.5' fill='%23ffffff'/%3E%3Cpath d='M14 18l3 3 6-6' stroke='%2323804a' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M14 27h12' stroke='%23d9701c' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#22425c; --petrol:#074669; --brand-ink:#ffffff; --brand-soft:#9fc3d6;
  --bg:#eef2f5; --panel:#ffffff; --ink:#14222e; --muted:#5a6b78; --line:#d3dce3; --line-2:#e4eaef;
  --accent:#074669; --accent-ink:#ffffff; --accent-soft:#dcebf2;
  --ok:#23804a; --ok-soft:#dcf0e3; --bad:#c23b2f; --bad-soft:#f8e0dc; --warn:#b86e00; --warn-soft:#fbecd2; --info:#2f6fb0; --info-soft:#dde9f6;
  --f-disp:"Titillium Web","Segoe UI",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1720; --panel:#14212c; --ink:#e3eaf0; --muted:#93a5b3; --line:#27394a; --line-2:#1d2d3a;
  --accent:#62aed3; --accent-ink:#06202e; --accent-soft:#163445;
  --ok:#53c07f; --ok-soft:#163a26; --bad:#f07a6c; --bad-soft:#41201c; --warn:#f0a93a; --warn-soft:#3d2c10; --info:#7fb2e6; --info-soft:#17304a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1720; --panel:#14212c; --ink:#e3eaf0; --muted:#93a5b3; --line:#27394a; --line-2:#1d2d3a;
  --accent:#62aed3; --accent-ink:#06202e; --accent-soft:#163445;
  --ok:#53c07f; --ok-soft:#163a26; --bad:#f07a6c; --bad-soft:#41201c; --warn:#f0a93a; --warn-soft:#3d2c10; --info:#7fb2e6; --info-soft:#17304a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px var(--f-body);-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* faixa da marca */
.brand{background:var(--navy);color:var(--brand-ink);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:min(46%,560px);background:var(--petrol);clip-path:polygon(64px 0,100% 0,100% 100%,0 100%);z-index:0}
.brand-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1240px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px))}
.logo{display:block;color:inherit}
.logo svg{height:34px;width:auto;display:block}
.ttl{display:grid;border-left:1px solid rgba(255,255,255,.25);padding-left:16px;min-width:0}
.ttl .kick{font:600 .66rem var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-soft)}
.ttl h1{font:700 1.35rem/1.1 var(--f-disp);margin:0}
.ttl .obra{font-size:.82rem;color:#d4e4ee}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font:600 .82rem var(--f-body);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.2)}
.modechip{font:500 .7rem var(--f-mono);color:#d4e4ee;border:1px dashed rgba(255,255,255,.35);border-radius:12px;padding:2px 8px;white-space:nowrap}
.modechip.off{border-color:#f0a93a;color:#f7cf8d}

main{max-width:1240px;margin:0 auto;padding:14px 16px 24px;display:grid;gap:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;font:600 .9rem var(--f-body);color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs .sp{flex:1}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:.9rem}
.muted{color:var(--muted);font-size:.88rem}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:7px;padding:8px 14px;font:600 .9rem var(--f-body);white-space:nowrap}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* filtros */
.filtros{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px}
.frow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 11px;font:600 .82rem var(--f-body);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip b{font-family:var(--f-mono);font-weight:600;margin-left:4px}
.fsel{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:.86rem;max-width:100%}
.busca{flex:1 1 180px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}

/* lista */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%;color:inherit}
.card:hover{border-color:var(--accent)}
.card.pri-critica{border-left:5px solid var(--bad)} .card.pri-alta{border-left:5px solid var(--warn)}
.th{width:84px;height:84px;border-radius:7px;background:var(--bg);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.7rem;position:relative}
.th img{width:100%;height:100%;object-fit:cover}
.th .n{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font:600 .68rem var(--f-mono);border-radius:4px;padding:0 4px}
.cb{display:grid;gap:3px;min-width:0}
.cb .l1{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.num{font:700 1rem var(--f-mono)}
.cb .loc{font:600 .95rem var(--f-body);overflow-wrap:anywhere}
.cb .sub{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.pill{font:600 .7rem var(--f-body);padding:1px 8px;border-radius:10px;white-space:nowrap;border:1px solid transparent}
.st-aberta{background:var(--bad-soft);color:var(--bad)} .st-em_correcao{background:var(--warn-soft);color:var(--warn)}
.st-corrigida{background:var(--info-soft);color:var(--info)} .st-fechada{background:var(--ok-soft);color:var(--ok)}
.p-critica{border-color:var(--bad);color:var(--bad)} .p-alta{border-color:var(--warn);color:var(--warn)} .p-media{border-color:var(--line);color:var(--muted)} .p-baixa{border-color:var(--line-2);color:var(--muted)}
.tag{font:600 .68rem var(--f-body);padding:1px 7px;border-radius:10px;background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.tag.venc{border-style:solid;border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tag.inc{border-color:var(--warn);color:var(--warn)}
.tag.fila{border-color:var(--info);color:var(--info)}
.tag.err{border-style:solid;border-color:var(--bad);color:var(--bad)}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.vazio h3{margin:0;font:700 1.15rem var(--f-disp)}

/* botão flutuante */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;padding:14px 20px;font:700 1rem var(--f-body);box-shadow:0 8px 24px rgba(0,0,0,.28)}

/* resumo */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;text-align:left;color:inherit}
.tile b{font:700 1.8rem/1 var(--f-disp)}
.tile span{font-size:.84rem;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0;overflow:auto}
.box h3{margin:0;font:700 .82rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
table.t th,table.t td{padding:5px 6px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal}
table.t th{font:600 .72rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bl{display:grid;gap:4px}
.bl button{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;text-align:left;background:none;border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;color:inherit}
.bl button small{grid-column:1/-1;color:var(--muted)}

/* janelas */
.overlay{position:fixed;inset:0;background:rgba(6,20,30,.5);display:grid;place-items:center;padding:12px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:calc(100dvh - 24px);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet>header h3{margin:0;font:700 1.2rem var(--f-disp);flex:1}
.sheet>header .x{background:none;border:0;font-size:1.4rem;line-height:1;color:var(--muted);padding:2px 6px}
.sheet .body{overflow:auto;padding:14px 16px;display:grid;gap:12px;align-content:start}
.sheet>footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
@media (max-width:640px){.overlay{padding:0;place-items:end stretch}.sheet{border-radius:14px 14px 0 0;max-height:94dvh;width:100%}}
.fld{display:grid;gap:5px}
.fld>label,.fld>.l{font:600 .72rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld>.l .req{color:var(--bad)}
.fld input:not([type=file]):not([type=checkbox]),.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
.fld textarea{min-height:64px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:600 .9rem var(--f-body);color:var(--ink);min-height:40px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.pri-critica[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.pri-alta[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.opts.small .opt{padding:6px 10px;min-height:34px;font-size:.84rem}
.fotos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fotos .ft{width:86px;height:86px;border-radius:8px;overflow:hidden;position:relative;background:var(--bg);border:1px solid var(--line)}
.fotos .ft img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.fotos .ft button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;line-height:22px;padding:0}
.addft{display:flex;gap:6px;flex-wrap:wrap}
.addft label{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:8px;padding:10px 14px;font:600 .9rem var(--f-body);color:var(--ink);cursor:pointer}
.addft input{display:none}
details.mais{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details.mais summary{cursor:pointer;font:600 .9rem var(--f-body);color:var(--accent)}
details.mais[open]{display:grid;gap:12px}
.blq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.msg{font-size:.86rem;margin-right:auto}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:.92rem}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){dl.kv{grid-template-columns:1fr}dl.kv dt{margin-top:4px}}
.hist{display:grid;gap:6px;border-left:2px solid var(--line);padding-left:12px}
.hist div{font-size:.86rem}
.hist small{color:var(--muted)}
.hist .cm{display:block;background:var(--bg);border-radius:6px;padding:5px 8px;margin-top:3px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:grid;place-items:center;padding:10px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .brand::after{display:none}
  .ttl{border-left:0;padding-left:0}
  .hctl{margin-left:0;width:100%}
  .lista{grid-template-columns:1fr}
  .card{grid-template-columns:112px minmax(0,1fr)}
  .th{width:112px;height:112px}
}
</style>
</head>

<header class="brand"><div class="brand-in">
  <a class="logo" href="index.html" title="Início: ferramentas e obras" aria-label="Início"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="8" fill="none" stroke="currentColor" stroke-opacity=".35"/><rect x="9" y="7" width="22" height="27" rx="3" fill="#9fc3d6"/><rect x="15" y="5" width="10" height="5" rx="1.5" fill="#ffffff"/><path d="M14 18l3 3 6-6" stroke="#23804a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 27h12" stroke="#d9701c" stroke-width="2.6" stroke-linecap="round"/></svg></a>

</div></header>

<script>
(function () {
'use strict';
/* ======================= utilidades ======================= */
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms || 4000); }
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoje = () => iso(new Date());
const somaDias = (s, n) => { const [y, m, d] = s.split('-').map(Number); const x = new Date(y, m - 1, d); x.setDate(x.getDate() + n); return iso(x); };
const fmtD = s => { if (!s) return '—'; const [y, m, d] = String(s).slice(0, 10).split('-'); return d + '/' + m + '/' + y; };
const fmtDH = s => { if (!s) return '—'; const d = new Date(s); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const clone = o => JSON.parse(JSON.stringify(o));
const semRede = e => !navigator.onLine || /Failed to fetch|NetworkError|network|fetch|Load failed|conex/i.test(String((e && (e.message || e.error_description)) || e));

const ST = { aberta: 'Aberta', em_correcao: 'Em correção', corrigida: 'Corrigida', fechada: 'Fechada' };
const ST_ORD = ['aberta', 'em_correcao', 'corrigida', 'fechada'];
const PRI = { critica: ['Crítica', 1], alta: ['Alta', 3], media: ['Média', 7], baixa: ['Baixa', 15] };
const PRI_ORD = ['critica', 'alta', 'media', 'baixa'];
const PAV_PADRAO = ['Térreo', 'Pavimento 02', 'Pavimento 03', 'Pavimento 04', 'Pavimento 05', 'Pavimento 06', 'Pavimento 07', 'Pavimento 08', 'Pavimento 09', 'Pavimento 10', 'Pavimento 11', 'Cobertura'].map(n => ({ nome: n, unidades: [] }));

/* ======================= estado ======================= */
let NV = null, sb = null, OBRA = null, OBRA_NOME = '';
let L = { problema: [], disciplina: [], comodo: [], servico: [], local: [] };   // listas
let CFG = { pavimentos: [] };                                                    // pavimentos e unidades
let PEND = [];        // pendências do servidor (com fotos e eventos)
let FILA = [];        // operações aguardando envio (deste aparelho)
let TAB = 'lista';
const F = { st: new Set(['aberta', 'em_correcao', 'corrigida']), pav: '', disc: '', tipo: '', pri: '', blq: false, inc: false, venc: false, fila: false, minhas: false, q: '' };
const minha = p => String(p.criado_por || '').toLowerCase() === String((NV && NV.usuario && NV.usuario.email) || '').toLowerCase();

/* ======================= quem pode o quê (o banco confere de novo) ======================= */
const cargo = () => NV && NV.cargo;
const podeCriar = () => cargo() === 'engenharia' || cargo() === 'seguranca';

/* ======================= IndexedDB: fila, fotos e cópia para usar sem sinal ======================= */
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('pendencias_obra', 1);
  r.onupgradeneeded = () => { const d = r.result; for (const s of ['fila', 'blobs', 'cache']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(st, k, v) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction(st, 'readwrite'); t.objectStore(st).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbGet(st, k) { const d = await idb(); return new Promise(res => { const r = d.transaction(st).objectStore(st).get(k); r.onsuccess = () => res(r.result ?? null); r.onerror = () => res(null); }); }
async function idbDel(st, k) { const d = await idb(); return new Promise(res => { const t = d.transaction(st, 'readwrite'); t.objectStore(st).delete(k); t.oncomplete = res; t.onerror = res; }); }
async function idbAll(st) { const d = await idb(); return new Promise(res => { const out = []; const r = d.transaction(st).objectStore(st).openCursor();
  r.onsuccess = () => { const c = r.result; if (c) { out.push(c.value); c.continue(); } else res(out); }; r.onerror = () => res(out); }); }

/* ======================= fotos: reduz para 1600 px e JPEG ======================= */
async function comprimir(arq) {
  const url = URL.createObjectURL(arq); const img = new Image();
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('não foi possível ler a imagem')); img.src = url; }); }
  finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
  const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(r, 'image/jpeg', .75));
}
const URLS = new Map();   // caminho/fid -> objectURL
async function urlFoto(f) {
  const k = f.fid || f.caminho; if (URLS.has(k)) return URLS.get(k);
  let u = null;
  if (f.fid) { const b = await idbGet('blobs', f.fid); if (b) u = URL.createObjectURL(b); }
  if (!u && f.caminho && navigator.onLine) { try { u = await NV.blobUrl(f.caminho); } catch (e) { u = null; } }
  if (u) URLS.set(k, u); return u;
}
function pintarFotos(raiz) {
  (raiz || document).querySelectorAll('img[data-foto]').forEach(async img => {
    if (img.dataset.ok) return; img.dataset.ok = '1';
    const f = JSON.parse(img.dataset.foto); const u = await urlFoto(f);
    if (u) { img.src = u; img.hidden = false; const ph = img.parentElement.querySelector('.ph'); if (ph) ph.hidden = true; }
  });
}
document.addEventListener('click', ev => { const img = ev.target.closest('img[data-zoom]'); if (!img || !img.src) return; $('viewerImg').src = img.src; $('viewer').hidden = false; });
$('viewer').onclick = () => { $('viewer').hidden = true; };

/* ======================= dados: servidor + fila local ======================= */
const rotLocal = p => [p.pavimento, p.local_tipo === 'Apartamento' ? (p.unidade ? 'Apto ' + p.unidade : 'Apartamento') : [p.local_tipo, p.unidade].filter(Boolean).join(' '), p.comodo].filter(Boolean).join(' · ');
const incompleta = p => !String(p.descricao || '').trim() || !String(p.causador || '').trim();
const vencida = p => !!p.prazo && (p.status === 'aberta' || p.status === 'em_correcao') && p.prazo < hoje();
// junta o que veio do servidor com o que ainda está na fila deste aparelho
function itens() {
  const m = new Map(PEND.map(p => [p.id, Object.assign(clone(p), { fotos: (p.pendencia_fotos || []).map(f => ({ id: f.id, tipo: f.tipo, caminho: f.caminho, em: f.criado_em })), eventos: (p.pendencia_eventos || []).slice() })]));
  for (const op of FILA) {
    let p = m.get(op.id);
    if (op.op === 'criar' && !p) { p = Object.assign(clone(op.row), { numero: null, status: 'aberta', criado_por: NV.usuario.email, criado_em: op.em, fotos: [], eventos: [{ em: op.em, por: NV.usuario.email, acao: 'criada', para: 'aberta' }] }); m.set(op.id, p); }
    if (!p) continue;
    p._fila = true; if (op.erro) p._erro = op.erro;
    if (op.op === 'editar') Object.assign(p, op.campos);
    if (op.op === 'criar' || op.op === 'fotos') for (const f of op.fotos || []) p.fotos.push({ fid: f.fid, tipo: f.tipo, local: true });
    if (op.op === 'status') { p.eventos.push({ em: op.em, por: NV.usuario.email, acao: 'status', de: p.status, para: op.para, comentario: op.comentario, local: true }); p.status = op.para; }
    if (op.op === 'excluir') m.delete(op.id);
  }
  return [...m.values()];
}
async function carregarFila() { FILA = (await idbAll('fila')).sort((a, b) => a.seq - b.seq); }
let SEQ = Date.now();
async function enfileirar(op) { op.k = op.k || uuid(); op.seq = ++SEQ; op.em = op.em || new Date().toISOString(); await idbPut('fila', op.k, op); await carregarFila(); render(); sincronizar(); }

async function carregarServidor() {
  const [lp, lc, lo, lpend] = await Promise.all([
    sb.from('pend_listas').select('tipo,valor,ordem,extra').order('ordem'),
    sb.from('pend_config').select('pavimentos').eq('obra', OBRA).maybeSingle(),
    NV.obras.obter(OBRA),
    sb.from('pendencias').select('*, pendencia_fotos(*), pendencia_eventos(*)').eq('obra', OBRA).order('numero', { ascending: false })
  ]);
  for (const r of [lp, lc, lpend]) if (r.error) throw r.error;
  if (!lo) { const e = new Error('obra não encontrada'); e.naoTem = true; throw e; }
  L = { problema: [], disciplina: [], comodo: [], servico: [], local: [] };
  for (const x of lp.data || []) (L[x.tipo] || (L[x.tipo] = [])).push(x);
  CFG = { pavimentos: (lc.data && lc.data.pavimentos && lc.data.pavimentos.length) ? lc.data.pavimentos : PAV_PADRAO };
  OBRA_NOME = lo.nome; PEND = lpend.data || [];
  await idbPut('cache', OBRA, { L, CFG, PEND, OBRA_NOME, em: new Date().toISOString() });
}
async function carregarCache() {
  const c = await idbGet('cache', OBRA); if (!c) return false;
  L = c.L; CFG = c.CFG; PEND = c.PEND; OBRA_NOME = c.OBRA_NOME; return c.em;
}

/* ======================= envio da fila ======================= */
let sincronizando = false;
const jaExiste = e => e && (String(e.code) === '23505' || String(e.statusCode) === '409' || /already exists|duplicate/i.test(e.message || ''));
async function enviarFotos(op) {
  for (const f of op.fotos || []) {
    if (f.ok) continue;
    const b = await idbGet('blobs', f.fid); const caminho = 'pendencias/' + OBRA + '/' + op.id + '/' + f.fid + '.jpg';
    if (b) { const { error } = await sb.storage.from((window.MAPA_CONFIG || {}).bucket || 'arquivos').upload(caminho, b, { contentType: 'image/jpeg', upsert: false }); if (error && !jaExiste(error)) throw error; }
    const { error: e2 } = await sb.from('pendencia_fotos').insert({ id: f.fid, pendencia: op.id, tipo: f.tipo, caminho });
    if (e2 && !jaExiste(e2)) throw e2;
    f.ok = true; await idbPut('fila', op.k, op);
    if (b) { const u = URLS.get(f.fid); URLS.delete(f.fid); if (u) URLS.set(caminho, u); await idbDel('blobs', f.fid); }
  }
}
async function executar(op) {
  if (op.op === 'criar') {
    if (!op.criada) { const { error } = await sb.from('pendencias').insert(Object.assign({ id: op.id, obra: OBRA, criado_em: op.em }, op.row)); if (error && !jaExiste(error)) throw error; op.criada = true; await idbPut('fila', op.k, op); }
    await enviarFotos(op);
  } else if (op.op === 'fotos') await enviarFotos(op);
  else if (op.op === 'editar') { const { error } = await sb.from('pendencias').update(op.campos).eq('id', op.id); if (error) throw error; }
  else if (op.op === 'status') { const { error } = await sb.rpc('pendencia_mudar', { p_id: op.id, p_para: op.para, p_comentario: op.comentario || null }); if (error) throw error; }
  else if (op.op === 'excluir') {
    const p = PEND.find(x => x.id === op.id);
    const { error } = await sb.from('pendencias').delete().eq('id', op.id); if (error) throw error;
    const cam = ((p && p.pendencia_fotos) || []).map(f => f.caminho); if (cam.length) sb.storage.from('arquivos').remove(cam).catch(() => {});
  }
}
async function sincronizar() {
  if (sincronizando || !navigator.onLine || !FILA.length) { status(); return; }
  sincronizando = true; status();
  let mudou = false; const travadas = new Set();
  try {
    for (const op of FILA.slice()) {
      if (travadas.has(op.id)) continue;   // uma operação com erro segura as seguintes da mesma pendência
      try { delete op.erro; await executar(op); await idbDel('fila', op.k); mudou = true; }
      catch (e) {
        if (semRede(e)) break;
        op.erro = (e && e.message) || 'erro'; await idbPut('fila', op.k, op); travadas.add(op.id); console.warn('envio', op, e);
      }
    }
  } finally { sincronizando = false; }
  await carregarFila();
  if (mudou) { try { await carregarServidor(); } catch (e) { console.warn(e); } }
  render(); reabrirDetalhe();
}
// a ficha aberta acompanha o que chegou do servidor
function reabrirDetalhe() { const o = $('ovl'); if (!o.hidden && o.dataset.det && !o.dataset.form) detalhe(o.dataset.det, true); }
function status() {
  const n = FILA.length, err = FILA.filter(o => o.erro).length, ch = $('modeChip');
  ch.classList.toggle('off', !navigator.onLine);
  // só aparece quando importa: sem sinal, enviando, ou com algo na fila
  ch.hidden = navigator.onLine && !n && !sincronizando;
  ch.textContent = (navigator.onLine ? (sincronizando ? 'Enviando…' : 'Online') : 'Sem sinal') + (n ? ' · ' + n + ' aguardando envio' : '') + (err ? ' · ' + err + ' com erro' : '');
}
window.addEventListener('online', () => { status(); sincronizar(); recarregar(); });
window.addEventListener('offline', status);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { sincronizar(); recarregar(); } });
let rt = null;
function recarregar() { clearTimeout(rt); rt = setTimeout(async () => { if (!navigator.onLine || sincronizando || (!$('ovl').hidden && $('ovl').dataset.form)) return; try { await carregarServidor(); render(); reabrirDetalhe(); } catch (e) { console.warn(e); } }, 400); }

  status();
  const m = $('main');
  const its = itens();
  const nf = its.filter(p => p._fila).length;
  m.innerHTML = `<div class="tabs"><button class="tab" data-tab="lista" aria-pressed="${TAB === 'lista'}">Lista</button><button class="tab" data-tab="resumo" aria-pressed="${TAB === 'resumo'}">Resumo</button><span class="sp"></span>
    ${!navigator.onLine ? '<span class="aviso" style="padding:4px 10px">Sem sinal: o que você registrar fica guardado neste aparelho e é enviado quando a conexão voltar.</span>' : ''}</div>
    ${FILA.some(o => o.erro) ? `<div class="aviso">Algumas alterações não foram aceitas pelo banco. Abra a pendência marcada com “erro ao enviar” para ver o motivo.</div>` : ''}

function filtrar(its) {
  const q = F.q.trim().toLowerCase();
  return its.filter(p => F.st.has(p.status) && (!F.pav || p.pavimento === F.pav) && (!F.disc || p.disciplina === F.disc) && (!F.tipo || p.tipo === F.tipo) && (!F.pri || p.prioridade === F.pri)
    && (!F.blq || (p.bloqueios || []).length) && (!F.inc || incompleta(p)) && (!F.venc || vencida(p)) && (!F.fila || p._fila) && (!F.minhas || minha(p))
    && (!q || [p.numero ? '#' + p.numero : '', p.descricao, p.unidade, p.comodo, p.tipo, p.disciplina, p.local_tipo, p.pavimento, p.observacoes].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => ST_ORD.indexOf(a.status) - ST_ORD.indexOf(b.status) || (+vencida(b) - +vencida(a)) || PRI_ORD.indexOf(a.prioridade) - PRI_ORD.indexOf(b.prioridade) || (b.numero || 1e9) - (a.numero || 1e9));
}

      </div>

    <div class="cols"><div class="box"><h3>Por disciplina</h3>${tabela(mD, [...mD.keys()].sort(), 'Disciplina')}</div><div class="box"><h3>Por pavimento</h3>${tabela(mP, ordP, 'Pavimento')}</div></div>
    <div class="box"><h3>Frentes bloqueadas (pendências não fechadas)</h3>${blq.length ? `<div class="bl">${blq.sort((a, b) => String(a.b.servico).localeCompare(String(b.b.servico))).map(({ p, b }) => `<button data-p="${esc(p.id)}"><b>${esc(b.servico)}</b><span>${esc(b.local || rotLocal(p))}</span><small>${p.numero ? '#' + p.numero : 'nº pendente'} · ${esc(p.tipo)} · ${esc(p.disciplina)} · ${ST[p.status]}${vencida(p) ? ' · vencida' : ''}</small></button>`).join('')}</div>` : '<p class="muted" style="margin:0">Nenhum serviço travado por pendência.</p>'}</div>`;

/* ======================= janelas ======================= */
function openSheet(t, body, foot, form) { delete $('ovl').dataset.det; $('ovlT').textContent = t; $('ovlB').innerHTML = body; $('ovlF').innerHTML = foot || ''; $('ovl').hidden = false; if (form) $('ovl').dataset.form = '1'; else delete $('ovl').dataset.form; $('ovlB').scrollTop = 0; }
function closeSheet() { $('ovl').hidden = true; $('ovlB').innerHTML = ''; $('ovlF').innerHTML = ''; delete $('ovl').dataset.form; delete $('ovl').dataset.det; render(); }
$('ovlX').onclick = () => { if ($('ovl').dataset.form && !confirm('Fechar sem salvar?')) return; closeSheet(); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if (!$('viewer').hidden) { $('viewer').hidden = true; return; } if (!$('ovl').hidden && !$('ovl').dataset.form) closeSheet(); } });

/* ---------------- registro rápido / edição ---------------- */
function formPend(id) {
  const ed = id ? itens().find(p => p.id === id) : null;
  if (ed && !editor(ed)) return;
  const tiposOk = L.problema.filter(t => cargo() === 'engenharia' || (cargo() === 'seguranca' && ehSegTipo(t.valor)));
  const f = ed ? clone(ed) : { pavimento: '', local_tipo: '', unidade: '', comodo: '', tipo: tiposOk.length === 1 ? tiposOk[0].valor : '', disciplina: '', prioridade: '', descricao: '', causador: '', bloqueios: [], prazo: '', observacoes: '' };
  if (!ed && f.tipo) f.disciplina = ((L.problema.find(x => x.valor === f.tipo) || {}).extra || {}).disciplina || '';
  let prazoManual = !!ed;
  const novas = [];   // fotos novas {fid, url}
  const unidadesDe = pav => ((CFG.pavimentos.find(x => x.nome === pav) || {}).unidades) || [];
  const grupo = (nome, lista, val, attr, extra) => `<div class="opts ${extra || ''}" role="group" aria-label="${nome}">${lista.map(v => `<button type="button" class="opt ${attr === 'prioridade' ? 'pri-' + v : ''}" data-f="${attr}" data-v="${esc(v)}" aria-pressed="${val === v}">${esc(attr === 'prioridade' ? PRI[v][0] : v)}</button>`).join('')}</div>`;
  const desenhar = () => {
    const ehApto = f.local_tipo === 'Apartamento';
    const uns = unidadesDe(f.pavimento);
    $('ovlB').innerHTML = `
      <div class="fld"><span class="l">Fotos do antes ${ed ? '' : '<span class="req">*</span>'}</span>
        <div class="fotos">${(ed ? ed.fotos.filter(x => x.tipo === 'antes') : []).map(x => `<span class="ft"><img data-zoom alt="Foto" data-foto='${esc(JSON.stringify(x))}' hidden></span>`).join('')}${novas.map((x, i) => `<span class="ft"><img data-zoom alt="Foto nova" src="${x.url}"><button type="button" data-rm="${i}" aria-label="Remover foto">×</button></span>`).join('')}</div>
        <div class="addft"><label>📷 Tirar foto<input type="file" accept="image/*" capture="environment" id="fCam"></label><label>🖼 Da galeria<input type="file" accept="image/*" multiple id="fGal"></label></div></div>
      <div class="fld"><span class="l">Pavimento <span class="req">*</span></span>${grupo('Pavimento', CFG.pavimentos.map(x => x.nome), f.pavimento, 'pavimento', 'small')}</div>
      <div class="fld"><span class="l">Local <span class="req">*</span></span>${grupo('Local', L.local.map(x => x.valor), f.local_tipo, 'local_tipo', 'small')}</div>
      ${ehApto ? `<div class="fld"><span class="l">Apartamento <span class="req">*</span></span>${uns.length ? grupo('Apartamento', uns, f.unidade, 'unidade', 'small') : '<input id="fUn" placeholder="Número do apartamento" value="' + esc(f.unidade || '') + '">'}</div>
        <div class="fld"><span class="l">Cômodo <span class="req">*</span></span>${grupo('Cômodo', L.comodo.map(x => x.valor), f.comodo, 'comodo', 'small')}</div>`
        : (f.local_tipo ? `<div class="fld"><label for="fUn2">Qual (opcional)</label><input id="fUn2" placeholder="Ex.: hall dos elevadores, shaft 3" value="${esc(f.unidade || '')}"></div>` : '')}
      <div class="fld"><label for="fTipo2">Tipo de problema <span class="req">*</span></label><select id="fTipo2"><option value="">Escolha…</option>${tiposOk.map(t => `<option ${t.valor === f.tipo ? 'selected' : ''}>${esc(t.valor)}</option>`).join('')}</select></div>
      <div class="fld"><span class="l">Responsável pela correção <span class="req">*</span></span>${grupo('Disciplina', L.disciplina.map(x => x.valor), f.disciplina, 'disciplina', 'small')}</div>
      <div class="fld"><span class="l">Prioridade <span class="req">*</span></span>${grupo('Prioridade', PRI_ORD, f.prioridade, 'prioridade')}</div>
      <details class="mais" ${ed || incompleta(f) === false ? 'open' : ''}><summary>Mais detalhes (opcional; sem eles a pendência fica INCOMPLETA)</summary>
        <div class="fld"><label for="fDesc">Descrição</label><textarea id="fDesc" placeholder="O que está errado e o que precisa ser feito">${esc(f.descricao || '')}</textarea></div>
        <div class="fld"><label for="fCaus">Responsável pelo problema (quem causou)</label><input id="fCaus" list="dlCaus" value="${esc(f.causador || '')}" placeholder="Ex.: Hidráulica (empreiteira X)"><datalist id="dlCaus">${L.disciplina.map(x => `<option value="${esc(x.valor)}">`).join('')}</datalist></div>
        <div class="fld"><span class="l">Serviços que esta pendência trava</span>
          <div id="blqBox" style="display:grid;gap:6px">${(f.bloqueios || []).map((b, i) => `<div class="blq"><select data-bs="${i}"><option value="">Serviço…</option>${L.servico.map(s => `<option ${s.valor === b.servico ? 'selected' : ''}>${esc(s.valor)}</option>`).join('')}</select><input data-bl="${i}" placeholder="Local (ex.: apto 403)" value="${esc(b.local || '')}"><button type="button" class="btn sm ghost" data-brm="${i}" aria-label="Remover">×</button></div>`).join('')}</div>
          <button type="button" class="btn sm ghost" id="blqAdd" style="justify-self:start">+ Serviço travado</button></div>
        <div class="fld"><label for="fPrazo">Prazo ${f.prioridade && !prazoManual ? '<span class="muted" style="text-transform:none;letter-spacing:0">(sugerido: ' + PRI[f.prioridade][1] + ' dia' + (PRI[f.prioridade][1] > 1 ? 's' : '') + ')</span>' : ''}</label><input type="date" id="fPrazo" value="${esc(f.prazo || '')}"></div>
        <div class="fld"><label for="fObs">Observações</label><textarea id="fObs">${esc(f.observacoes || '')}</textarea></div>
      </details>`;
    const B = $('ovlB');
    const lerTextos = () => { const g = id => $(id) ? $(id).value : null;
      if (g('fDesc') != null) f.descricao = g('fDesc'); if (g('fCaus') != null) f.causador = g('fCaus'); if (g('fPrazo') != null) f.prazo = g('fPrazo'); if (g('fObs') != null) f.observacoes = g('fObs');
      if (g('fUn') != null) f.unidade = g('fUn'); if (g('fUn2') != null) f.unidade = g('fUn2');
      B.querySelectorAll('[data-bs]').forEach(s => { f.bloqueios[+s.dataset.bs].servico = s.value; }); B.querySelectorAll('[data-bl]').forEach(s => { f.bloqueios[+s.dataset.bl].local = s.value; }); };
    desenhar.ler = lerTextos;
    B.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { lerTextos(); const k = b.dataset.f, v = b.dataset.v;
      if (k === 'pavimento' && f.pavimento !== v) f.unidade = '';
      if (k === 'local_tipo' && f.local_tipo !== v) { f.unidade = ''; f.comodo = ''; }
      f[k] = f[k] === v && k !== 'prioridade' ? '' : v;
      if (k === 'prioridade' && !prazoManual) f.prazo = somaDias(hoje(), PRI[v][1]);
      const open = B.querySelector('details.mais').open; desenhar(); B.querySelector('details.mais').open = open; });
    $('fTipo2').onchange = e => { lerTextos(); f.tipo = e.target.value; const s = ((L.problema.find(x => x.valor === f.tipo) || {}).extra || {}).disciplina; if (s) f.disciplina = s; const open = B.querySelector('details.mais').open; desenhar(); B.querySelector('details.mais').open = open; };
    $('fPrazo').oninput = () => { prazoManual = true; };
    $('blqAdd').onclick = () => { lerTextos(); f.bloqueios.push({ servico: '', local: f.local_tipo === 'Apartamento' && f.unidade ? 'Apto ' + f.unidade : '' }); desenhar(); B.querySelector('details.mais').open = true; };
    B.querySelectorAll('[data-brm]').forEach(b => b.onclick = () => { lerTextos(); f.bloqueios.splice(+b.dataset.brm, 1); desenhar(); B.querySelector('details.mais').open = true; });
    B.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { lerTextos(); const x = novas.splice(+b.dataset.rm, 1)[0]; URL.revokeObjectURL(x.url); desenhar(); });
    const addFotos = async files => { lerTextos(); for (const arq of files) { try { const blob = await comprimir(arq); novas.push({ fid: uuid(), blob, url: URL.createObjectURL(blob) }); } catch (e) { toast('Não foi possível ler a foto.'); } } desenhar(); };
    $('fCam').onchange = e => addFotos([...e.target.files]); $('fGal').onchange = e => addFotos([...e.target.files]);
    pintarFotos(B);
  };
  openSheet(ed ? 'Editar pendência ' + (ed.numero ? '#' + ed.numero : '') : 'Nova pendência', '', `<span class="msg" id="pMsg"></span><button class="btn ghost" id="pC" type="button">Cancelar</button><button class="btn" id="pOk" type="button">${ed ? 'Salvar' : 'Registrar'}</button>`, true);
  desenhar();
  $('pC').onclick = () => { if (novas.length && !confirm('Descartar as fotos tiradas?')) return; novas.forEach(x => URL.revokeObjectURL(x.url)); closeSheet(); };
  $('pOk').onclick = async () => {
    desenhar.ler();
    const falta = [];
    if (!ed && !novas.length) falta.push('foto do antes');
    if (!f.pavimento) falta.push('pavimento'); if (!f.local_tipo) falta.push('local');
    if (f.local_tipo === 'Apartamento' && !String(f.unidade || '').trim()) falta.push('apartamento');
    if (f.local_tipo === 'Apartamento' && !f.comodo) falta.push('cômodo');
    if (!f.tipo) falta.push('tipo de problema'); if (!f.disciplina) falta.push('responsável pela correção'); if (!f.prioridade) falta.push('prioridade');
    if (falta.length) { $('pMsg').className = 'msg err'; $('pMsg').textContent = 'Falta: ' + falta.join(', ') + '.'; return; }
    const row = { pavimento: f.pavimento, local_tipo: f.local_tipo, unidade: String(f.unidade || '').trim() || null, comodo: f.local_tipo === 'Apartamento' ? f.comodo : null,
      // de segurança: tipo de problema de segurança, ou registrada/editada pela Segurança
      tipo: f.tipo, disciplina: f.disciplina, prioridade: f.prioridade, seguranca: ehSegTipo(f.tipo) || cargo() === 'seguranca',
      descricao: String(f.descricao || '').trim() || null, causador: String(f.causador || '').trim() || null,
      bloqueios: (f.bloqueios || []).filter(b => b.servico).map(b => ({ servico: b.servico, local: String(b.local || '').trim() })),
      prazo: f.prazo || null, observacoes: String(f.observacoes || '').trim() || null };
    $('pOk').disabled = true;
    for (const x of novas) await idbPut('blobs', x.fid, x.blob);
    const fotos = novas.map(x => ({ fid: x.fid, tipo: 'antes' }));
    novas.forEach(x => URLS.set(x.fid, x.url));
    if (ed) { await enfileirar({ op: 'editar', id: ed.id, campos: row }); if (fotos.length) await enfileirar({ op: 'fotos', id: ed.id, fotos }); }
    else await enfileirar({ op: 'criar', id: uuid(), row, fotos });
    delete $('ovl').dataset.form; closeSheet();
    toast(ed ? 'Alterações salvas.' : navigator.onLine ? 'Pendência registrada.' : 'Pendência guardada neste aparelho. Ela é enviada quando o sinal voltar.', 5000);
  };
}

/* ---------------- detalhe ---------------- */
function detalhe(id, mantemRolagem) {
  const p = itens().find(x => x.id === id); if (!p) { closeSheet(); return; }
  const rol = mantemRolagem ? $('ovlB').scrollTop : 0;
  const op = FILA.find(o => o.id === id && o.erro);
  const fotos = t => p.fotos.filter(x => x.tipo === t);
  const galeria = arr => arr.length ? `<div class="fotos">${arr.map(x => `<span class="ft"><span class="ph muted" style="display:grid;place-items:center;height:100%;font-size:.7rem">${x.local ? 'no aparelho' : 'carregando'}</span><img data-zoom alt="Foto" data-foto='${esc(JSON.stringify(x))}' hidden style="position:absolute;inset:0"></span>`).join('')}</div>` : '<span class="muted">Nenhuma.</span>';
  const evTxt = e => e.acao === 'criada' ? 'registrou a pendência' : e.acao === 'editada' ? 'editou os dados' : e.acao === 'foto' ? 'anexou foto do ' + e.para
    : (e.para === 'aberta' && (e.de === 'corrigida' || e.de === 'fechada')) ? (e.de === 'fechada' ? 'reabriu' : 'reprovou a correção') : 'mudou para “' + (ST[e.para] || e.para) + '”';
  const evs = p.eventos.slice().sort((a, b) => String(b.em).localeCompare(String(a.em)));
  const tem = !!cargo();
  const pode = { iniciar: tem && p.status === 'aberta', corrigir: tem && (p.status === 'aberta' || p.status === 'em_correcao'), fechar: p.status === 'corrigida' && fecha(p), reprovar: p.status === 'corrigida' && fecha(p), reabrir: p.status === 'fechada' && fecha(p), editar: editor(p) && p.status !== 'fechada', excluir: editor(p) };
  openSheet((p.numero ? 'Pendência #' + p.numero : 'Pendência (nº pendente)'), `
    <div class="acts"><span class="pill st-${p.status}">${ST[p.status]}</span><span class="pill p-${p.prioridade}">${PRI[p.prioridade][0]}</span>${p.seguranca ? '<span class="tag">segurança</span>' : ''}${vencida(p) ? '<span class="tag venc">vencida</span>' : ''}${incompleta(p) && p.status !== 'fechada' ? '<span class="tag inc">INCOMPLETA</span>' : ''}${p._fila ? '<span class="tag fila">aguardando envio</span>' : ''}</div>
    ${op ? `<div class="aviso">Não foi enviado: ${esc(op.erro)}<div class="acts" style="margin-top:6px"><button class="btn sm" id="dRetry" type="button">Tentar de novo</button><button class="btn sm danger" id="dDescartar" type="button">Descartar esta alteração</button></div></div>` : ''}
    <div class="fld"><span class="l">Antes</span>${galeria(fotos('antes'))}</div>
    ${fotos('depois').length || p.status !== 'aberta' ? `<div class="fld"><span class="l">Depois</span>${galeria(fotos('depois'))}</div>` : ''}
    <dl class="kv"><dt>Local</dt><dd>${esc(rotLocal(p))}</dd><dt>Tipo de problema</dt><dd>${esc(p.tipo)}</dd><dt>Corrige</dt><dd>${esc(p.disciplina)}</dd>
      <dt>Prazo</dt><dd>${p.prazo ? fmtD(p.prazo) : '—'}</dd><dt>Descrição</dt><dd>${esc(p.descricao || '—')}</dd><dt>Quem causou</dt><dd>${esc(p.causador || '—')}</dd>
      <dt>Trava</dt><dd>${(p.bloqueios || []).length ? p.bloqueios.map(b => esc(b.servico) + (b.local ? ' (' + esc(b.local) + ')' : '')).join('; ') : '—'}</dd>
      <dt>Observações</dt><dd>${esc(p.observacoes || '—')}</dd><dt>Registrada</dt><dd>${fmtDH(p.criado_em)} por ${esc(nomeDe(p.criado_por))}</dd></dl>
    <div class="fld"><span class="l">Histórico</span><div class="hist">${evs.map(e => `<div><b>${esc(nomeDe(e.por))}</b> ${esc(evTxt(e))} <small>· ${fmtDH(e.em)}${e.local ? ' · aguardando envio' : ''}</small>${e.comentario ? `<span class="cm">${esc(e.comentario)}</span>` : ''}</div>`).join('')}</div></div>`,
    `<span class="msg" id="dMsg"></span>
     ${pode.excluir ? '<button class="btn sm danger" id="dDel" type="button" style="margin-right:auto">Excluir</button>' : ''}
     ${pode.editar ? '<button class="btn sm ghost" id="dEd" type="button">Editar</button>' : ''}
     ${pode.iniciar ? '<button class="btn sm ghost" id="dIni" type="button">Iniciar correção</button>' : ''}
     ${pode.corrigir ? '<button class="btn sm" id="dCor" type="button">Marcar como corrigida</button>' : ''}
     ${pode.reprovar ? '<button class="btn sm danger" id="dRep" type="button">Reprovar</button>' : ''}
     ${pode.fechar ? '<button class="btn sm ok" id="dFec" type="button">Aprovar e fechar</button>' : ''}
     ${pode.reabrir ? '<button class="btn sm ghost" id="dReab" type="button">Reabrir</button>' : ''}`);
  $('ovl').dataset.det = id; if (rol) $('ovlB').scrollTop = rol;
  pintarFotos($('ovlB'));
  const B = id2 => $(id2);
  if (op) { B('dRetry').onclick = async () => { delete op.erro; await idbPut('fila', op.k, op); await carregarFila(); sincronizar(); closeSheet(); };
    B('dDescartar').onclick = async () => { if (!confirm('Descartar esta alteração? Ela não será enviada.')) return; const ops = FILA.filter(o => o.id === id && o.seq >= op.seq); for (const o of ops) { for (const f of o.fotos || []) await idbDel('blobs', f.fid); await idbDel('fila', o.k); } await carregarFila(); closeSheet(); }; }
  if (B('dEd')) B('dEd').onclick = () => formPend(id);
  if (B('dIni')) B('dIni').onclick = async () => { await enfileirar({ op: 'status', id, para: 'em_correcao' }); toast('Correção iniciada.'); detalhe(id); };
  if (B('dCor')) B('dCor').onclick = () => formCorrigida(p);
  if (B('dFec')) B('dFec').onclick = async () => { await enfileirar({ op: 'status', id, para: 'fechada' }); toast('Pendência aprovada e fechada.'); detalhe(id); };
  if (B('dRep')) B('dRep').onclick = () => formComentario(p, 'Reprovar a correção', 'O que ainda está errado? (obrigatório; o encarregado vê este comentário)', 'Reprovar');
  if (B('dReab')) B('dReab').onclick = () => formComentario(p, 'Reabrir a pendência', 'Por que está sendo reaberta? (obrigatório)', 'Reabrir');
  if (B('dDel')) B('dDel').onclick = async () => { if (!confirm('Excluir a pendência ' + (p.numero ? '#' + p.numero : '') + '? As fotos e o histórico também são apagados.')) return;
    // ainda não foi enviada: basta descartar do aparelho
    const cr = FILA.find(o => o.id === id && o.op === 'criar' && !o.criada);
    if (cr) { for (const o of FILA.filter(o => o.id === id)) { for (const f of o.fotos || []) await idbDel('blobs', f.fid); await idbDel('fila', o.k); } await carregarFila(); }
    else await enfileirar({ op: 'excluir', id });
    closeSheet(); toast('Pendência excluída.'); };
}
function formCorrigida(p) {
  const novas = [];
  const desenhar = () => {
    $('ovlB').innerHTML = `<p style="margin:0"><b>${p.numero ? '#' + p.numero : 'Pendência'}</b> · ${esc(rotLocal(p))} · ${esc(p.tipo)}</p>
      <div class="fld"><span class="l">Foto do depois <span class="req">*</span></span><div class="fotos">${novas.map((x, i) => `<span class="ft"><img data-zoom alt="Foto" src="${x.url}"><button type="button" data-rm="${i}" aria-label="Remover">×</button></span>`).join('')}</div>
        <div class="addft"><label>📷 Tirar foto<input type="file" accept="image/*" capture="environment" id="cCam"></label><label>🖼 Da galeria<input type="file" accept="image/*" multiple id="cGal"></label></div></div>
      <div class="fld"><label for="cCom">Comentário (opcional)</label><textarea id="cCom" placeholder="O que foi feito">${esc(desenhar.c || '')}</textarea></div>
      <p class="muted" style="margin:0">${p.seguranca ? 'A Segurança' : 'A Engenharia'} confere e dá a baixa final.</p>`;
    $('cCom').oninput = e => { desenhar.c = e.target.value; };
    const add = async files => { for (const a of files) { try { const blob = await comprimir(a); novas.push({ fid: uuid(), blob, url: URL.createObjectURL(blob) }); } catch (e) { toast('Não foi possível ler a foto.'); } } desenhar(); };
    $('cCam').onchange = e => add([...e.target.files]); $('cGal').onchange = e => add([...e.target.files]);
    $('ovlB').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const x = novas.splice(+b.dataset.rm, 1)[0]; URL.revokeObjectURL(x.url); desenhar(); });
  };
  openSheet('Marcar como corrigida', '', '<span class="msg" id="cMsg"></span><button class="btn ghost" id="cC" type="button">Voltar</button><button class="btn" id="cOk" type="button">Marcar como corrigida</button>', true);
  desenhar();
  $('cC').onclick = () => { novas.forEach(x => URL.revokeObjectURL(x.url)); delete $('ovl').dataset.form; detalhe(p.id); };
  $('cOk').onclick = async () => {
    if (!novas.length) { $('cMsg').className = 'msg err'; $('cMsg').textContent = 'Tire ao menos uma foto do depois.'; return; }
    $('cOk').disabled = true;
    for (const x of novas) { await idbPut('blobs', x.fid, x.blob); URLS.set(x.fid, x.url); }
    await enfileirar({ op: 'fotos', id: p.id, fotos: novas.map(x => ({ fid: x.fid, tipo: 'depois' })) });
    await enfileirar({ op: 'status', id: p.id, para: 'corrigida', comentario: String(desenhar.c || '').trim() || null });
    delete $('ovl').dataset.form; toast('Marcada como corrigida. ' + (p.seguranca ? 'A Segurança' : 'A Engenharia') + ' vai conferir.', 5000); detalhe(p.id);
  };
}
function formComentario(p, titulo, rotulo, botao) {
  openSheet(titulo, `<p style="margin:0"><b>${p.numero ? '#' + p.numero : 'Pendência'}</b> · ${esc(rotLocal(p))}</p><div class="fld"><label for="rCom">${esc(rotulo)}</label><textarea id="rCom"></textarea></div>`,
    `<span class="msg" id="rMsg"></span><button class="btn ghost" id="rC" type="button">Voltar</button><button class="btn danger" id="rOk" type="button">${esc(botao)}</button>`, true);
  $('rCom').focus();
  $('rC').onclick = () => { delete $('ovl').dataset.form; detalhe(p.id); };
  $('rOk').onclick = async () => { const c = $('rCom').value.trim(); if (!c) { $('rMsg').className = 'msg err'; $('rMsg').textContent = 'Escreva o motivo.'; return; }
    await enfileirar({ op: 'status', id: p.id, para: 'aberta', comentario: c }); delete $('ovl').dataset.form; toast(botao === 'Reprovar' ? 'Correção reprovada. A pendência voltou para “aberta”.' : 'Pendência reaberta.', 5000); detalhe(p.id); };
}

/* ---------------- relatório em PDF ---------------- */
const GRUPOS = { disciplina: 'Responsável pela correção', tipo: 'Tipo de problema', pavimento: 'Pavimento' };
const FSTATUS = { nfechadas: ['Não fechadas', p => p.status !== 'fechada'], abertas: ['Abertas e em correção', p => p.status === 'aberta' || p.status === 'em_correcao'], corrigidas: ['Corrigidas (aguardando aprovação)', p => p.status === 'corrigida'], fechadas: ['Fechadas', p => p.status === 'fechada'], todas: ['Todas', () => true] };
function formRelatorio() {
  if (!window.jspdf) { toast('A biblioteca de PDF não carregou. Verifique a conexão.'); return; }
  openSheet('Relatório em PDF', `<div class="fld"><label for="rgG">Agrupar por</label><select id="rgG">${Object.entries(GRUPOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
    <div class="fld"><label for="rgS">Status</label><select id="rgS">${Object.entries(FSTATUS).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rgF" checked> Incluir as fotos (antes e depois)</label>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rgL"> Usar também os filtros da lista (pavimento, disciplina, tipo, prioridade, busca)</label>
    <div id="rgP" hidden><div class="muted" id="rgPT"></div><div class="prog"><i id="rgPB"></i></div></div>`,
    '<span class="msg" id="rgM"></span><button class="btn ghost" id="rgC" type="button">Fechar</button><button class="btn" id="rgOk" type="button">Gerar PDF</button>');
  $('rgC').onclick = closeSheet;
  $('rgOk').onclick = async () => {
    const g = $('rgG').value, s = $('rgS').value, comFotos = $('rgF').checked;
    let arr = itens().filter(FSTATUS[s][1]);
    if ($('rgL').checked) { const st0 = F.st; F.st = new Set(ST_ORD); arr = filtrar(arr); F.st = st0; }
    if (!arr.length) { $('rgM').className = 'msg err'; $('rgM').textContent = 'Nenhuma pendência com essas opções.'; return; }
    $('rgOk').disabled = true; $('rgP').hidden = false;
    try { await gerarPdf(arr, g, FSTATUS[s][0], comFotos, (t, f) => { $('rgPT').textContent = t; $('rgPB').style.width = Math.round(f * 100) + '%'; }); $('rgM').className = 'msg ok'; $('rgM').textContent = 'PDF gerado.'; }
    catch (e) { console.error(e); $('rgM').className = 'msg err'; $('rgM').textContent = 'Não foi possível gerar: ' + (e.message || e); }
    $('rgOk').disabled = false;
  };
}
async function fotoParaPdf(f) {
  const u = await urlFoto(f); if (!u) return null;
  const img = new Image(); await new Promise(r => { img.onload = r; img.onerror = r; img.src = u; }); if (!img.naturalWidth) return null;
  const sc = Math.min(1, 700 / Math.max(img.naturalWidth, img.naturalHeight)); const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); return { d: cv.toDataURL('image/jpeg', .78), w: cv.width, h: cv.height };
}
async function gerarPdf(arr, g, stTxt, comFotos, prog) {
  const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true }); const W = 210, H = 297, M = 14;
  const quem = nomeDe(NV.usuario.email), quando = fmtDH(new Date().toISOString());
  let y = 0, pag = 0;
  const cab = () => { pag++; pdf.setFillColor(34, 66, 92); pdf.rect(0, 0, W, 16, 'F'); pdf.setTextColor(255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(12); pdf.text('Pendências de obra · ' + OBRA_NOME, M, 10.5);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.text('Gerado em ' + quando + ' por ' + quem + ' · página ' + pag, W - M, 10.5, { align: 'right' }); pdf.setTextColor(20, 34, 46); y = 24; };
  const precisa = h => { if (y + h > H - 12) { pdf.addPage(); cab(); } };
  const linhas = (t, w, sz) => { pdf.setFontSize(sz); return pdf.splitTextToSize(String(t || ''), w); };
  cab();
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15); pdf.text('Relatório de pendências', M, y); y += 6;
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9.5); pdf.setTextColor(90, 107, 120);
  pdf.text('Status: ' + stTxt + ' · agrupado por ' + GRUPOS[g].toLowerCase() + ' · ' + arr.length + ' pendência' + (arr.length > 1 ? 's' : '') + ' · ' + arr.filter(vencida).length + ' vencida(s)', M, y); y += 8; pdf.setTextColor(20, 34, 46);
  const grupos = new Map(); for (const p of arr) { const k = p[g] || '—'; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(p); }
  const ordemG = g === 'pavimento' ? CFG.pavimentos.map(x => x.nome).filter(n => grupos.has(n)).concat([...grupos.keys()].filter(k => !CFG.pavimentos.some(x => x.nome === k))) : [...grupos.keys()].sort();
  let n = 0;
  for (const k of ordemG) {
    const lst = grupos.get(k).sort((a, b) => ST_ORD.indexOf(a.status) - ST_ORD.indexOf(b.status) || PRI_ORD.indexOf(a.prioridade) - PRI_ORD.indexOf(b.prioridade) || (a.numero || 0) - (b.numero || 0));
    precisa(14); pdf.setFillColor(220, 235, 242); pdf.rect(M, y - 5, W - 2 * M, 8, 'F'); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11.5); pdf.text(k + ' (' + lst.length + ')', M + 2, y + 0.5); y += 8;
    for (const p of lst) {
      n++; prog('Montando ' + n + ' de ' + arr.length + '…', n / arr.length);
      const info = [['Local', rotLocal(p)], ['Tipo', p.tipo], ['Corrige', p.disciplina], ['Prioridade', PRI[p.prioridade][0] + (p.prazo ? ' · prazo ' + fmtD(p.prazo) + (vencida(p) ? ' (VENCIDA)' : '') : '')],
        ['Descrição', p.descricao || '—'], ['Quem causou', p.causador || '—'], ['Trava', (p.bloqueios || []).map(b => b.servico + (b.local ? ' (' + b.local + ')' : '')).join('; ') || '—'], ['Observações', p.observacoes || '']].filter(x => x[1]);
      const ls = info.map(([a, b]) => linhas(b, W - 2 * M - 30, 9));
      let fimgs = [];
      if (comFotos) { const sel = p.fotos.filter(f => f.tipo === 'antes').slice(0, 3).concat(p.fotos.filter(f => f.tipo === 'depois').slice(0, 3));
        for (const f of sel) { const im = await fotoParaPdf(f).catch(() => null); if (im) fimgs.push(Object.assign(im, { tipo: f.tipo })); } }
      const hTxt = 7 + ls.reduce((s, l) => s + l.length * 4, 0); const hFt = fimgs.length ? 46 : 0;
      precisa(Math.min(hTxt + hFt + 4, H - 40));
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11); pdf.text((p.numero ? '#' + p.numero : 'nº pendente') + '  ·  ' + ST[p.status], M, y);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); pdf.setTextColor(90, 107, 120); pdf.text('Registrada em ' + fmtDH(p.criado_em) + ' por ' + nomeDe(p.criado_por), W - M, y, { align: 'right' }); pdf.setTextColor(20, 34, 46); y += 5.5;
      info.forEach(([a], i) => { precisa(ls[i].length * 4 + 1); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.text(a + ':', M, y); pdf.setFont('helvetica', 'normal'); pdf.text(ls[i], M + 30, y); y += ls[i].length * 4; });
      if (fimgs.length) { precisa(46); let x = M; const hh = 40;
        for (const im of fimgs) { const r = im.w / im.h; let w = hh * r, h = hh; if (w > 54) { w = 54; h = 54 / r; } if (x + w > W - M) break; pdf.addImage(im.d, 'JPEG', x, y + 1, w, h); pdf.setFontSize(7.5); pdf.setTextColor(90, 107, 120); pdf.text(im.tipo === 'antes' ? 'Antes' : 'Depois', x, y + hh + 4); pdf.setTextColor(20, 34, 46); x += w + 3; }
        y += hh + 6; }
      pdf.setDrawColor(211, 220, 227); pdf.line(M, y, W - M, y); y += 5;
    }
  }
  const nome = 'Pendencias_' + String(OBRA_NOME).replace(/[^\wÀ-ú]+/g, '_') + '_' + hoje().replace(/-/g, '') + '.pdf';
  const b = pdf.output('blob'); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}

/* ---------------- listas (administrador) ---------------- */
function formListas() {
  const txt = t => L[t].map(x => x.valor + (t === 'problema' && x.extra && x.extra.disciplina ? ' ; ' + x.extra.disciplina : t === 'disciplina' && x.extra && x.extra.grupo ? ' ; ' + x.extra.grupo : '')).join('\n');
  const pavTxt = CFG.pavimentos.map(x => x.nome + ': ' + (x.unidades || []).join(', ')).join('\n');
  const area = (id, rot, val, dica) => `<div class="fld"><label for="${id}">${rot}</label><textarea id="${id}" rows="6">${esc(val)}</textarea><span class="muted">${dica}</span></div>`;
  openSheet('Listas das pendências', `<p class="muted" style="margin:0">Uma opção por linha. As mudanças valem para todos a partir de agora (as pendências já registradas não mudam).</p>
    ${area('lProb', 'Tipos de problema', txt('problema'), 'Formato: <b>Tipo ; disciplina sugerida</b>. Os tipos sugeridos para “Segurança” são os de segurança.')}
    ${area('lDisc', 'Disciplinas (responsável pela correção)', txt('disciplina'), 'Formato: <b>Disciplina ; grupo</b>. Disciplinas com o mesmo grupo são complementares (um encarregado pode ter as duas).')}
    ${area('lCom', 'Cômodos', txt('comodo'), '')}
    ${area('lSer', 'Serviços que podem ser travados', txt('servico'), '')}
    ${area('lLoc', 'Tipos de local', txt('local'), '“Apartamento” pede o número e o cômodo.')}
    ${area('lPav', 'Pavimentos e unidades desta obra (de baixo para cima)', pavTxt, 'Formato: <b>Pavimento: unidade, unidade, …</b> Ex.: Pavimento 03: 301, 302, Zelador')}`,
    '<span class="msg" id="lMsg"></span><button class="btn ghost" id="lC" type="button">Cancelar</button><button class="btn" id="lOk" type="button">Salvar listas</button>', true);
  $('lC').onclick = () => { delete $('ovl').dataset.form; closeSheet(); };
  $('lOk').onclick = async () => {
    const lin = id => $(id).value.split('\n').map(s => s.trim()).filter(Boolean);
    const par = s => { const [a, b] = s.split(';').map(x => x.trim()); return [a, b || '']; };
    const novo = [];
    lin('lProb').forEach((s, i) => { const [v, d] = par(s); novo.push({ tipo: 'problema', valor: v, ordem: i + 1, extra: d ? { disciplina: d } : {} }); });
    lin('lDisc').forEach((s, i) => { const [v, gp] = par(s); novo.push({ tipo: 'disciplina', valor: v, ordem: i + 1, extra: gp ? { grupo: gp } : {} }); });
    [['lCom', 'comodo'], ['lSer', 'servico'], ['lLoc', 'local']].forEach(([id, t]) => lin(id).forEach((v, i) => novo.push({ tipo: t, valor: v, ordem: i + 1, extra: {} })));
    const pavs = lin('lPav').map(s => { const i = s.indexOf(':'); const nome = (i >= 0 ? s.slice(0, i) : s).trim(); const un = i >= 0 ? s.slice(i + 1).split(',').map(x => x.trim()).filter(Boolean) : []; return { nome, unidades: un }; }).filter(x => x.nome);
    if (!pavs.length) { $('lMsg').className = 'msg err'; $('lMsg').textContent = 'Informe ao menos um pavimento.'; return; }
    const vistos = new Set(); for (const x of novo) { const k = x.tipo + '|' + x.valor; if (vistos.has(k)) { $('lMsg').className = 'msg err'; $('lMsg').textContent = 'Repetido: ' + x.valor; return; } vistos.add(k); }
    $('lOk').disabled = true; $('lMsg').className = 'msg'; $('lMsg').textContent = 'Salvando…';
    try {
      for (const t of ['problema', 'disciplina', 'comodo', 'servico', 'local']) { const { error } = await sb.from('pend_listas').delete().eq('tipo', t); if (error) throw error; }
      { const { error } = await sb.from('pend_listas').insert(novo); if (error) throw error; }
      { const { error } = await sb.from('pend_config').upsert({ obra: OBRA, pavimentos: pavs }); if (error) throw error; }
      await carregarServidor(); delete $('ovl').dataset.form; closeSheet(); toast('Listas salvas.');
    } catch (e) { $('lOk').disabled = false; $('lMsg').className = 'msg err'; $('lMsg').textContent = 'Não foi possível salvar: ' + (e.message || e); }
  };
}

/* ---------------- avisos (notificações neste aparelho) ---------------- */
const VAPID = (window.MAPA_CONFIG || {}).vapidPublica || '';
const b64u8 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function registroSW() { if (!('serviceWorker' in navigator)) return null; try { return await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 4000))]); } catch (e) { return null; } }
async function estadoAvisos() {
  if (!VAPID || !('Notification' in window) || !('PushManager' in window)) return { st: 'sem', reg: null };
  const reg = await registroSW(); if (!reg) return { st: 'sem', reg: null };
  const sub = await reg.pushManager.getSubscription().catch(() => null);
  return { st: sub ? 'ativo' : Notification.permission === 'denied' ? 'negado' : 'inativo', reg, sub };
}
async function marcarAvisos() { const e = await estadoAvisos(); $('bAvisos').textContent = e.st === 'ativo' ? '🔔 Avisos ligados' : '🔔 Avisos'; }
async function formAvisos() {
  const ios = window.AppObra && AppObra.ehIOS, inst = window.AppObra && AppObra.instalado();
  openSheet('Avisos neste aparelho', '<p class="muted" style="margin:0">Verificando…</p>', '<button class="btn ghost" id="avC" type="button">Fechar</button>');
  $('avC').onclick = closeSheet;
  const e = await estadoAvisos();
  const oque = cargo() === 'encarregado' ? 'quando houver pendência nova ou reprovada nas suas disciplinas, e um aviso diário das vencidas.'
    : cargo() === 'engenharia' ? 'quando uma pendência for marcada como corrigida, e um resumo diário (com as vencidas) às 8h.'
    : cargo() === 'seguranca' ? 'quando uma pendência de segurança for marcada como corrigida, e um aviso diário das vencidas de segurança.'
    : 'conforme o seu cargo nas pendências (peça ao administrador para definir o seu cargo).';
  let corpo = `<p style="margin:0">Você recebe um aviso ${oque}</p>`;
  if (ios && !inst) corpo += `<div class="aviso">No iPhone, os avisos só funcionam com o app na Tela de Início: no Safari, toque em <b>Compartilhar</b> (o quadrado com a seta) → <b>Adicionar à Tela de Início</b>. Depois abra o painel pelo ícone novo e ative os avisos aqui.</div>`;
  else if (e.st === 'sem') corpo += '<div class="aviso">Este navegador não aceita avisos. No Android e no computador, use o Chrome ou o Edge.</div>';
  else if (e.st === 'negado') corpo += '<div class="aviso">Os avisos estão bloqueados para este site. Libere nas configurações do navegador (ícone de cadeado ao lado do endereço → Notificações → Permitir) e volte aqui.</div>';
  else corpo += `<p style="margin:0"><b>Situação:</b> ${e.st === 'ativo' ? '<span class="pill st-fechada">ligados neste aparelho</span>' : '<span class="pill st-aberta">desligados neste aparelho</span>'}</p>`;
  if (!inst && !ios) corpo += '<p class="muted" style="margin:0">Dica: instale o painel como app (botão “Instalar app” no topo, ou menu do navegador → Instalar) para abrir direto pelo ícone.</p>';
  $('ovlB').innerHTML = corpo;
  const pode = e.st === 'ativo' || e.st === 'inativo';
  $('ovlF').innerHTML = `<span class="msg" id="avMsg"></span><button class="btn ghost" id="avC" type="button">Fechar</button>${pode && e.st === 'ativo' ? '<button class="btn ghost" id="avOff" type="button">Desligar</button><button class="btn" id="avTeste" type="button">Enviar teste</button>' : ''}${pode && e.st === 'inativo' ? '<button class="btn" id="avOn" type="button">Ligar avisos</button>' : ''}`;
  $('avC').onclick = closeSheet;
  const msg = (t, ok) => { $('avMsg').className = 'msg ' + (ok ? 'ok' : 'err'); $('avMsg').textContent = t; };
  if ($('avOn')) $('avOn').onclick = async () => {
    $('avOn').disabled = true;
    try {
      const perm = await Notification.requestPermission(); if (perm !== 'granted') { msg('Permissão não concedida.'); $('avOn').disabled = false; return; }
      const sub = await e.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u8(VAPID) });
      const j = sub.toJSON();
      const { error } = await sb.rpc('push_registrar', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent });
      if (error) { await sub.unsubscribe().catch(() => {}); throw error; }
      await marcarAvisos(); formAvisos(); toast('Avisos ligados neste aparelho.');
    } catch (err) { msg('Não foi possível ligar: ' + (err.message || err)); $('avOn').disabled = false; }
  };
  if ($('avOff')) $('avOff').onclick = async () => {
    try { if (e.sub) { await sb.rpc('push_remover', { p_endpoint: e.sub.endpoint }); await e.sub.unsubscribe(); } await marcarAvisos(); formAvisos(); toast('Avisos desligados neste aparelho.'); }
    catch (err) { msg('Não foi possível desligar: ' + (err.message || err)); }
  };
  if ($('avTeste')) $('avTeste').onclick = async () => {
    $('avTeste').disabled = true; msg('Enviando…', true);
    try {
      const { data: { session } } = await sb.auth.getSession();
      const C = window.MAPA_CONFIG || {}; const base = String(C.supabaseUrl || '').replace(/\/+$/, '').replace(/\/(rest|auth|storage)\/v1$/i, '');
      const r = await fetch(base + '/functions/v1/notificar', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C.supabaseAnonKey, Authorization: 'Bearer ' + (session && session.access_token) },
        body: JSON.stringify({ tipo: 'teste', site: location.href.replace(/[^/]*$/, '') + 'pendencias.html?obra=' + encodeURIComponent(OBRA) }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || ('a função respondeu ' + r.status + (r.status === 404 ? ' (a Edge Function "notificar" ainda não foi criada)' : '')));
      msg(j.enviados ? 'Teste enviado. O aviso deve chegar em alguns segundos.' : 'A função respondeu, mas nenhum aparelho seu está inscrito.', !!j.enviados);
    } catch (err) { msg(/Failed to fetch|NetworkError|Load failed/i.test(String(err.message || err)) && navigator.onLine
        ? 'A função "notificar" não respondeu: ela pode estar com erro ao iniciar. Veja os segredos e os Logs da função no Supabase.'
        : 'Falhou: ' + (err.message || err)); }
    $('avTeste').disabled = false;
  };
}

/* ======================= início ======================= */
(async function () {
  NV = await (window.NUVEM_PRONTA || Promise.resolve(null));
  if (!NV) { $('main').innerHTML = '<div class="vazio"><h3>Precisa do banco online</h3><p class="muted" style="margin:0">As pendências são compartilhadas pela equipe e precisam do Supabase configurado no config.js.</p></div>'; $('modeChip').textContent = 'Modo local'; return; }
  sb = NV.cliente; OBRA = NV.obraId;
  await carregarFila();
  let ok = false;
  if (navigator.onLine && !NV.offline) {
    try { await carregarServidor(); ok = true; }
    catch (e) {
      if (e.naoTem) { $('main').innerHTML = '<div class="vazio"><h3>Obra não encontrada</h3><p class="muted" style="margin:0">Esta obra não existe ou foi excluída.</p><a class="btn" href="index.html?ferramenta=pendencias" style="text-decoration:none">Ver as obras</a></div>'; return; }
      if (/pend_listas|pendencias|relation|schema cache/i.test(e.message || '')) { $('main').innerHTML = '<div class="vazio"><h3>Falta preparar o banco</h3><p class="muted" style="margin:0">Rode o arquivo <b>atualizacao-pendencias.sql</b> no Supabase (SQL Editor) e recarregue a página.</p></div>'; return; }
      console.warn(e);
    }
  }
  if (!ok) { const em = await carregarCache(); if (!em) { $('main').innerHTML = '<div class="vazio"><h3>Sem sinal e sem cópia neste aparelho</h3><p class="muted" style="margin:0">Abra esta obra uma vez com internet para poder usar sem sinal depois.</p></div>'; status(); return; }
    toast('Sem sinal: mostrando a cópia de ' + fmtDH(em) + '. O que você registrar será enviado depois.', 6000); }
  $('obraNome').textContent = OBRA_NOME; document.title = OBRA_NOME + ' · Pendências';
  if (NV.admin) { $('bListas').hidden = false; $('bListas').onclick = formListas; }
  $('bPdf').onclick = formRelatorio;
  $('bAvisos').onclick = formAvisos; marcarAvisos();
  $('fab').onclick = () => formPend(null);
  if (!NV.cargo && !NV.admin) toast('Você ainda não tem cargo nas pendências. Peça ao administrador para definir o seu cargo.', 7000);
  render();
  sincronizar();
  // veio de um aviso: abre a pendência direto
  const pAviso = new URLSearchParams(location.search).get('p');
  if (pAviso) { if (itens().some(x => x.id === pAviso)) detalhe(pAviso); else toast('Esta pendência não está mais disponível para você.'); history.replaceState(null, '', location.pathname + '?obra=' + encodeURIComponent(OBRA)); }
  // ao vivo: quando alguém muda uma pendência, a lista atualiza
  try { sb.channel('pend-' + OBRA)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pendencias', filter: 'obra=eq.' + OBRA }, recarregar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pendencia_eventos' }, recarregar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pendencia_fotos' }, recarregar).subscribe(); } catch (e) {}
  setInterval(() => { if (navigator.onLine) sincronizar(); }, 30000);
})();
})();
