<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pons Alerts</title>
<style>
  :root { --bg:#0b0e13; --card:#141923; --card2:#1a2030; --line:#232b3a; --text:#eef2f8; --muted:#8b95a9; --dim:#5d6678;
          --green:#2ecc71; --green-bg:#0f2a1c; --blue:#4c9dff; --blue-bg:#0f2340; --amber:#f0b03a; --amber-bg:#2c2110; --red:#ff5c5c; --red-bg:#2c1414; --grey:#6b7385; --grey-bg:#1c212c; --violet:#b48cff; --violet-bg:#241b3a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--bg); }
  body { margin:0; color:var(--text); font:15px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:14px 14px calc(30px + env(safe-area-inset-bottom)); max-width:720px; margin-inline:auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  h1 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.2px; }
  .upd { font-size:12px; color:var(--muted); }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 8px; text-align:center; }
  .tile .n { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
  .tile .l { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }
  .tile.g .n { color:var(--green); } .tile.a .n { color:var(--amber); } .tile.r .n { color:var(--red); } .tile.b .n { color:var(--blue); }
  details.rule { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; font-size:13px; color:var(--muted); margin-bottom:12px; }
  details.rule summary { cursor:pointer; color:var(--text); font-weight:600; font-size:13.5px; }
  details.rule p { margin:8px 0 2px; }
  .filters { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none; }
  .filters::-webkit-scrollbar { display:none; }
  .filters button { flex:none; background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; }
  .filters button.on { color:var(--text); background:var(--card2); border-color:var(--blue); }
  .card { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--grey); border-radius:14px; padding:12px 12px 10px; margin-bottom:10px; }
  .card.hit { border-left-color:var(--green); } .card.up { border-left-color:var(--blue); } .card.down { border-left-color:var(--amber); } .card.dead { border-left-color:var(--grey); opacity:.72; } .card.breakout { border-left-color:var(--violet); }
  .row1 { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .tick { font-size:19px; font-weight:800; }
  .tick small { font-weight:500; color:var(--muted); font-size:12px; margin-left:6px; }
  .badge { font-size:11px; font-weight:800; letter-spacing:.4px; padding:4px 9px; border-radius:999px; white-space:nowrap; }
  .b-hit { background:var(--green-bg); color:var(--green); } .b-up { background:var(--blue-bg); color:var(--blue); } .b-down { background:var(--amber-bg); color:var(--amber); } .b-dead { background:var(--grey-bg); color:var(--grey); } .b-exp { background:var(--grey-bg); color:var(--muted); } .b-none { background:var(--grey-bg); color:var(--dim); } .b-break { background:var(--violet-bg); color:var(--violet); }
  .row2 { display:grid; grid-template-columns:1fr 120px; gap:10px; align-items:center; margin-top:8px; }
  .big { font-size:30px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .big.pos { color:var(--green); } .big.neg { color:var(--red); } .big.flat { color:var(--text); }
  .big small { font-size:12px; color:var(--muted); font-weight:500; margin-left:6px; }
  .caps { font-size:12.5px; color:var(--muted); margin-top:3px; }
  svg.spark { width:120px; height:44px; display:block; }
  .bar { position:relative; height:8px; background:#222a38; border-radius:99px; margin:10px 0 4px; overflow:hidden; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; border-radius:99px; }
  .bar > b { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text); opacity:.5; }
  .barl { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
  .time { display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:8px; }
  .time b { color:var(--text); font-weight:600; }
  .watch { margin-top:8px; font-size:12.5px; padding:7px 9px; border-radius:8px; background:var(--violet-bg); color:#d9c9ff; }
  .watch.dim { background:var(--grey-bg); color:var(--muted); }
  .more { margin-top:8px; border-top:1px solid var(--line); padding-top:8px; font-size:12.5px; color:var(--muted); display:none; }
  .card.open .more { display:block; }
  .why span { display:inline-block; background:var(--card2); border-radius:6px; padding:2px 7px; margin:2px 4px 2px 0; color:var(--text); font-size:12px; }
  .links { display:flex; gap:8px; margin-top:8px; }
  .links a, .links button { flex:1; text-align:center; background:var(--card2); color:var(--text); text-decoration:none; border:1px solid var(--line); border-radius:9px; padding:8px 4px; font-size:13px; font-weight:600; }
  .chart { margin-top:10px; border-radius:10px; overflow:hidden; border:1px solid var(--line); aspect-ratio:1/1.05; }
  .chart iframe { width:100%; height:100%; border:0; }
  .foot { color:var(--dim); font-size:11.5px; margin-top:16px; line-height:1.5; }
  .warn { color:var(--amber); }
  .empty { color:var(--muted); padding:30px 0; text-align:center; }
  .tap { text-align:right; font-size:11px; color:var(--dim); margin-top:6px; }
  .rchip { font-size:10px; font-weight:800; letter-spacing:.4px; padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:2px; }
  .r-R1 { background:#14283f; color:#7fb8ff; } .r-R2 { background:#2a2412; color:#e7c46a; } .r-R3 { background:#241b3a; color:#c9a8ff; }
</style>
</head>
<body>
<header><h1>Pons alerts</h1><div class="upd" id="upd">loading…</div></header>
<div class="tiles" id="tiles"></div>
<details class="rule"><summary>What this is</summary><div id="rule"></div></details>
<div class="filters" id="filters"></div>
<div id="list"><div class="empty">loading…</div></div>
<div class="foot" id="foot"></div>
<script>
const SOURCES = ["alerts.json", "https://raw.githubusercontent.com/TechGain/pons-r1-dash/main/alerts.json", "https://api.github.com/repos/TechGain/pons-r1-dash/contents/alerts.json?ref=main"];
let data = null, filter = "ALL", opened = {}, charts = {};
const LA = "America/Los_Angeles";
const fmt = (ts) => ts ? new Date(ts * 1000).toLocaleString("en-US", { timeZone: LA, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—";
const money = (x) => x == null ? "—" : x >= 1e6 ? "$" + (x / 1e6).toFixed(2) + "M" : x >= 1e3 ? "$" + (x / 1e3).toFixed(0) + "k" : "$" + x.toFixed(0);
function ago(ts) { if (!ts) return ""; const s = Math.max(0, Date.now() / 1000 - ts); if (s < 90) return Math.round(s) + "s ago"; if (s < 5400) return Math.round(s / 60) + "m ago"; if (s < 172800) return (s / 3600).toFixed(1) + "h ago"; return (s / 86400).toFixed(1) + "d ago"; }
function left(ts) { const s = ts - Date.now() / 1000; if (s <= 0) return "passed"; if (s < 3600) return Math.round(s / 60) + " min"; return (s / 3600).toFixed(1) + " h"; }
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function load() {
  let payload = null, err = "";
  for (const src of SOURCES) {
    try {
      const r = await fetch(src + (src.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) { err = src + " " + r.status; continue; }
      const j = await r.json();
      payload = j.content ? JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))))) : j;
      if (payload && payload.alerts) break;
      payload = null;
    } catch (e) { err = src + " " + e; }
  }
  if (!payload) { document.getElementById("upd").textContent = "could not load data (" + err.slice(0, 60) + ")"; return; }
  if (!data || payload.generated_ts >= data.generated_ts) { data = payload; render(); }
}
function kind(x) {
  if (x.breakout) return "breakout";
  if (x.status === "TARGET HIT") return "hit";
  if (x.status === "NO ENTRY") return "none";
  if (x.status === "NOT BUYABLE") return "none";
  if (x.status === "EXPIRED") return "exp";
  if (x.dead) return "dead";
  return (x.mult ?? 1) >= 1 ? "up" : "down";
}
const LABEL = { hit: "3x HIT · SOLD", up: "OPEN · ABOVE ENTRY", down: "OPEN · BELOW ENTRY", dead: "OPEN · DEAD", exp: "EXPIRED · SOLD", none: "NO ENTRY", breakout: "BREAKOUT NOW" };
const BADGE = { hit: "b-hit", up: "b-up", down: "b-down", dead: "b-dead", exp: "b-exp", none: "b-none", breakout: "b-break" };
function render() {
  const a = data.alerts || [], s = data.summary || {};
  document.getElementById("upd").textContent = "updated " + ago(data.generated_ts);
  const wr = s.hit_rate == null ? "—" : Math.round(100 * s.hit_rate) + "%";
  const mk = s.mark_per_100 == null ? "—" : "$" + Math.round(s.mark_per_100);
  const alive = a.filter(x => x.status === "OPEN" && !x.dead).length;
  document.getElementById("tiles").innerHTML =
    `<div class="tile b"><div class="n">${alive}</div><div class="l">open · alive</div></div>
     <div class="tile g"><div class="n">${s.n_hit ?? 0}</div><div class="l">hit 3x</div></div>
     <div class="tile r"><div class="n">${s.n_dead ?? 0}</div><div class="l">dead</div></div>
     <div class="tile ${(s.mark_per_100 ?? 100) >= 100 ? "g" : "a"}"><div class="n">${mk}</div><div class="l">per $100 now</div></div>`;
  document.getElementById("rule").innerHTML = `<p><b>Rule.</b> ${esc(data.rule)}</p><p><b>Track record.</b> ${esc(data.history)}</p><p><b>Colors.</b> green = hit 3x (rule sold), blue = open and above entry, amber = open and below entry, grey = dead or expired, violet = a Track 7 breakout is happening right now (information, not a validated signal).</p><p>"per $100 now" marks every filled alert at its current price (3x hits counted at $300): ${s.n_r1} alerts of ${s.n_live} live crossings so far.</p>${s.by_rule ? `<p><b>By rule.</b> ` + Object.keys(s.by_rule).map(r => `${r}: ${s.by_rule[r].n} alerts, ${s.by_rule[r].n_fill} filled, ${s.by_rule[r].n_hit} hit 3x, $${Math.round(s.by_rule[r].mark)} per $100 now`).join(" · ") + `</p>` : ""}`;
  const counts = { ALL: a.length, R1: a.filter(x => (x.rules || []).includes("R1")).length, R2: a.filter(x => (x.rules || []).includes("R2")).length, R3: a.filter(x => (x.rules || []).includes("R3")).length, OPEN: a.filter(x => x.status === "OPEN" && !x.dead).length, "HIT 3X": a.filter(x => x.status === "TARGET HIT").length, BREAKOUT: a.filter(x => x.breakout).length, DEAD: a.filter(x => x.dead).length, OTHER: a.filter(x => ["EXPIRED", "NO ENTRY"].includes(x.status)).length };
  document.getElementById("filters").innerHTML = Object.keys(counts).map(k => `<button class="${filter === k ? "on" : ""}" onclick="filter='${k}';render()">${k.toLowerCase()} ${counts[k]}</button>`).join("");
  const sel = a.filter(x => filter === "ALL" || (filter === "R1" && (x.rules || []).includes("R1")) || (filter === "R2" && (x.rules || []).includes("R2")) || (filter === "R3" && (x.rules || []).includes("R3")) || (filter === "OPEN" && x.status === "OPEN" && !x.dead) || (filter === "HIT 3X" && x.status === "TARGET HIT") || (filter === "BREAKOUT" && x.breakout) || (filter === "DEAD" && x.dead) || (filter === "OTHER" && ["EXPIRED", "NO ENTRY"].includes(x.status)));
  const order = { breakout: 0, up: 1, down: 2, hit: 3, exp: 4, dead: 5, none: 6 };
  sel.sort((p, q) => (order[kind(p)] - order[kind(q)]) || (q.alert_ts - p.alert_ts));
  document.getElementById("list").innerHTML = sel.length ? sel.map(card).join("") : '<div class="empty">nothing here</div>';
  const stale = data.generated_ts && Date.now() / 1000 - data.generated_ts > 600;
  document.getElementById("foot").innerHTML = "Los Angeles time. Caps use the full 1B supply. Entry = the first trade 60 s after the alert; a lag over a few minutes means a different trade than the one under test. Tap a card for the reasons and links." + (stale ? ' <span class="warn">Data is over 10 minutes old: the publisher on the PC may be down.</span>' : "");
}
function spark(x) {
  const pts = (x.series || []).filter(p => p[1] != null);
  if (pts.length < 2) return "";
  const W = 120, H = 44, t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  const vals = pts.map(p => Math.log(Math.max(p[1], 1e-6)));
  const lo = Math.min(...vals, 0), hi = Math.max(...vals, Math.log(3.2));
  const X = (t) => (W - 2) * (t - t0) / Math.max(1, t1 - t0) + 1, Y = (v) => H - 3 - (H - 6) * (v - lo) / (hi - lo);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(Math.log(Math.max(p[1], 1e-6))).toFixed(1)).join(" ");
  const last = pts[pts.length - 1][1], col = last >= 1 ? "var(--green)" : "var(--red)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#3a4356" stroke-dasharray="2 3"/><line x1="0" x2="${W}" y1="${Y(Math.log(3)).toFixed(1)}" y2="${Y(Math.log(3)).toFixed(1)}" stroke="#2ecc7166" stroke-dasharray="2 3"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}
function card(x) {
  const k = kind(x), m = x.mult, id = x.token;
  const hit = x.status === "TARGET HIT";
  const big = hit ? `<div class="big pos">3.0x<small>sold · +$200 per $100</small></div>` : m == null ? `<div class="big flat">—</div>` : `<div class="big ${m >= 1.02 ? "pos" : m <= 0.98 ? "neg" : "flat"}">${m.toFixed(2)}x<small>vs entry</small></div>`;
  const prog = hit ? 1 : Math.max(0, Math.min(1, (m ?? 0) / 3));
  const barCol = k === "hit" ? "var(--green)" : (m ?? 1) >= 1 ? "var(--blue)" : "var(--amber)";
  const peak = hit ? ` · now ${m == null ? "—" : m.toFixed(2) + "x"} (after the sale)` : x.peak_mult == null ? "" : ` · peak ${x.peak_mult.toFixed(2)}x`;
  const when = x.status === "OPEN" ? `deadline in <b>${left(x.deadline_ts)}</b>` : x.status === "TARGET HIT" ? `<b>sold at 3x</b>` : x.status === "EXPIRED" ? `<b>sold at deadline</b>` : `no entry`;
  const watch = x.watch ? `<div class="watch ${x.breakout ? "" : "dim"}">${esc(x.watch)}</div>` : "";
  const why = (x.rules || []).includes("R3") ? [`dormant ${x.r3_dorm == null ? "?" : x.r3_dorm.toFixed(1)} d below 30 % of its high`, `jumped ${x.r3_jump == null ? "?" : x.r3_jump.toFixed(2)}x within 10 min`, `first-leg high ${money(x.ath_mcap)}`, `entry cap ${money(x.entry_mcap)}${(x.entry_mcap || 0) < 200000 ? " (under $200k)" : ""}`, `watcher noticed it ${x.r3_detect_lag == null ? "?" : Math.round(x.r3_detect_lag) + " s"} after the jump`, `pool depth ${money(x.depth_usd)}`] : [(x.rules || []).includes("R2") ? `slow burner: reached $100k ${x.slow_days == null ? "?" : x.slow_days.toFixed(1)} d after graduating` : `reached $100k ${x.slow_days == null ? "?" : (x.slow_days * 24).toFixed(1)} h after graduating`, `graduated in ${x.grad_min == null ? "?" : Math.round(x.grad_min)} min`, `launched ${x.launch_hour == null ? "?" : x.launch_hour + ":00"} LA`, `crossed $100k at ${money(x.cross_mcap)}`, `alert lag ${x.lag_s == null ? "?" : Math.round(x.lag_s) + " s"}`, `${x.prior_launches ?? "?"} prior launches by deployer`, `pool depth ${money(x.depth_usd)}`, `last trade ${x.idle_h == null ? "?" : x.idle_h < 1 ? Math.round(x.idle_h * 60) + " min ago" : x.idle_h.toFixed(1) + " h ago"}`];
  const chart = charts[id] ? `<div class="chart"><iframe src="https://dexscreener.com/robinhood/${id}?embed=1&theme=dark&info=0" loading="lazy"></iframe></div>` : "";
  return `<div class="card ${k} ${opened[id] ? "open" : ""}" onclick="toggle('${id}')">
    <div class="row1"><div class="tick">${esc(x.symbol || "?")}${(x.rules || []).map(r => `<span class="rchip r-${r}">${r}</span>`).join("")}<small>${ago(x.alert_ts)}</small></div><span class="badge ${BADGE[k]}">${LABEL[k]}</span></div>
    <div class="row2"><div>${big}<div class="caps">entry ${money(x.entry_mcap)} → now ${money(x.cur_mcap)}${peak}</div></div>${spark(x)}</div>
    <div class="bar"><i style="width:${(100 * prog).toFixed(1)}%;background:${barCol}"></i><b style="left:33.3%"></b></div>
    <div class="barl"><span>0</span><span>entry</span><span>3x target ${money(x.entry_mcap ? x.entry_mcap * 3 : null)}</span></div>
    <div class="time"><span>${x.status === "OPEN" ? esc(x.action) : ""}</span><span>${when}</span></div>
    ${watch}
    <div class="more"><div class="why">${why.map(w => "<span>" + esc(w) + "</span>").join("")}</div>
      <div>alert ${fmt(x.alert_ts)} · entry ${fmt(x.entry_ts)} · deadline ${fmt(x.deadline_ts)}</div>
      <div class="links" onclick="event.stopPropagation()"><a href="${x.dexscreener}" target="_blank" rel="noopener">Dexscreener</a><a href="${x.pons}" target="_blank" rel="noopener">Pons</a><button onclick="charts['${id}']=!charts['${id}'];render()">${charts[id] ? "hide chart" : "chart"}</button><button onclick="navigator.clipboard.writeText('${id}');this.textContent='copied'">copy</button></div>
      ${chart}</div>
    ${opened[id] ? "" : '<div class="tap">tap for details</div>'}
  </div>`;
}
function toggle(id) { opened[id] = !opened[id]; render(); }
load(); setInterval(load, 90000);
</script>
</body>
</html>
