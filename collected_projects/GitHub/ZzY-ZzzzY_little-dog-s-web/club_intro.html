<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小提琴社活动介绍</title>
<style>body{font-family:"Microsoft YaHei",sans-serif;background:#f3efff;color:#26234b;max-width:850px;margin:40px auto;padding:25px;line-height:1.9}article{background:white;padding:30px;border-radius:18px;box-shadow:0 8px 30px #33236d20}h1{color:#5b43c5}a{display:inline-block;background:#6244c8;color:white;text-decoration:none;padding:10px 18px;border-radius:22px}</style></head><body><article><h1>小提琴社：让每一段旋律都有回响</h1><p>小提琴社欢迎所有热爱音乐、希望尝试弦乐的同学。我们会通过入门指导、分组练习、合奏交流与校园演出，帮助成员逐步建立演奏兴趣和舞台信心。</p><p>社团活动不仅关注技巧，也重视伙伴之间的合作。大家可以分享喜欢的曲目、交流练习心得，并在集体排练中感受和声与节奏的魅力。</p><p>如果你想认识新的朋友，或者想给校园生活增添一段特别的旋律，欢迎加入我们！</p><a href="zhang-0302-work2.html">返回小提琴社招新网页</a></article></body></html>
