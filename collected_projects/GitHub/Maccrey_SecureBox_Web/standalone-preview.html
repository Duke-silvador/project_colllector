acity:1;animation:none!important}\n}\n";const APPJS="'use strict';\n\n(function () {\n  const menuButton = document.querySelector('.menu-toggle');\n  const nav = document.querySelector('.nav-links');\n  if (menuButton && nav) {\n    menuButton.addEventListener('click', () => {\n      const open = menuButton.getAttribute('aria-expanded') !== 'true';\n      menuButton.setAttribute('aria-expanded', String(open));\n      menuButton.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');\n      nav.classList.toggle('is-open', open);\n    });\n    nav.querySelectorAll('a').forEach(anchor => {\n      anchor.addEventListener('click', () => {\n        nav.classList.remove('is-open');\n        menuButton.setAttribute('aria-expanded', 'false');\n        menuButton.setAttribute('aria-label', '메뉴 열기');\n      });\n    });\n  }\n\n  let billing = 'monthly';\n  const monthButton = document.getElementById('monthly');\n  const yearButton = document.getElementById('yearly');\n  const seatInput = document.getElementById('seat-count');\n  const seatOutput = document.getElementById('seat-output');\n  const total = document.getElementById('total-price');\n  const note = document.getElementById('calc-note');\n\n  function renderPrice() {\n    const annual = billing === 'yearly';\n    const seats = seatInput ? Number(seatInput.value) : 5;\n    if (monthButton) {\n      monthButton.classList.toggle('active', !annual);\n      monthButton.setAttribute('aria-pressed', String(!annual));\n    }\n    if (yearButton) {\n      yearButton.classList.toggle('active', annual);\n      yearButton.setAttribute('aria-pressed', String(annual));\n    }\n    const t = document.getElementById('team-price');\n    const b = document.getElementById('business-price');\n    const tp = document.getElementById('team-period');\n    const bp = document.getElementById('business-period');\n    if (t) t.textContent = annual ? '$10' : '$12';\n    if (b) b.textContent = annual ? '$20' : '$24';\n    if (tp) tp.textContent = an aders.forEach((brand) => {\n    const finalGlyph = brand.querySelector('.brand-final-lock-glyph');\n    if (!finalGlyph) return;\n    const finishBrand = () => brand.classList.add('is-brand-final');\n    finalGlyph.addEventListener('animationend', (event) => {\n      if (event.animationName === 'brandFinalLockGlyph') finishBrand();\n    }, { once: true });\n    // animationend가 누락되는 환경에 대한 안전장치.\n    window.setTimeout(finishBrand, 7400);\n  });\n\n})();\n";const MEDIA={"usb-contract.webp":"data:image/webp;base64,UklGRv7EAABXRUJQVlA4IPLEAACQsQOdASqxA3YCPmEsk0akIqappdKbwTAMCWMzWOxM+h1JfmrBPlhp0xunJhYj3xL/mf6XaVxr82/pegRxn4j/QvZ33cP73jX7t/0vOj6i/9Xq6/63ru/pX+79hz+hf53z6vYR+9Hq+/dX1af/H+2Xvx/rP/K9hj+7/+P03fap9Fj+gf+L09Pab/qf/e/eH2wP//2enRPx1fHv6n/efmX6I/kX27+e/wX+e/4P+G/bv5gdI/bf/zehf8t/Ev7T/D/u//lfgvxN+d3/H/nfYR/Iv6R/qv77+5H+A5WwBP2H/8P+Y8nLY08Xekz/A/9v/Be+Xjy/xPUX/d3qnf5v/3/3Hr2/L/9j/7/9j7mX9t/4/9//KMmr7g7Qms/6nYYr8j/h4PY+AOGtPbvCvwOaArVKdOm+BzGoX0ij8P3yM/OueZ/9wQGi69jtkif5OMjuowWQiz7qEfL14oYSexGyc9O3cFZ8CadhQJUoynJGZPmL+jX9Kz1f/3kPInv/zFjKZUpVakpU5YM2oNzoJLcADwrzX9EGmUgdnlOLKFByj77kd9NZfriITYWw4/WVjhG5OiwV4n9uaFQ1sto7tvH97rFoncvkOqVKPx6n49i4Sh6P4FMj2wHD/7bGDlVENeNnbD4AtZkIkf6BpAto0Fs5m1OoNAonTlpJwt4oPCX+ru5wKTAhNIoEH0eHZYXf7qGkNj8y3vtNbQ0kZbakLmXAULRf8uJkCHBUl7iXi/6EW10lpp947GHr21JdEQM6D9iMCeP22B/hJ8VhkM8uNcdN2MpQ1WzgP+6NZ0bosgJDDRugKSPDhLAigOolSoM/AC0s5+t4fvBz3xYzEiTfThHjHl/U4vaX+Tt1ZEKA1AJantjMQQNMVBCu5dd/3enFyanDe6jDmjbXLEoqxU16Xs7ab45vkb5hPxnUS/3run4CLfm+nTiULEqdN/N8Us4tNLCSV2cl/GmFZRzXILFWyJ0NenxAQOPYg0fXrdDe5JO60aj0Y169q3iyEAUwtpSmw78JWYhweXUWuHK//+MKOposjrDlavqWeaOJ3ILuTN9GN+h5cv9D4ymzaFBdPssB+fFe+7s+cX4A/Hb0guphbcDp7w8UrNz89i7paBNVlQq6yRcK1Guqr3soVRCEbAb8fcm5ieVaUoSplsv/3Uh9WhngJz64dgIcNzBgzoyYuGvh13Hs0BsUgNbWE39dQVmiufrTX+fvJmBY3twIel7MgMJGbgJP+JMlycgcPShysW6r+F87EsMgEcDAHrFQQcsrcnpZSsEgxU9dRfIKvy2IpTDagkbb/O1MtmkAXwhcoEbjxgVo+gda886TJOVzj35lzAE2f+DPPTyadI/Xgoz58MZuzm9o4m7QqOAK/uxtoZpZ84FhPYAIQYDh34Jo8SmUljjthIUkPo8N31gn3AIw5oVxPlVE8I+X06HtzLpA+rYPCBCBWZdu6c  · 보안 첨부 준비</span><span class=\"toolbar-dots\">•••</span></div>\n<div class=\"app-body\">\n<div class=\"window-label\">보낼 문서</div>\n<div class=\"file-card initial\"><div class=\"file-icon pdf\">PDF</div><div class=\"file-details\"><strong>계약서_최종.pdf</strong><small>암호화 전 · 내 기기</small></div><span class=\"file-state\">원본</span></div>\n<div class=\"encrypt-progress\"><span class=\"progress-line\"></span><span class=\"progress-lock\">⌁</span><span class=\"progress-line\"></span></div>\n<div class=\"window-label\">이메일에 첨부할 파일</div>\n<div class=\"file-card protected\"><div class=\"file-icon sec\"><svg aria-hidden=\"true\" fill=\"none\" viewbox=\"0 0 24 24\"><rect height=\"10\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"1.8\" width=\"12\" x=\"6\" y=\"10\"></rect><path d=\"M8.5 10V7A3.5 3.5 0 0 1 15.5 7V10\" stroke=\"currentColor\" stroke-width=\"1.8\"></path></svg></div><div class=\"file-details\"><strong>securebox-6f23.sec</strong><small>암호화된 첨부파일</small></div><span class=\"file-state state-safe\">보호됨</span></div>\n<div class=\"secure-note\"><svg aria-hidden=\"true\" fill=\"none\" viewbox=\"0 0 24 24\"><path d=\"M12 2l9 4v6c0 5.7-4.1 8.5-9 10-4.9-1.5-9-4.3-9-10V6l9-4Z\" stroke=\"currentColor\" stroke-width=\"1.8\"></path><path d=\"m8 12 2.5 2.5L16 9\" stroke=\"currentColor\" stroke-width=\"1.8\"></path></svg><div><b>메일에는 암호문만</b><span>복호화 비밀은 별도 채널로 전달</span></div></div>\n</div>\n</div>\n<div class=\"float-pill float-top\"><span class=\"pill-icon\">✦</span> 로컬 암호화</div><div class=\"float-pill float-bottom\"><span class=\"pill-icon\">✓</span> 공유해도 내용은 보호</div>\n</div>\n</div>\n<div class=\"hero-bottom-line container\"><span>DESIGNED FOR PRIVACY</span><span class=\"line-fill\"></span><span>001 / SEND WITH CONFIDENCE</span></div>\n</section><section aria-label=\"제품 특징 요약\" class=\"trust-strip\"><div class=\"container trust-grid\"><div><span class=\"trust-icon\">◈</span><span>기본은 오프라인</span></div><div><span class=\"trust-icon\">▣</span><span>이메일 서비스 변경 불필요</span></div><div><span class=\"trust-icon\">⌘</span><span>플랫폼 간 동일한 .sec 포맷</span></div><div><span class=\"trust-icon\">◎</span><span>수신자는 무료 복호화</span></div></div></section><section class=\"incident-home\" aria-labelledby=\"home-incidents-heading\"><div class=\"container incident-home-layout\"><div><p class=\"section-kicker\">REAL CASES</p><h2 id=\"home-incidents-heading\">실제 사고 사례를 확인하고,<br/><span>파일을 미리 보호하세요.</span></h2><p>이메일 침해 약 25개 조직, USB에 담긴 아동 286명의 개인정보. 공식 자료에 근거한 실제 사례입니다.</p><a class=\"text-link\" href=\"./incidents.html\">실제 사고 사례 자세히 보기 →</a></div><div class=\"incident-home-figures\"><div><strong>약 25개 조직</strong><span>Microsoft 2023년 이메일 계정 침해 발표</span></div><div><strong>아동 286명</strong><span>영국 ICO USB 분실 사례</span></div><small>SecureBox가 당시 사용되었다는 뜻이 아닙니다.</small></div></div></section><section aria-labelledby=\"how-title\" class=\"section-pad section-white\" id=\"how\">\n<div class=\"container\"><div class=\"section-intro\"><div><p class=\"section-kicker\">01 / HOW IT WORKS</p><h2 id=\"how-title\">평소처럼 이메일을 보내세요.<br/><span class=\"subtle-heading\">파일을 잠그는 단계만 추가하면 됩니다.</span></h2></div><p>새로운 메일 서비스로 옮길 필요가 없습니다. SecureBox로 암호화 파일을 만든 뒤 평소 쓰는 이메일에 첨부하는 흐름입니다.</p></div>\n<div class=\"steps-grid\">\n<article class=\"step-card\"><div class=\"step-no\">01</div><div class=\"step-drawing\"><svg aria-hidden=\"true\" fill=\"none\" viewbox=\"0 0 128 90\"><rect height=\"66\" rx=\"10\" stroke=\"currentColor\" stroke-width=\"2\" width=\"68\" x=\"30\" y=\"12\"></rect><path d=\"M45 34h38M45 45h38M45 56h22\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"2.2\"></path><circle cx=\"96\" cy=\"65\" fill=\"#b9f8d6\" r=\"17\" stroke=\"#062d27\" stroke-width=\"2\"></circle><path d=\"M96 57v16m-8-8h16\" stroke=\"#062d27\" stroke-linecap=\"round\" stroke-width=\"2.5\"></path></svg></div><h3>파일 선택</h3><p>계약서 PDF나 폴더를 SecureBox에 추가합니다. 원본 파일은 그대로 유지됩니다.</p></article>\n<article class=\"step-card\"><div class=\"step-no\">02</div><div class=\"step-drawing\"><svg aria-hidden=\"true\" fill=\"none\" viewbox=\"0 0 128 90\"><path d=\"M30 26h68v52H30z\" stroke=\"currentColor\" stroke-width=\"2\"></path><rect fill=\"#b9f8d6\" height=\"25\" rx=\"5\" stroke=\"#062d27\" stroke-width=\"2\" width=\"30\" x=\"49\" y=\"41\"></rect><path d=\"M54 41v-7a10 10 0 0 1 20 0v7\" stroke=\"#062d27\" stroke-width=\"2\"></path><path d=\"M64 51v5\" stroke=\"#062d27\" stroke-linecap=\"round\" stroke-width=\"2.5\"></path><path d=\"M22 13h84\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-width=\"2\"></path></svg></div><h3>내 기기에서 암호화</h3><p>비밀번호 등으로 보호된 `.sec` 파일을 생성합니다. 원본을 서버에 업로드하지 않습니다.</p></article>\n<article class=\"step-card\"><div class=\"step-no\">03</div><div class=\"step-drawing\"><svg aria-hidden=\"true\" fill=\"none\" viewbox=\"0 0 128 90\"><rect height=\"53\" rx=\"8\" stroke=\"currentColor\" stroke-width=\"2\" width=\"90\" x=\"19\" y=\"20\"></rect><path d=\"m21 28 43 28 43-28\" stroke=\"currentColor\" stroke-width=\"2\"></path><circle cx=\"96\" cy=\"64\" fill=\"#b9f8d6\" r=\"18\" stroke=\"#062d27\" stroke-width=\"2\"></circle><path d=\"m88 64 6 6 11-12\" stroke=\"#062d27\" stroke-linecap=\"round\" stroke-width=\"2.5\"></path></svg></div><h3>암호문만 첨부</h3><p>메일에는 `.sec`만 넣고, 복호화 비밀은 전화 등 별도 채널로 전달합니다.</p></article>\n</div>\n</div>\n</section><section class=\"section-pad home-choice\"><div class=\"container\"><p class=\"section-kicker\">BUILT AROUND REAL MOMENTS</p><div class=\"section-intro\"><div><h2>더 안전하게 전달하는<br/>세 가지 순간.</h2></div><p>기능 목록보다 중요한 것은, 계약서를 보내는 순간 무엇이 달라지는지입니다.</p></div><div class=\"home-story-grid\"><a class=\"home-story\" href=\"./stories.html\"><img alt=\"비즈니스 파트너에게 암호화된 계약서를 보내는 만화 삽화\" loading=\"eager\" src=\"./assets/stories/email-partner.webp\"/><div><span>01 · 계약서</span><h3>이메일로 NDA를 보낼 때</h3><p>수신자는 무료로 열고, 보내는 사람은 암호화된 첨부파일을 준비합니다.</p><b>이야기 보러가기 ↗</b></div></a><a class=\"home-story\" href=\"./stories.html\"><img alt=\"스마트폰에서 보안 공유를 준비하는 만화 삽화\" loading=\"eager\" src=\"./assets/stories/messenger-share.webp\"/><div><span>02 · 협업</span><h3>메신저로 고객 자료를 보낼 때</h3><p>SecureBox에서 공유하면 원본 대신 보호된 .sec 파일을 만듭니다.</p><b>이야기 보러가기 ↗</b></div></a><a class=\"home-story\" href=\"./stories.html\"><img alt=\"등록 PC에서 보호된 모바일 파일 복구를 승인하는 만화 삽화\" loading=\"eager\" src=\"./assets/stories/pc-vault-only.webp\"/><div><span>03 · 분실 대비</span><h3>휴대폰을 놓고 왔을 때</h3><p>파일을 평소부터 암호화된 보관함에 보관하고, 분실하면 등록 PC에서 신규 키 접근을 차단합니다.</p><b>이야기 보러가기 ↗</b></div></a></div><div class=\"home-choice-cta\"><a class=\"btn btn-primary\" href=\"./features.html\">보안 기능 자세히 보기 →</a><a class=\"text-link\" href=\"./pricing.html\">무료와 유료 기능 비교 ↗</a></div></div></section><section class=\"section-pad home-offer\"><div class=\"container home-offer-grid\"><div><p class=\"section-kicker\">PLAN THAT FITS</p><h2>혼자 써도, 팀이 써도.<br/><span class=\"subtle-heading\">필요한 보호만 선택하세요.</span></h2><p>기본 암호화와 수신자의 복호화는 무료. 관리형 계약서 전송은 건별, 기업 보안 공유는 사용자별 구독으로 준비하고 있습니다.</p><a class=\"btn btn-primary\" href=\"./pricing.html\">요금제 비교하기 ↗</a></div><div class=\"home-offer-table\"><div><span>Personal</span><strong>무료</strong></div><div><span>Contract Pass</span><strong>$4.90 / 건</strong></div><div><span>Team</span><strong>$12 / 인·월</strong></div><div><span>Business</span><strong>$24 / 인·월</strong></div><small>출시 예정 기준가 · 세금 별도 · 현재 결제 불가</small></div></div></section><section class=\"closing-section\" id=\"launch-note\"><div class=\"container closing-content\"><div class=\"closing-kicker\"><span class=\"status-dot\"></span> IN DEVELOPMENT</div><h2>중요한 계약서를 보내는 순간,<br><span>한 단계 더 안전하게.</span></br></h2><p>SecureBox는 개인용 무료 앱과 계약서 보안 전송을 준비하고, 기업용 자동 보안 공유·상시 암호화 보관함·PC 원격 잠금·복호화 이력 조회·파일별 자물쇠·가입자 ID 보안 전송을 순차적으로 확장하고 있습니다.</p><div class=\"closing-actions\"><a class=\"btn btn-primary\" href=\"./features.html\">사용 방식 다시 보기 <span aria-hidden=\"true\">↗</span></a><a class=\"btn btn-secondary\" href=\"./pricing.html\">요금 계획 확인 <span aria-hidden=\"true\">→</span></a></div><p>SecureBox.sec 파일을 받으셨나요? <a href=\"./open-sec.html\">수신자용 파일 열기·설치 안내 보기 →</a></p><div class=\"release-badge\">현재 개발 중 · 앱 다운로드와 실제 결제는 아직 제공되지 않습니다.</div></div></section></main><footer class=\"footer\"><div class=\"container footer-grid\"><div><a class=\"brand footer-brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\"><svg fill=\"none\" viewbox=\"0 0 40 40\"><path d=\"M20 3L34 9V19C34 27.7 28.3 33 20 37C11.7 33 6 27.7 6 19V9L20 3Z\" stroke=\"currentColor\" stroke-width=\"2.8\"></path><rect height=\"8.5\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\" width=\"9\" x=\"15.5\" y=\"18\"></rect><path d=\"M17.5 18V15.8A2.5 2.5 0 0 1 22.5 15.8V18\" stroke=\"currentColor\" stroke-width=\"2\"></path></svg></span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><p>중요한 계약서를 보내는 순간부터.<br/>SecureBox가 파일 보호를 준비합니다.</p></div><div class=\"footer-links\"><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내·FAQ</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a href=\"./incidents.html\">실제 사고 사례</a></div><div class=\"footer-note\"><p>SecureBox는 개발 중인 제품입니다. 암호화 앱·결제·다운로드는 아직 제공되지 않으며, 표시된 기능과 요금은 출시 계획입니다.</p><p>© 2026 SecureBox · 제품명 가칭</p></div></div></footer></div></body></html>","features.html":"<!DOCTYPE html>\n<html lang=\"ko\"><head><meta charset=\"utf-8\"/><meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/><meta content=\"#071721\" name=\"theme-color\"/><meta content=\"SecureBox의 계약서 보호, USB·메신저 보안 공유, 관리자 승인, 모바일 폴더 보호 및 안전한 업데이트 계획을 알아보세요.\" name=\"description\"/><meta content=\"index, follow\" name=\"robots\"/><meta content=\"strict-origin-when-cross-origin\" name=\"referrer\"/><meta content=\"default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests\" http-equiv=\"Content-Security-Policy\"/><title>기능 안내 | SecureBox</title><link href=\"./favicon.ico?v=20261029-audit1\" rel=\"icon\" type=\"image/x-icon\"/><link href=\"./favicon.svg?v=20261029-audit1\" rel=\"icon\" type=\"image/svg+xml\" sizes=\"any\"/><link href=\"./styles.css\" rel=\"stylesheet\"/><script defer=\"\" src=\"./script.js\"><\/script></head><body><a class=\"skip-link\" href=\"#main\">본문 바로가기</a><div class=\"page-shell\"><header class=\"site-header\" id=\"top\"><div class=\"nav-wrap container\"><a aria-label=\"SecureBox 홈\" class=\"brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\"><svg fill=\"none\" viewbox=\"0 0 40 40\"><path d=\"M20 3L34 9V19C34 27.7 28.3 33 20 37C11.7 33 6 27.7 6 19V9L20 3Z\" stroke=\"currentColor\" stroke-width=\"2.8\"></path><rect height=\"8.5\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\" width=\"9\" x=\"15.5\" y=\"18\"></rect><path d=\"M17.5 18V15.8A2.5 2.5 0 0 1 22.5 15.8V18\" stroke=\"currentColor\" stroke-width=\"2\"></path></svg></span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><button aria-controls=\"nav-links\" aria-expanded=\"false\" aria-label=\"메뉴 열기\" class=\"menu-toggle\" type=\"button\"><span></span><span></span><span></span></button><nav aria-label=\"주 메뉴\" class=\"nav-links\" id=\"nav-links\"><a href=\"./index.html\">제품 소개</a><a aria-current=\"page\" href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a class=\"nav-cta\" href=\"./pricing.html\">요금제 비교 <span aria-hidden=\"true\">↗</span></a><a href=\"./incidents.html\">사고 사례</a></nav></div></header><main id=\"main\"><section class=\"subhero\"><div class=\"container\"><p class=\"section-kicker light-kicker\">FEATURES / FILES WITH CONFIDENCE</p><h1>파일을 보호하고,<br/><span>공유하는 방식까지.</span></h1><p>계약서 이메일 전송부터 USB·메신저·관리자 공동 승인·모바일 폴더 보호까지. SecureBox를 거쳐 보내는 파일을 암호화하도록 계획하고 있습니다.</p><p class=\"incident-content-link\">실제 사고가 궁금하신가요? <a href=\"./incidents.html\">공식 자료로 확인한 사례 →</a></p><div class=\"subhero-actions\"><a class=\"btn btn-primary\" href=\"./pricing.html\">내게 맞는 요금제 <span aria-hidden=\"true\">↗</span></a><a class=\"btn btn-secondary\" href=\"./stories.html\">활용 사례 보기 <span aria-hidden=\"true\">→</span></a></div></div></section><section aria-labelledby=\"features-title\" class=\"section-pad features-section\" id=\"features\"><div class=\"container\"><p class=\"section-kicker light-kicker\">04 / SECURITY, BY DESIGN</p><div class=\"section-intro features-intro\"><div><h2 id=\"features-title\">암호화만이 아니라,<br><span>접근하는 방식까지.</span></br></h2></div><p>개인은 간편하게, 기업은 더 엄격하게. 보안 수준과 관리 정책을 사용 환경에 맞춰 단계적으로 확장합니다.</p></div>\n<div class=\"feature-grid\">\n<article class=\"feature-tile big-feature\"><div class=\"feature-icon mint\">◇</div><div class=\"feature-text\"><span class=\"feature-label\">PERSONAL · MVP 계획</span><h3>파일은 내 컴퓨터에서<br/>암호화합니다.</h3><p>원본 계약서를 서버에 올리지 않고, 공유하기 전 `.sec`으로 보호합니다.</p></div><div class=\"feature-mini\"><span class=\"mini-bar\"></span><span class=\"mini-bar\"></span><span class=\"mini-bar active\"></span><span class=\"mini-bar\"></span><span>LOCAL FIRST</span></div></article>\n<article class=\"feature-tile\"><div class=\"feature-icon\">⌑</div><span class=\"feature-label\">PERSONAL · MVP 계획</span><h3>수신자는 무료로 열기</h3><p>Windows/macOS에서 비밀번호로 복호화. 모바일은 후속 버전에 지원할 예정입니다.</p></article>\n<article class=\"feature-tile\"><div class=\"feature-icon\">⇌</div><span class=\"feature-label\">TEAM · 기업용 계획</span><h3>사용자 + 관리자 2인 승인</h3><p>두 키가 모두 필요하도록 구성하고 서버에서 새로운 키 조각 발급을 통제합니다.</p></article>\n<article class=\"feature-tile\"><div class=\"feature-icon\">◷</div><span class=\"feature-label\">BUSINESS · 기업용 계획</span><h3>시간·횟수 정책</h3><p>관리자가 승인 가능 기간을 설정하고, 승인 만료 후 신규 키 발급을 제한합니다.</p></article>\n<article class=\"feature-tile\"><div class=\"feature-icon\">▣</div><span class=\"feature-label\">TEAM / BUSINESS · 제공 예정</span><h3>팀 보안 관리<br/>한곳에서 확인</h3><p>관리자가 수신자와 승인 가능 시간을 설정하고, 요청·승인 이력과 기기 슬롯을 한 화면에서 확인하도록 준비합니다.</p><a class=\"feature-inline-link\" href=\"./features.html#feature-deep\">업무에 어떻게 쓰이나요? <span aria-hidden=\"true\">↗</span></a></article>\n<article class=\"feature-tile\"><div class=\"feature-icon\">⌁</div><span class=\"feature-label\">BUSINESS · 지원 예정</span><h3>상시 암호화 보관함·PC 원격 잠금</h3><p>업무 파일은 평소부터 암호화 보관함에 저장합니다. 분실 시 등록 PC에서 원격 잠금으로 신규 키 접근을 차단합니다.</p><a class=\"feature-inline-link\" href=\"./features.html#lost-device-details\">보호 범위 확인 <span aria-hidden=\"true\">↗</span></a></article>\n</div>\n</div></section><section aria-labelledby=\"detail-title\" class=\"section-pad detail-section\" id=\"feature-deep\">\n<div class=\"container\">\n<div class=\"section-intro\"><div><p class=\"section-kicker\">05 / FEATURES IN PRACTICE</p><h2 id=\"detail-title\">언제, 어떻게,<br/><span class=\"subtle-heading\">무엇을 보호할까요?</span></h2></div><p>사용 방법과 보안 범위를 명확히 안내합니다. 항상 암호화 정책은 SecureBox가 수행하는 내보내기와 공유에만 적용됩니다. 기업 관리 PC의 시스템 전체 반출 통제는 별도 보안 제품과 장치 관리 정책이 필요합니다.</p></div>\n<div class=\"detail-grid\">\n<article class=\"detail-card\" id=\"secure-id-transfer\"><div class=\"detail-icon\">⇄</div><div class=\"detail-status\">Team · Business · 출시 예정</div><h3>가입자 ID로 보안 파일 보내기</h3><p>이메일 주소 대신 SecureBox 가입자 ID를 확인하고 암호화 파일을 전달합니다. 받는 사람에게 모바일·PC 알림을 보내고 앱의 받은 파일함에서도 확인할 수 있도록 준비합니다.</p><p class=\"detail-limit\">Android/iOS의 백그라운드 알림은 OS·네트워크 환경에 따라 지연되거나 전달되지 않을 수 있습니다. 앱을 다시 열면 서버 목록을 동기화합니다.</p></article><article class=\"detail-card\" id=\"file-access-control\"><div class=\"detail-icon\">▣</div><div class=\"detail-status\">Team · Business · 출시 예정</div><h3>파일별 자물쇠, 검색과 일괄 차단</h3><p>관리 이력에서 파일을 검색하고 여러 건을 선택해 복호화 허용·비허용을 한 번에 변경합니다. 발신자가 앞으로의 키 발급을 제한하도록 설계합니다.</p><p class=\"detail-limit\">이미 복호화했거나 수신자가 확보한 평문은 회수할 수 없습니다. 사용 권한·관리자 승인 정책은 계속 적용됩니다.</p></article><article class=\"detail-card\" id=\"filename-rule\"><div class=\"detail-icon\">▤</div><div class=\"detail-status\">전체 플랫폼 · 구현 예정</div><h3>익숙한 이름의 암호화 파일</h3><p>예를 들어 SecureBox.md를 암호화하면 SecureBox.sec로 저장합니다. 복호화할 때 원래 파일 이름과 확장자를 복원합니다.</p><p class=\"detail-limit\">이름이 겹치면 덮어쓰지 않고 확인하며 파일 이름의 일부가 노출될 수 있습니다. 보다 엄격한 익명 이름 옵션도 제공할 계획입니다.</p></article><article class=\"detail-card\" id=\"receiver-install\"><div class=\"detail-icon\">↓</div><div class=\"detail-status\">Personal 무료 복호화 · 구현 예정</div><h3>받은 .sec 파일 열기와 무료 설치 안내</h3><p>수신자에게 SecureBox가 없다면 .sec 파일과 함께 공식 설치 안내 링크를 전달하도록 준비합니다. 설치한 사용자는 암호화 파일을 SecureBox로 열어 비밀번호 기반 파일을 무료로 복호화할 수 있습니다.</p><p><a href=\"./open-sec.html\">SEC 파일 열기·설치 안내 보기 →</a></p><p class=\"detail-limit\">아직 앱과 설치 파일은 출시 전입니다. .sec를 더블클릭하는 동작만으로 미설치 기기에 앱 설치 화면을 자동으로 띄울 수는 없으며, 관리형 파일은 추가 승인 정책이 적용됩니다.</p></article><article class=\"detail-card\" id=\"decryption-history\"><div class=\"detail-icon\">▤</div><div class=\"detail-status\">Team · Business · 제공 예정</div><h3>복호화 이력, PC·모바일에서 확인</h3><p>누가 어떤 보호 파일에 접근했는지, 언제 복호화 요청이 있었는지 PC와 모바일 SecureBox에서 확인하도록 준비하고 있습니다. 내 이력과 권한에 맞는 조직 관리 이력을 구분하며 요청·승인·완료·실패를 쉽게 살펴볼 수 있습니다.</p><p class=\"detail-limit\">기업 관리형 복호화의 이력은 온라인 연결이 필요하며, 무료 개인용 오프라인 복호화는 서버 감사 기록을 제공하지 않습니다. 기능은 출시 전 기획입니다.</p></article><article class=\"detail-card\" id=\"safe-updates\"><div class=\"detail-icon\">↻</div><div class=\"detail-status\">4개 운영체제 · 순차 제공 예정</div><h3>안전한 최신 버전 안내</h3><p>Windows와 macOS는 서명된 업데이트를 확인하고, Android와 iOS는 공식 앱 스토어 업데이트를 이용합니다.</p><ol><li>새 버전 및 보안 중요도 확인</li><li>배포처와 무결성 검사</li><li>진행 중인 암호화 작업 종료 후 적용</li><li>기존 .sec 파일·키 및 설정 호환성 유지</li></ol><p class=\"detail-limit\">업데이트는 사용자의 네트워크·설정·스토어 정책에 따라 지연될 수 있습니다. 모바일 앱을 몰래 강제 설치하거나 저장된 원본 파일을 삭제하지 않습니다.</p></article><article class=\"detail-card\"><div class=\"detail-icon\">⌁</div><div class=\"detail-status\">Team · Business · 제공 예정</div><h3>USB 보안 내보내기</h3><p>외부 회의에 계약서를 가져갈 때, SecureBox에서 USB를 내보내기 대상으로 선택하면 암호화가 끝난 `.sec`만 저장합니다.</p><ol><li>파일 선택</li><li>수신자의 복호화 방식·키 확인</li><li>암호화와 무결성 확인</li><li>USB에 암호문만 저장</li></ol><p class=\"detail-limit\">암호화 실패·취소는 내보내기를 차단합니다. 개인 PC의 모든 USB 복사까지 강제하지는 않습니다.</p></article>\n<article class=\"detail-card\"><div class=\"detail-icon\">↗</div><div class=\"detail-status\">Team · Business · 제공 예정</div><h3>카카오톡·SNS·메일 보안 공유</h3><p>직원이 계약서나 고객 자료를 보낼 때 SecureBox를 통해 먼저 암호화하고, 지원되는 공유 대상에는 `.sec`만 전달합니다.</p><ol><li>SecureBox 보안 공유 실행</li><li>암호화와 파일 검증</li><li>사용할 메신저 선택</li><li>암호문 첨부 또는 사용자 직접 첨부</li></ol><p class=\"detail-limit\">카카오톡 PC는 공식 자동 첨부 API가 확인되지 않아 완성된 `.sec` 파일을 사용자가 직접 첨부합니다.</p></article>\n<article class=\"detail-card\"><div class=\"detail-icon\">✉</div><div class=\"detail-status\">Personal 무료 · Contract Pass $4.90</div><h3>계약서 이메일 보호</h3><p>외부 거래처에 NDA·계약서를 보낼 때 기본 암호화는 무료이며, 수신자 인증과 온라인 접근 기간 관리는 건별 관리형 전송으로 선택합니다.</p><ol><li>PDF 또는 문서 선택</li><li>무료 비밀번호 / 유료 관리형 전송 선택</li><li>`.sec` 파일 첨부</li><li>수신자는 무료로 복호화</li></ol><p class=\"detail-limit\">비밀번호는 별도 확인된 채널로 전달합니다. 계약서의 법적 전자서명을 대신하지 않습니다.</p></article>\n<article class=\"detail-card\"><div class=\"detail-icon\">♧</div><div class=\"detail-status\">Team · Business · 제공 예정</div><h3>관리자 공동 승인·접근 시간</h3><p>인사 문서나 영업 비밀을 열 때 사용자 키와 관리자 키가 모두 필요한 공동 승인 정책을 적용합니다.</p><ol><li>권한 있는 직원이 복호화 요청</li><li>관리자 MFA·승인</li><li>서버 기준 승인 가능 시간 검증</li><li>허가된 새 키 조각 발급</li></ol><p class=\"detail-limit\">만료는 새 키 발급을 제한하며 이미 받은 평문 파일을 회수할 수는 없습니다. 기업용 신규 복호화는 온라인 필수입니다.</p></article>\n<article class=\"detail-card\"><div class=\"detail-icon\">▣</div><div class=\"detail-status\">Team / Business · 제공 예정</div><h3>중복 로그인 방지·기기 슬롯</h3><p>계정을 다른 사람과 공유해 여러 장치에서 쓰지 않도록 활성 기기를 제한합니다.</p><ol><li>직원 계정 로그인 및 MFA</li><li>활성 구독·좌석·기기 종류 확인</li><li>Team 총 1대 / Business PC 1대 + 모바일 1대</li><li>기기 변경 시 세션 이전 후 기존 세션 해제</li></ol><p class=\"detail-limit\">기업용 자동 공유는 온라인 세션 확인이 실패하면 거부합니다. 무료 수동 암호화는 영향을 받지 않습니다.</p></article>\n<article class=\"detail-card\"><div class=\"detail-icon\">◎</div><div class=\"detail-status\">모바일 · 단계적 제공 예정</div><h3>생체 인증 보호 키·모바일 공유</h3><p>스마트폰에서 이메일로 받은 `.sec`을 열거나 USB-C 저장소로 보내는 순간 보호 키 사용에 생체 인증을 연결합니다.</p><ol><li>파일 앱/공유 메뉴에서 SecureBox 선택</li><li>키 사용 시 지문·Face ID 인증</li><li>암호화 검증 후 `.sec` 생성</li><li>지원 USB 또는 메일/메신저로 내보내기</li></ol><p class=\"detail-limit\">생체 인증은 단말 보호 수단이며 기업 관리자 온라인 승인을 대신하지 않습니다. 장치·OS 지원 범위를 검증해야 합니다.</p></article>\n<article class=\"detail-card\" id=\"lost-device-details\"><div class=\"detail-icon\">⌁</div><div class=\"detail-status\">Business · 개발 예정 · 분실 보호</div><h3>상시 암호화 보관함 + PC 원격 잠금</h3><p>중요 파일은 SecureBox 보관함으로 가져올 때 암호화합니다. 평소에는 생체 인증과 짧은 온라인 세션으로 열람하고, 분실 시 등록 Windows/macOS PC에서 원격 잠금을 요청해 신규 복호화 키 접근을 서버에서 차단합니다.</p><ol><li>모바일에서 파일을 보호 보관함으로 가져와 암호화</li><li>생체 인증과 온라인 승인으로 제한된 열람</li><li>PC 서명 키 및 MFA로 분실 잠금 요청</li><li>분실 잠금 해제는 등록 PC 서명·MFA·관리자 승인 필수</li></ol><p class=\"detail-limit\">오프라인 휴대폰에서도 저장된 암호문은 보호되지만 이미 발급된 단기 키·열어 둔 평문과 외부 복사본까지 즉시 회수할 수는 없습니다. 앱 밖 폴더와 휴대폰 전체를 강제로 잠그거나 완전 삭제하는 기능이 아닙니다.</p></article>\n</div>\n</div>\n</section><section class=\"page-end-cta\"><div class=\"container\"><h2>어떤 기능이 내게 필요할까요?</h2><p>무료 파일 암호화부터 기업용 보안 관리까지 확인하세요.</p><a class=\"btn btn-primary\" href=\"./pricing.html\">요금제 자세히 보기 ↗</a></div></section></main><footer class=\"footer\"><div class=\"container footer-grid\"><div><a class=\"brand footer-brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\"><svg fill=\"none\" viewbox=\"0 0 40 40\"><path d=\"M20 3L34 9V19C34 27.7 28.3 33 20 37C11.7 33 6 27.7 6 19V9L20 3Z\" stroke=\"currentColor\" stroke-width=\"2.8\"></path><rect height=\"8.5\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\" width=\"9\" x=\"15.5\" y=\"18\"></rect><path d=\"M17.5 18V15.8A2.5 2.5 0 0 1 22.5 15.8V18\" stroke=\"currentColor\" stroke-width=\"2\"></path></svg></span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><p>중요한 계약서를 보내는 순간부터.<br/>SecureBox가 파일 보호를 준비합니다.</p></div><div class=\"footer-links\"><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내·FAQ</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a href=\"./incidents.html\">실제 사고 사례</a></div><div class=\"footer-note\"><p>SecureBox는 개발 중인 제품입니다. 암호화 앱·결제·다운로드는 아직 제공되지 않으며, 표시된 기능과 요금은 출시 계획입니다.</p><p>© 2026 SecureBox · 제품명 가칭</p></div></div></footer></div></body></html>","stories.html":"<!DOCTYPE html>\n<html lang=\"ko\"><head><meta charset=\"utf-8\"/><meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/><meta content=\"#071721\" name=\"theme-color\"/><meta content=\"계약서 이메일, 카카오톡 공유, USB 분실, 스마트폰 중요 폴더 보호를 설명하는 SecureBox의 열 가지 만화 사용 사례.\" name=\"description\"/><meta content=\"index, follow\" name=\"robots\"/><meta content=\"strict-origin-when-cross-origin\" name=\"referrer\"/><meta content=\"default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests\" http-equiv=\"Content-Security-Policy\"/><title>활용 사례 만화 | SecureBox</title><link href=\"./favicon.ico?v=20261029-audit1\" rel=\"icon\" type=\"image/x-icon\"/><link href=\"./favicon.svg?v=20261029-audit1\" rel=\"icon\" type=\"image/svg+xml\" sizes=\"any\"/><link href=\"./styles.css\" rel=\"stylesheet\"/><script defer=\"\" src=\"./script.js\"><\/script></head><body><a class=\"skip-link\" href=\"#main\">본문 바로가기</a><div class=\"page-shell\"><header class=\"site-header\" id=\"top\"><div class=\"nav-wrap container\"><a aria-label=\"SecureBox 홈\" class=\"brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\"><svg fill=\"none\" viewbox=\"0 0 40 40\"><path d=\"M20 3L34 9V19C34 27.7 28.3 33 20 37C11.7 33 6 27.7 6 19V9L20 3Z\" stroke=\"currentColor\" stroke-width=\"2.8\"></path><rect height=\"8.5\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\" width=\"9\" x=\"15.5\" y=\"18\"></rect><path d=\"M17.5 18V15.8A2.5 2.5 0 0 1 22.5 15.8V18\" stroke=\"currentColor\" stroke-width=\"2\"></path></svg></span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><button aria-controls=\"nav-links\" aria-expanded=\"false\" aria-label=\"메뉴 열기\" class=\"menu-toggle\" type=\"button\"><span></span><span></span><span></span></button><nav aria-label=\"주 메뉴\" class=\"nav-links\" id=\"nav-links\"><a href=\"./index.html\">제품 소개</a><a href=\"./features.html\">주요 기능</a><a aria-current=\"page\" href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a class=\"nav-cta\" href=\"./pricing.html\">요금제 비교 <span aria-hidden=\"true\">↗</span></a><a href=\"./incidents.html\">사고 사례</a></nav></div></header><main id=\"main\"><section class=\"subhero\"><div class=\"container\"><p class=\"section-kicker light-kicker\">STORIES / REAL LIFE</p><h1>소중한 파일을 보내야 하는<br/><span>열 가지 순간.</span></h1><p>글자 없는 삽화와 별도의 대사·설명 컨테이너로 실제 사용 상황을 쉽게 살펴보세요. 모두 개발 중인 기능의 가상 시나리오입니다.</p><div class=\"subhero-actions\"><a class=\"btn btn-primary\" href=\"./pricing.html\">내게 맞는 요금제 <span aria-hidden=\"true\">↗</span></a><a class=\"btn btn-secondary\" href=\"./stories.html\">활용 사례 보기 <span aria-hidden=\"true\">→</span></a></div></div></section><section aria-labelledby=\"stories-title\" class=\"section-pad comic-section\" id=\"stories\">\n<div class=\"container\">\n<div class=\"comic-header\"><div><p class=\"section-kicker\">03 / REAL LIFE, SECURELY SHARED</p><h2 id=\"stories-title\">이럴 때 필요한 SecureBox.<br><span class=\"subtle-heading\">10편의 만화로 쉽게 살펴보세요.</span></br></h2></div><p>학생의 과제부터 직장인의 견적서, 사업가의 계약서까지. 누구나 겪을 만한 가상 시나리오 예시입니다. <a href=\"./incidents.html\">실제 이메일·USB 사고</a>도 공식 자료로 확인해 보세요. 소개한 기능은 단계별 출시 예정이며 아직 실제 앱으로 제공되지 않습니다.</p></div>\n<div class=\"comic-toolbar\"><div aria-label=\"만화 에피소드 대상 선택\" class=\"comic-filter\" role=\"group\"><button aria-pressed=\"true\" class=\"is-active\" data-story-filter=\"all\" type=\"button\">전체 이야기</button><button aria-pressed=\"false\" data-story-filter=\"personal\" type=\"button\">개인·학생</button><button aria-pressed=\"false\" data-story-filter=\"team\" type=\"button\">직장인·팀</button><button aria-pressed=\"false\" data-story-filter=\"business\" type=\"button\">사업가</button></div><p aria-live=\"polite\" id=\"comic-result\">10개의 이야기를 보여드립니다.</p></div>\n<div class=\"comics-grid\">\n<article class=\"comic-episode\" data-audience=\"team business\">\n<div class=\"comic-episode-top\"><span>EPISODE 01</span><span class=\"comic-plan\">TEAM / BUSINESS</span></div>\n<div class=\"comic-art\"><img alt=\"직장인이 계약서를 든 USB를 걱정하다가 잠긴 SEC 파일로 보관하는 만화 삽화\" decoding=\"sync\" height=\"208\" loading=\"eager\" src=\"./assets/stories/usb-contract.webp\" width=\"315\"/></div>\n<div class=\"comic-copy\"><h3>계약서 USB 반출</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"중요한 계약서를 USB로 가져가야 하는데, 분실하면 어떡하죠?\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"SecureBox의 USB 보안 내보내기로 먼저 .sec을 만들어요.\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 달라집니다</strong><p>USB에는 암호문만 저장 · 앱을 거친 내보내기에 적용</p></div><p class=\"comic-caveat\">※ 일반 탐색기·Finder에서 원본을 직접 복사하는 행동까지 막는 기능은 아닙니다.</p></div>\n</article>\n<article class=\"comic-episode\" data-audience=\"team business\">\n<div class=\"comic-episode-top\"><span>EPISODE 02</span><span class=\"comic-plan\">TEAM / BUSINESS</span></div>\n<div class=\"comic-art\"><img alt=\"직장인이 카카오톡으로 보낼 파일을 잠긴 SEC 파일로 준비하는 만화 삽화\" decoding=\"sync\" height=\"208\" loading=\"eager\" src=\"./assets/stories/messenger-share.webp\" width=\"315\"/></div>\n<div class=\"comic-copy\"><h3>카카오톡·메신저 공유</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"거래처에서 지금 카카오톡으로 견적서를 보내 달래요!\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"SecureBox를 통해 암호화한 .sec 파일을 채팅에 첨부해요.\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 달라집니다</strong><p>원본 대신 .sec 준비 · 메신저와 SNS로 보안 공유</p></div><p class=\"comic-caveat\">※ 카카오톡 PC 직접 자동 첨부는 보장하지 않으며 SecureBox 밖의 직접 첨부는 차단할 수 없습니다.</p></div>\n</article>\n<article class=\"comic-episode\" data-audience=\"personal business\">\n<div class=\"comic-episode-top\"><span>EPISODE 03</span><span class=\"comic-plan\">PERSONAL / CONTRACT PASS</span></div>\n<div class=\"comic-art\"><img alt=\"사업가가 이메일로 계약서를 보내기 전에 잠긴 SEC 첨부파일을 만드는 만화 삽화\" decoding=\"sync\" height=\"208\" loading=\"eager\" src=\"./assets/stories/email-partner.webp\" width=\"315\"/></div>\n<div class=\"comic-copy\"><h3>이메일로 NDA 보내기</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"외부 거래처에 NDA를 보내야 하는데 메일이 털리면?\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"개인은 무료 암호화, 추가 보호는 수신자 인증이 있는 Contract Pass!\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 달라집니다</strong><p>기본 암호화 무료 · 관리형 계약서 전송 $4.90/건 · <a href=\"./open-sec.html\">수신자 앱 설치 안내</a></p></div><p class=\"comic-caveat\">※ 복호화 비밀번호는 같은 이메일로 전송하지 않습니다. 이메일 제목·수신자 정보는 암호화되지 않습니다.</p></div>\n</article>\n<article class=\"comic-episode\" data-audience=\"team business\">\n<div class=\"comic-episode-top\"><span>EPISODE 04</span><span class=\"comic-plan\">TEAM / BUSINESS</span></div>\n<div class=\"comic-art\"><img alt=\"USB 메모리를 잃어버린 사람과 잠긴 SEC 암호화 파일을 묘사한 만화 삽화\" decoding=\"sync\" height=\"208\" loading=\"eager\" src=\"./assets/stories/lost-usb.webp\" width=\"315\"/></div>\n<div class=\"comic-copy\"><h3>USB 메모리를 잃어버렸다면</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"자료가 담긴 USB를 잃어버렸어요!\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"미리 .sec으로 보호했다면, 파일만 가져간 사람은 내용을 볼 수 없게 설계돼요.\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 달라집니다</strong><p>암호화 파일 탈취에 대비 · 강한 비밀번호/키 별도 관리</p></div><p class=\"comic-caveat\">※ USB와 복호화 키가 함께 유출되거나 수신자 기기가 해킹되면 보호가 제한됩니다.</p></div>\n</article>\n<article class=\"comic-episode\" data-audience=\"business\">\n<div class=\"comic-episode-top\"><span>EPISODE 05</span><span class=\"comic-plan\">BUSINESS</span></div>\n<div class=\"comic-art\"><img alt=\"직장인이 노트북과 스마트폰을 함께 사용하면서 보호 키를 확인하는 만화 삽화\" decoding=\"sync\" height=\"208\" loading=\"eager\" src=\"./assets/stories/business-devices.webp\" width=\"315\"/></div>\n<div class=\"comic-copy\"><h3>사무실 PC와 현장 모바일</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"계약서는 회사 PC에서도, 이동 중 휴대폰에서도 확인해야 해요.\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"Business는 PC 1대 + 모바일 1대, 새 기기 등록은 본인 확인 후 이전해요.\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 달라집니다</strong><p>Business 기기 슬롯 1+1 · 보호된 키 사용 시 생체 인증</p></div><p class=\"comic-caveat\">※ Team은 PC 또는 모바일 1대만, Business에서 같은 종류 기기 2대 동시 로그인은 허용하지 않습니다.</p></div>\n</article>\n<article class=\"comic-episode\" data-audience=\"business\">\n<div class=\"comic-episode-top\"><span>EPISODE 06</span><span class=\"comic-plan\">BUSINESS · 분실 대비</span></div>\n<div class=\"comic-art comic-art-triptych\"><img alt=\"글자 없는 3컷 만화. 휴대폰을 잃은 직원, 회사 PC에서 보안 상태 확인, 이미 암호화된 보호 폴더\" decoding=\"sync\" height=\"400\" loading=\"eager\" src=\"./assets/stories/lost-phone-lock.webp\" width=\"1800\"/></div>\n<div class=\"comic-copy\"><h3>휴대폰을 잃어버렸다면?</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"업무용 휴대폰을 잃어버렸어요. 계약서가 들어 있는데 어떡하죠?\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"계약서는 평소부터 암호화 보관함에 보관하고, 분실 시 등록 PC에서 원격 잠금으로 새 키 접근을 차단해요.\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 대응합니다</strong><p>상시 암호화 보관함 · PC 원격 잠금 · 신규 키 접근 차단</p></div><p class=\"comic-caveat\">※ 휴대폰이 오프라인이어도 보관함 암호문은 유지되지만 이미 열린 평문과 발급된 키는 즉시 회수할 수 없어요.</p></div>\n</article>\n<article class=\"comic-episode\" data-audience=\"business\">\n<div class=\"comic-episode-top\"><span>EPISODE 07</span><span class=\"comic-plan\">BUSINESS · PC 전용 복구</span></div>\n<div class=\"comic-art\"><img alt=\"글자 없는 그림. 직원이 등록 PC의 보안 키를 확인하고 암호화된 모바일 문서를 복원하는 장면\" decoding=\"sync\" height=\"630\" loading=\"eager\" src=\"./assets/stories/pc-vault-only.webp\" width=\"945\"/></div>\n<div class=\"comic-copy\"><h3>상시 암호화 보관함과 PC 전용 잠금 해제</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"계약서 폴더를 휴대폰에 보관해야 하는데 주운 사람이 보면 안 돼요.\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"파일을 미리 암호화 보관함에 가져와요. 평소 생체 인증으로 열람하지만 분실 잠금 해제는 등록 PC와 관리자 승인이 필요해요.\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 보호합니다</strong><p>상시 암호화 → 제한된 모바일 열람 → PC 원격 잠금 → 관리자 승인 후 PC에서 잠금 해제</p></div><p class=\"comic-caveat\">※ 이미 복사된 평문과 클라우드 사본은 회수할 수 없고 원본 완전 삭제도 보장하지 않습니다.</p></div>\n</article>\n<article class=\"comic-episode\" data-audience=\"team business\">\n<div class=\"comic-episode-top\"><span>EPISODE 08</span><span class=\"comic-plan\">TEAM / BUSINESS · 출시 예정</span></div>\n<div class=\"comic-art\"><img alt=\"PC와 스마트폰으로 보안 파일 복호화 이력을 확인하는 장면\" decoding=\"async\" height=\"208\" loading=\"lazy\" src=\"./assets/stories/business-devices.webp\" width=\"315\"/></div>\n<div class=\"comic-copy\"><h3>복호화 이력을 PC·모바일에서</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"회사 문서를 누가 열었는지 확인할 수 있을까요?\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"복호화 요청·승인·실패와 단말의 완료 보고 이력을 PC와 모바일에서 확인할 수 있도록 준비하고 있어요.\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 달라집니다</strong><p>본인은 자신의 이력 · 권한 있는 관리자는 조직 이력</p></div><p class=\"comic-caveat\">※ Team·Business 출시 예정. 무료 오프라인 복호화는 서버 이력에 포함되지 않으며 파일 내용은 감사 로그에 저장하지 않습니다.</p></div>\n</article>\n<article class=\"comic-episode\" data-audience=\"team business\">\n<div class=\"comic-episode-top\"><span>EPISODE 09</span><span class=\"comic-plan\">TEAM / BUSINESS · 출시 예정</span></div>\n<div class=\"comic-art\"><img alt=\"PC에서 보안 문서 목록에 자물쇠 접근 제한을 설정하는 장면\" decoding=\"async\" height=\"208\" loading=\"lazy\" src=\"./assets/stories/pc-vault-only.webp\" width=\"315\"/></div>\n<div class=\"comic-copy\"><h3>파일별 자물쇠와 일괄 비허용</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"예전에 보낸 여러 파일을 일일이 찾아 잠가야 하나요?\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"복호화 이력에서 검색하고 파일 여러 개를 선택해 자물쇠를 비허용으로 바꿀 수 있도록 준비하고 있어요.\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 달라집니다</strong><p>파일 검색 · 다중 선택 · 향후 복호화 권한 차단</p></div><p class=\"comic-caveat\">※ 이미 발급한 키나 열람한 평문은 회수할 수 없으며 추가 기업 승인 정책도 유지됩니다.</p></div>\n</article>\n<article class=\"comic-episode\" data-audience=\"team business\">\n<div class=\"comic-episode-top\"><span>EPISODE 10</span><span class=\"comic-plan\">TEAM / BUSINESS · 출시 예정</span></div>\n<div class=\"comic-art\"><img alt=\"가입자 간 보호된 파일을 전송하고 모바일 알림을 확인하는 장면\" decoding=\"async\" height=\"208\" loading=\"lazy\" src=\"./assets/stories/messenger-share.webp\" width=\"315\"/></div>\n<div class=\"comic-copy\"><h3>가입자 ID 전송과 수신 알림</h3><div class=\"comic-bubble comic-problem\"><span>상황</span><p>\"동료에게 메일 주소 없이 암호화 파일을 보내고 싶어요.\"</p></div><div class=\"comic-bubble comic-solution\"><span>SecureBox</span><p>\"상대의 SecureBox ID를 확인해 암호화 파일을 전송하고, PC·모바일 받은 파일함과 수신 알림에서 확인하도록 준비하고 있어요.\"</p></div><div class=\"comic-end\"><strong>✓ 이렇게 달라집니다</strong><p>가입자 ID로 암호문 전송 · Android/iOS 알림 · 앱 복귀 시 동기화</p></div><p class=\"comic-caveat\">※ 모바일 백그라운드 알림은 OS와 네트워크 상태에 따라 지연될 수 있으며, 푸시 수신이 파일 다운로드 완료를 뜻하지 않습니다.</p></div>\n</article>\n</div>\n\n</div>\n</section></main><footer class=\"footer\"><div class=\"container footer-grid\"><div><a class=\"brand footer-brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\"><svg fill=\"none\" viewbox=\"0 0 40 40\"><path d=\"M20 3L34 9V19C34 27.7 28.3 33 20 37C11.7 33 6 27.7 6 19V9L20 3Z\" stroke=\"currentColor\" stroke-width=\"2.8\"></path><rect height=\"8.5\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\" width=\"9\" x=\"15.5\" y=\"18\"></rect><path d=\"M17.5 18V15.8A2.5 2.5 0 0 1 22.5 15.8V18\" stroke=\"currentColor\" stroke-width=\"2\"></path></svg></span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><p>중요한 계약서를 보내는 순간부터.<br/>SecureBox가 파일 보호를 준비합니다.</p></div><div class=\"footer-links\"><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내·FAQ</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a href=\"./incidents.html\">실제 사고 사례</a></div><div class=\"footer-note\"><p>SecureBox는 개발 중인 제품입니다. 암호화 앱·결제·다운로드는 아직 제공되지 않으며, 표시된 기능과 요금은 출시 계획입니다.</p><p>© 2026 SecureBox · 제품명 가칭</p></div></div></footer></div></body></html>","pricing.html":"<!DOCTYPE html>\n<html lang=\"ko\"><head><meta charset=\"utf-8\"/><meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/><meta content=\"#071721\" name=\"theme-color\"/><meta content=\"SecureBox Personal 무료, Contract Pass $4.90/건, Team $12/인·월, Business $24/인·월 출시 계획을 비교하세요.\" name=\"description\"/><meta content=\"index, follow\" name=\"robots\"/><meta content=\"strict-origin-when-cross-origin\" name=\"referrer\"/><meta content=\"default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests\" http-equiv=\"Content-Security-Policy\"/><title>요금제 비교 | SecureBox</title><link href=\"./favicon.ico?v=20261029-audit1\" rel=\"icon\" type=\"image/x-icon\"/><link href=\"./favicon.svg?v=20261029-audit1\" rel=\"icon\" type=\"image/svg+xml\" sizes=\"any\"/><link href=\"./styles.css\" rel=\"stylesheet\"/><script defer=\"\" src=\"./script.js\"><\/script></head><body><a class=\"skip-link\" href=\"#main\">본문 바로가기</a><div class=\"page-shell\"><header class=\"site-header\" id=\"top\"><div class=\"nav-wrap container\"><a aria-label=\"SecureBox 홈\" class=\"brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\"><svg fill=\"none\" viewbox=\"0 0 40 40\"><path d=\"M20 3L34 9V19C34 27.7 28.3 33 20 37C11.7 33 6 27.7 6 19V9L20 3Z\" stroke=\"currentColor\" stroke-width=\"2.8\"></path><rect height=\"8.5\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\" width=\"9\" x=\"15.5\" y=\"18\"></rect><path d=\"M17.5 18V15.8A2.5 2.5 0 0 1 22.5 15.8V18\" stroke=\"currentColor\" stroke-width=\"2\"></path></svg></span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><button aria-controls=\"nav-links\" aria-expanded=\"false\" aria-label=\"메뉴 열기\" class=\"menu-toggle\" type=\"button\"><span></span><span></span><span></span></button><nav aria-label=\"주 메뉴\" class=\"nav-links\" id=\"nav-links\"><a href=\"./index.html\">제품 소개</a><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a aria-current=\"page\" href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a class=\"nav-cta\" href=\"./pricing.html\">요금제 비교 <span aria-hidden=\"true\">↗</span></a><a href=\"./incidents.html\">사고 사례</a></nav></div></header><main id=\"main\"><section class=\"subhero\"><div class=\"container\"><p class=\"section-kicker light-kicker\">PRICING / PAY FOR WHAT YOU NEED</p><h1>무료로 시작하고,<br/><span>보안 관리는 필요할 때.</span></h1><p>PDF 자체는 무료 암호화가 가능하며, 수신자 인증·기한 관리 또는 팀 관리 기능이 필요한 경우에만 유료 옵션을 선택하세요.</p><div class=\"subhero-actions\"><a class=\"btn btn-primary\" href=\"./pricing.html\">내게 맞는 요금제 <span aria-hidden=\"true\">↗</span></a><a class=\"btn btn-secondary\" href=\"./stories.html\">활용 사례 보기 <span aria-hidden=\"true\">→</span></a></div></div></section><section aria-labelledby=\"pricing-title\" class=\"section-pad pricing-section\" id=\"pricing\"><div class=\"container\"><div class=\"price-head\"><div><p class=\"section-kicker\">06 / SIMPLE PRICING</p><h2 id=\"pricing-title\">보호는 누구에게나.<br><span class=\"subtle-heading\">관리는 필요한 팀만.</span></br></h2></div><div aria-label=\"결제 주기 선택\" class=\"billing-toggle\" role=\"group\"><button aria-pressed=\"true\" class=\"billing-btn active\" data-billing=\"monthly\" id=\"monthly\" type=\"button\">월간</button><button aria-pressed=\"false\" class=\"billing-btn\" data-billing=\"yearly\" id=\"yearly\" type=\"button\">연간 <span>약 17% 절약</span></button></div></div>\n<div class=\"price-grid\">\n<article class=\"price-card\"><div class=\"plan-top\"><span class=\"plan-pill\">개인용</span><h3>Personal</h3><p>계약서와 파일을 보호하는 가장 쉬운 시작.</p></div><div class=\"plan-price\"><strong>$0</strong><span>영구 무료 계획</span></div><div class=\"plan-action\"><a class=\"price-btn outline\" href=\"./index.html#how\">기능 살펴보기 <span>↗</span></a></div><ul class=\"check-list\"><li>로컬 파일·폴더 암호화</li><li>이메일 `.sec` 첨부 준비</li><li>무료 파일 복호화</li><li>OS 보안 저장소 선택</li></ul></article>\n<article class=\"price-card pass-card\"><div class=\"plan-top\"><span class=\"plan-pill\">개인 · 사업자 건별 이용</span><h3>Contract Pass</h3><p>계약서 한 번을 더 세밀하게 보호하고 싶다면.</p></div><div class=\"plan-price\"><strong>$4.90</strong><span>보안 전송 1건 · 일회성</span></div><div class=\"plan-action\"><a class=\"price-btn outline\" href=\"./index.html#launch-note\">출시 계획 확인 <span aria-hidden=\"true\">↗</span></a></div><ul class=\"check-list\"><li>검증된 수신자 최대 2명</li><li>수신자 인증·온라인 키 발급</li><li>발급 기간 14일 · 수신자당 최대 3회</li><li>수신자는 무료로 열기</li></ul></article>\n<article class=\"price-card highlighted\"><div class=\"popular\">RECOMMENDED FOR TEAMS</div><div class=\"plan-top\"><span class=\"plan-pill dark-pill\">기업용 · 2석부터</span><h3>Team</h3><p>팀과 거래처에 보내는 문서를 함께 보호합니다.</p></div><div class=\"plan-price\"><strong id=\"team-price\">$12</strong><span id=\"team-period\">1인 / 월</span></div><div class=\"plan-action\"><a class=\"price-btn solid\" href=\"./index.html#launch-note\">출시 일정 확인 <span>↗</span></a></div><ul class=\"check-list\"><li>Personal의 모든 기능</li><li>관리자 2인 공동 승인</li><li>새 복호화 키의 시간·횟수 제한</li><li>복호화 이력 PC·모바일 조회(지원 예정)</li><li>발신 파일 잠금·검색·일괄 비허용(출시 예정)</li><li>가입자 ID 암호화 전송·수신 알림(출시 예정)</li><li>USB·카카오톡·SNS 보안 공유(앱 경유)</li><li>PC 또는 모바일 1대 로그인</li></ul></article>\n<article class=\"price-card\"><div class=\"plan-top\"><span class=\"plan-pill\">기업용 · 3석부터</span><h3>Business</h3><p>중요한 계약과 민감정보를 체계적으로 관리합니다.</p></div><div class=\"plan-price\"><strong id=\"business-price\">$24</strong><span id=\"business-period\">1인 / 월</span></div><div class=\"plan-action\"><a class=\"price-btn outline\" href=\"./index.html#launch-note\">비즈니스 계획 보기 <span>↗</span></a></div><ul class=\"check-list\"><li>Team의 모든 기능</li><li>복수 관리자 권한</li><li>고급 승인 정책</li><li>복호화 이력 조회·감사 로그 내보내기 계획</li><li>USB·카카오톡·SNS 보안 공유(앱 경유)</li><li>PC 1대 + 모바일 1대 동시 로그인</li><li>상시 암호화 보관함 + PC 원격 잠금·키 접근 차단(지원 예정)</li></ul></article>\n</div>\n<div class=\"calculator\"><div><span class=\"calculator-label\">예상 구독비 계산</span><p>사용자 좌석 수에 따른 팀 단위 예산을 미리 확인하세요.</p></div><div class=\"calc-controls\"><label for=\"seat-count\">좌석 수 <output id=\"seat-output\">5명</output></label><input id=\"seat-count\" max=\"50\" min=\"3\" step=\"1\" type=\"range\" value=\"5\"/></div><div class=\"calc-result\"><span>Team 예상 합계</span><strong id=\"total-price\">$60 <small>/ 월</small></strong><small id=\"calc-note\">월간 · 5명 기준</small></div></div>\n<p class=\"price-disclaimer\">PDF도 기본 암호화는 무료이며, Contract Pass는 <strong>인증·기간 제한이 필요한 관리형 전송에만</strong> 과금합니다. 개인/사업자 모두 건별 이용 가능. USD 기준 · 세금 별도 · 가격은 출시 예정 기준안입니다. 연간 선택 시 1인당 Team $120/년, Business $240/년 선불입니다. 온라인 결제 기능은 정식 출시 시 제공할 예정이며, 현재 실제 결제·앱 다운로드는 열려 있지 않습니다.</p>\n</div></section></main><footer class=\"footer\"><div class=\"container footer-grid\"><div><a class=\"brand footer-brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\"><svg fill=\"none\" viewbox=\"0 0 40 40\"><path d=\"M20 3L34 9V19C34 27.7 28.3 33 20 37C11.7 33 6 27.7 6 19V9L20 3Z\" stroke=\"currentColor\" stroke-width=\"2.8\"></path><rect height=\"8.5\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\" width=\"9\" x=\"15.5\" y=\"18\"></rect><path d=\"M17.5 18V15.8A2.5 2.5 0 0 1 22.5 15.8V18\" stroke=\"currentColor\" stroke-width=\"2\"></path></svg></span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><p>중요한 계약서를 보내는 순간부터.<br/>SecureBox가 파일 보호를 준비합니다.</p></div><div class=\"footer-links\"><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내·FAQ</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a href=\"./incidents.html\">실제 사고 사례</a></div><div class=\"footer-note\"><p>SecureBox는 개발 중인 제품입니다. 암호화 앱·결제·다운로드는 아직 제공되지 않으며, 표시된 기능과 요금은 출시 계획입니다.</p><p>© 2026 SecureBox · 제품명 가칭</p></div></div></footer></div></body></html>","security.html":"<!DOCTYPE html>\n<html lang=\"ko\"><head><meta charset=\"utf-8\"/><meta content=\"width=device-width, initial-scale=1\" name=\"viewport\"/><meta content=\"#071721\" name=\"theme-color\"/><meta content=\"SecureBox의 암호화 파일 보호 범위, 관리자 승인 한계, 비밀번호 전달 방법과 자주 묻는 질문입니다.\" name=\"description\"/><meta content=\"index, follow\" name=\"robots\"/><meta content=\"strict-origin-when-cross-origin\" name=\"referrer\"/><meta content=\"default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests\" http-equiv=\"Content-Security-Policy\"/><title>보안 안내와 자주 묻는 질문 | SecureBox</title><link href=\"./favicon.ico?v=20261029-audit1\" rel=\"icon\" type=\"image/x-icon\"/><link href=\"./favicon.svg?v=20261029-audit1\" rel=\"icon\" type=\"image/svg+xml\" sizes=\"any\"/><link href=\"./styles.css\" rel=\"stylesheet\"/><script defer=\"\" src=\"./script.js\"><\/script></head><body><a class=\"skip-link\" href=\"#main\">본문 바로가기</a><div class=\"page-shell\"><header class=\"site-header\" id=\"top\"><div class=\"nav-wrap container\"><a aria-label=\"SecureBox 홈\" class=\"brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\"><svg fill=\"none\" viewbox=\"0 0 40 40\"><path d=\"M20 3L34 9V19C34 27.7 28.3 33 20 37C11.7 33 6 27.7 6 19V9L20 3Z\" stroke=\"currentColor\" stroke-width=\"2.8\"></path><rect height=\"8.5\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\" width=\"9\" x=\"15.5\" y=\"18\"></rect><path d=\"M17.5 18V15.8A2.5 2.5 0 0 1 22.5 15.8V18\" stroke=\"currentColor\" stroke-width=\"2\"></path></svg></span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><button aria-controls=\"nav-links\" aria-expanded=\"false\" aria-label=\"메뉴 열기\" class=\"menu-toggle\" type=\"button\"><span></span><span></span><span></span></button><nav aria-label=\"주 메뉴\" class=\"nav-links\" id=\"nav-links\"><a href=\"./index.html\">제품 소개</a><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a aria-current=\"page\" href=\"./security.html\">보안 안내</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a class=\"nav-cta\" href=\"./pricing.html\">요금제 비교 <span aria-hidden=\"true\">↗</span></a><a href=\"./incidents.html\">사고 사례</a></nav></div></header><main id=\"main\"><section class=\"subhero\"><div class=\"container\"><p class=\"section-kicker light-kicker\">SECURITY / KNOW THE BOUNDARIES</p><h1>말보다 분명한<br/><span>파일 보호 원칙.</span></h1><p>SecureBox는 파일을 암호화하는 제품으로 개발 중입니다. 할 수 있는 일과 보호할 수 없는 상황도 함께 확인하세요.</p><div class=\"subhero-actions\"><a class=\"btn btn-primary\" href=\"./pricing.html\">내게 맞는 요금제 <span aria-hidden=\"true\">↗</span></a><a class=\"btn btn-secondary\" href=\"./stories.html\">활용 사례 보기 <span aria-hidden=\"true\">→</span></a></div></div></section><section aria-labelledby=\"security-title\" class=\"section-pad privacy-section\" id=\"security\"><div class=\"container privacy-grid\"><div><p class=\"section-kicker\">07 / IMPORTANT TO KNOW</p><h2 id=\"security-title\">안전하다는 말보다,<br>무엇을 보호하는지<br/><em>명확하게.</em></br></h2><p class=\"privacy-lead\">SecureBox는 메일에 첨부된 암호문만 유출된 경우 파일 내용의 기밀성을 보호하도록 설계됩니다. 모든 해킹을 막거나 이미 열린 문서를 회수하는 기술은 아닙니다.</p></div><div class=\"privacy-points\"><div><span class=\"point-index\">01</span><div><h3>첨부 내용 보호</h3><p>별도 복호화 비밀이나 키가 유출되지 않았다면, 탈취한 `.sec`만으로 원문을 열 수 없도록 설계합니다.</p></div></div><div><span class=\"point-index\">02</span><div><h3>이메일 메타데이터는 보호 범위 밖</h3><p>수신자 주소, 메일 제목, 전송 시간, 첨부 크기 등은 암호화하지 않습니다.</p></div></div><div><span class=\"point-index\">03</span><div><h3>열린 평문은 별도 보호가 필요</h3><p>수신자 기기 악성코드나 이미 복호화한 파일의 복사는 첨부 암호화만으로 막을 수 없습니다.</p></div></div></div></div></section><section aria-labelledby=\"faq-title\" class=\"section-pad faq-section\" id=\"faq\"><div class=\"container faq-grid\"><div><p class=\"section-kicker\">08 / FAQ</p><h2 id=\"faq-title\">자주 묻는 질문.</h2><p>서비스 기능은 단계별로 출시될 예정이며, 현재 페이지는 제품 기획을 소개하는 홍보용 데모입니다.</p></div><div class=\"faq-list\"><details><summary>계약서를 보내려면 Gmail 대신 다른 이메일이 필요한가요?<span aria-hidden=\"true\">+</span></summary><p>아니요. SecureBox에서 암호화된 `.sec` 파일을 준비하고 Gmail, Outlook 등 평소 사용하는 메일 서비스에 첨부하는 방식입니다.</p></details><details><summary>PDF 계약서는 모두 유료인가요?<span aria-hidden=\"true\">+</span></summary><p>아니요. PDF와 DOCX 등 모든 파일의 기본 로컬 암호화와 이메일 .sec 첨부는 무료입니다. 본인 인증·기간 제한이 포함된 관리형 계약서 전송만 $4.90/건의 별도 유료 옵션입니다.</p></details><details><summary>수신자도 유료 구독이 필요한가요?<span aria-hidden=\"true\">+</span></summary><p>아니요. Personal 무료 앱으로 비밀번호 기반 복호화가 가능하도록 계획되어 있습니다. 기업 공동승인 파일은 해당 조직의 승인 정책을 따라야 합니다.</p></details><details><summary>비밀번호를 같은 이메일로 보내도 되나요?<span aria-hidden=\"true\">+</span></summary><p>권장하지 않습니다. 메일함이 함께 탈취되면 파일과 비밀번호가 모두 유출됩니다. 전화나 별도로 확인된 채널을 사용하세요.</p></details><details><summary>관리자 승인 기간이 끝나면 이미 연 계약서도 못 보나요?<span aria-hidden=\"true\">+</span></summary><p>기업용의 시간 제한은 서버가 새 키 조각을 발급하는 것을 막습니다. 이미 정상적으로 복호화해 보관한 평문이나 확보한 키의 재사용까지 완전히 차단하는 것은 아닙니다.</p></details><details><summary>Windows나 Mac에서 카카오톡으로도 자동 암호화해 보낼 수 있나요?<span aria-hidden=\"true\">+</span></summary><p>Team·Business에서 SecureBox의 보안 공유 기능을 이용하면 파일을 먼저 .sec로 암호화합니다. OS 공유 대상으로 지원되는 앱은 암호문 전달을 시도하고, 카카오톡 PC처럼 직접 첨부 API가 확인되지 않은 앱은 사용자가 완성된 .sec 파일을 채팅에 첨부합니다. 사용자가 SecureBox를 거치지 않고 원본을 직접 첨부하는 동작까지 막지는 못합니다.</p></details><details><summary>Team과 Business는 몇 대의 기기에서 동시에 로그인할 수 있나요?<span aria-hidden=\"true\">+</span></summary><p>Team은 PC 또는 모바일 중 1대, Business는 PC 1대와 모바일 1대를 동시에 쓸 수 있도록 계획되어 있습니다. 추가 기기는 기존 세션을 해제하고 본인 확인 후 이전합니다. 자동 보안 공유는 구독·기기 세션 온라인 검증이 필요합니다.</p></details><details><summary>휴대폰을 분실해도 업무 파일이 안전한가요?<span aria-hidden=\"true\">+</span></summary><p>Business 상시 암호화 보관함은 파일을 평소부터 암호문으로 저장합니다. 정상 모바일 열람은 생체 인증과 짧은 온라인 세션으로 허용합니다. 분실 시 등록된 Windows/macOS PC에서 서명된 원격 잠금으로 신규 키 접근을 차단하며, 잠금 해제는 PC 서명·MFA·기업 관리자 승인으로만 허용합니다. 휴대폰이 오프라인이어도 암호문은 유지되지만 이미 발급된 기존 키·열린 평문·클라우드 복사본은 즉시 회수할 수 없습니다. 오프라인에서 새 복호화는 허용하지 않으며 스마트폰 전체 잠금이나 완전 삭제는 지원하지 않습니다.</p></details><details><summary>복호화 이력은 누가 확인할 수 있나요?<span aria-hidden=\"true\">+</span></summary><p>Team·Business에 출시 예정인 기능입니다. 기업 관리형 파일의 복호화 요청, 승인, 복호화 완료, 복호화 실패를 PC·모바일에서 조회합니다. 본인은 자신의 이력을, 허가된 관리자는 소속 조직 이력만 확인합니다. 암호화 키·비밀번호·파일 내용·원본 경로는 기록하지 않습니다. 인터넷 연결이 필요하며 오프라인 Personal 복호화는 서버 이력에 포함되지 않습니다. 이벤트 전송 또는 기록이 실패하면 복호화 완료로 표시하지 않습니다.</p></details><details><summary>발신자가 복호화를 중지하거나 ID로 파일을 보낼 수 있나요?<span aria-hidden=\"true\">+</span></summary><p>Team·Business 출시 예정 기능입니다. 파일별 자물쇠로 허용·비허용을 선택하고 감사 이력에서 파일 검색·다중 선택으로 일괄 변경할 수 있습니다. 이미 발급된 키나 복호화된 평문은 회수할 수 없으며 향후 온라인 키 발급을 제한하는 방식입니다. 가입된 수신자의 ID를 확인해 암호화 파일을 전송하고 모바일·PC 알림을 보냅니다. Android/iOS의 백그라운드 알림은 보장되지 않으므로 앱 복귀 시 받은 파일함을 다시 동기화합니다. SecureBox.md는 SecureBox.sec로 저장하되 원래 확장자를 암호화된 메타데이터에 보관합니다.</p></details><details><summary>.sec 파일을 받았는데 SecureBox 앱이 없으면 어떻게 하나요?<span aria-hidden=\"true\">+</span></summary><p>SecureBox가 설치되지 않은 기기에서는 .sec 파일을 직접 복호화할 수 없습니다. 수신자에게는 <a href=\"./open-sec.html\">공식 SEC 파일 열기·설치 안내</a>를 함께 전달하도록 준비하고 있습니다. 설치 후 파일 연결을 통해 열며, 무료 비밀번호 기반 복호화는 가입 없이 이용하도록 설계합니다. 현재 앱은 출시 준비 중으로 다운로드를 제공하지 않습니다. 출처를 알 수 없는 프로그램을 설치하거나 암호를 알려주지 마세요.</p></details><details><summary>iPhone과 Android에서도 사용할 수 있나요?<span aria-hidden=\"true\">+</span></summary><p>Windows/macOS 개인용을 먼저 출시한 뒤 Android/iOS에서 `.sec` 수신·복호화부터 지원할 계획입니다. 모바일 앱은 아직 출시되지 않았습니다.</p></details></div></div></section></main><footer class=\"footer\"><div class=\"container footer-grid\"><div><a class=\"brand footer-brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\"><svg fill=\"none\" viewbox=\"0 0 40 40\"><path d=\"M20 3L34 9V19C34 27.7 28.3 33 20 37C11.7 33 6 27.7 6 19V9L20 3Z\" stroke=\"currentColor\" stroke-width=\"2.8\"></path><rect height=\"8.5\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"2\" width=\"9\" x=\"15.5\" y=\"18\"></rect><path d=\"M17.5 18V15.8A2.5 2.5 0 0 1 22.5 15.8V18\" stroke=\"currentColor\" stroke-width=\"2\"></path></svg></span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><p>중요한 계약서를 보내는 순간부터.<br/>SecureBox가 파일 보호를 준비합니다.</p></div><div class=\"footer-links\"><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내·FAQ</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a href=\"./incidents.html\">실제 사고 사례</a></div><div class=\"footer-note\"><p>SecureBox는 개발 중인 제품입니다. 암호화 앱·결제·다운로드는 아직 제공되지 않으며, 표시된 기능과 요금은 출시 계획입니다.</p><p>© 2026 SecureBox · 제품명 가칭</p></div></div></footer></div></body></html>","open-sec.html":"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\"/><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n<meta name=\"theme-color\" content=\"#071721\"/>\n<meta name=\"description\" content=\"SecureBox.sec 암호화 파일을 받았다면? 무료 복호화 앱 설치 준비 상태와 Windows, macOS, Android, iOS에서 파일을 여는 방법을 확인하세요.\"/>\n<meta name=\"robots\" content=\"index, follow\"/>\n<meta name=\"referrer\" content=\"strict-origin-when-cross-origin\"/>\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests\"/>\n<title>SecureBox.sec 파일 열기·설치 안내 | SecureBox</title>\n<link href=\"./favicon.ico?v=20261029-audit1\" rel=\"icon\" type=\"image/x-icon\"/><link href=\"./favicon.svg?v=20261029-audit1\" rel=\"icon\" type=\"image/svg+xml\" sizes=\"any\"/>\n<link href=\"./styles.css\" rel=\"stylesheet\"/><script defer src=\"./script.js\"><\/script>\n</head><body>\n<a class=\"skip-link\" href=\"#main\">본문 바로가기</a><div class=\"page-shell\">\n<header class=\"site-header\" id=\"top\"><div class=\"nav-wrap container\">\n<a aria-label=\"SecureBox 홈\" class=\"brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\">▣</span><span>SecureBox<span class=\"brand-dot\">.</span></span></a>\n<button aria-controls=\"nav-links\" aria-expanded=\"false\" aria-label=\"메뉴 열기\" class=\"menu-toggle\" type=\"button\"><span></span><span></span><span></span></button>\n<nav aria-label=\"주 메뉴\" class=\"nav-links\" id=\"nav-links\">\n<a href=\"./index.html\">제품 소개</a><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내</a>\n<a class=\"nav-cta\" aria-current=\"page\" href=\"./open-sec.html\">SEC 파일 열기 <span aria-hidden=\"true\">↗</span></a>\n<a href=\"./incidents.html\">사고 사례</a></nav></div></header>\n<main id=\"main\">\n<section class=\"subhero\"><div class=\"container\"><p class=\"section-kicker light-kicker\">OPEN SECURE FILE / RECIPIENT GUIDE</p>\n<h1>SecureBox.sec 파일을 받으셨나요?<br/><span>여는 방법을 알려드릴게요.</span></h1>\n<p>SecureBox의 .sec는 보호된 파일입니다. 앱이 설치되지 않았다면 파일을 열 수 없습니다. 설치 후에는 파일을 SecureBox로 열 수 있도록 준비하고 있습니다.</p>\n<div class=\"subhero-actions\"><a class=\"btn btn-primary\" href=\"#steps\">파일 열기 순서 보기 <span aria-hidden=\"true\">↓</span></a><a class=\"btn btn-secondary\" href=\"./features.html\">주요 기능 알아보기 <span aria-hidden=\"true\">→</span></a></div>\n<p class=\"detail-limit\">현재 앱은 출시 준비 중이며 다운로드·설치가 아직 제공되지 않습니다. 실제 설치 버튼은 서명된 정식 앱이 공개된 뒤에만 제공할 예정입니다.</p>\n</div></section>\n<section class=\"section-pad section-white\" id=\"steps\" aria-labelledby=\"steps-title\"><div class=\"container\"><p class=\"section-kicker\">RECEIVE / INSTALL / OPEN</p>\n<div class=\"section-intro\"><div><h2 id=\"steps-title\">파일은 그대로 보관하고,<br/>공식 앱으로 열어 주세요.</h2></div><p>받은 파일을 실행 파일로 바꾸거나 비밀번호를 제3자에게 전달할 필요가 없습니다. 파일을 보관한 뒤 공식 앱 설치와 파일 열기 절차를 확인하세요.</p></div>\n<div class=\"feature-grid\">\n<article class=\"feature-tile\"><div class=\"feature-icon mint\">01</div><h3>.sec 파일 안전하게 보관</h3><p>이메일 또는 메신저로 받은 SecureBox.sec를 삭제하지 말고 안전한 위치에 저장하세요.</p></article>\n<article class=\"feature-tile\"><div class=\"feature-icon\">02</div><h3>공식 앱 설치 확인</h3><p>정식 출시 후 이 안내 페이지에서 운영체제별 서명된 설치 경로를 제공할 예정입니다. 현재 앱 설치는 지원되지 않습니다.</p></article>\n<article class=\"feature-tile\"><div class=\"feature-icon mint\">03</div><h3>SecureBox로 파일 열기</h3><p>설치 후 .sec 파일을 더블클릭하거나 파일 앱의 ‘공유·다음으로 열기’에서 SecureBox를 선택할 수 있도록 개발합니다.</p></article>\n<article class=\"feature-tile\"><div class=\"feature-icon\">04</div><h3>복호화 후 원래 문서 확인</h3><p>무료 비밀번호 방식은 가입 없이 열고, 관리형 기업 파일은 수신자 인증과 발신자 승인 정책을 확인합니다.</p></article>\n</div></div></section>\n<section class=\"section-pad features-section\" aria-labelledby=\"platforms-title\"><div class=\"container\">\n<p class=\"section-kicker\">YOUR PLATFORM</p><h2 id=\"platforms-title\">사용 중인 기기에 맞춰서.</h2>\n<div class=\"feature-grid\">\n<article class=\"feature-tile\"><h3>Windows</h3><p>앱 설치 후 파일 탐색기에서 .sec 파일을 열거나 ‘연결 프로그램’에서 SecureBox를 선택하도록 지원할 예정입니다.</p><p class=\"detail-limit\">현재 설치 파일 준비 중</p></article>\n<article class=\"feature-tile\"><h3>macOS</h3><p>앱 설치 후 Finder의 ‘다음으로 열기’에서 SecureBox를 선택하는 방법을 제공합니다.</p><p class=\"detail-limit\">현재 설치 파일 준비 중</p></article>\n<article class=\"feature-tile\"><h3>Android</h3><p>지원 앱 출시 후 파일 앱이나 공유 메뉴에서 SecureBox로 .sec 파일을 가져와 열도록 개발합니다.</p><p class=\"detail-limit\">모바일은 후속 출시 예정</p></article>\n<article class=\"feature-tile\"><h3>iOS (iPhone)</h3><p>지원 앱 출시 후 ‘파일’ 앱의 공유 메뉴에서 SecureBox로 열도록 개발합니다.</p><p class=\"detail-limit\">모바일은 후속 출시 예정</p></article>\n</div></div></section>\n<section class=\"section-pad section-white\" aria-labelledby=\"sender-title\"><div class=\"container\">\n<p class=\"section-kicker\">FOR THE SENDER</p><h2 id=\"sender-title\">보내는 분께도 한 가지 안내가 있어요.</h2>\n<p>향후 SecureBox에서 .sec 파일을 이메일·메신저로 전송할 때 <strong>공식 SecureBox 파일 열기 안내 링크</strong>를 파일과 함께 전달하도록 준비합니다. 파일만으로 앱 설치 화면이 자동 실행되지는 않습니다.</p>\n<p>설치 안내와 함께 평문 파일, 비밀번호, 암호화 키는 전송하지 않습니다. 비밀번호가 필요한 파일이라면 별도로 확인된 채널을 사용하세요.</p>\n<div class=\"subhero-actions\"><a class=\"btn btn-primary\" href=\"./security.html\">보안 안내 보기 <span aria-hidden=\"true\">→</span></a><a class=\"btn btn-secondary\" href=\"./pricing.html\">무료·기업 요금제 알아보기 <span aria-hidden=\"true\">→</span></a></div>\n</div></section>\n</main><footer class=\"footer\"><div class=\"container footer-grid\">\n<div><a class=\"brand footer-brand\" href=\"./index.html\"><span class=\"brand-mark\" aria-hidden=\"true\">▣</span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><p>중요한 파일을 공유하는 순간부터.</p></div>\n<div class=\"footer-links\"><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a href=\"./incidents.html\">실제 사고 사례</a></div>\n<div class=\"footer-note\"><p>SecureBox는 개발 중인 제품입니다. 암호화 앱·결제·다운로드는 아직 제공되지 않으며, 표시된 기능과 요금은 출시 계획입니다.</p><p>© 2026 SecureBox · 제품명 가칭</p></div>\n</div></footer></div></body></html>\n","incidents.html":"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\"/><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n<meta name=\"theme-color\" content=\"#071721\"/>\n<meta name=\"description\" content=\"공식 발표로 확인한 이메일 계정 침해와 암호화되지 않은 USB 분실·도난 사고. SecureBox가 파일 자체를 보호하려는 이유를 알아보세요.\"/>\n<meta name=\"robots\" content=\"index, follow\"/>\n<meta name=\"referrer\" content=\"strict-origin-when-cross-origin\"/>\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests\"/>\n<title>실제 이메일 침해·USB 분실 사고 사례 | SecureBox</title>\n<link href=\"./favicon.ico?v=20261029-audit1\" rel=\"icon\" type=\"image/x-icon\"/><link href=\"./favicon.svg?v=20261029-audit1\" rel=\"icon\" type=\"image/svg+xml\" sizes=\"any\"/>\n<link href=\"./styles.css\" rel=\"stylesheet\"/><script defer src=\"./script.js\"><\/script>\n</head><body>\n<a class=\"skip-link\" href=\"#main\">본문 바로가기</a><div class=\"page-shell\">\n<header class=\"site-header\" id=\"top\"><div class=\"nav-wrap container\">\n<a aria-label=\"SecureBox 홈\" class=\"brand\" href=\"./index.html\"><span aria-hidden=\"true\" class=\"brand-mark\">▣</span><span>SecureBox<span class=\"brand-dot\">.</span></span></a>\n<button aria-controls=\"nav-links\" aria-expanded=\"false\" aria-label=\"메뉴 열기\" class=\"menu-toggle\" type=\"button\"><span></span><span></span><span></span></button>\n<nav aria-label=\"주 메뉴\" class=\"nav-links\" id=\"nav-links\">\n<a href=\"./index.html\">제품 소개</a><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./security.html\">보안 안내</a>\n<a class=\"nav-cta\" href=\"./open-sec.html\">SEC 파일 열기 <span aria-hidden=\"true\">↗</span></a>\n<a aria-current=\"page\" href=\"./incidents.html\">사고 사례</a></nav></div></header>\n<main id=\"main\">\n<section class=\"section-dark incident-hero\" aria-labelledby=\"incident-hero-title\"><div class=\"container\">\n<p class=\"section-kicker light-kicker\">REAL CASES / VERIFIED SOURCES</p>\n<h1 id=\"incident-hero-title\">이메일이 침해되고,<br/><span>USB를 잃어버린 그 순간.</span></h1>\n<p class=\"incident-hero-lead\">사고는 뉴스 속 먼 이야기가 아닙니다. 공격자가 이메일 데이터를 볼 수 있거나 암호화되지 않은 USB가 사라지면, 그 안의 민감한 문서까지 위험해질 수 있습니다.</p>\n<div class=\"incident-figures\">\n<div><span class=\"incident-number\">약 25개</span><strong>2023년 이메일 데이터 무단 접근 조직</strong><small>Microsoft 공식 발표</small></div>\n<div><span class=\"incident-number\">286명</span><strong>2013년 분실된 USB에 담긴 아동 정보</strong><small>영국 ICO 공식 사례</small></div>\n</div>\n<div class=\"subhero-actions\"><a class=\"btn btn-primary\" href=\"#cases\">실제 사례 자세히 보기 <span aria-hidden=\"true\">↓</span></a><a class=\"btn btn-secondary\" href=\"./features.html\">파일 보호 방법 알아보기 <span aria-hidden=\"true\">→</span></a></div>\n</div></section>\n<section class=\"section-pad section-white\" id=\"cases\" aria-labelledby=\"cases-title\"><div class=\"container\">\n<p class=\"section-kicker\">WHAT ACTUALLY HAPPENED</p><div class=\"section-intro\"><div><h2 id=\"cases-title\">실제로 일어난 사고,<br/><span>공식 자료로 확인하세요.</span></h2></div>\n<p>아래는 기업·공공기관 발표와 감독기관 자료에 근거한 사건입니다. 사례는 파일 보호가 필요한 이유를 설명하기 위한 것으로, SecureBox가 당시 사고에 사용되었다는 뜻이 아닙니다.</p></div>\n<div class=\"incident-grid\">\n<article class=\"incident-case\" id=\"email-account-incident\">\n<div class=\"incident-case-top\"><span class=\"incident-tag\">이메일 계정 침해</span><span class=\"incident-year\">2023 · Microsoft</span></div>\n<span class=\"incident-case-number\">약 25개 조직</span><h3>보안이 중요한 이메일 계정도 침해될 수 있습니다.</h3>\n<p>Microsoft는 2023년 공격자 Storm-0558이 정부기관 등을 포함한 약 25개 조직의 이메일 데이터에 무단 접근했다고 발표했습니다.</p>\n<div class=\"incident-lesson\"><strong>여기서 생각해 볼 점</strong><p>이메일 계정이나 저장된 메일이 침해되었을 때, 첨부파일이 평문이라면 그 내용도 노출될 위험이 있습니다. 파일을 보내기 전에 암호화하고 복호화 비밀을 다른 경로로 전달하면 위험을 줄이는 데 도움이 됩니다.</p></div>\n<a href=\"https://blogs.microsoft.com/on-the-issues/2023/07/11/mitigation-china-based-threat-actor/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"incident-source\">공식 출처 · Microsoft 2023년 7월 발표 <span aria-hidden=\"true\">↗</span></a>\n</article>\n<article class=\"incident-case\" id=\"usb-data-loss\">\n<div class=\"incident-case-top\"><span class=\"incident-tag\">USB 분실</span><span class=\"incident-year\">2013 · 영국 ICO</span></div>\n<span class=\"incident-case-number\">아동 286명</span><h3>잃어버린 USB에는 민감한 개인정보가 있었습니다.</h3>\n<p>North East Lincolnshire Council의 암호화되지 않은 USB가 분실됐습니다. 여기에는 특별한 교육 지원이 필요한 아동 286명의 건강·학습 관련 민감정보 등이 포함되어 있었고, ICO는 £80,000의 벌금을 부과했습니다.</p>\n<div class=\"incident-lesson\"><strong>여기서 생각해 볼 점</strong><p>USB 자체를 잃더라도 그 안에 저장한 중요한 파일이 미리 암호화되어 있다면 복호화 자격이 없는 사람이 내용을 읽기 더 어려워집니다. 출발 전에 파일부터 보호하는 습관이 중요합니다.</p></div>\n<a href=\"https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/security/encryption/encryption-and-data-storage/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"incident-source\">공식 출처 · 영국 ICO USB 보안 안내 <span aria-hidden=\"true\">↗</span></a>\n</article>\n<article class=\"incident-case\" id=\"usb-theft\">\n<div class=\"incident-case-top\"><span class=\"incident-tag\">USB 도난</span><span class=\"incident-year\">2012 · 영국 ICO</span></div>\n<span class=\"incident-case-number\">1,000명 이상</span><h3>업무용 자료를 담은 USB가 집에서 도난당했습니다.</h3>\n<p>Greater Manchester Police의 암호화되지 않은 USB가 경찰관의 집에서 도난당했습니다. 1,000명 이상에 관한 수사 관련 개인정보가 담겨 있었으며, ICO는 £150,000의 벌금을 부과했습니다.</p>\n<div class=\"incident-lesson\"><strong>여기서 생각해 볼 점</strong><p>USB에 파일을 복사하기 전에 암호화해 둔다면 휴대용 저장장치 분실·도난 시 파일 내용 노출 위험을 줄일 수 있습니다. 기업용 보안 공유도 앱을 거친 내보내기에만 적용됩니다.</p></div>\n<a href=\"https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/security/encryption/encryption-and-data-storage/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"incident-source\">공식 출처 · 영국 ICO 암호화·저장소 가이드 <span aria-hidden=\"true\">↗</span></a>\n</article>\n</div>\n<p class=\"incident-evidence-note\"><strong>자료 읽는 방법:</strong> 사례의 연도·수치와 사고 사실은 각 공식 출처 기준입니다. SecureBox가 당시 사고를 막았거나 사고 당시 SecureBox가 사용되었다는 뜻이 아닙니다. 위 내용은 보안 제품 개발 전의 일반적인 파일 보호 원칙에 대한 설명입니다.</p>\n</div></section>\n<section class=\"section-pad incident-next\" aria-labelledby=\"incident-next-title\"><div class=\"container\">\n<p class=\"section-kicker\">SECUREBOX / FILE FIRST</p><h2 id=\"incident-next-title\">사고를 막는다고 약속하는 대신,<br/><span>파일 자체를 보호하는 방법을 제안합니다.</span></h2>\n<div class=\"incident-steps\">\n<div><span>01</span><strong>메일 첨부 전에 암호화</strong><p>계약서와 중요 문서를 .sec 파일로 보호한 뒤 첨부합니다.</p></div>\n<div><span>02</span><strong>USB에 저장하기 전 암호화</strong><p>앱에서 보호한 파일을 USB로 내보내도록 계획합니다.</p></div>\n<div><span>03</span><strong>복호화 비밀은 별도 전달</strong><p>파일과 비밀번호를 같은 메일·USB에 함께 두지 않습니다.</p></div>\n</div>\n<p class=\"incident-limit\"><strong>정확한 보호 범위:</strong> 파일 암호화는 이메일 계정 해킹·피싱·사칭 송금·USB 분실 자체를 막지 않습니다. 비밀번호/키가 함께 노출되었거나 이미 복호화된 원문이 있다면 보호되지 않습니다. SecureBox의 앱·관리형 기능은 현재 개발 중이며 출시 예정입니다.</p>\n<div class=\"subhero-actions\"><a href=\"./features.html\" class=\"btn btn-primary\">SecureBox 주요 기능 살펴보기 <span aria-hidden=\"true\">→</span></a><a href=\"./stories.html\" class=\"btn btn-secondary\">생활 속 만화 사례 보기 <span aria-hidden=\"true\">→</span></a></div>\n</div></section>\n</main><footer class=\"footer\"><div class=\"container footer-grid\">\n<div><a class=\"brand footer-brand\" href=\"./index.html\"><span class=\"brand-mark\" aria-hidden=\"true\">▣</span><span>SecureBox<span class=\"brand-dot\">.</span></span></a><p>중요한 파일을 공유하는 순간부터.</p></div>\n<div class=\"footer-links\"><a href=\"./features.html\">주요 기능</a><a href=\"./stories.html\">활용 사례</a><a href=\"./pricing.html\">요금제</a><a href=\"./open-sec.html\">SEC 파일 열기</a><a href=\"./incidents.html\">실제 사고 사례</a></div>\n<div class=\"footer-note\"><p>SecureBox는 개발 중인 제품입니다. 암호화 앱·결제·다운로드는 아직 제공되지 않으며, 표시된 기능과 요금은 출시 계획입니다.</p><p>© 2026 SecureBox · 제품명 가칭</p></div>\n</div></footer></div></body></html>\n"};function show(path){
path=path.replace(/^\.\//,"").split("#")[0]||"index.html";
if(!PAGES[path])return;
let html=PAGES[path];
html=html.replace(/<meta[^>]+http-equiv="Content-Security-Policy"[^>]*\/?>/gi,"");

html=html.replace(/<script\b[^>]*src="\.\/script\.js"[^>]*><\/script>/i,"");
html=html.replace(/src="\.\/assets\/stories\/([^"]+\.webp)"/g,(_,name)=>{if(!MEDIA[name])return 'src=""';return 'src="'+MEDIA[name]+'"'});
html=html.replace("</head>",'<link href="'+FAVICON+'" rel="icon" type="image/svg+xml"></head>');
const bridge="<script>document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');if(h&&h.startsWith('./')&&h.includes('.html')){e.preventDefault();window.parent.postMessage({secureboxPreviewRoute:h},'*');}});<\/script>";
html=html.replace("</body>","<script>"+APPJS+"<\/script>"+bridge+"</body>");
const frame=document.getElementById("preview");frame.srcdoc=html;
document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===path));
window.scrollTo(0,0);
};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));window.addEventListener('message',e=>{if(e.source===document.getElementById('preview').contentWindow&&e.data&&e.data.secureboxPreviewRoute)show(e.data.secureboxPreviewRoute)});show('index.html');</script></body></html>
