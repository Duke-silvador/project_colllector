<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion Białystok</title>
<meta name="robots" content="noindex">
<style>
html,body{
    margin:0;
    min-height:100%;
    background:#08080a;
    color:#fff;
    font-family:Arial,sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}
</style>
</head>
<body>
<script>
(function () {
    const path = window.location.pathname.replace(/\/+$/, "") || "/";

    const articleMatch =
        path.match(/^\/aktualnosci\/([^/]+)$/);

    if (articleMatch) {
        sessionStorage.setItem(
            "legion_pending_article_id",
            decodeURIComponent(articleMatch[1])
        );

        window.location.replace("/aktualnosci.html");
        return;
    }

    const routes = {
        "/aktualnosci": "/aktualnosci.html",
        "/tabela": "/tabela.html",
        "/pierwszyzespol": "/pierwszyzespol.html",
        "/drugadruzyna": "/drugadruzyna.html",
        "/akademia": "/akademia.html",
        "/ludzie": "/ludzie.html",
        "/kontakt": "/kontakt.html",
        "/panel": "/panel.html",
        "/polityka-prywatnosci": "/polityka-prywatnosci.html"
    };

    if (routes[path]) {
        window.location.replace(
            routes[path]
            + window.location.search
            + window.location.hash
        );
        return;
    }

    document.body.textContent = "Nie znaleziono strony.";
})();
</script>
</body>
</html>
