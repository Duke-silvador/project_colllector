<style>
/* Soft Night: one phone-width column of rounded cards on warm charcoal, peach accent, floating pill nav. Single dark theme by design. */
:root{
  --bg:#17181C; --card:#212329; --card2:#2A2C33; --track:#2E3139; --fg:#ECEBE7; --muted:#A3A3AC;
  --accent:#F2B880; --accent-ink:#17181C; --accent-tint:rgba(242,184,128,.14);
  --needs:#7FB2F0; --wants:#C3A6F2; --savings:#86D3A8;
  --red:#F08A80; --red-tint:rgba(240,138,128,.14); --ok:#86D3A8; --ok-tint:rgba(134,211,168,.14); --warn:#EBCB7A; --warn-tint:rgba(235,203,122,.14);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:18px;padding-block:24px 128px;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head{display:flex;flex-direction:column;gap:2px;min-width:0}
.head .date{font-size:14px;color:var(--muted)}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:700}
h3{margin:0;font-size:15px;font-weight:700}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;gap:12px}
.sechead > span{font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:24px;padding:20px}
.hero{display:flex;align-items:center;gap:18px}
.hero .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.big.neg{color:var(--red)}
.sub{font-size:13px;color:var(--muted);line-height:1.45}
.ring{flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.notice{background:var(--accent-tint);color:var(--accent);border-radius:18px;padding:14px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;line-height:1.4}
.notice.soft{background:var(--card);color:var(--fg)}
.notice button,.pillbtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;font-weight:700;font-size:13px;padding:8px 14px;min-height:36px;white-space:nowrap}
.pillbtn.ghost{background:var(--card2);color:var(--fg)}
.gtitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:8px 2px 0}
.dot{width:10px;height:10px;border-radius:5px;background:var(--gc,var(--muted));flex:none}
.list{display:flex;flex-direction:column;gap:10px}
.catrow{background:var(--card);border:0;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;text-align:left;width:100%}
.catrow:active{background:var(--card2)}
.l1{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;min-width:0}
.name > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:16px;font-weight:700;white-space:nowrap}
.amt.neg{color:var(--red)}
.meta{font-size:12px;color:var(--muted);line-height:1.45}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--gc,var(--accent));border-radius:4px}
.bar > i.warn{background:var(--warn)} .bar > i.over{background:var(--red)} .bar > i.paid{background:var(--ok)}
.amt.paidtxt{color:var(--ok)}
.chblock{display:flex;flex-direction:column;gap:2px}
.chwhen{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.chrow{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1fr);gap:8px;font-size:13px;padding:4px 0;color:var(--muted)}
.chrow span{overflow-wrap:anywhere}
.chrow.chhead{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chrow.diff span:nth-child(2){color:var(--fg);text-decoration:line-through;text-decoration-color:var(--red)}
.chrow.diff span:nth-child(3){color:var(--ok);font-weight:700}
.billnote{display:block;margin-top:6px;font-size:12px;line-height:1.35}
.billnote.ok{color:var(--ok)}
.billnote.short{color:var(--red)}
.overflag{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:14px;background:rgba(240,120,110,.10);border:1px solid rgba(240,120,110,.25);font-size:13px}
.overflag b{color:var(--red);font-weight:700}
.overflag .orow{display:flex;justify-content:space-between;color:var(--fg)}
.overflag .orow span:last-child{color:var(--red);font-weight:600}
.overflag .ofoot{color:var(--muted);font-size:12px}
.amt.lvl-good{color:var(--ok)} .amt.lvl-mid{color:var(--warn)} .amt.lvl-bad{color:var(--red)}
.tlrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0}
.tlrow + .tlrow{border-top:1px solid var(--track)}
.tld{font-size:12px;color:var(--muted)}
.tlrow .t1,.tlrow .t2{white-space:normal}
.fctip{position:absolute;top:0;width:170px;background:var(--card2);border:1px solid var(--track);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.5;color:var(--fg);pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.legendrow{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legendrow span{display:inline-flex;align-items:center;gap:6px}
#fcChart{touch-action:pan-y}
.tla{font-weight:700;white-space:nowrap}
.tla.pos{color:var(--ok)}
.empty{color:var(--muted);font-size:14px;padding:12px 2px;line-height:1.5}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:4px}
.srcrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0}
.srcrow + .srcrow{border-top:1px solid var(--track)}
.srcrow .r{color:var(--muted);white-space:nowrap}

/* floating nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:10;pointer-events:none}
.nav .in{pointer-events:auto;max-width:452px;margin:0 auto;height:66px;background:#25272E;border-radius:33px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;min-height:52px;border-radius:24px;padding:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:11;width:58px;height:58px;border-radius:29px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fab svg{width:24px;height:24px}

.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn svg{width:18px;height:18px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daycard{background:var(--card);border-radius:18px;padding:4px 16px}
.dayhead{font-size:13px;font-weight:600;color:var(--muted);margin:8px 2px 0}
.txrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0}
.txrow + .txrow{border-top:1px solid var(--track)}
button.txrow{background:none;border:0;width:100%;text-align:left;border-radius:0}
button.txrow + button.txrow{border-top:1px solid var(--track)}
.chev{color:#6E6F78;display:grid;place-items:center;width:20px}
.chev svg{width:15px;height:15px}
.t1{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txrow .amt.inc{color:var(--ok)}
.txrow .amt.sav{color:var(--savings)}
.del{background:none;border:0;border-radius:999px;color:var(--muted);min-width:40px;height:36px;padding:0 10px;font-size:12px;font-weight:700;display:grid;place-items:center}
.del svg{width:17px;height:17px}
.del.armed{background:var(--red-tint);color:var(--red)}
.spacer{min-width:40px}

/* goals */
.goal{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.goal .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.goal .bal{font-size:28px;font-weight:800;letter-spacing:-.01em}
.goal .bal small{font-size:15px;font-weight:600;color:var(--muted)}
.goal .acts{display:flex;gap:8px;flex-wrap:wrap}
.chipline{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.chipline.ok{background:var(--ok-tint);color:var(--ok)} .chipline.warn{background:var(--warn-tint);color:var(--warn)} .chipline.info{background:var(--card2);color:var(--muted)}
.entries{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.entries div,.entrybtn{display:flex;justify-content:space-between;gap:12px}
.entrybtn{background:none;border:0;padding:6px 0;color:inherit;font-size:13px;width:100%;text-align:left;min-height:32px;align-items:center}

/* plan */
.status{font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;white-space:nowrap}
.status.ok{background:var(--ok-tint);color:var(--ok)} .status.under{background:var(--warn-tint);color:var(--warn)} .status.over{background:var(--red-tint);color:var(--red)}
.sumtop{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:6px}
.sumtop .big{font-size:40px}
.sumlines{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sumlines div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sumlines span:first-child{display:flex;align-items:center;gap:8px;color:var(--muted)}
.pcard{background:var(--card);border-radius:20px;padding:6px 16px 14px}
.field{background:var(--card2);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-height:44px;width:100%;color:var(--fg)}
.field.num{color:var(--accent);text-align:right;font-weight:700}
.field:focus{border-color:var(--accent);outline:none}
.field::placeholder{color:#767680}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.prow{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.prow + .prow{border-top:1px solid var(--track)}
.prow .r{display:flex;gap:8px;align-items:center}
.prow .r > .field:first-child{flex:1;min-width:0}
.prow .num{width:112px;flex:none}
.seg{display:flex;gap:6px;flex:1}
.seg button{flex:1;background:var(--card2);border:0;border-radius:999px;min-height:36px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gc,var(--accent));color:var(--accent-ink)}
.addbtn{background:none;border:1px dashed #3A3D46;border-radius:14px;min-height:44px;color:var(--muted);font-size:14px;font-weight:600;margin-top:6px;width:100%}
.hint{font-size:12px;color:var(--muted)}

/* guide */
details.gd{background:var(--card);border-radius:20px;padding:0 18px}
details.gd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px;cursor:pointer;font-weight:700;font-size:16px}
details.gd summary::-webkit-details-marker{display:none}
details.gd summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.gd[open] summary::after{transform:rotate(-135deg)}
.gbody{padding-bottom:18px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.55}
.gbody p{margin:0}
.gbody b{color:var(--fg)}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;background:none;border:0;text-align:left;padding:0;width:100%}
.check{width:28px;height:28px;border-radius:14px;border:2px solid #4A4D56;display:grid;place-items:center;margin-top:1px}
.check svg{width:16px;height:16px;opacity:0}
.step[aria-pressed="true"] .check{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.step[aria-pressed="true"] .check svg{opacity:1}
.step[aria-pressed="true"] .st{color:var(--muted);text-decoration:line-through}
.st{font-weight:700;font-size:15px}
.sd{color:var(--muted);font-size:13px;line-height:1.5;margin-top:2px}
.rule{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:start}
.rule .dot{margin-top:6px}
.tour{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.tour .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--accent)}
.tour .ic svg{width:20px;height:20px}
.progressline{font-size:13px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,8,10,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:28px 28px 0 0;width:100%;max-width:480px;max-height:92%;overflow:auto;padding:14px 18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sheet .grab{width:40px;height:5px;background:var(--track);border-radius:3px;align-self:center}
.sheet .iconbtn{background:var(--card2)}
.amountwrap{display:flex;align-items:baseline;gap:4px}
.amountwrap span{font-size:36px;font-weight:700;color:var(--muted)}
.amount{background:none;border:0;font-size:52px;font-weight:800;width:100%;color:var(--fg);caret-color:var(--accent);padding:0;letter-spacing:-.02em}
.amount:focus{outline:none}
.amount::placeholder{color:#4A4D56}
.typetog{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:999px;padding:4px}
.typetog button{background:none;border:0;border-radius:999px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.typetog button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pick{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid transparent;background:var(--card2);border-radius:999px;min-height:40px;padding:8px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--gc)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint);color:var(--accent)}
.chiphead{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px}
.save{background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;min-height:54px;font-weight:800;font-size:16px}
.save:disabled{background:var(--card2);color:#6E6F78;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;min-height:44px}
.dangerbtn{background:none;border:0;color:var(--red);font-weight:700;min-height:44px}
.dangerbtn.armed{background:var(--red-tint);border-radius:14px}
label.lab{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
.sheettop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.splitrow{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px;align-items:center;padding:10px 0}
.splitrow + .splitrow{border-top:1px solid var(--track)}
.totals{background:var(--card2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.totals div{display:flex;justify-content:space-between}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;z-index:30;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}}
.toast{white-space:normal}

/* ===== PRO THEME =====
   Everything below is scoped to html:is([data-theme="pro"],[data-theme="sl"]). Delete this block (or tap Classic in Guide > Appearance) to return to the original look.
   Patterns borrowed: layered navy-tinted surfaces with no borders and 90%-white text (Copilot), a bold gradient hero number (Cash App / Revolut),
   direction-colored charts (Robinhood), glowing goal progress (Monzo pots / Monarch), glass floating nav + undo toasts (Revolut / Apple),
   semantic colors that never change meaning (Copilot / YNAB). */
html:is([data-theme="pro"],[data-theme="sl"]){
  --bg:#0A0B12; --card:#15171F; --card2:#1F212B; --track:#262935; --fg:#E9EAF0; --muted:#8B91A5;
  --accent:#F4B27F; --accent-ink:#17110C; --accent-tint:rgba(244,178,127,.13);
  --needs:#6EA8FF; --wants:#B494FF; --savings:#46DB9B;
  --red:#FF6B5E; --red-tint:rgba(255,107,94,.14); --ok:#3DDC97; --ok-tint:rgba(61,220,151,.14); --warn:#F5C451; --warn-tint:rgba(245,196,81,.14);
  --g-accent:linear-gradient(135deg,#FFCB9B 0%,#F4A27C 52%,#EA7C93 100%);
  --g-card:linear-gradient(165deg,#1C1F29 0%,#14161D 100%);
  --g-glass:rgba(22,24,32,.93);
  --edge:inset 0 1px 0 rgba(255,255,255,.06);
  --lift:0 10px 28px rgba(0,0,0,.30);
}

<script>
/* LocalDB: stores everything on this device in IndexedDB.
   It mimics the small document API the app was written against:
   db.doc("config/plan").get()/set()/delete()/onSnapshot()  and  db.collection("goals").onSnapshot(). */
window.LocalDB = (function(){
  const NAME = "mission-budget", STORE = "docs";
  let idb = null;
  const docL = new Map(), colL = new Map();
  const clone = (v) => v == null ? v : JSON.parse(JSON.stringify(v));
  function open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open(NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => { idb = r.result; idb.onclose = () => { idb = null; }; idb.onversionchange = () => { idb.close(); idb = null; }; res(api); };
      r.onerror = () => rej(r.error);
    });
  }
  function tx1(mode, fn){
    return new Promise((res, rej) => {
      const t = idb.transaction(STORE, mode), st = t.objectStore(STORE);
      let out; const r = fn(st);
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  async function tx(mode, fn){
    try { if (!idb) await open(); return await tx1(mode, fn); }
    catch (e){ idb = null; await open(); return await tx1(mode, fn); } // one retry on a closed/stale connection
  }
  const getRaw = (path) => tx("readonly", (st) => st.get(path));
  async function allEntries(){
    const keys = await tx("readonly", (st) => st.getAllKeys());
    const vals = await tx("readonly", (st) => st.getAll());
    return keys.map((k, i) => [String(k), vals[i]]);
  }
  const snapDoc = (path, v) => ({id: path.split("/").pop(), exists: v !== undefined, data: () => clone(v)});
  async function snapCol(name){
    const docs = (await allEntries()).filter(([k]) => k.startsWith(name + "/") && k.split("/").length === 2).map(([k, v]) => snapDoc(k, v));
    return {docs, size: docs.length, empty: !docs.length};
  }
  async function notify(path){
    const v = await getRaw(path);
    (docL.get(path) || new Set()).forEach((cb) => { try { cb(snapDoc(path, v)); } catch (e){} });
    const col = path.split("/")[0];
    if (colL.has(col)){ const sn = await snapCol(col); colL.get(col).forEach((cb) => { try { cb(sn); } catch (e){} }); }
  }
  function listen(map, key, cb){ if (!map.has(key)) map.set(key, new Set()); map.get(key).add(cb); return () => map.get(key).delete(cb); }
  const api = {
    doc(path){
      return {
        id: path.split("/").pop(),
        async get(){ return snapDoc(path, await getRaw(path)); },
        async set(body){ await tx("readwrite", (st) => st.put(clone(body), path)); notify(path); },
        async delete(){ await tx("readwrite", (st) => st.delete(path)); notify(path); },
        onSnapshot(cb, err){ getRaw(path).then((v) => cb(snapDoc(path, v)), (e) => err && err(e)); return listen(docL, path, cb); },
      };
    },
    collection(name){
      return { onSnapshot(cb, err){ snapCol(name).then(cb, (e) => err && err(e)); return listen(colL, name, cb); } };
    },
    // ---- backup helpers ----
    async exportAll(){ const docs = {}; for (const [k, v] of await allEntries()) if (!k.startsWith("meta/")) docs[k] = v; return docs; },
    async importAll(docs){
      await tx("readwrite", (st) => { st.clear(); for (const [k, v] of Object.entries(docs)) st.put(clone(v), k); });
    },
    async snapList(){ return (await getRaw("meta/snaps")) || []; },
    async snapshot(label){
      const docs = await api.exportAll(); if (!Object.keys(docs).length) return false;
      const list = (await getRaw("meta/snaps")) || [], body = JSON.stringify(docs);
      if (list[0] && list[0].body === body) return false;
      list.unshift({at: new Date().toISOString(), label, body});
      await tx("readwrite", (st) => st.put(list.slice(0, 3), "meta/snaps"));
      return true;
    },
    async isEmpty(){ return !(await allEntries()).some(([k]) => !k.startsWith("meta/")); },
    async getMeta(k){ return getRaw("meta/" + k); },
    async setMeta(k, v){ await tx("readwrite", (st) => st.put(v, "meta/" + k)); },
  };
  return {open};
})();
</script>

(function(){

  const curTheme = () => document.documentElement.getAttribute("data-theme");
  const isPro = () => document.documentElement.getAttribute("data-theme") !== "classic";
  function setTheme(t){
    t = t === "classic" || t === "pro" ? t : "sl";

  const money = (n, d = 2) => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const monthKey = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1);

  const round2 = (n) => Math.round(n * 100) / 100;

  const monthsUntil = (s) => { if (!s) return 0; const [y, m] = s.split("-").map(Number); const n = new Date(); return Math.max(1, (y - n.getFullYear()) * 12 + (m - 1 - n.getMonth())); };

  const IC = {

  };

    let incomeIn = 0, foodSpent = 0, foodN = 0, pocketExtra = 0;
    for (const t of tx){
      if (t.type === "income"){ incomeIn += num(t.amount); if (t.pocket) pocketExtra += num(t.pocket); const key = t.incomeId && incById(t.incomeId) ? t.incomeId : "other"; bySource[key] = (bySource[key] || 0) + num(t.amount); }
      else { spent[t.categoryId] = (spent[t.categoryId] || 0) + num(t.amount); if (t.tag === "food"){ foodSpent += num(t.amount); foodN++; } }
    }
    let spendBudget = 0, spendSpent = 0;
    for (const c of cats()){ spendBudget += num(c.budget); spendSpent += spent[c.id] || 0; }
    for (const id in spent) if (!cats().some((c) => c.id === id)) spendSpent += spent[id];
    const saved = S.goals.reduce((s, g) => s + goalAddedIn(g, k), 0);
    let funBudget = 0, funSpent = 0, billsDue = 0, needsDue = 0;
    // Overspending in any non-fun category (over by $1+) gets flagged and, by default, comes out of pocket money.
    const overs = [];
    for (const c of cats()){
      if (roleOf(c) === "fun") continue;
      const o = (spent[c.id] || 0) - num(c.budget);
      if (o >= 1) overs.push({id: c.id, name: c.name, amount: round2(o)});
    }
    const overTotal = overs.reduce((s, o) => s + o.amount, 0);
    const coverOver = plan().coverOver !== false;
    for (const c of cats()){
      const left = Math.max(0, num(c.budget) - (spent[c.id] || 0));
      const role = roleOf(c);
      if (role === "fun"){ funBudget += num(c.budget); funSpent += spent[c.id] || 0; }
      else if (role === "bill"){ if (!(S.billSkip[k] || []).includes(c.id)) billsDue += left; }
      else if (c.group === "Needs") needsDue += left;
    }
    funBudget += pocketExtra; // side income you chose to spend this month
    const now = new Date();
    const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const daysLeft = dim - now.getDate() + 1;
    const left = spendBudget - spendSpent;
    const funCover = coverOver ? overTotal : 0;
    const funLeft = funBudget - funSpent - funCover;
    return {pocketExtra, overs, overTotal, coverOver, funCover, tx, spent, bySource, incomeIn, spendBudget, spendSpent, left, daysLeft, safe: daysLeft > 0 ? Math.max(0, left) / daysLeft : 0, saved, cash: incomeIn - saved - spendSpent, funBudget, funSpent, funLeft, funDaily: daysLeft > 0 ? Math.max(0, funLeft) / daysLeft : 0, billsDue, needsDue, foodSpent, foodN};
  }

  // ---------------- render ----------------
  function render(){
    document.querySelectorAll(".tab").forEach((b) => { if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });

  }
  const helpBtn = () => `<button type="button" class="iconbtn" data-go="guide" aria-label="Open the guide">${IC.help}</button>`;

  function notices(){
    if (S.status === "offline") return '<div class="notice"><span>This browser is blocking storage (Private Browsing?). Changes won\'t be saved.</span></div>';
    let out = "";
    if (S.empty) out += '<div class="notice"><span>Moving from the old version? Restore your backup file to bring your data over.</span><button type="button" data-restore>Restore</button></div>';

    }
    const doneCount = Object.values(S.guide.done || {}).filter(Boolean).length;
    if (S.plan && S.plan.example) out += '<div class="notice"><span>Your plan still has example numbers. The guide walks you through setting it up.</span><button type="button" data-go="guide">Start here</button></div>';
    else if (doneCount < 8 && !S.guide.hidden) out += `<div class="notice soft"><span>Getting started: ${doneCount} of 8 steps done.</span><button type="button" data-go="guide">Guide</button></div>`;
    return out;
  }
  function lastLoggedNotice(m){
    if (S.status !== "live" || !(monthKey(new Date()) in S.months)) return "";
    const ts = m.tx.map((t) => t.ts || t.date).sort().pop();
    if (!ts){ return '<div class="notice soft"><span>Nothing logged this month yet. Tap + to log your first purchase or paycheck.</span></div>'; }
    const days = Math.floor((Date.now() - new Date(ts).getTime()) / 864e5);
    if (days >= 2) return `<div class="notice soft"><span>Last logged ${days} days ago. Catch up from your bank app.</span></div>`;
    return "";
  }

  function ringSVG(p){
    const C = 2 * Math.PI * 34, used = Math.max(0, Math.min(1, p));
    const color = p > 1 ? "var(--red)" : p >= 0.9 ? "var(--warn)" : "var(--accent)";
    const accentRing = !(p > 1) && !(p >= 0.9), pro = isPro() && accentRing;
    return `<svg class="ring" role="img" aria-label="${Math.round(p * 100)}% of monthly spending used" width="84" height="84" viewBox="0 0 84 84">
      <defs><linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--rg1,#FFCB9B)"/><stop offset="1" style="stop-color:var(--rg2,#EA7C93)"/></linearGradient></defs>
      <circle cx="42" cy="42" r="34" fill="none" stroke="var(--track)" stroke-width="9"/>
      <circle${pro ? ' class="rp"' : ""} cx="42" cy="42" r="34" fill="none" stroke="${pro ? "url(#ringG)" : color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C * used).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"${used === 0 ? ' opacity="0"' : ""}/>
      <text x="42" y="41" text-anchor="middle" font-family="Figtree,sans-serif" font-size="16" font-weight="700" fill="var(--fg)">${Math.round(p * 100)}%</text>
      <text x="42" y="56" text-anchor="middle" font-family="Figtree,sans-serif" font-size="10" fill="var(--muted)">used</text></svg>`;
  }

  // ---------------- cash-flow forecast ----------------
  const parseD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const dimOf = (y, m) => new Date(y, m + 1, 0).getDate();
  const stepPay = (d, freq) => freq === "monthly" ? new Date(d.getFullYear(), d.getMonth() + 1, d.getDate()) : addDays(d, freq === "weekly" ? 7 : freq === "semimonthly" ? 15 : 14);
  function nextPay(i){
    const today = new Date(); today.setHours(0, 0, 0, 0);
    let d = null, inferred = false, last = null;
    for (const k in S.months) for (const t of S.months[k]) if (t.type === "income" && t.incomeId === i.id && (!last || t.date > last)) last = t.date;
    if (i.nextPay) d = parseD(i.nextPay);
    else if (last){ d = stepPay(parseD(last), i.freq); inferred = true; }
    if (!d) return null;
    let g = 0; while (d < today && g++ < 60) d = stepPay(d, i.freq);
    // A paycheck already logged on (or within 3 days before) this date has arrived, so skip to the following one.
    if (last){ const got = addDays(parseD(last), 3); while (d <= got && g++ < 60) d = stepPay(d, i.freq); }
    return {d, inferred};
  }
  const isSubsCat = (c) => /subscri/i.test(c.name || "") && roleOf(c) === "bill";
  const cushionAmt = () => plan().cushion != null && plan().cushion !== "" ? num(plan().cushion) : 25;
  const dueIn = (y, mo, dd) => new Date(y, mo, Math.min(dd, dimOf(y, mo)));
  // Bills between `from` (a date) and `from + H` days. Subscriptions use the itemized list when it exists.
  function billEvents(from, H){
    const k = monthKey(from), m = monthStats(k), ev = [], missing = [];
    const inWin = (d) => d >= from && (d - from) / 864e5 < H;
    for (const c of cats()){
      if (roleOf(c) !== "bill") continue;
      const b = num(c.budget);
      if (isSubsCat(c) && S.subsList.length){
        const known = S.subsList.reduce((s, x) => s + num(x.price), 0);
        const unpriced = S.subsList.filter((x) => !(num(x.price) > 0));
        const est = unpriced.length ? Math.max(0, b - known) / unpriced.length : 0;
        for (const x of S.subsList){
          const dd = parseInt(x.dueDay, 10); if (!dd) continue;
          const price = num(x.price) > 0 ? num(x.price) : est; if (price <= 0) continue;
          for (let mo = 0; mo <= 2; mo++){ const due = dueIn(from.getFullYear(), from.getMonth() + mo, dd); if (inWin(due)) ev.push({d: due, label: x.name, note: num(x.price) > 0 ? "subscription" : "subscription · price estimated", amt: -round2(price), kind: 0}); }
        }
        continue;
      }
      if (b <= 0) continue;
      const dd = parseInt(c.dueDay, 10);
      const sp = m.spent[c.id] || 0;
      const done = sp >= b * 0.97 || (S.billSkip[k] || []).includes(c.id);
      if (!dd){ if (!done){ ev.push({d: from, label: c.name, note: "no due day set, counted now", amt: -(b - sp), kind: 0}); missing.push(c.name); } continue; }
      if (!done){ let due = dueIn(from.getFullYear(), from.getMonth(), dd); if (due < from) due = from; if (inWin(due)) ev.push({d: due, label: c.name, amt: -(b - sp), kind: 0}); }
      for (let mo = 1; mo <= 2; mo++){ const due = dueIn(from.getFullYear(), from.getMonth() + mo, dd); if (inWin(due)) ev.push({d: due, label: c.name, amt: -b, kind: 0}); }
    }
    return {ev, missing};
  }
  // Checking/savings estimated from the last balance update plus anything logged after it.
  function liveBalances(){
    const acc = S.accounts; if (!acc || acc.checking == null) return null;
    // Only entries logged after the balance update AND dated on/after that day count, so back-filled history isn't subtracted twice.
    const since = acc.asOf || "", sinceDay = since ? ymd(new Date(since)) : "";
    const after = (x) => (x.ts || "") > since && (x.date || "") >= sinceDay;
    let chk = num(acc.checking), sav = acc.savings != null ? num(acc.savings) : null, n = 0;
    for (const k in S.months) for (const t of S.months[k]) if (after(t)){ chk += t.type === "income" ? num(t.amount) : -num(t.amount); n++; }
    for (const g of S.goals) for (const e of (g.entries || [])) if (after(e) && !e.starting){ chk -= num(e.amount); if (sav != null) sav += num(e.amount); n++; }
    return {checking: round2(chk), savings: sav == null ? null : round2(sav), n, asOf: acc.asOf};
  }
  function forecast(){
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const k = monthKey(today), m = monthStats(k), lb = liveBalances();
    if (!lb) return null;
    const H = 31, cushion = cushionAmt();
    const {ev, missing} = billEvents(today, H);
    const exp = expectedMonthly(), share = exp > 0 ? Math.min(1, goalsMonthly() / exp) : 0;
    const paysMissing = [];
    for (const i of incomes()){
      if (num(i.amount) <= 0) continue;
      const np = nextPay(i); if (!np){ paysMissing.push(i.name || "Income"); continue; }
      let d = np.d, g = 0;
      while ((d - today) / 864e5 < H && g++ < 10){
        ev.push({d, label: i.name || "Paycheck", note: i.kind === "varies" ? "typical amount" + (np.inferred && g === 1 ? ", date estimated" : "") : (np.inferred && g === 1 ? "date estimated" : ""), amt: num(i.amount), kind: 1});
        if (share > 0) ev.push({d, label: "Move to goals", note: "your goal share of this check", amt: -round2(num(i.amount) * share), kind: 2});
        d = stepPay(d, i.freq);
      }
    }
    ev.sort((a, b) => a.d - b.d || a.kind - b.kind);
    const needCats = cats().filter((c) => roleOf(c) === "regular" && c.group === "Needs");
    const needLeft = needCats.reduce((s, c) => s + Math.max(0, num(c.budget) - (m.spent[c.id] || 0)), 0);
    const needMonthly = needCats.reduce((s, c) => s + num(c.budget), 0);
    const nextDim = dimOf(today.getFullYear(), today.getMonth() + 1);
    let bal = lb.checking, low = Infinity, lowD = today, idx = 0, inSum = 0, outSum = 0, needSum = 0;
    const series = [];
    for (let day = 0; day < H; day++){
      const date = addDays(today, day), dayEv = [];
      while (idx < ev.length && ev[idx].d <= date){ bal += ev[idx].amt; ev[idx].bal = bal; if (ev[idx].amt > 0) inSum += ev[idx].amt; else outSum -= ev[idx].amt; dayEv.push(ev[idx]); idx++; }
      const need = day < m.daysLeft ? (m.daysLeft ? needLeft / m.daysLeft : 0) : needMonthly / nextDim;
      bal -= need; needSum += need;
      series.push({d: date, bal, ev: dayEv});
      if (bal < low){ low = bal; lowD = date; }
    }
    const perDay = m.daysLeft ? needLeft / m.daysLeft : 0;
    return {ev, series, start: lb.checking, end: bal, inSum, outSum, needSum, low, lowD, cushion, spendable: Math.max(0, low - cushion), missing, paysMissing, perDay, needNames: needCats.map((c) => c.name), live: lb};
  }
  function timelineCard(fc){
    const dshort = (d) => d.toLocaleString("en-US", {weekday: "short", month: "short", day: "numeric"});
    const rows = fc.ev.filter((e) => e.kind !== 2).slice(0, 6).map((e) => `<div class="tlrow"><span class="tld">${esc(dshort(e.d))}</span><span style="min-width:0"><div class="t1" style="font-size:14px">${esc(e.label)}</div>${e.note ? `<div class="t2">${esc(e.note)}</div>` : ""}</span><span class="tla ${e.amt >= 0 ? "pos" : ""}">${e.amt >= 0 ? "+" : "−"}${money(Math.abs(e.amt))}</span></div>`).join("");
    let warn = "";
    if (fc.missing.length) warn += `<div class="notice soft"><span>Set a due day for <b>${esc(fc.missing.join(", "))}</b> in Plan. Until then they're counted as due today, which keeps your number low.</span><button type="button" data-go="plan">Plan</button></div>`;
    if (fc.paysMissing.length) warn += `<div class="notice soft"><span>Set the next payday for <b>${esc(fc.paysMissing.join(", "))}</b> in Plan so it counts in your forecast.</span><button type="button" data-go="plan">Plan</button></div>`;
    return `<section class="card" aria-label="Next 30 days" style="display:flex;flex-direction:column;gap:10px">
      <div class="l1"><h2>Next 30 days</h2><button type="button" class="pillbtn" data-go="forecast">See graph</button></div>
      ${miniChart(fc)}
      <p class="sub" style="margin:0">Lowest projected balance: <b style="color:${fc.low < fc.cushion ? "var(--red)" : "var(--fg)"}">${money(fc.low)}</b> on ${esc(dshort(fc.lowD))}. Includes ${esc(fc.needNames.join(" & ") || "needs")} at about ${money(fc.perDay)}/day.</p>
      ${warn}
      <div>${rows || '<p class="empty">No bills or paychecks in the next 30 days.</p>'}</div>
    </section>`;
  }

  // ---------------- forecast chart ----------------
  // One series (projected checking), one y-axis. Paydays and bills are marked with distinct shapes, not color alone.
  function chartSVG(fc, opts){
    const W = 340, Hh = opts.h || 190, pl = opts.mini ? 6 : 44, pr = 8, pt = 12, pb = opts.mini ? 6 : 26;
    const s = fc.series, n = s.length;
    const vals = s.map((p) => p.bal).concat([fc.cushion, 0]);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const padv = (hi - lo) * 0.08 || 20; lo -= padv; hi += padv;
    const x = (i) => pl + (i / Math.max(1, n - 1)) * (W - pl - pr);
    const y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (Hh - pt - pb);
    const path = s.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.bal).toFixed(1)).join(" ");
    const area = path + ` L ${x(n - 1).toFixed(1)} ${y(lo).toFixed(1)} L ${x(0).toFixed(1)} ${y(lo).toFixed(1)} Z`;
    let g = "";
    if (!opts.mini){
      const step = (hi - lo) / 3;
      for (let t = 0; t <= 3; t++){ const v = lo + step * t; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--track)" stroke-width="1"/><text x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${money(v, 0)}</text>`; }
      for (let i = 0; i < n; i += 7) g += `<text x="${x(i).toFixed(1)}" y="${Hh - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(s[i].d.toLocaleString("en-US", {month: "short", day: "numeric"}))}</text>`;
      const mb = s.findIndex((p, i) => i > 0 && p.d.getDate() === 1);
      if (mb > 0) g += `<line x1="${x(mb).toFixed(1)}" x2="${x(mb).toFixed(1)}" y1="${pt}" y2="${Hh - pb}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/>`;
    }
    const pro = isPro(), sfx = opts.mini ? "m" : "f";
    const up = s[n - 1].bal >= s[0].bal, dc = up ? "var(--ok)" : "var(--red)";
    const defs = pro ? `<defs>
      <linearGradient id="fcA${sfx}" gradientUnits="userSpaceOnUse" x1="0" y1="${pt}" x2="0" y2="${Hh - pb}"><stop offset="0" style="stop-color:${dc};stop-opacity:.34"/><stop offset="1" style="stop-color:${dc};stop-opacity:0"/></linearGradient>
      <linearGradient id="fcL${sfx}" gradientUnits="userSpaceOnUse" x1="${pl}" y1="0" x2="${W - pr}" y2="0"><stop offset="0" style="stop-color:${dc};stop-opacity:.55"/><stop offset="1" style="stop-color:${dc}"/></linearGradient></defs>` : "";
    const cy = y(fc.cushion);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${cy.toFixed(1)}" y2="${cy.toFixed(1)}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 4"/>`;
    if (!opts.mini) g += `<text x="${W - pr}" y="${(cy - 5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${money(fc.cushion, 0)} cushion</text>`;
    let marks = "";
    s.forEach((p, i) => {
      const pay = p.ev.some((e) => e.kind === 1), bill = p.ev.some((e) => e.kind === 0);
      const px = x(i), py = y(p.bal);
      if (pay) marks += `<path d="M${(px - 5).toFixed(1)} ${(py - 7).toFixed(1)} L${(px + 5).toFixed(1)} ${(py - 7).toFixed(1)} L${px.toFixed(1)} ${(py - 15).toFixed(1)} Z" fill="var(--ok)" stroke="var(--card)" stroke-width="2"/>`;
      if (bill) marks += `<path d="M${(px - 5).toFixed(1)} ${(py + 7).toFixed(1)} L${(px + 5).toFixed(1)} ${(py + 7).toFixed(1)} L${px.toFixed(1)} ${(py + 15).toFixed(1)} Z" fill="var(--red)" stroke="var(--card)" stroke-width="2"/>`;
    });
    const li = s.findIndex((p) => p.bal === fc.low);
    if (li >= 0) marks += `<circle cx="${x(li).toFixed(1)}" cy="${y(fc.low).toFixed(1)}" r="5" fill="var(--fg)" stroke="var(--card)" stroke-width="2"/>`;
    return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}" preserveAspectRatio="none" role="img" aria-label="Projected checking balance for the next 30 days, lowest ${money(fc.low)} on ${esc(fc.lowD.toDateString())}" ${opts.mini ? "" : 'id="fcChart"'} style="display:block;overflow:visible">
      ${defs}${g}<path d="${area}" fill="${pro ? `url(#fcA${sfx})` : "var(--accent)"}" opacity="${pro ? 1 : ".10"}"/><path d="${path}" fill="none" stroke="${pro ? `url(#fcL${sfx})` : "var(--accent)"}" stroke-width="${pro ? 2.6 : 2}" stroke-linejoin="round" stroke-linecap="round"/>${marks}
      ${opts.mini ? "" : `<line id="fcCross" x1="0" x2="0" y1="${pt}" y2="${Hh - pb}" stroke="var(--fg)" stroke-width="1" opacity="0"/>`}
    </svg>`;
  }
  const miniChart = (fc) => `<div aria-hidden="false">${chartSVG(fc, {mini: true, h: 70})}</div>`;

  function renderForecast(){
    const fc = forecast();
    const dshort = (d) => d.toLocaleString("en-US", {weekday: "short", month: "short", day: "numeric"});
    let html = `<div class="headrow"><div class="head"><span class="date">Forecast</span><h1>Next 30 days</h1></div>${helpBtn()}</div>`;

    html += `<section class="card" style="display:flex;flex-direction:column;gap:12px;position:relative">
      <div class="l1"><h2>Projected checking</h2><span class="sub">${esc(fc.live.n ? "from your balance + " + fc.live.n + " entries since" : "from your last balance")}</span></div>
      <div style="position:relative">${chartSVG(fc, {h: 210})}<div id="fcTip" class="fctip" hidden></div></div>
      <div class="legendrow"><span><svg width="12" height="10" aria-hidden="true"><path d="M1 9 L11 9 L6 1 Z" fill="var(--ok)"/></svg> Payday</span><span><svg width="12" height="10" aria-hidden="true"><path d="M1 1 L11 1 L6 9 Z" fill="var(--red)"/></svg> Bill due</span><span><svg width="18" height="10" aria-hidden="true"><line x1="0" x2="18" y1="5" y2="5" stroke="var(--warn)" stroke-dasharray="4 3"/></svg> Cushion</span><span><svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="var(--fg)"/></svg> Lowest point</span></div>

    </div>

      <div class="srcrow"><span class="muted">Paychecks coming in</span><b style="color:var(--ok)">+${money(fc.inSum)}</b></div>

      <p class="hint" style="margin:6px 0 0">Pocket money isn't in this projection. It's what you can safely add on top: currently up to ${money(fc.spendable)} before the lowest point hits your cushion.</p>
    </section>
    ${fc.missing.length || fc.paysMissing.length ? `<div class="notice soft"><span>Missing info: ${esc([...fc.missing.map((x) => x + " due day"), ...fc.paysMissing.map((x) => x + " payday")].join(", "))}. Add it in Plan for an accurate forecast.</span><button type="button" data-go="plan">Plan</button></div>` : ""}
    <div class="sechead"><h2>Every bill and payday</h2><span>balance after</span></div>
    <section class="daycard">${fc.ev.map((e) => `<div class="tlrow" style="grid-template-columns:86px minmax(0,1fr) auto"><span class="tld">${esc(dshort(e.d))}</span><span style="min-width:0"><div class="t1" style="font-size:14px">${esc(e.label)} <span style="font-weight:700;color:${e.amt >= 0 ? "var(--ok)" : "var(--fg)"}">${e.amt >= 0 ? "+" : "−"}${money(Math.abs(e.amt))}</span></div>${e.note ? `<div class="t2">${esc(e.note)}</div>` : ""}</span><span class="tla" style="color:${e.bal < fc.cushion ? "var(--red)" : "var(--muted)"};font-weight:600">${money(e.bal, 0)}</span></div>`).join("") || '<p class="empty">No bills or paychecks in the next 30 days.</p>'}</section>
    ${subsSection}
    <p class="foot">Gas and essentials are spread across each day. Paychecks marked "typical" use your typical amount from Plan.</p>`;
    app.innerHTML = html;
    const svg = document.getElementById("fcChart"), tip = document.getElementById("fcTip"), cross = document.getElementById("fcCross");
    if (svg){
      const n = fc.series.length;
      const show = (clientX) => {
        const r = svg.getBoundingClientRect();
        const vx = ((clientX - r.left) / r.width) * 340;
        const i = Math.max(0, Math.min(n - 1, Math.round(((vx - 44) / (340 - 44 - 8)) * (n - 1))));
        const p = fc.series[i];
        const px = 44 + (i / (n - 1)) * (340 - 52);
        cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("opacity", ".35");
        tip.hidden = false;
        tip.innerHTML = `<b>${esc(p.d.toLocaleString("en-US", {weekday: "short", month: "short", day: "numeric"}))}</b><div>End of day: <b>${money(p.bal)}</b></div>${p.ev.map((e) => `<div>${esc(e.label)} ${e.amt >= 0 ? "+" : "−"}${money(Math.abs(e.amt))}</div>`).join("")}`;
        const left = (px / 340) * r.width;
        tip.style.left = Math.max(0, Math.min(r.width - 170, left - 85)) + "px";
      };
      svg.addEventListener("pointermove", (e) => show(e.clientX));
      svg.addEventListener("pointerdown", (e) => show(e.clientX));
      svg.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("opacity", "0"); });
    }
  }

  // Reassurance line for an unpaid bill: is it covered by the projected balance, and does a paycheck land before it's due?
  function billNote(c, fc, k){
    const labels = isSubsCat(c) && S.subsList.length ? S.subsList.map((x) => x.name) : [c.name];
    const evs = fc.ev.filter((e) => e.kind === 0 && labels.includes(e.label) && monthKey(e.d) === k);
    if (!evs.length) return null;
    const ds = (d) => d.toLocaleString("en-US", {month: "short", day: "numeric"});
    const first = evs[0], lowBal = Math.min(...evs.map((e) => e.bal));
    const lastDue = evs[evs.length - 1].d;
    const pay = fc.ev.find((e) => e.kind === 1 && e.d <= lastDue);
    const when = evs.length > 1 ? `next: ${esc(first.label)} ${ds(first.d)}` : `due ${ds(first.d)}`;
    if (lowBal < 0) return {ok: false, text: `Heads up · ${when} · projected ${money(-lowBal)} short. Hold off on pocket money until your next paycheck is logged.`};
    if (pay) return {ok: true, text: `✓ Covered · ${when} · held back from Free to spend, and your ${esc(pay.label)} lands ${ds(pay.d)}`};
    return {ok: true, text: `✓ Covered · ${when} · already in checking and held back from Free to spend`};
  }
  // DoorDash heads-up: (1) this month's real paychecks vs the plan, (2) a short-term dip below the cushion.
  function doorDashCard(m, fc, k){
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const [yy, mm] = k.split("-").map(Number), monthEnd = new Date(yy, mm, 0);
    let pays = 0, paysLeft = 0;
    for (const i of incomes()){
      if (num(i.amount) <= 0) continue;
      pays += m.bySource[i.id] || 0;
      const np = nextPay(i); if (!np) continue;
      let d = np.d, g = 0;
      while (d <= monthEnd && g++ < 10){ pays += num(i.amount); paysLeft++; d = stepPay(d, i.freq); }
    }
    const planTotal = cats().filter((c) => c.group === "Needs" || c.group === "Wants").reduce((s, c) => s + num(c.budget), 0) + goalsMonthly();
    const gap = round2(planTotal - pays);
    const extra = Math.max(0, (m.bySource.other || 0) - (m.pocketExtra || 0));
    const dd = (m.tx || []).filter((t) => t.type === "income" && /door\s*dash/i.test(t.note || "")).reduce((s, t) => s + num(t.amount), 0);
    const ds = (d) => d.toLocaleString("en-US", {month: "short", day: "numeric"});
    const crunch = fc && fc.low < fc.cushion ? round2(fc.cushion - fc.low) : 0;
    const monthNeed = Math.max(0, round2(gap - extra));
    if (gap <= 0 && !crunch) return "";
    if (!crunch && monthNeed <= 0){
      return `<div class="notice soft" role="note"><span><b style="color:var(--ok)">✓ No DoorDash needed this month.</b> Paychecks come up ${money(gap)} short of your plan, but ${money(extra)} in side & extra income${dd ? ` (${money(dd)} DoorDash)` : ""} already covers it.</span></div>`;
    }
    const pct = gap > 0 ? Math.min(100, (extra / gap) * 100) : 0;
    let body = "";
    if (crunch) body += `<p class="sub" style="margin:0;color:var(--red)"><b>Soon:</b> drive about <b>${money(crunch)}</b> by ${esc(ds(fc.lowD))}. Without it, checking dips to ${money(fc.low)}, below your ${money(fc.cushion, 0)} cushion, before your next paycheck.</p>`;
    if (monthNeed > 0) body += `<p class="sub" style="margin:0"><b style="color:var(--fg)">This month:</b> your paychecks (${money(pays, 0)}) come up ${money(gap)} short of your plan (${money(planTotal, 0)}). Earn <b style="color:var(--warn)">${money(monthNeed)}</b> more by ${esc(ds(monthEnd))} to stay within budget.</p>
      <div class="bar" style="--gc:var(--ok)"><i style="width:${pct}%"></i></div>
      <span class="meta">${money(extra)} of ${money(gap)} covered by side & extra income${dd ? ` · ${money(dd)} from DoorDash` : ""}</span>`;
    return `<section class="card" aria-label="DoorDash heads-up" style="display:flex;flex-direction:column;gap:10px;border:1px solid ${crunch ? "rgba(240,138,128,.35)" : "rgba(235,203,122,.35)"}">
      <div class="l1"><h2>DoorDash heads-up</h2><span class="chipline ${crunch ? "warn" : "info"}">${crunch ? "Needed soon" : money(monthNeed) + " to go"}</span></div>
      ${body}
    </section>`;
  }
  function renderToday(){
    const now = new Date(), k = monthKey(now), loading = S.status === "loading";
    const m = monthStats(k);
    const p = m.funBudget ? (m.funSpent + m.funCover) / m.funBudget : 0;
    const exp = expectedMonthly();
    const acc = S.accounts;
    const fresh = acc && acc.checking != null && acc.asOf && (Date.now() - new Date(acc.asOf).getTime()) < 7 * 864e5;
    const fc = fresh && !loading ? forecast() : null;
    const cover = fc ? fc.spendable : null;
    let check = "";
    const spendNow = cover === null ? m.funLeft : Math.max(0, Math.min(m.funLeft, cover));
    const dshort = (d) => d.toLocaleString("en-US", {month: "short", day: "numeric"});
    if (!loading && m.funBudget > 0){
      if (!fc) check = `<span class="sub">Update your checking balance (Accounts below) so this number accounts for your bills and paydays.</span>`;
      else if (cover >= m.funLeft) check = `<span class="sub" style="color:var(--ok)">Your bills, gas, and goal transfers for the next 30 days are covered with your ${money(fc.cushion, 0)} cushion. Your whole pocket money budget is safe to spend.</span>`;
      else if (cover > 0) check = `<span class="sub">Spend up to this today and your balance still stays above your ${money(fc.cushion, 0)} cushion at its lowest point (${dshort(fc.lowD)}). <span style="color:var(--warn)">${money(m.funLeft - spendNow)} more opens up as paychecks land.</span></span>`;
      else check = `<span class="sub" style="color:var(--red)">Your balance is projected to dip to ${money(fc.low)} on ${dshort(fc.lowD)} before your next paycheck, below your ${money(fc.cushion, 0)} cushion. Pocket money opens up after payday.</span>`;
    }
    let dd = "";
    if (!loading && (m.funBudget > 0 || m.overs.length)){
      let tone = "muted", label = m.funBudget > 0 ? "Update balance" : "Heads-up";
      if (m.funBudget > 0 && fc){
        if (cover >= m.funLeft){ tone = "ok"; label = "Covered for 30d"; }
        else if (cover > 0){ tone = "warn"; label = "More after payday"; }
        else { tone = "red"; label = "Dips low " + dshort(fc.lowD); }
      }
      const chip = m.overs.length ? `<span class="schip">${m.overs.length} over budget</span>` : "";
      const overBox = m.overs.length ? `<div class="overflag" role="note"><b>Over budget this month${m.coverOver ? " · taken from pocket money" : ""}</b>${m.overs.map((o) => `<span class="orow"><span>${esc(o.name)}</span><span>+${money(o.amount)}</span></span>`).join("")}<span class="ofoot">${m.coverOver ? `Pocket money is ${money(m.overTotal)} lower so your plan stays balanced.` : `Not taken from pocket money (turned off in Plan). Keep ${money(m.overTotal)} in mind.`}</span></div>` : "";
      const food = m.funBudget > 0 ? `<span class="sub">So far this month: ate out ${m.foodN}× (${money(m.foodSpent)}) · random ${money(Math.max(0, m.funSpent - m.foodSpent))}</span>` : "";
      dd = `<details class="dd" data-dd ${S.ddOpen ? "open" : ""}><summary><span class="sdot" style="--c:var(--${tone})"></span><span class="stxt">${label}</span>${chip}</summary><div class="ddbody">${check}${overBox}${food}</div></details>`;
    }
    let html = `
      <div class="headrow"><div class="head"><span class="date">${esc(now.toLocaleString("en-US", {weekday: "long", month: "short", day: "numeric"}))}</span><h1>${greeting()}</h1></div>${helpBtn()}</div>
      ${loading ? "" : notices() + lastLoggedNotice(m)}
      <section class="card" aria-label="Free to spend" style="display:flex;flex-direction:column;gap:12px">
        <div class="hero">
          ${ringSVG(p)}
          <div class="txt">
            <span class="sub" style="font-size:14px">Free to spend right now</span>
            <span class="big ${m.funLeft < 0 ? "neg" : ""}">${loading ? "—" : money(m.funLeft < 0 ? m.funLeft : spendNow)}</span>
            <span class="sub">${loading ? "Loading your budget…" : m.funBudget <= 0 ? "Mark a category as Pocket money in Plan" : m.funLeft < 0 ? "Over your pocket money by " + money(-m.funLeft) : money(m.funLeft) + " pocket money budget left this month" + (m.pocketExtra ? " (incl. " + money(m.pocketExtra, 0) + " side income)" : "") + " · " + m.daysLeft + (m.daysLeft === 1 ? " day" : " days") + " to go"}</span>
          </div>
        </div>
        ${dd}
      </section>
      ${loading ? "" : doorDashCard(m, fc, k)}
      ${fc && (fc.missing.length || fc.paysMissing.length) ? `<div class="notice soft"><span>Your forecast is missing ${esc([...fc.missing.map((x) => x + " due day"), ...fc.paysMissing.map((x) => x + " payday")].join(", "))}. Add it in Plan so Free to spend is accurate.</span><button type="button" data-go="plan">Plan</button></div>` : ""}
      <div class="stats">
        <div class="stat"><span class="l">Paid in</span><span class="v">${money(m.incomeIn, 0)}</span></div>
        <div class="stat"><span class="l">Spent</span><span class="v">${money(m.spendSpent, 0)}</span></div>
        <div class="stat"><span class="l">To goals</span><span class="v">${money(m.saved, 0)}</span></div>
      </div>`;
    if (!loading){
      html += accountsCard();
      const ip = exp ? Math.min(100, (m.incomeIn / exp) * 100) : 0;
      html += `<section class="card" aria-label="Paychecks this month" style="display:flex;flex-direction:column;gap:10px">
        <div class="l1"><h2>Paychecks this month</h2><span class="amt">${money(m.incomeIn, 0)}<span class="muted" style="font-weight:500;font-size:13px"> of ~${money(exp, 0)}</span></span></div>
        <div class="bar" style="--gc:var(--ok)"><i style="width:${ip}%"></i></div>
        <div>${incomes().map((i) => `<div class="srcrow"><span>${esc(i.name || "Income")}</span><span class="r">${money(m.bySource[i.id] || 0, 0)} in · ${i.kind === "varies" ? "~" : ""}${money(num(i.amount) * (FREQ[i.freq] || FREQ.monthly)[1], 0)}/mo</span></div>`).join("")}${m.bySource.other ? `<div class="srcrow"><span>Other</span><span class="r">${money(m.bySource.other, 0)} in</span></div>` : ""}</div>
        <p class="sub" style="margin:0">${m.cash >= 0 ? `Unassigned cash from this month: <b style="color:var(--fg)">${money(m.cash)}</b> (paid in, minus spending and goal money).` : `<span style="color:var(--red)">You've spent ${money(-m.cash)} more than you've been paid this month.</span> Fine if it's coming from last month's money; watch it if not.`}</p>
      </section>`;
      html += `<div class="sechead"><h2>Categories</h2><span>left this month</span></div>`;
      for (const g of GROUPS){
        const list = cats().filter((c) => c.group === g);
        if (!list.length) continue;
        html += `<div class="gtitle"><span class="dot" style="--gc:${GC[g]}"></span>${g}</div><div class="list">`;
        for (const c of list){
          const isFun = roleOf(c) === "fun", firstFun = isFun && cats().find((x) => roleOf(x) === "fun") === c;
          const covered = firstFun ? m.funCover : 0;
          const ov = m.overs.find((o) => o.id === c.id);
          const b = num(c.budget), sp = m.spent[c.id] || 0, left = b - sp - covered;
          const q = b ? (sp + covered) / b : (sp > 0 ? 2 : 0);
          const isBill = roleOf(c) === "bill";
          const billPaid = isBill && b > 0 && sp >= b * 0.97;
          const notDue = isBill && !billPaid && (S.billSkip[k] || []).includes(c.id);
          // Spending categories: green under 60% used, yellow under 80%, red at 80% or more.
          const lvl = isBill ? "" : q >= 0.8 ? "bad" : q >= 0.6 ? "mid" : "good";
          const cls = billPaid ? "paid" : isBill ? (q > 1 ? "over" : "") : lvl === "bad" ? "over" : lvl === "mid" ? "warn" : "paid";
          const amtTxt = billPaid ? "Paid" : notDue ? "Not due" : money(left);
          const amtCls = billPaid ? "paidtxt" : notDue ? "muted" : isBill ? (left < 0 ? "neg" : "") : "lvl-" + lvl;
          let meta = billPaid ? `${money(sp)} paid this month${sp - b > 0.005 ? " · " + money(sp - b) + " more than budgeted" : ""}` : notDue ? `${money(b, 0)} · not due until next month` : `${money(sp)} of ${money(b, 0)}${isBill ? " · bill" : ""}`;
          if (isBill && !billPaid && !notDue && fc){
            const bn = billNote(c, fc, k);
            if (bn) meta += `<span class="billnote ${bn.ok ? "ok" : "short"}">${bn.text}</span>`;
          }
          if (ov && !billPaid) meta += ` · <span style="color:var(--red)">${money(ov.amount)} over</span>`;
          if (ov && m.coverOver) meta += ` · <span style="color:var(--warn)">taken from pocket money</span>`;
          if (covered > 0) meta += ` · <span style="color:var(--warn)">−${money(covered)} covering overspending</span>`;
          html += `<button type="button" class="catrow" data-log="${esc(c.id)}" aria-label="${esc(c.name)}: ${esc(amtTxt)}. Tap to log.">
            <span class="l1"><span class="name"><span class="dot" style="--gc:${GC[g]}"></span><span>${esc(c.name)}</span></span><span class="amt ${amtCls}">${amtTxt}</span></span>
            <span class="bar" style="--gc:${GC[g]}"><i class="${cls}" style="width:${Math.min(100, q * 100)}%"></i></span>
            <span class="meta">${meta}</span></button>`;
        }
        html += "</div>";
      }
      html += '<p class="foot">Tap a category to log a purchase in it</p>';
    }
    app.innerHTML = html;
  }

  // ---------------- accounts ----------------
  const asOfText = (iso) => { if (!iso) return ""; const days = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5); return days <= 0 ? "updated today" : days === 1 ? "updated yesterday" : "updated " + days + " days ago"; };
  function accountsCard(){
    const a = S.accounts;
    if (!a || (a.checking == null && a.savings == null)){
      return `<section class="card" aria-label="Accounts" style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px"><div><h2>Accounts</h2><div class="meta">Add your checking and savings balances</div></div><button type="button" class="pillbtn" data-accounts>Add</button></section>`;
    }
    const lb = liveBalances() || {checking: a.checking, savings: a.savings, n: 0};
    const rows = [["Checking", lb.checking], ["Savings", lb.savings]].filter(([, v]) => v != null);
    const total = rows.reduce((s, [, v]) => s + num(v), 0);
    const efund = lb.savings != null ? (S.goals.find((g) => g.id === "g-emergency") || S.goals.find((g) => /emergenc/i.test(g.name || ""))) : null;
    return `<section class="card" aria-label="Accounts" style="display:flex;flex-direction:column;gap:4px;padding:16px 18px">
      <div class="l1"><h2>Accounts</h2><button type="button" class="pillbtn ghost" data-accounts>Update</button></div>
      ${rows.map(([n, v]) => `<div class="srcrow"><span>${n}${lb.n ? ' <span class="muted" style="font-size:12px">est.</span>' : ""}</span><b>${money(num(v))}</b></div>`).join("")}
      ${efund ? `<div class="srcrow" style="padding-left:14px;border-left:2px solid var(--savings);margin-left:2px"><span>Emergency fund <span class="muted" style="font-size:12px">part of savings</span></span><b style="color:var(--savings)">${money(goalBalance(efund))}</b></div>` : ""}
      <div class="srcrow"><span class="muted">Total · ${esc(asOfText(a.asOf))}</span><b>${money(total)}</b></div>
      ${lb.n ? `<p class="hint" style="margin:4px 0 0">Estimated: your last bank balance plus ${lb.n} ${lb.n === 1 ? "entry" : "entries"} logged since. Update from your bank app to reset it.</p>` : ""}
    </section>`;
  }
  function accountsLine(inGoals){
    const a = S.accounts;
    if (!a || a.savings == null) return '<span class="sub">Add your savings balance (Today → Accounts) to see how much of it is assigned to goals.</span>';
    const free = num(a.savings) - inGoals;
    return `<span class="sub">Savings account ${money(num(a.savings))} · ${free >= 0 ? money(free) + " not in a goal yet" : `<span style="color:var(--warn)">goals are ${money(-free)} more than your savings account</span>`}</span>`;
  }
  function openAccounts(){
    const a = S.accounts || {};
    const {close, el} = sheet("Account balances", `
      <p class="sub" style="margin:0;font-size:14px">Copy the current balances from your bank app. Update them whenever you check, at least on your Sunday check-in.</p>
      <div><label class="lab" for="acChk">Checking</label><input class="field num" id="acChk" inputmode="decimal" value="${a.checking != null ? num(a.checking) : ""}" placeholder="$0"></div>
      <div><label class="lab" for="acSav">Savings</label><input class="field num" id="acSav" inputmode="decimal" value="${a.savings != null ? num(a.savings) : ""}" placeholder="$0"></div>

    el.querySelector("#acSave").onclick = async () => {
      const c = el.querySelector("#acChk").value.trim(), s = el.querySelector("#acSav").value.trim();
      const body = {checking: c === "" ? null : round2(num(c)), savings: s === "" ? null : round2(num(s)), asOf: new Date().toISOString()};

  function openBills(){
    const k = monthKey(new Date());
    const m = monthStats(k);
    const bills = cats().filter((c) => roleOf(c) === "bill");
    let skip = [...(S.billSkip[k] || [])];
    const row = (c) => {
      const left = Math.max(0, num(c.budget) - (m.spent[c.id] || 0));
      const paid = left === 0;
      return `<div class="splitrow" style="grid-template-columns:minmax(0,1fr) auto"><div style="min-width:0"><div class="t1">${esc(c.name)}</div><div class="t2">${paid ? "Paid this month" : money(left) + " still to pay"}</div></div>
        ${paid ? '<span class="chipline ok">Paid</span>' : `<div class="seg" role="group" aria-label="${esc(c.name)} due" style="flex:none"><button type="button" data-due="${esc(c.id)}" data-v="1" aria-pressed="${!skip.includes(c.id)}">Due</button><button type="button" data-due="${esc(c.id)}" data-v="0" aria-pressed="${skip.includes(c.id)}">Not this month</button></div>`}</div>`;

      <p class="sub" style="margin:0;font-size:14px">Bills marked Due are held back from your checking before Free to spend is checked. Mark one Not this month if it isn't coming out until next month. Once you log a bill's payment, it shows as Paid.</p>
      <div>${bills.map(row).join("") || '<p class="empty">No categories are marked Bill. Set roles in Plan.</p>'}</div>

      S.billSkip = {...S.billSkip, [k]: skip}; render(); close();
