<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17332f">
<meta name="robots" content="noindex">
<meta name="description" content="Offline fallback for Everyday Oddities.">
<title>You're offline | Everyday Oddities</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--ink:#17332f;--paper:#f8f7f1;--lime:#d9f36a;--muted:#5c6b62}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}.panel{width:min(100%,620px);padding:clamp(26px,6vw,54px);border:1px solid #d7ddd1;border-radius:18px;background:#fffef8;box-shadow:0 24px 70px #17332f12}.mark{display:inline-grid;place-items:center;width:48px;height:48px;margin-bottom:20px;border-radius:14px;background:var(--ink);color:var(--lime);font-weight:800;font-size:21px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--muted)}h1{font-size:clamp(32px,7vw,48px);line-height:1.08;letter-spacing:-.04em;margin:12px 0}p{color:var(--muted);max-width:48ch}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}.actions button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 16px;border-radius:7px;background:var(--ink);color:#fff;text-decoration:none;font-weight:650;font:inherit;cursor:pointer}.actions button.secondary{background:transparent;color:var(--ink);border:1px solid #b8c4b8}a,.action-button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 16px;border-radius:7px;background:var(--ink);color:#fff;text-decoration:none;font-weight:650;border:0;font:inherit;cursor:pointer}.secondary{background:transparent!important;color:var(--ink)!important;border:1px solid #b8c4b8!important}a:focus-visible,.action-button:focus-visible{outline:3px solid #789329;outline-offset:3px}.note{font-size:12px;margin-top:24px}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px}.lang{border:1px solid #b8c4b8;background:transparent;color:var(--ink);padding:8px 11px;border-radius:7px;font:inherit;font-size:12px;cursor:pointer}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#edf4e8;--paper:#10221d;--muted:#c0cec3}.panel{background:#19332a;border-color:#355047}.mark{background:#d9f36a;color:#17332f}a{background:#d9f36a;color:#17332f}a.secondary{color:#edf4e8;border-color:#53695c}}
</style>
</head>
<body>
<main class="panel">
<div class="topline"><div class="mark" aria-hidden="true">eo</div><button class="lang" id="language-toggle" type="button" aria-label="Switch language">हिंदी</button></div>
<div class="eyebrow" data-en="EVERYDAY ODDITIES" data-hi="एवरीडे ऑडिटीज़">EVERYDAY ODDITIES</div>
<h1 data-en="Curiosity doesn’t need to stop." data-hi="जिज्ञासा रुकनी नहीं चाहिए।">Curiosity doesn’t need to stop.</h1>
<p data-en="You’re offline, and this page isn’t saved on this device yet. Reconnect to open it, or return to a page you’ve already visited." data-hi="आपका इंटरनेट बंद है और यह पेज अभी इस डिवाइस पर सेव नहीं है। इसे खोलने के लिए इंटरनेट से जुड़ें या पहले देखा हुआ पेज खोलें।">You’re offline, and this page isn’t saved on this device yet. Reconnect to open it, or return to a page you’ve already visited.</p>
<div class="actions"><a href="index.html" data-en="Go to homepage" data-hi="होमपेज खोलें">Go to homepage</a><a class="secondary" href="explore.html" data-en="Explore stories" data-hi="कहानियाँ देखें">Explore stories</a><a class="secondary" href="experiments.html" data-en="Try an experiment" data-hi="एक प्रयोग करें">Try an experiment</a><button class="action-button secondary" id="retry-button" type="button" data-en="Try again" data-hi="फिर कोशिश करें">Try again</button></div>
<p class="note" data-en="Tip: previously visited pages may still be available offline." data-hi="सुझाव: पहले खोले गए पेज ऑफ़लाइन भी उपलब्ध हो सकते हैं।">Tip: previously visited pages may still be available offline.</p>
</main>
<script>
(()=>{const root=document.documentElement;const button=document.getElementById("language-toggle");function setLanguage(lang){const chosen=lang==="hi"?"hi":"en";root.lang=chosen;document.querySelectorAll("[data-en][data-hi]").forEach(el=>{el.textContent=el.dataset[chosen]});button.textContent=chosen==="en"?"हिंदी":"English";button.setAttribute("aria-label",chosen==="en"?"हिंदी में बदलें":"Switch to English");try{localStorage.setItem("eo-language",chosen)}catch(e){}}let lang="en";try{lang=localStorage.getItem("eo-language")||"en"}catch(e){}setLanguage(lang);button.addEventListener("click",()=>setLanguage(root.lang==="en"?"hi":"en"));document.getElementById("retry-button").addEventListener("click",()=>location.reload());})();
</script>
</body>
</html>
