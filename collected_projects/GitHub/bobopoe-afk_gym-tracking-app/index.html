          <button class="btn ghost today-pick-del" data-del-session="${session.id}" title="Delete the session shown">Delete session</button>
        </span>
      </div>`;

    // Already got actual sets logged for today — this was recorded as a completed
    // workout, so show what was recorded rather than generating a suggestion pool.
    if(sessionHasActual(session)){
      const retroWarning = checkInterference(session);
      const loggedEx = DATA.exercises.filter(e=>cellSets(e.id+'|'+session.id).length);
      const totalSets = loggedEx.reduce((sum,e)=>sum+cellSets(e.id+'|'+session.id).length,0);
      const rowsHtml = loggedEx.map(e=>`
        <div class="today-row" style="grid-template-columns:1fr 2fr;">
          <div class="today-name">${escapeHtml(e.name)}</div>
          <div class="today-meta" style="font-family:'IBM Plex Mono',monospace;color:var(--text-dim);">${escapeHtml(cellText(e.id+'|'+session.id))}</div>
        </div>`).join('');
      return `<div class="featured-card">
        <p class="featured-eyebrow">TODAY · ${CATS[session.cat].label.toUpperCase()} · LOGGED${todaySessions.length>1?' (+'+(todaySessions.length-1)+' more today)':''}</p>
        <h3 class="featured-name">Session logged</h3>
        ${sessionPicker}
        <p class="featured-desc" style="margin-bottom:12px;">${loggedEx.length} exercise${loggedEx.length===1?'':'s'} · ${totalSets} set${totalSets===1?'':'s'}${formatVolume(sessionVolumeKg(session.id))?` · ${formatVolume(sessionVolumeKg(session.id))} total volume`:''}</p>
        ${retroWarning?`<p class="today-warning">${escapeHtml(retroWarning)}</p>`:''}
        <div class="today-rows">${rowsHtml}</div>
        <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
          <button class="btn ghost" id="editTodayLogBtn">Edit in Log tab</button>
          ${todaySessions.length>1 ? `<button class="btn ghost" id="viewAllTodayBtn">View all ${todaySessions.length} sessions today</button>` : ''}
        </div>
        ${insightBlock}${neglectedBlock}
      </div>`;
    }

    const warning = checkInterference(session);
    const pool = buildPoolForSession(session, sortedSessions, 6, 2);
    const priorSessions = sortedSessions.filter(s=>s.id!==session.id);
    const loggedCount = pool.filter(e=>cellSets(e.id+'|'+session.id).length).length;
    const pct = pool.length ? Math.round((loggedCount/pool.length)*100) : 0;
    const allDone = pool.length>0 && loggedCount===pool.length;

    // headline target/rationale: prefer this session's planned targets, fall back
    // to the deterministic progression suggestion if nothing was planned ahead
    const headlineEx = pool[0];
    let headlineTarget = '', headlineWhy = '', headlineHint = '';
    if(headlineEx){
      const planned = targetText(session, headlineEx.id);
      if(planned){ headlineTarget = planned; headlineWhy = 'from your plan for today'; headlineHint = progressionHint(headlineEx, parseSetsFromText(planned)); }
      else {
        const d = deterministicSuggestionFor(headlineEx.id, priorSessions);
        headlineTarget = d.suggestion; headlineWhy = d.note; headlineHint = d.hint;
      }
    }
    let headlineLast = '';
    for(let i=priorSessions.length-1;i>=0;i--){
      const t = cellText(headlineEx.id+'|'+priorSessions[i].id);
      if(t){ headlineLast = t; break; }
    }

    const rows = pool.map(e=>{
      const loggedToday = cellText(e.id+'|'+session.id);
      let lastText = '';
      for(let i=priorSessions.length-1;i>=0;i--){
        const t = cellText(e.id+'|'+priorSessions[i].id);
        if(t){ lastText = t; break; }
      }
      const planned = targetText(session, e.id);
      let target = planned, note = 'from your plan for today', hint = '';
      if(!planned){
        const d = deterministicSuggestionFor(e.id, priorSessions);
        target = d.suggestion; note = d.note; hint = d.hint + (d.warning ? ' · ramp: see note' : '');
      } else {
        hint = progressionHint(e, parseSetsFromText(target));
      }
      return `<div class="today-row">
        <div class="today-name">${escapeHtml(e.name)}</div>
        <div class="today-meta"><span>Last</span>${lastText? escapeHtml(lastText) : '—'}</div>
        <div class="today-meta"><span>Target</span>${target? escapeHtml(target): '—'}${target?`<div class="today-why">${escapeHtml(note)}</div>${hint?`<div class="today-why" style="font-style:normal;color:var(--text-dim);">${escapeHtml(hint)}</div>`:''}`:''}</div>
        <input type="text" class="today-input" value="${escapeHtml(loggedToday).replace(/"/g,'&quot;')}" data-today-ex="${e.id}" data-today-sess="${session.id}" placeholder="log it…">
      </div>`;
    }).join('');

    return `<div class="featured-card">
      <p class="featured-eyebrow">TODAY · ${CATS[session.cat].label.toUpperCase()}${todaySessions.length>1?' (+'+(todaySessions.length-1)+' more today)':''}</p>
      <h3 class="featured-name">${CATS[session.cat].label}</h3>
      ${sessionPicker}
      <p class="featured-desc" style="margin-bottom:12px;">${pool.length} exercise${pool.length===1?'':'s'} · ${loggedCount}/${pool.length} complete</p>
      ${warning?`<p class="today-warning">${escapeHtml(warning)}</p>`:''}
      ${headlineTarget ? `<div class="today-meta" style="margin-bottom:14px;">
        <span>Last</span>${headlineLast?escapeHtml(headlineLast):'—'} → <span style="margin-left:6px;">Today</span> ${escapeHtml(headlineTarget)}
        <div class="today-why">${escapeHtml(headlineWhy)}</div>
        ${headlineHint?`<div class="today-why" style="font-style:normal;color:var(--text-dim);">${escapeHtml(headlineHint)}</div>`:''}
      </div>` : ''}
      <button class="btn primary" id="enterWorkoutBtn" data-workout-sess="${session.id}" style="width:100%;padding:14px;font-size:14px;">${allDone ? 'Review workout' : 'Start workout'}</button>
      <div class="session-progress" style="margin-top:16px;">
        <div class="session-progress-label">${loggedCount}/${pool.length} exercises complete</div>
        <div class="session-progress-bar"><div class="session-progress-fill" style="width:${pct}%"></div></div>
      </div>
      <details style="margin-top:14px;">
        <summary style="cursor:pointer;font-size:12.5px;color:var(--text-faint);">Edit exercises manually instead</summary>
        <div class="today-rows" style="margin-top:10px;">${rows}</div>
      </details>
      ${insightBlock}${neglectedBlock}
    </div>`;
  }

  const futureSessions = sortedSessions.filter(s=>s.date>todayStr);
  const lastAnyByCat = {};
  CAT_ORDER.forEach(c=>{
    const s = sortedSessions.filter(s=>s.cat===c && s.date<=todayStr).slice(-1)[0];
    if(s) lastAnyByCat[c] = s;
  });
  const repeatButtons = Object.keys(lastAnyByCat).length ? `
    <div style="margin:12px 0 4px;">
      <p class="modal-sub" style="margin:0 0 8px;">Or repeat your last session, with progression applied:</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${Object.keys(lastAnyByCat).map(c=>`<button class="btn ghost" data-repeat-cat="${c}"><span class="dot" style="background:${CATS[c].color};display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;"></span>${CATS[c].label}</button>`).join('')}
      </div>
    </div>` : '';
  if(futureSessions.length){
    const next = futureSessions[0];
    const days = Math.round((new Date(next.date)-new Date(todayStr))/86400000);
    return `<div class="featured-card">
      <p class="featured-eyebrow">Nothing logged today</p>
      <h3 class="featured-name">Next planned: ${CATS[next.cat].label}, ${days===1?'tomorrow':'in '+days+' days'}</h3>
      <button class="btn ghost" id="quickAddTodayBtn">+ Log today's session</button>
      ${repeatButtons}
      ${insightBlock}${neglectedBlock}
    </div>`;
  }
  return `<div class="featured-card">
    <p class="featured-eyebrow">Today</p>
    <h3 class="featured-name">No session logged today</h3>
    <button class="btn ghost" id="quickAddTodayBtn">+ Log today's session</button>
    ${repeatButtons}
    ${insightBlock}${neglectedBlock}
  </div>`;
}

    };

  });
}

/* ---------- cell editing: one delegated listener instead of one-per-cell ---------- */
let cellDelegationBound = false;
function bindCellDelegationOnce(){
  if(cellDelegationBound) return;
  cellDelegationBound = true;
  const appEl = document.getElementById('app');
  appEl.addEventListener('click', (e)=>{
    const td = e.target.closest('td.cell');
    if(td && !td.querySelector('input')) openCellEditor(td);
  });
  appEl.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter' && e.key!==' ') return;
    const td = e.target.closest('td.cell');
    if(td && !td.querySelector('input')){ e.preventDefault(); openCellEditor(td); }
  });
}
function openCellEditor(td){
  const exId = td.dataset.ex, sessId = td.dataset.sess;
  const key = exId+'|'+sessId;
  const currentSets = cellSets(key);
  const currentText = currentSets.length ? setsToText(currentSets) : '';
  td.innerHTML = `<input type="text" value="${currentText.replace(/"/g,'&quot;')}" placeholder="e.g. 50kg 5 @2, 60kg 5 @1">`;
  const input = td.querySelector('input');
  input.focus(); input.select();
  let committed = false;
  const commit = ()=>{
    if(committed) return; committed = true;
    const raw = input.value.trim();
    const newSets = tagSets(raw ? parseSetsFromText(raw) : [], machineForNewSets(key));
    const v = newSets.length ? setsToText(newSets) : '';
    const changed = v !== currentText;
    if(newSets.length){ DATA.cells[key] = newSets; } else { delete DATA.cells[key]; }
    scheduleSave();
    td.textContent = v || '';
    td.className = 'cell ' + (v?'':'empty');
    if(changed) updateStatRow();
    if(changed && currentText){
      showToast('Updated.', ()=>{
        if(currentSets.length){ DATA.cells[key]=currentSets; } else { delete DATA.cells[key]; }
        scheduleSave(); render();
      });
    }
    if(changed && newSets.length){
      const ex = DATA.exercises.find(e=>e.id===exId);
      checkForPR(exId, ex ? ex.name : exId, sessId);
      warnIfOddReps(exId, sessId);
    }
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      e.stopPropagation(); e.preventDefault();
      commit(); moveToCell(td, 'down');
    } else if(e.key==='Tab'){
      e.stopPropagation(); e.preventDefault();
      commit(); moveToCell(td, e.shiftKey?'left':'right');
    } else if(e.key==='Escape'){
      e.stopPropagation();
      input.value = currentText;
      input.blur();
    }
  });
}
function moveToCell(fromTd, direction){
  let target = null;
  if(direction==='right'){ const n=fromTd.nextElementSibling; if(n && n.classList.contains('cell')) target=n; }
  if(direction==='left'){ const p=fromTd.previousElementSibling; if(p && p.classList.contains('cell')) target=p; }
  if(direction==='down'){
    const row = fromTd.parentElement;
    const idx = Array.from(row.children).indexOf(fromTd);
    const nextRow = row.nextElementSibling;
    if(nextRow){ const cand = nextRow.children[idx]; if(cand && cand.classList.contains('cell')) target=cand; }
  }
  if(target) openCellEditor(target);
}

/* ---------- delete with confirm + undo ---------- */
/** Restores a binned session, putting its sets back exactly as they were. */
function restoreDeletedSession(entryId){
  const idx = (DATA.trash||[]).findIndex(t=>t.entryId===entryId);
  if(idx<0) return false;
  const entry = DATA.trash[idx];
  // don't collide with a session id that's since been reused
  let id = entry.session.id;
  if(DATA.sessions.some(s=>s.id===id)) id = makeSessionId(entry.session.date);
  const remap = id!==entry.session.id;
  DATA.sessions.push(Object.assign({}, entry.session, {id}));
  Object.entries(entry.cells).forEach(([k,v])=>{
    const exId = k.slice(0, k.lastIndexOf('|'));
    DATA.cells[exId+'|'+id] = v;
  });
  DATA.trash.splice(idx,1);
  scheduleSave();
  return true;
}

async function deleteSession(id){
  const session = DATA.sessions.find(s=>s.id===id);
  const loggedCount = session ? DATA.exercises.filter(e=>cellSets(e.id+'|'+id).length).length : 0;
  const warning = loggedCount
    ? `Delete this session? It has ${loggedCount} exercise${loggedCount===1?'':'s'} logged against it.\n\nIt'll go to Recently deleted, so you can still get it back.`
    : "Delete this session?\n\nIt'll go to Recently deleted, so you can still get it back.";
  const ok = await confirmDialog(warning, 'Delete');
  if(!ok) return;
  const removedSession = DATA.sessions.find(s=>s.id===id);
  const removedCells = {};
  Object.keys(DATA.cells).forEach(k=>{ if(k.endsWith('|'+id)){ removedCells[k]=DATA.cells[k]; delete DATA.cells[k]; } });
  DATA.sessions = DATA.sessions.filter(s=>s.id!==id);
  // if the Today card was pinned to this session, fall back to whatever's left
  if(activeTodaySessionId===id) activeTodaySessionId = null;

  // keep a durable copy — the undo toast only lasts a few seconds, which is no help
  // if you notice the mistake later
  if(!Array.isArray(DATA.trash)) DATA.trash = [];
  const entryId = 'trash-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  DATA.trash.unshift({
    entryId,
    deletedAt: new Date().toISOString(),
    session: removedSession,
    cells: removedCells,
    exerciseCount: Object.keys(removedCells).length,
  });
  DATA.trash = DATA.trash.slice(0,30);

  scheduleSave(); render();
  showToast('Session deleted — recoverable from Recently deleted.', ()=>{
    restoreDeletedSession(entryId);
    render();
  });
}

      if(machineChanged) rebuildPRRecordsFromHistory();
      scheduleSave(); render();
    });
    closeModal();
  });
}

/**
 * Merges every session on a given date into a single session.
 *
 * Same-day sessions were historically an artefact of only being able to log one
 * category at a time; a session can hold exercises from any category now, so the
 * split serves no purpose. Logged sets and planned targets are folded into the
 * earliest session on that date. If both sessions recorded the same exercise, their
 * sets are concatenated rather than one overwriting the other. The surviving
 * session takes whichever category contributed the most logged exercises.
 *
 * Returns a restore function (for undo), or null if there was nothing to merge.
 */
function mergeSessionsOnDate(dateStr){
  const onDate = DATA.sessions.filter(s=>s.date===dateStr);
  if(onDate.length<2) return null;

  const snapshot = {
    sessions: DATA.sessions.map(s=>Object.assign({}, s, {targets: Object.assign({}, s.targets||{})})),
    cells: Object.assign({}, DATA.cells),
  };

  const keep = onDate[0];
  const absorbed = onDate.slice(1);
  keep.targets = keep.targets || {};

  // tally which category actually contributed the most work, for the merged label
  const catCounts = {};
  onDate.forEach(sess=>{
    const n = DATA.exercises.filter(e=>cellSets(e.id+'|'+sess.id).length).length;
    catCounts[sess.cat] = (catCounts[sess.cat]||0) + n;
  });

  absorbed.forEach(sess=>{
    DATA.exercises.forEach(ex=>{
      const fromKey = ex.id+'|'+sess.id, toKey = ex.id+'|'+keep.id;
      const fromSets = DATA.cells[fromKey];
      if(fromSets && fromSets.length){
        DATA.cells[toKey] = (DATA.cells[toKey]||[]).concat(fromSets);
      }
      delete DATA.cells[fromKey];
    });
    Object.entries(sess.targets||{}).forEach(([exId, sets])=>{
      if(!keep.targets[exId]) keep.targets[exId] = sets;
    });
  });

  const dominant = Object.entries(catCounts).sort((a,b)=>b[1]-a[1])[0];
  if(dominant && dominant[1]>0) keep.cat = dominant[0];
  const d = new Date(dateStr+'T00:00:00');
  keep.label = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});

  const absorbedIds = new Set(absorbed.map(s=>s.id));
  DATA.sessions = DATA.sessions.filter(s=>!absorbedIds.has(s.id));
  scheduleSave();

  return ()=>{
    DATA.sessions = snapshot.sessions;
    DATA.cells = snapshot.cells;
    scheduleSave();
    render();
  };
}

/** Dates that currently hold more than one session. */
function datesWithMultipleSessions(){
  const byDate = {};
  DATA.sessions.forEach(s=>{ byDate[s.date] = (byDate[s.date]||0)+1; });
  return Object.keys(byDate).filter(d=>byDate[d]>1).sort();
}

/** Reschedules a session to a new date. The session's id stays the same (it's just
 * a key, not tied to the date), so all its logged cells and planned targets move
 * with it automatically. */
function moveSessionDate(sessionId, newDate){
  const session = DATA.sessions.find(s=>s.id===sessionId);
  if(!session || !newDate) return false;
  session.date = newDate;
  const d = new Date(newDate+'T00:00:00');
  const isDup = DATA.sessions.some(s=>s.id!==sessionId && s.date===newDate);
  session.label = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + (isDup ? ' (2nd)' : '');
  scheduleSave();
  return true;
}

      const dayVolume = sessList.reduce((sum,s)=>sum+sessionVolumeKg(s.id),0);

        + (formatVolume(dayVolume) ? ' · ' + formatVolume(dayVolume) : '');
      const tags = sessList.map((s,i)=>`<span class="cal-tag" style="background:${CATS[s.cat].color}; left:${8+i*9}px;"></span>`).join('');
      cells += `<div class="cal-day has-session ${isToday?'today':''}" style="box-shadow:inset 0 0 0 1.5px ${CATS[primary.cat].color};" data-cal-date="${dateStr}" title="${escapeHtml(tooltip)}">
        <span class="cal-daynum">${d}</span>
        ${runDot}
        ${tags}
      </div>`;
    } else {
      cells += `<div class="cal-day ${isToday?'today':''}" data-cal-date="${dateStr}" title="Nothing planned yet"><span class="cal-daynum">${d}</span>${runDot}</div>`;
    }
  }

  const legend = CAT_ORDER.map(c=>`<span class="cal-legend-item"><span class="dot" style="background:${CATS[c].color}"></span>${CATS[c].label}</span>`).join('')
    + `<span class="cal-legend-item" style="margin-left:14px;">${Object.entries(RUN_TYPES).map(([k,v])=>`<span class="dot" style="background:${v.color}"></span>`).join('')} running plan</span>`;

  app.innerHTML = `
    <div class="cal-controls">
      <button class="btn ghost" id="calPrev">‹</button>
      <div class="cal-month">${monthName}</div>
      <button class="btn ghost" id="calNext">›</button>
      <button class="btn ghost" id="calToday">Today</button>
    </div>
    <div class="cal-weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">${legend}</div>
  `;

  document.getElementById('calPrev').addEventListener('click', ()=>{ calCursor.month--; if(calCursor.month<0){calCursor.month=11; calCursor.year--;} render(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ calCursor.month++; if(calCursor.month>11){calCursor.month=0; calCursor.year++;} render(); });
  document.getElementById('calToday').addEventListener('click', ()=>{ const d=new Date(); calCursor={year:d.getFullYear(), month:d.getMonth()}; render(); });
  document.querySelectorAll('[data-cal-date]').forEach(el=>el.addEventListener('click', ()=>{
    openDayModal(el.dataset.calDate);
  }));
}

function openDayModal(dateStr){
  const sessions = DATA.sessions.filter(s=>s.date===dateStr);
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  const run = (DATA.runSchedule||[]).find(r=>r.date===dateStr);
  const dateLabel = new Date(dateStr+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});

  let blocks;
  if(sessions.length){
    blocks = sessions.map(session=>{
      const entries = DATA.exercises.filter(e=>cellSets(e.id+'|'+session.id).length).map(e=>({id:e.id, name:e.name, sets:cellSets(e.id+'|'+session.id)}));
      const totalSets = entries.reduce((sum,e)=>sum+e.sets.length,0);
      const status = sessionStatus(session);
      const STATUS_PILL_META = {
        planned: {label:'Planned', style:''},
        'in-progress': {label:'In progress', style:'border-color:var(--accent);color:var(--text);'},
        completed: {label:'Completed', style:'border-color:var(--accent);color:var(--text);'},
        missed: {label:'Missed — nothing planned or logged', style:'border-color:var(--accent);color:var(--text);'},
      };
      const statusMeta = STATUS_PILL_META[status] || STATUS_PILL_META.planned;
      const statusPill = `<span class="cat-pill" style="${statusMeta.style}">${statusMeta.label}</span>`;
      // Exercises planned for this session but not yet logged — shown whenever
      // they exist, independent of whether OTHER exercises are already done.
      // Logging one exercise must never make the rest of the plan disappear.
      const plannedEntries = DATA.exercises
        .filter(e=>targetSets(session, e.id).length && !cellSets(e.id+'|'+session.id).length)
        .map(e=>({id:e.id, name:e.name, text:targetText(session, e.id)}));
      const plannedHtml = plannedEntries.map(e=>`
            <div style="margin-bottom:12px; display:flex; align-items:baseline; gap:10px;">
              <div style="flex:1;">
                <div style="font-weight:600;font-size:13px;">${escapeHtml(e.name)}</div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-faint);">${escapeHtml(e.text)}</div>
              </div>
              <button class="btn ghost" data-remove-planned="${session.id}::${e.id}" style="padding:3px 8px;font-size:9.5px;">Remove</button>
            </div>`).join('');
      const canStillPlan = status==='planned' || status==='in-progress';
      const addPlannedPickerHtml = canStillPlan ? `
        <div style="margin-top:10px;">
          <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Add an exercise to this plan</div>
          <div class="ex-picker" id="addPlannedExPicker-${session.id}">${exercisePickerHTML('Type to search…')}</div>
        </div>` : '';
      const loggedHtml = entries.length ? entries.map(e=>`
          <div style="margin-bottom:12px; display:flex; align-items:baseline; gap:10px;">
            <div style="flex:1;">
              <div style="font-weight:600;font-size:13px;">${escapeHtml(e.name)}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);">${escapeHtml(setsToText(e.sets))}</div>
            </div>
            <button class="btn ghost" data-edit-entry="${session.id}::${e.id}" style="padding:3px 8px;font-size:9.5px;">Edit</button>
          </div>`).join('') : '';
      const plannedSectionHtml = plannedEntries.length
        ? `<p class="modal-sub" style="margin:${entries.length?'14px':'0'} 0 8px;">Planned, not performed yet:</p>${plannedHtml}`
        : '';
      const nothingAtAllHtml = (!entries.length && !plannedEntries.length)
        ? (canStillPlan ? '<p class="calc-none">Nothing planned yet.</p>' : '<p class="calc-none">Nothing logged for this session yet.</p>')
        : '';
      return `<div style="margin-bottom:22px;">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <div class="cat-pill"><span class="dot" style="background:${CATS[session.cat].color}"></span>${CATS[session.cat].label} · ${entries.length} exercise${entries.length===1?'':'s'} · ${totalSets} set${totalSets===1?'':'s'}${formatVolume(sessionVolumeKg(session.id))?` · ${formatVolume(sessionVolumeKg(session.id))}`:''}</div>
            ${statusPill}
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn primary" data-open-day-session="${session.id}" title="Open to edit, add or swap exercises" style="padding:4px 10px;font-size:11px;">Open</button>

  } else {

      </div>`
    : `<div style="margin-bottom:16px;"><button class="btn ghost" id="addDayRunBtn">Schedule a run</button></div>`;

  const m = openModal(`
    <div class="modal">
      <button class="modal-close" id="mClose">&times;</button>
      <h2>${dateLabel}</h2>
      ${runBlock}
      ${blocks}
      <div class="modal-actions">
        ${sessions.length>1 ? `<button class="btn ghost" id="mergeDayBtn">Merge into one session</button>` : ''}
        ${sessions.length ? `<button class="btn primary" id="goLog">Open in Log</button>` : `<button class="btn primary" id="addDaySessBtn">+ Add session</button>`}
      </div>
    </div>`);
  m.querySelector('#mClose').addEventListener('click', closeModal);
  const mergeDayBtn = m.querySelector('#mergeDayBtn');
  if(mergeDayBtn) mergeDayBtn.addEventListener('click', ()=>{

    if(restore){
      showToast('Merged into a single session.', ()=>{ restore(); openDayModal(dateStr); });
      render();

  const moveDayRunBtn = m.querySelector('#moveDayRunBtn');
  if(moveDayRunBtn) moveDayRunBtn.addEventListener('click', ()=>{
    closeModal();
    openMoveRunModal(dateStr, (landedOn)=>{ render(); openDayModal(landedOn); });
  });
  const delDayRunBtn = m.querySelector('#delDayRunBtn');
  if(delDayRunBtn) delDayRunBtn.addEventListener('click', ()=>{
    DATA.runSchedule = (DATA.runSchedule||[]).filter(r=>r.date!==dateStr);
    scheduleSave();
    closeModal();
    openDayModal(dateStr);
  });
  const addDayRunBtn = m.querySelector('#addDayRunBtn');
  if(addDayRunBtn) addDayRunBtn.addEventListener('click', ()=>{
    closeModal();
    openAddRunModal(dateStr, ()=>openDayModal(dateStr));
  });
  if(sessions.length){
    m.querySelector('#goLog').addEventListener('click', ()=>{ closeModal(); currentTab='log'; activeCat=sessions[0].cat; render(); });
      m.querySelectorAll('[data-edit-entry]').forEach(btn=>btn.addEventListener('click', ()=>{
      const [sessId, exId] = btn.dataset.editEntry.split('::');
      closeModal();
      openEditEntryModal(sessId, exId);
    }));
  m.querySelectorAll('[data-save-template]').forEach(btn=>btn.addEventListener('click', ()=>{
      const session = sessions.find(s=>s.id===btn.dataset.saveTemplate);
      saveSessionAsTemplate(btn.dataset.saveTemplate, CATS[session.cat].label+' day');
    }));
    m.querySelectorAll('[data-open-day-session]').forEach(btn=>btn.addEventListener('click', ()=>{
      const sessId = btn.dataset.openDaySession;
      closeModal();
      openWorkoutMode(sessId);
    }));
    m.querySelectorAll('[data-repeat-day-session]').forEach(btn=>btn.addEventListener('click', ()=>{
      const sessId = btn.dataset.repeatDaySession;
      closeModal();
      planSpecificSession(sessId);
    }));
    m.querySelectorAll('[data-copy-day-session]').forEach(btn=>btn.addEventListener('click', ()=>{
      const session = sessions.find(s=>s.id===btn.dataset.copyDaySession);
      copySessionText(session);
    }));
    m.querySelectorAll('[data-move-day-session]').forEach(btn=>btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      openMoveSessionModal(btn.dataset.moveDaySession, (newDate)=>openDayModal(newDate));
    }));
    m.querySelectorAll('[data-del-day-session]').forEach(btn=>btn.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const sessId = btn.dataset.delDaySession;
      closeModal();
      await deleteSession(sessId);
      // reopen the day view if the session is still there (deletion was cancelled)
      // or if another session still remains on this date
      if(DATA.sessions.some(s=>s.date===dateStr)) openDayModal(dateStr);
    }));
    // Sessions with something still only planned: let the plan itself be edited
    // before it's done — whether nothing's logged yet, or the session is already
    // in progress with more exercises still to come.
    m.querySelectorAll('[data-remove-planned]').forEach(btn=>btn.addEventListener('click', ()=>{
      const [sessId, exId] = btn.dataset.removePlanned.split('::');
      const session = sessions.find(s=>s.id===sessId);
      if(!session) return;
      if(session.targets) delete session.targets[exId];
      scheduleSave();
      openDayModal(dateStr);
    }));
    sessions.forEach(session=>{
      const st = sessionStatus(session);
      if(st!=='planned' && st!=='in-progress') return;
      const picker = m.querySelector(`#addPlannedExPicker-${session.id}`);
      if(!picker) return;
      const plannedIds = DATA.exercises.filter(e=>targetSets(session, e.id).length).map(e=>e.id);
      wireExercisePicker(picker, buildExerciseCandidates(plannedIds), (exId)=>{
        session.targets = session.targets || {};
        if(!session.targets[exId]){
          const { suggestion } = deterministicSuggestionFor(exId, sortedSessions.filter(x=>x.id!==session.id));
          session.targets[exId] = suggestion ? parseSetsFromText(suggestion) : [];
        }
        session.excluded = (session.excluded||[]).filter(id=>id!==exId);
        scheduleSave();
        openDayModal(dateStr);
      });
    });
  } else {
    const addBtn = m.querySelector('#addDaySessBtn');
    if(addBtn) addBtn.addEventListener('click', ()=>{

      // past/today -> logging what happened; future -> planning ahead
      if(dateStr > todayStr) openPlanSessionModal(undefined, dateStr);
      else openLogSessionModal(dateStr);
    });
  }
}

/* ============================= AI SUGGESTIONS (shared) ============================= */
function recencyRank(exercises, sortedSessions){
  return exercises.map(e=>{
    let lastDate = null;
    for(let i=sortedSessions.length-1;i>=0;i--){
      if(DATA.cells[e.id+'|'+sortedSessions[i].id]){ lastDate = sortedSessions[i].date; break; }
    }
    return {e, lastDate};
  }).sort((a,b)=>{
    if(a.lastDate && b.lastDate) return b.lastDate.localeCompare(a.lastDate);
    if(a.lastDate) return -1;
    if(b.lastDate) return 1;
    return 0;
  }).map(x=>x.e);
}

/** Claude access for a published page. Null when unavailable — every caller
 *  degrades to the deterministic, offline behaviour rather than failing. */
let SAMPLE = undefined;
async function getSample(){
  if(SAMPLE !== undefined) return SAMPLE;
  try{
    SAMPLE = (typeof window.claude !== 'undefined' && window.claude.use)
      ? await window.claude.use('sample') : null;
  }catch(e){ SAMPLE = null; }
  return SAMPLE;
}

async function fetchAISuggestions(cat, reducePct, opts){
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  const catExercises = buildSessionPool(cat, sortedSessions, 6, 2, opts);
  if(!catExercises.length) throw new Error('No exercises in this split yet to base suggestions on.');
  const history = catExercises.map(e=>{
    const recent = sortedSessions.filter(s=>cellSets(e.id+'|'+s.id).length).slice(-3).map(s=>({date:s.label, log:cellText(e.id+'|'+s.id)}));
    return {id:e.id, name:e.name, recent};
  });
  const sys = 'You are a concise strength coach. Given a lifter\'s recent logged sets for one training split, propose the next session\'s target weights and rep ranges using standard progressive-overload judgement: a small load or rep increase when the last session\'s top set looked repeatable, hold steady or ease off slightly if reps or weight dropped recently. Respond with ONLY minified JSON, no markdown fences, no commentary, in exactly this shape: {"exerciseId":{"suggestion":"e.g. 62.5kg×5, 65kg×5, 65kg×5","note":"reason in under 10 words"}}. Use the same compact "WEIGHTkg×REPS" notation shown in the history, comma-separated per set. If an exercise has no history, suggest a sensible conservative starting point and say so in the note.';
  const userMsg = 'Split: ' + CATS[cat].label + '\nExercise history (most recent sessions first is not guaranteed; check dates):\n' + JSON.stringify(history);

  const sample = await getSample();
  if(!sample) throw new Error('AI suggestions need Claude access, which this page doesn\'t have. Your history-based suggestions still work.');
  let parsed;
  try{
    parsed = await sample.json([{role:'user', content: sys + '\n\n' + userMsg}], { modelTier:'default' });
  }catch(err){
    if(err && err.code==='not_granted') throw new Error('Claude access was declined, so AI refinement is unavailable. The history-based suggestions above still work.');
    if(err && err.code==='rate_limited') throw new Error('Too many AI requests just now — try again in a moment.');
    throw new Error('Could not get a suggestion back: ' + ((err && err.message) || 'unknown error'));
  }
  if(!parsed || typeof parsed !== 'object') throw new Error('Got a response back but could not read it as suggestions.');

  return catExercises.map(e=>{
    const raw = (parsed[e.id] && parsed[e.id].suggestion) || '';
    const scaled = (raw && reducePct>0) ? scaleWeights(normalizeText(raw), 1-reducePct/100) : raw;
    return { id:e.id, name:e.name, cat:e.cat, suggestion: scaled, note:(parsed[e.id]&&parsed[e.id].note)||'' };
  });
}

/* ============================= RUNNING PLAN IMPORT ============================= */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function readRunningPlanImage(file){
  const base64 = await fileToBase64(file);
  const mediaType = file.type || 'image/png';
  const today = todayLocal();
  const sys = 'You extract structured running-schedule data from a screenshot of a running-training app (e.g. Runna, Strava, TrainingPeaks). Respond with ONLY a minified JSON array, no markdown fences, no commentary, shaped exactly like: [{"date":"YYYY-MM-DD","type":"long"|"tempo"|"interval"|"easy"|"race"|"rest","label":"short description, e.g. \'10km tempo\'"}]. If the screenshot shows weekday names without explicit calendar dates, infer real calendar dates for the visible week relative to the date the user gives you. Include rest days too if shown, using type "rest". Only include days actually visible in the screenshot.';
  const userText = "Today's date is " + today + ". Extract the running schedule from this screenshot.";

  const sample = await getSample();
  if(!sample) throw new Error('Reading screenshots needs Claude access, which this page doesn\'t have. You can still add runs by hand.');
  let limits = {};
  try{ limits = await sample.limits(); }catch(e){ /* assume no images */ }
  if(!limits.images) throw new Error('Image reading isn\'t available here — add the runs by hand instead.');

  let parsed;
  try{
    parsed = await sample.json([{ role:'user', content:[
      { type:'image', source:{ type:'base64', media_type: mediaType, data: base64 } },
      { type:'text', text: sys + '\n\n' + userText },
    ]}], { modelTier:'default' });
  }catch(err){
    if(err && err.code==='not_granted') throw new Error('Claude access was declined, so the screenshot can\'t be read. Add the runs by hand instead.');
    if(err && err.code==='rate_limited') throw new Error('Too many AI requests just now — try again in a moment.');
    throw new Error('Could not read that screenshot: ' + ((err && err.message) || 'unknown error'));
  }
  if(!Array.isArray(parsed)) throw new Error('Got a response back but could not read it as a schedule.');

  const valid = parsed.filter(r=> r && r.date && RUN_TYPES[r.type]);
  if(!valid.length) throw new Error("Couldn't find any recognizable run days in that screenshot.");

  const preview = valid.slice(0,6).map(r=>
    new Date(r.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) + ': ' + RUN_TYPES[r.type].label + (r.label?' — '+r.label:'')
  ).join('\n') + (valid.length>6 ? '\n…and '+(valid.length-6)+' more' : '');
  const ok = await confirmDialog('Found '+valid.length+' day'+(valid.length===1?'':'s')+' in that screenshot:\n\n'+preview+'\n\nAdd these to your running plan?', 'Import');
  if(!ok) return null;

  const byDate = {};
  (DATA.runSchedule||[]).forEach(r=>{ byDate[r.date] = r; });
  valid.forEach(r=>{
    // rest days aren't a run — they should just mean no entry on that date,
    // clearing anything that was previously scheduled there too
    if(r.type==='rest'){ delete byDate[r.date]; return; }
    byDate[r.date] = { date:r.date, type:r.type, label:r.label||'' };
  });
  DATA.runSchedule = Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
  scheduleSave();
  return valid;
}

/* ============================= AUTO-SCHEDULE LIFTING DAYS ============================= */
function daysBetween(a,b){ return Math.round((new Date(a) - new Date(b)) / 86400000); }

function pickFarthest(pool, chosen){
  if(!chosen.size) return pool[0] || null;
  let best=null, bestDist=-1;
  pool.forEach(d=>{
    const dist = Math.min(...[...chosen].map(c=>Math.abs(daysBetween(c,d))));
    if(dist>bestDist){ bestDist=dist; best=d; }
  });
  return best;
}

/**
 * Plans one week's worth of lifting sessions.
 *
 * prefs.dayCounts: { leg:1, bilat:1, push:1, pull:1, aux:0 } — how many sessions of
 * each category the person wants scheduled this week. Any category already covered by
 * a manually-logged/planned session THAT WEEK counts against its quota, so re-generating
 * a week never doubles up a category you've already put on the calendar yourself.
 *
 * Never proposes a date that's already in the past, and never proposes a date that
 * already has a session on it (of any category).
 *
 * If a category (leg/bilat) can't be placed without landing within the buffer of a hard
 * run day, it still places it on the least-bad available day rather than giving up —
 * and flags that pick with a `conflict` message so the person can see the trade-off.
 * Only truly gives up (adds to `unmet`) if there is no day left in the week at all.
 */
function planOneWeek(weekDates, prefs){
  prefs = prefs || {};
  const dayCounts = prefs.dayCounts || {};
  const todayStr = todayLocal();

  const existingDates = new Set(DATA.sessions.map(s=>s.date));
  const hardRunInfo = new Map(); // date -> {hardness, run}
  (DATA.runSchedule||[]).forEach(r=>{
    const rt = RUN_TYPES[r.type];
    if(rt && rt.hardness>0){
      const buffer = rt.hardness>=3 ? 2 : 1;
      for(let off=-buffer; off<=buffer; off++){
        const dd = new Date(r.date+'T00:00:00'); dd.setDate(dd.getDate()+off);
        const ds = dd.toISOString().slice(0,10);
        const existingInfo = hardRunInfo.get(ds);
        if(!existingInfo || rt.hardness>existingInfo.hardness) hardRunInfo.set(ds, {hardness:rt.hardness, run:r});
      }
    }
  });

  // never suggest a day that's already passed, or that already has a session
  const available = weekDates.filter(d=> d>=todayStr && !existingDates.has(d));
  const legSafe = available.filter(d=> !hardRunInfo.has(d));

  // sessions the person already has this week count toward their category quota,
  // and their dates seed the spacing algorithm so new picks spread out around them
  const existingThisWeekByCat = {};
  const chosen = new Set();
  DATA.sessions.forEach(s=>{
    if(weekDates.includes(s.date)){
      existingThisWeekByCat[s.cat] = (existingThisWeekByCat[s.cat]||0)+1;
      chosen.add(s.date);
    }
  });

  const result = {}; // cat -> [{date, conflict}]
  const unmet = [];  // cat instances that couldn't be placed anywhere this week

  // place leg-constrained categories first so they get first pick of run-safe days
  const legLikeCats = ['leg','bilat'];
  const orderedCats = CAT_ORDER.slice().sort((a,b)=>{
    const aFirst = legLikeCats.includes(a) ? 0 : 1;
    const bFirst = legLikeCats.includes(b) ? 0 : 1;
    return aFirst-bFirst;
  });

  orderedCats.forEach(cat=>{
    const want = Math.max(0, (dayCounts[cat]||0) - (existingThisWeekByCat[cat]||0));
    const isLegLike = legLikeCats.includes(cat);
    for(let i=0;i<want;i++){
      const primaryPool = (isLegLike ? legSafe : available).filter(d=>!chosen.has(d));
      let pick = pickFarthest(primaryPool, chosen);
      let conflict = null;
      if(!pick){
        // no clash-free day left this week — fall back to the least-bad remaining day
        // rather than giving up on the category entirely
        const fallbackPool = available.filter(d=>!chosen.has(d));
        pick = pickFarthest(fallbackPool, chosen);
        if(pick && isLegLike && hardRunInfo.has(pick)){
          const info = hardRunInfo.get(pick);
          const runLabel = RUN_TYPES[info.run.type].label.toLowerCase();
          const runDay = new Date(info.run.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
          conflict = `No clash-free day this week — this lands near a ${runLabel} (${runDay}). Least-bad option; consider a lighter session.`;
        }
      }
      if(pick){
        chosen.add(pick);
        (result[cat] = result[cat]||[]).push({date:pick, conflict});
      } else {
        unmet.push(cat);
      }
    }
  });

  return { result, unmet };
}

/** YYYY-MM-DD for a Date object, in local time (toISOString() is UTC and can slip a day). */
function fmtLocalDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function generateAutoPlan(startDateStr, numWeeks, prefs){
  const todayStr = todayLocal();
  // never start planning in the past, even if a stale date is passed in
  const effectiveStart = startDateStr < todayStr ? todayStr : startDateStr;
  const weeks = [];
  let cursor = new Date(effectiveStart+'T00:00:00');
  // snap to the Monday of the start date's week (days before today are filtered
  // out per-week in planOneWeek, so this never proposes a past date)
  const dow = cursor.getDay();
  const backToMonday = dow===0 ? 6 : dow-1;
  cursor.setDate(cursor.getDate()-backToMonday);

  const weekDatesFrom = (start)=>{
    const out = [];
    for(let i=0;i<7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); out.push(fmtLocalDate(d)); }
    return out;
  };

  // Planning late in the week (e.g. on a Sunday) leaves almost no usable days, which
  // previously produced a near-empty plan full of "couldn't fit". If the remainder of
  // the current week can't hold what's been asked for, roll the whole plan forward to
  // next Monday instead — and flag it so the UI can say why.
  const dayCounts = (prefs && prefs.dayCounts) || {};
  const wanted = Object.values(dayCounts).reduce((a,b)=>a+(b||0),0);
  let rolledForward = false;
  if(wanted > 0 && startDateStr <= todayStr){
    const existingDates = new Set(DATA.sessions.map(x=>x.date));
    const usable = weekDatesFrom(cursor).filter(d=> d>=todayStr && !existingDates.has(d)).length;
    if(usable < Math.min(wanted, 3)){
      cursor.setDate(cursor.getDate()+7);
      rolledForward = true;
    }
  }

  for(let w=0; w<numWeeks; w++){
    const weekDates = weekDatesFrom(cursor);
    const {result, unmet} = planOneWeek(weekDates, prefs);
    weeks.push({ weekStart: weekDates[0], weekDates, result, unmet, rolledForward: rolledForward && w===0 });
    cursor.setDate(cursor.getDate()+7);
  }
  return weeks;
}

/**
 * Reschedules a run. Runs are keyed by date, so moving one means re-keying it.
 *
 * `mode` decides what happens when the destination already has a run:
 *   'replace' — the run already there is discarded
 *   'swap'    — the two runs exchange dates
 *   'push'    — the run already there shifts to the next free day, cascading if needed
 * Returns a restore function for undo, or null if there was nothing to move.
 */
function moveRunDate(fromDate, toDate, mode){
  const runs = DATA.runSchedule || [];
  const run = runs.find(r=>r.date===fromDate);
  if(!run || !toDate || toDate===fromDate) return null;
  const snapshot = runs.map(r=>Object.assign({}, r));

  const byDate = {};
  runs.forEach(r=>{ byDate[r.date] = Object.assign({}, r); });
  const displaced = byDate[toDate];
  delete byDate[fromDate];

  if(displaced && mode==='swap'){
    byDate[fromDate] = Object.assign({}, displaced, { date: fromDate });
  } else if(displaced && mode==='push'){
    // walk forward to the first free day, shifting the chain along
    delete byDate[toDate];
    let cursor = displaced;
    let d = new Date(toDate+'T00:00:00');
    for(let guard=0; guard<370; guard++){
      d.setDate(d.getDate()+1);
      const ds = fmtLocalDate(d);
      const next = byDate[ds];
      byDate[ds] = Object.assign({}, cursor, { date: ds });
      if(!next) break;   // landed on a free day, chain ends here
      cursor = next;     // otherwise the run we just displaced moves along too
    }
  } else if(displaced){
    delete byDate[toDate]; // replace
  }

  byDate[toDate] = Object.assign({}, run, { date: toDate });
  DATA.runSchedule = Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
  scheduleSave();
  return ()=>{ DATA.runSchedule = snapshot; scheduleSave(); render(); };
}

function openMoveRunModal(fromDate, onMoved){
  const run = (DATA.runSchedule||[]).find(r=>r.date===fromDate);
  if(!run) return;
  const fmt = (d)=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  const m = openModal(`
    <div class="modal" style="max-width:380px;">
      <button class="modal-close" id="mClose">&times;</button>
      <h2>Move run</h2>
      <p class="modal-sub"><span class="cat-pill"><span class="dot" style="background:${RUN_TYPES[run.type].color}"></span>${escapeHtml(run.label||RUN_TYPES[run.type].label)}</span> · currently ${fmt(fromDate)}</p>
      <div class="field"><label for="fRunMoveDate">New date</label><input type="date" id="fRunMoveDate" value="${fromDate}"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="mCancel">Cancel</button>
        <button class="btn primary" id="mSave">Move</button>
      </div>
    </div>`);
  m.querySelector('#mClose').addEventListener('click', closeModal);
  m.querySelector('#mCancel').addEventListener('click', closeModal);
  m.querySelector('#mSave').addEventListener('click', async ()=>{
    const toDate = m.querySelector('#fRunMoveDate').value;
    if(!toDate || toDate===fromDate){ closeModal(); return; }
    const clash = (DATA.runSchedule||[]).find(r=>r.date===toDate);

    let mode = 'replace';
    if(clash){
      const clashLabel = clash.label || RUN_TYPES[clash.type].label;
      closeModal();
      mode = await chooseDialog(
        'There\'s already a run there',
        `${fmt(toDate)} already has: ${clashLabel}.\n\nWhat should happen to it?`,
        [
          { key:'push', label:'Push it to the next free day', hint:'Everything after it shifts along too', primary:true },
          { key:'swap', label:'Swap the two runs', hint:`It moves back to ${fmt(fromDate)}` },
          { key:'replace', label:'Replace it', hint:'That run is deleted' },
        ]
      );
      if(!mode) return;
    } else {
      closeModal();
    }

    const restore = moveRunDate(fromDate, toDate, mode);
    if(restore){
      const msg = mode==='push' ? 'Run moved — the run that was there shifted forward.'
        : mode==='swap' ? 'Runs swapped.'
        : clash ? 'Run moved — the run already there was replaced.'
        : 'Run moved to '+new Date(toDate+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'.';
      showToast(msg, ()=>{ restore(); if(onMoved) onMoved(fromDate); });
      if(onMoved) onMoved(toDate); else render();
    }
  });
}
