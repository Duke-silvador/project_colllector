/* ============================= DETERMINISTIC SUGGESTIONS (no AI needed) ============================= */
function incrementFor(w, exName){
  const n = (exName||'').toLowerCase();
  const base = w<10 ? 0.5 : w<30 ? 1 : w<60 ? 2.5 : 5;
  if(/lateral raise|face pull|curl|tricep|calf raise|rear delt|external rotation|shrug|wrist curl/.test(n)) return Math.max(0.5, base/2);
  if(/dumbbell|^db |seated db| db /.test(n) && /squat|press|row|deadlift|lunge|split squat/.test(n)) return Math.max(base, 2);
  return base;
}
function roundToHalf(v){ return Math.round(v*2)/2; }
const DEFAULT_REP_RANGE = { low:6, high:10 };
/** A one-size-fits-all 6–10 range means 5×5 barbell work sits permanently *below*
 *  range and never progresses, while isolation work progresses too eagerly. When an
 *  exercise has no explicit range set, infer one from the movement type instead. */
function inferRepRange(name){
  const n = (name||'').toLowerCase();
  if(/deadlift|back squat|front squat|barbell bench|overhead press|power clean|snatch|clean and jerk|trap bar/.test(n)) return { low:3, high:6 };
  if(/squat|bench|press|row|pulldown|pull-?up|chin-?up|dip|hip thrust|leg press|split squat|lunge|step-?up/.test(n)) return { low:6, high:10 };
  if(/plank|hold|carry/.test(n)) return { low:20, high:60 };
  if(/calf|crunch|raise|curl|fly|pec deck|face pull|shrug|extension|pushdown|pressdown|abduct|adduct|rotation|neck|wrist/.test(n)) return { low:10, high:15 };
  return { low:DEFAULT_REP_RANGE.low, high:DEFAULT_REP_RANGE.high };
}
function repRangeFor(ex){
  const inferred = inferRepRange(ex && ex.name);
  return {
    low: (ex && ex.repRangeLow) || inferred.low,
    high: (ex && ex.repRangeHigh) || inferred.high,
  };
}

/**
 * Classic double progression, gated by the exercise's own rep range rather than by
 * the raw numbers in the last session: only add weight once reps are at/above the
 * top of the range; within the range, add a rep instead; below the range (a rough
 * set that fell short), hold rather than blindly piling on load.
 */
function progressSet(s, ex){
  const { low: repLow, high: repHigh } = repRangeFor(ex);
  const exName = ex ? ex.name : '';
  if(s.weight && s.weight.type==='kg' && !s.isSeconds){
    const inc = incrementFor(s.weight.value, exName);
    const atTop = s.reps >= repHigh;
    const inRange = s.reps >= repLow;
    if(s.rir!=null){
      if(s.rir<=0){
        // true failure: full progress if that happened at/above the top of the range,
        // a small nudge if within range, hold if it happened below the range at all
        if(atTop) return Object.assign({}, s, { weight:{type:'kg', value: roundToHalf(s.weight.value+inc)} });
        if(inRange) return Object.assign({}, s, { weight:{type:'kg', value: roundToHalf(s.weight.value+inc/2)} });
        return Object.assign({}, s);
      }
      if(s.rir<=2){
        // hard but not failure
        if(atTop) return Object.assign({}, s, { weight:{type:'kg', value: roundToHalf(s.weight.value+inc/2)} });
        if(inRange) return Object.assign({}, s, { reps: s.reps+1 });
        return Object.assign({}, s);
      }
      // felt easy (RIR 3+)
      if(atTop) return Object.assign({}, s, { weight:{type:'kg', value: roundToHalf(s.weight.value+inc)} });
      if(inRange) return Object.assign({}, s, { reps: s.reps+1 });
      return Object.assign({}, s);
    }
    // no RIR logged — double progression against the exercise's rep range
    if(atTop) return Object.assign({}, s, { weight:{type:'kg', value: roundToHalf(s.weight.value+inc)} });
    if(inRange) return Object.assign({}, s, { reps: s.reps+1 });
    return Object.assign({}, s); // fell below range — hold rather than adding load blindly
  }
  if(s.isSeconds) return Object.assign({}, s, { reps: s.reps+5 });
  return Object.assign({}, s, { reps: s.reps+1 });
}

/**
 * Short hint telling you what the target is working toward: the rep range, and the
 * number that triggers a weight increase next session. Without it the rep target
 * looks arbitrary — you can't tell that pushing to the top of the range is what
 * earns the load jump.
 */
function progressionHint(ex, plannedSets){
  if(!ex) return '';
  const { low, high } = repRangeFor(ex);
  const sets = plannedSets || [];
  const timed = sets.some(s=>s.isSeconds);
  const loaded = sets.filter(s=>s.weight && s.weight.type==='kg' && !s.isSeconds);

  if(timed){
    const topSecs = Math.max(...sets.filter(s=>s.isSeconds).map(s=>s.reps));
    if(topSecs >= high) return `${low}–${high}s hold · past the top, worth adding load or a harder variation`;
    return `${low}–${high}s hold · ${high-topSecs}s more (to ${high}s) before it steps up`;
  }

  if(!loaded.length){
    return `bodyweight · ${low}–${high} rep range, reps climb each session`;
  }

  const topWeight = Math.max(...loaded.map(s=>s.weight.value));
  const topReps = Math.max(...loaded.filter(s=>s.weight.value===topWeight).map(s=>s.reps));
  if(topReps >= high) return `${low}–${high} rep range · at the top, so the weight goes up next`;
  const gap = high - topReps;
  return `${low}–${high} rep range · ${gap} more rep${gap===1?'':'s'} (to ${high}) earns the weight jump`;
}

/* ---------- warm-ups ----------
   A warm-up should prime the movement, not be the hardest set of the day. Reps come
   DOWN as the load goes up. High reps at 80%+ of the working weight is a working set
   wearing a warm-up label, and it spends the effort the work sets need.
   Roughly: ~45% x5, ~65% x3, ~85% x2. */
function isRampedCompound(ex, workingWeight){
  if(!workingWeight || workingWeight < 30) return false;
  const n = (ex && ex.name || '').toLowerCase();
  return /squat|deadlift|bench|press|row|hip thrust|pulldown|leg press/.test(n)
    && !/lateral raise|curl|pushdown|pressdown|fly|face pull|calf|shrug|extension/.test(n);
}
function roundToStep(v, step){ return Math.round(v/step)*step; }

/** Warm-ups the way lifters actually do them: movement practice first (the empty
 *  bar for barbell lifts), then fewer reps as the weight climbs, finishing with a
 *  near-working single on heavier days — e.g. 60kg bench: 20×10, 40×5, 47.5×3,
 *  55×1. Deadlifts skip the empty bar (it's too low off the floor). Machines and
 *  dumbbells get a shorter ramp; isolation work gets none (see isRampedCompound). */
function buildWarmups(workingWeight, ex){
  const n = (ex && ex.name || '').toLowerCase();
  const barbell = /barbell|squat|bench press|deadlift|good morning|pendlay|bent-?over row/.test(n)
    && !/dumbbell|\bdb\b|machine|cable|smith|single-leg|single-arm|split|goblet|hack|chest-supported|leg press/.test(n);
  const step = barbell ? 2.5 : 1;
  let plan;
  if(barbell && /deadlift/.test(n)) plan = [[0.4,5],[0.6,3],[0.8,2]].concat(workingWeight>=80 ? [[0.92,1]] : []);
  else if(barbell) plan = [[20/workingWeight,10],[0.65,5],[0.8,3]].concat(workingWeight>=60 ? [[0.92,1]] : []);
  else plan = workingWeight >= 40 ? [[0.5,8],[0.75,3]] : [[0.6,6]];
  const out = [];
  let prev = 0;
  plan.forEach(([pct, reps])=>{
    const wt = roundToStep(workingWeight*pct, step);
    if(wt <= prev) return;                 // skip duplicates once rounded
    if(wt >= workingWeight - step/2) return; // never warm up at or above the work weight
    prev = wt;
    out.push({ weight:{type:'kg', value:wt}, reps, perSide:false, isSeconds:false, rir:null });
  });
  return out;
}
/** Flags a logged ramp that's costing more than it's priming. */
function rampWarning(analysis){
  if(!analysis || analysis.bodyweight || !analysis.warmups.length) return null;
  const wk = analysis.workingWeight;
  const offenders = analysis.warmups.filter(s=> s.weight.value >= wk*0.75 && s.reps >= 5);
  if(!offenders.length) return null;
  const worst = offenders.reduce((a,b)=> (b.weight.value*b.reps > a.weight.value*a.reps ? b : a));
  return `Last time ${worst.weight.value}kg × ${worst.reps} came before your ${wk}kg work sets — that's ${Math.round(worst.weight.value/wk*100)}% of working weight for ${worst.reps} reps, which fatigues you before the sets that count. Warm-up reps should drop as the weight climbs.`;
}

/**
 * Works out which sets in a session were the actual working sets.
 *
 * The working weight is whichever load you did the MOST sets at, not simply the
 * heaviest. A single heavy attempt followed by four back-off sets ("8kg x7, then
 * 6kg x15 x4") is back-off work, and treating the 8kg as the work set produces
 * nonsense like "8 more reps to 15". Ties break toward the heavier load.
 * Sets lighter than the working weight are treated as warm-ups and preserved as-is.
 */
function analyseWorkSets(sets){
  const loaded = sets.filter(s=>s.weight && s.weight.type==='kg' && !s.isSeconds);
  if(!loaded.length){
    return { bodyweight:true, workSets:sets.slice(), warmups:[], minReps: sets.length ? Math.min(...sets.map(s=>s.reps)) : 0 };
  }
  const counts = new Map();
  loaded.forEach(s=>counts.set(s.weight.value, (counts.get(s.weight.value)||0)+1));
  let workingWeight = null, bestCount = -1;
  [...counts.entries()].forEach(([wt,c])=>{
    if(c>bestCount || (c===bestCount && wt>workingWeight)){ workingWeight = wt; bestCount = c; }
  });
  const workSets = loaded.filter(s=>s.weight.value===workingWeight);
  const warmups = sets.filter(s=>s.weight && s.weight.type==='kg' && !s.isSeconds && s.weight.value < workingWeight);
  return {
    bodyweight:false, workingWeight, workSets, warmups,
    minReps: Math.min(...workSets.map(s=>s.reps)),
    perSide: workSets.some(s=>s.perSide),
    isSeconds: workSets.some(s=>s.isSeconds),
    rir: workSets.map(s=>s.rir).filter(r=>r!=null).length ? Math.min(...workSets.map(s=>s.rir==null?99:s.rir)) : null,
  };
}

/**
 * Decides the next target from the last session's working sets, and explains itself.
 *
 * Key rule: when the weight goes up, reps reset to the BOTTOM of the range. Carrying
 * top-of-range reps onto a heavier load is what produced "16kg x10 x3 -> 18kg x10 x3",
 * a 12.5% jump with no rep relief, which nobody was ever going to hit.
 */
function decideProgression(ex, analysis){
  const { low, high } = repRangeFor(ex);
  const exName = ex ? ex.name : '';

  if(analysis.bodyweight){
    const reps = analysis.minReps;
    const timed = analysis.workSets.some(s=>s.isSeconds);
    const step = timed ? 5 : 1;
    return {
      action:'reps',
      sets: analysis.workSets.map(s=>Object.assign({}, s, { reps: s.reps + step })),
      why: timed
        ? `+${step}s per hold — no load to add, so time keeps climbing`
        : `+${step} rep — no load to add, so reps keep climbing`,
      hint: timed ? `${low}–${high}s hold` : `${low}–${high} rep range`,
    };
  }

  const { workingWeight, workSets, minReps } = analysis;
  const count = workSets.length;
  const mk = (weight, reps)=> new Array(count).fill(0).map(()=>({
    weight:{type:'kg', value:weight}, reps, perSide:analysis.perSide, isSeconds:false, rir:null,
  }));

  // fell short of the range: hold and consolidate rather than loading up
  if(minReps < low){
    return {
      action:'hold',
      sets: mk(workingWeight, minReps),
      why: `held at ${workingWeight}kg — ${minReps} rep${minReps===1?'':'s'} is below the ${low}–${high} range`,
      hint: `${low}–${high} rep range · get all sets to ${low}+ before adding load`,
    };
  }

  // at the top of the range: add load AND drop back to the bottom of the range
  if(minReps >= high){
    const inc = incrementFor(workingWeight, exName);
    const newWeight = roundToHalf(workingWeight + inc);
    return {
      action:'weight',
      sets: mk(newWeight, low),
      why: minReps > high
        ? `${minReps} reps at ${workingWeight}kg is past the ${low}–${high} range, so +${roundToHalf(inc)}kg and back to ${low} reps`
        : `hit ${high} reps at ${workingWeight}kg, so +${roundToHalf(inc)}kg and back to ${low} reps`,
      hint: `${low}–${high} rep range · build back up to ${high} at ${newWeight}kg`,
    };
  }

  // inside the range: add a rep
  const next = minReps + 1;
  return {
    action:'reps',
    sets: mk(workingWeight, next),
    why: `+1 rep at ${workingWeight}kg`,
    hint: `${low}–${high} rep range · ${high-next} more rep${high-next===1?'':'s'} (to ${high}) earns the weight jump`,
  };
}

/** machineId defaults to the machine you're currently using for this exercise; only
 *  history from that same machine counts, since weights don't carry across machines. */
function deterministicSuggestionFor(exId, sortedSessions, machineId){
  const ex = DATA.exercises.find(e=>e.id===exId);
  if(machineId===undefined) machineId = currentMachineFor(ex);
  for(let i=sortedSessions.length-1; i>=0; i--){
    const sets = DATA.cells[exId+'|'+sortedSessions[i].id];
    if(!sets || !sets.length || machineOfSets(sets)!==machineId) continue;

    const analysis = analyseWorkSets(sets);
    const decision = decideProgression(ex, analysis);
    const workWeight = decision.sets.length && decision.sets[0].weight && decision.sets[0].weight.type==='kg'
      ? decision.sets[0].weight.value : null;
    // For ramped compounds, prescribe a fresh warm-up rather than copying last
    // session's — otherwise a fatiguing ramp gets repeated forever.
    const warmups = (workWeight && isRampedCompound(ex, workWeight))
      ? buildWarmups(workWeight, ex)
      : analysis.warmups.map(s=>Object.assign({}, s));
    const newSets = warmups.concat(decision.sets);
    return {
      suggestion: setsToText(newSets),
      note: decision.why,
      hint: decision.hint,
      action: decision.action,
      warning: rampWarning(analysis),
    };
  }
  return { suggestion: '', note: machinesUsedFor(exId).length
      ? 'No history on '+machineName(machineId)+' yet — other machines load differently, so this is a fresh start'
      : 'No history yet for this one — starting point is a guess', hint:'', action:'none' };
}

function buildDeterministicSuggestions(cat, reducePct, opts){
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  const catExercises = buildSessionPool(cat, sortedSessions, 6, 2, opts);
  return catExercises.map(e=>{
    const { suggestion, note } = deterministicSuggestionFor(e.id, sortedSessions);
    const scaled = (suggestion && reducePct>0) ? scaleWeights(suggestion, 1-reducePct/100) : suggestion;
    return { id:e.id, name:e.name, cat:e.cat, suggestion: scaled, note };
  });
}

/* ============================= EXERCISE STATS & PRs ============================= */
const MUSCLE_LABELS = {
  chest:'chest', frontDelt:'front delts', sideDelt:'side delts', rearDelt:'rear delts',
  biceps:'biceps', triceps:'triceps', forearms:'forearms', abs:'abs', obliques:'obliques',
  lats:'lats', traps:'traps', lowerBack:'lower back', quads:'quads', hamstrings:'hamstrings',
  glutes:'glutes', adductors:'adductors', abductors:'abductors', calves:'calves', neck:'neck',
};

function confidenceForReps(reps){
  if(reps<=3) return 'high';
  if(reps<=8) return 'good';
  if(reps<=12) return 'rough';
  return 'low';
}
const CONFIDENCE_LABEL = { high:'high confidence', good:'good estimate', rough:'rough estimate', low:'speculative — that many reps stretches the formula' };

function computeExerciseStats(exId, sortedSessions, machineId){
  if(machineId===undefined) machineId = currentMachineFor(DATA.exercises.find(e=>e.id===exId));
  const points = topSetPerSession(exId, sortedSessions, machineId);
  if(!points.length) return null;
  const last = points[points.length-1];
  const prev = points.length>1 ? points[points.length-2] : null;
  const last4 = points.slice(-4);

  const kgPoints = points.filter(p=>p.unit==='kg' && Number.isInteger(p.reps));
  let e1rm=null, e1rmSource=null, e1rmConfidence=null;
  if(kgPoints.length && usesE1RM(DATA.exercises.find(e=>e.id===exId))){
    let best=null;
    kgPoints.slice(-3).forEach(p=>{
      const est = estimate1RMWithRIR(p.value, p.reps, p.rir);
      if(!best || est>best.est) best={est, p};
    });
    e1rm = best.est; e1rmSource = best.p; e1rmConfidence = best.p.rir!=null ? 'high' : confidenceForReps(best.p.reps);
  }

  let lastSets=[];
  for(let i=sortedSessions.length-1;i>=0;i--){
    const sets = DATA.cells[exId+'|'+sortedSessions[i].id];
    if(sets && sets.length && machineOfSets(sets)===machineId){ lastSets = sets; break; }
  }
  const lastTonnage = setsVolumeKg(lastSets);

  const changeVsPrevious = (prev && last.unit==='kg' && prev.unit==='kg') ? +(last.value-prev.value).toFixed(1) : null;
  let changeOver4Pct = null;
  if(last4.length>=2 && last4[0].unit==='kg' && last.unit==='kg' && last4[0].value){
    changeOver4Pct = +(((last.value-last4[0].value)/last4[0].value)*100).toFixed(1);
  }
  let trend = 'flat';
  if(last4.length>=2){
    const diffs = [];
    for(let i=1;i<last4.length;i++) diffs.push(last4[i].value-last4[i-1].value);
    const up = diffs.filter(d=>d>0).length, down = diffs.filter(d=>d<0).length;
    trend = up>down ? 'up' : down>up ? 'down' : 'flat';
  }
  const todayStr = todayLocal();
  const daysSince = last.date ? Math.round((new Date(todayStr)-new Date(last.date))/86400000) : null;

  return { points, last, prev, changeVsPrevious, changeOver4Pct, trend, e1rm, e1rmSource, e1rmConfidence, lastSets, lastTonnage, daysSince };
}

const PR_KIND_LABEL = { weight:'weight PR', reps:'rep PR', e1rm:'est. 1RM PR', volume:'volume PR' };

/**
 * Checks a just-logged session/exercise for new PRs across four independent categories:
 *  - weight: heaviest weight ever lifted (any reps)
 *  - reps: most reps ever done at a specific weight (only counts as a PR once that
 *    weight has been seen before — the first time at a new weight isn't a "record")
 *  - e1rm: the existing estimated-1RM PR, kept as its own category rather than
 *    being treated as the definition of a PR (a formula shouldn't outrank an actual heavier lift)
 *  - volume: highest single-session tonnage for this exercise
 * Returns the number of new PRs found (0 if none).
 */
function emptyPRRecord(){
  return { weight:null, repsByWeight:{}, e1rm:null, volume:null, history:[] };
}

/**
 * Folds one session's sets for one exercise into a PR record, mutating `rec` and
 * returning any new records found. Shared by live logging and the historical
 * backfill, so both apply identical rules — the only difference is the date used
 * and whether an estimated-1RM check runs against full history.
 */
function applySessionToPRRecord(rec, exId, sessionId, dateStr, e1rmValue){
  const found = [];
  // a set with fractional reps is a typo ("21.6 reps"), not a record
  const sets = (sessionId ? cellSets(exId+'|'+sessionId) : []).filter(isPlausibleSet);
  const weightedSets = sets.filter(s=>s.weight && s.weight.type==='kg' && !s.isSeconds);

  if(weightedSets.length){
    const topSet = weightedSets.reduce((a,b)=> b.weight.value>a.weight.value?b:a);
    if(!rec.weight || topSet.weight.value > rec.weight.value + 0.001){
      rec.weight = { value: topSet.weight.value, reps: topSet.reps, date: dateStr };
      found.push({ kind:'weight', text: `${topSet.weight.value}kg × ${topSet.reps}` });
    }
    rec.repsByWeight = rec.repsByWeight || {};
    weightedSets.forEach(st=>{
      const key = String(st.weight.value);
      const prev = rec.repsByWeight[key];
      if(!prev || st.reps > prev.reps){
        // the first time a weight is ever used isn't a "record" at that weight
        if(prev) found.push({ kind:'reps', text: `${st.reps} reps @ ${key}kg` });
        rec.repsByWeight[key] = { reps: st.reps, date: dateStr };
      }
    });
  }

  if(e1rmValue && (!rec.e1rm || e1rmValue > rec.e1rm.value + 0.05)){
    rec.e1rm = { value: +e1rmValue.toFixed(1), date: dateStr };
    found.push({ kind:'e1rm', text: `${e1rmValue.toFixed(1)}kg estimated` });
  }

  const sessionVolume = setsVolumeKg(sets);
  if(sessionVolume>0 && (!rec.volume || sessionVolume > rec.volume.value + 0.001)){
    rec.volume = { value: Math.round(sessionVolume), date: dateStr };
    found.push({ kind:'volume', text: `${Math.round(sessionVolume).toLocaleString()}kg session volume` });
  }

  if(found.length){
    rec.history = (rec.history||[]).concat(found.map(f=>({ date:dateStr, kind:f.kind, text:f.text }))).slice(-40);
  }
  return found;
}

/** Whole reps (or a timed hold). Anything else came from a mistyped entry. */
function isPlausibleSet(s){ return s && (s.isSeconds || Number.isInteger(s.reps)); }
/** Flags a just-saved entry with fractional reps — nearly always a weight typed
 *  where the reps go ("21.6kg 15, 13, 21.6"). One tap opens it to fix. */
function warnIfOddReps(exId, sessionId){
  const odd = cellSets(exId+'|'+sessionId).find(s=>!isPlausibleSet(s));
  if(!odd) return false;
  const ex = DATA.exercises.find(e=>e.id===exId);
  showToast(`${odd.reps} reps on ${ex?ex.name:'that exercise'} — is that right? It's left out of PRs until fixed.`,
    ()=>{ closeModal(); openEditEntryModal(sessionId, exId); }, 'Fix');
  return true;
}
/** On load: point out any entry already in the log with fractional reps. */
function flagOddRepsInLog(){
  for(const key of Object.keys(DATA.cells)){
    if(cellSets(key).some(s=>!isPlausibleSet(s))){
      const i = key.indexOf('|');
      if(DATA.sessions.some(x=>x.id===key.slice(i+1))) return warnIfOddReps(key.slice(0,i), key.slice(i+1));
    }
  }
  return false;
}
/** An estimated 1RM means something for big multi-joint lifts; for a 15-rep face
 *  pull or pushdown it's arithmetic, not strength, so it isn't tracked there. */
function usesE1RM(ex){ return movementTierOf(ex)==='compound'; }
/** Best estimated 1RM from a single session's sets (Epley, RIR-aware). */
function sessionE1RM(exId, sessionId){
  if(!usesE1RM(DATA.exercises.find(e=>e.id===exId))) return null;
  const sets = cellSets(exId+'|'+sessionId).filter(s=>s.weight && s.weight.type==='kg' && !s.isSeconds && isPlausibleSet(s));
  if(!sets.length) return null;
  return Math.max(...sets.map(s=>estimate1RMWithRIR(s.weight.value, s.reps, s.rir)));
}

/**
 * PR records are a cache derived from the log, never a source of truth: they're
 * replayed from every logged set in date order. Updating them incrementally let
 * them drift — a set corrected or deleted afterwards left its "record" behind (a
 * 45kg pushdown PR with no 45kg set anywhere). So they're rebuilt on load and on
 * every render, and nothing reads a record that the log doesn't back up.
 */
function buildPRRecords(excludeSessionId){
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  const rebuilt = {};
  sortedSessions.forEach(sess=>{
    if(sess.id===excludeSessionId) return;
    DATA.exercises.forEach(ex=>{
      const sets = cellSets(ex.id+'|'+sess.id);
      if(!sets.length) return;
      const key = prKey(ex.id, machineOfSets(sets));
      const rec = rebuilt[key] || (rebuilt[key] = emptyPRRecord());
      applySessionToPRRecord(rec, ex.id, sess.id, sess.date, sessionE1RM(ex.id, sess.id));
    });
  });
  return rebuilt;
}
function rebuildPRRecordsFromHistory(){ DATA.prRecords = buildPRRecords(); }

/** Announces any records this entry sets against everything else in the log, then
 *  refreshes the cache from scratch. */
function checkForPR(exId, exName, sessionId){
  const machineId = machineOfCell(exId+'|'+sessionId);
  const key = prKey(exId, machineId);
  const rec = buildPRRecords(sessionId)[key] || emptyPRRecord();
  const session = DATA.sessions.find(s=>s.id===sessionId);
  const dateStr = session ? session.date : todayLocal();
  const found = applySessionToPRRecord(rec, exId, sessionId, dateStr, sessionE1RM(exId, sessionId));
  rebuildPRRecordsFromHistory();
  if(found.length){
    scheduleSave();
    const where = machineId ? ` (${machineName(machineId)})` : '';
    found.forEach(f=> showToast(`New ${PR_KIND_LABEL[f.kind]} — ${exName}${where}: ${f.text}`));
  }
  return found.length;
}

/* ---------- set volume by muscle ----------
   A set of bench counts toward chest AND triceps AND front delts, so compounds are
   included rather than only isolation work. Following the usual convention:
   a muscle that's a primary mover (involvement 0.6+) scores a full set, a
   meaningful secondary (0.3–0.59) scores a half set, and incidental involvement
   below that isn't counted. */
const MUSCLE_GROUPS = {
  Chest:      ['chest'],
  Back:       ['lats','traps','lowerBack'],
  Shoulders:  ['frontDelt','sideDelt','rearDelt'],
  Arms:       ['biceps','triceps','forearms'],
  Legs:       ['quads','hamstrings','glutes','calves','adductors','abductors'],
  Core:       ['abs','obliques'],
  Other:      ['neck'],
};
/**
 * How much one set of an exercise counts toward a muscle.
 *
 * 'bucketed' — the convention most training guidance uses: a primary mover scores a
 *   full set, a meaningful assist a half, anything less nothing. Easy to compare
 *   against published set recommendations, but it rounds each exercise BEFORE the
 *   totals are added up, which biases high (0.6 involvement becomes a whole set,
 *   a +67% jump) and wipes out small contributions entirely.
 * 'graded' — sums the involvement estimates directly and only rounds for display.
 *   No rounding bias, but the totals run roughly 10–30% below the bucketed ones,
 *   so they sit lower against guidance written with the bucketed convention in mind.
 */
function setCredit(involvement){
  if(DATA && DATA.setCountingMode === 'graded') return involvement || 0;
  if(involvement >= 0.6) return 1;
  if(involvement >= 0.3) return 0.5;
  return 0;
}

/** Monday-anchored start of the week containing dateStr. */
function weekStartOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = d.getDay();
  d.setDate(d.getDate() - (dow===0 ? 6 : dow-1));
  return fmtLocalDate(d);
}

/**
 * Sets per muscle over the last `weeks` weeks, counting compound lifts toward
 * every muscle they meaningfully train.
 * Returns { weekStarts, byMuscle: {muscle: {total, perWeek:[]}} }.
 */
function setsByMuscle(weeks){
  weeks = weeks || 6;
  const todayStr = todayLocal();
  const thisWeek = weekStartOf(todayStr);
  const weekStarts = [];
  for(let i=weeks-1;i>=0;i--){
    const d = new Date(thisWeek+'T00:00:00');
    d.setDate(d.getDate() - i*7);
    weekStarts.push(fmtLocalDate(d));
  }
  const firstDay = weekStarts[0];
  const index = new Map(weekStarts.map((w,i)=>[w,i]));

  const byMuscle = {};
  const bump = (muscle, wi, credit)=>{
    if(!byMuscle[muscle]) byMuscle[muscle] = { total:0, perWeek:new Array(weeks).fill(0) };
    byMuscle[muscle].total += credit;
    byMuscle[muscle].perWeek[wi] += credit;
  };

  DATA.sessions.forEach(sess=>{
    if(sess.date < firstDay || sess.date > todayStr) return;
    const wi = index.get(weekStartOf(sess.date));
    if(wi===undefined) return;
    DATA.exercises.forEach(ex=>{
      const sets = cellSets(ex.id+'|'+sess.id);
      if(!sets.length) return;
      const muscles = MUSCLE_MAP[ex.name] || guessMuscles(ex.name);
      Object.entries(muscles).forEach(([m, involvement])=>{
        const credit = setCredit(involvement);
        if(credit) bump(m, wi, credit * sets.length);
      });
    });
  });
  return { weekStarts, byMuscle, weeks };
}

/* ---------- volume judgement ----------
   These are rules of thumb, not facts. Weekly set guidance in the training
   literature clusters around 10–20 sets for a major muscle, but the honest answer
   is that it depends on training age, recovery, goals and what else you're doing —
   and for a runner, leg volume competes with mileage. Smaller muscles get lower
   bands because applying a major-muscle standard to the neck or forearms would
   flag them permanently and turn the whole thing into noise.
   Bands are deliberately wide, and everything inside a band is left unmarked. */
const MUSCLE_VOLUME_GUIDE = {
  chest:[10,20], lats:[10,20], quads:[10,20], hamstrings:[10,20], glutes:[10,20],
  sideDelt:[8,18], frontDelt:[6,16], rearDelt:[6,16],
  biceps:[8,18], triceps:[8,18], traps:[6,16], calves:[8,16],
  abs:[6,16], obliques:[4,12], lowerBack:[4,12],
  adductors:[4,12], abductors:[4,12], forearms:[4,12], neck:[2,8],
};

/* Balance checks matter more than absolute counts, because a ratio is harder to
   argue with than a target. Each pair: [a, b, minRatio, maxRatio, note]. */
const BALANCE_PAIRS = [
  ['chest','lats',0.7,1.4,'pressing vs pulling'],
  ['quads','hamstrings',0.6,1.8,'quads vs hamstrings'],
  ['frontDelt','rearDelt',0.5,2.5,'front vs rear delts'],
  ['biceps','triceps',0.6,1.7,'biceps vs triceps'],
];

/**
 * Classifies a muscle's weekly average against its band.
 * Uses COMPLETED weeks only — the current week is still filling up, so including
 * it would make everything look neglected by Tuesday.
 */
function volumeStatus(muscle, perWeekAvg){
  const band = MUSCLE_VOLUME_GUIDE[muscle];
  if(!band) return { key:'none' };
  const [low, high] = band;
  // Only call something out when it's clearly outside the band, not a hair under.
  // Flagging every marginal case turns the whole thing into noise you learn to ignore.
  const SLACK = 0.75;
  if(perWeekAvg === 0) return { key:'none-done', label:'untrained', band, severity:1 };
  if(perWeekAvg < low*SLACK) return { key:'low', label:'below '+low, band, severity:(low-perWeekAvg)/low };
  if(perWeekAvg > high/SLACK) return { key:'high', label:'above '+high, band, severity:(perWeekAvg-high)/high };
  if(perWeekAvg < low || perWeekAvg > high) return { key:'edge', band }; // just outside, not worth shouting about
  return { key:'ok', band };
}

function balanceFlags(avgByMuscle){
  const flags = [];
  BALANCE_PAIRS.forEach(([a,b,minR,maxR,note])=>{
    const av = avgByMuscle[a]||0, bv = avgByMuscle[b]||0;
    if(av < 2 && bv < 2) return;           // too little of either to say anything
    if(bv === 0){ flags.push(`${MUSCLE_LABELS[b]||b} is getting nothing while ${MUSCLE_LABELS[a]||a} gets ${av.toFixed(1)}/wk (${note})`); return; }
    const ratio = av/bv;
    if(ratio < minR) flags.push(`${MUSCLE_LABELS[a]||a} ${av.toFixed(1)}/wk vs ${MUSCLE_LABELS[b]||b} ${bv.toFixed(1)}/wk — light on ${MUSCLE_LABELS[a]||a} (${note})`);
    else if(ratio > maxR) flags.push(`${MUSCLE_LABELS[a]||a} ${av.toFixed(1)}/wk vs ${MUSCLE_LABELS[b]||b} ${bv.toFixed(1)}/wk — light on ${MUSCLE_LABELS[b]||b} (${note})`);
  });
  return flags;
}

/**
 * Breakdown for a single muscle: which exercises actually contributed its sets over
 * the period, and how much each counted for. Answers "where are those sets coming
 * from" — and, for a muscle running light, what already trains it.
 */
function openMuscleBreakdownModal(muscle, weeks){
  weeks = weeks || 6;
  const label = MUSCLE_LABELS[muscle] || muscle;
  const todayStr = todayLocal();
  const thisWeek = weekStartOf(todayStr);
  const firstDay = (()=>{ const d=new Date(thisWeek+'T00:00:00'); d.setDate(d.getDate()-(weeks-1)*7); return fmtLocalDate(d); })();

  // what contributed over the window
  const contrib = {}; // exId -> {name, sets, credit, perSet, lastDate}
  DATA.sessions.forEach(sess=>{
    if(sess.date < firstDay || sess.date > todayStr) return;
    DATA.exercises.forEach(ex=>{
      const sets = cellSets(ex.id+'|'+sess.id);
      if(!sets.length) return;
      const muscles = MUSCLE_MAP[ex.name] || guessMuscles(ex.name);
      const involvement = muscles[muscle];
      if(!involvement) return;
      const perSet = setCredit(involvement);
      if(!perSet) return;
      const c = contrib[ex.id] || (contrib[ex.id] = { name:ex.name, cat:ex.cat, sets:0, credit:0, perSet, lastDate:null });
      c.sets += sets.length;
      c.credit += perSet * sets.length;
      if(!c.lastDate || sess.date > c.lastDate) c.lastDate = sess.date;
    });
  });
  const rows = Object.values(contrib).sort((a,b)=>b.credit-a.credit);
  const total = rows.reduce((n,r)=>n+r.credit,0);

  // anything in the log that trains this muscle but wasn't used in the period
  const untouched = DATA.exercises.filter(ex=>{
    if(contrib[ex.id]) return false;
    const muscles = MUSCLE_MAP[ex.name] || guessMuscles(ex.name);
    return setCredit(muscles[muscle]||0) > 0;
  }).sort((a,b)=>a.name.localeCompare(b.name));

  const m = openModal(`
    <div class="modal">
      <button class="modal-close" id="mClose">&times;</button>
      <h2 style="text-transform:capitalize;">${escapeHtml(label)}</h2>
      <p class="modal-sub">${fmtCredit(total)} sets over the last ${weeks} weeks, from ${rows.length} exercise${rows.length===1?'':'s'}. A full set means this muscle did most of the work; a half means it assisted.</p>
      ${muscle==='forearms' ? '<p class="modal-sub" style="margin-top:-12px;">Heavy pulling counts toward grip here. If you use straps on deadlifts and rows, that assumption doesn\'t hold — adjust those exercises or read this number as an overestimate.</p>' : ''}
      ${rows.length ? rows.map(r=>`
        <div class="plan-row">
          <span class="cat-pill"><span class="dot" style="background:${CATS[r.cat].color}"></span>${escapeHtml(r.name)}</span>
          <span class="plan-row-date">${r.sets} set${r.sets===1?'':'s'} × ${r.perSet===1?'full':'half'}
            <div class="today-why">last done ${new Date(r.lastDate+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div></span>
          <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;">${fmtCredit(r.credit)}</span>
        </div>`).join('') : '<p class="calc-none">No exercises trained this over the period.</p>'}
      ${untouched.length ? `<div class="tips-box" style="margin-top:18px;">
        <h3>In your log but not used lately</h3>
        <ul>${untouched.map(ex=>`<li>${escapeHtml(ex.name)} <span style="color:var(--text-faint);">— ${CATS[ex.cat].label}</span></li>`).join('')}</ul>
      </div>` : ''}
      <div class="modal-actions">
        <button class="btn ghost" id="mBack">Back to sets</button>
        <button class="btn primary" id="mDone">Close</button>
      </div>
    </div>`);
  m.querySelector('#mClose').addEventListener('click', closeModal);
  m.querySelector('#mDone').addEventListener('click', closeModal);
  m.querySelector('#mBack').addEventListener('click', ()=>{ closeModal(); openSetVolumeModal(); });
}
function fmtCredit(n){ return n===0 ? '0' : (Math.round(n*10)/10).toString(); }

function openSetVolumeModal(){
  const WEEKS = 6;
  const mode = (DATA.setCountingMode === 'graded') ? 'graded' : 'bucketed';
  const { weekStarts, byMuscle } = setsByMuscle(WEEKS);
  const thisWeekStart = weekStartOf(todayLocal());
  // the current week is still in progress; averaging it in would drag everything down
  const completedIdx = weekStarts.map((w,i)=>w===thisWeekStart?null:i).filter(i=>i!==null);
  const completedCount = completedIdx.length || 1;
  const avgOf = (data)=> completedIdx.reduce((n,i)=>n+data.perWeek[i],0)/completedCount;

  const avgByMuscle = {};
  Object.entries(byMuscle).forEach(([m,d])=>{ avgByMuscle[m] = avgOf(d); });
  // muscles never touched at all still deserve a mention
  Object.keys(MUSCLE_VOLUME_GUIDE).forEach(m=>{ if(avgByMuscle[m]===undefined) avgByMuscle[m] = 0; });

  const anyData = Object.keys(byMuscle).length;
  const fmt = (n)=> n===0 ? '·' : (Math.round(n*10)/10).toString();
  const weekLabels = weekStarts.map((w,i)=>
    new Date(w+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + (w===thisWeekStart?' *':''));

  const STATUS_STYLE = {
    low:       'color:var(--accent);',
    'none-done':'color:var(--accent);',
    high:      'color:var(--bilat);',
    ok:        '',
    none:      '',
  };

  const groupBlocks = Object.entries(MUSCLE_GROUPS).map(([group, muscles])=>{
    const rows = muscles
      .map(m=>({ m, label: MUSCLE_LABELS[m]||m, data: byMuscle[m], avg: avgByMuscle[m]||0 }))
      .filter(r=>r.data || MUSCLE_VOLUME_GUIDE[r.m])
      .sort((a,b)=>b.avg-a.avg);
    if(!rows.length) return '';
    const groupTotal = rows.reduce((n,r)=>n+(r.data?r.data.total:0),0);
    return `<div style="margin-bottom:18px;">
      <div class="cat-block-head" style="margin-bottom:6px;">
        <div class="cat-block-title" style="font-size:18px;">${group}
          <span class="cat-block-count">${fmt(groupTotal)} sets over ${WEEKS} wks</span>
        </div>
      </div>
      <table class="vol-table">
        <thead><tr><th>Muscle</th>${weekLabels.map(l=>`<th>${l}</th>`).join('')}<th>Per wk</th><th>Guide</th></tr></thead>
        <tbody>${rows.map(r=>{
          const st = volumeStatus(r.m, r.avg);
          const perWeek = r.data ? r.data.perWeek : new Array(WEEKS).fill(0);
          const band = st.band ? st.band[0]+'–'+st.band[1] : '—';
          return `<tr class="vol-row" data-muscle-row="${r.m}" title="See which exercises hit this">
            <td class="vol-name">${escapeHtml(r.label)}</td>
            ${perWeek.map(v=>`<td class="${v?'':'vol-zero'}">${fmt(v)}</td>`).join('')}
            <td class="vol-total" style="${STATUS_STYLE[st.key]||''}">${fmt(r.avg)}${st.label?` <span style="font-size:9px;">${st.key==='high'?'over':'under'}</span>`:''}</td>
            <td class="vol-zero" style="font-size:9.5px;">${band}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  }).join('');

  const rank = (arr)=>arr.map(([m,v])=>({m,v,st:volumeStatus(m,v)}))
    .sort((a,b)=>(b.st.severity||0)-(a.st.severity||0)).slice(0,5);
  const lows = rank(Object.entries(avgByMuscle).filter(([m,v])=>{ const st=volumeStatus(m,v); return st.key==='low'||st.key==='none-done'; }))
    .map(({m,v,st})=>`${MUSCLE_LABELS[m]||m} — ${v===0?'nothing logged':fmt(v)+'/wk'}, guide ${st.band[0]}–${st.band[1]}`);
  const highs = rank(Object.entries(avgByMuscle).filter(([m,v])=>volumeStatus(m,v).key==='high'))
    .map(({m,v,st})=>`${MUSCLE_LABELS[m]||m} — ${fmt(v)}/wk, guide ${st.band[0]}–${st.band[1]}`);
  const balance = balanceFlags(avgByMuscle);

  const summary = (lows.length||highs.length||balance.length) ? `
    <div class="tips-box" style="margin-bottom:20px;">
      ${lows.length?`<h3>Running light</h3><ul><li>${lows.join('</li><li>')}</li></ul>`:''}
      ${highs.length?`<h3 style="margin-top:10px;">Running high</h3><ul><li>${highs.join('</li><li>')}</li></ul>`:''}
      ${balance.length?`<h3 style="margin-top:10px;">Balance</h3><ul><li>${balance.join('</li><li>')}</li></ul>`:''}
    </div>` : '<p class="calc-none" style="margin-bottom:18px;">Nothing looks obviously out of proportion over this period.</p>';

  const m = openModal(`
    <div class="modal wide">
      <button class="modal-close" id="mClose">&times;</button>
      <h2>Sets by muscle</h2>
      <p class="modal-sub">Last ${WEEKS} weeks. Compounds count too — a bench set scores for chest, triceps and front delts.</p>
      <div class="filters" style="margin-bottom:16px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);">Counting</span>
        <button class="filter-btn ${mode==='bucketed'?'active':''}" data-count-mode="bucketed" title="Full set for a primary mover, half for an assist">Full / half</button>
        <button class="filter-btn ${mode==='graded'?'active':''}" data-count-mode="graded" title="Sum the involvement estimates without rounding first">Graded</button>
      </div>
      ${anyData ? summary : ''}
      ${anyData ? groupBlocks : '<p class="calc-none">Nothing logged in the last six weeks.</p>'}
      <p class="modal-sub" style="margin-top:6px;">${mode==='bucketed'
        ? 'Full / half counting rounds each exercise before totalling, which is the usual convention but biases high — a muscle at 0.6 involvement scores a whole set.'
        : 'Graded counting sums the involvement estimates without rounding first, so there is no rounding bias, but totals run roughly 10–30% below the full/half convention the guide bands assume.'} Averages use completed weeks only — the current week (*) is still filling up. The guide bands are rules of thumb, not targets: roughly 10–20 sets a week for a major muscle, less for small ones. What's right for you depends on your goals, recovery and how much you're running, so treat a flag as a prompt to look, not an instruction.</p>
      <div class="modal-actions"><button class="btn primary" id="mDone">Close</button></div>
    </div>`);
  m.querySelector('#mClose').addEventListener('click', closeModal);
  m.querySelector('#mDone').addEventListener('click', closeModal);
  m.querySelectorAll('[data-count-mode]').forEach(b=>b.addEventListener('click', ()=>{
    DATA.setCountingMode = b.dataset.countMode;
    scheduleSave();
    closeModal(); openSetVolumeModal();
  }));
  m.querySelectorAll('[data-muscle-row]').forEach(row=>row.addEventListener('click', ()=>{
    closeModal();
    openMuscleBreakdownModal(row.dataset.muscleRow, WEEKS);
  }));
}

/** Full muscle-coverage ranking: every tracked muscle by days since last directly trained. */
function openNeglectedModal(){
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  const lastTrained = muscleLastTrainedMap(sortedSessions);
  const todayStr = todayLocal();
  const allMuscles = new Set(Object.keys(MUSCLE_LABELS));
  Object.keys(lastTrained).forEach(m=>allMuscles.add(m));
  const rows = [...allMuscles].map(m=>{
    const last = lastTrained[m];
    return {
      label: MUSCLE_LABELS[m]||m,
      last,
      days: last ? Math.round((new Date(todayStr)-new Date(last))/86400000) : null,
    };
  }).sort((a,b)=>{
    if(a.days===null && b.days===null) return a.label.localeCompare(b.label);
    if(a.days===null) return -1; // never trained sits at the top
    if(b.days===null) return 1;
    return b.days-a.days;
  });

  const barFor = (days)=>{
    const pct = days===null ? 100 : Math.min(100, Math.round((days/28)*100));
    const col = days===null || days>=21 ? 'var(--accent)' : days>=10 ? 'var(--bilat)' : 'var(--leg)';
    return `<div style="flex:1;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;">
      <div style="width:${pct}%;height:100%;background:${col};"></div></div>`;
  };

  const m = openModal(`
    <div class="modal">
      <button class="modal-close" id="mClose">&times;</button>
      <h2>Muscle coverage</h2>
      <p class="modal-sub">Days since each muscle was last directly trained (counting exercises where it's a primary mover).</p>
      ${rows.map(r=>`
        <div class="plan-row" style="gap:12px;">
          <span style="flex:0 0 120px;font-size:12.5px;text-transform:capitalize;">${escapeHtml(r.label)}</span>
          ${barFor(r.days)}
          <span style="flex:0 0 82px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);">${r.days===null?'never':r.days+'d ago'}</span>
        </div>`).join('')}
      <div class="modal-actions">
        <button class="btn primary" id="mDone">Close</button>
      </div>
    </div>`);
  m.querySelector('#mClose').addEventListener('click', closeModal);
  m.querySelector('#mDone').addEventListener('click', closeModal);
}

function makeSessionId(dateVal){
  if(!DATA.sessions.some(s=>s.id===dateVal)) return dateVal;
  let n = 2;
  while(DATA.sessions.some(s=>s.id===dateVal+'-'+n)) n++;
  return dateVal+'-'+n;
}

/** Creates a new session for today, copying forward every exercise that was
 *  actually logged in `sourceSessionId`, with progression applied per exercise
 *  from your real training history (same rule the rest of the app uses).
 *  Writes real logged sets immediately with no later review step, so it needs
 *  a confirmation up front — same standard as Reset/Import. Used by the Today
 *  card's "repeat last session" quick action. */
async function repeatSpecificSession(sourceSessionId){
  const source = DATA.sessions.find(s=>s.id===sourceSessionId);
  if(!source){ showToast('Could not find that session.'); return; }
  const cat = source.cat;
  const todayStr = todayLocal();
  if(DATA.sessions.some(s=>s.date===todayStr && s.cat===cat)){ showToast('You already have a '+CATS[cat].label.toLowerCase()+' session today.'); return; }
  const hasAnything = DATA.exercises.some(e=>e.cat===cat && cellSets(e.id+'|'+source.id).length);
  if(!hasAnything){ showToast('Nothing logged in that session to repeat.'); return; }
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));

  const ok = await confirmDialog(
    'Log a new '+CATS[cat].label.toLowerCase()+' session for today, repeating '+source.label+' with progression applied? This writes sets immediately, as if already done.',
    'Log it');
  if(!ok) return;

  const id = makeSessionId(todayStr);
  const d = new Date(todayStr+'T00:00:00');
  const label = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  DATA.sessions.push({id, date:todayStr, label, cat, targets:{}});

  DATA.exercises.filter(e=>e.cat===cat).forEach(e=>{
    const oldSets = cellSets(e.id+'|'+source.id);
    if(!oldSets.length) return;
    const { suggestion } = deterministicSuggestionFor(e.id, sortedSessions);
    if(suggestion) setCellFromText(e.id+'|'+id, suggestion);
    else DATA.cells[e.id+'|'+id] = oldSets.map(s=>Object.assign({}, s));
  });
  scheduleSave();
  showToast('Repeated '+source.label+' with progression applied.');
  currentTab = 'log'; activeCat = cat; render();
}
/** Plans a new session — same exercises as sourceSessionId, with progression
 *  applied to each target — for a date you pick. Nothing gets marked as done;
 *  it lands as a normal planned session, editable and loggable like any other. */
function planSpecificSession(sourceSessionId){
  const source = DATA.sessions.find(s=>s.id===sourceSessionId);
  if(!source){ showToast('Could not find that session.'); return; }
  const cat = source.cat;
  const exIds = DATA.exercises.filter(e=>e.cat===cat && cellSets(e.id+'|'+source.id).length).map(e=>e.id);
  if(!exIds.length){ showToast('Nothing logged in that session to plan from.'); return; }

  const todayStr = todayLocal();
  const m = openModal(`
    <div class="modal" style="max-width:380px;">
      <button class="modal-close" id="mClose">&times;</button>
      <h2>Plan a new session</h2>
      <p class="modal-sub">Same ${exIds.length} exercise${exIds.length===1?'':'s'} as ${escapeHtml(source.label)}, with progression applied to each target. Nothing is logged — it's added as a plan.</p>
      <div class="field"><label for="fPlanDate">Date</label><input type="date" id="fPlanDate" value="${todayStr}"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="mCancel">Cancel</button>
        <button class="btn primary" id="mSave">Plan it</button>
      </div>
    </div>`);
  m.querySelector('#mClose').addEventListener('click', closeModal);
  m.querySelector('#mCancel').addEventListener('click', closeModal);
  m.querySelector('#mSave').addEventListener('click', ()=>{
    const dateVal = m.querySelector('#fPlanDate').value;
    if(!dateVal) return;
    if(DATA.sessions.some(s=>s.date===dateVal && s.cat===cat)){
      showToast('You already have a '+CATS[cat].label.toLowerCase()+' session on that date.');
      return;
    }
    const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
    const id = makeSessionId(dateVal);
    const label = new Date(dateVal+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const targets = {};
    exIds.forEach(exId=>{
      const { suggestion } = deterministicSuggestionFor(exId, sortedSessions);
      targets[exId] = suggestion ? parseSetsFromText(suggestion) : [];
    });
    DATA.sessions.push({id, date:dateVal, label, cat, targets});
    scheduleSave();
    closeModal();
    showToast('Planned for '+label+', based on '+source.label+'.');
    render();
  });
}
async function repeatLastSession(cat){
  const todayStr = todayLocal();
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  const lastSession = sortedSessions.filter(s=>s.cat===cat && s.date<=todayStr).slice(-1)[0];
  if(!lastSession){ showToast('No previous '+CATS[cat].label.toLowerCase()+' session to repeat yet.'); return; }
  await repeatSpecificSession(lastSession.id);
}
function saveSessionAsTemplate(sessionId, defaultName){
  const session = DATA.sessions.find(s=>s.id===sessionId);
  if(!session) return;
  const exercises = DATA.exercises
    .filter(e=>cellSets(e.id+'|'+sessionId).length)
    .map(e=>({ exId:e.id, exName:e.name, sets: cellSets(e.id+'|'+sessionId).map(s=>Object.assign({}, s)) }));
  if(!exercises.length){ showToast('Nothing logged in this session to save yet.'); return; }
  openTemplateNameModal(defaultName||'', (name)=>{
    if(!name) return;
    DATA.templates.push({ id:'tpl-'+Date.now(), name, cat:session.cat, exercises });
    scheduleSave();
    showToast('Template saved: '+name);
  });
}
function applyTemplate(templateId, dateVal, useProgression){
  const template = DATA.templates.find(t=>t.id===templateId);
  if(!template) return null;
  const id = makeSessionId(dateVal);
  const d = new Date(dateVal+'T00:00:00');
  const label = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const todayStr = todayLocal();
  const isFuture = dateVal > todayStr;
  const targets = {};
  // compute progression from history BEFORE the new (empty) session exists, so
  // deterministicSuggestionFor can't ever accidentally see it mid-loop
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  DATA.sessions.push({id, date:dateVal, label, cat:template.cat, targets});
  template.exercises.forEach(te=>{
    if(!DATA.exercises.some(e=>e.id===te.exId)) return; // exercise since deleted
    let sets = te.sets.map(s=>Object.assign({}, s));
    if(useProgression){
      const { suggestion } = deterministicSuggestionFor(te.exId, sortedSessions);
      if(suggestion) sets = parseSetsFromText(suggestion);
    }
    if(isFuture) targets[te.exId] = sets;
    else DATA.cells[te.exId+'|'+id] = tagSets(sets, machineForNewSets(te.exId+'|'+id));
  });
  scheduleSave();
  return {id, cat:template.cat};
}
function openTemplateNameModal(defaultName, onSave){

  m.querySelector('#mClose').addEventListener('click', closeModal);

  m.querySelector('#mSave').addEventListener('click', ()=>{
    const name = m.querySelector('#tplName').value.trim();
    closeModal();
    onSave(name);
  });
}

/** Markup for a searchable exercise picker: a text input plus a results list.
 *  Replaces the old plain <select> with every exercise in one long alphabetical
 *  list — which meant scrolling through everything to find one specific exercise. */
function exercisePickerHTML(placeholder){
  return `<input type="text" class="ex-picker-search" placeholder="${escapeHtml(placeholder||'Type to search exercises…')}">
    <div class="ex-picker-results"></div>`;
}
/** All exercises, grouped by split and alphabetised within it, minus any ids to
 *  exclude (typically whatever's already in the session's pool). */
function buildExerciseCandidates(excludeIds){
  const exclude = excludeIds instanceof Set ? excludeIds : new Set(excludeIds||[]);
  return CAT_ORDER.flatMap(c=>
    DATA.exercises.filter(e=>e.cat===c && !exclude.has(e.id))
      .sort((a,b)=>a.name.localeCompare(b.name))
      .map(e=>({ id:e.id, name:e.name, catLabel:CATS[c].label, catColor:CATS[c].color })));
}
/** Wires a picker rendered from exercisePickerHTML: filters `candidates` live as
 *  the person types (matching name or split label), and calls onPick(exId) the
 *  moment a result is clicked — no separate "confirm" step needed. */
function wireExercisePicker(root, candidates, onPick, noAutoFocus){
  const searchInput = root.querySelector('.ex-picker-search');
  const resultsEl = root.querySelector('.ex-picker-results');
  const draw = (q)=>{
    q = (q||'').trim().toLowerCase();
    const matches = !q ? candidates : candidates.filter(e=>
      e.name.toLowerCase().includes(q) || e.catLabel.toLowerCase().includes(q));
    if(!matches.length){
      resultsEl.innerHTML = `<div class="ex-picker-empty">No matching exercise.</div>`;
      return;
    }
    resultsEl.innerHTML = matches.slice(0,80).map(e=>`
      <button type="button" class="ex-picker-row" data-pick-ex="${e.id}">
        <span class="dot" style="background:${e.catColor}"></span>
        <span class="ex-picker-name">${escapeHtml(e.name)}</span>
        <span class="ex-picker-cat">${escapeHtml(e.catLabel)}</span>
      </button>`).join('');
    resultsEl.querySelectorAll('[data-pick-ex]').forEach(btn=>
      btn.addEventListener('click', ()=>onPick(btn.dataset.pickEx)));
  };
  draw('');
  searchInput.addEventListener('input', ()=>draw(searchInput.value));
  if(!noAutoFocus) setTimeout(()=>autoFocus(searchInput), 20);
}

/**
 * The workout screen. Every exercise arrives with today's sets already filled in
 * (the plan's targets, else the progression suggestion from last time at this gym),
 * so a set done as planned is one tap on ✓. Anything different is a +/− tap on the
 * weight or reps, never typing — the text box is still there behind "Type" for
 * anyone who prefers it. Edits redraw just the row they touch, so nothing jumps.
 */
function openWorkoutMode(sessionId){
  const session = DATA.sessions.find(s=>s.id===sessionId);
  if(!session) return;
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  const priorSessions = sortedSessions.filter(s=>s.id!==session.id);
  const rebuildPool = ()=>buildPoolForSession(session, sortedSessions, 6, 2);
  let pool = rebuildPool();
  let prsThisWorkout = 0;
  const drafts = {};        // exId -> sets on screen that haven't been logged yet
  const typing = new Set(); // exIds switched over to the free-text box
  const prTimers = {};
  const exById = (id)=>DATA.exercises.find(e=>e.id===id);
  const keyOf = (exId)=>exId+'|'+sessionId;
  const gymFor = (ex)=>isGymSpecific(ex) ? gymForSession(sessionId) : '';
  // parsed sets can share one weight object between them, so copies get their own
  const cloneSet = (s)=>Object.assign({}, s, { weight: s.weight ? Object.assign({}, s.weight) : s.weight });

  // a session with machine work already logged stays pinned to the gym it happened at
  if(!machineById(session.gym)){
    const loggedGym = DATA.exercises.map(e=>machineOfCell(keyOf(e.id))).find(Boolean);
    if(loggedGym) session.gym = loggedGym;
  }

  const historyFor = (ex)=>{
    const machineId = gymFor(ex);
    const recentSets = [];
    for(let i=priorSessions.length-1; i>=0 && recentSets.length<2; i--){
      const sets = DATA.cells[ex.id+'|'+priorSessions[i].id];
      if(sets && sets.length && machineOfSets(sets)===machineId){
        recentSets.push({
          dateLabel: new Date(priorSessions[i].date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}),
          text: setsToText(sets),
        });
      }
    }
    const { low, high } = repRangeFor(ex);
    if(!recentSets.length){
      const elsewhere = machinesUsedFor(ex.id).some(m=>m!==machineId);
      return { recentSets, warning:null, hint: elsewhere
        ? `${low}–${high} rep range — first time at this gym (machines differ), so set today's weight`
        : `${low}–${high} rep range — no history yet, so set a starting weight` };
    }
    const d = deterministicSuggestionFor(ex.id, priorSessions, machineId);
    return { recentSets, hint: d.hint, warning: d.warning };
  };

  const isTimed = (ex)=>/plank|hold|carry|\bhang|wall sit/i.test(ex.name);
  const draftFor = (ex)=>{
    if(drafts[ex.id]) return drafts[ex.id];
    let sets = targetSets(session, ex.id);
    if(!sets.length) sets = parseSetsFromText(deterministicSuggestionFor(ex.id, priorSessions, gymFor(ex)).suggestion);
    if(!sets.length){
      const { low } = repRangeFor(ex);
      const weight = equipmentOf(ex)==='bodyweight' || isTimed(ex) ? {type:'bw'} : {type:'kg', value:0};
      sets = [0,1,2].map(()=>({ weight, reps:low, perSide:false, isSeconds:isTimed(ex), rir:null }));
    }
    // a plan is a target, not a record: drop last time's effort ratings and gym tag
    return (drafts[ex.id] = sets.map(s=>{ const c = cloneSet(s); c.rir = null; delete c.machine; return c; }));
  };
  const setsFor = (exId)=>{
    const logged = cellSets(keyOf(exId));
    return logged.length ? { sets: logged, logged: true } : { sets: draftFor(exById(exId)), logged: false };
  };

  const stepBtn = (exId, i, field, dir, label)=>
    `<button type="button" data-step="${field}" data-dir="${dir}" data-ex="${exId}" data-i="${i}" aria-label="${label}">${dir<0?'−':'+'}</button>`;
  const setRowsHTML = (ex, sets)=>sets.map((s,i)=>{
    const loaded = s.weight && s.weight.type==='kg';
    const w = loaded
      ? `<div class="stepper">${stepBtn(ex.id,i,'w',-1,'Less weight')}<span class="set-val ${s.weight.value?'':'unset'}">${s.weight.value}<small>kg</small></span>${stepBtn(ex.id,i,'w',1,'More weight')}</div>`
      : `<div class="stepper static"><span class="set-val">${formatWeight(s.weight)}</span></div>`;
    const r = `<div class="stepper">${stepBtn(ex.id,i,'r',-1,'Fewer')}<span class="set-val">${s.reps}<small>${s.isSeconds?'sec':'reps'}${s.perSide?' ea':''}</small></span>${stepBtn(ex.id,i,'r',1,'More')}</div>`;
    return `<div class="set-row"><span class="set-n">${i+1}</span>${w}${r}<button type="button" class="set-del" data-del-set="${ex.id}" data-i="${i}" aria-label="Remove set">×</button></div>`;
  }).join('');

  const rowHTML = (e, i)=>{
    const { sets, logged } = setsFor(e.id);
    const h = historyFor(e);
    const body = typing.has(e.id)
      ? `<input type="text" value="${escapeHtml(logged?setsToText(sets):'').replace(/"/g,'&quot;')}" data-workout-ex="${e.id}" placeholder="${escapeHtml(setsToText(sets)||'e.g. 50kg 8, 8, 8')}">
         <div class="workout-actions"><button type="button" class="btn ghost" data-type-done="${e.id}">Use buttons</button></div>`
      : `<div class="set-list">${setRowsHTML(e, sets)}</div>
         <div class="workout-actions">
           ${logged ? `<span class="logged-tag">✓ Logged</span><button type="button" class="btn ghost" data-unlog="${e.id}">Undo</button>`
                    : `<button type="button" class="btn primary btn-log" data-log="${e.id}" ${sets.length?'':'disabled'}>✓ Done</button>`}
           <button type="button" class="btn ghost" data-add-set="${e.id}">+ Set</button>
           <button type="button" class="btn ghost" data-type="${e.id}">Type</button>
         </div>`;
    return `<div class="workout-ex ${logged?'done':''}" data-workout-row="${e.id}">
      <div class="workout-ex-head">
        <div class="workout-ex-name">${i+1}. ${escapeHtml(e.name)}</div>
        <div class="workout-ex-move">
          <button class="btn ghost" data-ex-up="${e.id}" title="Move earlier" ${i===0?'disabled':''}>↑</button>
          <button class="btn ghost" data-ex-down="${e.id}" title="Move later" ${i===pool.length-1?'disabled':''}>↓</button>
          <button class="btn ghost" data-ex-swap="${e.id}" title="Swap for a different exercise">⇄</button>
          <button class="btn ghost" data-ex-remove="${e.id}" title="Not doing this one — remove from session">×</button>
        </div>
      </div>
      ${h.recentSets.map((s,idx)=>`<div class="workout-ex-target">${idx===0?'Last time':'Before that'}: ${escapeHtml(s.text)} <span style="color:var(--text-faint);">(${escapeHtml(s.dateLabel)})</span></div>`).join('')}
      ${h.hint ? `<div class="workout-ex-hint">${escapeHtml(h.hint)}</div>` : ''}
      ${h.warning ? `<div class="workout-ex-warn">${escapeHtml(h.warning)}</div>` : ''}
      ${body}
    </div>`;
  };

  const gymBarHTML = ()=>{
    const gyms = DATA.machines||[];
    if(!gyms.length){
      return pool.some(isGymSpecific)
        ? `<div class="gym-chips"><span>Train at more than one gym?</span><button type="button" class="chip" data-add-gym>+ Add gym</button></div>` : '';
    }
    return `<div class="gym-chips"><span>At</span>${gymChipsHTML(gymForSession(sessionId), 'data-gym',
      `<button type="button" class="chip" data-add-gym aria-label="Add a gym">+</button><a class="inline-link" data-edit-gyms>edit</a>`)}</div>`;
  };

  const overlay = document.createElement('div');
  overlay.className = 'workout-overlay';
  overlay.dataset.sessionId = sessionId;

  const pinExerciseToSession = (exId)=>{
    // an empty target is what pins the exercise to this session
    session.targets = session.targets || {};
    if(!session.targets[exId] && !cellSets(keyOf(exId)).length){
      const { suggestion } = deterministicSuggestionFor(exId, priorSessions);
      session.targets[exId] = suggestion ? parseSetsFromText(suggestion) : [];
    }
    session.excluded = (session.excluded||[]).filter(id=>id!==exId);
  };
  const renderAll = ()=>{
    const top = overlay.scrollTop;
    overlay.innerHTML = `
      <div class="workout-head">
        <div class="workout-title">${CATS[session.cat].label} · ${session.label}</div>
        <button class="btn" data-finish>Finish</button>
      </div>
      ${gymBarHTML()}
      ${pool.map(rowHTML).join('')}
      <div class="workout-ex" style="border-style:dashed;">
        <div class="workout-ex-name" style="margin-bottom:10px;">Add an exercise</div>
        <div class="ex-picker" id="addWorkoutExPicker">${exercisePickerHTML()}</div>
      </div>`;
    overlay.scrollTop = top;
    wireExercisePicker(overlay.querySelector('#addWorkoutExPicker'), buildExerciseCandidates(pool.map(p=>p.id)), (exId)=>{
      pinExerciseToSession(exId);
      scheduleSave();
      pool = rebuildPool();
      renderAll();
    }, true);
  };
  const refreshRow = (exId)=>{
    const row = overlay.querySelector(`[data-workout-row="${exId}"]`);
    const i = pool.findIndex(p=>p.id===exId);
    if(!row || i<0) return renderAll();
    const tmp = document.createElement('div');
    tmp.innerHTML = rowHTML(pool[i], i);
    row.replaceWith(tmp.firstElementChild);
  };

  // edits to an already-logged entry save straight away; a lowered number can undo
  // a record, so that replays history, while a raised one is checked once you pause
  const savedEdit = (exId, lowered)=>{
    scheduleSave(); updateStatRow();
    clearTimeout(prTimers[exId]);
    if(lowered) rebuildPRRecordsFromHistory();
    else prTimers[exId] = setTimeout(()=>{
      if(cellSets(keyOf(exId)).length) prsThisWorkout += checkForPR(exId, exById(exId).name, sessionId);
    }, 1500);
  };
  const commitText = (input)=>{
    const exId = input.dataset.workoutEx;
    const key = keyOf(exId);
    const raw = input.value.trim();
    if(raw === cellText(key)) return;
    if(!raw){
      if(cellSets(key).length){
        drafts[exId] = cellSets(key).map(s=>{ const c = cloneSet(s); delete c.machine; return c; });
        delete DATA.cells[key];
        rebuildPRRecordsFromHistory();
      }
    } else {
      if(!parseSetsFromText(raw).length){ showToast("Couldn't read that — try something like 50kg 8, 8, 8"); return; }
      setCellFromText(key, raw);
      prsThisWorkout += checkForPR(exId, exById(exId).name, sessionId);
      warnIfOddReps(exId, sessionId);
    }
    scheduleSave(); updateStatRow();
    const row = input.closest('[data-workout-row]');
    if(row) row.classList.toggle('done', cellSets(key).length>0);
  };
  const flushTyped = ()=>overlay.querySelectorAll('[data-workout-ex]').forEach(commitText);
  const resetGymDrafts = ()=>Object.keys(drafts).forEach(id=>{ if(isGymSpecific(exById(id))) delete drafts[id]; });
  // moving the session to a gym takes whatever machine work is already logged with it
  const setSessionGym = (gymId)=>{
    session.gym = gymId; DATA.currentGym = gymId;
    DATA.exercises.filter(isGymSpecific).forEach(ex=>{
      const c = DATA.cells[keyOf(ex.id)];
      if(c && c.length) tagSets(c, gymId);
    });
    rebuildPRRecordsFromHistory();
    resetGymDrafts();
    scheduleSave();
  };

  overlay.addEventListener('click', async (e)=>{
    const b = e.target.closest('button, a');
    if(!b || !overlay.contains(b) || b.disabled) return;
    const d = b.dataset;

    if(d.step){
      const { sets, logged } = setsFor(d.ex);
      const i = +d.i, dir = +d.dir, s = sets[i];
      if(!s) return;
      if(d.step==='w'){
        const old = s.weight.value;
        const step = (dir>0 ? old : old-0.001) < 10 ? 0.5 : (dir>0 ? old : old-0.001) < 20 ? 1 : 2.5;
        const nv = Math.max(0, Math.round((old + dir*step)*100)/100);
        // the sets after this one at the same weight move with it, so changing
        // the working weight is one tap rather than one per set
        s.weight = {type:'kg', value:nv};
        for(let j=i+1; j<sets.length && sets[j].weight && sets[j].weight.type==='kg' && sets[j].weight.value===old; j++){
          sets[j].weight = {type:'kg', value:nv};
        }
      } else {
        const step = s.isSeconds ? 5 : 1;
        s.reps = Math.max(step, s.reps + dir*step);
      }
      if(logged) savedEdit(d.ex, dir<0);
      refreshRow(d.ex);
      return;
    }
    if(d.log){
      const ex = exById(d.log);
      const sets = draftFor(ex);
      if(sets.some(s=>s.weight && s.weight.type==='kg' && !s.weight.value)){
        showToast('Set the weight with + first.');
        return;
      }
      DATA.cells[keyOf(ex.id)] = tagSets(sets.map(cloneSet), gymFor(ex));
      delete drafts[ex.id];
      scheduleSave(); updateStatRow();
      prsThisWorkout += checkForPR(ex.id, ex.name, sessionId);
      refreshRow(ex.id);
      // carry on to the next exercise still to do
      const rows = [...overlay.querySelectorAll('[data-workout-row]')];
      const at = rows.findIndex(r=>r.dataset.workoutRow===ex.id);
      const next = rows.slice(at+1).concat(rows.slice(0, at)).find(r=>!r.classList.contains('done'));
      if(next) next.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    if(d.unlog){
      const key = keyOf(d.unlog);
      drafts[d.unlog] = cellSets(key).map(s=>{ const c = cloneSet(s); delete c.machine; return c; });
      delete DATA.cells[key];
      rebuildPRRecordsFromHistory();
      scheduleSave(); updateStatRow();
      refreshRow(d.unlog);
      return;
    }
    if(d.addSet){
      const { sets, logged } = setsFor(d.addSet);
      const last = sets[sets.length-1];
      const ex = exById(d.addSet);
      sets.push(last ? cloneSet(last) : { weight: equipmentOf(ex)==='bodyweight' ? {type:'bw'} : {type:'kg', value:0}, reps: repRangeFor(ex).low, perSide:false, isSeconds:isTimed(ex), rir:null });
      if(logged) savedEdit(d.addSet, false);
      refreshRow(d.addSet);
      return;
    }
    if(d.delSet){
      const { sets, logged } = setsFor(d.delSet);
      sets.splice(+d.i, 1);
      if(logged && !sets.length){ delete DATA.cells[keyOf(d.delSet)]; drafts[d.delSet] = []; }
      if(logged) savedEdit(d.delSet, true);
      refreshRow(d.delSet);
      return;
    }
    if(d.type){
      typing.add(d.type);
      refreshRow(d.type);
      const inp = overlay.querySelector(`[data-workout-ex="${d.type}"]`);
      if(inp) inp.focus();
      return;
    }
    if(d.typeDone){
      const inp = overlay.querySelector(`[data-workout-ex="${d.typeDone}"]`);
      if(inp) commitText(inp);
      typing.delete(d.typeDone);
      refreshRow(d.typeDone);
      return;
    }
    if(d.gym){
      if(d.gym===gymForSession(sessionId)) return;
      flushTyped();
      setSessionGym(d.gym);
      renderAll();
      return;
    }
    if(d.addGym!==undefined){
      flushTyped();
      const name = await promptGymName('Add a gym', '');
      if(!name) return;
      const { id, adopted } = addGym(name);
      setSessionGym(id);
      renderAll();
      if(adopted.length) showToast(`Your earlier machine & cable logs now count as ${name}.`, ()=>{
        adopted.forEach(k=>tagSets(DATA.cells[k], ''));
        rebuildPRRecordsFromHistory(); resetGymDrafts(); scheduleSave();
        if(document.body.contains(overlay)) renderAll();
      });
      return;
    }
    if(d.editGyms!==undefined){
      flushTyped();
      openManageGymsModal(()=>{ if(document.body.contains(overlay)){ resetGymDrafts(); renderAll(); } });
      return;
    }
    if(d.exUp || d.exDown){
      flushTyped();
      moveExerciseInSession(session, pool, d.exUp || d.exDown, d.exUp ? -1 : 1);
      pool = rebuildPool();
      renderAll();
      return;
    }
    if(d.exRemove){
      if(cellSets(keyOf(d.exRemove)).length){
        showToast("That one's already logged — tap Undo on it first if you want it gone.");
        return;
      }
      flushTyped();
      excludeExerciseFromSession(session, d.exRemove);
      pool = rebuildPool();
      renderAll();
      return;
    }
    if(d.exSwap){
      const oldExId = d.exSwap;
      if(cellSets(keyOf(oldExId)).length){
        showToast("That one's already logged — tap Undo on it first if you want to swap it.");
        return;
      }
      flushTyped();
      const oldEx = exById(oldExId);
      const m = openModal(`
        <div class="modal" style="max-width:420px;">
          <button class="modal-close" id="mClose">&times;</button>
          <h2>Swap ${escapeHtml(oldEx?oldEx.name:'exercise')}</h2>
          <p class="modal-sub">Pick a replacement — it goes straight into this slot.</p>
          <div class="ex-picker">${exercisePickerHTML('Type to search…')}</div>
        </div>`);
      m.querySelector('#mClose').addEventListener('click', closeModal);
      wireExercisePicker(m.querySelector('.ex-picker'), buildExerciseCandidates(pool.map(p=>p.id)), (newExId)=>{
        excludeExerciseFromSession(session, oldExId);
        pinExerciseToSession(newExId);
        scheduleSave();
        closeModal();
        pool = rebuildPool();
        renderAll();
      });
      return;
    }
    if(d.finish!==undefined){
      flushTyped();
      Object.values(prTimers).forEach(clearTimeout);
      overlay.remove();
      showWorkoutSummary(session, pool, priorSessions, prsThisWorkout);
    }
  });
  overlay.addEventListener('focusout', (e)=>{
    if(e.target.matches && e.target.matches('[data-workout-ex]')) commitText(e.target);
  });
  overlay.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter' || !e.target.matches('[data-workout-ex]')) return;
    e.preventDefault();
    const exId = e.target.dataset.workoutEx;
    commitText(e.target);
    typing.delete(exId);
    refreshRow(exId);
  });

  renderAll();
  document.body.appendChild(overlay);
  const firstIncomplete = overlay.querySelector('[data-workout-row]:not(.done)');
  if(firstIncomplete) firstIncomplete.scrollIntoView({block:'center'});
}

/**
 * "Target beaten / met / held short" verdict comparing planned targets against
 * what was actually logged. Compares total reps at the heaviest common weight
 * where possible, otherwise falls back to a simple set-count comparison.
 */
function compareTargetToActual(targetSetsArr, actualSetsArr){
  if(!actualSetsArr.length) return null;
  if(!targetSetsArr.length) return 'logged';
  const verdict = (a,b)=> a>b ? 'beaten' : a<b ? 'short' : 'met';
  const totalReps = (arr)=>arr.reduce((n,x)=>n+(x.reps||0),0);

  const topWeightOf = (arr)=>Math.max(...arr.map(s=>s.weight && s.weight.type==='kg' && !s.isSeconds ? s.weight.value : 0));
  const targetTopWeight = topWeightOf(targetSetsArr);
  const actualTopWeight = topWeightOf(actualSetsArr);

  // loaded work: heaviest weight first, then total reps at that level
  if(targetTopWeight>0 || actualTopWeight>0){
    if(actualTopWeight!==targetTopWeight) return verdict(actualTopWeight, targetTopWeight);
    return verdict(totalReps(actualSetsArr), totalReps(targetSetsArr));
  }

  // timed work (planks, holds, carries): compare total time under tension. Comparing
  // set *count* here would call 3×10s a "met" against a 3×30s target.
  const anyTimed = targetSetsArr.some(s=>s.isSeconds) || actualSetsArr.some(s=>s.isSeconds);
  if(anyTimed){
    const seconds = (arr)=>arr.reduce((n,x)=>n+(x.isSeconds ? (x.reps||0) : 0),0);
    return verdict(seconds(actualSetsArr), seconds(targetSetsArr));
  }

  // unloaded rep work (pull-ups, dips, bodyweight): compare total reps, not set count
  return verdict(totalReps(actualSetsArr), totalReps(targetSetsArr));
}
const TARGET_VERDICT_LABEL = { beaten:'Target beaten', met:'Target met', short:'Held short', logged:'Logged' };

function showWorkoutSummary(session, pool, priorSessions, prsThisWorkout){
  let totalSets = 0, volumeKg = 0;
  const rows = pool.map(e=>{
    const actual = cellSets(e.id+'|'+session.id);
    if(!actual.length) return null;
    totalSets += actual.length;
    volumeKg += setsVolumeKg(actual);
    const planned = targetSets(session, e.id);
    const compareAgainst = planned.length ? planned : (()=>{
      const { suggestion } = deterministicSuggestionFor(e.id, priorSessions, machineOfSets(actual));
      return parseSetsFromText(suggestion);
    })();
    const verdict = compareTargetToActual(compareAgainst, actual);
    return { name:e.name, actualText:setsToText(actual), verdict };
  }).filter(Boolean);

  const m = openModal(`
    <div class="modal">
      <button class="modal-close" id="mClose">&times;</button>
      <h2>Workout complete</h2>
      <p class="modal-sub">${CATS[session.cat].label} · ${session.label}</p>
      <div class="stat-row" style="margin:4px 0 20px;">
        <div class="stat"><b style="font-size:22px;">${rows.length}/${pool.length}</b><span>exercises</span></div>
        <div class="stat"><b style="font-size:22px;">${totalSets}</b><span>sets</span></div>
        <div class="stat"><b style="font-size:22px;">${volumeKg?Math.round(volumeKg).toLocaleString():'—'}</b><span>kg volume</span></div>

    </div>`);
  m.querySelector('#mClose').addEventListener('click', closeModal);

}
function openModal(html){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = html;
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeModal(); });
  document.body.appendChild(wrap);
  const modalEl = wrap.querySelector('.modal');
  if(modalEl){ modalEl.setAttribute('role','dialog'); modalEl.setAttribute('aria-modal','true'); }
  const escHandler = (e)=>{ if(e.key==='Escape'){ closeModal(); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
  setTimeout(()=>autoFocus(wrap.querySelector('input, select, button:not(.modal-close)')), 20);
  return wrap;
}

/* ---------- mobile scroll stability ----------
   On phones, three things made the page jump: focusing a field when a pop-up
   opens (the keyboard or date picker pops up and the browser scrolls to "reveal"
   it), scrolls inside a pop-up carrying on into the page behind, and pop-ups that
   redraw themselves snapping back to the top. */
const IS_TOUCH = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
/** Focus for keyboard users on desktop; on touch screens leave it to the tap. */
function autoFocus(el, select){
  if(!el || IS_TOUCH) return;
  el.focus({preventScroll:true});
  if(select && el.select) el.select();
}
/** Pins the page in place while any pop-up or the workout screen is open, and puts
 *  it back exactly where it was afterwards. Watches the DOM so every pop-up —
 *  however it was opened — is covered. */
let scrollLockY = null;
function syncScrollLock(){
  const open = !!document.querySelector('body > .modal-backdrop, body > .workout-overlay');
  const body = document.body;
  if(open && scrollLockY===null){
    scrollLockY = window.scrollY;
    body.style.position = 'fixed'; body.style.top = (-scrollLockY)+'px';
    body.style.left = '0'; body.style.right = '0';
  } else if(!open && scrollLockY!==null){
    const y = scrollLockY; scrollLockY = null;
    body.style.position = ''; body.style.top = ''; body.style.left = ''; body.style.right = '';
    window.scrollTo(0, y);
  }
}
new MutationObserver(syncScrollLock).observe(document.body, {childList:true});
