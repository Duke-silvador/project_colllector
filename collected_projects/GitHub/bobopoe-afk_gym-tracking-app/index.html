/* ============================= LOG SESSION (paste-in) ============================= */

/** Best-effort category guess for a freshly-typed exercise name, used by the paste-log flow. */
function guessCategory(name){
  const n = (name||'').toLowerCase();
  // core/prehab checked first: these contain words like "curl" and "raise" that would
  // otherwise get swept into pull/push (e.g. wrist curl, neck curl, Copenhagen plank)
  if(/plank|crunch|ab-?wheel|rollout|pallof|sit-?up|dead ?bug|hollow|oblique|carry|neck|wrist|external rotation|internal rotation|cuff/.test(n)) return 'aux';
  if(/single[- ]leg|bulgarian|pistol|split squat|lunge|step-?up|copenhagen/.test(n)) return 'leg';
  if(/nordic|ham(string)? curl|leg curl|glute[- ]ham/.test(n)) return 'bilat';
  if(/squat|deadlift|rdl|romanian|leg press|hip thrust|glute bridge|booty|calf raise|hip adduct|hip abduct|good morning/.test(n)) return 'bilat';
  if(/press|bench|push|dip|fly|pec deck|overhead|shoulder press|lateral raise|tricep|pushdown|pressdown/.test(n)) return 'push';
  if(/row|pulldown|pull-?up|chin-?up|\blat\b|curl|face pull|shrug|back extension|straight-arm|rear delt/.test(n)) return 'pull';
  return 'aux';
}

/** Every existing exercise a pasted name could plausibly mean, best match first.
 *  "incline dumbbell" matches both the press and the curl, so the UI can ask
 *  rather than silently picking whichever happens to come first. */
function candidateExercisesFor(name){
  const lower = (name||'').trim().toLowerCase();
  if(!lower) return [];
  const exact = DATA.exercises.filter(e=>e.name.toLowerCase()===lower);
  const partial = DATA.exercises.filter(e=>{
    const n = e.name.toLowerCase();
    return n!==lower && (n.includes(lower) || lower.includes(n));
  }).sort((a,b)=>a.name.length-b.name.length);
  return exact.concat(partial);
}

/** Finds an existing exercise by (loose) name match, or creates a new one with a guessed category. */
function resolveOrCreateExercise(name){
  const clean = name.trim();
  if(!clean) return null;
  const lower = clean.toLowerCase();
  let ex = DATA.exercises.find(e=>e.name.toLowerCase()===lower);
  if(!ex) ex = DATA.exercises.find(e=> e.name.toLowerCase().includes(lower) || lower.includes(e.name.toLowerCase()));
  if(ex) return ex;
  let id = clean.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || ('exercise-'+Date.now());
  let suffix = 1;
  while(DATA.exercises.some(e=>e.id===id)){ suffix++; id = id+'-'+suffix; }
  ex = { id, name: clean, cat: guessCategory(clean) };
  DATA.exercises.push(ex);
  return ex;
}

/**
 * Parses pasted free-text session notes into {exercise, sets} pairs.
 * Expected format, one exercise per line: "Exercise name: sets text"
 * e.g. "Bench press: 60kg x5, 65kg x5, 65kg x5"
 */
/** Common gym shorthand mapped to real exercise names. */
const NAME_ALIASES = {
  'rdl':'Romanian deadlift',
  'sldl':'Romanian deadlift',
  'bss':'Bulgarian split squat',
  'ohp':'Seated dumbbell shoulder press',
  'bb bench':'Barbell bench press',
  'db bench':'Incline dumbbell press',
  'deadlift':'Barbell deadlift',
  'paloff press':'Pallof press',
  'palloff press':'Pallof press',
  'face pulls':'Face pull',
  'chest supported row':'Chest-supported row',
  'single arm cable row':'Single-arm cable row',
  'lat pulldown':'Lat pulldown',
  'hammer curl':'Hammer curl',
};
function canonicalExerciseName(raw){
  const key = raw.trim().toLowerCase().replace(/\s+/g,' ');
  return NAME_ALIASES[key] || raw.trim();
}

/** A line that's really set data rather than an exercise name — "15kg", "8kgea",
 *  "60kg*10", "12ea". Used so a weight prefix never becomes a new exercise row. */
function looksLikeSetData(text){
  const t = (text||'').trim();
  if(!t) return true;
  if(/^[\d.,\s×x*@+\-]+$/i.test(t)) return true;              // numbers and separators only
  if(/^\d+(\.\d+)?\s*(kg|lb|lbs)\s*(ea|each)?$/i.test(t)) return true; // "15kg", "8kg ea"
  if(/^(bw|bodyweight|bar)$/i.test(t)) return true;
  // any word here that isn't a unit/qualifier means it's probably a name
  const words = t.replace(/\d+(\.\d+)?/g,' ').replace(/[×x*@:,.\-+]/g,' ').split(/\s+/).filter(Boolean);
  return words.length>0 && words.every(wd=>/^(kg|lb|lbs|ea|each|sec|secs|second|seconds|s|side|rir|bw|reps?|sets?|x)$/i.test(wd));
}

/**
 * Parses pasted session notes into {exercise, sets} pairs.
 *
 * Handles both shapes people actually write:
 *   "Bench press: 60kg x5, 65kg x5"          (name and sets on one line)
 *   "Bench press:"  /  "60kg x5, 65kg x5"    (name on its own line, sets below)
 * and continuation lines, so an exercise's sets can span several lines.
 *
 * Returns { parsed, unparsed } — unparsed holds lines it couldn't make sense of, so
 * the UI can show them rather than silently dropping work.
 */
function parseSessionPasteText(text){
  const rawLines = (text||'').split('\n');
  const parsed = [];
  const unparsed = [];
  let current = null;

  const pushSets = (setsText, lineNo, line)=>{
    const sets = parseSetsFromText(setsText);
    if(!sets.length){ unparsed.push({line:lineNo, text:line}); return; }
    if(current){ current.sets = current.sets.concat(sets); }
    else unparsed.push({line:lineNo, text:line});
  };

  rawLines.forEach((rawLine, i)=>{
    const line = rawLine.trim();
    if(!line) return;
    const lineNo = i+1;
    const idx = line.indexOf(':');

    if(idx>=0){
      const before = line.slice(0, idx).trim();
      const after = line.slice(idx+1).trim();
      // "15kg: 12ea, 12ea" — the bit before the colon is a weight, not an exercise
      if(before && !looksLikeSetData(before)){
        current = { name: canonicalExerciseName(before), sets: [] };
        parsed.push(current);
        if(after) pushSets(after, lineNo, line);
        return;
      }
      // weight prefix applies to the sets that follow it on the same line
      if(before && after){ pushSets(before+' '+after, lineNo, line); return; }
      if(after){ pushSets(after, lineNo, line); return; }
    }

    if(looksLikeSetData(line)){ pushSets(line, lineNo, line); return; }

    // a bare line of words: a new exercise heading
    current = { name: canonicalExerciseName(line), sets: [] };
    parsed.push(current);
  });

  // headings that never got any sets aren't real entries
  const complete = parsed.filter(pEntry=>{
    if(pEntry.sets.length) return true;
    unparsed.push({line:null, text:pEntry.name+' (no sets found)'});
    return false;
  });
  return { parsed: complete, unparsed };
}

function openLogSessionModal(defaultDate, defaultCat){
  const state = { date: defaultDate || todayLocal(), text: '', preview: null };
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  document.body.appendChild(wrap);
  wrap.addEventListener('click', e=>{ if(e.target===wrap) wrap.remove(); });
  document.addEventListener('keydown', escCloseOnce);
  function escCloseOnce(e){ if(e.key==='Escape'){ wrap.remove(); document.removeEventListener('keydown', escCloseOnce); } }
  const close = ()=>{ wrap.remove(); document.removeEventListener('keydown', escCloseOnce); };

  // redraws keep the pop-up scrolled where it was, instead of snapping to the top
  function draw(){
    const prev = wrap.querySelector('.modal'); const top = prev ? prev.scrollTop : 0;
    drawContent();
    const next = wrap.querySelector('.modal'); if(next) next.scrollTop = top;
  }
  function drawContent(){
    if(!state.preview){
      wrap.innerHTML = `
        <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="logSessTitle">
          <button class="modal-close" id="mClose" aria-label="Close">&times;</button>
          <h2 id="logSessTitle">Log a session</h2>
          <p class="modal-sub">Record what you actually did — any mix of exercises lands in one session. Paste it however you write it: name and sets on one line, or the name on its own line with the sets underneath.</p>
          <div class="field"><label for="fDate">Date</label><input type="date" id="fDate" value="${state.date}"></div>
          <div class="field">
            <label for="fPaste">Your session</label>
            <textarea id="fPaste" rows="10" style="width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 11px;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;resize:vertical;" placeholder="RDL:
60kg*10, 70kg*8, 70kg*8

Lat pulldown:
45*12, 55*10

Chest supported row:
15ea*10, 10, 10">${escapeHtml(state.text)}</textarea>
          </div>
          <div id="parseErrorHost"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="mCancel">Cancel</button>
            <button class="btn primary" id="mPreview">Check it</button>
          </div>
        </div>`;
      wrap.querySelector('#mClose').addEventListener('click', close);
      wrap.querySelector('#mCancel').addEventListener('click', close);
      wrap.querySelector('#fDate').addEventListener('change', e=>{ state.date = e.target.value; });
      wrap.querySelector('#mPreview').addEventListener('click', ()=>{
        state.text = wrap.querySelector('#fPaste').value;
        state.date = wrap.querySelector('#fDate').value || state.date;
        const result = parseSessionPasteText(state.text);
        if(!result.parsed.length){
          wrap.querySelector('#parseErrorHost').innerHTML = `<p class="plan-error">Couldn't find any exercises in that. Put the exercise name on a line, and its sets after a colon or on the next line.</p>`;
          return;
        }
        state.preview = result;
        draw();
      });
      setTimeout(()=>autoFocus(wrap.querySelector('#fPaste')), 20);
      return;
    }

    // review step: nothing is written until this is confirmed
    const { parsed, unparsed } = state.preview;
    const rows = parsed.map((entry, i)=>{
      const candidates = candidateExercisesFor(entry.name);
      if(entry.exId===undefined) entry.exId = candidates.length ? candidates[0].id : '__new__';
      const ambiguous = candidates.length>1;
      const chosen = DATA.exercises.find(e=>e.id===entry.exId);
      const tag = chosen
        ? `<span class="cat-pill"><span class="dot" style="background:${CATS[chosen.cat].color}"></span>${CATS[chosen.cat].label}</span>`
        : `<span class="cat-pill" style="border-color:var(--accent);color:var(--text);">new · ${CATS[guessCategory(entry.name)].label}</span>`;
      // every row is an explicit choice, so a loose name match can be corrected here
      const options = DATA.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name))
        .map(e=>`<option value="${e.id}" ${e.id===entry.exId?'selected':''}>${escapeHtml(e.name)}</option>`).join('');
      return `<div class="sugg-row" style="grid-template-columns:230px 1fr auto; align-items:center;">
        <div class="sname">
          <select data-preview-ex="${i}" style="width:100%;background:var(--surface-2);border:1px solid ${ambiguous?'var(--accent)':'var(--border)'};color:var(--text);padding:6px 7px;border-radius:2px;font-size:12.5px;">
            <option value="__new__" ${entry.exId==='__new__'?'selected':''}>+ New: ${escapeHtml(entry.name)}</option>
            ${options}
          </select>
          <div class="snote">${tag}${ambiguous?' <span style="color:var(--accent);">check this one — the name matched more than one</span>':''}</div>
        </div>
        <div><input type="text" value="${escapeHtml(setsToText(entry.sets)).replace(/"/g,'&quot;')}" data-preview-sets="${i}"></div>
        <button class="btn ghost" data-drop-preview="${i}" title="Don't log this one">×</button>
      </div>`;
    }).join('');

    const totalSets = parsed.reduce((n,e)=>n+e.sets.length,0);
    wrap.innerHTML = `
      <div class="modal wide" role="dialog" aria-modal="true">
        <button class="modal-close" id="mClose" aria-label="Close">&times;</button>
        <h2>Check before logging</h2>
        <p class="modal-sub">${parsed.length} exercise${parsed.length===1?'':'s'} · ${totalSets} set${totalSets===1?'':'s'} for ${new Date(state.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}. Edit anything that came out wrong — nothing is saved until you confirm.</p>
        ${unparsed.length ? `<p class="plan-error">Couldn't read ${unparsed.length} line${unparsed.length===1?'':'s'}: ${unparsed.map(u=>escapeHtml(u.text)).join(' · ')}</p>` : ''}
        ${rows}
        <div class="modal-actions">
          <button class="btn ghost" id="mBack">Back to text</button>
          <button class="btn primary" id="mSave">Log this session</button>
        </div>
      </div>`;

    wrap.querySelector('#mClose').addEventListener('click', close);
    wrap.querySelector('#mBack').addEventListener('click', ()=>{ syncPreview(); state.preview = null; draw(); });
    wrap.querySelectorAll('[data-preview-ex]').forEach(sel=>sel.addEventListener('change', ()=>{ syncPreview(); draw(); }));
    wrap.querySelectorAll('[data-drop-preview]').forEach(b=>b.addEventListener('click', ()=>{
      syncPreview();
      state.preview.parsed.splice(parseInt(b.dataset.dropPreview,10),1);
      if(!state.preview.parsed.length){ state.preview = null; }
      draw();
    }));
    wrap.querySelector('#mSave').addEventListener('click', ()=>{
      syncPreview();
      const entries = state.preview.parsed.filter(e=>e.sets.length);
      if(!entries.length) return;
      const dateVal = state.date;
      const isDup = DATA.sessions.some(s=>s.date===dateVal);
      const id = makeSessionId(dateVal);
      const d = new Date(dateVal+'T00:00:00');
      const label = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + (isDup ? ' (2nd)' : '');

      let cat = defaultCat;
      const resolved = entries.map(e=>({
        ex: (e.exId && e.exId!=='__new__' && DATA.exercises.find(x=>x.id===e.exId)) || resolveOrCreateExercise(e.name),
        sets: e.sets,
      }));
      if(!cat){
        const counts = {};
        resolved.forEach(r=>{ counts[r.ex.cat] = (counts[r.ex.cat]||0)+1; });
        cat = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
      }
      DATA.sessions.push({id, date:dateVal, label, cat, targets:{}});
      resolved.forEach(r=>{ DATA.cells[r.ex.id+'|'+id] = tagSets(r.sets, machineForNewSets(r.ex.id+'|'+id)); });
      resolved.forEach(r=>checkForPR(r.ex.id, r.ex.name, id));
      resolved.forEach(r=>warnIfOddReps(r.ex.id, id));
      scheduleSave();
      close();
      if(isDup) showToast('Added as a second session on that date.');
      currentTab = 'log'; activeCat = cat; render();
    });
  }

  function syncPreview(){
    if(!state.preview) return;
    wrap.querySelectorAll('[data-preview-sets]').forEach(inp=>{
      const i = parseInt(inp.dataset.previewSets,10);
      if(state.preview.parsed[i]) state.preview.parsed[i].sets = parseSetsFromText(inp.value);
    });
    wrap.querySelectorAll('[data-preview-ex]').forEach(sel=>{
      const i = parseInt(sel.dataset.previewEx,10);
      if(state.preview.parsed[i]) state.preview.parsed[i].exId = sel.value;
    });
  }

  draw();
}

function topSetPerSession(exId, sortedSessions, machineId){
  if(machineId===undefined) machineId = currentMachineFor(DATA.exercises.find(e=>e.id===exId));
  const points = [];
  sortedSessions.forEach(s=>{
    const sets = DATA.cells[exId+'|'+s.id];
    if(!sets || !sets.length || machineOfSets(sets)!==machineId) return;
    const weighted = sets.filter(st=>st.weight && st.weight.type==='kg' && !st.isSeconds);
    if(weighted.length){
      const best = weighted.reduce((a,b)=> (b.weight.value>a.weight.value?b:a));
      points.push({label:s.label, date:s.date, sessionId:s.id, value:best.weight.value, unit:'kg', reps:best.reps, rir:best.rir});
    } else {
      const nums = sets.filter(st=>!st.isSeconds);
      if(nums.length){
        const best = nums.reduce((a,b)=> (b.reps>a.reps?b:a));
        points.push({label:s.label, date:s.date, sessionId:s.id, value:best.reps, unit:'reps', reps:best.reps, rir:best.rir});
      }
    }
  });
  return points;
}

function buildLineChart(points){
  const w = 680, h = 180, padL = 40, padR = 20, padT = 20, padB = 30;
  const values = points.map(p=>p.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const lo = min - range*0.15, hi = max + range*0.15;
  const x = i => padL + i*((w-padL-padR)/(points.length-1));
  const y = v => h-padB - ((v-lo)/(hi-lo))*(h-padT-padB);
  const line = points.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ');
  const prIndex = values.lastIndexOf(max);
  const dots = points.map((p,i)=>{
    const isPR = i===prIndex;
    return `
    <circle cx="${x(i)}" cy="${y(p.value)}" r="${isPR?6:4}" fill="${isPR?'#E0B34E':'var(--accent)'}" ${isPR?'stroke="#fff" stroke-width="1"':''}/>
    <text x="${x(i)}" y="${y(p.value)-14}" text-anchor="middle" fill="var(--text)" font-size="12" font-family="IBM Plex Mono">${p.unit==='kg' ? p.value+'kg×'+p.reps : p.value}${(p.rir!=null)?'@'+p.rir:''}${isPR?' ★':''}</text>
    <text x="${x(i)}" y="${h-8}" text-anchor="middle" fill="var(--text-faint)" font-size="10.5" font-family="IBM Plex Sans">${p.label}</text>
  `;}).join('');
  const unitLabel = points[0].unit==='kg' ? 'Top set — weight × reps, not a max attempt · ● marks your best so far' : 'Top reported number (reps/sec) · ● marks your best so far';
  return `
    <p style="font-size:11.5px;color:var(--text-faint);margin:0 0 6px;">${unitLabel}</p>
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.9"/>
      ${dots}
    </svg>`;
}

/* ============================= BODY DIAGRAM (heatmap) ============================= */
function heatColor(t){
  const o=[224,142,58], r=[199,45,38];
  const c = o.map((v,i)=>Math.round(v + (r[i]-v)*Math.min(1,t)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function muscleStyle(id, muscles){
  const t = muscles[id];
  if(!t) return `fill:var(--muscle-neutral);stroke:var(--border);stroke-width:1;fill-opacity:0.55;`;
  return `fill:${heatColor(t)};stroke:var(--border);stroke-width:1;fill-opacity:${(0.55+t*0.4).toFixed(2)};`;
}

/* ============================= INIT ============================= */
document.getElementById('volBtn').addEventListener('click', openSetVolumeModal);
document.getElementById('prsBtn').addEventListener('click', openPRsModal);
document.getElementById('trashLink').addEventListener('click', openTrashModal);
document.getElementById('resetLink').addEventListener('click', async ()=>{
  const ok = await confirmDialog('Reset all data back to the original sample log? This cannot be undone.', 'Reset');
  if(!ok) return;
  const theme = DATA.theme;
  DATA = seedData();
  DATA.theme = theme;
  await persist();
  render();
});

/** Copies the whole log to the clipboard, for moving between copies of the app
 *  without going near the filesystem — much easier on a phone than a download
 *  followed by a re-upload. */
document.getElementById('copyLink').addEventListener('click', async ()=>{
  const json = JSON.stringify(DATA);
  try{
    await navigator.clipboard.writeText(json);
    showToast('Whole log copied — paste it into the other copy via "Paste data".');
  }catch(e){
    // clipboard blocked: show it so it can be selected by hand
    const m = openModal(`
      <div class="modal wide">
        <button class="modal-close" id="mClose">&times;</button>
        <h2>Copy your data</h2>
        <p class="modal-sub">Select all of this and copy it, then use "Paste data" in the other copy of the app.</p>
        <textarea readonly style="width:100%;height:220px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:11px;">${escapeHtml(json)}</textarea>
        <div class="modal-actions"><button class="btn primary" id="mDone">Close</button></div>
      </div>`);
    m.querySelector('#mClose').addEventListener('click', closeModal);
    m.querySelector('#mDone').addEventListener('click', closeModal);
    const ta = m.querySelector('textarea'); ta.focus(); ta.select();
  }
});

document.getElementById('pasteLink').addEventListener('click', ()=>{
  const m = openModal(`
    <div class="modal wide">
      <button class="modal-close" id="mClose">&times;</button>
      <h2>Paste data</h2>
      <p class="modal-sub">Paste a log copied from another copy of this app (or the contents of a backup file). This replaces everything currently here.</p>
      <textarea id="pasteBox" placeholder='{"sessions":[...],"exercises":[...]}' style="width:100%;height:200px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:11px;"></textarea>
      <div id="pasteErr"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="mCancel">Cancel</button>
        <button class="btn primary" id="mGo">Check it</button>
      </div>
    </div>`);
  m.querySelector('#mClose').addEventListener('click', closeModal);
  m.querySelector('#mCancel').addEventListener('click', closeModal);
  m.querySelector('#mGo').addEventListener('click', async ()=>{
    let parsed;
    try{ parsed = JSON.parse(m.querySelector('#pasteBox').value.trim()); }
    catch(e){ m.querySelector('#pasteErr').innerHTML = '<p class="plan-error">That isn\'t valid data — make sure the whole thing was copied, starting with { and ending with }.</p>'; return; }
    if(!parsed || !Array.isArray(parsed.exercises) || !Array.isArray(parsed.sessions) || typeof parsed.cells!=='object'){
      m.querySelector('#pasteErr').innerHTML = '<p class="plan-error">That looks like valid JSON but not a training log.</p>'; return;
    }
    const sessCount = parsed.sessions.length;
    const dates = parsed.sessions.map(x=>x.date).sort();
    const range = sessCount ? dates[0]+' to '+dates[dates.length-1] : 'none';
    closeModal();
    const ok = await confirmDialog(
      'Import '+sessCount+' session'+(sessCount===1?'':'s')+' ('+range+') and '+parsed.exercises.length+' exercises?\n\nThis replaces everything currently in this copy.', 'Import');
    if(!ok) return;
    DATA = parsed;
    if(!Array.isArray(DATA.runSchedule)) DATA.runSchedule = [];
    if(!DATA.theme) DATA.theme = 'iron';
    migrateData();
    await persist();
    render();
    showToast('Imported '+sessCount+' sessions.');
  });
  setTimeout(()=>autoFocus(m.querySelector('#pasteBox')), 20);
});

document.getElementById('exportLink').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'training-log-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('Backup downloaded.');
});

document.getElementById('storageDebugLink').addEventListener('click', ()=>{
  const bridgeNow = (typeof window.claude !== 'undefined');
  const rows = [
    ['Storage mode in use right now', STORAGE_MODE],
    ['Was window.claude present the instant this script started?', String(STORAGE_DEBUG.windowClaudeAtScriptStart)],
    ['Is window.claude present right now (this moment)?', String(bridgeNow)],
    ['How long until the bridge was found', STORAGE_DEBUG.bridgeFoundAfterMs===null ? 'still waiting / never checked' : (typeof STORAGE_DEBUG.bridgeFoundAfterMs==='number' ? STORAGE_DEBUG.bridgeFoundAfterMs+'ms' : STORAGE_DEBUG.bridgeFoundAfterMs)],
    ['Was bridge.use("db") called?', String(STORAGE_DEBUG.bridgeUseCalled)],
    ['What bridge.use("db") returned', STORAGE_DEBUG.dbResult],
    ['Was reading the actual document attempted?', String(STORAGE_DEBUG.docGetAttempted)],
    ['What that document read returned', STORAGE_DEBUG.docGetResult],
    ['Where the data on screen actually came from', STORAGE_DEBUG.sessionsLoadedFrom],
    ['Any error caught during connection', STORAGE_DEBUG.error || 'none'],
    ['Init finished at', STORAGE_DEBUG.finishedAt || 'not yet finished'],
  ];
  const m = openModal(`
    <div class="modal" style="max-width:480px;">
      <button class="modal-close" id="mClose">&times;</button>
      <h2>Storage debug</h2>
      <p class="modal-sub">What actually happened when this page tried to connect to durable storage. Screenshot or copy this to share it.</p>
      <table style="width:100%; font-size:12.5px; border-collapse:collapse;">
        ${rows.map(([k,v])=>`<tr>
          <td style="padding:6px 8px 6px 0; color:var(--text-faint); vertical-align:top; white-space:nowrap;">${escapeHtml(k)}</td>
          <td style="padding:6px 0; font-family:'IBM Plex Mono',monospace; word-break:break-word;">${escapeHtml(String(v))}</td>
        </tr>`).join('')}
      </table>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button class="btn ghost" id="copyDebug">Copy as text</button>
      </div>
    </div>`);
  m.querySelector('#mClose').addEventListener('click', closeModal);
  m.querySelector('#copyDebug').addEventListener('click', async ()=>{
    const text = rows.map(([k,v])=>k+': '+v).join('\n');
    try{
      await navigator.clipboard.writeText(text);
      showToast('Copied.');
    }catch(e){
      showToast('Could not copy — select the text manually.');
    }
  });
});

document.getElementById('importLink').addEventListener('click', ()=>{
  document.getElementById('importFileInput').click();
});
document.getElementById('importFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const ok = await confirmDialog('Import this file? It will replace all of your current data.', 'Import');
  if(!ok) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || !Array.isArray(parsed.exercises) || !Array.isArray(parsed.sessions) || typeof parsed.cells!=='object'){
        throw new Error('bad shape');
      }
      DATA = parsed;
      if(!Array.isArray(DATA.runSchedule)) DATA.runSchedule = [];
      if(!DATA.theme) DATA.theme = 'iron';
      migrateData();
      await persist();
      render();
      showToast('Data imported.');
    }catch(err){
      console.error(err);
      showToast("That doesn't look like a valid backup file.");
    }
  };
  reader.readAsText(file);
});

(async function init(){
  await loadData();
  migrateData();
  render();
  setTimeout(flagOddRepsInLog, 900);
})();
</script>
