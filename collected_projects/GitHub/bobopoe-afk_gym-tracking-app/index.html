<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15140F; --surface:#1F1E17; --surface-2:#26241C; --border:#37342A;
    --text:#EBE6D9; --text-dim:#9A9384; --text-faint:#6C6858;
    --accent:#E2543A; --accent-dim:rgba(226,84,58,0.16);
    --muscle-neutral:#2E2B22; --dot-color:rgba(255,255,255,0.025);
    --shadow:rgba(0,0,0,0.4);
    --leg:#6FBF87; --bilat:#E0B34E; --push:#F0824A; --pull:#4FA8E0; --core:#D4B15A; --aux:#B47CE0;
  }
  body[data-theme="paper"]{
    --bg:#F4F0E6; --surface:#FFFFFF; --surface-2:#ECE5D3; --border:#D9D0BA;
    --text:#2A2620; --text-dim:#6B6455; --text-faint:#978F7C;
    --accent:#C43A24; --accent-dim:rgba(196,58,36,0.12);
    --muscle-neutral:#E4DDC9; --dot-color:rgba(0,0,0,0.035);
    --shadow:rgba(60,50,30,0.16);
    --leg:#3E8F5B; --bilat:#B5820E; --push:#C4602A; --pull:#2E72A8; --core:#9C7A2E; --aux:#7C4FB0;
  }
  body[data-theme="slate"]{
    --bg:#10151C; --surface:#171F29; --surface-2:#1E2733; --border:#2C3A48;
    --text:#DCE6EE; --text-dim:#8FA0AF; --text-faint:#5E6E7C;
    --accent:#4FB8E0; --accent-dim:rgba(79,184,224,0.18);
    --muscle-neutral:#1E2733; --dot-color:rgba(255,255,255,0.03);
    --shadow:rgba(0,0,0,0.45);
    --leg:#5EDB9A; --bilat:#E0B34E; --push:#F0824A; --pull:#4FA8E0; --core:#D4B15A; --aux:#B47CE0;
  }
  body[data-theme="moss"]{
    --bg:#12160F; --surface:#1B2116; --surface-2:#232B1C; --border:#37402C;
    --text:#E7EBDD; --text-dim:#9AA68A; --text-faint:#66735A;
    --accent:#E8963E; --accent-dim:rgba(232,150,62,0.18);
    --muscle-neutral:#232B1C; --dot-color:rgba(255,255,255,0.025);
    --shadow:rgba(0,0,0,0.4);
    --leg:#7FDB9E; --bilat:#E0C062; --push:#F0824A; --pull:#5EC2C4; --core:#D4B15A; --aux:#C48CE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .2s ease, color .2s ease;
        background-image:linear-gradient(var(--dot-color) 1px, transparent 1px); background-size:100% 28px; }
  .wrap{ max-width:1220px; margin:0 auto; padding:0 24px 100px; }

  header{ padding:30px 0 0; position:relative; }
  header::before{ content:''; display:block; height:3px; background:var(--text); margin-bottom:14px; }
  .head-top{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .eyebrow{ color:var(--text-faint); font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.22em; margin:0 0 6px; }
  h1{ font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:clamp(46px,9vw,86px); letter-spacing:-0.005em; line-height:0.84; margin:0; }
  h1 .h1-accent{ color:var(--accent); }
  .sub{ color:var(--text-dim); font-size:13.5px; max-width:420px; margin:10px 0 0; line-height:1.45; }
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-top:26px; border-top:1px solid var(--text); border-bottom:1px solid var(--border); }
  .stat{ padding:12px 14px 11px; border-right:1px solid var(--border); }
  .stat:last-child{ border-right:none; }
  .stat b{ display:block; font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1; font-weight:400; letter-spacing:.01em; }
  .stat span{ display:block; margin-top:5px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.14em; }
  @media (max-width:700px){ .stat-row{ grid-template-columns:repeat(2,1fr); } .stat{ border-bottom:1px solid var(--border); } }

  .theme-swatches{ display:flex; gap:8px; align-items:center; }
  .theme-swatch{ width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
  .theme-swatch.active{ border-color:var(--text); }

  .tabs{ display:flex; gap:0; margin-top:18px; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab-btn{ position:relative; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.13em; background:none; border:none; color:var(--text-faint); padding:12px 0 11px; margin-right:28px; cursor:pointer; white-space:nowrap; }
  .tab-btn::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent; }
  .tab-btn:hover{ color:var(--text-dim); }
  .tab-btn.active{ color:var(--text); }
  .tab-btn.active::after{ background:var(--accent); }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:20px 0 16px; flex-wrap:wrap; }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .filter-btn{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; background:transparent; color:var(--text-dim); border:1px solid var(--border); border-radius:2px; padding:7px 11px; cursor:pointer; }
  .filter-btn .dot{ display:inline-block; width:7px;height:7px;border-radius:50%; margin-right:7px; position:relative; top:-1px; }
  .filter-btn:hover{ border-color:var(--text-faint); color:var(--text); }
  .filter-btn.active{ border-color:var(--accent); color:var(--text); background:var(--accent-dim); }
  .toggle-label{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); cursor:pointer; user-select:none; margin-left:6px; }
  .actions{ display:flex; gap:8px; align-items:center; }
  .btn{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.09em; background:transparent; color:var(--text); border:1px solid var(--border); border-radius:2px; padding:9px 14px; cursor:pointer; transition:border-color .12s ease, background .12s ease, color .12s ease; }
  .btn:hover{ border-color:var(--text); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ opacity:.92; }
  .btn.ghost{ background:transparent; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .save-status{ font-size:11.5px; color:var(--text-faint); opacity:0; transition:opacity .3s ease; }
  .save-status.show{ opacity:1; }

  /* ---------- table ---------- */
  .table-scroll{ overflow:auto; border:1px solid var(--border); border-radius:2px; max-height:60vh; }
  table{ border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
  thead th{ position:sticky; top:0; background:var(--bg); z-index:2; border-bottom:1px solid var(--border); padding:9px 9px; font-size:12px; text-align:left; font-weight:600; white-space:nowrap; }
  thead th.corner{ position:sticky; left:0; top:0; z-index:4; background:var(--bg); }
  .sess-th{ min-width:112px; }
  .sess-th .sd-date{ font-family:'Bebas Neue',sans-serif; font-size:17px; display:block; }
  .sess-th .sd-tag{ display:flex; align-items:center; gap:5px; font-size:10px; color:var(--text-faint); margin-top:2px; font-weight:400; }
  .sess-th .sd-tag .dot{ width:6px;height:6px;border-radius:50%; }
  .sess-th .sd-del{ float:right; opacity:0; cursor:pointer; color:var(--text-faint); font-size:13px; }
  .sess-th .sd-move{ float:right; opacity:0; cursor:pointer; color:var(--text-faint); font-size:11px; margin-right:6px; }
  .sess-th:hover .sd-del, .sess-th:hover .sd-move{ opacity:1; }
  .add-col-th{ min-width:56px; text-align:center; }
  .add-col-btn{ background:none; border:1px dashed var(--border); color:var(--text-faint); border-radius:4px; width:32px; height:32px; cursor:pointer; font-size:15px; }
  .add-col-btn:hover{ border-color:var(--accent); color:var(--accent); }

  td.sticky-col, th.sticky-col{ position:sticky; left:0; background:var(--bg); z-index:1; border-right:1px solid var(--border); }
  td.exercise-name-cell{ cursor:pointer; font-size:12.5px; font-weight:600; padding:8px 12px; min-width:185px; background:var(--bg); }
  td.exercise-name-cell .ex-row{ display:flex; align-items:center; gap:7px; }
  td.exercise-name-cell .dot{ width:7px;height:7px;border-radius:50%; flex-shrink:0; }
  td.exercise-name-cell .ex-del{ margin-left:auto; opacity:0; color:var(--text-faint); font-size:13px; }
  tr:hover td.exercise-name-cell .ex-del{ opacity:1; }
  td.exercise-name-cell:hover{ color:var(--accent); }
  tr.group-start td{ border-top:1px solid var(--border); }

  td.cell{ min-width:112px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-dim); padding:7px 9px; border-bottom:1px solid var(--border); cursor:text; white-space:pre-wrap; vertical-align:top; }
  tr:hover td.cell{ background:var(--surface); }
  td.cell input{ width:100%; background:var(--surface-2); border:1px solid var(--accent); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:4px 6px; border-radius:3px; }
  td.cell.empty{ color:var(--text-faint); }
  td.cell.empty:hover::after{ content:'+ add'; opacity:.6; }
  td.add-col-td{ min-width:56px; }

  /* ---------- session list (compact log view) ---------- */
  .view-switch{ display:inline-flex; border:1px solid var(--border); border-radius:2px; overflow:hidden; margin-left:4px; }
  .view-btn{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; background:transparent; color:var(--text-faint); border:none; padding:7px 11px; cursor:pointer; }
  .view-btn.active{ background:var(--surface-2); color:var(--text); }
  .sess-list{ display:flex; flex-direction:column; gap:10px; }
  .sess-card{ border:1px solid var(--border); border-left:2px solid var(--border); border-radius:2px; background:var(--surface); padding:12px 14px; }
  .sess-card:hover{ border-left-color:var(--accent); }
  .sess-card-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .sess-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sess-date{ font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.02em; }
  .sess-cat{ font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); }
  .sess-status{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); border:1px solid var(--border); border-radius:2px; padding:2px 6px; }
  .sess-status.missed{ color:var(--accent); border-color:var(--accent); }
  .sess-meta{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint); margin-left:auto; }
  .sess-actions{ display:flex; gap:6px; opacity:0; transition:opacity .12s ease; }
  .sess-card:hover .sess-actions, .sess-card:focus-within .sess-actions{ opacity:1; }
  .sess-mini{ padding:3px 8px; font-size:9.5px; }
  .sess-items{ margin-top:10px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:2px 20px; }
  .sess-item{ display:flex; justify-content:space-between; gap:12px; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--border); }
  .sess-item-name{ cursor:pointer; }
  .sess-item:hover .sess-item-name{ color:var(--accent); }
  .sess-item-edit{ padding:2px 7px; font-size:9px; opacity:0; flex-shrink:0; }
  .sess-item:hover .sess-item-edit, .sess-item:focus-within .sess-item-edit{ opacity:1; }
  @media (pointer: coarse){ .sess-item-edit{ opacity:1; } }
  .sess-item-name{ font-size:12.5px; font-weight:600; }
  .sess-item-sets{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-dim); text-align:right; white-space:nowrap; }
  @media (max-width:640px){
    .sess-actions{ opacity:1; }
    .sess-meta{ margin-left:0; width:100%; }
    .sess-item-sets{ white-space:normal; }
  }

  /* ---------- category blocks ---------- */
  .cat-block{ margin-bottom:36px; }
  .cat-block-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px; padding-bottom:7px; border-bottom:1px solid var(--text); }
  .cat-block-title{ display:flex; align-items:baseline; gap:9px; font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.02em; }
  .cat-block-title .dot{ width:10px;height:10px;border-radius:50%; }
  .cat-block-count{ font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; font-weight:400; }
  .ex-1rm{ font-size:10px; color:var(--text-faint); margin-top:3px; font-family:'IBM Plex Mono',monospace; padding-left:14px; }

  .vol-table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  .vol-table th{ position:static; background:none; font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:500; text-align:right; padding:4px 5px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .vol-table th:first-child{ text-align:left; }
  .vol-table td{ font-family:'IBM Plex Mono',monospace; text-align:right; padding:5px; border-bottom:1px solid var(--border); color:var(--text-dim); }
  .vol-table td.vol-name{ text-align:left; font-family:'IBM Plex Sans',sans-serif; color:var(--text); text-transform:capitalize; }
  .vol-table td.vol-total{ color:var(--text); font-weight:600; }
  .vol-table td.vol-zero{ color:var(--text-faint); opacity:.45; }
  .vol-table tr.vol-row{ cursor:pointer; }
  .vol-table tr.vol-row:hover td{ background:var(--surface-2); }
  .vol-table tr.vol-row:hover td.vol-name{ color:var(--accent); }

  /* ---------- toast ---------- */
  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--accent); color:var(--text); padding:12px 16px; border-radius:2px; box-shadow:0 10px 30px var(--shadow); display:flex; gap:16px; align-items:center; font-size:13px; z-index:100; animation:toastIn .22s ease; }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%,10px); } to{ opacity:1; transform:translate(-50%,0); } }
  .toast-undo{ background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:13px; padding:0; }

  /* ---------- calendar tab ---------- */
  .cal-controls{ display:flex; align-items:center; gap:14px; padding:6px 0 18px; }
  .cal-month{ font-family:'Bebas Neue',sans-serif; font-size:22px; min-width:170px; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:8px; }
  .cal-weekdays div{ text-align:center; font-size:11px; color:var(--text-faint); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-day{ aspect-ratio:1; border:1px solid var(--border); border-radius:2px; padding:8px; font-size:12px; position:relative; background:var(--surface); }
  .cal-day.empty{ border:none; background:none; }
  .cal-day.today{ border-color:var(--text-faint); }
  .cal-day.has-session{ background:var(--surface); }
  .cal-day[data-cal-date]{ cursor:pointer; transition:transform .12s ease; }
  .cal-day[data-cal-date]:hover{ transform:translateY(-2px); }
  .cal-daynum{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); }
  .cal-tag{ display:block; width:8px; height:8px; border-radius:50%; position:absolute; bottom:8px; left:8px; }
  .cal-run{ display:block; width:7px; height:7px; border-radius:50%; position:absolute; top:8px; right:8px; }
  .cal-catlabel{ display:none; }
  .cal-legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:18px; font-size:12px; color:var(--text-dim); }
  .cal-legend-item{ display:flex; align-items:center; gap:6px; }
  .cal-legend-item .dot{ width:8px; height:8px; border-radius:50%; }

  /* ---------- featured exercise ---------- */
  .featured-card{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:2px; padding:20px 22px; margin-bottom:26px; }
  .featured-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--accent); text-transform:uppercase; letter-spacing:.18em; margin:0 0 8px; }
  .featured-name{ font-family:'Bebas Neue',sans-serif; font-size:34px; line-height:.95; margin:0 0 8px; }
  .featured-desc{ font-size:13.5px; color:var(--text-dim); margin:0 0 12px; max-width:640px; }
  .featured-tips{ margin:0 0 14px; padding-left:18px; font-size:12.5px; color:var(--text-dim); }
  .featured-tips li{ margin-bottom:4px; }
  .inline-link{ color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }

  .today-picker{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0 0 14px; }
  .today-pick{ display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; background:transparent; color:var(--text-dim); border:1px solid var(--border); border-radius:2px; padding:7px 11px; cursor:pointer; }
  .today-pick .dot{ width:7px; height:7px; border-radius:50%; }
  .today-pick.active{ border-color:var(--accent); color:var(--text); background:var(--accent-dim); }
  .today-pick-actions{ display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  .today-pick-del{ padding:6px 10px; font-size:9.5px; }
  .today-rows{ display:flex; flex-direction:column; gap:2px; }
  .today-row{ display:grid; grid-template-columns:1fr 1fr 1fr 1.2fr; gap:14px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); }
  .today-row:last-child{ border-bottom:none; }
  .today-name{ font-size:13px; font-weight:600; }
  .today-meta{ font-size:11.5px; color:var(--text-faint); }
  .today-meta span{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); opacity:.7; margin-bottom:2px; }
  .today-input{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:7px 9px; border-radius:4px; font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .today-input:focus{ outline:none; border-color:var(--accent); }
  .today-warning{ background:var(--accent-dim); border:1px solid var(--accent); border-radius:6px; padding:10px 12px; font-size:12.5px; color:var(--text); margin:0 0 14px; }
  .today-why{ font-size:10.5px; color:var(--text-faint); font-style:italic; margin-top:2px; text-transform:none; letter-spacing:0; }
  @media (max-width:700px){ .today-row{ grid-template-columns:1fr; gap:4px; } }

  /* ---------- form tips ---------- */
  .tips-box{ margin:0 0 22px; }
  .tips-box h3{ margin:0 0 8px; font-size:13.5px; }
  .tips-box ul{ margin:0; padding-left:18px; font-size:12.5px; color:var(--text-dim); }
  .tips-box li{ margin-bottom:5px; }

  /* ---------- auto-plan tab ---------- */
  .run-list{ display:flex; flex-direction:column; gap:6px; }
  .run-chip{ font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
  .run-chip .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .plan-row{ display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--border); }
  .plan-row:last-child{ border-bottom:none; }
  .plan-row-date{ font-size:13px; flex:1; }
  .daycount-grid{ display:flex; gap:16px; flex-wrap:wrap; padding:6px 0 18px; }
  .daycount-field{ display:flex; flex-direction:column; gap:6px; }
  .daycount-field label{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-faint); }
  .daycount-field input{ width:64px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:4px; font-family:inherit; font-size:13px; }

  /* ---------- plan tab ---------- */
  .plan-controls{ display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; padding:6px 0 24px; }
  .field-inline label{ display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:6px; }
  .field-inline select, .field-inline input{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:9px 11px; border-radius:4px; font-family:inherit; font-size:13px; min-width:160px; }
  .plan-empty{ color:var(--text-faint); font-size:14px; padding:30px 0; text-align:center; border:1px dashed var(--border); border-radius:6px; }
  .plan-loading{ color:var(--text-faint); font-size:13.5px; padding:20px 0; }
  .sugg-row{ display:grid; grid-template-columns:200px 1fr; gap:14px; padding:14px 0; border-bottom:1px solid var(--border); align-items:start; }
  .sugg-row .sname{ font-weight:600; font-size:13.5px; padding-top:8px; }

<script>
/* ============================= CONSTANTS ============================= */
const THEMES = ['iron','paper','slate','moss'];
const THEME_SWATCH_COLOR = {iron:'#E2543A', paper:'#C43A24', slate:'#4FB8E0', moss:'#E8963E'};
const THEME_SWATCH_BG = {iron:'#15140F', paper:'#F4F0E6', slate:'#10151C', moss:'#12160F'};

const RUN_TYPES = {
  long:     { label:'Long run',  color:'#D64550', hardness:2 },

  interval: { label:'Intervals', color:'#8B7AE0', hardness:1 },

const CATS = {

const MUSCLE_MAP = {

  'Face pulls': {rearDelt:1, traps:.4},
  'Straight-arm pulldown': {lats:1},
  'Incline dumbbell curl': {biceps:1},
  'Hammer curl': {biceps:.8, forearms:.4},
  'Ab-wheel rollout': {abs:1, obliques:.3, lats:.2},
  // renamed / cleaned-up exercise names
  'Barbell hip thrust': {glutes:1, hamstrings:.4},
  'Face pull': {rearDelt:1, traps:.4},
  'Machine ab crunch': {abs:1},
  'Dumbbell step-up': {quads:1, glutes:.6, hamstrings:.3},
  'Wrist curl (flexion & extension)': {forearms:1},
  'Neck flexion & extension': {neck:1},
  'Hip abduction machine': {abductors:1, glutes:.4},
  'Single-leg calf raise (seated)': {calves:1},
  'Single-leg calf raise (standing)': {calves:1},

function guessMuscles(name){
  const n = name.toLowerCase();
  const map = {};
  const add = (obj)=>Object.assign(map,obj);
  if(/squat/.test(n)) add({quads:1, glutes:.6, hamstrings:.3});
  if(/deadlift|rdl/.test(n)) add({hamstrings:1, glutes:.7, lowerBack:.4, forearms:.4});
  if(/bench|chest press|pec deck|fly/.test(n)) add({chest:1, triceps:.4, frontDelt:.3});
  if(/incline/.test(n) && /press/.test(n)) add({chest:1, frontDelt:.4, triceps:.3});
  if(/shoulder press|overhead press/.test(n)) add({frontDelt:1, sideDelt:.5, triceps:.3});
  if(/lateral raise/.test(n)) add({sideDelt:1});
  if(/row/.test(n)) add({lats:.9, biceps:.3, rearDelt:.3, traps:.2, forearms:.3});
  if(/pulldown|pull-down|pull down/.test(n)) add({lats:1, biceps:.3, forearms:.3});
  if(/curl/.test(n) && !/leg curl|wrist/.test(n)) add({biceps:1});
  if(/leg curl/.test(n)) add({hamstrings:1});
  if(/wrist curl/.test(n)) add({forearms:1});
  if(/tricep|pushdown|extension/.test(n) && !/back ext/.test(n)) add({triceps:1});
  if(/back extension/.test(n)) add({lowerBack:1, glutes:.3});
  if(/calf/.test(n)) add({calves:1});
  if(/shrug/.test(n)) add({traps:1, forearms:.4});
  if(/face pull/.test(n)) add({rearDelt:1, traps:.3});
  if(/plank/.test(n)) add({abs:1, obliques:.3});
  if(/crunch|ab wheel|ab-wheel|sit-up/.test(n)) add({abs:1});
  if(/pallof|oblique/.test(n)) add({obliques:1, abs:.3});
  if(/hip thrust|glute bridge|booty/.test(n)) add({glutes:1, hamstrings:.3});
  if(/abduct/.test(n)) add({abductors:1});
  if(/adduct|copenhagen/.test(n)) add({adductors:1});
  if(/leg press|step-?up/.test(n)) add({quads:1, glutes:.5});
  if(/dip/.test(n)) add({chest:.5, triceps:1});
  if(/neck/.test(n)) add({neck:1});
  if(Object.keys(map).length===0) add({abs:.3});
  return map;
}

/* ============================= TEXT PARSER ============================= */
function formatWeight(w){
  if(!w) return 'BW';
  if(w.type==='kg') return w.value+'kg';
  if(w.type==='bw') return 'BW';
  if(w.type==='bar') return 'Bar';
  return 'BW';
}
/** True if the text still contains a rep-like number once weight/RIR tokens are removed.
 *  Used to tell a set-multiplier ("... x3") apart from a rep count ("60kg x5"). */
function hasRepNumber(p){
  const t = (p||'').trim();
  // "15kg", "8kg ea", "15ea" are weights, not rep counts
  if(/^\d+(?:\.\d+)?\s*(kg|lb|lbs)?\s*(ea|each)?$/i.test(t)) return false;
  const stripped = (p||'')
    .replace(/@\s*\d+(?:\.\d+)?/g,' ')
    .replace(/\bRIR\s*\d+(?:\.\d+)?\b/ig,' ')
    .replace(/(\d+(?:\.\d+)?)\s*kg/ig,' ')
    .replace(/bodyweight|\bbw\b/ig,' ')
    .replace(/\bbar(\s+only)?\b/ig,' ');
  return /\d/.test(stripped);
}
function parseSetsFromText(text){
  if(!text) return [];
  const rawParts = text.split(',').map(p=>p.trim()).filter(Boolean);
  let ctxWeight = null;
  let ctxPerSide = false;
  const sets = [];
  rawParts.forEach(rawPart=>{
    let mult = 1;
    let part = rawPart;
    const prefixMult = part.match(/^(\d+)\s*[×x*]\s*/i);
    // "5x5 60kg" is five sets; "45*12" is 45kg for 12 reps. Only read a leading
    // number as a set count when what follows still carries its own weight or time
    // (or the number is small enough to be a plausible set count).
    const prefixIsSetCount = prefixMult && (
      /kg|lb|bodyweight|\bbw\b|\bbar\b|sec|second/i.test(part.slice(prefixMult[0].length))
      || parseInt(prefixMult[1],10) <= 10
    );
    if(prefixMult && prefixIsSetCount){
      mult = parseInt(prefixMult[1],10) || 1;
      part = part.slice(prefixMult[0].length).trim();
    } else if(prefixMult){
      // treat it as weight × reps: "45*12" -> 45kg for 12
      const wVal = parseFloat(prefixMult[1]);
      const rest = part.slice(prefixMult[0].length).trim();
      part = wVal+'kg '+rest;
    } else {
      const suffixMult = part.match(/\s*[×x*]\s*(\d+)\s*$/i);
      // A trailing "xN" is only a set-multiplier ("60kg 5 x3" = three sets) if what
      // precedes it still carries its own rep count. In "60kg x5" the xN *is* the rep
      // count, so treating it as a multiplier would leave "60kg" with no reps and the
      // whole set would be silently dropped.
      if(suffixMult && hasRepNumber(part.slice(0, suffixMult.index))){
        mult = parseInt(suffixMult[1],10) || 1;
        part = part.slice(0, suffixMult.index).trim();
      }
    }
    if(!part) return;
    // "15ea*10" and "8kgea 10" mean 15kg/8kg per side — normalise before parsing so
    // the leading number isn't mistaken for a rep count or a set multiplier
    // only when a rep count actually follows, so a bare "12ea" stays 12 reps per side
    part = part.replace(/^(\d+(?:\.\d+)?)\s*(?:kg)?\s*(ea|each)\b\s*[×x*]?\s*(?=\d)/i, (mm,wv,ea)=> wv+'kg '+ea+' ');
    const isSeconds = /sec|second|\d\s*s\b/i.test(part);
    // "each side" carries forward to later sets the way weight does, so
    // "8kg each 12, 12, 12" is three per-side sets rather than just the first
    const perSide = /each|(^|[^a-z])ea([^a-z]|$)/i.test(part) ? (ctxPerSide = true) : ctxPerSide;
    let p = part;
    let rir = null;
    const rirAtMatch = p.match(/@\s*(\d+(?:\.\d+)?)/);
    const rirWordMatch = p.match(/\bRIR\s*(\d+(?:\.\d+)?)\b/i);
    if(rirAtMatch){ rir = parseFloat(rirAtMatch[1]); p = p.replace(rirAtMatch[0],' '); }
    else if(rirWordMatch){ rir = parseFloat(rirWordMatch[1]); p = p.replace(rirWordMatch[0],' '); }
    let weight = null;
    const kgMatch = p.match(/(\d+(?:\.\d+)?)\s*kg/i);
    if(kgMatch){ weight = {type:'kg', value:parseFloat(kgMatch[1])}; ctxWeight = weight; p = p.replace(kgMatch[0],' '); }
    else if(/bodyweight|\bbw\b/i.test(p)){ weight = {type:'bw'}; ctxWeight = weight; p = p.replace(/bodyweight|\bbw\b/i,' '); }
    else if(/\bbar\b/i.test(p)){ weight = {type:'bar'}; ctxWeight = weight; p = p.replace(/\bbar(\s+only)?\b/i,' '); }
    else { weight = ctxWeight; }
    p = p.replace(/each\s+side|each\s+arm|each\s+leg|each\s+direction|each|\bea\b|\bDBs?\b|\bplate\b|[×x]/gi,' ');
    const numMatch = p.match(/(\d+(?:\.\d+)?)/);
    if(!numMatch) return;
    const reps = parseFloat(numMatch[1]);
    for(let i=0;i<mult;i++) sets.push({weight, reps, perSide, isSeconds, rir});
  });
  return sets;
}
function setsToText(sets){
  return sets.map(s=>{
    const w = formatWeight(s.weight);
    const unit = s.isSeconds ? 's' : '';
    const side = s.perSide ? ' ea' : '';
    const rirPart = (s.rir!=null && !isNaN(s.rir)) ? '@'+s.rir : '';
    return `${w}×${s.reps}${unit}${side}${rirPart}`;
  }).join(', ');
}
function normalizeText(text){
  const sets = parseSetsFromText(text);
  if(!sets.length) return (text||'').trim();
  return setsToText(sets);
}
function scaleWeights(text, factor){
  const sets = parseSetsFromText(text).map(s=>{
    if(s.weight && s.weight.type==='kg'){
      const scaled = Math.round((s.weight.value*factor)*2)/2; // nearest 0.5kg
      return Object.assign({}, s, {weight:{type:'kg', value:scaled}});
    }
    return s;
  });
  if(!sets.length) return text;
  return setsToText(sets);
}
function estimate1RM(weightKg, reps){ return weightKg * (1 + reps/30); }
function estimate1RMWithRIR(weightKg, reps, rir){
  const repsToFailure = (rir!=null && !isNaN(rir)) ? reps+rir : reps;
  return estimate1RM(weightKg, repsToFailure);
}

function cellSets(key){ return DATA.cells[key] || []; }
/** Gym tag for sets about to be written to `key`: re-typing an entry keeps its tag;
 *  a new machine/cable entry goes on the session's gym. */
function machineForNewSets(key){
  const existing = DATA.cells[key];
  if(existing && existing.length) return machineOfSets(existing);
  const i = key.indexOf('|');
  const ex = DATA.exercises.find(e=>e.id===key.slice(0, i));
  return isGymSpecific(ex) ? gymForSession(key.slice(i+1)) : '';
}
function cellText(key){ const s = DATA.cells[key]; return (s && s.length) ? setsToText(s) : ''; }
function setCellFromText(key, text){
  const sets = parseSetsFromText(text);
  if(sets.length){ DATA.cells[key] = tagSets(sets, machineForNewSets(key)); } else { delete DATA.cells[key]; }
  return sets;
}
/* ---------- planned targets vs actual performance ----------
   DATA.cells holds what actually happened (performance). A session's own
   `targets` object holds what was planned for it (exId -> sets), kept
   entirely separate so the two never get confused with each other. */
function targetSets(session, exId){
  return (session && session.targets && session.targets[exId]) || [];
}
function targetText(session, exId){
  const s = targetSets(session, exId);
  return s.length ? setsToText(s) : '';
}
/**
 * Total tonnage for a session: weight × reps, summed across every loaded set.
 * Per-side sets count both sides, since "15kg × 10 each" really is 20 reps of work.
 * Bodyweight and timed sets contribute nothing — there's no load to multiply.
 */
/** The one definition of how much a set moved: weight × reps, with "each side"
 *  sets counting both sides. Everything that totals volume goes through this, so
 *  session totals, stats and volume PRs can't disagree. (A weight is taken as
 *  logged — the app doesn't know whether "14kg" dumbbells meant one or a pair.) */
function setVolumeKg(st){
  if(!st || !st.weight || st.weight.type!=='kg' || st.isSeconds) return 0;
  return st.weight.value * st.reps * (st.perSide ? 2 : 1);
}
function setsVolumeKg(sets){ return (sets||[]).reduce((sum, st)=>sum + setVolumeKg(st), 0); }
function sessionVolumeKg(sessionId){
  return DATA.exercises.reduce((total, ex)=>total + setsVolumeKg(cellSets(ex.id+'|'+sessionId)), 0);
}
/** Compact tonnage for inline stats: 4,820kg / 12.4t */
function formatVolume(kg){
  if(!kg) return null;
  const rounded = Math.round(kg);
  return rounded >= 10000 ? (rounded/1000).toFixed(1)+'t' : rounded.toLocaleString()+'kg';
}

function sessionHasActual(session){
  return DATA.exercises.some(e=>cellSets(e.id+'|'+session.id).length);
}
function sessionHasTargets(session){
  return !!(session.targets && Object.keys(session.targets).length);
}
/** A session with logged sets can still have OTHER exercises that were planned
 *  for it but not done yet — e.g. you log the first lift, then step away.
 *  'in-progress' captures that: something's done, something isn't, so it's
 *  neither cleanly "completed" nor "planned". Every view that decides what to
 *  show for a session should key off the exercises themselves (has a target,
 *  has it been logged) rather than collapsing to this one label. */
function sessionStatus(session){
  if(sessionHasActual(session)){
    const stillPlanned = DATA.exercises.some(e=>targetSets(session, e.id).length && !cellSets(e.id+'|'+session.id).length);
    return stillPlanned ? 'in-progress' : 'completed';
  }
  if(sessionHasTargets(session)) return 'planned';
  const todayStr = todayLocal();
  if(session.date >= todayStr) return 'planned'; // today or future, not done yet — still "on deck"
  return 'missed'; // a past date with no plan and nothing logged
}
/** Plain, shareable text for a session: logged sets first, then anything still
 *  only planned. Meant to be copied elsewhere (a message, a notes app), not
 *  parsed back in — this is a one-way export. */
function sessionAsText(session){
  const dateLabel = new Date(session.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
  const lines = [`${dateLabel} — ${CATS[session.cat].label}`];
  DATA.exercises.forEach(e=>{
    const sets = cellSets(e.id+'|'+session.id);
    if(sets.length) lines.push(`${e.name}: ${setsToText(sets)}`);
  });
  DATA.exercises.forEach(e=>{
    if(cellSets(e.id+'|'+session.id).length) return;
    const tgt = targetSets(session, e.id);
    if(tgt.length) lines.push(`${e.name} (planned): ${targetText(session, e.id)}`);
  });
  return lines.join('\n');
}
async function copySessionText(session){
  if(!session) return;
  const text = sessionAsText(session);
  try{
    await navigator.clipboard.writeText(text);
    showToast('Session copied.');
  }catch(e){
    showToast('Could not copy — try selecting the text manually.');
  }
}
/** Today's date as YYYY-MM-DD in the browser's LOCAL timezone (not UTC — toISOString()
 *  is UTC and can silently roll over to the wrong day around midnight). Use this
 *  everywhere "today" needs to be determined. */
function todayLocal(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function safeParseFloat(val, fallback, min, max){
  let n = parseFloat(val);
  if(isNaN(n)) n = (fallback!==undefined ? fallback : 0);
  if(min!==undefined) n = Math.max(min, n);
  if(max!==undefined) n = Math.min(max, n);
  return n;
}

function guessTips(name){
  const n = name.toLowerCase();
  if(/squat/.test(n)) return ['Brace your core and keep your chest up through the rep.', 'Track knees in line with your toes.', 'Control the descent rather than dropping into the bottom.'];
  if(/deadlift|rdl/.test(n)) return ['Keep the weight close to your body throughout the pull.', 'Hinge at the hips with a flat back.', 'Don\'t round your lower back to force the last rep.'];
  if(/bench|chest press|pec deck|fly/.test(n)) return ['Keep shoulder blades pinned back and down.', 'Lower with control to the same spot each rep.', 'Avoid bouncing the weight off your chest.'];
  if(/press/.test(n)) return ['Brace your core to protect your lower back.', 'Press through a full range without shrugging your shoulders up.', 'Control the weight down as carefully as you push it up.'];
  if(/row|pulldown|pull-down|pull down/.test(n)) return ['Lead with your elbows, not your hands.', 'Avoid using body momentum to move the weight.', 'Squeeze your shoulder blades together at the end range.'];
  if(/curl/.test(n)) return ['Keep elbows fixed at your sides.', 'Control the negative instead of letting the weight drop.', 'Avoid swinging your torso to cheat the rep up.'];
  if(/tricep|pushdown|extension/.test(n)) return ['Keep elbows tucked and stationary.', 'Get a full stretch at the top without flaring your shoulders.', 'Squeeze hard at full extension.'];
  if(/calf/.test(n)) return ['Use a full range of motion — deep stretch to full extension.', 'Pause at the top for a real contraction.', 'Avoid bouncing through the bottom.'];
  if(/plank|crunch|ab wheel|ab-wheel/.test(n)) return ['Brace your core like you\'re about to be poked in the stomach.', 'Keep breathing steadily instead of holding your breath.', 'Quality over duration — stop when form breaks down.'];
  if(/lunge|step-?up|split squat/.test(n)) return ['Keep most of your weight through the working leg.', 'Control the descent rather than dropping into the bottom.', 'Keep your torso upright unless deliberately leaning for emphasis.'];
  if(/lateral raise|delt/.test(n)) return ['Lead with your elbows and keep a slight bend in them.', 'Raise to roughly shoulder height, not higher.', 'Avoid swinging — lighter and strict beats heavy and sloppy.'];
  if(/shrug/.test(n)) return ['Lift straight up, not rolling your shoulders.', 'Pause briefly at the top.', 'Avoid using your biceps to help — this is a traps-only movement.'];
  return ['Move through a full, controlled range of motion.', 'Keep tension on the target muscle rather than using momentum.', 'Stop a rep or two before your form starts to break down.'];
}
function getTips(name){ return FORM_TIPS[name] || guessTips(name); }

/** Near-duplicate rows that describe the same movement. Data from the source id is
 *  folded into the target id, then the duplicate row is removed. */
const DUPLICATE_MERGES = { 'hip-abductor-machine':'hip-abductor' };
function migrateData(){
  let changed = false;
  if(!Array.isArray(DATA.runSchedule)){ DATA.runSchedule = []; changed = true; }
  if(!DATA.prRecords || typeof DATA.prRecords !== 'object'){ DATA.prRecords = {}; changed = true; }
  // migrate old PR shape ({best1RM, history:[{date,value}]}) to the new
  // multi-category shape ({weight, repsByWeight, e1rm, volume, history:[{date,kind,text}]})
  Object.entries(DATA.prRecords).forEach(([exId, rec])=>{
    if(rec && typeof rec.best1RM === 'number'){
      const oldHistory = rec.history || [];
      DATA.prRecords[exId] = {
        weight: null, repsByWeight: {},
        e1rm: { value: rec.best1RM, date: oldHistory.length ? oldHistory[oldHistory.length-1].date : todayLocal() },
        volume: null,
        history: oldHistory.map(h=>({ date:h.date, kind:'e1rm', text: h.value+'kg estimated' })),
      };
      changed = true;
    } else if(rec && !rec.repsByWeight){
      rec.repsByWeight = {};
      changed = true;
    }
  });
  if(!Array.isArray(DATA.templates)){ DATA.templates = []; changed = true; }
  if(!Array.isArray(DATA.machines)){ DATA.machines = []; changed = true; }
  if(!Array.isArray(DATA.trash)){ DATA.trash = []; changed = true; }
  // fold near-duplicate exercise rows together before anything else touches them
  Object.entries(DUPLICATE_MERGES).forEach(([fromId, toId])=>{
    const from = DATA.exercises.find(e=>e.id===fromId);
    const to = DATA.exercises.find(e=>e.id===toId);
    if(!from || !to) return;
    Object.keys(DATA.cells).forEach(k=>{
      if(!k.startsWith(fromId+'|')) return;
      const targetKey = toId+'|'+k.slice(fromId.length+1);
      if(!DATA.cells[targetKey]) DATA.cells[targetKey] = DATA.cells[k];
      delete DATA.cells[k];
    });
    DATA.sessions.forEach(sess=>{
      if(sess.targets && sess.targets[fromId]){
        if(!sess.targets[toId]) sess.targets[toId] = sess.targets[fromId];
        delete sess.targets[fromId];
      }
    });
    if(DATA.prRecords[fromId] && !DATA.prRecords[toId]) DATA.prRecords[toId] = DATA.prRecords[fromId];
    delete DATA.prRecords[fromId];
    (DATA.templates||[]).forEach(tpl=>{
      (tpl.exercises||[]).forEach(te=>{ if(te.exId===fromId) te.exId = toId; });
    });
    DATA.exercises = DATA.exercises.filter(e=>e.id!==fromId);
    changed = true;
  });
  DATA.exercises.forEach(e=>{
    if(NAME_FIXUPS[e.id] && e.name !== NAME_FIXUPS[e.id]){ e.name = NAME_FIXUPS[e.id]; changed = true; }
    if(CATEGORY_FIXUPS[e.id] && e.cat !== CATEGORY_FIXUPS[e.id]){ e.cat = CATEGORY_FIXUPS[e.id]; changed = true; }
    else if(e.cat === 'core'){ e.cat = 'aux'; changed = true; }
  });
  DATA.sessions.forEach(s=>{
    if(s.cat === 'core'){ s.cat = 'aux'; changed = true; }
    if(!s.targets || typeof s.targets !== 'object'){ s.targets = {}; changed = true; }
  });
  // fix data corrupted by a parser bug in a previous version ("1×90sec" was misread as "1 second")
  if(DATA.cells['side-plank|2026-08-11']==='BW×1s ea'){ DATA.cells['side-plank|2026-08-11']='BW×90s ea'; changed = true; }
  if(DATA.cells['plank|2026-08-11']==='BW×1s'){ DATA.cells['plank|2026-08-11']='BW×90s'; changed = true; }
  // date/category corrections: the "6 Aug" single-leg session was actually 16 Aug,
  // and the "8 Aug" session was actually a single-leg day, not bilateral
  const mis6 = DATA.sessions.find(s=>s.id==='2026-08-06');
  if(mis6 && !DATA.sessions.some(s=>s.id==='2026-08-16')){
    mis6.id = '2026-08-16'; mis6.date = '2026-08-16'; mis6.label = '16 Aug';
    Object.keys(DATA.cells).slice().forEach(k=>{
      if(k.endsWith('|2026-08-06')){
        const newKey = k.slice(0, k.length-'2026-08-06'.length) + '2026-08-16';
        DATA.cells[newKey] = DATA.cells[k];
        delete DATA.cells[k];
      }
    });
    changed = true;
  }
  const s0808 = DATA.sessions.find(s=>s.id==='2026-08-08');
  if(s0808 && s0808.cat!=='leg'){ s0808.cat = 'leg'; changed = true; }
  // architecture migration: cells used to store display text ("70kg×5@2, ...");
  // now the array of parsed sets is the source of truth and text is only ever
  // derived from it for display. Convert any leftover text cells once.
  Object.keys(DATA.cells).forEach(k=>{
    if(typeof DATA.cells[k] === 'string'){
      const sets = parseSetsFromText(DATA.cells[k]);
      if(sets.length){ DATA.cells[k] = sets; } else { delete DATA.cells[k]; }
      changed = true;
    }
  });
  // Build PR records from everything already logged. Without this an empty (or newly
  // upgraded) PR store treats the next session as the baseline, announcing "records"
  // that your existing history already beats.
  // PRs are derived from the log; rebuild every load so a stale record can't survive
  const before = JSON.stringify(DATA.prRecords||{});
  rebuildPRRecordsFromHistory();
  DATA.prRecordsBackfilled = true;
  if(JSON.stringify(DATA.prRecords) !== before) changed = true;

  // One-off cleanup: same-day sessions only ever existed because logging used to be
  // one-category-at-a-time. A session can hold any mix of exercises now, so fold those
  // splits back together. Flagged so genuinely separate future sessions (e.g. a real
  // AM/PM double day) are left alone — those can still be merged by hand.
  if(!DATA.sameDaySessionsMerged){
    const dupeDates = datesWithMultipleSessions();
    dupeDates.forEach(d=>mergeSessionsOnDate(d));
    DATA.sameDaySessionsMerged = true;
    if(dupeDates.length){
      changed = true;
      setTimeout(()=>showToast('Merged '+dupeDates.length+' day'+(dupeDates.length===1?'':'s')+' that had been split across multiple sessions.'), 400);
    }
  }
  if(changed) scheduleSave();
}

/* ---------- storage ----------
   Published pages don't have window.storage, so this uses the artifact `db`
   capability when the viewer grants it, and falls back to localStorage otherwise.
   Either way the log is saved per person and survives a reload. */
let DB = null;
let STORAGE_MODE = 'local';
const LOCAL_KEY = 'trainingData';
/** Captures exactly what happened during storage init, in plain language, so it
 *  can be read directly off the screen (via the "Storage debug" footer link)
 *  without needing browser dev tools. */
const STORAGE_DEBUG = {
  windowClaudeAtScriptStart: (typeof window.claude !== 'undefined'),
  bridgeFoundAfterMs: null,
  bridgeUseCalled: false,
  dbResult: 'not reached',
  error: null,
  finishedAt: null,
  docGetAttempted: false,
  docGetResult: 'not attempted',
  sessionsLoadedFrom: 'not yet loaded'
};

/** The platform injects window.claude asynchronously, and its timing relative
 *  to this script's first run is NOT guaranteed — it can land before or after
 *  DOMContentLoaded, and is never promised to be there on the very first tick.
 *  A single synchronous check at load time is therefore a race: if the bridge
 *  hasn't arrived yet at that exact moment, it looks identical to "unavailable"
 *  and storage falls back to localStorage permanently for that whole session,
 *  with no error and no way to recover short of a reload. This polls briefly
 *  instead of checking once, so a late-arriving bridge still gets used. */
function waitForClaudeBridge(timeoutMs){
  timeoutMs = timeoutMs || 12000;
  return new Promise((resolve)=>{
    const start = Date.now();
    (function poll(){
      if(typeof window.claude !== 'undefined' && typeof window.claude.use === 'function'){
        STORAGE_DEBUG.bridgeFoundAfterMs = Date.now()-start;
        resolve(window.claude);
        return;
      }
      if(Date.now() - start >= timeoutMs){
        STORAGE_DEBUG.bridgeFoundAfterMs = 'never (timed out after '+timeoutMs+'ms)';
        resolve(null);
        return;
      }
      setTimeout(poll, 100);
    })();
  });
}

async function initStorage(){
  try{
    const bridge = await waitForClaudeBridge();
    if(bridge){
      STORAGE_DEBUG.bridgeUseCalled = true;
      DB = await bridge.use('db');
      STORAGE_DEBUG.dbResult = DB ? 'got a usable db object' : 'resolved to null/falsy — not granted or not served';
      if(DB){ STORAGE_MODE = 'db'; STORAGE_DEBUG.finishedAt = new Date().toISOString(); return; }
    } else {
      STORAGE_DEBUG.dbResult = 'skipped — bridge itself never appeared';
    }
  }catch(e){
    STORAGE_DEBUG.error = (e && (e.message || e.code)) ? (e.code ? e.code+': '+e.message : e.message) : String(e);
  }
  STORAGE_MODE = 'local';
  STORAGE_DEBUG.finishedAt = new Date().toISOString();
}

function readLocal(){
  try{ return localStorage.getItem(LOCAL_KEY); }catch(e){ return null; }
}
function writeLocal(str){
  try{ localStorage.setItem(LOCAL_KEY, str); return true; }catch(e){ return false; }
}

// This artifact is private ("Only you"), so a plain shared document is already
// effectively personal — only the artifact owner can open it. Using a shared
// path (rather than data/users/me/...) sidesteps "who is the current viewer"
// resolution entirely, which is what caused reads/writes to silently miss
// each other before. Trade-off: if this artifact is ever shared with someone
// else, they would see the same log rather than each getting their own.
const DB_DOC_PATH = 'trainingLog/main';

async function loadData(){
  await initStorage();
  if(STORAGE_MODE==='db'){
    STORAGE_DEBUG.docGetAttempted = true;
    try{
      const snap = await DB.doc(DB_DOC_PATH).get();
      STORAGE_DEBUG.docGetResult = 'succeeded, exists='+snap.exists;
      if(snap.exists){
        const body = snap.data();
        if(body && body.json){
          DATA = JSON.parse(body.json);
          if(!DATA.theme) DATA.theme='iron';
          STORAGE_DEBUG.sessionsLoadedFrom = 'db ('+(DATA.sessions?DATA.sessions.length:'?')+' sessions)';
          return;
        }
      } else {
        // First time this artifact has durable storage. If this device already
        // has a local log, migrate it in right away rather than waiting for the
        // next edit — otherwise a different device could load first, find
        // nothing, seed an empty log, and this device's real data would be
        // stuck behind it.
        const local = readLocal();
        if(local){
          try{
            DATA = JSON.parse(local);
            if(!DATA.theme) DATA.theme='iron';
            await persist();
            STORAGE_DEBUG.sessionsLoadedFrom = 'migrated from local into db';
            return;
          }catch(e){ /* corrupt, fall through below */ }
        }
      }
    }catch(e){
      STORAGE_DEBUG.docGetResult = 'THREW: '+((e && (e.code || e.message)) ? (e.code?e.code+': ':'')+(e.message||'') : String(e));
      console.warn('db read failed, using local', e); STORAGE_MODE='local';
    }
  }
  const local = readLocal();
  if(local){
    try{
      DATA = JSON.parse(local);
      if(!DATA.theme) DATA.theme='iron';
      STORAGE_DEBUG.sessionsLoadedFrom = 'localStorage fallback ('+(DATA.sessions?DATA.sessions.length:'?')+' sessions)';
      return;
    }
    catch(e){ /* corrupt, fall through to seed */ }
  }
  DATA = seedData();
  STORAGE_DEBUG.sessionsLoadedFrom = 'seed data (nothing found anywhere)';
  await persist();
}

let persistInFlight = null;
async function persist(){
  const json = JSON.stringify(DATA);
  writeLocal(json); // always keep a local copy as a backstop
  if(STORAGE_MODE!=='db' || !DB){ flashSaved(); return; }
  // one write at a time per document
  if(persistInFlight){ await persistInFlight.catch(()=>{}); }
  persistInFlight = DB.doc(DB_DOC_PATH).set({ json, savedAt: new Date().toISOString() });
  try{ await persistInFlight; flashSaved(); }
  catch(e){ console.error('save failed', e); }
  finally{ persistInFlight = null; }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 700); }
function flashSaved(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = 'Saved'; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1200);
}

function updateStatRow(){
  const mastheadDate = document.getElementById('mastheadDate');
  if(mastheadDate){
    mastheadDate.textContent = '— ' + new Date().toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short', year:'numeric'});
  }
  const sortedSessions = [...DATA.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  const todayStr0 = todayLocal();
  const pastSessions0 = sortedSessions.filter(s=>s.date<=todayStr0);
  const futureSessions0 = sortedSessions.filter(s=>s.date>todayStr0);
  let lastWorkoutStat = 'No sessions yet';
  if(pastSessions0.length){
    const last = pastSessions0[pastSessions0.length-1];
    const days = Math.round((new Date(todayStr0) - new Date(last.date)) / 86400000);
    lastWorkoutStat = days===0 ? 'Today' : days===1 ? '1 day ago' : days+' days ago';
  }
  let nextPlannedStat = '–';
  if(futureSessions0.length){
    const next = futureSessions0[0];

function quickEst1RM(exId, allSessions){

function renderSessionList(sortedSessions){
  const visible = (activeCat==='all' ? sortedSessions : sortedSessions.filter(s=>s.cat===activeCat)).slice().reverse();

      .filter(e=>cellSets(e.id+'|'+sess.id).length)

    // exercises that were planned for this session but haven't been logged yet —
    // shown regardless of whether OTHER exercises in the same session are already
    // done, so logging one exercise never makes the rest look like they vanished
    const stillPlanned = DATA.exercises
      .filter(e=>targetSets(sess, e.id).length && !cellSets(e.id+'|'+sess.id).length)
      .map(e=>({name:e.name, text:targetText(sess, e.id), id:e.id}));

    const body = (logged.length || stillPlanned.length)

          <button class="btn ghost sess-mini" data-move-session="${sess.id}" title="Move to another date">Move</button>
          <button class="btn ghost sess-mini" data-del-session="${sess.id}" title="Delete session">Delete</button>

function generateInsight(sortedSessions){
  const insights = [];
  let bestImprovement = null;
  let decliningCount = 0, decliningName = null;
  DATA.exercises.forEach(e=>{
    const stats = computeExerciseStats(e.id, sortedSessions);
    if(stats && stats.changeOver4Pct!=null && stats.changeOver4Pct>0){
      if(!bestImprovement || stats.changeOver4Pct>bestImprovement.pct) bestImprovement = {name:e.name, pct:stats.changeOver4Pct};
    }
    if(stats && stats.trend==='down' && stats.points.length>=3){
      decliningCount++;
      if(!decliningName) decliningName = e.name;
    }
  });
  if(bestImprovement) insights.push(`Your ${bestImprovement.name.toLowerCase()} estimated 1RM is up ${bestImprovement.pct}% over your last few sessions.`);
  if(decliningCount>=2) insights.push(`${decliningCount} exercises have trended down over your last few sessions, including ${decliningName.toLowerCase()}.`);

  if(!insights.length) return null;
  const dayIndex = Math.floor(Date.now()/86400000);
  return insights[dayIndex % insights.length];
}

/** Muscles that haven't been directly trained (0.6+ involvement) in the longest, most-neglected first. */
/** Last date each muscle (0.6+ involvement) was directly trained, across all exercises. */
function muscleLastTrainedMap(sortedSessions){
  const lastTrainedByMuscle = {};
  DATA.exercises.forEach(e=>{
    const muscles = MUSCLE_MAP[e.name] || guessMuscles(e.name);
    let lastDate = null;
    for(let i=sortedSessions.length-1;i>=0;i--){
      if(DATA.cells[e.id+'|'+sortedSessions[i].id]){ lastDate = sortedSessions[i].date; break; }
    }
    if(lastDate){
      Object.keys(muscles).forEach(m=>{
        if(muscles[m]>=0.6 && (!lastTrainedByMuscle[m] || lastDate>lastTrainedByMuscle[m])) lastTrainedByMuscle[m]=lastDate;
      });
    }
  });
  return lastTrainedByMuscle;
}

function computeNeglectedMuscles(sortedSessions, topN){
  const lastTrainedByMuscle = muscleLastTrainedMap(sortedSessions);
  const todayStr = todayLocal();
  const ranked = Object.entries(lastTrainedByMuscle).map(([m,date])=>({
    muscle:m, label: MUSCLE_LABELS[m]||m,
    days: Math.round((new Date(todayStr)-new Date(date))/86400000),
  })).filter(r=>r.days>=10).sort((a,b)=>b.days-a.days);
  return ranked.slice(0, topN||3);
}

/* ---------- equipment ----------
   "Free weights" means barbells, dumbbells, kettlebells and bodyweight — the things
   available when the machine/cable area is busy, or you're in a hotel or home gym.
   Inferred from the exercise name, overridable per exercise. */
const EQUIPMENT_LABEL = { free:'Free weight', machine:'Machine', cable:'Cable', bodyweight:'Bodyweight' };

function inferEquipment(name){
  const n = (name||'').toLowerCase();
  // an explicit implement in the name settles it, before any apparatus guess —
  // "dumbbell chest press" is free even though "chest press" alone implies a machine
  if(/barbell|dumbbell|\bdb\b|kettlebell|\bkb\b|trap bar|landmine|ez[- ]bar|goblet/.test(n)) return 'free';
  if(/cable|pulldown|pressdown|pushdown|pull-?through|rope|face pull|pallof|\bfly\b/.test(n)) return 'cable';
  if(/machine|smith|pec deck|leg press|leg curl|leg extension|hack squat|booty builder|seated row|preacher|hip abduction|hip adduction|assisted|chest press/.test(n)) return 'machine';
  if(/plank|push-?up|pull-?up|chin-?up|\bdip\b|dips|rollout|sit-?up|bodyweight|nordic|copenhagen|pistol|muscle-?up|carry|hold|hanging/.test(n)) return 'bodyweight';
  if(/back squat|front squat|deadlift|romanian|split squat|lunge|step-?up|shrug|hammer curl|good morning|hip thrust|bench press|calf raise|wrist curl|neck/.test(n)) return 'free';
  return 'free';
}
function equipmentOf(ex){
  if(ex && ex.equipment && EQUIPMENT_LABEL[ex.equipment]) return ex.equipment;
  return inferEquipment(ex && ex.name);
}
/** Free-weight sessions still allow bodyweight work — both need no machine. */
function isFreeWeightFriendly(ex){
  const eq = equipmentOf(ex);
  return eq==='free' || eq==='bodyweight';
}

/* ---------- gyms ----------
   Machine and cable weights don't carry between gyms: a cable stack with two
   pulleys reads double the weight of a single-pulley one, and one brand's chest
   press is nothing like another's. So you pick the gym once per workout (it's
   remembered, so usually that's zero taps), and every machine/cable entry logged
   in that workout is tagged with it — stored on its sets as `machine`, so the tag
   travels with the sets through moves, merges, trash and export. Everything that
   compares against history (suggestions, PRs, charts, 1RM estimates) only looks at
   machine/cable entries from the same gym. Free weights are the same everywhere, so
   they're never tagged and their history is shared. Untagged entries are their own
   bucket, so history from before gyms existed keeps behaving as it always did. */
function machineById(id){ return id ? (DATA.machines||[]).find(m=>m.id===id) || null : null; }
function machineName(id){ const m = machineById(id); return m ? m.name : 'No gym set'; }
/** Gym an entry was logged at ('' when untagged). */
function machineOfSets(sets){ return (sets && sets.length && sets[0].machine) || ''; }
function machineOfCell(key){ return machineOfSets(DATA.cells[key]); }
function tagSets(sets, machineId){
  (sets||[]).forEach(s=>{ if(machineId) s.machine = machineId; else delete s.machine; });
  return sets;
}
/** Machine and cable work is what changes from gym to gym. */
function isGymSpecific(ex){
  const eq = equipmentOf(ex);
  return eq==='machine' || eq==='cable';
}
/** The gym you last trained at. */
function currentGym(){ return machineById(DATA.currentGym) ? DATA.currentGym : ''; }
/** The gym a session happened at: its own if set, otherwise wherever you are now. */
function gymForSession(sessionId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  return (s && machineById(s.gym)) ? s.gym : currentGym();
}
/** Whose history counts for this exercise right now. */
function currentMachineFor(ex){ return isGymSpecific(ex) ? currentGym() : ''; }
/** PR records are kept per exercise per gym. Untagged keeps the plain exercise id. */
function prKey(exId, machineId){ return machineId ? exId+'@'+machineId : exId; }
function parsePRKey(key){ const i = key.indexOf('@'); return i<0 ? {exId:key, machineId:''} : {exId:key.slice(0,i), machineId:key.slice(i+1)}; }
/** Gyms this exercise has history at, most-used first ('' = untagged). */
function machinesUsedFor(exId){
  const counts = {};
  Object.keys(DATA.cells).forEach(k=>{
    if(!k.startsWith(exId+'|')) return;
    const mId = machineOfCell(k);
    counts[mId] = (counts[mId]||0)+1;
  });
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
}
function entriesOnMachine(machineId){
  return Object.keys(DATA.cells).filter(k=>machineOfCell(k)===machineId).length;
}
/** Retags every entry for one exercise that's currently at `fromMachine`. Returns the keys touched. */
function retagExerciseEntries(exId, fromMachine, toMachine){
  const keys = Object.keys(DATA.cells).filter(k=>k.startsWith(exId+'|') && machineOfCell(k)===fromMachine);
  keys.forEach(k=>tagSets(DATA.cells[k], toMachine));
  return keys;
}
/** Adds a gym and makes it the current one. The very first gym also takes over
 *  your untagged machine/cable history — that's almost always where it happened,
 *  and otherwise adding a gym would wipe every suggestion. Undoable, never asked. */
function addGym(name){
  const first = !(DATA.machines||[]).length;
  const g = { id: 'm-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name };
  DATA.machines = (DATA.machines||[]).concat([g]);
  DATA.currentGym = g.id;
  let adopted = [];
  if(first){
    DATA.exercises.filter(isGymSpecific).forEach(ex=>{ adopted = adopted.concat(retagExerciseEntries(ex.id, '', g.id)); });
    if(adopted.length) rebuildPRRecordsFromHistory();
  }
  scheduleSave();
  return { id: g.id, adopted };
}
/** Short text prompt that stacks above whatever's open (closeModal would take the
 *  pop-up underneath down with it). Resolves to the trimmed name, or null. */
function promptGymName(title, initial){
  return new Promise(resolve=>{
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.style.zIndex = 400;
    wrap.innerHTML = `<div class="modal" style="max-width:420px;">
      <h2>${escapeHtml(title)}</h2>
      <div class="field"><input type="text" id="gymName" value="${escapeHtml(initial)}" placeholder="e.g. Town gym" autocapitalize="words"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="cCancel">Cancel</button>
        <button class="btn primary" id="cOk">Save</button>
      </div>
    </div>`;
    document.body.appendChild(wrap);
    const input = wrap.querySelector('#gymName');
    const done = (v)=>{ wrap.remove(); resolve(v); };
    const ok = ()=>{ const n = input.value.trim(); if(n) done(n); else input.focus(); };
    wrap.addEventListener('click', e=>{ if(e.target===wrap) done(null); });
    wrap.querySelector('#cCancel').addEventListener('click', ()=>done(null));
    wrap.querySelector('#cOk').addEventListener('click', ok);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } else if(e.key==='Escape'){ e.stopPropagation(); done(null); } });
    // naming is the one thing you have to type, so the keyboard coming up is wanted here
    setTimeout(()=>{ input.focus({preventScroll:true}); input.select(); }, 20);
  });
}
function openManageGymsModal(onDone){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.style.zIndex = 400;
  const finish = ()=>{ wrap.remove(); render(); if(onDone) onDone(); };
  const draw = ()=>{
    const list = DATA.machines||[];
    wrap.innerHTML = `<div class="modal" style="max-width:480px;">
      <h2>Your gyms</h2>
      <p class="modal-sub">Machine and cable weights are only compared within the same gym.</p>
      ${list.map(m=>`<div class="plan-row">
        <span class="plan-row-date" style="flex:1;">${escapeHtml(m.name)}</span>
        <button class="btn ghost" data-rename="${m.id}">Rename</button>
        <button class="btn ghost" data-remove="${m.id}">Remove</button>
      </div>`).join('')}
      <div class="modal-actions"><button class="btn primary" id="cDone">Done</button></div>
    </div>`;
    wrap.querySelector('#cDone').addEventListener('click', finish);
    wrap.querySelectorAll('[data-rename]').forEach(b=>b.addEventListener('click', async ()=>{
      const m = machineById(b.dataset.rename);

    }));
    wrap.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', ()=>{
      const m = machineById(b.dataset.remove);
      // no "are you sure": it's one tap to undo instead
      const keys = Object.keys(DATA.cells).filter(k=>machineOfCell(k)===m.id);
      const sessIds = DATA.sessions.filter(s=>s.gym===m.id).map(s=>s.id);
      const wasCurrent = DATA.currentGym===m.id;
      const idx = list.indexOf(m);
      keys.forEach(k=>tagSets(DATA.cells[k], ''));
      DATA.sessions.forEach(s=>{ if(s.gym===m.id) delete s.gym; });
      if(wasCurrent) delete DATA.currentGym;
      DATA.machines = list.filter(x=>x.id!==m.id);
      rebuildPRRecordsFromHistory(); scheduleSave(); draw();
      showToast(`Removed ${m.name}.`, ()=>{
        DATA.machines.splice(idx, 0, m);
        keys.forEach(k=>tagSets(DATA.cells[k], m.id));
        sessIds.forEach(id=>{ const s = DATA.sessions.find(x=>x.id===id); if(s) s.gym = m.id; });
        if(wasCurrent) DATA.currentGym = m.id;
        rebuildPRRecordsFromHistory(); scheduleSave();
        if(document.body.contains(wrap)) draw(); else { render(); if(onDone) onDone(); }
      });
    }));
  };
  wrap.addEventListener('click', e=>{ if(e.target===wrap) finish(); });
  draw();
  document.body.appendChild(wrap);
}
/** Row of tappable gym chips. `selected` is highlighted; `extra` goes on the end. */
function gymChipsHTML(selected, attr, extra){
  return (DATA.machines||[]).map(m=>`<button type="button" class="chip ${m.id===selected?'on':''}" ${attr}="${m.id}">${escapeHtml(m.name)}</button>`).join('') + (extra||'');
}

/** Days since a muscle was last directly trained; never-trained counts as heavily neglected. */
const NEVER_TRAINED_DAYS = 120;
function muscleNeglectDays(muscle, lastTrained, todayStr){
  const last = lastTrained[muscle];
  if(!last) return NEVER_TRAINED_DAYS;
  return Math.min(NEVER_TRAINED_DAYS, Math.round((new Date(todayStr)-new Date(last))/86400000));
}

/** Days since this specific exercise was last performed; never-performed ranks high
 *  so untried movements surface instead of sinking to the bottom forever. */
function exerciseStalenessDays(ex, sortedSessions, todayStr){
  for(let i=sortedSessions.length-1;i>=0;i--){
    if(DATA.cells[ex.id+'|'+sortedSessions[i].id]){
      return Math.min(NEVER_TRAINED_DAYS, Math.round((new Date(todayStr)-new Date(sortedSessions[i].date))/86400000));
    }
  }
  return NEVER_TRAINED_DAYS;
}

/** The muscles an exercise meaningfully trains (used for coverage/diversity). */
function primaryMusclesOf(ex){
  const m = MUSCLE_MAP[ex.name] || guessMuscles(ex.name);
  const entries = Object.entries(m).filter(([,v])=>v>=0.6).map(([k])=>k);
  return entries.length ? entries : Object.keys(m);
}

/** Small stable per-day jitter so repeated planning isn't byte-identical every time,
 *  while staying consistent within a single day. */
function rotationJitter(exId){
  const daySeed = Math.floor(Date.parse(todayLocal()+'T00:00:00')/86400000);
  let h = daySeed;
  for(let i=0;i<exId.length;i++){ h = (h*31 + exId.charCodeAt(i)) & 0x7fffffff; }
  return (h % 1000)/1000; // 0..1
}

/**
 * Scores an exercise for inclusion in a suggested session. Higher = more deserving.
 * Weighted toward muscles that have gone longest untrained, then toward movements
 * that haven't been performed in a while, so sessions vary instead of replaying
 * whatever was done most recently.
 */
function scoreExerciseForPool(ex, lastTrained, sortedSessions, todayStr){
  const muscles = MUSCLE_MAP[ex.name] || guessMuscles(ex.name);
  let weighted = 0, involvementTotal = 0;
  Object.entries(muscles).forEach(([m, involvement])=>{
    weighted += involvement * muscleNeglectDays(m, lastTrained, todayStr);
    involvementTotal += involvement;
  });
  const neglect = involvementTotal ? weighted/involvementTotal : 0;
  const staleness = exerciseStalenessDays(ex, sortedSessions, todayStr);
  return neglect*1.0 + staleness*0.6 + rotationJitter(ex.id)*4;
}

/**
 * Classifies a movement as a big multi-joint 'compound' or smaller 'accessory' work,
 * so a session can be ordered compound-first while the person is fresh, with smaller
 * complementary movements later. Defers to standard resistance-training sequencing
 * (NSCA guidance: multi-joint before single-joint, larger muscle mass before smaller,
 * higher-skill/higher-fatigue-cost work while fresh) rather than raw suggestion score.
 * Anything in the 'aux' category (core, shrugs, neck, wrist, rotator work) already
 * lands at the very end via buildSessionPool's bonus pool, so it isn't tiered here.
 */
function movementTierOf(ex){
  const n = (ex && ex.name || '').toLowerCase();
  // isolation movements that happen to contain a "compound-sounding" word
  if(/straight-arm pulldown/.test(n)) return 'accessory';
  // squat/hinge/press/pull patterns that load multiple joints and the most muscle mass
  if(/squat|deadlift|hip thrust|leg press|lunge|split squat|step-?up|good morning/.test(n)) return 'compound';
  if(/bench press|incline .*press|shoulder press|overhead press|chest press|\bdips?\b/.test(n)) return 'compound';
  if(/\brow\b|pulldown|pull-?up|chin-?up/.test(n)) return 'compound';
  return 'accessory';
}
function tierRank(ex){ return movementTierOf(ex)==='compound' ? 0 : 1; }
/** Stable sort (JS Array#sort is stable): compounds first, accessories after, each
 *  group keeping whatever relative order it already had — so within a tier, the
 *  existing neglect/staleness scoring still decides which specific exercise leads. */
function sortByMovementTier(exList){
  return exList.slice().sort((a,b)=>tierRank(a)-tierRank(b));
}

/**
 * Picks the exercise pool for a category. Selection is greedy but diversity-aware:
 * it takes the best-scoring exercise, then prefers ones hitting muscles not already
 * covered, so a Push day doesn't come back as six variations of a chest press.
 */
function pickPoolForCat(cat, sortedSessions, limit, opts){
  opts = opts || {};
  const excludeIds = opts.excludeIds || new Set();
  const avoidMuscles = opts.avoidMuscles || new Set();
  const freeOnly = opts.freeWeightsOnly!==undefined ? opts.freeWeightsOnly : !!DATA.freeWeightsOnly;
  let exercises = DATA.exercises.filter(e=>e.cat===cat && !excludeIds.has(e.id));
  if(freeOnly){
    const freeOnes = exercises.filter(isFreeWeightFriendly);
    // only apply the restriction if it still leaves something to work with, so a
    // category with no free-weight options doesn't silently vanish from the plan
    if(freeOnes.length) exercises = freeOnes;
  }
  if(!exercises.length) return [];
  const lastTrained = muscleLastTrainedMap(sortedSessions);
  const todayStr = todayLocal();
  const scored = exercises.map(ex=>({
    ex,
    score: scoreExerciseForPool(ex, lastTrained, sortedSessions, todayStr),
    muscles: primaryMusclesOf(ex),
  })).sort((a,b)=>b.score-a.score);

  const chosen = [];
  // muscles the rest of the session already covers are treated as already-hit, so an
  // aux add-on complements the main work instead of doubling up on it
  const covered = new Set(avoidMuscles);
  // first pass: best-scoring exercise for each not-yet-covered muscle group
  scored.forEach(c=>{
    if(chosen.length>=limit) return;
    if(c.muscles.some(m=>covered.has(m))) return;
    chosen.push(c);
    c.muscles.forEach(m=>covered.add(m));
  });
  // second pass: top up by raw score if diversity left us short
  scored.forEach(c=>{
    if(chosen.length>=limit) return;
    if(chosen.includes(c)) return;
    chosen.push(c);
  });
  const picked = chosen.slice(0, limit).map(c=>c.ex);
  // 'aux' is already the always-last bonus pool (core/shrug/neck/etc.) — no need to
  // tier it internally. Everything else defaults to compound-first ordering.
  return cat==='aux' ? picked : sortByMovementTier(picked);
}

/** Muscles covered by a set of exercises, used so aux add-ons complement the session. */
function musclesCoveredBy(exList){
  const set = new Set();
  exList.forEach(ex=>primaryMusclesOf(ex).forEach(m=>set.add(m)));
  return set;
}

/** Main pool + a complementary aux/core add-on for non-aux splits. */
/** Pool for a specific session: exclusions are applied during selection (so a
 *  replacement is pulled in), then the session's saved order is applied. */
function buildPoolForSession(session, sortedSessions, mainLimit, bonusLimit){
  if(!session) return [];

  // A session that already has content — exercises logged against it, or targets
  // set when it was planned — IS the session. Suggestions are only for filling in
  // a blank one; generating them over the top would replace a deliberately built
  // workout with an unrelated list.
  const logged = DATA.exercises.filter(e=>cellSets(e.id+'|'+session.id).length);
  const planned = DATA.exercises.filter(e=>targetSets(session, e.id).length);
  const ownIds = new Set([...logged, ...planned].map(e=>e.id));
  if(ownIds.size){
    const own = DATA.exercises.filter(e=>ownIds.has(e.id));
    return applySessionOrder(session, sortByMovementTier(own));
  }

  const excludedIds = (session.excluded || [])
    .filter(id=> !cellSets(id+'|'+session.id).length); // keep anything already logged
  const pool = buildSessionPool(session.cat, sortedSessions, mainLimit, bonusLimit, {
    excludeIds: new Set(excludedIds),
  });
  return applySessionOrder(session, pool);
}

/**
 * Applies a session's saved exercise order to a pool. Anything the session has an
 * explicit position for comes first in that order; everything else keeps its
 * suggested position at the end. Lets you push an exercise to the end of the
 * session without it jumping back on the next render.
 */
function applySessionOrder(session, pool){
  // exercises explicitly dropped from this session stay dropped, unless they've
  // actually got sets logged against them
  const excluded = new Set((session && session.excluded) || []);
  if(excluded.size){
    pool = pool.filter(e=> !excluded.has(e.id) || cellSets(e.id+'|'+session.id).length);
  }
  const order = (session && session.order) || [];
  if(!order.length) return pool;
  const rank = new Map(order.map((id,i)=>[id,i]));
  return pool.slice().sort((a,b)=>{
    const ra = rank.has(a.id) ? rank.get(a.id) : Infinity;
    const rb = rank.has(b.id) ? rank.get(b.id) : Infinity;
    if(ra===rb) return 0;
    return ra-rb;
  });
}

/** Moves an exercise up or down within a session, persisting the new order. */
function moveExerciseInSession(session, pool, exId, dir){
  if(!session) return pool;
  const ordered = applySessionOrder(session, pool).map(e=>e.id);
  const i = ordered.indexOf(exId);
  const j = i + dir;
  if(i<0 || j<0 || j>=ordered.length) return pool;
  ordered.splice(j, 0, ordered.splice(i,1)[0]);
  session.order = ordered;
  scheduleSave();
  return pool;
}

function buildSessionPool(cat, sortedSessions, mainLimit, bonusLimit, opts){
  opts = opts || {};
  const mainPool = pickPoolForCat(cat, sortedSessions, mainLimit, opts);
  if(cat==='aux') return mainPool;
  const bonusPool = pickPoolForCat('aux', sortedSessions, bonusLimit, Object.assign({}, opts, {
    excludeIds: new Set(mainPool.map(e=>e.id)),
    avoidMuscles: musclesCoveredBy(mainPool),
  }));
  return mainPool.concat(bonusPool);
}

function checkInterference(session){
  if(!session || (session.cat!=='leg' && session.cat!=='bilat')) return null;
  const runs = DATA.runSchedule||[];
  for(const r of runs){
    const rt = RUN_TYPES[r.type];
    if(!rt || rt.hardness<1) continue;
    const buffer = rt.hardness>=3 ? 2 : 1;
    const diff = daysBetween(session.date, r.date);
    if(Math.abs(diff)<=buffer){
      const when = diff===0 ? 'also today' : diff<0 ? 'tomorrow' : 'yesterday';
      return `You've got a ${CATS[session.cat].label.toLowerCase()} day scheduled, but there's a ${rt.label.toLowerCase()} ${when}. Worth a lighter session, or moving this if your legs feel fatigued.`;
    }
  }
  return null;
}

function renderTodayCard(sortedSessions){
