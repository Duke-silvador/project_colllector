<script>
const SUPABASE_URL = 'https://fgrjdaizgjpqdimgtxrp.supabase.co';
const ANON_KEY = 'sb_publishable_PddH-hdBtn_G2vwtdB9xuA_UuBSLVgG';

// 2026-09-08 起统一使用标准名称（与门店主表 stores.std_name 一致）
const STORES = ['佛山顺联店','佛山印象城','佛山国金店','佛山恒福店','佛山新塘店','佛山绿地店','佛山高明店','佛山星耀店','佛山万科店','佛山水城店','佛山悦汇店'];
const SHORT_MAP = {
  '佛山顺联店':'顺联','佛山彩虹店':'彩虹','佛山印象城':'印象','佛山国金店':'国金',
  '佛山恒福店':'恒福','佛山新塘店':'新塘','佛山绿地店':'绿地','佛山高明店':'高明',
  '佛山万悦店':'万悦','佛山星耀店':'星耀','佛山万科店':'万科','佛山水城店':'水城'
};
function shortName(s){ return SHORT_MAP[s] || String(s||'').replace(/^\d+/,'').slice(0,2); }

// ---------------------------------------------------------------------------
// 匿名登录：RLS 收紧后，必须带上「已登录」身份才能读写。
// 门店端完全无感知（不填邮箱密码），会话存 localStorage，过期自动续。
// ---------------------------------------------------------------------------
const SESSION_KEY = 'sb_anon_session';
async function authPost(path, body) {
  const r = await fetch(SUPABASE_URL + path, {
    method: 'POST',
    headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error_description || d.msg || ('HTTP ' + r.status));
  return d;
}
function saveSession(d) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({
    access_token: d.access_token,
    refresh_token: d.refresh_token || '',
    expires_at: (Date.now() / 1000) + (d.expires_in || 3600) - 300
  }));
}
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    return (s && s.access_token) ? s : null;
  } catch (e) { return null; }
}
let pendingAuth = null;
async function ensureAuth() {
  const s = loadSession();
  if (s && (!s.expires_at || s.expires_at > Date.now() / 1000)) return s.access_token;
  if (s && s.refresh_token) {
    try { const d = await authPost('/auth/v1/token?grant_type=refresh_token', { refresh_token: s.refresh_token }); saveSession(d); return d.access_token; }
    catch (e) { /* 续期失败 → 重新匿名登录 */ }
  }
  if (!pendingAuth) {
    pendingAuth = authPost('/auth/v1/signup', {}).then(d => { pendingAuth = null; saveSession(d); return d.access_token; })
      .catch(e => { pendingAuth = null; throw e; });
  }
  return pendingAuth;
}
async function authHeaders() {
  const t = await ensureAuth();
  return { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' };
}

// 动态门店列表（2026-09-21）：以 stores 主表为准（直营+在营），新店建完自动出现；
// 失败或为空时保留硬编码 STORES，保证填报永远可用
async function loadStoresDynamic() {
  try {
    const h = await authHeaders();
    const q = '/rest/v1/stores?select=std_name&store_type=eq.' + encodeURIComponent('直营')
            + '&status=eq.' + encodeURIComponent('在营') + '&order=std_name.asc';
    const r = await fetch(SUPABASE_URL + q, { headers: h });
    if (!r.ok) return;
    const arr = await r.json();
    const list = (arr || []).map(x => x.std_name).filter(Boolean);
    if (list.length) {
      STORES.length = 0;
      list.forEach(s => STORES.push(s));
      renderStores();
    }
  } catch (e) { /* 静默回退硬编码 */ }
}

// ---------------------------------------------------------------------------
// 表单结构：与小程序 pages/report/report.js 完全一致
// 快捷按钮 0~5，超出用右侧 [>] 手动输入
// 到店人数 ↔ 核销金额、内购订单数 ↔ 内购金额 各自配对成一行
// 「约不上」是 0~20 滑块
// ---------------------------------------------------------------------------
const NUM_OPTIONS = [0, 1, 2, 3, 4, 5];
const PLATFORM_GROUPS = [
  { name: '美团', rows: [
    { key: 'meituan_visitors',       label: '真实', label2: '客数', amountKey: 'meituan_verify_amount', amountPlaceholder: '核销金额', amountHint: '美团核销金额' },
    { key: 'meituan_inner_orders',   label: '内购', label2: '数量', amountKey: 'meituan_inner_amount',   amountPlaceholder: '内购金额', amountHint: '美团内购金额' },
    { key: 'meituan_unable_to_book', label: '约不上', control: 'slider', max: 20 }
  ]},
  { name: '抖音', rows: [
    { key: 'douyin_visitors',        label: '真实', label2: '客数', amountKey: 'douyin_verify_amount', amountPlaceholder: '核销金额', amountHint: '抖音核销金额' },
    { key: 'douyin_inner_orders',    label: '内购', label2: '数量', amountKey: 'douyin_inner_amount',   amountPlaceholder: '内购金额', amountHint: '抖音内购金额' },
    { key: 'douyin_unable_to_book',  label: '约不上', control: 'slider', max: 20 }
  ]}
];

function buildGroups(record) {
  const r = record || {};
  return PLATFORM_GROUPS.map(g => ({
    name: g.name,
    rows: g.rows.map(row => {
      let value = (r[row.key] !== undefined && r[row.key] !== null) ? r[row.key] : null;
      if (row.control === 'slider' && (value === null || value === undefined)) value = 0;
      return {
        key: row.key, label: row.label, label2: row.label2 || '',
        options: NUM_OPTIONS, control: row.control || '', max: row.max || 20,
        amountKey: row.amountKey || '', amountPlaceholder: row.amountPlaceholder || '',
        amountHint: row.amountHint || '',
        value: value, manual: '',
        amount: (row.amountKey && r[row.amountKey] != null) ? String(r[row.amountKey]) : ''
      };
    })
  }));
}

// 运行时状态
let groups = buildGroups();
let selectedStore = '';
let submittedStores = [];
let isEditing = false;
try { selectedStore = localStorage.getItem('lastStore') || ''; } catch (e) {}

const pad = n => String(n).padStart(2, '0');
const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => fmtDate(new Date());
function dateBounds() {
  const now = new Date();
  const yst = new Date(now.getTime() - 864e5);
  return { minDate: fmtDate(yst), maxDate: fmtDate(now) };
}

// ---------------------------------------------------------------------------
// 渲染
// ---------------------------------------------------------------------------
function renderStores() {
  const grid = document.getElementById('storeGrid');
  grid.innerHTML = '';
  STORES.forEach(s => {
    const d = document.createElement('div');
    d.className = 'store-btn'
      + (s === selectedStore ? ' selected' : '')
      + (submittedStores.indexOf(s) > -1 ? ' submitted' : '');
    d.innerHTML = (s === selectedStore ? '<span class="check">✓</span>' : '')
      + '<span class="store-display">' + shortName(s) + '</span>';
    d.onclick = () => {
      selectedStore = s;
      try { localStorage.setItem('lastStore', s); } catch (e) {}
      renderStores();
      reloadExisting();
    };
    grid.appendChild(d);
  });
}

function renderGroups() {
  const box = document.getElementById('groupsBox');
  box.innerHTML = '';
  groups.forEach((g, gi) => {
    const gd = document.createElement('div');
    gd.className = 'pf-group';
    gd.innerHTML = '<div class="pf-name">' + g.name + '</div>';
    g.rows.forEach((row, ri) => gd.appendChild(renderRow(g.name, gi, row, ri)));
    box.appendChild(gd);
  });
}

function renderRow(pfName, gi, row, ri) {
  const line = document.createElement('div');
  line.className = 'row-line';
  const lbl = document.createElement('div');
  lbl.className = 'row-label';
  lbl.innerHTML = '<span class="rl-1">' + row.label + '</span>'
    + (row.label2 ? '<span class="rl-2">' + row.label2 + '</span>' : '');
  line.appendChild(lbl);

  if (row.control === 'slider') {
    line.classList.add('row-line--slider');
    const sl = document.createElement('input');
    sl.type = 'range'; sl.className = 'row-slider';
    sl.min = 0; sl.max = row.max; sl.step = 1; sl.value = row.value || 0;
    const val = document.createElement('span');
    val.className = 'slider-val'; val.textContent = row.value || 0;
    sl.oninput = () => {
      groups[gi].rows[ri].value = parseInt(sl.value, 10);
      val.textContent = sl.value;
    };
    line.appendChild(sl);
    line.appendChild(val);
    return line;
  }

  // 数字快捷按钮 + 手动输入
  const numRow = document.createElement('div');
  numRow.className = 'num-row';
  row.options.forEach(opt => {
    const b = document.createElement('div');
    b.className = 'num-btn' + (row.value === opt ? ' selected' : '');
    b.textContent = opt;
    b.onclick = () => {
      groups[gi].rows[ri].value = opt;
      groups[gi].rows[ri].manual = '';
      numRow.querySelectorAll('.num-btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      const mi = numRow.querySelector('.num-input'); if (mi) mi.value = '';
    };
    numRow.appendChild(b);
  });
  const manual = document.createElement('input');
  manual.className = 'num-input';
  manual.type = 'text'; manual.inputMode = 'numeric';
  manual.placeholder = '>'; manual.value = row.manual || '';
  manual.oninput = () => {
    const raw = manual.value.trim();
    groups[gi].rows[ri].value = raw === '' ? null : parseInt(raw, 10);
    groups[gi].rows[ri].manual = raw;
    numRow.querySelectorAll('.num-btn').forEach(x => x.classList.remove('selected'));
  };
  numRow.appendChild(manual);
  line.appendChild(numRow);

  // 配对的金额输入框（grid 第 3 列由 .amt-input width:100% 填满）
  if (row.amountKey) {
    const amt = document.createElement('input');
    amt.className = 'amt-input';
    amt.type = 'text'; amt.inputMode = 'decimal';
    amt.placeholder = row.amountPlaceholder;
    amt.value = row.amount || '';
    amt.oninput = () => { groups[gi].rows[ri].amount = amt.value; };
    line.appendChild(amt);
  }
  return line;
}

function setStatus(text, kind) {
  const s = document.getElementById('status');
  s.className = 'status' + (kind ? ' ' + kind : '');
  s.textContent = text || '';
}

function updateSubmitLabel() {
  document.getElementById('submitBtn').textContent = isEditing ? '保存修改' : '提交';
}

// ---------------------------------------------------------------------------
// 数据加载
// ---------------------------------------------------------------------------
async function checkSubmittedStores() {
  const date = document.getElementById('formDate').value;
  if (!date) return;
  try {
    const h = await authHeaders();
    const r = await fetch(`${SUPABASE_URL}/rest/v1/daily_reports?select=store_name&form_date=eq.${date}`, { headers: h });
    const d = await r.json();
    submittedStores = (d || []).map(x => x.store_name);
    renderStores();
  } catch (e) { /* 绿点失败不影响填报 */ }
}

async function reloadExisting() {
  const date = document.getElementById('formDate').value;
  if (!date || !selectedStore) {
    groups = buildGroups(); isEditing = false;
    renderGroups(); updateSubmitLabel(); setStatus('');
    return;
  }
  try {
    const h = await authHeaders();
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/daily_reports?form_date=eq.${date}&store_name=eq.${encodeURIComponent(selectedStore)}`,
      { headers: h }
    );
    const data = await r.json();
    if (data && data.length) {
      const rec = data[0];
      groups = buildGroups(rec);
      isEditing = true;
      document.getElementById('hasActivity').checked = (rec.has_activity === '是');
      document.getElementById('activityContent').value = rec.activity_content || '';
    } else {
      groups = buildGroups();
      isEditing = false;
      document.getElementById('hasActivity').checked = false;
      document.getElementById('activityContent').value = '';
    }
    syncActivityInput();
    renderGroups(); updateSubmitLabel();
  } catch (e) { /* 加载失败不影响填写 */ }
}

function syncActivityInput() {
  document.getElementById('activityContent').style.display =
    document.getElementById('hasActivity').checked ? 'block' : 'none';
}

// ---------------------------------------------------------------------------
// 提交
// ---------------------------------------------------------------------------
function collectValues() {
  const nums = {}, amounts = {};
  groups.forEach(g => g.rows.forEach(r => {
    nums[r.key] = r.value;
    if (r.amountKey) amounts[r.amountKey] = r.amount;
  }));
  return { nums, amounts };
}

async function submit() {
  const date = document.getElementById('formDate').value;
  const hasActivity = document.getElementById('hasActivity').checked;
  const activityContent = document.getElementById('activityContent').value;
  const btn = document.getElementById('submitBtn');

  if (!date) { setStatus('请选择填表日期', 'err'); return; }
  if (!selectedStore) { setStatus('请选择门店', 'err'); return; }

  // 数字必填
  for (const g of groups) {
    for (const r of g.rows) {
      if (r.value === null || r.value === undefined) { setStatus('请填写' + g.name + r.label, 'err'); return; }
    }
  }
  // 金额必填（无则填 0）
  for (const g of groups) {
    for (const r of g.rows) {
      if (r.amountKey && !r.amount) { setStatus('请填写' + r.amountHint + '（无则填 0）', 'err'); return; }
    }
  }
  if (hasActivity && !activityContent.trim()) { setStatus('请输入品项活动名称', 'err'); return; }

  const { nums, amounts } = collectValues();
  const payload = {
    form_date: date,
    store_name: selectedStore,
    meituan_visitors: nums.meituan_visitors,
    douyin_visitors: nums.douyin_visitors,
    meituan_unable_to_book: nums.meituan_unable_to_book,
    douyin_unable_to_book: nums.douyin_unable_to_book,
    meituan_inner_orders: nums.meituan_inner_orders,
    douyin_inner_orders: nums.douyin_inner_orders,
    meituan_inner_amount: parseFloat(amounts.meituan_inner_amount),
    douyin_inner_amount: parseFloat(amounts.douyin_inner_amount),
    meituan_verify_amount: parseFloat(amounts.meituan_verify_amount),
    douyin_verify_amount: parseFloat(amounts.douyin_verify_amount),
    has_activity: hasActivity ? '是' : '否',
    activity_content: hasActivity ? activityContent.trim() : null,
    updated_at: new Date().toISOString()
  };

  btn.disabled = true; setStatus('提交中…', '');
  try {
    const h = await authHeaders();
    const r = await fetch(`${SUPABASE_URL}/rest/v1/daily_reports?on_conflict=form_date,store_name`, {
      method: 'POST',
      headers: Object.assign({}, h, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
      body: JSON.stringify(payload)
    });
    if (r.ok || r.status === 201) {
      if (submittedStores.indexOf(selectedStore) < 0) submittedStores.push(selectedStore);
      renderStores();
      isEditing = true; updateSubmitLabel();
      setStatus('✓ 提交成功，当天可继续修改', 'ok');
    } else {
      const t = await r.text();
      setStatus('提交失败：' + t, 'err');
    }
  } catch (e) {
    setStatus('网络错误，请重试', 'err');
  }
  btn.disabled = false;
}

// ---------------------------------------------------------------------------
// 初始化
// ---------------------------------------------------------------------------
const dateEl = document.getElementById('formDate');
const b = dateBounds();
dateEl.min = b.minDate; dateEl.max = b.maxDate; dateEl.value = b.maxDate;
dateEl.addEventListener('change', () => {
  const v = dateEl.value;
  if (v > dateEl.max) { setStatus('不能选择未来日期', 'err'); dateEl.value = dateEl.max; return; }
  if (v < dateEl.min) { setStatus('更早的数据请联系运营修改', 'err'); dateEl.value = dateEl.min; return; }
  setStatus('');
  checkSubmittedStores();
  reloadExisting();
});

document.getElementById('hasActivity').addEventListener('change', syncActivityInput);
document.getElementById('submitBtn').addEventListener('click', submit);

renderStores();
renderGroups();
checkSubmittedStores();
loadStoresDynamic();   // 动态门店：异步以 stores 主表刷新按钮列表（失败保留硬编码）
if (selectedStore) reloadExisting();

// 从运营后台点进来的（index.html?from=ops）才显示返回入口，门店直接打开时看不到
(function () {
  try {
    if (new URLSearchParams(location.search).get('from') === 'ops') {
      var a = document.getElementById('backToOps');
      if (a) a.style.display = 'inline-block';
    }
  } catch (e) {}
})();
</script>
