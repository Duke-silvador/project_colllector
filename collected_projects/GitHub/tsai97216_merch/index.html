<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="description" content="CHI MERCH 收藏管理系統" />
    <title>CHI MERCH</title>
    <style>
      html, body { min-height: 100%; margin: 0; }
      body { background: #f4f6f8; }
      .boot-screen { box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; padding: 32px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17202a; }
      .boot-card { width: min(560px, 100%); box-sizing: border-box; padding: 32px; border: 1px solid #dce2e8; border-radius: 20px; background: #fff; box-shadow: 0 16px 48px rgba(23, 32, 42, .08); }
      .boot-eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #66717d; }
      .boot-card h1 { margin: 0 0 10px; font-size: 28px; }
      .boot-card p { margin: 0; line-height: 1.7; color: #66717d; }
      .boot-error { margin-top: 18px !important; padding: 14px 16px; border-radius: 12px; background: #f7e9e9; color: #8a3030 !important; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <noscript>
      <main class="boot-screen">
        <section class="boot-card">
          <p class="boot-eyebrow">CHI MERCH</p>
          <h1>需要啟用 JavaScript</h1>
          <p>此網站需要 JavaScript 才能載入收藏資料。</p>
        </section>
      </main>
    </noscript>
    <div id="app">
      <main class="boot-screen" aria-live="polite">
        <section class="boot-card">
          <p class="boot-eyebrow">CHI MERCH</p>
          <h1>正在啟動</h1>
          <p id="boot-message">正在載入收藏管理系統……</p>
        </section>
      </main>
    </div>
    <script>
      (() => {
        const message = document.getElementById('boot-message');
        const showError = (text) => {
          if (!message) return;
          message.className = 'boot-error';
          message.textContent = text;
        };
        window.setTimeout(() => {
          if (document.documentElement.dataset.chiMerchBooted !== 'true') {
            showError('網站啟動逾時。請重新整理頁面；若仍然空白，請檢查主程式載入狀態。');
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
