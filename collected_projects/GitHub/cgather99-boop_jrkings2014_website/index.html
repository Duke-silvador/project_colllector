<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jr Kings Fundraiser</title>
  <link rel="icon" href="Images/crown_logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
  <!-- Header, sidebar, and footer are filled in by app.js (shared across pages). -->
  <header id="site-header" class="site-header"></header>

  <div class="layout">
    <div class="left-col">
      <nav id="sidebar" class="sidebar" aria-label="Site navigation"></nav>
      <section id="sponsors-card" class="card sponsors-card" aria-labelledby="sponsors-title"></section>
    </div>

    <main class="content">
      <div id="error" class="error" hidden></div>

      <div class="home-grid">
        <div class="home-main">
          <figure id="team-photo" class="card team-photo" hidden>
            <img id="team-photo-img" src="" alt="">
            <figcaption id="team-photo-caption" hidden></figcaption>
          </figure>

          <section id="about" class="card about" aria-labelledby="about-title" hidden>
            <img id="about-logo" class="about-logo" src="" alt="" hidden>
            <div class="about-body">
              <h1 id="about-title"></h1>
              <div id="about-text"></div>
              <a id="about-link" class="btn btn-primary" href="#" target="_blank" rel="noopener" hidden></a>
            </div>
          </section>

          <section class="card order-events" aria-labelledby="events-title">
            <h2 id="events-title">Upcoming Events</h2>
            <ul id="events" class="event-list"></ul>
            <a class="link-cta" href="schedule.html">Full schedule →</a>
          </section>
        </div>

        <div class="home-aside">
          <section id="donate" class="card card-donate order-donate" aria-labelledby="donate-title">
            <h2 id="donate-title">Donate Now</h2>
            <p class="muted">Every dollar helps our players stay on the ice. Choose your favorite way to give:</p>
            <div id="donate-links" class="donate-links"></div>
          </section>

          <section class="card order-activity" aria-labelledby="activity-title">
            <h2 id="activity-title">Recent Activity</h2>
            <ul id="activity" class="activity-list"></ul>
          </section>
        </div>
      </div>
    </main>
  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="app.js"></script>
</body>
</html>
