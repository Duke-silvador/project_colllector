<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Bloodlines: The Vane Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&family=Courier+Prime:wght@400;700&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: a full-window browser (tab strip, omnibox, bookmarks) showing three real-looking sites:
   a consumer genealogy site, a law firm's webmail, and the firm's intranet with matter management.
   Deliberately single (light) theme: these are imitations of real light-themed websites. */
:root{
  color-scheme:light;
  /* browser chrome */
  --cr-strip:#dfe3e8; --cr-tab:#ffffff; --cr-ink:#1f1f1f; --cr-muted:#5f6368; --cr-omni:#eef1f4; --cr-line:#d2d6db;
  /* bloodlines brand */
  --bl-brand:#7a1f33; --bl-brand-2:#5c1626; --bl-brand-soft:#f6e7ea; --bl-ink:#22191c; --bl-muted:#6b6064; --bl-line:#e3dcde;
  --bl-bg:#f7f5f3; --bl-surface:#ffffff; --bl-canvas:#eceae6; --bl-link:#2c5d8f; --bl-leaf:#b8324d; --bl-ok:#3d7a57;
  /* mail */
  --ml-brand:#1f4e79; --ml-ink:#202124; --ml-muted:#5f6368; --ml-line:#e3e6ea; --ml-sel:#e7f0fa; --ml-bg:#f4f6f8;
  /* intranet */
  --nt-brand:#22303c; --nt-accent:#b07d2b; --nt-ink:#1d252c; --nt-muted:#5c6670; --nt-line:#dde2e6; --nt-bg:#f3f4f5; --nt-link:#205e8c;
  --good:#2f6b4f; --good-soft:#e3f0e8; --bad:#a3361f; --bad-soft:#f8e5df; --warn:#8a5a00; --warn-soft:#f8eed8;
  --doc:#efe6d0; --doc-ink:#3a2e20; --doc-line:#cbbb98;
  --f-bl-d:"Young Serif", Georgia, serif; --f-bl:"Figtree", system-ui, sans-serif;
  --f-ml:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-nt:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --f-nt-d:"IBM Plex Serif", Georgia, serif;
  --f-doc:"Courier Prime", "Courier New", monospace; --f-sig:"Mrs Saint Delafield", "Brush Script MT", cursive;
  --f-cr: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html,body{height:100%}
body{background:var(--cr-strip);color:var(--cr-ink);font:14px/1.5 var(--f-cr);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #1a73e8;outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{height:100%;display:flex;flex-direction:column}

/* ============ BROWSER CHROME ============ */
.strip{display:flex;align-items:flex-end;gap:0;padding:8px 8px 0;background:var(--cr-strip);min-height:42px;overflow:hidden}
.ctab{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;width:240px;min-width:0;flex:0 1 240px;border-radius:9px 9px 0 0;font-size:12.5px;color:var(--cr-ink);text-align:left}
.ctab:not(.on):hover{background:rgba(255,255,255,.45)}
.ctab.on{background:var(--cr-tab)}
.ctab:not(.on)+.ctab:not(.on)::before{content:"";position:absolute;left:0;top:9px;bottom:9px;border-left:1px solid #b9bec5}
.ctab .fav{width:16px;height:16px;flex:none;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.ctab .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctab .x{width:16px;height:16px;color:var(--cr-muted);opacity:.7}
.ctab .dot{width:8px;height:8px;border-radius:50%;background:#1a73e8;flex:none}
.newtab{width:28px;height:28px;margin:0 0 4px 4px;border-radius:50%;display:grid;place-items:center;color:var(--cr-muted);flex:none}
.toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--cr-tab)}
.tbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--cr-muted);flex:none}
.tbtn:hover:not(:disabled){background:#f1f3f4}
.tbtn:disabled{opacity:.35;cursor:default}
.omni{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:var(--cr-omni);font-size:14px;color:var(--cr-ink)}
.omni .lock{color:var(--cr-muted);width:15px;height:15px}
.omni .url{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omni .url b{font-weight:400;color:var(--cr-ink)}.omni .url span{color:var(--cr-muted)}
.prof{width:28px;height:28px;border-radius:50%;background:#7a5c9e;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none;margin-left:4px}
.bookmarks{display:flex;gap:2px;padding:2px 10px 5px;background:var(--cr-tab);border-bottom:1px solid var(--cr-line);overflow:hidden}
.bm{display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:12px;font-size:12px;color:var(--cr-ink);white-space:nowrap}
.bm:hover{background:#f1f3f4}
.bm .fav{width:14px;height:14px;border-radius:3px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.viewport{flex:1;min-height:0;overflow:auto;background:#fff;position:relative}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#202124;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:60;max-width:calc(100% - 32px)}

/* ============ BLOODLINES ============ */
.bl{font-family:var(--f-bl);color:var(--bl-ink);background:var(--bl-bg);min-height:100%;display:flex;flex-direction:column;font-size:15px}
.bl a,.bl .lnk{color:var(--bl-link);text-decoration:none;font-weight:500}
.bl .lnk:hover,.bl a:hover{text-decoration:underline}
.promo{background:var(--bl-brand-2);color:#fff;text-align:center;font-size:13px;padding:7px 16px}
.promo u{text-underline-offset:3px;cursor:pointer}
.blbar{background:var(--bl-surface);border-bottom:1px solid var(--bl-line);display:flex;align-items:center;gap:20px;padding:0 24px;height:62px;position:sticky;top:0;z-index:5}
.bl-logo{display:flex;align-items:center;gap:7px;font-family:var(--f-bl-d);font-size:23px;color:var(--bl-brand);letter-spacing:-.01em}
.bl-logo svg{width:17px;height:22px}
.blnav{display:flex;height:100%}
.blnav button{height:100%;padding:0 13px;font-size:15px;font-weight:500;color:var(--bl-ink);display:flex;align-items:center;gap:5px;border-bottom:3px solid transparent}
.blnav button:hover{color:var(--bl-brand)}
.blnav button.on{border-bottom-color:var(--bl-brand);color:var(--bl-brand)}
.blnav .cnt{background:var(--bl-leaf);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:0 6px;line-height:17px}
.blright{margin-left:auto;display:flex;align-items:center;gap:6px}
.icobtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--bl-ink);position:relative}
.icobtn:hover{background:var(--bl-bg)}
.icobtn .pip{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--bl-leaf);border:2px solid #fff}
.acct{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:22px;font-size:13.5px;font-weight:600}
.acct .av{width:32px;height:32px;border-radius:50%;background:var(--bl-brand-soft);color:var(--bl-brand);display:grid;place-items:center;font-size:12px;font-weight:700}
.burger{display:none}
.blmain{flex:1;width:100%}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:24px}
.crumbs{font-size:13px;color:var(--bl-muted);padding-block:16px 4px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs .lnk{font-weight:500}
.bl h1{font-family:var(--f-bl-d);font-weight:400;font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
.bl h2{font-family:var(--f-bl);font-weight:700;font-size:19px;margin:0}
.bl h3{font-size:15px;font-weight:700;margin:0}
.bl .muted{color:var(--bl-muted)}
.bbtn{display:inline-flex;align-items:center;gap:7px;background:var(--bl-brand);color:#fff;border-radius:22px;padding:9px 18px;font-weight:600;font-size:14.5px;border:1.5px solid var(--bl-brand)}
.bbtn:hover{background:var(--bl-brand-2)}
.bbtn.sec{background:#fff;color:var(--bl-brand)}
.bbtn.sec:hover{background:var(--bl-brand-soft)}
.bbtn.sm{padding:5px 13px;font-size:13.5px}
.bbtn.done{background:var(--bl-ok);border-color:var(--bl-ok)}
.bbtn:disabled{opacity:.5;cursor:default}
.panel{background:var(--bl-surface);border:1px solid var(--bl-line);border-radius:8px;min-width:0}
.panel>.ph{padding:14px 18px;border-bottom:1px solid var(--bl-line);display:flex;align-items:center;gap:10px}
.panel>.pb{padding:16px 18px}
.cookie{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:760px;margin-inline:auto;background:#fff;border:1px solid var(--bl-line);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;z-index:40;font:14px/1.45 var(--f-bl);color:var(--bl-ink)}
.cookie p{margin:0;flex:1;min-width:240px}
.blfoot{background:#2a2124;color:#d8cfd2;margin-top:48px;font-size:13.5px}
.blfoot .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:24px;padding-block:36px 24px}
.blfoot h4{color:#fff;font-size:13px;margin:0 0 10px;letter-spacing:.04em}
.blfoot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.blfoot .legal{border-top:1px solid #4a3d41;padding-block:16px 24px;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:#b3a7ab}

/* home */
.hero{background:linear-gradient(180deg,#fff, var(--bl-bg));border-bottom:1px solid var(--bl-line)}
.hero .wrap{padding-block:30px 26px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hero .greet{flex:1;min-width:260px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px;padding-block:24px}
.tile{display:flex;flex-direction:column;gap:10px}
.tile .tiny{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--bl-muted)}
.qsearch{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--bl-line);border-radius:30px;padding:6px 6px 6px 18px;align-items:center;max-width:560px;width:100%}
.qsearch input{flex:1;min-width:120px;border:0;outline:0;background:transparent;font-size:15px}
.feed{display:flex;flex-direction:column}
.feed .row{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--bl-line);align-items:flex-start}
.feed .row:first-child{border-top:0}

/* tree */
.treebar{background:#fff;border-bottom:1px solid var(--bl-line)}
.treebar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.treename{font-family:var(--f-bl-d);font-size:20px;display:flex;align-items:center;gap:6px}
.seg{display:flex;border:1px solid var(--bl-line);border-radius:18px;overflow:hidden}
.seg button{padding:5px 13px;font-size:13.5px;font-weight:600;color:var(--bl-muted)}
.seg button.on{background:var(--bl-ink);color:#fff}
.tree-tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tsearch{border:1px solid var(--bl-line);border-radius:18px;padding:6px 12px;font-size:13.5px;width:180px;background:#fff}
.canvas-wrap{position:relative;background:var(--bl-canvas);background-image:radial-gradient(#d6d2cc 1px,transparent 1px);background-size:18px 18px;overflow:auto;height:min(640px,calc(100vh - 230px));min-height:420px}
.canvas{position:relative;width:940px;height:590px;margin:0 auto}
.canvas svg.lines{position:absolute;inset:0;width:100%;height:100%}
.canvas svg.lines path{fill:none;stroke:#8f8a84;stroke-width:1.6}
.canvas svg.lines path.dash{stroke-dasharray:5 4;stroke:#b07d2b}
.tnode{position:absolute;width:200px;height:74px;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.18);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;text-align:left;border:2px solid transparent;overflow:hidden}
.tnode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#6f8fb0}
.tnode.f::before{background:#b07a8c}
.tnode.u::before{background:#bbb}
.tnode:hover{border-color:#b9b2aa}
.tnode.sel{border-color:var(--bl-brand)}
.tnode.dis{border:2px dashed #b07d2b;background:#fffaf0}
.tnode .ava{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;background:#e9e4df;display:grid;place-items:center;font-weight:700;color:#8b7f78;font-size:15px}
.tnode .ava svg{width:100%;height:100%;display:block}
.tnode b{display:block;font-size:13.5px;line-height:1.25}
.tnode small{color:var(--bl-muted);font-size:12px;font-variant-numeric:tabular-nums}
.tnode .leaf{position:absolute;top:5px;right:6px;width:13px;height:16px;color:var(--bl-leaf)}
.tnode .flag{position:absolute;bottom:4px;right:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a5a00}
.claimlbl{position:absolute;font-size:11.5px;color:#8a5a00;background:var(--bl-canvas);padding:0 4px;font-style:italic}
.zoomctl{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);overflow:hidden}
.zoomctl button{width:36px;height:36px;display:grid;place-items:center;border-bottom:1px solid var(--bl-line)}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(340px,100%);background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:3}
.drawer .dh{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--bl-line);align-items:center}
.drawer .dh .ava{width:64px;height:64px;border-radius:50%;overflow:hidden;background:#e9e4df;display:grid;place-items:center;font-weight:700;color:#8b7f78;flex:none}
.drawer .dh .ava svg{width:100%;height:100%;display:block}
.drawer .db{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--bl-muted)}.kv dd{margin:0}

/* person */
.phead{background:#fff;border-bottom:1px solid var(--bl-line)}
.phead .wrap{display:flex;gap:20px;align-items:center;padding-block:20px 0;flex-wrap:wrap}
.phead .big{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#e9e4df;display:grid;place-items:center;font:700 26px var(--f-bl);color:#8b7f78;flex:none}
.phead .big svg{width:100%;height:100%;display:block}
.ptabs{display:flex;gap:4px;width:100%;margin-top:10px}
.ptabs button{padding:10px 14px;font-weight:600;color:var(--bl-muted);border-bottom:3px solid transparent}
.ptabs button.on{color:var(--bl-ink);border-bottom-color:var(--bl-brand)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding-block:22px;align-items:start}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--bl-line)}
.timeline li:first-child{border-top:0}
.timeline .yr{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.timeline .ev{font-weight:700}
.famlist{display:flex;flex-direction:column;gap:2px}
.fam{display:flex;gap:10px;align-items:center;padding:7px 6px;border-radius:6px;text-align:left;width:100%}
.fam:hover{background:var(--bl-bg)}
.fam .ava{width:34px;height:34px;border-radius:50%;background:#e9e4df;display:grid;place-items:center;font-size:12px;font-weight:700;color:#8b7f78;overflow:hidden;flex:none}
.fam .ava svg{width:100%;height:100%;display:block}
.fam small{display:block;color:var(--bl-muted);font-size:12px}
.srclist{list-style:none;margin:0;padding:0}
.srclist li{border-top:1px solid var(--bl-line)}
.srclist li:first-child{border-top:0}
.srcrow{display:flex;gap:12px;padding:11px 0;align-items:center;width:100%;text-align:left}
.srcrow .ic{width:38px;height:46px;flex:none;background:var(--doc);border:1px solid var(--doc-line);border-radius:3px;display:grid;place-items:center;font:700 9px var(--f-doc);color:var(--doc-ink);overflow:hidden}
.srcrow .ic svg{width:100%;height:100%;display:block}
.srcrow .t{flex:1;min-width:0}
.srcrow .t b{display:block;font-size:14.5px;color:var(--bl-link);font-weight:600}
.srcrow .t small{color:var(--bl-muted);font-size:12.5px}
.saved{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--bl-ok);text-transform:uppercase;white-space:nowrap}

/* record page */
.rechead{padding-block:6px 18px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.rechead>div{flex:1;min-width:260px}
.recgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.viewer{background:#2b2a29;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.vtool{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#3a3836;color:#e8e3de;font-size:12.5px}
.vtool button{width:32px;height:30px;border-radius:5px;display:grid;place-items:center;color:#e8e3de}
.vtool button:hover{background:#4c4946}
.vtool .sp{flex:1}
.vstage{padding:22px;overflow:auto;max-height:640px;display:flex;justify-content:center}
.vinner{transform-origin:top center;transition:transform .15s;width:100%;max-width:640px}
.idx{width:100%;border-collapse:collapse;font-size:14.5px}
.idx th{text-align:left;font-weight:500;color:var(--bl-muted);padding:8px 14px 8px 0;vertical-align:top;width:42%;border-top:1px solid var(--bl-line)}
.idx td{padding:8px 0;border-top:1px solid var(--bl-line);font-weight:600}
.idx tr:first-child th,.idx tr:first-child td{border-top:0}
.cite{font-size:13px;color:var(--bl-muted);background:var(--bl-bg);border-radius:6px;padding:12px 14px;line-height:1.5}
.sugg{display:flex;flex-direction:column}
.side{display:flex;flex-direction:column;gap:16px}

/* search */
.sgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start;padding-block:12px 0}
.sform{display:flex;flex-direction:column;gap:12px}
.sform label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.sform input,.sform select{border:1px solid #c9c1c4;border-radius:6px;padding:9px 11px;font-size:14.5px;background:#fff;font-weight:400}
.facets{display:flex;flex-direction:column;gap:2px;font-size:14px}
.facets button{display:flex;justify-content:space-between;padding:5px 8px;border-radius:5px;text-align:left;color:var(--bl-link)}
.facets button.on{background:var(--bl-brand-soft);color:var(--bl-brand);font-weight:700}
.facets button span{color:var(--bl-muted);font-variant-numeric:tabular-nums}
.rtable-wrap{overflow-x:auto}
.rtable{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
.rtable th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--bl-muted);padding:10px 12px;border-bottom:2px solid var(--bl-line);background:#fbfaf9}
.rtable td{padding:12px;border-bottom:1px solid var(--bl-line);vertical-align:top}
.rtable tr:hover td{background:#fbf8f7}
.rtable .nm{font-weight:700;color:var(--bl-link)}
.rtable small{display:block;color:var(--bl-muted)}
.callout{border-left:4px solid #b07d2b;background:#fdf6e6;padding:12px 16px;border-radius:0 6px 6px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.callout p{margin:0;flex:1;min-width:220px}

/* dna */
.dnahero{background:linear-gradient(120deg,#3b1520,#7a1f33);color:#fff}
.dnahero .wrap{padding-block:24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dnahero h1{color:#fff}
.dnahero select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:7px 14px;font-weight:600}
.dnahero select option{color:#222}
.mrow{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--bl-line);flex-wrap:wrap}
.mrow:first-child{border-top:0}
.mrow .ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.mrow .who{flex:1;min-width:160px}
.mrow .who b{display:block}
.mrow .who small{color:var(--bl-muted)}
.mrow .cm{text-align:right;min-width:110px}
.mrow .cm b{display:block;font-variant-numeric:tabular-nums}
.mrow .cm small{color:var(--bl-muted)}
.side-tag{font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 7px;background:#eef2f6;color:#3c5a78}
.side-tag.marsh{background:#f6eedd;color:#7a5410}
.labnote{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:14px 16px}
.labnote b{color:var(--bad)}
.ethrow{display:grid;grid-template-columns:1fr 46px;gap:4px 10px;font-size:14px;align-items:center}
.bar{grid-column:1/-1;height:7px;background:#ece6e3;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bl-brand)}
.bar i.odd{background:#c48a1a}
.cmtable{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.cmtable th{text-align:left;font-size:12px;font-weight:700;color:var(--bl-muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--bl-line)}
.cmtable td{padding:8px;border-bottom:1px solid var(--bl-line);font-variant-numeric:tabular-nums}
.cmtable .n{text-align:right}

/* hints */
.hrow{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--bl-line);align-items:flex-start;flex-wrap:wrap}
.hrow:first-child{border-top:0}
.hrow .leafbig{width:22px;height:28px;color:var(--bl-leaf);flex:none;margin-top:2px}
.hrow .hb{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}

/* ============ DOCUMENT RENDERING (shared) ============ */
.doc{background:var(--doc);color:var(--doc-ink);font-family:var(--f-doc);font-size:14px;line-height:1.55;padding:22px 24px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--doc-line),inset 0 0 40px rgba(120,90,40,.18);display:flex;flex-direction:column;gap:12px}
.doc h4{font-family:var(--f-doc);font-weight:700;text-align:center;letter-spacing:.14em;text-transform:uppercase;font-size:14px;margin:0}
.doc .c{text-align:center;font-size:12.5px}
.doc dl,.licence dl{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:4px 16px;margin:0}
.doc dt,.licence dt{opacity:.75}.doc dd,.licence dd{margin:0;font-weight:700}
.doc .rn{border-top:1px dashed var(--doc-line);padding-top:10px;font-size:13px;font-style:italic}
.doc p{margin:0}
.doctable-wrap{overflow-x:auto}
.doctable{border-collapse:collapse;font-size:13px;min-width:520px;width:100%}
.doctable th,.doctable td{border:1px solid var(--doc-line);padding:5px 7px;text-align:left}
.doctable th{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.sig{width:170px;height:54px;display:block}
.sig text{font-family:var(--f-sig);font-size:34px;fill:#1f2a4a}
.sig path{stroke:#1f2a4a;fill:none;stroke-width:1.4;stroke-linecap:round}
.sigline{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sigline span{font-size:12px;opacity:.8}
.photo{display:flex;flex-direction:column;align-items:center;gap:12px}
.photo>svg{width:260px;max-width:100%;height:auto;border:10px solid #f3eadb;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.photo>svg.wide{width:480px}
.photo .doc{max-width:480px}
.licence{display:flex;gap:16px;flex-wrap:wrap;background:var(--doc);border-radius:10px;padding:14px;box-shadow:inset 0 0 0 1px var(--doc-line);color:var(--doc-ink);font-family:var(--f-doc)}
.licence .ph svg{width:120px;height:auto;display:block;border-radius:4px}
.licence .f{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.licence .hd{font-weight:700;letter-spacing:.12em;font-size:12px;border-bottom:1px solid var(--doc-line);padding-bottom:4px}
.letter{background:#fff;color:#222;border:1px solid #ddd;padding:26px 28px;border-radius:3px;font:15px/1.6 Georgia,serif;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.letter p{margin:0}
.letter .hand{font-family:var(--f-sig);font-size:36px;line-height:1;color:#1f2a4a}
.clip{background:var(--doc);color:var(--doc-ink);font-family:Georgia,"Times New Roman",serif;padding:20px 22px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--doc-line),inset 0 0 40px rgba(120,90,40,.2);display:flex;flex-direction:column;gap:10px}
.clip .mast{font-family:var(--f-doc);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid var(--doc-ink);padding-bottom:6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.clip h4{font-family:Georgia,serif;font-size:21px;line-height:1.2;margin:0}
.clip p{margin:0;font-size:14.5px;line-height:1.55}
.clip svg{width:220px;max-width:100%;height:auto;align-self:center}
.diary{background:#f4ecd8;color:#2c2418;font-family:var(--f-sig);font-size:30px;line-height:1.25;padding:24px 26px;border-radius:3px;box-shadow:inset 0 0 0 1px #cbb98f;display:flex;flex-direction:column;gap:6px}
.diary small{font-family:var(--f-doc);font-size:12px}
.alert{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.alert b{color:var(--bad)}
.sub{color:var(--bl-muted);margin:0}
.lab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.lab>svg{width:100%;height:auto}

/* ============ DOC PREVIEW MODAL ============ */
.modal{position:fixed;inset:0;background:rgba(20,20,22,.7);display:flex;align-items:flex-start;justify-content:center;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 28px;overflow:auto;z-index:50}
.pv{background:#fff;border-radius:10px;max-width:780px;width:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);font-family:var(--f-nt)}
.pv .pvh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--nt-line);flex-wrap:wrap}
.pv .pvh .fi{width:34px;height:40px;border-radius:4px;background:#c0392b;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.pv .pvh .t{flex:1;min-width:180px}
.pv .pvh .t b{display:block;font-size:14.5px}
.pv .pvh .t small{color:var(--nt-muted);font-size:12.5px}
.pv .pvb{padding:20px;background:#525659}
.pv .pvb > *{max-width:640px;margin-inline:auto}
.pv .pvb.light{background:#f3f4f5}

/* ============ MAIL ============ */
.ml{font-family:var(--f-ml);color:var(--ml-ink);height:100%;display:flex;flex-direction:column;background:var(--ml-bg);font-size:15px}
.mltop{background:var(--ml-brand);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;height:50px;flex:none}
.mltop .brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mltop .brand i{width:26px;height:26px;border-radius:5px;background:#fff;color:var(--ml-brand);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.mlsearch{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:6px;padding:7px 12px;color:#dfe8f2;font-size:14px}
.mltop .me{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#e8a33d;color:#1d1d1d;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.mlbody{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(280px,380px) minmax(0,1fr)}
.folders{padding:12px 8px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--ml-line)}
.compose{display:flex;align-items:center;gap:8px;background:var(--ml-brand);color:#fff;border-radius:6px;padding:9px 14px;font-weight:600;margin:0 4px 12px;opacity:.85}
.fold{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:6px;font-size:14.5px;color:var(--ml-ink)}
.fold.on{background:var(--ml-sel);font-weight:700;color:var(--ml-brand)}
.fold .n{margin-left:auto;font-size:13px;font-weight:700}
.mlist{background:#fff;border-right:1px solid var(--ml-line);overflow:auto;min-width:0}
.mlist .lh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ml-line);font-weight:700;position:sticky;top:0;background:#fff;z-index:1}
.mrowm{display:grid;grid-template-columns:36px 1fr auto;gap:2px 10px;width:100%;text-align:left;padding:11px 14px 11px 12px;border-bottom:1px solid var(--ml-line);border-left:3px solid transparent}
.mrowm:hover{background:#f7f9fb}
.mrowm.on{background:var(--ml-sel);border-left-color:var(--ml-brand)}
.mrowm .av{grid-row:1/4;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.mrowm .fr{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrowm .tm{font-size:12.5px;color:var(--ml-muted);white-space:nowrap}
.mrowm .sj{grid-column:2/4;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrowm .sn{grid-column:2/4;font-size:13px;color:var(--ml-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrowm.unread .fr,.mrowm.unread .sj{font-weight:700}
.mrowm.unread .tm{color:var(--ml-brand);font-weight:700}
.mrowm.lock{opacity:.6}
.rpane{overflow:auto;background:#fff;min-width:0}
.rpane .in{padding:22px 28px 40px;max-width:820px}
.rpane h1{font-size:22px;font-weight:600;margin:0 0 16px;line-height:1.3}
.rmeta{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.rmeta .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.rmeta .who{flex:1;min-width:0}
.rmeta .who b{display:block}
.rmeta .who small{color:var(--ml-muted)}
.racts{display:flex;gap:6px;flex-wrap:wrap}
.racts button{display:flex;gap:6px;align-items:center;border:1px solid var(--ml-line);border-radius:5px;padding:5px 11px;font-size:13.5px;color:var(--ml-ink)}
.racts button:disabled{opacity:.55;cursor:default}
.rtext{display:flex;flex-direction:column;gap:12px;font-size:15.5px;line-height:1.6;max-width:68ch}
.rtext p{margin:0}
.assets{border-collapse:collapse;font-size:14.5px;width:100%;max-width:520px}
.assets td{padding:5px 0;border-bottom:1px dashed var(--ml-line)}
.assets td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.attach{display:flex;gap:12px;align-items:center;border:1px solid var(--ml-line);border-radius:8px;padding:10px 14px;max-width:360px;text-align:left;width:100%;margin-top:18px}
.attach:hover{background:#f7f9fb}
.attach .fi{width:32px;height:38px;border-radius:4px;background:#c0392b;color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;flex:none}
.attach b{display:block;font-size:14px}.attach small{color:var(--ml-muted)}
.mlback{display:none}
.mlbtn{background:var(--ml-brand);color:#fff;border-radius:5px;padding:8px 14px;font-weight:600}
.mlbtn.ghost{background:#fff;color:var(--ml-brand);border:1px solid var(--ml-brand)}
.endcard{margin-top:28px;background:#1d1a1c;color:#f0eaec;border-radius:10px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.endcard .g{font-family:var(--f-bl-d);font-size:46px;line-height:1}
.endcard p{margin:0;opacity:.88}

/* ============ INTRANET ============ */
.nt{font-family:var(--f-nt);color:var(--nt-ink);background:var(--nt-bg);min-height:100%;display:flex;flex-direction:column;font-size:14.5px}
.nt a,.nt .lnk{color:var(--nt-link);text-decoration:none}
.nt .lnk:hover{text-decoration:underline}
.nttop{background:var(--nt-brand);color:#e9edf0;display:flex;align-items:center;gap:22px;padding:0 22px;height:54px;flex:none}
.crest{display:flex;align-items:center;gap:10px;font-family:var(--f-nt-d);font-size:16px;color:#fff;white-space:nowrap}
.crest i{width:30px;height:30px;border:1.5px solid var(--nt-accent);color:var(--nt-accent);display:grid;place-items:center;font-style:normal;font-size:12px;font-family:var(--f-nt-d)}
.ntnav{display:flex;gap:2px;height:100%}
.ntnav button{padding:0 12px;height:100%;color:#c7d0d7;font-size:14px;border-bottom:3px solid transparent}
.ntnav button.on{color:#fff;border-bottom-color:var(--nt-accent)}
.ntnav button:disabled{opacity:.5;cursor:default}
.nttop .user{margin-left:auto;font-size:13px;color:#b9c3cb;white-space:nowrap}
.ntmain{flex:1;width:100%;max-width:1240px;margin-inline:auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:18px}
.nt h1{font-family:var(--f-nt-d);font-weight:500;font-size:26px;margin:0;line-height:1.25}
.nt h2{font-size:17px;font-weight:600;margin:0}
.nt h3{font-size:15px;font-weight:600;margin:0}
.mhd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.mhd>div{flex:1;min-width:260px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:2px 10px;font-size:12.5px;font-weight:600;background:#e6eef5;color:#2d5677}
.pill.amber{background:#f6ead2;color:#7d5410}
.pill.green{background:var(--good-soft);color:var(--good)}
.pill.red{background:var(--bad-soft);color:var(--bad)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--nt-line);border:1px solid var(--nt-line);border-radius:6px;overflow:hidden}
.meta div{background:#fff;padding:10px 14px}
.meta small{display:block;color:var(--nt-muted);font-size:12px}
.meta b{font-weight:600}
.mtabs{display:flex;gap:0;border-bottom:1px solid var(--nt-line);overflow-x:auto}
.mtabs button{padding:10px 16px;font-size:14px;font-weight:500;color:var(--nt-muted);border-bottom:2px solid transparent;white-space:nowrap}
.mtabs button.on{color:var(--nt-ink);border-bottom-color:var(--nt-accent);font-weight:600}
.box{background:#fff;border:1px solid var(--nt-line);border-radius:6px;min-width:0}
.box>.bh{padding:12px 16px;border-bottom:1px solid var(--nt-line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.box>.bh h2{flex:1}
.box>.bb{padding:14px 16px}
.cols2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.ttable-wrap{overflow-x:auto}
.ttable{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.ttable th{text-align:left;font-size:12px;font-weight:600;color:var(--nt-muted);padding:8px 12px;border-bottom:1px solid var(--nt-line);background:#f8f9fa;text-transform:uppercase;letter-spacing:.04em}
.ttable td{padding:9px 12px;border-bottom:1px solid var(--nt-line);vertical-align:middle}
.ttable td.num{text-align:right;font-variant-numeric:tabular-nums}
.ttable .th{width:44px;height:34px;border-radius:3px;overflow:hidden;background:var(--doc);display:grid;place-items:center;font:700 8px var(--f-doc);color:var(--doc-ink)}
.ttable .th svg{width:100%;height:100%;display:block}
.nbtn{display:inline-flex;align-items:center;gap:6px;background:var(--nt-brand);color:#fff;border-radius:4px;padding:7px 14px;font-weight:500;font-size:14px}
.nbtn.sec{background:#fff;color:var(--nt-ink);border:1px solid #c5ccd2}
.nbtn.sm{padding:4px 10px;font-size:13px}
.nbtn:disabled{opacity:.5;cursor:default}
.log{list-style:none;margin:0;padding:0;font-size:13.5px}
.log li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--nt-line)}
.log li:first-child{border-top:0}
.log time{color:var(--nt-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lawlayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
.toc{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.toc button{text-align:left;padding:6px 10px;border-radius:4px;color:var(--nt-link)}
.toc button:hover{background:#e8edf1}
.toc .h{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--nt-muted);padding:10px 10px 4px}
.article{background:#fff;border:1px solid var(--nt-line);border-radius:6px;padding:18px 22px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:12px}
.article .cite{font:600 12.5px var(--f-nt);color:var(--nt-accent);letter-spacing:.04em;background:none;padding:0}
.article h3{font-family:var(--f-nt-d);font-size:19px;font-weight:500}
.article p{margin:0;max-width:72ch;line-height:1.6}
.ahd{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ahd>div{flex:1;min-width:200px}
.finding{border:1px solid var(--nt-line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;background:#fff;margin:0}
.finding.ok{border-color:var(--good);background:#f5faf7}
.finding.no{border-color:var(--bad)}
.fhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fhead .n{font-weight:600;font-size:12px;color:var(--nt-accent);letter-spacing:.06em}
.fhead legend{flex:1;min-width:200px;font-weight:600;font-size:15.5px;padding:0;float:left}
.nudge{font-size:13.5px;color:var(--bad);margin:0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--nt-line);border-radius:5px;padding:8px 12px;cursor:pointer;font-size:14px}
.opt:has(input:checked){border-color:var(--nt-brand);background:#eef2f5}
.opt input{margin-top:3px;accent-color:var(--nt-brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #c5ccd2;background:#fff;border-radius:14px;padding:3px 10px;font-size:12.5px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--nt-brand);background:var(--nt-brand);color:#fff}
.chip:disabled{cursor:default;opacity:.8}
.attempts{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--nt-muted)}
.attempts i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--nt-muted);display:block}
.attempts i.used{background:var(--nt-muted)}
.verdict{border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--good-soft);border:1px solid var(--good)}
.verdict.no{background:var(--bad-soft);border:1px solid var(--bad)}
.verdict p{margin:0}
.labpane{display:flex;flex-direction:column;gap:10px;min-width:0}
.labpane select{border:1px solid #c5ccd2;background:#fff;border-radius:4px;padding:7px 10px;width:100%}
.labpane svg{width:100%;max-width:300px;height:auto;display:block;cursor:crosshair;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.labpane svg.wide{max-width:520px}
.markc{fill:none;stroke:#e0263f;stroke-width:1.6}
.marklist{font-size:13.5px;color:var(--nt-muted);margin:0;padding-left:18px}
.empty{border:1px dashed #c5ccd2;border-radius:6px;padding:20px;text-align:center;color:var(--nt-muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px}
textarea#notes{width:100%;min-height:240px;border:1px solid #c5ccd2;border-radius:4px;padding:12px;font:14px/1.55 var(--f-doc);resize:vertical;background:#fffef9}

/* ============ RESPONSIVE ============ */
@media (max-width:980px){
  .two,.recgrid,.cols2{grid-template-columns:1fr}
  .sgrid{grid-template-columns:1fr}
  .lawlayout{grid-template-columns:1fr}
  .toc{position:static;flex-direction:row;flex-wrap:wrap}
  .toc .h{display:none}
  .mlbody{grid-template-columns:minmax(260px,340px) minmax(0,1fr)}
  .folders{display:none}
}
@media (max-width:760px){
  .bookmarks{display:none}
  .ctab{flex-basis:140px;padding:0 8px}
  .ctab .x{display:none}
  .tbtn.fwd,.tbtn.rel{display:none}
  .blbar{padding:0 12px;gap:8px;height:56px}
  .burger{display:grid}

function faceG(o, dx=0){
  const c = TONES[o.tone], jaw = o.jaw||24;

const VAMP = {scar:true,mole:true,hair:'part',era:'victorian'};
function photo(p, attrs=''){
  const w = 120*p.faces.length, c = TONES[p.faces[0].tone], id='g'+(gN++), hid='h'+(gN++);

  {id:'lawSA',cite:'Succession Act 1919 · ss 12, 49',title:'Presumption of death; intestacy',body:[
    's 12. Where a person is lost at sea and the body is not recovered, a death may be registered on the report of a reliable witness. A registration is evidence of death. It is not proof of it.',
    's 49. Where a person dies without a valid will, the estate passes to the spouse; if none, to the children; if none, to the grandchildren; if none, to the parents; if none, to the siblings and their issue, and so on outward.',
    's 51. No person takes under a will or on intestacy from a death they procured.']},
  {id:'lawA1',cite:'Nocturnal Accord 1888 · Art. 1',title:'Continuity of the person',body:[
    '1. A person who is turned remains the same legal person after turning. Their property remains theirs.',
    '2. No inheritance arises from a death that has not occurred. A turned person who is registered as dead is not dead for the purposes of succession.']},
  {id:'lawA2',cite:'Nocturnal Accord 1888 · Art. 2',title:'Proof of identity across names',body:[
    '1. Where it is alleged that two or more named persons are one turned person, the allegation is proved by three independent identifying documents showing the same person across more than one century.',
    '2. A photograph counts as an identifying document only where a permanent mark can be seen on it. A certified photo-lab comparison counts as one document.']},
  {id:'lawA3',cite:'Nocturnal Accord 1888 · Art. 3',title:'Issue',body:[
    '1. The turned do not beget children. No person born more than forty weeks after a man\'s turning may be his issue.',
    '2. A child born within forty weeks after the turning is deemed begotten before it, and is the issue of the blood.',
    '3. The date of turning may be proved by any medical, press or private record of the attack.']},
  {id:'lawA4',cite:'Nocturnal Accord 1888 · Art. 4',title:'Staged deaths',body:[
    '1. Where a turned person stages their own death to pass property to a new name of their own, the property so passed is forfeit.',
    '2. Forfeited property passes as if the turned person had died intestate on the date of the staged death, to their issue of the blood under Art. 3, in the order the local succession law sets.',
    '3. Failing issue of the blood, forfeited property passes to the Nocturnal Registry.',
    '4. No name invented by the turned person takes anything.']},
  {id:'lawA5',cite:'Nocturnal Accord 1888 · Art. 5',title:'Referral',body:[
    'A practitioner who finds a matter falls under this Accord must refer it to the Nocturnal Registry within seven nights. Rulings of human courts on such matters are void without referral.']}
];

  <div class="canvas-wrap" id="cw"><div class="canvas" style="transform:scale(${S.tz});transform-origin:0 0">${lines}${unknown}${nodes}
    <span class="claimlbl" style="left:262px;top:198px">claimed, no source</span></div>
    ${S.sel?drawer(S.sel):''}
    <div class="zoomctl"><button data-a="tz" data-v="1.1" aria-label="Zoom in">${ic('plus')}</button><button data-a="tz" data-v="0.9" aria-label="Zoom out">${ic('minus')}</button><button data-a="tz" data-v="0" aria-label="Reset zoom">${ic('fit')}</button></div>
  </div>`;
}
function drawer(id){
  const p = PEOPLE[id];
  return `<aside class="drawer"><div class="dh"><span class="ava">${avatar(id)}</span><div style="flex:1;min-width:0"><h2 style="font-family:var(--f-bl-d);font-weight:400;font-size:20px">${p.name}</h2><span class="muted">${p.life}</span></div><button class="icobtn" data-a="unsel" aria-label="Close">${ic('x')}</button></div>
  <div class="db"><dl class="kv">${p.facts.slice(0,4).map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
  ${HINT_OF[id]?`<button class="lnk" style="text-align:left;display:flex;gap:6px;align-items:center;color:var(--bl-leaf)" data-a="go" data-t="bl" data-v="hints"><span style="width:12px;display:inline-flex">${LEAF}</span>${HINT_OF[id].length} hint${HINT_OF[id].length>1?'s':''} for ${p.name.split(' ')[0]}</button>`:''}

}

/* ---- person ---- */
function srcRow(id){
  const r = REC[id];
  const th = r.photo ? photo(PH[id]) : r.kind==='Letter' ? 'PDF' : r.kind==='DNA' ? 'DNA' : r.kind.slice(0,4).toUpperCase();
  const sub = PAGE_KINDS.has(r.kind) ? COLL[r.kind] : r.kind==='Letter' ? 'Private document · case correspondence' : r.kind==='DNA' ? 'Bloodlines DNA report' : 'Private upload';
  return `<li><button class="srcrow" data-a="open" data-v="${id}"><span class="ic">${th}</span><span class="t"><b>${r.title}</b><small>${sub} · ${r.year}</small></span>${pinned(id)?'<span class="saved">In matter</span>':''}</button></li>`;
}
function blPerson(id, tab){
  const p = PEOPLE[id];
  const tabs = [['facts','Facts'],['sources',`Sources (${p.recs.length})`],['gallery','Gallery']];
  let body;
  if(tab==='sources') body = `<div class="panel"><div class="pb">${p.recs.length?`<ul class="srclist">${p.recs.map(srcRow).join('')}</ul>`:'<p class="muted">No sources attached.</p>'}</div></div>`;
  else if(tab==='gallery'){ const ph = p.recs.filter(x=>REC[x].photo); body = `<div class="panel"><div class="pb">${ph.length?`<div class="lab">${ph.map(x=>`<button data-a="open" data-v="${x}" style="display:flex;flex-direction:column;gap:6px;text-align:left">${photo(PH[x])}<span class="lnk">${REC[x].title}</span></button>`).join('')}</div>`:'<p class="muted" style="margin:0">No photos for this person yet.</p>'}</div></div>`; }
  else body = `<div class="panel"><div class="ph"><h2>Life events</h2></div><div class="pb"><ul class="timeline">${p.facts.map(([k,v])=>{const y=(v.match(/\b(1[89]\d\d|20\d\d)\b/)||['—'])[0];return `<li><span class="yr">${y}</span><span><span class="ev">${k}</span><br><span class="muted">${v}</span></span></li>`}).join('')}</ul></div></div>`;
  const fam = (REL[id]||[]).map(([rel,pid])=>`<button class="fam" data-a="go" data-t="bl" data-v="person/${pid}/facts"><span class="ava">${avatar(pid)}</span><span><b>${PEOPLE[pid].name}</b><small>${rel} · ${PEOPLE[pid].life}</small></span></button>`).join('');
  return `<section class="phead"><div class="wrap"><div class="crumbs" style="width:100%;padding:0"><button class="lnk" data-a="go" data-t="bl" data-v="tree">Vane estate</button><span>›</span><span>${p.name}</span></div>
    <span class="big">${avatar(id)}</span><div style="flex:1;min-width:220px"><h1>${p.name}</h1><span class="muted">${p.life}${p.tag?` · <b style="color:var(--warn)">${p.tag}</b>`:''}</span></div>
    <button class="bbtn sec sm" data-a="searchname" data-v="${p.name.split(' (')[0]}">${ic('search')}Search records</button>
    <div class="ptabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="go" data-t="bl" data-v="person/${id}/${k}">${l}</button>`).join('')}</div></div></section>
  <div class="wrap"><div class="two">${body}<div class="side">
    <div class="panel"><div class="ph"><h2>Family members</h2></div><div class="pb famlist">${fam||'<p class="muted" style="margin:0">None recorded.</p>'}</div></div>
    ${HINT_OF[id]?`<div class="panel"><div class="ph"><span style="width:14px;color:var(--bl-leaf);display:inline-flex">${LEAF}</span><h2>Hints</h2></div><div class="pb">${HINT_OF[id].map(h=>{const x=HINTS.find(z=>z.id===h);return `<p style="margin:0 0 8px"><button class="lnk" style="text-align:left" data-a="go" data-t="bl" data-v="hints">${x.title}</button></p>`}).join('')}</div></div>`:''}
  </div></div></div>`;
}

/* ---- record ---- */
function blRecord(id){
  const r = REC[id], idx = IDX[id] || [['Title',r.title],['Year',r.year]];
  const inTree = Object.values(PEOPLE).some(p=>p.recs.includes(id));
  const words = new Set((r.k.match(/[A-Z][a-z]{3,}/g)||[]).filter(w=>!['Vane','House','Hollow','Lane','Ashby'].includes(w)));
  const sugg = Object.keys(REC).filter(x=>x!==id && !REC[x].hidden && PAGE_KINDS.has(REC[x].kind) && (REC[x].k.match(/[A-Z][a-z]{3,}/g)||[]).some(w=>words.has(w))).slice(0,5);
  return `<div class="wrap"><div class="crumbs"><button class="lnk" data-a="go" data-t="bl" data-v="search">Search</button><span>›</span><span>${COLL[r.kind]}</span></div>
  <div class="rechead"><div><h1>${r.title}</h1><p class="muted" style="margin:4px 0 0">${COLL[r.kind]}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="bbtn ${pinned(id)?'done':''}" data-a="pin" data-v="${id}">${pinned(id)?ic('check')+'Saved to matter':ic('bookmark')+'Save to matter 2025-0417'}</button>
      <button class="bbtn sec" disabled>${inTree?'In your tree':'Save to tree'}</button></div></div>
  <div class="recgrid">
    <div class="viewer"><div class="vtool"><button data-a="zoom" data-v="-0.15" aria-label="Zoom out">${ic('minus')}</button><button data-a="zoom" data-v="0.15" aria-label="Zoom in">${ic('plus')}</button><button data-a="zoom" data-v="0" aria-label="Fit">${ic('fit')}</button><span style="padding-left:8px;font-variant-numeric:tabular-nums">${Math.round(S.zoom*100)}%</span><span class="sp"></span><button data-a="toastonly" data-msg="Downloads are disabled for licensed collections" aria-label="Download">${ic('dl')}</button></div>
      <div class="vstage"><div class="vinner" style="transform:scale(${S.zoom})">${r.render()}</div></div></div>
    <div class="side">
      <div class="panel"><div class="ph"><h2>Record details</h2></div><div class="pb"><table class="idx">${idx.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table></div></div>
      <div class="panel"><div class="ph"><h2>Source citation</h2></div><div class="pb"><div class="cite">Bloodlines. <i>${COLL[r.kind]}</i> [database online]. Ashby: Bloodlines Ltd, 2026. Original record: ${r.title}, ${r.year}.</div></div></div>
      ${sugg.length?`<div class="panel"><div class="ph"><h2>Suggested records</h2></div><div class="pb"><ul class="srclist">${sugg.map(srcRow).join('')}</ul></div></div>`:''}
      <p class="muted" style="font-size:13px;margin:0">See a mistake in this index? <button class="lnk" data-a="toastonly" data-msg="Thanks. Our team reviews reports within 10 working days.">Report a problem</button></p>
    </div></div></div>`;
}

/* ---- search ---- */
function results(){
  const words = (S.q.name+' '+S.q.kw).toLowerCase().split(/\s+/).filter(Boolean);
  return Object.keys(REC).filter(id=>{const r=REC[id]; return !r.hidden && PAGE_KINDS.has(r.kind) && words.every(w=>(r.k+' '+r.title+' '+r.year).toLowerCase().includes(w));}).sort((a,b)=>REC[a].year-REC[b].year);
}
function blSearch(){
  const kinds = ['All',...Object.keys(COLL)];
  const all = S.searched ? results() : [];
  const shown = all.filter(id=>S.q.kind==='All'||REC[id].kind===S.q.kind);
  const counts = {}; all.forEach(id=>counts[REC[id].kind]=(counts[REC[id].kind]||0)+1);
  const qtext = (S.q.name+' '+S.q.kw).toLowerCase();
  const nil = S.searched && qtext.includes('desmond') && (S.q.kind==='All'||S.q.kind==='Birth');
  const left = `<div class="panel"><div class="ph"><h2>Search all records</h2></div><div class="pb"><form class="sform" data-form="search">
    <label>Name<input id="sname" value="${esc(S.q.name)}" placeholder="First and last name"></label>
    <label>Keyword or place<input id="skw" value="${esc(S.q.kw)}" placeholder="e.g. Hollow Lane, Marguerite"></label>
    <label>Record type<select id="skind">${kinds.map(k=>`<option value="${k}" ${S.q.kind===k?'selected':''}>${k==='All'?'All record types':COLL[k].split(',')[0]}</option>`).join('')}</select></label>
    <div style="display:flex;gap:8px"><button class="bbtn">${ic('search')}Search</button><button type="button" class="bbtn sec" data-a="clearsearch">Clear</button></div></form></div></div>
    ${S.searched&&all.length?`<div class="panel"><div class="ph"><h2>Filter by collection</h2></div><div class="pb facets"><button class="${S.q.kind==='All'?'on':''}" data-a="facet" data-v="All">All results<span>${all.length}</span></button>${Object.entries(counts).map(([k,n])=>`<button class="${S.q.kind===k?'on':''}" data-a="facet" data-v="${k}">${COLL[k].split(',')[0]}<span>${n}</span></button>`).join('')}</div></div>`:''}`;
  let right;
  if(!S.searched){
    const ck = {}; Object.values(REC).forEach(r=>{ if(!r.hidden&&PAGE_KINDS.has(r.kind)) ck[r.kind]=(ck[r.kind]||0)+1; });
    right = `<div class="panel"><div class="ph"><h2>Featured collections for Ashby</h2></div><div class="pb"><div class="rtable-wrap"><table class="rtable"><tr><th>Collection</th><th>Indexed for your tree</th></tr>${Object.keys(COLL).map(k=>`<tr><td><button class="nm lnk" data-a="facetall" data-v="${k}">${COLL[k]}</button></td><td>${ck[k]||0} records</td></tr>`).join('')}</table></div></div></div>
    <p class="muted" style="font-size:13.5px">Tip: most records aren't attached to any tree. Search by place or keyword as well as by name.</p>`;
  } else {
    right = `${nil?`<div class="callout"><p><b>No birth registration found for Desmond Vane.</b> We searched Ashby and three neighbouring districts, 1940–1994. Professional accounts can request a certified nil return.</p><button class="bbtn sm" data-a="open" data-v="nilDesmond">Get nil-return certificate</button></div>`:''}
    <div class="panel"><div class="ph" style="flex-wrap:wrap"><h2 style="flex:1">${shown.length?`Results 1–${shown.length} of ${shown.length}`:'No results'}</h2><span class="muted" style="font-size:13.5px">Sorted by: Event year</span></div>
    ${shown.length?`<div class="rtable-wrap"><table class="rtable"><tr><th>Record</th><th>Details</th><th>Year</th><th></th></tr>${shown.map(id=>{const r=REC[id],ix=IDX[id]||[];return `<tr><td><button class="nm lnk" data-a="open" data-v="${id}">${r.title}</button><small>${COLL[r.kind]}</small></td><td>${ix.slice(1,3).map(([k,v])=>`<small><b style="color:var(--bl-ink);font-weight:500">${k}:</b> ${v}</small>`).join('')}</td><td>${r.year}</td><td>${pinned(id)?'<span class="saved">In matter</span>':''}</td></tr>`;}).join('')}</table></div>`:`<div class="pb"><p class="muted" style="margin:0">Nothing matches every word. Try fewer words, or a place or keyword instead of a name.</p></div>`}</div>`;
  }
  return `<div class="wrap"><div class="crumbs"><button class="lnk" data-a="go" data-t="bl" data-v="home">Home</button><span>›</span><span>Search</span></div><h1>Search</h1>
    <div class="sgrid"><div class="side">${left}</div><div class="side">${right}</div></div></div>`;
}

/* ---- dna ---- */
const AVC = ['#7a5c9e','#3c7a8c','#b0603a','#4f7a3c','#8c3c5c','#5c6c8c'];
const avColor = s => AVC[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%AVC.length];
function mrow(name, rel, cm, side, extra=''){
  const ini = name.split(' ').map(w=>w[0]).join('').slice(0,2);
  return `<div class="mrow"><span class="ava" style="background:${avColor(name)}">${ini}</span><div class="who"><b>${name}</b><small>${rel}</small></div>${side?`<span class="side-tag ${side==='Marsh'?'marsh':''}">${side} side</span>`:''}<div class="cm"><b>${cm}</b><small>shared DNA</small></div>${extra}</div>`;
}
function ethPanel(rows, note=''){
  return `<div class="panel"><div class="ph"><h2>Ethnicity estimate</h2></div><div class="pb" style="display:flex;flex-direction:column;gap:10px">${rows.map(([n,p,odd])=>`<div class="ethrow"><span>${n}</span><span style="text-align:right;font-variant-numeric:tabular-nums">${p}%</span><div class="bar"><i class="${odd?'odd':''}" style="width:${p}%"></i></div></div>`).join('')}${note}</div></div>`;
}
function saveBtn(id){ return `<button class="bbtn ${pinned(id)?'done':'sec'} sm" data-a="pin" data-v="${id}">${pinned(id)?ic('check')+'Saved to matter':ic('bookmark')+'Save report to matter'}</button>`; }
function blDna(kit){
  S.kit = kit;

  let body;
  if(kit==='julian') body = `<div class="two"><div class="side">
    <div class="labnote"><b>Lab notice.</b> This sample returned no viable cellular activity. We re-ran it twice and got the same result. Matches: 0 of 21,406,118 tested members. Ethnicity could not be estimated.</div>
    <div class="panel"><div class="ph"><h2>Matches</h2></div><div class="pb"><p class="muted" style="margin:0">No DNA matches. Every living person who has tested with Bloodlines shares DNA with at least one other member.</p></div></div>
    <div class="panel"><div class="ph"><h2>Expected matches if the tree is correct</h2></div><div class="pb rtable-wrap"><table class="cmtable"><tr><th>Relative on tree</th><th>Relationship</th><th class="n">Typical cM</th><th class="n">Observed</th></tr>
    <tr><td>Cornelius Vane (no kit)</td><td>Grandfather</td><td class="n">1,156–2,311</td><td class="n">—</td></tr><tr><td>Margaret Holloway</td><td>Half 1st cousin 2x removed</td><td class="n">0–270</td><td class="n">0</td></tr><tr><td>Any member</td><td>Anyone at all</td><td class="n">≥ 1 match</td><td class="n">0</td></tr></table></div></div></div>
    <div class="side"><div class="panel"><div class="ph"><h2>Kit details</h2></div><div class="pb"><dl class="kv"><dt>Kit ID</dt><dd>BL-77-0302</dd><dt>Tested</dt><dd>April 2025</dd><dt>Sample</dt><dd>Saliva (collected after dark)</dd><dt>Status</dt><dd style="color:var(--bad);font-weight:700">Anomalous</dd></dl></div></div>${saveBtn('dnaJulian')}</div></div>`;
  else if(kit==='margaret') body = `<div class="two"><div class="panel"><div class="ph"><h2>Matches</h2><span class="muted" style="margin-left:auto;font-size:13.5px">312 matches · showing closest</span></div><div class="pb">
    ${mrow('R. Holloway','1st cousin','874 cM','Holloway / Vane')}${mrow('G. Holloway-Teague','2nd cousin','231 cM','Holloway / Vane')}${mrow('Daphne Marsh-Pike','3rd cousin','96 cM','Marsh')}${mrow('Ivor Marsh','3rd cousin','88 cM','Marsh')}${mrow('Julian Vane','No match','0 cM','')}</div></div>
    <div class="side">${ethPanel([['England & Wales',61],['Ireland',22],['Scotland',14],['Germanic Europe',3]])}${saveBtn('dnaMargaret')}</div></div>`;
  else if(kit==='daphne') body = `<div class="two"><div class="side"><div class="panel"><div class="ph"><h2>Matches</h2><span class="muted" style="margin-left:auto;font-size:13.5px">188 matches · showing closest</span></div><div class="pb">
    ${mrow('Daniel Pike','1st cousin','811 cM','')}${mrow('Ivor Marsh','2nd cousin','212 cM','Marsh')}${mrow('Margaret Holloway','3rd cousin','96 cM','Marsh')}</div></div>
    <div class="panel"><div class="ph"><h2>Shared matches with Margaret Holloway</h2></div><div class="pb"><p style="margin:0 0 8px">Ivor Marsh, Ada Marsh-Clery and T. Marsh. All three sit on Margaret's Marsh side. None sit on her Holloway or Vane side.</p>
    <div class="rtable-wrap"><table class="cmtable"><tr><th>If Cornelius were her father</th><th>Expected relationship</th><th class="n">Typical cM</th><th class="n">Observed</th></tr><tr><td>Margaret Holloway</td><td>Half 1st cousin 1x removed</td><td class="n">57–530</td><td class="n">96</td></tr></table></div>
    <p class="muted" style="font-size:13.5px;margin:8px 0 0">The amount alone fits either story. Which side the shared matches sit on doesn't.</p></div></div></div>
    <div class="side">${ethPanel([['England & Wales',72],['Ireland',18],['Scotland',10]])}${saveBtn('dnaDaphne')}</div></div>`;
  else body = S.won ? `<div class="two"><div class="panel"><div class="ph"><h2>Matches</h2><span class="muted" style="margin-left:auto;font-size:13.5px">1 match</span></div><div class="pb">
    ${mrow('Julian Vane','Distant cousin · match flagged: unusual','9 cM','')}<p class="muted" style="font-size:13.5px;margin:10px 0 0">Most members have hundreds of matches. Further matches for this kit are withheld at the account owner's request. Account owner: Ashgrove &amp; Pell.</p></div></div>

    <p style="margin:12px 0 0">Stage ${kitStage()} of 4: ${['','Received','Extraction','Amplification','Analysis'][kitStage()]}. Results usually take 6 to 8 weeks.</p></div></div>`;
  return `<section class="dnahero"><div class="wrap"><div style="flex:1;min-width:240px"><h1>DNA Matches</h1><p style="margin:4px 0 0;opacity:.85">Shared DNA is measured in centimorgans (cM). More cM, closer relationship.</p></div>
    <label style="display:flex;flex-direction:column;gap:4px;font-size:12.5px;opacity:.95">Viewing kit<select data-kit="1">${kits.map(([k,n])=>`<option value="${k}" ${k===kit?'selected':''}>${n}</option>`).join('')}</select></label></div></section>
  <div class="wrap">${body}</div>`;
}

/* ---- hints ---- */
function blHints(){
  const forP = {hintOfficial:'Julian Ambrose Vane',h2:'Ambrose Vane',h3:'Ambrose Vane',h4:'Harriet Vane'};
  const yours = S.won ? `<div class="hrow"><svg class="leafbig" viewBox="0 0 20 26" style="color:#c48a1a"><path d="M10 1 C 6 9, 2 13, 2 17.5 A 8 8 0 0 0 18 17.5 C 18 13, 14 9, 10 1 Z" fill="currentColor"/></svg><div class="hb"><span class="muted" style="font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase">For you</span><h3>You may be related to R. Ashgrove (b. 1702?)</h3><span class="muted" style="font-size:13.5px">From a private member tree · owner hidden</span></div><button class="bbtn sm" data-a="toastonly" data-msg="This tree is private. You need the owner's permission to view it.">Review hint</button></div>` : '';

}

/* ================= DOC PREVIEW ================= */

      ${S.pins.length?`<div class="chips">${S.pins.map(p=>`<button type="button" class="chip" data-a="ev" data-f="${f.id}" data-v="${p}" aria-pressed="${(S.ev[f.id]||[]).includes(p)}" ${locked?'disabled':''}>${REC[p].title}</button>`).join('')}</div>`:'<p style="font-size:13px;margin:0;color:var(--nt-muted)">Add evidence to the matter first. It will appear here.</p>'}
      </fieldset>`;}).join('')}
    <div><button class="nbtn" ${done?'disabled':''}>${S.won?'Ruling accepted':S.failed?'Matter reassigned':'File ruling with partners'}</button></div></form>
    ${S.won?`<div class="verdict ok"><b>All five findings accepted</b><p>Ambrose, Cornelius and Julian Vane are one man. He registered his own birth twice and his own death twice, and inherited from himself in 1934. Under Article 4 the estate goes to Margaret Holloway. Check your mail.</p></div>`:''}
    ${S.failed?`<div class="verdict no"><b>Matter reassigned</b><p>Three filings used. Check your mail.</p></div>`:''}</div>`;

function judge(){
  let all = true;
  FIND.forEach(f=>{
    if(S.res[f.id]===true) return;
    const ev = (S.ev[f.id]||[]).filter(pinned), hint = ev.includes('hintOfficial');
    if(hint){ S.flags['hint_'+f.id]=true; S.flags.usedHint=true; }
    const good = ev.filter(id=>supports(id,f.id));
    const enough = f.id==='F1' ? good.length>=3 : f.id==='F5' ? (ev.includes('lawA4') && good.filter(x=>x!=='lawA4'&&x!=='lawA3').length>=1) : good.length>=NEED[f.id];
    const ok = S.ans[f.id]===f.ans && enough && !hint;
    S.res[f.id] = ok; if(!ok) all = false;
  });
  S.attempts++;
  log(`Ruling filed (${S.attempts} of 3): ${Object.values(S.res).filter(Boolean).length} of 5 findings accepted`);
  if(all){ S.won = true; }
  else if(S.attempts>=3){ S.failed = true; }
}

/* ================= EVENTS ================= */
document.addEventListener('click', e=>{
  if(e.target.id==='modal'){ closePreview(); return; }
  const svg = e.target.closest('svg[data-lab]');
  if(svg){
    const side = svg.closest('.labpane').querySelector('select').dataset.labSelect, id = svg.dataset.id, pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const m = marksOf(id), list = side==='a'?S.lab.ma:S.lab.mb;
    const hit = Object.keys(m).find(k=>Math.hypot(m[k][0]-p.x, m[k][1]-p.y) < 8);
    if(hit){ if(!list.includes(hit)) list.push(hit); } else S.lab.miss++;
    save(); render(); return;
  }
  const b = e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v;
  switch(a){
    case 'tab': S.tab=v; save(); render(); $('#vp').scrollTop=0; return;
    case 'go': go(v, b.dataset.t); return;
    case 'back': case 'fwd': { const h=S.hist[S.tab]; h.i = Math.max(0,Math.min(h.s.length-1,h.i+(a==='back'?-1:1))); S.mlRead = S.tab==='mail' && cur().split('/')[1] ? S.mlRead : false; save(); render(); return; }
    case 'reload': render(); toast('Reloaded'); return;
    case 'burger': S.navOpen=!S.navOpen; render(); return;
    case 'cookie': S.cookie=true; save(); render(); return;
    case 'toastonly': toast(b.dataset.msg); return;
    case 'sel': S.sel=v; render(); return;
    case 'unsel': S.sel=null; render(); return;
    case 'tz': S.tz = +v===0 ? 1 : Math.max(.6,Math.min(1.4,S.tz*+v)); render(); return;
    case 'zoom': S.zoom = +v===0 ? 1 : Math.max(.6,Math.min(2,S.zoom+ +v)); render(); return;
    case 'open': if(!$('#modal').hidden) closePreview(); openDoc(v); return;
    case 'close': closePreview(); return;
    case 'pin': togglePin(v); if(b.dataset.m){ showPreview(v); render(); } else render(); return;
    case 'ev': { const f=b.dataset.f, l=S.ev[f]||(S.ev[f]=[]); S.ev[f] = l.includes(v)?l.filter(x=>x!==v):[...l,v]; save(); render(); return; }
    case 'searchname': S.q={name:v,kw:'',kind:'All'}; S.searched=true; go('search','bl'); return;
    case 'clearsearch': S.q={name:'',kw:'',kind:'All'}; S.searched=false; save(); render(); return;
    case 'facet': S.q.kind=v; save(); render(); return;
    case 'facetall': S.q={name:'',kw:'',kind:v}; S.searched=true; save(); render(); return;
    case 'mailopen': S.mlRead=true; go('inbox/'+v,'mail'); return;
    case 'mailback': S.mlRead=false; render(); return;
    case 'toc': { const el=document.getElementById('art-'+v); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
    case 'certify': {
      const L=S.lab, shared=L.ma.filter(m=>L.mb.includes(m)), id='cmp:'+[L.a,L.b].sort().join('-'), ok=shared.length>=2;
      S.reports[id]={a:L.a,b:L.b,shared,ok}; REC[id]=cmpRec(id);
      if(!pinned(id)){ S.pins.push(id); log('Photo lab certified: '+REC[id].title+(ok?' (positive)':' (inconclusive)')); }
      save(); render(); showPreview(id); return; }
    case 'reset': try{localStorage.removeItem('bloodlines-v3')}catch(e){} for(const id in S.reports) delete REC[id]; Object.assign(S, FRESH()); render(); return;
  }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.labSelect){ const s=t.dataset.labSelect; S.lab[s]=t.value; if(s==='a') S.lab.ma=[]; else S.lab.mb=[]; S.lab.miss=0; save(); render(); }
  else if(t.dataset.kit){ go('dna/'+t.value,'bl'); }
  else if(t.dataset.find){ if(t.value){ S.sel=t.value; render(); } }
  else if(t.type==='radio' && /^F\d$/.test(t.name)){ S.ans[t.name]=t.value; save(); }
});
document.addEventListener('input', e=>{ if(e.target.id==='notes'){ S.notes=e.target.value; save(); }});
document.addEventListener('submit', e=>{
  e.preventDefault(); const f = e.target;
  if(f.dataset.form==='qsearch'){ S.q={name:'',kw:$('#hq').value,kind:'All'}; S.searched=true; go('search','bl'); }
  if(f.dataset.form==='search'){ S.q={name:$('#sname').value,kw:$('#skw').value,kind:$('#skind').value}; S.searched=true; log(`Searched Bloodlines: "${(S.q.name+' '+S.q.kw).trim()||S.q.kind}"`); save(); render(); }
  if(f.dataset.form==='rule'){
    const missing = FIND.filter(x=>S.res[x.id]!==true && !S.ans[x.id]);
    if(missing.length){ $('#rulemsg').textContent = `Answer every finding before filing. Missing: ${missing.map(x=>'Finding '+x.id.slice(1)).join(', ')}.`; $('#rulemsg').style.color='var(--bad)'; return; }
    judge(); save(); render(); $('#vp').scrollTop=0;
    toast(S.won?'Ruling accepted. You have new mail.':S.failed?'Matter reassigned. You have new mail.':'Ruling returned by the partners');
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#modal').hidden) closePreview(); });
render();

</script>

</body>
</html>
