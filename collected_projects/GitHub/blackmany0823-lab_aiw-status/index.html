<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>狀態（唯讀）</title>
<style>:root{color-scheme:dark;--bg:#090d11;--card:#10171c;--text:#e9f1f0;--muted:#91a5a7;--green:#35d69b;--amber:#e9b663;--red:#f36d70;--blue-light:#7ab8e9;--blue-mid:#3f83c7;--blue-dark:#245997;--green-light:#5ac989;--green-mid:#259b66;--green-dark:#11683f;--orange-light:#f5ba79;--orange-mid:#d68842;--orange-dark:#a85724;--gray-light:#afbcbf;--gray-mid:#7d9296;--gray-dark:#526970}*{box-sizing:border-box}html{min-width:360px;background:var(--bg)}body{margin:0;min-width:360px;background:radial-gradient(ellipse at 90% -15%,#15312b66,transparent 34%),var(--bg);color:var(--text);font:16px/1.55 Inter,"Segoe UI","Microsoft JhengHei",system-ui,sans-serif}main{width:100%;max-width:42rem;margin:auto;padding:1rem}.card{background:var(--card);border:1px solid #26343a;border-radius:.8rem;margin:.75rem 0;padding:1rem;box-shadow:0 12px 28px #0003}h1{font-size:1.8rem;line-height:1.2;margin:.25rem 0 .4rem;letter-spacing:-.035em}h2{font-size:1.05rem;margin:0 0 .65rem}p{margin:.35rem 0}dl{margin:0}dt{color:var(--muted);font-size:.82rem}dd{margin:0 0 .65rem;font-weight:650;overflow-wrap:anywhere}.small{font-size:.83rem;color:var(--muted)}#freshness{font-weight:700;border-left:4px solid var(--green)}#freshness.warning{border-color:var(--amber);color:#ffe0a6}#freshness.stale{border-color:var(--red);color:#ffc1c2}#freshness.unknown{border-color:var(--gray-mid);color:var(--gray-light)}.version{font-size:1.05rem;color:#b5ecd3}.fresh-line{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}.lamp{width:.72rem;height:.72rem;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.unknown{color:var(--gray-light)}.usage-row{margin:.75rem 0}.usage-label{display:flex;justify-content:space-between;gap:.5rem;font-size:.88rem}.bar{height:.65rem;margin-top:.25rem;background:#1b292f;border-radius:1rem;overflow:hidden;border:1px solid #33444a}.bar i{display:block;height:100%;background:var(--green)}.bar.warning i{background:var(--amber)}.bar.low i{background:var(--red)}.project{margin:.75rem 0;padding:.8rem;border:1px solid #33444a;border-left:4px solid var(--gray-mid);border-radius:.65rem;background:#0d1418}.category-blue.light{--project:var(--blue-light)}.category-blue.medium{--project:var(--blue-mid)}.category-blue.dark{--project:var(--blue-dark)}.category-green.light{--project:var(--green-light)}.category-green.medium{--project:var(--green-mid)}.category-green.dark{--project:var(--green-dark)}.category-orange.light{--project:var(--orange-light)}.category-orange.medium{--project:var(--orange-mid)}.category-orange.dark{--project:var(--orange-dark)}.category-gray.light{--project:var(--gray-light)}.category-gray.medium{--project:var(--gray-mid)}.category-gray.dark{--project:var(--gray-dark)}.category-blue,.category-green,.category-orange,.category-gray{border-left-color:var(--project,var(--gray-mid))}.positions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}.position{min-width:0;display:flex;justify-content:space-between;gap:.35rem;border:1px solid #26343a;border-radius:.5rem;padding:.42rem .5rem;color:#c8d5d5;font-size:.82rem}.position b{color:var(--project,var(--text));font-variant-numeric:tabular-nums}.empty{color:var(--muted)}@media(max-width:380px){main{padding:.7rem}.card{padding:.85rem}.positions{grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem}.position{font-size:.76rem;padding:.38rem}}</style>
</head><body><main><header class="card"><h1>狀態總覽</h1><p class="small">唯讀資訊｜僅使用公開概略資料</p></header><section id="freshness" class="card unknown" role="status" aria-live="polite">載入資料中…</section><section class="card"><h2>白話現況</h2><p id="plain">載入資料中…</p></section><section class="card"><h2>目前狀態</h2><dl id="state"></dl></section><section class="card"><h2>等你決定</h2><p id="gates">尚無資料</p></section><section class="card"><h2>額度</h2><div id="usage">尚無資料</div></section><section class="card"><h2>專案工單分布</h2><div id="projects">尚無資料</div></section><section class="card"><h2>最近工單狀態計數</h2><dl id="orders"></dl></section><section class="card small"><dl id="meta"></dl></section></main>
<script>
const labels={programState:'程式',autonomousHandoff:'自主接棒',postman:'郵差',humanGatesPending:'等你決定',githubSync:'GitHub 同步',lastSuccessfulSync:'最後成功時間',parseStatus:'解析狀態'};
const show=(target,pairs)=>document.querySelector(target).innerHTML=pairs.map(([k,v])=>`<dt>${labels[k]||k}</dt><dd class="${v==='UNKNOWN'?'unknown':''}">${v}</dd>`).join('');
const usage=(data)=>{const host=document.querySelector('#usage'),rows=[];for(const [service,name] of [['openai','OpenAI'],['claude','Claude']])for(const [key,title] of [['fiveHourRemainingPercent','5H 剩餘'],['weeklyRemainingPercent','每週剩餘']]){const value=data?.[service]?.[key],valid=Number.isInteger(value)&&value>=0&&value<=100,level=!valid?'unknown':value<10?'low':value<25?'warning':'normal',word=!valid?'尚無資料':value<10?'偏低':value<25?'偏緊':'正常';rows.push(`<div class="usage-row"><div class="usage-label"><span>${name} ${title}</span><b class="${level}">${valid?`${value}%｜${word}`:word}</b></div><div class="bar ${level}">${valid?`<i style="width:${value}%"></i>`:''}</div></div>`)}host.innerHTML=rows.join('')};
const projects=(items)=>{const host=document.querySelector('#projects'),positions={queued:'排隊',working:'施工中',waitingReview:'待審查',reviewing:'審查中',waitingOwner:'等 Owner'},categories={'專案':'green','維護':'blue','Owner要求':'orange','未分類':'gray'},shades=['light','medium','dark'];host.innerHTML=Array.isArray(items)&&items.length?items.map(p=>{const color=categories[p.category]||'gray',shade=shades.includes(p.shade)?p.shade:'medium',counts=p.counts;return `<div class="project category-${color} ${shade}"><div class="positions">${Object.entries(positions).map(([k,n])=>`<div class="position"><span>${n}</span><b>${Number.isInteger(counts?.[k])?counts[k]:'尚無資料'}</b></div>`).join('')}</div></div>`}).join(''):'尚無資料'};
const freshness=(s)=>{const f=document.querySelector('#freshness'),stamp=Date.parse(s?.generatedUtc),ageMs=Date.now()-stamp;if(!Number.isFinite(stamp)||ageMs < -60000){f.className='card unknown';f.innerHTML='<span class="fresh-line"><i class="lamp"></i><span>資料時間：未提供｜新鮮度：未知</span></span>';return}const age=Math.max(0,Math.floor(ageMs/60000)),level=ageMs>30*60000?'stale':ageMs>20*60000?'warning':'fresh',word=level==='stale'?'已過期':level==='warning'?'稍舊':'正常';const time=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}).format(stamp);f.className=`card ${level}`;f.innerHTML=`<span class="fresh-line"><i class="lamp"></i><span>資料時間：${time}（距現在 ${age} 分鐘）</span><b>新鮮度：${word}</b></span>`};
fetch('status.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(s=>{const plain=Array.isArray(s.plainLines)&&s.plainLines.length===3?s.plainLines:['現在：資料不明','卡住：資料不明','要你做的事：資料不明'];document.querySelector('#plain').textContent=plain.join('\n');document.querySelector('#plain').style.whiteSpace='pre-line';freshness(s);document.querySelector('#gates').textContent=Number.isInteger(s.humanGatesPending)?`${s.humanGatesPending} 件`:'尚無資料';show('#state',['programState','autonomousHandoff','postman','githubSync','lastSuccessfulSync'].map(k=>[k,s[k]??'UNKNOWN']));usage(s.usage);projects(s.projects);show('#orders',Object.entries(s.recentOrderStatusCounts||{UNKNOWN:'UNKNOWN'}));show('#meta',[['parseStatus',s.parseStatus??'UNKNOWN']]);}).catch(()=>{freshness(null);document.querySelector('#plain').textContent='讀不到資料，請稍後重新整理。';show('#state',[['parseStatus','UNKNOWN']]);document.querySelector('#gates').textContent='尚無資料'});
</script></body></html>
