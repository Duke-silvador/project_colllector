<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/iga-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGA Project Management Firm</title>
    <meta name="description" content="IGA Project Management Firm connects professional Building Engineers and skilled Artisans with clients across Nigeria. Land acquisition, construction, staffing, cleaning, and facility management." />

    <!-- Preload the LCP hero image so the browser fetches it immediately -->
    <link rel="preload" as="image" href="/images/header.webp" fetchpriority="high" />

    <!-- OpenGraph — controls how the link looks when shared on WhatsApp, iMessage, etc. -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="IGA Project Management Firm" />
    <meta property="og:description" content="Connecting professional Building Engineers and skilled Artisans with clients across Nigeria. Land acquisition, construction, staffing, cleaning, and facility management." />
    <meta property="og:image"       content="/images/header.webp" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card (WhatsApp also reads this as a fallback) -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="IGA Project Management Firm" />
    <meta name="twitter:description" content="Connecting professional Building Engineers and skilled Artisans with clients across Nigeria." />
    <meta name="twitter:image"       content="/images/header.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
