<body>
  <nav id="page-nav" aria-label="Simulation Switcher">
    <a href="./index.html" class="nav-pill active">Mochi-Puff Fur</a>
    <a href="./grass.html" class="nav-pill" hidden style="display: none;" aria-hidden="true">GPU Grass Painter</a>
  </nav>
  <nav id="scene-nav" class="scene-nav-bar" aria-label="Scene Selection"></nav>
  <div id="canvas-container" aria-label="Interactive 3D GPU Fur Simulation"></div>
  <aside id="ui-root" aria-label="Fur and Lighting Controls"></aside>
  <div id="hud-hint" aria-live="polite"></div>
  <script>
    (function () {
      try {
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var hadActive = Boolean(navigator.serviceWorker.controller);
            Promise.all(regs.map(function (r) { return r.unregister(); })).then(function (results) {
              if (hadActive && results.some(Boolean) && !sessionStorage.getItem('mochi_sw_purged_v3')) {
                sessionStorage.setItem('mochi_sw_purged_v3', '1');
                window.location.reload();
              }
            });
          });
        }
      } catch (e) {}
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
