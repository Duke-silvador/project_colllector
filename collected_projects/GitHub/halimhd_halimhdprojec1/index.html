<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Layanan AmbulanMu Godean</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--o:#f57c00;--o2:#ffe0b2;--g:#2e7d32;--g2:#e8f5e9;--bg:#fffaf3;--card:#fff;--tx:#2b2b2b;--mut:#6b6b6b;--ln:#e6d5bd;--inp:#fffde7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a16;--card:#27241e;--tx:#f3eee6;--mut:#b5ab9a;--ln:#4a4337;--inp:#33301f;--o2:#4a3418;--g2:#1f3322}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--o),#ff9800 55%,var(--g));color:#fff;padding:14px 16px 10px;position:relative;overflow:hidden}
header h1{margin:0;font-size:1.2rem}header p{margin:2px 0 0;font-size:.85rem;opacity:.95}
header svg.leaf{position:absolute;right:-6px;top:-6px;opacity:.45}
.amb{display:block;margin-top:6px}
nav{display:flex;gap:6px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;padding:12px 4px;border:2px solid var(--o);background:var(--card);color:var(--o);border-radius:12px;font-weight:700;font-size:.95rem}
nav button.on{background:var(--o);color:#fff}
main{padding:4px 12px 90px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:700;margin:12px 0 4px;color:var(--g)}
input,select,textarea{width:100%;padding:12px;font:inherit;color:var(--tx);background:var(--inp);border:2px solid var(--g);border-radius:10px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--o2);border-color:var(--o)}
.row{display:flex;gap:8px;align-items:stretch}.row>*{flex:1}.row>.btn.s{flex:0 0 auto}
.btn{padding:12px 14px;border:0;border-radius:10px;font-weight:700;font-size:.95rem;background:var(--o);color:#fff}
.btn.g{background:var(--g)}.btn.l{background:var(--o2);color:var(--tx)}.btn.r{background:#c62828}.btn.s{padding:10px 12px;font-size:.85rem}
.big{width:100%;padding:16px;font-size:1.1rem;margin-top:16px}
.hint{font-size:.8rem;color:var(--mut)}.h2{font-weight:800;color:var(--o);margin:0 0 6px}
.tot{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tot div{background:var(--g2);border-radius:10px;padding:8px 10px}.tot b{display:block;font-size:1.05rem;color:var(--g)}
.item{border-left:6px solid var(--o)}.item h3{margin:0;font-size:1rem}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.photos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:2px solid var(--ln);cursor:pointer}
pre{white-space:pre-wrap;background:var(--g2);padding:10px;border-radius:10px;font:inherit;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#big{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20}#big img{max-width:96%;max-height:92%}
.status{font-size:.8rem;padding:6px 12px;color:var(--mut);text-align:center}
.mrow{display:flex;gap:6px;margin:4px 0}.mrow input{flex:1}
</style>
</head>
<body>
<header>
<svg class="leaf" width="130" height="90" viewBox="0 0 130 90" aria-hidden="true"><path d="M10 80C30 30 70 10 120 8 110 50 70 78 10 80Z" fill="#a5d6a7"/><path d="M40 70C60 45 85 28 112 14" stroke="#2e7d32" stroke-width="3" fill="none"/><path d="M70 85C80 55 105 38 128 36 124 62 100 80 70 85Z" fill="#c5e1a5"/></svg>
<h1>🚑 Laporan Layanan AmbulanMu Godean</h1>
<p>Tetap semangat melayani umat · Memberi untuk Negeri</p>
<svg class="amb" width="120" height="40" viewBox="0 0 120 40" aria-hidden="true"><rect x="4" y="8" width="70" height="22" rx="4" fill="#fff"/><path d="M74 14h22l10 9v7H74Z" fill="#fff"/><rect x="80" y="17" width="12" height="7" fill="#f57c00" opacity=".5"/><rect x="33" y="12" width="4" height="14" fill="#e53935"/><rect x="28" y="17" width="14" height="4" fill="#e53935"/><circle cx="24" cy="32" r="6" fill="#33691e"/><circle cx="92" cy="32" r="6" fill="#33691e"/><rect x="44" y="3" width="10" height="5" rx="2" fill="#ff5252"/></svg>
</header>
<nav>
<button id="t-isi" class="on" onclick="go('isi')">➕ Isi Laporan</button>
<button id="t-rekap" onclick="go('rekap')">📋 Rekap</button>
<button id="t-master" onclick="go('master')">⚙️ Master</button>
</nav>
<div class="status" id="status">Menghubungkan penyimpanan bersama…</div>
<main id="app"></main>
<div id="big" onclick="this.style.display='none'"><img id="bigimg" alt="Foto dokumentasi"></div>
<div id="toast"></div>
<script>
/* ====== PENGATURAN: isi dua nilai ini dari Supabase (lihat README) ====== */
var SB_URL="ISI_PROJECT_URL_SUPABASE";
var SB_KEY="ISI_PUBLISHABLE_ATAU_ANON_KEY";
var ADMIN_PIN="1234"; /* ganti PIN admin untuk menyimpan menu Master */
var HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
var DEF={crew:["Rehan"],armada:["R1","R2"],keperluan:["Jemput HD","Antar HD","Antar pasien pulang","Rujukan","Antar jenazah"],lokasi:["RS PKU Kota","RS PKU Muhammadiyah Gamping","RS Sardjito","RS JIH","Gamping Tengah"],hide:[]};
var FIELDS={kasout:"Kas keluar + keterangan",km:"Kilometer (KM)",foto:"Foto dokumentasi",note:"Catatan"};
var S={view:"isi",reports:[],cfg:JSON.parse(JSON.stringify(DEF)),date:today(),open:{},photos:[],draft:null},db=null,LS={};
function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function p2(n){return String(n).padStart(2,"0")}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rp(n){n=Number(n)||0;return "Rp "+n.toLocaleString("id-ID")}
function tgl(d){var a=d.split("-");return a[2]+"-"+a[1]+"-"+a[0]}
function hari(d){return HARI[new Date(d+"T12:00:00").getDay()]}
function toast(m){var t=$("toast");t.textContent=m;t.className="on";setTimeout(function(){t.className=""},2200)}
function ls(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return LS[k]}}
function maps(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q+" Yogyakarta")}
function dir(a,b){return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(a+" Yogyakarta")+"&destination="+encodeURIComponent(b+" Yogyakarta")+"&travelmode=driving"}
function sbOn(){return SB_URL.indexOf("http")==0}
function sb(path,opt){opt=opt||{};opt.headers=Object.assign({apikey:SB_KEY,"Content-Type":"application/json"},SB_KEY.indexOf("eyJ")==0?{Authorization:"Bearer "+SB_KEY}:{},opt.headers||{});return fetch(SB_URL+"/rest/v1/"+path,opt).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t)});return r.status==204?null:r.text().then(function(t){return t?JSON.parse(t):null})})}
async function loadDay(){
 if(!sbOn())return;
 try{var rows=await sb("laporan?tgl=eq."+S.date+"&select=data,foto&order=created_at.asc");
  S.reports=rows.map(function(x){var d=x.data;d.foto=x.foto||[];return d});
  $("status").textContent="Terhubung · data tersimpan permanen di Supabase"}
 catch(e){$("status").textContent="Gagal terhubung ke database. Cek koneksi atau pengaturan."}
}
async function init(){
 render();
 if(!sbOn()){$("status").textContent="Database belum diatur: isi SB_URL dan SB_KEY di index.html (lihat README)";return}
 try{var m=await sb("master?id=eq.config&select=data");if(m&&m[0]){for(var k in DEF){if(m[0].data[k])S.cfg[k]=m[0].data[k]}}}catch(e){}
 await loadDay();render();
 setInterval(function(){if(S.view=="rekap")loadDay().then(render)},20000);
}
async function saveReport(r){
 var f=r.foto||[];var d=Object.assign({},r);delete d.foto;
 await sb("laporan",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id:r.id,tgl:r.tgl,data:d,foto:f})});
}
async function saveCfg(){
 await sb("master?on_conflict=id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:"config",data:S.cfg})});
}
function go(v){S.view=v;["isi","rekap","master"].forEach(function(t){$("t-"+t).className=t==v?"on":""});if(v=="rekap"){loadDay().then(render)}else render();scrollTo(0,0)}
function dl(id,arr,ph){return '<input id="'+id+'" list="L'+id+'" placeholder="'+ph+'" autocomplete="off"><datalist id="L'+id+'">'+arr.map(function(x){return '<option value="'+esc(x)+'">'}).join("")+'</datalist>'}
function showF(k){return S.cfg.hide.indexOf(k)<0}
function render(){
 var a=$("app");
 if(S.view=="isi")a.innerHTML=formHTML();
 else if(S.view=="rekap")a.innerHTML=rekapHTML();
 else a.innerHTML=masterHTML();
 if(S.view=="isi")fillDraft();
}
function formHTML(){
 var now=new Date(),c=S.cfg;
 return '<div class="card"><p class="h2">Isi Laporan Pelayanan</p><p class="hint">Ketik manual atau pilih dari daftar pada kolom hijau. Semua kolom bisa diketik bebas.</p>'+
 '<button class="btn l big" style="margin-top:6px" onclick="dupKemarin()">🔁 Duplikat laporan kemarin (HD rutin)</button>'+
 '<div class="row"><div><label>Tanggal</label><input type="date" id="f_tgl" value="'+today()+'" onchange="$(\'f_hari\').value=hari(this.value)"></div><div><label>Hari</label><input id="f_hari" readonly value="'+HARI[now.getDay()]+'"></div></div>'+
 '<label>Waktu</label><input type="time" id="f_waktu" value="'+p2(now.getHours())+':'+p2(now.getMinutes())+'">'+
 '<label>Keperluan</label>'+dl("f_kep",c.keperluan,"Pilih atau ketik, mis. Jemput HD")+
 '<label>Nama pasien</label><input id="f_nama" placeholder="Nama pasien" autocomplete="off">'+
 '<label>Alamat</label><input id="f_alamat" placeholder="Alamat pasien">'+
 '<label>Titik jemput</label><div class="row">'+dl("f_jem",c.lokasi,"Pilih atau ketik lokasi jemput")+'<button class="btn g s" onclick="openMap(\'f_jem\')">📍 Maps</button></div>'+
 '<label>Titik tujuan</label><div class="row">'+dl("f_tuj",c.lokasi,"Pilih atau ketik lokasi tujuan")+'<button class="btn g s" onclick="openMap(\'f_tuj\')">📍 Maps</button></div>'+
 '<div class="row"><div><label>Armada</label>'+dl("f_arm",c.armada,"mis. R1")+'</div><div><label>Crew</label>'+dl("f_crew",c.crew,"Pilih nama crew")+'</div></div>'+
 '<label>Kas masuk (Rp)</label><input type="number" inputmode="numeric" id="f_in" placeholder="mis. 50000">'+
 (showF("kasout")?'<label>Kas keluar (Rp)</label><input type="number" inputmode="numeric" id="f_out" placeholder="kosongkan jika tidak ada"><label>Keterangan kas keluar</label><input id="f_outk" placeholder="mis. BBM, parkir, tol">':'')+
 (showF("km")?'<div class="row"><div><label>KM awal</label><input type="number" inputmode="decimal" id="f_km1"></div><div><label>KM akhir</label><input type="number" inputmode="decimal" id="f_km2"></div></div>':'')+
 (showF("note")?'<label>Catatan</label><textarea id="f_note" rows="2" placeholder="Catatan tambahan"></textarea>':'')+
 (showF("foto")?'<label>Foto dokumentasi (maks. 3)</label><input type="file" id="f_foto" accept="image/*" multiple onchange="addPhotos(this)"><div class="photos" id="prev"></div>':'')+
 '<button class="btn big" id="btnSave" onclick="submitR()">✅ Simpan Laporan</button></div>'
}
function fillDraft(){
 var d=S.draft;if(!d)return;
 var m={f_tgl:d.tgl,f_waktu:d.waktu,f_kep:d.kep,f_nama:d.nama,f_alamat:d.alamat,f_jem:d.jem,f_tuj:d.tuj,f_arm:d.arm,f_crew:d.crew,f_in:d.in,f_out:d.out,f_outk:d.outk,f_note:d.note};
 for(var k in m){if($(k)&&m[k]!=null)$(k).value=m[k]}
 if($("f_hari"))$("f_hari").value=hari($("f_tgl").value);
 S.draft=null;prevPhotos();
}
function openMap(id){var v=$(id).value.trim();if(!v){toast("Isi lokasi dulu");return}window.open(maps(v),"_blank")}
async function dupKemarin(){
 var t=today(),rows;
 try{rows=await sb("laporan?tgl=lt."+t+"&select=data&order=tgl.desc,created_at.desc&limit=30")}catch(e){toast("Gagal mengambil data");return}
 var l=rows.map(function(x){return x.data}),hd=l.filter(function(r){return /hd/i.test(r.kep)}),r=hd[0]||l[0];
 if(!r){toast("Belum ada laporan sebelumnya");return}
 S.draft={tgl:t,waktu:$("f_waktu").value,kep:r.kep,nama:r.nama,alamat:r.alamat,jem:r.jem,tuj:r.tuj,arm:r.arm,crew:r.crew,in:r.in,out:"",outk:"",note:""};
 S.photos=[];render();toast("Data terisi dari laporan terakhir. Cek lalu simpan.")
}
function addPhotos(inp){
 var fs=Array.prototype.slice.call(inp.files).slice(0,3-S.photos.length);
 fs.forEach(function(f){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var s=720/Math.max(im.width,im.height,720),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.photos.push(c.toDataURL("image/jpeg",.6));URL.revokeObjectURL(u);prevPhotos()};im.src=u});
 inp.value=""
}
function prevPhotos(){var p=$("prev");if(p)p.innerHTML=S.photos.map(function(x,i){return '<img src="'+x+'" onclick="S.photos.splice('+i+',1);prevPhotos()" title="Ketuk untuk hapus" alt="Foto">'}).join("")}
function v(id){var e=$(id);return e?e.value.trim():""}
async function submitR(){
 var r={id:"r"+Date.now(),tgl:v("f_tgl"),waktu:v("f_waktu"),kep:v("f_kep"),nama:v("f_nama"),alamat:v("f_alamat"),jem:v("f_jem"),tuj:v("f_tuj"),arm:v("f_arm"),crew:v("f_crew"),in:Number(v("f_in"))||0,out:Number(v("f_out"))||0,outk:v("f_outk"),km1:v("f_km1"),km2:v("f_km2"),note:v("f_note"),foto:S.photos.slice(),ts:Date.now()};
 if(!r.tgl||!r.kep||!r.crew){toast("Tanggal, keperluan, dan crew wajib diisi");return}
 $("btnSave").disabled=true;
 try{await saveReport(r)}catch(e){toast("Gagal menyimpan: "+(e.message||e.code));$("btnSave").disabled=false;return}
 S.photos=[];S.date=r.tgl;toast("Laporan tersimpan ✔");go("rekap")
}
function km(r){var a=parseFloat(r.km1),b=parseFloat(r.km2);return(isNaN(a)||isNaN(b)||b<a)?0:Math.round((b-a)*10)/10}
function day(d){return S.reports.filter(function(r){return r.tgl==d}).sort(function(a,b){return a.waktu>b.waktu?1:-1})}
function wa(r){
 var L=["*Laporan Layanan AmbulanMu Godean*","",
 "*Hari*               : *"+hari(r.tgl)+"*","*Tanggal*        : *"+tgl(r.tgl)+"*","*Waktu*            : *"+r.waktu.replace(":",".")+" WIB*",
 "*Keperluan*     : *"+r.kep+"*","*Nama*             : *"+r.nama+"*","*Alamat*           : *"+r.alamat+"*",
 "*Titik jemput*  : *"+r.jem+"*","*Titik Tujuan*  : *"+r.tuj+"*","*Armada*          : *"+r.arm+"*","*Crew*               : *"+r.crew+"*",
 "*Kas Masuk*     : *"+rp(r.in)+"*","*Kas keluar*     : *"+(r.out?rp(r.out)+(r.outk?" ("+r.outk+")":""):"-")+"*"];
 if(km(r))L.push("*Jarak tempuh*  : *"+km(r)+" KM*");
 L.push("*Note*               : *"+(r.note||"-")+"*","","*Tetap semangat melayani umat*,","*Memberi untuk Negeri*");
 return L.join("\n")
}
function copy(t){(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("Tersalin, tinggal tempel di WhatsApp")},function(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Tersalin")}catch(e){prompt("Salin manual:",t)}a.remove()})}
function copyOne(id){var r=S.reports.filter(function(x){return x.id==id})[0];copy(wa(r))}
async function shareOne(id){
 var r=S.reports.filter(function(x){return x.id==id})[0];
 try{var files=await Promise.all((r.foto||[]).map(function(d,i){return fetch(d).then(function(x){return x.blob()}).then(function(b){return new File([b],"foto"+(i+1)+".jpg",{type:"image/jpeg"})})}));
  if(navigator.canShare&&navigator.canShare({files:files})){await navigator.share({text:wa(r),files:files});return}}catch(e){if(e&&e.name=="AbortError")return}
 copyOne(id)
}
function copyDay(){var l=day(S.date);if(!l.length){toast("Belum ada laporan");return}
 var tot=l.reduce(function(a,r){return a+(r.in||0)},0),out=l.reduce(function(a,r){return a+(r.out||0)},0),k=l.reduce(function(a,r){return a+km(r)},0);
 var t=l.map(wa).join("\n\n━━━━━━━━━━\n\n")+"\n\n*REKAP "+hari(S.date).toUpperCase()+", "+tgl(S.date)+"*\nJumlah layanan : "+l.length+"\nKas masuk : "+rp(tot)+"\nKas keluar : "+rp(out)+"\nSaldo : "+rp(tot-out)+(k?"\nTotal jarak : "+k+" KM":"");
 copy(t)}
function rekapHTML(){
 var l=day(S.date),i=l.reduce(function(a,r){return a+(r.in||0)},0),o=l.reduce(function(a,r){return a+(r.out||0)},0),k=l.reduce(function(a,r){return a+km(r)},0);
 return '<div class="card"><label style="margin-top:0">Tanggal rekap</label><input type="date" value="'+S.date+'" onchange="S.date=this.value;loadDay().then(render)">'+
 '<p class="h2" style="margin-top:12px">'+hari(S.date)+', '+tgl(S.date)+'</p><div class="tot"><div>Layanan<b>'+l.length+'</b></div><div>Total jarak<b>'+k+' KM</b></div><div>Kas masuk<b>'+rp(i)+'</b></div><div>Kas keluar<b>'+rp(o)+'</b></div><div style="grid-column:1/3">Saldo hari ini<b>'+rp(i-o)+'</b></div></div>'+
 '<div class="acts"><button class="btn g" onclick="copyDay()">📲 Salin rekap WA</button><button class="btn" onclick="xl(false)">📊 Excel hari ini</button><button class="btn l" onclick="xl(true)">📊 Excel semua</button></div></div>'+
 (l.length?l.map(item).join(""):'<div class="card hint">Belum ada laporan pada tanggal ini.</div>')
}
function item(r){
 var o=S.open[r.id];
 var h='<div class="card item"><h3>'+esc(r.waktu)+' · '+esc(r.kep)+'</h3><div class="hint">'+esc(r.nama)+' · '+esc(r.armada||r.arm)+' · '+esc(r.crew)+'</div><div>'+esc(r.jem)+' → '+esc(r.tuj)+'</div><div class="hint">Kas masuk '+rp(r.in)+(r.out?' · keluar '+rp(r.out):'')+(km(r)?' · '+km(r)+' KM':'')+'</div>';
 if(r.foto&&r.foto.length)h+='<div class="photos">'+r.foto.map(function(x){return '<img src="'+x+'" onclick="zoom(this.src)" alt="Foto dokumentasi">'}).join("")+'</div>';
 if(o)h+=detail(r);
 h+='<div class="acts"><button class="btn l s" onclick="S.open[\''+r.id+'\']='+(o?'0':'1')+';render()">'+(o?'Tutup':'🗺️ Detail & rute')+'</button><button class="btn g s" onclick="copyOne(\''+r.id+'\')">Salin WA</button><button class="btn s" onclick="shareOne(\''+r.id+'\')">Bagikan + foto</button><button class="btn l s" onclick="dup(\''+r.id+'\')">Duplikat</button></div></div>';
 return h
}
function detail(r){
 return '<div style="margin-top:10px"><svg viewBox="0 0 300 90" width="100%" role="img" aria-label="Rute jemput ke tujuan"><path d="M40 60C100 10 200 110 260 30" stroke="#f57c00" stroke-width="4" stroke-dasharray="8 6" fill="none"/><circle cx="40" cy="60" r="10" fill="#2e7d32"/><circle cx="260" cy="30" r="10" fill="#e53935"/><text x="40" y="84" font-size="11" text-anchor="middle" fill="currentColor">'+esc((r.jem||"").slice(0,22))+'</text><text x="260" y="14" font-size="11" text-anchor="middle" fill="currentColor">'+esc((r.tuj||"").slice(0,22))+'</text></svg>'+
 '<div class="acts"><a class="btn g s" target="_blank" rel="noopener" href="'+dir(r.jem,r.tuj)+'" style="text-decoration:none">🧭 Rute di Google Maps</a><a class="btn l s" target="_blank" rel="noopener" href="'+maps(r.tuj)+'" style="text-decoration:none">📍 Lokasi tujuan</a></div>'+
 '<pre>'+esc(wa(r))+(r.alamat?'':'')+'</pre></div>'
}
function zoom(s){$("bigimg").src=s;$("big").style.display="flex"}
function dup(id){var r=S.reports.filter(function(x){return x.id==id})[0];S.draft={tgl:today(),waktu:"",kep:r.kep,nama:r.nama,alamat:r.alamat,jem:r.jem,tuj:r.tuj,arm:r.arm,crew:r.crew,in:r.in,out:"",outk:"",note:""};S.photos=[];go("isi")}
async function xl(all){
 var l;if(all){try{l=(await sb("laporan?select=data&order=tgl.asc&limit=5000")).map(function(x){return x.data})}catch(e){toast("Gagal mengambil data");return}}else l=day(S.date);
 if(!l.length){toast("Tidak ada data");return}
 var rows=l.map(function(r){return{Hari:hari(r.tgl),Tanggal:tgl(r.tgl),Waktu:r.waktu,Keperluan:r.kep,Nama:r.nama,Alamat:r.alamat,"Titik jemput":r.jem,"Titik tujuan":r.tuj,Armada:r.arm,Crew:r.crew,"Kas masuk":r.in||0,"Kas keluar":r.out||0,"Ket. kas keluar":r.outk,"KM awal":r.km1,"KM akhir":r.km2,"Jarak (KM)":km(r),Catatan:r.note,"Jumlah foto":(r.foto||[]).length}});
 var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Laporan");
 var buf=XLSX.write(wb,{type:"array",bookType:"xlsx"}),name="laporan-ambulanmu-"+(all?"semua":S.date)+".xlsx";
 try{var d=await claude.use("downloads");if(d){await d.save({filename:name,data:new Blob([buf])});return}}catch(e){if(e&&e.code=="user_declined")return}
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf]));a.download=name;a.click()
}
function masterHTML(){
 var c=S.cfg,h='<div class="card"><p class="h2">Master data & tata letak</p><p class="hint">Ubah daftar pilihan di bawah. Laporan yang sudah tersimpan tidak ikut berubah, karena teksnya disimpan apa adanya.</p>';
 [["crew","Daftar crew"],["armada","Daftar armada"],["keperluan","Daftar keperluan"],["lokasi","Daftar lokasi (rumah sakit, dll.)"]].forEach(function(x){
  h+='<label>'+x[1]+'</label><textarea id="m_'+x[0]+'" rows="4">'+esc(c[x[0]].join("\n"))+'</textarea><div class="hint">Satu nama per baris</div>'});
 h+='<label>Tampilkan kolom di form</label>';
 for(var k in FIELDS)h+='<label style="font-weight:400;color:var(--tx)"><input type="checkbox" style="width:auto" id="h_'+k+'" '+(showF(k)?"checked":"")+'> '+FIELDS[k]+'</label>';
 return h+'<button class="btn g big" onclick="saveMaster()">💾 Simpan pengaturan</button></div>'
}
async function saveMaster(){
 if(prompt("PIN admin:")!==ADMIN_PIN){toast("PIN salah");return}
 ["crew","armada","keperluan","lokasi"].forEach(function(k){S.cfg[k]=$("m_"+k).value.split("\n").map(function(s){return s.trim()}).filter(Boolean)});
 S.cfg.hide=Object.keys(FIELDS).filter(function(k){return !$("h_"+k).checked});
 try{await saveCfg();toast("Pengaturan tersimpan ✔")}catch(e){toast("Gagal menyimpan")}
}
init();
</script>
