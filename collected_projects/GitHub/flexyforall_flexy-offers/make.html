<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offer link</title>
<style>
:root{--ink:#0D0D0D;--fg:#fff;--dim:rgba(255,255,255,.65);--line:rgba(255,255,255,.14);--lilac:#9999A8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{width:min(560px,100%);display:grid;gap:20px}
h1{margin:0;font-weight:500;font-size:32px;letter-spacing:-.02em}
p{margin:0;color:var(--dim);line-height:1.5}
label{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lilac)}
input{width:100%;margin-top:8px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#191A1D;color:var(--fg);font-size:15px}
input:focus{outline:2px solid var(--fg);outline-offset:2px}
.out{display:none;gap:10px}
.out.on{display:grid}
.row{display:flex;gap:8px}
.row input{margin:0}
button,a.btn{flex:none;padding:0 18px;border-radius:12px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
button:hover,a.btn:hover{background:var(--fg);color:var(--ink)}
.err{color:#ff9b8a;display:none}
</style>
</head>
<body>
<main>
  <h1>Offer link</h1>
  <p>Paste the client's Google Sheet link. The sheet must be shared as “Anyone with the link → Viewer”.</p>
  <div><label for="src">Google Sheet link</label><input id="src" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off"></div>
  <p class="err" id="err">This doesn’t look like a Google Sheet link.</p>
  <div class="out" id="out">
    <label for="link">Link for the client</label>
    <div class="row"><input id="link" readonly><button id="copy" type="button">Copy</button><a class="btn" id="open" target="_blank" rel="noopener">Open</a></div>
  </div>
</main>
<script>
const src = document.getElementById('src'), out = document.getElementById('out'), link = document.getElementById('link'), err = document.getElementById('err');
const base = location.href.replace(/make\.html.*$/, '');
src.addEventListener('input', () => {
  const m = src.value.match(/\/d\/([\w-]{20,})/) || src.value.trim().match(/^([\w-]{20,})$/);
  err.style.display = src.value && !m ? 'block' : 'none';
  out.classList.toggle('on', !!m);
  if (m) { link.value = base + '?id=' + m[1]; document.getElementById('open').href = link.value; }
});
document.getElementById('copy').addEventListener('click', async e => {
  try { await navigator.clipboard.writeText(link.value); e.target.textContent = 'Copied'; }
  catch { link.select(); }
  setTimeout(() => e.target.textContent = 'Copy', 1500);
});
</script>
</body>
</html>
