<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102319"><title>Azeroth Chronicles Expanded Prototype</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles/prototype.css"></head>
<body><canvas id="world" aria-label="Isometric adventure world"></canvas>
<aside id="hud"><button id="menu-button" aria-label="Open game menu">☰ Menu <small>Esc</small></button><h1>Azeroth Chronicles</h1><div id="hero-stats"></div><div id="location"></div><div id="objective"></div><div id="status" role="status"></div><button id="interact-button">Interact <small>E</small></button><button id="squad-button">Squad cursor <small>Tab</small></button></aside>
<div id="message" role="status"></div><div id="stamina-status" hidden></div><button id="sprint-button" hidden>Sprint · Q</button><div id="skills" aria-label="Skills"></div>
<div id="movement"><div id="joystick" role="button" tabindex="0" aria-label="Move hero or squad cursor"><div id="stick"></div></div><button id="order-button">Confirm / order<br><small>F</small></button></div>
<section id="modal" hidden aria-modal="true" role="dialog" aria-labelledby="modal-title"><h2 id="modal-title"></h2><div id="modal-description"></div><div id="modal-actions"></div><button id="close-button">Back <small>F / Esc</small></button></section>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<script src="./src/sprint.js"></script><script src="./src/prototype/data.js"></script><script src="./src/prototype/rules.js"></script><script src="./src/prototype/engine.js"></script><script src="./src/prototype/audio.js"></script><script src="./src/prototype/visuals.js"></script><script src="./src/prototype/app.js"></script>
</body></html>
