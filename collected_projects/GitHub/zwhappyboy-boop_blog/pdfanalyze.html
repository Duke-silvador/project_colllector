<style>
#pdf-app{max-width:900px;margin:0 auto;padding:20px}
.xa-notice{background:#f0f5ff;border:1px solid #d7dee9;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#42506b;line-height:1.7}
.xa-notice b{color:#b45309}
.xa-filelabel{display:flex;align-items:center;gap:10px;padding:14px 18px;border:2px dashed #c5cdd9;border-radius:12px;cursor:pointer;transition:border-color .2s,background .2s;background:#fafbfd;font-size:14px;color:#33415e}
.xa-filelabel:hover{border-color:#2563eb;background:#f0f5ff}
.xa-filelabel.has-file{border-color:#16a34a;background:#f0fdf4}
.xa-filelabel .fname{color:#728095;font-size:13px;margin-left:auto}
.xa-sheets{margin:10px 0;font-size:13px;color:#728095}
.xa-modelbl{margin:16px 0 8px;font-size:14px;font-weight:600;color:#33415e}
.xa-modebtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.xa-modebtns .szbtn{padding:10px 20px;font-size:14px}
.xa-modebtns .szbtn .mdesc{display:block;font-size:12px;font-weight:400;opacity:.75;margin-top:2px}
.xa-qwrap{display:none;margin:12px 0}
.xa-qwrap.show{display:block}
.xa-qwrap label{display:block;margin-bottom:6px;font-size:13px;color:#728095}
.xa-qwrap textarea{width:100%;box-sizing:border-box;min-height:70px;padding:12px;border:1px solid #d7dee9;border-radius:10px;font-size:14px;font-family:inherit;resize:vertical;background:#fff;color:#33415e}
.xa-qwrap textarea:focus{outline:none;border-color:#2563eb}
.xa-run{padding:12px 28px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:#2563eb;color:#fff;transition:opacity .15s;margin-top:6px}
.xa-run:hover{opacity:.88}
.xa-run:disabled{opacity:.4;cursor:not-allowed}
.xa-stop{display:none;padding:12px 24px;border:none;border-radius:12px;font-size:15px;cursor:pointer;background:#e53e3e;color:#fff;margin-top:6px;margin-left:10px}
.xa-status{margin:14px 0 6px;font-size:14px;color:#2563eb;font-weight:600;display:none}
.xa-status.err{color:#e53e3e}
.xa-out{margin-top:10px;background:#fafbfd;border:1px solid #d7dee9;border-radius:12px;padding:18px 20px;font-size:14px;line-height:1.8;color:#33415e;overflow-wrap:break-word}
.xa-out .mdcontent>*:first-child{margin-top:0}
.xa-out .mdcontent>*:last-child{margin-bottom:0}
.xa-out .mdcontent h2,.xa-out .mdcontent h3,.xa-out .mdcontent h4,.xa-out .mdcontent h5{margin:16px 0 8px;color:#2563eb;line-height:1.4}
.xa-out .mdcontent h2{font-size:18px}.xa-out .mdcontent h3{font-size:16px}.xa-out .mdcontent h4{font-size:15px}.xa-out .mdcontent h5{font-size:14px}
.xa-out .mdcontent p{margin:8px 0}
.xa-out .mdcontent ul{margin:8px 0;padding-left:22px}
.xa-out .mdcontent ul.ol{list-style:decimal}
.xa-out .mdcontent li{margin:4px 0}
.xa-out .mdcontent code{background:#eef2f8;border-radius:4px;padding:1px 6px;font-size:13px;color:#b91c1c}
.xa-out .mdcontent pre{background:#f0f5ff;border:1px solid #d7dee9;border-radius:8px;padding:12px;overflow-x:auto;margin:10px 0}
.xa-out .mdcontent pre code{background:none;padding:0;color:#33415e}
.xa-out .mdcontent b{color:#1e293b}
.xa-out .mdcontent .mdtable{overflow-x:auto;margin:10px 0;border:1px solid #e2e8f0;border-radius:8px}
.xa-out .mdcontent table{border-collapse:collapse;width:100%;font-size:13px}
.xa-out .mdcontent th,.xa-out .mdcontent td{border:1px solid #e8edf3;padding:6px 10px;white-space:nowrap}
.xa-out .mdcontent th{background:#f0f5ff;color:#33415e;font-weight:600}
.xa-out .mdcontent td{color:#33415e}
.xa-cursor{display:inline-block;width:8px;height:15px;background:#2563eb;vertical-align:-2px;margin-left:2px;animation:xablink 1s infinite}
@keyframes xablink{50%{opacity:0}}
.xa-empty{color:#a5b0c4;font-size:13px;text-align:center;padding:20px 0}
.xa-progress{margin:10px 0;font-size:13px;color:#728095}
.xa-progress .bar{height:6px;background:#e2e8f0;border-radius:3px;margin-top:6px;overflow:hidden}
.xa-progress .bar .fill{height:100%;background:#2563eb;border-radius:3px;transition:width .3s;width:0}
body.dark .xa-notice{background:#171d28;border-color:#303846;color:#aebad0}
body.dark .xa-filelabel{background:#171d28;border-color:#303846;color:#c7d2e4}
body.dark .xa-filelabel:hover{background:#1a2230;border-color:#3b82f6}
body.dark .xa-filelabel.has-file{background:#122117;border-color:#2f5e44}
body.dark .xa-modelbl{color:#c7d2e4}
body.dark .xa-qwrap label{color:#aebad0}
body.dark .xa-qwrap textarea{background:#171d28;border-color:#303846;color:#c7d2e4}
body.dark .xa-qwrap textarea:focus{border-color:#3b82f6}
body.dark .xa-out{background:#171d28;border-color:#303846;color:#c7d2e4}
body.dark .xa-out .mdcontent h2,body.dark .xa-out .mdcontent h3,body.dark .xa-out .mdcontent h4,body.dark .xa-out .mdcontent h5{color:#7aa5f8}
body.dark .xa-out .mdcontent code{background:#1a2230;color:#f8b4b4}
body.dark .xa-out .mdcontent pre{background:#1a2230;border-color:#303846}
body.dark .xa-out .mdcontent pre code{color:#c7d2e4}
body.dark .xa-out .mdcontent b{color:#e8eef8}
body.dark .xa-out .mdcontent .mdtable{border-color:#303846}
body.dark .xa-out .mdcontent th{background:#1a2230;color:#c7d2e4;border-color:#303846}
body.dark .xa-out .mdcontent td{border-color:#303846;color:#c7d2e4}
body.dark .xa-status{color:#7aa5f8}
body.dark .xa-status.err{color:#f8b4b4}
body.dark .xa-progress .bar{background:#303846}
body.dark .xa-progress .bar .fill{background:#3b82f6}
