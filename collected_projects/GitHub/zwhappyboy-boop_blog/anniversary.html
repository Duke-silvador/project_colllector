<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纪念日 · 周伊萱</title>
  <style>
    :root {
      --bg-color: #fcfbf9;
      --card-bg: #ffffff;
      --text-main: #2c2c2c;
      --text-muted: #666666;
      --accent: #8c7b6c;
      --border-color: #f0ece9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      background-color: rgba(252, 251, 249, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-main);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--accent);
    }

    .page-hero {
      position: relative;
      height: 50vh;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url('anniversary.jpg') center/cover no-repeat;
      color: #ffffff;
      padding: 0 1rem;
    }

    .page-hero .subtitle {
      display: block;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #ffffff;
      opacity: 0.85;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .page-hero h1 {
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: 3px;
      margin-bottom: 0.8rem;
    }

    .page-hero p {
      color: #ffffff;
      opacity: 0.9;
      font-size: 1.05rem;
      letter-spacing: 1px;
      max-width: 560px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.4rem;
      font-size: 0.9rem;
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.6);
      transition: border-color 0.3s, opacity 0.3s;
    }

    .back-link:hover {
      border-color: #ffffff;
      opacity: 0.8;
    }

    .gallery {
      padding: 2rem 2rem 5rem;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .gallery figure {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .gallery figure:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .gallery img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      background-color: var(--border-color);
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 2.5rem 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      background-color: var(--card-bg);
    }

    @media (max-width: 768px) {
      .page-hero h1 {
        font-size: 1.6rem;
      }
      .gallery {
        padding: 1.5rem 1.5rem 3rem;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航栏 -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">周伊萱</a>
      <nav>
        <a href="index.html#home">首页</a>
        <a href="index.html#portfolio">作品集</a>
      </nav>
    </div>
  </header>

  <!-- 页面标题 -->
  <div class="page-hero">
    <span class="subtitle">ANNIVERSARY</span>
    <h1>纪念日</h1>
    <p>定格爱与陪伴的岁月足迹</p>
    <a href="index.html#portfolio" class="back-link">← 返回作品集</a>
  </div>

  <!-- 相册区域 -->
  <!--
    图片放在 anniversary-photos 文件夹内，按 01.jpg、02.jpg、03.jpg ... 命名。
    下面已预留 9 个位置，如果照片更多，复制一个 <figure> 块并把序号改成对应数字即可；
    如果照片更少，删掉多余的 <figure> 块即可。
  -->
  <section class="gallery">
    <figure><img src="anniversary-photos/01.jpg" alt="纪念日照片 01"></figure>
    <figure><img src="anniversary-photos/02.jpg" alt="纪念日照片 02"></figure>
    <figure><img src="anniversary-photos/03.jpg" alt="纪念日照片 03"></figure>
    <figure><img src="anniversary-photos/04.jpg" alt="纪念日照片 04"></figure>
    <figure><img src="anniversary-photos/05.jpg" alt="纪念日照片 05"></figure>
    <figure><img src="anniversary-photos/06.jpg" alt="纪念日照片 06"></figure>
    <figure><img src="anniversary-photos/07.jpg" alt="纪念日照片 07"></figure>
    <figure><img src="anniversary-photos/08.jpg" alt="纪念日照片 08"></figure>
    <figure><img src="anniversary-photos/09.jpg" alt="纪念日照片 09"></figure>
    <figure><img src="anniversary-photos/10.jpg" alt="纪念日照片 10"></figure>
    <figure><img src="anniversary-photos/11.jpg" alt="纪念日照片 11"></figure>
    <figure><img src="anniversary-photos/12.jpg" alt="纪念日照片 12"></figure>
  </section>

  <!-- 页脚版权信息 -->
  <footer>
    <p>© 2026 周伊萱 · 家庭摄影 | 用镜头，记录爱与生活</p>
  </footer>

</body>
</html>
