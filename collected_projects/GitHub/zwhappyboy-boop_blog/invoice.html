<script>
(function(){
const WORKER_URL="https://api.zhouyixuan.com";
const POLL_MS=5000;
const MAX_POLL=60;
const MAX_INVOICES=50;
const IMG_EXTS=['.png','.jpg','.jpeg','.gif','.bmp','.tiff','.tif','.webp'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const FALSE_SWIFTS=['TRANSFER','PAYMENT','INVOICE','REMITTANCE','INCLUDED','CROSS','BORDER'];

function T(){return window.__tt?window.__tt():e.en}
/* ========== 通用工具函数 ========== */
function extractSWIFT(text){const c=text.match(/\b([A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?)\b/g)||[];for(const x of c){if(!FALSE_SWIFTS.includes(x))return x}return''}
function isAmountValue(t){return/^[$\u20ac\u00a3\u00a5]?\s*[\d,]+\.\d+$/.test(t)||t==='Included'||/^[$\u20ac\u00a3\u00a5]?\s*0\.00$/.test(t)}
function extractAmountNum(t){let m=t.match(/([\d,]+\.\d+)/);return m?m[1]:(t==='Included'?'Included':'')}
function cleanNum(s){return s?s.replace(/[,\s]/g,''):''}
function normDate(d){if(!d)return'';let p=d.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(p)return p[1]+'-'+p[2].padStart(2,'0')+'-'+p[3].padStart(2,'0');return d}

/* ========== 国家识别 ========== */
function detectCountry(els){
  const all=els.map(e=>(e.text||'').trim()).filter(Boolean).join(' ');
  const cn=(all.match(/[\u4e00-\u9fa5]/g)||[]).length;
  if(cn/all.length>0.15)return 'CN';
  if(/\u5fae\u4fe1\u516c\u4f17\u53f7|WeChat|Alipay|\u652f\u4ed8\u5b9d/i.test(all))return 'CN';
  if(/\bVAT\b/i.test(all)&&/\bEUR\b/i.test(all))return 'EU';
  if(/\u00a3|\bGBP\b|\bUK\b|\bUnited Kingdom\b/i.test(all))return 'UK';
  if(/\$\s*[\d,]+\.\d{2}|\bUSD\b|\bUnited States\b|\bEIN\b/i.test(all))return 'US';
  if(/\bVAT\b/i.test(all))return 'EU';
  if(/\u20ac|\bEUR\b/i.test(all))return 'EU';
  return 'OTHER';
}

/* ========== 中国发票解析（增值税电子普通发票 + 医疗收费票据） ========== */
function parseCN(els){
  let pages=[];let cur=[];
  for(const el of els){
    if(el.type==='PageNumber'){if(cur.length>0)pages.push(cur);cur=[]}
    else cur.push(el);
  }
  if(cur.length>0)pages.push(cur);
  if(pages.length===0&&els.length>0)pages=[els];
  // merge trailing detail pages (e.g. medical fee detail) into the main ticket page
  let merged=[];
  for(const p of pages){
    const pt=p.map(e=>(e.text||'')).join('\n');
    if(merged.length>0&&/\u533b\u7597\u6536\u8d39\u660e\u7ec6|\u6240\u5c5e\u7535\u5b50\u7968\u636e/.test(pt)){
      merged[merged.length-1]=merged[merged.length-1].concat(p)
    }else merged.push(p)
  }
  return merged.map(p=>parseSingleCN(p));
}

function parseSingleCN(els){
  const all=els.map(e=>(e.text||'').trim()).filter(Boolean).join('\n');
  let r={
    country:'CN',
    core:{invoice_number:'',invoice_date:'',seller_name:'',buyer_name:'',seller_tax_id:'',buyer_tax_id:'',currency:'CNY',subtotal:'',tax_amount:'',total_amount:'',payment_status:'',due_date:''},
    taxes:[],
    country_specific:{invoice_code:'',check_code:'',machine_number:'',payee:'',reviewer:'',drawer:'',seller_address:'',seller_bank:'',buyer_address:'',buyer_bank:'',amount_words:''}
  };

  let m;
  // 发票代码
  m=all.match(/\u53d1\u7968\u4ee3\u7801[\uff1a:]\s*(\S+)/);if(m)r.country_specific.invoice_code=m[1];
  // 发票号码
  m=all.match(/\u53d1\u7968\u53f7\u7801[\uff1a:]\s*(\S+)/);if(m)r.core.invoice_number=m[1];
  if(!r.core.invoice_number){m=all.match(/No\.\s*(\d+)/);if(m)r.core.invoice_number=m[1]}
  // 开票日期
  m=all.match(/\u5f00\u7968\u65e5\u671f[\uff1a:]\s*(\d{4}[-\/\u5e74]\d{1,2}[-\/\u6708]\d{1,2}\u65e5?)/);
  if(m){r.core.invoice_date=normDate(m[1].replace(/\u5e74/g,'-').replace(/\u6708/g,'-').replace(/\u65e5/g,''))}
  // 校验码
  m=all.match(/\u6821\u9a8c\u7801[\uff1a:]\s*((?=[0-9a-fA-F]*[a-fA-F])[0-9a-fA-F]{4,32})/);if(m)r.country_specific.check_code=m[1];
  if(!r.country_specific.check_code){m=all.match(/\u6821\u9a8c\u7801[\uff1a:]\s*([\d\s]+)/);if(m)r.country_specific.check_code=m[1].replace(/\s/g,'')}
  // 机器编号
  m=all.match(/\u673a\u5668\u7f16\u53f7[\uff1a:]\s*(\S+)/);if(m)r.country_specific.machine_number=m[1];

  // Table 元素中的购销方信息
  const tables=els.filter(e=>e.type==='Table').map(e=>(e.text||'').trim());
  const infoTable=tables.find(t=>/\u540d\s*\u79f0/.test(t))||'';

  if(infoTable){
    // 购买方名称：第一个"名 称"后面，排除"纳税人识"开头的误匹配
    let nameParts=infoTable.split(/\u540d\s*\u79f0/);
    if(nameParts.length>=2){
      let buyerRaw=nameParts[1].trim();
      // 排除"纳税人识"开头的误匹配
      if(!/^\u7eb3\u7a0e\u4eba\u8bc6/.test(buyerRaw)){
        m=buyerRaw.match(/^([\u4e00-\u9fa5\uff08\uff09\w]+(?:\u80a1\u4efd(?:\u6709\u9650)?\u516c\u53f8|\u6709\u9650\u516c\u53f8|\u80a1\u4efd\u6709\u9650\u516c\u53f8)?)/);
        if(m)r.core.buyer_name=m[1].trim();
      }
    }
    // 销售方名称：第二个"名 称"后面，排除"纳税人识"开头的误匹配
    if(nameParts.length>=3){
      let sellerRaw=nameParts[2].trim();
      if(!/^\u7eb3\u7a0e\u4eba\u8bc6/.test(sellerRaw)){
        m=sellerRaw.match(/^([\u4e00-\u9fa5\uff08\uff09\w]+(?:\u80a1\u4efd(?:\u6709\u9650)?\u516c\u53f8|\u6709\u9650\u516c\u53f8|\u80a1\u4efd\u6709\u9650\u516c\u53f8)?)/);
        if(m)r.core.seller_name=m[1].trim();
      }
    }
    // 纳税人识别号：可能有空格分隔"识 别号"
    let taxParts=infoTable.split(/\u7eb3\u7a0e\u4eba\u8bc6\s*\u522b\u53f7/);
    if(taxParts.length>=2){m=taxParts[1].match(/^[\s]*([A-Z0-9]{15,20})/);if(m)r.core.buyer_tax_id=m[1]}
    if(taxParts.length>=3){m=taxParts[2].match(/^[\s]*([A-Z0-9]{15,20})/);if(m)r.core.seller_tax_id=m[1]}
    // 地址电话：用"售 方"分割，前面是购买方地址，后面是销售方地址
    let addrParts=infoTable.split(/\u5730\u5740\u3001\u7535\s*\u8bdd/);
    if(addrParts.length>=2){m=addrParts[1].match(/^[\s]*([\u4e00-\u9fa5\u0-9\u53f7-]+(?:\s+\d{3,4}-?\s?\d{4,8})?)/);if(m)r.country_specific.buyer_address=m[1].trim()}
    if(addrParts.length>=3){
      // 销售方地址：跳过"开户行及"等误匹配，只取实际地址
      let sellerAddrRaw=addrParts[2].trim();
      // 跳过"开户行及"开头的非地址文本
      if(!/^\u5f00\u6237\u884c\u53ca/.test(sellerAddrRaw)){
        if(m=addrParts[2].match(/^[\s]*([\u4e00-\u9fa5\u0-9\u53f7-\u7ecf\u6d4e\u533a\u5757\u53f7\u8def\u8857\u5927\u9053\u5df7\u6751\u9547\u56ed\u53b7]+(?:\s+\d{3,4}-?\s?\d{4,8})?)/)){r.country_specific.seller_address=m[1].trim()}
      }
    }
    // 开户行及账号：用最后一个"开户行及 账号"后面的内容提取销售方银行
    let bankParts=infoTable.split(/\u5f00\u6237\u884c\u53ca\s*\u8d26\u53f7/);
    if(bankParts.length>=2){
      // 第一个开户行=购买方
      m=bankParts[1].match(/^[\s]*([\u4e00-\u9fa5]+(?:\u94f6\u884c|\u5546\u52a1\u7a0e|\u5de5\u884c|\u5efa\u8bbe\u94f6\u884c|\u4e2d\u56fd\u94f6\u884c|\u519c\u4e1a\u94f6\u884c|\u62db\u5546\u94f6\u884c|\u4ea4\u901a\u94f6\u884c|\u90ae\u653f|\u6c11\u751f|\u5149\u5927|\u6d66\u53d1|\u5e73\u5b89)?\u652f\u884c)\s+([\d]+)/);
      if(m)r.country_specific.buyer_bank=m[0].trim();
    }
    if(bankParts.length>=3){
      // 最后一个开户行=销售方，但后面可能先跟公司名再跟银行
      let sellerBankRaw=bankParts[bankParts.length-1].trim();
      // 先尝试直接匹配银行名+账号
      m=sellerBankRaw.match(/([\u4e00-\u9fa5]+(?:\u94f6\u884c|\u5546\u52a1\u7a0e|\u5de5\u884c|\u5efa\u8bbe\u94f6\u884c|\u4e2d\u56fd\u94f6\u884c|\u519c\u4e1a\u94f6\u884c|\u62db\u5546\u94f6\u884c|\u4ea4\u901a\u94f6\u884c|\u90ae\u653f|\u6c11\u751f|\u5149\u5927|\u6d66\u53d1|\u5e73\u5b89)?\u652f\u884c)\s+([\d]+)/);
      if(m)r.country_specific.seller_bank=m[0].trim();
      // 如果销售方名称为空，从开户行段提取（可能在公司名后面）
      if(!r.core.seller_name){
        // 尝试匹配公司名（不以银行名结尾的中文段）
        let bankAll=bankParts[bankParts.length-1].trim();
        m=bankAll.match(/^([\u4e00-\u9fa5\uff08\uff09\w]+(?:\u80a1\u4efd(?:\u6709\u9650)?\u516c\u53f8|\u6709\u9650\u516c\u53f8|\u80a1\u4efd\u6709\u9650\u516c\u53f8)?)/);
        if(m&&m[1].length>3)r.core.seller_name=m[1].trim();
      }
      // 如果销售方税号为空，从最后一个开户行段提取
      if(!r.core.seller_tax_id){
        m=bankParts[bankParts.length-1].match(/([A-Z0-9]{15,20})/);
        if(m)r.core.seller_tax_id=m[1];
      }
      // 如果销售方地址为空，从最后一个开户行段提取
      if(!r.country_specific.seller_address){
        let bankAll=bankParts[bankParts.length-1].trim();
        // 跳过公司名，取地址部分
        let afterName=bankAll.replace(/^[\u4e00-\u9fa5\uff08\uff09\w]+(?:\u80a1\u4efd(?:\u6709\u9650)?\u516c\u53f8|\u6709\u9650\u516c\u53f8|\u80a1\u4efd\u6709\u9650\u516c\u53f8)?/,'').trim();
        m=afterName.match(/([\u4e00-\u9fa5][\u4e00-\u9fa5\u0-9\u53f7-\u7ecf\u6d4e\u533a\u5757\u53f7\u8def\u8857\u5927\u9053\u5df7\u6751\u9547\u56ed\u53b7\u53eb\u53eb\u53f7]+(?:\s+\d{3,4}-?\s?\d{4,8})?)/);
        if(m)r.country_specific.seller_address=m[1].trim();
      }
    }
  }

  // 医疗收费票据回退
  if(!r.core.buyer_name){m=all.match(/\u4ea4\u6b3e\u4eba[\uff1a:]\s*([\u4e00-\u9fa5]+)/);if(m)r.core.buyer_name=m[1]}
  if(!r.core.seller_name){m=all.match(/\u6536\u6b3e\u5355\u4f4d[\uff08(]\u7ae0[)\uff09][\uff1a:]?\s*([\u4e00-\u9fa5]+)/);if(m)r.core.seller_name=m[1]}

  // 金额信息从商品明细 Table 提取
  const amtTable=tables.find(t=>/\u5408\s*\u8ba1|\u4ef7\u7a0e\u5408\u8ba1|\u91d1\u989d\u5408\u8ba1/.test(t))||'';
  if(amtTable){
    // 合计金额（不含税）："合 计 ¥ 8,800.00"
    m=amtTable.match(/\u5408\s*\u8ba1\s*[\uffa5\u00a5]?\s*([\d,.]+)/);
    if(m)r.core.subtotal=cleanNum(m[1]);
    // 价税合计（大写）和小写
    // 格式: 价税合计 （大写） [⊗或备注] [大写金额] ... （小写）¥ [数字]
    // 大写金额可能被 ⊗ 或备注文字隔开，需灵活匹配
    m=amtTable.match(/\u4ef7\u7a0e\u5408\u8ba1[\uff08(]\u5927\u5199[)\uff09]\s*[\u2297\u02c3]?\s*([\u4e00-\u9fa5\u96f6\u58f9\u8d30\u53c1\u8086\u4f0d\u9646\u67d2\u634c\u7396\u62fe\u4f70\u4edf\u4e07\u4ebf\u89d2\u5206\u6574\u6b63]+[\u5143\u6574])/);
    if(m){r.country_specific.amount_words=m[1]}
    // 修复：大写金额可能不在"价税合计（大写）"紧跟的位置，搜索整个金额表
    if(!r.country_specific.amount_words){
      m=amtTable.match(/([\u96f6\u58f9\u8d30\u53c1\u8086\u4f0d\u9646\u67d2\u634c\u7396\u62fe\u4f70\u4edf\u4e07\u4ebf\u89d2\u5206\u6574\u6b63]+[\u5143\u6574])/);
      if(m)r.country_specific.amount_words=m[1];
    }
    // 小写金额："（小写）¥ 9,328.00"
    m=amtTable.match(/\uff08\u5c0f\u5199\uff09\s*[\uffa5\u00a5]?\s*([\d,.]+)/);
    if(m)r.core.total_amount=cleanNum(m[1]);
    // 回退：如果没匹配到小写，尝试从"价税合计...¥"提取
    if(!r.core.total_amount){
      m=amtTable.match(/\u4ef7\u7a0e\u5408\u8ba1[\s\S]*?[\uffa5\u00a5]\s*([\d,.]+)/);
      if(m)r.core.total_amount=cleanNum(m[1]);
    }
    // 税额：取"税额"到"（小写）"之间的最后一个 ¥ 金额（合计税额）
    let afterTax=amtTable.split(/\u7a0e\u989d/)[1]||'';
    let beforeSmall=afterTax.split(/\uff08\u5c0f\u5199\uff09/)[0]||'';
    let yenMatches=beforeSmall.match(/[\uffa5\u00a5]\s*([\d,.]+)/g);
    if(yenMatches&&yenMatches.length>0){
      let lastYen=yenMatches[yenMatches.length-1].match(/[\uffa5\u00a5]\s*([\d,.]+)/);
      if(lastYen)r.core.tax_amount=cleanNum(lastYen[1]);
    }else{
      // 回退：直接匹配"税额"后第一个数字
      m=afterTax.match(/([\d,.]+)/);
      if(m)r.core.tax_amount=cleanNum(m[1]);
    }
    // 税率明细：从商品明细中提取 "6% 222.00" 这样的组合
    let rateMatches=amtTable.match(/(\d+)%\s*[\uffa5\u00a5]?\s*([\d,.]+)/g);
    if(rateMatches){
      for(const rm of rateMatches){
        let parts=rm.match(/(\d+)%\s*[\uffa5\u00a5]?\s*([\d,.]+)/);
        if(parts){
          let rate=parts[1];
          let amount=cleanNum(parts[2]);
          r.taxes.push({type:'VAT',rate:parseFloat(rate)/100,amount:amount});
        }
      }
    }
    // 如果有税率明细但tax_amount为空，用税率明细求和
    if(!r.core.tax_amount&&r.taxes.length>0){
      r.core.tax_amount=r.taxes.reduce((s,t)=>s+parseFloat(t.amount||0),0).toFixed(2);
    }
  }

  // 医疗票据金额回退
  if(!r.core.total_amount){m=all.match(/\u91d1\u989d\u5408\u8ba1[\uff08(]\u5927\u5199[)\uff09]\s*([\u4e00-\u9fa5\u96f6\u58f9\u8d30\u53c1\u8086\u4f0d\u9646\u67d2\u634c\u7396\u62fe\u4f70\u4edf\u4e07\u4ebf\u89d2\u5206\u6574\u6b63]+)\s*[\uff08(]\u5c0f\u5199[)\uff09]\s*([\d.]+)/);if(m){r.country_specific.amount_words=m[1];r.core.total_amount=m[2]}}

  // 开票人、收款人、复核人
  m=all.match(/\u6536\u6b3e\u4eba[\uff1a:]\s*(\S+)/);if(m)r.country_specific.payee=m[1];
  m=all.match(/\u590d\u6838[\uff1a:]\s*(\S+)/);if(m)r.country_specific.reviewer=m[1];
  m=all.match(/\u5f00\u7968\u4eba[\uff1a:]\s*(\S+)/);if(m)r.country_specific.drawer=m[1];

  // 计算subtotal如果只有total
  if(r.core.total_amount&&r.core.tax_amount&&!r.core.subtotal){
    r.core.subtotal=(parseFloat(r.core.total_amount)-parseFloat(r.core.tax_amount)).toFixed(2);
  }

  return r;
}

/* ========== 美国发票解析 ========== */
function parseUS(els){
  let pages=[];let cur=[];
  for(const el of els){
    if(el.type==='PageNumber'){if(cur.length>0)pages.push(cur);cur=[]}
    else cur.push(el);
  }
  if(cur.length>0)pages.push(cur);
  if(pages.length===0&&els.length>0)pages=[els];
  return pages.map(p=>parseSingleUS(p));
}

function parseSingleUS(els){
  const all=els.map(e=>(e.text||'').trim()).filter(Boolean).join('\n');
  const tt=els.filter(e=>e.type==='Table').map(e=>(e.text||'').trim());
  let r={
    country:'US',
    core:{invoice_number:'',invoice_date:'',seller_name:'',buyer_name:'',seller_tax_id:'',buyer_tax_id:'',currency:'USD',subtotal:'',tax_amount:'',total_amount:'',payment_status:'',due_date:''},
    taxes:[],
    country_specific:{po_number:'',payment_terms:'',payment_method:'',bank_name:'',swift_bic:'',iban:'',account_number:'',seller_address:'',item_description:'',discount:'',freight:''}
  };

  let m;
  // Invoice Number
  m=all.match(/#\s*([A-Z]{2,}[-/]?\d{2,}[-/]?\d*)/);if(m)r.core.invoice_number=m[1].replace(/\s+/g,'');
  if(!r.core.invoice_number){m=all.match(/INVOICE\s*#?\s*([A-Z0-9][-A-Z0-9]+)/i);if(m)r.core.invoice_number=m[1]}

  const vIdx=els.findIndex(e=>(e.text||'').includes('VENDOR')&&e.type==='Title');
  const bIdx=els.findIndex(e=>(e.text||'').includes('BILL TO')&&e.type==='Title');

  if(vIdx>=0&&bIdx>=0&&bIdx===vIdx+1){
    for(let i=bIdx+1;i<els.length;i++){
      if(els[i].type==='Title'||els[i].type==='Table')break;
      const t=(els[i].text||'').trim();if(!t)continue;
      let es=t.split(/Email:\s*\S+/i);let vs=es[0]||t;let cs=es[1]||'';
      let vtm=vs.match(/EIN\s*\/\s*Tax ID:\s*(\S+)/i);if(vtm)r.core.seller_tax_id=vtm[1];
      if(!r.core.seller_tax_id){let vvm=vs.match(/(?:EU VAT ID|VAT ID|UEN|BRN)\s*\/\s*Tax ID:\s*(\S+)/i);if(vvm)r.core.seller_tax_id=vvm[1]}
      let ctm=cs.match(/(?:BRN|VAT ID|EIN|ABN|UEN)\s*\/\s*Tax ID:\s*(\S+)/i);if(ctm)r.core.buyer_tax_id=ctm[1];
      let vm=t.match(/^([A-Z][\w &.]+?(?:Inc\.|LLC|Ltd\.|GmbH|B\.V\.|Pty|S\.p\.A\.))\s/);if(vm)r.core.seller_name=vm[1].trim();
      if(r.core.seller_name){let an=t.substring(r.core.seller_name.length).trim();let ae=an.search(/EIN|VAT ID|UEN|BRN/i);if(ae>0)r.country_specific.seller_address=an.substring(0,ae).trim()}
      let btm=cs.match(/^(.+?)(?:\s+(?:BRN|VAT ID|EIN|ABN|UEN)\s*\/|\s+Contact:)/i);if(btm)r.core.buyer_name=btm[1].trim();
      if(!r.core.buyer_name){let cl=cs.replace(/(?:BRN|VAT ID|EIN|ABN|UEN)\s*\/\s*Tax ID:\s*\S+/gi,'').replace(/Contact:\s*\S+/i,'').trim();r.core.buyer_name=cl}
      break;
    }
  }else if(vIdx>=0){
    for(let i=vIdx+1;i<els.length;i++){
      if(els[i].type==='Title')break;
      const t=(els[i].text||'').trim();
      if(t&&!t.includes('VENDOR')&&t.length>2){r.core.seller_name=t;break}
    }
    let al=[];let fn=false;
    for(let i=vIdx+1;i<els.length;i++){
      if(els[i].type==='Title')break;
      const t=(els[i].text||'').trim();if(!t)continue;
      if(/EIN|VAT ID|UEN|BRN/i.test(t)){let tm=t.match(/(?:EIN|VAT ID|UEN|BRN)\s*\/?\s*Tax ID:\s*(.+)/i);if(tm)r.core.seller_tax_id=tm[1].trim();continue}
      if(/Email:/i.test(t))continue;
      if(!fn&&t===r.core.seller_name){fn=true;continue}
      if(fn)al.push(t)
    }
    r.country_specific.seller_address=al.join(', ');
  }

  if(bIdx>=0&&!(vIdx>=0&&bIdx===vIdx+1)){
    let bl=[];
    for(let i=bIdx+1;i<els.length;i++){
      if(els[i].type==='Title'||els[i].type==='Table')break;
      const t=(els[i].text||'').trim();if(!t)continue;
      if(/VAT ID:|EIN|ABN|UEN/i.test(t)){let tm=t.match(/(?:VAT ID|EIN|ABN|UEN)\s*\/?\s*Tax ID?:?\s*(.+)/i);if(tm)r.core.buyer_tax_id=tm[1].trim();continue}
      if(/Contact:/i.test(t))continue;
      bl.push(t)
    }
    r.core.buyer_name=bl.join(', ');
  }

  // Date and terms from Table
  const ht=tt.find(t=>/Invoice Date/i.test(t))||'';
  if(ht){
    m=ht.match(/Invoice Date:\s*([A-Za-z]+\s+\d{1,2},?\s*\d{4})/);if(m)r.core.invoice_date=m[1];
    if(!m){m=ht.match(/Invoice Date:\s*(\d{1,2}\s+[A-Za-z]+\s+\d{4})/);if(m)r.core.invoice_date=m[1]}
    m=ht.match(/Due Date:\s*([A-Za-z]+\s+\d{1,2},?\s*\d{4})/);if(!m)m=ht.match(/Due Date:\s*(\d{1,2}\s+[A-Za-z]+\s+\d{4})/);
    if(m)r.core.due_date=m[1];
    m=ht.match(/(Net\s+\d+\s+Days?)/i);if(m)r.country_specific.payment_terms=m[1];
    else{m=ht.match(/Payment Terms:\s*(.+?)(?:\s+Due Date|\s+PO Reference|\s+Currency|\s+Account|\s+\d{4}\s|$)/);if(m){let pt=m[1].trim();let pc=pt.match(/(Net\s+\d+\s+Days?)/i);if(pc)pt=pc[1];r.country_specific.payment_terms=pt}}
    let ps=ht.match(/PO Reference:\s*(.+?)(?:\s+Currency|\s+Account|\s+\n|$)/i);
    if(ps){let pr=ps[1].trim().split(/\s+/)[0];let pm=pr.match(/([A-Z][-A-Z0-9]+)/);if(pm)r.country_specific.po_number=pm[1];else r.country_specific.po_number=pr}
    m=ht.match(/Currency:\s*(\w+)\s*\(/);if(m)r.core.currency=m[1];
  }

  if(!r.core.invoice_date){m=all.match(/Invoice Date:\s*([A-Za-z]+\s+\d{1,2},?\s*\d{4})/);if(m)r.core.invoice_date=m[1]}
  if(!r.core.due_date){m=all.match(/Due Date:\s*([A-Za-z]+\s+\d{1,2},?\s*\d{4})/);if(m)r.core.due_date=m[1]}
  if(!r.core.currency){m=all.match(/Currency:\s*(\w+)\s*\(/);if(m)r.core.currency=m[1]}

  // Bank info
  const bt=tt.find(t=>/WIRE TRANSFER|REMITTANCE|Bank Name:|SWIFT/i.test(t))||'';
  const bn=els.find(e=>e.type==='NarrativeText'&&/Bank Name:|SWIFT/i.test(e.text||''));
  const btxt=bt||(bn?(bn.text||'').trim():'');
  if(btxt){
    m=btxt.match(/Bank Name:\s*(.+?)(?:\s+Account Name:|\s+SWIFT|\s+IBAN|\s+Subtotal:|\s+GST|\s+Tax|\s+Discount|\n|$)/);if(m)r.country_specific.bank_name=m[1].trim();
    r.country_specific.swift_bic=extractSWIFT(btxt);
    if(!r.country_specific.swift_bic)r.country_specific.swift_bic=extractSWIFT(all);
    m=btxt.match(/IBAN:\s*([\w\s-]+)/);if(m){let ib=m[1].trim().replace(/\s+(?:Total|Subtotal|Discount|Tax|Payment|Handling).*/i,'');r.country_specific.iban=ib}
    if(!r.country_specific.iban){m=btxt.match(/Account\s*\/\s*IBAN:\s*([\w\s-]+)/);if(m){let v=m[1].trim().replace(/\s+(?:Total|Subtotal|Discount|Tax|Payment|Handling).*/i,'');r.country_specific.iban=v;r.country_specific.account_number=v}}
    m=btxt.match(/Account\s*\/\s*Routing:\s*([\w\s-]+)/);if(m){let v=m[1].trim().replace(/\s+(?:Total|Subtotal|Discount|Tax|Payment|Handling).*/i,'');r.country_specific.account_number=v}
  }
  if(!r.country_specific.bank_name){m=all.match(/Bank Name:\s*(.+?)(?:\s+Account Name:|\s+SWIFT|\n|$)/);if(m)r.country_specific.bank_name=m[1].trim()}
  if(!r.country_specific.swift_bic)r.country_specific.swift_bic=extractSWIFT(all);

  // Amounts
  const at=tt.find(t=>/Subtotal:|Total Due:/i.test(t))||'';
  if(at){
    m=at.match(/Subtotal:\s*[$\u20ac\u00a3\u00a5]?\s*([\d,]+\.\d+)/);if(m)r.core.subtotal=m[1];
    m=at.match(/Total Due:\s*[$\u20ac\u00a3\u00a5]?\s*([\d,]+\.\d+)/);if(m)r.core.total_amount=m[1];
    m=at.match(/(?:Tax|VAT|GST)[^:\n]*:\s*[$\u20ac\u00a3\u00a5]?\s*(Included|0\.00|[\d,]+\.\d+)/);if(m)r.core.tax_amount=m[1];
    m=at.match(/Discount:\s*[$\u20ac\u00a3\u00a5]?\s*([\d,]+\.\d+)/);if(m)r.country_specific.discount=m[1];
    m=at.match(/(?:Freight|Shipping|Shipping Cost|Handling Fee):\s*[$\u20ac\u00a3\u00a5]?\s*([\d,]+\.\d+|Included)/);if(m)r.country_specific.freight=m[1];
  }

  // Semantic amount extraction fallback
  let sa=extractAmountsSemantic(els);
  if(!r.core.subtotal&&sa.subtotal)r.core.subtotal=sa.subtotal;
  if(!r.core.total_amount&&sa.total)r.core.total_amount=sa.total;
  if(!r.core.tax_amount&&sa.tax)r.core.tax_amount=sa.tax;
  if(!r.country_specific.discount&&sa.discount)r.country_specific.discount=sa.discount;
  if(!r.country_specific.freight&&sa.freight)r.country_specific.freight=sa.freight;

  if(!r.core.subtotal){m=all.match(/Subtotal:\s*[$\u20ac\u00a3\u00a5]?\s*([\d,]+\.\d+)/);if(m)r.core.subtotal=m[1]}
  if(!r.core.total_amount){m=all.match(/Total Due:\s*[$\u20ac\u00a3\u00a5]?\s*([\d,]+\.\d+)/);if(m)r.core.total_amount=m[1]}

  // Item description
  for(const t of tt){
    if(/DESCRIPTION.*QTY/i.test(t)){
      let items=t.replace(/DESCRIPTION\s+QTY\s+UNIT PRICE.*?AMOUNT.*?\n?/i,'');
      let lines=items.split(/\s{2,}|(?<=\d)\s+(?=[A-Z])/);
      let di=[];
      for(const l of lines){let d=l.replace(/\d+\s*[$\u20ac\u00a3\u00a5]\s*[\d,.]+\s*[$\u20ac\u00a3\u00a5]\s*[\d,.]+$/,'').trim();if(d.length>3)di.push(d);if(di.length>=3)break}
      r.country_specific.item_description=di.join('; ').substring(0,300);break;
    }
  }

  // Tax details
  if(r.core.tax_amount){
    let taxType='SALES_TAX';
    if(/VAT/i.test(all))taxType='VAT';
    else if(/GST/i.test(all))taxType='GST';
    let rateM=all.match(/(?:Tax|VAT|GST|Sales Tax)\s*(?:Rate)?\s*[:\s]*\s*(\d+\.?\d*)%/i);
    let rate=rateM?parseFloat(rateM[1])/100:null;
    r.taxes.push({type:taxType,rate:rate||null,amount:cleanNum(r.core.tax_amount)});
  }

  // Payment
  if(/WIRE TRANSFER|wire transfer/i.test(all))r.country_specific.payment_method='Wire Transfer';
  else if(/ACH/i.test(all))r.country_specific.payment_method='ACH';

  // Payment status
  if(/Paid/i.test(all)&&!/Unpaid/i.test(all))r.core.payment_status='Paid';
  else if(/Unpaid/i.test(all))r.core.payment_status='Unpaid';
  else if(r.core.due_date)r.core.payment_status='Pending';

  return r;
}

/* ========== 欧洲/英国发票解析 ========== */
function parseEU(els){
  let pages=[];let cur=[];
  for(const el of els){
    if(el.type==='PageNumber'){if(cur.length>0)pages.push(cur);cur=[]}
    else cur.push(el);
  }
  if(cur.length>0)pages.push(cur);
  if(pages.length===0&&els.length>0)pages=[els];
  return pages.map(p=>parseSingleEU(p));
}

function parseSingleEU(els){
  const all=els.map(e=>(e.text||'').trim()).filter(Boolean).join('\n');
  const tt=els.filter(e=>e.type==='Table').map(e=>(e.text||'').trim());
  let r={
    country:'EU',
    core:{invoice_number:'',invoice_date:'',seller_name:'',buyer_name:'',seller_tax_id:'',buyer_tax_id:'',currency:'EUR',subtotal:'',tax_amount:'',total_amount:'',payment_status:'',due_date:''},
    taxes:[],
    country_specific:{vat_id:'',iban:'',bic:'',bank_name:'',po_number:'',payment_terms:'',payment_method:'',seller_address:'',item_description:'',discount:'',freight:''}
  };

  let m;
  // Invoice Number
  m=all.match(/Invoice\s*(?:Number|No\.?)[\s:#]*([A-Z0-9][-A-Z0-9/]*)/i);if(m)r.core.invoice_number=m[1];
  if(!r.core.invoice_number){m=all.match(/#\s*([A-Z]{2,}[-/]?\d{2,}[-/]?\d*)/);if(m)r.core.invoice_number=m[1].replace(/\s+/g,'')}

  // Date
  m=all.match(/Invoice\s*Date[\s:]*(\d{1,2}[.\/]\d{1,2}[.\/]\d{4})/i);if(m)r.core.invoice_date=m[1];
  if(!r.core.invoice_date){m=all.match(/Date[\s:]*(\d{1,2}[.\/]\d{1,2}[.\/]\d{4})/i);if(m)r.core.invoice_date=m[1]}
  m=all.match(/Due\s*Date[\s:]*(\d{1,2}[.\/]\d{1,2}[.\/]\d{4})/i);if(m)r.core.due_date=m[1];

  // Vendor/Seller
  const vIdx=els.findIndex(e=>/(?:VENDOR|SUPPLIER|From:|Seller)/i.test(e.text||'')&&e.type==='Title');
  const bIdx=els.findIndex(e=>/(?:BILL TO|CUSTOMER|To:|Buyer)/i.test(e.text||'')&&e.type==='Title');
  if(vIdx>=0){
    for(let i=vIdx+1;i<els.length;i++){
      if(els[i].type==='Title'||els[i].type==='Table')break;
      const t=(els[i].text||'').trim();if(!t||/VENDOR|SUPPLIER/i.test(t))continue;
      if(t.length>2){r.core.seller_name=t;break}
    }
    let al=[];
    for(let i=vIdx+1;i<els.length;i++){
      if(els[i].type==='Title'||els[i].type==='Table')break;
      const t=(els[i].text||'').trim();if(!t)continue;
      if(/VAT ID|VAT No|UEN|BRN/i.test(t)){let tm=t.match(/(?:VAT ID|VAT No|UEN|BRN)\s*[:\s]*\s*(\S+)/i);if(tm)r.core.seller_tax_id=tm[1];continue}
      if(t===r.core.seller_name)continue;
      al.push(t)
    }
    r.country_specific.seller_address=al.join(', ');
  }
  if(bIdx>=0){
    let bl=[];
    for(let i=bIdx+1;i<els.length;i++){
      if(els[i].type==='Title'||els[i].type==='Table')break;
      const t=(els[i].text||'').trim();if(!t)continue;
      if(/VAT ID|VAT No/i.test(t)){let tm=t.match(/(?:VAT ID|VAT No)\s*[:\s]*\s*(\S+)/i);if(tm)r.core.buyer_tax_id=tm[1];continue}
      bl.push(t)
    }
    r.core.buyer_name=bl.join(', ');
  }

  // VAT ID
  if(!r.core.seller_tax_id){m=all.match(/(?:VAT|VAT ID|VAT No)\s*[:\s#]*\s*([A-Z]{2}\d{8,12}|[A-Z]{2}[A-Z0-9]{6,12})/i);if(m)r.core.seller_tax_id=m[1]}
  if(!r.core.buyer_tax_id){m=all.match(/Customer\s*(?:VAT|VAT ID)\s*[:\s#]*\s*([A-Z]{2}\d{8,12}|[A-Z]{2}[A-Z0-9]{6,12})/i);if(m)r.core.buyer_tax_id=m[1]}
  if(r.core.seller_tax_id)r.country_specific.vat_id=r.core.seller_tax_id;

  // Currency
  m=all.match(/Currency\s*[:\s]*(\w{3})/i);if(m)r.core.currency=m[1];
  if(!r.core.currency){if(/\u20ac|\bEUR\b/i.test(all))r.core.currency='EUR';else if(/\u00a3|\bGBP\b/i.test(all))r.core.currency='GBP'}

  // Amounts
  const at=tt.find(t=>/Subtotal|Net Amount|Total|VAT|Gross/i.test(t))||'';
  if(at){
    m=at.match(/(?:Subtotal|Net Amount)[\s:]*\s*[\u20ac\u00a3\u00a5$]?\s*([\d,]+\.\d+)/i);if(m)r.core.subtotal=m[1];
    m=at.match(/(?:Total|Gross Total|Total Due)[\s:]*\s*[\u20ac\u00a3\u00a5$]?\s*([\d,]+\.\d+)/i);if(m)r.core.total_amount=m[1];
    m=at.match(/(?:VAT|Tax)[\s:]*\s*[\u20ac\u00a3\u00a5$]?\s*([\d,]+\.\d+)/i);if(m)r.core.tax_amount=m[1];
  }
  if(!r.core.subtotal){m=all.match(/(?:Subtotal|Net Amount)[\s:]*\s*[\u20ac\u00a3\u00a5$]?\s*([\d,]+\.\d+)/i);if(m)r.core.subtotal=m[1]}
  if(!r.core.total_amount){m=all.match(/(?:Total|Gross Total)[\s:]*\s*[\u20ac\u00a3\u00a5$]?\s*([\d,]+\.\d+)/i);if(m)r.core.total_amount=m[1]}
  if(!r.core.tax_amount){m=all.match(/(?:VAT|Tax Amount)[\s:]*\s*[\u20ac\u00a3\u00a5$]?\s*([\d,]+\.\d+)/i);if(m)r.core.tax_amount=m[1]}

  // VAT rate
  let rateM=all.match(/VAT\s*(?:Rate)?\s*[:\s]*\s*(\d+\.?\d*)\s*%/i);
  if(r.core.tax_amount){
    r.taxes.push({type:'VAT',rate:rateM?parseFloat(rateM[1])/100:null,amount:cleanNum(r.core.tax_amount)});
  }

  // IBAN/BIC
  m=all.match(/IBAN\s*[:\s]*\s*([A-Z]{2}\d{2}[A-Z0-9]{10,30})/i);if(m)r.country_specific.iban=m[1].replace(/\s/g,'');
  m=all.match(/(?:BIC|SWIFT)\s*[:\s]*\s*([A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?)/i);if(m)r.country_specific.bic=m[1];
  m=all.match(/Bank\s*(?:Name)?\s*[:\s]*\s*(.+?)(?:\n|$)/i);if(m)r.country_specific.bank_name=m[1].trim();

  // PO Number
  m=all.match(/(?:PO|Purchase Order)\s*(?:Number|No\.?)\s*[:\s]*\s*([A-Z0-9-]+)/i);if(m)r.country_specific.po_number=m[1];

  // Payment
  m=all.match(/Payment\s*Terms\s*[:\s]*\s*(.+?)(?:\n|$)/i);if(m)r.country_specific.payment_terms=m[1].trim();
  if(/Wire\s*Transfer|Bank\s*Transfer/i.test(all))r.country_specific.payment_method='Bank Transfer';

  // Payment status
  if(/Paid/i.test(all)&&!/Unpaid/i.test(all))r.core.payment_status='Paid';
  else if(/Unpaid|Outstanding/i.test(all))r.core.payment_status='Unpaid';
  else if(r.core.due_date)r.core.payment_status='Pending';

  return r;
}

/* ========== 语义金额提取（用于美国发票回退） ========== */
function extractAmountsSemantic(els){
  let r={};let si=-1,ei=els.length;
  for(let i=0;i<els.length;i++){
    let t=(els[i].text||'').trim();
    if(/^Subtotal:?$|^Total Due:?$|^(Tax|VAT|GST)[^:]*:?$|^Discount:?$|^(Freight|Shipping|Handling|Processing Fee)[^:]*:?$/i.test(t)){if(si<0)si=i}
    if(/Payment Instructions|Tax Notice|Terms/i.test(t)&&els[i].type!=='Table'){if(si>=0){ei=i;break}}
  }
  if(si<0)return r;
  let sec=els.slice(si,ei);let lb=[],vl=[];
  for(let i=0;i<sec.length;i++){
    let t=(sec[i].text||'').trim();if(!t)continue;
    if(/Subtotal:?$/i.test(t)){lb.push({i,k:'subtotal'});continue}
    if(/Total Due:?$/i.test(t)){lb.push({i,k:'total'});continue}
    if(/^(Tax|VAT|GST)[^:]*:?\s*$/i.test(t)){lb.push({i,k:'tax'});continue}
    if(/Discount:?$/i.test(t)){lb.push({i,k:'discount'});continue}
    if(/^(Freight|Shipping|Handling|Processing Fee)[^:]*:?\s*$/i.test(t)){lb.push({i,k:'freight'});continue}
    if(isAmountValue(t))vl.push({i,t})
  }
  if(lb.length>0&&vl.length>0){
    let ml=Math.max(...lb.map(l=>l.i));let mv=Math.min(...vl.map(v=>v.i));
    if(ml<mv){
      if(vl.length>=2){r.subtotal=extractAmountNum(vl[0].t);r.total=extractAmountNum(vl[vl.length-1].t)}
      for(let i=0;i<Math.min(lb.length,vl.length);i++){
        if(lb[i].k==='tax'&&!r.tax){let v=extractAmountNum(vl[i].t);if(v&&v!==r.subtotal&&v!==r.total)r.tax=v}
        if(lb[i].k==='freight'&&!r.freight){let v=extractAmountNum(vl[i].t);if(v)r.freight=v}
        if(lb[i].k==='discount'&&!r.discount){let v=extractAmountNum(vl[i].t);if(v&&v!==r.subtotal&&v!==r.total)r.discount=v}
      }
      if(!r.tax&&vl.length>=3){for(let i=1;i<vl.length-1;i++){let v=extractAmountNum(vl[i].t);if(v==='0.00'){r.tax=v;break}}}
      if(!r.freight){for(const v of vl){if(v.t==='Included'){r.freight='Included';break}}}
    }
  }
  return r;
}

/* ========== 主调度：根据国家识别调用不同解析器 ========== */
function parseInvoice(els){
  const country=detectCountry(els);
  if(country==='CN')return parseCN(els);
  if(country==='US')return parseUS(els);
  if(country==='EU'||country==='UK')return parseEU(els);
  // OTHER: 尝试美国解析器作为通用回退
  return parseUS(els);
}

/* ========== 原始字段提取：不依赖版式，罗列 OCR 全部"标签：值" ========== */
function extractRawInvoice(els){
  const country=detectCountry(els);
  const fields={};
  let section='',docTitle=false;
  const cleanVal=(s)=>String(s==null?'':s).replace(/\*\*/g,'').trim().replace(/\s*\|\s*$/,'');
  const push=(label,val)=>{
    val=cleanVal(val);
    if(!val)return;
    if(fields[label])fields[label]+='; '+val;else fields[label]=val;
  };
  const prefixed=(l)=>section?section+'-'+l:l;
  const isNoise=(t)=>/^(Computer-generated|Sample data generated)/i.test(t)||/^THANK YOU/i.test(t)||/^!\[img/i.test(t)||/^\(?TEST SAMPLE/i.test(t)||/^第\s*\d+\s*页\s*共\s*\d+\s*页/.test(t);
  // 单段文本拆"标签：值"（含一行多标签："Date: x Time: y"；| 视为分隔符）
  function parseSeg(s){
    let rest=s.trim();let guard=0;
    while(rest&&guard++<20){
      const m=rest.match(/^([^:：\n|]{1,40}?)\s*[:：]\s*/);
      if(!m){
        if(rest.trim())push(prefixed('其他文本'),rest.trim());
        break;
      }
      const label=m[1].replace(/\*\*/g,'').trim();
      rest=rest.slice(m[0].length);
      const nx=rest.match(/\s([^:：\n|]{1,40}?)\s*[:：]\s*/);
      if(nx){
        push(prefixed(label),rest.slice(0,nx.index).trim());
        rest=rest.slice(nx.index+1);
      }else{
        push(prefixed(label),rest.trim());
        rest='';
      }
    }
  }
  // Markdown 表格 → 行数组
  function tableToRows(t){
    const rows=[];
    t.split('\n').forEach(line=>{
      let s=line.trim();
      if(!s)return;
      if(/^(\|?\s*:?-{3,})/.test(s))return;
      if(s.startsWith('|'))s=s.slice(1);
      if(s.endsWith('|'))s=s.slice(0,-1);
      rows.push(s.split('|').map(c=>c.trim()));
    });
    return rows;
  }
  function extractTable(t){
    const rows=tableToRows(t);const items=[];
    for(const row of rows){
    let handled=false,smallHit=false;
    const rowAmtLbl=/价税合计|金额合计|大写/.test(row.join(' '));
    for(const c of row){
      let m=c.match(/(?:金额|价税)合计[（(]大写[）)]\s*(?=\S)(.+?)(?:\s*[（(]小写[）)]|$)/);
      if(m){push(prefixed('金额合计（大写）'),m[1].trim());handled=true;}
      else if(rowAmtLbl&&(m=c.match(/([零壹贰叁肆伍陆柒捌玖拾佰仟万亿圆元整角分]{3,}[整圆元角分])/))){push(prefixed('金额合计（大写）'),m[1].trim());handled=true;}
      m=c.match(/（?小写）?\s*[￥¥]\s*([\d,.]+)/);
      if(m){push(prefixed('金额合计（小写）'),'￥'+m[1].trim());handled=true;smallHit=true;continue;}
      m=c.match(/（小写）\s*(?=\S)(.+)/);
      if(m){push(prefixed('金额合计（小写）'),m[1].trim());handled=true;smallHit=true;continue;}
    }
    if(handled&&rowAmtLbl&&!smallHit){
      const jr=row.join(' ');
      let sm=jr.match(/[（(]小写[）)]\s*[￥¥]?\s*([\d,.]+)/);
      if(!sm)sm=jr.match(/[￥¥]\s*([\d,.]+)/);
      if(sm)push(prefixed('金额合计（小写）'),'￥'+sm[1].trim());
    }
    if(handled)continue;
      // 合计行：提取合计金额和税额
      if(row.some(c=>/^合计$/.test(c.trim()))){
        const nums=row.filter(c=>/[￥¥]?[\d,.]+/.test(c)&&c.trim()&&!/^合计$/.test(c.trim()));
        if(nums.length>=1)push(prefixed('合计金额'),nums.map(n=>n.trim()).join(' / '));
        continue;
      }
      // 含冒号的单元格 → 作为"标签：值"行解析
      if(row.some(c=>/[：:]/.test(c))){
        parseSeg(row.join(' '));
        continue;
      }
      const joined=row.join(' ').trim();
      if(!joined||!/\d/.test(joined))continue; // 跳过表头/纯文本行
      items.push(joined);
    }
    if(items.length)push(prefixed('商品明细'),items.join(' | '));
  }
  for(const e of els){
    const t=(e.text||'').trim();if(!t)continue;
    if(e.type==='PageNumber'||isNoise(t))continue;
    if(e.type==='Title'){
      if(!docTitle){docTitle=true;section='';push(prefixed('票据类型'),t);continue;}
      section=t.replace(/信息$/,'').replace(/[:：]$/,'');
      continue;
    }
    if(e.type==='Table'){extractTable(t);continue;}
    if(/[：:]/.test(t))parseSeg(t);
    else push(prefixed('其他文本'),t);
  }
  return {country:country,rawFields:fields};
}

/* ========== API 函数 ========== */
/* OCR 级联：LlamaParse（新主力）→ Mistral（内置 Gemini 降级） */
async function invoiceOCR(file){
  // 第一优先：LlamaParse
  try{
    const fd1=new FormData();fd1.append('file',file,file.name);
    const r1=await fetch(WORKER_URL+'/api/llamaparse/ocr',{method:'POST',body:fd1});
    const d1=await r1.json();
    if(r1.ok&&d1.elements&&d1.elements.length) return d1.elements;
  }catch(e){/* 网络错误，继续降级 */}
  // 第二优先：Mistral OCR（内置 429→Gemini 降级）
  const fd=new FormData();fd.append('file',file,file.name);
  const r=await fetch(WORKER_URL+'/api/mistral/ocr',{method:'POST',body:fd});
  const d=await r.json();
  if(!r.ok||!d.elements) throw new Error(d.error||'OCR failed');
  return d.elements;
}

/* ========== 主流程 ========== */
let invoiceFiles=[];
const container=document.querySelector('#invoice-app');
if(container){
  const fi=container.querySelector('#invFile');
  container.querySelector('.inv-filelabel').addEventListener('click',function(e){
    if(e.target===fi)return;
    e.preventDefault();e.stopPropagation();
    fi.click();
  },true);
  const fl=container.querySelector('.filename');
  const listEl=container.querySelector('#invList');
  const runBtn=container.querySelector('#invRun');
  const out=container.querySelector('#invOut');

  async function processFiles(){
    out.innerHTML='';
    const allFiles=[];
    for(const f of invoiceFiles){
      if(f.name.toLowerCase().endsWith('.zip')){
        try{
          const zip=await JSZip.loadAsync(f);
          for(const name in zip.files){
            if(zip.files[name].dir)continue;
            const ext=name.split('.').pop().toLowerCase();
            if(IMG_EXTS.includes('.'+ext)||ext==='pdf'){
              const blob=await zip.files[name].async('blob');
              allFiles.push(new File([blob],name.split('/').pop(),{type:blob.type}));
            }
          }
        }catch(e){console.error('ZIP error:',e)}
      }else{allFiles.push(f)}
    }
    if(allFiles.length>MAX_INVOICES){
      out.innerHTML='<p style="color:#e53e3e;font-weight:600">\u274f 每次最多处理 50 张发票，当前选择了 '+allFiles.length+' 张，请减少文件后重试</p>';
      return;
    }
    runBtn.disabled=true;
    const results=[];let ok=0,fail=0;
    for(let i=0;i<allFiles.length;i++){
      const f=allFiles[i];
      out.innerHTML='<p style="color:#2563eb">正在处理第 '+(i+1)+'/'+allFiles.length+' 张：'+f.name+'...</p>';
      try{
        const elements=await invoiceOCR(f);
        const inv=extractRawInvoice(elements);
        inv.fileName=f.name;inv.status='OK';results.push(inv);
        ok++;
      }catch(e){
        results.push({country:'UNKNOWN',rawFields:[],fileName:f.name,status:'ERROR: '+e.message.substring(0,100)});
        fail++;
      }
    }
    // 展示字段选择预览，由用户勾选后导出
    showPreview(results,ok,fail);
  }




  // ===== 动态字段：扫描结果实际出现的字段罗列为列（不预设固定表头）=====
  const BASE_LBL={no:"序号",file:"文件名",country:"国家",status:"提取状态"};
  function collectFields(items){
    const present=[];
    items.forEach(r=>{
      const rf=r.rawFields||{};
      Object.keys(rf).forEach(k=>{if(rf[k]!==''&&rf[k]!=null&&!present.includes(k))present.push(k)});
    });
    return present;
  }
  function fieldLabel(k){var t=T();var cnMap={'其他文本':'lblOtherText','票据类型':'lblItemType','商品明细':'lblItems','税额明细':'lblTaxDetail','金额（大写）':'lblAmountWords','金额（小写）':'lblAmountNum','税额':'lblTaxDetail'};if(cnMap[k]&&t[cnMap[k]])return t[cnMap[k]];if(t[k])return t[k];return k}
  function fieldValue(r,k){
    const rf=r.rawFields||{};
    return rf[k]!==undefined?rf[k]:'';
  }
  function dynHeaders(results){
    const keys=collectFields(results);
    return [BASE_LBL.no,BASE_LBL.file,BASE_LBL.country].concat(keys.map(fieldLabel)).concat([BASE_LBL.status]);
  }
  function dynRow(r,idx,keys){
    const row=[idx+1,r.fileName||'',r.country||''];
    keys.forEach(k=>row.push(fieldValue(r,k)));
    row.push(r.status||'OK');
    return row;
  }

  function generateExcel(results,selectedCols){
    const keys=collectFields(results);
    const headers=dynHeaders(results);
    const keep=selectedCols?headers.filter(h=>selectedCols.has(h)):headers;
    if(keep.length===0)return;
    const rows=results.map((r,idx)=>{
      const full=dynRow(r,idx,keys);
      return keep.map(h=>full[headers.indexOf(h)]);
    });
    if(window.XLSX){
      const wb=XLSX.utils.book_new();
      const ws=XLSX.utils.aoa_to_sheet([keep,...rows]);
      ws['!cols']=keep.map(hh=>({wch:Math.max(hh.length*2,12)}));
      XLSX.utils.book_append_sheet(wb,ws,"发票明细");
      const arr=XLSX.write(wb,{type:'array',bookType:'xlsx'});
      const blob=new Blob([arr],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='invoices_output.xlsx';a.click();
    }
  }

  // 字段选择预览：扫描结果动态罗列，勾选需要导出的列
  let pvResults=null;
  function showPreview(results,ok,fail){
    pvResults=results;
    const keys=collectFields(results);
    const headers=dynHeaders(results);
    const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const ths=headers.map(h=>'<th><label class="colchk"><input type="checkbox" class="pv-col" value="'+esc(h)+'" checked> '+esc(h)+'</label></th>').join('');
    const trs=results.map((r,idx)=>{
      const full=dynRow(r,idx,keys);
      const tds=full.map((v,i)=>{
        const isErr=i===headers.length-1&&v&&String(v).indexOf('ERROR')===0;
        const cls=(v==null||v==='')?'empty':(isErr?'err':'');
        const txt=(v==null||v==='')?'—':esc(v);
        return '<td class="'+cls+'" title="'+txt+'">'+txt+'</td>';
      }).join('');
      return '<tr>'+tds+'</tr>';
    }).join('');
    let html='<div class="inv-preview">';
    html+='<h3>'+T().invDoneTitle||'✓'+'</h3>';
    html+='<p class="pv-tip">'+((T().invDoneTip||"").replace(/{ok}/g,ok).replace(/{fail}/g,fail))+'</p>';
    html+='<div class="pv-toolbar">'+('<b>'+T().invInvoiceDetail+'</b>（'+results.length+' '+T().invDetailUnit+'）<label><input type="checkbox" class="pv-all" checked> '+T().invSelectAll+'</label>')+'</div>';
    html+='<div class="pv-tablewrap"><table class="pv-table"><thead><tr>'+ths+'</tr></thead><tbody>'+trs+'</tbody></table></div>';
    html+='<div class="pv-actions"><button class="pv-export" id="pvExport">'+(T().invExport||'Export')+'</button><span class="pv-count" id="pvCount"></span></div>';
    html+='</div>';
    out.innerHTML=html;
    const allChk=out.querySelector('.pv-all');
    if(allChk){
      allChk.addEventListener('change',()=>{
        out.querySelectorAll('.pv-col').forEach(c=>{c.checked=allChk.checked});
        updatePvCount();
      });
    }
    out.querySelectorAll('.pv-col').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const a2=out.querySelector('.pv-all');
        if(a2)a2.checked=[...out.querySelectorAll('.pv-col')].every(c=>c.checked);
        updatePvCount();
      });
    });
    const exportBtn=out.querySelector('#pvExport');
    if(exportBtn){
      exportBtn.addEventListener('click',()=>{
        const selected=new Set([...out.querySelectorAll('.pv-col')].filter(c=>c.checked).map(c=>c.value));
        if(selected.size===0){alert(T().invSelectWarn||'Please select');return}
        generateExcel(pvResults,selected);
        exportBtn.disabled=true;exportBtn.textContent='✓ Excel 已下载';exportBtn.style.opacity=.6;
      });
    }
    updatePvCount();
    runBtn.disabled=false;
    function updatePvCount(){
      const total=out.querySelectorAll('.pv-col').length;
      const sel=out.querySelectorAll('.pv-col:checked').length;
      const el=out.querySelector('#pvCount');
      if(el)(el.textContent=(T().invSelectedCount||'').replace(/{sel}/g,sel).replace(/{total}/g,total));
    }
  }


  fi.onchange=()=>{
    invoiceFiles=[...fi.files];
    let count=invoiceFiles.length;
    fl.textContent=count>1?count+' 个文件':(invoiceFiles[0]?.name||'未选择文件');
    let zipCount=invoiceFiles.filter(f=>f.name.toLowerCase().endsWith('.zip')).length;
    if(zipCount>0){
      listEl.textContent='含 '+zipCount+' 个压缩包，将自动解压并统计文件数（解压后超过 50 张将拦截）';
    }else{
      listEl.textContent='';
    }
    if(zipCount===0&&count>MAX_INVOICES){
      listEl.innerHTML='<span style="color:#e53e3e">\u274f 超出限制：每次最多 50 张，当前选择了 '+count+' 张</span>';
      runBtn.disabled=true;
    }else{
      runBtn.disabled=count===0;
    }
  };
  runBtn.onclick=processFiles;
}
})();
