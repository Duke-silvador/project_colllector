<style>
#ar-app{max-width:1400px;margin:0 auto;padding:0;display:flex;flex-direction:column;height:calc(100vh - 0px)}
.ar-toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fff;border-bottom:1px solid #d7dee9;flex-shrink:0;flex-wrap:wrap}
.ar-toolbar .ar-logo{font-size:16px;font-weight:700;color:#2563eb;white-space:nowrap}
.ar-toolbar .ar-sep{width:1px;height:22px;background:#d7dee9}
.ar-toolbar button{padding:7px 14px;border:1px solid #d7dee9;border-radius:8px;background:#fff;font-size:13px;font-weight:600;color:#42506b;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px}
.ar-toolbar button:hover{border-color:#2563eb;color:#2563eb;background:#f0f5ff}
.ar-toolbar button.ai{background:#2563eb;color:#fff;border-color:#2563eb}
.ar-toolbar button.ai:hover{opacity:.9;background:#1d4ed8}
.ar-toolbar button.ai:disabled{opacity:.4;cursor:not-allowed}
.ar-toolbar button.export{background:#1e9e5a;color:#fff;border-color:#1e9e5a}
.ar-toolbar button.export:hover{opacity:.9}
.ar-toolbar .ar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ar-toolbar select{padding:6px 10px;border:1px solid #d7dee9;border-radius:6px;font-size:13px;background:#fff;color:#33415e}
.ar-main{display:flex;gap:0;flex:1;overflow:hidden}
.ar-left{width:46%;background:#fff;overflow-y:auto;padding:20px;border-right:1px solid #d7dee9}
.ar-right{width:54%;background:#e8edf5;overflow-y:auto;padding:20px;display:flex;justify-content:center}
.ar-resume-page{background:#fff;width:612px;min-height:792px;padding:48px 54px;font-family:Georgia,serif;color:#222;font-size:13px;line-height:1.55;box-shadow:0 2px 12px rgba(0,0,0,.08);flex-shrink:0}
.ar-sec{margin-bottom:20px}
.ar-sec h3{font-size:13px;font-weight:700;color:#33415e;margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid #e8edf5}
.ar-row{display:flex;gap:10px;margin-bottom:8px}
.ar-field{flex:1}
.ar-field label{display:block;font-size:11px;font-weight:600;color:#728095;margin-bottom:3px}
.ar-field input,.ar-field textarea,.ar-field select{width:100%;padding:7px 10px;border:1px solid #d7dee9;border-radius:6px;font-size:13px;background:#fff;color:#33415e;font-family:inherit}
.ar-field textarea{resize:vertical;min-height:50px;line-height:1.5}
.ar-card{border:1px solid #e8edf5;border-radius:8px;padding:12px;margin-bottom:10px;background:#fafcff}
.ar-card .ar-card-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ar-card .ar-card-head input{flex:1;padding:6px 8px;border:1px solid #d7dee9;border-radius:6px;font-size:12px}
.ar-card .ar-card-head input.ar-time{width:90px;flex:0 0 90px}
.ar-card .ar-card-rm{border:0;background:none;color:#e53e3e;font-size:18px;cursor:pointer;padding:0 4px;flex-shrink:0}
.ar-ai-btn{padding:5px 12px;border:1px solid #2563eb;border-radius:6px;background:#f0f5ff;color:#2563eb;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.ar-ai-btn:hover{background:#2563eb;color:#fff}
.ar-ai-btn:disabled{opacity:.4;cursor:not-allowed}
.ar-add{padding:6px 14px;border:1px dashed #2563eb;border-radius:8px;background:transparent;color:#2563eb;font-size:13px;font-weight:600;cursor:pointer;width:100%}
.ar-add:hover{background:#f0f5ff}
.ar-jd-box{border:2px dashed #b4c2d6;border-radius:10px;padding:14px;background:#f0f5ff}
.ar-jd-box label{font-size:13px;font-weight:700;color:#33415e;display:block;margin-bottom:6px}
.ar-result{margin-top:12px;padding:14px;border-radius:10px;display:none}
.ar-result.show{display:block}
.ar-score-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ar-score-val{font-size:28px;font-weight:800}
.ar-score-label{font-size:12px;color:#728095}
.ar-bar{width:180px;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.ar-bar .ar-fill{height:100%;border-radius:4px;transition:width .5s}
.ar-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.ar-tags.found span{padding:3px 8px;border-radius:4px;background:#e6ffe6;font-size:11px;color:#080;font-weight:600}
.ar-tags.miss span{padding:3px 8px;border-radius:4px;background:#fee;font-size:11px;color:#c00;font-weight:600}
.ar-suggest{margin-top:8px;padding:10px;background:#f0f5ff;border-radius:8px;font-size:12px;color:#42506b;line-height:1.6}
.ar-issues{margin-top:6px}
.ar-issues .issue{padding:6px 10px;border-radius:6px;margin-bottom:4px;font-size:12px;line-height:1.5}
.ar-issues .issue.err{background:#fee;color:#c00}
.ar-issues .issue.warn{background:#fff8e6;color:#8a6d3b}
.ar-loading{display:inline-block;width:14px;height:14px;border:2px solid #d7dee9;border-top-color:#2563eb;border-radius:50%;animation:ar-spin .6s linear infinite}
@keyframes ar-spin{to{transform:rotate(360deg)}}
/* resume preview */
.r-name{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px;letter-spacing:1px}
.r-contact{text-align:center;font-size:12px;color:#555;margin-bottom:16px;line-height:1.6}
.r-sec-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:1.5px solid #999;padding-bottom:3px;margin:16px 0 8px}
.r-item{margin-bottom:10px}
.r-item-head{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:2px}
.r-item-sub{font-size:12px;color:#666;font-style:italic;margin-bottom:3px}
.r-bullet{font-size:12.5px;line-height:1.55;margin-bottom:2px;padding-left:14px;position:relative}
.r-bullet:before{content:'\2022';position:absolute;left:0}
.r-skills{font-size:12.5px;line-height:1.8}
.r-skills .skill-cat{font-weight:700;display:inline-block;width:100px}
.r-empty{color:#bbb;text-align:center;padding:8px;font-style:italic}
/* dark mode */
body.dark .ar-toolbar{background:#1a2230;border-color:#303846}
body.dark .ar-toolbar button{background:#1a2230;border-color:#303846;color:#c7d2e4}
body.dark .ar-toolbar button:hover{border-color:#3b82f6;color:#7aa5f8;background:#171d28}
body.dark .ar-toolbar button.ai{background:#3b82f6;border-color:#3b82f6;color:#fff}
body.dark .ar-toolbar select{background:#1a2230;border-color:#303846;color:#c7d2e4}
body.dark .ar-left{background:#171d28;border-color:#303846}
body.dark .ar-sec h3{color:#e8eef8;border-color:#303846}
body.dark .ar-field input,body.dark .ar-field textarea{background:#1a2230;border-color:#303846;color:#e8eef8}
body.dark .ar-card{background:#1a2230;border-color:#303846}
body.dark .ar-card .ar-card-head input{background:#171d28;border-color:#303846;color:#e8eef8}
body.dark .ar-jd-box{background:#171d28;border-color:#303846}
body.dark .ar-jd-box label{color:#e8eef8}
body.dark .ar-result{background:#1a2230}
body.dark .ar-suggest{background:#171d28;color:#aebad0}
body.dark .ar-right{background:#0f1219}
body.dark .ar-resume-page{background:#fff}
body.dark .r-contact{color:#555}
body.dark .r-item-sub{color:#666}
/* print */
@media print{
  header,.hero,footer,#modal,#ar-app>.ar-toolbar,.ar-left,.ar-result,.ar-suggest,.ar-jd-box,.ar-sec:has(.ar-jd-box),.ar-sec:has(.ar-result){display:none!important}
  /* hide ads */
  ins.adsbygoogle,iframe,script[src*="nap5k"],script[src*="monetag"],[id*="monetag"],[class*="monetag"],[data-zone],div[style*="position:fixed"],div[style*="position: fixed"]{display:none!important}

  #ar-app{display:block!important;height:auto!important;max-width:none!important;margin:0!important;padding:0!important}
  .ar-main{display:block!important;overflow:visible!important}
  .ar-right{background:#fff!important;padding:0!important;overflow:visible!important;width:100%!important;display:block!important}
  .ar-resume-page{box-shadow:none!important;width:auto!important;min-height:auto!important;padding:0!important;margin:0!important}
  @page{size:letter;margin:0.5in}
}
