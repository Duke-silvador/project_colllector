/* ===== QR Tool Styles ===== */
#qr-app{max-width:960px;margin:0 auto;padding:6px 20px 24px}
.qr-tabs{display:flex;gap:0;margin:12px 0;border-bottom:2px solid #e4e8ef}
.qr-tab{padding:12px 28px;border:none;background:none;cursor:pointer;font-size:15px;font-weight:600;color:#728095;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s}
.qr-tab:hover{color:#2563eb}
.qr-tab.active{color:#2563eb;border-bottom-color:#2563eb}
.qr-panel{padding:16px 0}
.qr-section{margin:12px 0;padding:16px;background:#f8faff;border:1px solid #e2e7ef;border-radius:12px}
.qr-row{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.qr-label{font-size:14px;font-weight:600;color:#42506b;min-width:70px}
.qr-input,.qr-section select,.qr-section textarea{padding:10px 12px;border:1px solid #d7dee9;border-radius:9px;font-size:14px;background:#fff;color:#1c2b45;flex:1;min-width:200px}
.qr-section textarea{resize:vertical;min-height:80px;font-family:inherit}
.qr-field-row{display:flex;align-items:center;gap:12px;margin:8px 0}
.qr-field-label{font-size:14px;font-weight:600;color:#42506b;min-width:120px}
.qr-field-row input,.qr-field-row select,.qr-field-row textarea{padding:10px 12px;border:1px solid #d7dee9;border-radius:9px;font-size:14px;background:#fff;color:#1c2b45;flex:1;min-width:200px}
.qr-field-row textarea{resize:vertical}
.qr-preview-wrap{display:flex;justify-content:center;padding:20px;margin:12px 0}
#qrCanvas{border:1px solid #e2e7ef;border-radius:12px;background:#fff;max-width:100%;height:auto}
.qr-settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.qr-set-item{display:flex;align-items:center;gap:8px}
.qr-set-item label{font-size:13px;font-weight:600;color:#42506b;min-width:60px}
.qr-set-item select,.qr-set-item input[type=color]{padding:6px 10px;border:1px solid #d7dee9;border-radius:8px;font-size:13px;background:#fff}
.qr-set-item input[type=color]{width:50px;height:34px;cursor:pointer;padding:2px}
.qr-custom-wrap{display:none;align-items:center;gap:8px}
.qr-custom-wrap input{width:80px;padding:6px 10px;border:1px solid #d7dee9;border-radius:8px;font-size:13px}
.qr-btn{padding:12px 24px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.qr-btn-primary{background:#2563eb;color:#fff}
.qr-btn-primary:hover{opacity:.88}
.qr-btn-primary:disabled{opacity:.4;cursor:not-allowed}
.qr-btn-success{background:#16a34a;color:#fff}
.qr-btn-success:hover{opacity:.88}
.qr-btn-success:disabled{opacity:.4;cursor:not-allowed}
.qr-btn-secondary{background:#e8edf5;color:#33415e}
.qr-btn-secondary:hover{background:#dde5f0}
.qr-bulk-inputs{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.qr-bulk-inputs button{padding:10px 18px;border:1px solid #2563eb;border-radius:10px;background:#fff;color:#2563eb;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.qr-bulk-inputs button:hover{background:#2563eb;color:#fff}
.qr-bulk-count{font-size:15px;font-weight:600;color:#2563eb;margin:8px 0}
.qr-bulk-status{padding:10px 14px;background:#f0f5ff;border:1px solid #d7dee9;border-radius:10px;font-size:14px;color:#42506b;margin:8px 0;display:none}
.qr-bulk-status.show{display:block}
.qr-bulk-preview{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.qr-bulk-item{text-align:center;border:1px solid #e2e7ef;border-radius:10px;padding:8px;background:#fff}
.qr-bulk-item canvas{display:block;margin:0 auto;border-radius:6px}
.qr-bulk-name{font-size:12px;color:#728095;margin-top:4px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr-logo-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.qr-logo-status{font-size:13px;color:#16a34a;font-weight:600;display:none}
.qr-info{padding:10px 14px;background:#f0f5ff;border:1px solid #d7dee9;border-radius:10px;font-size:13px;color:#42506b;margin:12px 0}
.qr-btns{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
/* Compact hero */
.hero{padding:34px 18px 26px}
.hero h1{font-size:clamp(26px,4vw,40px);margin:10px 0 6px}
.hero small{display:block;margin-bottom:2px}
.hero p{margin:4px 0 0}
/* Dark mode */
body.dark .qr-section{background:#171d28;border-color:#303846}body.dark .qr-input,body.dark .qr-field-row input,body.dark .qr-field-row select,body.dark .qr-field-row textarea,body.dark .qr-set-item select{background:#11151f;border-color:#303846;color:#dbe4f2}body.dark .qr-label,body.dark .qr-field-label{color:#aebad0}body.dark .qr-tab{color:#8b96a8}body.dark .qr-tab.active{color:#60a5fa;border-bottom-color:#3b82f6}body.dark .qr-btn-secondary{background:#1a2230;color:#c7d2e4}body.dark .qr-info{background:#171d28;border-color:#303846;color:#aebad0}body.dark .qr-bulk-inputs button{background:#171d28;border-color:#3b82f6;color:#60a5fa}body.dark .qr-bulk-item{background:#1a202a;border-color:#303846}body.dark .qr-bulk-name{color:#8b96a8}body.dark .qr-bulk-status{background:#171d28;color:#aebad0}body.dark .qr-logo-status{color:#34d399}body.dark #qrCanvas{border-color:#303846}
