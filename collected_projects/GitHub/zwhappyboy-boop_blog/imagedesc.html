<style>
#id-app{max-width:1100px;margin:0 auto;padding:20px}
.id-notice{background:#f0f5ff;border:1px solid #d7dee9;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#42506b;line-height:1.7}
.id-notice b{color:#b45309}
.id-layout{display:grid;grid-template-columns:380px 1fr;gap:20px}
.id-left{min-width:0}
.id-right{min-width:0}
.id-drop{border:2px dashed #b4c2d6;border-radius:14px;padding:34px 20px;text-align:center;cursor:pointer;background:#f0f5ff;transition:border-color .2s,background .2s}
.id-drop:hover{border-color:#2563eb;background:#e8efff}
.id-drop .id-big{font-size:38px}
.id-drop p{margin:8px 0 2px;font-weight:600;color:#33415e}
.id-drop small{color:#728095}
.id-preview{display:none;border:1px solid #d7dee9;border-radius:12px;overflow:hidden;background:#fff;margin-top:12px}
.id-preview.show{display:block}
.id-preview img{display:block;width:100%;max-height:320px;object-fit:contain;background:#f8fafc}
.id-fileinfo{display:none;align-items:center;gap:10px;padding:10px 14px;margin-top:10px;border:1px solid #d7dee9;border-radius:10px;background:#fafbfd}
.id-fileinfo.show{display:flex}
.id-fileinfo .id-fname{flex:1;font-weight:600;color:#33415e;word-break:break-all;font-size:13px}
.id-fileinfo .id-fsize{color:#728095;font-size:12px;white-space:nowrap}
.id-fileinfo .id-remove{cursor:pointer;color:#e53e3e;font-size:18px;line-height:1;padding:0 4px;border:none;background:none}
.id-fileinfo .id-remove:hover{color:#c53030}
.id-label{font-size:12px;font-weight:600;letter-spacing:.05em;color:#728095;text-transform:uppercase;margin-bottom:6px}
.id-output{width:100%;min-height:320px;padding:14px 16px;border:1px solid #d7dee9;border-radius:12px;font-size:14px;line-height:1.8;color:#1e293b;background:#fafbfd;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.id-output.loading{color:#94a3b8;font-style:italic}
.id-output .cursor{display:inline-block;width:2px;height:18px;background:#2563eb;vertical-align:-4px;animation:idblink 1s steps(2) infinite}
@keyframes idblink{0%,50%{opacity:1}51%,100%{opacity:0}}
.id-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.id-btn{padding:9px 22px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.id-btn.primary{background:#2563eb;color:#fff}
.id-btn.primary:hover{opacity:.88}
.id-btn.primary:disabled{opacity:.4;cursor:not-allowed}
.id-btn.ghost{background:#f0f5ff;color:#2563eb;border:1px solid #c7d2fe}
.id-btn.ghost:hover{background:#e0e7ff}
.id-btn:disabled{cursor:not-allowed;opacity:.4}
.id-status{margin-top:10px;font-size:13px;color:#2563eb;font-weight:600;display:none}
.id-status.err{color:#e53e3e}
.id-loading{display:none;margin-top:10px;color:#2563eb;font-size:13px}
.id-loading.show{display:block}
.id-loading .spinner{display:inline-block;width:14px;height:14px;border:2px solid #c7d2fe;border-top-color:#2563eb;border-radius:50%;animation:idspin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes idspin{to{transform:rotate(360deg)}}
.id-formats{margin-top:14px;font-size:12px;color:#728095}
@media(max-width:760px){.id-layout{grid-template-columns:1fr}}
body.dark .id-notice{background:#171d28;border-color:#303846;color:#aebad0}

body.dark .id-preview img{background:#171d28}

body.dark .id-textarea{background:#171d28;border-color:#303846;color:#e8eef8}
body.dark .id-output{background:#171d28;border-color:#303846;color:#e8eef8}
body.dark .id-output.loading{color:#64748b}
body.dark .id-btn.ghost{background:#1a2230;color:#7aa5f8;border-color:#303846}
body.dark .id-label{color:#aebad0}
body.dark .id-status{color:#7aa5f8}
body.dark .id-loading{color:#7aa5f8}
