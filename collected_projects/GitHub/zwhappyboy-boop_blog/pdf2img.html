scaleRange.oninput=()=>scaleVal.textContent=scaleRange.value+'x';

function accept(f){
  cancelled=false;curFile=f;renderedImages=[];
  pagesEl.innerHTML='';
  dlAllBtn.classList.remove('show');
  fname.textContent=f.name;
  fsize.textContent=fmtSize(f.size);
  fileInfo.classList.add('show');
  runBtn.classList.add('ready');
  setStatus('');
}

removeBtn.onclick=()=>{
  cancelled=true;curFile=null;renderedImages=[];
  fileInfo.classList.remove('show');
  runBtn.classList.remove('ready');
  fileInput.value='';
  pagesEl.innerHTML='';
  dlAllBtn.classList.remove('show');

  a.download=base+'_page'+img.page+'.'+img.format;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);

function dataURLtoBlob(dataURL){
  const [header,b64]=dataURL.split(',');
  const mime=header.match(/:(.*?);/)[1];
  const bin=atob(b64);
  const len=bin.length;
  const arr=new Uint8Array(len);
  for(let i=0;i<len;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
