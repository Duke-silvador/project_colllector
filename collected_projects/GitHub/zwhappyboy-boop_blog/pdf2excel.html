<script>
(function(){
const $=s=>document.querySelector(s);
const label=$('#peLabel'),fileInput=$('#peFile'),fileName=$('#peFileName'),runBtn=$('#peRun'),statusEl=$('#peStatus'),progress=$('#peProgress'),bar=$('#peBar'),pct=$('#pePct'),result=$('#peResult'),statsEl=$('#peStats'),previewEl=$('#pePreview'),dlBtn=$('#peDl');
function T(){return window.__tt?window.__tt():{}}
let curFile=null,outBlob=null,cancelled=false;

function setStatus(msg,err){if(!msg){statusEl.style.display='none';return}statusEl.style.display='block';statusEl.textContent=msg;statusEl.classList.toggle('err',!!err)}
function setProgress(p){bar.style.width=p+'%';pct.textContent=Math.round(p)+'%'}
function fmtSize(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}

const i18n={
  en:{notice:'PDF is processed entirely in your browser. Text is extracted automatically, table structure inferred by coordinates, and an xlsx file is generated.',loading:'Loading PDF...',extracting:'Extracting page {n}/{total}...',generating:'Generating Excel...',done:'Done: {n} page(s), {rows} row(s)',download:'Download Excel',failed:'Failed: ',noFile:'No file chosen',chooseFile:'Choose File',pageLabel:'Page',doneTitle:'Conversion Complete',unsupported:'PDF.js or XLSX library failed to load'},
  ja:{notice:'PDFはブラウザ内で完全に処理されます。テキストを自動抽出し、座標から表構造を推測してxlsxファイルを生成します。',loading:'PDF読み込み中...',extracting:'ページ {n}/{total} を抽出中...',generating:'Excel生成中...',done:'完了: {n}ページ, {rows}行',download:'Excelダウンロード',failed:'失敗: ',noFile:'ファイル未選択',chooseFile:'ファイルを選択',pageLabel:'ページ',doneTitle:'変換完了',unsupported:'PDF.jsまたはXLSXライブラリの読み込みに失敗'},
  ko:{notice:'PDF는 브라우저에서 완전히 처리됩니다. 텍스트를 자동 추출하고 좌표로 표 구조를 추론하여 xlsx 파일을 생성합니다.',loading:'PDF 로드 중...',extracting:'페이지 {n}/{total} 추출 중...',generating:'Excel 생성 중...',done:'완료: {n}페이지, {rows}행',download:'Excel 다운로드',failed:'실패: ',noFile:'파일 미선택',chooseFile:'파일 선택',pageLabel:'페이지',doneTitle:'변환 완료',unsupported:'PDF.js 또는 XLSX 라이브러리 로드 실패'},
  es:{notice:'El PDF se procesa completamente en su navegador. El texto se extrae automáticamente, la estructura de la tabla se infiere por coordenadas y se genera un archivo xlsx.',loading:'Cargando PDF...',extracting:'Extrayendo página {n}/{total}...',generating:'Generando Excel...',done:'Hecho: {n} página(s), {rows} fila(s)',download:'Descargar Excel',failed:'Error: ',noFile:'Ningún archivo seleccionado',chooseFile:'Elegir archivo',pageLabel:'Página',doneTitle:'Conversión Completada',unsupported:'PDF.js o librería XLSX no se cargaron'},
  fr:{notice:'Le PDF est traité entièrement dans votre navigateur. Le texte est extrait automatiquement, la structure du tableau est déduite des coordonnées et un fichier xlsx est généré.',loading:'Chargement du PDF...',extracting:'Extraction de la page {n}/{total}...',generating:'Génération d\'Excel...',done:'Terminé : {n} page(s), {rows} ligne(s)',download:'Télécharger Excel',failed:'Échec: ',noFile:'Aucun fichier sélectionné',chooseFile:'Choisir un fichier',pageLabel:'Page',doneTitle:'Conversion Terminée',unsupported:'PDF.js ou la bibliothèque XLSX n\'a pas pu être chargée'},
  de:{notice:'Das PDF wird vollständig in Ihrem Browser verarbeitet. Text wird automatisch extrahiert, die Tabellenstruktur aus Koordinaten abgeleitet und eine xlsx-Datei erstellt.',loading:'PDF wird geladen...',extracting:'Seite {n}/{total} wird extrahiert...',generating:'Excel wird erstellt...',done:'Fertig: {n} Seite(n), {rows} Zeile(n)',download:'Excel herunterladen',failed:'Fehlgeschlagen: ',noFile:'Keine Datei ausgewählt',chooseFile:'Datei wählen',pageLabel:'Seite',doneTitle:'Konvertierung abgeschlossen',unsupported:'PDF.js oder XLSX-Bibliothek konnte nicht geladen werden'},
  pt:{notice:'O PDF é processado inteiramente no seu navegador. O texto é extraído automaticamente, a estrutura da tabela é inferida por coordenadas e um arquivo xlsx é gerado.',loading:'Carregando PDF...',extracting:'Extraindo página {n}/{total}...',generating:'Gerando Excel...',done:'Concluído: {n} página(s), {rows} linha(s)',download:'Baixar Excel',failed:'Falha: ',noFile:'Nenhum arquivo selecionado',chooseFile:'Escolher arquivo',pageLabel:'Página',doneTitle:'Conversão Concluída',unsupported:'PDF.js ou biblioteca XLSX não carregada'},
  'zh-CN':{}
};

function getLang(){return window.__lang||document.documentElement.lang||'zh-CN'}
function tr(k,fb){
  const lang=getLang();
  const t=i18n[lang]||i18n.en||{};
  return t[k]||fb;
}

function applyI18n(){
  const t=T();
  const lang=getLang();
  $('#peNotice').textContent=tr('notice','PDF完全在您的浏览器本地处理，不会上传到任何服务器。自动提取文本内容，按行列坐标推断表格结构，生成 xlsx 文件。');
  $('#peDoneTitle').textContent=tr('doneTitle','转换完成');
  dlBtn.textContent=tr('download','下载 Excel');
}

label.onclick=()=>fileInput.click();
fileInput.onchange=()=>{
  const f=fileInput.files[0];
  if(f){
    curFile=f;
    fileName.textContent=f.name;
    runBtn.classList.add('ready');
    result.classList.remove('show');
    setStatus('');
  }
};

runBtn.onclick=async()=>{
  if(!curFile)return;
  if(!window.pdfjsLib){setStatus(tr('unsupported','PDF.js failed to load'),true);return}
  if(!window.XLSX){setStatus(tr('unsupported','XLSX lib failed'),true);return}
  cancelled=false;outBlob=null;
  result.classList.remove('show');
  runBtn.classList.remove('ready');
  progress.classList.add('show');
  setProgress(3);
  setStatus(tr('loading','Loading PDF...'));
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const buf=await curFile.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf,cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'}).promise;
    const sheets=[];
    for(let i=1;i<=pdf.numPages;i++){
      if(cancelled)return;
      setProgress(Math.round(3+(i-1)/pdf.numPages*80));
      setStatus((tr('extracting','Extracting page {n}/{total}...')).replace('{n}',i).replace('{total}',pdf.numPages));
      const page=await pdf.getPage(i);
      const items=(await page.getTextContent()).items;
      if(!items.length){sheets.push({name:'Page'+i,data:[]});continue}
      const rowMap=new Map();
      for(const item of items){
        const y=Math.round(item.transform[5]);
        const x=Math.round(item.transform[4]);
        if(!rowMap.has(y))rowMap.set(y,new Map());
        rowMap.get(y).set(x,item.str.trim());
      }
      const ys=[...rowMap.keys()].sort((a,b)=>b-a);
      let maxCols=0;
      const rows=[];
      for(const y of ys){
        const xs=[...rowMap.get(y).keys()].sort((a,b)=>a-b);
        const row=[];
        let prevX=null;
        for(const x of xs){
          const val=rowMap.get(y).get(x);
          if(prevX!==null&&x-prevX>80)row.push('');
          row.push(val);
          prevX=x;
        }
        if(row.length>maxCols)maxCols=row.length;
        rows.push(row);
      }
      for(const row of rows)while(row.length<maxCols)row.push('');
      sheets.push({name:'Page'+i,data:rows});
    }
    setProgress(88);
    setStatus(tr('generating','Generating Excel...'));
    const wb=XLSX.utils.book_new();
    for(const s of sheets){
      const ws=XLSX.utils.aoa_to_sheet(s.data);
      XLSX.utils.book_append_sheet(wb,ws,s.name);
    }
    const outBuf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    outBlob=new Blob([outBuf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    setProgress(100);
    setTimeout(()=>{progress.classList.remove('show');bar.style.width='0'},600);
    runBtn.classList.add('ready');
    setStatus('');
    const totalRows=sheets.reduce((a,s)=>a+s.data.length,0);
    statsEl.innerHTML='<b>'+(tr('done','Done: {n} page(s), {rows} row(s)')).replace('{n}',pdf.numPages).replace('{rows}',totalRows)+'</b>';
    if(sheets.length>0&&sheets[0].data.length>0){
      const previewRows=sheets[0].data.slice(0,10);
      let html='<table>';
      previewRows.forEach((row,idx)=>{
        html+='<tr>';
        if(idx===0)html+='<th>'+tr('pageLabel','Page')+'1</th>';
        else html+='<td>'+(idx+1)+'</td>';
        row.forEach(cell=>{html+='<td>'+cell.replace(/</g,'&lt;')+'</td>'});
        html+='</tr>';
      });
      html+='</table>';
      previewEl.innerHTML=html;
    }
    result.classList.add('show');
  }catch(e){
    progress.classList.remove('show');bar.style.width='0%';
    runBtn.classList.add('ready');
    setStatus(tr('failed','Failed: ')+(e&&e.message||e),true);
  }
};

dlBtn.onclick=()=>{
  if(!outBlob)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(outBlob);
  a.download=curFile.name.replace(/\.pdf$/i,'')+'.xlsx';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
};

const waitLang=setInterval(()=>{
  if(window.__tt){clearInterval(waitLang);applyI18n();
    const langSel=document.getElementById('lang');
    if(langSel)langSel.addEventListener('change',()=>setTimeout(applyI18n,100));
  }
},100);
setTimeout(()=>clearInterval(waitLang),5000);
})();
</script></body></html>
