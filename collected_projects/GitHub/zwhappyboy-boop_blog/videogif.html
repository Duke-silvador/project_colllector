    previewImg.src=URL.createObjectURL(out.blob);
    statsEl.appendChild(previewImg);
    result.classList.add('show');
  }catch(e){
    progress.classList.remove('show');bar.style.width='0%';
    runBtn.classList.add('ready');
    setStatus(tr('failed','Failed: ')+(e&&e.message||e),true);
  }
};

/* ---- core: make GIF via seek-based frame extraction ---- */
async function makeGif(file){
  const fps=parseInt(fpsSel.value);
  const outW=Math.max(2,parseInt(widthInput.value)||480);
  const quality=parseInt(qualitySel.value);
  const startTime=parseFloat(startRange.value);
  const endTime=Math.min(parseFloat(endRange.value),videoDuration||parseFloat(endRange.value));
  if(endTime<=startTime)throw new Error('End time must be greater than start time');

  // load video for seeking (must attach to DOM)
  const vid=document.createElement('video');
  vid.muted=true;vid.playsInline=true;vid.preload='auto';
  vid.style.cssText='position:fixed;top:-9999px;left:-9999px;width:2px;height:2px;opacity:0;pointer-events:none';
  document.body.appendChild(vid);
  const url=URL.createObjectURL(file);
  vid.src=url;
  await new Promise((res,rej)=>{
    vid.onloadedmetadata=res;
    vid.onerror=()=>rej(new Error('video load error'));
    setTimeout(()=>rej(new Error('video load timeout')),15000);
  });
  if(vid.readyState<2){
    await new Promise(res=>{vid.addEventListener('canplay',res,{once:true});setTimeout(res,3000)});
  }

  const srcW=vid.videoWidth||640,srcH=vid.videoHeight||360;
  const scale=Math.min(1,outW/srcW);
  let w=Math.max(2,Math.round(srcW*scale)),h=Math.max(2,Math.round(srcH*scale));

  const totalFrames=Math.max(1,Math.round((endTime-startTime)*fps));
  const frameDur=Math.round(1000/fps); // ms

  // gifenc GIF encoder (dynamic ESM import)
  let gifenc;
  try{
    gifenc=await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.min.js');
  }catch(e){
    document.body.removeChild(vid);
    URL.revokeObjectURL(url);
    throw new Error('GIF encoder library failed to load. Please check your network connection and retry.');
  }
  const { GIFEncoder, quantize, applyPalette } = gifenc;
  const gif = GIFEncoder();

  const canvas=document.createElement('canvas');
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{alpha:false});
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  function seekTo(ts){
    return new Promise((resolve,reject)=>{
      let done=false;
      const ok=()=>{if(!done){done=true;cleanup();resolve()}};
      const fail=e=>{if(!done){done=true;cleanup();reject(e)}};
      const cleanup=()=>{vid.removeEventListener('seeked',onSeeked);vid.removeEventListener('error',onErr)};
      const onSeeked=()=>{
        if('requestVideoFrameCallback' in vid){
          vid.requestVideoFrameCallback(()=>{if(!done)ok()});
          setTimeout(ok,300);
        }else{setTimeout(ok,50)}
      };
      const onErr=()=>fail(new Error('seek error'));
      vid.addEventListener('seeked',onSeeked);
      vid.addEventListener('error',onErr);
      try{
        if(Math.abs(vid.currentTime-ts)<0.001){ok();return}
        vid.currentTime=ts;
      }catch(e){fail(e)}
      setTimeout(()=>fail(new Error('seek timeout')),15000);
    });
  }

  async function robustSeekTo(ts){
    try{await seekTo(ts)}catch(e){
      if(e.message==='seek timeout'||e.message==='seek error'){
        await sleep(200);
        await seekTo(Math.max(0,ts-0.1));
        if(Math.abs(vid.currentTime-ts)>0.05)await seekTo(ts);
      }else throw e;
    }
  }

  // palette for quantization (gifenc built-in)
  let palette=null;
  for(let i=0;i<totalFrames;i++){
    if(cancelled)throw new Error('cancelled');
    const ts=startTime+i/fps;
    await robustSeekTo(ts);
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,w,h);
    ctx.drawImage(vid,0,0,w,h);
    const imageData=ctx.getImageData(0,0,w,h);
    const rgba=new Uint8Array(imageData.data.buffer);
    if(!palette){
      // First frame: quantize colors to build global palette
      palette=quantize(rgba,256);
    }
    // Apply palette to get indexed bitmap, then write frame
    const index=applyPalette(rgba,palette);
    gif.writeFrame(index,w,h,{palette,delay:frameDur,dispose:-1});
    const prog=3+Math.round((i+1)/totalFrames*90);
    setProgress(prog);
    if(i%5===0)setStatus((tr('extracting','Extracting frame {n}/{total}...')).replace('{n}',i+1).replace('{total}',totalFrames));
    await sleep(0);
  }

  gif.finish();
  URL.revokeObjectURL(url);
  document.body.removeChild(vid);

  const bytes=gif.bytes();
  if(!bytes||bytes.length===0)throw new Error('GIF output is empty');
  const blob=new Blob([bytes],{type:'image/gif'});
  const name=file.name.replace(/\.[^.]+$/,'')+'.gif';
  return{blob,name,frames:totalFrames};
}

dlBtn.onclick=()=>{
  if(!outBlob)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(outBlob);
  a.download=curFile?curFile.name.replace(/\.[^.]+$/,'')+'.gif':'output.gif';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
};
