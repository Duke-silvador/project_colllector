#pa-app{max-width:1100px;margin:0 auto;padding:20px}
.pa-notice{background:#f0f5ff;border:1px solid #d7dee9;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#42506b;line-height:1.7}

.pa-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.pa-toolbar .pa-style-btn{padding:7px 14px;border:1px solid #c5cdd9;border-radius:8px;font-size:13px;color:#33415e;background:#fafbfd;cursor:pointer;transition:border-color .15s}

.pa-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pa-col{min-width:0}
.pa-label{font-size:12px;font-weight:600;letter-spacing:.05em;color:#728095;text-transform:uppercase;margin-bottom:6px}

.pa-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pa-btn{padding:9px 22px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.pa-btn.primary{background:#2563eb;color:#fff}
.pa-btn.primary:hover{opacity:.88}
.pa-btn.primary:disabled{opacity:.4;cursor:not-allowed}
.pa-btn.ghost{background:#f0f5ff;color:#2563eb;border:1px solid #c7d2fe}
.pa-btn.ghost:hover{background:#e0e7ff}
.pa-btn:disabled{cursor:not-allowed;opacity:.4}
.pa-status{margin-top:10px;font-size:13px;color:#2563eb;font-weight:600;display:none}
.pa-status.err{color:#e53e3e}
.pa-loading{display:none;margin-top:10px;color:#2563eb;font-size:13px}
.pa-loading.show{display:block}
.pa-loading .spinner{display:inline-block;width:14px;height:14px;border:2px solid #c7d2fe;border-top-color:#2563eb;border-radius:50%;animation:paspin .8s linear infinite;vertical-align:-2px;margin-right:6px}

.pa-charcount{font-size:12px;color:#94a3b8;margin-top:4px;text-align:right}
