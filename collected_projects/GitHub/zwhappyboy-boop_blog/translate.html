<title>AI 专业翻译 - 万能工具箱</title><link rel="stylesheet" href="style.css">
<style>
#tr-app{max-width:1100px;margin:0 auto;padding:20px}
.tr-notice{background:#f0f5ff;border:1px solid #d7dee9;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#42506b;line-height:1.7}
.tr-notice b{color:#b45309}
.tr-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.tr-toolbar select,.tr-toolbar .tr-style-btn{padding:7px 14px;border:1px solid #c5cdd9;border-radius:8px;font-size:13px;color:#33415e;background:#fafbfd;cursor:pointer;transition:border-color .15s}
.tr-toolbar select:hover,.tr-style-btn:hover{border-color:#2563eb}
.tr-toolbar .tr-style-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
.tr-arrow{font-size:18px;color:#94a3b8}
.tr-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tr-col{min-width:0}
.tr-label{font-size:12px;font-weight:600;letter-spacing:.05em;color:#728095;text-transform:uppercase;margin-bottom:6px}
.tr-textarea{width:100%;min-height:320px;padding:14px 16px;border:1px solid #d7dee9;border-radius:12px;font-size:14px;line-height:1.8;color:#1e293b;resize:vertical;background:#fafbfd;transition:border-color .15s;font-family:inherit}
.tr-textarea:focus{outline:none;border-color:#2563eb;background:#fff}
.tr-output{width:100%;min-height:320px;padding:14px 16px;border:1px solid #d7dee9;border-radius:12px;font-size:14px;line-height:1.8;color:#1e293b;background:#fafbfd;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.tr-output.loading{color:#94a3b8;font-style:italic}
.tr-output .cursor{display:inline-block;width:2px;height:18px;background:#2563eb;vertical-align:-4px;animation:trblink 1s steps(2) infinite}
@keyframes trblink{0%,50%{opacity:1}51%,100%{opacity:0}}
.tr-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tr-btn{padding:9px 22px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.tr-btn.primary{background:#2563eb;color:#fff}
.tr-btn.primary:hover{opacity:.88}
.tr-btn.primary:disabled{opacity:.4;cursor:not-allowed}
.tr-btn.ghost{background:#f0f5ff;color:#2563eb;border:1px solid #c7d2fe}
.tr-btn.ghost:hover{background:#e0e7ff}
.tr-btn:disabled{cursor:not-allowed;opacity:.4}
.tr-glossary{margin-top:18px;border:1px solid #d7dee9;border-radius:12px;overflow:hidden}
.tr-glossary-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#f0f5ff;cursor:pointer;user-select:none}
.tr-glossary-head .tr-gh-title{font-size:13px;font-weight:600;color:#33415e;display:flex;align-items:center;gap:8px}
.tr-glossary-head .tr-gh-count{font-size:12px;color:#728095}
.tr-glossary-head .tr-gh-arrow{font-size:12px;color:#728095;transition:transform .2s}
.tr-glossary.open .tr-gh-arrow{transform:rotate(180deg)}
.tr-glossary-body{display:none;padding:14px 16px;background:#fafbfd}
.tr-glossary.open .tr-glossary-body{display:block}
.tr-glossary-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.tr-glossary-row input{flex:1;padding:7px 12px;border:1px solid #d7dee9;border-radius:8px;font-size:13px;color:#33415e;background:#fff}
.tr-glossary-row input:focus{outline:none;border-color:#2563eb}
.tr-glossary-row .tr-glossary-arrow{color:#94a3b8;font-size:14px;flex-shrink:0}
.tr-glossary-row .tr-glossary-del{background:none;border:none;color:#e53e3e;cursor:pointer;font-size:18px;padding:4px 8px;flex-shrink:0;border-radius:6px;transition:background .15s}
.tr-glossary-row .tr-glossary-del:hover{background:#fee2e2}
.tr-glossary-add{padding:7px 16px;border:1px dashed #c5cdd9;border-radius:8px;font-size:13px;color:#728095;cursor:pointer;transition:border-color .15s,background .15s}
.tr-glossary-add:hover{border-color:#2563eb;background:#f0f5ff}
.tr-status{margin-top:10px;font-size:13px;color:#2563eb;font-weight:600;display:none}
.tr-status.err{color:#e53e3e}
.tr-loading{display:none;margin-top:10px;color:#2563eb;font-size:13px}
.tr-loading.show{display:block}
.tr-loading .spinner{display:inline-block;width:14px;height:14px;border:2px solid #c7d2fe;border-top-color:#2563eb;border-radius:50%;animation:trspin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes trspin{to{transform:rotate(360deg)}}
.tr-compare{margin-top:18px}
.tr-compare-title{font-size:13px;font-weight:600;color:#33415e;margin-bottom:8px}
.tr-compare-table{width:100%;border-collapse:collapse;border:1px solid #d7dee9;border-radius:10px;overflow:hidden}
.tr-compare-table th{background:#f0f5ff;padding:8px 14px;font-size:12px;font-weight:600;color:#728095;text-align:left;border-bottom:1px solid #d7dee9}
.tr-compare-table td{padding:10px 14px;font-size:14px;line-height:1.7;color:#33415e;border-bottom:1px solid #ebf0f5;vertical-align:top;width:50%}
.tr-compare-table tr:last-child td{border-bottom:none}
.tr-compare-empty{color:#a5b0c4;font-size:13px;text-align:center;padding:20px}
.tr-charcount{font-size:12px;color:#94a3b8;margin-top:4px;text-align:right}
body.dark .tr-notice{background:#171d28;border-color:#303846;color:#aebad0}
body.dark .tr-toolbar select,body.dark .tr-toolbar .tr-style-btn{background:#171d28;border-color:#303846;color:#c7d2e4}
body.dark .tr-toolbar .tr-style-btn.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
body.dark .tr-textarea{background:#171d28;border-color:#303846;color:#e8eef8}
body.dark .tr-textarea:focus{border-color:#3b82f6;background:#1a2230}
body.dark .tr-output{background:#171d28;border-color:#303846;color:#e8eef8}
body.dark .tr-output.loading{color:#64748b}
body.dark .tr-btn.ghost{background:#1a2230;color:#7aa5f8;border-color:#303846}
body.dark .tr-glossary{border-color:#303846}
body.dark .tr-glossary-head{background:#171d28}
body.dark .tr-glossary-head .tr-gh-title{color:#c7d2e4}
body.dark .tr-glossary-body{background:#171d28}
body.dark .tr-glossary-row input{background:#1a2230;border-color:#303846;color:#e8eef8}
body.dark .tr-glossary-add{border-color:#303846;color:#aebad0}
body.dark .tr-glossary-add:hover{border-color:#3b82f6;background:#1a2230}
body.dark .tr-compare-table th{background:#171d28;border-color:#303846;color:#aebad0}
body.dark .tr-compare-table td{border-color:#1e2838;color:#c7d2e4}
body.dark .tr-status{color:#7aa5f8}
body.dark .tr-status.err{color:#f8b4b4}
body.dark .tr-loading{color:#7aa5f8}
body.dark .tr-label{color:#aebad0}

<div id="tr-app">

      <option value="ko">한국어</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>

    <span style="flex:1"></span>
    <button class="tr-style-btn active" data-style="formal" data-t="trStyleFormal">正式</button>

  <div class="tr-layout">
    <div class="tr-col">
      <div class="tr-label" data-t="trSourceLabel">原文</div>

    </div>
    <div class="tr-col">
      <div class="tr-label" data-t="trResultLabel">译文</div>

      <div class="tr-loading" id="trLoading"><span class="spinner"></span><span data-t="trTranslating">AI 正在翻译中…</span></div>
    </div>
  </div>

  <div class="tr-actions">
    <button class="tr-btn primary" id="trRun" data-t="trTranslate">开始翻译</button>

    <button class="tr-btn ghost" id="trClear" data-t="trClear">清空</button>

  </div>
  <div class="tr-status" id="trStatus"></div>

  <div class="tr-glossary" id="trGlossary">
    <div class="tr-glossary-head" id="trGlossaryHead">
      <span class="tr-gh-title">📋 <span data-t="trGlossaryTitle">术语表</span> <span class="tr-gh-count" id="trGlossaryCount">(0)</span></span>
      <span class="tr-gh-arrow">▼</span>
    </div>
    <div class="tr-glossary-body" id="trGlossaryBody">
      <div id="trGlossaryRows"></div>
      <button class="tr-glossary-add" id="trGlossaryAdd" data-t="trAddTerm">+ 添加术语</button>
    </div>
  </div>

  <div class="tr-compare" id="trCompare" style="display:none">
    <div class="tr-compare-title" data-t="trCompareTitle">逐句对照</div>
    <table class="tr-compare-table">
      <thead><tr><th data-t="trSourceLabel">原文</th><th data-t="trResultLabel">译文</th></tr></thead>
      <tbody id="trCompareBody"></tbody>
    </table>
  </div>
