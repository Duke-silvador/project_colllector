<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PERRI · 样式探索</title>
    <link rel="stylesheet" href="style.css?v=09r4" />
  </head>
  <body>
    <div class="workspace">
      <aside class="sidebar">
        <a
          class="brand"
          href="#conversation"
          data-phase-type="identity"
          aria-label="PERRI"
          ><span class="phase-source">PERRI</span></a
        >
        <nav aria-label="主导航" id="navigation"></nav>
        <div class="side-bottom">
          <span class="muted">界面样式探索 / 09</span>
        </div>
      </aside>
      <div class="desk">
        <header class="topbar">
          <div class="top-actions">
            <div class="preview-controls">
              <button
                class="text-button"
                data-action="theme-toggle"
                aria-pressed="false"
              >
                深色模式</button
              ><button
                class="text-button"
                data-action="surface-toggle"
                aria-pressed="true"
              >
                模拟动效：开
              </button>
            </div>
            <button
              class="icon-button"
              data-action="search"
              aria-label="搜索样式稿"
              title="搜索样式稿 · ⌘ K"
            ></button
            ><button
              class="icon-button"
              data-action="notifications"
              aria-label="通知"
              title="通知"
            >
              <span class="notification-dot"></span>
            </button>
          </div>
        </header>
        <main id="main"></main>
        <footer class="statusbar">
          <span><i></i>本地样式预览 · 未连接后端</span
          ><span>样式预览 <b> / </b> v0.9</span>
        </footer>
      </div>
      <aside id="activity-rail" aria-label="当前活动" hidden>
        <div class="activity-inner">
          <header class="activity-header">
            <button
              id="activity-toggle"
              class="icon-button"
              data-action="activity-toggle"
              aria-controls="activity-content"
              aria-expanded="true"
              aria-label="收起活动栏"
            ></button>
          </header>
          <div id="activity-content"></div>
        </div>
      </aside>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button class="icon-button" data-action="close" aria-label="关闭">
          ×
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="signal-motion.js?v=09r4"></script>
    <script src="prototype.js?v=09r4"></script>
  </body>
</html>
