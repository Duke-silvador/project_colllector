<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps Studio</title>
  <style>
    :root { --bg: #fdf8f0; --fg: #222; --card: #fff; --accent: #ff5e5b; --muted: #777; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16151a; --fg: #eee; --card: #222128; --accent: #ff7b78; --muted: #999; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg);
           font-family: system-ui, sans-serif; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 2.5rem; margin: 0 0 .25rem; }
    p.tag { color: var(--muted); margin: 0 0 2rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    a.card { display: block; padding: 1.25rem; border-radius: 14px; background: var(--card);
             color: inherit; text-decoration: none; border: 2px solid transparent;
             transition: transform .15s, border-color .15s; }
    a.card:hover { transform: rotate(-1deg) scale(1.02); border-color: var(--accent); }
    .emoji { font-size: 2rem; }
    .card h2 { font-size: 1.1rem; margin: .5rem 0 .25rem; }
    .card p { margin: 0; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>🧪 Apps Studio</h1>
    <p class="tag">Random, quirky, and probably unnecessary apps.</p>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    // Add new apps here.
    const APPS = [
      { name: "Excuse Generator", path: "apps/excuse-generator/", emoji: "🙈",
        blurb: "A fresh, highly specific excuse for whatever you didn't do." },
      { name: "Tao Reader", path: "apps/tao-reader/", emoji: "☯️",
        blurb: "Chapter-by-chapter EPUB reader with random verses, French translation and read-aloud." },
      { name: "Little Pages", path: "apps/little-pages/", emoji: "📖",
        blurb: "A reader for your own books that helps you build a daily reading habit." },
      { name: "My I Ching", path: "apps/i-ching-book/", emoji: "䷀",
        blurb: "Master the 64 hexagrams by writing your own Book of Changes, one reading at a time." },
      { name: "Daily Way", path: "apps/daily-way/", emoji: "◯",
        blurb: "Twenty minutes a day with the Tao Te Ching, I Ching, Golden Flower and Chuang Tzu, built on proven learning methods." },
      { name: "Commonplace", path: "apps/commonplace/", emoji: "❝",
        blurb: "Read your own books, quote passages with tags and notes, and jump back to any quote's exact page." },
      { name: "Book of Changes", path: "apps/book-of-changes/", emoji: "䷾",
        blurb: "The I Ching in plain modern language: cast with yarrow stalks, or study any of the 64 hexagrams." },
      { name: "Noticing", path: "apps/noticing/", emoji: "👁️",
        blurb: "Two minutes a day to see more: a daily mission, look-and-recall drills, and a journal that checks your deductions." },
      { name: "Ashes and Gold", path: "apps/ashes-and-gold/", emoji: "🗝️",
        blurb: "A wordless story game about a man's journey from boyhood to elderhood, told through small interactions." },
      { name: "Living Window", path: "apps/living-window/", emoji: "🪟",
        blurb: "A quiet window that follows your real day and weather, with a soft generated soundscape." },
      { name: "Song of Songs", path: "apps/song-of-songs/", emoji: "🌺",
        blurb: "The Song of Songs in a fresh modern translation, with a full commentary: the Hebrew, how it has been read, and what it asks of you." },
      { name: "Woodshed", path: "apps/woodshed/", emoji: "🎸",
        blurb: "A practice recorder for guitar and voice: takes per song, level meter, count-in, lyrics and chords, tuner, and slow listening." },
    ];

    const grid = document.getElementById("grid");
    for (const app of APPS) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = app.path;
      a.innerHTML = `<div class="emoji"></div><h2></h2><p></p>`;
      a.querySelector(".emoji").textContent = app.emoji;
      a.querySelector("h2").textContent = app.name;
      a.querySelector("p").textContent = app.blurb;
      grid.appendChild(a);
    }
  </script>
</body>
</html>
